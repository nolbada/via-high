<title>고1 미니모의고사 17회 07–12번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:0}
#app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
#app>.wrap{width:100%}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}
.ko{color:var(--sub);font-size:14px;margin-left:6px}
.cell.bad{background:var(--badbg);border-color:var(--bad)}
.cell.bad .tag{background:var(--bad)}
.locked .cell{pointer-events:none}
.bar{position:sticky;margin-top:auto;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.done .opt{pointer-events:none}
.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}
.hcard .chip{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--sub)}
.hcard .chip.ok{background:var(--goodbg);color:var(--good)}
.hcard .chip.warn{background:var(--badbg);color:var(--bad)}
.hcard[disabled]{opacity:.55}
details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.th .hd{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:6px}
.th ol{list-style:none;margin:0;padding:0;counter-reset:n}
.th li{counter-increment:n;position:relative;padding:7px 0 7px 30px;font-size:15px;line-height:1.7;border-top:1px dashed #cfdcf0}
.th li:first-child{border-top:0}
.th li:before{content:counter(n);position:absolute;left:0;top:9px;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;text-align:center;line-height:21px}
.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.th .sub{margin:3px 0 0;color:#444;font-size:14.5px;line-height:1.7}
.sc .lay.sum{border-left:4px solid #2e7d32;background:#f1f8f1}
/* ---- 새 직독직해·해설 화면 ---- */
.sc{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden;background:var(--bg)}
.sc-h{padding:11px 14px 10px;background:#eef2f8;border-bottom:1px solid var(--line)}
.sc-h .no2{display:inline-block;min-width:26px;height:26px;line-height:26px;border-radius:13px;background:var(--accent);color:#fff;font-weight:800;font-size:13px;text-align:center;padding:0 7px;margin-right:8px}
.sc-h .at{font-size:13px;color:var(--sub)}
.sc-h .tt{display:block;margin-top:7px;font-size:15.5px;font-weight:800;color:var(--accent);line-height:1.45}
.sc-b{padding:10px 12px 12px}
.sc .ch{margin-bottom:6px}
.sc .ce{font-size:17px}

.nts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.nt{font-size:13.5px;line-height:1.5;background:#fbf6ee;border:1px solid #f0e2cd;border-radius:8px;padding:5px 9px;color:#4a3a22}

.sc .lay{border-radius:10px}
.sc .lay.nat{border-left:4px solid var(--accent);background:#f7f9fc}

.sc .lb{margin-bottom:4px}
.qc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}
.qchip small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-bottom:1px}
.qchip.o{border-color:var(--good);background:var(--goodbg)}
.qchip.x{border-color:var(--bad);background:var(--badbg)}
.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.trs{list-style:none;margin:0;padding:0;background:var(--soft);border-radius:10px;padding:8px 12px}

.wds{display:flex;flex-wrap:wrap;gap:6px}

.wds b{margin-right:5px}
.toq{display:block;width:100%;margin-top:14px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}
details.sub2{margin:12px 0 0}
details.sub2>summary{list-style:none;cursor:pointer;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px;padding:6px 0}

.cr{color:#A3102E;font-weight:700}
.sc .lay.core{border-left:4px solid #2e7d32;background:#f1f8f1}

.rst{margin-top:8px;background:#fff8e1;border:1px solid #efe3b8;border-left:4px solid #d9a21b;border-radius:8px;padding:8px 10px;font-size:15px;line-height:1.7;word-break:keep-all}

(function(W){

  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}

  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);

    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});

    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){

    var d=document.createElement('div');

    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';

    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');
    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';
      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();
  }
  function DEL(w,src){var k=String(w||'').toLowerCase().trim(),hit=false;
    if(!busy){var Q=jq(QK).map(function(b){return b.filter(function(it){var m=String(it.w||'').toLowerCase().trim()===k&&it.src===src;if(m)hit=true;return!m})}).filter(function(b){return b.length});if(hit){s(QK,JSON.stringify(Q));return Promise.resolve({ok:true,removed:true})}}
    var n=name();if(!n)return Promise.resolve(null);
    function go(){return post({act:'del',name:n,pin:PIN,w:w,src:src})}

  },del:DEL,gate:gate,flush:flush,name:name};

 tent, another purifies<sup>2</sup> the water, / and so on, each in accordance with<sup>3</sup> his or her abilities.", "notes": [["1", "set up", "설치하다"], ["2", "purify", "정화하다"], ["3", "in accordance with", "~에 따라"]], "lit": "대신, 한 사람은 저녁을 요리하고, 다른 사람은 텐트를 치고, 또 다른 사람은 물을 정화한다 / 그리고 기타 등등, 각자 자신의 능력에 따라", "nat": "대신, 한 사람은 저녁을 요리하고, 다른 사람은 텐트를 치고, 또 다른 사람은 물을 정화하는 등, 각자 자신의 능력에 따라 역할을 맡는다.", "ana": "one person, another, another가 <b>병렬</b> 구조를 이루고, each in accordance with는 '각자 ~에 따라'라는 뜻의 삽입구이다.", "pe": "\u0001Rather\u0002, one person cooks dinner, another sets up<sup>1</sup> the tent, another purifies<sup>2</sup> the water, / \u0001and so on\u0002, \u0001each in accordance with<sup>3</sup> his or her abilities\u0002.", "pk": "\u0001대신\u0002, 한 사람은 저녁을 요리하고, 다른 사람은 텐트를 치고, 또 다른 사람은 물을 정화한다 / \u0001그리고 기타 등등\u0002, \u0001각자 자신의 능력에 따라\u0002", "core": "한 사람은 저녁을 요리하고, 다른 사람은 텐트를 치고, 또 다른 사람은 물을 정화한다.", "tags": ["(Rather) = 부사: 문장 전체를 꾸밈. 세 절이 <b>병렬</b>: one person cooks dinner / another sets up the tent / another purifies the water", "(and so on) = 삽입 어구: 등등. (each in ~) = 독립분사구문(being 생략): 앞 절 전체를 꾸밈. in accordance with = ~에 따라"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이 <b>세 번 병렬</b>된 문장이다. 두 번째, 세 번째에서 one person을 반복하지 않고 another만 써서 길어 보인다."}, {"t": "뼈대부터 찾는다. 세 덩어리가 콤마로 이어진다.", "sub": ["1: one person cooks dinner (한 사람은 저녁을 요리한다, cook 요리하다)", "2: another (person) sets up the tent (다른 사람은 텐트를 친다, set up 설치하다)", "3: another (person) purifies the water (또 다른 사람은 물을 정화한다, purify 정화하다)"]}, {"t": "세 덩어리는 모두 <b>S+V+O(3형식)</b>이고 문장 맨 앞의 <b>Rather</b>(대신, 오히려)는 앞 내용과 대비하는 접속 부사이다."}, {"t": "<b>and so on</b>은 '기타 등등'이라는 뜻의 덧붙임이다."}, {"t": "<b>each in accordance with his or her abilities</b>는 동사 없이 덧붙은 <b>수식어구</b>이다. '각자 자신의 능력에 따라'라는 뜻이다.", "sub": ["each 각자, in accordance with ~에 따라, ability 능력", "이 부분은 뼈대가 아니라 전체 상황을 덧붙여 설명한다"]}], "sum": "한 명은 요리, 한 명은 텐트, 한 명은 물 정화, 각자 능력대로"}, {"i": "07", "q": "11", "s": "1", "title": "S+V(1형식) + 대시 동격 + 과거분사 후치", "eng": "Since the turn 이 관계절 때문에 문장이 길어졌다."}], "sum": "우리는 암호의 표현일 뿐 아니라 다양한 상호작용의 산물"}], "qs": [{"q": "07", "type": "빈칸", "src": "2017년 6월 33번", "ans": "②", "tr": [["1", "물을 구하러 하루에 5킬로미터를 걸으며 해바라기, 장미, 커피 같은 환금 작물 밭을 지날 때, 시골의 아프리카 사람들은 무슨 생각을 할까?"], ["2", "일부 아프리카 국가들은 자국민을 먹이거나 안전한 식수를 제공하는 것조차 어려워하는데도, 귀중한 물이 유럽 시장에 내다 팔 수출 작물을 생산하는 데 쓰이고 있다."], ["3", "하지만 아프리카 농부들은 그 작물들이 자신들에게 몇 안 되는 소득원 중 하나이기 때문에 그것을 재배하지 않을 수 없다."], ["4", "어떤 의미에서 아프리카 국가들은 자신들이 재배하는 바로 그 작물을 통해 자신들의 물을 수출하고 있는 셈이다."], ["5", "그들에게는 물이 필요하지만, 동시에 자신들이 생산하는 작물을 통해 물을 수출해야만 하는 처지이기도 하다."], ["6", "환경 압력 단체들은 아프리카산 커피나 꽃을 사는 유럽 소비자들이 아프리카에서 물 부족을 악화시키고 있다고 주장한다."]], "evh": "2·4번 문장", "ev": [{"en": true, "h": "Some African countries find it difficult to feed their own people or provide safe drinking water, yet precious water is used to produce export crops for European markets. / In a sense, African countries are exporting their water in the very crops they grow."}, {"en": false, "h": "식수조차 부족한 아프리카에서 귀중한 물이 수출 작물 생산에 쓰인다는 2번과, 이를 '물을 수출하는 셈'이라고 정리하는 4번을 종합하면, 유럽 소비자들이 아프리카의 물 부족을 악화시키고 있다는 ②가 빈칸에 가장 적절하다."}], "opts": [{"n": "①", "t": "lowering the prices of crops", "a": false, "x": true, "trap": false, "e": "작물 가격 하락에 관한 내용은 없다."}, {"n": "②", "t": "making water shortages worse", "a": true, "x": false, "trap": false, "e": "귀중한 물이 수출 작물에 쓰이며 물 부족을 심화시킨다는 2·4번의 내용과 정확히 일치한다."}, {"n": "③", "t": "making farmers’ incomes lower", "a": false, "x": true, "trap": true, "e": "오히려 작물은 농부들의 몇 안 되는 소득원이라고 했으므로 정반대다."}, {"n": "④", "t": "producing goods with more profit", "a": false, "x": true, "trap": false, "e": "이윤 증대에 관한 내용이 아니다."}, {"n": "⑤", "t": "criticizing the unfair trade of water", "a": false, "x": true, "trap": false, "e": "불공정 거래를 비판하는 것이 아니라 물 부족 자체를 악화시키는 행위를 지적하는 것이다."}], "w": [["rural", "시골의"], ["cash crop", "환금 작물"], ["feed", "먹여 살리다"], ["safe drinking water", "안전한 식수"], ["precious", "귀중한"], ["export crop", "수출 작물"], ["cannot help but", "~하지 않을 수 없다"], ["income", "소득"], ["in a sense", "어떤 의미에서"], ["environmental pr function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];

      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });

  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;

}
function advance(){

이 합쳐진 결과예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">making farmers’ incomes lower 농부들의 소득을 낮추는 것</span><span class=\"why\">3번에서 그 작물은 농부들의 몇 안 되는 income(소득)원이라고 했어요. 사 주면 소득이 오히려 생기니 방향이 반대예요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">lowering the prices of crops 작물 가격을 낮추는 것</span><span class=\"why\">작물 가격 이야기는 지문 어디에도 없어요. 글은 처음부터 끝까지 물(water)이 빠져나가는 이야기예요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">producing goods with more profit 더 많은 이익을 내는 상품을 생산하는 것</span><span class=\"why\">유럽 소비자는 작물을 사는 쪽이지 생산하는 쪽이 아니에요. 환경 단체가 이익을 주장했다는 말도 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">criticizing the unfair trade of water 불공정한 물 거래를 비판하는 것</span><span class=\"why\">비판하는 쪽은 6번의 환경 단체(Environmental pressure groups)예요. 유럽 소비자는 비판받는 쪽이라 주어와 맞지 않아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">What do rural Africans think</div><div class=\"k\">농촌의 아프리카인들은 무슨 생각을 하는가</div></div><div class=\"rc\"><div class=\"e\">as they pass fields of cash crops</div><div class=\"k\">그들이 환금 작물 밭을 지나갈 때</div></div><div class=\"rc\"><div class=\"e\">such as sunflowers, roses, or coffee,</div><div class=\"k\">해바라기, 장미, 커피와 같은</div></div><div class=\"rc\"><div class=\"e\">while walking five kilometers a day</div><div class=\"k\">하루에 5킬로미터를 걸으면서</div></div><div class=\"rc\"><div class=\"e\">to collect water?</div><div class=\"k\">물을 가져오기 위해</div></div><div class=\"rnat\">농촌의(농촌에 사는) 아프리카인들은 물을 가져오기 위해 하루에 5킬로미터를 걸으면서, 해바라기, 장미, 커피와 같은 환금 작물 밭을 지나갈 때 무슨 생각을 하는가?</div><div class=\"rst\">마실 물을 뜨러 하루 5킬로미터를 걷는 마을 사람이 꽃과 커피 밭을 지나가요. 지문 1번은 그 사람이 무슨 생각을 할지 물어요.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">2번 · 단서</span><div class=\"rc\"><div class=\"e\">Some African countries find it difficult</div><div class=\"k\">일부 아프리카 나라들은 어렵다고 생각한다</div></div><div class=\"rc\"><div class=\"e\">to feed their own people</div><div class=\"k\">자국민을 먹이는 것이</div></div><div class=\"rc ckc\"><div class=\"e\">or <span class=\"cw\">provide safe drinking water</span>,</div><div class=\"k\">또는 <span class=\"cw\">안전한 식수를 제공하는 것이</span></div></div><div class=\"rc ckc\"><div class=\"e\">yet <span class=\"cw\">precious water is used</span></div><div class=\"k\"><span class=\"cw\">그런데도 귀한 물은 사용된다</span></div></div><div class=\"rc\"><div class=\"e\">to produce export crops</div><div class=\"k\">수출 작물을 생산하는 데</div></div><div class=\"rc\"><div class=\"e\">for European markets.</div><div class=\"k\">유럽 시장을 위한</div></div><div class=\"rnat\">일부 아프리카 나라들은 자국민을 먹이거나 안전한 식수를 제공하는 것이 어렵다고 생각하는데도 불구하고, 귀한 물은 유럽 시장을 위한 수출 작물을 생산하는 데 사용된다.</div><div class=\"rst\">그 마을은 <b>마실 물도 모자라요</b>. 그런데 귀한 물이 다른 나라에 팔 꽃과 커피를 키우는 데 쓰여요. = 지문 2번이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">But, African farmers</div><div class=\"k\">하지만 아프리카 농부들은</div></div><div class=\"rc\"><div class=\"e\">cannot help but grow those crops</div><div class=\"k\">그러한 작물을 재배할 수밖에 없다</div></div><div class=\"rc\"><div class=\"e\">because they</div><div class=\"k\">그것들(= 작물)이</div></div><div class=\"rc\"><div class=\"e\">are one of only a few sources of income</div><div class=\"k\">다만 몇 안 되는 소득원 중 하나이기 때문이다</div></div><div class=\"rc\"><div class=\"e\">for them.</div><div class=\"k\">그들에게</div></div><div class=\"rnat\">하지만 아프리카 농부들은 그러한 작물을 재배할 수밖에 없는데, 그것들(작물)이 그들에게 다만 몇 안 되는 소득원 중 하나이기 때문이다.</div><div class=\"rst\"><b>하지만</b>(But) 마을 농부들은 그 작물을 키울 수밖에 없어요. 그게 돈을 버는 몇 안 되는 길이니까요. = 지문 3번.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">In a sense,</div><div class=\"k\">어떤 의미에서는</div></div><div class=\"rc ckc\"><div class=\"e\">African countries are <span class=\"cw\">exporting their water</span></div><div class=\"k\">아프리카 나라들은 <span class=\"cw\">그들의 물을 수출하고 있는 것이다</span></div></div><div class=\"rc\"><div class=\"e\">in the very crops they grow.</div><div class=\"k\">그들이 재배하는 바로 그 작물로</div></div><div class=\"rnat\">어떤 의미에서는, 아프리카 나라들은 그들이 재배하는 바로 그 작물로 그들의 물을 수출하고 있는 것이다.</div><div class=\"rst\">꽃 한 송이에도 마을 물이 들어 있어요. 그러니 꽃을 파는 건 <b>물을 파는 셈</b>이에요. = 지문 4번의 물 수출이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">They need water,</div><div class=\"k\">그들은 물이 필요하지만</div></div><div class=\"rc\"><div class=\"e\">but they also need to export water</div><div class=\"k\">그들은 또한 물을 수출할 필요가 있다</div></div><div class=\"rc\"><div class=\"e\">through the crops they produce.</div><div class=\"k\">그들이 생산하는 그 작물을 통해</div></div><div class=\"rnat\">그들은 물이 필요하지만, 그들은 또한 그들이 생산하는 그 작물을 통해 물을 수출할 필요가 있다.</div><div class=\"rst\">마을은 물이 필요한데, 작물로 물을 내보내기도 해야 해요. 지문 5번은 이 어려운 처지를 말해요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">Environmental pressure groups argue</div><div class=\"k\">환경 보호 압력 단체는 주장한다</div></div><div class=\"rc\"><div class=\"e\">that European customers</div><div class=\"k\">유럽 소비자들이</div></div><div class=\"rc\"><div class=\"e\">who buy African coffee or flowers</div><div class=\"k\">아프리카산 커피나 꽃을 구매하는</div></div><div class=\"rc ckc\"><div class=\"e\">are <span class=\"cw\">making water shortages worse</span></div><div class=\"k\"><span class=\"cw\">물 부족을 악화시키고 있다고</span> ※ 문제지엔 빈칸으로 되어 있음 (정답: making water shortages worse)</div></div><div class=\"rc\"><div class=\"e\">in Africa.</div><div class=\"k\">아프리카에서</div></div><div class=\"rnat\">환경 보호 압력 단체는 아프리카산 커피나 꽃을 구매하는 유럽 소비자들이 아프리카의 물 부족을 악화시키고 있다고 주장한다.</div><div class=\"rst\">그래서 환경 단체는 그 꽃과 커피를 사는 유럽 사람들이 마을의 <b>물 부족을 더 심하게</b>(worse 더 나쁜) 만든다고 말해요. 그게 빈칸이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"rural\" data-m=\"시골의, 농촌의\"><b>rural</b>시골의, 농촌의</button><button type=\"button\" class=\"wdb\" data-w=\"cash crop\" data-m=\"환금 작물(팔려고 기르는 작물)\"><b>cash crop</b>환금 작물(팔려고 기르는 작물)</button><button type=\"button\" class=\"wdb\" data-w=\"precious\" data-m=\"귀중한\"><b>precious</b>귀중한</button><button type=\"button\" class=\"wdb\" data-w=\"cannot help but\" data-m=\"~하지 않을 수 없다\"><b>cannot help but</b>~하지 않을 수 없다</button><button type=\"button\" class=\"wdb\" data-w=\"in a sense\" data-m=\"어떤 의미에서\"><b>in a sense</b>어떤 의미에서</button><button type=\"button\" class=\"wdb\" data-w=\"shortage\" data-m=\"부족\"><b>shortage</b>부족</button></div>", "08": "<p class=\"mtr\">마더텅 정답률 <b>35%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸은 <b>but also</b>(하지만 또한) 뒤라서 “가까워졌다”의 <b>반대쪽</b> 결과예요. 5번이 같은 모양(<b>but</b>(하지만) … <b>simultaneously</b>(동시에))으로 “분열”을 말하니, 그 분열을 한 말로 묶는 어구를 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (2번)</span><div class=\"en\">It has done that, <mark>but</mark> it has <mark>also</mark> inspired us <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span>.</span></div><p class=\"ko\">세계화는 우리를 가깝게 했지만, 또한 우리가 ( ? )하도록 부추겼다</p></div><div class=\"ck-via\"><i>▼</i><span>가까워지는 대신, 위협 앞에서 자기 집단으로 뭉쳐요</span></div><div class=\"ck-step\"><span class=\"lab\">3번 문장 · 첫 번째 근거</span><div class=\"en\">When faced with perceived threats … people <mark>cling more tightly</mark> to their groups.</div><p class=\"ko\">인지된 위협들에 직면할 때 … 사람들은 자신의 집단에 <mark>더 꽉 매달린다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>2번과 똑같은 모양: “그랬지만, 동시에 …”</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 문장 · 결정적 단서</span><div class=\"en\">In some respects it has, but it has simultaneously given voice and organizational ability to new cyber tribes, some of whom spend their time <mark>spreading blame and division</mark> …</div><p class=\"ko\">어떤 면에서 그것은 그랬지만, 그것은 동시에 새로운 인터넷 부족들에게 발언권과 조직력을 주었고, 그들 중 일부는 <mark>비난과 분열을 확산시키며</mark> 시간을 보낸다.</p></div><div class=\"ck-via\"><i>▼</i><span>그 결과: 부족도, 부족 사이 분쟁도 그 어느 때만큼 많아요</span></div><div class=\"ck-step\"><span class=\"lab\">6번 문장 · 확인</span><div class=\"en\">There seem now to be as many tribes, and <mark>as much conflict between them</mark>, as there have ever been.</div><p class=\"ko\">지금은 지금까지 있어 온 만큼 많은 부족들과 <mark>그들 간의 그만큼 많은 분쟁이</mark> 있는 것 같다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">to build barriers 장벽을 쌓는 것<small>3번 집단에 매달림 + 5번 분열 + 6번 부족 간 분쟁 = 서로 사이에 벽을 쌓음</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">to develop technologies 기술을 개발하는 것</span><span class=\"why\">4·5번의 social media(소셜 미디어)가 기술이라 끌리지만, 글이 말하는 건 기술의 발전이 아니라 그 결과로 생긴 분열(division)이에요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">to achieve equality 평등을 이루는 것</span><span class=\"why\">3번에서 오히려 빈부 격차가 커진다(the increasing gap 증가하는 격차)고 했어요. 평등은 글의 방향과 반대예요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">to abandon traditions 전통을 버리는 것</span><span class=\"why\">3번에서 사람들은 자기 집단에 더 꽉 매달려요(cling 매달리다). 전통을 버린다는 말은 지문에 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">to value individualism 개인주의를 중시하는 것</span><span class=\"why\">3·6번은 사람들이 집단과 부족(tribes)으로 뭉친다는 얘기예요. 혼자를 중시하는 개인주의와 반대예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">The title of Thomas Friedman’s 2005 book,</div><div class=\"k\">토머스 프리드먼의 2005년 저서의 제목은</div></div><div class=\"rc\"><div class=\"e\">The World Is Flat,</div><div class=\"k\">《세계는 평평하다》라는</div></div><div class=\"rc\"><div class=\"e\">was based on the belief</div><div class=\"k\">신념에 근거하였다</div></div><div class=\"rc\"><div class=\"e\">that globalization would inevitably</div><div class=\"k\">세계화가 필연적으로</div></div><div class=\"rc\"><div class=\"e\">bring us closer together.</div><div class=\"k\">우리를 서로 더 가까이 데려다 놓을 것이라는</div></div><div class=\"rnat\">《세계는 평평하다》라는 Thomas Friedman(토머스 프리드먼)의 2005년 저서의 제목은 세계화가 우리를 필연적으로 서로 더 가까이 데려다 놓을 것이라는 신념에 근거하였다.</div><div class=\"rst\">반 단톡방이 처음 생겼을 때, 모두 “이제 우리 반 다 친해지겠다!” 했어요. = 지문 1번, 세계화가 우리를 가깝게 할 거라는 믿음이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">It has done that,</div><div class=\"k\">그것(= 세계화)은 그것(= 우리를 더 가깝게 만드는 것)을 했지만</div></div><div class=\"rc\"><div class=\"e\">but it has also inspired us</div><div class=\"k\">그것은 또한 우리를 부추겼다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">to build barriers</span>.</div><div class=\"k\"><span class=\"cw\">장벽을 쌓도록</span> ※ 문제지엔 빈칸으로 되어 있음 (정답: to build barriers)</div></div><div class=\"rnat\">그것(세계화)은 그것(우리를 더 가깝게 만드는 것)을 했지만, 그것은 또한 우리가 장벽을 쌓도록 부추겼다.</div><div class=\"rst\">정말 더 가까워지긴 했어요. <b>하지만 또한</b>(but also) 서로 사이에 <b>벽을 쌓게</b> 만들었어요. = 지문 2번의 빈칸 자리예요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc\"><div class=\"e\">When faced with perceived threats</div><div class=\"k\">인지된 위협들에 직면할 때</div></div><div class=\"rc\"><div class=\"e\">— the financial crisis, terrorism, violent conflict,</div><div class=\"k\">금융 위기, 테러, 폭력적인 분쟁,</div></div><div class=\"rc\"><div class=\"e\">refugees and immigration,</div><div class=\"k\">난민과 이민,</div></div><div class=\"rc\"><div class=\"e\">the increasing gap between rich and poor —</div><div class=\"k\">증가하는 빈부 격차와 같은</div></div><div class=\"rc ckc\"><div class=\"e\">people <span class=\"cw\">cling more tightly</span></div><div class=\"k\"><span class=\"cw\">사람들은 더 꽉 매달린다</span></div></div><div class=\"rc\"><div class=\"e\">to their groups.</div><div class=\"k\">자신의 집단에</div></div><div class=\"rnat\">금융 위기, 테러, 폭력적인 분쟁, 난민과 이민, 증가하는 빈부 격차와 같은 인지된 위협들에 직면할 때, 사람들은 자신의 집단에 더 꽉 매달린다.</div><div class=\"rst\">반에 시험·다툼 같은 걱정거리가 생기면, 친구들은 원래 친한 무리에 <b>더 꽉 붙어요</b>. = 지문 3번, 위협 앞에서 집단에 매달림.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">One founder of a famous social media company</div><div class=\"k\">유명한 소셜 미디어 회사의 한 설립자는</div></div><div class=\"rc\"><div class=\"e\">believed</div><div class=\"k\">믿었다</div></div><div class=\"rc\"><div class=\"e\">social media would unite us.</div><div class=\"k\">소셜 미디어가 우리를 단결시킬 것이라고</div></div><div class=\"rnat\">유명한 소셜 미디어 회사의 한 설립자는 소셜 미디어가 우리를 단결시킬 것이라고 믿었다.</div><div class=\"rst\">단톡방을 만든 반장은 이걸로 반이 하나로 뭉칠 거라 믿었어요. = 지문 4번의 소셜 미디어 회사 설립자예요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">In some respects it has,</div><div class=\"k\">어떤 면에서 그것은 그랬지만(= 소셜 미디어가 우리를 단결시켰다)</div></div><div class=\"rc\"><div class=\"e\">but it has simultaneously given</div><div class=\"k\">그것은 동시에 주었고</div></div><div class=\"rc\"><div class=\"e\">voice and organizational ability</div><div class=\"k\">발언권과 조직력을</div></div><div class=\"rc\"><div class=\"e\">to new cyber tribes,</div><div class=\"k\">새로운 인터넷 부족들에게</div></div><div class=\"rc\"><div class=\"e\">some of whom spend their time</div><div class=\"k\">그들 중 일부는 시간을 보낸다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">spreading blame and division</span></div><div class=\"k\"><span class=\"cw\">비난과 분열을 확산시키며</span></div></div><div class=\"rc\"><div class=\"e\">across the World Wide Web.</div><div class=\"k\">월드 와이드 웹(www) 전체에 걸쳐</div></div><div class=\"rnat\">어떤 면에서 그것은 그랬지만(소셜 미디어가 우리를 단결시켰지만), 그것은 동시에 새로운 인터넷 부족들에게 발언권과 조직력을 주었고, 그들 중 일부는 월드 와이드 웹(www) 전체에 걸쳐 비난과 분열을 확산시키며 시간을 보낸다.</div><div class=\"rst\">어느 정도는 그랬지만, 동시에 끼리끼리 작은 방들이 생겨 남 탓과 <b>편 가르기</b>를 퍼뜨려요. = 지문 5번의 인터넷 부족과 분열.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">There seem now to be</div><div class=\"k\">지금은 있는 것 같다</div></div><div class=\"rc\"><div class=\"e\">as many tribes,</div><div class=\"k\">그만큼 많은 부족들이</div></div><div class=\"rc ckc\"><div class=\"e\">and <span class=\"cw\">as much conflict between them</span>,</div><div class=\"k\"><span class=\"cw\">그리고 그들 간의 그만큼 많은 분쟁이</span></div></div><div class=\"rc\"><div class=\"e\">as there have ever been.</div><div class=\"k\">지금까지 있어 온 만큼</div></div><div class=\"rnat\">현재 지금까지 있어 온 만큼이나 많은 부족들과 그들 간의 많은 분쟁이 있는 것 같다.</div><div class=\"rst\">지금 우리 반엔 무리도, 무리끼리 다툼도 그 어느 때만큼 많아요. = 지문 6번, 부족과 분쟁이 여전히 많다는 말.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Is it possible</div><div class=\"k\">가능할까</div></div><div class=\"rc\"><div class=\"e\">for these tribes to coexist</div><div class=\"k\">이러한 부족들이 공존하는 것이</div></div><div class=\"rc\"><div class=\"e\">in a world</div><div class=\"k\">세계에서</div></div><div class=\"rc\"><div class=\"e\">where the concept of “us and them” remains?</div><div class=\"k\">‘우리와 그들’이라는 개념이 남아 있는</div></div><div class=\"rnat\">이러한 부족들이 ‘우리와 그들’이라는 개념이 남아 있는 세계에서 공존하는 것이 가능할까?</div><div class=\"rst\">“우리 편, 너네 편”이 남아 있는 반에서 다 같이 잘 지낼 수 있을까요? 지문 7번도 이렇게 물으며 끝나요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"globalization\" data-m=\"세계화\"><b>globalization</b>세계화</button><button type=\"button\" class=\"wdb\" data-w=\"inevitably\" data-m=\"필연적으로\"><b>inevitably</b>필연적으로</button><button type=\"button\" class=\"wdb\" data-w=\"perceived threat\" data-m=\"인지된 위협\"><b>perceived threat</b>인지된 위협</button><button type=\"button\" class=\"wdb\" data-w=\"cling more tightly\" data-m=\"더 꽉 매달리다\"><b>cling more tightly</b>더 꽉 매달리다</button><button type=\"button\" class=\"wdb\" data-w=\"simultaneously\" data-m=\"동시에\"><b>simultaneously</b>동시에</button><button type=\"button\" class=\"wdb\" data-w=\"coexist\" data-m=\"공존하다\"><b>coexist</b>공존하다</button></div>", "09": "<p class=\"mtr\">마더텅 정답률 <b>75%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">순서 문제는 <b>고리</b>를 찾는 문제예요. 지시어(<b>this study</b> 이 연구) → 시간 연결어(<b>Then</b> 그 다음에)와 <b>a newer study</b>(더 새로운 연구) → 다시 가리키기(<b>The second study</b> 두 번째 연구) 순으로 이어 붙이세요.</p><div class=\"ck-step\"><span class=\"lab\">주어진 글 끝</span><div class=\"en\">The study suggests that <mark>drinking at least three cups a day</mark> significantly improves attention and memory.</div><p class=\"ko\">연구는 <mark>하루에 적어도 세 잔의 커피를 마시는 것이</mark> 주의 집중과 기억력을 상당히 향상시킨다고 말한다.</p></div><div class=\"ck-via\"><i>▼</i><span>this study(이 연구) = 주어진 글의 “하루 세 잔” 연구</span></div><div class=\"ck-step key\"><span class=\"lab\">(B) · 첫 번째 고리</span><div class=\"en\">A woman reads <mark>this study</mark> and immediately increases her morning coffee ritual to three cups.</div><p class=\"ko\">한 여성이 <mark>이 연구를</mark> 읽고 바로 그녀의 아침 커피 의례를 세 잔으로 늘린다.</p></div><div class=\"ck-via\"><i>▼</i><span>(B)의 한 달이 지난 “그 다음에” 새 연구가 등장해요</span></div><div class=\"ck-step key\"><span class=\"lab\">(A) · 두 번째 고리</span><div class=\"en\"><mark>Then</mark> she reads <mark>a newer study</mark> that says drinking more than two cups of coffee a day is linked to significantly decreased attention …</div><p class=\"ko\"><mark>그 다음에</mark> 그녀는 하루에 두 잔 이상의 커피를 마시는 것이 현저하게 저하된 주의 집중과 연관되어 있다고 말하는 <mark>더 새로운 연구를</mark> 읽는다.</p></div><div class=\"ck-via\"><i>▼</i><span>The second study(두 번째 연구) = (A)의 a newer study(더 새로운 연구)</span></div><div class=\"ck-step key\"><span class=\"lab\">(C) · 세 번째 고리</span><div class=\"en\"><mark>The second study</mark> has been promoted as actively as the first, and is equally convincing.</div><p class=\"ko\"><mark>두 번째 연구는</mark> 첫 번째만큼이나 활발히 홍보되었고, 똑같이 설득력 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">(B) – (A) – (C)<small>이 연구 → 그 다음 새 연구 → 두 번째 연구, 세 고리가 다 맞아요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">(B) – (C) – (A)</span><span class=\"why\">(C)의 The second study(두 번째 연구)가 (A)의 a newer study(더 새로운 연구)보다 먼저 나와요. 두 번째 연구가 소개되기도 전에 가리키는 꼴이에요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">(A) – (C) – (B)</span><span class=\"why\">(A)의 Then(그 다음에)은 앞에 그녀의 행동이 있어야 하는데, 주어진 글에는 연구 내용만 있고 she(그녀)가 아직 나오지 않았어요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">(C) – (A) – (B)</span><span class=\"why\">주어진 글 바로 뒤에 The second study(두 번째 연구)가 나오면, 두 번째 연구가 무엇인지 알 수 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">(C) – (B) – (A)</span><span class=\"why\">(C) 끝에서 커피를 두 잔으로 줄였는데, 그 뒤 (B)에서 다시 세 잔으로 늘려요. 이야기 시간 순서가 거꾸로예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><span class=\"ordc\">정답 순서 주어진 글</span><div class=\"rc\"><div class=\"e\">Imagine that</div><div class=\"k\">상상해보라</div></div><div class=\"rc\"><div class=\"e\">a study on the effects of drinking coffee</div><div class=\"k\">커피를 마시는 것의 효과에 관한 연구가</div></div><div class=\"rc\"><div class=\"e\">comes out in the news.</div><div class=\"k\">뉴스에 나온다고</div></div><div class=\"rnat\">커피를 마시는 것의 효과에 관한 연구가 뉴스에 나온다고 상상해보라.</div><div class=\"rst\">한 아주머니가 아침에 커피에 관한 연구 뉴스를 보고 있다고 상상해 보세요. 지문 1번도 이렇게 뉴스 장면으로 시작해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><span class=\"ordc\">정답 순서 주어진 글</span><div class=\"rc\"><div class=\"e\">The study suggests</div><div class=\"k\">연구는 말한다</div></div><div class=\"rc\"><div class=\"e\">that drinking at least three cups a day</div><div class=\"k\">하루에 적어도 세 잔의 커피를 마시는 것이</div></div><div class=\"rc\"><div class=\"e\">significantly improves</div><div class=\"k\">상당히 향상시킨다고</div></div><div class=\"rc\"><div class=\"e\">attention and memory.</div><div class=\"k\">주의 집중과 기억력을</div></div><div class=\"rnat\">연구는 하루에 적어도 세 잔의 커피를 마시는 것이 주의 집중과 기억력을 상당히 향상시킨다고 말한다.</div><div class=\"rst\">뉴스에서 “하루 세 잔이면 집중력과 기억력이 좋아진다”고 해요. = 지문 2번의 첫 번째 연구예요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">3번 · 단서</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Then</span> she reads</div><div class=\"k\"><span class=\"cw\">그 다음에</span> 그녀는 읽는다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">a newer study</span></div><div class=\"k\"><span class=\"cw\">더 새로운 연구를</span></div></div><div class=\"rc\"><div class=\"e\">that says</div><div class=\"k\">말하는</div></div><div class=\"rc\"><div class=\"e\">drinking more than two cups of coffee a day</div><div class=\"k\">하루에 두 잔 이상의 커피를 마시는 것이</div></div><div class=\"rc\"><div class=\"e\">is linked to</div><div class=\"k\">~와 연관되어 있다고</div></div><div class=\"rc\"><div class=\"e\">significantly decreased attention</div><div class=\"k\">현저하게 저하된 주의 집중</div></div><div class=\"rc\"><div class=\"e\">and heightened anxiety.</div><div class=\"k\">및 고조된 불안</div></div><div class=\"rnat\">(A) 그 다음에 그녀는 하루에 두 잔 이상의 커피를 마시는 것이 현저하게 저하된 주의 집중 및 고조된 불안과 연관되어 있다고 말하는 더 새로운 연구를 읽는다.</div><div class=\"rst\"><b>그 다음에</b>(Then) 아주머니는 <b>더 새로운 연구</b>(a newer study)를 봐요. “두 잔이 넘으면 집중이 떨어지고 불안해진다”는 지문 (A)예요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">4번 · 단서</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc ckc\"><div class=\"e\">A woman reads <span class=\"cw\">this study</span></div><div class=\"k\">한 여성이 <span class=\"cw\">이 연구를</span> 읽고</div></div><div class=\"rc\"><div class=\"e\">and immediately increases</div><div class=\"k\">바로 늘린다</div></div><div class=\"rc\"><div class=\"e\">her morning coffee ritual</div><div class=\"k\">그녀의 아침 커피 의례(평소 커피를 마시는 양)를</div></div><div class=\"rc\"><div class=\"e\">to three cups.</div><div class=\"k\">세 잔으로</div></div><div class=\"rnat\">(B) 한 여성이 이 연구를 읽고 바로 그녀의 아침 커피 의례(평소 커피를 마시는 양)를 세 잔으로 늘린다.</div><div class=\"rst\"><b>this study</b>(이 연구)를 본 아주머니는 바로 아침 커피를 세 잔으로 늘려요. = 지문 (B), 방금 본 그 뉴스 때문이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">5번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">For the next month</div><div class=\"k\">그 다음 달 동안</div></div><div class=\"rc\"><div class=\"e\">she thinks</div><div class=\"k\">그녀는 생각한다</div></div><div class=\"rc\"><div class=\"e\">she is more attentive</div><div class=\"k\">자신이 집중력이 더 좋아지고</div></div><div class=\"rc\"><div class=\"e\">and remembering things better</div><div class=\"k\">더 잘 기억하고 있다고</div></div><div class=\"rc\"><div class=\"e\">because she’s drinking more coffee.</div><div class=\"k\">그녀가 더 많은 커피를 마시고 있기 때문에</div></div><div class=\"rnat\">그 다음 달 동안 그녀는 그녀가 더 많은 커피를 마시고 있기 때문에 집중력이 더 좋아지고 더 잘 기억하고 있다고 생각한다.</div><div class=\"rst\">한 달 동안 아주머니는 “커피 덕분에 집중도 잘 되고 기억도 잘 나” 하고 생각해요. = 지문 5번이에요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">The second study</span></div><div class=\"k\"><span class=\"cw\">두 번째 연구는</span></div></div><div class=\"rc\"><div class=\"e\">has been promoted</div><div class=\"k\">홍보되었고</div></div><div class=\"rc\"><div class=\"e\">as actively as the first,</div><div class=\"k\">첫 번째만큼이나 활발히</div></div><div class=\"rc\"><div class=\"e\">and is equally convincing.</div><div class=\"k\">똑같이 설득력 있다</div></div><div class=\"rnat\">(C) 두 번째 연구는 첫 번째만큼이나 활발히 홍보되었고, 똑같이 설득력 있다.</div><div class=\"rst\"><b>두 번째 연구</b>(The second study)도 첫 번째만큼 뉴스에 많이 나왔고, 똑같이 그럴듯해요. = 방금 본 새 연구 얘기예요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">She thinks,</div><div class=\"k\">그녀는 생각한다</div></div><div class=\"rc\"><div class=\"e\">“I have been feeling more anxious lately,</div><div class=\"k\">“나는 최근에 불안감을 더 많이 느껴왔고,</div></div><div class=\"rc\"><div class=\"e\">and maybe I’m not as focused as I thought,”</div><div class=\"k\">어쩌면 나는 내가 생각했던 만큼 집중하지 못하고 있어.”라고</div></div><div class=\"rc\"><div class=\"e\">and she decreases her coffee intake</div><div class=\"k\">그리고 그녀는 그녀의 커피 섭취량을 줄인다</div></div><div class=\"rc\"><div class=\"e\">down to two cups.</div><div class=\"k\">두 잔으로</div></div><div class=\"rnat\">그녀는 “나는 최근에 불안감을 더 많이 느껴왔고, 어쩌면 나는 내가 생각했던 만큼 집중하지 못하고 있어.”라고 생각하고, 그녀는 그녀의 커피 섭취량을 두 잔으로 줄인다.</div><div class=\"rst\">아주머니는 “요즘 좀 불안하고 생각만큼 집중이 안 됐어” 하며 커피를 두 잔으로 줄여요. 지문 7번, 뉴스 따라 오락가락해요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"significantly\" data-m=\"상당히, 현저하게\"><b>significantly</b>상당히, 현저하게</button><button type=\"button\" class=\"wdb\" data-w=\"ritual\" data-m=\"(규칙적인) 습관, 의례\"><b>ritual</b>(규칙적인) 습관, 의례</button><button type=\"button\" class=\"wdb\" data-w=\"attentive\" data-m=\"주의 깊은, 집중하는\"><b>attentive</b>주의 깊은, 집중하는</button><button type=\"button\" class=\"wdb\" data-w=\"heightened\" data-m=\"고조된\"><b>heightened</b>고조된</button><button type=\"button\" class=\"wdb\" data-w=\"convincing\" data-m=\"설득력 있는\"><b>convincing</b>설득력 있는</button><button type=\"button\" class=\"wdb\" data-w=\"intake\" data-m=\"섭취(량)\"><b>intake</b>섭취(량)</button></div>", "10": "<p class=\"mtr\">마더텅 정답률 <b>30%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">삽입은 <b>가리키는 말</b>을 잡는 문제. 6번 <b>in such a way</b>(그러한 방식으로)가 가리킬 “보상을 챙기는 행동”이 바로 앞에 있어야 하고, <b>Moreover</b>(게다가)는 주어진 문장의 “재앙”에 덧붙이는 말이에요.</p><div class=\"ck-step\"><span class=\"lab\">주어진 문장 · 연결 신호</span><div class=\"en\">A camping trip where each person attempted to gain <mark>the maximum rewards</mark> … would quickly end in <mark>disaster and unhappiness</mark>.</div><p class=\"ko\">각자가 다른 캠핑객으로부터 자신의 재능을 사용하는 대가로 <mark>최대한의 보상을</mark> 얻으려고 시도하는 캠핑 여행은 빠르게 <mark>재앙과 불행으로</mark> 끝날 것이다.</p></div><div class=\"ck-via\"><i>▼</i><span>나눠서 행복한 캠핑이 끝나고, 반대로 “보상만 챙기면?”으로 넘어갈 자리</span></div><div class=\"ck-step\"><span class=\"lab\">5번 · 앞 문장 (④ 바로 앞)</span><div class=\"en\">All these goods are shared and a spirit of community makes all participants <mark>happier</mark>.</div><p class=\"ko\">이 모든 물건들은 공유되고, 공동체 정신은 모든 참여자들을 <mark>보다 행복하게</mark> 만든다.</p></div><div class=\"ck-via\"><i>▼</i><span>such a way(그러한 방식) = 주어진 문장의 “최대한의 보상을 얻으려는 행동”</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 · 뒤 문장 (④ 바로 뒤)</span><div class=\"en\"><mark>Moreover</mark>, the experience would be ruined if people were to behave <mark>in such a way</mark>.</div><p class=\"ko\"><mark>게다가</mark> 만약에 사람들이 <mark>그러한 방식으로</mark> 행동한다면, 경험은 엉망이 될 것이다.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>5번</em>다 나누니 모두 더 행복함</span><span><em>주어진 문장</em>보상만 챙기면 재앙과 불행으로 끝남</span><span><em>6번</em>게다가 그런 식이면 경험도 엉망</span></div><div class=\"ck-eq\">⇒ 행복 → 반대 상황(불행) → 덧붙임, 세 고리가 다 맞는 자리 = ④</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">5번 문장과 6번 문장 사이<small>6번 in such a way(그러한 방식으로)가 가리킬 행동이 바로 앞에 생겨요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">3번 문장과 4번 문장 사이</span><span class=\"why\">3번의 “돈 내야 먹어”와 비슷해 보여 끌리지만, 4번 Rather(오히려)는 3번의 그 말을 바로 뒤집어야 해요. 사이에 끼우면 이 고리가 끊겨요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">2번 문장과 3번 문장 사이</span><span class=\"why\">2번은 캠핑을 비유로 든다는 소개이고, 3번 he argues(그는 주장한다)가 바로 그 내용을 이어 가요. 6번 such a way(그러한 방식)와도 너무 멀어요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">4번 문장과 5번 문장 사이</span><span class=\"why\">5번 All these goods(이 모든 물건)는 4번의 요리·텐트·물 정화를 가리켜요. 사이에 넣으면 무엇을 나누는지 끊겨요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">6번 문장과 7번 문장 사이</span><span class=\"why\">그러면 6번 바로 앞이 5번의 “나눠서 행복함”이라, in such a way(그러한 방식으로)가 가리킬 이기적 행동이 없어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds key\" data-ord=\"1\"><span class=\"rn\">1번 · 단서</span><div class=\"rc\"><div class=\"e\">A camping trip</div><div class=\"k\">캠핑 여행은</div></div><div class=\"rc\"><div class=\"e\">where each person attempted to gain</div><div class=\"k\">각자가 얻으려고 시도하는</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">the maximum rewards</span></div><div class=\"k\"><span class=\"cw\">최대한의 보상을</span></div></div><div class=\"rc\"><div class=\"e\">from the other campers</div><div class=\"k\">다른 캠핑객으로부터</div></div><div class=\"rc\"><div class=\"e\">in exchange for the use</div><div class=\"k\">사용하는 대가로</div></div><div class=\"rc\"><div class=\"e\">of his or her talents</div><div class=\"k\">자신의 재능을</div></div><div class=\"rc\"><div class=\"e\">would quickly end</div><div class=\"k\">빠르게 끝날 것이다</div></div><div class=\"rc ckc\"><div class=\"e\">in <span class=\"cw\">disaster and unhappiness</span>.</div><div class=\"k\"><span class=\"cw\">재앙과 불행으로</span></div></div><div class=\"rnat\">(주어진 문장) 각자가 다른 캠핑객으로부터 자신의 재능을 사용하는 대가로 최대한의 보상을 얻으려고 시도하는 캠핑 여행은 빠르게 재앙과 불행으로 끝날 것이다.</div><div class=\"rst\">〈주어진 문장〉 수련회에서 각자 자기 재주를 쓸 때마다 대가를 최대한 받으려 하면, 금방 <b>엉망이 되고 다 불행해져요</b>. = 지문의 재앙과 불행.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">The philosopher G. A. Cohen</div><div class=\"k\">철학자 G. A. Cohen은</div></div><div class=\"rc\"><div class=\"e\">provides an example of a camping trip</div><div class=\"k\">캠핑 여행을 예로 든다</div></div><div class=\"rc\"><div class=\"e\">as a metaphor</div><div class=\"k\">비유로</div></div><div class=\"rc\"><div class=\"e\">for the ideal society.</div><div class=\"k\">이상적인 사회에 대한</div></div><div class=\"rnat\">철학자 G. A. Cohen은 이상적인 사회에 대한 비유로 캠핑 여행을 예로 든다.</div><div class=\"rst\">한 철학자는 좋은 사회를 설명하려고 캠핑을 예로 들어요. 우리 반 수련회를 떠올리면 돼요. = 지문 2번의 비유.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">On a camping trip,</div><div class=\"k\">캠핑 여행에서</div></div><div class=\"rc\"><div class=\"e\">he argues,</div><div class=\"k\">그는 주장한다</div></div><div class=\"rc\"><div class=\"e\">it is unimaginable</div><div class=\"k\">상상도 할 수 없다고</div></div><div class=\"rc\"><div class=\"e\">that someone would say something like,</div><div class=\"k\">어떤 사람이 ~와 같이 말하는 것은</div></div><div class=\"rc\"><div class=\"e\">“I cooked the dinner</div><div class=\"k\">“내가 저녁을 요리했으니</div></div><div class=\"rc\"><div class=\"e\">and therefore you can’t eat it</div><div class=\"k\">너는 이것(= 저녁)을 먹을 수 없어</div></div><div class=\"rc\"><div class=\"e\">unless you pay me</div><div class=\"k\">대가를 지불하지 않으면</div></div><div class=\"rc\"><div class=\"e\">for my superior cooking skills.”</div><div class=\"k\">나의 뛰어난 요리 실력에 대해.”</div></div><div class=\"rnat\">캠핑 여행에서 어떤 사람이 “내가 저녁을 요리했으니 너는 나의 뛰어난 요리 실력에 대해 대가를 지불하지 않으면 이것(저녁)을 먹을 수 없어.”와 같이 말하는 것은 상상도 할 수 없다고 그는 주장한다.</div><div class=\"rst\">수련회에서 “내가 라면 끓였으니 돈 안 내면 못 먹어!”라고 하는 친구는 상상하기 어렵죠. = 지문 3번이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Rather,</div><div class=\"k\">오히려</div></div><div class=\"rc\"><div class=\"e\">one person cooks dinner,</div><div class=\"k\">한 사람이 저녁을 요리하면</div></div><div class=\"rc\"><div class=\"e\">another sets up the tent,</div><div class=\"k\">다른 사람은 텐트를 설치하고</div></div><div class=\"rc\"><div class=\"e\">another purifies the water, and so on,</div><div class=\"k\">또 다른 사람은 물을 정화하는 등</div></div><div class=\"rc\"><div class=\"e\">each in accordance with</div><div class=\"k\">각자 ~에 따른다</div></div><div class=\"rc\"><div class=\"e\">his or her abilities.</div><div class=\"k\">자신의 능력에</div></div><div class=\"rnat\">오히려 한 사람이 저녁을 요리하면, 다른 사람은 텐트를 설치하고, 또 다른 사람은 물을 정화하는 등, 각자 자신의 능력에 따른다(능력에 맞추어 일한다).</div><div class=\"rst\"><b>오히려</b>(Rather) 한 명은 밥을 하고, 한 명은 텐트를 치고, 한 명은 물을 떠 와요. = 지문 4번, 각자 능력에 따라 일해요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">All these goods are shared</div><div class=\"k\">이 모든 물건(= 능력)들은 공유되고</div></div><div class=\"rc\"><div class=\"e\">and a spirit of community</div><div class=\"k\">그리고 공동체 정신은</div></div><div class=\"rc\"><div class=\"e\">makes all participants happier.</div><div class=\"k\">모든 참여자들을 보다 행복하게 만든다</div></div><div class=\"rnat\">이 모든 물건(능력)들은 공유되고, 공동체 정신은 모든 참여자들을 보다 행복하게 만든다.</div><div class=\"rst\">그렇게 한 일은 다 같이 나누고, 함께하는 마음 덕에 모두 <b>더 행복해져요</b>. = 지문 5번의 공동체 정신.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Moreover</span>,</div><div class=\"k\"><span class=\"cw\">게다가</span></div></div><div class=\"rc\"><div class=\"e\">the experience would be ruined</div><div class=\"k\">경험은 엉망이 될 것이다</div></div><div class=\"rc\"><div class=\"e\">if people were to behave</div><div class=\"k\">만약에 사람들이 행동한다면</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">in such a way</span>.</div><div class=\"k\"><span class=\"cw\">그러한 방식으로</span></div></div><div class=\"rnat\">게다가 만약에 사람들이 그러한 방식으로 행동한다면, 경험은 엉망이 될 것이다.</div><div class=\"rst\"><b>게다가</b>(Moreover) <b>그런 식</b>(in such a way)으로 대가만 챙기면 수련회 자체가 망가져요. = 주어진 문장의 행동을 가리켜요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">So,</div><div class=\"k\">그래서</div></div><div class=\"rc\"><div class=\"e\">we would have a better life</div><div class=\"k\">우리는 더 나은 삶을 살게 될 것이다</div></div><div class=\"rc\"><div class=\"e\">in a more equal and cooperative society.</div><div class=\"k\">보다 평등하고 협력적인 사회에서</div></div><div class=\"rnat\">그래서 우리는 보다 평등하고 협력적인 사회에서 더 나은 삶을 살게 될 것이다.</div><div class=\"rst\"><b>그래서</b>(So) 서로 평등하게 돕는 반, 그런 사회에서 더 잘 살 수 있다는 게 지문의 결론이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"in exchange for\" data-m=\"~에 대한 대가로\"><b>in exchange for</b>~에 대한 대가로</button><button type=\"button\" class=\"wdb\" data-w=\"metaphor\" data-m=\"비유\"><b>metaphor</b>비유</button><button type=\"button\" class=\"wdb\" data-w=\"unimaginable\" data-m=\"상상할 수 없는\"><b>unimaginable</b>상상할 수 없는</button><button type=\"button\" class=\"wdb\" data-w=\"in accordance with\" data-m=\"~에 따라\"><b>in accordance with</b>~에 따라</button><button type=\"button\" class=\"wdb\" data-w=\"spirit of community\" data-m=\"공동체 정신\"><b>spirit of community</b>공동체 정신</button><button type=\"button\" class=\"wdb\" data-w=\"cooperative\" data-m=\"협력적인\"><b>cooperative</b>협력적인</button></div>", "11": "<p class=\"mtr\">마더텅 정답률 <b>55%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">제목은 <b>But</b>(하지만)으로 뒤집힌 뒤의 <b>결론 문장</b>에서 찾으세요. 8번에서 “유전자가 다 정한다”가 뒤집히고, 10번 <b>take ownership of our health</b>(건강에 대한 주도권을 갖다)로 닫혀요.</p><div class=\"ck-step\"><span class=\"lab\">1~3번 · 처음 믿음</span><div class=\"en\">We are “destined” to inherit certain diseases based on the misfortune of our DNA.</div><p class=\"ko\">우리는 자신의 DNA의 불행을 바탕으로 특정 질병을 물려받는 ‘운명’이다.</p></div><div class=\"ck-via\"><i>▼</i><span>But(하지만)으로 “유전자가 운명” 이야기가 뒤집혀요</span></div><div class=\"ck-step\"><span class=\"lab\">8번 · 전환 신호</span><div class=\"en\"><mark>But</mark> the more science has learned about the body and its interaction with the environment around it … the more (d) complicated the story becomes.</div><p class=\"ko\"><mark>하지만</mark> 과학이 신체와 그 주변 환경과의 상호 작용에 대해 더 많이 알게 될수록 … 그 이야기는 더욱 (d)복잡해진다.</p></div><div class=\"ck-via\"><i>▼</i><span>유전자만(A)이 아니라 다양한 상호 작용(B)이 우리를 만든다</span></div><div class=\"ck-step\"><span class=\"lab\">9번 · not A but B</span><div class=\"en\">We are <mark>not merely expressions of coding</mark> but products of a remarkable variety of interactions that are both within and outside of our control.</div><p class=\"ko\">우리는 <mark>단지 (유전)암호화의 표현이 아니라</mark> 우리의 통제 내부와 외부 모두에 있는 놀랍도록 다양한 상호 작용의 산물이다.</p></div><div class=\"ck-via\"><i>▼</i><span>유전 운명론을 넘어서면 건강은 우리 손에 있다는 결론</span></div><div class=\"ck-step key\"><span class=\"lab\">10번 · 결정적 결론</span><div class=\"en\">Once we see beyond the narrative that genetics are (e) destiny, we can <mark>take ownership of our health</mark>.</div><p class=\"ko\">일단 우리가 유전적 특성이 운명이라는 이야기를 넘어서 보게 된다면 <mark>우리는 자신의 건강에 대한 소유권을 가질 수 있다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">Health Is in Our Hands(건강은 우리 손에 달려 있다), Not Only in Our Genes(유전자에만이 아니라)<small>9번의 “유전자만이 아니다”와 10번의 “건강의 주도권”을 둘 다 담았어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">Genetics(유전학): A Solution to Enhance Human Wellness(인간의 건강을 높이는 해결책)</span><span class=\"why\">[반대] 지문에 계속 나오는 genetic(유전의)만 따온 함정이에요. 글은 유전자가 해결책이 아니라, 유전자 운명론을 넘어서야 한다고 해요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">How Did DNA Dominate Over Environment in Biology(생물학에서 DNA는 어떻게 환경을 압도했는가)?</span><span class=\"why\">[반대] 8~9번은 오히려 환경과의 상호 작용이 중요하다고 해요. DNA(유전자)가 이겼다는 1~3번 믿음은 글이 뒤집는 쪽이에요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">Never Be Confident in Your Health(건강을 과신하지 마라), but Keep Checking(계속 확인하라)!</span><span class=\"why\">[지문에 없음] 건강 검진을 계속하라는 말은 한 문장도 없어요. 10~11번은 스스로 변화를 만들 수 있다는 희망적인 결론이에요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">Why Scientific Innovation Affects Our Social Interactions(과학 혁신이 왜 사회적 상호 작용에 영향을 주는가)</span><span class=\"why\">[지문에 없음] 8번의 science(과학)와 relationships(관계)만 따왔어요. 글의 상호 작용은 몸과 환경 사이의 것이지 사회 교류 이야기가 아니에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Since the turn of the twentieth century</div><div class=\"k\">20세기로 전환된 이래로</div></div><div class=\"rc\"><div class=\"e\">we’ve believed in genetic causes of diagnoses</div><div class=\"k\">우리는 진단의 유전적인 원인을 믿어 왔다</div></div><div class=\"rc\"><div class=\"e\">— a theory called genetic determinism.</div><div class=\"k\">즉 유전자 결정론이라 불리는 이론을</div></div><div class=\"rnat\">20세기로 전환된 이래로 우리는 진단의 유전적인 원인, 즉 유전자 결정론이라 불리는 이론을 믿어 왔다.</div><div class=\"rst\">우리 가족은 다 이가 약해서 충치가 잘 생겨요. 그래서 “충치는 유전이야” 하고 믿어 왔어요. = 지문 1번의 유전자 결정론이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Under this model,</div><div class=\"k\">이 모델하에서</div></div><div class=\"rc\"><div class=\"e\">our genes (and subsequent health)</div><div class=\"k\">우리의 유전자는 (그리고 차후의 건강은)</div></div><div class=\"rc\"><div class=\"e\">are determined at birth.</div><div class=\"k\">태어날 때 결정된다</div></div><div class=\"rnat\">이 모델하에서 우리의 유전자는 (그리고 차후의 건강은) 태어날 때 결정된다.</div><div class=\"rst\">이 생각대로라면 내 이도, 내 건강도 태어날 때 이미 다 정해져 있는 거예요. = 지문 2번.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">We are “destined”</div><div class=\"k\">우리는 ‘운명’이다</div></div><div class=\"rc\"><div class=\"e\">to inherit certain diseases</div><div class=\"k\">특정 질병을 물려받을</div></div><div class=\"rc\"><div class=\"e\">based on the misfortune of our DNA.</div><div class=\"k\">자신의 DNA의 불행을 바탕으로</div></div><div class=\"rnat\">우리는 자신의 DNA의 불행을 바탕으로 특정 질병을 물려받는 ‘운명’이다.</div><div class=\"rst\">“엄마 아빠 이가 약하니 나도 충치 생길 <b>운명</b>(destined)이야”라는 거죠. = 지문 3번의 DNA(유전자) 탓.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Genetic determinism</div><div class=\"k\">유전자 결정론은</div></div><div class=\"rc\"><div class=\"e\">doesn’t (a) consider</div><div class=\"k\">(a)고려하지 않는다</div></div><div class=\"rc\"><div class=\"e\">the role of family backgrounds, traumas, habits,</div><div class=\"k\">가정 환경, 정신적 충격, 습관의 역할을</div></div><div class=\"rc\"><div class=\"e\">or anything else within the environment.</div><div class=\"k\">또는 환경 내의 다른 어떤 것의</div></div><div class=\"rnat\">유전자 결정론은 가정 환경, 정신적 충격, 습관 또는 환경 내의 다른 어떤 것의 역할을 (a)고려하지 않는다.</div><div class=\"rst\">이 생각은 집 분위기, 양치 습관 같은 환경은 <b>고려하지 않아요</b>(consider 고려하다). = 지문 4번.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">In this dynamic</div><div class=\"k\">이 역학 관계에서</div></div><div class=\"rc\"><div class=\"e\">we are not (b) active participants</div><div class=\"k\">우리는 (b)능동적인 참여자가 아니다</div></div><div class=\"rc\"><div class=\"e\">in our own health and wellness.</div><div class=\"k\">우리 자신의 건강과 안녕에 있어</div></div><div class=\"rnat\">이 역학 관계에서 우리는 우리 자신의 건강과 안녕에 있어 (b)능동적인 참여자가 아니다.</div><div class=\"rst\">그러니 나는 내 이 건강을 위해 스스로 뭘 하는 <b>능동적인</b>(active) 사람이 아니게 돼요. = 지문 5번.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Why would we be?</div><div class=\"k\">우리는 왜 이러할까?</div></div><div class=\"rnat\">우리는 왜 이러할까?</div><div class=\"rst\">왜 그럴까요? 지문 6번은 “우리가 굳이 왜 나서겠어?” 하고 물어요(능동적일 이유가 없다는 뜻).</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">If something is predetermined,</div><div class=\"k\">만약 무언가가 미리 결정되어 있다면</div></div><div class=\"rc\"><div class=\"e\">it’s not (c) necessary</div><div class=\"k\">(c)필요하지 않다</div></div><div class=\"rc\"><div class=\"e\">to look at anything beyond our DNA.</div><div class=\"k\">우리의 DNA를 넘어서 어떤 것을 보는 것이</div></div><div class=\"rnat\">만약 무언가가 미리 결정되어 있다면 우리의 DNA를 넘어서 어떤 것을 보는 것이 (c)필요하지 않다.</div><div class=\"rst\">이미 정해졌다면 유전 말고 다른 걸 살펴볼 <b>필요</b>(necessary 필요한)가 없으니까요. = 지문 7번.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">But the more science has learned</span></div><div class=\"k\"><span class=\"cw\">하지만 과학이 더 많이 알게 될수록</span></div></div><div class=\"rc\"><div class=\"e\">about the body and its interaction</div><div class=\"k\">신체와 그것의 상호 작용에 대해</div></div><div class=\"rc\"><div class=\"e\">with the environment around it</div><div class=\"k\">그 주변 환경과의</div></div><div class=\"rc\"><div class=\"e\">(in its various forms,</div><div class=\"k\">(다양한 형태로,</div></div><div class=\"rc\"><div class=\"e\">from our nutrition to our relationships</div><div class=\"k\">우리의 영양에서부터 우리의 관계</div></div><div class=\"rc\"><div class=\"e\">to our racially oppressive systems),</div><div class=\"k\">그리고 우리의 인종적으로 억압적인 시스템에 이르기까지)</div></div><div class=\"rc\"><div class=\"e\">the more (d) complicated the story becomes.</div><div class=\"k\">그 이야기는 더욱 (d)복잡해진다 ※ 문제지엔 simplistic(단순한)으로 되어 있음</div></div><div class=\"rnat\">하지만 과학이 신체와 그것의 그 주변 환경(우리의 영양에서부터, 우리의 관계 그리고 우리의 인종적으로 억압적인 시스템에 이르기까지의 다양한 형태로)과의 상호 작용에 대해 더 많이 알게 될수록, 그 이야기는 더욱 (d)단순해진다(→복잡해진다).</div><div class=\"rst\"><b>하지만</b>(But) 알고 보니 이는 간식, 양치 습관, 생활 환경과 얽혀 있었어요. 과학이 알수록 이야기가 복잡해진다는 지문 8번이에요.</div></div><div class=\"rds key\" data-ord=\"9\"><span class=\"rn\">9번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">We are <span class=\"cw\">not merely expressions of coding</span></div><div class=\"k\">우리는 <span class=\"cw\">단지 (유전)암호화의 표현이 아니라</span></div></div><div class=\"rc\"><div class=\"e\">but products of a remarkable variety of interactions</div><div class=\"k\">놀랍도록 다양한 상호 작용의 산물이다</div></div><div class=\"rc\"><div class=\"e\">that are both within and outside of our control.</div><div class=\"k\">우리의 통제 내부와 외부 모두에 있는</div></div><div class=\"rnat\">우리는 단지 (유전)암호화의 표현이 아니라 우리의 통제 내부와 외부 모두에 있는 놀랍도록 다양한 상호 작용의 산물이다.</div><div class=\"rst\">나는 유전자로만 만들어진 게 아니라, 내가 바꿀 수 있는 것과 없는 것이 다양하게 얽혀 만들어져요. = 지문 9번.</div></div><div class=\"rds key\" data-ord=\"10\"><span class=\"rn\">10번 · 단서</span><div class=\"rc\"><div class=\"e\">Once we see beyond the narrative</div><div class=\"k\">일단 우리가 그 이야기를 넘어서 보게 된다면</div></div><div class=\"rc\"><div class=\"e\">that genetics are (e) destiny,</div><div class=\"k\">유전적 특성이 (e)운명이라는</div></div><div class=\"rc ckc\"><div class=\"e\">we can <span class=\"cw\">take ownership of our health</span>.</div><div class=\"k\"><span class=\"cw\">우리는 자신의 건강에 대한 소유권을 가질 수 있다</span></div></div><div class=\"rnat\">일단 우리가 유전적 특성이 (e)운명이라는 이야기를 넘어서 보게 된다면 우리는 자신의 건강에 대한 소유권을 가질 수 있다.</div><div class=\"rst\"><b>유전이 운명이라는 생각을 넘어서면</b>, 이 건강은 내 손에 달려요. = 지문 10번 결론이라 제목은 “건강은 유전자만이 아니라 우리 손에”예요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">This allows us to see</div><div class=\"k\">이것은 우리가 알 수 있게 해 주며</div></div><div class=\"rc\"><div class=\"e\">how “choiceless” we once were</div><div class=\"k\">자신이 한때 얼마나 ‘선택권이 없는’ 상태였는지</div></div><div class=\"rc\"><div class=\"e\">and empowers us with the ability</div><div class=\"k\">우리에게 능력을 부여한다</div></div><div class=\"rc ckc\"><div class=\"e\">to <span class=\"cw\">create real and lasting change</span>.</div><div class=\"k\"><span class=\"cw\">실제적이고 지속적인 변화를 만들어 낼 수 있는</span></div></div><div class=\"rnat\">이것은 우리가 자신이 한때 얼마나 ‘선택권이 없는’ 상태였는지 알 수 있게 해 주며 우리에게 실제적이고 지속적인 변화를 만들어 낼 수 있는 능력을 부여한다.</div><div class=\"rst\">그러면 예전에 내가 얼마나 손 놓고 있었는지 보이고, 오래가는 진짜 변화도 만들 수 있어요. = 지문 11번.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"genetic determinism\" data-m=\"유전자 결정론\"><b>genetic determinism</b>유전자 결정론</button><button type=\"button\" class=\"wdb\" data-w=\"destined\" data-m=\"~할 운명인\"><b>destined</b>~할 운명인</button><button type=\"button\" class=\"wdb\" data-w=\"inherit\" data-m=\"물려받다\"><b>inherit</b>물려받다</button><button type=\"button\" class=\"wdb\" data-w=\"predetermined\" data-m=\"미리 정해진\"><b>predetermined</b>미리 정해진</button><button type=\"button\" class=\"wdb\" data-w=\"take ownership of\" data-m=\"~에 대한 주도권을 갖다\"><b>take ownership of</b>~에 대한 주도권을 갖다</button><button type=\"button\" class=\"wdb\" data-w=\"empower\" data-m=\"힘을 부여하다\"><b>empower</b>힘을 부여하다</button></div>", "12": "<p class=\"mtr\">마더텅 정답률 <b>60%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">8번 <b>But</b>(하지만)에서 방향이 뒤집혀요. 과학이 <b>더 알수록</b> 몸과 환경의 <b>다양한 상호 작용</b>이 드러나니, 이야기는 단순해지는 게 아니라 복잡해져야 해요.</p><div class=\"ck-step\"><span class=\"lab\">4번 · 처음 방향</span><div class=\"en\">Genetic determinism doesn’t (a) consider the role of family backgrounds, traumas, habits, or <mark>anything else within the environment</mark>.</div><p class=\"ko\">유전자 결정론은 가정 환경, 정신적 충격, 습관 또는 <mark>환경 내의 다른 어떤 것의</mark> 역할을 고려하지 않는다.</p></div><div class=\"ck-via\"><i>▼</i><span>But(하지만): 유전자만 보던 단순한 생각이 뒤집혀요</span></div><div class=\"ck-step\"><span class=\"lab\">8번 · 방향 전환</span><div class=\"en\"><mark>But the more science has learned</mark> about the body and its interaction with the environment around it …</div><p class=\"ko\"><mark>하지만</mark> 신체와 그 주변 환경의 상호 작용에 대해 <mark>과학이 더 많이 알게 될수록</mark> …</p></div><div class=\"ck-via\"><i>▼</i><span>더 알수록 더 단순해진다? 방향이 거꾸로예요</span></div><div class=\"ck-step\"><span class=\"lab\">문제지 ④번 자리 (8번 끝)</span><div class=\"en\">… the more <u>(d) simplistic</u> the story becomes.</div><p class=\"ko\">그 이야기는 더욱 ( 단순해진다? ) → 복잡해진다가 맞아요</p></div><div class=\"ck-via\"><i>▼</i><span>이야기가 복잡한 이유: 놀랍도록 다양한 상호 작용</span></div><div class=\"ck-step key\"><span class=\"lab\">9번 · 결정적 단서</span><div class=\"en\">We are not merely expressions of coding but products of <mark>a remarkable variety of interactions</mark> …</div><p class=\"ko\">우리는 단지 (유전)암호화의 표현이 아니라 <mark>놀랍도록 다양한 상호 작용</mark>의 산물이다.</p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">simplistic(단순한) ↔ complicated(복잡한)</p><p class=\"gr\">the more A(A할수록), the more B(더 B하다)에서 A와 B의 방향이 같아야 해요. 알게 되는 것이 많아질수록 이야기는 complicated(복잡한) 쪽으로 가요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>The more pieces a puzzle has, the more complicated it becomes.</div><div class=\"ko\">퍼즐 조각이 많을수록 퍼즐은 더 복잡해져요. (많아짐 → 복잡)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>The more pieces a puzzle has, the more simplistic it becomes.</div><div class=\"ko\">조각이 많을수록 더 단순해진다? 방향이 거꾸로라 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>This game has only one button, so it is simple.</div><div class=\"ko\">이 게임은 버튼이 하나뿐이라 단순해요. (적음 → 단순)</div></div><p class=\"gb\">지문 8번도 과학이 몸과 환경의 상호 작용을 더 많이 알게 될수록이니, simplistic(단순한)이 아니라 complicated(복잡한)여야 해요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">(d) simplistic → complicated (복잡한)<small>9번처럼 상호 작용이 놀랍도록 다양하니 이야기는 복잡해져요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">(e) destiny 운명</span><span class=\"why\">10번은 “유전이 운명이라는 이야기를 넘어서면”이에요. 넘어서야 할 그 이야기가 3번 destined(운명인)와 같으니 destiny(운명)가 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">(a) consider 고려하다</span><span class=\"why\">유전자 결정론은 2번처럼 태어날 때 다 정해진다고 보니, 가정 환경·습관 같은 환경을 고려하지 않는다(doesn’t consider)가 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">(b) active 능동적인</span><span class=\"why\">건강이 태어날 때 정해진다면 우리가 할 일이 없죠. 그래서 5번 not active participants(능동적인 참여자가 아니다)가 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">(c) necessary 필요한</span><span class=\"why\">7번 If something is predetermined(무언가가 미리 정해져 있다면)이니, DNA(유전자) 너머를 볼 필요가 없다(not necessary)가 맞아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Since the turn of the twentieth century</div><div class=\"k\">20세기로 전환된 이래로</div></div><div class=\"rc\"><div class=\"e\">we’ve believed in genetic causes of diagnoses</div><div class=\"k\">우리는 진단의 유전적인 원인을 믿어 왔다</div></div><div class=\"rc\"><div class=\"e\">— a theory called genetic determinism.</div><div class=\"k\">즉 유전자 결정론이라 불리는 이론을</div></div><div class=\"rnat\">20세기로 전환된 이래로 우리는 진단의 유전적인 원인, 즉 유전자 결정론이라 불리는 이론을 믿어 왔다.</div><div class=\"rst\">우리 가족은 다 이가 약해서 충치가 잘 생겨요. 그래서 “충치는 유전이야” 하고 믿어 왔어요. = 지문 1번의 유전자 결정론이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Under this model,</div><div class=\"k\">이 모델하에서</div></div><div class=\"rc\"><div class=\"e\">our genes (and subsequent health)</div><div class=\"k\">우리의 유전자는 (그리고 차후의 건강은)</div></div><div class=\"rc\"><div class=\"e\">are determined at birth.</div><div class=\"k\">태어날 때 결정된다</div></div><div class=\"rnat\">이 모델하에서 우리의 유전자는 (그리고 차후의 건강은) 태어날 때 결정된다.</div><div class=\"rst\">이 생각대로라면 내 이도, 내 건강도 태어날 때 이미 다 정해져 있는 거예요. = 지문 2번.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div 은 “우리가 왜 그렇게 가만히 있겠어?” 하고 물어요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">If something is predetermined,</div><div class=\"k\">만약 무언가가 미리 결정되어 있다면</div></div><div class=\"rc\"><div class=\"e\">it’s not (c) necessary</div><div class=\"k\">(c)필요하지 않다</div></div><div class=\"rc\"><div class=\"e\">to look at anything beyond our DNA.</div><div class=\"k\">우리의 DNA를 넘어서 어떤 것을 보는 것이</div></div><div class=\"rnat\">만약 무언가가 미리 결정되어 있다면 우리의 DNA를 넘어서 어떤 것을 보는 것이 (c)필요하지 않다.</div><div class=\"rst\">이미 정해졌다면 유전 말고 다른 걸 살펴볼 <b>필요</b>(necessary 필요한)가 없으니까요. = 지문 7번.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">But the more science has learned</span></div><div class=\"k\"><span class=\"cw\">하지만 과학이 더 많이 알게 될수록</span></div></div><div class=\"rc\"><div class=\"e\">about the body and its interaction</div><div class=\"k\">신체와 그것의 상호 작용에 대해</div></div><div class=\"rc\"><div class=\"e\">with the environment around it</div><div class=\"k\">그 주변 환경과의</div></div><div class=\"rc\"><div class=\"e\">(in its various forms,</div><div class=\"k\">(다양한 형태로,</div></div><div class=\"rc\"><div class=\"e\">from our nutrition to our relationships</div><div class=\"k\">우리의 영양에서부터 우리의 관계</div></div><div class=\"rc\"><div class=\"e\">to our racially oppressive systems),</div><div class=\"k\">그리고 우리의 인종적으로 억압적인 시스템에 이르기까지)</div></div><div class=\"rc ckc\"><div class=\"e\">the more (d) <span class=\"cw\">complicated</span> the story becomes.</div><div class=\"k\">그 이야기는 더욱 (d)<span class=\"cw\">복잡해진다</span> ※ 문제지엔 simplistic(단순한)으로 되어 있음</div></div><div class=\"rnat\">하지만 과학이 신체와 그것의 그 주변 환경(우리의 영양에서부터, 우리의 관계 그리고 우리의 인종적으로 억압적인 시스템에 이르기까지의 다양한 형태로)과의 상호 작용에 대해 더 많이 알게 될수록, 그 이야기는 더욱 (d)단순해진다(→복잡해진다).</div><div class=\"rst\"><b>하지만</b>(But) 과학이 더 알수록 충치는 간식·습관·환경과 얽혀 있었어요. 그러니 이야기는 <b>복잡해져요</b>(complicated). 단순해진다면 틀려요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">We are not merely expressions of coding</div><div class=\"k\">우리는 단지 (유전)암호화의 표현이 아니라</div></div><div class=\"rc ckc\"><div class=\"e\">but products of <span class=\"cw\">a remarkable variety of interactions</span></div><div class=\"k\"><span class=\"cw\">놀랍도록 다양한 상호 작용</span>의 산물이다</div></div><div class=\"rc\"><div class=\"e\">that are both within and outside of our control.</div><div class=\"k\">우리의 통제 내부와 외부 모두에 있는</div></div><div class=\"rnat\">우리는 단지 (유전)암호화의 표현이 아니라 우리의 통제 내부와 외부 모두에 있는 놀랍도록 다양한 상호 작용의 산물이다.</div><div class=\"rst\">나는 유전자로만 만들어진 게 아니라, 내가 바꿀 수 있는 것과 없는 것이 다양하게 얽혀 만들어져요. = 지문 9번.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">Once we see beyond the narrative</div><div class=\"k\">일단 우리가 그 이야기를 넘어서 보게 된다면</div></div><div class=\"rc\"><div class=\"e\">that genetics are (e) destiny,</div><div class=\"k\">유전적 특성이 (e)운명이라는</div></div><div class=\"rc\"><div class=\"e\">we can take ownership of our health.</div><div class=\"k\">우리는 자신의 건강에 대한 소유권을 가질 수 있다</div></div><div class=\"rnat\">일단 우리가 유전적 특성이 (e)운명이라는 이야기를 넘어서 보게 된다면 우리는 자신의 건강에 대한 소유권을 가질 수 있다.</div><div class=\"rst\">유전이 <b>운명</b>(destiny)이라는 이야기를 넘어서면, 이 건강은 내 손에 달려요. = 지문 10번, 3번의 운명과 같은 말이에요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">This allows us to see</div><div class=\"k\">이것은 우리가 알 수 있게 해 주며</div></div><div class=\"rc\"><div class=\"e\">how “choiceless” we once were</div><div class=\"k\">자신이 한때 얼마나 ‘선택권이 없는’ 상태였는지</div></div><div class=\"rc\"><div class=\"e\">and empowers us with the ability</div><div class=\"k\">우리에게 능력을 부여한다</div></div><div class=\"rc\"><div class=\"e\">to create real and lasting change.</div><div class=\"k\">실제적이고 지속적인 변화를 만들어 낼 수 있는</div></div><div class=\"rnat\">이것은 우리가 자신이 한때 얼마나 ‘선택권이 없는’ 상태였는지 알 수 있게 해 주며 우리에게 실제적이고 지속적인 변화를 만들어 낼 수 있는 능력을 부여한다.</div><div   return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
  mmInit();
}
/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(S.sub&&!S.mmS){S.mmS=1;S.mmP=1;save();WN.hw(lv,day,S.sub.s+'/'+N+(S.mmD?' ✓':''));}else if(!S.sub&&!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
