<style>

<body>
<div id="app"></div>
<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:Canvas;color:CanvasText;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';
    document.body.appendChild(d);
    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');
    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';
      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();

: [[2, "공무원들은 눈에 띄는 여러 위치에 일련의 파란 전등을 설치함으로써 도시를 아름답게 꾸미도록 팀을 고용했다."], [4, "몇 달이 지나고 도시의 범죄 통계학자들이 놀랄 만한 경향을 알아차렸는데, 최근에 파란빛에 휩싸인 장소들이 범죄 활동에 있어서 극적인 감소를 경험했다는 것이다(파란 불빛이 있는 장소에서 범죄율이 크게 줄었다)."], [6, "그 전등은 결코 범죄를 줄이기 위해 설계된 것이 아니었지만, 그것(파란 전등)들이 하고 있는 것처럼 보였던 것은 바로 그것(범죄를 줄이는 것)이었다."]], "why": ["제목 문제는 <b>처음 의도<\/b>와 <b>실제 결과<\/b>가 어긋나는 지점을 잡아야 합니다", "2번에서 파란 전등을 설치한 이유는 <b>도시를 아름답게 꾸미기(beautify)<\/b> 위해서였습니다", "그런데 4번에서 파란빛이 있는 곳의 <b>범죄가 크게 줄었다<\/b>고 합니다", "6번은 <b>never designed to reduce crime, but that's exactly what they appeared to be doing<\/b>이라며 이 점을 정리합니다", "즉 '<b>의도하지 않은 결과<\/b>'가 글 전체의 뼈대입니다", "4번의 <b>noticed a striking trend<\/b>(놀랄 만한 경향)가 정답에서는 <b>Unexpected Outcome<\/b>(예상치 못한 결과)으로 바뀌어 표현되었습니다."], "ch": [{"n": "①", "t": "Turn Lights off for Our Planet", "g": "우리 행성을 위해 불을 꺼라", "ok": false, "e": ["'우리 행성을 위해 불을 꺼라'는 내용은 지문에 없습니다", "지문은 파란 전등을 <b>설치<\/b>해서 생긴 일(2번)을 다룹니다."]}, {"n": "②", "t": "Blue Makes People Feel Lonely", "g": "파란색은 사람들을 외롭게 느끼도록 만든다", "ok": false, "e": ["파란 전등은 3번에서 <b>calming(차분하게 하는)<\/b>, <b>soothing(진정시키는)<\/b> 빛으로 나옵니다", "사람들을 외롭게 만든다는 말은 지문에 없습니다."]}, {"n": "③", "t": "Colorful Lights Lifting Your Spirits", "g": "당신의 기운을 돋우는 형형색색의 불빛", "ok": false, "e": ["지문의 불빛은 <b>파란 전등<\/b>입니다(2번)", "또 글의 초점은 기분을 돋우는 일이 아니라 <b>범죄 감소<\/b>(4번)입니다."]}, {"n": "④", "t": "Unexpected Outcome from Blue Lights", "g": "파란 전등의 예상치 못한 결과", "ok": true, "e": ["6번의 <b>never designed to reduce crime, but ~ exactly what they appeared to be doing<\/b>이 곧 '<b>예상치 못한 결과<\/b>'입니다", "미화(2번)가 목적이었는데 범죄 감소(4번)가 따라온 흐름 전체를 담습니다."]}, {"n": "⑤", "t": "Cleaner Streets Lead to Lower Crime Rates", "g": "더욱 깨끗한 거리는 범죄율을 낮추게 한다", "ok": false, "e": ["지문은 거리의 청결이 아니라 <b>파란 전등<\/b>(2번)을 다룹니다", "'더 깨끗한 거리가 범죄율을 낮춘다'는 내용은 지문에 나오지 않습니다."]}], "tr": ["2000년도에, Scotland에 있는 Glasgow(글래스고)시의 정부는 우연히 주목할 만한 범죄 예방 전략을 발견한 것으로 보였다.", "공무원들은 눈에 띄는 여러 위치에 일련의 파란 전등을 설치함으로써 도시를 아름답게 꾸미도록 팀을 고용했다.", "이론적으로, 파란 전등은 밤에 도시의 대부분을 밝히는 노란 전등과 흰 전등보다 더욱 매력적이고 차분하게 하며, 정말로 그 파란 전등은 진정시키는 빛을 발하는 것 같았다.", "몇 달이 지나고 도시의 범죄 통계학자들이 놀랄 만한 경향을 알아차렸는데, 최근에 파란빛에 휩싸인 장소들이 범죄 활동에 있어서 극적인 감소를 경험했다는 것이다(파란 불빛이 있는 장소에서 범죄율이 크게 줄었다).", "Glasgow의 파란 전등은 경찰차 꼭대기에 있는 그 전등처럼 보여서, (그 파란 전등은) 경찰이 항상 지켜보고 있다는 것을 암시하는 듯했다.", "그 전등은 결코 범죄를 줄이기 위해 설계된 것이 아니었지만, 그것(파란 전등)들이 하고 있는 것처럼 보였던 것은 바로 그것(범죄를 줄이는 것)이었다."], "ps": [{"n": 1, "ch": [{"e": "<b>In 2000<\/b>,", "k": "<b>2000년도에<\/b>,"}, {"e": "the government in Glasgow, Scotland,", "k": "Scotland에 있는 Glasgow(글래스고)시의 정부는"}, {"e": "<b>appeared to stumble on<\/b>", "k": "<b>우연히 발견한 것으로 보였다<\/b>"}, {"e": "a remarkable crime prevention strategy.", "k": "주목할 만한 범죄 예방 전략을."}], "easy": "글래스고 시 정부가 뜻밖에 훌륭한 범죄 예방 방법을 찾은 것처럼 보였다는 말이에요.", "gist": "글의 출발점 — 우연히 발견한 범죄 예방 전략이 있다."}, {"n": 2, "ch": [{"e": "Officials <b>hired a team<\/b>", "k": "공무원들은 <b>팀을 고용했다<\/b>"}, {"e": "to <b>beautify<\/b> the city", "k": "도시를 <b>아름답게 꾸미도록<\/b>"}, {"e": "by installing a series of <b>blue lights<\/b>", "k": "일련의 <b>파란 전등<\/b>을 설치함으로써"}, {"e": "in various noticeable locations.", "k": "눈에 띄는 여러 위치에."}], "easy": "도시를 예쁘게 만들려고 눈에 띄는 곳 여러 군데에 파란 전등을 달았어요.", "gist": "처음의 의도 — 목적은 범죄 예방이 아니라 도시 미화였다."}, {"n": 3, "ch": [{"e": "<b>In theory<\/b>,", "k": "<b>이론적으로<\/b>,"}, {"e": "blue lights are <b>more attractive and calming<\/b>", "k": "파란 전등은 <b>더욱 매력적이고 차분하게 하며<\/b>"}, {"e": "than the yellow and white lights", "k": "노란 전등과 흰 전등보다"}, {"e": "that illuminate much of the city at night,", "k": "밤에 도시의 대부분을 밝히는,"}, {"e": "and <b>indeed<\/b> the blue lights seemed to cast a <b>soothing glow<\/b>.", "k": "정말로 그 파란 전등은 <b>진정시키는 빛<\/b>을 발하는 것 같았다."}], "easy": "원래 파란 전등은 노란색·흰색보다 보기 좋고 마음이 가라앉는데, 실제로도 그렇게 보였어요.", "gist": "파란 전등의 분위기 — 매력적이고 차분하다."}, {"n": 4, "ch": [{"e": "<b>Months passed<\/b>", "k": "<b>몇 달이 지나고<\/b>"}, {"e": "and the city’s crime statisticians", "k": "도시의 범죄 통계학자들이"}, {"e": "<b>noticed a striking trend<\/b>:", "k": "<b>놀랄 만한 경향을 알아차렸는데<\/b>,"}, {"e": "The locations that were newly <b>bathed in blue<\/b>", "k": "최근에 <b>파란빛에 휩싸인<\/b> 장소들이"}, {"e": "experience function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function shuffle(arr,seed){const a=arr.slice();let s=hash(seed)||1;for(let i=a.length-1;i>0;i--){s=Math.imul(s^(s>>>15),2246822519)>>>0;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
const WS=WORDS.sets[0];

function hdr(){
  const on=id=>(view===id)?'on':'';
  const tabs=[['word','1','유반의어','답 맞춰보기'],['dk','2','직독직해','해석 맞춰보기'],['submit','3','답안지','정답 입력'],['exp','4','해설',S.sub?'정답·근거':'제출하면 열림']];
  return `<header><div class="wrap"><div class="row1"><h1>${esc(TITLE)}</h1><span><button class="link gohome" data-v="home">메뉴</button><a class="link" href="index.html">목록</a></span></div><div class="tabs">`+
    tabs.map(t=>`<button class="tab ${on(t[0])}" data-v="${t[0]}" ${(t[0]==='exp'&&!S.sub)?'disabled':''}><span class="t1"><span class="n">${t[1]}</span>${t[2]}</span><span class="t2">${t[3]}</span></button>`).join('')+
    `</div></div></header>`;
}
function noteList(){
  const out=[],ck=S.checks[WS.id]||{};
  WS.words.forEach((w,i)=>{
    const c=ck[i];if(!c)return;
    const parts=['m','s','a'].filter(p=>c[p]&&(p==='m'||w[p]));
    if(parts.length)out.push({i:i,w:w,parts:parts});
  });
  return out;
}
function render(){
  if(view==='home')renderHome();
  else if(view==='dk')renderDk();
  else if(view==='word')renderWord();
  else if(view==='note')renderNote();
  else if(view==='quiz')renderQuiz();
  else if(view==='result')renderResult();
  else if(view==='submit')renderSubmit();
  else if(view==='exp')renderExp();
  window.scrollTo(0,0);
}

 "The blue lights in Glasgow, / which mimicked<sup>1</sup> the lights atop<sup>2</sup> police cars, / seemed to imply<sup>3</sup> / that the police were always watching.", "notes": [["1", "mimic", "흉내 내다"], ["2", "atop", "~의 꼭대기에"], ["3", "imply", "암시하다"]], "lit": "글래스고의 그 파란 불빛은 / 그런데 그것은 경찰차 위의 불빛을 흉내 낸 것이었다 / 암시하는 것처럼 보였다 / 경찰이 늘 지켜보고 있다는 것을", "nat": "경찰차 지붕 위 경광등을 닮은 글래스고의 파란 불빛은 마치 경찰이 늘 지켜보고 있다고 말하는 듯했다.", "ana": "콤마 + <b>which</b>는 <b>계속적 용법</b>이고 선행사는 <b>The blue lights in Glasgow</b>입니다. 콤마와 콤마 사이는 통째로 <b>삽입</b>이므로 먼저 건너뛰고 <b>The blue lights ~ seemed to imply</b>로 뼈대를 잡아야 진짜 동사 seemed가 보입니다. mimicked를 주절 동사로 착각하면 뒤의 seemed가 갈 곳을 잃습니다. <b>imply that ~</b>의 that은 <b>명사절 접속사</b>이고, <b>were watching</b>은 시제 일치를 받은 <b>과거진행</b>입니다.", "pe": "The blue lights \u0001in Glasgow\u0002, / \u0001which mimicked<sup>1</sup> the lights atop<sup>2</sup> police cars\u0002, / seemed to imply<sup>3</sup> / that the police were \u0001always\u0002 watching.", "pk": "\u0001글래스고의\u0002 그 파란 불빛은 / \u0001그런데 그것은 경찰차 위의 불빛을 흉내 낸 것이었다\u0002 / 암시하는 것처럼 보였다 / 경찰이 \u0001늘\u0002 지켜보고 있다는 것을", "core": "파란 불빛은 경찰이 늘 지켜보고 있다고 암시하는 듯했다.", "tags": ["주어. in Glasgow = 전치사구(형용사구): The blue lights를 꾸밈", "which mimicked ~ = <b>계속적 관계절</b>(형용사절): The blue lights in Glasgow를 꾸밈, 삽입이라 건너뛰고 동사 찾기", "동사: <b>seemed to imply</b> ('~하는 듯했다')", "imply의 목적어절 (that = 명사절 접속사), 시제 일치로 were watching. always = 부사: watching 꾸밈"], "steps": [{"t": "이 문장은 <b>S+seem+C(to부정사)의 2형식</b>이다. 주어와 동사 사이에 which절이 끼어들어서 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: The blue lights (그 파란 불빛)", "V: seemed (seem ~인 듯하다의 과거형)", "C: to imply that the police were always watching (경찰이 늘 지켜보고 있음을 암시하는 것. seem 뒤의 to부정사가 보어이다 (문형 기준). imply 암시하다)", "뼈대 = <b>The blue lights seemed to imply (that ~)</b>"]}, {"t": "<b>in Glasgow</b>는 전치사구(형용사구)이다. The blue lights를 꾸민다 (글래스고의)."}, {"t": "<b>which mimicked the lights atop police cars</b>는 <b>계속적 관계절(형용사절)</b>이다. 콤마 사이에 삽입되어 The blue lights in Glasgow를 꾸민다.", "sub": ["which = The blue lights in G 부를 전하며, Sophia Walker 드림"]], "evh": "3 · 5 · 7번 문장", "ev": [{"en": true, "h": "However, I would like to change my recipe if it is possible. / I couldn't see any information about changing recipes. / Please let me know if I can change my submitted recipe."}, {"en": false, "h": "이메일·편지 글의 목적은 <b>However 뒤</b>와 <b>마지막 요청 문장</b>에 있습니다. 3번의 <b>would like to change my recipe</b>가 용건을 처음 꺼내고, 5번이 '<b>변경에 관한 정보를 못 찾았다</b>'로 왜 물어보는지를 설명하며, 7번의 <b>Please let me know if I can change ~</b>가 요청을 확정합니다. 2번의 '제출했다'는 상황 설명일 뿐 목적이 아닙니다. 즉 이 글은 '<b>변경이 가능한지 문의</b>'하는 글입니다."}], "opts": [{"n": "①", "t": "요리 대회 일정을 안내하려고", "a": false, "x": true, "trap": false, "e": "일정(date, time)은 4번에서 '<b>그것밖에 못 찾았다</b>'며 불만처럼 언급될 뿐, 필자가 상대에게 알려 주는 정보가 아닙니다. 안내하는 쪽은 필자가 아니라 웹사이트입니다."}, {"n": "②", "t": "요리 대회 심사 결과를 확인하려고", "a": false, "x": true, "trap": false, "e": "심사(judge)나 결과(result)라는 말은 한 줄도 없습니다. prizes(상품)를 보고 '결과'로 넘겨짚기 쉽습니다."}, {"n": "③", "t": "요리법 변경 가능 여부를 문의하려고", "a": true, "x": false, "trap": false, "e": "3번의 <b>change my recipe if it is possible</b>과 7번의 <b>let me know if I can change</b>가 그대로 '변경 가능 여부 문의'입니다. if가 두 번 다 '<b>~인지 아닌지</b>'로 쓰인 점이 결정적입니다."}, {"n": "④", "t": "새로운 요리법 개발을 요청하려고", "a": false, "x": true, "trap": true, "e": "새 요리법은 <b>필자가 이미 만들었습니다</b>(6번 I have just created). 상대에게 만들어 달라고 부탁하는 것이 아닙니다."}, {"n": "⑤", "t": "요리 대회 불참을 통보하려고", "a": false, "x": true, "trap": false, "e": "필자는 대회를 <b>계속 나가고 싶어서</b> 요리법을 바꾸려는 것입니다. 불참(absence)이라는 말도, 그런 뉘앙스도 없습니다."}], "w": [["submit", "제출하다"], ["application", "지원서, 신청서"], ["recipe", "요리법"], ["annual", "연례의"], ["contest", "대회, 경연"], ["prize", "상, 상품"], ["the one", "(앞서 말한) 그것"], ["look forward to", "~을 기대하다"], ["response", "답장, 응답"], ["Best Regards", "(맺음말) 안부를 전하며"]]}, {"q": "02", "type": "안내문 일치", "src": "2015년 9월 27번", "ans": "⑤", "tr": [["1", "박물관에서의 밤"], ["2", "이집트 조각상과 함께 잠들거나 미라 옆에서 잠을 깨는 걸 상상해 본 적 있나요?"], ["3", "'박물관에서의 밤'으로 오세요! 해가 진 뒤 박물관을 탐험하며 하룻밤을 보낼 수 있습니다."], ["4", "날짜 &amp; 시간: 매달 셋째 주말 (토요일 오후 6시 30분 ~ 일요일 오전 7시 30분)"], ["5", "입장료(가격): 8~13세만 (아동 1인당 40달러)"], ["6", "포함 사항: 활동 자료, 하룻밤 숙박, 아침 식사"], ["7", "(주의: 아침 식사 전까지는 음식이 제공되지 않으니 간식을 가져오셔야 합니다.)"], ["8", "예약 정보"], ["9", "◆ 박물관 웹사이트의 'Night at the Museum' 페이지에서 온라인으로 티켓을 예약하세요."], ["10", "◆ 티켓을 예약하려면 박물관 웹사이트에 회원으로 가입해야 합니다."], ["11", "◆ 환불은 행사 2주 전까지만 가능합니다."]], "evh": "11번 문장", "ev": [{"en": true, "h": "Refunds can only be given up to two weeks before the event."}, {"en": false, "h": "안내문 문제는 <b>선지 순서와 본문 순서가 거의 같습니다</b>. 각 선지를 본문의 해당 줄과 <b>한 줄씩 맞대어</b> 지워 나가세요. 마지막 줄 <b>up to two weeks before the event</b>는 '행사 <b>2주 전까지</b>'라는 뜻이고, only이 붙어 그 이후에는 환불이 안 된다는 제한을 못 박습니다. 선지 ⑤가 이 문장을 그대로 옮긴 것이라 <b>일치</b>합니다."}], "opts": [{"n": "①", "t": "매주 주말에 진행된다.", "a": false, "x": true, "trap": false, "e": "본문은 <b>Every third weekend of the month</b>, 즉 '<b>매달 셋째 주말</b>'입니다. every만 보고 '매주'로 읽으면 걸립니다."}, {"n": "②", "t": "8세 이상이면 누구나 참여할 수 있다.", "a": false, "x": true, "trap": true, "e": "<b>8 to 13-year-olds only</b>라서 8세 이상이 아니라 <b>8세부터 13세까지</b>로 위쪽도 막혀 있습니다. only가 핵심입니다."}, {"n": "③", "t": "음식 반입이 불가능하다.", "a": false, "x": true, "trap": false, "e": "오히려 <b>you should bring snacks</b>, 즉 간식을 <b>가져오라</b>고 권합니다. 사실과 정반대입니다."}, {"n": "④", "t": "박물관 웹사이트 회원 가입 없이 티켓 예약이 가능하다.", "a": false, "x": true, "trap": false, "e": "<b>You must sign up as a member ~ to book tickets</b>라서 회원 가입이 <b>필수</b>입니다. must를 놓치면 반대로 읽게 됩니다."}, {"n": "⑤", "t": "행사 2주전까지만 환불이 가능하다.", "a": true, "x": false, "trap": false, "e": "마지막 줄 <b>Refunds can only be given up to two weeks before the event</b>와 그대로 일치합니다."}], "w": [["mummy", "미라"], ["explore", "탐험하다"], ["admission", "입장, 입장료"], ["including", "포함 사항"], ["material", "자료, 재료"], ["accommodation", "숙박 시설"], ["provide", "제공하다"], ["booking", "예약"], ["sign up as a member", "회원으로 가입하다"], ["refund", "환불(금)"]]}, {"q": "03", "type": "글의 제목", "src": "2016년 9월 23번", "ans": "④", "tr": [["1", "2000년에 스코틀랜드 글래스고 정부는 놀라운 범죄 예방 전략을 우연히 발견한 것처럼 보였다."], ["2", "관계자들은 도시를 아름답게 꾸미려고 눈에 잘 띄는 여러 장소에 파란 불빛을 죽 설치할 팀을 고용했다."], ["3", "이론상 파란 불빛 function buildQuestions(){

      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}

    });
  });
  return qs;
}

    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
</body>
</html>
