<title>고1 미니모의고사 12회 01–06번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:84px}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}
.ko{color:var(--sub);font-size:14px;margin-left:6px}
.cell.bad{background:var(--badbg);border-color:var(--bad)}
.cell.bad .tag{background:var(--bad)}
.locked .cell{pointer-events:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.done .opt{pointer-events:none}
.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}
.hcard .chip{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--sub)}
.hcard .chip.ok{background:var(--goodbg);color:var(--good)}
.hcard .chip.warn{background:var(--badbg);color:var(--bad)}
.hcard[disabled]{opacity:.55}
details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.th .hd{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:6px}
.th ol{list-style:none;margin:0;padding:0;counter-reset:n}
.th li{counter-increment:n;position:relative;padding:7px 0 7px 30px;font-size:15px;line-height:1.7;border-top:1px dashed #cfdcf0}
.th li:first-child{border-top:0}
.th li:before{content:counter(n);position:absolute;left:0;top:9px;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;text-align:center;line-height:21px}
.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.th .sub{margin:3px 0 0;color:#444;font-size:14.5px;line-height:1.7}
.sc .lay.sum{border-left:4px solid #2e7d32;background:#f1f8f1}
/* ---- 새 직독직해·해설 화면 ---- */
.sc{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden;background:var(--bg)}
.sc-h{padding:11px 14px 10px;background:#eef2f8;border-bottom:1px solid var(--line)}
.sc-h .no2{display:inline-block;min-width:26px;height:26px;line-height:26px;border-radius:13px;background:var(--accent);color:#fff;font-weight:800;font-size:13px;text-align:center;padding:0 7px;margin-right:8px}
.sc-h .at{font-size:13px;color:var(--sub)}
.sc-h .tt{display:block;margin-top:7px;font-size:15.5px;font-weight:800;color:var(--accent);line-height:1.45}
.sc-b{padding:10px 12px 12px}
.sc .ch{margin-bottom:6px}
.sc .ce{font-size:17px}
.sc .ce sup,.nt sup{font-size:10px;font-weight:800;color:#b8651f;margin-left:1px}
.nts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.nt{font-size:13.5px;line-height:1.5;background:#fbf6ee;border:1px solid #f0e2cd;border-radius:8px;padding:5px 9px;color:#4a3a22}

.sc .lay{border-radius:10px}
.sc .lay.nat{border-left:4px solid var(--accent);background:#f7f9fc}

.sc .lb{margin-bottom:4px}
.qc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}
.qchip small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-bottom:1px}
.qchip.o{border-color:var(--good);background:var(--goodbg)}
.qchip.x{border-color:var(--bad);background:var(--badbg)}
.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.trs{list-style:none;margin:0;padding:0;background:var(--soft);border-radius:10px;padding:8px 12px}
.trs li{font-size:15px;line-height:1.75;padding:2px 0}
.trs .n{display:inline-block;min-width:20px;font-size:12px;color:var(--sub);font-weight:700}
.evx{background:var(--goodbg);border:1px solid #bfe0cd;border-radius:10px;padding:10px 12px}

.opx{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px;background:var(--bg)}

.wds{display:flex;flex-wrap:wrap;gap:6px}
.wds span{font-size:14px;background:var(--soft);border-radius:8px;padding:5px 9px;line-height:1.45}
.wds b{margin-right:5px}
.toq{display:block;width:100%;margin-top:14px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}
details.sub2{margin:12px 0 0}
details.sub2>summary{list-style:none;cursor:pointer;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px;padding:6px 0}
details.sub2>summary::-webkit-details-marker{display:none}

.cr{color:#A3102E;font-weight:700}
.sc .lay.core{border-left:4px solid #2e7d32;background:#f1f8f1}
.ct{display:none;margin:7px 0 2px;padding:6px 9px;border-left:3px solid #d9a21b;background:#fff8e6;border-radius:6px;font-size:13.5px;line-height:1.55;color:#4d3b05}

.rst{margin-top:8px;background:#fff8e1;border:1px solid #efe3b8;border-left:4px solid #d9a21b;border-radius:8px;padding:8px 10px;font-size:15px;line-height:1.7;word-break:keep-all}

  }

  }
  function DEL(w,src){var k=String(w||'').toLowerCase().trim(),hit=false;

var EXP={"01": "<p class=\"mtr\">마더텅 정답률 <b>85%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">주장은 <b>However</b>(그러나) 뒤, 그리고 <b>should never</b>(절대 ~해서는 안 된다)·<b>don’t</b>(~하지 마라) 같은 명령 신호에 있어요. 1~3번 ‘행동으로 판단하기’는 뒤집히기 전의 이야기예요.</p><div class=\"ck-step\"><span class=\"lab\">4번 문장 · 방향 전환</span><div class=\"en\"><mark>However,</mark> when someone exhibits some difficult behavior, you might want to <mark>reserve judgement</mark> for later.</div><p class=\"ko\"><mark>그러나,</mark> 누군가가 어떤 까다로운 행동을 보일 때, 당신은 나중으로 <mark>판단을 보류하고</mark> 싶을지도 모른다.</p></div><div class=\"ck-via\"><i>▼</i><span>6번의 ‘쟤는 심술궂어’ 같은 생각을 곧바로 하지 말라고 못 박아요</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 문장 · 결정적 단서</span><div class=\"en\">But you <mark>should never make such assumptions</mark> right away.</div><p class=\"ko\">하지만 당신은 곧바로 <mark>그러한 추정을 절대 해서는 안 된다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>하지 말 것 다음에 해야 할 것을 알려 줘요</span></div><div class=\"ck-step\"><span class=\"lab\">8번 문장 · 해야 할 일</span><div class=\"en\">You should give someone <mark>a second chance</mark> before you label them …</div><p class=\"ko\">당신이 그들에게 꼬리표를 붙이기 전에 …, 당신은 누군가에게 <mark>두 번째 기회를</mark> 주어야 한다.</p></div><div class=\"ck-via\"><i>▼</i><span>명령문 = 필자가 하고 싶은 말 그 자체</span></div><div class=\"ck-step key\"><span class=\"lab\">9번 문장 · 명령문으로 마무리</span><div class=\"en\">… so don’t eliminate a person from your life <mark>based on a brief observation</mark>.</div><p class=\"ko\">… 그러니 <mark>짧은 관찰을 기반으로</mark> 당신의 삶에서 사람을 제거하지 마라.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">단시간의 관찰로 타인을 성급하게 판단하지 마라.<small>9번 brief observation(짧은 관찰) + 7번 right away(곧바로)를 그대로 옮긴 말이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">말보다는 행동으로 삶의 모범을 보여라.</span><span class=\"why\">[반대] 2~3번 ‘말보다 행동’은 However(그러나) 앞, 뒤집히기 전의 일반론이에요. 게다가 내가 모범을 보이라는 말이 아니라 남의 행동을 보고 판단하는 이야기예요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">자신의 적성을 찾기 위해 다양한 경험을 쌓아라.</span><span class=\"why\">[지문에 없음] 적성이나 경험 쌓기는 한 번도 안 나와요. 지문의 대상은 ‘나’가 아니라 내가 판단하는 ‘다른 사람’이에요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">바람직하지 않은 습관을 고치기 위해 노력하라.</span><span class=\"why\">[지문에 없음] 6번 less-than-desirable behavior(별로 바람직하지 않은 행동)는 남의 행동이고, 고치라는 게 아니라 그걸 보고 곧바로 판단하지 말라는 거예요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">원만한 인간관계를 위해 칭찬을 아끼지 마라.</span><span class=\"why\">[지문에 없음] 9번에 best friend(가장 친한 친구)가 나오지만, 방법은 칭찬이 아니라 a second chance(두 번째 기회)를 주는 거예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">It is easy</div><div class=\"k\">쉽다</div></div><div class=\"rc\"><div class=\"e\">to judge people</div><div class=\"k\">사람들을 판단하는 것은</div></div><div class=\"rc\"><div class=\"e\">based on their actions.</div><div class=\"k\">그들의 행동을 기반으로.</div></div><div class=\"rnat\">사람들의 행동을 근거로 그들을 판단하는 것은 쉽다.</div><div class=\"rst\">새 학기 첫날, 짝꿍이 하는 행동만 보고 “쟤는 이런 애야” 하고 정하기는 쉬워요. = 지문 1번, 행동으로 사람을 판단하기 쉽다는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">We are often taught</div><div class=\"k\">우리는 흔히 배운다</div></div><div class=\"rc\"><div class=\"e\">to put more value in actions than words,</div><div class=\"k\">말보다 행동에 더 많은 가치를 두라고,</div></div><div class=\"rc\"><div class=\"e\">and for good reason.</div><div class=\"k\">그리고 그럴 만한 이유가 있다.</div></div><div class=\"rnat\">우리는 흔히 말보다 행동에 더 많은 가치를 두라고 배우는데, 거기에는 그럴 만한 이유가 있다.</div><div class=\"rst\">우리는 “말보다 행동을 봐라”라고 배우고, 그 말도 틀린 건 아니에요. 지문 2번도 그럴 만한 이유가 있다고 해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">The actions of others</div><div class=\"k\">다른 사람들의 행동은</div></div><div class=\"rc\"><div class=\"e\">often speak volumes</div><div class=\"k\">종종 많은 것을 말해 준다</div></div><div class=\"rc\"><div class=\"e\">louder than their words.</div><div class=\"k\">그들의 말보다 더 크게.</div></div><div class=\"rnat\">다른 사람들의 행동은 흔히 그들의 말보다 훨씬 더 많은 것을 말해 준다.</div><div class=\"rst\">말로는 “나 착해” 해도 행동을 보면 더 잘 알 수 있으니까요. = 지문 3번, 행동이 말보다 많은 걸 말해 준다는 거예요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">However,</span></div><div class=\"k\"><span class=\"cw\">그러나,</span></div></div><div class=\"rc\"><div class=\"e\">when someone exhibits some difficult behavior,</div><div class=\"k\">누군가가 어떤 까다로운 행동을 보일 때,</div></div><div class=\"rc\"><div class=\"e\">you might want to reserve judgement</div><div class=\"k\">당신은 판단을 보류하고 싶을지도 모른다</div></div><div class=\"rc\"><div class=\"e\">for later.</div><div class=\"k\">나중을 위해.</div></div><div class=\"rnat\">하지만 누군가가 어떤 까다로운 행동을 보일 때, 여러분은 판단을 나중으로 미루고 싶을 수도 있다.</div><div class=\"rst\"><b>그런데</b>(However) 짝꿍이 첫날 퉁명스럽게 굴었다면? 판단은 <b>잠깐 미뤄 두세요</b>(reserve judgement 판단을 보류하다). 지문 4번에서 글의 방향이 바뀌어요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">People are not always defined</div><div class=\"k\">사람들은 항상 규정되는 것은 아니다</div></div><div class=\"rc\"><div class=\"e\">by their behavior.</div><div class=\"k\">그들의 행동에 의해서.</div></div><div class=\"rnat\">사람들이 항상 자신의 행동으로만 규정되는 것은 아니다.</div><div class=\"rst\">그날 짝꿍은 그냥 배가 아팠을 수도 있어요. 지문 5번처럼, 사람이 늘 행동 하나로 정해지는 건 아니에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">It is common to think,</div><div class=\"k\">생각하는 것은 흔하다,</div></div><div class=\"rc\"><div class=\"e\">“He is so bossy,” or “She is so mean,”</div><div class=\"k\">“그는 너무 거들먹거려” 또는 “그녀는 너무 심술궂어”라고</div></div><div class=\"rc\"><div class=\"e\">after observing less-than-desirable behavior in someone.</div><div class=\"k\">누군가에게서 별로 바람직하지 않은 행동을 관찰한 후에.</div></div><div class=\"rnat\">누군가에게서 별로 바람직하지 않은 행동을 관찰한 후에 \"그는 너무 거들먹거려\" 또는 \"그녀는 너무 심술궂어\"라고 생각하는 것은 흔하다.</div><div class=\"rst\">그래도 우리는 한 번 보고 “쟤 완전 잘난 척해”, “쟤 심술궂어” 하고 생각하기 쉬워요. = 지문 6번의 bossy(거들먹거리는)·mean(심술궂은)이에요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">But you <span class=\"cw\">should never make such assumptions</span></div><div class=\"k\">하지만 당신은 <span class=\"cw\">그러한 추정을 절대 해서는 안 된다</span></div></div><div class=\"rc\"><div class=\"e\">right away.</div><div class=\"k\">곧바로.</div></div><div class=\"rnat\">하지만 여러분은 그런 추측을 곧바로 해서는 절대 안 된다.</div><div class=\"rst\"><b>하지만 그런 짐작은 곧바로 하면 절대 안 돼요</b>(should never 절대 ~해서는 안 된다). 지문 7번이 필자의 주장이에요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc\"><div class=\"e\">You should give someone a second chance</div><div class=\"k\">당신은 누군가에게 두 번째 기회를 주어야 한다</div></div><div class=\"rc\"><div class=\"e\">before you label them</div><div class=\"k\">당신이 그들(= 누군가)에게 꼬리표를 붙이기 전에</div></div><div class=\"rc\"><div class=\"e\">and shut them out forever.</div><div class=\"k\">그리고 그들을 영원히 차단하기 전에.</div></div><div class=\"rnat\">누군가에게 딱지를 붙이고 영원히 마음의 문을 닫아 버리기 전에, 한 번 더 기회를 주어야 한다.</div><div class=\"rst\">“쟤는 별로야” 하고 딱지를 붙이고 말도 안 걸기 전에, 한 번 더 기회를 주세요. = 지문 8번의 a second chance(두 번째 기회)예요.</div></div><div class=\"rds key\" data-ord=\"9\"><span class=\"rn\">9번 · 단서</span><div class=\"rc\"><div class=\"e\">You may find</div><div class=\"k\">당신은 발견할지도 모른다</div></div><div class=\"rc\"><div class=\"e\">a great co-worker or best friend</div><div class=\"k\">훌륭한 직장 동료나 가장 친한 친구를</div></div><div class=\"rc\"><div class=\"e\">in someone,</div><div class=\"k\">누군가에게서,</div></div><div class=\"rc\"><div class=\"e\">so don’t eliminate a person</div><div class=\"k\">그러니 사람을 제거하지 마라</div></div><div class=\"rc\"><div class=\"e\">from your life</div><div class=\"k\">당신의 삶에서</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">based on a brief observation.</span></div><div class=\"k\"><span class=\"cw\">짧은 관찰을 기반으로.</span></div></div><div class=\"rnat\">여러분은 어떤 사람에게서 훌륭한 직장 동료나 가장 친한 친구를 발견할 수도 있으니, 짧은 관찰 하나로 그 사람을 여러분의 삶에서 없애 버리지 마라.</div><div class=\"rst\">그 짝꿍이 나중에 제일 친한 친구가 될 수도 있어요. 그러니 <b>짧게 본 것만으로</b>(brief observation 짧은 관찰) 사람을 밀어내지 말라는 게 지문 9번이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"reserve judgement\" data-m=\"판단을 보류하다\"><b>reserve judgement</b>판단을 보류하다</button><button type=\"button\" class=\"wdb\" data-w=\"less-than-desirable\" data-m=\"별로 바람직하지 않은\"><b>less-than-desirable</b>별로 바람직하지 않은</button><button type=\"button\" class=\"wdb\" data-w=\"assumption\" data-m=\"추측, 짐작\"><b>assumption</b>추측, 짐작</button><button type=\"button\" class=\"wdb\" data-w=\"label\" data-m=\"딱지를 붙이다\"><b>label</b>딱지를 붙이다</button><button type=\"button\" class=\"wdb\" data-w=\"exhibit\" data-m=\"(행동을) 보이다, 드러내다\"><b>exhibit</b>(행동을) 보이다, 드러내다</button><button type=\"button\" class=\"wdb\" data-w=\"eliminate\" data-m=\"제거하다, 없애다\"><b>eliminate</b>제거하다, 없애다</button></div>", "02": "<p class=\"mtr\">마더텅 정답률 <b>95%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">도표 불일치는 선지마다 <b>그룹(몇 살)</b>과 <b>최상급(the lowest 가장 낮은)</b>이 가리키는 칸을 도표에서 직접 찍어 보세요. ‘가장 낮다’는 세 칸을 다 비교해야 해요.</p><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>①</em>2번 문장: 세 연령대 모두 시골·지방이 1위 → 도표와 같음</span><span><em>②</em>3번 문장: 18-34세 대도시·소도시 33% > 근교 27% → 도표와 같음</span><span><em>③</em>4번 문장: 35-54세 근교 27% > 대도시·소도시 24% → 도표와 같음</span><span><em>⑤</em>6번 문장: 모든 칸이 20%보다 높음 → 도표와 같음</span></div><div class=\"ck-eq\">⇒ 네 개는 도표와 같아요 → 남은 ④의 ‘가장 낮다’를 55세 이상 세 칸으로 확인</div></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><span class=\"lab\">5번 문장 · 선지 ④</span><div class=\"en\">In the 55 year-olds and older group, the percentage of those who chose <mark>Big/Small City</mark> …</div><p class=\"ko\">55세 이상 그룹에서는, <mark>대도시/소도시</mark>를 선택한 사람들의 비율이</p></div><div class=\"ck-via\"><i>▼</i><span>55세 이상 세 칸: 대도시·소도시 26%, 근교 22%, 시골·지방 52%</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 · 도표의 실제 수치 · 결정적 단서</span><div class=\"en\">… among the three preferred types of place to live <mark>was the lowest</mark>.</div><p class=\"ko\">세 가지 선호되는 거주지 유형 중에서 <mark>가장 낮았다.</mark></p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">55세 이상 그룹에서 대도시·소도시 선택 비율이 가장 낮았다.<small>55세 이상에서 가장 낮은 건 근교(Suburb) 22%예요. 대도시·소도시는 26%라 꼴찌가 아니에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">35-54세 그룹은 근교(27%)가 대도시·소도시(24%)를 넘어섰다.</span><span class=\"why\">4번과 같아요. ②번(18-34세)은 대도시·소도시가 더 높은데 ③번은 근교가 더 높아서, 순서가 바뀐 게 틀린 것처럼 보이지만 도표 그대로 맞는 문장이에요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">각 연령대에서 시골·지방 지역이 가장 선호되었다.</span><span class=\"why\">2번과 같아요. 55세 이상만 봐도 시골·지방이 52%로 다른 두 칸보다 훨씬 높아요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">18-34세 그룹은 대도시·소도시(33%)가 근교(27%)보다 높았다.</span><span class=\"why\">3번과 같아요. 33%가 27%보다 높아요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">세 유형의 비율은 모두 20%보다 높았다.</span><span class=\"why\">6번과 같아요. 가장 작은 칸도 근교 22%라서 20%를 넘어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">The above graph shows</div><div class=\"k\">위의 그래프는 보여준다</div></div><div class=\"rc\"><div class=\"e\">the percentages of Americans’ preferred type of place to live</div><div class=\"k\">미국인이 선호하는 거주지 유형의 비율을</div></div><div class=\"rc\"><div class=\"e\">by age group,</div><div class=\"k\">연령대별로,</div></div><div class=\"rc\"><div class=\"e\">based on a 2020 survey.</div><div class=\"k\">2020년 조사를 기반으로.</div></div><div class=\"rnat\">위 그래프는 2020년 조사를 바탕으로 연령대별 미국인이 선호하는 거주 유형의 비율을 보여준다.</div><div class=\"rst\">동네 사람들에게 “어디 살고 싶어요?” 하고 물어 나이별로 그린 그래프라고 생각해요. = 지문 1번, 2020년 연령대별 선호 거주지 그래프예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">In each of the three age groups,</div><div class=\"k\">세 연령대 각각에서,</div></div><div class=\"rc\"><div class=\"e\">Town/Rural Area was the most preferred type</div><div class=\"k\">시골·지방 지역이 가장 선호되는 유형이었다</div></div><div class=\"rc\"><div class=\"e\">of place to live.</div><div class=\"k\">거주지의.</div></div><div class=\"rnat\">①세 연령대 각각에서 시골·지방 지역이 가장 선호되는 거주 유형이었다.</div><div class=\"rst\">세 그룹 모두 1등은 ‘조용한 시골 마을’이었어요. = 지문 2번, 시골·지방(rural area)이 the most preferred(가장 선호되는)예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">In the 18-34 year-olds group,</div><div class=\"k\">18~34세 그룹에서는,</div></div><div class=\"rc\"><div class=\"e\">the percentage of those who preferred Big/Small City</div><div class=\"k\">대도시/소도시를 선호하는 사람들의 비율이</div></div><div class=\"rc\"><div class=\"e\">was higher than that</div><div class=\"k\">그것(= 비율)보다 더 높았다</div></div><div class=\"rc\"><div class=\"e\">of those who preferred Suburb of Big/Small City.</div><div class=\"k\">대도시/소도시 근교를 선호하는 사람들의.</div></div><div class=\"rnat\">②18~34세 그룹에서는 대도시·소도시를 선호하는 사람들의 비율이 근교를 선호하는 사람들의 비율보다 더 높았다.</div><div class=\"rst\">젊은 어른(18-34세)은 ‘시내’ 33%가 ‘시내 근처 동네’ 27%보다 많아요. = 지문 3번 higher(더 높은)예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">In the 35-54 year-olds group,</div><div class=\"k\">35~54세 그룹에서는,</div></div><div class=\"rc\"><div class=\"e\">the percentage of those who preferred Suburb of Big/Small City</div><div class=\"k\">대도시/소도시 근교를 선호하는 사람들의 비율이</div></div><div class=\"rc\"><div class=\"e\">exceeded that</div><div class=\"k\">그것(= 비율)을 넘었다</div></div><div class=\"rc\"><div class=\"e\">of those who preferred Big/Small City.</div><div class=\"k\">대도시/소도시를 선호하는 사람들의.</div></div><div class=\"rnat\">③35~54세 그룹에서는 근교를 선호하는 사람들의 비율이 대도시·소도시를 선호하는 사람들의 비율을 넘어섰다.</div><div class=\"rst\">부모님 나이(35-54세)는 반대로 ‘시내 근처 동네’ 27%가 ‘시내’ 24%를 넘어요. = 지문 4번 exceeded(넘었다)예요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">In the 55 year-olds and older group,</div><div class=\"k\">55세 이상 그룹에서는,</div></div><div class=\"rc ckc\"><div class=\"e\">the percentage of those who chose <span class=\"cw\">Big/Small City</span></div><div class=\"k\"><span class=\"cw\">대도시/소도시를</span> 선택한 사람들의 비율이</div></div><div class=\"rc\"><div class=\"e\">among the three preferred types of place to live</div><div class=\"k\">세 가지 선호되는 거주지 유형 중에서</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">was the lowest.</span></div><div class=\"k\"><span class=\"cw\">가장 낮았다.</span></div></div><div class=\"rnat\">④55세 이상 그룹에서는 세 가지 선호되는 거주 유형 중에서 대도시·소도시를 선택한 사람들의 비율이 가장 낮았다.</div><div class=\"rst\">조부모님 나이(55세 이상)는 시내 26%, 근처 동네 22%예요. 꼴찌는 근처 동네인데, 지문 5번은 시내가 <b>가장 낮다</b>(the lowest)고 해서 틀렸어요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Each percentage of the three preferred types of place to live</div><div class=\"k\">세 가지 선호되는 거주지 유형 각각의 비율은</div></div><div class=\"rc\"><div class=\"e\">was higher than 20%</div><div class=\"k\">20%보다 더 높았다</div></div><div class=\"rc\"><div class=\"e\">across the three age groups.</div><div class=\"k\">세 연령대에 걸쳐.</div></div><div class=\"rnat\">⑤세 가지 선호되는 거주 유형 각각의 비율은 세 연령대에 걸쳐 모두 20%보다 더 높았다.</div><div class=\"rst\">그래도 모든 칸이 20%를 넘어요. 제일 작은 칸도 22%예요. = 지문 6번, 20%보다 더 높았다(higher 더 높은)예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"preferred\" data-m=\"선호되는\"><b>preferred</b>선호되는</button><button type=\"button\" class=\"wdb\" data-w=\"age group\" data-m=\"연령대\"><b>age group</b>연령대</button><button type=\"button\" class=\"wdb\" data-w=\"suburb\" data-m=\"근교, 교외\"><b>suburb</b>근교, 교외</button><button type=\"button\" class=\"wdb\" data-w=\"rural area\" data-m=\"시골, 지방 지역\"><b>rural area</b>시골, 지방 지역</button><button type=\"button\" class=\"wdb\" data-w=\"exceed\" data-m=\"초과하다, 넘다\"><b>exceed</b>초과하다, 넘다</button><button type=\"button\" class=\"wdb\" data-w=\"lowest\" data-m=\"가장 낮은\"><b>lowest</b>가장 낮은</button></div>", "03": "<p class=\"mtr\">마더텅 정답률 <b>90%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">요지는 첫 문장 <b>One of the best things</b>(최선의 것들 중 하나)에서 이미 나오고, 끝 문장 <b>Giving support</b>(지지해 주는 것)가 한 번 더 못 박아요. 중간 명령문(<b>Instead</b> 대신에)은 그걸 실천하는 방법이에요.</p><div class=\"ck-step key\"><span class=\"lab\">1번 문장 · 요지 먼저</span><div class=\"en\"><mark>One of the best things</mark> you can do to get support for your dream is <mark>to support somebody else’s first</mark>.</div><p class=\"ko\">당신의 꿈에 대한 지지를 받기 위해 당신이 할 수 있는 <mark>최선의 것들 중 하나는</mark> <mark>다른 누군가의 것(= 꿈)을 먼저 지지해 주는 것이다.</mark></p></div><div class=\"ck-via\"><i>▼</i><span>2번 ‘어떻게 그들을 내 팬으로?’를 멈추고 질문을 뒤집어요</span></div><div class=\"ck-step\"><span class=\"lab\">3번 문장 · 질문 바꾸기</span><div class=\"en\"><mark>Instead,</mark> ask, “How can I be a fan of their dream?”</div><p class=\"ko\"><mark>대신에,</mark> 물어보라, “어떻게 하면 내가 그들 꿈의 팬이 될 수 있을까?”</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>5번</em>꿈에 도움을 원하면 → 남의 꿈부터 도와라</span><span><em>6번</em>희망에 지지를 원하면 → 남의 희망부터 지지해라</span></div><div class=\"ck-eq\">⇒ 두 명령문의 공통점 = 받고 싶은 걸 남에게 먼저 주기 (1번과 같은 말)</div></div><div class=\"ck-via\"><i>▼</i><span>마지막에 한 줄로 요약해 줘요</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 문장 · 결론 다시 확인</span><div class=\"en\"><mark>Giving support</mark> is often the best way to get it.</div><p class=\"ko\"><mark>지지해 주는 것은</mark> 종종 그것(= 지지)을 받는 최선의 방법이다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">자신의 꿈을 지지받으려면 남의 꿈을 먼저 지지해 주는 것이 좋다.<small>1번 support somebody else’s first(다른 누군가의 꿈을 먼저 지지하다)를 그대로 옮겼어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">다른 사람을 돕는 것을 통해 인생의 진정한 행복을 찾을 수 있다.</span><span class=\"why\">[지문에 없음] 5번 helping someone else(다른 사람을 돕는 것)가 나와서 끌리지만, 돕는 목적은 ‘행복’이 아니라 내 꿈에 대한 support(지지)를 받는 거예요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">타인의 기대에 따라 자신의 꿈을 결정하는 것은 옳지 않다.</span><span class=\"why\">[지문에 없음] 남의 기대로 꿈을 정하는 이야기는 없어요. 2번 친구·가족은 내 꿈에 indifference(무관심)를 보이는 사람들이에요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">끊임없는 노력과 구체적인 계획을 통해 꿈을 실현할 수 있다.</span><span class=\"why\">[지문에 없음] 노력이나 계획은 한 번도 안 나와요. 지문의 방법은 오직 남을 먼저 지지해 주기예요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">자신의 적성을 찾아 그에 맞게 진로를 설계하는 것이 중요하다.</span><span class=\"why\">[지문에 없음] 적성·진로 이야기는 없어요. 지문은 꿈을 ‘찾는’ 법이 아니라 꿈을 ‘지지받는’ 법을 말해요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds key\" data-ord=\"1\"><span class=\"rn\">1번 · 단서</span><div class=\"rc\"><div class=\"e\">One of the best things</div><div class=\"k\">최선의 것들 중 하나는</div></div><div class=\"rc\"><div class=\"e\">you can do</div><div class=\"k\">당신이 할 수 있는</div></div><div class=\"rc\"><div class=\"e\">to get support for your dream</div><div class=\"k\">당신의 꿈에 대한 지지를 받기 위해</div></div><div class=\"rc ckc\"><div class=\"e\">is <span class=\"cw\">to support somebody else’s first.</span></div><div class=\"k\"><span class=\"cw\">다른 누군가의 것(= 꿈)을 먼저 지지해 주는 것이다.</span></div></div><div class=\"rnat\">자신의 꿈에 대한 지지를 받기 위해 할 수 있는 최선의 것들 중 하나는 다른 누군가의 꿈을 먼저 지지해 주는 것이다.</div><div class=\"rst\">유튜버가 꿈인데 친구들이 영상을 안 봐 줘요. 가장 좋은 방법은 <b>친구 꿈을 먼저 응원하는 것</b>이에요. = 지문 1번이 바로 요지예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">When you run into a wall</div><div class=\"k\">당신이 벽에 부딪혔을 때</div></div><div class=\"rc\"><div class=\"e\">of resistance or indifference</div><div class=\"k\">저항이나 무관심의</div></div><div class=\"rc\"><div class=\"e\">from friends and family members,</div><div class=\"k\">친구들과 가족 구성원들로부터,</div></div><div class=\"rc\"><div class=\"e\">stop asking,</div><div class=\"k\">묻는 것을 멈춰라,</div></div><div class=\"rc\"><div class=\"e\">“How can I get them to be a fan of my dream?”</div><div class=\"k\">“내가 어떻게 하면 그들(= 친구들과 가족)이 내 꿈의 팬이 되도록 할 수 있을까?”</div></div><div class=\"rnat\">친구들이나 가족 구성원들로부터 저항이나 무관심의 벽에 부딪히면, \"내가 어떻게 하면 그들이 내 꿈의 팬이 되게 할 수 있을까?\"라고 묻는 것을 멈춰라.</div><div class=\"rst\">친구랑 가족이 시큰둥하면 “어떻게 해야 내 팬이 될까?”만 고민하게 되죠. 지문 2번은 그 질문을 멈추라고 해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Instead,</span></div><div class=\"k\"><span class=\"cw\">대신에,</span></div></div><div class=\"rc\"><div class=\"e\">ask,</div><div class=\"k\">물어보라,</div></div><div class=\"rc\"><div class=\"e\">“How can I be a fan of their dream?”</div><div class=\"k\">“어떻게 하면 내가 그들(= 친구들과 가족) 꿈의 팬이 될 수 있을까?”</div></div><div class=\"rnat\">대신에, \"어떻게 하면 내가 그들 꿈의 팬이 될 수 있을까?\"라고 물어보라.</div><div class=\"rst\"><b>대신에</b>(Instead) “내가 어떻게 친구 꿈의 팬이 될까?” 하고 물어보세요. 지문 3번은 질문을 거꾸로 뒤집어요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Tell your friend</div><div class=\"k\">당신의 친구에게 말해라</div></div><div class=\"rc\"><div class=\"e\">who doesn’t get</div><div class=\"k\">이해하지 못하는</div></div><div class=\"rc\"><div class=\"e\">what you’re trying to do,</div><div class=\"k\">당신이 하려는 것을,</div></div><div class=\"rc\"><div class=\"e\">“I’ve explained my dream a few times,</div><div class=\"k\">“나는 나의 꿈을 몇 번 설명했지만,</div></div><div class=\"rc\"><div class=\"e\">but never asked you, what’s yours?”</div><div class=\"k\">너에게 한 번도 물어보지 않았네, 너의 것(= 꿈)은 무엇이냐고.”</div></div><div class=\"rnat\">당신이 하려는 것을 이해하지 못하는 당신의 친구에게 \"내 꿈을 몇 번 설명했지만, 정작 네 꿈이 뭔지는 물어본 적이 없네\"라고 말해라.</div><div class=\"rst\">내 영상 얘기만 하던 나를 이해 못 하는 친구에게 “근데 네 꿈은 뭐야?” 하고 물어봐요. = 지문 4번의 what’s yours(너의 것은 무엇이니)예요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">If you want help for your dream,</div><div class=\"k\">당신이 당신의 꿈을 위한 도움을 원한다면,</div></div><div class=\"rc\"><div class=\"e\">start by helping someone else</div><div class=\"k\">다른 사람을 도움으로써 시작하라</div></div><div class=\"rc\"><div class=\"e\">with theirs.</div><div class=\"k\">그들의 것(= 그들의 꿈)에 대해.</div></div><div class=\"rnat\">만약 당신이 당신의 꿈을 위한 도움을 원한다면, 다른 사람의 꿈을 도움으로써 시작하라.</div><div class=\"rst\">내 꿈에 도움을 받고 싶으면, 친구 그림 대회 준비를 먼저 도와줘요. = 지문 5번, 남의 꿈을 도우며 시작하라는 말이에요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">If you want support for your hope,</div><div class=\"k\">당신이 당신의 희망을 위한 지지를 원한다면,</div></div><div class=\"rc\"><div class=\"e\">start by giving support</div><div class=\"k\">지지해 줌으로써 시작하라</div></div><div class=\"rc\"><div class=\"e\">to someone else’s hope.</div><div class=\"k\">다른 사람의 희망을.</div></div><div class=\"rnat\">만약 당신이 당신의 희망을 위한 지지를 원한다면, 다른 사람의 희망을 지지해 줌으로써 시작하라.</div><div class=\"rst\">응원을 받고 싶으면, 친구 축구 시합에 먼저 가서 응원해요. = 지문 6번, 남의 희망을 지지하며 시작하라는 말이에요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Giving support</span></div><div class=\"k\"><span class=\"cw\">지지해 주는 것은</span></div></div><div class=\"rc\"><div class=\"e\">is often the best way</div><div class=\"k\">종종 최선의 방법이다</div></div><div class=\"rc\"><div class=\"e\">to get it.</div><div class=\"k\">그것(= 지지)을 받는.</div></div><div class=\"rnat\">지지해 주는 것은 종종 그것(지지)을 받는 최선의 방법이다.</div><div class=\"rst\">그러면 친구도 내 영상을 봐 줘요. <b>응원을 해 주는 게</b>(Giving support 지지해 주는 것) 응원을 받는 가장 좋은 길이라는 게 지문 7번이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"run into\" data-m=\"맞닥뜨리다\"><b>run into</b>맞닥뜨리다</button><button type=\"button\" class=\"wdb\" data-w=\"resistance\" data-m=\"저항\"><b>resistance</b>저항</button><button type=\"button\" class=\"wdb\" data-w=\"indifference\" data-m=\"무관심\"><b>indifference</b>무관심</button><button type=\"button\" class=\"wdb\" data-w=\"get\" data-m=\"이해하다 (who doesn’t get what … = ~을 이해하지 못하는)\"><b>get</b>이해하다 (who doesn’t get what … = ~을 이해하지 못하는)</button><button type=\"button\" class=\"wdb\" data-w=\"somebody else’s\" data-m=\"다른 누군가의 것\"><b>somebody else’s</b>다른 누군가의 것</button><button type=\"button\" class=\"wdb\" data-w=\"support\" data-m=\"지지; 지지하다\"><b>support</b>지지; 지지하다</button></div>", "04": "<p class=\"mtr\">마더텅 정답률 <b>30%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">재귀대명사는 <b>그 행동을 하는 사람 = 받는 사람</b>일 때만 써요. 밑줄 앞 <b>telling</b>(알려 주는)을 하는 사람이 누구인지, 듣는 사람이 누구인지부터 나눠 보세요.</p><div class=\"ck-step\"><span class=\"lab\">문제지 ④번 자리 (6번)</span><div class=\"en\">… face criticism from fans and community members telling <u>④ themselves</u> how to run their business.</div><p class=\"ko\">팬들과 지역사회 구성원들이 ( ? )에게 어떻게 사업체를 운영할지 알려 주는 비판</p></div><div class=\"ck-via\"><i>▼</i><span>telling(알려 주는)의 주인은 바로 앞의 팬들이에요</span></div><div class=\"ck-step\"><span class=\"lab\">6번 · 알려 주는 사람</span><div class=\"en\">from <mark>fans and community members</mark> telling …</div><p class=\"ko\"><mark>팬들과 지역사회 구성원들의</mark></p></div><div class=\"ck-via\"><i>▼</i><span>듣는 사람은 팬이 아니라 비판을 받는 임원들 → 서로 다른 사람 → them(그들에게)</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 · 듣는 사람 · 결정적 단서</span><div class=\"en\">However, <mark>many of them</mark> face criticism … <mark>telling them</mark> how to run their business.</div><p class=\"ko\">하지만, <mark>그들(= 스포츠 경영 임원들) 중 많은 이들이</mark> 비판을 마주한다 … <mark>자신들(= 임원들)에게 알려주는</mark></p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">재귀대명사 themselves(그들 자신)와 목적격 them(그들에게) 구별</p><p class=\"gr\">행동하는 사람과 그 행동을 받는 사람이 같으면 재귀대명사 themselves(그들 자신)를 써요. 서로 다른 사람이면 목적격 them(그들에게)을 써요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>The kids looked at themselves in the mirror.</div><div class=\"ko\">아이들은 거울 속 자기 자신을 봤다. (보는 사람 = 보이는 사람이라 themselves가 맞아요)</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>The kids listened to her.</div><div class=\"ko\">아이들은 그녀(선생님)의 말을 들었다. (듣는 아이들과 말하는 선생님이 달라서 목적격 her(그녀)가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>Mom asked me a question, and I answered herself.</div><div class=\"ko\">대답하는 사람은 나, 대답을 듣는 사람은 엄마라 서로 달라요. herself(그녀 자신)가 아니라 her(그녀에게)여야 해서 틀려요.</div></div><p class=\"gb\">지문 6번도 telling(알려 주는) 사람은 fans and community members(팬들과 지역사회 구성원들)이고, 듣는 사람은 many of them(임원들 중 많은 이들)이에요. 서로 다른 사람이라 themselves(그들 자신)가 아니라 them(그들에게)이에요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">themselves → them (그들에게)<small>알려 주는 사람(팬)과 듣는 사람(임원)이 달라서 재귀대명사가 아니라 them(그들에게)이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">being given 받고 있는</span><span class=\"why\">4번은 find themselves(자기 자신을 발견하다) 다음 자리예요. 학생·전문가가 충고를 ‘주는’ 게 아니라 ‘받는’ 쪽이고, 뒤에 advice(충고)가 남아 있으니 수동형 being given(받고 있는)이 맞아요. 여기 themselves(자기 자신)도 발견하는 사람과 발견되는 사람이 같아서 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">find(발견하다) + 목적어 + 수동형 being given(받고 있는): 목적어가 당하는 쪽이면 수동</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I found myself being given a lot of advice.</div><div class=\"ko\">나는 어느새 많은 충고를 듣고 있었다. (내가 충고를 받는 쪽이라 수동 being given이 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I found myself giving a lot of advice by my friends.</div><div class=\"ko\">친구들에게서 충고를 받는 상황인데 능동 giving(주고 있는)을 쓰면 내가 주는 뜻이 돼서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>She was given a gift.</div><div class=\"ko\">그녀는 선물을 받았다. (give 주다의 수동 = ‘받다’, 뒤에 a gift 선물이 남아요)</div></div><p class=\"gb\">지문 4번도 학생·전문가가 advice(충고)를 받는 쪽이라 being given(받고 있는)이 그대로 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">successfully 성공적으로</span><span class=\"why\">2번은 팬들이 스포츠팀을 경기하고(play) 감독하고(coach) 관리할(manage) 수 있다는 말 뒤예요. 이 동사들을 ‘어떻게’ 하는지 꾸미는 자리라 부사 successfully(성공적으로)가 맞고, 형용사 successful(성공적인)은 못 와요.</span><div class=\"gm wx\"><p class=\"gt\">동사를 꾸미는 자리 = 부사 (more successfully 더 성공적으로)</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>She runs more quickly than me.</div><div class=\"ko\">그녀는 나보다 더 빨리 달린다. (runs 달린다를 꾸미니 부사 quickly가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>She runs more quick than me.</div><div class=\"ko\">quick(빠른)은 형용사라 동사 runs(달린다)를 꾸밀 수 없어서 틀려요.</div></div><p class=\"gb\">지문 2번도 팬들이 스포츠팀을 ‘더 성공적으로’ 운영할 수 있다고 동사를 꾸미니 successfully(성공적으로)가 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">have 가지고 있다</span><span class=\"why\">5번의 주어는 Executives(임원들)예요. 바로 앞 sport management(스포츠 경영)는 in(~에서)에 딸린 말이라 주어가 아니에요. 주어가 복수라서 단수형 has(가지다)가 아니라 have(가지고 있다)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">주어-동사 수 일치: 수식어(전치사구) 건너뛰고 진짜 주어 찾기</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>The students in my class have many books.</div><div class=\"ko\">우리 반 학생들은 책이 많다. (진짜 주어 students 학생들이 복수라 have가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>The students in my class has many books.</div><div class=\"ko\">my class(우리 반)를 주어로 착각해서 단수형 has(가지다)를 쓰면 틀려요.</div></div><p class=\"gb\">지문 5번도 in sport management(스포츠 경영에서)를 건너뛰면 주어는 복수 Executives(임원들)라서 have(가지고 있다)가 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">how 어떻게</span><span class=\"why\">7번은 전치사 on(~에 대해) 뒤에 sport organizations should be managed(스포츠 조직이 운영되어야 한다)가 와요. 주어·동사가 다 갖춰진 완전한 절이라, 빠진 자리가 있어야 하는 what(~하는 것)이 아니라 방법을 묻는 how(어떻게)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">how(어떻게) + 완전한 절 / what(무엇) + 불완전한 절</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>Tell me how you made this cake.</div><div class=\"ko\">네가 이 케이크를 어떻게 만들었는지 말해 줘. (you made this cake가 완전하니 how가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>Tell me what you made this cake.</div><div class=\"ko\">made(만들었다)의 목적어 this cake(이 케이크)가 이미 있는데 what을 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>Tell me what you made.</div><div class=\"ko\">네가 무엇을 만들었는지 말해 줘. (made 뒤 목적어가 비었으니 what이 맞아요)</div></div><p class=\"gb\">지문 7번도 sport organizations should be managed(스포츠 조직이 운영되어야 한다)가 완전한 절이라 how(어떻게)가 맞아요.</p></div></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">There is a reason</div><div class=\"k\">이유가 있다</div></div><div class=\"rc\"><div class=\"e\">the title “Monday Morning Quarterback” exists.</div><div class=\"k\">“Monday Morning Quarterback(이미 일이 벌어지고 나서 비판하는 사람)”이라는 타이틀이 존재하는.</div></div><div class=\"rnat\">\"Monday Morning Quarterback(이미 일이 벌어지고 나서 비판하는 사람)\"이라는 제목이 존재하는 이유가 있다.</div><div class=\"rst\">경기가 끝나고 나서야 “나라면 이겼다” 하는 사람을 부르는 말이 있어요. 지문 1번은 그 별명이 괜히 있는 게 아니라고 해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Just read the comments on social media</div><div class=\"k\">소셜 미디어의 댓글을 읽어 보기만 하라</div></div><div class=\"rc\"><div class=\"e\">from fans</div><div class=\"k\">팬들이 남긴</div></div><div class=\"rc\"><div class=\"e\">discussing the weekend’s games,</div><div class=\"k\">주말 경기에 관해 토론하는,</div></div><div class=\"rc\"><div class=\"e\">and you quickly see</div><div class=\"k\">그러면 당신은 곧 알게 된다</div></div><div class=\"rc\"><div class=\"e\">how many people believe</div><div class=\"k\">얼마나 많은 사람들이 믿고 있는지</div></div><div class=\"rc\"><div class=\"e\">they could play, coach, and manage sport teams</div><div class=\"k\">자신들이 스포츠팀을 경기하고, 감독하고, 관리할 수 있다고</div></div><div class=\"rc\"><div class=\"e\">more successfully than those on the field.</div><div class=\"k\">경기장에 있는 이들보다 더 성공적으로.</div></div><div class=\"rnat\">주말 경기에 관해 토론하는 팬들이 남긴 소셜 미디어상의 댓글을 읽어 보기만 하라, 그러면 당신은 얼마나 많은 사람들이 경기장에 있는 이들보다 자기가 더 성공적으로 경기하고, 감독하고, 스포츠팀을 관리할 수 있다고 믿고 있는지 곧 알게 된다.</div><div class=\"rst\">주말 경기 댓글을 보면, 많은 팬이 선수·감독보다 자기가 더 잘할 수 있다고 믿어요. 동사를 꾸며서 <b>successfully</b>(성공적으로)예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">This goes for the boardroom as well.</div><div class=\"k\">이것(= 자기가 더 잘할 수 있다고 믿는 상황)은 이사회실에도 해당된다.</div></div><div class=\"rnat\">이것은 이사회실에도 해당한다.</div><div class=\"rst\">이건(This) 회사 회의실에서도 똑같아요. 지문 3번은 운동장 이야기를 회사로 넓혀요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Students and professionals</div><div class=\"k\">학생들과 전문가들이</div></div><div class=\"rc\"><div class=\"e\">with years of training</div><div class=\"k\">수년간 훈련하고</div></div><div class=\"rc\"><div class=\"e\">and specialized degrees in sport business</div><div class=\"k\">스포츠 경영 분야의 전공 학위를 딴</div></div><div class=\"rc\"><div class=\"e\">may also find themselves</div><div class=\"k\">자기 자신을 발견할지도 모른다</div></div><div class=\"rc\"><div class=\"e\">being given advice</div><div class=\"k\">충고를 듣고 있는</div></div><div class=\"rc\"><div class=\"e\">on how to do their jobs</div><div class=\"k\">자신의 일을 어떻게 해야 할지에 관한</div></div><div class=\"rc\"><div class=\"e\">from friends, family, or even total strangers</div><div class=\"k\">친구, 가족, 심지어 생판 남으로부터</div></div><div class=\"rc\"><div class=\"e\">without any expertise.</div><div class=\"k\">아무 전문 지식도 없는.</div></div><div class=\"rnat\">스포츠 경영학에서 수년간 훈련하고 전공 학위를 딴 학생들과 전문가들 또한 아무 전문 지식도 없는 친구, 가족, 심지어 낯선 사람들로부터 자신의 일을 어떻게 해야 할지에 관한 조언을 자기도 모르게 받게 될지도 모른다.</div><div class=\"rst\">전공까지 한 전문가도 아무것도 모르는 사람에게 충고를 듣게 돼요. 충고를 받는 쪽이라 <b>being given</b>(받고 있는)이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Executives in sport management</div><div class=\"k\">스포츠 경영 임원들은</div></div><div class=\"rc\"><div class=\"e\">have decades of knowledge and experience</div><div class=\"k\">수십 년의 지식과 경력을 지니고 있다</div></div><div class=\"rc\"><div class=\"e\">in their respective fields.</div><div class=\"k\">각자 자기 분야에서.</div></div><div class=\"rnat\">스포츠 경영 임원들은 각자 자기 분야에서 수십 년의 지식과 경력을 지니고 있다.</div><div class=\"rst\">스포츠 회사 임원들은 수십 년 경력이 있어요. 주어가 복수 Executives(임원들)라 <b>have</b>(가지고 있다)예요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">However,</div><div class=\"k\">하지만,</div></div><div class=\"rc\"><div class=\"e\">many of them</div><div class=\"k\">그들(= 스포츠 경영 임원들) 중 많은 이들이</div></div><div class=\"rc\"><div class=\"e\">face criticism</div><div class=\"k\">비판을 마주한다</div></div><div class=\"rc ckc\"><div class=\"e\">from <span class=\"cw\">fans and community members</span></div><div class=\"k\"><span class=\"cw\">팬들과 지역사회 구성원들의</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">telling them</span></div><div class=\"k\"><span class=\"cw\">자신들(= 임원들)에게 알려주는</span> ※ 문제지엔 themselves로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">how to run their business.</div><div class=\"k\">어떻게 사업체를 운영할지.</div></div><div class=\"rnat\">하지만, 그들 중 많은 이들이 자신에게 어떻게 사업체를 운영할지 알려 주는 팬들과 지역사회 구성원들의 비판을 마주한다.</div><div class=\"rst\"><b>하지만</b>(However) 팬들은 그 임원들에게 회사 운영법을 알려 주며 비판해요. 알려 주는 팬 ≠ 듣는 임원이라 <b>them</b>(그들에게)이 맞아요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Very few people tell their doctor</div><div class=\"k\">극히 소수의 사람들이 그들의 의사에게 알려준다</div></div><div class=\"rc\"><div class=\"e\">how to perform surgery</div><div class=\"k\">수술하는 방법을</div></div><div class=\"rc\"><div class=\"e\">or their accountant</div><div class=\"k\">혹은 그들의 회계사에게</div></div><div class=\"rc\"><div class=\"e\">how to prepare their taxes,</div><div class=\"k\">세금을 어떻게 준비할지를,</div></div><div class=\"rc\"><div class=\"e\">but many people provide feedback</div><div class=\"k\">하지만 많은 사람들이 피드백을 제공한다</div></div><div class=\"rc\"><div class=\"e\">on how sport organizations should be managed.</div><div class=\"k\">스포츠 조직이 어떻게 운영되어야 하는가에 대해.</div></div><div class=\"rnat\">의사에게 수술 방법을 알려 주거나, 회계사에게 세금을 어떻게 준비할지 알려 주는 사람은 극히 드물지만, 스포츠 조직이 어떻게 운영되어야 하는지에 대해서는 많은 이들이 피드백을 제공한다.</div><div class=\"rst\">의사에게 수술법을 알려 주는 사람은 거의 없는데, 스포츠 운영법엔 다들 한마디씩 해요. 뒤가 완전한 절이라 <b>how</b>(어떻게)예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"specialized degree\" data-m=\"전공 학위\"><b>specialized degree</b>전공 학위</button><button type=\"button\" class=\"wdb\" data-w=\"expertise\" data-m=\"전문 지식\"><b>expertise</b>전문 지식</button><button type=\"button\" class=\"wdb\" data-w=\"executive\" data-m=\"경영진, 임원\"><b>executive</b>경영진, 임원</button><button type=\"button\" class=\"wdb\" data-w=\"respective\" data-m=\"각자의\"><b>respective</b>각자의</button><button type=\"button\" class=\"wdb\" data-w=\"face criticism\" data-m=\"비판에 직면하다\"><b>face criticism</b>비판에 직면하다</button><button type=\"button\" class=\"wdb\" data-w=\"accountant\" data-m=\"회계사\"><b>accountant</b>회계사</button></div>", "05": "<p class=\"mtr\">마더텅 정답률 <b>60%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">1번 <b>drops greatly</b>(크게 떨어지다)가 글 전체 방향이에요. 조명 값은 옛날엔 비쌌고 지금은 싸요. 즉 <b>가격이 내려간 방향</b>과 어긋나는 낱말을 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">1번 · 글의 방향</span><div class=\"en\">When the price of something fundamental <mark>drops greatly</mark>, the whole world can change.</div><p class=\"ko\">기본적인 무언가의 가격이 <mark>크게 떨어질 때,</mark> 온 세상이 바뀔 수 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>지금은 싼데(5번) 옛날엔 400배 → 가격은 내려온 거예요</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 · 옛날 가격 · 결정적 단서</span><div class=\"en\">But in the early 1800s, it would have cost you <mark>four hundred times</mark> what you are paying now …</div><p class=\"ko\">하지만 1800년대 초반에는, 같은 양의 조명에 대해 당신이 지금 지불하고 있는 것의 <mark>400배만큼</mark> 비용이 들었을 것이다.</p></div><div class=\"ck-via\"><i>▼</i><span>400배 비쌌던 게 지금은 싸졌는데 ‘증가’? 방향이 거꾸로예요</span></div><div class=\"ck-step\"><span class=\"lab\">문제지 ③번 자리 (8번)</span><div class=\"en\">The <u>③ increase</u> in the price of light lit up the world.</div><p class=\"ko\">조명 가격의 ( 증가? )가 세상을 밝혔다 → 하락이 맞아요</p></div><div class=\"ck-via\"><i>▼</i><span>마지막 문장도 비용이 ‘떨어졌다’고 말해요</span></div><div class=\"ck-step\"><span class=\"lab\">10번 · 결과로 확인</span><div class=\"en\">… if the cost of artificial light <mark>had not dropped</mark> to almost nothing.</div><p class=\"ko\">… 만약 인공조명의 비용이 거의 공짜 수준으로 <mark>떨어지지 않았더라면</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">increase(증가) ↔ drop(하락)</p><p class=\"gr\">옛날 값이 지금보다 비쌌다면, 그 사이에 일어난 건 drop(하락)이에요. 전과 지금의 비교 방향과 낱말의 방향이 같아야 해요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>Last year a snack cost 2,000 won. Now it costs 1,000 won. There was a drop in the price.</div><div class=\"ko\">작년엔 과자가 2,000원, 지금은 1,000원이에요. 가격이 하락했어요. (비쌌다 → 싸졌다 = 하락)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>Last year a snack cost 2,000 won. Now it costs 1,000 won. There was an increase in the price.</div><div class=\"ko\">값이 싸졌는데 증가라고 하면 방향이 거꾸로라 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>The price of the game went up, so fewer kids bought it.</div><div class=\"ko\">게임 값이 올라서 산 아이들이 줄었어요. (오름 → 덜 산다, 방향이 맞아요)</div></div><p class=\"gb\">지문 6번에서 옛날 조명 값은 지금의 400배였어요. 비쌌다가 싸졌으니 8번은 increase(증가)가 아니라 drop(하락)이어야 해요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">increase → drop (하락)<small>1번 drops(떨어지다)·10번 dropped(떨어졌다)처럼 조명 값은 내려갔으니 하락(drop)이 맞아요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">natural 자연의</span><span class=\"why\">9번은 큰 건물 안에서 살고 일하게 됐다는 말이에요. 인공조명이 싸져서 생긴 일이니, 못 들어오는 건 자연광(natural light)이 맞아요. artificial(인공의)과 짝을 이루는 말이에요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">cheap 싼</span><span class=\"why\">5번 뒤에 use it without thinking(아무 생각 없이 그것을 쓴다)이 와요. 생각 없이 쓸 만큼 싸다는 뜻이라 cheap(싼)이 맞아요. 6번 But(하지만)의 ‘옛날엔 400배’와도 대조가 돼요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">notice 의식하다</span><span class=\"why\">7번은 At that price(그 가격이라면), 즉 지금의 400배 값일 때예요. 그렇게 비싸면 비용을 의식하고 think twice(숙고하다)할 테니 notice(의식하다)가 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">possible 가능한</span><span class=\"why\">10번은 Nearly nothing(거의 아무것도 ~않다) + 비용이 안 떨어졌더라면이라는 가정이에요. 싸지지 않았다면 오늘의 것들은 거의 다 가능하지 않았을 거라는 말이라 possible(가능한)이 맞아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">When the price of something fundamental</div><div class=\"k\">기본적인 무언가의 가격이</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">drops greatly,</span></div><div class=\"k\"><span class=\"cw\">크게 떨어질 때,</span></div></div><div class=\"rc\"><div class=\"e\">the whole world can change.</div><div class=\"k\">온 세상이 바뀔 수 있다.</div></div><div class=\"rnat\">기본적인 무언가의 가격이 크게 떨어질 때, 온 세상이 바뀔 수 있다.</div><div class=\"rst\">꼭 필요한 물건 값이 <b>크게 떨어지면</b>(drops greatly) 세상이 바뀌어요. 지문 1번이 글 전체 방향을 알려 줘요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Consider light.</div><div class=\"k\">조명을 생각해 보라.</div></div><div class=\"rnat\">조명을 생각해 보라.</div><div class=\"rst\">그 예로 조명, 즉 불빛을 생각해 보래요. 지문 2번은 이야기 주인공을 소개해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Chances are you are reading this sentence</div><div class=\"k\">아마 당신은 이 문장을 읽고 있을 것이다</div></div><div class=\"rc\"><div class=\"e\">under some kind of artificial light.</div><div class=\"k\">어떤 인공조명 아래에서.</div></div><div class=\"rnat\">아마 여러분은 이 문장을 어떤 인공조명 아래에서 읽고 있을 것이다.</div><div class=\"rst\">지금 이 글도 아마 형광등 같은 인공조명 아래에서 읽고 있을 거예요. = 지문 3번이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Moreover,</div><div class=\"k\">더구나,</div></div><div class=\"rc\"><div class=\"e\">you probably never thought about</div><div class=\"k\">당신은 아마도 생각해 보지 않았을 것이다</div></div><div class=\"rc\"><div class=\"e\">whether using artificial light for reading</div><div class=\"k\">독서를 위해 인공조명을 사용하는 것이</div></div><div class=\"rc\"><div class=\"e\">was worth it.</div><div class=\"k\">그럴 만한 가치가 있는지.</div></div><div class=\"rnat\">게다가, 여러분은 아마도 독서를 위해 인공조명을 사용하는 것이 그럴 만한 가치가 있는지에 대해 생각해 보지 않았을 것이다.</div><div class=\"rst\">게다가 “책 읽으려고 불 켜도 될까?” 하고 고민해 본 적은 없죠. 지문 4번처럼 그럴 가치가 있는지 생각도 안 해요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Light is so cheap</div><div class=\"k\">조명은 너무 싸서</div></div><div class=\"rc\"><div class=\"e\">that you use it without thinking.</div><div class=\"k\">당신은 그것(= 조명)을 아무 생각 없이 이용한다.</div></div><div class=\"rnat\">조명은 너무 싸서 여러분은 아무 생각 없이 그것을 사용한다.</div><div class=\"rst\">불빛이 너무 <b>싸서</b>(cheap) 생각 없이 켜요. = 지문 5번이에요. 이 말이 맞으려면 값이 싸야 해요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">But in the early 1800s,</div><div class=\"k\">하지만 1800년대 초반에는,</div></div><div class=\"rc\"><div class=\"e\">it would have cost you</div><div class=\"k\">당신에게 비용이 들었을 것이다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">four hundred times</span></div><div class=\"k\"><span class=\"cw\">400배만큼</span></div></div><div class=\"rc\"><div class=\"e\">what you are paying now</div><div class=\"k\">당신이 지금 지불하고 있는 것의</div></div><div class=\"rc\"><div class=\"e\">for the same amount of light.</div><div class=\"k\">같은 양의 조명에 대해.</div></div><div class=\"rnat\">하지만 1800년대 초반이었다면, 같은 양의 빛에 대해 당신은 지금 지불하는 금액의 400배를 치렀을 것이다.</div><div class=\"rst\"><b>하지만</b>(But) 1800년대 초엔 같은 불빛이 지금의 <b>400배</b> 값이었어요. 지문 6번, 값이 엄청 내려왔다는 증거예요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">At that price,</div><div class=\"k\">그 가격이라면,</div></div><div class=\"rc\"><div class=\"e\">you would notice the cost</div><div class=\"k\">당신은 비용을 의식할 것이고</div></div><div class=\"rc\"><div class=\"e\">and would think twice</div><div class=\"k\">숙고할 것이다</div></div><div class=\"rc\"><div class=\"e\">before using artificial light</div><div class=\"k\">인공조명을 사용하기 전에</div></div><div class=\"rc\"><div class=\"e\">to read a book.</div><div class=\"k\">책을 읽으려고.</div></div><div class=\"rnat\">그 가격이라면, 여러분은 비용을 의식하게 되어 책을 읽으려고 인공조명을 쓰기 전에 숙고했을 것이다.</div><div class=\"rst\">그 값이면 불 하나 켤 때도 돈이 아까워서 망설였을 거예요. = 지문 7번 notice(의식하다)·think twice(숙고하다)예요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">The drop in the price of light</span></div><div class=\"k\"><span class=\"cw\">조명 가격의 하락이</span> ※ 문제지엔 increase(증가)로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">lit up the world.</div><div class=\"k\">세상을 밝혔다.</div></div><div class=\"rnat\">조명 가격의 증가(→하락)가 세상을 밝혔다.</div><div class=\"rst\">그러니 세상을 밝힌 건 조명 값의 <b>하락</b>(drop)이에요. 문제지의 increase(증가)는 방향이 거꾸로라 틀린 말이에요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">Not only did it turn night into day,</div><div class=\"k\">그것은 밤을 낮으로 바꾸었을 뿐만 아니라,</div></div><div class=\"rc\"><div class=\"e\">but it allowed us to live and work</div><div class=\"k\">우리가 살고 일할 수 있게 해 주었다</div></div><div class=\"rc\"><div class=\"e\">in big buildings</div><div class=\"k\">큰 건물에서</div></div><div class=\"rc\"><div class=\"e\">that natural light could not enter.</div><div class=\"k\">자연광이 들어오지 못하는.</div></div><div class=\"rnat\">그것은 밤을 낮으로 바꾸어 놓았을 뿐만 아니라, 자연광이 들어오지 못하는 큰 건물에서도 우리가 살고 일할 수 있게 해 주었다.</div><div class=\"rst\">불빛이 싸지자 밤이 낮처럼 밝아지고, 햇빛이 안 드는 큰 건물에서도 살고 일하게 됐어요. = 지문 9번 natural light(자연광)예요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">Nearly nothing we have today</div><div class=\"k\">오늘날 우리가 가진 것 중 거의 아무것도</div></div><div class=\"rc\"><div class=\"e\">would be possible</div><div class=\"k\">가능하지 않을 것이다</div></div><div class=\"rc\"><div class=\"e\">if the cost of artificial light</div><div class=\"k\">만약 인공조명의 비용이</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">had not dropped</span></div><div class=\"k\"><span class=\"cw\">떨어지지 않았더라면</span></div></div><div class=\"rc\"><div class=\"e\">to almost nothing.</div><div class=\"k\">거의 공짜 수준으로.</div></div><div class=\"rnat\">만약 인공조명의 비용이 거의 공짜 수준으로 떨어지지 않았더라면 오늘날 우리가 누리는 것 중에 거의 아무것도 가능하지 않을 것이다.</div><div class=\"rst\">조명 값이 거의 공짜로 <b>떨어지지 않았다면</b>(had not dropped) 지금 우리가 누리는 건 거의 다 불가능했을 거예요. 지문 10번이 결론이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"fundamental\" data-m=\"기본적인, 근본적인\"><b>fundamental</b>기본적인, 근본적인</button><button type=\"button\" class=\"wdb\" data-w=\"artificial light\" data-m=\"인공조명\"><b>artificial light</b>인공조명</button><button type=\"button\" class=\"wdb\" data-w=\"worth\" data-m=\"가치가 있는\"><b>worth</b>가치가 있는</button><button type=\"button\" class=\"wdb\" data-w=\"think twice\" data-m=\"숙고하다, 망설이다\"><b>think twice</b>숙고하다, 망설이다</button><button type=\"button\" class=\"wdb\" data-w=\"light up\" data-m=\"밝히다\"><b>light up</b>밝히다</button><button type=\"button\" class=\"wdb\" data-w=\"natural light\" data-m=\"자연광\"><b>natural light</b>자연광</button></div>", "06": "<p class=\"mtr\">마더텅 정답률 <b>75%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸이 <b>첫 문장</b>에 있으면 답은 <b>마지막 결론 문장</b>이 되풀이해 줘요. 야구 이야기는 예시이니, 8번의 <b>that knowledge</b>(그 지식)를 잡으세요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (1번)</span><div class=\"en\">… from the first time you start looking at a situation, you are also making use of <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span>.</span></div><p class=\"ko\">어떤 상황을 처음 보기 시작한 순간부터, 당신은 ( ? )도 사용하고 있다</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>3~4번</em>야구장에 처음 가면 → 뒤죽박죽, 다음 일을 예측 못 해 동작을 놓침</span><span><em>5번</em>야구를 더 배우면 → 어디를 볼지 알게 됨</span><span><em>6~7번</em>투수·타자 → 내야수·외야수 위치까지 보임</span></div><div class=\"ck-eq\">⇒ 세 장면의 공통점 = 아는 게 많을수록 더 잘 보인다</div></div><div class=\"ck-via\"><i>▼</i><span>야구 예시를 한 줄로 정리해 준 문장</span></div><div class=\"ck-step key\"><span class=\"lab\">8번 문장 · 결정적 단서</span><div class=\"en\"><mark>The more you know</mark> about baseball, the more <mark>that knowledge</mark> informs how you see a game.</div><p class=\"ko\"><mark>당신이 야구에 대해 더 많이 알수록,</mark> <mark>그 지식(= 야구에 대한 지식)은</mark> 당신이 경기를 보는 방식에 더 많이 영향을 준다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">your existing knowledge 당신의 기존 지식<small>8번 that knowledge(그 지식)를 그대로 받아요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">the physical environment 물리적 환경</span><span class=\"why\">야구장이라는 장소가 나와서 끌리지만, 같은 경기장에서도 처음 간 사람(3번)과 많이 아는 사람(8번)이 보는 게 달라요. 차이를 만든 건 장소가 아니라 지식이에요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">athletic talent 운동 재능</span><span class=\"why\">지문 속 ‘당신’은 직접 경기하는 선수가 아니라 경기를 보는 사람이에요. 5번도 운동을 잘해서가 아니라 learn more(더 많이 배우다)해서 잘 보인다고 해요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">advanced technology 첨단 기술</span><span class=\"why\">기술이나 기계 이야기는 지문에 하나도 없어요. 보는 방법을 바꾼 건 야구에 대한 understanding(이해)이에요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">your sense of hearing 당신의 청각</span><span class=\"why\">1번은 vision(시각) 이야기이고, 6~7번도 무엇을 ‘보는지’예요. 소리를 듣는 장면은 없어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds key\" data-ord=\"1\"><span class=\"rn\">1번 · 단서</span><div class=\"rc\"><div class=\"e\">It is important to understand</div><div class=\"k\">이해하는 것은 중요하다</div></div><div class=\"rc\"><div class=\"e\">how vision works,</div><div class=\"k\">시각이 어떻게 작동하는지,</div></div><div class=\"rc\"><div class=\"e\">because from the first time</div><div class=\"k\">왜냐하면 처음 ~한 순간부터</div></div><div class=\"rc\"><div class=\"e\">you start looking at a situation,</div><div class=\"k\">당신이 어떤 상황을 보기 시작한,</div></div><div class=\"rc\"><div class=\"e\">you are also making use of</div><div class=\"k\">당신은 또한 사용하고 있기 때문이다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">your existing knowledge.</span></div><div class=\"k\"><span class=\"cw\">당신의 기존의 지식을.</span> ※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rnat\">시각이 어떻게 작동하는지를 이해하는 것은 중요한데, 왜냐하면 여러분이 어떤 상황을 처음 보기 시작하는 순간부터 여러분은 여러분의 기존 지식 또한 사용하고 있기 때문이다.</div><div class=\"rst\">눈으로 볼 때도 사실은 <b>머릿속에 이미 아는 것</b>을 같이 쓰고 있어요. = 지문 1번, 그래서 빈칸은 ‘원래 알던 지식’이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">If you are at a baseball game,</div><div class=\"k\">당신이 야구 경기장에 있다면,</div></div><div class=\"rc\"><div class=\"e\">how do you know</div><div class=\"k\">당신은 어떻게 아는가</div></div><div class=\"rc\"><div class=\"e\">where to look?</div><div class=\"k\">어디를 봐야 할지?</div></div><div class=\"rnat\">만약 여러분이 야구 경기장에 있다면, 여러분은 어디를 봐야 할지 어떻게 아는가?</div><div class=\"rst\">친구 따라 야구장에 처음 갔다고 해 봐요. 지문 2번처럼 “어디를 봐야 하지?” 싶어요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">If you have never been to a game before,</div><div class=\"k\">당신이 전에 경기장에 한 번도 가 본 적이 없다면,</div></div><div class=\"rc\"><div class=\"e\">then the whole thing</div><div class=\"k\">그 모든 것은</div></div><div class=\"rc\"><div class=\"e\">is probably a complex mess.</div><div class=\"k\">아마도 복잡하고 혼란스러운 상황일 것이다.</div></div><div class=\"rnat\">만약 여러분이 그 이전에 경기에 한 번도 가 본 적이 없다면, 그 모든 것은 아마 복잡하고 뒤죽박죽인 것일 것이다.</div><div class=\"rst\">규칙을 하나도 모르면 운동장 전체가 그냥 정신없어 보여요. = 지문 3번의 a complex mess(복잡하고 혼란스러운 상황)예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">You may miss a lot of the action,</div><div class=\"k\">당신은 (경기의) 많은 동작을 놓칠지도 모른다,</div></div><div class=\"rc\"><div class=\"e\">because you can’t predict</div><div class=\"k\">왜냐하면 당신은 예측할 수 없기 때문에</div></div><div class=\"rc\"><div class=\"e\">what is going to happen next.</div><div class=\"k\">다음에 무슨 일이 일어날지.</div></div><div class=\"rnat\">여러분은 다음에 무슨 일이 일어날지 예측할 수 없기 때문에, 여러분은 많은 동작을 놓칠지도 모른다.</div><div class=\"rst\">다음에 뭐가 일어날지 모르니, 홈런 같은 중요한 장면도 놓쳐요. 지문 4번은 예측을 못 해서 놓친다고 해요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">As you learn more about baseball</div><div class=\"k\">당신이 야구에 대해 더 많이 배우면서</div></div><div class=\"rc\"><div class=\"e\">and develop some understanding of the game,</div><div class=\"k\">그리고 경기에 대한 어느 정도의 이해를 발달시키면서,</div></div><div class=\"rc\"><div class=\"e\">you learn where to look</div><div class=\"k\">당신은 어디를 봐야 할지 배운다</div></div><div class=\"rc\"><div class=\"e\">and what objects are important to find.</div><div class=\"k\">그리고 어떤 대상을 찾는 것이 중요한지를.</div></div><div class=\"rnat\">야구에 대해 더 많이 배우고 경기에 대한 어느 정도의 이해를 발달시키면서, 여러분은 어디를 봐야 할지와 어떤 대상을 찾는 것이 중요한지를 배운다.</div><div class=\"rst\">그런데 야구를 조금씩 배우면 어디를 봐야 할지 알게 돼요. 지문 5번, 이해가 생기면 보는 곳이 달라져요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">At first</div><div class=\"k\">처음에는</div></div><div class=\"rc\"><div class=\"e\">you might focus on the pitcher and hitter.</div><div class=\"k\">당신은 투수와 타자에 주목할지도 모른다.</div></div><div class=\"rnat\">처음에는 여러분은 투수와 타자에 주목할 수도 있다.</div><div class=\"rst\">처음엔 공 던지는 투수와 치는 타자만 눈에 들어와요. = 지문 6번이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Later still,</div><div class=\"k\">그 후 더 나중에는,</div></div><div class=\"rc\"><div class=\"e\">you might notice</div><div class=\"k\">당신은 알아차릴지도 모른다</div></div><div class=\"rc\"><div class=\"e\">whether the infielder is playing in or back,</div><div class=\"k\">내야수가 안쪽에서 혹은 뒤쪽에서 경기하고 있는지,</div></div><div class=\"rc\"><div class=\"e\">or you might check out</div><div class=\"k\">혹은 당신은 확인할지도 모른다</div></div><div class=\"rc\"><div class=\"e\">where the outfielders have chosen to stand</div><div class=\"k\">외야수들이 어디에 서 있기로 정했는지를</div></div><div class=\"rc\"><div class=\"e\">for a particular hitter.</div><div class=\"k\">특정한 타자에 대비해.</div></div><div class=\"rnat\">그 후에는 더욱, 여러분은 내야수가 전진 수비를 하고 있는지 후진 수비를 하고 있는지 알아챌 수도 있고, 혹은 외야수가 특정 타자에 대비해 어디에 서 있기로 정했는지를 확인할 수도 있다.</div><div class=\"rst\">더 알게 되면 수비수들이 어디에 서 있는지까지 보여요. 지문 7번, 아는 만큼 더 많이 보는 거예요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">The more you know about baseball,</span></div><div class=\"k\"><span class=\"cw\">당신이 야구에 대해 더 많이 알수록,</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">the more that knowledge informs</span></div><div class=\"k\"><span class=\"cw\">그 지식(= 야구에 대한 지식)은 더 많이 영향을 준다</span></div></div><div class=\"rc\"><div class=\"e\">how you see a game.</div><div class=\"k\">당신이 경기를 보는 방식에.</div></div><div class=\"rnat\">여러분이 야구에 대해 더 많이 알수록, 그 지식은 여러분이 경기를 보는 방식에 더 많이 영향을 준다.</div><div class=\"rst\"><b>야구를 많이 알수록, 그 지식이 경기 보는 눈을 바꿔요.</b> 1번 빈칸이 여기서 되풀이돼요. (that knowledge = 그 지식)</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"vision\" data-m=\"시각\"><b>vision</b>시각</button><button type=\"button\" class=\"wdb\" data-w=\"make use of\" data-m=\"~을 이용하다\"><b>make use of</b>~을 이용하다</button><button type=\"button\" class=\"wdb\" data-w=\"existing knowledge\" data-m=\"기존 지식\"><b>existing knowledge</b>기존 지식</button><button type=\"button\" class=\"wdb\" data-w=\"complex mess\" data-m=\"복잡하고 뒤죽박죽인 상황\"><b>complex mess</b>복잡하고 뒤죽박죽인 상황</button><button type=\"button\" class=\"wdb\" data-w=\"predict\" data-m=\"예측하다\"><b>predict</b>예측하다</button><button type=\"button\" class=\"wdb\" data-w=\"inform\" data-m=\"영향을 주다, 알려 주다\"><b>inform</b>영향을 주다, 알려 주다</button></div>"};

function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  if(EXP[cq.q]){h+=EXP[cq.q]+'<button class="toq" data-i="'+i+'">빠른 정답으로</button>';return h+'</div></details>';}
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}

  mmInit();
}
/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(S.sub&&!S.mmS){S.mmS=1;S.mmP=1;save();WN.hw(lv,day,S.sub.s+'/'+N+(S.mmD?' ✓':''));}else if(!S.sub&&!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
