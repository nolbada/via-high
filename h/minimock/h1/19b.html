<body>
<div id="app"></div>
<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}

function dec(s){var b=atob(s.split("").reverse().join(""));var u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new TextDecoder("utf-8").decode(u);}
var ANS=dec(ENC).split(";").map(function(x){return x.split("|").map(function(c){return CIRC.indexOf(c)+1;});});
function isRight(i,a){return ANS[i].indexOf(a)>=0;}
function ansText(i){return ANS[i].map(function(n){return CIRC[n-1];}).join(", ");}

function esc(x){return String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function shuffle(arr,seed){const a=arr.slice();let s=hash(seed)||1;for(let i=a.length-1;i>0;i--){s=Math.imul(s^(s>>>15),2246822519)>>>0;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}

function noteList(){
  const out=[],ck=S.checks[WS.id]||{};
  WS.words.forEach((w,i)=>{
    const c=ck[i];if(!c)return;
    const parts=['m','s','a'].filter(p=>c[p]&&(p==='m'||w[p]));
    if(parts.length)out.push({i:i,w:w,parts:parts});
  });
  return out;
}

yed가 shoppers를 꾸밈)", "V: said (say 말하다의 과거형)", "O: that절 (명사절)", "뼈대 = <b>81% of surveyed American shoppers said that ~</b>"]}, {"t": "앞의 <b>In 2006</b> (2006년에)은 said를 꾸미는 전치사구다."}, {"t": "that절 안의 뼈대를 찾는다. 5형식(SVOC)이다.", "sub": ["S: they (= shoppers, 소비자들)", "V: considered (consider 여기다의 과거형)", "O: online customer ratings and reviews (온라인 소비자 평가와 후기)", "C: important (중요한)", "뼈대 = <b>they considered ratings and reviews important</b>"]}, {"t": "끝의 <b>when planning a purchase</b>는 접속사가 남은 <b>분사구문</b>이다 (구매를 계획할 때, purchase 구매). 풀면 'when they were planning ~'이다. considered를 꾸미는 것으로 읽는다. said를 꾸미는 것으로 읽을 수도 있지만 뼈대는 달라지지 않는다."}], "sum": "소비자 81퍼센트, 구매 계획 시 온라인 평가·후기를 중요하게 여김"}, {"i": "05", "q": "11", "s": "6", "title": "가주어 it + that절 진주어 + 동격절", "eng": "But is it possible / that just a single word from a requester<sup>1</sup> / could drastically<sup>2</sup> increase the likelihood<sup>3</sup> that you'd say, \"Yes, go ahead\"?", "notes": [["1", "requester", "요청하는 사람"], ["2", "drastically", "대폭"], ["3", "likelihood", "가능성"]], "lit": "하지만 가능할까 / 요청하는 사람이 하는 단 하나의 단어가 / 당신이 '네, 먼저 가세요'라고 말할 가능성을 대폭 증가시킬 수 있다는 것이", "nat": "하지만 요청하는 사람이 던진 단 하나의 단어가 당신이 '네, 먼저 가세요'라고 말할 가능성을 대폭 높일 수 있다는 것이 가능할까?", "ana": "<b>가주어 it ~ that절(진주어)</b> 구문이며, that절 안에는 <b>동격의 that</b>이 이끄는 the likelihood that you'd say ~가 다시 쓰였다.", "pe": "But is it possible / that just a single word \u0001from a requester<sup>1</sup>\u0002 / could \u0001drastically<sup>2</sup>\u0002 increase the likelihood<sup>3</sup> \u0001that you'd say, \"Yes, go ahead\"\u0002?", "pk": "하지만 가능할까 / 요청하는 사람이 하는 단 하나의 단어가 / 당신이 '네, 먼저 가세요'라고 말할 가능성을 대폭 증가시킬 수 있다는 것이", "core": "하나의 단어가 가능성을 높일 수 있다는 것이 가능할까?", "tags": ["<b>가주어 it</b>, 동사 is, 보어 possible (SVC). But = 접속사", "<b>that절</b> = 진주어(명사절). 주어 a single word. (from a requester) = 전치사구(형용사구): word를 꾸밈", "동사 could increase, 목적어 the likelihood. (drastically) = 부사: increase 꾸밈. (that ~) = <b>동격절</b>: likelihood의 내용을 설명"], "steps": [{"t": "이 문장은 <b>가주어 It ~ 진주어 that절</b>의 <b>의문문(S+V+C, 2형식)</b>이다. that절 안에 동격절이 있어 길어 보인다."}, {"t": "큰 뼈대부터 찾는다.", "sub": ["S: it (가주어, 해석하지 않음) = that절 (진주어)", "V: is (be ~이다)", "C: possible (가능한)", "뼈대 = <b>(But) is it possible that ~?</b>", "But (하지만)은 접속사"]}, {"t": "진주어 <b>that절</b> 안의 뼈대를 찾는다.", "sub": ["S: just a single word (단 하나의 단어) - from a requester (요청하는 사람으로부터 온)는 word를 꾸미는 형용사구", "V: could increase (increase 늘리다) - drastically (대폭)는 increase를 꾸미는 부사", "O: the likelihood (가능성)", "뼈대 = <b>a single word could increase the likelihood</b>"]}, {"t": "끝의 <b>that you'd say, \"Yes, go ahead\"</b>는 <b>동격절</b>이다. likelihood의 내용을 설명한다 (당신이 '네, 먼저 가세요'라고 말할 가능성). you'd = you would."}], "sum": "요청자의 한 단어가 '먼저 가세요'라는 대답 확률을 크게 높일 수 있는지 의문"}, {"i": "06", "q": "11", "s": "10", "title": "분사구문 + S+V+C + to부정사 연쇄", "eng": "Faced with<sup>1</sup> this direct request to cut ahead in the line, / 60 percent of the people were willing to<sup>2</sup> agree / to allow<sup>3</sup> the stranger to go ahead of them.", "notes": [["1", "faced with", "~에 직면하여"], ["2", "be willing to", "기꺼이 ~하는"], ["3", "allow A to V", "A가 ~하게 허용하다"]], "lit": "줄에서 앞으로 끼어들겠다는 이 직접적인 요청에 직면하여 / 60퍼센트의 사람들이 기꺼이 동의했다 / 그 낯선 사람이 그들보다 먼저 가도록 허용하는 것에", "nat": "줄에서 새치기하겠다는 이 직접적인 요청을 받자, 60퍼센트의 사람들이 그 낯선 사람이 자신들보다 먼저 가도록 기꺼이 허락했다.", "ana": "<b>Faced with ~</b>는 수동의 의미를 가진 분사구문(Being faced with의 생략)이며, agree to allow에서 allow는 <b>allow A to V</b> 구조를 이룬다.", "pe": "\u0001Faced with<sup>1</sup> this direct request to cut ahead in the line\u0002, / 60 percent of the people were willing \u0001to<sup>2</sup> agree\u0002 / \u0001to allow<sup>3</sup> the stranger to go ahead of them\u0002.", "pk": "\u0001줄에서 앞으로 끼어들겠다는 이 직접적인 요청에 직면하여\u0002 / 60퍼센트의 사람들이 기꺼이 동의했다 / \u0001그 낯선 사람이 그들보다 먼저 가도록 허용하는 것에\u0002", "core": "60퍼센트의 사람들이 기꺼운 상태였다.", "tags": ["(Faced with ~) = 분사구문(부사적: 이유, 수동): 주절 전체를 꾸밈", "주어 60 percent of the people, 동사 were, 보어 willing (SVC). (to agree) = to부정사(부사적): willing을 꾸밈", "(to allow ~) = to부정사(부사적): agree 꾸밈. allow A to V = A가 V하도록 허용하다"], "steps": [{"t": "이 문장은 <b>분사구문 + S+V+C(2형식)</b>이다. 뒤에 to부정사가 연달아 붙어 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: 60 percent of the people (사람들의 60퍼센트)", "V: were (be ~이다)", "C: willing (기꺼이 하는)", "뼈대 = <b>60 percent of the people were willing</b>"]}, {"t": "앞의 <b>Faced with this direct request to cut ahead in the line</b>은 <b>수동 분사구문(이유)</b>이다. 의미상 주어는 주절 주어 60 percent of the people이다 (이 직접적인 요청을 받자).", "sub": ["faced with (~에 직면한, face 직면하다의 과거분사)", "to cut ahead in the line (줄에서 새치기하겠다는) - request (요청)를 꾸미는 to부정사"]}, {"t": "<b>to agree</b>는 <b>to부정사 부사적 용법</b>이다. willing을 꾸민다 (동의하기를 기꺼이, agree 동의하다)."}, {"t": "그 뒤 <b>to allow the stranger to go ahead of them</b>은 agree의 내용이다. allow A to V (A가 V하도록 허락하다) 구조다.", "sub": ["A: the stranger (낯선 사람)", "to go ahead of them (그들보다 앞서 가도록) - them = the people (사람들)"]}], "sum": "새치기 요청을 받자 60퍼센트, 낯선 사람이 먼저 가도록 허락"}, {"i": "07", "q": "12", "s": "9", "title": "arrange for A to V + 분사 후치수식", "eng": "In one study, / Langer arranged for<sup>1</sup> a stranger to approach<sup>2</sup> someone waiting in line to use a photocopier<sup>3</sup> / and simply ask, \"Excuse me, I have five pages. May I use the copy machine?\"", "notes": [["1", "arrange for A to V", "A가 ~하도록 준비하다"], ["2", "approach", "다가가다"], ["3", "photocopier", "복사기"]], "lit": "한 연구에서 / 랭어는 한 낯선 사람이 복사기를 사용하려고 줄 서서 기다리는 누군가에게 다가가도록 준비했다 / 그리고 단순히 이렇게 물어보게 했다, '실례합니다, 저는 다섯 장이 있는데요. 제가 복사기를 사용해도 될까요?'", "nat": "한 연구에서 랭어는 낯선 사람이 복사기를 사용하려고 줄 서서 기다리는 사람에게 다가가, '실례합니다, 저는 다섯 장이 있는데요. 복사기를 사용해도 될까요?'라고 단순하게 묻도록 준비했다.", "ana": "<b>arrange for A to V</b>는 'A가 ~하도록 준비하다'라는 뜻이며, waiting in line은 someone을 수식하는 현재분사구이다.", "pe": "\u0001In one study\u0002, / Langer arranged \u0001for<sup>1</sup> a stranger to approach<sup>2</sup> someone \u0001waiting in line to use a photocopier<sup>3</sup>\u0002\u0002 / and \u0001simply ask, \"Excuse me, I have five pages. May I use the copy machine?\"\u0002", "pk": "\u0001한 연구에서\u0002 / 랭어는 \u0001한 낯선 사람이 \u0001복사기를 사용하려고 줄 서서 기다리는\u0002 누군가에게 다가가도록\u0002 준비했다 / 그리고 \u0001단순히 이렇게 물어보게 했다, '실례합니다, 저는 다섯 장이 있는데요. 제가 복사기를 사용해도 될까요?'\u0002", "core": "랭어는 준비했다.", "tags": ["(In one study) = 전치사구(부사구): 문장 전체를 꾸밈", "주어 Langer, 동사 <b>arranged</b>(1형식). (for ~ photocopier) = 전치사구(부사구): arranged 꾸밈, 거의 필수에 가까운 부사구 [기준: 모양 규칙]. (waiting ~) = 분사구: someone 꾸밈", "(simply ask ~) = approach와 병렬된 to부정사(for 전치사구에 속함): arranged를 꾸밈. simply = 부사: ask 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V(1형식) + arrange for A to V</b>이다. 분사구와 to부정사가 겹쳐 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: Langer (사람 이름)", "V: arranged (arrange 준비하다의 과거형)", "뼈대 = <b>Langer arranged</b>", "In one study (한 연구에서)는 문장 전체를 꾸미는 전치사구"]}, {"t": "<b>for a stranger to approach someone ~ and simply ask ~</b>는 전치사구(부사구)로, arranged의 내용을 나타낸다 (낯선 사람이 ~하도록 준비했다). arrange for A to V는 거의 필수에 가까운 부사구지만 수식어로 분류한다 (문형 기준).", "sub": ["a stranger는 to approach (다가가다)와 (to) ask (묻다)의 의미상 주어", "approach와 ask는 and로 병렬, simply (단순하게)는 ask를 꾸밈"]}, {"t": "<b>waiting in line to use a photocopier</b>는 <b>현재분사구</b>다. someone (어떤 사람)을 뒤에서 꾸민다 (복사기를 쓰려고 줄 서서 기다리는, photocopier 복사기).", "sub": ["to use a photocopier는 waiting을 꾸미는 to부정사(목적)"]}, {"t": "끝의 따옴표 속 말은 ask의 목적어(직접 인용)다 (Excuse me 실례합니다, copy machine 복사기)."}], "sum": "랭어, 낯선 사람이 줄 선 사람에게 복사기 써도 되는지 묻게 함"}, {"i": "08", "q": "12", "s": "12", "title": "동명사 주어 + S+V+O(동명사)", "eng": "After all, / providing a solid reason<sup>1</sup> for the request / justifies<sup>2</sup> asking to jump ahead<sup>3</sup>.", "notes": [["1", "solid reason", "확실한 이유"], ["2", "justify", "정당화하다"], ["3", "jump ahead", "앞으로 끼어들다"]], "lit": "결국 / 요청에 대한 확실한 이유를 제공하는 것은 / 앞으로 끼어드는 것을 요청하는 것을 정당화한다", "nat": "결국, 요청에 대한 확실한 이유를 대는 것은 앞에 끼어들도록 요청하는 것을 정당화해 준다.", "ana": "동명사구 <b>providing ~</b>이 문장의 주어이고, justifies의 목적어로 또 다른 동명사 <b>asking</b>이 쓰였다.", "pe": "\u0001After all\u0002, / providing a \u0001solid\u0002 reason<sup>1</sup> \u0001for the request\u0002 / justifies<sup>2</sup> asking to jump ahead<sup>3</sup>.", "pk": "\u0001결국\u0002 / \u0001요청에 대한\u0002 \u0001확실한\u0002 이유를 제공하는 것은 / 앞으로 끼어드는 것을 요청하는 것을 정당화한다", "core": "이유를 제공하는 것은 끼어들자고 요청하는 것을 정당화한다.", "tags": ["(After all) = 부사구: 문장 전체를 꾸밈 (결국)", "주어 providing a reason(동명사구). (solid) = 형용사: reason 꾸밈. (for the request) = 전치사구(형용사구): reason 꾸밈", "동사 justifies, 목적어 asking to jump ahead(동명사구) (SVO)"], "steps": [{"t": "이 문장은 <b>동명사구 주어 + S+V+O(3형식)</b>이다. 주어도 목적어도 동명사라서 낯설어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: providing a solid reason (확실한 이유를 대는 것) - 동명사구", "V: justifies (justify 정당화하다의 3인칭 단수형)", "O: asking to jump ahead (앞에 끼어들도록 요청하는 것) - 동명사구", "뼈대 = <b>providing a solid reason justifies asking ~</b>"]}, {"t": "주어 안을 본다.", "sub": ["solid (확실한)는 reason (이유)을 꾸미는 형용사", "for the request (요청에 대한) - reason을 꾸미는 형용사구"]}, {"t": "앞의 <b>After all</b> (결국)은 문장 전체를 꾸미는 부사구다."}, {"t": "목적어 안의 <b>to jump ahead</b> (앞에 끼어들다)는 asking의 내용이다."}], "sum": "확실한 이유를 대면 새치기 요청도 정당화됨"}], "qs": [{"q": "07", "type": "빈칸", "src": "2017년 9월 34번", "ans": "③", "tr": [["1", "과거의 정서적 경험에 대해서는 극도로 생생한 기억을 가지고 있으면서 과거의 일상적인 사건들에 대해서는 희미한 기억만 가지고 있다는 것은 우리가 ___함을 의미한다."], ["2", "우리는 과거를 정서적으로 흥미진진한 사건들이 집약된 하나의 시간선으로 바라보는 경향이 있다."], ["3", "우리는 어떤 일화의 자극적인 측면은 기억하고 지루한 부분은 잊어버린다."], ["4", "여름휴가는 가장 흥미로운 부분들로 기억되고, 덜 흥미진진한 부분들은 시간이 지나면서 서서히 사라져서 결국 영원히 잊혀지고 만다."], ["5", "그 결과, 다음 여름휴가가 우리에게 어떤 기분을 느끼게 할지 추정할 때, 우리는 긍정적인 면을 과대평가한다."], ["6", "과거에 대한 부정확한 그림이 미래에 대한 우리의 부정확한 예측의 한 가지 이유인 것처럼 보인다."]], "evh": "1·2·3번 문장", "ev": [{"en": true, "h": "Having extremely vivid memories of past emotional experiences and only weak memories of past everyday events means we ___. We tend to view the past as a concentrated time line of emotionally exciting events. We remember the arousing aspects of an episode and forget the boring bits."}, {"en": false, "h": "정서적 사건만 생생히 기억하고 일상은 잊는다는 1번 문장의 주어와, 흥미로운 사건 중심으로 과거를 왜곡해서 본다는 2·3번의 내용을 종합하면, 빈칸에는 '과거에 대해 편향된 인식을 유지한다'는 ③이 가장 적절하다."}], "opts": [{"n": "①", "t": "focus primarily on the future", "a": false, "x": true, "trap": false, "e": "미래에 초점을 둔다는 내용이 아니라 과거를 왜곡해서 기억하는 것에 관한 글이다."}, {"n": "②", "t": "remember every detail of our lives", "a": false, "x": true, "trap": true, "e": "오히려 지루한 부분은 잊어버린다고 했으므로 정반대다."}, {"n": "③", "t": "maintain a biased perception of the past", "a": true, "x": false, "trap": false, "e": "흥미로운 사건 위주로 과거를 기억한다는 2·3번의 내용과 정확히 일치한다."}, {"n": "④", "t": "have trouble overcoming our emotional problems", "a": false, "x": true, "trap": false, "e": "정서적 문제 극복의 어려움에 관한 내용이 아니다."}, {"n": "⑤", "t": "share negative emotional experiences with others", "a": false, "x": true, "trap": false, "e": "부정적 경험을 타인과 공유하는 것에 관한 내용은 없다."}], "w": [["extremely", "극도로"], ["vivid", "생생한"], ["emotional experience", "정서적 경험"], ["biased", "편향된"], ["perception", "인식"], ["concentrated", "집약된"], ["arousing", "자극적인"], ["episode", "일화, 사건"], ["highlight", "가장 흥미로운 부분"], ["fade away", "서서히 사라지다"], ["overestimate", "과대평가하다"], ["imprecise", "부정확한"], ["inaccurate", "부정확한"], ["forecast", "예측"]]}, {"q": "08", "type": "빈칸", "src": "2020년 6월 34번", "ans": "②", "tr": [["1", "학생들이 자료를 알지 못할 때조차도 그것을 안다고 생각하는 주된 이유 중 하나는 그들이 친숙함을 이해로 착각한다는 것이다."], ["2", "그 작동 방식은 다음과 같다."], ["3", "당신은 어쩌면 표시해 가며 그 장을 한 번 읽는다."], ["4", "그런 다음 나중에, 어쩌면 표시된 자료에 집중하며 그 장을 다시 읽는다."], ["5", "그것을 다시 읽어보면, 이전부터 기억하고 있기 때문에 그 자료가 친숙하게 느껴지고, 이 친숙함은 당신이 '그래, 나 그거 알아'라고 생각하게 만들지도 모른다."], ["6", "문제는 이 친숙하다는 느낌이 반드시 그 자료를 아는 것과 동등한 것은 아니며, 시험에서 답을 생각해 내야 할 때 아무런 도움이 되지 않을 수도 있다는 것이다."], ["7", "실제로, 친숙함은 흔히 객관식 시험에서 오류로 이어질 수 있는데, 친숙해 보이는 선택지를 고를 수 있지만 나중에 그것이 읽었던 것일 뿐 ___라는 것을 알게 되기 때문이다."]], "evh": "6·7번 문장", "ev": [{"en": true, "h": "The problem is that this feeling of familiarity is not necessarily equivalent to knowing the material. In fact, familiarity can often lead to errors on multiple-choice exams because you might pick a choice that looks familiar, only to find later that it was something you had read, but ___."}, {"en": false, "h": "친숙함이 곧 이해는 아니라는 6번과, 친숙해 보이는 선택지를 골랐다가 나중에 그것이 단지 읽었던 내용일 뿐임을 알게 된다는 7번을 종합하면, 빈칸에는 '그것이 그 질문에 대한 최선의 답은 아니었다'는 ②가 가장 적절하다."}], "opts": [{"n": "①", "t": "you could   const cc=(CMAP[c.q+'-'+c.s]||[]);
  const back=encodeURIComponent(location.origin+location.pathname);
  let x='<div class="sc open"><div class="sc-h"><span class="no2">'+esc(c.q)+'</span><span class="at">'+esc(c.q)+'번 문제 · '+esc(c.s)+'번 문장</span></div><div class="sc-b">';
  if(cc.length){x+='<div class="cks">'+cc.map(k=>'<a class="cchip" href="https://nolbada.github.io/via-mid/m/grammarcock/?c='+k[0]+'&back='+back+'">개념톡 · '+k[1]+' →</a>').join('')+'</div>';}
  for(let j=0;j<E.length;j++)x+='<div class="ch open"><div class="ce">'+mdWrap(E[j])+'</div><div class="ck">'+mdWrap(K[j]||'')+'</div></div>';
  x+='</div></div>';
  return x;
}

/* ---- 단어 확인 ---- */
function renderWord(){
  const ck=S.checks[WS.id]||{},locked=!!S.locked[WS.id],n=noteList().length;
  let h=hdr()+band(1)+`<div class="wrap ${locked?'locked':''}">`;
  WS.words.forEach((w,i)=>{
    const c=ck[i]||{};
    h+=`<div class="row"><div class="top"><span class="no">${i+1}</span><span class="word">${esc(w.w)}</span><span class="src">${esc(w.src)}번</span></div><div class="cells">`;
    h+=`<button class="cell m ${c.m?'bad':''}" data-i="${i}" data-p="m"><span class="tag">뜻</span><span>${esc(w.m)}</span></button>`;
    if(w.s)h+=`<button class="cell s ${c.s?'bad':''}" data-i="${i}" data-p="s"><span class="tag">유</span><span>${esc(w.s[0])}<span class="ko">${esc(w.s[1])}</span></span></button>`;
    if(w.a)h+=`<button class="cell a ${c.a?'bad':''}" data-i="${i}" data-p="a"><span class="tag">반</span><span>${esc(w.a[0])}<span class="ko">${esc(w.a[1])}</span></span></button>`;
    h+=`</div></div>`;
  });
  h+=`</div><div class="bar"><div class="wrap">`;
  h+=locked?`<button class="btn" disabled>확인 끝</button>`:`<button class="btn ${armed==='lock'?'arm':''}" id="lock">${armed==='lock'?'한 번 더 누르면 확인 끝':'확인 끝'}</button>`;
  h+=`<a class="btn pri" id="gonote" href="https://nolbada.github.io/via/wn/" style="display:flex;align-items:center;justify-content:center;text-decoration:none">오답노트장 가기</a></div></div>`;
  app.innerHTML=h;
  app.querySelectorAll('.cell').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,p=b.dataset.p;
    S.checks[WS.id]=S.checks[WS.id]||{};
    const c=S.checks[WS.id][i]=S.checks[WS.id][i]||{};
    c[p]=c[p]?0:1;save();
    if(c[p]){const ww=WS.words[i],x=p==='m'?[ww.w,ww.m]:p==='s'?ww.s:ww.a;if(x&&x[0]&&x[1])WN.add([{w:x[0],m:x[1],src:'미니모고',how:'별표',ask:true}]);}
    b.classList.toggle('bad',!!c[p]);
    const tw=(m)=>{let t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s';document.body.appendChild(t);}t.textContent=m;t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(()=>{t.style.opacity='0'},1600);};
    if(c[p])tw('오답노트장에 담았어요');
    else{const ww=WS.words[i],x=p==='m'?[ww.w,ww.m]:p==='s'?ww.s:ww.a;if(x&&x[0])WN.del(x[0],'미니모고').then(r=>{if(r&&r.removed===false&&r.reason==='late'){c[p]=1;save();b.classList.add('bad');tw('이미 쌓인 단어라 뺄 수 없어요')}else if(r&&r.removed)tw('오답노트장에서 뺐어요')});}
  });
  const lk=$('#lock');if(lk)lk.onclick=()=>{
    if(armed==='lock'){S.locked[WS.id]=1;armed=null;save();
      recSend({type:'word',marks:noteList().map(it=>({w:it.w.w,parts:it.parts}))});}
    else armed='lock';
    render();
  };
}
function renderNote(){
  const list=noteList();
  let h=`<header><div class="wrap hd2"><h1>단어 오답노트 <span class="meta">${list.length}개</span></h1><button class="link" id="back">확인표</button></div></header><div class="wrap">`;
  if(!list.length)h+=`<div class="empty">아직 표시한 단어가 없습니다</div>`;
  list.forEach(it=>{
    const w=it.w,r=(S.res[WS.id]||{})[it.i]||{};
    h+=`<div class="note-item"><span class="w">${esc(w.w)}</span><span class="meta">${esc(w.src)}번</span>`;
    const row=(p,tag,txt,ko)=>{
      const bad=it.parts.includes(p);
      const rs=r[p]===1?'<span class="res o">맞춤</span>':r[p]===0?'<span class="res x">틀림</span>':'';
      return `<div class="part ${p} ${bad?'bad':''}"><span class="tag">${tag}</span><span>${esc(txt)}${ko?`<span class="ko"> ${esc(ko)}</span>`:''}</span>${bad?rs:''}</div>`;
    };
    h+=row('m','뜻',w.m,'');
    if(w.s)h+=row('s','유',w.s[0],w.s[1]);
    if(w.a)h+=row('a','반',w.a[0],w.a[1]);
    h+=`</div>`;
  });
  h+=`</div><div class="bar"><div class="wrap"><button class="btn" id="back2">확인표</button><button class="btn pri" id="start" ${list.length?'':'disabled'}>복습 시작</button></div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='word';armed=null;render();};
  $('#back2').onclick=()=>{view='word';render();};
  $('#start').onclick=()=>{quiz={qs:buildQuestions(),n:0,right:0,done:false,shown:false};view='quiz';render();};
}
function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
/* ---- 답 제출 ---- */
function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});try{var _m=String(FILE).match(/^(\d\d)([ab])$/);if(_m&&window.WN)WN.hw('미니모고 '+(GCODE==='h2'?'고2':'고1'),(+_m[1])*2-(_m[2]==='a'?1:0),s+'/'+N);}catch(e){}
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}
/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';

  app.innerHTML=h;
  mmInit();
}
/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
