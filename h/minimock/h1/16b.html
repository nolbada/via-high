var EXP={"07": "<p class=\"mtr\">마더텅 정답률 <b>75%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">이 문제는 <b>일치</b>하는 것을 고르는 문제예요. 버튼마다 <b>짧게(short) ↔ 길게(long)</b>, <b>올리기(up) ↔ 내리기(down)</b>를 슬쩍 바꿔 놓았으니, 선택지 순서대로 버튼 하나씩 대조하세요.</p><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>① ↔ 4번</em>A 길게 = 스포츠 모드 (짧게는 확정) → 짧게/길게 바뀜</span><span><em>② ↔ 5번</em>B 짧게 = 홈 메뉴 (길게는 구조 신호) → 짧게/길게 바뀜</span><span><em>③ ↔ 6번</em>C 짧게 = 배경 불빛 (길게는 시계 켜고 끄기) → 짧게/길게 바뀜</span><span><em>④ ↔ 7번</em>D = 값 올리기 (내리기는 E) → 위/아래 바뀜</span></div><div class=\"ck-eq\">⇒ ①~④는 모두 한 단어씩 뒤집혀 있어요. 남은 ⑤를 12번 주의사항과 대조해요</div></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><span class=\"lab\">4번 문장 · ①의 함정</span><div class=\"en\">[A] Short press to confirm; long press to enter the sports mode.</div><p class=\"ko\">[A] 설정값을 확정하려면 짧게 누르세요; 스포츠 모드로 들어가려면 길게 누르세요.</p></div><div class=\"ck-via\"><i>▼</i><span>버튼 이름만 바꿔 놓은 함정: 내리기는 D가 아니라 9번의 E</span></div><div class=\"ck-step\"><span class=\"lab\">7번 문장 · ④의 함정</span><div class=\"en\">[D] Press to go up.</div><p class=\"ko\">[D] (값을) 올리려면 누르세요.</p></div><div class=\"ck-via\"><i>▼</i><span>⑤의 ‘최소 두 칸’, ‘업그레이드 오류’가 주의사항과 그대로 같아요</span></div><div class=\"ck-step key\"><span class=\"lab\">12번 문장 · 결정적 단서</span><div class=\"en\">Make sure the battery level of your watch <mark>has at least two bars</mark>, in order to <mark>avoid an upgrading error</mark>.</div><p class=\"ko\"><mark>업그레이드 오류를 방지하기 위하여</mark>, 반드시 당신의 시계의 배터리 잔량 표시가 <mark>최소 두 칸은 되도록</mark> 하세요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">업그레이드 오류를 피하려면 배터리 잔량 표시가 최소 두 칸은 되어야 한다.<small>12번 at least two bars(최소 두 칸)와 avoid an upgrading error(업그레이드 오류 방지)가 그대로 같아요.</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">A를 짧게 누르면 스포츠 모드로 들어간다.</span><span class=\"why\">4번에서 스포츠 모드는 long press(길게 누르기)예요. A를 짧게 누르면 confirm(확정)이에요. ‘짧게’ 한 단어만 바꾼 함정이에요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">B를 길게 누르면 '홈' 메뉴로 돌아간다.</span><span class=\"why\">5번에서 홈 메뉴는 Short press(짧게 누르기)예요. B를 길게 누르면 구조 신호 위치를 보내요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">C를 길게 누르면 배경 화면의 불빛이 켜지거나 꺼진다.</span><span class=\"why\">6번에서 배경 불빛은 Short press(짧게 누르기)예요. C를 길게 누르면 시계 자체가 켜지거나 꺼져요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">D를 누르면 설정값이 내려간다.</span><span class=\"why\">7·8번에서 D는 go up(올리기), increase(증가시키다)예요. 값을 내리는 버튼은 9·10번의 E예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">L-19 Smart Watch</div><div class=\"k\">L-19 스마트 워치</div></div><div class=\"rnat\">L-19 스마트 워치</div><div class=\"rst\">생일 선물로 스마트 워치를 받았어요! 상자를 여니 설명서가 들어 있어요. = 지문 1번, 스마트 워치 이름이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">User Guide</div><div class=\"k\">사용자 설명서</div></div><div class=\"rnat\">사용자 설명서</div><div class=\"rst\">“이거 어떻게 쓰지?” 설명서를 펼쳐요. 지문 2번은 이 글이 사용자 설명서라는 표시예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">KEY FUNCTIONS</div><div class=\"k\">주요 기능</div></div><div class=\"rnat\">주요 기능</div><div class=\"rst\">먼저 버튼부터 익혀요. 지문 3번은 주요 기능이 시작된다는 작은 제목이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">[A] Short press to confirm;</div><div class=\"k\">[A] 설정값을 확정하려면 짧게 누르세요;</div></div><div class=\"rc\"><div class=\"e\">long press to enter the sports mode.</div><div class=\"k\">스포츠 모드로 들어가려면 길게 누르세요.</div></div><div class=\"rnat\">[A] 설정값을 확정하려면 짧게 누르세요; 스포츠 모드로 들어가려면 길게 누르세요.</div><div class=\"rst\">A 버튼: 짧게 누르면 확정, <b>길게 누르면 스포츠 모드</b>(sports mode)예요. 운동하러 갈 땐 꾹 눌러요. = 지문 4번 → ① 틀림</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">[B] Short press to return to the ‘home’ menu;</div><div class=\"k\">[B] ‘홈’ 메뉴로 돌아가려면 짧게 누르세요;</div></div><div class=\"rc\"><div class=\"e\">long press to send SOS location.</div><div class=\"k\">구조 신호 위치를 보내려면 길게 누르세요.</div></div><div class=\"rnat\">[B] ‘홈’ 메뉴로 돌아가려면 짧게 누르세요; 구조 신호 위치를 보내려면 길게 누르세요.</div><div class=\"rst\">B 버튼: 짧게 누르면 홈 화면, 길게 누르면 구조 신호 위치를 보내요. 위험할 때 꾹! = 지문 5번 → ② 틀림</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">[C] Short press to turn on or off the background light;</div><div class=\"k\">[C] 배경 (화면) 불빛을 켜거나 끄려면 짧게 누르세요;</div></div><div class=\"rc\"><div class=\"e\">long press to turn on or off your watch.</div><div class=\"k\">시계를 켜거나 끄려면 길게 누르세요.</div></div><div class=\"rnat\">[C] 배경 (화면) 불빛을 켜거나 끄려면 짧게 누르세요; 시계를 켜거나 끄려면 길게 누르세요.</div><div class=\"rst\">C 버튼: 짧게 누르면 화면 불빛, 길게 누르면 시계 전원이 켜지고 꺼져요. = 지문 6번 → ③ 틀림</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">[D] Press to go up.</div><div class=\"k\">[D] (값을) 올리려면 누르세요.</div></div><div class=\"rnat\">[D] (값을) 올리려면 누르세요.</div><div class=\"rst\">D 버튼은 <b>올리기</b>(go up)예요. 알람 시간 숫자를 올릴 때 눌러요. = 지문 7번 → ④ 틀림</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">(In time, date or other settings,</div><div class=\"k\">(시간, 날짜, 또는 다른 설정에서,</div></div><div class=\"rc\"><div class=\"e\">press the key to increase the value.)</div><div class=\"k\">값을 증가시키려면 키를 누르세요.)</div></div><div class=\"rnat\">(시간, 날짜, 또는 다른 설정에서, 값을 증가시키려면 키를 누르세요.)</div><div class=\"rst\">시간이나 날짜를 맞출 때 D를 누르면 숫자가 하나씩 커져요. = 지문 8번의 값 증가예요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">[E] Press to go down.</div><div class=\"k\">[E] (값을) 내리려면 누르세요.</div></div><div class=\"rnat\">[E] (값을) 내리려면 누르세요.</div><div class=\"rst\">E 버튼은 반대로 내리기예요. 숫자를 줄이고 싶으면 이걸 눌러요. = 지문 9번</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">(In time, date or other settings,</div><div class=\"k\">(시간, 날짜, 또는 다른 설정에서,</div></div><div class=\"rc\"><div class=\"e\">press the key to decrease the value.)</div><div class=\"k\">값을 감소시키려면 키를 누르세요.)</div></div><div class=\"rnat\">(시간, 날짜, 또는 다른 설정에서, 값을 감소시키려면 키를 누르세요.)</div><div class=\"rst\">시간·날짜 설정에서 E를 누르면 숫자가 하나씩 작아져요. = 지문 10번의 값 감소예요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">CAUTION</div><div class=\"k\">주의사항</div></div><div class=\"rnat\">주의사항</div><div class=\"rst\">마지막으로 꼭 지켜야 할 것! 지문 11번은 주의사항이 시작된다는 작은 제목이에요.</div></div><div class=\"rds key\" data-ord=\"12\"><span class=\"rn\">12번 · 단서</span><div class=\"rc\"><div class=\"e\">Make sure</div><div class=\"k\">반드시 ~하도록 하세요,</div></div><div class=\"rc\"><div class=\"e\">the battery level of your watch</div><div class=\"k\">당신의 시계의 배터리 잔량 표시가</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">has at least two bars</span>,</div><div class=\"k\"><span class=\"cw\">최소 두 칸은 되도록</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">in order to avoid an upgrading error</span>.</div><div class=\"k\"><span class=\"cw\">업그레이드 오류를 방지하기 위하여</span>.</div></div><div class=\"rnat\">업그레이드 오류를 방지하기 위하여, 반드시 (당신의) 시계의 배터리 잔량 표시가 최소 두 칸은 되도록 하세요.</div><div class=\"rst\">시계를 업데이트하기 전엔 배터리가 <b>최소 두 칸</b>(at least two bars)은 있어야 오류가 안 나요. = 지문 12번 → ⑤ 일치</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"confirm\" data-m=\"확정하다, 확인하다\"><b>confirm</b>확정하다, 확인하다</button><button type=\"button\" class=\"wdb\" data-w=\"long press\" data-m=\"길게 누르기\"><b>long press</b>길게 누르기</button><button type=\"button\" class=\"wdb\" data-w=\"background light\" data-m=\"배경 (화면) 불빛\"><b>background light</b>배경 (화면) 불빛</button><button type=\"button\" class=\"wdb\" data-w=\"increase\" data-m=\"증가시키다\"><b>increase</b>증가시키다</button><button type=\"button\" class=\"wdb\" data-w=\"battery level\" data-m=\"배터리 잔량\"><b>battery level</b>배터리 잔량</button><button type=\"button\" class=\"wdb\" data-w=\"avoid\" data-m=\"피하다, 방지하다\"><b>avoid</b>피하다, 방지하다</button></div>", "08": "<p class=\"mtr\">마더텅 정답률 <b>75%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">주어진 문장의 <b>these dogs</b>(이 개들)는 바로 앞에 ‘어떤 개들’이 나와야 받을 수 있어요. 그리고 <b>코 대신 눈</b>이라는 말 뒤에는 ‘코가 늘 켜져 있진 않다’는 결론이 와야 해요.</p><div class=\"ck-step\"><span class=\"lab\">주어진 문장 · 연결 신호</span><div class=\"en\">Surprised by the vision of <mark>an unfamiliar silhouette</mark> … <mark>these dogs</mark> were using their eyes <mark>instead of their noses</mark>.</div><p class=\"ko\"><mark>낯선 윤곽(실루엣)</mark>의 모습에 깜짝 놀라서 … <mark>이 개들은</mark> <mark>코 대신</mark> 눈을 사용하고 있었다.</p></div><div class=\"ck-via\"><i>▼</i><span>these dogs(이 개들) = 새 머리 모양·새 코트의 주인에게 달려든 개들</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 · 앞 문장 (⑤ 바로 앞)</span><div class=\"en\">Many owners have been <mark>snapped at by their dogs</mark> when they returned home <mark>with a new hairdo or a new coat</mark>.</div><p class=\"ko\">많은 주인들이 <mark>그들의 개에게 물릴 뻔한 적이 있다</mark> 집에 돌아왔을 때 <mark>새로운 머리 모양을 하거나 새로운 코트를 입고</mark></p></div><div class=\"ck-via\"><i>▼</i><span>‘코 대신 눈’을 썼다 → 그러니 코가 늘 켜져 있는 건 아니다</span></div><div class=\"ck-step\"><span class=\"lab\">8번 · 뒤 문장 (⑤ 바로 뒤)</span><div class=\"en\">Their noses may be remarkable, but they’re <mark>not always switched on</mark>.</div><p class=\"ko\">그들의 코가 뛰어날지 모르지만, 그것들이 <mark>항상 켜져 있는(작동되는) 것은 아니다</mark></p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>7번</em>새 머리·새 코트 주인에게 개가 으르렁</span><span><em>주어진 문장</em>낯선 실루엣에 놀라 코 대신 눈을 씀</span><span><em>8번</em>코는 뛰어나도 늘 켜져 있진 않음</span></div><div class=\"ck-eq\">⇒ 장면 → 이유 → 결론, 세 고리가 다 맞는 자리 = ⑤</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">7번 문장과 8번 문장 사이<small>these dogs(이 개들)가 받을 7번의 개들이 바로 앞에 있고, 뒤의 8번이 결론을 내려요.</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">6번 문장과 7번 문장 사이</span><span class=\"why\">6번 other senses(다른 감각) 바로 뒤라 그럴듯해 보여요. 하지만 these dogs(이 개들)가 받을 구체적인 장면(7번 새 머리·새 코트)이 아직 안 나와서 이 개들이 누군지 몰라요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">3번 문장과 4번 문장 사이</span><span class=\"why\">3번은 ‘어른이 비도 그치게 할 것’이라는 아이의 상상이에요. 개가 아직 나오지도 않아서 these dogs(이 개들)가 받을 대상이 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">4번 문장과 5번 문장 사이</span><span class=\"why\">4번은 개의 후각에 대한 우리 기대를 막 꺼낸 참이에요. 아직 개가 무언가를 본 장면이 없어서 these dogs(이 개들)가 받을 개들이 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">5번 문장과 6번 문장 사이</span><span class=\"why\">5번은 ‘개는 뭐든 냄새 맡는다’는 우리 가정이에요. 여기서 ‘코 대신 눈’ 장면이 먼저 나오면, 6번 But dogs use other senses(하지만 개는 다른 감각도 쓴다)가 꺼낼 말을 앞질러 흐름이 꼬여요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds key\" data-ord=\"1\"><span class=\"rn\">1번 · 단서</span><div class=\"rc\"><div class=\"e\">Surprised by the vision</div><div class=\"k\">~의 모습에 깜짝 놀라서</div></div><div class=\"rc\"><div class=\"e\">of an unfamiliar silhouette</div><div class=\"k\">낯선 윤곽(실루엣)</div></div><div class=\"rc\"><div class=\"e\">pushing into the house,</div><div class=\"k\">집 안으로 밀고 들어오는</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">these dogs</span> were using their eyes</div><div class=\"k\"><span class=\"cw\">이 개들은</span> 눈을 사용하고 있었다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">instead of their noses</span>.</div><div class=\"k\"><span class=\"cw\">코 대신</span></div></div><div class=\"rnat\">[주어진 문장] 집 안으로 밀고 들어오는 낯선 윤곽(실루엣)의 모습을 보고 깜짝 놀라서, 이 개들은 코 대신 눈을 사용하고 있었다.</div><div class=\"rst\">〈주어진 문장〉 <b>이 개들</b>(these dogs)은 낯선 모습에 놀라서 <b>코 대신 눈</b>(instead of their noses)을 쓰고 있었어요. = 지문의 실루엣 장면.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Remember when you were little</div><div class=\"k\">당신이 어렸을 때를 기억하는가</div></div><div class=\"rc\"><div class=\"e\">and you imagined</div><div class=\"k\">그리고 당신이 상상했던</div></div><div class=\"rc\"><div class=\"e\">that adults had infinite power?</div><div class=\"k\">어른들이 무한한 힘을 가졌다고</div></div><div class=\"rnat\">당신이 어렸고 어른들이 무한한 힘을 가졌다고 상상하던 때를 기억하는가?</div><div class=\"rst\">어릴 때 엄마 아빠는 뭐든 할 수 있는 사람인 줄 알았죠? 지문도 어른이 무한한 힘을 가졌다고 상상했던 때를 떠올려 보래요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Surely someone</div><div class=\"k\">분명히 누군가는</div></div><div class=\"rc\"><div class=\"e\">who could drive the car,</div><div class=\"k\">자동차를 운전할 수 있고,</div></div><div class=\"rc\"><div class=\"e\">open the juice container,</div><div class=\"k\">주스 병을 열 수 있고,</div></div><div class=\"rc\"><div class=\"e\">and reach the sink</div><div class=\"k\">싱크대에 (손이) 닿을 수 있는</div></div><div class=\"rc\"><div class=\"e\">could make it stop raining.</div><div class=\"k\">비를 그치도록 할 수 있을 것이었다.</div></div><div class=\"rnat\">분명히 자동차를 운전할 수 있고, 주스 병을 열 수 있고, 싱크대에 (손이) 닿을 수 있는 누군가(어른)는 비를 그치도록 할 수 있을 것이었다.(그만큼 어른들은 모든 것을 할 수 있다고 여겼음)</div><div class=\"rst\">운전도 하고, 꽉 닫힌 주스 뚜껑도 열고, 높은 싱크대에도 손이 닿으니 비도 그치게 할 줄 알았어요. = 지문 3번 그대로예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">I think that’s the same expectation</div><div class=\"k\">나는 그것이 똑같은 기대라고 생각한다</div></div><div class=\"rc\"><div class=\"e\">that we have</div><div class=\"k\">우리가 가지는</div></div><div class=\"rc\"><div class=\"e\">with respect to our dogs</div><div class=\"k\">우리의 개에 관해서</div></div><div class=\"rc\"><div class=\"e\">and their ability to smell.</div><div class=\"k\">그리고 냄새를 맡는 그들의 능력에 관해서</div></div><div class=\"rnat\">① 나는 그것이 우리가 우리의 개와 냄새를 맡는 그들의 능력에 관해서 가지는 (것과) 똑같은 기대라고 생각한다.</div><div class=\"rst\">우리 집 강아지 코에 대해서도 우리는 똑같은 기대를 해요. 지문은 이게 개의 후각에 대한 우리의 기대와 같다고 해요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Because they are so good at using their noses,</div><div class=\"k\">그들이 코를 사용하는 것을 아주 잘하기 때문에,</div></div><div class=\"rc\"><div class=\"e\">we assume</div><div class=\"k\">우리는 가정한다</div></div><div class=\"rc\"><div class=\"e\">that they can smell anything, anytime.</div><div class=\"k\">그들이 무엇이든지, 언제든지 냄새를 맡을 수 있다고</div></div><div class=\"rnat\">② 그들이 코를 사용하는 것을 아주 잘하기 때문에(코를 사용하는 능력이 아주 뛰어나기 때문에), 우리는 그들이 무엇이든지, 언제든지 냄새를 맡을 수 있다고 가정한다.</div><div class=\"rst\">강아지가 간식 냄새를 기막히게 찾으니까, 뭐든 언제든 다 맡는 줄 알아요. = 지문의 ‘무엇이든, 언제든 냄새 맡는다고 가정한다’.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">But dogs use other senses, too,</div><div class=\"k\">하지만 개들은 다른 감각도 또한 사용하고,</div></div><div class=\"rc\"><div class=\"e\">and the brains of both humans and dogs</div><div class=\"k\">인간과 개 양쪽 모두의 뇌는</div></div><div class=\"rc\"><div class=\"e\">tend to intensify one sense at a time.</div><div class=\"k\">한 번에 한 가지 감각을 심화시키는 경향이 있다</div></div><div class=\"rnat\">③ 하지만 개들은 다른 감각도 또한 사용하고, 인간과 개 양쪽 모두의 뇌는 한 번에 한 가지 감각을 심화시키는 경향이 있다.</div><div class=\"rst\"><b>하지만</b>(But) 강아지도 눈·귀를 같이 쓰고, 뇌는 한 번에 한 감각만 세게 켜요. = 지문의 ‘한 번에 한 감각을 심화시킨다’.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">Many owners have been snapped at by their dogs</div><div class=\"k\">많은 주인들이 그들의 개에게 물릴 뻔한 적이 있다</div></div><div class=\"rc\"><div class=\"e\">when they returned home</div><div class=\"k\">그들이 집에 돌아왔을 때</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">with a new hairdo or a new coat</span>.</div><div class=\"k\"><span class=\"cw\">새로운 머리 모양을 하거나 새로운 코트를 입고</span></div></div><div class=\"rnat\">④ 많은 주인들이 그들이 새로운 머리 모양을 하거나 새로운 코트를 입고 집에 돌아왔을 때 그들의 개에게 물릴 뻔한 적이 있다.</div><div class=\"rst\">그래서 아빠가 미용실 다녀오거나 새 코트를 입고 오면, 우리 강아지가 아빠한테 왕왕 짖으며 달려들어요. = 지문 7번의 장면.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc\"><div class=\"e\">Their noses may be remarkable,</div><div class=\"k\">그들의 코가 뛰어날지 모르지만,</div></div><div class=\"rc ckc\"><div class=\"e\">but they’re <span class=\"cw\">not always switched on</span>.</div><div class=\"k\">그것들이 <span class=\"cw\">항상 켜져 있는(작동되는) 것은 아니다</span></div></div><div class=\"rnat\">⑤ 그들의 코가 뛰어날지 모르지만, 그것들이 항상 켜져 있는(작동되는) 것은 아니다.</div><div class=\"rst\">강아지 코가 아무리 뛰어나도 <b>늘 켜져 있는 건 아니에요</b>(not always switched on). 눈을 쓰는 동안 코는 꺼져 있었던 거예요. = 지문의 결론.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"silhouette\" data-m=\"실루엣, 윤곽\"><b>silhouette</b>실루엣, 윤곽</button><button type=\"button\" class=\"wdb\" data-w=\"infinite power\" data-m=\"무한한 힘\"><b>infinite power</b>무한한 힘</button><button type=\"button\" class=\"wdb\" data-w=\"with respect to\" data-m=\"~에 관해서\"><b>with respect to</b>~에 관해서</button><button type=\"button\" class=\"wdb\" data-w=\"intensify\" data-m=\"강화하다, 심화시키다\"><b>intensify</b>강화하다, 심화시키다</button><button type=\"button\" class=\"wdb\" data-w=\"snapped at\" data-m=\"~에게 물릴 뻔한 (snap at 덥석 물려고 하다)\"><b>snapped at</b>~에게 물릴 뻔한 (snap at 덥석 물려고 하다)</button><button type=\"button\" class=\"wdb\" data-w=\"remarkable\" data-m=\"놀라운, 뛰어난\"><b>remarkable</b>놀라운, 뛰어난</button></div>", "09": "<p class=\"mtr\">마더텅 정답률 <b>75%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">무관한 문장은 <b>글 전체 화제</b>를 먼저 잡고 하나씩 대 보는 문제예요. 이 글의 화제는 원주민이 <b>주변 환경·생활 방식에 맞춰 물건을 만든 것</b>이에요. tribe(부족)라는 단어만 같고 ‘만들기’ 이야기가 없는 문장을 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">1번 · 글 전체 화제</span><div class=\"en\">Early native Americans had to <mark>make everything they needed</mark>.</div><p class=\"ko\">초기 아메리카 원주민들은 <mark>그들이 필요한 모든 것을 만들어야 했다</mark></p></div><div class=\"ck-via\"><i>▼</i><span>만든 물건은 주변에서 찾은 재료에 따라 달랐다</span></div><div class=\"ck-step\"><span class=\"lab\">①(2번) · 화제 이어 가기</span><div class=\"en\">The kinds of things each tribe used to make tools … <mark>depended upon what they found around them</mark>.</div><p class=\"ko\">도구 … 를 만들기 위해 각 부족이 사용했던 것들의 종류는 <mark>그들이 주변에서 발견한 것</mark>에 따라 달랐다</p></div><div class=\"ck-via\"><i>▼</i><span>Also(또한)로 기준 하나 더: 생활 방식</span></div><div class=\"ck-step\"><span class=\"lab\">②(3번) · 두 번째 기준</span><div class=\"en\">Also, the things they made <mark>fit their life style</mark>.</div><p class=\"ko\">또한, 그들이 만든 것들은 <mark>그들의 생활 방식에 적합했다</mark></p></div><div class=\"ck-via\"><i>▼</i><span>만들기 이야기가 갑자기 언어·소통 이야기로 바뀜</span></div><div class=\"ck-step key\"><span class=\"lab\">③(4번) · 이탈 지점</span><div class=\"en\">Most tribes <mark>spoke their own language</mark>, but could communicate with other tribes.</div><p class=\"ko\">대부분의 부족은 <mark>그들만의 언어를 말했지만</mark>, 다른 부족들과 소통할 수 있었다</p></div><div class=\"ck-via\"><i>▼</i><span>③을 빼면 ②의 ‘생활 방식에 맞음’ → For example(예를 들어)로 바로 이어짐</span></div><div class=\"ck-step\"><span class=\"lab\">④(5번) · 다시 제자리</span><div class=\"en\"><mark>For example</mark>, the people of the Plains, who traveled a lot, didn’t make clay pots.</div><p class=\"ko\"><mark>예를 들어</mark>, 이동을 많이 했던 대초원의 사람들은 점토 단지를 만들지 않았다</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">부족마다 고유 언어를 썼지만 다른 부족과 소통할 수 있었다<small>물건 만들기가 아니라 언어·소통 이야기라 흐름에서 튀어요.</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">단지는 무겁고 잘 깨져서 동물 가죽으로 용기를 만들었다</span><span class=\"why\">점토 단지를 안 만든 이유라 화제가 바뀐 것 같지만, ④ 대초원 사람들 예시의 이유를 이어서 말해요. 이동이 잦은 생활 방식에 맞춰 가죽 용기를 만든 거예요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">부족이 쓴 재료는 주변에서 발견한 것에 따라 달랐다</span><span class=\"why\">1번 make everything(모든 것을 만들다)을 받아, 무엇으로 만들었는지가 주변 환경에 달렸다고 화제를 넓혀요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">만든 물건은 생활 방식에 잘 맞았다</span><span class=\"why\">Also(또한)로 ①에 기준을 하나 더 보태요. ‘생활 방식에 맞춤’은 뒤의 ④⑤ 예시로 이어지는 핵심이에요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">이동이 많던 대초원 사람들은 점토 단지를 만들지 않았다</span><span class=\"why\">For example(예를 들어)로 ② ‘생활 방식에 맞게 만들었다’의 실제 예를 들어요. 이동이 많은 생활에 단지는 안 맞았던 거예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Early native Americans</div><div class=\"k\">초기 아메리카 원주민들은</div></div><div class=\"rc\"><div class=\"e\">had to make everything they needed.</div><div class=\"k\">그들이 필요한 모든 것을 만들어야 했다</div></div><div class=\"rnat\">초기 아메리카 원주민들은 그들이 필요한 모든 것을 만들어야 했다.</div><div class=\"rst\">캠핑을 떠난 우리 가족, 가게가 없어서 필요한 건 다 직접 만들어야 해요. 지문도 초기 원주민은 필요한 걸 다 만들어야 했대요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">① The kinds of things</div><div class=\"k\">① 것들의 종류는</div></div><div class=\"rc\"><div class=\"e\">each tribe used</div><div class=\"k\">각 부족이 사용했던</div></div><div class=\"rc\"><div class=\"e\">to make tools, clothing, toys, shelter, and food</div><div class=\"k\">도구, 옷, 장난감, 주거지, 그리고 음식을 만들기 위해</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">depended upon</span></div><div class=\"k\"><span class=\"cw\">~에 따라 달랐다</span></div></div><div class=\"rc\"><div class=\"e\">what they found around them.</div><div class=\"k\">그들이 주변에서 발견한 것</div></div><div class=\"rnat\">① 각 부족이 도구, 옷, 장난감, 주거지, 그리고 음식을 만들기 위해 사용했던 것들의 종류는 그들이 주변에서 발견한 것에 따라 달랐다.</div><div class=\"rst\">① 바닷가에선 조개껍데기로, 숲에선 나뭇가지로 그릇을 만들어요. = 지문의 ‘<b>주변에서 발견한 것</b>에 따라 달랐다’.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc\"><div class=\"e\">② Also,</div><div class=\"k\">② 또한,</div></div><div class=\"rc\"><div class=\"e\">the things they made</div><div class=\"k\">그들이 만든 것들은</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">fit their life style</span>.</div><div class=\"k\"><span class=\"cw\">그들의 생활 방식에 적합했다</span></div></div><div class=\"rnat\">② 또한, 그들이 만든 것들은 그들의 생활 방식에 적합했다.</div><div class=\"rst\">② <b>또한</b>(Also) 만든 물건은 우리 생활에 딱 맞아야 해요. 지문도 만든 것들이 <b>생활 방식에 적합</b>했다고 해요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">③ Most tribes <span class=\"cw\">spoke their own language</span>,</div><div class=\"k\">③ 대부분의 부족은 <span class=\"cw\">그들만의 언어를 말했지만</span>,</div></div><div class=\"rc\"><div class=\"e\">but could communicate with other tribes.</div><div class=\"k\">다른 부족들과 소통할 수 있었다</div></div><div class=\"rnat\">③ 대부분의 부족은 그들만의 언어를 말했지만, 다른 부족들과 소통할 수 있었다.</div><div class=\"rst\">③ 갑자기 “캠핑장마다 사투리가 달라도 서로 말은 통했다”는 얘기가 나와요. 만들기가 아니라 <b>언어</b>라 지문 흐름에서 튀어요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">④ <span class=\"cw\">For example</span>,</div><div class=\"k\">④ <span class=\"cw\">예를 들어</span>,</div></div><div class=\"rc\"><div class=\"e\">the people of the Plains,</div><div class=\"k\">대초원의 사람들은,</div></div><div class=\"rc\"><div class=\"e\">who traveled a lot,</div><div class=\"k\">이동을 많이 했던,</div></div><div class=\"rc\"><div class=\"e\">didn’t make clay pots.</div><div class=\"k\">점토 단지를 만들지 않았다</div></div><div class=\"rnat\">④ 예를 들어, 이동을 많이 했던 대초원의 사람들은 점토 단지를 만들지 않았다.</div><div class=\"rst\">④ <b>예를 들어</b>(For example) 매일 텐트를 옮기는 날엔 무거운 냄비를 안 챙겨요. = 이동이 잦아 점토 단지를 안 만든 대초원 사람들.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">⑤ Pots were too heavy</div><div class=\"k\">⑤ 단지는 너무 무거웠고</div></div><div class=\"rc\"><div class=\"e\">and broke too easily</div><div class=\"k\">너무 쉽게 깨져서</div></div><div class=\"rc\"><div class=\"e\">when they were moved,</div><div class=\"k\">그것들이 옮겨질 때</div></div><div class=\"rc\"><div class=\"e\">so they made containers from animal skins.</div><div class=\"k\">그들은 동물 가죽으로 용기를 만들었다</div></div><div class=\"rnat\">⑤ 단지는 그것들이 옮겨질 때 너무 무겁고 또 너무 쉽게 깨져서, 그들은 동물 가죽으로 용기를 만들었다.</div><div class=\"rst\">⑤ 냄비는 무겁고 옮기다 깨지니까 가벼운 천 주머니를 써요. 지문도 단지 대신 동물 가죽으로 용기를 만들었대요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"tribe\" data-m=\"부족\"><b>tribe</b>부족</button><button type=\"button\" class=\"wdb\" data-w=\"shelter\" data-m=\"주거지\"><b>shelter</b>주거지</button><button type=\"button\" class=\"wdb\" data-w=\"depend upon\" data-m=\"~에 달려 있다, ~에 따라 다르다\"><b>depend upon</b>~에 달려 있다, ~에 따라 다르다</button><button type=\"button\" class=\"wdb\" data-w=\"communicate\" data-m=\"소통하다\"><b>communicate</b>소통하다</button><button type=\"button\" class=\"wdb\" data-w=\"clay pot\" data-m=\"점토 단지\"><b>clay pot</b>점토 단지</button><button type=\"button\" class=\"wdb\" data-w=\"container\" data-m=\"용기, 그릇\"><b>container</b>용기, 그릇</button></div>", "10": "<p class=\"mtr\">마더텅 정답률 <b>65%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">장문 순서는 <b>시간의 흐름</b>과 <b>지시어</b>로 이어 붙이는 문제예요. 준비 → <b>The big day</b>(그 중요한 날) → <b>later</b>(나중에) → <b>there</b>(그곳)이 가리키는 기관 순으로 고리를 확인하세요.</p><div class=\"ck-step\"><span class=\"lab\">(A) 끝 · 주어진 글</span><div class=\"en\">A deal was struck and the student began working <mark>to make the concert a success</mark>.</div><p class=\"ko\">거래가 성사되었고 그 학생은 <mark>콘서트를 성공시키기 위해</mark> 노력하기 시작했다</p></div><div class=\"ck-via\"><i>▼</i><span>The big day(그 중요한 날) = (A)에서 준비하던 음악회 당일</span></div><div class=\"ck-step key\"><span class=\"lab\">(D) · 첫 번째 고리</span><div class=\"en\"><mark>The big day</mark> arrived.</div><p class=\"ko\">(드디어) <mark>그 중요한 날</mark>이 왔다.</p></div><div class=\"ck-via\"><i>▼</i><span>(D)에서 학생 이야기가 끝나고, later(나중에)로 세월이 흐름</span></div><div class=\"ck-step key\"><span class=\"lab\">(B) · 두 번째 고리</span><div class=\"en\">Paderewski <mark>later</mark> went on to become the Prime Minister of Poland.</div><p class=\"ko\"><mark>나중에</mark> Paderewski는 폴란드의 수상이 되었다.</p></div><div class=\"ck-via\"><i>▼</i><span>there(그곳) = (B) 끝의 미국 식품 원조 기관</span></div><div class=\"ck-step key\"><span class=\"lab\">(C) · 세 번째 고리</span><div class=\"en\"><mark>The head there</mark> was a man called Herbert Hoover …</div><p class=\"ko\"><mark>그곳의 책임자는</mark> Herbert Hoover라는 이름의 남자였고 …</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">(D) – (B) – (C)<small>음악회 당일 → 세월이 흐름 → 그곳의 책임자, 세 고리가 모두 맞아요.</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">(D) – (C) – (B)</span><span class=\"why\">(D)까지는 맞지만, (D) 끝은 학생의 감사 인사예요. (C) The head there(그곳의 책임자)의 ‘그곳’이 가리킬 기관이 앞에 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">(B) – (D) – (C)</span><span class=\"why\">(A)는 음악회 준비 중인데 바로 later(나중에) 수상이 됐다고 건너뛰어요. 또 (C)가 (D) 뒤에 오면 there(그곳)가 가리킬 원조 기관이 바로 앞에 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">(C) – (B) – (D)</span><span class=\"why\">(A) 바로 뒤에 (C) The head there(그곳의 책임자)가 오면 ‘그곳’이 가리킬 미국 원조 기관이 아직 안 나왔어요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">(C) – (D) – (B)</span><span class=\"why\">(C)가 맨 앞이라 there(그곳)가 가리킬 대상이 없어요. 또 (B)에서 수상이 되기도 전인데 (C) 21번에서 벌써 ‘수상님’이라고 불러요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><span class=\"ordc\">정답 순서 주어진 글</span><div class=\"rc\"><div class=\"e\">(A) A college student</div><div class=\"k\">(A) 한 대학생이</div></div><div class=\"rc\"><div class=\"e\">was struggling to pay</div><div class=\"k\">(돈을) 내려고 애쓰고 있었다</div></div><div class=\"rc\"><div class=\"e\">his school fees.</div><div class=\"k\">그의 학비를</div></div><div class=\"rnat\">(A)(1) 한 대학생이 그의 학비를 내려고 애쓰고 있었다.</div><div class=\"rst\">(A) 한 대학생이 학비를 낼 돈이 없어 애태우고 있었어요. 이 이야기의 출발점이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><span class=\"ordc\">정답 순서 주어진 글</span><div class=\"rc\"><div class=\"e\">He was an orphan,</div><div class=\"k\">그(= 대학생)는 고아였고,</div></div><div class=\"rc\"><div class=\"e\">and not knowing where to turn for money,</div><div class=\"k\">어디에서 돈을 구해야 할지 모르던 중에,</div></div><div class=\"rc\"><div class=\"e\">he came up with a bright idea.</div><div class=\"k\">그는 멋진 아이디어를 생각해냈다</div></div><div class=\"rnat\">(A)(2) 그(대학생)는 고아였고 어디에서 돈을 구해야 할지 모르던 중에, 그는 멋진 아이디어를 생각해냈다.</div><div class=\"rst\">그는 부모님이 안 계셔서 돈을 구할 곳도 없었어요. 그때 멋진 아이디어가 떠올랐대요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><span class=\"ordc\">정답 순서 주어진 글</span><div class=\"rc\"><div class=\"e\">He decided to host a music concert on campus</div><div class=\"k\">그(= 대학생)는 캠퍼스에서 음악 연주회를 열기로 결심했다</div></div><div class=\"rc\"><div class=\"e\">to raise money for his education.</div><div class=\"k\">그의 교육을 위한 돈(학비)을 모으기 위해</div></div><div class=\"rnat\">(A)(3) 그(대학생)는 그의 교육을 위한 돈(학비)을 모으기 위해 캠퍼스에서 음악 연주회를 열기로 결심했다.</div><div class=\"rst\">학교 축제처럼 캠퍼스에서 음악회를 열어 학비를 모으기로 해요. = 지문의 ‘연주회를 열기로 결심했다’.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><span class=\"ordc\">정답 순서 주어진 글</span><div class=\"rc\"><div class=\"e\">He asked</div><div class=\"k\">그(= 대학생)는 요청했다</div></div><div class=\"rc\"><div class=\"e\">the great pianist Ignacy Paderewski</div><div class=\"k\">위대한 피아니스트 Ignacy Paderewski에게</div></div><div class=\"rc\"><div class=\"e\">to come and play.</div><div class=\"k\">(캠퍼스에) 와서 (피아노를) 연주해 줄 것을</div></div><div class=\"rnat\">(A)(4) 그(대학생)는 위대한 피아니스트 Ignacy Paderewski에게 (캠퍼스에) 와서 (피아노를) 연주해 줄 것을 요청했다.</div><div class=\"rst\">그 학생은 유명한 피아니스트 파데레프스키에게 와서 연주해 달라고 부탁해요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><span class=\"ordc\">정답 순서 주어진 글</span><div class=\"rc\"><div class=\"e\">(a) His manager</div><div class=\"k\">(a) 그(= Paderewski)의 매니저는</div></div><div class=\"rc\"><div class=\"e\">demanded $2,000</div><div class=\"k\">2,000달러를 요구했다</div></div><div class=\"rc\"><div class=\"e\">for the piano recital.</div><div class=\"k\">피아노 연주회에 대해</div></div><div class=\"rnat\">(A)(5) (a) 그(Paderewski)의 매니저는 피아노 연주회에 대해 2,000달러를 요구했다.</div><div class=\"rst\">파데레프스키의 매니저가 연주 대가로 2,000달러를 달라고 해요. 학생에겐 엄청 큰돈이에요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><span class=\"ordc\">정답 순서 주어진 글</span><div class=\"rc\"><div class=\"e\">A deal was struck</div><div class=\"k\">거래가 성사되었고</div></div><div class=\"rc\"><div class=\"e\">and the student began working</div><div class=\"k\">그 학생은 노력하기 시작했다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">to make the concert a success</span>.</div><div class=\"k\"><span class=\"cw\">콘서트를 성공시키기 위해</span></div></div><div class=\"rnat\">(A)(6) 거래가 성사되었고 그 학생은 콘서트를 성공시키기 위해 노력하기 시작했다.</div><div class=\"rst\">약속이 정해지고, 학생은 음악회를 성공시키려고 열심히 준비해요. 이제 남은 건 음악회 날이에요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc ckc\"><div class=\"e\">(D) <span class=\"cw\">The big day</span> arrived.</div><div class=\"k\">(D) (드디어) <span class=\"cw\">그 중요한 날</span>이 왔다.</div></div><div class=\"rnat\">(D)(1) (드디어) 그 중요한 날이 왔다.</div><div class=\"rst\">(D) <b>그 중요한 날</b>(The big day)이 왔어요. (A)에서 준비하던 바로 그 음악회 날이에요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">But unfortunately,</div><div class=\"k\">그러나 불행하게도,</div></div><div class=\"rc\"><div class=\"e\">he had not managed to sell</div><div class=\"k\">그(= 대학생)는 팔지 못했다</div></div><div class=\"rc\"><div class=\"e\">enough tickets.</div><div class=\"k\">충분한 입장권(표)을</div></div><div class=\"rnat\">(D)(2) 그러나 불행하게도, 그(대학생)는 충분한 입장권(입장권을 충분히) 팔지 못했다.</div><div class=\"rst\"><b>그런데</b>(But) 표가 생각만큼 안 팔렸어요. 반 친구들한테 축제 표를 팔았는데 반도 못 판 느낌이에요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">The total amount collected</div><div class=\"k\">모인 총 금액은</div></div><div class=\"rc\"><div class=\"e\">was only $1,600.</div><div class=\"k\">1,600달러뿐이었다</div></div><div class=\"rnat\">(D)(3) 모인 총 금액은 1,600달러뿐이었다.</div><div class=\"rst\">모인 돈은 1,600달러뿐이에요. 약속한 2,000달러에 400달러가 모자라요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">Disappointed,</div><div class=\"k\">실망한 채,</div></div><div class=\"rc\"><div class=\"e\">he went to Paderewski</div><div class=\"k\">그(= 대학생)는 Paderewski에게 가서</div></div><div class=\"rc\"><div class=\"e\">and explained his difficulty.</div><div class=\"k\">그의 어려움을 설명했다</div></div><div class=\"rnat\">(D)(4) 실망한 채, 그(대학생)는 Paderewski에게 가서 그의 어려움을 설명했다.</div><div class=\"rst\">실망한 학생은 파데레프스키를 찾아가 사정을 솔직하게 털어놓아요. = 지문의 ‘어려움을 설명했다’.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">Paderewski returned the $1,600</div><div class=\"k\">Paderewski는 1,600달러를 돌려주면서</div></div><div class=\"rc\"><div class=\"e\">and told the student:</div><div class=\"k\">그 학생에게 (다음과 같이) 말했다:</div></div><div class=\"rc\"><div class=\"e\">“Here’s the $1,600.</div><div class=\"k\">“여기 1,600달러를 받게.</div></div><div class=\"rc\"><div class=\"e\">Keep the money you need for your fees.”</div><div class=\"k\">학비로 필요한 이 돈을 자네가 가지게.”</div></div><div class=\"rnat\">(D)(5) Paderewski는 1,600달러를 돌려주면서 그 학생에게 (다음과 같이) 말했다. “여기 1,600달러를 받게. 학비로 필요한 이 돈을 자네가 가지게.”</div><div class=\"rst\">파데레프스키는 1,600달러를 돌려주며 “학비에 필요한 돈은 자네가 가지게.” 하고 말해요.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">The student was surprised,</div><div class=\"k\">그 학생은 놀랐고,</div></div><div class=\"rc\"><div class=\"e\">and thanked (e) him heartily.</div><div class=\"k\">(e) 그(= Paderewski)에게 진심으로 감사를 표했다</div></div><div class=\"rnat\">(D)(6) 그 학생은 놀랐고, (e) 그(Paderewski)에게 진심으로 감사를 표했다.</div><div class=\"rst\">학생은 깜짝 놀라 진심으로 고맙다고 인사해요. 첫 번째 이야기는 여기서 끝나요.</div></div><div class=\"rds key\" data-ord=\"13\"><span class=\"rn\">13번 · 단서</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc ckc\"><div class=\"e\">(B) Paderewski <span class=\"cw\">later</span> went on to become</div><div class=\"k\">(B) <span class=\"cw\">나중에</span> Paderewski는 ~이 되는 것으로 나아갔다(~이 되었다)</div></div><div class=\"rc\"><div class=\"e\">the Prime Minister of Poland.</div><div class=\"k\">폴란드의 수상</div></div><div class=\"rnat\">(B)(1) 나중에 Paderewski는 폴란드의 수상이 되는 것으로 나아갔다(수상이 되었다).</div><div class=\"rst\">(B) 세월이 흘러 <b>나중에</b>(later) 파데레프스키는 폴란드의 수상이 돼요. 시간이 훌쩍 뛰는 곳이에요.</div></div><div class=\"rds\" data-ord=\"14\"><span class=\"rn\">14번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">He was a great leader,</div><div class=\"k\">그(= Paderewski)는 훌륭한 지도자였지만,</div></div><div class=\"rc\"><div class=\"e\">but unfortunately</div><div class=\"k\">불행하게도</div></div><div class=\"rc\"><div class=\"e\">when World War I began,</div><div class=\"k\">제1차 세계 대전이 시작되었을 때,</div></div><div class=\"rc\"><div class=\"e\">Poland was ravaged.</div><div class=\"k\">폴란드는 황폐해졌다</div></div><div class=\"rnat\">(B)(2) 그(Paderewski)는 훌륭한 지도자였지만, 불행하게도 제1차 세계 대전이 시작되었을 때, 폴란드는 황폐해졌다.</div><div class=\"rst\">그는 훌륭한 지도자였지만, 제1차 세계 대전이 터지자 폴란드는 엉망이 돼요.</div></div><div class=\"rds\" data-ord=\"15\"><span class=\"rn\">15번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">There were more than 1.5 million people</div><div class=\"k\">150만 명이 넘는 사람들이 있었고</div></div><div class=\"rc\"><div class=\"e\">starving in (b) his country,</div><div class=\"k\">(b) 그(= Paderewski)의 나라에서 굶주리는</div></div><div class=\"rc\"><div class=\"e\">and there was no money to feed them.</div><div class=\"k\">그들을 먹일 돈이 없었다</div></div><div class=\"rnat\">(B)(3) (b) 그(Paderewski)의 나라에는 150만 명이 넘는 굶주리는 사람들이 있었고, 그들을 먹일 돈이 없었다.</div><div class=\"rst\">그의 나라에서 150만 명이 넘는 사람이 굶주리는데, 먹일 돈이 없었어요.</div></div><div class=\"rds\" data-ord=\"16\"><span class=\"rn\">16번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">Paderewski did not know</div><div class=\"k\">Paderewski는 몰랐다</div></div><div class=\"rc\"><div class=\"e\">where to turn for help.</div><div class=\"k\">어디에 도움을 청해야 할지</div></div><div class=\"rnat\">(B)(4) Paderewski는 어디에 도움을 청해야 할지 몰랐다.</div><div class=\"rst\">이번엔 파데레프스키가 도움을 청할 곳을 몰라요. 옛날 그 학생과 똑같은 처지가 됐어요.</div></div><div class=\"rds\" data-ord=\"17\"><span class=\"rn\">17번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">Finally, he asked</div><div class=\"k\">결국, 그(= Paderewski)는 요청했다</div></div><div class=\"rc\"><div class=\"e\">the US Food and Relief Administration</div><div class=\"k\">미국의 Food and Relief Administration(식품 원조 행정부)에</div></div><div class=\"rc\"><div class=\"e\">for help.</div><div class=\"k\">도움을</div></div><div class=\"rnat\">(B)(5) 결국, 그(Paderewski)는 미국의 Food and Relief Administration(식품 원조 행정부)에 도움을 요청했다.</div><div class=\"rst\">결국 그는 미국의 식품 원조 기관에 도와 달라고 부탁해요. = 지문의 ‘도움을 요청했다’.</div></div><div class=\"rds key\" data-ord=\"18\"><span class=\"rn\">18번 · 단서</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc ckc\"><div class=\"e\">(C) <span class=\"cw\">The head there</span></div><div class=\"k\">(C) <span class=\"cw\">그곳의 책임자는</span></div></div><div class=\"rc\"><div class=\"e\">was a man called Herbert Hoover</div><div class=\"k\">Herbert Hoover라는 이름의 남자였고,</div></div><div class=\"rc\"><div class=\"e\">— who later went on to become the US President.</div><div class=\"k\">그(= Herbert Hoover)는 훗날 미국 대통령이 되었다</div></div><div class=\"rnat\">(C)(1) 그곳의 책임자는 Herbert Hoover라는 이름의 남자였고, 그(Herbert Hoover)는 훗날 미국 대통령이 되었다.</div><div class=\"rst\">(C) <b>그곳의</b>(there) 책임자는 후버라는 사람이었고, 훗날 미국 대통령이 돼요. 그곳 = (B)의 미국 원조 기관이에요.</div></div><div class=\"rds\" data-ord=\"19\"><span class=\"rn\">19번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">(c) He agreed to supply</div><div class=\"k\">(c) 그(= Herbert Hoover)는 공급하는 것에 동의했다</div></div><div class=\"rc\"><div class=\"e\">tons of food</div><div class=\"k\">수십 톤의 식량을</div></div><div class=\"rc\"><div class=\"e\">to the starving Polish people.</div><div class=\"k\">굶주리는 폴란드 사람들에게</div></div><div class=\"rnat\">(C)(2) (c) 그(Herbert Hoover)는 굶주리는 폴란드 사람들에게 수십 톤의 식량을 공급하는 것에 동의했다.</div><div class=\"rst\">후버는 굶주리는 폴란드 사람들에게 수십 톤의 식량을 보내 주기로 해요.</div></div><div class=\"rds\" data-ord=\"20\"><span class=\"rn\">20번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">Paderewski was relieved.</div><div class=\"k\">Paderewski는 안도했다.</div></div><div class=\"rnat\">(C)(3) Paderewski는 안도했다.</div><div class=\"rst\">파데레프스키는 그제야 한시름 놓아요. = 지문의 ‘안도했다’.</div></div><div class=\"rds\" data-ord=\"21\"><span class=\"rn\">21번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">Later, when (d) he began to thank Hoover</div><div class=\"k\">나중에, (d) 그(= Paderewski)가 Hoover에게 감사를 전하려고 할 때</div></div><div class=\"rc\"><div class=\"e\">for his noble gesture,</div><div class=\"k\">그의 훌륭한 행동에 대해,</div></div><div class=\"rc\"><div class=\"e\">Hoover quickly said,</div><div class=\"k\">Hoover가 재빨리 말했다.</div></div><div class=\"rc\"><div class=\"e\">“You shouldn’t be thanking me, Mr. Prime Minister.</div><div class=\"k\">“저에게 고마워하시면 안 됩니다, 수상님.</div></div><div class=\"rnat\">(C)(4) 나중에, (d) 그(Paderewski)가 Hoover에게 그의 훌륭한 행동에 대해 감사를 전하려고 할 때, Hoover가 재빨리 말했다. “저에게 고마워하시면 안 됩니다, 수상님.</div><div class=\"rst\">파데레프스키가 고맙다고 하자 후버가 얼른 말해요. “저한테 고마워하시면 안 돼요, 수상님.”</div></div><div class=\"rds\" data-ord=\"22\"><span class=\"rn\">22번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">You may not remember this,</div><div class=\"k\">당신은 이것을 기억하지 못하실 수도 있지만,</div></div><div class=\"rc\"><div class=\"e\">but many years ago,</div><div class=\"k\">오래 전에,</div></div><div class=\"rc\"><div class=\"e\">you helped a student</div><div class=\"k\">당신은 한 학생을 도와주셨습니다</div></div><div class=\"rc\"><div class=\"e\">make it through college.</div><div class=\"k\">그가 대학을 통과하도록(졸업하도록)</div></div><div class=\"rc\"><div class=\"e\">I was him.”</div><div class=\"k\">제가 그 사람(학생)이었습니다.”</div></div><div class=\"rnat\">(C)(5) 당신은 이것을 기억하지 못하실 수도 있지만, 오래 전에, 당신은 한 학생이 대학을 통과하도록(졸업하도록) 도와주셨습니다. 제가 그 사람(학생)이었습니다.”</div><div class=\"rst\">“오래전 대학을 마치게 도와주신 학생, 그게 저였어요.” 베푼 도움이 돌고 돌아 되돌아왔어요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"struggle to\" data-m=\"~하려고 애쓰다\"><b>struggle to</b>~하려고 애쓰다</button><button type=\"button\" class=\"wdb\" data-w=\"orphan\" data-m=\"고아\"><b>orphan</b>고아</button><button type=\"button\" class=\"wdb\" data-w=\"host\" data-m=\"(행사를) 열다, 개최하다\"><b>host</b>(행사를) 열다, 개최하다</button><button type=\"button\" class=\"wdb\" data-w=\"strike a deal\" data-m=\"거래를 성사시키다\"><b>strike a deal</b>거래를 성사시키다</button><button type=\"button\" class=\"wdb\" data-w=\"ravage\" data-m=\"황폐하게 만들다\"><b>ravage</b>황폐하게 만들다</button><button type=\"button\" class=\"wdb\" data-w=\"relieved\" data-m=\"안도하는\"><b>relieved</b>안도하는</button></div>", "11": "<p class=\"mtr\">마더텅 정답률 <b>70%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">지칭 문제는 대명사마다 <b>바로 앞 문장의 인물</b>과 <b>그 문장 속 행동</b>으로 누구인지 확인하세요. (c)는 바로 앞 문장에 새로 등장한 <b>Herbert Hoover</b>(허버트 후버)를 받아요.</p><div class=\"ck-step\"><span class=\"lab\">(a) · 5번 문장</span><div class=\"en\"><mark>(a) His manager</mark> demanded $2,000 for the piano recital.</div><p class=\"ko\"><mark>(a) 그(= Paderewski)의 매니저는</mark> 피아노 연주회에 대해 2,000달러를 요구했다 → 파데레프스키</p></div><div class=\"ck-via\"><i>▼</i><span>1,600달러를 돌려준 사람에게 감사 = 파데레프스키</span></div><div class=\"ck-step\"><span class=\"lab\">(e) · 12번 문장</span><div class=\"en\">The student was surprised, and <mark>thanked (e) him</mark> heartily.</div><p class=\"ko\">그 학생은 놀랐고, <mark>(e) 그(= Paderewski)에게</mark> 진심으로 감사를 표했다 → 파데레프스키</p></div><div class=\"ck-via\"><i>▼</i><span>14번의 폴란드 = 수상 파데레프스키의 나라</span></div><div class=\"ck-step\"><span class=\"lab\">(b) · 15번 문장</span><div class=\"en\">There were more than 1.5 million people starving in <mark>(b) his country</mark> …</div><p class=\"ko\"><mark>(b) 그(= Paderewski)의 나라에서</mark> 굶주리는 150만 명이 넘는 사람들이 있었고 … → 파데레프스키</p></div><div class=\"ck-via\"><i>▼</i><span>18번에 새 인물 Herbert Hoover(허버트 후버)가 등장하자마자 (c)가 받음</span></div><div class=\"ck-step key\"><span class=\"lab\">(c) · 18~19번 · 결정적 단서</span><div class=\"en\"><mark>(c) He</mark> agreed to supply tons of food to the starving Polish people.</div><p class=\"ko\"><mark>(c) 그(= Herbert Hoover)는</mark> 굶주리는 폴란드 사람들에게 수십 톤의 식량을 공급하는 것에 동의했다 → 후버</p></div><div class=\"ck-via\"><i>▼</i><span>Hoover(후버)에게 고마워하는 사람 = 도움을 받은 파데레프스키</span></div><div class=\"ck-step\"><span class=\"lab\">(d) · 21번 문장</span><div class=\"en\">Later, when <mark>(d) he began to thank Hoover</mark> for his noble gesture …</div><p class=\"ko\">나중에, <mark>(d) 그(= Paderewski)가 Hoover에게 감사를 전하려고 할 때</mark> … → 파데레프스키</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">(c) He 그 = Herbert Hoover(허버트 후버)<small>식량을 보내 주기로 한 사람은 18번의 책임자 후버예요. 나머지 넷은 모두 파데레프스키예요.</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">(d) he 그 = Paderewski(파데레프스키)</span><span class=\"why\">(c) 바로 뒤라 후버로 착각하기 쉬워요. 하지만 21번에서 그는 thank Hoover(후버에게 감사하다)를 하려는 사람이니 후버 자신일 수 없어요. 20번 안도한 파데레프스키예요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">(a) His 그의 = Paderewski(파데레프스키)</span><span class=\"why\">4번에서 학생이 피아니스트 파데레프스키에게 연주를 부탁했어요. 연주회 대가를 요구한 manager(매니저)는 그 피아니스트의 매니저예요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">(b) his 그의 = Paderewski(파데레프스키)</span><span class=\"why\">13·14번에서 파데레프스키가 폴란드 수상이 되었고 폴란드가 황폐해졌어요. his country(그의 나라) = 수상의 나라 폴란드예요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">(e) him 그에게 = Paderewski(파데레프스키)</span><span class=\"why\">11번에서 파데레프스키가 1,600달러를 돌려줬어요. 12번에서 학생이 감사한 상대는 돈을 돌려준 파데레프스키예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">(A) A college student</div><div class=\"k\">(A) 한 대학생이</div></div><div class=\"rc\"><div class=\"e\">was struggling to pay</div><div class=\"k\">(돈을) 내려고 애쓰고 있었다</div></div><div class=\"rc\"><div class=\"e\">his school fees.</div><div class=\"k\">그의 학비를</div></div><div class=\"rnat\">(A)(1) 한 대학생이 그의 학비를 내려고 애쓰고 있었다.</div><div class=\"rst\">(A) 한 대학생이 학비를 낼 돈이 없어 애태우고 있었어요. = 지문 1번, 학비를 내려고 애쓰는 대학생이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">He was an orphan,</div><div class=\"k\">그(= 대학생)는 고아였고,</div></div><div class=\"rc\"><div class=\"e\">and not knowing where to turn for money,</div><div class=\"k\">어디에서 돈을 구해야 할지 모르던 중에,</div></div><div class=\"rc\"><div class=\"e\">he came up with a bright idea.</div><div class=\"k\">그는 멋진 아이디어를 생각해냈다</div></div><div class=\"rnat\">(A)(2) 그(대학생)는 고아였고 어디에서 돈을 구해야 할지 모르던 중에, 그는 멋진 아이디어를 생각해냈다.</div><div class=\"rst\">그는 부모님이 안 계셔서 돈을 구할 곳도 없었어요. 그때 멋진 아이디어가 떠올랐대요. = 지문의 고아(orphan) 학생이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">He decided to host a music concert on campus</div><div class=\"k\">그(= 대학생)는 캠퍼스에서 음악 연주회를 열기로 결심했다</div></div><div class=\"rc\"><div class=\"e\">to raise money for his education.</div><div class=\"k\">그의 교육을 위한 돈(학비)을 모으기 위해</div></div><div class=\"rnat\">(A)(3) 그(대학생)는 그의 교육을 위한 돈(학비)을 모으기 위해 캠퍼스에서 음악 연주회를 열기로 결심했다.</div><div class=\"rst\">학교 축제처럼 캠퍼스에서 음악회를 열어 학비를 모으기로 해요. = 지문의 ‘연주회를 열기로 결심했다’.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">He asked</div><div class=\"k\">그(= 대학생)는 요청했다</div></div><div class=\"rc\"><div class=\"e\">the great pianist Ignacy Paderewski</div><div class=\"k\">위대한 피아니스트 Ignacy Paderewski에게</div></div><div class=\"rc\"><div class=\"e\">to come and play.</div><div class=\"k\">(캠퍼스에) 와서 (피아노를) 연주해 줄 것을</div></div><div class=\"rnat\">(A)(4) 그(대학생)는 위대한 피아니스트 Ignacy Paderewski에게 (캠퍼스에) 와서 (피아노를) 연주해 줄 것을 요청했다.</div><div class=\"rst\">그 학생은 유명한 피아니스트 파데레프스키에게 와서 연주해 달라고 부탁해요. = 지문 4번의 부탁이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">(a) His manager</span></div><div class=\"k\"><span class=\"cw\">(a) 그(= Paderewski)의 매니저는</span></div></div><div class=\"rc\"><div class=\"e\">demanded $2,000</div><div class=\"k\">2,000달러를 요구했다</div></div><div class=\"rc\"><div class=\"e\">for the piano recital.</div><div class=\"k\">피아노 연주회에 대해</div></div><div class=\"rnat\">(A)(5) (a) 그(Paderewski)의 매니저는 피아노 연주회에 대해 2,000달러를 요구했다.</div><div class=\"rst\">파데레프스키의 매니저가 2,000달러를 달라고 해요. 매니저를 둔 사람은 피아니스트라서 <b>(a) 그 = 파데레프스키</b>예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">A deal was struck</div><div class=\"k\">거래가 성사되었고</div></div><div class=\"rc\"><div class=\"e\">and the student began working</div><div class=\"k\">그 학생은 노력하기 시작했다</div></div><div class=\"rc\"><div class=\"e\">to make the concert a success.</div><div class=\"k\">콘서트를 성공시키기 위해</div></div><div class=\"rnat\">(A)(6) 거래가 성사되었고 그 학생은 콘서트를 성공시키기 위해 노력하기 시작했다.</div><div class=\"rst\">약속이 정해지고, 학생은 음악회를 성공시키려고 열심히 준비해요. 이제 남은 건 음악회 날이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">(D) The big day arrived.</div><div class=\"k\">(D) (드디어) 그 중요한 날이 왔다.</div></div><div class=\"rnat\">(D)(1) (드디어) 그 중요한 날이 왔다.</div><div class=\"rst\">(D) <b>그 중요한 날</b>(The big day)이 왔어요. (A)에서 준비하던 바로 그 음악회 날이에요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">But unfortunately,</div><div class=\"k\">그러나 불행하게도,</div></div><div class=\"rc\"><div class=\"e\">he had not managed to sell</div><div class=\"k\">그(= 대학생)는 팔지 못했다</div></div><div class=\"rc\"><div class=\"e\">enough tickets.</div><div class=\"k\">충분한 입장권(표)을</div></div><div class=\"rnat\">(D)(2) 그러나 불행하게도, 그(대학생)는 충분한 입장권(입장권을 충분히) 팔지 못했다.</div><div class=\"rst\"><b>그런데</b>(But) 표가 생각만큼 안 팔렸어요. 반 친구들한테 축제 표를 팔았는데 반도 못 판 느낌이에요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">The total amount collected</div><div class=\"k\">모인 총 금액은</div></div><div class=\"rc\"><div class=\"e\">was only $1,600.</div><div class=\"k\">1,600달러뿐이었다</div></div><div class=\"rnat\">(D)(3) 모인 총 금액은 1,600달러뿐이었다.</div><div class=\"rst\">모인 돈은 1,600달러뿐이에요. 약속한 2,000달러에 400달러가 모자라요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">Disappointed,</div><div class=\"k\">실망한 채,</div></div><div class=\"rc\"><div class=\"e\">he went to Paderewski</div><div class=\"k\">그(= 대학생)는 Paderewski에게 가서</div></div><div class=\"rc\"><div class=\"e\">and explained his difficulty.</div><div class=\"k\">그의 어려움을 설명했다</div></div><div class=\"rnat\">(D)(4) 실망한 채, 그(대학생)는 Paderewski에게 가서 그의 어려움을 설명했다.</div><div class=\"rst\">실망한 학생은 파데레프스키를 찾아가 사정을 솔직하게 털어놓아요. = 지문의 ‘어려움을 설명했다’.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">Paderewski returned the $1,600</div><div class=\"k\">Paderewski는 1,600달러를 돌려주면서</div></div><div class=\"rc\"><div class=\"e\">and told the student:</div><div class=\"k\">그 학생에게 (다음과 같이) 말했다:</div></div><div class=\"rc\"><div class=\"e\">“Here’s the $1,600.</div><div class=\"k\">“여기 1,600달러를 받게.</div></div><div class=\"rc\"><div class=\"e\">Keep the money you need for your fees.”</div><div class=\"k\">학비로 필요한 이 돈을 자네가 가지게.”</div></div><div class=\"rnat\">(D)(5) Paderewski는 1,600달러를 돌려주면서 그 학생에게 (다음과 같이) 말했다. “여기 1,600달러를 받게. 학비로 필요한 이 돈을 자네가 가지게.”</div><div class=\"rst\">파데레프스키는 1,600달러를 돌려주며 “학비에 필요한 돈은 자네가 가지게.” 하고 말해요. = 지문 속 파데레프스키의 말이에요.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><div class=\"rc\"><div class=\"e\">The student was surprised,</div><div class=\"k\">그 학생은 놀랐고,</div></div><div class=\"rc ckc\"><div class=\"e\">and <span class=\"cw\">thanked (e) him heartily</span>.</div><div class=\"k\"><span class=\"cw\">(e) 그(= Paderewski)에게 진심으로 감사를 표했다</span></div></div><div class=\"rnat\">(D)(6) 그 학생은 놀랐고, (e) 그(Paderewski)에게 진심으로 감사를 표했다.</div><div class=\"rst\">학생은 깜짝 놀라 돈을 돌려준 사람에게 고맙다고 해요. 고마운 사람은 파데레프스키라서 <b>(e) 그 = 파데레프스키</b>예요.</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">13번</span><div class=\"rc\"><div class=\"e\">(B) Paderewski later went on to become</div><div class=\"k\">(B) 나중에 Paderewski는 ~이 되는 것으로 나아갔다(~이 되었다)</div></div><div class=\"rc\"><div class=\"e\">the Prime Minister of Poland.</div><div class=\"k\">폴란드의 수상</div></div><div class=\"rnat\">(B)(1) 나중에 Paderewski는 폴란드의 수상이 되는 것으로 나아갔다(수상이 되었다).</div><div class=\"rst\">(B) 세월이 흘러 <b>나중에</b>(later) 파데레프스키는 폴란드의 수상이 돼요. 시간이 훌쩍 뛰는 곳이에요.</div></div><div class=\"rds\" data-ord=\"14\"><span class=\"rn\">14번</span><div class=\"rc\"><div class=\"e\">He was a great leader,</div><div class=\"k\">그(= Paderewski)는 훌륭한 지도자였지만,</div></div><div class=\"rc\"><div class=\"e\">but unfortunately</div><div class=\"k\">불행하게도</div></div><div class=\"rc\"><div class=\"e\">when World War I began,</div><div class=\"k\">제1차 세계 대전이 시작되었을 때,</div></div><div class=\"rc\"><div class=\"e\">Poland was ravaged.</div><div class=\"k\">폴란드는 황폐해졌다</div></div><div class=\"rnat\">(B)(2) 그(Paderewski)는 훌륭한 지도자였지만, 불행하게도 제1차 세계 대전이 시작되었을 때, 폴란드는 황폐해졌다.</div><div class=\"rst\">그는 훌륭한 지도자였지만, 제1차 세계 대전이 터지자 폴란드는 엉망이 돼요. = 지문의 ‘폴란드는 황폐해졌다’예요.</div></div><div class=\"rds\" data-ord=\"15\"><span class=\"rn\">15번</span><div class=\"rc\"><div class=\"e\">There were more than 1.5 million people</div><div class=\"k\">150만 명이 넘는 사람들이 있었고</div></div><div class=\"rc\"><div class=\"e\">starving in (b) his country,</div><div class=\"k\">(b) 그(= Paderewski)의 나라에서 굶주리는</div></div><div class=\"rc\"><div class=\"e\">and there was no money to feed them.</div><div class=\"k\">그들을 먹일 돈이 없었다</div></div><div class=\"rnat\">(B)(3) (b) 그(Paderewski)의 나라에는 150만 명이 넘는 굶주리는 사람들이 있었고, 그들을 먹일 돈이 없었다.</div><div class=\"rst\">그의 나라 폴란드에서 150만 명 넘게 굶주려요. 폴란드 수상은 파데레프스키라서 <b>(b) 그 = 파데레프스키</b>예요.</div></div><div class=\"rds\" data-ord=\"16\"><span class=\"rn\">16번</span><div class=\"rc\"><div class=\"e\">Paderewski did not know</div><div class=\"k\">Paderewski는 몰랐다</div></div><div class=\"rc\"><div class=\"e\">where to turn for help.</div><div class=\"k\">어디에 도움을 청해야 할지</div></div><div class=\"rnat\">(B)(4) Paderewski는 어디에 도움을 청해야 할지 몰랐다.</div><div class=\"rst\">이번엔 파데레프스키가 도움을 청할 곳을 몰라요. 옛날 그 학생과 똑같은 처지가 됐어요.</div></div><div class=\"rds\" data-ord=\"17\"><span class=\"rn\">17번</span><div class=\"rc\"><div class=\"e\">Finally, he asked</div><div class=\"k\">결국, 그(= Paderewski)는 요청했다</div></div><div class=\"rc\"><div class=\"e\">the US Food and Relief Administration</div><div class=\"k\">미국의 Food and Relief Administration(식품 원조 행정부)에</div></div><div class=\"rc\"><div class=\"e\">for help.</div><div class=\"k\">도움을</div></div><div class=\"rnat\">(B)(5) 결국, 그(Paderewski)는 미국의 Food and Relief Administration(식품 원조 행정부)에 도움을 요청했다.</div><div class=\"rst\">결국 그는 미국의 식품 원조 기관에 도와 달라고 부탁해요. = 지문의 ‘도움을 요청했다’.</div></div><div class=\"rds key\" data-ord=\"18\"><span class=\"rn\">18번 · 단서</span><div class=\"rc\"><div class=\"e\">(C) The head there</div><div class=\"k\">(C) 그곳의 책임자는</div></div><div class=\"rc ckc\"><div class=\"e\">was <span class=\"cw\">a man called Herbert Hoover</span></div><div class=\"k\"><span class=\"cw\">Herbert Hoover라는 이름의 남자였고</span>,</div></div><div class=\"rc\"><div class=\"e\">— who later went on to become the US President.</div><div class=\"k\">그(= Herbert Hoover)는 훗날 미국 대통령이 되었다</div></div><div class=\"rnat\">(C)(1) 그곳의 책임자는 Herbert Hoover라는 이름의 남자였고, 그(Herbert Hoover)는 훗날 미국 대통령이 되었다.</div><div class=\"rst\">(C) <b>그곳의</b>(there) 책임자는 후버라는 사람이었고, 훗날 미국 대통령이 돼요. 그곳 = (B)의 미국 원조 기관이에요.</div></div><div class=\"rds key\" data-ord=\"19\"><span class=\"rn\">19번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">(c) He agreed to supply</span></div><div class=\"k\"><span class=\"cw\">(c) 그(= Herbert Hoover)는 공급하는 것에 동의했다</span></div></div><div class=\"rc\"><div class=\"e\">tons of food</div><div class=\"k\">수십 톤의 식량을</div></div><div class=\"rc\"><div class=\"e\">to the starving Polish people.</div><div class=\"k\">굶주리는 폴란드 사람들에게</div></div><div class=\"rnat\">(C)(2) (c) 그(Herbert Hoover)는 굶주리는 폴란드 사람들에게 수십 톤의 식량을 공급하는 것에 동의했다.</div><div class=\"rst\">식량을 보내 주기로 한 사람은 바로 앞 문장의 책임자 후버예요. 그래서 <b>(c) 그 = 후버</b>, 혼자만 달라요!</div></div><div class=\"rds\" data-ord=\"20\"><span class=\"rn\">20번</span><div class=\"rc\"><div class=\"e\">Paderewski was relieved.</div><div class=\"k\">Paderewski는 안도했다.</div></div><div class=\"rnat\">(C)(3) Paderewski는 안도했다.</div><div class=\"rst\">파데레프스키는 그제야 한시름 놓아요. = 지문의 ‘안도했다’.</div></div><div class=\"rds\" data-ord=\"21\"><span class=\"rn\">21번</span><div class=\"rc ckc\"><div class=\"e\">Later, when <span class=\"cw\">(d) he began to thank Hoover</span></div><div class=\"k\">나중에, <span class=\"cw\">(d) 그(= Paderewski)가 Hoover에게 감사를 전하려고 할 때</span></div></div><div class=\"rc\"><div class=\"e\">for his noble gesture,</div><div class=\"k\">그의 훌륭한 행동에 대해,</div></div><div class=\"rc\"><div class=\"e\">Hoover quickly said,</div><div class=\"k\">Hoover가 재빨리 말했다.</div></div><div class=\"rc\"><div class=\"e\">“You shouldn’t be thanking me, Mr. Prime Minister.</div><div class=\"k\">“저에게 고마워하시면 안 됩니다, 수상님.</div></div><div class=\"rnat\">(C)(4) 나중에, (d) 그(Paderewski)가 Hoover에게 그의 훌륭한 행동에 대해 감사를 전하려고 할 때, Hoover가 재빨리 말했다. “저에게 고마워하시면 안 됩니다, 수상님.</div><div class=\"rst\">후버에게 고맙다고 말하려는 사람은 도움을 받은 파데레프스키예요. 그래서 <b>(d) 그 = 파데레프스키</b>예요.</div></div><div class=\"rds\" data-ord=\"22\"><span class=\"rn\">22번</span><div class=\"rc\"><div class=\"e\">You may not remember this,</div><div class=\"k\">당신은 이것을 기억하지 못하실 수도 있지만,</div></div><div class=\"rc\"><div class=\"e\">but many years ago,</div><div class=\"k\">오래 전에,</div></div><div class=\"rc\"><div class=\"e\">you helped a student</div><div class=\"k\">당신은 한 학생을 도와주셨습니다</div></div><div class=\"rc\"><div class=\"e\">make it through college.</div><div class=\"k\">그가 대학을 통과하도록(졸업하도록)</div></div><div class=\"rc\"><div class=\"e\">I was him.”</div><div class=\"k\">제가 그 사람(학생)이었습니다.”</div></div><div class=\"rnat\">(C)(5) 당신은 이것을 기억하지 못하실 수도 있지만, 오래 전에, 당신은 한 학생이 대학을 통과하도록(졸업하도록) 도와주셨습니다. 제가 그 사람(학생)이었습니다.”</div><div class=\"rst\">“오래전 대학을 마치게 도와주신 학생, 그게 저였어요.” = 지문 22번, 후버가 바로 그 학생이었다는 반전이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"school fees\" data-m=\"학비\"><b>school fees</b>학비</button><button type=\"button\" class=\"wdb\" data-w=\"recital\" data-m=\"연주회, 독주회\"><b>recital</b>연주회, 독주회</button><button type=\"button\" class=\"wdb\" data-w=\"heartily\" data-m=\"진심으로\"><b>heartily</b>진심으로</button><button type=\"button\" class=\"wdb\" data-w=\"agree to\" data-m=\"~하기로 동의하다\"><b>agree to</b>~하기로 동의하다</button><button type=\"button\" class=\"wdb\" data-w=\"supply\" data-m=\"공급하다\"><b>supply</b>공급하다</button><button type=\"button\" class=\"wdb\" data-w=\"noble gesture\" data-m=\"고귀한 행동\"><b>noble gesture</b>고귀한 행동</button></div>", "12": "<p class=\"mtr\">마더텅 정답률 <b>60%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">불일치 문제는 선택지를 <b>지문 순서대로</b> 하나씩 대조하세요. ④처럼 <b>누가 누구를 도왔는지</b>(주는 사람 ↔받는 사람)를 거꾸로 바꾼 말이 가장 잘 숨어 있어요.</p><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>① ↔ 4번</em>학생이 파데레프스키에게 연주 부탁 → 같음</span><span><em>⑤ ↔ 11번</em>1,600달러를 학생에게 돌려줌 → 같음</span><span><em>② ↔ 13번</em>나중에 폴란드 수상이 됨 → 같음</span><span><em>③ ↔ 17번</em>미국 식품 원조 기관에 도움 요청 → 같음</span></div><div class=\"ck-eq\">⇒ 네 개는 지문과 그대로 같아요. 남은 ④를 22번 후버의 말과 대조해요</div></div><div class=\"ck-via\"><i>▼</i><span>21번에서 후버가 “저에게 고마워하시면 안 됩니다” 하고 말을 꺼내요</span></div><div class=\"ck-step\"><span class=\"lab\">21번 문장 · 고마워하는 사람</span><div class=\"en\">“You <mark>shouldn’t be thanking me</mark>, Mr. Prime Minister.</div><p class=\"ko\">“<mark>저에게 고마워하시면 안 됩니다</mark>, 수상님.</p></div><div class=\"ck-via\"><i>▼</i><span>도운 사람 = 파데레프스키(you), 도움받은 학생 = 후버(I)</span></div><div class=\"ck-step key\"><span class=\"lab\">22번 문장 · 결정적 단서</span><div class=\"en\">… many years ago, <mark>you helped a student</mark> make it through college. <mark>I was him</mark>.”</div><p class=\"ko\">… 오래 전에, <mark>당신은 한 학생을</mark> 대학을 통과하도록(졸업하도록) <mark>도와주셨습니다</mark>. <mark>제가 그 사람(학생)이었습니다</mark>.”</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">Hoover로부터 학비를 지원받았다.<small>22번: 학비를 도와준 쪽이 파데레프스키, 도움받은 학생이 후버예요. 방향이 거꾸로예요.</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">학생에게 1,600달러를 되돌려 주었다.</span><span class=\"why\">2,000달러를 요구했으니 숫자가 틀렸다고 착각하기 쉬워요. 하지만 9번에서 모인 돈이 1,600달러였고, 11번에서 그 1,600달러를 returned(돌려주었다)라고 했어요. 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">학생으로부터 연주 요청을 받았다.</span><span class=\"why\">4번에서 대학생이 asked(요청했다), 위대한 피아니스트에게 come and play(와서 연주해 달라)고요. 선택지와 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">나중에 폴란드의 수상이 되었다.</span><span class=\"why\">13번 later went on to become the Prime Minister of Poland(나중에 폴란드의 수상이 되었다)와 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">미국에 도움을 요청했다.</span><span class=\"why\">17번 asked the US Food and Relief Administration for help(미국 식품 원조 행정부에 도움을 요청했다)와 같아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">(A) A college student</div><div class=\"k\">(A) 한 대학생이</div></div><div class=\"rc\"><div class=\"e\">was struggling to pay</div><div class=\"k\">(돈을) 내려고 애쓰고 있었다</div></div><div class=\"rc\"><div class=\"e\">his school fees.</div><div class=\"k\">그의 학비를</div></div><div class=\"rnat\">(A)(1) 한 대학생이 그의 학비를 내려고 애쓰고 있었다.</div><div class=\"rst\">(A) 한 대학생이 학비를 낼 돈이 없어 애태우고 있었어요. 이 이야기의 출발점이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">He was an orphan,</div><div class=\"k\">그(= 대학생)는 고아였고,</div></div><div class=\"rc\"><div class=\"e\">and not knowing where to turn for money,</div><div class=\"k\">어디에서 돈을 구해야 할지 모르던 중에,</div></div><div class=\"rc\"><div class=\"e\">he came up with a bright idea.</div><div class=\"k\">그는 멋진 아이디어를 생각해냈다</div></div><div class=\"rnat\">(A)(2) 그(대학생)는 고아였고 어디에서 돈을 구해야 할지 모르던 중에, 그는 멋진 아이디어를 생각해냈다.</div><div class=\"rst\">그는 부모님이 안 계셔서 돈을 구할 곳도 없었어요. 그때 멋진 아이디어가 떠올랐대요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">He decided to host a music concert on campus</div><div class=\"k\">그(= 대학생)는 캠퍼스에서 음악 연주회를 열기로 결심했다</div></div><div class=\"rc\"><div class=\"e\">to raise money for his education.</div><div class=\"k\">그의 교육을 위한 돈(학비)을 모으기 위해</div></div><div class=\"rnat\">(A)(3) 그(대학생)는 그의 교육을 위한 돈(학비)을 모으기 위해 캠퍼스에서 음악 연주회를 열기로 결심했다.</div><div class=\"rst\">학교 축제처럼 캠퍼스에서 음악회를 열어 학비를 모으기로 해요. = 지문의 ‘연주회를 열기로 결심했다’.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">He asked</div><div class=\"k\">그(= 대학생)는 요청했다</div></div><div class=\"rc\"><div class=\"e\">the great pianist Ignacy Paderewski</div><div class=\"k\">위대한 피아니스트 Ignacy Paderewski에게</div></div><div class=\"rc\"><div class=\"e\">to come and play.</div><div class=\"k\">(캠퍼스에) 와서 (피아노를) 연주해 줄 것을</div></div><div class=\"rnat\">(A)(4) 그(대학생)는 위대한 피아니스트 Ignacy Paderewski에게 (캠퍼스에) 와서 (피아노를) 연주해 줄 것을 요청했다.</div><div class=\"rst\">학생이 유명한 피아니스트 파데레프스키에게 와서 연주해 달라고 부탁해요. = 지문 4번 → ① 일치</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">(a) His manager</div><div class=\"k\">(a) 그(= Paderewski)의 매니저는</div></div><div class=\"rc\"><div class=\"e\">demanded $2,000</div><div class=\"k\">2,000달러를 요구했다</div></div><div class=\"rc\"><div class=\"e\">for the piano recital.</div><div class=\"k\">피아노 연주회에 대해</div></div><div class=\"rnat\">(A)(5) (a) 그(Paderewski)의 매니저는 피아노 연주회에 대해 2,000달러를 요구했다.</div><div class=\"rst\">파데레프스키의 매니저가 연주 대가로 2,000달러를 달라고 해요. 학생에겐 엄청 큰돈이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">A deal was struck</div><div class=\"k\">거래가 성사되었고</div></div><div class=\"rc\"><div class=\"e\">and the student began working</div><div class=\"k\">그 학생은 노력하기 시작했다</div></div><div class=\"rc\"><div class=\"e\">to make the concert a success.</div><div class=\"k\">콘서트를 성공시키기 위해</div></div><div class=\"rnat\">(A)(6) 거래가 성사되었고 그 학생은 콘서트를 성공시키기 위해 노력하기 시작했다.</div><div class=\"rst\">약속이 정해지고, 학생은 음악회를 성공시키려고 열심히 준비해요. 이제 남은 건 음악회 날이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">(D) The big day arrived.</div><div class=\"k\">(D) (드디어) 그 중요한 날이 왔다.</div></div><div class=\"rnat\">(D)(1) (드디어) 그 중요한 날이 왔다.</div><div class=\"rst\">(D) <b>그 중요한 날</b>(The big day)이 왔어요. (A)에서 준비하던 바로 그 음악회 날이에요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">But unfortunately,</div><div class=\"k\">그러나 불행하게도,</div></div><div class=\"rc\"><div class=\"e\">he had not managed to sell</div><div class=\"k\">그(= 대학생)는 팔지 못했다</div></div><div class=\"rc\"><div class=\"e\">enough tickets.</div><div class=\"k\">충분한 입장권(표)을</div></div><div class=\"rnat\">(D)(2) 그러나 불행하게도, 그(대학생)는 충분한 입장권(입장권을 충분히) 팔지 못했다.</div><div class=\"rst\"><b>그런데</b>(But) 표가 생각만큼 안 팔렸어요. 반 친구들한테 축제 표를 팔았는데 반도 못 판 느낌이에요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">The total amount collected</div><div class=\"k\">모인 총 금액은</div></div><div class=\"rc\"><div class=\"e\">was only $1,600.</div><div class=\"k\">1,600달러뿐이었다</div></div><div class=\"rnat\">(D)(3) 모인 총 금액은 1,600달러뿐이었다.</div><div class=\"rst\">모인 돈은 1,600달러뿐이에요. 약속한 2,000달러에 400달러가 모자라요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">Disappointed,</div><div class=\"k\">실망한 채,</div></div><div class=\"rc\"><div class=\"e\">he went to Paderewski</div><div class=\"k\">그(= 대학생)는 Paderewski에게 가서</div></div><div class=\"rc\"><div class=\"e\">and explained his difficulty.</div><div class=\"k\">그의 어려움을 설명했다</div></div><div class=\"rnat\">(D)(4) 실망한 채, 그(대학생)는 Paderewski에게 가서 그의 어려움을 설명했다.</div><div class=\"rst\">실망한 학생은 파데레프스키를 찾아가 사정을 솔직하게 털어놓아요. = 지문의 ‘어려움을 설명했다’.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">Paderewski returned the $1,600</div><div class=\"k\">Paderewski는 1,600달러를 돌려주면서</div></div><div class=\"rc\"><div class=\"e\">and told the student:</div><div class=\"k\">그 학생에게 (다음과 같이) 말했다:</div></div><div class=\"rc\"><div class=\"e\">“Here’s the $1,600.</div><div class=\"k\">“여기 1,600달러를 받게.</div></div><div class=\"rc\"><div class=\"e\">Keep the money you need for your fees.”</div><div class=\"k\">학비로 필요한 이 돈을 자네가 가지게.”</div></div><div class=\"rnat\">(D)(5) Paderewski는 1,600달러를 돌려주면서 그 학생에게 (다음과 같이) 말했다. “여기 1,600달러를 받게. 학비로 필요한 이 돈을 자네가 가지게.”</div><div class=\"rst\">파데레프스키는 모인 1,600달러를 학생에게 돌려주며 학비로 쓰라고 해요. = 지문 11번 → ⑤ 일치</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><div class=\"rc\"><div class=\"e\">The student was surprised,</div><div class=\"k\">그 학생은 놀랐고,</div></div><div class=\"rc\"><div class=\"e\">and thanked (e) him heartily.</div><div class=\"k\">(e) 그(= Paderewski)에게 진심으로 감사를 표했다</div></div><div class=\"rnat\">(D)(6) 그 학생은 놀랐고, (e) 그(Paderewski)에게 진심으로 감사를 표했다.</div><div class=\"rst\">학생은 깜짝 놀라 진심으로 고맙다고 인사해요. 첫 번째 이야기는 여기서 끝나요.</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">13번</span><div class=\"rc\"><div class=\"e\">(B) Paderewski later went on to become</div><div class=\"k\">(B) 나중에 Paderewski는 ~이 되는 것으로 나아갔다(~이 되었다)</div></div><div class=\"rc\"><div class=\"e\">the Prime Minister of Poland.</div><div class=\"k\">폴란드의 수상</div></div><div class=\"rnat\">(B)(1) 나중에 Paderewski는 폴란드의 수상이 되는 것으로 나아갔다(수상이 되었다).</div><div class=\"rst\">(B) 세월이 흘러 파데레프스키는 폴란드의 수상이 돼요. = 지문 13번 → ② 일치</div></div><div class=\"rds\" data-ord=\"14\"><span class=\"rn\">14번</span><div class=\"rc\"><div class=\"e\">He was a great leader,</div><div class=\"k\">그(= Paderewski)는 훌륭한 지도자였지만,</div></div><div class=\"rc\"><div class=\"e\">but unfortunately</div><div class=\"k\">불행하게도</div></div><div class=\"rc\"><div class=\"e\">when World War I began,</div><div class=\"k\">제1차 세계 대전이 시작되었을 때,</div></div><div class=\"rc\"><div class=\"e\">Poland was ravaged.</div><div class=\"k\">폴란드는 황폐해졌다</div></div><div class=\"rnat\">(B)(2) 그(Paderewski)는 훌륭한 지도자였지만, 불행하게도 제1차 세계 대전이 시작되었을 때, 폴란드는 황폐해졌다.</div><div class=\"rst\">그는 훌륭한 지도자였지만, 제1차 세계 대전이 터지자 폴란드는 엉망이 돼요.</div></div><div class=\"rds\" data-ord=\"15\"><span class=\"rn\">15번</span><div class=\"rc\"><div class=\"e\">There were more than 1.5 million people</div><div class=\"k\">150만 명이 넘는 사람들이 있었고</div></div><div class=\"rc\"><div class=\"e\">starving in (b) his country,</div><div class=\"k\">(b) 그(= Paderewski)의 나라에서 굶주리는</div></div><div class=\"rc\"><div class=\"e\">and there was no money to feed them.</div><div class=\"k\">그들을 먹일 돈이 없었다</div></div><div class=\"rnat\">(B)(3) (b) 그(Paderewski)의 나라에는 150만 명이 넘는 굶주리는 사람들이 있었고, 그들을 먹일 돈이 없었다.</div><div class=\"rst\">그의 나라에서 150만 명이 넘는 사람이 굶주리는데, 먹일 돈이 없었어요.</div></div><div class=\"rds\" data-ord=\"16\"><span class=\"rn\">16번</span><div class=\"rc\"><div class=\"e\">Paderewski did not know</div><div class=\"k\">Paderewski는 몰랐다</div></div><div class=\"rc\"><div class=\"e\">where to turn for help.</div><div class=\"k\">어디에 도움을 청해야 할지</div></div><div class=\"rnat\">(B)(4) Paderewski는 어디에 도움을 청해야 할지 몰랐다.</div><div class=\"rst\">이번엔 파데레프스키가 도움을 청할 곳을 몰라요. 옛날 그 학생과 똑같은 처지가 됐어요.</div></div><div class=\"rds\" data-ord=\"17\"><span class=\"rn\">17번</span><div class=\"rc\"><div class=\"e\">Finally, he asked</div><div class=\"k\">결국, 그(= Paderewski)는 요청했다</div></div><div class=\"rc\"><div class=\"e\">the US Food and Relief Administration</div><div class=\"k\">미국의 Food and Relief Administration(식품 원조 행정부)에</div></div><div class=\"rc\"><div class=\"e\">for help.</div><div class=\"k\">도움을</div></div><div class=\"rnat\">(B)(5) 결국, 그(Paderewski)는 미국의 Food and Relief Administration(식품 원조 행정부)에 도움을 요청했다.</div><div class=\"rst\">결국 그는 미국의 식품 원조 기관에 도와 달라고 부탁해요. = 지문 17번 → ③ 일치</div></div><div class=\"rds key\" data-ord=\"18\"><span class=\"rn\">18번 · 단서</span><div class=\"rc\"><div class=\"e\">(C) The head there</div><div class=\"k\">(C) 그곳의 책임자는</div></div><div class=\"rc\"><div class=\"e\">was a man called Herbert Hoover</div><div class=\"k\">Herbert Hoover라는 이름의 남자였고,</div></div><div class=\"rc\"><div class=\"e\">— who later went on to become the US President.</div><div class=\"k\">그(= Herbert Hoover)는 훗날 미국 대통령이 되었다</div></div><div class=\"rnat\">(C)(1) 그곳의 책임자는 Herbert Hoover라는 이름의 남자였고, 그(Herbert Hoover)는 훗날 미국 대통령이 되었다.</div><div class=\"rst\">(C) <b>그곳의</b>(there) 책임자는 후버라는 사람이었고, 훗날 미국 대통령이 돼요. 그곳 = (B)의 미국 원조 기관이에요.</div></div><div class=\"rds\" data-ord=\"19\"><span class=\"rn\">19번</span><div class=\"rc\"><div class=\"e\">(c) He agreed to supply</div><div class=\"k\">(c) 그(= Herbert Hoover)는 공급하는 것에 동의했다</div></div><div class=\"rc\"><div class=\"e\">tons of food</div><div class=\"k\">수십 톤의 식량을</div></div><div class=\"rc\"><div class=\"e\">to the starving Polish people.</div><div class=\"k\">굶주리는 폴란드 사람들에게</div></div><div class=\"rnat\">(C)(2) (c) 그(Herbert Hoover)는 굶주리는 폴란드 사람들에게 수십 톤의 식량을 공급하는 것에 동의했다.</div><div class=\"rst\">후버는 굶주리는 폴란드 사람들에게 수십 톤의 식량을 보내 주기로 해요.</div></div><div class=\"rds\" data-ord=\"20\"><span class=\"rn\">20번</span><div class=\"rc\"><div class=\"e\">Paderewski was relieved.</div><div class=\"k\">Paderewski는 안도했다.</div></div><div class=\"rnat\">(C)(3) Paderewski는 안도했다.</div><div class=\"rst\">파데레프스키는 그제야 한시름 놓아요. = 지문의 ‘안도했다’.</div></div><div class=\"rds\" data-ord=\"21\"><span class=\"rn\">21번</span><div class=\"rc\"><div class=\"e\">Later, when (d) he began to thank Hoover</div><div class=\"k\">나중에, (d) 그(= Paderewski)가 Hoover에게 감사를 전하려고 할 때</div></div><div class=\"rc\"><div class=\"e\">for his noble gesture,</div><div class=\"k\">그의 훌륭한 행동에 대해,</div></div><div class=\"rc\"><div class=\"e\">Hoover quickly said,</div><div class=\"k\">Hoover가 재빨리 말했다.</div></div><div class=\"rc ckc\"><div class=\"e\">“<span class=\"cw\">You shouldn’t be thanking me</span>, Mr. Prime Minister.</div><div class=\"k\">“<span class=\"cw\">저에게 고마워하시면 안 됩니다</span>, 수상님.</div></div><div class=\"rnat\">(C)(4) 나중에, (d) 그(Paderewski)가 Hoover에게 그의 훌륭한 행동에 대해 감사를 전하려고 할 때, Hoover가 재빨리 말했다. “저에게 고마워하시면 안 됩니다, 수상님.</div><div class=\"rst\">파데레프스키가 고맙다고 하자 후버가 얼른 말해요. “저한테 고마워하시면 안 돼요, 수상님.”</div></div><div class=\"rds key\" data-ord=\"22\"><span class=\"rn\">22번 · 단서</span><div class=\"rc\"><div class=\"e\">You may not remember this,</div><div class=\"k\">당신은 이것을 기억하지 못하실 수도 있지만,</div></div><div class=\"rc\"><div class=\"e\">but many years ago,</div><div class=\"k\">오래 전에,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">you helped a student</span></div><div class=\"k\"><span class=\"cw\">당신은 한 학생을 도와주셨습니다</span></div></div><div class=\"rc\"><div class=\"e\">make it through college.</div><div class=\"k\">그가 대학을 통과하도록(졸업하도록)</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">I was him.</span>”</div><div class=\"k\"><span class=\"cw\">제가 그 사람(학생)이었습니다.</span>”</div></div><div class=\"rnat\">(C)(5) 당신은 이것을 기억하지 못하실 수도 있지만, 오래 전에, 당신은 한 학생이 대학을 통과하도록(졸업하도록) 도와주셨습니다. 제가 그 사람(학생)이었습니다.”</div><div class=\"rst\">“오래전 <b>당신이 도와준 학생</b>, 그게 저였어요.” 도운 사람은 파데레프스키, 도움받은 학생이 후버예요. → ④ 거꾸로!   const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
  mmInit();
}
/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
