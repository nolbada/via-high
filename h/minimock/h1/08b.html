<title>고1 미니모의고사 8회 07–12번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:84px}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}
.ko{color:var(--sub);font-size:14px;margin-left:6px}
.cell.bad{background:var(--badbg);border-color:var(--bad)}
.cell.bad .tag{background:var(--bad)}
.locked .cell{pointer-events:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.done .opt{pointer-events:none}
.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}
.hcard .chip{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--sub)}
.hcard .chip.ok{background:var(--goodbg);color:var(--good)}
.hcard .chip.warn{background:var(--badbg);color:var(--bad)}
.hcard[disabled]{opacity:.55}
details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.th .hd{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:6px}
.th ol{list-style:none;margin:0;padding:0;counter-reset:n}
.th li{counter-increment:n;position:relative;padding:7px 0 7px 30px;font-size:15px;line-height:1.7;border-top:1px dashed #cfdcf0}
.th li:first-child{border-top:0}
.th li:before{content:counter(n);position:absolute;left:0;top:9px;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;text-align:center;line-height:21px}
.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.th .sub{margin:3px 0 0;color:#444;font-size:14.5px;line-height:1.7}
.sc .lay.sum{border-left:4px solid #2e7d32;background:#f1f8f1}
/* ---- 새 직독직해·해설 화면 ---- */
.sc{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden;background:var(--bg)}

.sc-h .at{font-size:13px;color:var(--sub)}

.sc .ch{margin-bottom:6px}
.sc .ce{font-size:17px}

.nt{font-size:13.5px;line-height:1.5;background:#fbf6ee;border:1px solid #f0e2cd;border-radius:8px;padding:5px 9px;color:#4a3a22}

.sc .lb{margin-bottom:4px}
.qc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}
.qchip small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-bottom:1px}

.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.trs{list-style:none;margin:0;padding:0;background:var(--soft);border-radius:10px;padding:8px 12px}

.wds{display:flex;flex-wrap:wrap;gap:6px}

.toq{display:block;width:100%;margin-top:14px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}
details.sub2{margin:12px 0 0}
details.sub2>summary{list-style:none;cursor:pointer;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px;padding:6px 0}

.cr{color:#A3102E;font-weight:700}
.sc .lay.core{border-left:4px solid #2e7d32;background:#f1f8f1}

리게 되죠.", "gist": "Kaldi가 처음 등장해 염소들의 이상한 행동(밤에 잠을 안 잠)을 관찰한다. 주어진 문장의 'his observation'이 가리키는 내용이다.", "link": "실제 시기와 상관없이, 염소지기인 Kaldi는 그의 염소들이 후에 커피나무라고 알려지게 될 것에서 나온 열매를 먹은 후 밤에 잠을 자지 않았다는 것을 알아챘다고 한다."}, {"n": 6, "ch": [{"e": "<b>Word of<\/b> the awakening effects", "k": "각성 효과에 대한 소문은"}, {"e": "and the pleasant taste", "k": "그리고 좋은 풍미에 대한"}, {"e": "of <b>this new beverage<\/b>", "k": "이 새로운 음료<span class=\"r\">(= 커피)<\/span>의"}, {"e": "soon spread", "k": "이내 퍼졌다"}, {"e": "beyond the monastery.", "k": "수도원 너머로"}], "easy": "이 새로운 음료가 잠을 깨우고 맛도 좋다는 소문이 곧 수도원 밖까지 퍼졌어요.", "gist": "주어진 문장 다음에 이어지는 문장이다. 수도원에서 시작된 소문이 바깥으로 퍼지는 모습을 보여 준다.", "link": "이 새로운 음료의 각성 효과와 좋은 풍미에 대한 소문은 이내 수도원 너머로 퍼졌다."}, {"n": 7, "ch": [{"e": "The story of Kaldi", "k": "Kaldi의 이야기는"}, {"e": "might be <b>more fable than fact<\/b>,", "k": "사실이라기보다 꾸며낸 이야기일지도 모르지만"}, {"e": "but <b>at least<\/b> some historical evidence", "k": "적어도 몇몇 역사적 증거는"}, {"e": "<b>indicates that<\/b>", "k": "~을 보여준다"}, {"e": "coffee <b>did<\/b> originate", "k": "커피가 정말로 유래했다는 것을"}, {"e": "in the Ethiopian highlands.", "k": "에티오피아의 고원에서"}], "easy": "Kaldi 이야기는 지어낸 이야기일 수도 있어요. 하지만 커피가 에티오피아 고원에서 시작된 게 맞다는 역사적 증거도 있어요.", "gist": "전설은 꾸며낸 이야기일 수 있어도, 커피의 기원은 에티오피아 고원이라는 점은 증거가 뒷받침한다며 글을 맺는다."}]}, {"no": "09", "typ": "무관한 문장", "src": "2020년 9월 35번", "evn": [1, 6, 7], "ev_en": "In a single week, the sun delivers more energy to our planet than humanity has used through the burning of coal, oil, and natural gas through all of human history. / Our efforts to develop technologies that use fossil fuels have shown meaningful results. / Our challenge, and our opportunity, is to learn to efficiently and cheaply use the much more abundant source that is the new energy striking our planet each day from the sun.", "ev_ko": [[1, "단 일주일 안에, 태양은 인간의 모든 역사에 걸쳐 인간이 석탄, 석유, 그리고 천연가스의 연소를 통해 사용해 온 (에너지)보다 더 많은 에너지를 지구에 전달한다."], [6, "화석 연료를 사용하는 기술을 개발하기 위한 우리의 노력은 의미 있는 결과를 보여왔다."], [7, "우리의 (당면) 과제이자 기회는 태양으로부터 매일 지구를 강타하고 있는(지구에 도달하는) 새로운 에너 는 커피가 실제로 에티오피아 고지대에서 유래했음을 보여 준다."]], "evh": "4 · 6번 문장", "ev": [{"en": true, "h": "Kaldi, the goatherd, noticed that his goats did not sleep at night after eating berries ~ / Word of the awakening effects and the pleasant taste of this new beverage soon spread beyond the monastery."}, {"en": false, "h": "문장삽입 문제는 <b>주어진 문장의 앞뒤 연결고리</b>를 찾는 것입니다. 주어진 문장은 <b>Kaldi가 수도원에 알리자 수도원장이 커피를 끓였다</b>는 내용입니다. 4번은 <b>Kaldi가 염소의 이상 행동을 알아차렸다</b>는 데서 끝나고, ④ 뒤의 6번은 <b>'이 소식(Word)'이 수도원 너머로 퍼졌다</b>고 합니다. 그런데 6번의 <b>Word of the awakening effects</b>가 나오려면, 그 사이에 <b>누군가 커피를 끓여 각성 효과를 직접 확인한 사건</b>이 있어야 합니다 — 그것이 바로 주어진 문장입니다. 따라서 주어진 문장은 4번과 6번 <b>사이(④)</b>에 들어가야 합니다."}], "opts": [{"n": "①", "t": "\"However, ~ Ethiopian highlands.\" 앞", "a": false, "x": true, "trap": false, "e": "이 자리는 아직 커피의 기원이 <b>불분명하다</b>는 도입부입니다. 수도원에 보고했다는 사건이 들어가기엔 너무 이릅니다."}, {"n": "②", "t": "\"Various dates ~\" 앞", "a": false, "x": true, "trap": false, "e": "이 자리는 전설의 <b>연대</b> 이야기로 이어지는 자리라, 수도원 사건이 끼어들면 흐름이 끊깁니다."}, {"n": "③", "t": "\"Regardless of the actual date ~\" 앞", "a": false, "x": true, "trap": false, "e": "이 자리에 들어가면 Kaldi가 <b>염소를 알아차리기도 전에</b> 이미 수도원에 보고한 셈이 되어 시간 순서가 뒤집힙니다."}, {"n": "④", "t": "\"Word of the awakening effects ~\" 앞", "a": true, "x": false, "trap": false, "e": "Kaldi가 염소의 이상 행동을 알아차린 <b>다음</b>, 수도원에 알려 수도원장이 커피를 끓였고, <b>그 소문(Word)</b>이 퍼졌다는 순서가 자연스럽게 이어집니다."}, {"n": "⑤", "t": "\"The story of Kaldi ~\" 앞", "a": false, "x": true, "trap": true, "e": "이 자리는 이미 <b>소문이 다 퍼진 뒤</b> 전설 전체를 마무리하는 문장 앞입니다. 여기에 넣으면 수도원장 이야기가 마무리 뒤에 뜬금없이 등장하게 됩니다."}], "w": [["for centuries", "몇 세기 동안"], ["originate", "유래하다, 기원하다"], ["predominant", "지배적인, 유력한"], ["legend", "전설"], ["goatherd", "염소치기"], ["Ethiopian highlands", "에티오피아 고지대"], ["monastery", "수도원"], ["abbot", "수도원장"], ["alerting effect", "각성 효과"], ["historical evidence", "역사적 증거"]]}, {"q": "09", "type": "무관 문장", "src": "2020년 9월 35번", "ans": "④", "tr": [["1", "단 일주일 만에 태양은 인류가 역사 전체에 걸쳐 석탄, 석유, 천연가스를 태워서 써 온 것보다 더 많은 에너지를 지구에 보낸다."], ["2", "그리고 태양은 function buildQuestions(){

        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);

        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');

}

n class=\"t\">등록은 프로그램 시작 2일 전까지 해야 한다.</span><span class=\"why\">12번 at least(적어도) 2일 전에 등록해야 한다는 말과 같아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Photography Walks Program</div><div class=\"k\">사진 산책 프로그램</div></div><div class=\"rnat\">사진 산책 프로그램</div><div class=\"rst\">친구가 주말에 같이 가자며 포스터 한 장을 보여 줘요. = 지문 1번 제목, 사진 산책 프로그램이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Have you ever wanted to learn</div><div class=\"k\">당신은 배우고 싶었던 적이 있나요</div></div><div class=\"rc\"><div class=\"e\">how to take photographs</div><div class=\"k\">사진을 찍는 방법을</div></div><div class=\"rc\"><div class=\"e\">using your smartphone or tablet?</div><div class=\"k\">당신의 스마트폰이나 태블릿을 사용해서</div></div><div class=\"rnat\">당신은 당신의 스마트폰이나 태블릿을 사용해서 사진들을 찍는 방법을 배우고 싶었던 적이 있었나요?</div><div class=\"rst\">“폰으로 사진 예쁘게 찍는 법 배우고 싶지 않아?” 지문 2번은 스마트폰·태블릿으로 사진 찍는 법을 묻는 말이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Then come and join us</div><div class=\"k\">그렇다면 와서 우리와 함께하세요</div></div><div class=\"rc\"><div class=\"e\">on our exciting Photography Walks Program.</div><div class=\"k\">우리의 흥미로운 사진 산책 프로그램에</div></div><div class=\"rnat\">그러면 오셔서 우리의 흥미로운 사진 산책 프로그램에 참여하세요.</div><div class=\"rst\">“그럼 같이 가자!” 하는 초대예요. 지문 3번도 와서 함께하라고 해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">All ages and skill levels</div><div class=\"k\">모든 연령과 기술 수준의 사람들을</div></div><div class=\"rc\"><div class=\"e\">are welcome!</div><div class=\"k\">환영합니다!</div></div><div class=\"rnat\">모든 연령과 기술 수준의 사람들을 환영합니다!</div><div class=\"rst\">“난 사진 잘 못 찍는데?” 걱정 없어요. 지문 4번은 <b>모든 연령</b>(All ages)과 실력을 환영한대요. → ① 일치</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">◈ Date:</div><div class=\"k\">◈ 날짜:</div></div><div class=\"rc\"><div class=\"e\">From September 21 to September 23</div><div class=\"k\">9월 21일부터 9월 23일까지</div></div><div class=\"rnat\">◈ 날짜: 9월 21일부터 9월 23일까지</div><div class=\"rst\">달력에 표시해요. 21일, 22일, 23일, 세 날이에요. = 지문 5번 날짜 → ② 일치</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">◈ Time:</div><div class=\"k\">◈ 시간:</div></div><div class=\"rc\"><div class=\"e\">2 p.m. – 5 p.m.</div><div class=\"k\">오후 2시 – 5시</div></div><div class=\"rnat\">◈ 시간: 오후 2시 – 5시</div><div class=\"rst\">학원 끝나고도 갈 수 있게 오후 2시부터 5시까지래요. = 지문 6번 시간</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">◈ Place:</div><div class=\"k\">◈ 장소:</div></div><div class=\"rc\"><div class=\"e\">Evergreen State Park</div><div class=\"k\">Evergreen 주립 공원</div></div><div class=\"rnat\">◈ 장소: Evergreen 주립 공원</div><div class=\"rst\">장소는 큰 주립 공원이에요. = 지문 7번 Evergreen(에버그린) 주립 공원</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">◈ <span class=\"cw\">Ticket Price:</span></div><div class=\"k\">◈ <span class=\"cw\">티켓 가격:</span></div></div><div class=\"rc\"><div class=\"e\">$30 per person</div><div class=\"k\">1인당 30달러</div></div><div class=\"rc ckc\"><div class=\"e\">(<span class=\"cw\">including a photo album</span>)</div><div class=\"k\">(<span class=\"cw\">포토 앨범 포함</span>)</div></div><div class=\"rnat\">◈ 티켓 가격: 인당 30달러 (포토 앨범 포함)</div><div class=\"rst\">가격은 1인당 30달러인데, 괄호 속에 <b>포토 앨범 포함</b>(including a photo album)이래요. 앨범값 따로 안 내요! → ③이 틀린 곳</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">◈ Notice:</div><div class=\"k\">◈ 공지:</div></div><div class=\"rnat\">◈ 공지:</div><div class=\"rst\">이제 꼭 지킬 것들이 나와요. 지문 9번은 공지가 시작된다는 작은 제목이에요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">• Wear</div><div class=\"k\">• 착용하세요</div></div><div class=\"rc\"><div class=\"e\">comfortable clothes</div><div class=\"k\">편한 옷과</div></div><div class=\"rc\"><div class=\"e\">and walking shoes.</div><div class=\"k\">운동화를</div></div><div class=\"rnat\">• 편한 옷과 운동화를 착용하세요.</div><div class=\"rst\">공원을 오래 걸으니 편한 옷과 운동화를 챙겨요. = 지문 10번</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">• Water and snacks</div><div class=\"k\">• 물과 간식은</div></div><div class=\"rc\"><div class=\"e\">are provided for free.</div><div class=\"k\">무료로 제공됩니다</div></div><div class=\"rnat\">• 물과 간식은 무료로 제공됩니다.</div><div class=\"rst\">목마르면 어떡하지? 물과 간식은 <b>무료</b>(free)래요. = 지문 11번 → ④ 일치</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><div class=\"rc\"><div class=\"e\">Registration should be made</div><div class=\"k\">등록은 해야 합니다</div></div><div class=\"rc\"><div class=\"e\">at least 2 days before</div><div class=\"k\">적어도 2일 전에</div></div><div class=\"rc\"><div class=\"e\">the program begins.</div><div class=\"k\">프로그램이 시작되기</div></div><div class=\"rnat\">등록은 프로그램이 시작되기 최소 이틀 전에 해야 합니다.</div><div class=\"rst\">친구가 “늦지 않게 신청하자” 해요. 시작 최소 이틀 전까지 등록해야 해요. = 지문 12번 → ⑤ 일치</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">13번</span><div class=\"rc\"><div class=\"e\">Please visit our website</div><div class=\"k\">저희 웹사이트를 방문해 주세요</div></div><div class=\"rc\"><div class=\"e\">for more information.</div><div class=\"k\">더 많은 정보를 위해</div></div><div class=\"rnat\">더 많은 정보를 위해서는 저희 웹사이트를 방문하세요.</div><div class=\"rst\">더 궁금한 건 웹사이트에서 보면 돼요. = 지문 13번 마지막 안내예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"photograph\" data-m=\"사진(을 찍다)\"><b>photograph</b>사진(을 찍다)</button><button type=\"button\" class=\"wdb\" data-w=\"skill level\" data-m=\"실력 수준\"><b>skill level</b>실력 수준</button><button type=\"button\" class=\"wdb\" data-w=\"including\" data-m=\"~을 포함하여\"><b>including</b>~을 포함하여</button><button type=\"button\" class=\"wdb\" data-w=\"comfortable\" data-m=\"편안한\"><b>comfortable</b>편안한</button><button type=\"button\" class=\"wdb\" data-w=\"registration\" data-m=\"등록\"><b>registration</b>등록</button><button type=\"button\" class=\"wdb\" data-w=\"at least\" data-m=\"적어도\"><b>at least</b>적어도</button></div>", "08": "<p class=\"mtr\">마더텅 정답률 <b>65%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">삽입은 주어진 문장의 <b>연결 신호</b>를 잡는 문제예요. <b>his observation</b>(그의 관찰)은 앞에서 Kaldi(칼디)가 본 것을 받고, 뒤 문장의 <b>this new beverage</b>(이 새로운 음료)·<b>the monastery</b>(그 수도원)는 주어진 문장을 받아야 해요.</p><div class=\"ck-step\"><span class=\"lab\">주어진 문장 · 연결 신호</span><div class=\"en\">When Kaldi reported <mark>his observation</mark> to <mark>the local monastery</mark>, the abbot became the first person to brew a pot of coffee …</div><p class=\"ko\">Kaldi가 그의 <mark>관찰 내용을</mark> <mark>그 지역 수도원에</mark> 전했을 때, 수도원장은 커피를 처음 우려낸 사람이 되었다 …</p></div><div class=\"ck-via\"><i>▼</i><span>his observation(그의 관찰) = 염소들이 밤에 잠을 안 잔 것</span></div><div class=\"ck-step\"><span class=\"lab\">5번 · 앞 문장 (④ 바로 앞)</span><div class=\"en\">… Kaldi, the goatherd, noticed that <mark>his goats did not sleep at night</mark> after eating berries …</div><p class=\"ko\">… 염소지기인 Kaldi가 <mark>염소들이 밤에 잠을 자지 않았다는 것을</mark> 알아챘다 …</p></div><div class=\"ck-via\"><i>▼</i><span>this new beverage(이 새로운 음료) = 수도원장이 끓인 커피, the monastery(그 수도원) = 주어진 문장에서 처음 나온 수도원</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 · 뒤 문장 (④ 바로 뒤)</span><div class=\"en\">Word of the awakening effects and the pleasant taste of <mark>this new beverage</mark> soon spread <mark>beyond the monastery</mark>.</div><p class=\"ko\"><mark>이 새로운 음료(= 커피)의</mark> 각성 효과와 좋은 풍미에 대한 소문은 이내 <mark>수도원 너머로</mark> 퍼졌다.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>5번</em>칼디가 염소들이 밤에 안 자는 걸 발견</span><span><em>주어진 문장</em>칼디가 수도원에 알림 → 수도원장이 커피를 끓여 마심</span><span><em>6번</em>이 새 음료 소문이 수도원 밖으로 퍼짐</span></div><div class=\"ck-eq\">⇒ 발견 → 알림·첫 커피 → 소문, 세 고리가 다 맞는 자리 = ④</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">5번 문장과 6번 문장 사이<small>6번 this new beverage(이 새로운 음료)와 the monastery(그 수도원)가 받을 말이 바로 앞에 생겨요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">6번 문장과 7번 문장 사이</span><span class=\"why\">이야기 끝이라 그럴듯해 보이지만, 그러면 6번에서 수도원과 이 새로운 음료(this new beverage)가 소개도 없이 먼저 나와요. 커피를 끓이기도 전에 소문부터 퍼지는 꼴이에요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">2번 문장과 3번 문장 사이</span><span class=\"why\">아직 칼디(Kaldi)도, 염소도 나오지 않았어요. his observation(그의 관찰)이 가리킬 내용이 앞에 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">3번 문장과 4번 문장 사이</span><span class=\"why\">3번은 이름 없는 염소지기만 소개했어요. 4번 this legend(이 전설)의 시기 이야기가 3번 전설을 바로 받아야 해서 끊으면 안 돼요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">4번 문장과 5번 문장 사이</span><span class=\"why\">칼디가 염소를 관찰하는 장면(5번)보다 먼저 관찰 내용을 보고하게 돼요. 발견보다 보고가 앞서면 순서가 뒤집혀요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds key\" data-ord=\"1\"><span class=\"rn\">1번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">When Kaldi reported <span class=\"cw\">his observation</span></div><div class=\"k\">Kaldi가 그의(= Kaldi의) <span class=\"cw\">관찰 내용을</span> 전했을 때</div></div><div class=\"rc ckc\"><div class=\"e\">to <span class=\"cw\">the local monastery</span>,</div><div class=\"k\"><span class=\"cw\">그 지역 수도원에</span></div></div><div class=\"rc\"><div class=\"e\">the abbot became the first person</div><div class=\"k\">그 수도원장은 첫 번째 사람이 되었다</div></div><div class=\"rc\"><div class=\"e\">to brew a pot of coffee</div><div class=\"k\">한 주전자의 커피를 우려내고</div></div><div class=\"rc\"><div class=\"e\">and note its flavor and alerting effect</div><div class=\"k\">그것의(= 커피의) 풍미와 각성 효과를 알아차린</div></div><div class=\"rc\"><div class=\"e\">when he drank it.</div><div class=\"k\">그(= 수도원장)가 그것(= 커피)을 마셨을 때</div></div><div class=\"rnat\">Kaldi가 그 지역 수도원에 그의 관찰 내용을 전했을 때, 그 수도원장은 한 주전자의 커피를 우려내고, 그가 그것을 마셨을 때 그것의 풍미와 각성 효과를 알아차린 첫 번째 사람이 되었다.</div><div class=\"rst\">〈주어진 문장〉 칼디가 본 것을 <b>그 지역 수도원</b>에 알리자, 수도원장이 처음 커피를 끓여 마셨어요. = 주어진 문장은 ‘보고 → 첫 커피’ 장면이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Although humans have been drinking coffee</div><div class=\"k\">비록 인간이 커피를 마셔 왔음에도</div></div><div class=\"rc\"><div class=\"e\">for centuries,</div><div class=\"k\">수 세기 동안</div></div><div class=\"rc\"><div class=\"e\">it is not clear</div><div class=\"k\">분명하지 않다</div></div><div class=\"rc\"><div class=\"e\">just where coffee originated</div><div class=\"k\">단지 커피가 어디서 유래했는지</div></div><div class=\"rc\"><div class=\"e\">or who first discovered it.</div><div class=\"k\">또는 누가 그것(= 커피)을 처음 발견했는지는</div></div><div class=\"rnat\">수 세기 동안 사람들이 커피를 마셔왔음에도 불구하고, 단지 커피가 어디서 유래했는지 또는 누가 그것을 처음 발견했는지는 분명하지 않다.</div><div class=\"rst\">아침마다 졸린 우리를 깨워 주는 음료가 있는데, 누가 처음 찾았는지는 몰라요. 지문도 커피가 어디서 시작됐는지 분명하지 않대요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">However,</div><div class=\"k\">하지만</div></div><div class=\"rc\"><div class=\"e\">the predominant legend</div><div class=\"k\">유력한 전설은</div></div><div class=\"rc\"><div class=\"e\">has it that</div><div class=\"k\">~라고 주장한다</div></div><div class=\"rc\"><div class=\"e\">a goatherd discovered coffee</div><div class=\"k\">한 염소지기가 커피를 발견했다고</div></div><div class=\"rc\"><div class=\"e\">in the Ethiopian highlands.</div><div class=\"k\">에티오피아의 고원에서</div></div><div class=\"rnat\">하지만 유력한 전설은 한 염소지기가 에티오피아의 고원에서 커피를 발견했다고 주장한다.</div><div class=\"rst\"><b>하지만</b>(However) 가장 유명한 소문은 있어요. 지문은 에티오피아 고원의 한 염소지기가 커피를 찾았다는 전설이래요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Various dates</div><div class=\"k\">다양한 시기는</div></div><div class=\"rc\"><div class=\"e\">for this legend</div><div class=\"k\">이 전설에 대한</div></div><div class=\"rc\"><div class=\"e\">include</div><div class=\"k\">포함한다</div></div><div class=\"rc\"><div class=\"e\">900 BC, 300 AD, and 800 AD.</div><div class=\"k\">기원전 900년, 기원후 300년, 기원후 800년을</div></div><div class=\"rnat\">이 전설에 대한 다양한 시기는 기원전 900년, 기원후 300년, 기원후 800년을 포함한다.</div><div class=\"rst\">그게 언제냐고요? 기원전 900년, 기원후 300년, 기원후 800년… 말이 다 달라요. = 지문의 이 전설에 대한 여러 시기예요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">Regardless of the actual date,</div><div class=\"k\">실제 시기와 상관없이</div></div><div class=\"rc\"><div class=\"e\">it is said that</div><div class=\"k\">~라고 한다</div></div><div class=\"rc\"><div class=\"e\">Kaldi, the goatherd,</div><div class=\"k\">염소지기인 Kaldi가</div></div><div class=\"rc\"><div class=\"e\">noticed</div><div class=\"k\">알아챘다</div></div><div class=\"rc ckc\"><div class=\"e\">that <span class=\"cw\">his goats did not sleep at night</span></div><div class=\"k\">그의(= Kaldi의) <span class=\"cw\">염소들이 밤에 잠을 자지 않았다는 것을</span></div></div><div class=\"rc\"><div class=\"e\">after eating berries</div><div class=\"k\">열매를 먹은 후에</div></div><div class=\"rc\"><div class=\"e\">from what would later be known</div><div class=\"k\">후에 알려지게 될 것(나무)에서 나온</div></div><div class=\"rc\"><div class=\"e\">as a coffee tree.</div><div class=\"k\">커피나무로</div></div><div class=\"rnat\">실제 시기와 상관없이, 염소지기인 Kaldi는 그의 염소들이 후에 커피나무라고 알려진 것(나무)에서 나온 열매를 먹은 후 밤에 잠을 자지 않았다는 것을 알아챘다고 한다.</div><div class=\"rst\">언제였든, 염소지기 칼디가 이상한 걸 봤어요. 어떤 열매를 먹은 <b>염소들이 밤에 잠을 안 자요</b>. 이게 주어진 문장의 ‘그의 관찰’이에요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">Word of the awakening effects</div><div class=\"k\">각성 효과에 대한 소문은</div></div><div class=\"rc\"><div class=\"e\">and the pleasant taste</div><div class=\"k\">그리고 좋은 풍미에 대한</div></div><div class=\"rc ckc\"><div class=\"e\">of <span class=\"cw\">this new beverage</span></div><div class=\"k\"><span class=\"cw\">이 새로운 음료(= 커피)의</span></div></div><div class=\"rc\"><div class=\"e\">soon spread</div><div class=\"k\">이내 퍼졌다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">beyond the monastery</span>.</div><div class=\"k\"><span class=\"cw\">수도원 너머로</span></div></div><div class=\"rnat\">이 새로운 음료의 각성 효과와 좋은 풍미에 대한 소문은 이내 수도원 너머로 퍼졌다.</div><div class=\"rst\">그 뒤 <b>이 새로운 음료</b>(this new beverage) 소문이 <b>수도원 너머로</b> 쫙 퍼져요. 수도원장이 끓인 커피 얘기라 주어진 문장 바로 뒤예요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">The story of Kaldi</div><div class=\"k\">Kaldi의 이야기는</div></div><div class=\"rc\"><div class=\"e\">might be more fable than fact,</div><div class=\"k\">사실이라기보다 꾸며낸 이야기일지도 모르지만</div></div><div class=\"rc\"><div class=\"e\">but at least some historical evidence</div><div class=\"k\">적어도 몇몇 역사적 증거는</div></div><div class=\"rc\"><div class=\"e\">indicates that</div><div class=\"k\">~을 보여준다</div></div><div class=\"rc\"><div class=\"e\">coffee did originate</div><div class=\"k\">커피가 정말로 유래했다는 것을</div></div><div class=\"rc\"><div class=\"e\">in the Ethiopian highlands.</div><div class=\"k\">에티오피아의 고원에서</div></div><div class=\"rnat\">Kaldi의 이야기는 사실이라기보다 꾸며낸 이야기일지도 모르지만, 적어도 몇몇 역사적 증거는 커피가 정말로 에티오피아의 고원에서 유래했다는 것을 보여준다.</div><div class=\"rst\">칼디 이야기는 지어낸 얘기일 수도 있지만, 커피가 에티오피아 고원에서 시작된 건 증거가 있대요. = 지문의 마무리예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"originate\" data-m=\"유래하다, 기원하다\"><b>originate</b>유래하다, 기원하다</button><button type=\"button\" class=\"wdb\" data-w=\"predominant\" data-m=\"지배적인, 유력한\"><b>predominant</b>지배적인, 유력한</button><button type=\"button\" class=\"wdb\" data-w=\"goatherd\" data-m=\"염소치기\"><b>goatherd</b>염소치기</button><button type=\"button\" class=\"wdb\" data-w=\"monastery\" data-m=\"수도원\"><b>monastery</b>수도원</button><button type=\"button\" class=\"wdb\" data-w=\"abbot\" data-m=\"수도원장\"><b>abbot</b>수도원장</button><button type=\"button\" class=\"wdb\" data-w=\"awakening effect\" data-m=\"각성 효과\"><b>awakening effect</b>각성 효과</button></div>", "09": "<p class=\"mtr\">마더텅 정답률 <b>65%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">무관한 문장은 <b>글 전체 화제</b>를 먼저 잡고 하나씩 대 보는 문제. 이 글은 <b>화석 연료는 잘못된 원천, 풍부한 태양 에너지로 가자</b>는 흐름이에요. 그 흐름과 반대로 화석 연료를 칭찬하는 문장을 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">1번 · 글의 화제</span><div class=\"en\">In a single week, <mark>the sun delivers more energy</mark> to our planet than humanity has used through the burning of coal, oil, and natural gas …</div><p class=\"ko\">단 일주일 안에 <mark>태양은 더 많은 에너지를 전달한다</mark> … 인류가 석탄, 석유, 천연가스의 연소를 통해 사용해 온 것보다</p></div><div class=\"ck-via\"><i>▼</i><span>태양이 훨씬 많은데, 우리는 엉뚱한 쪽을 봐 왔다는 지적</span></div><div class=\"ck-step\"><span class=\"lab\">②(4번) · 글쓴이의 판단</span><div class=\"en\">It's that we have been focused on <mark>the wrong source</mark> — the small, finite one that we're using up.</div><p class=\"ko\">그것은 우리가 <mark>잘못된 원천에</mark>, 즉 우리가 고갈시키고 있는 작고 유한한 것에 집중해 왔다는 것이다.</p></div><div class=\"ck-via\"><i>▼</i><span>잘못된 원천이라던 화석 연료를 갑자기 성과가 있다고 칭찬함</span></div><div class=\"ck-step key\"><span class=\"lab\">④(6번) · 이탈 지점</span><div class=\"en\">Our efforts to develop technologies that use <mark>fossil fuels</mark> <mark>have shown meaningful results.</mark></div><p class=\"ko\"><mark>화석 연료를</mark> 사용하는 기술을 개발하기 위한 우리의 노력은 <mark>의미 있는 결과를 보여 왔다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>④를 빼면 ③의 ‘화석 연료 = 옛 태양 에너지의 아주 작은 일부’ → ⑤의 ‘훨씬 풍부한 태양 에너지’로 바로 이어짐</span></div><div class=\"ck-step\"><span class=\"lab\">⑤(7번) · 다시 제자리</span><div class=\"en\">Our challenge, and our opportunity, is to learn to efficiently and cheaply use <mark>the much more abundant source</mark> … from the sun.</div><p class=\"ko\">우리의 과제이자 기회는 태양으로부터 오는 <mark>훨씬 더 풍부한 원천을</mark> 효율적이고 저렴하게 사용하는 것을 배우는 것이다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">화석 연료 기술 개발 노력이 의미 있는 결과를 보여 왔다<small>글은 화석 연료를 잘못된 원천이라고 하는데, 이 문장만 화석 연료 쪽을 칭찬해요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">석탄·천연가스·석유는 수백만 년 전의 태양 에너지일 뿐이다</span><span class=\"why\">coal(석탄)·oil(석유)이 나와서 화석 연료 얘기로 튀어 보이지만, ‘그것도 옛 태양 에너지의 아주 작은 일부’라며 ②의 작고 유한한 원천(finite one)을 뒷받침해요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">우리의 과제는 에너지가 바닥나는 것이 아니다</span><span class=\"why\">1·2번에서 태양이 엄청난 에너지를 수십억 년 보내 준다고 했으니, 에너지가 모자란 게 아니라는 말로 자연스럽게 이어져요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">우리는 잘못된 원천에 집중해 왔다</span><span class=\"why\">It's that(그것은 ~라는 것이다)이 ①의 ‘과제는 ~이 아니다’를 받아 진짜 문제가 무엇인지 밝혀 줘요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">태양의 훨씬 풍부한 원천을 싸고 효율적으로 쓰는 법을 배우는 것이 과제이자 기회다</span><span class=\"why\">①의 Our challenge(우리의 과제)를 다시 꺼내 ‘태양으로 가자’는 결론을 내려요. 글 전체 흐름의 마무리예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds key\" data-ord=\"1\"><span class=\"rn\">1번 · 단서</span><div class=\"rc\"><div class=\"e\">In a single week,</div><div class=\"k\">단 일주일 안에</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">the sun delivers more energy</span></div><div class=\"k\"><span class=\"cw\">태양은 더 많은 에너지를 전달한다</span></div></div><div class=\"rc\"><div class=\"e\">to our planet</div><div class=\"k\">우리 지구에</div></div><div class=\"rc\"><div class=\"e\">than humanity has used</div><div class=\"k\">인류가 사용해 온 것(에너지)보다</div></div><div class=\"rc\"><div class=\"e\">through the burning of coal, oil, and natural gas</div><div class=\"k\">석탄, 석유, 천연가스의 연소를 통해</div></div><div class=\"rc\"><div class=\"e\">through all of human history.</div><div class=\"k\">인류의 모든 역사에 걸쳐</div></div><div class=\"rnat\">단 일주일 안에, 태양은 인간의 모든 역사에 걸쳐 인간이 석탄, 석유, 그리고 천연가스의 연소를 통해 사용해 온 (에너지)보다 더 많은 에너지를 지구에 전달한다.</div><div class=\"rst\">할머니가 매주 엄청 큰 용돈을 보내 주셔요. 일주일 치가 내가 평생 저금통에서 꺼내 쓴 돈보다 많아요. = 지문의 <b>태양 에너지</b>예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">And the sun will keep shining</div><div class=\"k\">그리고 태양은 계속 비출 것이다</div></div><div class=\"rc\"><div class=\"e\">on our planet</div><div class=\"k\">우리 지구를</div></div><div class=\"rc\"><div class=\"e\">for billions of years.</div><div class=\"k\">수십억 년 동안</div></div><div class=\"rnat\">그리고 태양은 (앞으로도) 수십억 년 동안 지구를 계속해서 비출 것이다.</div><div class=\"rst\">게다가 할머니 용돈은 앞으로도 아주아주 오래 계속 들어와요. 지문도 태양이 수십억 년 동안 계속 비출 거래요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Our challenge isn't</div><div class=\"k\">우리의 과제는 ~이 아니다</div></div><div class=\"rc\"><div class=\"e\">that we're running out of energy.</div><div class=\"k\">우리가 에너지를 고갈시키고 있다는 것</div></div><div class=\"rnat\">우리의 과제는 우리가 에너지를 고갈시키고 있다는 것이 아니다.</div><div class=\"rst\">① 그러니 내 고민은 “돈이 바닥나요”가 아니에요. 지문도 에너지가 다 떨어지는 게 과제가 아니래요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">It's that</div><div class=\"k\">그것(= 우리의 과제)은 ~라는 것이다</div></div><div class=\"rc\"><div class=\"e\">we have been focused on</div><div class=\"k\">우리가 집중해 왔다는</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">the wrong source</span></div><div class=\"k\"><span class=\"cw\">잘못된 원천에</span></div></div><div class=\"rc\"><div class=\"e\">— the small, finite one</div><div class=\"k\">즉 작고 유한한 것(원천)</div></div><div class=\"rc\"><div class=\"e\">that we're using up.</div><div class=\"k\">우리가 고갈시키고 있는</div></div><div class=\"rnat\">그것은 우리가 잘못된 원천, 즉 우리가 고갈시키고 있는 적고 유한한 원천에 집중해 왔다는 것이다.</div><div class=\"rst\">② 진짜 문제는 내가 작고 줄어드는 <b>저금통만 쳐다봐 온 것</b>이에요. = 지문의 <b>잘못된 원천</b>(the wrong source)이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Indeed,</div><div class=\"k\">사실</div></div><div class=\"rc\"><div class=\"e\">all the coal, natural gas, and oil</div><div class=\"k\">모든 석탄, 천연가스, 석유는</div></div><div class=\"rc\"><div class=\"e\">we use today</div><div class=\"k\">우리가 오늘날 사용하는</div></div><div class=\"rc\"><div class=\"e\">is just solar energy</div><div class=\"k\">단지 태양 에너지일 뿐이다</div></div><div class=\"rc\"><div class=\"e\">from millions of years ago,</div><div class=\"k\">수백만 년 전의</div></div><div class=\"rc\"><div class=\"e\">a very tiny part of which</div><div class=\"k\">그것의 매우 적은 일부분만이</div></div><div class=\"rc\"><div class=\"e\">was preserved deep underground.</div><div class=\"k\">깊은 지하에 보존되었다</div></div><div class=\"rnat\">사실 오늘날 우리가 사용하는 모든 석탄, 천연가스, 그리고 석유는 단지 수백만 년 전의 태양 에너지일 뿐이고, 그것의 매우 적은 일부분만이 깊은 지하에 보존되었다.</div><div class=\"rst\">③ 사실 그 저금통도 옛날 할머니 용돈이 아주 조금 남아 있는 거예요. 지문도 석탄·석유는 옛 태양 에너지의 작은 일부래요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">Our efforts</div><div class=\"k\">우리의 노력은</div></div><div class=\"rc\"><div class=\"e\">to develop technologies</div><div class=\"k\">기술을 개발하기 위한</div></div><div class=\"rc ckc\"><div class=\"e\">that use <span class=\"cw\">fossil fuels</span></div><div class=\"k\"><span class=\"cw\">화석 연료를</span> 사용하는</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">have shown meaningful results.</span></div><div class=\"k\"><span class=\"cw\">의미 있는 결과를 보여 왔다</span></div></div><div class=\"rnat\">화석 연료를 사용하는 기술을 개발하기 위한 우리의 노력은 의미 있는 결과를 보여왔다.</div><div class=\"rst\">④ 갑자기 “저금통 돈 꺼내는 기술을 열심히 개발해서 성과가 좋았다”고 칭찬해요. 저금통은 잘못된 쪽이라고 했는데 <b>방향이 반대</b>라 튀어요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">Our challenge, and our opportunity,</div><div class=\"k\">우리의 과제이자 기회는</div></div><div class=\"rc\"><div class=\"e\">is to learn</div><div class=\"k\">배우는 것이다</div></div><div class=\"rc\"><div class=\"e\">to efficiently and cheaply use</div><div class=\"k\">효율적이고 저렴하게 사용하는 것을</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">the much more abundant source</span></div><div class=\"k\"><span class=\"cw\">훨씬 더 풍부한 원천을</span></div></div><div class=\"rc\"><div class=\"e\">that is the new energy</div><div class=\"k\">새로운 에너지인</div></div><div class=\"rc\"><div class=\"e\">striking our planet each day</div><div class=\"k\">매일 우리 지구를 강타하고 있는(지구에 도달하는)</div></div><div class=\"rc\"><div class=\"e\">from the sun.</div><div class=\"k\">태양으로부터</div></div><div class=\"rnat\">우리의 (당면) 과제이자 기회는 태양으로부터 매일 지구를 강타하고 있는(지구에 도달하는) 새로운 에너지인 '훨씬 더 풍부한' 원천을 효율적이고 저렴하게 사용하는 것을 배우는 것이다.</div><div class=\"rst\">⑤ 내 과제이자 기회는 매주 들어오는 <b>훨씬 큰 용돈</b>을 똑똑하게 쓰는 법을 배우는 거예요. = 태양 에너지를 싸고 효율적으로 쓰자는 지문의 결론이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"deliver\" data-m=\"전달하다, 공급하다\"><b>deliver</b>전달하다, 공급하다</button><button type=\"button\" class=\"wdb\" data-w=\"running out of\" data-m=\"~이 다 떨어져 가는 (run out of)\"><b>running out of</b>~이 다 떨어져 가는 (run out of)</button><button type=\"button\" class=\"wdb\" data-w=\"finite\" data-m=\"유한한\"><b>finite</b>유한한</button><button type=\"button\" class=\"wdb\" data-w=\"preserve\" data-m=\"보존하다\"><b>preserve</b>보존하다</button><button type=\"button\" class=\"wdb\" data-w=\"fossil fuel\" data-m=\"화석 연료\"><b>fossil fuel</b>화석 연료</button><button type=\"button\" class=\"wdb\" data-w=\"abundant\" data-m=\"풍부한\"><b>abundant</b>풍부한</button></div>", "10": "<p class=\"mtr\">마더텅 정답률 <b>75%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">이야기 순서 문제는 <b>시간의 고리</b>를 잡으세요. 꿈을 이룸 → <b>선수 시절</b>(while he was a pitcher 투수였던 동안) → 가족과 일의 충돌 → <b>마지막</b>(for the last time) 은퇴 장면 순이에요.</p><div class=\"ck-step\"><span class=\"lab\">주어진 글 (A) 끝</span><div class=\"en\">Through years of hard work (a) he achieved <mark>that goal.</mark></div><p class=\"ko\">수년간의 고된 노력을 통해 (a) 그는 <mark>그 목표를</mark> 달성했다.</p></div><div class=\"ck-via\"><i>▼</i><span>꿈(프로 선수)을 이룬 다음 = 성공한 투수로 뛰던 시절</span></div><div class=\"ck-step key\"><span class=\"lab\">(C) · 첫 번째 고리</span><div class=\"en\">While he was <mark>a successful pitcher</mark> for the Montreal Expos, (c) he and his wife wanted to start a family …</div><p class=\"ko\">그가 Montreal Expos에서 <mark>성공한 투수</mark>였던 동안, (c) 그와 그의 아내는 가정을 꾸리고 싶었다 …</p></div><div class=\"ck-via\"><i>▼</i><span>아이 넷을 입양했더니 → ‘인생에서 가장 어려운 결정’을 예고</span></div><div class=\"ck-step\"><span class=\"lab\">(C) 끝 · 다음을 예고</span><div class=\"en\">This led to <mark>one of the most difficult decisions</mark> of Tim's life.</div><p class=\"ko\">이것은 Tim의 인생에서 <mark>가장 어려운 결정 중의 하나</mark>로 이어졌다.</p></div><div class=\"ck-via\"><i>▼</i><span>이제 아이 넷의 아빠라서, 원정 생활이 좋은 아빠 노릇과 부딪힘</span></div><div class=\"ck-step key\"><span class=\"lab\">(D) · 두 번째 고리</span><div class=\"en\">He discovered that his life on the road conflicted with his ability to be <mark>a quality husband and dad.</mark></div><p class=\"ko\">그는 자신의 이동 중인(원정) 삶이 <mark>훌륭한 남편과 아버지가 될</mark> 능력과 충돌한다는 것을 발견했다.</p></div><div class=\"ck-via\"><i>▼</i><span>(D) 끝에서 야구를 포기하기로 결정 → 경기장을 ‘마지막으로’ 떠나는 장면</span></div><div class=\"ck-step key\"><span class=\"lab\">(B) · 세 번째 고리</span><div class=\"en\">When Tim left the stadium <mark>for the last time,</mark> a reporter stopped him.</div><p class=\"ko\">Tim이 <mark>마지막으로</mark> 경기장을 떠날 때, 한 기자가 그를 멈춰 세웠다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">(C) – (D) – (B)<small>선수 시절 → 충돌·포기 결정 → 마지막 은퇴 장면, 세 고리가 다 맞아요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">(C) – (B) – (D)</span><span class=\"why\">(C)까지는 맞지만, 야구를 그만두기로 한 (D) 결정보다 은퇴 인터뷰(B)가 먼저 나와요. for the last time(마지막으로)은 결정 뒤에 와야 해요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">(B) – (D) – (C)</span><span class=\"why\">꿈을 이루자마자 경기장을 마지막으로 떠나는 장면(B)이 나와요. 은퇴 이유(가족)도 아직 안 나왔는데 은퇴부터 해요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">(D) – (B) – (C)</span><span class=\"why\">(D)의 a quality husband and dad(훌륭한 남편과 아버지) 고민이 아이를 입양하는 (C)보다 먼저 나와요. 아이가 생기기 전에 아빠 노릇을 고민하는 꼴이에요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">(D) – (C) – (B)</span><span class=\"why\">(D)에서 이미 야구를 포기했는데, 그 뒤 (C)에서 ‘성공한 투수였던 동안’으로 다시 선수 시절이 시작돼요. 아빠 고민도 입양보다 앞서요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">(A) 1번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">Families don't grow strong</div><div class=\"k\">가족은 강해지지 않는다</div></div><div class=\"rc\"><div class=\"e\">unless parents invest</div><div class=\"k\">부모가 투자하지 않으면</div></div><div class=\"rc\"><div class=\"e\">precious time</div><div class=\"k\">소중한 시간을</div></div><div class=\"rc\"><div class=\"e\">in them.</div><div class=\"k\">그들(= 가족)에게</div></div><div class=\"rnat\">(A) 1 부모가 소중한 시간을 그들(가족)에 투자하지 않으면 가족은 강해지지 않는다.</div><div class=\"rst\">가족은 부모가 시간을 내 줘야 단단해져요. 바빠도 내 생일만큼은 시간을 내 와 주는 것처럼요. = 지문의 첫 메시지예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">(A) 2번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">In New Man,</div><div class=\"k\">《New Man》에서</div></div><div class=\"rc\"><div class=\"e\">Gary Oliver writes about</div><div class=\"k\">Gary Oliver는 ~에 대해 쓰고 있다</div></div><div class=\"rc\"><div class=\"e\">a difficult decision</div><div class=\"k\">어려운 결정에 대해</div></div><div class=\"rc\"><div class=\"e\">made by professional baseball player Tim Burke</div><div class=\"k\">프로 야구 선수 Tim Burke에 의해 내려진</div></div><div class=\"rc\"><div class=\"e\">concerning his family.</div><div class=\"k\">그의(= Tim Burke) 가족에 관한</div></div><div class=\"rnat\">(A) 2 《New Man》에서, Gary Oliver는 프로 야구 선수였던 Tim Burke에 의해 내려진 그의 가족에 관한(Tim Burke가 자신의 가족에 관해 내렸던) 어려운 결정에 대해 쓰고 있다.</div><div class=\"rst\">이제 그걸 보여 주는 실제 이야기예요. 프로 야구 선수 Tim Burke(팀 버크)가 가족 때문에 내린 어려운 결정이래요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">(A) 3번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">From the time Tim can first remember,</div><div class=\"k\">Tim이 처음 기억할 수 있는 때부터</div></div><div class=\"rc\"><div class=\"e\">his dream was</div><div class=\"k\">그의(= Tim) 꿈은 ~였다</div></div><div class=\"rc\"><div class=\"e\">to be a professional baseball player.</div><div class=\"k\">프로 야구 선수가 되는 것</div></div><div class=\"rnat\">(A) 3 맨 처음 Tim이 기억할 수 있는 그 때부터, 그의 꿈은 프로 야구 선수가 되는 것이었다.</div><div class=\"rst\">팀은 기억나는 아주 어릴 때부터 꿈이 하나였어요. 프로 야구 선수! = 지문 그대로예요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">(A) 4번 · 단서</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">Through years of hard work</div><div class=\"k\">수년간의 고된 노력을 통해</div></div><div class=\"rc\"><div class=\"e\">(a) he achieved</div> via\"><i>▼</i><span>일과 가정 둘 다 못 해서 야구를 포기한 사람 = 팀</span></div><div class=\"ck-step\"><span class=\"lab\">(d)·(e) · (D) 2·3번 문장</span><div class=\"en\">After more thought, he made what many considered an unbelievable decision: <mark>(e) he decided</mark> to give up professional baseball.</div><p class=\"ko\">더 생각한 후, 그는 많은 사람들이 믿을 수 없다고 여기는 결정을 내렸다. <mark>(e) 그(= Tim Burke)는</mark> 프로 야구를 포기하기로 결정했다. → 팀 ((d)도 같은 팀)</p></div><div class=\"ck-via\"><i>▼</i><span>여기서 처음으로 팀이 아닌 사람이 나와요</span></div><div class=\"ck-step\"><span class=\"lab\">(B) 1번 · 새 인물 등장</span><div class=\"en\">When Tim left the stadium for the last time, <mark>a reporter stopped him.</mark></div><p class=\"ko\">Tim이 마지막으로 경기장을 떠날 때, <mark>한 기자가 그(= Tim)를 멈춰 세웠다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>방금 팀을 붙잡은 기자가 이어서 질문, 은퇴하는 사람(he was retiring)은 팀</span></div><div class=\"ck-step key\"><span class=\"lab\">(b) · (B) 2번 문장 · 결정적 단서</span><div class=\"en\">And then <mark>(b) he asked</mark> why he was retiring.</div><p class=\"ko\">그러고 나서 <mark>(b) 그(= 기자)는</mark> 왜 그(= Tim)가 은퇴하는지 물어보았다. → 기자</p></div><div class=\"ck-via\"><i>▼</i><span>대답한 사람이 팀이니, 물어본 (b)는 팀이 아니에요</span></div><div class=\"ck-step\"><span class=\"lab\">(B) 3번 · 확인</span><div class=\"en\">“Baseball is going to do just fine without me,” <mark>he said to the reporter.</mark></div><p class=\"ko\">“야구는 제가 없어도 괜찮을 겁니다”<mark>라고 그(= Tim Burke)는 기자에게 말했다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">(b) he 그 = 기자<small>바로 앞에 등장해 팀을 붙잡은 기자가 은퇴 이유를 물어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">(e) he 그 = 팀</span><span class=\"why\">앞에 many(많은 사람들)가 나와 헷갈리지만, 콜론(:) 뒤는 같은 문장 앞 he made(그가 내린) 결정의 내용이라 야구를 포기한 사람은 팀이에요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">(a) he 그 = 팀</span><span class=\"why\">(A) 3번에서 프로 선수가 꿈이던 팀이 (A) 4번에서 그 목표를 이뤄요. 다른 인물이 아직 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">(c) he 그 = 팀</span><span class=\"why\">(C) 1번에서 Montreal Expos(몬트리올 엑스포스)의 성공한 투수이고 아내와 가정을 꾸리려는 사람은 팀이에요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">(d) he 그 = 팀</span><span class=\"why\">(D) 1번에서 원정 생활과 아빠 노릇이 부딪힌 팀이 (D) 2번에서 둘 다 잘할 수 없다고 깨달아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">(A) 1번</span><div class=\"rc\"><div class=\"e\">Families don't grow strong</div><div class=\"k\">가족은 강해지지 않는다</div></div><div class=\"rc\"><div class=\"e\">unless parents invest</div><div class=\"k\">부모가 투자하지 않으면</div></div><div class=\"rc\"><div class=\"e\">precious time</div><div class=\"k\">소중한 시간을</div></div><div class=\"rc\"><div class=\"e\">in them.</div><div class=\"k\">그들(= 가족)에게</div></div><div class=\"rnat\">(A) 1 부모가 소중한 시간을 그들(가족)에 투자하지 않으면 가족은 강해지지 않는다.</div><div class=\"rst\">가족은 부모가 소중한 시간을 내 줘야 단단해져요. 바빠도 내 생일엔 꼭 와 주는 부모님처럼요. = 지문의 첫 메시지예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">(A) 2번</span><div class=\"rc\"><div class=\"e\">In New Man,</div><div class=\"k\">《New Man》에서</div></div><div class=\"rc\"><div class=\"e\">Gary Oliver writes about</div><div class=\"k\">Gary Oliver는 ~에 대해 쓰고 있다</div></div><div class=\"rc\"><div class=\"e\">a difficult decision</div><div class=\"k\">어려운 결정에 대해</div></div><div class=\"rc\"><div class=\"e\">made by professional baseball player Tim Burke</div><div class=\"k\">프로 야구 선수 Tim Burke에 의해 내려진</div></div><div class=\"rc\"><div class=\"e\">concerning his family.</div><div class=\"k\">그의(= Tim Burke) 가족에 관한</div></div><div class=\"rnat\">(A) 2 《New Man》에서, Gary Oliver는 프로 야구 선수였던 Tim Burke에 의해 내려진 그의 가족에 관한(Tim Burke가 자신의 가족에 관해 내렸던) 어려운 결정에 대해 쓰고 있다.</div><div class=\"rst\">이제 그걸 보여 주는 실제 이야기예요. 프로 야구 선수 Tim Burke(팀 버크)가 가족 때문에 내린 어려운 결정이래요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">(A) 3번</span><div class=\"rc\"><div class=\"e\">From the time Tim can first remember,</div><div class=\"k\">Tim이 처음 기억할 수 있는 때부터</div></div><div class=\"rc\"><div class=\"e\">his dream was</div><div class=\"k\">그의(= Tim) 꿈은 ~였다</div></div><div class=\"rc\"><div class=\"e\">to be a professional baseball player.</div><div class=\"k\">프로 야구 선수가 되는 것</div></div><div class=\"rnat\">(A) 3 맨 처음 Tim이 기억할 수 있는 그 때부터, 그의 꿈은 프로 야구 선수가 되는 것이었다.</div><div class=\"rst\">팀은 기억나는 아주 어릴 때부터 꿈이 하나였어요. 프로 야구 선수! = 지문 그대로예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">(A) 4번</span><div class=\"rc\"><div class=\"e\">Through years of hard work</div><div class=\"k\">수년간의 고된 노력을 통해</div></div><div class=\"rc\"><div class=\"e\">(a) he achieved</div><div class=\"k\">(a) 그(= Tim Burke)는 달성했다</div></div><div class=\"rc\"><div class=\"e\">that goal.</div><div class=\"k\">그 목표를(= 프로 야구 선수가 되는 것)</div></div><div class=\"rnat\">(A) 4 몇 년간의 고된 노력을 통해 (a)그(Tim Burke)는 그 목표를 달성했다.</div><div class=\"rst\">오랫동안 땀 흘려 연습해서 결국 그 목표를 이뤘어요. 꿈을 이룬 사람이니 <b>(a) 그 = 팀</b>이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">(C) 1번</span><div class=\"rc\"><div class=\"e\">While he was a successful pitcher</div><div class=\"k\">그(= Tim Burke)가 성공한 투수였던 동안</div></div><div class=\"rc\"><div class=\"e\">for the Montreal Expos,</div><div class=\"k\">Montreal Expos에서</div></div><div class=\"rc\"><div class=\"e\">(c) he and his wife</div><div class=\"k\">(c) 그(= Tim Burke)와 그의 아내는</div></div><div class=\"rc\"><div class=\"e\">wanted to start a family</div><div class=\"k\">가정을 꾸리고 싶었지만</div></div><div class=\"rc\"><div class=\"e\">but discovered</div><div class=\"k\">알게 되었다</div></div><div class=\"rc\"><div class=\"e\">that they were unable to have children.</div><div class=\"k\">그들(= Tim Burke와 그의 아내)이 아이를 가질 수 없다는 것을</div></div><div class=\"rnat\">(C) 1 그가 Montreal Expos에서 성공한 투수였던(성공한 투수로 활동했던) 동안, (c)그(Tim Burke)와 그의 아내는 가정을 꾸리고 싶었으나 그들이 아이를 가질 수 없다는 것을 알게 되었다.</div><div class=\"rst\">성공한 투수로 뛰던 시절, 팀과 아내는 아기를 원했지만 가질 수 없었어요. 아내가 있는 투수니 <b>(c) 그 = 팀</b>이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">(C) 2번</span><div class=\"rc\"><div class=\"e\">After much thought,</div><div class=\"k\">많은 생각 후에</div></div><div class=\"rc\"><div class=\"e\">they decided</div><div class=\"k\">그들(= Tim Burke와 그의 아내)은 결정했다</div></div><div class=\"rc\"><div class=\"e\">to adopt</div><div class=\"k\">입양하기로</div></div><div class=\"rc\"><div class=\"e\">four special-needs international children.</div><div class=\"k\">특수 장애가 있는 네 명의 해외 아이들을</div></div><div class=\"rnat\">(C) 2 많은 생각 후에, 그들(Tim Burke와 그의 아내)은 특수 장애가 있는 네 명의 해외 아이들을 입양하기로 결정했다.</div><div class=\"rst\">오래 고민한 끝에, 특별한 돌봄이 필요한 해외 아이 네 명을 입양하기로 해요. = 지문의 입양 결정이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">(C) 3번</span><div class=\"rc\"><div class=\"e\">This led to</div><div class=\"k\">이것(= 특수 장애가 있는 네 명의 해외 아이들을 입양하는 것)은 ~로 이어졌다</div></div><div class=\"rc\"><div class=\"e\">one of the most difficult decisions</div><div class=\"k\">가장 어려운 결정 중의 하나</div></div><div class=\"rc\"><div class=\"e\">of Tim's life.</div><div class=\"k\">Tim의 인생에서</div></div><div class=\"rnat\">(C) 3 이것(특수 장애가 있는 네 명의 해외 아이들을 입양하는 것)은 Tim의 인생에서 가장 어려운 결정 중의 하나로 이어졌다.</div><div class=\"rst\">이 입양이 팀 인생에서 가장 어려운 결정으로 이어져요. 다음 단락이 그 결정이라는 예고예요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">(D) 1번</span><div class=\"rc\"><div class=\"e\">He discovered</div><div class=\"k\">그(= Tim Burke)는 발견했다</div></div><div class=\"rc\"><div class=\"e\">that his life on the road</div><div class=\"k\">그의 이동 중인(장거리를 이동하며 다니는) 삶이</div></div><div class=\"rc\"><div class=\"e\">conflicted with his ability</div><div class=\"k\">그의 능력과 충돌한다는 것을</div></div><div class=\"rc\"><div class=\"e\">to be a quality husband and dad.</div><div class=\"k\">훌륭한 남편과 아버지가 될</div></div><div class=\"rnat\">(D) 1 그(Tim Burke)는 이동 중인(장거리를 이동하며 다니는) 그의 삶이 훌륭한 남편과 아버지가 될 능력과 충돌한다는 것을 발견했다.</div><div class=\"rst\">아이 넷 아빠가 됐는데 원정 경기로 집을 계속 비워요. 지문은 이 생활이 좋은 남편·아빠 노릇과 부딪혔대요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">(D) 2번</span><div class=\"rc\"><div class=\"e\">Over time,</div><div class=\"k\">시간이 흐르면서</div></div><div class=\"rc\"><div class=\"e\">it became clear</div><div class=\"k\">명백해졌다</div></div><div class=\"rc\"><div class=\"e\">that (d) he couldn't do a good job</div><div class=\"k\">(d) 그(= Tim Burke)가 잘할 수 없다는 것이</div></div><div class=\"rc\"><div class=\"e\">at both.</div><div class=\"k\">(일과 가정) 둘 다에서</div></div><div class=\"rnat\">(D) 2 시간이 흐르면서, (d)그(Tim Burke)가 (일과 가정에서) 둘 다 잘할 수 없다는 것이 명백해졌다.</div><div class=\"rst\">시간이 지나자, 야구와 가족 둘 다 잘하는 건 무리라는 게 분명해져요. 고민하는 아빠니 <b>(d) 그 = 팀</b>이에요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">(D) 3번</span><div class=\"rc\"><div class=\"e\">After more thought,</div><div class=\"k\">더 많은 생각 후에</div></div><div class=\"rc\"><div class=\"e\">he made</div><div class=\"k\">그(= Tim Burke)는 내렸다</div></div><div class=\"rc\"><div class=\"e\">what many considered an unbelievable decision:</div><div class=\"k\">많은 사람들이 믿을 수 없다고 여기는 결정을</div></div><div class=\"rc\"><div class=\"e\">(e) he decided</div><div class=\"k\">(e) 그(= Tim Burke)는 결정했다</div></div><div class=\"rc\"><div class=\"e\">to give up professional baseball.</div><div class=\"k\">프로 야구를 포기하기로</div></div><div class=\"rnat\">(D) 3 더 많은 생각 후에, 그(Tim Burke)는 많은 사람들이 믿을 수 없는 결정이라고 여기는 것을 만들었는데(믿을 수 없는 결정을 내렸는데), (e)그(Tim Burke)는 프로 야구를 포기하기로 결정했다.</div><div class=\"rst\">더 고민한 팀은 모두가 놀랄 결정을 해요. 프로 야구를 포기하기로 한 <b>(e) 그 = 팀</b>이에요.</div></div><div class=\"rds key\" data-ord=\"11\"><span class=\"rn\">(B) 1번 · 단서</span><div class=\"rc\"><div class=\"e\">When Tim left the stadium</div><div class=\"k\">Tim이 경기장을 떠날 때</div></div><div class=\"rc\"><div class=\"e\">for the last time,</div><div class=\"k\">마지막으로</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">a reporter stopped him.</span></div><div class=\"k\"><span class=\"cw\">한 기자가 그(= Tim)를 멈춰 세웠다</span></div></div><div class=\"rnat\">(B) 1 Tim이 마지막으로 경기장을 떠날 때, 한 기자가 그를 멈춰 세웠다.</div><div class=\"rst\">팀이 마지막으로 경기장을 나설 때, <b>한 기자</b>(a reporter)가 팀을 붙잡아요. 여기서 처음 새 인물이 나와요.</div></div><div class=\"rds key\" data-ord=\"12\"><span class=\"rn\">(B) 2번 · 단서</span><div class=\"rc\"><div class=\"e\">And then</div><div class=\"k\">그러고 나서</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">(b) he asked</span></div><div class=\"k\"><span class=\"cw\">(b) 그(= 기자)는 물어보았다</span></div></div><div class=\"rc\"><div class=\"e\">why he was retiring.</div><div class=\"k\">왜 그(= Tim Burke)가 은퇴하는지</div></div><div class=\"rnat\">(B) 2 그러고 나서 (b)그(기자)는 왜 그(Tim Burke)가 은퇴하는지 물어보았다.</div><div class=\"rst\">그리고 “왜 은퇴하세요?” 하고 물어요. 붙잡은 사람이 이어서 묻는 거라 <b>(b) 그 = 기자</b>예요!</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">(B) 3번</span><div class=\"rc\"><div class=\"e\">“Baseball is going to do just fine</div><div class=\"k\">“야구는 괜찮을 겁니다</div></div><div class=\"rc\"><div class=\"e\">without me,”</div><div class=\"k\">제가 없어도”</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">he said to the reporter.</span></div><div class=\"k\"><span class=\"cw\">라고 그(= Tim Burke)는 기자에게 말했다</span></div></div><div class=\"rnat\">(B) 3 \"야구는 제가 없어도 괜찮을 겁니다.\"라고 그(Tim Burke)는 기자에게 말했다.</div><div class=\"rst\">팀은 “야구는 저 없어도 잘 굴러갈 거예요.” 하고 <b>기자에게</b> 대답해요. 대답한 게 팀이니 (b)는 기자가 확실해요.</div></div><div class=\"rds\" data-ord=\"14\"><span class=\"rn\">(B) 4번</span><div class=\"rc\"><div class=\"e\">“It’s not going to miss a beat.</div><div class=\"k\">“그것(= 야구)은 한 순간도 멈추지 않을 겁니다.</div></div><div class=\"rc\"><div class=\"e\">But I’m the only father</div><div class=\"k\">하지만 저는 유일한 아버지이고</div></div><div class=\"rc\"><div class=\"e\">my children have</div><div class=\"k\">제 아이들이 가진</div></div><div class=\"rc\"><div class=\"e\">and I’m the only husband</div><div class=\"k\">그리고 유일한 남편입니다</div></div><div class=\"rc\"><div class=\"e\">my wife has.</div><div class=\"k\">제 아내가 가진</div></div><div class=\"rc\"><div class=\"e\">And they need me</div><div class=\"k\">그리고 그들(= 제 아내와 아이들)은 저를 필요로 합니다</div></div><div class=\"rc\"><div class=\"e\">a lot more than baseball does.”</div><div class=\"k\">야구가 그러한 것(저를 필요로 하는 것)보다 훨씬 더”</div></div><div class=\"rnat\">(B) 4 \"그것(야구)은 한 순간도 멈추지 않을 것입니다. 하지만 저는 제 아이들이 가진 유일한 아버지이고, 제 아내가 가진 유일한 남편입니다. 그리고 그들(Tim Burke의 아내와 아이들)은 야구가 그러한(저를 필요로 하는) 것보다 저를 훨씬 더 필요로 합니다.\"</div><div class=\"rst\">“하지만 우리 아이들 아빠, 아내의 남편은 저 하나뿐이에요. 가족은 야구보다 저를 훨씬 더 필요로 해요.” = 첫 문장의 메시지로 돌아와요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"achieve a goal\" data-m=\"목표를 이루다\"><b>achieve a goal</b>목표를 이루다</button><button type=\"button\" class=\"wdb\" data-w=\"reporter\" data-m=\"기자\"><b>reporter</b>기자</button><button type=\"button\" class=\"wdb\" data-w=\"retire\" data-m=\"은퇴하다\"><b>retire</b>은퇴하다</button><button type=\"button\" class=\"wdb\" data-w=\"start a family\" data-m=\"가정을 꾸리다\"><b>start a family</b>가정을 꾸리다</button><button type=\"button\" class=\"wdb\" data-w=\"over time\" data-m=\"시간이 지나면서\"><b>over time</b>시간이 지나면서</button><button type=\"button\" class=\"wdb\" data-w=\"give up\" data-m=\"포기하다\"><b>give up</b>포기하다</button></div>", "12": "<p class=\"mtr\">마더텅 정답률 <b>80%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">장문 불일치는 선택지를 <b>이야기 순서대로</b> 하나씩 대조하세요. ⑤의 <b>‘계속하기로’</b>처럼 결정의 방향을 뒤집은 말이 지문의 <b>give up</b>(포기하다)과 부딪히는지 확인해요.</p><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>① ↔ (A) 4</em>years of hard work(수년간의 고된 노력)로 목표 달성 → 같음</span><span><em>③ ↔ (C) 1</em>pitcher for the Montreal Expos(몬트리올 엑스포스의 투수) → 같음</span><span><em>④ ↔ (C) 2</em>adopt four(네 명 입양) → 같음</span><span><em>② ↔ (B) 1·2</em>마지막으로 경기장을 떠날 때 기자가 질문 → 같음</span></div><div class=\"ck-eq\">⇒ 네 개는 지문과 그대로 같아요. 남은 ⑤를 (D) 3번과 대조해요</div></div><div class=\"ck-via\"><i>▼</i><span>⑤의 ‘야구를 계속하기로’를 (D) 단락 끝에서 찾아요</span></div><div class=\"ck-step key\"><span class=\"lab\">(D) 3번 문장 · 결정적 단서</span><div class=\"en\">After more thought, he made what many considered an unbelievable decision: (e) he decided <mark>to give up professional baseball.</mark></div><p class=\"ko\">더 생각한 후, 그는 많은 사람들이 믿을 수 없다고 여기는 결정을 내렸다. 그는 <mark>프로 야구를 포기하기로</mark> 결정했다.</p></div><div class=\"ck-via\"><i>▼</i><span>포기했으니 기자가 ‘은퇴’ 이유를 물어요</span></div><div class=\"ck-step\"><span class=\"lab\">(B) 2번 문장 · 한 번 더 확인</span><div class=\"en\">And then (b) he asked why he was retiring.</div><p class=\"ko\">그러고 나서 그(= 기자)는 왜 그(= Tim Burke)가 은퇴하는지 물어보았다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">가정을 위해 프로 야구를 계속하기로 했다.<small>(D) 3번: 가정을 위해 야구를 계속한 게 아니라 give up(포기했어요)</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">마지막 경기 후에 기자로부터 질문을 받았다.</span><span class=\"why\">‘마지막 경기’라는 말이 지문에 그대로 없어 의심되지만, (B) 1번 경기장을 for the last time(마지막으로) 떠날 때 기자가 물었으니 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">열심히 노력하여 프로 야구 선수가 되었다.</span><span class=\"why\">(A) 4번 years of hard work(수년간의 고된 노력)로 that goal(그 목표 = 프로 선수)을 이뤘다는 말과 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">Montreal Expos 팀의 투수였다.</span><span class=\"why\">(C) 1번 a successful pitcher(성공한 투수) for the Montreal Expos(몬트리올 엑스포스에서)와 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">네 명의 아이를 입양하기로 했다.</span><span class=\"why\">(C) 2번 decided to adopt(입양하기로 결정했다) four(네 명의) 해외 아이들과 같아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">(A) 1번</span><div class=\"rc\"><div class=\"e\">Families don't grow strong</div><div class=\"k\">가족은 강해지지 않는다</div></div><div class=\"rc\"><div class=\"e\">unless parents invest</div><div class=\"k\">부모가 투자하지 않으면</div></div><div class=\"rc\"><div class=\"e\">precious time</div><div class=\"k\">소중한 시간을</div></div><div class=\"rc\"><div class=\"e\">in them.</div><div class=\"k\">그들(= 가족)에게</div></div><div class=\"rnat\">(A) 1 부모가 소중한 시간을 그들(가족)에 투자하지 않으면 가족은 강해지지 않는다.</div><div class=\"rst\">가족은 부모가 시간을 내 줘야 단단해져요. 바쁜 부모님이 내 생일에 일을 일찍 끝내고 와 주는 것처럼요. = 지문의 첫 메시지예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">(A) 2번</span><div class=\"rc\"><div class=\"e\">In New Man,</div><div class=\"k\">《New Man》에서</div></div><div class=\"rc\"><div class=\"e\">Gary Oliver writes about</div><div class=\"k\">Gary Oliver는 ~에 대해 쓰고 있다</div></div><div class=\"rc\"><div class=\"e\">a difficult decision</div><div class=\"k\">어려운 결정에 대해</div></div><div class=\"rc\"><div class=\"e\">made by professional baseball player Tim Burke</div><div class=\"k\">프로 야구 선수 Tim Burke에 의해 내려진</div></div><div class=\"rc\"><div class=\"e\">concerning his family.</div><div class=\"k\">그의(= Tim Burke) 가족에 관한</div></div><div class=\"rnat\">(A) 2 《New Man》에서, Gary Oliver는 프로 야구 선수였던 Tim Burke에 의해 내려진 그의 가족에 관한(Tim Burke가 자신의 가족에 관해 내렸던) 어려운 결정에 대해 쓰고 있다.</div><div class=\"rst\">이제 그걸 보여 주는 실제 이야기예요. 프로 야구 선수 Tim Burke(팀 버크)가 가족 때문에 내린 어려운 결정이래요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">(A) 3번</span><div class=\"rc\"><div class=\"e\">From the time Tim can first remember,</div><div class=\"k\">Tim이 처음 기억할 수 있는 때부터</div></div><div class=\"rc\"><div class=\"e\">his dream was</div><div class=\"k\">그의(= Tim) 꿈은 ~였다</div></div><div class=\"rc\"><div class=\"e\">to be a professional baseball player.</div><div class=\"k\">프로 야구 선수가 되는 것</div></div><div class=\"rnat\">(A) 3 맨 처음 Tim이 기억할 수 있는 그 때부터, 그의 꿈은 프로 야구 선수가 되는 것이었다.</div><div class=\"rst\">팀은 기억나는 아주 어릴 때부터 꿈이 하나였어요. 프로 야구 선수! = 지문 그대로예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">(A) 4번</span><div class=\"rc\"><div class=\"e\">Through years of hard work</div><div class=\"k\">수년간의 고된 노력을 통해</div></div><div class=\"rc\"><div class=\"e\">(a) he achieved</div><div class=\"k\">(a) 그(= Tim Burke)는 달성했다</div></div><div class=\"rc\"><div class=\"e\">that goal.</div><div class=\"k\">그 목표를(= 프로 야구 선수가 되는 것)</div></div><div class=\"rnat\">(A) 4 몇 년간의 고된 노력을 통해 (a)그(Tim Burke)는 그 목표를 달성했다.</div><div class=\"rst\">오랫동안 땀 흘려 연습해서 결국 그 목표, 프로 선수가 됐어요. = 지문의 <b>수년간의 고된 노력</b> → ① 일치</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">(C) 1번</span><div class=\"rc\"><div class=\"e\">While he was a successful pitcher</div><div class=\"k\">그(= Tim Burke)가 성공한 투수였던 동안</div></div><div class=\"rc\"><div class=\"e\">for the Montreal Expos,</div><div class=\"k\">Montreal Expos에서</div></div><div class=\"rc\"><div class=\"e\">(c) he and his wife</div><div class=\"k\">(c) 그(= Tim Burke)와 그의 아내는</div></div><div class=\"rc\"><div class=\"e\">wanted to start a family</div><div class=\"k\">가정을 꾸리고 싶었지만</div></div><div class=\"rc\"><div class=\"e\">but discovered</div><div class=\"k\">알게 되었다</div></div><div class=\"rc\"><div class=\"e\">that they were unable to have children.</div><div class=\"k\">그들(= Tim Burke와 그의 아내)이 아이를 가질 수 없다는 것을</div></div><div class=\"rnat\">(C) 1 그가 Montreal Expos에서 성공한 투수였던(성공한 투수로 활동했던) 동안, (c)그(Tim Burke)와 그의 아내는 가정을 꾸리고 싶었으나 그들이 아이를 가질 수 없다는 것을 알게 되었다.</div><div class=\"rst\">Montreal Expos(몬트리올 엑스포스)의 성공한 <b>투수</b> 시절, 팀과 아내는 아기를 원했지만 가질 수 없었어요. → ③ 일치</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">(C) 2번</span><div class=\"rc\"><div class=\"e\">After much thought,</div><div class=\"k\">많은 생각 후에</div></div><div class=\"rc\"><div class=\"e\">they decided</div><div class=\"k\">그들(= Tim Burke와 그의 아내)은 결정했다</div></div><div class=\"rc\"><div class=\"e\">to adopt</div><div class=\"k\">입양하기로</div></div><div class=\"rc\"><div class=\"e\">four special-needs international children.</div><div class=\"k\">특수 장애가 있는 네 명의 해외 아이들을</div></div><div class=\"rnat\">(C) 2 많은 생각 후에, 그들(Tim Burke와 그의 아내)은 특수 장애가 있는 네 명의 해외 아이들을 입양하기로 결정했다.</div><div class=\"rst\">오래 고민한 끝에, 특별한 돌봄이 필요한 해외 아이 <b>네 명</b>을 입양하기로 해요. = 지문의 입양 결정 → ④ 일치</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">(C) 3번</span><div class=\"rc\"><div class=\"e\">This led to</div><div class=\"k\">이것(= 특수 장애가 있는 네 명의 해외 아이들을 입양하는 것)은 ~로 이어졌다</div></div><div class=\"rc\"><div class=\"e\">one of the most difficult decisions</div><div class=\"k\">가장 어려운 결정 중의 하나</div></div><div class=\"rc\"><div class=\"e\">of Tim's life.</div><div class=\"k\">Tim의 인생에서</div></div><div class=\"rnat\">(C) 3 이것(특수 장애가 있는 네 명의 해외 아이들을 입양하는 것)은 Tim의 인생에서 가장 어려운 결정 중의 하나로 이어졌다.</div><div class=\"rst\">이 입양이 팀 인생에서 <b>가장 어려운 결정</b>으로 이어져요. 다음 단락이 그 결정이라는 예고예요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">(D) 1번</span><div class=\"rc\"><div class=\"e\">He discovered</div><div class=\"k\">그(= Tim Burke)는 발견했다</div></div><div class=\"rc\"><div class=\"e\">that his life on the road</div><div class=\"k\">그의 이동 중인(장거리를 이동하며 다니는) 삶이</div></div><div class=\"rc\"><div class=\"e\">conflicted with his ability</div><div class=\"k\">그의 능력과 충돌한다는 것을</div></div><div class=\"rc\"><div class=\"e\">to be a quality husband and dad.</div><div class=\"k\">훌륭한 남편과 아버지가 될</div></div><div class=\"rnat\">(D) 1 그(Tim Burke)는 이동 중인(장거리를 이동하며 다니는) 그의 삶이 훌륭한 남편과 아버지가 될 능력과 충돌한다는 것을 발견했다.</div><div class=\"rst\">아이 넷 아빠가 됐는데 원정 경기로 집을 계속 비워요. 지문은 이 생활이 <b>좋은 남편·아빠</b> 노릇과 부딪혔대요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">(D) 2번</span><div class=\"rc\"><div class=\"e\">Over time,</div><div class=\"k\">시간이 흐르면서</div></div><div class=\"rc\"><div class=\"e\">it became clear</div><div class=\"k\">명백해졌다</div></div><div class=\"rc\"><div class=\"e\">that (d) he couldn't do a good job</div><div class=\"k\">(d) 그(= Tim Burke)가 잘할 수 없다는 것이</div></div><div class=\"rc\"><div class=\"e\">at both.</div><div class=\"k\">(일과 가정) 둘 다에서</div></div><div class=\"rnat\">(D) 2 시간이 흐르면서, (d)그(Tim Burke)가 (일과 가정에서) 둘 다 잘할 수 없다는 것이 명백해졌다.</div><div class=\"rst\">시간이 지나자, 야구와 가족 둘 다 잘하는 건 무리라는 게 분명해져요. (d) 그 = 팀이에요.</div></div><div class=\"rds key\" data-ord=\"10\"><span class=\"rn\">(D) 3번 · 단서</span><div class=\"rc\"><div class=\"e\">After more thought,</div><div class=\"k\">더 많은 생각 후에</div></div><div class=\"rc\"><div class=\"e\">he made</div><div class=\"k\">그(= Tim Burke)는 내렸다</div></div><div class=\"rc ckc\"><div class=\"e\">what many considered <span class=\"cw\">an unbelievable decision</span>:</div><div class=\"k\">많은 사람들이 <span class=\"cw\">믿을 수 없다고 여기는 결정을</span></div></div><div class=\"rc\"><div class=\"e\">(e) he decided</div><div class=\"k\">(e) 그(= Tim Burke)는 결정했다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">to give up professional baseball.</span></div><div class=\"k\"><span class=\"cw\">프로 야구를 포기하기로</span></div></div><div class=\"rnat\">(D) 3 더 많은 생각 후에, 그(Tim Burke)는 많은 사람들이 믿을 수 없는 결정이라고 여기는 것을 만들었는데(믿을 수 없는 결정을 내렸는데), (e)그(Tim Burke)는 프로 야구를 포기하기로 결정했다.</div><div class=\"rst\">더 고민한 팀은 모두가 놀랄 결정을 해요. 야구를 계속하는 게 아니라 <b>프로 야구를 포기</b>(give up)해요. → ⑤가 틀린 곳</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">(B) 1번</span><div class=\"rc\"><div class=\"e\">When Tim left the stadium</div><div class=\"k\">Tim이 경기장을 떠날 때</div></div><div class=\"rc\"><div class=\"e\">for the last time,</div><div class=\"k\">마지막으로</div></div><div class=\"rc\"><div class=\"e\">a reporter stopped him.</div><div class=\"k\">한 기자가 그(= Tim)를 멈춰 세웠다</div></div><div class=\"rnat\">(B) 1 Tim이 마지막으로 경기장을 떠날 때, 한 기자가 그를 멈춰 세웠다.</div><div class=\"rst\">팀이 마지막으로(for the last time) 경기장을 나설 때, 한 기자가 팀을 붙잡아요. = 지문의 은퇴 날이에요.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">(B) 2번</span><div class=\"rc\"><div class=\"e\">And then</div><div class=\"k\">그러고 나서</div></div><div class=\"rc\"><div class=\"e\">(b) he asked</div><div class=\"k\">(b) 그(= 기자)는 물어보았다</div></div><div class=\"rc\"><div class=\"e\">why he was retiring.</div><div class=\"k\">왜 그(= Tim Burke)가 은퇴하는지</div></div><div class=\"rnat\">(B) 2 그러고 나서 (b)그(기자)는 왜 그(Tim Burke)가 은퇴하는지 물어보았다.</div><div class=\"rst\">기자가 “왜 <b>은퇴</b>하세요?” 하고 물어요. 마지막 날 기자에게 질문을 받은 거죠. → ② 일치</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">(B) 3번</span><div class=\"rc\"><div class=\"e\">“Baseball is going to do just fine</div><div class=\"k\">“야구는 괜찮을 겁니다</div></div><div class=\"rc\"><div class=\"e\">without me,”</div><div class=\"k\">제가 없어도”</div></div><div class=\"rc\"><div class=\"e\">he said to the reporter.</div><div class=\"k\">라고 그(= Tim Burke)는 기자에게 말했다</div></div><div class=\"rnat\">(B) 3 \"야구는 제가 없어도 괜찮을 겁니다.\"라고 그(Tim Burke)는 기자에게 말했다.</div><div class=\"rst\">팀은 “야구는 저 없어도 잘 굴러갈 거예요.” 하고 기자에게 대답해요. = 지문 속 팀의 말이에요.</div></div><div class=\"rds\" data-ord=\"14\"><span class=\"rn\">(B) 4번</span><div class=\"rc\"><div class=\"e\">“It’s not going to miss a beat.</div><div class=\"k\">“그것(= 야구)은 한 순간도 멈추지 않을 겁니다.</div></div><div class=\"rc\"><div class=\"e\">But I’m the only father</div><div class=\"k\">하지만 저는 유일한 아버지이고</div></div><div class=\"rc\"><div class=\"e\">my children have</div><div class=\"k\">제 아이들이 가진</div></div><div class=\"rc\"><div class=\"e\">and I’m the only husband</div><div class=\"k\">그리고 유일한 남편입니다</div></div><div class=\"rc\"><div class=\"e\">my wife has.</div><div class=\"k\">제 아내가 가진</div></div><div class=\"rc\"><div class=\"e\">And they need me</div><div class=\"k\">그리고 그들(= 제 아내와 아이들)은 저를 필요로 합니다</div></div><div class=\"rc\"><div class=\"e\">a lot more than baseball does.”</div><div class=\"k\">야구가 그러한 것(저를 필요로 하는 것)보다 훨씬 더”</div></div><div class=\"rnat\">(B) 4 \"그것(야구)은 한 순간도 멈추지 않을 것입니다. 하지만 저는 제 아이들이 가진 유일한 아버지이고, 제 아내가 가진 유일한 남편입니다. 그리고 그들(Tim Burke의 아내와 아이들)은 야구가 그러한(저를 필요로 하는) 것보다 저를 훨씬 더 필요로 합니다.\"</div><div class=\"rst\">“하지만 우리 아이들 아빠, 아내의 남편은 저 하나뿐이에요. 가족은 야구보다 저를 훨씬 더 필요로 해요.” = 첫 문장의 메시지로 돌아와요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"pitcher\" data-m=\"투수\"><b>pitcher</b>투수</button><button type=\"button\" class=\"wdb\" data-w=\"adopt\" data-m=\"입양하다\"><b>adopt</b>입양하다</button><button type=\"button\" class=\"wdb\" data-w=\"special-needs\" data-m=\"특별한 보살핌이 필요한\"><b>special-needs</b>특별한 보살핌이 필요한</button><button type=\"button\" class=\"wdb\" data-w=\"international\" data-m=\"해외의, 국제적인\"><b>international</b>해외의, 국제적인</button><button type=\"button\" class=\"wdb\" data-w=\"unbelievable\" data-m=\"믿기 어려운\"><b>unbelievable</b>믿기 어려운</button><button type=\"button\" class=\"wdb\" data-w=\"give up\" data-m=\"포기하다\"><b>give up</b>포기하다</button></div>"};

 var b=e.target.closest('.stbtn');

 var w=e.target.closest('.wdb');
