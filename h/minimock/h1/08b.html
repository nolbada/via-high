<body>
<div id="app"></div>
<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:Canvas;color:CanvasText;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';
    document.body.appendChild(d);
    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');
    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';
      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}

(3)과 (4) 사이입니다", "이 자리도 Kaldi가 염소들의 행동을 알아채는 (5)보다 앞입니다", "주어진 문장의 <b>his observation<\/b>이 가리킬 내용이 아직 나오지 않았습니다"]}, {"n": "③", "t": "③ 자리", "g": "", "ok": false, "e": ["③은 문장 (4)와 (5) 사이입니다", "바로 뒤의 (5)에서야 Kaldi가 염소들이 잠을 자지 않는 것을 알아챕니다", "그 관찰 내용이 나오기 전에 '관찰 내용을 전했다'가 오면 순서가 맞지 않습니다"]}, {"n": "④", "t": "④ 자리", "g": "", "ok": true, "e": ["④는 문장 (5)와 (6) 사이입니다", "(5)에서 Kaldi가 염소들의 행동을 알아챈 뒤, 주어진 문장에서 그 관찰 내용을 수도원에 전하고 수도원장이 커피를 우려냅니다", "이어서 (6)에서 <b>this new beverage<\/b>(이 새로운 음료)의 각성 효과와 풍미에 대한 소문이 수도원 너머로 퍼집니다", "<b>alerting effect<\/b>와 <b>awakening effects<\/b>, <b>the monastery<\/b>가 이어져 자연스럽습니다"]}, {"n": "⑤", "t": "⑤ 자리", "g": "", "ok": false, "e": ["⑤는 문장 (6)과 (7) 사이입니다", "(6)에 이미 <b>the monastery<\/b>(수도원)와 <b>awakening effects<\/b>(각성 효과)가 나오는데, 이것들이 처음 나오는 곳은 주어진 문장입니다", "주어진 문장이 (6) 뒤로 가면 설명이 소문보다 늦게 나오게 됩니다"]}], "tr": ["Kaldi가 그 지역 수도원에 그의 관찰 내용을 전했을 때, 그 수도원장은 한 주전자의 커피를 우려내고, 그가 그것을 마셨을 때 그것의 풍미와 각성 효과를 알아차린 첫 번째 사람이 되었다.", "수 세기 동안 사람들이 커피를 마셔왔음에도 불구하고, 단지 커피가 어디서 유래했는지 또는 누가 그것을 처음 발견했는지는 분명하지 않다.", "하지만 유력한 전설은 한 염소지기가 에티오피아의 고원에서 커피를 발견했다고 주장한다.", "이 전설에 대한 다양한 시기는 기원전 900년, 기원후 300년, 기원후 800년을 포함한다.", "실제 시기와 상관없이, 염소지기인 Kaldi는 그의 염소들이 후에 커피나무라고 알려진 것(나무)에서 나온 열매를 먹은 후 밤에 잠을 자지 않았다는 것을 알아챘다고 한다.", "이 새로운 음료의 각성 효과와 좋은 풍미에 대한 소문은 이내 수도원 너머로 퍼졌다.", "Kaldi의 이야기는 사실이라기보다 꾸며낸 이야기일지도 모르지만, 적어도 몇몇 역사적 증거는 커피가 정말로 에티오피아의 고원에서 유래했다는 것을 보여준다."], "ps": [{"n": 1, "ch": [{"e": "When Kaldi reported <b>his observation<\/b>", "k": "Kaldi가 그의<span class=\"r\">(= Kaldi의)<\/span> 관찰 내용을 전했을 때"}, {"e": "to the local monastery,", "k": "그 지역 수도원에"}, {"e": "the abbot became <b>the first person<\/b>", "k": "그 수도원장은 첫 번째 사람이 되었다"}, {"e": "to brew a pot of coffee", "k": "한 주전자의 커피를 우려내고"}, {"e": "and note its flavor and alerting effect", "k": "그것의<span class=\"r\">(= 커피의)<\/span> 풍미와 각성 효과를 알아차린"}, {"e": "when he drank it.", "k": "그<span class=\"r\">(= 수도원장)<\/span>가 그것<span class=\"r\">(= 커피)<\/span>을 마셨을 때"}], "easy": "Kaldi가 본 것을 수도원에 알리자, 수도원장이 커피를 우려내 마셔 보고 그 맛과 각성 효과를 처음 알아챈 사람이 되었어요.", "gist": "[주어진 문장] Kaldi의 관찰이 수도원으로 전해지고, 수도원장이 커피를 직접 마셔 본다. ④ 자리, 즉 (5)와 (6) 사이에 들어간다.", "link": "Kaldi가 그 지역 수도원에 그의 관찰 내용을 전했을 때, 그 수도원장은 한 주전자의 커피를 우려내고, 그가 그것을 마셨을 때 그것의 풍미와 각성 효과를 알아차린 첫 번째 사람이 되었다."}, {"n": 2, "ch": [{"e": "<b>Although<\/b> humans have been drinking coffee", "k": "비록 인간이 커피를 마셔 왔음에도"}, {"e": "for centuries,", "k": "수 세기 동안"}, {"e": "it is <b>not clear<\/b>", "k": "분명하지 않다"}, {"e": "just where coffee originated", "k": "단지 커피가 어디서 유래했는지"}, {"e": "or who first discovered it.", "k": "또는 누가 그것<span class=\"r\">(= 커피)<\/span>을 처음 발견했는지는"}], "easy": "사람들이 몇백 년 동안 커피를 마셨지만, 커피가 어디서 왔고 누가 처음 발견했는지는 확실하지 않아요.", "gist": "글의 출발점: 커피의 기원이 분명하지 않다는 문제를 던진다."}, {"n": 3, "ch": [{"e": "<b>However<\/b>,", "k": "하지만"}, {"e": "the <b>predominant<\/b> legend", "k": "유력한 전설은"}, {"e": "<b>has it that<\/b>", "k": "~라고 주장한다"}, {"e": "a goatherd discovered coffee", "k": "한 염소지기가 커피를 발견했다고"}, {"e": "in the Ethiopian highlands.", "k": "에티오피아의 고원에서"}], "easy": "하지만 가장 유력한 전설은, 염소지기가 에티오피아 고원에서 커피를 발견했다고 말해요.", "gist": "However로 방향을 바꿔, 기원에 관한 가장 유력한 전설을 소개한다."}, {"n": 4, "ch": [{"e": "<b>Various dates<\/b>", "k": "다양한 시기는"}, {"e": "for this legend", "k": "이 전설에 대한"}, {"e": "<b>include<\/b>", "k": "포함한다"}, {"e": "900 BC, 300 AD, and 800 AD.", "k": "기원전 900년, 기원후 300년, 기원후 800년을"}], "easy": "이 전설이 일어난 때를 두고 기원전 900년, 기원후 300년, 기원후 800년 같은 여러 설이 있어요.", "gist": "전설의 시기가 하나로 정해져 있지 않다고 덧붙인다."}, {"n": 5, "ch": [{"e": "<b>Regardless of<\/b> the actual date,", "k": "실제 시기와 상관없이"}, {"e": "it is said that", "k": "~라고 한다"}, {"e": "Kaldi, the goatherd,", "k": "염소지기인 Kaldi가"}, {"e": "noticed", "k": "알아챘다"}, {"e": "that his goats did not sleep at night", "k": "그의<span class=\"r\">(= Kaldi의)<\/span> 염소들이 밤에 잠을 자지 않았다는 것을"}, {"e": "after eating berries", "k": "열매를 먹은 후에"}, {"e": "from what would later be known", "k": "후에 알려지게 될 것(나무)에서 나온"}, {"e": "as a coffee tree.", "k": "커피나무로"}], "easy": "시기가 언제든, Kaldi는 염소들이 어떤 나무의 열매를 먹고 밤에 잠을 안 잔다는 걸 알아챘대요. 그 나무가 나중에 커피나무라고 불리게 되죠.", "gist": "Kaldi가 처음 등장해 염소들의 이상한 행동(밤에 잠을 안 잠)을 관찰한다. 주어진 문장의 'his observation'이 가리키는 내용이다.", "link": "실제 시기와 상관없이, 염소지기인 Kaldi는 그의 염소들이 후에 커피나무라고 알려지게 될 것에서 나온 열매를 먹은 후 밤에 잠을 자지 않았다는 것을 알아챘다고 한다."}, {"n": 6, "ch": [{"e": "<b>Word of<\/b> the awakening effects", "k": "각성 효과에 대한 소문은"}, {"e": "and the pleasant taste", "k": "그리고 좋은 풍미에 대한"}, {"e": "of <b>this new beverage<\/b>", "k": "이 새로운 음료<span class=\"r\">(= 커피)<\/span>의"}, {"e": "soon spread", "k": "이내 퍼졌다"}, {"e": "beyond the monastery.", "k": "수도원 너머로"}], "easy": "이 새로운 음료가 잠을 깨우고 맛도 좋다는 소문이 곧 수도원 밖까지 퍼졌어요.", "gist": "주어진 문장 다음에 이어지는 문장이다. 수도원에서 시작된 소문이 바깥으로 퍼지는 모습을 보여 준다.", "link": "이 새로운 음료의 각성 효과와 좋은 풍미에 대한 소문은 이내 수도원 너머로 퍼졌다."}, {"n": 7, "ch": [{"e": "The story of Kaldi", "k": "Kaldi의 이야기는"}, {"e": "might be <b>more fable than fact<\/b>,", "k": "사실이라기보다 꾸며낸 이야기일지도 모르지만"}, {"e": "but <b>at least<\/b> some historical evidence", "k": "적어도 몇몇 역사적 증거는"}, {"e": "<b>indicates that<\/b>", "k": "~을 보여준다"}, {"e": "coffee <b>did<\/b> originate", "k": "커피가 정말로 유래했다는 것을"}, {"e": "in the Ethiopian highlands.", "k": "에티오피아의 고원에서"}], "easy": "Kaldi 이야기는 지어낸 이야기일 수도 있어요. 하지만 커피가 에티오피아 고원에서 시작된 게 맞다는 역사적 증거도 있어요.", "gist": "전설은 꾸며낸 이야기일 수 있어도, 커피의 기원은 에티오피아 고원이라는 점은 증거가 뒷받침한다며 글을 맺는다."}]}, {"no": "09", "typ": "무관한 문장", "src": "2020년 9월 35번", "evn": [1, 6, 7], "ev_en": "In a single week, the sun delivers more energy to our planet than humanity has used through the burning of coal, oil, and natural gas through all of human history. / Our efforts to develop technologies that use fossil fuels have shown meaningful results. / Our challenge, and our opportunity, is to learn to efficiently and cheaply use the much more abundant source that is the new energy striking our planet each day from the sun.", "ev_ko": [[1, "단 일주일 안에, 태양은 인간의 모든 역사에 걸쳐 인간이 석탄, 석유, 그리고 천연가스의 연소를 통해 사용해 온 (에너지)보다 더 많은 에너지를 지구에 전달한다."], [6, "화석 연료를 사용하는 기술을 개발하기 위한 우리의 노력은 의미 있는 결과를 보여왔다."], [7, "우리의 (당면) 과제이자 기회는 태양으로부터 매일 지구를 강타하고 있는(지구에 도달하는) 새로운 에너지인 '훨씬 더 풍부한' 원천을 효율적이고 저렴하게 사용하는 것을 배우는 것이다."]], "why": ["무관한 문장은 <b>글 전체가 말하는 방향<\/b>과 어긋나는 문장입니다", "이 글은 1번에서 태양이 주는 에너지가 얼마나 풍부한지 보여 주고, 7번에서 석탄, 석유, 천연가스 같은 화석 연료 대신 <b>매일 태양으로부터 지구에 도달하는 훨씬 더 풍부한 새로운 에너지<\/b>를 효율적이고 저렴하게 쓰는 법을 배워야 한다고 결론짓습니다", "그런데 문장 (6)은 <b>화석 연료를 사용하는 기술 개발의 결과<\/b>를 이야기합니다", "글의 내용과 관계가 없으므로 답은 ④입니다"], "ch": [{"n": "①", "t": "Our challenge isn't that we're running out of energy.", "g": "우리의 과제는 우리가 에너지를 고갈시키고 있다는 것이 아니다.", "ok": false, "e": ["문장 (3)은 우리의 과제가 에너지를 고갈시키고 있다는 것이 아니라고 말합니다", "이 글이 말하려는 '과제'를 꺼내는 문장이라 흐름에 맞습니다"]}, {"n": "②", "t": "It's that we have been focused on the wrong source — the small, finite one that we're using up.", "g": "그것은 우리가 잘못된 원천, 즉 우리가 고갈시키고 있는 적고 유한한 원천에 집중해 왔다는 것이다.", "ok": false, "e": ["문장 (4)는 (3)에 이어 진짜 과제가 우리가 잘못된 원천, 즉 우리가 고갈시키고 있는 적고 유한한 원천에 집중해 왔다는 것이라고 말합니다", "(3)과 짝을 이루어 흐름에 맞습니다"]}, {"n": "③", "t": "Indeed, all the coal, natural gas, and oil we use today is just solar energy from millions of years ago, a very tiny part of which was preserved deep underground.", "g": "사실 오늘날 우리가 사용하는 모든 석탄, 천연가스, 그리고 석유는 단지 수백만 년 전의 태양 에너지일 뿐이고, 그것의 매우 적은 일부분만이 깊은 지하에 보존되었다.", "ok": false, "e": ["문장 (5)는 오늘날 쓰는 석탄, 천연가스, 석유도 수백만 년 전의 태양 에너지일 뿐이라고 말합니다", "글이 다루는 태양 에너지 이야기와 이어져 흐름에 맞습니다"]}, {"n": "④", "t": "Our efforts to develop technologies that use fossil fuels have shown meaningful results.", "g": "화석 연료를 사용하는 기술을 개발하기 위한 우리의 노력은 의미 있는 결과를 보여왔다.", "ok": true, "e": ["문장 (6)은 화석 연료를 사용하는 기술 개발의 결과를 말합니다", "글은 화석 연료 대신 태양에서 오는 풍부한 에너지에 집중하자는 내용이므로, 이 문장만 글과 관계가 없습니다"]}, {"n": "⑤", "t": "Our challenge, and our opportunity, is to learn to efficiently and cheaply use the much more abundant source that is the new energy striking our planet each day from the sun.", "g": "우리의 (당면) 과제이자 기회는 태양으로부터 매일 지구에 도달하는 새로운 에너지인 '훨씬 더 풍부한' 원천을 효율적이고 저렴하게 사용하는 것을 배우는 것이다.", "ok": false, "e": ["문장 (7)은 우리의 과제이자 기회가 태양으로부터 매일 지구에 도달하는 훨씬 더 풍부한 새로운 에너지를 효율적이고 저렴하게 사용하는 법을 배우는 것이라고 말합니다", "글의 중심 내용이라 흐름에 맞습니다"]}], "tr": ["단 일주일 안에, 태양은 인 는 커피가 실제로 에티오피아 고지대에서 유래했음을 보여 준다."]], "evh": "4 · 6번 문장", "ev": [{"en": true, "h": "Kaldi, the goatherd, noticed that his goats did not sleep at night after eating berries ~ / Word of the awakening effects and the pleasant taste of this new beverage soon spread beyond the monastery."}, {"en": false, "h": "문장삽입 문제는 <b>주어진 문장의 앞뒤 연결고리</b>를 찾는 것입니다. 주어진 문장은 <b>Kaldi가 수도원에 알리자 수도원장이 커피를 끓였다</b>는 내용입니다. 4번은 <b>Kaldi가 염소의 이상 행동을 알아차렸다</b>는 데서 끝나고, ④ 뒤의 6번은 <b>'이 소식(Word)'이 수도원 너머로 퍼졌다</b>고 합니다. 그런데 6번의 <b>Word of the awakening effects</b>가 나오려면, 그 사이에 <b>누군가 커피를 끓여 각성 효과를 직접 확인한 사건</b>이 있어야 합니다 — 그것이 바로 주어진 문장입니다. 따라서 주어진 문장은 4번과 6번 <b>사이(④)</b>에 들어가야 합니다."}], "opts": [{"n": "①", "t": "\"However, ~ Ethiopian highlands.\" 앞", "a": false, "x": true, "trap": false, "e": "이 자리는 아직 커피의 기원이 <b>불분명하다</b>는 도입부입니다. 수도원에 보고했다는 사건이 들어가기엔 너무 이릅니다."}, {"n": "②", "t": "\"Various dates ~\" 앞", "a": false, "x": true, "trap": false, "e": "이 자리는 전설의 <b>연대</b> 이야기로 이어지는 자리라, 수도원 사건이 끼어들면 흐름이 끊깁니다."}, {"n": "③", "t": "\"Regardless of the actual date ~\" 앞", "a": false, "x": true, "trap": false, "e": "이 자리에 들어가면 Kaldi가 <b>염소를 알아차리기도 전에</b> 이미 수도원에 보고한 셈이 되어 시간 순서가 뒤집힙니다."}, {"n": "④", "t": "\"Word of the awakening effects ~\" 앞", "a": true, "x": false, "trap": false, "e": "Kaldi가 염소의 이상 행동을 알아차린 <b>다음</b>, 수도원에 알려 수도원장이 커피를 끓였고, <b>그 소문(Word)</b>이 퍼졌다는 순서가 자연스럽게 이어집니다."}, {"n": "⑤", "t": "\"The story of Kaldi ~\" 앞", "a": false, "x": true, "trap": true, "e": "이 자리는 이미 <b>소문이 다 퍼진 뒤</b> 전설 전체를 마무리하는 문장 앞입니다. 여기에 넣으면 수도원장 이야기가 마무리 뒤에 뜬금없이 등장하게 됩니다."}], "w": [["for centuries", "몇 세기 동안"], ["originate", "유래하다, 기원하다"], ["predominant", "지배적인, 유력한"], ["legend", "전설"], ["goatherd", "염소치기"], ["Ethiopian highlands", "에티오피아 고지대"], ["monastery", "수도원"], ["abbot", "수도원장"], ["alerting effect", "각성 효과"], ["historical evidence", "역사적 증거"]]}, {"q": "09", "type": "무관 문장", "src": "2020년 9월 35번", "ans": "④", "tr": [["1", "단 일주일 만에 태양은 인류가 역사 전체에 걸쳐 석탄, 석유, 천연가스를 태워서 써 온 것보다 더 많은 에너지를 지구에 보낸다."], ["2", "그리고 태양은   s.ch.forEach(c=>{x+='<div class="ch"><div class="ce">'+String(c.e).replace(/<\/?b>/g,'')+'</div><div class="ck">'+c.k+'</div></div>';});
  const lays=[];
  if(s.link)lays.push(['이어 읽으면',s.link]);
  if(s.easy)lays.push(['쉬운 말로',s.easy]);
  if(s.gist)lays.push(['결국 이 얘기',s.gist]);
  lays.forEach(l=>{x+='<div class="lay"><span class="lb">'+l[0]+'</span>'+l[1]+'</div>';});
  if(lays.length)x+='<button class="stg" data-names="'+lays.map(l=>l[0]).join('|')+'">'+lays[0][0]+'</button>';
  return x+'</div>';
}
function esc2(s){return String(s)}
function mdWrap(s){s=String(s);let o='',d=0,buf='',i=0;
const flush=()=>{if(buf){o+=(d===0&&/[A-Za-z0-9가-힣]/.test(buf))?'<span class="cr">'+buf+'</span>':buf;buf='';}};
while(i<s.length){const ch=s[i];
if(ch==='<'){const j=s.indexOf('>',i);buf+=s.slice(i,j+1);i=j+1;continue;}
if(ch==='\x01'){flush();if(d===0)o+='<span class="md">';o+='(';d++;i++;continue;}
if(ch==='\x02'){flush();o+=')';d--;if(d===0)o+='</span>';i++;continue;}
buf+=ch;i++;}
flush();return o;}
function chunkSplit(s){return String(s).split(' / ')}
function scHtml(c){
  const esc=String;
  const E=chunkSplit(c.pe||c.eng),K=chunkSplit(c.pk||c.lit);
  let x='<div class="sc"><div class="sc-h"><span class="no2">'+esc(c.q)+'</span><span class="at">'+esc(c.q)+'번 문제 · '+esc(c.s)+'번 문장</span><span class="tt">'+esc(c.title)+'</span><span class="chv"></span></div><div class="sc-b">';
  if(c.steps&&c.steps.length){x+='<div class="lay th"><div class="hd">이 문장 읽는 순서</div><ol>'+c.steps.map(p=>'<li>'+p.t+(p.sub||[]).map(u=>'<div class="sub">'+u+'</div>').join('')+'</li>').join('')+'</ol></div>';}
  for(let j=0;j<E.length;j++)x+='<div class="ch"><div class="ce">'+mdWrap(E[j])+'</div><div class="ck">'+mdWrap(K[j]||'')+'</div></div>';
  if(c.notes.length){x+='<div class="nts">'+c.notes.map(n=>'<span class="nt"><sup>'+n[0]+'</sup> <b>'+esc(n[1])+'</b> '+esc(n[2])+'</span>').join('')+'</div>';}
  x+='<div class="lay nat"><span class="lb">자연스러운 해석</span>'+esc(c.nat)+'</div>';
  const sm=c.sum||c.core;
  if(sm){x+='<div class="lay sum"><span class="lb">한 줄 정리</span>'+esc(sm)+'</div>';}
  x+='</div></div>';
  return x;
}

function renderNote(){
  const list=noteList();
  let h=`<header><div class="wrap hd2"><h1>단어 오답노트 <span class="meta">${list.length}개</span></h1><button class="link" id="back">확인표</button></div></header><div class="wrap">`;
  if(!list.length)h+=`<div class="empty">아직 표시한 단어가 없습니다</div>`;
  list.forEach(it=>{
    const w=it.w,r=(S.res[WS.id]||{})[it.i]||{};
    h+=`<div class="note-item"><span class="w">${esc(w.w)}</span><span class="meta">${esc(w.src)}번</span>`;
    const row=(p,tag,txt,ko)=>{
      const bad=it.parts.includes(p);
      const rs=r[p]===1?'<span class="res o">맞춤</span>':r[p]===0?'<span class="res x">틀림</span>':'';
      return `<div class="part ${p} ${bad?'bad':''}"><span class="tag">${tag}</span><span>${esc(txt)}${ko?`<span class="ko"> ${esc(ko)}</span>`:''}</span>${bad?rs:''}</div>`;
    };
    h+=row('m','뜻',w.m,'');
    if(w.s)h+=row('s','유',w.s[0],w.s[1]);
    if(w.a)h+=row('a','반',w.a[0],w.a[1]);
    h+=`</div>`;
  });
  h+=`</div><div class="bar"><div class="wrap"><button class="btn" id="back2">확인표</button><button class="btn pri" id="start" ${list.length?'':'disabled'}>복습 시작</button></div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='word';armed=null;render();};
  $('#back2').onclick=()=>{view='word';render();};
  $('#start').onclick=()=>{quiz={qs:buildQuestions(),n:0,right:0,done:false,shown:false};view='quiz';render();};
}
function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
/* ---- 답 제출 ---- */
function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});try{var _m=String(FILE).match(/^(\d\d)([ab])$/);if(_m&&window.WN)WN.hw('미니모고 '+(GCODE==='h2'?'고2':'고1'),(+_m[1])*2-(_m[2]==='a'?1:0),s+'/'+N);}catch(e){}
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}

  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';

/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
