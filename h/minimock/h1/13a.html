<title>고1 미니모의고사 13회 01–06번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:84px}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}

.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}

.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}

.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}

.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}

.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}
.hcard .chip{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--sub)}

details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}

.th ol{list-style:none;margin:0;padding:0;counter-reset:n}

.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}

/* ---- 새 직독직해·해설 화면 ---- */

.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}

details.sub2{margin:12px 0 0}

가 <b>that절</b>이다. 주어 뒤에 동명사구가 붙어서 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: The most obvious way (가장 명확한 방법)", "V: is (be ~이다)", "C: that절 (명사절. ~라는 것)", "뼈대 = <b>The most obvious way is that ~</b>"]}, {"t": "<b>of identifying a genuine smile from an insincere one</b>은 전치사구(형용사구)이다. way를 꾸민다.", "sub": ["of 뒤라서 identifying은 동명사. identify A from B (A를 B와 구별하다)", "a genuine smile (진짜 미소), an insincere one (진실하지 못한 미소). one = smile, insincere 진실하지 못한"]}, {"t": "that절 안은 <b>S+V+O(3형식)</b>이다.", "sub": ["S: a fake smile (가짜 미소)", "V: affects (affect 영향을 미치다)", "O: the lower half (아랫부분)", "뼈대 = <b>a fake smile affects the lower half</b>", "primarily only (주로 오직)는 부사, of the face는 half를 꾸미는 형용사구 (얼굴의)"]}, {"t": "<b>mainly with the mouth alone</b>은 전치사구(부사구)이다. affects를 꾸민다 (주로 입만으로). mainly (주로), alone (홀로, 단독으로)."}, {"t": "함정: identifying은 동사가 아니라 of 뒤의 동명사이다. 문장의 동사는 <b>is</b>이다."}], "sum": "진짜·가짜 미소 구별법, 가짜 미소는 주로 입 주변에만 작용"}, {"i": "07", "q": "06", "s": "4", "title": "S+V+C + 관계부사 where절", "eng": "This old-school<sup>1</sup>, adversarial<sup>2</sup> approach / may be useful in a one-off<sup>3</sup> negotiation / where you will probably not deal with that person again.", "notes": [["1", "old-school", "구식의"], ["2", "adversarial", "적대적인"], ["3", "one-off", "일회성의"]], "lit": "이런 구식의, 적대적인 접근법은 / 일회성 협상에서는 유용할 수도 있다 / 그 사람과 아마 다시 상대하지 않을", "nat": "이런 구식의 적대적인 접근법은, 그 사람과 아마 다시 상대하지 않을 일회성 협상에서는 유용할 수도 있다.", "ana": "<b>where ~</b>는 a one-off negotiation을 수식하는 <b>관계부사절</b>이다.", "pe": "This \u0001old-school<sup>1</sup>\u0002, \u0001adversarial<sup>2</sup>\u0002 approach / may be useful \u0001in a one-off<sup>3</sup> negotiation\u0002 / \u0001where you will probably not deal with that person again\u0002.", "pk": "이런 \u0001구식의\u0002, \u0001적대적인\u0002 접근법은 / \u0001일회성 협상에서는\u0002 유용할 수도 있다 / \u0001그 사람과 아마 다시 상대하지 않을\u0002", "core": "이런 접근법은 유용할 수도 있다.", "tags": ["주어: This approach. (old-school), (adversarial) = 형용사: approach를 꾸밈", "동사 <b>may be</b>, 보어 useful (SVC). (in a one-off negotiation) = 전치사구(부사구): useful을 꾸밈", "(where ~) = 관계부사절(형용사절): negotiation을 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식)</b> 뒤에 <b>관계부사 where절</b>이 붙은 문장이다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: This approach (이런 접근법)", "V: may be (~일 수도 있다)", "C: useful (유용한)", "뼈대 = <b>This approach may be useful</b>", "old-school (구식의), adversarial (적대적인)은 approach를 꾸미는 형용사"]}, {"t": "<b>in a one-off negotiation</b>은 전치사구(부사구)이다. useful을 꾸민다 (일회성 협상에서는). one-off (일회성의), negotiation (협상)."}, {"t": "<b>where you will probably not deal with that person again</b>은 <b>관계부사절(형용사절)</b>이다. a one-off negotiation을 꾸민다.", "sub": ["where = in which (그 협상에서)", "S: you (당신), V: will deal with (deal with 상대하다), O: that person (그 사람)", "probably (아마), again (다시)"]}, {"t": "함정: where의 선행사는 장소가 아니라 <b>협상(상황)</b>이다. 이렇게 상황을 선행사로 받는 where도 쓴다."}], "sum": "구식·적대적 접근법, 다시 안 볼 일회성 협상에서는 유용"}, {"i": "08", "q": "06", "s": "5", "title": "S+V+C + because절 + 대시 동격", "eng": "However, such transactions<sup>1</sup> are becoming increasingly<sup>2</sup> rare, / because most of us deal with the same people repeatedly<sup>3</sup> / — our spouses and children, our friends and colleagues<sup>4</sup>, our customers and clients.", "notes": [["1", "transaction", "거래"], ["2", "increasingly", "점점 더"], ["3", "repeatedly", "반복적으로"], ["4", "colleague", "동료"]], "lit": "하지만, 그러한 거래는 점점 더 드물어지고 있다, / 우리 대부분이 같은 사람들을 반복적으로 상대하기 때문이다 / 즉 우리의 배우자와 자녀, 우리의 친구와 동료, 우리의 고객과 의뢰인을", "nat": "하지만, 우리 대부분이 배우자와 자녀, 친구와 동료, 고객과 의뢰인처럼 같은 사람들을 반복적으로 상대하기 때문에, 그러한 거래는 점점 더 드물어지고 있다.", "ana": "<b>because ~</b>는 이유를 나타내는 <b>부사절</b>이고, 대시(—) 뒤는 the same people을 구체적으로 설명하는 <b>동격 삽입구</b>이다.", "pe": "\u0001However\u0002, such transactions<sup>1</sup> are becoming \u0001increasingly\u0002<sup>2</sup> rare, / \u0001because most of us deal with the same people repeatedly<sup>3</sup>\u0002 / — \u0001our spouses and children, our friends and colleagues<sup>4</sup>, our customers and clients\u0002.", "pk": "\u0001하지만\u0002, 그러한 거래는 \u0001점점 더\u0002 드물어지고 있다 r the organization and its customers or result in an improvement of some sort. / In all things, purpose drives success."}, {"en": false, "h": "소셜 미디어에서의 존재는 문제 해결이나 개선이라는 '목적'에 기반해야 하며 목적이 성공을 이끈다는 5·6번의 내용을 종합하면, 주장은 '기업은 소셜 미디어를 활용할 때 사업 목표를 토대로 해야 한다'는 것이다."}], "opts": [{"n": "①", "t": "기업 이미지에 부합하는 소셜 미디어를 직접 개발하여 운영해야 한다.", "a": false, "x": true, "trap": false, "e": "소셜 미디어를 직접 개발·운영해야 한다는 내용은 본문에 없다."}, {"n": "②", "t": "기업은 사회적 가치와 요구를 반영하여 사업 목표를 수립해야 한다.", "a": false, "x": true, "trap": true, "e": "사회적 가치나 요구를 반영하라는 내용은 본문에 없다."}, {"n": "③", "t": "기업은 소셜 미디어를 활용할 때 사업 목표를 토대로 해야 한다.", "a": true, "x": false, "trap": false, "e": "소셜 미디어 프로그램은 조직 자체의 목표와 목적에 대한 이해에서 시작되어야 하며 목적이 성공을 이끈다는 2·5·6번의 내용과 정확히 일치한다."}, {"n": "④", "t": "소셜 미디어로 제품을 홍보할 때는 구체적인 정보를 제공해야 한다.", "a": false, "x": true, "trap": false, "e": "제품 홍보나 정보 제공에 관한 언급은 본문에 없다."}, {"n": "⑤", "t": "소비자의 의견을 수렴하기 위해 소셜 미디어를 적극 활용해야 한다.", "a": false, "x": true, "trap": false, "e": "소비자 의견 수렴에 관한 언급은 본문에 없다."}], "w": [["organization", "조직, 기업"], ["objective", "목표"], ["thorough", "철저한"], ["fulfillment", "충족, 실현"], ["vague", "막연한, 모호한"], ["presence", "존재(감)"], ["purpose", "목적"], ["drive", "이끌다"], ["measurable", "측정 가능한"], ["insight", "통찰"]]}, {"q": "02", "type": "내용 불일치", "src": "2020년 9월 26번", "ans": "③", "tr": [["1", "Jessie Redmon Fauset는 1884년 뉴저지주 스노우 힐에서 태어났다."], ["2", "그녀는 코넬 대학교를 졸업한 최초의 흑인 여성이었다."], ["3", "소설, 시, 단편소설, 에세이를 쓴 것 외에도, Fauset는 워싱턴 D.C.의 공립학교에서 프랑스어를 가르쳤고 잡지 편집자로도 일했다."], ["4", "편집자로 일하는 동안, 그녀는 할렘 르네상스의 유명한 작가들을 많이 격려했다."], ["5", "그녀는 소설가로서보다 편집자로서 더 유명하지만, 많은 평론가들은 그녀의 소설 《Plum Bun》을 Fauset의 최고 걸작으로 여긴다."], ["6", "그 작품에서 그녀는 백인 행세를 할 수 있었지만 결국 자신의 인종적 정체성과 자긍심을 받아들이는 한 흑인 소녀의 이야기를 그린다."], ["7", "Fauset는 1961년 4월 30일 필라델피아에서 심장병으로 사망했다."]], "evh": "5번 문장", "ev": [{"en": true, "h": "Though she is more famous for being an editor than for being a fiction writer, many critics consider her novel Plum Bun Fauset's strongest work."}, {"en": false, "h": "본문은 그녀가 소설가보다 편집자로 더 유명하다고 했는데, ③번은 이 var EXP={"01": "<p class=\"mtr\">마더텅 정답률 <b>85%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">주장은 <b>not A but B</b>(A가 아니라 B)와 <b>must</b>(반드시 ~해야 한다) 문장에 있어요. 1번의 실수(도구에만 집중) 뒤에 반복되는 <b>objectives</b>(목표)·<b>purpose</b>(목적)를 잡으세요.</p><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 흔한 실수</span><div class=\"en\">they focus too much on social media tools and platforms and <mark>not enough on their business objectives</mark>.</div><p class=\"ko\">그들이 소셜 미디어 도구와 플랫폼에 너무 많이 중점을 두고 <mark>그들의 사업 목표에는 충분히 중점을 두지 않는다는 것</mark>이다.</p></div><div class=\"ck-via\"><i>▼</i><span>실수를 바로잡는 not A but B(A가 아니라 B) 문장이에요</span></div><div class=\"ck-step key\"><span class=\"lab\">2번 문장 · 결정적 단서</span><div class=\"en\">creating a social media program begins <mark>not with</mark> insight into the latest social media tools and channels <mark>but with</mark> a thorough understanding of the organization’s own goals and objectives.</div><p class=\"ko\">소셜 미디어 프로그램을 만드는 것은 최신식 소셜 미디어 도구와 채널에 대한 통찰력이 아니라 <mark>조직 고유의 목적과 목표에 대한 철저한 이해</mark>에서 시작한다.</p></div><div class=\"ck-via\"><i>▼</i><span>must(반드시 ~해야 한다)로 소셜 미디어가 ‘쓸모’를 가져야 한다고 말해요</span></div><div class=\"ck-step\"><span class=\"lab\">5번 문장 · must로 못 박기</span><div class=\"en\">a social media presence <mark>must</mark> either solve a problem for the organization and its customers or result in an improvement of some sort</div><p class=\"ko\">소셜 미디어에서의 존재는 <mark>반드시</mark> 조직과 조직의 소비자들을 위해 문제를 해결하거나 어떤 종류의 개선이라는 결과를 낳아야 한다</p></div><div class=\"ck-via\"><i>▼</i><span>앞 내용을 짧은 격언으로 정리해요</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 한 줄 결론</span><div class=\"en\">In all things, <mark>purpose drives success</mark>.</div><p class=\"ko\">어떤 일이든, <mark>목적이 성공을 이끈다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">기업은 소셜 미디어를 활용할 때 사업 목표를 토대로 해야 한다.<small>2번 goals and objectives(목적과 목표)와 6번 purpose(목적)를 그대로 옮긴 말이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">기업은 사회적 가치와 요구를 반영하여 사업 목표를 수립해야 한다.</span><span class=\"why\">[지문에 없음] ‘사업 목표’라는 말이 같아서 끌리지만, 지문은 목표를 ‘어떻게 세울지’가 아니라 이미 있는 목표에 맞춰 소셜 미디어를 쓰라고 해요. 사회적 가치 이야기는 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">기업 이미지에 부합하는 소셜 미디어를 직접 개발하여 운영해야 한다.</span><span class=\"why\">[지문에 없음] 소셜 미디어를 직접 만들라는 말은 없어요. 오히려 1번은 도구(tools 도구)에만 신경 쓰는 걸 실수라고 했어요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">소셜 미디어로 제품을 홍보할 때는 구체적인 정보를 제공해야 한다.</span><span class=\"why\">[지문에 없음] 제품 홍보나 정보의 구체성은 한 번도 안 나와요. 지문의 핵심어는 objectives(목표)와 purpose(목적)예요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">소비자의 의견을 수렴하기 위해 소셜 미디어를 적극 활용해야 한다.</span><span class=\"why\">[범위 좁음] 5번 customers(소비자들)가 나오지만, 소비자 문제 해결은 목적의 한 예일 뿐이에요. 의견 수렴이라는 말도 없어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">One of the most common mistakes</div><div class=\"k\">가장 흔한 실수 중 하나는</div></div><div class=\"rc\"><div class=\"e\">made by organizations</div><div class=\"k\">조직들이 범하는</div></div><div class=\"rc\"><div class=\"e\">when they first consider experimenting with social media</div><div class=\"k\">그들(= 조직들)이 소셜 미디어로 실험하는 것을 처음 고려할 때</div></div><div class=\"rc\"><div class=\"e\">is that they focus too much on social media tools and platforms</div><div class=\"k\">그들이 소셜 미디어 도구와 플랫폼에 너무 많이 중점을 두고</div></div><div class=\"rc\"><div class=\"e\">and not enough on their business objectives.</div><div class=\"k\">그들의 사업 목표에는 충분히 중점을 두지 않는다는 것이다.</div></div><div class=\"rnat\">조직들이 소셜 미디어로 실험하는 것을 처음 고려할 때 그들이 범하는 가장 흔한 실수 중 하나는 그들이 소셜 미디어 도구와 플랫폼에 너무 많이 중점을 두고, 그들의 사업 목표에는 충분히 중점을 두지 않는다는 것이다.</div><div class=\"rst\">우리 반이 학급 SNS(소셜 미디어)를 처음 만들 때, 어떤 앱이 멋진지만 고르고 왜 만드는지는 안 정했어요. = 지문 1번의 흔한 실수예요.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">2번 · 단서</span><div class=\"rc\"><div class=\"e\">The reality of success in the social web for businesses is that</div><div class=\"k\">사업을 위한 소셜 웹에서의 성공의 현실은 ~라는 것이다</div></div><div class=\"rc\"><div class=\"e\">creating a social media program begins</div><div class=\"k\">소셜 미디어 프로그램을 만드는 것이 시작한다는</div></div><div class=\"rc\"><div class=\"e\">not with insight into the latest social media tools and channels</div><div class=\"k\">최신식 소셜 미디어 도구와 채널에 대한 통찰력이 아니라</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">but with a thorough understanding of the organization’s own goals and objectives</span>.</div><div class=\"k\"><span class=\"cw\">조직 고유의 목적과 목표에 대한 철저한 이해와 더불어</span> (시작한다는).</div></div><div class=\"rnat\">사업을 위한 소셜 웹에서의 성공의 현실은 소셜 미디어 프로그램을 만드는 것이 최신식 소셜 미디어 도구와 채널에 대한 통찰력이 아니라 조직 고유의 목적과 목표에 대한 철저한 이해와 더불어 시작한다는 것이다.</div><div class=\"rst\">성공하려면 최신 앱 고르기가 아니라 <b>우리 반의 목표</b>를 먼저 정해야 해요. 지문 2번은 시작점이 목표(objectives 목표)라고 말해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">A social media program is not merely the fulfillment of a vague need</div><div class=\"k\">소셜 미디어 프로그램은 단지 막연한 필요의 충족이 아니다</div></div><div class=\"rc\"><div class=\"e\">to manage a “presence” on popular social networks</div><div class=\"k\">인기 있는 소셜 네트워크에서의 ‘존재’를 관리해야 할</div></div><div class=\"rc\"><div class=\"e\">because “everyone else is doing it.”</div><div class=\"k\">‘다른 모든 사람들도 그것을 하기’ 때문에.</div></div><div class=\"rnat\">소셜 미디어 프로그램은 단지 '다른 모든 사람들도 그것을 하기' 때문에 인기 있는 소셜 네트워크에서의 '존재'를 관리해야 할 막연한 필요의 충족이 아니다.</div><div class=\"rst\">“옆 반도 하니까 우리도 해야지”는 이유가 못 돼요. 지문 3번은 남들이 다 해서 만드는 건 소셜 미디어 프로그램이 아니라고 해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">“Being in social media” serves no purpose</div><div class=\"k\">‘소셜 미디어에 존재한다는 것’은 아무런 쓸모가 없다</div></div><div class=\"rc\"><div class=\"e\">in and of itself.</div><div class=\"k\">그 자체로는.</div></div><div class=\"rnat\">'소셜 미디어에 존재한다는 것'은 그 자체로는 아무런 쓸모가 없다.</div><div class=\"rst\">그냥 계정만 있다고 쓸모가 생기진 않아요. = 지문 4번, 소셜 미디어에 있다는 것 자체로는 아무 쓸모가 없다는 말이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">In order to serve any purpose at all,</div><div class=\"k\">조금이라도 어떤 쓸모가 있기 위해선,</div></div><div class=\"rc ckc\"><div class=\"e\">a social media presence <span class=\"cw\">must</span> either solve a problem for the organization and its customers</div><div class=\"k\">소셜 미디어에서의 존재는 <span class=\"cw\">반드시</span> 조직과 조직의 소비자들을 위해 문제를 해결하거나</div></div><div class=\"rc\"><div class=\"e\">or result in an improvement of some sort</div><div class=\"k\">어떤 종류의 개선이라는 결과를 낳아야 한다</div></div><div class=\"rc\"><div class=\"e\">(preferably a measurable one).</div><div class=\"k\">(될 수 있으면 측정 가능한 것을).</div></div><div class=\"rnat\">조금이라도 어떤 쓸모가 있기 위해선, 소셜 미디어에서의 존재는 반드시 조직과 조직의 소비자들을 위해 문제를 해결하거나 어떤 종류의 개선이라는 결과를 낳아야 한다(될 수 있으면 측정 가능한 것을).</div><div class=\"rst\">학급 소셜 미디어는 숙제 공지를 놓치는 문제를 풀거나 지각을 줄이는 등 <b>반드시</b>(must) 뭔가 나아지게 해야 해요. 지문 5번도 문제 해결이나 개선이 꼭 있어야 한대요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">In all things,</div><div class=\"k\">어떤 일이든,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">purpose drives success</span>.</div><div class=\"k\"><span class=\"cw\">목적이 성공을 이끈다</span>.</div></div><div class=\"rnat\">어떤 일이든, 목적이 성공을 이끈다.</div><div class=\"rst\">무슨 일이든 <b>목적이 있어야 잘 돼요</b>. 지문 6번의 purpose drives success(목적이 성공을 이끈다)가 바로 이 말이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">The world of social media is no different.</div><div class=\"k\">소셜 미디어 세계도 다르지 않다.</div></div><div class=\"rnat\">소셜 미디어 세계도 다르지 않다.</div><div class=\"rst\">학급 소셜 미디어도 마찬가지예요. 지문 7번은 소셜 미디어 세계도 다르지 않다며, 목표부터 세우라는 주장으로 끝맺어요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"objective\" data-m=\"목표\"><b>objective</b>목표</button><button type=\"button\" class=\"wdb\" data-w=\"thorough\" data-m=\"철저한\"><b>thorough</b>철저한</button><button type=\"button\" class=\"wdb\" data-w=\"fulfillment\" data-m=\"충족, 실현\"><b>fulfillment</b>충족, 실현</button><button type=\"button\" class=\"wdb\" data-w=\"vague\" data-m=\"막연한, 모호한\"><b>vague</b>막연한, 모호한</button><button type=\"button\" class=\"wdb\" data-w=\"presence\" data-m=\"존재(감)\"><b>presence</b>존재(감)</button><button type=\"button\" class=\"wdb\" data-w=\"measurable\" data-m=\"측정 가능한\"><b>measurable</b>측정 가능한</button></div>", "02": "<p class=\"mtr\">마더텅 정답률 <b>85%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">불일치 문제는 선택지를 <b>지문 순서대로</b> 하나씩 대조하세요. ③처럼 <b>비교급</b>(more A than B: B보다 A가 더)이 나오면 A와 B가 <b>뒤바뀌지 않았는지</b> 꼭 확인해요.</p><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>① ↔ 2번</em>first black woman to graduate(졸업한 최초의 흑인 여성) → 같음</span><span><em>② ↔ 3번</em>taught French in public schools(공립학교에서 프랑스어를 가르쳤다) → 같음</span><span><em>④ ↔ 6번</em>story of a black girl(한 흑인 소녀의 이야기) → 같음</span><span><em>⑤ ↔ 7번</em>died of heart disease(심장병으로 사망했다) in Philadelphia(필라델피아에서) → 같음</span></div><div class=\"ck-eq\">⇒ 네 개는 지문과 그대로 같아요. 남은 ③을 5번과 대조해요</div></div><div class=\"ck-via\"><i>▼</i><span>③의 ‘편집자보다는 소설가로서’를 5번의 비교급과 맞춰 봐요</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 문장 앞부분 · 결정적 단서</span><div class=\"en\">Though she is <mark>more famous for being an editor than for being a fiction writer</mark>,</div><p class=\"ko\">비록 그녀(= Fauset)가 <mark>소설가보다는 편집자로서 더 유명하긴 하지만</mark>,</p></div><div class=\"ck-via\"><i>▼</i><span>소설이 칭찬받는 말이 뒤따라서 ‘소설가로 더 유명하다’고 착각하기 쉬워요</span></div><div class=\"ck-step\"><span class=\"lab\">5번 문장 뒷부분 · 함정 문장</span><div class=\"en\">many critics consider her novel Plum Bun Fauset’s strongest work.</div><p class=\"ko\">많은 비평가들은 그녀의 소설 〈Plum Bun〉을 Fauset의 가장 강력한(뛰어난) 작품으로 여긴다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">편집자보다는 소설가로서 더 유명하다.<small>5번은 소설가보다 편집자(editor)로서 더 유명하다고 했어요. A와 B가 뒤바뀌었어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">흑인 소녀의 이야기를 다룬 소설을 썼다.</span><span class=\"why\">6번 could pass for white(백인으로 여겨질 수 있는)를 보고 백인 소녀 이야기로 헷갈리기 쉽지만, 주인공은 a black girl(한 흑인 소녀)이라 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">Cornell University를 졸업한 최초의 흑인 여성이었다.</span><span class=\"why\">2번 the first black woman(최초의 흑인 여성) to graduate from Cornell University(코넬 대학교를 졸업한)와 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">워싱턴(Washington, D.C.)의 공립학교에서 프랑스어를 가르쳤다.</span><span class=\"why\">3번 taught French in public schools(공립학교에서 프랑스어를 가르쳤다)와 같아요. 장소도 워싱턴 D.C.로 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">Philadelphia에서 심장병으로 사망했다.</span><span class=\"why\">7번 died of heart disease(심장병으로 사망했다) in Philadelphia(필라델피아에서)와 같아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Jessie Redmon Fauset was born</div><div class=\"k\">Jessie Redmon Fauset은 태어났다</div></div><div class=\"rc\"><div class=\"e\">in Snow Hill, New Jersey,</div><div class=\"k\">뉴저지의 Snow Hill에서</div></div><div class=\"rc\"><div class=\"e\">in 1884.</div><div class=\"k\">1884년에.</div></div><div class=\"rnat\">Jessie Redmon Fauset은 1884년에 뉴저지의 Snow Hill에서 태어났다.</div><div class=\"rst\">국어 시간에 작가 소개 카드를 만든다고 해 봐요. 첫 칸: 1884년 뉴저지의 스노힐에서 태어남. 지문 1번 그대로예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">She was the first black woman</div><div class=\"k\">그녀(= Fauset)는 최초의 흑인 여성이었다</div></div><div class=\"rc\"><div class=\"e\">to graduate from Cornell University.</div><div class=\"k\">Cornell University를 졸업한.</div></div><div class=\"rnat\">그녀는 Cornell University를 졸업한 최초의 흑인 여성이었다.</div><div class=\"rst\">둘째 칸: 코넬 대학교를 졸업한 <b>최초의 흑인 여성</b>. 지문 2번 = 선택지 ①이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">In addition to writing novels, poetry, short stories, and essays,</div><div class=\"k\">소설, 시, 단편 소설, 수필을 쓰는 것 외에도,</div></div><div class=\"rc\"><div class=\"e\">Fauset taught French in public schools in Washington, D.C.</div><div class=\"k\">Fauset은 Washington, D.C.의 공립학교에서 프랑스어를 가르쳤고,</div></div><div class=\"rc\"><div class=\"e\">and worked as a journal editor.</div><div class=\"k\">잡지 편집자로 일했다.</div></div><div class=\"rnat\">Fauset은 소설, 시, 단편 소설, 수필을 쓰는 것 외에도 Washington, D.C.의 공립학교에서 프랑스어를 가르쳤고, 잡지 편집자로 일했다.</div><div class=\"rst\">셋째 칸: 글도 쓰고, 공립학교에서 <b>프랑스어</b>를 가르치고, 잡지 편집자로도 일함. 지문 3번 = 선택지 ②예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">While working as an editor,</div><div class=\"k\">편집자로 일하는 동안,</div></div><div class=\"rc\"><div class=\"e\">she encouraged many well-known writers of the Harlem Renaissance.</div><div class=\"k\">그녀(= Fauset)는 할렘 르네상스의 많은 유명한 작가들을 고무시켰다.</div></div><div class=\"rnat\">편집자로 일하는 동안, 그녀는 할렘 르네상스의 많은 유명한 작가들을 고무시켰다.</div><div class=\"rst\">넷째 칸: 편집자로 일하며 할렘 르네상스의 유명 작가들을 응원해 줌. 지문 4번, 편집자 일이 중요했다는 힌트예요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">Though she is <span class=\"cw\">more famous for being an editor</span> <span class=\"cw\">than for being a fiction writer</span>,</div><div class=\"k\">비록 그녀(= Fauset)가 <span class=\"cw\">소설가보다는</span> <span class=\"cw\">편집자로서 더 유명하긴</span> 하지만,</div></div><div class=\"rc\"><div class=\"e\">many critics consider her novel Plum Bun Fauset’s strongest work.</div><div class=\"k\">많은 비평가들은 그녀의 소설 〈Plum Bun〉을 Fauset의 가장 강력한(뛰어난) 작품으로 여긴다.</div></div><div class=\"rnat\">비록 그녀가 소설가보다는 편집자로서 더 유명하긴 하지만, 많은 비평가들은 Fauset의 소설 〈Plum Bun(플럼번)〉을 그녀의 가장 강력한(뛰어난) 작품으로 여긴다.</div><div class=\"rst\">다섯째 칸이 핵심! <b>소설가보다 편집자로 더 유명</b>함. 그래도 소설 〈플럼번〉은 최고작으로 꼽힘. 그래서 지문 5번과 ③이 어긋나요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">In it, she tells the story of a black girl</div><div class=\"k\">그 (작품) 속에서, 그녀(= Fauset)는 한 흑인 소녀에 대한 이야기를 한다</div></div><div class=\"rc\"><div class=\"e\">who could pass for white</div><div class=\"k\">백인으로 여겨질 수 있지만</div></div><div class=\"rc\"><div class=\"e\">but ultimately claims her racial identity and pride.</div><div class=\"k\">궁극적으로는 자신의 인종적 정체성과 자부심을 주장하는.</div></div><div class=\"rnat\">그 (작품) 속에서, 그녀는 백인으로 여겨질 수 있지만 궁극적으로는 자신의 인종적 정체성과 자부심을 주장하는 한 흑인 소녀에 대한 이야기를 한다.</div><div class=\"rst\">여섯째 칸: 그 소설은 백인처럼 보일 수 있지만 결국 자기 인종에 자부심을 갖는 <b>흑인 소녀</b> 이야기. 지문 6번 = ④예요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Fauset died of heart disease</div><div class=\"k\">Fauset은 심장병으로 사망했다</div></div><div class=\"rc\"><div class=\"e\">April 30, 1961,</div><div class=\"k\">1961년 4월 30일에</div></div><div class=\"rc\"><div class=\"e\">in Philadelphia.</div><div class=\"k\">Philadelphia에서.</div></div><div class=\"rnat\">Fauset은 1961년 4월 30일에 Philadelphia에서 심장병으로 사망했다.</div><div class=\"rst\">마지막 칸: 1961년 4월 30일 필라델피아에서 <b>심장병</b>으로 세상을 떠남. 지문 7번 = 선택지 ⑤예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"graduate\" data-m=\"졸업하다\"><b>graduate</b>졸업하다</button><button type=\"button\" class=\"wdb\" data-w=\"editor\" data-m=\"편집자\"><b>editor</b>편집자</button><button type=\"button\" class=\"wdb\" data-w=\"fiction writer\" data-m=\"소설가\"><b>fiction writer</b>소설가</button><button type=\"button\" class=\"wdb\" data-w=\"critic\" data-m=\"평론가, 비평가\"><b>critic</b>평론가, 비평가</button><button type=\"button\" class=\"wdb\" data-w=\"pass for\" data-m=\"~로 여겨지다, 통하다\"><b>pass for</b>~로 여겨지다, 통하다</button><button type=\"button\" class=\"wdb\" data-w=\"racial identity\" data-m=\"인종적 정체성\"><b>racial identity</b>인종적 정체성</button></div>", "03": "<p class=\"mtr\">마더텅 정답률 <b>80%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">이번엔 <b>일치</b>하는 것을 고르는 문제예요. 선택지 순서 = 안내문 순서이니 위에서부터 대조하며 <b>숫자·요일·물건 이름</b>이 하나라도 다르면 지워 나가세요.</p><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>① ↔ 3번</em>16 and older(16세 이상) → 제한 있음, 불일치</span><span><em>② ↔ 6번</em>1:00 p.m. – 5:00 p.m.(오후 1시~5시) = 4시간 → 불일치</span><span><em>④ ↔ 10번</em>at least(적어도) 10 days(10일) 전 → 불일치</span><span><em>⑤ ↔ 11번</em>side table(보조 탁자) → 의자 아님, 불일치</span></div><div class=\"ck-eq\">⇒ 네 개는 숫자나 물건 이름이 달라요. 남은 ③을 9번과 대조해요</div></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step key\"><span class=\"lab\">9번 문장 · 결정적 단서</span><div class=\"en\">– Previous woodworking experience is <mark>not necessary</mark>.</div><p class=\"ko\">– 이전의 목공 경험은 <mark>필요하지 않습니다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>처음 시작하는 사람을 위한 기초 수업이라는 말이라 ③과 이어져요</span></div><div class=\"ck-step\"><span class=\"lab\">2번 문장 · 같은 뜻 한 번 더</span><div class=\"en\">students will build a solid foundation for their <mark>new venture</mark> into woodworking.</div><p class=\"ko\">수강생들은 목공으로의 <mark>새로운 모험</mark>을 위한 탄탄한 기초를 다지게 될 것입니다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">목공 경험이 없는 사람도 참여할 수 있다.<small>9번 not necessary(필요하지 않다) = 경험 없어도 된다는 말이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">적어도 일주일 전에 취소하면 전액을 환불해 준다.</span><span class=\"why\">10번 full refunds(전액 환불)까지는 같지만, 기준이 at least(적어도) 10 days(10일) 전이에요. 일주일(7일)이 아니에요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">연령에 제한이 없다.</span><span class=\"why\">3번 Age Requirement(연령 제한)가 16 and older(16세 이상)라서 제한이 있어요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">토요일에 5시간씩 진행된다.</span><span class=\"why\">5번 Every Saturday(매주 토요일)는 맞지만, 6번 시간이 오후 1시~5시라 4시간이에요. 숫자 5에 속으면 안 돼요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">수강생들은 수작업으로 만든 의자를 가지고 가게 된다.</span><span class=\"why\">11번 hand-crafted(수작업으로 만든)는 같지만, 가져가는 건 side table(보조 탁자)이에요. 의자가 아니에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Introduction to Furniture Making</div><div class=\"k\">가구 제작 입문</div></div><div class=\"rnat\">가구 제작 입문</div><div class=\"rst\">방학에 뭘 배울까 찾다가 문화센터 게시판에서 포스터를 봤어요. = 지문 1번 제목, 가구 만들기 입문 수업이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Throughout this four-week workshop,</div><div class=\"k\">이번 4주간의 워크숍 동안,</div></div><div class=\"rc\"><div class=\"e\">students will build a solid foundation</div><div class=\"k\">수강생들은 탄탄한 기초를 다지게 될 것입니다</div></div><div class=\"rc\"><div class=\"e\">for their new venture into woodworking.</div><div class=\"k\">목공으로의 새로운 모험을 위한.</div></div><div class=\"rnat\">이번 4주간의 워크숍 동안, 수강생들은 목공으로의 새로운 모험을 위한 탄탄한 기초를 다지게 될 것입니다.</div><div class=\"rst\">4주 동안 나무로 뭔가 만드는 <b>새로운 도전</b>의 기초를 쌓는대요. 지문 2번, 처음 하는 사람용이라는 느낌이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Age Requirement: 16 and older</div><div class=\"k\">연령 제한: 16세 이상</div></div><div class=\"rnat\">연령 제한: 16세 이상</div><div class=\"rst\">그런데 중1인 나는 아직 못 가요. 지문 3번 연령 제한이 <b>16세 이상</b>이거든요. → ① 불일치</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Location: Hoboken Community Center</div><div class=\"k\">장소: Hoboken 지역 문화 회관</div></div><div class=\"rnat\">장소: Hoboken 지역 문화 회관</div><div class=\"rst\">장소는 호보컨 지역 문화 회관이에요. = 지문 4번, 수업이 열리는 곳이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Dates: Dec 7 – Dec 28 (Every Saturday)</div><div class=\"k\">일정: 12월 7일 – 12월 28일 (매주 토요일)</div></div><div class=\"rnat\">일정: 12월 7일 – 12월 28일 (매주 토요일)</div><div class=\"rst\">12월 7일부터 28일까지 <b>매주 토요일</b>이에요. = 지문 5번, ②의 ‘토요일’은 여기와 같아요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Time: 1:00 p.m. – 5:00 p.m.</div><div class=\"k\">시간: 오후 1시 – 오후 5시</div></div><div class=\"rnat\">시간: 오후 1시 – 오후 5시</div><div class=\"rst\">시간은 오후 1시부터 5시, 딱 <b>4시간</b>이에요. 지문 6번이라 ②의 ‘5시간’은 틀려요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Price: $399</div><div class=\"k\">가격: 399달러</div></div><div class=\"rnat\">가격: 399달러</div><div class=\"rst\">가격은 399달러, 꽤 비싸요. = 지문 7번, 등록 전에 용돈을 계산해 봐야겠어요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">Note:</div><div class=\"k\">주의:</div></div><div class=\"rnat\">주의:</div><div class=\"rst\">포스터 아래 ‘주의’ 칸이 보여요. 지문 8번은 꼭 읽어야 할 안내가 시작된다는 작은 제목이에요.</div></div><div class=\"rds key\" data-ord=\"9\"><span class=\"rn\">9번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">– Previous woodworking experience is <span class=\"cw\">not necessary</span>.</div><div class=\"k\">– 이전의 목공 경험은 <span class=\"cw\">필요하지 않습니다</span>.</div></div><div class=\"rnat\">이전의 목공 경험은 필요하지 않습니다.</div><div class=\"rst\">망치질 한 번 안 해 봤어도 괜찮대요! 지문 9번, 목공 경험은 <b>필요하지 않다</b>(not necessary)예요. → ③ 일치</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">– We offer full refunds</div><div class=\"k\">– 전액을 환불해 드립니다</div></div><div class=\"rc ckc\"><div class=\"e\">if you cancel <span class=\"cw\">at least 10 days</span> in advance.</div><div class=\"k\"><span class=\"cw\">적어도 10일 전에</span> 미리 취소하신다면.</div></div><div class=\"rnat\">적어도 10일 전에 미리 취소하신다면 전액을 환불해 드립니다.</div><div class=\"rst\">못 가게 되면 <b>10일 전</b>까지 취소해야 돈을 다 돌려받아요. 지문 10번이라 ④의 ‘일주일’은 틀려요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">With the guidance of an instructor,</div><div class=\"k\">강사의 지도로,</div></div><div class=\"rc\"><div class=\"e\">each student will leave</div><div class=\"k\">각 수강생은 떠나게 될 것입니다</div></div><div class=\"rc ckc\"><div class=\"e\">with a hand-crafted <span class=\"cw\">side table</span>.</div><div class=\"k\">수작업으로 만든 <span class=\"cw\">보조 탁자</span>를 가지고.</div></div><div class=\"rnat\">강사의 지도로, 각 수강생은 수작업으로 만든 보조 탁자를 가지고 (워크숍을) 떠나게 될 것입니다.</div><div class=\"rst\">선생님 도움으로 직접 만든 <b>보조 탁자</b>를 들고 집에 가요. 지문 11번이라 ⑤의 ‘의자’는 틀려요.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><div class=\"rc\"><div class=\"e\">For more information or to register,</div><div class=\"k\">더 많은 정보를 위해서 혹은 등록하기 위해서는,</div></div><div class=\"rc\"><div class=\"e\">contact Dave Malka (davemalka@woodfurniture.org).</div><div class=\"k\">Dave Malka(davemalka@woodfurniture.org)에게 연락하세요.</div></div><div class=\"rnat\">더 많은 정보(가 필요하시거나) 혹은 (워크숍에) 등록하기 위해서는, Dave Malka에게 연락하세요(davemalka@woodfurniture.org).</div><div class=\"rst\">궁금하면 Dave Malka(데이브 말카)님께 이메일을 보내 등록해요. = 지문 12번, 문의와 등록 방법이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"solid foundation\" data-m=\"탄탄한 기초\"><b>solid foundation</b>탄탄한 기초</button><button type=\"button\" class=\"wdb\" data-w=\"venture\" data-m=\"새로운 도전, 모험\"><b>venture</b>새로운 도전, 모험</button><button type=\"button\" class=\"wdb\" data-w=\"woodworking\" data-m=\"목공\"><b>woodworking</b>목공</button><button type=\"button\" class=\"wdb\" data-w=\"age requirement\" data-m=\"연령 제한\"><b>age requirement</b>연령 제한</button><button type=\"button\" class=\"wdb\" data-w=\"in advance\" data-m=\"미리, 사전에\"><b>in advance</b>미리, 사전에</button><button type=\"button\" class=\"wdb\" data-w=\"hand-crafted\" data-m=\"수작업으로 만든\"><b>hand-crafted</b>수작업으로 만든</button></div>", "04": "<p class=\"mtr\">마더텅 정답률 <b>65%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">주제는 결론 신호 <b>Thus</b>(따라서) 문장에 모여 있어요. 처음부터 반복되는 <b>relationships</b>(관계)·<b>social bonds</b>(사회적 유대)가 마지막에 <b>survival</b>(생존)과 만나는 곳을 잡으세요.</p><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 화제 소개</span><div class=\"en\">Human beings are driven by a natural desire to form and maintain <mark>interpersonal relationships</mark>.</div><p class=\"ko\">인간은 <mark>대인 관계를</mark> 형성하고 유지하려는 타고난 욕구에 의해 움직인다.</p></div><div class=\"ck-via\"><i>▼</i><span>왜 그런 욕구가 생겼는지, 사회적 종으로 살아온 역사로 설명해요</span></div><div class=\"ck-step\"><span class=\"lab\">3~4번 문장 · 이유: 진화와 협력</span><div class=\"en\">Human beings have long depended on the cooperation of others for the supply of food, protection from predators …</div><p class=\"ko\">인간은 식량 공급, 포식자로부터의 보호 … 를 위해 다른 사람들과의 협력에 오랫동안 의지해왔다.</p></div><div class=\"ck-via\"><i>▼</i><span>반대 상황을 가정해서 유대의 중요성을 보여 줘요</span></div><div class=\"ck-step\"><span class=\"lab\">5번 문장 · 유대가 없었다면</span><div class=\"en\">Without the formation and maintenance of <mark>social bonds</mark>, early human beings probably would not have been able to cope with or adapt to their physical environments.</div><p class=\"ko\"><mark>사회적 유대</mark>의 형성과 유지가 없었다면, 초기의 인간들은 아마도 그들의 물리적 환경에 대처하거나 적응할 수 없었을 것이다.</p></div><div class=\"ck-via\"><i>▼</i><span>Thus(따라서)로 관계 + 생존을 한 문장에 묶어요</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 결정적 단서</span><div class=\"en\"><mark>Thus</mark>, seeking closeness and meaningful relationships has long been <mark>vital for human survival</mark>.</div><p class=\"ko\"><mark>따라서</mark>, 친밀함과 의미 있는 관계를 추구하는 것은 오랫동안 <mark>인간의 생존에 필수적이었다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">need to build social bonds for human survival 인간 생존을 위해 사회적 유대를 형성할 필요성<small>5번 social bonds(사회적 유대) + 6번 vital for human survival(인간의 생존에 필수적인)을 합친 말이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">emotion as an essential factor in evolution 진화의 필수 요소로서의 감정</span><span class=\"why\">[범위 좁음] 2번에 emotions(감정)가 나오고 3번에 evolutionary(진화의)도 나와서 끌려요. 하지만 감정은 관계 욕구가 영향을 주는 것 중 하나일 뿐, 글의 중심은 관계예요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">difficulties in cooperating with other people 다른 사람들과 협력하는 것의 어려움</span><span class=\"why\">[반대] 4번은 협력에 오랫동안 의지해 왔다고 해요. 협력이 어렵다는 게 아니라 협력 덕분에 살아남았다는 말이에요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">ways to keep close relationships with others 다른 사람들과 친밀한 관계를 유지하는 방법</span><span class=\"why\">[지문에 없음] 관계는 맞지만 ‘방법’은 하나도 안 나와요. 지문은 관계가 왜 필요한지(생존)를 말해요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">impact of human evolution on the environment 인간의 진화가 환경에 미친 영향</span><span class=\"why\">[반대] 5번은 인간이 환경에 적응한(adapt to ~에 적응하다) 이야기예요. 인간이 환경을 바꾼 영향은 없어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Human beings are driven by a natural desire</div><div class=\"k\">인간은 타고난 욕구에 의해 움직인다</div></div><div class=\"rc\"><div class=\"e\">to form and maintain interpersonal relationships.</div><div class=\"k\">대인 관계를 형성하고 유지하려는.</div></div><div class=\"rnat\">인간은 대인 관계를 형성하고 유지하려는 타고난 욕구에 의해 움직인다.</div><div class=\"rst\">새 학기 첫날, 누구나 짝꿍이랑 친해지고 싶어 해요. = 지문 1번, 사람은 <b>관계</b>(relationships)를 맺고 이어 가려는 욕구가 타고났다는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">From this perspective,</div><div class=\"k\">이러한 관점에서,</div></div><div class=\"rc\"><div class=\"e\">people seek relationships with others</div><div class=\"k\">사람들은 다른 사람들과의 관계를 추구하고</div></div><div class=\"rc\"><div class=\"e\">to fill a fundamental need,</div><div class=\"k\">근본적인 욕구를 채우기 위해서,</div></div><div class=\"rc\"><div class=\"e\">and this need underlies many emotions, actions, and decisions throughout life.</div><div class=\"k\">이 욕구는 평생 동안 많은 감정, 행동, 그리고 결정들의 기초가 된다.</div></div><div class=\"rnat\">이러한 관점에서, 사람들은 근본적인 욕구를 채우기 위해서 다른 사람들과의 관계를 추구하고, 이 욕구는 평생 동안 많은 감정, 행동, 그리고 결정들의 기초가 된다.</div><div class=\"rst\">친구가 생기면 기분도, 행동도, 선택도 달라져요. 지문 2번은 이 욕구가 평생 감정·행동·결정의 바탕이 된다고 해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Probably, the need to belong</div><div class=\"k\">아마도 소속 욕구(속하려는 욕구)는</div></div><div class=\"rc\"><div class=\"e\">is a product of human beings’ evolutionary history</div><div class=\"k\">인간 진화 역사의 산물이다</div></div><div class=\"rc\"><div class=\"e\">as a social species.</div><div class=\"k\">사회적 종으로서의.</div></div><div class=\"rnat\">아마도 그 소속 욕구(속하려는 욕구)는 사회적 종으로서의 인간 진화 역사의 산물이다.</div><div class=\"rst\">어딘가 반에 <b>소속되고 싶은</b> 마음은 아주 옛날부터 이어져 왔어요. 지문 3번은 이게 사회적 종으로 진화해 온 결과래요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Human beings have long depended on the cooperation of others</div><div class=\"k\">인간은 다른 사람들과의 협력에 오랫동안 의지해왔다</div></div><div class=\"rc\"><div class=\"e\">for the supply of food, protection from predators, and the acquisition of essential knowledge.</div><div class=\"k\">식량 공급, 포식자로부터의 보호, 그리고 필수적인 지식의 습득을 위해.</div></div><div class=\"rnat\">인간은 식량 공급, 포식자로부터의 보호, 그리고 필수적인 지식의 습득을 위해 다른 사람들과의 협력에 오랫동안 의지해왔다.</div><div class=\"rst\">옛날 사람들은 혼자서는 사냥도, 맹수 막기도, 배우기도 못했어요. 지문 4번처럼 먹을 것·보호·지식을 서로 <b>협력</b>해서 얻었어요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc ckc\"><div class=\"e\">Without the formation and maintenance of <span class=\"cw\">social bonds</span>,</div><div class=\"k\"><span class=\"cw\">사회적 유대의</span> 형성과 유지가 없었다면,</div></div><div class=\"rc\"><div class=\"e\">early human beings probably would not have been able to cope with or adapt to</div><div class=\"k\">초기의 인간들은 아마도 대처하거나 적응할 수 없었을 것이다</div></div><div class=\"rc\"><div class=\"e\">their physical environments.</div><div class=\"k\">그들의 물리적 환경에.</div></div><div class=\"rnat\">사회적 유대의 형성과 유지가 없었다면, 초기의 인간들은 아마도 그들의 물리적 환경에 대처하거나 적응할 수 없었을 것이다.</div><div class=\"rst\">만약 친구 하나 없이 혼자 캠핑을 간다면 버티기 힘들겠죠? 지문 5번도 <b>사회적 유대</b>가 없었다면 환경에 적응 못 했을 거래요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Thus</span>,</div><div class=\"k\"><span class=\"cw\">따라서</span>,</div></div><div class=\"rc\"><div class=\"e\">seeking closeness and meaningful relationships</div><div class=\"k\">친밀함과 의미 있는 관계를 추구하는 것은</div></div><div class=\"rc ckc\"><div class=\"e\">has long been <span class=\"cw\">vital for human survival</span>.</div><div class=\"k\">오랫동안 <span class=\"cw\">인간의 생존에 필수적이었다</span>.</div></div><div class=\"rnat\">따라서, 친밀함과 의미 있는 관계를 추구하는 것은 오랫동안 인간의 생존에 필수적이었다.</div><div class=\"rst\"><b>따라서</b>(Thus) 친하고 의미 있는 관계를 찾는 건 사람이 <b>살아남는 데 꼭 필요</b>했어요. 지문 6번이 바로 글의 주제예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"interpersonal relationships\" data-m=\"대인 관계\"><b>interpersonal relationships</b>대인 관계</button><button type=\"button\" class=\"wdb\" data-w=\"fundamental\" data-m=\"근본적인\"><b>fundamental</b>근본적인</button><button type=\"button\" class=\"wdb\" data-w=\"underlie\" data-m=\"~의 바탕이 되다\"><b>underlie</b>~의 바탕이 되다</button><button type=\"button\" class=\"wdb\" data-w=\"predator\" data-m=\"포식자\"><b>predator</b>포식자</button><button type=\"button\" class=\"wdb\" data-w=\"social bonds\" data-m=\"사회적 유대\"><b>social bonds</b>사회적 유대</button><button type=\"button\" class=\"wdb\" data-w=\"vital\" data-m=\"필수적인\"><b>vital</b>필수적인</button></div>", "05": "<p class=\"mtr\">마더텅 정답률 <b>60%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">밑줄 동사가 나오면 <b>진짜 주어를 찾아 수 일치</b>부터 보세요. 주어 뒤에 붙은 <b>수식어구</b>(between A and B 사이의)는 괄호로 묶고, 그 앞 명사가 단수인지 복수인지 확인해요.</p><div class=\"ck-step\"><span class=\"lab\">문제지 ⑤번 자리 (6번)</span><div class=\"en\">… and less noticeably, the skin between the eyebrow and upper eyelid <u>⑤ are</u> lowered slightly with true enjoyment.</div><p class=\"ko\">눈썹과 윗눈꺼풀 사이 피부가 진정한 즐거움으로 약간 ( ? ) 처진다 — 동사 자리</p></div><div class=\"ck-via\"><i>▼</i><span>and(그리고) 뒤에 새 절이 시작돼요. 동사 앞 명사 중 주인공은 맨 앞 the skin(피부)이에요</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 진짜 주어 찾기</span><div class=\"en\"><mark>the skin</mark> between the eyebrow and upper eyelid</div><p class=\"ko\"><mark>눈썹과 윗눈꺼풀 사이 피부</mark></p></div><div class=\"ck-via\"><i>▼</i><span>between the eyebrow and upper eyelid(눈썹과 윗눈꺼풀 사이의)는 꾸밈말이라 빼면 the skin(피부) + 동사만 남아요 → 단수 is(~이다)</span></div><div class=\"ck-step\"><span class=\"lab\">수식어구 괄호 치기</span><div class=\"en\">the skin … <mark>is lowered</mark> slightly with true enjoyment.</div><p class=\"ko\">피부가 진정한 즐거움으로 약간 <mark>처진다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">주어와 동사의 수 일치 (수식어구가 끼어 있을 때)</p><p class=\"gr\">동사는 바로 앞 명사가 아니라 진짜 주어에 맞춰요. 주어 뒤의 전치사구 between(~ 사이의)·of(~의)는 괄호로 묶고 빼서 생각해요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>The box of apples is heavy.</div><div class=\"ko\">사과 상자는 무겁다. (진짜 주어 box 상자가 단수라 is가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>The box of apples are heavy.</div><div class=\"ko\">바로 앞 apples(사과들)에 맞춰 are를 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>The desk between the two windows is new.</div><div class=\"ko\">두 창문 사이에 있는 책상은 새것이다. (between ~ 사이의 부분을 빼면 desk 책상 + is라 맞아요)</div></div><p class=\"gb\">지문 6번도 between the eyebrow and upper eyelid(눈썹과 윗눈꺼풀 사이의)를 빼면 the skin(피부)만 남아요. 단수 주어라서 are(~이다)가 아니라 is(~이다)예요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">are → is (~이다, 단수 동사)<small>주어가 단수 the skin(피부)이니 복수 동사 are(~이다)가 아니라 단수 동사 is(~이다)예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">in which ~하는 (경우)</span><span class=\"why\">1번은 occasions(경우들) 뒤에서 in which(그 경우에)가 이끄는 절이 와요. 뒤 절 you have observed a smile(당신이 미소를 관찰했다)이 주어·동사·목적어를 다 갖춘 완전한 절이라 전치사 + 관계대명사 in which(그 경우에)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">전치사 + 관계대명사(in which) + 완전한 절</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>This is the room in which I sleep.</div><div class=\"ko\">이것이 내가 자는 방이다. (I sleep 내가 잔다가 완전한 절이라 in which가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>This is the room which I sleep.</div><div class=\"ko\">sleep(자다)은 목적어가 필요 없어서 빈자리가 없는데 which만 써서 틀려요. in(~에서)이 빠졌어요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>This is the room which I cleaned.</div><div class=\"ko\">이것이 내가 청소한 방이다. (cleaned 청소했다 뒤 목적어가 비어서 which만 써도 맞아요)</div></div><p class=\"gb\">지문 1번도 you have observed a smile(당신이 미소를 관찰했다)에 빈자리가 없어서 in which(그 경우에)가 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">one 것 (= smile 미소)</span><span class=\"why\">2번 a genuine smile from an insincere one(진짜 미소를 진실하지 못한 것과)에서 one(것)은 앞에 나온 smile(미소)을 받아요. smile(미소)은 셀 수 있는 단수 명사이고 an(하나의)이 앞에 있으니 one(것)이 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">같은 종류의 셀 수 있는 명사 하나를 대신하는 one(것)</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I lost my pen, so I bought a new one.</div><div class=\"ko\">나는 펜을 잃어버려서 새것을 샀다. (펜 하나와 같은 종류의 다른 것 = one이라 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I lost my pen, so I bought a new it.</div><div class=\"ko\">it(그것)은 잃어버린 바로 그 펜이에요. 새로 산 다른 펜을 가리킬 수 없고 a new 뒤에도 못 와서 틀려요.</div></div><p class=\"gb\">지문 2번도 진짜 미소와 다른 ‘가짜 미소 하나’라서 an insincere one(진실하지 못한 것)이 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">using 사용하여</span><span class=\"why\">4번은 명령문 Take(잡아라) … and manufacture a smile(미소를 지어 보라) 뒤에 붙은 꾸밈 부분이에요. 미소를 짓는 사람(you 당신)이 얼굴 아랫부분을 직접 ‘사용하는’ 것이라 능동 -ing(~하는) 형태인 using(사용하여)이 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">분사구문: 주어가 직접 하면 -ing(능동), 당하면 p.p.(수동)</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>Draw a cat using a pencil.</div><div class=\"ko\">연필을 사용하여 고양이를 그려라. (그리는 사람이 연필을 직접 쓰니 using이 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>Draw a cat used a pencil.</div><div class=\"ko\">그리는 사람이 연필을 ‘쓰는’ 쪽인데 수동 used(사용된)를 써서 틀려요.</div></div><p class=\"gb\">지문 4번도 미소 짓는 당신이 얼굴 아랫부분을 직접 쓰니 using(사용하여)이 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">how 얼마나</span><span class=\"why\">5번 judge(판단해 보라)의 목적어 자리에 how happy your face really looks(당신의 얼굴이 실제로 얼마나 행복해 보이는지)가 와요. how(얼마나) + 형용사 happy(행복한) + 주어 + 동사 순서의 간접의문문이라 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">간접의문문: how(얼마나) + 형용사 + 주어 + 동사</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>Tell me how tall you are.</div><div class=\"ko\">네가 키가 얼마나 큰지 말해 줘. (how + tall 키가 큰 + you are 순서라서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>Tell me how tall are you.</div><div class=\"ko\">문장 속에 들어간 의문문인데 are you(너는 ~이니)처럼 동사를 앞에 써서 틀려요.</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>Tell me what tall you are.</div><div class=\"ko\">‘얼마나’ 큰지를 물을 때 what(무엇)을 써서 틀려요.</div></div><p class=\"gb\">지문 5번도 how happy(얼마나 행복한) 뒤에 your face really looks(당신의 얼굴이 실제로 ~해 보인다)가 순서대로 와서 맞아요.</p></div></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">There have been occasions</div><div class=\"k\">경우가 있었다</div></div><div class=\"rc\"><div class=\"e\">in which you have observed a smile</div><div class=\"k\">당신이 미소를 관찰한 (경우)</div></div><div class=\"rc\"><div class=\"e\">and you could sense it was not genuine.</div><div class=\"k\">그리고 그것(= 미소)이 진짜가 아니라고 느낄 수 있었던.</div></div><div class=\"rnat\">당신이 미소를 관찰하고 그것이 진짜가 아니라고 느낄 수 있는 경우가 있었다.</div><div class=\"rst\">웃고 있는데 “어? 진짜 웃는 게 아닌데” 하고 느낀 적이 있죠. 지문은 그런 경우(occasions in which ~하는 경우)부터 꺼내요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">The most obvious way of identifying</div><div class=\"k\">가장 명확한 방법은 구별하는</div></div><div class=\"rc\"><div class=\"e\">a genuine smile from an insincere one</div><div class=\"k\">진짜 미소를 진실하지 못한 미소(one = smile)와</div></div><div class=\"rc\"><div class=\"e\">is that a fake smile primarily only affects the lower half of the face,</div><div class=\"k\">가짜 미소가 주로 얼굴의 아랫부분에만 영향을 미친다는 것이다,</div></div><div class=\"rc\"><div class=\"e\">mainly with the mouth alone.</div><div class=\"k\">주로 입에만.</div></div><div class=\"rnat\">진짜 미소를 진실하지 못한 미소와 구별하는 가장 명확한 방법은 가짜 미소가 주로 얼굴의 아랫부분, 주로 입에만 영향을 미친다는 것이다.</div><div class=\"rst\">가짜 미소는 얼굴 아랫부분, 주로 입만 움직여요. 지문 2번은 이게 진짜 미소와 가짜 미소(one 것 = 미소)를 가르는 가장 쉬운 방법이래요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">The eyes don’t really get involved.</div><div class=\"k\">눈은 별로 관련이 없다.</div></div><div class=\"rnat\">눈은 별로 관련이 없다.</div><div class=\"rst\">가짜 미소엔 눈이 거의 안 움직여요. 지문 3번, 눈은 별로 관련이 없다는 말이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Take the opportunity to look in the mirror</div><div class=\"k\">거울을 볼 기회를 잡고</div></div><div class=\"rc\"><div class=\"e\">and manufacture a smile</div><div class=\"k\">미소를 지어보라</div></div><div class=\"rc\"><div class=\"e\">using the lower half your face only.</div><div class=\"k\">당신의 얼굴 아랫부분만을 사용하여.</div></div><div class=\"rnat\">거울을 볼 기회를 잡고 당신의 얼굴 아랫부분만을 사용하여 미소를 지어보라.</div><div class=\"rst\">거울 앞에서 입으로만 억지로 웃어 보세요. 지문 4번, 얼굴 아랫부분만 <b>사용하여</b>(using) 웃는 실험이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">When you do this,</div><div class=\"k\">당신이 이렇게 할 때,</div></div><div class=\"rc\"><div class=\"e\">judge how happy your face really looks</div><div class=\"k\">당신의 얼굴이 실제로 얼마나 행복해 보이는지를 판단해 보라</div></div><div class=\"rc\"><div class=\"e\">— is it genuine?</div><div class=\"k\">그것은 진짜인가?</div></div><div class=\"rnat\">당신이 이렇게 할 때, 당신의 얼굴이 실제로 얼마나 행복해 보이는지를 판단해 보라. 그것은 진짜인가?</div><div class=\"rst\">그 얼굴이 <b>얼마나</b>(how) 행복해 보이는지 판단해 보래요. 지문 5번, 진짜 같은지 스스로 확인하는 거예요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">A genuine smile will impact on the muscles and wrinkles around the eyes</div><div class=\"k\">진짜 미소는 눈 주변의 근육과 주름에 영향을 주고</div></div><div class=\"rc\"><div class=\"e\">and less noticeably,</div><div class=\"k\">티가 좀 덜 나게는,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">the skin</span> between the eyebrow and upper eyelid <span class=\"cw\">is lowered</span> slightly with true enjoyment.</div><div class=\"k\"><span class=\"cw\">눈썹과 윗눈꺼풀 사이 피부</span>가 진정한 즐거움으로 약간 <span class=\"cw\">처진다</span>. ※ 문제지엔 are로 되어 있음</div></div><div class=\"rnat\">진짜 미소는 눈 주변의 근육과 주름에 영향을 주고, 티가 좀 덜 나게는, 눈썹과 윗눈꺼풀 사이 피부가 진정한 즐거움으로 약간 처진다.</div><div class=\"rst\">진짜 미소는 눈가 근육과 주름까지 움직이고, <b>눈썹과 눈꺼풀 사이 피부</b>(the skin 피부)가 살짝 내려가요. 지문 6번은 주어가 단수라 is(~이다)예요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">The genuine smile can impact on the entire face.</div><div class=\"k\">진정한 미소는 전체 얼굴에 영향을 줄 수 있다.</div></div><div class=\"rnat\">진정한 미소는 전체 얼굴에 영향을 줄 수 있다.</div><div class=\"rst\">결국 진짜 미소는 입만이 아니라 얼굴 전체를 움직여요. 지문 7번은 이 말로 끝맺어요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"occasion\" data-m=\"경우\"><b>occasion</b>경우</button><button type=\"button\" class=\"wdb\" data-w=\"genuine\" data-m=\"진짜의\"><b>genuine</b>진짜의</button><button type=\"button\" class=\"wdb\" data-w=\"insincere\" data-m=\"진실하지 못한\"><b>insincere</b>진실하지 못한</button><button type=\"button\" class=\"wdb\" data-w=\"manufacture\" data-m=\"(억지로) 만들어 내다\"><b>manufacture</b>(억지로) 만들어 내다</button><button type=\"button\" class=\"wdb\" data-w=\"wrinkles\" data-m=\"주름들 (단수 wrinkle)\"><b>wrinkles</b>주름들 (단수 wrinkle)</button><button type=\"button\" class=\"wdb\" data-w=\"eyelid\" data-m=\"눈꺼풀\"><b>eyelid</b>눈꺼풀</button></div>", "06": "<p class=\"mtr\">마더텅 정답률 <b>85%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">요지는 <b>However</b>(그러나) 뒤 상황 변화와 <b>it’s essential</b>(~하는 것은 중요하다) 문장에 있어요. 옛 방식 <b>win-lose</b>(승자와 패자가 있는)와 대비되는 <b>win-win</b>(양측에 유리한)이 반복되는 걸 잡으세요.</p><div class=\"ck-step\"><span class=\"lab\">3번 문장 · 두 방식 대비</span><div class=\"en\">the traditional, <mark>win-lose</mark> negotiating style rather than an approach that is likely to result in a <mark>win-win</mark> agreement.</div><p class=\"ko\">양측에 유리한 합의로 끝날 가능성이 있는 접근법보다는 전통적인 <mark>승자와 패자가 있는</mark> 협상 방식을</p></div><div class=\"ck-via\"><i>▼</i><span>However(그러나)로 옛 방식이 이제 잘 안 맞는 이유를 대요</span></div><div class=\"ck-step\"><span class=\"lab\">5번 문장 · 상황 변화</span><div class=\"en\"><mark>However</mark>, such transactions are becoming increasingly rare, because most of us deal with the same people repeatedly</div><p class=\"ko\"><mark>그러나</mark>, 그러한 거래는 점점 더 드물어지고 있다, 우리 대부분이 똑같은 사람들을 반복적으로 상대하기 때문에</p></div><div class=\"ck-via\"><i>▼</i><span>In view of this(이것의 관점에서)로 결론을 내려요. 결과와 관계를 ‘동시에’ 챙기라는 말</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 결정적 단서</span><div class=\"en\"><mark>it’s essential</mark> to achieve successful results for ourselves and <mark>maintain a healthy relationship</mark> with our negotiating partners at the same time.</div><p class=\"ko\">동시에 우리 자신을 위해 성공적인 결과를 얻어내고 우리의 협상 파트너들과 <mark>건전한 관계를 유지하는 것</mark>은 <mark>중요하다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>win-win(양측에 유리한)이 유일한 답이라고 못 박아요</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 문장 · 한 번 더 확인</span><div class=\"en\">a <mark>win-win outcome</mark> is fast becoming the only acceptable result.</div><p class=\"ko\"><mark>양측에 유리한 결과</mark>는 빠르게 ‘유일하게’ 받아들일 수 있는 결과가 되어가고 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">양측에 유리한 협상을 통해 상대와 좋은 관계를 유지해야 한다.<small>7번 win-win(양측에 유리한) + 6번 maintain a healthy relationship(건전한 관계를 유지하다)을 합친 말이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">원만한 인간관계를 위해 상호독립성을 인정하는 것이 필요하다.</span><span class=\"why\">[반대] 7번 interdependent(상호 의존적인)를 ‘상호독립’으로 뒤집은 함정이에요. 지문은 서로 기대는 세상이라서 관계를 지키라고 해요. 협상 이야기도 빠졌어요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">협상 상대의 단점뿐 아니라 장점을 철저히 분석해야 한다.</span><span class=\"why\">[지문에 없음] 상대의 장단점을 분석하라는 말은 없어요. 지문은 상대를 이기는 법이 아니라 함께 이기는 win-win(양측에 유리한) 방식을 말해요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">의사소통 과정에서 서로의 의도를 확인하는 것이 바람직하다.</span><span class=\"why\">[지문에 없음] 의도 확인은 한 번도 안 나와요. 6번의 핵심은 결과와 건전한 관계를 동시에 챙기는 거예요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">성공적인 협상을 위해 다양한 대안을 준비하는 것이 중요하다.</span><span class=\"why\">[지문에 없음] 6번 successful results(성공적인 결과)라는 말이 겹쳐 보이지만, 대안을 준비하라는 내용은 없어요. 중요한 건 관계 유지예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">We all negotiate every day,</div><div class=\"k\">우리 모두는 매일 협상한다,</div></div><div class=\"rc\"><div class=\"e\">whether we realise it or not.</div><div class=\"k\">우리가 그것을 알아차리든 아니든 간에.</div></div><div class=\"rnat\">우리가 그것을 알아차리든 아니든 간에, 우리 모두는 매일 협상한다.</div><div class=\"rst\">“이번 주말에 뭐 할래?” 친구랑 정하는 것도 다 협상이에요. = 지문 1번, 우리는 알든 모르든 매일 협상한다는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Yet few people ever learn</div><div class=\"k\">그러나 배운 사람은 거의 없다</div></div><div class=\"rc\"><div class=\"e\">how to negotiate.</div><div class=\"k\">‘어떻게’ 협상해야 하는지를.</div></div><div class=\"rnat\">그러나 이제껏 '어떻게' 협상해야 하는지를 배운 사람은 거의 없다.</div><div class=\"rst\">그런데 어떻게 하면 잘 정할 수 있는지 배운 사람은 거의 없어요. 지문 2번도 협상하는 법을 배운 사람이 드물대요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Those who do usually learn</div><div class=\"k\">(배우는) 사람들은 대개 배운다</div></div><div class=\"rc\"><div class=\"e\">the traditional, win-lose negotiating style</div><div class=\"k\">전통적인 승자와 패자가 있는 협상 방식을</div></div><div class=\"rc\"><div class=\"e\">rather than an approach</div><div class=\"k\">접근법보다는</div></div><div class=\"rc\"><div class=\"e\">that is likely to result in a win-win agreement.</div><div class=\"k\">양측에 유리한 합의로 끝날 가능성이 있는.</div></div><div class=\"rnat\">(협상 방식을) 배우는 사람들은 대개 양측에 유리한 합의로 끝날 가능성이 있는 접근법보다는 전통적인 승자와 패자가 있는 협상 방식을 배운다.</div><div class=\"rst\">배운 사람도 대개 “내가 이기면 넌 져” 방식만 알아요. 지문 3번, <b>승자와 패자가 있는</b>(win-lose) 옛 방식이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">This old-school, adversarial approach may be useful</div><div class=\"k\">이러한 구식의 적대적인 접근법은 유용할지도 모른다</div></div><div class=\"rc\"><div class=\"e\">in a one-off negotiation</div><div class=\"k\">일회성 협상에서</div></div><div class=\"rc\"><div class=\"e\">where you will probably not deal with that person again.</div><div class=\"k\">당신이 아마도 그 사람을 다시 상대하지 않을.</div></div><div class=\"rnat\">이러한 구식의 적대적인 접근법은 당신이 아마도 그 사람을 다시 상대하지 않을 일회성 협상에서 유용할지도 모른다.</div><div class=\"rst\">다시 볼 일 없는 중고 거래 상대라면 그렇게 해도 될지 몰라요. 지문 4번, 일회성 협상에서는 쓸모 있을 수도 있대요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">However</span>, such transactions are becoming increasingly rare,</div><div class=\"k\"><span class=\"cw\">그러나</span>, 그러한 거래는 점점 더 드물어지고 있다,</div></div><div class=\"rc\"><div class=\"e\">because most of us deal with the same people repeatedly</div><div class=\"k\">우리 대부분이 똑같은 사람들을 반복적으로 상대하기 때문에</div></div><div class=\"rc\"><div class=\"e\">— our spouses and children, our friends and colleagues, our customers and clients.</div><div class=\"k\">우리의 배우자와 자녀, 우리의 친구들과 동료들, 우리의 고객들과 의뢰인들과 같이.</div></div><div class=\"rnat\">그러나, 우리 대부분이 우리의 배우자와 자녀, 우리의 친구들과 동료들, 우리의 고객들과 의뢰인들과 같이 똑같은 사람들을 반복적으로 상대하기 때문에, 그러한 거래는 점점 더 드물어지고 있다.</div><div class=\"rst\"><b>그러나</b>(However) 우리는 가족·친구·같은 반 친구를 매일 또 만나요. 지문 5번처럼 그런 한 번뿐인 거래는 점점 드물어요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">In view of this,</div><div class=\"k\">이것(= 앞에서 말한 내용)의 관점에서,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">it’s essential</span> to achieve successful results for ourselves</div><div class=\"k\">우리 자신을 위해 성공적인 결과를 얻어내는 것은 <span class=\"cw\">중요하다</span></div></div><div class=\"rc ckc\"><div class=\"e\">and <span class=\"cw\">maintain a healthy relationship</span> with our negotiating partners</div><div class=\"k\">그리고 우리의 협상 파트너들과 <span class=\"cw\">건전한 관계를 유지하는 것은</span></div></div><div class=\"rc\"><div class=\"e\">at the same time.</div><div class=\"k\">동시에.</div></div><div class=\"rnat\">이것의 관점에서, 우리 자신을 위해 성공적인 결과를 얻어내는 것과 동시에 우리의 협상 파트너들과 건전한 관계를 유지하는 것은 중요하다.</div><div class=\"rst\">그래서 내 몫도 챙기고 친구와 사이도 <b>동시에</b> 지켜야 해요. 지문 6번의 it’s essential(~하는 것은 중요하다)이 요지예요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">In today’s interdependent world of business partnerships and long-term relationships,</div><div class=\"k\">오늘날의 사업 협력과 장기적 관계의 상호 의존적인 세상에서,</div></div><div class=\"rc ckc\"><div class=\"e\">a <span class=\"cw\">win-win outcome</span> is fast becoming</div><div class=\"k\"><span class=\"cw\">양측에 유리한 결과는</span> 빠르게 되어가고 있다</div></div><div class=\"rc\"><div class=\"e\">the only acceptable result.</div><div class=\"k\">‘유일하게’ 받아들일 수 있는 결과가.</div></div><div class=\"rnat\">오늘날의 사업 협력과 장기적 관계의 상호 의존적인 세상에서, 양측에 유리한 결과는 '유일하게' 받아들일 수 있는 결과가 빠르게 되어가고 있다.</div><div class=\"rst\">서로 기대 사는 요즘엔 <b>둘 다 이기는 결과</b>(win-win outcome)만이 통해요. 지문 7번은 그게 유일한 답이 되어 간다고 해요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"negotiate\" data-m=\"협상하다\"><b>negotiate</b>협상하다</button><button type=\"button\" class=\"wdb\" data-w=\"adversarial\" data-m=\"적대적인\"><b>adversarial</b>적대적인</button><button type=\"button\" class=\"wdb\" data-w=\"one-off\" data-m=\"일회성의\"><b>one-off</b>일회성의</button><button type=\"button\" class=\"wdb\" data-w=\"transactions\" data-m=\"거래들 (단수 transaction)\"><b>transactions</b>거래들 (단수 transaction)</button><button type=\"button\" class=\"wdb\" data-w=\"interdependent\" data-m=\"상호 의존적인\"><b>interdependent</b>상호 의존적인</button><button type=\"button\" class=\"wdb\" data-w=\"win-win\" data-m=\"양측에 유리한\"><b>win-win</b>양측에 유리한</button></div>"};
document.addEventListener('click',function(e){
 var b=e.target.closest('.stbtn');
 if(b){var box=b.closest('.rdb'),on=!box.classList.contains('story');box.classList.toggle('story',on);
  var L=[].slice.call(box.querySelectorAll('.rds'));L.forEach(function(x){x.classList.remove('lastv');x.style.order='';});
  if(on){L.sort(function(a,c){return (+a.dataset.ord)-(+c.dataset.ord);});L.forEach(function(x,i){x.style.order=i+1;});L[L.length-1].classList.add('lastv');}
  b.textContent=on?'문장별로 보기':'이야기로 이어 읽기';return;}
 var w=e.target.closest('.wdb');
 if(w){var on2=!w.classList.contains('on');w.classList.toggle('on',on2);
  try{if(window.WN){if(on2)WN.add([{w:w.dataset.w,m:w.dataset.m,src:'미니모고',how:'별표',ask:true}]);else if(WN.del)WN.del(w.dataset.w,'미니모고');}}catch(err){}
  var t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s';document.body.appendChild(t);}
  t.textContent=on2?'오답노트장에 담았어요':'오답노트장에서 뺐어요';t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(function(){t.style.opacity='0'},1600);}
});

/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  if(EXP[cq.q]){h+=EXP[cq.q]+'<button class="toq" data-i="'+i+'">빠른 정답으로</button>';return h+'</div></details>';}
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
  mmInit();
}
/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(S.sub&&!S.mmS){S.mmS=1;S.mmP=1;save();WN.hw(lv,day,S.sub.s+'/'+N+(S.mmD?' ✓':''));}else if(!S.sub&&!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
