<body>
<div id="app"></div>
<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){

e always come\u0002 / \u0001at about the same time each year\u0002 / \u0001in living memory<sup>5</sup>\u0002.", "pk": "이것은 \u0001과거에 대한 그들의 지식에\u0002 근거한다 / \u0001왜냐하면 몬순이 늘 와 왔기 때문이다\u0002 / \u0001매년 거의 같은 시기에\u0002 / \u0001사람들의 기억이 닿는 한\u0002", "core": "이것은 근거한다.", "tags": ["주어 This + 동사 is based(수동, 1형식). on ~ = 전치사구(부사구): based 꾸밈. 거의 필수에 가까운 부사구[천일문S 표기 A] [기준: 모양 규칙]. of the past는 knowledge를 꾸밈", "as절 = 부사절(<b>이유</b>): 앞 내용을 꾸밈. have always come = 현재완료", "at about the same time each year = 전치사구(부사구): come을 꾸밈", "in living memory = 전치사구(부사구, 관용 표현): 앞 내용을 꾸밈"], "steps": [{"t": "이 문장은 <b>수동태(1형식) + 이유의 as절</b>이다. 뒤의 as절 때문에 길어진다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: This (이것)", "V: is based (base ~에 근거를 두다의 수동태)", "뼈대 = <b>This is based</b> (on their knowledge of the past)", "수동태 주절은 1형식으로 본다(문형 기준).", "on ~은 거의 필수에 가까운 부사구이지만 뼈대 밖 수식어로 둔다."]}, {"t": "<b>on their knowledge of the past</b>는 전치사구(부사구)로 is based를 꾸민다.", "sub": ["knowledge (지식) 뒤 of the past (과거에 대한)는 knowledge를 꾸민다."]}, {"t": "<b>as the monsoons have always come</b>은 <b>부사절(이유)</b>이다. '~하기 때문에'.", "sub": ["S: the monsoons (몬순, 계절풍)", "V: have always come (come 오다의 현재완료, 늘 와 왔다) → 1형식"]}, {"t": "그 as절 안에서 <b>at about the same time each year</b> (매년 거의 같은 시기에)와 <b>in living memory</b> (사람들의 기억이 닿는 한)는 come을 꾸미는 부사구다."}], "sum": "과거에 대한 지식에 근거, 몬순이 늘 비슷한 시기에 왔기 때문"}, {"i": "05", "q": "04", "s": "7", "title": "이유의 as절 두 개 + while 대조절", "eng": "For example, / in England all the houses have central heating<sup>1</sup>, / as the outside temperature is usually below<sup>2</sup> 20°C, / but no air-conditioning<sup>3</sup>, / as temperatures rarely go beyond<sup>4</sup> 26°C, / while<sup>5</sup> in Australia the opposite<sup>6</sup> is true.", "notes": [["1", "central heating", "중앙난방"], ["2", "below", "~ 아래인"], ["3", "air-conditioning", "냉방 장치"], ["4", "go beyond", "~을 넘어가다"], ["5", "while", "~인 반면에"], ["6", "opposite", "반대"]], "lit": "예를 들어 / 영국에서는 모든 집에 중앙난방이 있다 / 바깥 기온이 보통 20도 아래이기 때문에 / 그러나 냉방 장치는 없다 / 기온이 좀처럼 26도를 넘지 않기 때문에 / 반면 호주에서는 그 반대가 사실이다", "nat": "예를 들어 영국에서는 바깥 기온이 대개 20도 아래라 모든 집에 중앙난방이 있지만, 기온이 26도를 넘는 일이 드물어 냉방 장치는 없다. 반면 호주는 정반대다.", "ana": "<b>as</b>가 두 번 나오는데 둘 다 <b>이유</b>입니다. 앞의 것은 중앙난방이 있는 이유, 뒤의 것은 냉방이 없는 이유로 <b>각각 다른 절에 걸립니다</b> — 어느 말에 붙는지 화살표로 표시하며 읽으세요. <b>but no air-conditioning</b>은 have가 생략된 형태로 '<b>(하지만) 냉방은 없다</b>'입니다. 맨 뒤의 <b>while</b>은 '~하는 동안'이 아니라 <b>대조</b>의 '반면에'입니다.", "pe": "\u0001For example\u0002, / \u0001in England\u0002 all the houses have central heating<sup>1</sup>, / \u0001as the outside temperature is usually below<sup>2</sup> 20°C\u0002, / but no air-conditioning<sup>3</sup>, / \u0001as temperatures rarely go beyond<sup>4</sup> 26°C\u0002, / \u0001while<sup>5</sup> in Australia the opposite<sup>6</sup> is true\u0002.", "pk": "\u0001예를 들어\u0002 / \u0001영국에서는\u0002 모든 집에 중앙난방이 있다 / \u0001바깥 기온이 보통 20도 아래이기 때문에\u0002 / 그러나 냉방 장치는 없다 / \u0001기온이 좀처럼 26도를 넘지 않기 때문에\u0002 / \u0001반면 호주에서는 그 반대가 사실이다\u0002", "core": "모든 집에 중앙난방이 있지만 냉방 장치는 없다.", "tags": ["For example = 부사구: 문장 전체를 꾸밈", "in England = 전치사구(부사구): 절 전체를 꾸밈. 주어 houses + 동사 have + 목적어 central heating", "as절 = 부사절(<b>이유</b>): 중앙난방이 있는 이유", "but no air-conditioning = (have 생략) 목적어 air-conditioning", "as절 = 부사절(<b>이유</b>): 냉방이 없는 이유", "while절 = 부사절(<b>대조</b>, 반면에): 앞 내용을 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>에 <b>as절 2개와 while절</b>이 이어져 길어졌다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: all the houses (모든 집)", "V: have (가지다)", "O: central heating (중앙난방)", "For example (예를 들어), in England (영국에서)는 문장 전체를 꾸미는 부사 표현", "뼈대 = <b>all the houses have central heating</b>"]}, {"t": "첫 번째 <b>as the outside temperature is usually below 20°C</b>는 <b>부사절(이유)</b>이다.", "sub": ["S: the outside temperature (바깥 기온), V: is, C: below 20°C (20도 아래)", "usually (보통)는 부사"]}, {"t": "<b>but no air-conditioning</b>은 앞 문장과 병렬이다. 같은 have가 <b>생략</b>되어 (have) no air-conditioning (냉방 장치가 없다)이다."}, {"t": "두 번째 <b>as temperatures rarely go beyond 26°C</b>도 <b>부사절(이유)</b>이다. 냉방이 없는 이유를 말한다.", "sub": ["S: temperatures (기온), V: go (가다), beyond 26°C (26도를 넘어서), rarely (좀처럼 ~않다)"]}, {"t": "마지막 <b>while in Australia the opposite is true</b>는 <b>부사절(대조, 반면에)</b>이다. 빼도 앞 문장이 완결되므로 부사절이다.", "sub": ["S: the opposite (정반대), V: is, C: true (사실인)"]}], "sum": "영국은 난방만 있고 냉방은 없으나, 호주는 정반대"}, {"i": "06", "q": "05", "s": "5", "title": "Although 양보절 + S+V(1형식)", "eng": "Although a bought<sup>1</sup> toast<sup>2</sup> might \"work\" / in the sense of<sup>3</sup> achieving<sup>4</sup> its desired effect, / that effect might depend on deception<sup>5</sup>.", "notes": [["1", "bought", "구매한"], ["2", "toast", "축사, 건배사"], ["3", "in the sense of", "~라는 의미에서"], ["4", "achieve", "달성하다"], ["5", "deception", "속임, 기만"]], "lit": "비록 구매한 축사가 '효과가 있을'지 몰라도 / 의도한 효과를 달성한다는 의미에서 / 그 효과는 속임수에 달려 있을지도 모른다", "nat": "돈 주고 산 축사가 원하던 효과를 낸다는 점에서는 '통할'지 모르지만, 그 효과는 속임수에 기대고 있는 것일 수 있다.", "ana": "<b>Although</b>는 '비록 ~일지라도'인 <b>양보 접속사</b>라, 콤마 뒤에 반드시 주절이 옵니다. 여기서 주어는 <b>that effect</b>, 동사는 <b>might depend</b>입니다. <b>in the sense of</b> 뒤에는 명사 자리이므로 동사가 아니라 <b>동명사 achieving</b>이 왔습니다 — of 뒤에 -ing가 보이면 '동사가 하나 더 있다'가 아니라 <b>전치사의 목적어</b>로 처리하세요. 두 번의 <b>might</b>는 단정이 아니라 <b>추측</b>입니다.", "pe": "\u0001Although a bought<sup>1</sup> toast<sup>2</sup> might \"work\"\u0002 / \u0001in the sense of<sup>3</sup> achieving<sup>4</sup> its desired effect\u0002, / that effect might depend \u0001on deception<sup>5</sup>\u0002.", "pk": "\u0001비록 구매한 축사가 '효과가 있을'지 몰라도\u0002 / \u0001의도한 효과를 달성한다는 의미에서\u0002 / 그 효과는 \u0001속임수에\u0002 달려 있을지도 모른다", "core": "그 효과는 달려 있을지도 모른다.", "tags": ["Although절 = 부사절(<b>양보</b>): 주절을 꾸밈. might는 추측", "in the sense of ~ = 전치사구(부사구): work를 꾸밈. of 뒤 동명사 achieving", "주어 that effect + 동사 might depend(1형식). on deception = 전치사구(부사구): depend를 꾸밈. 거의 필수에 가까운 부사구(depend on)[천일문S 표기 A] [기준: 모양 규칙]"], "steps": [{"t": "이 문장은 <b>Although 양보절 + S+V(1형식)</b>이다. 앞의 양보절이 길어 보이게 만든다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: that effect (그 효과)", "V: might depend (depend 의존하다, might는 '~일지도 모른다'는 추측)", "on deception (속임수에)은 전치사구", "뼈대 = <b>that effect might depend on deception</b>", "depend on은 거의 필수에 가까운 부사구(on ~)가 붙는 표현이라 1형식 + 수식어로 본다."]}, {"t": "앞의 <b>Although a bought toast might \"work\"</b>는 <b>부사절(양보)</b>이다. '비록 ~이지만'.", "sub": ["S: a bought toast (구매한 축사). bought는 buy 사다의 p.p.로 toast를 꾸미는 형용사", "V: might work (work 효과가 있다) → 1형식"]}, {"t": "<b>in the sense of achieving its desired effect</b>는 work를 꾸미는 전치사구(부사구)다. '~라는 의미에서'.", "sub": ["of 뒤 achieving은 <b>동명사</b> (전치사 뒤 -ing)", "achieve 달성하다 + its desired effect (원하던 효과)"]}], "sum": "산 축사는 효과를 내도, 그 효과는 속임수에 달려 있을 수 있음"}, {"i": "07", "q": "05", "s": "7", "title": "If 조건절 + S+V+C", "eng": "If a bought toast depends<sup>1</sup> for its effect on concealing<sup>2</sup> its origin<sup>3</sup>, / that's a reason to suspect<sup>4</sup> / it's a corrupt<sup>5</sup> version of the real thing.", "notes": [["1", "depend on", "~에 달려 있다"], ["2", "conceal", "숨기다"], ["3", "origin", "기원, 출처"], ["4", "suspect", "의심하다"], ["5", "corrupt", "변질된, 타락한"]], "lit": "만약 구매한 축사가 그 효과를 위해 출처를 숨기는 데 의존한다면 / 그것은 의심할 이유가 된다 / 그것이 진짜의 변질된 형태라고", "nat": "돈 주고 산 축사가 효과를 보려고 그 출처를 숨겨야만 한다면, 그것은 그 축사가 진짜의 변질된 형태라고 의심할 만한 이유가 된다.", "ana": "<b>depend on</b> 사이에 <b>for its effect</b>가 끼어들어 <b>depend ~ on</b>이 떨어져 있습니다. on을 놓치면 concealing이 어디에 걸리는지 알 수 없습니다 — on 뒤는 명사 자리라 <b>동명사 concealing</b>이 왔습니다. <b>a reason to suspect</b>의 to부정사는 reason을 꾸미는 <b>형용사적 용법</b>입니다. suspect 뒤에는 <b>접속사 that이 생략</b>되어 있어 it's ~ 전체가 목적어절입니다.", "pe": "\u0001If a bought toast depends<sup>1</sup> for its effect on concealing<sup>2</sup> its origin<sup>3</sup>\u0002, / that's a reason \u0001to suspect<sup>4</sup>\u0002 / \u0001it's a corrupt<sup>5</sup> version of the real thing\u0002.", "pk": "\u0001만약 구매한 축사가 그 효과를 위해 출처를 숨기는 데 의존한다면\u0002 / 그것은 \u0001의심할\u0002 이유가 된다 / \u0001그것이 진짜의 변질된 형태라고\u0002", "core": "그것은 이유이다.", "tags": ["If절 = 부사절(조건): 주절을 꾸밈. depend ~ on이 for its effect로 갈라짐, on 뒤 동명사", "주어 that + 동사 is + 보어 a reason. to suspect = to부정사(형용사적): reason을 꾸밈", "suspect의 목적어절 (접속사 that 생략, 위 to부정사에 속함)"], "steps": [{"t": "이 문장은 <b>If 조건절 + S+V+C(2형식)</b>이고, 끝에 that이 생략된 절이 붙어 길어졌다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: that (앞 If절 내용 전체를 가리킴)", "V: 's = is", "C: a reason (이유)", "뼈대 = <b>that's a reason</b>"]}, {"t": "<b>to suspect ~</b>는 <b>to부정사(형용사적 용법)</b>로 reason을 꾸민다. '의심할 이유'.", "sub": ["suspect (의심하다)의 목적어는 뒤의 절이고, 앞에 <b>접속사 that이 생략</b>되어 있다."]}, {"t": "생략된 that절 안은 <b>it's a corrupt version of the real thing</b>.", "sub": ["S: it (a bought toast, 산 축사), V: is, C: a corrupt version (변질된 형태), of the real thing (진짜의)"]}, {"t": "맨 앞 <b>If a bought toast depends ~</b>는 <b>부사절(조건)</b>이다.", "sub": ["S: a bought toast, V: depends (depend 의존하다) → 1형식. depend on이 for its effect (그 효과를 위해)로 갈라진 모양이다. depend on은 거의 필수에 가까운 부사구(on ~)가 붙는 표현이라 1형식 + 수식어로 본다.", "on 뒤 concealing은 <b>동명사</b>: conceal (숨기다) + its origin (그것의 출처)"]}], "sum": "축사가 출처를 숨겨야 효과가 있다면, 변질된 가짜라고 의심할 이유"}, {"i": "08", "q": "06", "s": "1", "title": "S+V+C 병렬 + 비교급 than", "eng": "Under the right circumstances<sup>1</sup>, / groups are remarkably<sup>2</sup> intelligent<sup>3</sup>, / and are often smarter / than the smartest<sup>4</sup> people in them.", "notes": [["1", "circumstance", "상황, 조건"], ["2", "remarkably", "놀랄 만큼"], ["3", "intelligent", "지적인, 똑똑한"], ["4", "the smartest", "가장 똑똑한"]], "lit": "적절한 조건에서는 / 집단은 놀랄 만큼 지적이다 / 그리고 종종 더 똑똑하다 / 그 안에 있는 가장 똑똑한 사람들보다", "nat": "적절한 조건만 갖춰지면 집단은 놀랄 만큼 똑똑하며, 그 집단 안의 가장 똑똑한 개인보다도 종종 더 낫다.", "ana": "동사 <b>are</b>가 두 번 나오는데 둘 다 주어 <b>groups</b>에 걸리는 <b>병렬</b>입니다. and 뒤에 주어가 없다고 해서 새 문장이 시작된 것이 아닙니다. <b>than the smartest people</b>이 이 문장의 핵심인데, <b>비교급(smarter)과 최상급(the smartest)이 한 문장에</b> 들어가 '가장 똑똑한 개인보다도 집단이 더 낫다'는 뜻이 됩니다. 최상급이 보인다고 그것이 결론이라고 넘겨짚지 마세요. <b>in them</b>의 them은 groups입니다.", "pe": "\u0001Under the right circumstances<sup>1</sup>\u0002, / groups are \u0001remarkably<sup>2</sup>\u0002 intelligent<sup>3</sup>, / and are \u0001often\u0002 smarter / \u0001than the smartest<sup>4</sup> people in them\u0002.", "pk": "\u0001적절한 조건에서는\u0002  거의 없다."]], "evh": "5 · 6번 문장", "ev": [{"en": true, "h": "But the need to predict goes deeper than this; it influences every part of our lives. / Our houses, roads, railways, airports, offices, and so on are all designed for the local climate."}, {"en": false, "h": "주제 유형은 <b>But 뒤</b>를 봅니다. 1~4번의 농사 이야기는 <b>도입</b>이고, 5번의 <b>goes deeper than this</b>에서 범위가 확 넓어집니다. <b>every part of our lives</b>가 이 글의 크기를 정해 주고, 6번이 그 목록(집·도로·철도·공항)을 보여 줍니다. 즉 <b>기후에 대한 지식이 삶 전반을 좌우한다</b>는 것이 주제입니다."}], "opts": [{"n": "①", "t": "new technologies dealing with climate change", "a": false, "x": true, "trap": false, "e": "새로운 <b>기술</b>도, <b>기후 변화</b>도 지문에 없습니다. 지문의 climate는 변화가 아니라 <b>그 지역의 평년 기후</b>입니다."}, {"n": "②", "t": "difficulties in predicting the weather correctly", "a": false, "x": true, "trap": true, "e": "predict가 겹쳐 보이지만 지문은 예측이 <b>어렵다</b>고 하지 않습니다. 오히려 사람들이 <b>잘 알고 있다</b>는 쪽입니다."}, {"n": "③", "t": "weather patterns influenced by rising temperatures", "a": false, "x": true, "trap": false, "e": "기온 상승이 날씨를 바꾼다는 이야기는 없습니다. 7번의 20°C·26°C는 <b>지역 차이</b>를 보여 주는 숫자입니다."}, {"n": "④", "t": "knowledge of the climate widely affecting our lives", "a": true, "x": false, "trap": false, "e": "5번의 influences every part of our lives, 6번의 all designed for the local climate와 정확히 맞습니다."}, {"n": "⑤", "t": "traditional wisdom helping our survival in harsh climates", "a": false, "x": true, "trap": false, "e": "2~4번만 보면 그럴듯하지만, 5번 이후의 집·도로·공항 이야기를 <b>덮지 못합니다</b>. 또 harsh(혹독한) 기후에 한정되지도 않습니다."}], "w": [["operate on", "~에 의존해 돌아가다"], ["monsoon", "몬순, 계절풍(비)"], ["crop", "작물"], ["harvest", "수확"], ["be based on", "~에 근거하다"], ["in living memory", "사람들의 기억이 닿는 한"], ["predict", "예측하다"], ["influence", "영향을 미치다"], ["local climate", "지역 기후"], ["go beyond", "~을 넘어가다"]]}, {"q": "05", "type": "어법", "src": "2014년 9월 27번", "ans": "②", "tr": [["1", "결혼식 날 신랑 들러리가 당신을 울릴 만큼 마음 따뜻하고 감동적인 축사를 한다고 해 보자."], ["2", "당신은 나중에 그가 그것을 직접 쓴 것이 아니라 온라인에서 샀다는 사실을 알게 된다."], ["3", "그렇다면 그 축사는, 돈 받은 전문가가 쓴 것임을 알기 전인 처음보다 의미가 덜해질까?"       let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
/* ---- 답 제출 ---- */
function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});try{var _m=String(FILE).match(/^(\d\d)([ab])$/);if(_m&&window.WN)WN.hw('미니모고 '+(GCODE==='h2'?'고2':'고1'),(+_m[1])*2-(_m[2]==='a'?1:0),s+'/'+N);}catch(e){}
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}
/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
  mmInit();
}
/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
