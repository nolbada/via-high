<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});

\u0002 / \u0001혹은 공기가 오염된\u0002", "core": "사람들은 걷거나 자전거를 타기로 거의 선택하지 않을 것이다.", "tags": ["주어의 한정어 <b>Few</b>: 부정의 뜻 (거의 없는)", "주어 people", "동사 <b>would choose</b>", "목적어 <b>to walk or bike</b> (to부정사 병렬, SVO)", "(on roadways) = 전치사구(부사구): walk or bike를 꾸밈", "(that절) = 관계절(형용사절): roadways를 꾸밈. lack = ~이 없다", "(where절) = 관계부사절(형용사절): roadways를 꾸밈. speed by = 빠르게 지나가다", "(or where절) = 관계부사절(형용사절): roadways를 꾸밈. 앞 where절과 병렬"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이다. 도로를 꾸미는 관계절 세 개가 이어져 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: Few people (사람들은 거의 없다. Few = 거의 없는)", "V: would choose (choose 선택하다. would는 추측)", "O: to walk or bike (걷거나 자전거를 타는 것. to부정사 병렬)", "뼈대 = <b>Few people would choose to walk or bike</b>"]}, {"t": "<b>on roadways</b>는 전치사구(부사구)이다. walk or bike를 꾸민다. (roadway 도로)"}, {"t": "뒤의 세 관계절은 모두 roadways를 꾸민다.", "sub": ["① <b>that lack safe sidewalks or marked bicycle lanes</b> = 안전한 보도나 표시된 자전거 도로가 없는 (lack ~이 없다, marked 표시된)", "② <b>where vehicles speed by</b> = 차량이 빠르게 지나가는 (speed by 빠르게 지나가다)", "③ <b>or where the air is polluted</b> = 공기가 오염된 (polluted 오염된)"]}, {"t": "함정: where는 '장소 앞에 오는 관계부사'이다. roadways(도로)를 선행사로 받는다. ①은 that이 주격 관계대명사, ②③은 where이다."}], "sum": "안전하지 않고 위험하고 오염된 도로에서 걷거나 자전거 타기를 택할 사람은 거의 없음"}, {"i": "04", "q": "03", "s": "5", "title": "S+V+O(3형식) + 전치사구 연속", "eng": "Few / would choose / to walk up stairs / in inconvenient<sup>1</sup> and unsafe stairwells<sup>2</sup> / in modern buildings.", "notes": [["1", "inconvenient", "불편한"], ["2", "stairwell", "계단실"]], "lit": "거의 없을 것이다 / 사람들은 / 계단을 걸어 올라가기로 선택할 / 불편하고 안전하지 않은 계단실에서 / 현대식 건물의", "nat": "현대식 건물의 불편하고 안전하지 않은 계단실에서 계단을 걸어 올라가려는 사람은 거의 없을 것이다.", "ana": "<b>Few</b>는 '거의 없는'이라는 <b>부정의 의미를 가진 대명사</b>로 쓰였으며, <b>inconvenient and unsafe</b>는 and로 연결되어 stairwells를 함께 수식하는 <b>형용사 병렬</b>입니다.", "pe": "Few / would choose / to walk \u0001up stairs\u0002 / \u0001in inconvenient<sup>1</sup> and unsafe stairwells<sup>2</sup>\u0002 / \u0001in modern buildings\u0002.", "pk": "거의 없을 것이다 / 사람들은 / 계단을 걸어 올라가기로 선택할 / \u0001불편하고 안전하지 않은 계단실에서\u0002 / \u0001현대식 건물의\u0002", "core": "사람들은 계단을 걸어 올라가기로 거의 선택하지 않을 것이다.", "tags": ["주어 <b>Few</b> (대명사: 거의 없는 사람)", "동사 <b>would choose</b>", "목적어 <b>to walk</b> (to부정사 목적어, SVO). (up stairs) = 전치사구(부사구): walk 꾸밈 [기준: 모양 규칙]", "(in ~ stairwells) = 전치사구(부사구): walk up을 꾸밈. inconvenient and unsafe 병렬 형용사", "(in modern buildings) = 전치사구(형용사구): stairwells를 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이다. 주어가 Few 한 단어라서 짧은데 뒤에 전치사구가 이어져 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: Few (거의 없는 사람. 여기서는 대명사로 쓰임)", "V: would choose (choose 선택하다)", "O: to walk up stairs (계단을 걸어 올라가는 것)", "뼈대 = <b>Few would choose to walk up stairs</b>"]}, {"t": "<b>up stairs</b>는 전치사 up+stairs로 보는 전치사구(부사구)이다. walk를 꾸민다. (stairs 계단) walk up을 한 덩어리 구동사로 보는 기준도 있어 기준이 갈린다. 해석은 같다."}, {"t": "<b>in inconvenient and unsafe stairwells</b>는 전치사구(부사구)이다. walk를 꾸민다. 형용사 두 개가 stairwells를 꾸민다. (inconvenient 불편한, unsafe 안전하지 않은, stairwell 계단실)"}, {"t": "<b>in modern buildings</b>는 전치사구(형용사구)이다. stairwells를 꾸민다. (modern 현대의, building 건물)"}], "sum": "불편하고 위험한 현대식 건물 계단실을 걸어 올라가려는 사람은 거의 없음"}, {"i": "05", "q": "04", "s": "3", "title": "S+V+C(2형식) + 비교 than + what절", "eng": "Recent progress / in telecommunications<sup>1</sup> technologies / is not more revolutionary<sup>2</sup> / than what happened / in the late nineteenth century / in relative terms<sup>3</sup>.", "notes": [["1", "telecommunications", "통신"], ["2", "revolutionary", "혁명적인"], ["3", "relative terms", "상대적인 측면"]], "lit": "최근의 발전은 / 통신 기술에서의 / 더 혁명적이지 않다 / 일어난 것보다 / 19세기 말에 / 상대적인 측면에서", "nat": "통신 기술의 최근 발전은 상대적으로 볼 때 19세기 말에 일어난 일보다 더 혁명적이지 않다.", "ana": "<b>what happened ~</b>는 <b>선행사를 포함하는 관계대명사 what</b>이 이끄는 명사절로, <b>비교급 than</b>의 비교 대상이 되는 자리입니다.", "pe": "\u0001Recent\u0002 progress / \u0001in telecommunications<sup>1</sup> technologies\u0002 / is not more revolutionary<sup>2</sup> / \u0001than what happened\u0002 / \u0001in the late nineteenth century\u0002 / \u0001in relative terms<sup>3</sup>\u0002.", "pk": "\u0001최근의\u0002 발전은 / \u0001통신 기술에서의\u0002 / 더 혁명적이지 않다 / \u0001일어난 것보다\u0002 / \u000119세기 말에\u0002 / \u0001상대적인 측면에서\u0002", "core": "최근의 발전은 더 혁명적이지 않다.", "tags": ["주어 Recent progress. (Recent) = 형용사: progress를 꾸밈", "(in ~ technologies) = 전치사구(형용사구): progress를 꾸밈", "동사 is, 보어 <b>more revolutionary</b> (SVC). 부정은 not", "(than what happened) = 비교 전치사구(부사적): more revolutionary의 비교 대상", "(in the late nineteenth century) = 전치사구(부사구): happened를 꾸밈", "(in relative terms) = 전치사구(부사구): is not more revolutionary를 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식)</b>이다. 뒤에 비교 than절과 시간·관점 전치사구가 붙어 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: Recent progress (최근의 발전. Recent는 progress를 꾸밈)", "V: is not (be동사 부정)", "C: more revolutionary (더 혁명적인)", "뼈대 = <b>Recent progress is not more revolutionary</b>"]}, {"t": "<b>in telecommunications technologies</b>는 전치사구(형용사구)이다. progress를 꾸민다. (telecommunications 통신, technology 기술)"}, {"t": "<b>than what happened in the late nineteenth century</b>는 비교 than 뒤의 대상이다. what happened는 what절(명사절)이다.", "sub": ["what happened = 일어난 일 (happen 일어나다)", "in the late nineteenth century = 19세기 말에 (전치사구, happened를 꾸밈)"]}, {"t": "끝의 <b>in relative terms</b>는 전치사구(부사구)이다. '상대적인 측면에서'라는 뜻이다. (relative 상대적인)"}], "sum": "통신 기술의 최근 발전, 상대적으로는 19세기 말 변화보다 혁명적이지 않음"}, {"i": "06", "q": "04", "s": "6", "title": "S+V+O(3형식) + when절 안 동사 병렬", "eng": "We should not / \"put the telescope<sup>1</sup> backward\" / when we look into the past / and underestimate<sup>2</sup> the old / and overestimate<sup>3</sup> the new.", "notes": [["1", "telescope", "망원경"], ["2", "underestimate", "과소평가하다"], ["3", "overestimate", "과대평가하다"]], "lit": "우리는 해서는 안 된다 / '망원경을 거꾸로 놓아서는' / 우리가 과거를 들여다볼 때 / 그리고 옛것을 과소평가하고 / 새것을 과대평가할 때", "nat": "우리는 과거를 돌아볼 때 '망원경을 거꾸로 놓고' 오래된 것을 과소평가하고 새로운 것을 과대평가해서는 안 된다.", "ana": "when절 안에서 <b>look into, underestimate, overestimate</b> 세 개의 동사가 <b>and로 병렬</b> 연결되어 있고, <b>underestimate the old</b>와 <b>overestimate the new</b>가 <b>대구(대조)</b>를 이룹니다.", "pe": "We should not / \"put the telescope<sup>1</sup> \u0001backward\u0002\" / \u0001when we look into the past\u0002 / and underestimate<sup>2</sup> the old / and overestimate<sup>3</sup> the new.", "pk": "우리는 해서는 안 된다 / '망원경을 \u0001거꾸로\u0002 놓아서는' / \u0001우리가 과거를 들여다볼 때\u0002 / 그리고 옛것을 과소평가하고 / 새것을 과대평가할 때", "core": "우리는 망원경을 놓고 오래된 것을 과소평가하고 새로운 것을 과대평가해서는 안 된다.", "tags": ["주어 We, 동사 <b>should not put</b>", "목적어 <b>the telescope</b>. (backward) = 부사: put을 꾸밈. 거의 필수에 가까운 부사 [기준: 모양 규칙]", "(when절) = 부사절(때): should not put을 꾸밈. look into = 들여다보다", "<b>and</b>로 병렬된 동사 <b>underestimate</b> + 목적어 the old (형용사 + the = 오래된 것)", "<b>and</b>로 병렬된 동사 <b>overestimate</b> + 목적어 the new (새로운 것)"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이다. 따옴표 표현과 when절, 동사 병렬이 겹쳐 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: We (우리)", "V: should not put (put 놓다. should not = ~해서는 안 된다)", "O: the telescope (망원경)", "뼈대 = <b>We should not put the telescope backward</b>"]}, {"t": "<b>backward</b>는 부사이다. '거꾸로'라는 뜻이다. put the telescope backward는 '망원경을 거꾸로 놓다'라는 표현이다. backward는 put의 방향을 채워 주는 거의 필수에 가까운 부사이다. 따옴표는 비유라는 표시이다."}, {"t": "<b>when we look into the past and underestimate the old and overestimate the new</b>는 부사절(때)이다. 이 안에서 동사 세 개가 병렬이다.", "sub": ["look into = 들여다보다 (the past 과거)", "underestimate = 과소평가하다 (the old 옛것)", "overestimate = 과대평가하다 (the new 새것)", "the old, the new는 'the+형용사 = ~한 것'"]}, {"t": "기준 메모: underestimate/overestimate를 should not에 병렬로 보는 읽기(자연스러운 해석)와 when절 안 병렬로 보는 읽기(직독 해석, title)가 갈린다. 해설은 when절 안 병렬로 본다. 뜻은 거의 같다."}], "sum": "과거를 볼 때 망원경을 거꾸로 놓고 옛것은 얕보고 새것은 과대평가하는 일 금지"}, {"i": "07", "q": "05", "s": "7", "title": "Just as ~, so … 구문 + 계속적 which + 수동태", "eng": "Just as trains bring materials and textiles<sup>1</sup> / into a city, / which become processed into the economy, / so the raw electrochemical<sup>2</sup> signals / from sensory organs<sup>3</sup> / are transported / along superhighways<sup>4</sup> of neurons<sup>5</sup>.", "notes": [["1", "textile", "직물"], ["2", "electrochemical", "전기화학적인"], ["3", "sensory organ", "감각 기관"], ["4", "superhighway", "초고속도로"], ["5", "neuron", "뉴런"]], "lit": "기차가 자재와 직물을 가져오는 것처럼 / 도시 안으로 / 그것들은 처리되어 경제 속으로 들어가는데 / 그렇게 가공되지 않은 전기화학적 신호는 / 감각 기관으로부터 온 / 전해진다 / 뉴런의 초고속도로를 따라", "nat": "기차가 자재와 직물을 도시로 실어 오고 그것이 처리되어 경제 속으로 들어가는 것처럼, 감각 기관에서 온 가공되지 않은 전기화학적 신호는 뉴런의 초고속도로를 따라 전해진다.", "ana": "<b>Just as ~, so …</b>는 '~인 것처럼, 마찬가지로 …하다'라는 <b>상관 구문</b>입니다. <b>which become processed</b>는 materials and textiles를 보충 설명하는 <b>계속적 용법의 관계대명사절</b>이며, are transported는 <b>수동태</b>입니다.", "pe": "\u0001Just as trains bring materials and textiles<sup>1</sup>\u0002 / \u0001into a city\u0002, / \u0001which become processed into the economy\u0002, / so the \u0001raw electrochemical<sup>2</sup>\u0002 signals / \u0001from sensory organs<sup>3</sup>\u0002 / are transported / \u0001along superhighways<sup>4</sup> \u0001of neurons<sup>5</sup>\u0002\u0002.", "pk": "\u0001기차가 자재와 직물을 가져오는 것처럼\u0002 / \u0001도시 안으로\u0002 / \u0001그것들은 처리되어 경제 속으로 들어가는데\u0002 / 그렇게 \u0001가공되지 않은 전기화학적\u0002 신호는 / \u0001감각 기관으로부터 온\u0002 / 전해진다 / \u0001뉴런의 초고속도로를 따라\u0002", "core": "신호는 전해진다.", "tags": ["(Just as절) = 부사절(비교): 주절 전체를 꾸밈. 주어 trains, 동사 bring, 목적어 materials and textiles", "(into a city) = 전치사구(부사구): bring을 꾸밈. 거의 필수에 가까운 부사구 [기준: 모양 규칙]", "(which절) = 계속적 관계절(형용사절): materials and textiles를 보충 설명", "<b>so</b> = 앞 as절과 짝을 이룸. 주어 signals. (raw electrochemical) = 형용사: signals를 꾸밈", "(from sensory organs) = 전치사구(형용사구): signals를 꾸밈", "동사 <b>are transported</b>(수동)", "(along ~) = 전치사구(부사구): are transported를 꾸밈"], "steps": [{"t": "이 문장은 <b>Just as ~, so …</b> 상관 구문이다. '~하는 것처럼 …도 그렇다'라는 뜻이다. 앞 절에 관계절까지 붙어 길어 보인다."}, {"t": "뒤쪽 주절(so …)의 뼈대부터 찾는다.", "sub": ["S: the raw electrochemical signals (가공되지 않은 전기화학적 신호. raw 날것의, electrochemical 전기화학적)", "V: are transported (transport 운반하다의 수동태, 전해진다)", "뼈대 = <b>the signals are transported</b>", "from sensory organs = 감각 기관으로부터 (signals를 꾸밈). along superhighways of neurons = 뉴런의 초고속도로를 따라 (are transported를 꾸밈)"]}, {"t": "앞 절 <b>Just as trains bring materials and textiles into a city</b>는 부사절이다. S+V+O(3형식)이다.", "sub": ["trains 기차들, bring 가져오다, materials 자재, textiles 직물", "into a city = 도시 안으로 (bring의 도착점을 말하는 거의 필수에 가까운 부사구)"]}, {"t": "<b>which become processed into the economy</b>는 계속적 관계절이다. which가 가리키는 것은 materials and textiles이다. 동사 become이 복수형이라 단수 a city가 아니다.", "sub": ["become processed = 처리된 상태가 되다 (become+p.p. 형용사 2형식)", "process 처리하다, economy 경제"]}, {"t": "함정: 콤마 뒤 which를 a city로 읽기 쉽다. 복수 동사 become으로 구별한다."}], "sum": "기차가 도시로 물자를 나르듯 감각 신호가 뉴런의 초고속도로를 따라 전해짐"}, {"i": "08", "q": "06", "s": "1", "title": "S+V+C(2형식) 두 절 + 반복어구 생략", "eng": "The acceleration<sup>1</sup> / of human migration<sup>2</sup> / toward the shores / is a contemporary<sup>3</sup> phenomenon, / but the knowledge and understanding / of the potential risks / regarding coastal<sup>4</sup> living / are not.", "notes": [["1", "acceleration", "가속화"], ["2", "migration", "이주"], ["3", "contemporary", "현대의"], ["4", "coastal", "해안의"]], "lit": "가속화는 / 인간 이주의 / 해안 쪽으로의 / 현대적인 현상이다 / 하지만 지식과 이해는 / 잠재적 위험에 대한 / 해안 거주와 관련된 / 그렇지 않다", "nat": "해안 쪽으로 향하는 인간 이주의 가속화는 현대적인 현상이지만, 해안 거주의 잠재적 위험에 대한 지식과 이해는 그렇지 않다.", "ana": "문장 뒤의 <b>are not</b>은 반복되는 표현인 <b>a contemporary phenomenon이 생략된 형태</b>입니다. 즉 'are not (a contemporary phenomenon)'으로, <b>반복 어구의 생략</b>이 일어났습니다.", "pe": "The acceleration<sup>1</sup> / \u0001of human migration<sup>2</sup>\u0002 / \u0001toward the shores\u0002 / is a \u0001contemporary<sup>3</sup>\u0002 phenomenon, / but the knowledge and understanding / \u0001of the potential risks\u0002 / \u0001regarding coastal<sup>4</sup> living\u0002 / are not.", "pk": "가속화는 / \u0001인간 이주의\u0002 / \u0001해안 쪽으로의\u0002 / \u0001현대적인\u0002 현상이다 / 하지만 지식과 이해는 / \u0001잠재적 위험에 대한\u0002 / \u0001해안 거주와 관련된\u0002 / 그렇지 않다", "core": "가속화는 현상이지만, 지식과 이해는 그렇지 않다.", "tags": ["주어 The acceleration", "(of human migration) = 전치사구(형용사구): acceleration을 꾸밈", "(toward the shores) = 전치사구(형용사구): migration을 꾸밈", "동사 is, 보어 a phenomenon (SVC). (contemporary) = 형용사: phenomenon을 꾸밈", "<b>but</b> 뒤 두 번째 절의 주어 the knowledge and understanding (병렬)", "(of the potential risks) = 전치사구(형용사구): knowledge and understanding을 꾸밈", "(regarding coastal living) = 분사구(형용사적): risks를 꾸밈 (~와 관련된)", "동사 <b>are</b>, 보어 not: <b>생략</b> (are not a contemporary phenomenon)"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식) 절 두 개가 but으로 이어진 문장</b>이다. 주어마다 수식이 길게 붙어 길어 보인다."}, {"t": "첫 번째 절의 뼈대부터 찾는다.", "sub": ["S: The acceleration (가속화)", "V: is (be동사)", "C: a contemporary phenomenon (현대적인 현상)", "뼈대 = <b>The acceleration is a contemporary phenomenon</b>"]}, {"t": "<b>of human migration toward the shores</b>는 전치사구(형용사구)이다. acceleration을 꾸민다. toward the shores는 migration을 꾸민다. (migration 이주, shore 해안, toward ~쪽으로)"}, {"t": "두 번째 절의 뼈대는 다음과 같다.", "sub": ["S: the knowledge and understanding (지식과 이해)", "V: are (be동사. 주어가 둘이라 복수)", "C: not (a contemporary phenomenon의 반복이 생략됨)", "뼈대 = <b>the knowledge and understanding are not (a contemporary phenomenon)</b>"]}, {"t": "<b>of the potential risks regarding coastal living</b>는 주어를 꾸미는 수식어이다. regarding(~에 관한)은 risks를 꾸민다. (potential 잠재적인, risk 위험, coastal 해안의)"}, {"t": "함정: 끝의 not은 앞과 같은 보어가 생략된 모양이다. 'not' 뒤를 따로 찾지 않는다."}], "sum": "해안 이주 가속은 현대적 현상이나, 해안 거주 위험에 대한 지식은 그렇지 않음"}], "qs": [{"q": "01", "type": "주장", "src": "2015년 9월 20번", "ans": "②", "tr": [["1", "누군가 \"나는 공을 옮겨야 했다\"라고 말하는 것을 들어 본 적이 있는가?"], ["2", "\"공을 옮기다\"라는 표현은 어떤 일을 끝마치는 데 대한 책임을 진다는 것을 의미한다."], ["3", "우리는 말할 때 이와 같은 상투적 표현을 매일 사용한다."], ["4", "이러한 표현들은 다채롭고, 감정이나 상황에 대한 이미지나 묘사를 전달하는 간결함과 능력에서 종종 매력적이다."], ["5", "누군가는 \"얼음처럼 차갑다\" 혹은 \"벌처럼 바쁘다\"고 표현될 수도 있다."], ["6", "어떤 이야기는 \"말로 다 못할 만큼 우스울\" 수도 있다."], ["7", "말할 때 이러한 표현들은 거의 해가 되지 않는다."], ["8", "그러나 글쓰기에서 상투적 표현은 익숙한 것이 지루해지는 운명을 겪는다."], ["9", "독자는 이러한 표현들을 너무 자주 듣고 읽어서, 그것들은 너무 빠르게 독자에게 '튕겨 나가' 매력을 잃어버리는 경향이 있다."], ["10", "그러므로 당신의 글을 더 강력하고 효과적으로 만들고 싶다면, 상투적 표현을 사용하지 않도록 하라."], ["11", "글에서 상투적 표현은 결국 당신 메시지의 힘과 효과를 감소시킨다."]], "evh": "10·11번 문장", "ev": [{"en": true, "h": "Therefore, if you want your writing to be stronger and more effective, try not to use clichés. / Clichés in writing ultimately diminish the strength and effectiveness of your message."}, {"en": false, "h": "주장 문제는 <b>Therefore(그러므로)</b> 뒤에 나오는 저자의 결론이 핵심입니다. 10번에서 글을 더 강력하고 효과적으로 만들려면 <b>상투적 표현을 쓰지 말라</b>고 했고, 11번에서 상투적 표현이 결국 <b>메시지의 힘을 감소시킨다</b>고 마무리합니다. 즉 글을 쓸 때는 상투적 문구 사용을 자제해야 한다는 것이 이 글의 주장입니다."}], "opts": [{"n": "①", "t": "형식보다 내용에 초점을 두어 글을 써라.", "a": false, "x": true, "trap": false, "e": "형식과 내용을 비교하는 내용은 본문에 없습니다."}, {"n": "②", "t": "글을 쓸 때 상투적 문구 사용을 자제하라.", "a": true, "x": false, "trap": false, "e": "10·11번의 '<b>상투적 표현을 쓰지 말라</b>'는 조언과 '<b>메시지의 힘을 감소시킨다</b>'는 결론이 정확히 이 주장을 뒷받침합니다."}, {"n": "③", "t": "독자의 연령층에 적합한 소재를 활용하라.", "a": false, "x": true, "trap": false, "e": "독자의 연령층에 관한 언급은 전혀 없습니다."}, {"n": "④", "t": "글의 목적에 맞는 적절한 어휘를 선택하라.", "a": false, "x": true, "trap": true, "e": "일반적인 어휘 선택이 아니라 <b>상투적 표현(cliché)</b>이라는 구체적인 대상을 다루는 글입니다."}, {"n": "⑤", "t": "발표할 때 가급적 간결한 표현을 사용하라.", "a": false, "x": true, "trap": false, "e": "이 글은 <b>말하기가 아니라 글쓰기</b>에서 상투적 표현을 피하라는 내용입니다."}], "w": [["cliché", "상투적 표현"], ["carry the ball", "책임을 지다"], ["colorful", "다채로운"], ["appealing", "매력적인"], ["economy", "간결함"], ["convey", "전달하다"], ["familiar", "익숙한"], ["bounce off", "튕겨 나가다"], ["swiftly", "재빠르게"], ["appeal", "매력"], ["diminish", "감소시키다"], ["effective", "효과적인"]]}, {"q": "02", "type": "도표 불일치", "src": "2023년 3월 25번", "ans": "⑤", "tr": [["1", "위 도표는 2016년부터 2021년까지 한국의 출생아 수와 사망자 수를 보여 준다."], ["2", "① 출생아 수는 전체 기간 내내 계속 감소했다."], ["3", "② 출생아 수와 사망자 수의 차이는 2016년에 가장 컸다."], ["4", "③ 2019년에는 출생아 수와 사망자 수의 차이가 가장 작았으며, 출생아 수가 사망자 수보다 약간 더 많았다."], ["5", "④ 사망자 수는 2018년부터 2019년까지의 기간을 제외하고 전체 기간 동안 꾸준히 증가했다."], ["6", "⑤ 2021년에는 처음으로 사망자 수가 출생아 수보다 더 많아졌다."]], "evh": "도표 수치 · 2020년", "ev": [{"en": true, "h": "2020: Births 272.3 / Deaths 304.9 (thousand people)"}, {"en": false, "h": "도표 불일치 문제는 각 선택지의 수치를 그래프와 하나씩 대조해야 합니다. ⑤에서 '2021년에 처음으로' 사망자 수가 출생아 수를 넘었다고 했지만, 사망자 수가 출생아 수를     body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
</body>
