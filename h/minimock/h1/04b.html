\"n\">③</span><span><span class=\"t\">대중교통이나 자전거를 이용하는 활동이 있다.</span><span class=\"why\">8번 Use public transport or a bicycle(대중교통이나 자전거를 이용하세요)과 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">참가자는 온라인으로 등록해야 한다.</span><span class=\"why\">10번 Participants must register online(참가자는 온라인으로 등록해야 합니다)과 같아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Sustainable Mobility Week 2019</div><div class=\"k\">2019년 지속 가능한 이동 주간</div></div><div class=\"rnat\">2019년 지속 가능한 이동 주간</div><div class=\"rst\">학교 게시판에 환경 행사 포스터가 붙었어요. = 지문 1번 제목, 2019년 지속 가능한 이동 주간이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">This annual event</div><div class=\"k\">이 연례행사는</div></div><div class=\"rc\"><div class=\"e\">for clean and sustainable transport</div><div class=\"k\">깨끗하고 지속 가능한 교통수단을 위한</div></div><div class=\"rc\"><div class=\"e\">runs from Nov 25 to Dec 1.</div><div class=\"k\">11월 25일부터 12월 1일까지 진행됩니다.</div></div><div class=\"rnat\">깨끗하고 지속 가능한 교통수단을 위한 이 연례행사는 11월 25일부터 12월 1일까지 진행됩니다.</div><div class=\"rst\">매년 열리는 행사래요. 지문 2번: 깨끗한 교통을 위해 11월 25일부터 12월 1일까지 진행돼요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">The slogan for the event</div><div class=\"k\">행사를 위한 슬로건은</div></div><div class=\"rc\"><div class=\"e\">changes every year,</div><div class=\"k\">매년 바뀌며</div></div><div class=\"rc\"><div class=\"e\">and this year it is Walk with Us!</div><div class=\"k\">올해에는 그것(= 슬로건)이 '우리와 함께 걸어요!'입니다.</div></div><div class=\"rnat\">행사를 위한 슬로건은 매년 바뀌며, 올해에는 '우리와 함께 걸어요!'입니다.</div><div class=\"rst\">작년엔 구호가 달랐는데 올해는 “우리와 함께 걸어요!”래요. 지문 3번 <b>매년 바뀐다</b> = 선택지 ①과 같아요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">You can participate in</div><div class=\"k\">여러분은 ~에 참여하실 수 있습니다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">the activities below</span>.</div><div class=\"k\"><span class=\"cw\">아래의 활동들에</span></div></div><div class=\"rnat\">여러분은 아래의 활동들에 참여하실 수 있습니다.</div><div class=\"rst\">“뭘 하면 되지?” 지문 4번: 아래 활동들에 참여할 수 있대요. 활동이 몇 개인지 세어 봐요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Walking Challenge:</div><div class=\"k\">걷기 도전:</div></div><div class=\"rnat\">걷기 도전:</div><div class=\"rst\">활동 하나: 지문 5번 걷기 도전이라는 작은 제목이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Try to walk over 20,000 steps</div><div class=\"k\">2만보 넘게 걷도록 노력해 보세요</div></div><div class=\"rc\"><div class=\"e\">during the weekend of the event</div><div class=\"k\">행사 주말 동안</div></div><div class=\"rc\"><div class=\"e\">to promote a clean environment.</div><div class=\"k\">깨끗한 환경을 장려하기 위해</div></div><div class=\"rnat\">깨끗한 환경을 장려하기 위해 행사 주말 동안 2만보 넘게 걷도록 노력해 보세요.</div><div class=\"rst\">주말 동안 2만보 넘게 걸어 보래요. 학원까지 걸어가면 금방 채우겠죠? = 지문 6번 → 선택지 ② 일치</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Selecting Sustainable Mobility:</div><div class=\"k\">지속 가능한 이동 선택하기:</div></div><div class=\"rnat\">지속 가능한 이동 선택하기:</div><div class=\"rst\">활동 둘: 지문 7번 지속 가능한 이동 선택하기라는 작은 제목이에요. 이제 활동은 두 개!</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">Use public transport or a bicycle</div><div class=\"k\">대중교통이나 자전거를 이용하세요</div></div><div class=\"rc\"><div class=\"e\">instead of your own car.</div><div class=\"k\">여러분 자신의 자동차 대신에</div></div><div class=\"rnat\">여러분 자신의 자동차 대신에 대중교통이나 자전거를 이용하세요.</div><div class=\"rst\">엄마 차 대신 버스나 자전거로 학교에 가요. = 지문 8번 대중교통·자전거 이용 → 선택지 ③ 일치</div></div><div class=\"rds key\" data-ord=\"9\"><span class=\"rn\">9번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">Participants who complete <span class=\"cw\">both activities</span></div><div class=\"k\"><span class=\"cw\">두 가지 활동(= 걷기 도전과 지속 가능한 이동 선택하기)을 모두</span> 완료한 참가자는</div></div><div class=\"rc\"><div class=\"e\">are qualified to apply for</div><div class=\"k\">~에 지원할 자격이 있습니다</div></div><div class=\"rc\"><div class=\"e\">the Sustainable Mobility Week Awards.</div><div class=\"k\">지속 가능한 이동 주간 상에</div></div><div class=\"rnat\">두 가지 활동을 모두 완료한 참가자는 지속 가능한 이동 주간 상에 지원할 자격이 있습니다.</div><div class=\"rst\">상을 받으려면 걷기도, 버스·자전거 타기도 <b>둘 다</b>(both) 해야 해요. 하나만 하면 안 돼요! = 지문 9번 → ④가 틀린 곳</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">Participants must register online.</div><div class=\"k\">참가자는 온라인으로 등록해야 합니다.</div></div><div class=\"rnat\">참가자는 온라인으로 등록해야 합니다.</div><div class=\"rst\">참가하려면 먼저 인터넷으로 신청해야 해요. = 지문 10번 온라인 등록 → 선택지 ⑤ 일치</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">www.sustainablemobilityweek.org</div><div class=\"k\">(행사 웹사이트 주소)</div></div><div class=\"rnat\">www.sustainablemobilityweek.org</div><div class=\"rst\">신청은 포스터 맨 아래 주소로 들어가서 해요. 지문 11번은 행사 웹사이트 주소예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"sustainable\" data-m=\"지속 가능한\"><b>sustainable</b>지속 가능한</button><button type=\"button\" class=\"wdb\" data-w=\"annual\" data-m=\"연례의, 매년의\"><b>annual</b>연례의, 매년의</button><button type=\"button\" class=\"wdb\" data-w=\"promote\" data-m=\"증진하다, 장려하다\"><b>promote</b>증진하다, 장려하다</button><button type=\"button\" class=\"wdb\" data-w=\"public transport\" data-m=\"대중교통\"><b>public transport</b>대중교통</button><button type=\"button\" class=\"wdb\" data-w=\"instead of\" data-m=\"~ 대신에\"><b>instead of</b>~ 대신에</button><button type=\"button\" class=\"wdb\" data-w=\"qualified\" data-m=\"자격이 있는\"><b>qualified</b>자격이 있는</button></div>", "08": "<p class=\"mtr\">마더텅 정답률 <b>50%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">삽입은 주어진 문장의 <b>연결 신호</b>를 잡는 문제예요. <b>also</b>(또한)는 앞에 결과가 하나 이미 나왔다는 뜻이고, 그 뒤엔 <b>behaviour</b>(행동)까지 묶어 정리하는 문장이 와야 해요.</p><div class=\"ck-step\"><span class=\"lab\">주어진 문장 · 연결 신호</span><div class=\"en\">It was <mark>also</mark> found that those students who expected the lecturer to be warm <mark>tended to interact with him more</mark>.</div><p class=\"ko\">강연자가 다정할 것이라고 예상한 학생들이 그와 더 많이 소통하는 경향이 있었다는 것이 <mark>또한</mark> 밝혀졌다.</p></div><div class=\"ck-via\"><i>▼</i><span>also(또한)가 받을 첫 번째 결과 = 인상의 차이</span></div><div class=\"ck-step\"><span class=\"lab\">6번 · 앞 문장 (⑤ 바로 앞)</span><div class=\"en\">As expected, there were <mark>large differences</mark> between the impressions formed by the students …</div><p class=\"ko\">예상대로, 학생들이 형성한 인상 사이에 <mark>큰 차이가 있었다</mark> …</p></div><div class=\"ck-via\"><i>▼</i><span>인상(6번) + 행동(주어진 문장) 두 결과를 한꺼번에 정리</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 · 뒤 문장 (⑤ 바로 뒤) · 결정적 단서</span><div class=\"en\">This shows that different expectations not only affect the impressions we form <mark>but also our behaviour</mark> and the relationship which is formed.</div><p class=\"ko\">이것은 서로 다른 기대가 우리가 형성하는 인상에 영향을 줄 뿐만 아니라 <mark>우리의 행동과</mark> 형성된 관계에도 영향을 준다는 것을 보여 준다.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>6번</em>결과 1: 처음 정보에 따라 인상이 크게 다름</span><span><em>주어진 문장</em>결과 2(also 또한): 다정하다고 들은 학생이 더 많이 소통함</span><span><em>7번</em>인상뿐 아니라 행동까지 영향 → 두 결과를 정리</span></div><div class=\"ck-eq\">⇒ 결과 1 → 결과 2 → 정리, 세 고리가 다 맞는 자리 = ⑤</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">6번 문장(As expected)과 7번 문장(This shows that) 사이<small>7번의 behaviour(행동)가 가리킬 “더 많이 소통함”이 바로 앞에 생겨요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">5번 문장과 6번 문장(As expected) 사이</span><span class=\"why\">토론 뒤라 그럴듯하지만, also(또한)는 앞에 결과가 하나 있어야 해요. 첫 결과인 6번 인상의 차이보다 먼저 나오면 안 돼요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">2번 문장과 3번 문장(In one study) 사이</span><span class=\"why\">아직 In one study(한 연구에서)로 실험이 시작되지도 않았어요. the lecturer(그 강연자)가 누구인지도 모르는 자리예요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">3번 문장과 4번 문장(Half the students) 사이</span><span class=\"why\">4번에서 warm(다정한)·cold(냉담한)로 나뉘기 전이라, 다정할 거라 예상한 학생들이 아직 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">4번 문장과 5번 문장(The guest lecturer then led) 사이</span><span class=\"why\">5번에서 토론을 이끌기 전이라, 강연자와 소통한 결과가 나올 수 없어요. then(그러고 나서)의 순서도 끊겨요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds key\" data-ord=\"1\"><span class=\"rn\">1번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">It was <span class=\"cw\">also</span> found</div><div class=\"k\"><span class=\"cw\">또한</span> 밝혀졌다</div></div><div class=\"rc\"><div class=\"e\">that those students</div><div class=\"k\">그 학생들이</div></div><div class=\"rc\"><div class=\"e\">who expected the lecturer to be warm</div><div class=\"k\">강연자가 다정할 것이라고 예상한</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">tended to interact with him more</span>.</div><div class=\"k\">그(= 강연자)와 <span class=\"cw\">더 많이 소통하는 경향이 있었다는 것이</span></div></div><div class=\"rnat\">[주어진 문장] 강연자가 다정할 것이라고 기대한 학생들이 그와 더 많이 소통하는 경향이 있다는 점도 밝혀졌다.</div><div class=\"rst\">〈주어진 문장〉 “다정한 쌤”이라고 들은 반 친구들은 쌤한테 질문도 <b>더 많이</b> 했어요. = 지문의 <b>also</b>(또한) 밝혀진 두 번째 결과.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">People commonly make the mistaken assumption</div><div class=\"k\">사람들은 흔히 잘못된 가정을 한다</div></div><div class=\"rc\"><div class=\"e\">that because a person has one type of characteristic,</div><div class=\"k\">어떤 사람이 한 가지 유형의 특성을 가지고 있기 때문에</div></div><div class=\"rc\"><div class=\"e\">then they automatically have other characteristics</div><div class=\"k\">그러면 그들이 자동적으로 다른 특성들도 가진다고</div></div><div class=\"rc\"><div class=\"e\">which go with it.</div><div class=\"k\">그것(= 그 한 가지 특성)과 어울리는</div></div><div class=\"rnat\">사람들은 어떤 사람에게 한 가지 특성이 있으면 그와 함께 가는 다른 특성들도 당연히 있으리라고 흔히 잘못 짐작한다.</div><div class=\"rst\">새 학기, 우리는 쌤이 친절하면 다른 것도 다 좋을 거라고 쉽게 믿어요. = 지문의 한 특성이 있으면 다른 특성도 있다는 잘못된 가정.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">In one study,</div><div class=\"k\">한 연구에서</div></div><div class=\"rc\"><div class=\"e\">university students were given descriptions of a guest lecturer</div><div class=\"k\">대학생들은 초청 강사에 대한 설명을 받았다</div></div><div class=\"rc\"><div class=\"e\">before he spoke to the group.</div><div class=\"k\">그(= 강사)가 그 집단(= 학생들)에게 강연을 하기 전에</div></div><div class=\"rnat\">한 연구에서, 대학생들에게 초청 강연자가 강연을 하기 전에 그에 대한 소개글을 주었다.</div><div class=\"rst\">새 쌤이 오기 전에 반 친구들이 쌤 소개 쪽지를 먼저 받았어요. = 지문의 강연 전에 받은 초청 강사 소개.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Half the students received a description</div><div class=\"k\">학생 절반은 설명을 받았다</div></div><div class=\"rc\"><div class=\"e\">containing the word ‘warm’,</div><div class=\"k\">'다정한'이라는 단어를 포함한</div></div><div class=\"rc\"><div class=\"e\">the other half were told</div><div class=\"k\">나머지 절반은 들었다</div></div><div class=\"rc\"><div class=\"e\">the speaker was ‘cold’.</div><div class=\"k\">강연자가 '냉담하다'고</div></div><div class=\"rnat\">학생 절반은 'warm(다정한)'이라는 단어가 들어간 소개를 받았고, 나머지 절반은 그 강연자가 'cold(냉담한)'하다는 말을 들었다.</div><div class=\"rst\">반은 “다정한 쌤”이라는 쪽지를, 나머지 반은 “차가운 쌤”이라는 쪽지를 받았어요. = 지문의 warm(다정한)과 cold(냉담한).</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">The guest lecturer then led a discussion,</div><div class=\"k\">초청 강사는 그러고 나서 토론을 이끌었다</div></div><div class=\"rc\"><div class=\"e\">after which the students were asked</div><div class=\"k\">그 토론(which = 앞의 토론)이 끝난 뒤 학생들은 요청받았다</div></div><div class=\"rc\"><div class=\"e\">to give their impressions of him.</div><div class=\"k\">그(= 강사)에 대한 인상을 말해 달라고</div></div><div class=\"rnat\">그 뒤 초청 강연자가 토론을 이끌었고, 토론이 끝난 뒤 학생들에게 그에 대한 인상을 말해 달라고 했다.</div><div class=\"rst\">쌤이 들어와 토론 수업을 하고, 끝난 뒤 “쌤 어땠어?” 하고 물었어요. = 지문의 토론 뒤 인상 묻기.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">As expected</span>,</div><div class=\"k\"><span class=\"cw\">예상대로</span></div></div><div class=\"rc\"><div class=\"e\">there were large differences</div><div class=\"k\">큰 차이가 있었다</div></div><div class=\"rc\"><div class=\"e\">between the impressions formed by the students,</div><div class=\"k\">학생들이 형성한 인상 사이에</div></div><div class=\"rc\"><div class=\"e\">depending upon their original information of the lecturer.</div><div class=\"k\">강연자에 대한 그들의 최초 정보에 따라</div></div><div class=\"rnat\">예상대로, 강연자에 대해 처음 받은 정보에 따라 학생들이 형성한 인상에는 큰 차이가 있었다.</div><div class=\"rst\">역시! 쪽지에 따라 쌤 느낌이 완전히 달랐어요. = 지문의 <b>As expected</b>(예상대로) 인상에 큰 차이, 첫 번째 결과예요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">This shows</div><div class=\"k\">이것은(= 위 실험 결과) 보여 준다</div></div><div class=\"rc\"><div class=\"e\">that different expectations</div><div class=\"k\">서로 다른 기대가</div></div><div class=\"rc\"><div class=\"e\">not only affect the impressions we form</div><div class=\"k\">우리가 형성하는 인상에 영향을 줄 뿐만 아니라</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">but also our behaviour</span> and the relationship which is formed.</div><div class=\"k\"><span class=\"cw\">우리의 행동과</span> 형성된 관계에도 (영향을 준다는 것을)</div></div><div class=\"rnat\">이는 서로 다른 기대가 우리가 형성하는 인상뿐 아니라 우리의 행동과 그로 인해 맺어지는 관계에까지 영향을 준다는 것을 보여 준다.</div><div class=\"rst\"><b>이것이 보여 주는 건</b>(This shows) 쪽지 한 장이 쌤 느낌뿐 아니라 <b>내 행동</b>과 사이까지 바꾼다는 거예요. = 지문의 인상·행동·관계.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"assumption\" data-m=\"가정, 추정\"><b>assumption</b>가정, 추정</button><button type=\"button\" class=\"wdb\" data-w=\"characteristic\" data-m=\"특성\"><b>characteristic</b>특성</button><button type=\"button\" class=\"wdb\" data-w=\"description\" data-m=\"설명, 묘사\"><b>description</b>설명, 묘사</button><button type=\"button\" class=\"wdb\" data-w=\"impression\" data-m=\"인상\"><b>impression</b>인상</button><button type=\"button\" class=\"wdb\" data-w=\"interact with\" data-m=\"~와 소통하다, 상호작용하다\"><b>interact with</b>~와 소통하다, 상호작용하다</button><button type=\"button\" class=\"wdb\" data-w=\"depending upon\" data-m=\"~에 따라\"><b>depending upon</b>~에 따라</button></div>", "09": "<p class=\"mtr\">마더텅 정답률 <b>70%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">무관한 문장은 <b>글 전체 화제</b>를 먼저 잡고 하나씩 대 보는 문제예요. 이 글의 화제는 <b>국경 없는 의사회</b>(MSF)가 하는 일이에요. 주어가 It(그것)·MSF(국경 없는 의사회)·this organization(이 단체)에서 <b>다른 것으로 바뀌는 문장</b>을 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">2번 · 글 전체의 생각</span><div class=\"en\">They believed that <mark>all people have the right to medical care</mark> regardless of race, religion, gender, and political belief.</div><p class=\"ko\">그들은 인종, 종교, 성별, 정치적 신념에 관계없이 <mark>모든 사람이 의료 서비스에 대한 권리가 있다고</mark> 믿었다.</p></div><div class=\"ck-via\"><i>▼</i><span>주어가 계속 It(그것)·MSF(국경 없는 의사회)로 이어지며 의사회가 하는 일을 나열</span></div><div class=\"ck-step\"><span class=\"lab\">①②③(3~5번) · 화제 이어 가기</span><div class=\"en\">A private, nonprofit organization, <mark>MSF</mark> is at the forefront of emergency health care …</div><p class=\"ko\">민간 비영리 단체인 <mark>MSF는</mark> 응급 의료 서비스의 선두에 있다 …</p></div><div class=\"ck-via\"><i>▼</i><span>주어가 Health care(의료 서비스)로 바뀌고, 의사회 소개가 아닌 일반론이 나옴</span></div><div class=\"ck-step key\"><span class=\"lab\">④(6번) · 이탈 지점</span><div class=\"en\">Health care, a primary concern of many people, <mark>is limited to developed countries</mark>.</div><p class=\"ko\">많은 사람들의 주된 관심사인 의료 서비스는 <mark>선진국에 국한되어 있다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>④를 빼면 ③의 의사회 활동 → ⑤의 this organization(이 단체) 활동으로 바로 이어짐</span></div><div class=\"ck-step\"><span class=\"lab\">⑤(7번) · 다시 제자리</span><div class=\"en\">Through longer-term programs, <mark>this organization</mark> treats chronic diseases … and brings health care to <mark>remote, isolated areas</mark> …</div><p class=\"ko\">보다 장기적인 프로그램을 통해 <mark>이 단체(= MSF)는</mark> 만성 질환을 치료한다 … 그리고 <mark>멀고 고립된 지역들에</mark> 의료 서비스를 가져다준다 …</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">많은 사람의 관심사인 의료 서비스는 선진국에 국한되어 있다<small>의사회가 하는 일이 아니라 일반론이고, 2번 ‘모든 사람의 권리’와도 부딪혀요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">장기 프로그램으로 만성 질환을 치료하고 외딴 지역에 의료를 전한다</span><span class=\"why\">‘자원이 한정된 지역’이라 ④와 비슷해 보이지만, 주어가 this organization(이 단체) = 의사회라서 의사회 활동 나열이 그대로 이어져요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">응급 의료 지원을 제공한 최초의 비정부 단체였다</span><span class=\"why\">주어 It(그것) = 1번의 의사회예요. 1·2번 설립 이야기에 이어 의사회가 어떤 단체인지 소개해요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">MSF는 응급 의료와 풍토병 환자 치료의 선두에 있다</span><span class=\"why\">주어가 MSF(국경 없는 의사회) 그대로이고, ①의 emergency medical assistance(응급 의료 지원)를 이어서 넓혀 말해요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">1차 진료, 수술, 영양 프로그램, 의료 인력 양성, 정신 건강 관리를 제공한다</span><span class=\"why\">주어 It(그것) = 의사회이고, 의사회가 하는 일을 하나씩 나열해요. 화제에서 벗어나지 않아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Doctors Without Borders,</div><div class=\"k\">국경 없는 의사회는</div></div><div class=\"rc\"><div class=\"e\">also known as Médecins Sans Frontières or MSF,</div><div class=\"k\">프랑스어 이름 Médecins Sans Frontières 또는 MSF로도 알려진</div></div><div class=\"rc\"><div class=\"e\">was founded in 1971</div><div class=\"k\">1971년에 설립되었다</div></div><div class=\"rc\"><div class=\"e\">by a small group of French doctors.</div><div class=\"k\">소규모 프랑스 의사 모임에 의해</div></div><div class=\"rnat\">국경없는의사회(Médecins Sans Frontières, MSF)는 1971년 소수의 프랑스 의사들이 세웠다.</div><div class=\"rst\">진로 시간에 ‘닮고 싶은 단체’ 발표를 맡았어요. 첫 장: 1971년 프랑스 의사 몇 명이 만든 국경 없는 의사회예요. = 지문 1번</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">They believed</div><div class=\"k\">그들은(= 프랑스 의사들) 믿었다</div></div><div class=\"rc ckc\"><div class=\"e\">that <span class=\"cw\">all people have the right to medical care</span></div><div class=\"k\"><span class=\"cw\">모든 사람이 의료 서비스에 대한 권리가 있다고</span></div></div><div class=\"rc\"><div class=\"e\">regardless of race, religion, gender, and political belief.</div><div class=\"k\">인종, 종교, 성별, 정치적 신념에 관계없이</div></div><div class=\"rnat\">그들은 인종, 종교, 성별, 정치적 신념과 상관없이 모든 사람에게 의료를 받을 권리가 있다고 믿었다.</div><div class=\"rst\">둘째 장: 그 의사들은 “누구나 아프면 치료받을 권리가 있다”고 믿었어요. = 지문 2번 <b>모든 사람의 의료 권리</b>.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">It was the first non-governmental organization</div><div class=\"k\">그것(= MSF)은 최초의 비정부 단체였다</div></div><div class=\"rc\"><div class=\"e\">to provide emergency medical assistance.</div><div class=\"k\">응급 의료 지원을 제공한</div></div><div class=\"rnat\">① 그것은 응급 의료 지원을 제공한 최초의 비정부기구였다.</div><div class=\"rst\">① 셋째 장: 정부 단체가 아닌데, 응급 의료 지원을 처음으로 한 곳이에요. = 지문 3번, 주어 It(그것) = 의사회라서 화제 그대로예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">A private, nonprofit organization,</div><div class=\"k\">민간 비영리 단체인</div></div><div class=\"rc\"><div class=\"e\">MSF is at the forefront of emergency health care</div><div class=\"k\">MSF는 응급 의료 서비스의 선두에 있다</div></div><div class=\"rc\"><div class=\"e\">as well as care for populations</div><div class=\"k\">뿐만 아니라 주민들에 대한 치료에서도</div></div><div class=\"rc\"><div class=\"e\">suffering from endemic diseases.</div><div class=\"k\">풍토병으로 고통받는</div></div><div class=\"rnat\">② 민간 비영리 단체인 MSF는 응급 의료뿐 아니라 풍토병에 시달리는 사람들을 돌보는 일에서도 맨 앞에 서 있다.</div><div class=\"rst\">② 넷째 장: 의사회는 응급 치료와 풍토병 환자 돌보기의 맨 앞에 있어요. = 지문 4번, 주어가 MSF(국경 없는 의사회)예요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">It provides primary health care,</div><div class=\"k\">그것(= MSF)은 1차 진료를 제공하고</div></div><div class=\"rc\"><div class=\"e\">performs surgery,</div><div class=\"k\">수술을 시행하고</div></div><div class=\"rc\"><div class=\"e\">runs nutrition programs,</div><div class=\"k\">영양 프로그램을 운영하고</div></div><div class=\"rc\"><div class=\"e\">trains local medical personnel,</div><div class=\"k\">지역 의료 인력을 양성하고</div></div><div class=\"rc\"><div class=\"e\">and provides mental health care.</div><div class=\"k\">정신 건강 관리를 제공한다</div></div><div class=\"rnat\">③ 이 단체는 1차 진료를 제공하고, 수술을 하고, 영양 프로그램을 운영하고, 현지 의료 인력을 훈련하고, 정신 건강 관리를 제공한다.</div><div class=\"rst\">③ 다섯째 장: 진료, 수술, 영양 프로그램, 현지 의료진 교육, 마음 치료까지 해요. = 지문 5번의 의사회가 하는 일 목록.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">Health care,</div><div class=\"k\">의료 서비스는</div></div><div class=\"rc\"><div class=\"e\">a primary concern of many people,</div><div class=\"k\">많은 사람들의 주된 관심사인</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">is limited to developed countries</span>.</div><div class=\"k\"><span class=\"cw\">선진국에 국한되어 있다</span></div></div><div class=\"rnat\">④ 많은 사람의 주된 관심사인 의료는 선진국에 국한되어 있다.</div><div class=\"rst\">④ 그런데 갑자기 “의료는 <b>잘사는 나라에만</b> 있다”는 장이 끼어 있어요. = 지문 6번, 의사회 소개가 아니고 2번과도 부딪혀요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Through longer-term programs,</div><div class=\"k\">보다 장기적인 프로그램을 통해</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">this organization</span> treats chronic diseases</div><div class=\"k\"><span class=\"cw\">이 단체(= MSF)는</span> 만성 질환을 치료한다</div></div><div class=\"rc\"><div class=\"e\">such as malaria, sleeping sickness, and AIDS;</div><div class=\"k\">말라리아, 수면병, 에이즈와 같은</div></div><div class=\"rc ckc\"><div class=\"e\">and brings health care to <span class=\"cw\">remote, isolated areas</span></div><div class=\"k\">그리고 <span class=\"cw\">멀고 고립된 지역들에</span> 의료 서비스를 가져다준다</div></div><div class=\"rc\"><div class=\"e\">where resources and training are limited.</div><div class=\"k\">그곳은 자원과 교육이 한정되어 있다</div></div><div class=\"rnat\">⑤ 이 단체는 장기 프로그램을 통해 말라리아·수면병·에이즈 같은 만성 질환을 치료하고, 자원과 교육이 부족한 외지고 고립된 지역까지 의료를 전한다.</div><div class=\"rst\">⑤ 마지막 장: <b>이 단체</b>(this organization)는 만성병을 치료하고 먼 외딴 마을까지 찾아가요. = 지문 7번, 다시 의사회 이야기예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"regardless of\" data-m=\"~에 상관없이\"><b>regardless of</b>~에 상관없이</button><button type=\"button\" class=\"wdb\" data-w=\"non-governmental organization\" data-m=\"비정부 기구\"><b>non-governmental organization</b>비정부 기구</button><button type=\"button\" class=\"wdb\" data-w=\"forefront\" data-m=\"선두, 최전선\"><b>forefront</b>선두, 최전선</button><button type=\"button\" class=\"wdb\" data-w=\"endemic diseases\" data-m=\"풍토병\"><b>endemic diseases</b>풍토병</button><button type=\"button\" class=\"wdb\" data-w=\"chronic diseases\" data-m=\"만성 질환\"><b>chronic diseases</b>만성 질환</button><button type=\"button\" class=\"wdb\" data-w=\"isolated\" data-m=\"고립된\"><b>isolated</b>고립된</button></div>", "10": "<p class=\"mtr\">마더텅 정답률 <b>65%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">장문 순서는 <b>사건의 고리</b>를 이어 붙이는 문제예요. 벤치에 앉은 대표 앞에 노인 등장 → 받은 <b>수표</b> 확인 → 약속한 <b>1년 뒤</b> 순으로 이어 붙이세요.</p><div class=\"ck-step\"><span class=\"lab\">(A) 끝 · 3번</span><div class=\"en\">One day, (a) <mark>he sat on a park bench</mark>, head in hands, wondering if anything could save his company from bankruptcy.</div><p class=\"ko\">어느 날 그는 파산에서 회사를 구할 무언가가 있을지 생각하며, 손으로 머리를 감싼 채 <mark>공원 벤치에 앉아 있었다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>before him(그의 앞에) = 벤치에 앉아 있던 대표 앞</span></div><div class=\"ck-step key\"><span class=\"lab\">(D) · 첫 번째 고리</span><div class=\"en\"><mark>Suddenly an old man appeared</mark> before him.</div><p class=\"ko\"><mark>갑자기</mark> 그의 앞에 <mark>한 노인이 나타났다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>(D) 7번에서 노인이 wrote out a check(수표를 써서) 손에 쥐여 줌 → 그 수표를 확인</span></div><div class=\"ck-step key\"><span class=\"lab\">(B) · 두 번째 고리</span><div class=\"en\">The executive saw in his hand <mark>a check for $500,000</mark>, signed by John D. Rockefeller …</div><p class=\"ko\">대표는 자신의 손에 있는, John D. Rockefeller가 서명한 <mark>50만 달러짜리 수표를</mark> 보았다 …</p></div><div class=\"ck-via\"><i>▼</i><span>(D) 9번 exactly one year from today(오늘로부터 정확히 1년 뒤) 약속의 날</span></div><div class=\"ck-step key\"><span class=\"lab\">(C) · 세 번째 고리</span><div class=\"en\"><mark>Exactly one year later</mark>, (c) he returned to the park with the check.</div><p class=\"ko\"><mark>정확히 1년 뒤에</mark> 그는 그 수표를 가지고 공원으로 돌아갔다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">(D) – (B) – (C)<small>노인 등장 → 수표 확인 → 1년 뒤, 세 고리가 모두 맞아요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">(D) – (C) – (B)</span><span class=\"why\">(D) 9번의 1년 약속 뒤라 (C)가 그럴듯하지만, (C)에서 이미 the check(그 수표)를 들고 가요. 수표를 처음 보고 금고에 넣는 (B)가 먼저예요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">(B) – (D) – (C)</span><span class=\"why\">(A) 바로 뒤 (B)에서 손에 수표가 있어요. 수표를 준 노인은 (D)에서야 나타나니 순서가 거꾸로예요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">(C) – (B) – (D)</span><span class=\"why\">(C)의 Exactly one year later(정확히 1년 뒤)가 맨 앞이면, 무엇으로부터 1년인지 몰라요. 약속은 (D)에 있어요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">(C) – (D) – (B)</span><span class=\"why\">(A) 바로 뒤에 1년 뒤 공원 장면이 나와요. 들고 갈 the check(그 수표)도, 약속한 노인도 아직 없어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">There was a business executive</div><div class=\"k\">한 회사 대표가 있었다</div></div><div class=\"rc\"><div class=\"e\">who was deep in debt</div><div class=\"k\">빚에 깊이 빠져 있는</div></div><div class=\"rc\"><div class=\"e\">and could see no way out.</div><div class=\"k\">그리고 탈출구가 보이지 않는</div></div><div class=\"rnat\">(A)(1) 빚에 깊이 빠져 있어서(많은 빚을 져서) 탈출구를 찾을 수 없었던 한 회사 대표가 있었다.</div><div class=\"rst\">한 회사 사장님이 빚더미에 앉아 빠져나갈 길이 안 보여요. = 지문 1번, 이야기의 주인공이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">He couldn’t borrow more money from any bank,</div><div class=\"k\">그는 어떤 은행에서도 돈을 더 빌릴 수 없었고</div></div><div class=\"rc\"><div class=\"e\">and couldn’t pay his suppliers.</div><div class=\"k\">공급업체에 돈을 지불할 수도 없었다</div></div><div class=\"rnat\">(A)(2) 그는 어떤 은행에서도 돈을 더 빌릴 수 없었고 공급업체에 돈을 지불할 수도 없었다.</div><div class=\"rst\">은행은 더 이상 돈을 안 빌려주고, 거래처에 줄 돈도 없어요. = 지문 2번</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">One day,</div><div class=\"k\">어느 날</div></div><div class=\"rc ckc\"><div class=\"e\">(a) <span class=\"cw\">he sat on a park bench</span>,</div><div class=\"k\">(a)그(= 회사 대표)는 <span class=\"cw\">공원 벤치에 앉아 있었다</span></div></div><div class=\"rc\"><div class=\"e\">head in hands,</div><div class=\"k\">손으로 머리를 감싼 채</div></div><div class=\"rc\"><div class=\"e\">wondering if anything could save his company</div><div class=\"k\">무엇이든 그의 회사를 구할 수 있을지 생각하면서</div></div><div class=\"rc\"><div class=\"e\">from bankruptcy.</div><div class=\"k\">파산으로부터</div></div><div class=\"rnat\">(A)(3) 어느 날, (a)그(회사 대표)는 어떤 것이 그의 회사를 파산으로부터 구할 수 있을지를 생각하면서 손으로 머리를 감싸고 공원 벤치에 앉아 있었다.</div><div class=\"rst\">어느 날 사장님은 공원 벤치에서 머리를 감싸 쥐고 “회사를 살릴 방법이 없을까?” 고민해요. = 지문 3번, (A)의 끝</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Suddenly an old man appeared</span></div><div class=\"k\"><span class=\"cw\">갑자기 한 노인이 나타났다</span></div></div><div class=\"rc\"><div class=\"e\">before him.</div><div class=\"k\">그(= 회사 대표)의 앞에</div></div><div class=\"rnat\">(D)(1) 갑자기 그의 앞에 한 노인이 나타났다.</div><div class=\"rst\"><b>갑자기</b>(Suddenly) 한 노인이 사장님 앞에 나타나요. = 지문 4번, 벤치의 사장님 앞이라 (D)가 (A) 바로 뒤예요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">“I can see</div><div class=\"k\">'알겠군요</div></div><div class=\"rc\"><div class=\"e\">that something is troubling you,”</div><div class=\"k\">무엇인가가 당신을 괴롭히고 있다는 것을'</div></div><div class=\"rc\"><div class=\"e\">he said.</div><div class=\"k\">그(= 노인)가 말했다</div></div><div class=\"rnat\">(D)(2) \"무엇인가가 당신을 괴롭히고 있다는 것을 알겠군요.\"라고 그가 말했다.</div><div class=\"rst\">노인이 “무슨 걱정이 있으신가 봐요.” 하고 말을 걸어요. = 지문 5번, 말하는 사람은 노인이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">After listening to the executive’s worries,</div><div class=\"k\">대표의 걱정을 듣고 나서</div></div><div class=\"rc\"><div class=\"e\">the old man said,</div><div class=\"k\">그 노인은 말했다</div></div><div class=\"rc\"><div class=\"e\">“I believe I can help you.”</div><div class=\"k\">'제가 당신을 도울 수 있다고 믿습니다(도울 수 있을 것 같군요).'</div></div><div class=\"rnat\">(D)(3) 그 대표의 걱정을 듣고 나서, 그 노인은 \"제가 당신을 도울 수 있다고 믿습니다(도울 수 있을 것 같군요).\"라고 말했다.</div><div class=\"rst\">사장님의 걱정을 다 들은 노인이 “제가 도울 수 있을 것 같아요.” 해요. = 지문 6번, 사장님이 고민을 털어놓은 거예요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">(e) He asked the man his name,</div><div class=\"k\">(e)그(= 노인)는 그 남자(= 회사 대표)에게 이름을 물었고</div></div><div class=\"rc\"><div class=\"e\">wrote out a check,</div><div class=\"k\">수표를 써서</div></div><div class=\"rc\"><div class=\"e\">and pushed it into his hand.</div><div class=\"k\">그것(= 수표)을 그(= 회사 대표)의 손에 밀어 넣었다(쥐여 주었다)</div></div><div class=\"rnat\">(D)(4) (e)그(노인)는 그 남자에게 이름을 물었고, 수표를 써서 그의 손에 밀어 넣었다(쥐여 주었다).</div><div class=\"rst\">노인은 사장님 이름을 묻고 <b>수표</b>를 써서 손에 쥐여 줘요. = 지문 7번, 주는 사람 = 노인, 받는 사람 = 사장님.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">He said,</div><div class=\"k\">그(= 노인)는 말했다</div></div><div class=\"rc\"><div class=\"e\">“Take this money.</div><div class=\"k\">'이 돈을 가져가세요.</div></div><div class=\"rnat\">(D)(5) 그는 \"이 돈을 가져가세요.</div><div class=\"rst\">“이 돈을 가져가세요.” = 지문 8번, 노인이 하는 말이에요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">Meet me here</div><div class=\"k\">여기서 저와 만나요</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">exactly one year from today,</span></div><div class=\"k\"><span class=\"cw\">오늘로부터 정확히 1년 뒤에</span></div></div><div class=\"rc\"><div class=\"e\">and you can pay me back</div><div class=\"k\">그러면 저에게 갚으면 됩니다</div></div><div class=\"rc\"><div class=\"e\">at that time.”</div><div class=\"k\">그때</div></div><div class=\"rnat\">(D)(6) 오늘로부터 정확히 1년 뒤에 여기서 나와 만나서 그때 나에게 돈을 갚으면 됩니다.\"라고 말했다.</div><div class=\"rst\">“<b>딱 1년 뒤</b> 여기서 만나요. 그때 갚으면 돼요.” = 지문 9번, 1년 뒤 약속이 생겨요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">Then he turned</div><div class=\"k\">그러고 나서 그(= 노인)는 돌아섰고</div></div><div class=\"rc\"><div class=\"e\">and disappeared</div><div class=\"k\">사라졌다</div></div><div class=\"rc\"><div class=\"e\">as quickly as he had come.</div><div class=\"k\">그가 왔던 것만큼이나 빠르게</div></div><div class=\"rnat\">(D)(7) 그러고 나서 그는 돌아섰고 그가 왔던 것만큼이나 빠르게 사라졌다.</div><div class=\"rst\">그러고는 노인이 올 때처럼 순식간에 사라져요. = 지문 10번, 노인이 떠나요.</div></div><div class=\"rds key\" data-ord=\"11\"><span class=\"rn\">11번 · 단서</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">The executive saw in his hand</div><div class=\"k\">대표는 자신의 손에 있는 것을 보았다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">a check for $500,000,</span></div><div class=\"k\"><span class=\"cw\">50만 달러짜리 수표를</span></div></div><div class=\"rc\"><div class=\"e\">signed by John D. Rockefeller,</div><div class=\"k\">John D. Rockefeller가 서명한</div></div><div class=\"rc\"><div class=\"e\">then one of the richest men in the world!</div><div class=\"k\">당시 세계에서 가장 부유한 사람 중 하나인</div></div><div class=\"rnat\">(B)(1) 그 대표는 그 당시에 세계에서 가장 부유한 사람 중 하나인 John D. Rockefeller의 서명이 있는 50만 달러짜리 수표가 그의 손에 있는 것을 보았다!</div><div class=\"rst\">(B) 시작: 손을 펴 보니 (D)에서 받은 그 수표, 록펠러(Rockefeller)가 서명한 50만 달러예요! = 지문 11번</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">“I can erase my money worries</div><div class=\"k\">'나는 돈 걱정을 없앨 수 있어</div></div><div class=\"rc\"><div class=\"e\">in an instant!”</div><div class=\"k\">당장!'</div></div><div class=\"rc\"><div class=\"e\">he thought.</div><div class=\"k\">그는 생각했다</div></div><div class=\"rnat\">(B)(2) 그는 \"나는 당장 돈 걱정을 완전히 없애버릴 수 있어!\"라고 생각했다.</div><div class=\"rst\">“이거면 돈 걱정이 당장 끝나!” 사장님이 속으로 생각해요. = 지문 12번</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">13번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">But instead,</div><div class=\"k\">하지만 그 대신</div></div><div class=\"rc\"><div class=\"e\">the executive decided</div><div class=\"k\">대표는 결심했다</div></div><div class=\"rc\"><div class=\"e\">to put the check in his safe.</div><div class=\"k\">수표를 그의 금고 안에 넣어두기로</div></div><div class=\"rnat\">(B)(3) 하지만 그 대신 그 대표는 수표를 그의 금고 안에 넣어두기로 결심했다.</div><div class=\"rst\"><b>하지만</b>(But instead) 사장님은 수표를 쓰지 않고 금고에 넣어 두기로 해요. = 지문 13번</div></div><div class=\"rds\" data-ord=\"14\"><span class=\"rn\">14번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">Just knowing it was there</div><div class=\"k\">단지 그것(= 수표)이 거기(= 금고) 있다는 것을 아는 것이</div></div><div class=\"rc\"><div class=\"e\">might give him the strength</div><div class=\"k\">그에게 힘을 줄지도 모른다</div></div><div class=\"rc\"><div class=\"e\">to work out a way</div><div class=\"k\">방법을 생각해 낼</div></div><div class=\"rc\"><div class=\"e\">to save (b) his business,</div><div class=\"k\">(b)그(= 회사 대표)의 사업을 구할</div></div><div class=\"rc\"><div class=\"e\">he thought.</div><div class=\"k\">그는 생각했다</div></div><div class=\"rnat\">(B)(4) 그는 단지 그것(수표)이 거기(금고) 있다는 것을 아는 것이 그에게 (b)그(회사 대표)의 회사를 구할 방법을 생각해 낼 힘을 줄지도 모른다고 생각했다.</div><div class=\"rst\">“금고에 수표가 있다는 것만 알아도 회사를 살릴 힘이 날 거야.” = 지문 14번</div></div><div class=\"rds\" data-ord=\"15\"><span class=\"rn\">15번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">Within a few months,</div><div class=\"k\">몇 달 안에</div></div><div class=\"rc\"><div class=\"e\">he was out of debt</div><div class=\"k\">그는 빚에서 벗어났고</div></div><div class=\"rc\"><div class=\"e\">and making money once again.</div><div class=\"k\">다시 돈을 벌고 있었다</div></div><div class=\"rnat\">(B)(5) 몇 달 안에 그는 빚에서 벗어났고 다시 돈을 벌고 있었다.</div><div class=\"rst\">몇 달 만에 사장님은 빚에서 벗어나 다시 돈을 벌어요. 수표는 한 번도 안 썼는데요! = 지문 15번</div></div><div class=\"rds key\" data-ord=\"16\"><span class=\"rn\">16번 · 단서</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Exactly one year later,</span></div><div class=\"k\"><span class=\"cw\">정확히 1년 뒤에</span></div></div><div class=\"rc\"><div class=\"e\">(c) he returned to the park</div><div class=\"k\">(c)그(= 회사 대표)는 공원으로 돌아갔다</div></div><div class=\"rc\"><div class=\"e\">with the check.</div><div class=\"k\">그 수표를 가지고</div></div><div class=\"rnat\">(C)(1) 정확히 1년 뒤에 (c)그(회사 대표)는 그 수표를 가지고 공원으로 돌아갔다.</div><div class=\"rst\">(C) 시작: <b>딱 1년 뒤</b>(Exactly one year later), 사장님이 그 수표를 들고 공원에 가요. = 9번 약속의 날, 지문 16번</div></div><div class=\"rds\" data-ord=\"17\"><span class=\"rn\">17번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">At the agreed-upon time,</div><div class=\"k\">약속한(합의된) 시간에</div></div><div class=\"rc\"><div class=\"e\">the old man appeared.</div><div class=\"k\">그 노인이 나타났다</div></div><div class=\"rnat\">(C)(2) 합의된(약속한) 시간에 그 노인이 나타났다.</div><div class=\"rst\">약속한 시간에 노인이 나타나요. = 지문 17번, 9번의 약속이 지켜지는 순간이에요.</div></div><div class=\"rds\" data-ord=\"18\"><span class=\"rn\">18번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">But just then,</div><div class=\"k\">하지만 바로 그때</div></div><div class=\"rc\"><div class=\"e\">a nurse came running up</div><div class=\"k\">한 간호사가 달려와서</div></div><div class=\"rc\"><div class=\"e\">and grabbed the old man.</div><div class=\"k\">그 노인을 붙잡았다</div></div><div class=\"rnat\">(C)(3) 하지만 바로 그때, 한 간호사가 달려와서 그 노인을 붙잡았다.</div><div class=\"rst\"><b>그런데 바로 그때</b> 간호사가 달려와 노인을 붙잡아요. = 지문 18번, 반전이 시작돼요.</div></div><div class=\"rds\" data-ord=\"19\"><span class=\"rn\">19번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">“I hope</div><div class=\"k\">'바랍니다</div></div><div class=\"rc\"><div class=\"e\">he hasn’t been bothering you.</div><div class=\"k\">그(= 노인)가 당신을 성가시게 하지 않았기를</div></div><div class=\"rnat\">(C)(4) \"그가 당신을 성가시게 하지 않았기를 바랍니다.</div><div class=\"rst\">간호사가 “이분이 귀찮게 하지 않으셨길 바라요.” 해요. = 지문 19번, 그(he) = 노인이에요.</div></div><div class=\"rds\" data-ord=\"20\"><span class=\"rn\">20번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">He’s always escaping from the rest home</div><div class=\"k\">그는 항상 요양원을 탈출해서</div></div><div class=\"rc\"><div class=\"e\">and telling people</div><div class=\"k\">사람들에게 말합니다</div></div><div class=\"rc\"><div class=\"e\">he’s John D. Rockefeller,”</div><div class=\"k\">그가 John D. Rockefeller라고</div></div><div class=\"rc\"><div class=\"e\">the nurse said.</div><div class=\"k\">그 간호사가 말했다</div></div><div class=\"rnat\">(C)(5) 그는 항상 요양원을 탈출해서 사람들에게 그가 John D. Rockefeller라고 말합니다.\"라고 그 간호사가 말했다.</div><div class=\"rst\">“이분은 늘 요양원을 빠져나와 자기가 록펠러(Rockefeller)라고 하세요.” = 지문 20번, 간호사가 알려 준 노인 이야기예요.</div></div><div class=\"rds\" data-ord=\"21\"><span class=\"rn\">21번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">The surprised executive just stood there.</div><div class=\"k\">놀란 대표는 그저 거기에 서 있었다</div></div><div class=\"rnat\">(C)(6) 놀란 대표는 그저 거기에 서 있었다.</div><div class=\"rst\">깜짝 놀란 사장님은 그 자리에 멍하니 서 있어요. = 지문 21번</div></div><div class=\"rds\" data-ord=\"22\"><span class=\"rn\">22번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">Suddenly,</div><div class=\"k\">갑자기</div></div><div class=\"rc\"><div class=\"e\">(d) he realized</div><div class=\"k\">(d)그(= 회사 대표)는 깨달았다</div></div><div class=\"rc\"><div class=\"e\">that it wasn’t the money, real or imagined,</div><div class=\"k\">그 돈이 아니었다는 것을, 진짜이든 상상된 것이든</div></div><div class=\"rc\"><div class=\"e\">that had turned his life around.</div><div class=\"k\">그의 인생을 뒤바꾼 것은</div></div><div class=\"rnat\">(C)(7) 갑자기 (d)그(회사 대표)는 자신의 인생을 뒤바꾼 것이 진짜이든 상상된 것이든 그 돈이 아니었다는 것을 깨달았다.</div><div class=\"rst\">그때 사장님이 깨달아요. 인생을 바꾼 건 진짜든 가짜든 <b>돈이 아니었다</b>는 걸요. = 지문 22번</div></div><div class=\"rds\" data-ord=\"23\"><span class=\"rn\">23번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">It was his newfound self-confidence</div><div class=\"k\">그것은 그의 새로 발견한 자신감이었다</div></div><div class=\"rc\"><div class=\"e\">that enabled him to achieve</div><div class=\"k\">그가 성취할 수 있게 해 준</div></div><div class=\"rc\"><div class=\"e\">anything he went after.</div><div class=\"k\">그가 추구했던 무엇이든</div></div><div class=\"rnat\">(C)(8) 그가 추구했던 어떤 것이든 성취할 수 있도록 해 주었던 것은 새로 발견한 그의 자신감이었다.</div><div class=\"rst\">바로 새로 찾은 <b>자신감</b>이 원하는 걸 다 이루게 해 준 거예요. = 지문 23번, 이야기의 결론이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"deep in debt\" data-m=\"빚더미에 앉은\"><b>deep in debt</b>빚더미에 앉은</button><button type=\"button\" class=\"wdb\" data-w=\"bankruptcy\" data-m=\"파산\"><b>bankruptcy</b>파산</button><button type=\"button\" class=\"wdb\" data-w=\"write out a check\" data-m=\"수표를 쓰다\"><b>write out a check</b>수표를 쓰다</button><button type=\"button\" class=\"wdb\" data-w=\"safe\" data-m=\"금고\"><b>safe</b>금고</button><button type=\"button\" class=\"wdb\" data-w=\"out of debt\" data-m=\"빚에서 벗어난\"><b>out of debt</b>빚에서 벗어난</button><button type=\"button\" class=\"wdb\" data-w=\"rest home\" data-m=\"요양원\"><b>rest home</b>요양원</button></div>", "11": "<p class=\"mtr\">마더텅 정답률 <b>65%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">지칭 문제는 대명사마다 <b>바로 앞 문장의 주어</b>와 <b>주고받는 방향</b>을 확인하세요. (e)는 수표를 <b>주는 쪽</b>이라 받는 사람인 사장님일 수 없어요.</p><div class=\"ck-step\"><span class=\"lab\">(a) · 3번 문장</span><div class=\"en\">One day, <mark>(a) he sat on a park bench</mark>, head in hands, wondering if anything could save his company …</div><p class=\"ko\">어느 날 <mark>(a)그(= 회사 대표)는</mark> 공원 벤치에 앉아 있었다 … 회사를 구할 수 있을지 생각하면서 → 빚에 빠진 사장님</p></div><div class=\"ck-via\"><i>▼</i><span>수표를 금고에 넣은 사람이 구하려는 사업 = 사장님 회사</span></div><div class=\"ck-step\"><span class=\"lab\">(b) · 14번 문장</span><div class=\"en\">Just knowing it was there might give him the strength to work out a way <mark>to save (b) his business</mark>, he thought.</div><p class=\"ko\">수표가 거기 있다는 것만 알아도 <mark>(b)그(= 회사 대표)의 사업을 구할</mark> 방법을 찾을 힘이 생길지 모른다 → 사장님</p></div><div class=\"ck-via\"><i>▼</i><span>1년 뒤 수표를 들고 돌아온 사람 = 수표를 받은 사장님</span></div><div class=\"ck-step\"><span class=\"lab\">(c) · 16번 문장</span><div class=\"en\">Exactly one year later, <mark>(c) he returned to the park</mark> with the check.</div><p class=\"ko\">정확히 1년 뒤에 <mark>(c)그(= 회사 대표)는 공원으로 돌아갔다</mark> 그 수표를 가지고 → 사장님</p></div><div class=\"ck-via\"><i>▼</i><span>21번 The surprised executive(놀란 대표)가 바로 앞 주어</span></div><div class=\"ck-step\"><span class=\"lab\">(d) · 22번 문장</span><div class=\"en\">Suddenly, <mark>(d) he realized</mark> that it wasn’t the money, real or imagined, that had turned his life around.</div><p class=\"ko\">갑자기 <mark>(d)그(= 회사 대표)는 깨달았다</mark> 그의 인생을 뒤바꾼 것은 돈이 아니었다는 것을 → 사장님</p></div><div class=\"ck-via\"><i>▼</i><span>6번 주어 the old man(그 노인) + 이름을 묻고 수표를 써 주는 쪽</span></div><div class=\"ck-step key\"><span class=\"lab\">(e) · 7번 문장 · 결정적 단서</span><div class=\"en\"><mark>(e) He asked the man his name</mark>, wrote out a check, and pushed it into his hand.</div><p class=\"ko\"><mark>(e)그(= 노인)는 그 남자(= 회사 대표)에게 이름을 물었고</mark>, 수표를 써서 그의 손에 쥐여 주었다 → 노인</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">(e) He 그 = 노인<small>바로 앞 6번 주어가 노인이고, 수표를 주는 쪽이라 노인이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">(d) he 그 = 사장님</span><span class=\"why\">18~20번에 노인·간호사가 나와 헷갈리지만, 21번 The surprised executive(놀란 대표)가 바로 앞 주어예요. 인생이 바뀐 사람도 사장님이에요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">(a) he 그 = 사장님</span><span class=\"why\">1·2번 빚에 빠진 사장님 이야기가 이어져요. 회사를 파산에서 구하고 싶은 사람이니 사장님이에요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">(b) his 그의 = 사장님</span><span class=\"why\">13번 주어가 the executive(대표)이고, 14번은 그가 수표를 금고에 넣으며 한 생각이에요. 구하려는 사업도 사장님 회사예요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">(c) he 그 = 사장님</span><span class=\"why\">수표를 들고 공원에 돌아간 사람이에요. 수표를 받은 쪽은 사장님이고, 17번에서 노인은 따로 나타나요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">There was a business executive</div><div class=\"k\">한 회사 대표가 있었다</div></div><div class=\"rc\"><div class=\"e\">who was deep in debt</div><div class=\"k\">빚에 깊이 빠져 있는</div></div><div class=\"rc\"><div class=\"e\">and could see no way out.</div><div class=\"k\">그리고 탈출구가 보이지 않는</div></div><div class=\"rnat\">(A)(1) 빚에 깊이 빠져 있어서(많은 빚을 져서) 탈출구를 찾을 수 없었던 한 회사 대표가 있었다.</div><div class=\"rst\">한 회사 사장님이 빚더미에 앉아 빠져나갈 길이 안 보여요. = 지문 1번, 이야기의 주인공이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">He couldn’t borrow more money from any bank,</div><div class=\"k\">그는 어떤 은행에서도 돈을 더 빌릴 수 없었고</div></div><div class=\"rc\"><div class=\"e\">and couldn’t pay his suppliers.</div><div class=\"k\">공급업체에 돈을 지불할 수도 없었다</div></div><div class=\"rnat\">(A)(2) 그는 어떤 은행에서도 돈을 더 빌릴 수 없었고 공급업체에 돈을 지불할 수도 없었다.</div><div class=\"rst\">은행은 더 이상 돈을 안 빌려주고, 거래처에 줄 돈도 없어요. = 지문 2번</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">One day,</div><div class=\"k\">어느 날</div></div><div class=\"rc\"><div class=\"e\">(a) he sat on a park bench,</div><div class=\"k\">(a)그(= 회사 대표)는 공원 벤치에 앉아 있었다</div></div><div class=\"rc\"><div class=\"e\">head in hands,</div><div class=\"k\">손으로 머리를 감싼 채</div></div><div class=\"rc\"><div class=\"e\">wondering if anything could save his company</div><div class=\"k\">무엇이든 그의 회사를 구할 수 있을지 생각하면서</div></div><div class=\"rc\"><div class=\"e\">from bankruptcy.</div><div class=\"k\">파산으로부터</div></div><div class=\"rnat\">(A)(3) 어느 날, (a)그(회사 대표)는 어떤 것이 그의 회사를 파산으로부터 구할 수 있을지를 생각하면서 손으로 머리를 감싸고 공원 벤치에 앉아 있었다.</div><div class=\"rst\">어느 날 사장님은 공원 벤치에서 머리를 감싸 쥐고 “회사를 살릴 방법이 없을까?” 고민해요. = 지문 3번, (a) 그 = 사장님</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Suddenly an old man appeared</div><div class=\"k\">갑자기 한 노인이 나타났다</div></div><div class=\"rc\"><div class=\"e\">before him.</div><div class=\"k\">그(= 회사 대표)의 앞에</div></div><div class=\"rnat\">(D)(1) 갑자기 그의 앞에 한 노인이 나타났다.</div><div class=\"rst\"><b>갑자기</b>(Suddenly) 한 노인이 사장님 앞에 나타나요. = 지문 4번, 새 인물이 등장해요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">“I can see</div><div class=\"k\">'알겠군요</div></div><div class=\"rc\"><div class=\"e\">that something is troubling you,”</div><div class=\"k\">무엇인가가 당신을 괴롭히고 있다는 것을'</div></div><div class=\"rc\"><div class=\"e\">he said.</div><div class=\"k\">그(= 노인)가 말했다</div></div><div class=\"rnat\">(D)(2) \"무엇인가가 당신을 괴롭히고 있다는 것을 알겠군요.\"라고 그가 말했다.</div><div class=\"rst\">노인이 “무슨 걱정이 있으신가 봐요.” 하고 말을 걸어요. = 지문 5번, 말하는 사람은 노인이에요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">After listening to the executive’s worries,</div><div class=\"k\">대표의 걱정을 듣고 나서</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">the old man said,</span></div><div class=\"k\"><span class=\"cw\">그 노인은 말했다</span></div></div><div class=\"rc\"><div class=\"e\">“I believe I can help you.”</div><div class=\"k\">'제가 당신을 도울 수 있다고 믿습니다(도울 수 있을 것 같군요).'</div></div><div class=\"rnat\">(D)(3) 그 대표의 걱정을 듣고 나서, 그 노인은 \"제가 당신을 도울 수 있다고 믿습니다(도울 수 있을 것 같군요).\"라고 말했다.</div><div class=\"rst\">사장님의 걱정을 다 들은 노인이 “제가 도울 수 있을 것 같아요.” 해요. = 지문 6번, 사장님이 고민을 털어놓은 거예요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">(e) He asked the man his name,</span></div><div class=\"k\"><span class=\"cw\">(e)그(= 노인)는 그 남자(= 회사 대표)에게 이름을 물었고</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">wrote out a check,</span></div><div class=\"k\"><span class=\"cw\">수표를 써서</span></div></div><div class=\"rc\"><div class=\"e\">and pushed it into his hand.</div><div class=\"k\">그것(= 수표)을 그(= 회사 대표)의 손에 밀어 넣었다(쥐여 주었다)</div></div><div class=\"rnat\">(D)(4) (e)그(노인)는 그 남자에게 이름을 물었고, 수표를 써서 그의 손에 밀어 넣었다(쥐여 주었다).</div><div class=\"rst\"><b>(e) 그</b>는 사장님 이름을 묻고 수표를 써서 쥐여 줘요. 바로 앞 6번 주어가 노인이니 <b>(e) 그 = 노인</b>! = 지문 7번</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">He said,</div><div class=\"k\">그(= 노인)는 말했다</div></div><div class=\"rc\"><div class=\"e\">“Take this money.</div><div class=\"k\">'이 돈을 가져가세요.</div></div><div class=\"rnat\">(D)(5) 그는 \"이 돈을 가져가세요.</div><div class=\"rst\">“이 돈을 가져가세요.” = 지문 8번, 노인이 하는 말이에요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">Meet me here</div><div class=\"k\">여기서 저와 만나요</div></div><div class=\"rc\"><div class=\"e\">exactly one year from today,</div><div class=\"k\">오늘로부터 정확히 1년 뒤에</div></div><div class=\"rc\"><div class=\"e\">and you can pay me back</div><div class=\"k\">그러면 저에게 갚으면 됩니다</div></div><div class=\"rc\"><div class=\"e\">at that time.”</div><div class=\"k\">그때</div></div><div class=\"rnat\">(D)(6) 오늘로부터 정확히 1년 뒤에 여기서 나와 만나서 그때 나에게 돈을 갚으면 됩니다.\"라고 말했다.</div><div class=\"rst\">“<b>딱 1년 뒤</b> 여기서 만나요. 그때 갚으면 돼요.” = 지문 9번, 1년 뒤 약속이 생겨요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">Then he turned</div><div class=\"k\">그러고 나서 그(= 노인)는 돌아섰고</div></div><div class=\"rc\"><div class=\"e\">and disappeared</div><div class=\"k\">사라졌다</div></div><div class=\"rc\"><div class=\"e\">as quickly as he had come.</div><div class=\"k\">그가 왔던 것만큼이나 빠르게</div></div><div class=\"rnat\">(D)(7) 그러고 나서 그는 돌아섰고 그가 왔던 것만큼이나 빠르게 사라졌다.</div><div class=\"rst\">그러고는 노인이 올 때처럼 순식간에 사라져요. = 지문 10번, 노인이 떠나요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">The executive saw in his hand</div><div class=\"k\">대표는 자신의 손에 있는 것을 보았다</div></div><div class=\"rc\"><div class=\"e\">a check for $500,000,</div><div class=\"k\">50만 달러짜리 수표를</div></div><div class=\"rc\"><div class=\"e\">signed by John D. Rockefeller,</div><div class=\"k\">John D. Rockefeller가 서명한</div></div><div class=\"rc\"><div class=\"e\">then one of the richest men in the world!</div><div class=\"k\">당시 세계에서 가장 부유한 사람 중 하나인</div></div><div class=\"rnat\">(B)(1) 그 대표는 그 당시에 세계에서 가장 부유한 사람 중 하나인 John D. Rockefeller의 서명이 있는 50만 달러짜리 수표가 그의 손에 있는 것을 보았다!</div><div class=\"rst\">사장님이 손을 펴 보니 세계 최고 부자 록펠러(Rockefeller)가 서명한 50만 달러 수표예요! = 지문 11번</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><div class=\"rc\"><div class=\"e\">“I can erase my money worries</div><div class=\"k\">'나는 돈 걱정을 없앨 수 있어</div></div><div class=\"rc\"><div class=\"e\">in an instant!”</div><div class=\"k\">당장!'</div></div><div class=\"rc\"><div class=\"e\">he thought.</div><div class=\"k\">그는 생각했다</div></div><div class=\"rnat\">(B)(2) 그는 \"나는 당장 돈 걱정을 완전히 없애버릴 수 있어!\"라고 생각했다.</div><div class=\"rst\">“이거면 돈 걱정이 당장 끝나!” 사장님이 속으로 생각해요. = 지문 12번</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">13번</span><div class=\"rc\"><div class=\"e\">But instead,</div><div class=\"k\">하지만 그 대신</div></div><div class=\"rc\"><div class=\"e\">the executive decided</div><div class=\"k\">대표는 결심했다</div></div><div class=\"rc\"><div class=\"e\">to put the check in his safe.</div><div class=\"k\">수표를 그의 금고 안에 넣어두기로</div></div><div class=\"rnat\">(B)(3) 하지만 그 대신 그 대표는 수표를 그의 금고 안에 넣어두기로 결심했다.</div><div class=\"rst\"><b>하지만</b>(But instead) 사장님은 수표를 쓰지 않고 금고에 넣어 두기로 해요. = 지문 13번</div></div><div class=\"rds\" data-ord=\"14\"><span class=\"rn\">14번</span><div class=\"rc\"><div class=\"e\">Just knowing it was there</div><div class=\"k\">단지 그것(= 수표)이 거기(= 금고) 있다는 것을 아는 것이</div></div><div class=\"rc\"><div class=\"e\">might give him the strength</div><div class=\"k\">그에게 힘을 줄지도 모른다</div></div><div class=\"rc\"><div class=\"e\">to work out a way</div><div class=\"k\">방법을 생각해 낼</div></div><div class=\"rc\"><div class=\"e\">to save (b) his business,</div><div class=\"k\">(b)그(= 회사 대표)의 사업을 구할</div></div><div class=\"rc\"><div class=\"e\">he thought.</div><div class=\"k\">그는 생각했다</div></div><div class=\"rnat\">(B)(4) 그는 단지 그것(수표)이 거기(금고) 있다는 것을 아는 것이 그에게 (b)그(회사 대표)의 회사를 구할 방법을 생각해 낼 힘을 줄지도 모른다고 생각했다.</div><div class=\"rst\">“금고에 수표가 있다는 것만 알아도 회사를 살릴 힘이 날 거야.” = 지문 14번, (b) 그의 사업 = 사장님 회사</div></div><div class=\"rds\" data-ord=\"15\"><span class=\"rn\">15번</span><div class=\"rc\"><div class=\"e\">Within a few months,</div><div class=\"k\">몇 달 안에</div></div><div class=\"rc\"><div class=\"e\">he was out of debt</div><div class=\"k\">그는 빚에서 벗어났고</div></div><div class=\"rc\"><div class=\"e\">and making money once again.</div><div class=\"k\">다시 돈을 벌고 있었다</div></div><div class=\"rnat\">(B)(5) 몇 달 안에 그는 빚에서 벗어났고 다시 돈을 벌고 있었다.</div><div class=\"rst\">몇 달 만에 사장님은 빚에서 벗어나 다시 돈을 벌어요. 수표는 한 번도 안 썼는데요! = 지문 15번</div></div><div class=\"rds\" data-ord=\"16\"><span class=\"rn\">16번</span><div class=\"rc\"><div class=\"e\">Exactly one year later,</div><div class=\"k\">정확히 1년 뒤에</div></div><div class=\"rc\"><div class=\"e\">(c) he returned to the park</div><div class=\"k\">(c)그(= 회사 대표)는 공원으로 돌아갔다</div></div><div class=\"rc\"><div class=\"e\">with the check.</div><div class=\"k\">그 수표를 가지고</div></div><div class=\"rnat\">(C)(1) 정확히 1년 뒤에 (c)그(회사 대표)는 그 수표를 가지고 공원으로 돌아갔다.</div><div class=\"rst\"><b>딱 1년 뒤</b>(Exactly one year later), 사장님이 그 수표를 들고 공원에 다시 가요. = 지문 16번, (c) 그 = 사장님</div></div><div class=\"rds\" data-ord=\"17\"><span class=\"rn\">17번</span><div class=\"rc\"><div class=\"e\">At the agreed-upon time,</div><div class=\"k\">약속한(합의된) 시간에</div></div><div class=\"rc\"><div class=\"e\">the old man appeared.</div><div class=\"k\">그 노인이 나타났다</div></div><div class=\"rnat\">(C)(2) 합의된(약속한) 시간에 그 노인이 나타났다.</div><div class=\"rst\">약속한 시간에 노인이 나타나요. = 지문 17번, 9번의 약속이 지켜지는 순간이에요.</div></div><div class=\"rds\" data-ord=\"18\"><span class=\"rn\">18번</span><div class=\"rc\"><div class=\"e\">But just then,</div><div class=\"k\">하지만 바로 그때</div></div><div class=\"rc\"><div class=\"e\">a nurse came running up</div><div class=\"k\">한 간호사가 달려와서</div></div><div class=\"rc\"><div class=\"e\">and grabbed the old man.</div><div class=\"k\">그 노인을 붙잡았다</div></div><div class=\"rnat\">(C)(3) 하지만 바로 그때, 한 간호사가 달려와서 그 노인을 붙잡았다.</div><div class=\"rst\"><b>그런데 바로 그때</b> 간호사가 달려와 노인을 붙잡아요. = 지문 18번, 반전이 시작돼요.</div></div><div class=\"rds\" data-ord=\"19\"><span class=\"rn\">19번</span><div class=\"rc\"><div class=\"e\">“I hope</div><div class=\"k\">'바랍니다</div></div><div class=\"rc\"><div class=\"e\">he hasn’t been bothering you.</div><div class=\"k\">그(= 노인)가 당신을 성가시게 하지 않았기를</div></div><div class=\"rnat\">(C)(4) \"그가 당신을 성가시게 하지 않았기를 바랍니다.</div><div class=\"rst\">간호사가 “이분이 귀찮게 하지 않으셨길 바라요.” 해요. = 지문 19번, 그(he) = 노인이에요.</div></div><div class=\"rds\" data-ord=\"20\"><span class=\"rn\">20번</span><div class=\"rc\"><div class=\"e\">He’s always escaping from the rest home</div><div class=\"k\">그는 항상 요양원을 탈출해서</div></div><div class=\"rc\"><div class=\"e\">and telling people</div><div class=\"k\">사람들에게 말합니다</div></div><div class=\"rc\"><div class=\"e\">he’s John D. Rockefeller,”</div><div class=\"k\">그가 John D. Rockefeller라고</div></div><div class=\"rc\"><div class=\"e\">the nurse said.</div><div class=\"k\">그 간호사가 말했다</div></div><div class=\"rnat\">(C)(5) 그는 항상 요양원을 탈출해서 사람들에게 그가 John D. Rockefeller라고 말합니다.\"라고 그 간호사가 말했다.</div><div class=\"rst\">“이분은 늘 요양원을 빠져나와 자기가 록펠러(Rockefeller)라고 하세요.” = 지문 20번, 간호사가 알려 준 노인 이야기예요.</div></div><div class=\"rds\" data-ord=\"21\"><span class=\"rn\">21번</span><div class=\"rc\"><div class=\"e\">The surprised executive just stood there.</div><div class=\"k\">놀란 대표는 그저 거기에 서 있었다</div></div><div class=\"rnat\">(C)(6) 놀란 대표는 그저 거기에 서 있었다.</div><div class=\"rst\">깜짝 놀란 사장님은 그 자리에 멍하니 서 있어요. = 지문 21번</div></div><div class=\"rds\" data-ord=\"22\"><span class=\"rn\">22번</span><div class=\"rc\"><div class=\"e\">Suddenly,</div><div class=\"k\">갑자기</div></div><div class=\"rc\"><div class=\"e\">(d) he realized</div><div class=\"k\">(d)그(= 회사 대표)는 깨달았다</div></div><div class=\"rc\"><div class=\"e\">that it wasn’t the money, real or imagined,</div><div class=\"k\">그 돈이 아니었다는 것을, 진짜이든 상상된 것이든</div></div><div class=\"rc\"><div class=\"e\">that had turned his life around.</div><div class=\"k\">그의 인생을 뒤바꾼 것은</div></div><div class=\"rnat\">(C)(7) 갑자기 (d)그(회사 대표)는 자신의 인생을 뒤바꾼 것이 진짜이든 상상된 것이든 그 돈이 아니었다는 것을 깨달았다.</div><div class=\"rst\">그때 사장님이 깨달아요. 인생을 바꾼 건 진짜든 가짜든 <b>돈이 아니었다</b>는 걸요. = 지문 22번, (d) 그 = 사장님</div></div><div class=\"rds\" data-ord=\"23\"><span class=\"rn\">23번</span><div class=\"rc\"><div class=\"e\">It was his newfound self-confidence</div><div class=\"k\">그것은 그의 새로 발견한 자신감이었다</div></div><div class=\"rc\"><div class=\"e\">that enabled him to achieve</div><div class=\"k\">그가 성취할 수 있게 해 준</div></div><div class=\"rc\"><div class=\"e\">anything he went after.</div><div class=\"k\">그가 추구했던 무엇이든</div></div><div class=\"rnat\">(C)(8) 그가 추구했던 어떤 것이든 성취할 수 있도록 해 주었던 것은 새로 발견한 그의 자신감이었다.</div><div class=\"rst\">바로 새로 찾은 <b>자신감</b>이 원하는 걸 다 이루게 해 준 거예요. = 지문 23번, 이야기의 결론이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"head in hands\" data-m=\"머리를 감싸 쥔 채\"><b>head in hands</b>머리를 감싸 쥔 채</button><button type=\"button\" class=\"wdb\" data-w=\"wonder if\" data-m=\"~인지 궁금해하다\"><b>wonder if</b>~인지 궁금해하다</button><button type=\"button\" class=\"wdb\" data-w=\"trouble\" data-m=\"괴롭히다\"><b>trouble</b>괴롭히다</button><button type=\"button\" class=\"wdb\" data-w=\"grab\" data-m=\"붙잡다\"><b>grab</b>붙잡다</button><button type=\"button\" class=\"wdb\" data-w=\"newfound\" data-m=\"새로 얻은\"><b>newfound</b>새로 얻은</button><button type=\"button\" class=\"wdb\" data-w=\"self-confidence\" data-m=\"자신감\"><b>self-confidence</b>자신감</button></div>", "12": "<p class=\"mtr\">마더텅 정답률 <b>70%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">장문 불일치는 선택지를 <b>이야기 순서대로</b> 지문과 대조하세요. ⑤처럼 <b>‘않았다’</b>가 붙은 선택지는 지문에 정반대 장면이 있는지 꼭 확인해요.</p><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>① ↔ 2번</em>couldn’t borrow more money(돈을 더 빌릴 수 없었다) → 같음</span><span><em>② ↔ 13번</em>put the check in his safe(수표를 금고에 넣다) → 같음</span><span><em>③ ↔ 20번</em>the nurse said(간호사가 말했다) 노인이 요양원을 탈출한다고 → 같음</span><span><em>④ ↔ 23번</em>newfound self-confidence(새로 발견한 자신감) → 같음</span></div><div class=\"ck-eq\">⇒ 네 개는 지문과 그대로 같아요. 남은 ⑤를 5·6번과 대조해요</div></div><div class=\"ck-via\"><i>▼</i><span>⑤의 ‘고민’이 나오는 장면을 찾아요</span></div><div class=\"ck-step\"><span class=\"lab\">5번 문장 · 노인이 먼저 물음</span><div class=\"en\">“I can see <mark>that something is troubling you</mark>,” he said.</div><p class=\"ko\">'<mark>무엇인가가 당신을 괴롭히고 있다는 것을</mark> 알겠군요'라고 그가 말했다.</p></div><div class=\"ck-via\"><i>▼</i><span>노인이 걱정을 ‘들었다’ = 사장님이 고민을 털어놓았다</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 결정적 단서</span><div class=\"en\"><mark>After listening to the executive’s worries</mark>, the old man said, “I believe I can help you.”</div><p class=\"ko\"><mark>대표의 걱정을 듣고 나서</mark> 그 노인은 '제가 당신을 도울 수 있을 것 같군요'라고 말했다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">노인에게 자신의 고민을 털어놓지 않았다.<small>6번: 노인이 사장님의 걱정을 듣고 나서 돕겠다고 했어요. 고민을 털어놓은 거예요.</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">수표를 금고 안에 넣어두기로 결심했다.</span><span class=\"why\">12번 erase my money worries(돈 걱정을 없애다)를 보고 수표를 쓴 줄 알기 쉽지만, 13번 But instead(하지만 그 대신) 금고에 넣기로 했어요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">은행에서 더 이상 돈을 빌릴 수 없었다.</span><span class=\"why\">2번 couldn’t borrow more money from any bank(어떤 은행에서도 돈을 더 빌릴 수 없었다)와 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">간호사로부터 노인에 관한 이야기를 들었다.</span><span class=\"why\">19·20번에서 the nurse said(간호사가 말했다), 노인이 늘 요양원을 빠져나와 자기가 록펠러라고 한다고 했어요. 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">새롭게 얻은 자신감 덕분에 원하는 바를 성취할 수 있었다.</span><span class=\"why\">23번 newfound self-confidence(새로 발견한 자신감)가 enabled him to achieve(성취할 수 있게 해 주었다)와 같아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">There was a business executive</div><div class=\"k\">한 회사 대표가 있었다</div></div><div class=\"rc\"><div class=\"e\">who was deep in debt</div><div class=\"k\">빚에 깊이 빠져 있는</div></div><div class=\"rc\"><div class=\"e\">and could see no way out.</div><div class=\"k\">그리고 탈출구가 보이지 않는</div></div><div class=\"rnat\">(A)(1) 빚에 깊이 빠져 있어서(많은 빚을 져서) 탈출구를 찾을 수 없었던 한 회사 대표가 있었다.</div><div class=\"rst\">한 회사 사장님이 빚더미에 앉아 빠져나갈 길이 안 보여요. = 지문 1번, 이야기의 주인공이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">He couldn’t borrow more money from any bank,</div><div class=\"k\">그는 어떤 은행에서도 돈을 더 빌릴 수 없었고</div></div><div class=\"rc\"><div class=\"e\">and couldn’t pay his suppliers.</div><div class=\"k\">공급업체에 돈을 지불할 수도 없었다</div></div><div class=\"rnat\">(A)(2) 그는 어떤 은행에서도 돈을 더 빌릴 수 없었고 공급업체에 돈을 지불할 수도 없었다.</div><div class=\"rst\">은행은 더 이상 돈을 안 빌려주고, 거래처에 줄 돈도 없어요. = 지문 2번 → ① 일치</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">One day,</div><div class=\"k\">어느 날</div></div><div class=\"rc\"><div class=\"e\">(a) he sat on a park bench,</div><div class=\"k\">(a)그(= 회사 대표)는 공원 벤치에 앉아 있었다</div></div><div class=\"rc\"><div class=\"e\">head in hands,</div><div class=\"k\">손으로 머리를 감싼 채</div></div><div class=\"rc\"><div class=\"e\">wondering if anything could save his company</div><div class=\"k\">무엇이든 그의 회사를 구할 수 있을지 생각하면서</div></div><div class=\"rc\"><div class=\"e\">from bankruptcy.</div><div class=\"k\">파산으로부터</div></div><div class=\"rnat\">(A)(3) 어느 날, (a)그(회사 대표)는 어떤 것이 그의 회사를 파산으로부터 구할 수 있을지를 생각하면서 손으로 머리를 감싸고 공원 벤치에 앉아 있었다.</div><div class=\"rst\">어느 날 사장님은 공원 벤치에서 머리를 감싸 쥐고 “회사를 살릴 방법이 없을까?” 고민해요. = 지문 3번</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Suddenly an old man appeared</div><div class=\"k\">갑자기 한 노인이 나타났다</div></div><div class=\"rc\"><div class=\"e\">before him.</div><div class=\"k\">그(= 회사 대표)의 앞에</div></div><div class=\"rnat\">(D)(1) 갑자기 그의 앞에 한 노인이 나타났다.</div><div class=\"rst\"><b>갑자기</b>(Suddenly) 한 노인이 사장님 앞에 나타나요. = 지문 4번, 새 인물이 등장해요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">“I can see</div><div class=\"k\">'알겠군요</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">that something is troubling you</span>,”</div><div class=\"k\"><span class=\"cw\">무엇인가가 당신을 괴롭히고 있다는 것을</span>'</div></div><div class=\"rc\"><div class=\"e\">he said.</div><div class=\"k\">그(= 노인)가 말했다</div></div><div class=\"rnat\">(D)(2) \"무엇인가가 당신을 괴롭히고 있다는 것을 알겠군요.\"라고 그가 말했다.</div><div class=\"rst\">노인이 “무슨 걱정이 있으신가 봐요.” 하고 말을 걸어요. = 지문 5번, 말하는 사람은 노인이에요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">After listening to the executive’s worries,</span></div><div class=\"k\"><span class=\"cw\">대표의 걱정을 듣고 나서</span></div></div><div class=\"rc\"><div class=\"e\">the old man said,</div><div class=\"k\">그 노인은 말했다</div></div><div class=\"rc\"><div class=\"e\">“I believe I can help you.”</div><div class=\"k\">'제가 당신을 도울 수 있다고 믿습니다(도울 수 있을 것 같군요).'</div></div><div class=\"rnat\">(D)(3) 그 대표의 걱정을 듣고 나서, 그 노인은 \"제가 당신을 도울 수 있다고 믿습니다(도울 수 있을 것 같군요).\"라고 말했다.</div><div class=\"rst\">노인은 사장님의 <b>걱정을 다 듣고</b> “제가 도울 수 있을 것 같아요.” 해요. 고민을 털어놓았죠! = 지문 6번 → ⑤가 틀린 곳</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">(e) He asked the man his name,</div><div class=\"k\">(e)그(= 노인)는 그 남자(= 회사 대표)에게 이름을 물었고</div></div><div class=\"rc\"><div class=\"e\">wrote out a check,</div><div class=\"k\">수표를 써서</div></div><div class=\"rc\"><div class=\"e\">and pushed it into his hand.</div><div class=\"k\">그것(= 수표)을 그(= 회사 대표)의 손에 밀어 넣었다(쥐여 주었다)</div></div><div class=\"rnat\">(D)(4) (e)그(노인)는 그 남자에게 이름을 물었고, 수표를 써서 그의 손에 밀어 넣었다(쥐여 주었다).</div><div class=\"rst\">노인은 사장님 이름을 묻고 <b>수표</b>를 써서 손에 쥐여 줘요. = 지문 7번, 주는 사람 = 노인, 받는 사람 = 사장님.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">He said,</div><div class=\"k\">그(= 노인)는 말했다</div></div><div class=\"rc\"><div class=\"e\">“Take this money.</div><div class=\"k\">'이 돈을 가져가세요.</div></div><div class=\"rnat\">(D)(5) 그는 \"이 돈을 가져가세요.</div><div class=\"rst\">“이 돈을 가져가세요.” = 지문 8번, 노인이 하는 말이에요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">Meet me here</div><div class=\"k\">여기서 저와 만나요</div></div><div class=\"rc\"><div class=\"e\">exactly one year from today,</div><div class=\"k\">오늘로부터 정확히 1년 뒤에</div></div><div class=\"rc\"><div class=\"e\">and you can pay me back</div><div class=\"k\">그러면 저에게 갚으면 됩니다</div></div><div class=\"rc\"><div class=\"e\">at that time.”</div><div class=\"k\">그때</div></div><div class=\"rnat\">(D)(6) 오늘로부터 정확히 1년 뒤에 여기서 나와 만나서 그때 나에게 돈을 갚으면 됩니다.\"라고 말했다.</div><div class=\"rst\">“<b>딱 1년 뒤</b> 여기서 만나요. 그때 갚으면 돼요.” = 지문 9번, 1년 뒤 약속이 생겨요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">Then he turned</div><div class=\"k\">그러고 나서 그(= 노인)는 돌아섰고</div></div><div class=\"rc\"><div class=\"e\">and disappeared</div><div class=\"k\">사라졌다</div></div><div class=\"rc\"><div class=\"e\">as quickly as he had come.</div><div class=\"k\">그가 왔던 것만큼이나 빠르게</div></div><div class=\"rnat\">(D)(7) 그러고 나서 그는 돌아섰고 그가 왔던 것만큼이나 빠르게 사라졌다.</div><div class=\"rst\">그러고는 노인이 올 때처럼 순식간에 사라져요. = 지문 10번, 노인이 떠나요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">The executive saw in his hand</div><div class=\"k\">대표는 자신의 손에 있는 것을 보았다</div></div><div class=\"rc\"><div class=\"e\">a check for $500,000,</div><div class=\"k\">50만 달러짜리 수표를</div></div><div class=\"rc\"><div class=\"e\">signed by John D. Rockefeller,</div><div class=\"k\">John D. Rockefeller가 서명한</div></div><div class=\"rc\"><div class=\"e\">then one of the richest men in the world!</div><div class=\"k\">당시 세계에서 가장 부유한 사람 중 하나인</div></div><div class=\"rnat\">(B)(1) 그 대표는 그 당시에 세계에서 가장 부유한 사람 중 하나인 John D. Rockefeller의 서명이 있는 50만 달러짜리 수표가 그의 손에 있는 것을 보았다!</div><div class=\"rst\">사장님이 손을 펴 보니 세계 최고 부자 록펠러(Rockefeller)가 서명한 50만 달러 수표예요! = 지문 11번</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><div class=\"rc\"><div class=\"e\">“I can erase my money worries</div><div class=\"k\">'나는 돈 걱정을 없앨 수 있어</div></div><div class=\"rc\"><div class=\"e\">in an instant!”</div><div class=\"k\">당장!'</div></div><div class=\"rc\"><div class=\"e\">he thought.</div><div class=\"k\">그는 생각했다</div></div><div class=\"rnat\">(B)(2) 그는 \"나는 당장 돈 걱정을 완전히 없애버릴 수 있어!\"라고 생각했다.</div><div class=\"rst\">“이거면 돈 걱정이 당장 끝나!” 사장님이 속으로 생각해요. = 지문 12번</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">13번</span><div class=\"rc\"><div class=\"e\">But instead,</div><div class=\"k\">하지만 그 대신</div></div><div class=\"rc\"><div class=\"e\">the executive decided</div><div class=\"k\">대표는 결심했다</div></div><div class=\"rc\"><div class=\"e\">to put the check in his safe.</div><div class=\"k\">수표를 그의 금고 안에 넣어두기로</div></div><div class=\"rnat\">(B)(3) 하지만 그 대신 그 대표는 수표를 그의 금고 안에 넣어두기로 결심했다.</div><div class=\"rst\"><b>하지만</b>(But instead) 사장님은 수표를 쓰지 않고 금고에 넣어 두기로 해요. = 지문 13번 → ② 일치</div></div><div class=\"rds\" data-ord=\"14\"><span class=\"rn\">14번</span><div class=\"rc\"><div class=\"e\">Just knowing it was there</div><div class=\"k\">단지 그것(= 수표)이 거기(= 금고) 있다는 것을 아는 것이</div></div><div class=\"rc\"><div class=\"e\">might give him the strength</div><div class=\"k\">그에게 힘을 줄지도 모른다</div></div><div class=\"rc\"><div class=\"e\">to work out a way</div><div class=\"k\">방법을 생각해 낼</div></div><div class=\"rc\"><div class=\"e\">to save (b) his business,</div><div class=\"k\">(b)그(= 회사 대표)의 사업을 구할</div></div><div class=\"rc\"><div class=\"e\">he thought.</div><div class=\"k\">그는 생각했다</div></div><div class=\"rnat\">(B)(4) 그는 단지 그것(수표)이 거기(금고) 있다는 것을 아는 것이 그에게 (b)그(회사 대표)의 회사를 구할 방법을 생각해 낼 힘을 줄지도 모른다고 생각했다.</div><div class=\"rst\">“금고에 수표가 있다는 것만 알아도 회사를 살릴 힘이 날 거야.” = 지문 14번</div></div><div class=\"rds\" data-ord=\"15\"><span class=\"rn\">15번</span><div class=\"rc\"><div class=\"e\">Within a few months,</div><div class=\"k\">몇 달 안에</div></div><div class=\"rc\"><div class=\"e\">he was out of debt</div><div class=\"k\">그는 빚에서 벗어났고</div></div><div class=\"rc\"><div class=\"e\">and making money once again.</div><div class=\"k\">다시 돈을 벌고 있었다</div></div><div class=\"rnat\">(B)(5) 몇 달 안에 그는 빚에서 벗어났고 다시 돈을 벌고 있었다.</div><div class=\"rst\">몇 달 만에 사장님은 빚에서 벗어나 다시 돈을 벌어요. 수표는 한 번도 안 썼는데요! = 지문 15번</div></div><div class=\"rds\" data-ord=\"16\"><span class=\"rn\">16번</span><div class=\"rc\"><div class=\"e\">Exactly one year later,</div><div class=\"k\">정확히 1년 뒤에</div></div><div class=\"rc\"><div class=\"e\">(c) he returned to the park</div><div class=\"k\">(c)그(= 회사 대표)는 공원으로 돌아갔다</div></div><div class=\"rc\"><div class=\"e\">with the check.</div><div class=\"k\">그 수표를 가지고</div></div><div class=\"rnat\">(C)(1) 정확히 1년 뒤에 (c)그(회사 대표)는 그 수표를 가지고 공원으로 돌아갔다.</div><div class=\"rst\"><b>딱 1년 뒤</b>(Exactly one year later), 사장님이 그 수표를 들고 공원에 다시 가요. = 지문 16번</div></div><div class=\"rds\" data-ord=\"17\"><span class=\"rn\">17번</span><div class=\"rc\"><div class=\"e\">At the agreed-upon time,</div><div class=\"k\">약속한(합의된) 시간에</div></div><div class=\"rc\"><div class=\"e\">the old man appeared.</div><div class=\"k\">그 노인이 나타났다</div></div><div class=\"rnat\">(C)(2) 합의된(약속한) 시간에 그 노인이 나타났다.</div><div class=\"rst\">약속한 시간에 노인이 나타나요. = 지문 17번, 9번의 약속이 지켜지는 순간이에요.</div></div><div class=\"rds\" data-ord=\"18\"><span class=\"rn\">18번</span><div class=\"rc\"><div class=\"e\">But just then,</div><div class=\"k\">하지만 바로 그때</div></div><div class=\"rc\"><div class=\"e\">a nurse came running up</div><div class=\"k\">한 간호사가 달려와서</div></div><div class=\"rc\"><div class=\"e\">and grabbed the old man.</div><div class=\"k\">그 노인을 붙잡았다</div></div><div class=\"rnat\">(C)(3) 하지만 바로 그때, 한 간호사가 달려와서 그 노인을 붙잡았다.</div><div class=\"rst\"><b>그런데 바로 그때</b> 간호사가 달려와 노인을 붙잡아요. = 지문 18번, 반전이 시작돼요.</div></div><div class=\"rds\" data-ord=\"19\"><span class=\"rn\">19번</span><div class=\"rc\"><div class=\"e\">“I hope</div><div class=\"k\">'바랍니다</div></div><div class=\"rc\"><div class=\"e\">he hasn’t been bothering you.</div><div class=\"k\">그(= 노인)가 당신을 성가시게 하지 않았기를</div></div><div class=\"rnat\">(C)(4) \"그가 당신을 성가시게 하지 않았기를 바랍니다.</div><div class=\"rst\">간호사가 “이분이 귀찮게 하지 않으셨길 바라요.” 해요. = 지문 19번, 그(he) = 노인이에요.</div></div><div class=\"rds\" data-ord=\"20\"><span class=\"rn\">20번</span><div class=\"rc\"><div class=\"e\">He’s always escaping from the rest home</div><div class=\"k\">그는 항상 요양원을 탈출해서</div></div><div class=\"rc\"><div class=\"e\">and telling people</div><div class=\"k\">사람들에게 말합니다</div></div><div class=\"rc\"><div class=\"e\">he’s John D. Rockefeller,”</div><div class=\"k\">그가 John D. Rockefeller라고</div></div><div class=\"rc\"><div class=\"e\">the nurse said.</div><div class=\"k\">그 간호사가 말했다</div></div><div class=\"rnat\">(C)(5) 그는 항상 요양원을 탈출해서 사람들에게 그가 John D. Rockefeller라고 말합니다.\"라고 그 간호사가 말했다.</div><div class=\"rst\">“이분은 늘 요양원을 빠져나와 자기가 록펠러(Rockefeller)라고 하세요.” = 지문 20번, 간호사가 알려 준 노인 이야기예요. → ③ 일치</div></div><div class=\"rds\" data-ord=\"21\"><span class=\"rn\">21번</span><div class=\"rc\"><div class=\"e\">The surprised executive just stood there.</div><div class=\"k\">놀란 대표는 그저 거기에 서 있었다</div></div><div class=\"rnat\">(C)(6) 놀란 대표는 그저 거기에 서 있었다.</div><div class=\"rst\">깜짝 놀란 사장님은 그 자리에 멍하니 서 있어요. = 지문 21번</div></div><div class=\"rds\" data-ord=\"22\"><span class=\"rn\">22번</span><div class=\"rc\"><div class=\"e\">Suddenly,</div><div class=\"k\">갑자기</div></div><div class=\"rc\"><div class=\"e\">(d) he realized</div><div class=\"k\">(d)그(= 회사 대표)는 깨달았다</div></div><div class=\"rc\"><div class=\"e\">that it wasn’t the money, real or imagined,</div><div class=\"k\">그 돈이 아니었다는 것을, 진짜이든 상상된 것이든</div></div><div class=\"rc\"><div class=\"e\">that had turned his life around.</div><div class=\"k\">그의 인생을 뒤바꾼 것은</div></div><div class=\"rnat\">(C)(7) 갑자기 (d)그(회사 대표)는 자신의 인생을 뒤바꾼 것이 진짜이든 상상된 것이든 그 돈이 아니었다는 것을 깨달았다.</div><div class=\"rst\">그때 사장님이 깨달아요. 인생을 바꾼 건 진짜든 가짜든 <b>돈이 아니었다</b>는 걸요. = 지문 22번</div></div><div class=\"rds\" data-ord=\"23\"><span class=\"rn\">23번</span><div class=\"rc\"><div class=\"e\">It was his newfound self-confidence</div><div class=\"k\">그것은 그의 새로 발견한 자신감이었다</div></div><div class=\"rc\"><div class=\"e\">that enabled him to achieve</div><div class=\"k\">그가 성취할 수 있게 해 준</div></div><div class=\"rc\"><div class=\"e\">anything he went after.</div><div class=\"k\">그가 추구했던 무엇이든</div></div><div class=\"rnat\">(C)(8) 그가 추구했던 어떤 것이든 성취할 수 있도록 해 주었던 것은 새로 발견한 그의 자신감이었다.</div><div class=\"rst\">바로 새로 찾은 <b>자신감</b>이 원하는 걸 다 이루게 해 준 거예요. = 지문 23번, 이야기의 결론이에요. → ④ 일치</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"borrow\" data-m=\"빌리다\"><b>borrow</b>빌리다</button><button type=\"button\" class=\"wdb\" data-w=\"erase\" data-m=\"지우다, 없애다\"><b>erase</b>지우다, 없애다</button><button type=\"button\" class=\"wdb\" data-w=\"in an instant\" data-m=\"순식간에\"><b>in an instant</b>순식간에</button><button type=\"button\" class=\"wdb\" data-w=\"bother\" data-m=\"괴롭히다, 성가시게 하다\"><b>bother</b>괴롭히다, 성가시게 하다</button><button type=\"button\" class=\"wdb\" data-w=\"turned his life around\" data-m=\"그의 인생을 바꿔 놓았다\"><b>turned his life around</b>그의 인생을 바꿔 놓았다</button><button type=\"button\" class=\"wdb\" data-w=\"enabled\" data-m=\"~할 수 있게 해 주었다 (enable A to V)\"><b>enabled</b>~할 수 있게 해 주었다 (enable A to V)</button></div>"};
document.addEventListener('click',function(e){
 var b=e.target.closest('.stbtn');
 if(b){var box=b.closest('.rdb'),on=!box.classList.contains('story');box.classList.toggle('story',on);
  var L=[].slice.call(box.querySelectorAll('.rds'));L.forEach(function(x){x.classList.remove('lastv');x.style.order='';});
