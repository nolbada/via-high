var EXP={"07": "<p class=\"mtr\">마더텅 정답률 <b>50%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">밑줄은 <b>비유</b>예요. 상자 안에 감춰 두던 문제들이 밖으로 튀어나왔다는 건 무슨 뜻일지, <b>바로 뒤 3~6번</b>이 인터넷 때문에 소비자가 <b>다 알게 됐다</b>고 풀어 주는 말에서 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">밑줄 문장 (2번)</span><div class=\"en\">… all of the issues that customers actually experienced from a marketing organization <mark>suddenly popped out of the box</mark>.</div><p class=\"ko\">소비자들이 실제로 경험했던 모든 문제가 <mark>갑자기 상자 밖으로 튀어나왔다</mark></p></div><div class=\"ck-via\"><i>▼</i><span>상자 = 회사가 문제를 덮어 두던 통제. 그 통제가 없어졌다고 바로 말해요</span></div><div class=\"ck-step\"><span class=\"lab\">3번 문장 · 통제가 사라짐</span><div class=\"en\"><mark>No longer were there</mark> any controlled communications or even business systems.</div><p class=\"ko\"><mark>더 이상 없었다</mark> 어떠한 통제된 의사소통도 또는 사업 체계조차</p></div><div class=\"ck-via\"><i>▼</i><span>튀어나온 결과 = 소비자가 회사의 진정성까지 다 알게 됨</span></div><div class=\"ck-step key\"><span class=\"lab\">4번 문장 · 결정적 단서</span><div class=\"en\">Consumers could generally learn through the Web <mark>whatever they wanted to know</mark> about a company, … and, most of all, its truthfulness …</div><p class=\"ko\">소비자들은 웹을 통해 한 회사에 대해 <mark>그들(= 소비자들)이 알고 싶은 것은 무엇이든</mark> … 무엇보다도 그것의 진정성까지 알 수 있었다</p></div><div class=\"ck-via\"><i>▼</i><span>알게 된 것을 다른 소비자와 비교하고, 마케터에게 즉시 공개적으로 대응까지 해요</span></div><div class=\"ck-step\"><span class=\"lab\">5·6번 문장 · 공개적으로 퍼짐</span><div class=\"en\">Now the customer had a way <mark>to talk back to the marketer</mark> and to do so through public forums instantly.</div><p class=\"ko\">이제 소비자는 공론의 장을 통해 즉시 <mark>마케터에게 대응하는</mark> 수단을 가졌다</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>the box</em>회사가 문제를 덮어 두던 통제된 소통(3번)</span><span><em>popped out</em>소비자가 웹으로 다 알게 되고(4번) 서로 비교하며 따짐(5·6번)</span></div><div class=\"ck-eq\">⇒ 밑줄의 속뜻 = 문제들을 더 이상 비밀로 감출 수 없게 됐다 → ①</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">could not be kept secret anymore 더 이상 비밀로 지켜질 수 없었다<small>상자(통제) 안에 숨기던 문제를 4번처럼 소비자가 무엇이든 알게 됐으니 더는 비밀이 아니에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">might disappear from public attention 대중의 관심에서 사라질지도 몰랐다</span><span class=\"why\">튀어나왔다는 건 오히려 드러났다는 뜻이에요. 6번에서 public forums(공론의 장)로 즉시 퍼진다고 했으니 관심에서 사라진다는 건 정반대예요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">were no longer available to marketers 더 이상 마케터들이 이용할 수 없었다</span><span class=\"why\">3번의 No longer(더 이상 ~않다)를 따온 함정이에요. 지문은 마케터가 정보를 못 쓰게 됐다는 게 아니라 소비자가 다 알게 됐다고 해요(4번).</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">became too complicated to understand 너무 복잡해서 이해할 수 없게 되었다</span><span class=\"why\">4번은 소비자가 원하는 건 무엇이든 learn(알다)할 수 있었다고 해요. 이해하기 어려워졌다는 말은 지문에 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">began to improve companies' reputations 회사의 평판을 높이기 시작했다</span><span class=\"why\">튀어나온 건 제품 문제·과잉 약속 같은 나쁜 일들(2번)이에요. 드러나면 평판이 좋아지는 게 아니라 6번처럼 소비자가 따지게 돼요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">With the Internet,</div><div class=\"k\">인터넷과 함께</div></div><div class=\"rc\"><div class=\"e\">everything changed.</div><div class=\"k\">모든 것이 변했다</div></div><div class=\"rnat\">인터넷의 등장으로 모든 것이 변했다.</div><div class=\"rst\">학교 앞 문구점 얘기로 볼게요. 학생들이 다 휴대폰으로 단톡방을 하게 되면서 모든 게 달라졌어요. = 지문의 “인터넷으로 <b>모든 것이 변했다</b>”예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Product problems, overpromises,</div><div class=\"k\">제품 문제, 과잉 약속,</div></div><div class=\"rc\"><div class=\"e\">the lack of customer support, differential pricing —</div><div class=\"k\">고객 지원 부족, 가격 차등 같은</div></div><div class=\"rc\"><div class=\"e\">all of the issues</div><div class=\"k\">모든 문제가</div></div><div class=\"rc\"><div class=\"e\">that customers actually experienced</div><div class=\"k\">소비자들이 실제로 경험했던</div></div><div class=\"rc\"><div class=\"e\">from a marketing organization</div><div class=\"k\">마케팅 조직으로부터</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">suddenly popped out of the box.</span></div><div class=\"k\"><span class=\"cw\">갑자기 상자 밖으로 튀어나왔다</span>(더 이상 비밀로 지켜질 수 없었다)</div></div><div class=\"rnat\">제품 문제, 과잉 약속, 고객 지원 부족, 가격 차등과 같은 소비자들이 마케팅 조직으로부터 실제로 경험했던 모든 문제가 갑자기 상자 밖으로 튀어나왔다(더 이상 비밀로 지켜질 수 없었다).</div><div class=\"rst\">불량 샤프, 부풀린 광고, 사람마다 다른 가격 같은 문제가 <b>상자 밖으로 튀어나왔어요</b>. 숨겨 둔 문제가 다 드러났다는 지문의 밑줄 뜻이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">No longer were there</span></div><div class=\"k\"><span class=\"cw\">더 이상 없었다</span></div></div><div class=\"rc\"><div class=\"e\">any controlled communications</div><div class=\"k\">어떠한 통제된 의사소통도</div></div><div class=\"rc\"><div class=\"e\">or even business systems.</div><div class=\"k\">또는 사업 체계조차</div></div><div class=\"rnat\">어떠한 통제된 의사소통이나 사업 체계조차 더 이상 존재하지 않았다.</div><div class=\"rst\">예전엔 사장님 말만 듣고 샀지만, 이제 사장님이 말을 골라서 할 수 없어요. 지문의 <b>통제된 의사소통</b>이 더 이상 없다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">Consumers could generally learn</div><div class=\"k\">소비자들은 보통 알 수 있었다</div></div><div class=\"rc\"><div class=\"e\">through the Web</div><div class=\"k\">웹(인터넷)을 통해</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">whatever they wanted to know</span></div><div class=\"k\"><span class=\"cw\">그들(= 소비자들)이 알고 싶은 것은 무엇이든</span></div></div><div class=\"rc\"><div class=\"e\">about a company,</div><div class=\"k\">한 회사에 대해</div></div><div class=\"rc\"><div class=\"e\">its products, its competitors, its distribution systems,</div><div class=\"k\">그것(= 그 회사)의 제품, 경쟁사, 유통 체계,</div></div><div class=\"rc\"><div class=\"e\">and, most of all,</div><div class=\"k\">그리고 무엇보다도</div></div><div class=\"rc\"><div class=\"e\">its truthfulness</div><div class=\"k\">그것의 진정성</div></div><div class=\"rc\"><div class=\"e\">when talking about its products and services.</div><div class=\"k\">제품과 서비스에 관해 이야기할 때의</div></div><div class=\"rnat\">소비자들은 한 회사와 그것(그 회사)의 제품, 경쟁사, 유통 체계, 그리고 무엇보다도 그것의 제품과 서비스에 관해 이야기할 때의 진정성에 대해 그들이 알고 싶은 것은 무엇이든 인터넷을 통해 보통 알 수 있었다.</div><div class=\"rst\">학생들은 검색으로 물건·옆 가게·사장님 말이 진짜인지까지 <b>무엇이든 알아요</b>. 그래서 지문은 회사의 진정성까지 알 수 있다고 해요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">Just as important,</div><div class=\"k\">그만큼이나 중요하게도</div></div><div class=\"rc\"><div class=\"e\">the Internet opened up a forum</div><div class=\"k\">인터넷은 (공론의) 장을 열었다</div></div><div class=\"rc\"><div class=\"e\">for customers to compare</div><div class=\"k\">소비자들이 비교할 수 있는</div></div><div class=\"rc\"><div class=\"e\">products, experiences, and values</div><div class=\"k\">제품, 경험, 그리고 가치를</div></div><div class=\"rc\"><div class=\"e\">with other customers</div><div class=\"k\">다른 소비자들과</div></div><div class=\"rc\"><div class=\"e\">easily and quickly.</div><div class=\"k\">쉽고 빠르게</div></div><div class=\"rnat\">그만큼이나 중요하게도, 인터넷은 소비자들이 제품, 경험, 그리고 가치를 다른 소비자들과 쉽고 빠르게 비교할 수 있는 (공론의) 장을 열었다.</div><div class=\"rst\">게다가 단톡방에서 “나 이거 샀는데 별로야” 하고 친구들과 바로 비교해요. = 지문의 소비자들이 <b>비교할 수 있는 장</b>이에요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">Now</div><div class=\"k\">이제</div></div><div class=\"rc\"><div class=\"e\">the customer had a way</div><div class=\"k\">소비자는 수단을 가졌다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">to talk back to the marketer</span></div><div class=\"k\"><span class=\"cw\">마케터에게 대응하는</span></div></div><div class=\"rc ckc\"><div class=\"e\">and to do so</div><div class=\"k\">그리고 그렇게(= <span class=\"cw\">마케터에게 대응하는</span> 것) 하는</div></div><div class=\"rc\"><div class=\"e\">through public forums instantly.</div><div class=\"k\">공론의 장을 통해 즉시</div></div><div class=\"rnat\">이제 소비자는 마케터에게 대응하고 공론의 장을 통해 즉시 그렇게 하는 (마케터에게 대응하는) 수단을 가졌다.</div><div class=\"rst\">이제 학생이 사장님께 바로 따지고, 그 글을 모두가 봐요. 지문의 <b>마케터에게 대응하는</b> 수단이니, 문제는 더는 비밀일 수 없어요(①).</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"overpromise\" data-m=\"과잉 약속, 과장된 약속\"><b>overpromise</b>과잉 약속, 과장된 약속</button><button type=\"button\" class=\"wdb\" data-w=\"differential pricing\" data-m=\"가격 차등\"><b>differential pricing</b>가격 차등</button><button type=\"button\" class=\"wdb\" data-w=\"controlled communications\" data-m=\"통제된 의사소통\"><b>controlled communications</b>통제된 의사소통</button><button type=\"button\" class=\"wdb\" data-w=\"truthfulness\" data-m=\"진정성, 진실성\"><b>truthfulness</b>진정성, 진실성</button><button type=\"button\" class=\"wdb\" data-w=\"forum\" data-m=\"공론의 장\"><b>forum</b>공론의 장</button><button type=\"button\" class=\"wdb\" data-w=\"talk back\" data-m=\"대응하다, 말대꾸하다\"><b>talk back</b>대응하다, 말대꾸하다</button></div>", "08": "<p class=\"mtr\">마더텅 정답률 <b>60%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">순서 문제는 <b>고리</b>를 찾는 문제예요. 지시어(<b>these approaches</b> 이러한 접근) → 앞 단어 이어받기(<b>Those materials</b> 그 재료) → 대조 연결어(<b>But</b> 그러나) 순으로 이어 붙이세요.</p><div class=\"ck-step\"><span class=\"lab\">주어진 글 끝</span><div class=\"en\">Industrial architecture, the argument went, was <mark>ugly and inhuman</mark>; past styles had more to do with pretension …</div><p class=\"ko\">산업 건축은 <mark>추하고 비인간적이었다</mark> … 과거의 스타일은 허세와 더욱 관련이 있었다</p></div><div class=\"ck-via\"><i>▼</i><span>these approaches(이러한 접근) = 2번의 산업 건축·과거 스타일</span></div><div class=\"ck-step key\"><span class=\"lab\">(B) · 첫 번째 고리</span><div class=\"en\"><mark>Instead of these approaches</mark>, why not look at the way ordinary country builders worked in the past?</div><p class=\"ko\"><mark>이러한 접근 대신에</mark>, 평범한 시골 건축업자들이 과거에 일했던 방식을 살펴보는 것은 어떠한가?</p></div><div class=\"ck-via\"><i>▼</i><span>(B) 끝의 materials(재료)를 (C)가 Those materials(그 재료)로 이어받아요</span></div><div class=\"ck-step key\"><span class=\"lab\">(B) 끝 → (C) · 두 번째 고리</span><div class=\"en\"><mark>Those materials</mark> were local, and used with simplicity — <mark>houses built this way</mark> had plain wooden floors …</div><p class=\"ko\"><mark>그 재료</mark>는 지역적이었고 … <mark>이러한 방식으로 건축된 집들은</mark> 평범한 나무 바닥을 갖고 있었다</p></div><div class=\"ck-via\"><i>▼</i><span>they(그것들) = (C)의 houses built this way(이렇게 지은 집들), But(그러나) = 평범했지만 훌륭했다</span></div><div class=\"ck-step key\"><span class=\"lab\">(A) · 세 번째 고리</span><div class=\"en\"><mark>But they</mark> supplied people's needs perfectly …</div><p class=\"ko\">그러나 그것들(= 이러한 방식으로 건축된 집들)은 사람들의 필요를 완벽하게 충족시켰고</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">(B) – (C) – (A)<small>these approaches(이러한 접근) → Those materials(그 재료) → But they(그러나 그것들), 세 고리가 모두 맞아요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">(B) – (A) – (C)</span><span class=\"why\">(B) 바로 뒤에 (A)를 두면 But they(그러나 그것들)가 가리킬 “이렇게 지은 집들”이 아직 안 나왔어요. 집 얘기는 (C)에서 처음 나와요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">(A) – (C) – (B)</span><span class=\"why\">주어진 글은 산업 건축이 추하다고 끝나는데, 바로 But they(그러나 그것들)가 필요를 완벽히 채웠다고 하면 칭찬 대상이 산업 건축이 돼 버려요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">(C) – (A) – (B)</span><span class=\"why\">(C)의 Those materials(그 재료)가 가리킬 재료가 주어진 글에 없어요. 재료는 (B) 끝의 tools and materials(도구와 재료)에서 나와요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">(C) – (B) – (A)</span><span class=\"why\">(C)가 맨 앞이면 Those materials(그 재료)가 가리킬 말이 없고, (B)의 these approaches(이러한 접근)도 2번과 떨어져 버려요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><span class=\"ordc\">정답 순서 주어진 글</span><div class=\"rc\"><div class=\"e\">Toward the end of the 19th century,</div><div class=\"k\">19세기 말 무렵에</div></div><div class=\"rc\"><div class=\"e\">a new architectural attitude</div><div class=\"k\">새로운 건축학적 사고방식이</div></div><div class=\"rc\"><div class=\"e\">emerged.</div><div class=\"k\">나타났다</div></div><div class=\"rnat\">19세기 말이 되면서, 새로운 건축학적 사고방식이 나타났다.</div><div class=\"rst\">학교 숙제로 “좋은 집이란?”을 조사한다고 해 봐요. 지문은 19세기 말에 집을 보는 <b>새로운 생각</b>이 나타났다고 시작해요.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">2번 · 단서</span><span class=\"ordc\">정답 순서 주어진 글</span><div class=\"rc\"><div class=\"e\">Industrial architecture,</div><div class=\"k\">산업 건축은</div></div><div class=\"rc\"><div class=\"e\">the argument went,</div><div class=\"k\">그 주장에 따르면</div></div><div class=\"rc\"><div class=\"e\">was ugly and inhuman;</div><div class=\"k\">추하고 비인간적이었다</div></div><div class=\"rc\"><div class=\"e\">past styles had more to do with pretension</div><div class=\"k\">과거의 스타일은 허세와 더욱 관련이 있었다</div></div><div class=\"rc\"><div class=\"e\">than what people needed in their homes.</div><div class=\"k\">사람들이 그들의 집에서 필요했던 것보다는</div></div><div class=\"rnat\">그 주장에 따르면, 산업 건축은 추하고 비인간적이었는데, 다른 한편으로 과거의 스타일은 사람들이 그들의 집에서 필요했던 것보다는 허세와 더욱 관련이 있었다.</div><div class=\"rst\">공장처럼 찍어 낸 집은 차갑고 못생겼고, 옛날 멋 부린 집은 폼만 잡았대요. = 지문의 <b>추하고 비인간적인</b> 산업 건축, <b>허세</b>예요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">3번 · 단서</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">But they supplied people's needs perfectly</span></div><div class=\"k\"><span class=\"cw\">그러나 그것들(= 이러한 방식으로 건축된 집들)은</span> 사람들의 필요를 완벽하게 충족시켰고</div></div><div class=\"rc\"><div class=\"e\">and, at their best,</div><div class=\"k\">가장 잘 된 경우에는</div></div><div class=\"rc\"><div class=\"e\">had a beauty</div><div class=\"k\">아름다움을 갖추고 있었다</div></div><div class=\"rc\"><div class=\"e\">that came from the craftsman's skill</div><div class=\"k\">장인의 솜씨에서 비롯된</div></div><div class=\"rc\"><div class=\"e\">and the rootedness of the house in its locality.</div><div class=\"k\">그리고 그 집이 지역에 뿌리내림에서</div></div><div class=\"rnat\">(A) 그러나 그것들은 사람들의 필요를 완벽하게 충족시켰고, 가장 잘 된 경우에는, 장인의 솜씨와 그 집의 지역에 뿌리내림에서 비롯된 아름다움을 갖추고 있었다.</div><div class=\"rst\"><b>그러나</b>(But) 그 소박한 집은 사람들에게 꼭 필요한 걸 다 채웠고, 솜씨와 동네에 뿌리내린 데서 오는 아름다움이 있었어요. 지문의 결론이에요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">4번 · 단서</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Instead of these approaches,</span></div><div class=\"k\"><span class=\"cw\">이러한 접근</span>(= (2)의 산업 건축·과거 건축 스타일에 대한 비판적인 의견들) 대신에</div></div><div class=\"rc\"><div class=\"e\">why not look at</div><div class=\"k\">살펴보는 것은 어떠한가</div></div><div class=\"rc\"><div class=\"e\">the way ordinary country builders worked</div><div class=\"k\">평범한 시골 건축업자들이 일했던 방식을</div></div><div class=\"rc\"><div class=\"e\">in the past?</div><div class=\"k\">과거에</div></div><div class=\"rnat\">(B) 이러한 접근 대신에, 평범한 시골 건축업자들이 과거에 일했던 방식을 살펴보는 것은 어떠한가?</div><div class=\"rst\"><b>그런 것들 대신</b>(Instead of these approaches) 옛 시골집을 지은 동네 목수들을 보자고 해요. 지문의 평범한 시골 건축업자예요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">5번 · 단서</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">They developed their craft skills</div><div class=\"k\">그들(= 평범한 시골 건축업자들)은 공예 기술을 발전시켰다</div></div><div class=\"rc\"><div class=\"e\">over generations,</div><div class=\"k\">세대를 거쳐</div></div><div class=\"rc\"><div class=\"e\">demonstrating mastery</div><div class=\"k\">숙달한 기술을 보이며</div></div><div class=\"rc\"><div class=\"e\">of both tools and materials.</div><div class=\"k\">도구와 재료 둘 다에</div></div><div class=\"rnat\">(B) 그들은 도구와 재료 둘 다에 숙달한 기술을 보이며, 세대를 거쳐 공예 기술을 발전시켰다.</div><div class=\"rst\">그 목수들은 윗세대부터 대대로 솜씨를 닦아 연장과 <b>재료</b>를 잘 다뤘어요. 지문의 세대를 거친 공예 기술이에요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">6번 · 단서</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Those materials were local,</span></div><div class=\"k\"><span class=\"cw\">그 재료</span>(= (5)에서 건축업자들이 숙달한 기술을 보인 재료들)는 지역적이었고</div></div><div class=\"rc\"><div class=\"e\">and used with simplicity —</div><div class=\"k\">단순하게 사용되었다 —</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">houses built this way</span></div><div class=\"k\"><span class=\"cw\">이러한 방식으로 건축된 집들은</span></div></div><div class=\"rc\"><div class=\"e\">had plain wooden floors</div><div class=\"k\">평범한 나무 바닥을 갖고 있었다</div></div><div class=\"rc\"><div class=\"e\">and whitewashed walls inside.</div><div class=\"k\">그리고 실내에 회반죽을 칠한 벽을</div></div><div class=\"rnat\">(C) 그 재료는 지역적이고, 단순하게 사용되었는데, 이러한 방식으로 건축된 집들은 실내가 평범한 나무 바닥과 회반죽을 칠한 벽으로 되어 있었다.</div><div class=\"rst\"><b>그 재료</b>(Those materials)는 뒷산 나무처럼 동네 것이었고, 집은 나무 마루·하얀 벽으로 단순했어요. = 지문의 <b>이렇게 지은 집</b>이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"architectural\" data-m=\"건축학적인\"><b>architectural</b>건축학적인</button><button type=\"button\" class=\"wdb\" data-w=\"inhuman\" data-m=\"비인간적인\"><b>inhuman</b>비인간적인</button><button type=\"button\" class=\"wdb\" data-w=\"pretension\" data-m=\"허세\"><b>pretension</b>허세</button><button type=\"button\" class=\"wdb\" data-w=\"mastery\" data-m=\"숙달\"><b>mastery</b>숙달</button><button type=\"button\" class=\"wdb\" data-w=\"whitewashed\" data-m=\"회반죽을 칠한\"><b>whitewashed</b>회반죽을 칠한</button><button type=\"button\" class=\"wdb\" data-w=\"rootedness\" data-m=\"뿌리내림\"><b>rootedness</b>뿌리내림</button></div>", "09": "<p class=\"mtr\">마더텅 정답률 <b>45%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">요약문은 지문 핵심 문장을 <b>말만 바꿔 옮긴 것</b>이에요. (A)는 까마귀가 어떤 새인지 <b>clever</b>(영리한)에서, (B)는 왜 그런지 <b>rely on</b>(의존하다)·<b>extended period</b>(긴 기간)에서 찾아 한 칸씩 짝지으세요.</p><div class=\"ck-step\"><span class=\"lab\">1·2번 문장 · (A)의 단서</span><div class=\"en\">Crows are <mark>a remarkably clever family of birds</mark>.</div><p class=\"ko\">까마귀는 <mark>몹시 영리한 조류</mark>이다.</p></div><div class=\"ck-via\"><i>▼</i><span>까마귀는 닭과 달리 어미새에게 먹이를 받아먹어요 = 의존</span></div><div class=\"ck-step\"><span class=\"lab\">3번 문장 · (B)의 단서</span><div class=\"en\">… much faster than crows, <mark>which rely on the parent bird</mark> to bring them food in the nest.</div><p class=\"ko\">(닭은) 둥지에서 먹이를 가져다주는 <mark>어미새에게 의존하는</mark> 까마귀보다 훨씬 더 빠르게 …</p></div><div class=\"ck-via\"><i>▼</i><span>의존하는 그 긴 기간이 지능을 키운다 = 원인과 결과를 한 문장에</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 결정적 단서</span><div class=\"en\"><mark>Their extended period</mark> between hatching and flight from the nest <mark>enables them to develop intelligence</mark>.</div><p class=\"ko\">부화와 둥지를 떠나는 것 사이의 <mark>긴 기간은</mark> <mark>그들(= 까마귀)이 지능을 발달시키는 것을 가능하게 한다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>clever(영리한)·intelligence(지능) → (A) intelligent(똑똑한), rely on(의존하다)·extended period(긴 기간) → (B) dependency(의존)</span></div><div class=\"ck-step key\"><span class=\"lab\">요약문 (7번) · 짝 맞추기</span><div class=\"en\"><mark>Crows are more intelligent</mark> than chickens <mark>because crows have a longer period of dependency</mark>.</div><p class=\"ko\"><mark>까마귀는 더 긴 의존 기간을 가지고 있기 때문에</mark> 닭보다 더 똑똑하다</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">intelligent 똑똑한 … dependency 의존<small>1번 clever(영리한)·6번 intelligence(지능) → intelligent(똑똑한), 3번 rely on(의존하다) → dependency(의존)예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">intelligent 똑똑한 … competition 경쟁</span><span class=\"why\">(A)는 맞지만 (B)가 틀려요. 3번에서 까마귀는 어미새에게 rely on(의존하다)한다고 했지, 누구와 경쟁한다는 말은 지문에 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">passive 수동적인 … dependency 의존</span><span class=\"why\">(B)는 맞지만 (A)가 틀려요. 4번에서 까마귀는 사냥에 훨씬 flexible(유연한)하고 1번에서 clever(영리한)하다고 했으니 수동적인 새가 아니에요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">selfish 이기적인 … competition 경쟁</span><span class=\"why\">둘 다 틀려요. 지문은 까마귀가 이기적이라고 하지 않았고, 2번처럼 문제 해결을 잘하는 영리함을 말해요. 경쟁하는 장면도 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">passive 수동적인 … hunting 사냥</span><span class=\"why\">둘 다 틀려요. hunting(사냥)은 4번에 나와서 끌리지만 지능의 원인이 아니라 결과예요. 원인은 6번의 둥지에 머무는 긴 기간이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds key\" data-ord=\"1\"><span class=\"rn\">1번 · 단서</span><div class=\"rc\"><div class=\"e\">Crows are</div><div class=\"k\">까마귀는 ~이다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">a remarkably clever family of birds.</span></div><div class=\"k\"><span class=\"cw\">몹시 영리한 조류</span></div></div><div class=\"rnat\">까마귀는 몹시 영리한 조류이다.</div><div class=\"rst\">과학 시간에 닭과 까마귀 관찰 일지를 쓴다고 해 봐요. 첫 줄: 까마귀는 <b>몹시 영리한</b> 새. 지문 1번 그대로예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">They are capable of solving</div><div class=\"k\">그들(= 까마귀)은 해결할 수 있다</div></div><div class=\"rc\"><div class=\"e\">many more complex problems</div><div class=\"k\">더 복잡한 많은 문제들을</div></div><div class=\"rc\"><div class=\"e\">compared to other birds,</div><div class=\"k\">다른 새들과 비교하여</div></div><div class=\"rc\"><div class=\"e\">such as chickens.</div><div class=\"k\">닭과 같은</div></div><div class=\"rnat\">그들은 닭과 같은 다른 새들과 비교하여 더 복잡한 많은 문제들을 해결할 수 있다.</div><div class=\"rst\">퍼즐 같은 먹이 상자를 주면 닭보다 까마귀가 훨씬 잘 풀어요. = 지문의 더 복잡한 문제를 해결한다는 말이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">After hatching,</div><div class=\"k\">부화한 후에</div></div><div class=\"rc\"><div class=\"e\">chickens peck busily for their own food</div><div class=\"k\">닭은 자기 먹이를 부지런히 쪼아 먹는다</div></div><div class=\"rc\"><div class=\"e\">much faster than crows,</div><div class=\"k\">까마귀보다 훨씬 더 빠르게</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">which rely on the parent bird</span></div><div class=\"k\"><span class=\"cw\">어미새에게 의존하는</span>(= which는 까마귀를 가리킴)</div></div><div class=\"rc\"><div class=\"e\">to bring them food in the nest.</div><div class=\"k\">둥지에서 그들(= 까마귀)에게 먹이를 가져다주는</div></div><div class=\"rnat\">부화한 후에 닭은 둥지에서 그들(까마귀)에게 먹이를 가져다주는 어미새에게 의존하는 까마귀보다 훨씬 더 빠르게 그들 자신의 먹이를 부지런히 쪼아 먹는다.</div><div class=\"rst\">그런데 아기 때는 반대예요. 병아리는 바로 혼자 쪼아 먹지만, 아기 까마귀는 어미가 먹여 줘요. = 지문의 어미새에게 <b>의존하는</b> 까마귀예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">However,</div><div class=\"k\">하지만</div></div><div class=\"rc\"><div class=\"e\">as adults,</div><div class=\"k\">다 자랐을 때</div></div><div class=\"rc\"><div class=\"e\">chickens have very limited hunting skills</div><div class=\"k\">닭은 매우 제한적인 사냥 기술을 가지는</div></div><div class=\"rc\"><div class=\"e\">whereas crows are much more flexible</div><div class=\"k\">반면에 까마귀는 훨씬 더 유연하다</div></div><div class=\"rc\"><div class=\"e\">in hunting for food.</div><div class=\"k\">먹이를 사냥하는 데 있어서</div></div><div class=\"rnat\">하지만 다 자랐을 때 닭은 매우 제한적인 사냥 기술을 가지는 반면에 까마귀는 먹이를 사냥하는 데 있어서 훨씬 더 유연하다.</div><div class=\"rst\"><b>하지만</b>(However) 다 크고 나면, 닭은 먹이 찾는 법이 몇 개 없고 까마귀는 이리저리 잘 찾아내요. 지문의 훨씬 <b>유연한</b> 사냥이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Crows also end up with</div><div class=\"k\">까마귀는 또한 결국 갖게 된다</div></div><div class=\"rc\"><div class=\"e\">bigger and more complex brains.</div><div class=\"k\">더 크고 더 복잡한 뇌를</div></div><div class=\"rnat\">까마귀는 또한 결국 더 크고 더 복잡한 뇌를 갖게 된다.</div><div class=\"rst\">게다가 까마귀는 결국 뇌도 더 크고 복잡해져요. 지문도 까마귀가 더 크고 복잡한 뇌를 갖게 된다고 해요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Their extended period</span></div><div class=\"k\"><span class=\"cw\">그들(= 까마귀)의 긴 기간은</span></div></div><div class=\"rc\"><div class=\"e\">between hatching and flight from the nest</div><div class=\"k\">부화와 둥지로부터의 탈출(떠나는 것) 사이의</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">enables them to develop intelligence.</span></div><div class=\"k\"><span class=\"cw\">그들(= 까마귀)이 지능을 발달시키는 것을 가능하게 한다</span></div></div><div class=\"rnat\">그들의 부화와 둥지로부터의 탈출(떠나는 것) 사이의 긴 기간은 그들이 지능을 발달시키는 것을 가능하게 한다.</div><div class=\"rst\">왜일까요? 둥지에서 오래 보살핌 받는 <b>긴 기간</b> 동안 머리가 자라는 거예요. 지문의 지능을 발달시키는 것을 가능하게 한다예요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Crows are more intelligent</span></div><div class=\"k\"><span class=\"cw\">까마귀는 더 똑똑하다</span> ※ 문제지엔 (A)·(B)가 빈칸으로 되어 있음 (정답: intelligent, dependency)</div></div><div class=\"rc\"><div class=\"e\">than chickens</div><div class=\"k\">닭보다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">because crows have a longer period of dependency.</span></div><div class=\"k\"><span class=\"cw\">까마귀는 더 긴 의존 기간을 가지고 있기 때문에</span></div></div><div class=\"rnat\">까마귀는 더 긴 (B)의존 기간을 가지고 있기 때문에 (까마귀가) 닭보다 더 (A)똑똑하다.</div><div class=\"rst\">일지 결론: 까마귀는 더 오래 <b>의존하기</b>(dependency) 때문에 닭보다 더 <b>똑똑하다</b>(intelligent). 1·3·6번을 합친 요약이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"remarkably\" data-m=\"몹시, 놀랍게도\"><b>remarkably</b>몹시, 놀랍게도</button><button type=\"button\" class=\"wdb\" data-w=\"hatch\" data-m=\"부화하다\"><b>hatch</b>부화하다</button><button type=\"button\" class=\"wdb\" data-w=\"rely on\" data-m=\"~에 의존하다\"><b>rely on</b>~에 의존하다</button><button type=\"button\" class=\"wdb\" data-w=\"flexible\" data-m=\"유연한\"><b>flexible</b>유연한</button><button type=\"button\" class=\"wdb\" data-w=\"extended\" data-m=\"길어진, 긴\"><b>extended</b>길어진, 긴</button><button type=\"button\" class=\"wdb\" data-w=\"dependency\" data-m=\"의존\"><b>dependency</b>의존</button></div>", "10": "<p class=\"mtr\">마더텅 정답률 <b>75%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">이야기 순서는 <b>사건의 시간 고리</b>를 잡으세요. 갇힌 방 → <b>that room</b>(그 방)에서 탈출·사자 치료 → 사자 <b>회복</b>·우리에 갇힘 → 그 <b>소식</b>을 듣고 마을이 모임 순으로 이어 붙이면 돼요.</p><div class=\"ck-step\"><span class=\"lab\">(A) 끝</span><div class=\"en\">He <mark>kept the slave in a small room</mark> and locked it from outside.</div><p class=\"ko\">그는 그 노예를 <mark>작은 방에 가두었고</mark> 밖에서 그 방을 잠갔다</p></div><div class=\"ck-via\"><i>▼</i><span>that room(그 방) = (A) 끝의 잠긴 작은 방</span></div><div class=\"ck-step key\"><span class=\"lab\">(C) · 첫 번째 고리</span><div class=\"en\">Somehow <mark>the slave escaped from that room</mark> and ran away.</div><p class=\"ko\">어쩌다 <mark>그 노예는 그 방에서 탈출해서</mark> 도망갔다</p></div><div class=\"ck-via\"><i>▼</i><span>(C)에서 다친 사자를 돌봐 줬으니, 다음은 사자가 회복하는 장면</span></div><div class=\"ck-step key\"><span class=\"lab\">(C) 끝 → (B) · 두 번째 고리</span><div class=\"en\">After a few days <mark>the lion recovered</mark>.</div><p class=\"ko\">며칠 뒤에 <mark>사자는 회복되었다</mark></p></div><div class=\"ck-via\"><i>▼</i><span>(B)는 노예를 사자 우리에 넣으라는 명령으로 끝나요</span></div><div class=\"ck-step\"><span class=\"lab\">(B) 끝</span><div class=\"en\">The rich man ordered guards <mark>to put him in the lion's cage</mark>.</div><p class=\"ko\">부자는 경비원들에게 <mark>그(= 노예)를 사자 우리에 넣으라고</mark> 명령했다</p></div><div class=\"ck-via\"><i>▼</i><span>it(그 일) = (B) 끝의 사자 우리 사건, 그 소식에 마을이 모여요</span></div><div class=\"ck-step key\"><span class=\"lab\">(D) · 세 번째 고리</span><div class=\"en\">The whole village <mark>got the news about it</mark> and came to see.</div><p class=\"ko\">온 마을 사람들이 <mark>그 일에 대한 소식을 듣고</mark> 보러 왔다</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">(C) – (B) – (D)<small>그 방 탈출 → 사자 회복 → 그 소식, 시간 고리가 모두 맞아요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">(C) – (D) – (B)</span><span class=\"why\">(D)의 it(그 일)은 노예가 사자 우리에 갇히는 사건인데, 그 명령은 (B) 끝에 나와요. 사건이 일어나기도 전에 마을이 구경하러 올 수 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">(B) – (D) – (C)</span><span class=\"why\">(B) 첫 문장 the lion recovered(사자는 회복되었다)는 다친 사자가 먼저 나와야 해요. 사자가 다친 장면은 (C)에 있어요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">(D) – (B) – (C)</span><span class=\"why\">(A)에서 노예는 작은 방에 갇혀 있는데, (D)는 사자 우리에 갇힌 장면이에요. 탈출(C)과 체포(B)가 빠져 버려요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">(D) – (C) – (B)</span><span class=\"why\">(D)가 맨 앞이면 노예가 숲에서 도와준 사자라는 21번이 (C)의 숲 장면보다 먼저 나와요. 아직 사자를 만나지도 않았어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">(A)(1) Once in a village</div><div class=\"k\">옛날에 한 마을에</div></div><div class=\"rc\"><div class=\"e\">lived a rich man.</div><div class=\"k\">부자가 살고 있었다</div></div><div class=\"rnat\">(A) 옛날에 한 마을에 부자가 살고 있었다.</div><div class=\"rst\">학급 연극으로 이 이야기를 올린다고 해 봐요. 1막: 옛날 한 마을에 부자가 살았어요. = 지문 1번이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">(A)(2) He had</div><div class=\"k\">그(= 부자)는 가지고(거느리고) 있었다</div></div><div class=\"rc\"><div class=\"e\">many slaves and servants</div><div class=\"k\">많은 노예들과 하인들을</div></div><div class=\"rc\"><div class=\"e\">for work.</div><div class=\"k\">일을 해 주는</div></div><div class=\"rnat\">그는 일을 해 주는 많은 노예들과 하인들을 가지고(거느리고) 있었다.</div><div class=\"rst\">부자 집에는 일을 해 주는 노예와 하인이 아주 많았어요. = 지문 2번이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">(A)(3) The rich man was very unkind and cruel</div><div class=\"k\">부자는 매우 불친절하고 잔인했다</div></div><div class=\"rc\"><div class=\"e\">to them.</div><div class=\"k\">그들(= 노예들과 하인들)에게</div></div><div class=\"rnat\">부자는 그들에게 매우 불친절하고 잔인했다.</div><div class=\"rst\">그런데 부자는 그들에게 아주 <b>못되고 잔인</b>했어요. = 지문 3번, 이 이야기의 시작 상황이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">(A)(4) One day</div><div class=\"k\">어느 날</div></div><div class=\"rc\"><div class=\"e\">one of the slaves</div><div class=\"k\">노예 중 한 명이</div></div><div class=\"rc\"><div class=\"e\">made a mistake</div><div class=\"k\">실수를 했다</div></div><div class=\"rc\"><div class=\"e\">while cooking food.</div><div class=\"k\">음식을 요리하던 중</div></div><div class=\"rnat\">어느 날 노예 중 한 명이 음식을 요리하던 중 실수를 했다.</div><div class=\"rst\">어느 날 노예 한 명이 요리하다가 실수를 해요. = 지문 4번이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">(A)(5) (a) He</div><div class=\"k\">(a) 그(= 노예)가</div></div><div class=\"rc\"><div class=\"e\">overcooked the food.</div><div class=\"k\">음식을 너무 익힌 것이다</div></div><div class=\"rnat\">(a)그(노예)가 음식을 너무 익힌 것이다.</div><div class=\"rst\">그 노예가 음식을 너무 익혀 버렸어요. = 지문 5번, 실수한 사람(He 그) = 노예예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">(A)(6) When the rich man saw the food,</div><div class=\"k\">부자가 그 음식을 봤을 때</div></div><div class=\"rc\"><div class=\"e\">he became angry</div><div class=\"k\">그(= 부자)는 화가 나서</div></div><div class=\"rc\"><div class=\"e\">and punished the slave.</div><div class=\"k\">그 노예에게 벌을 주었다</div></div><div class=\"rnat\">부자가 그 음식을 봤을 때, 그는 화가 나서 그 노예에게 벌을 주었다.</div><div class=\"rst\">음식을 본 부자는 화가 나서 그 노예에게 벌을 줘요. = 지문 6번이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc ckc\"><div class=\"e\">(A)(7) He <span class=\"cw\">kept the slave in a small room</span></div><div class=\"k\">그(= 부자)는 그 노예를 <span class=\"cw\">작은 방에 가두었고</span></div></div><div class=\"rc\"><div class=\"e\">and locked it from outside.</div><div class=\"k\">밖에서 그 방을 잠갔다</div></div><div class=\"rnat\">그는 그 노예를 작은 방에 가두었고 밖에서 그 방을 잠갔다.</div><div class=\"rst\">부자는 노예를 <b>작은 방에 가두고</b> 밖에서 문을 잠가요. 여기서 (A)가 끝나요.</div></div><div class=\"rds key\" data-ord=\"14\"><span class=\"rn\">8번 · 단서</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">(B)(1) After a few days</div><div class=\"k\">며칠 뒤에</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">the lion recovered.</span></div><div class=\"k\"><span class=\"cw\">사자는 회복되었다</span></div></div><div class=\"rnat\">(B) 며칠 뒤에 사자는 회복되었다.</div><div class=\"rst\"><b>며칠 뒤 사자가 회복</b>해요. (C)에서 돌봐 준 결과가 바로 이어져요. = 지문 8번이에요.</div></div><div class=\"rds\" data-ord=\"15\"><span class=\"rn\">9번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">(B)(2) The slave and the lion</div><div class=\"k\">그 노예와 사자는</div></div><div class=\"rc\"><div class=\"e\">became very close friends.</div><div class=\"k\">아주 친한 친구가 되었다</div></div><div class=\"rnat\">그 노예와 사자는 아주 친한 친구가 되었다.</div><div class=\"rst\">노예와 사자는 아주 친한 친구가 돼요. = 지문 9번이에요.</div></div><div class=\"rds\" data-ord=\"16\"><span class=\"rn\">10번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">(B)(3) A few days went by</div><div class=\"k\">며칠이 지났는데</div></div><div class=\"rc\"><div class=\"e\">but one day</div><div class=\"k\">어느 날</div></div><div class=\"rc\"><div class=\"e\">the slave was caught</div><div class=\"k\">그 노예가 붙잡혔다</div></div><div class=\"rc\"><div class=\"e\">by one of the guards of the rich man.</div><div class=\"k\">부자의 경비원 중 한명에게</div></div><div class=\"rnat\">며칠이 지났는데 어느 날 그 노예가 부자의 경비원 중 한명에게 붙잡혔다.</div><div class=\"rst\">며칠이 지나 노예가 부자의 경비원에게 붙잡혀요. = 지문 10번이에요.</div></div><div class=\"rds\" data-ord=\"17\"><span class=\"rn\">11번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">(B)(4) The guard took (b) him</div><div class=\"k\">그 경비원이 (b) 그(= 노예)를 데려갔고</div></div><div class=\"rc\"><div class=\"e\">to the rich man,</div><div class=\"k\">부자에게</div></div><div class=\"rc\"><div class=\"e\">who decided to punish him severely.</div><div class=\"k\">부자는(= 관계대명사 who) 그를 심하게 벌하기로 마음먹었다</div></div><div class=\"rnat\">그 경비원이 (b)그(노예)를 부자에게 데려갔고, 부자는 그를 심하게 벌하기로 마음먹었다.</div><div class=\"rst\">경비원이 노예를 부자에게 끌고 가고, 부자는 크게 벌주기로 해요. = 지문 11번이에요.</div></div><div class=\"rds\" data-ord=\"18\"><span class=\"rn\">12번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">(B)(5) The rich man ordered guards</div><div class=\"k\">부자는 경비원들에게 명령했다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">to put him in the lion's cage.</span></div><div class=\"k\"><span class=\"cw\">그(= 노예)를 사자 우리에 넣으라고</span></div></div><div class=\"rnat\">부자는 경비원들에게 그를 사자 우리에 넣으라고 명령했다.</div><div class=\"rst\">부자는 노예를 <b>사자 우리에 넣으라고</b> 명령해요. 이 큰 사건이 (B)의 끝이에요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">13번 · 단서</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">(C)(1) Somehow</div><div class=\"k\">어쩌다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">the slave escaped from that room</span></div><div class=\"k\"><span class=\"cw\">그 노예는 그 방에서 탈출해서</span></div></div><div class=\"rc\"><div class=\"e\">and ran away.</div><div class=\"k\">도망갔다</div></div><div class=\"rnat\">(C) 어쩌다 그 노예는 그 방에서 탈출해서 도망갔다.</div><div class=\"rst\"><b>그 방에서</b>(from that room) 노예가 어쩌다 빠져나와 도망쳐요. (A)의 잠긴 방을 that room(그 방)이 이어받아요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">14번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">(C)(2) (c) He</div><div class=\"k\">(c) 그(= 노예)는</div></div><div class=\"rc\"><div class=\"e\">went to a forest.</div><div class=\"k\">숲으로 갔다</div></div><div class=\"rnat\">(c)그(노예)는 숲으로 갔다.</div><div class=\"rst\">노예는 숲으로 도망가요. = 지문 14번이에요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">15번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">(C)(3) There</div><div class=\"k\">그곳에서</div></div><div class=\"rc\"><div class=\"e\">he saw a lion.</div><div class=\"k\">그는 사자 한 마리를 보았다</div></div><div class=\"rnat\">그곳에서 그는 사자 한 마리를 보았다.</div><div class=\"rst\">그곳에서 노예는 사자 한 마리를 만나요. = 지문 15번이에요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">16번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">(C)(4) Instead of becoming afraid of the lion and running away,</div><div class=\"k\">사자를 무서워하여 도망가기보다</div></div><div class=\"rc\"><div class=\"e\">he went close to the lion.</div><div class=\"k\">그는 사자에게 가까이 갔다</div></div><div class=\"rnat\">사자를 무서워하여 도망가기보다, 그는 사자에게 가까이 갔다.</div><div class=\"rst\">무서워서 도망칠 줄 알았는데, 노예는 오히려 사자에게 다가가요. = 지문 16번이에요.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">17번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">(C)(5) He saw</div><div class=\"k\">그는 보았다</div></div><div class=\"rc\"><div class=\"e\">the lion was injured</div><div class=\"k\">사자가 다쳐서</div></div><div class=\"rc\"><div class=\"e\">and one of his legs was bleeding.</div><div class=\"k\">그(= 사자)의 한쪽 다리에서 피가 나는 것을</div></div><div class=\"rnat\">그는 사자가 다쳐서 그(사자)의 한쪽 다리에서 피가 나는 것을 보았다.</div><div class=\"rst\">가까이 가 보니 사자가 다쳐서 한쪽 다리에서 피가 나고 있었어요. = 지문 17번이에요.</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">18번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">(C)(6) The slave searched for herbs</div><div class=\"k\">노예는 약초를 찾아서</div></div><div class=\"rc\"><div class=\"e\">to cure the lion's wound</div><div class=\"k\">사자의 상처를 치료해 줄</div></div><div class=\"rc\"><div class=\"e\">and took care of the lion.</div><div class=\"k\">그 사자를 돌봐주었다</div></div><div class=\"rnat\">노예는 사자의 상처를 치료해 줄 약초를 찾아서 그 사자를 돌봐주었다.</div><div class=\"rst\">노예는 약초를 찾아 상처를 치료하고 <b>사자를 돌봐 줘요</b>. (C)가 여기서 끝나요.</div></div><div class=\"rds key\" data-ord=\"19\"><span class=\"rn\">19번 · 단서</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">(D)(1) The whole village</div><div class=\"k\">온 마을 사람들이</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">got the news about it</span></div><div class=\"k\"><span class=\"cw\">그 일에 대한 소식을 듣고</span></div></div><div class=\"rc\"><div class=\"e\">and came to see.</div><div class=\"k\">보러 왔다</div></div><div class=\"rnat\">(D) 모든 마을 사람들이 그 일에 대한 소식을 듣고 보러 왔다.</div><div class=\"rst\"><b>그 일</b>(it) 소식을 듣고 온 마을 사람들이 구경하러 와요. it(그 일) = (B) 끝의 사자 우리 사건이에요.</div></div><div class=\"rds\" data-ord=\"20\"><span class=\"rn\">20번</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">(D)(2) As soon as the slave was locked in the lion's cage,</div><div class=\"k\">그 노예가 사자 우리에 갇히자마자</div></div><div class=\"rc\"><div class=\"e\">the lion came near (d) him</div><div class=\"k\">사자가 (d) 그(= 노예)에게 가까이 와서</div></div><div class=\"rc\"><div class=\"e\">and started licking his hand</div><div class=\"k\">그의 손을 핥기 시작했고</div></div><div class=\"rc\"><div class=\"e\">and hugged him.</div><div class=\"k\">그를 껴안았다</div></div><div class=\"rnat\">그 노예가 사자 우리에 갇히자마자 사자가 (d)그(노예)에게 가까이 와서 그의 손을 핥기 시작했고 그를 껴안았다.</div><div class=\"rst\">노예가 우리에 갇히자마자 사자가 다가와 손을 핥고 꼭 껴안아요. = 지문 20번이에요.</div></div><div class=\"rds\" data-ord=\"21\"><span class=\"rn\">21번</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">(D)(3) It was the same lion</div><div class=\"k\">같은(바로 그) 사자였다</div></div><div class=\"rc\"><div class=\"e\">that the slave had helped in the forest.</div><div class=\"k\">노예가 숲에서 도와주었던</div></div><div class=\"rnat\">노예가 숲에서 도와주었던 같은(바로 그) 사자였다.</div><div class=\"rst\">바로 숲에서 노예가 돌봐 줬던 그 사자였어요. = 지문 21번이에요.</div></div><div class=\"rds\" data-ord=\"22\"><span class=\"rn\">22번</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">(D)(4) Seeing this,</div><div class=\"k\">이것을 보고</div></div><div class=\"rc\"><div class=\"e\">everyone was surprised.</div><div class=\"k\">모두 놀랐다</div></div><div class=\"rnat\">이것을 보고, 모두 놀랐다.</div><div class=\"rst\">이걸 본 모두가 깜짝 놀라요. = 지문 22번이에요.</div></div><div class=\"rds\" data-ord=\"23\"><span class=\"rn\">23번</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">(D)(5) The rich man thought</div><div class=\"k\">부자는 생각했다</div></div><div class=\"rc\"><div class=\"e\">that the slave was such a great person</div><div class=\"k\">그 노예가 아주 대단한 사람이어서</div></div><div class=\"rc\"><div class=\"e\">that the lion didn't kill him.</div><div class=\"k\">사자가 그(= 노예)를 죽이지 않았다고</div></div><div class=\"rnat\">부자는 그 노예가 아주 대단한 사람이어서 사자가 그를 죽이지 않았다고 생각했다.</div><div class=\"rst\">부자는 사자가 안 잡아먹을 만큼 노예가 대단한 사람이라고 생각해요. = 지문 23번이에요.</div></div><div class=\"rds\" data-ord=\"24\"><span class=\"rn\">24번</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">(D)(6) (e) He freed the slave,</div><div class=\"k\">(e) 그(= 부자)는 노예를 풀어주었고</div></div><div class=\"rc\"><div class=\"e\">made him his friend</div><div class=\"k\">그(= 노예)를 그(= 부자)의 친구로 삼았으며</div></div><div class=\"rc\"><div class=\"e\">and started to treat all his servants and slaves better.</div><div class=\"k\">그(= 부자)의 모든 하인들과 노예들을 더 잘 대하기 시작했다</div></div><div class=\"rnat\">(e)그(부자)는 노예를 풀어주었고, 그(노예)를 그(부자)의 친구로 삼았으며 그(부자)의 모든 하인들과 노예들을 더 잘 대하기 시작했다.</div><div class=\"rst\">부자는 노예를 풀어 주고 친구로 삼고, 모든 하인과 노예를 더 잘 대하기 시작해요. 연극의 마지막 막이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"cruel\" data-m=\"잔인한\"><b>cruel</b>잔인한</button><button type=\"button\" class=\"wdb\" data-w=\"punish\" data-m=\"벌주다\"><b>punish</b>벌주다</button><button type=\"button\" class=\"wdb\" data-w=\"escape\" data-m=\"탈출하다\"><b>escape</b>탈출하다</button><button type=\"button\" class=\"wdb\" data-w=\"injured\" data-m=\"다친\"><b>injured</b>다친</button><button type=\"button\" class=\"wdb\" data-w=\"herb\" data-m=\"약초\"><b>herb</b>약초</button><button type=\"button\" class=\"wdb\" data-w=\"recover\" data-m=\"회복하다\"><b>recover</b>회복하다</button></div>", "11": "<p class=\"mtr\">마더텅 정답률 <b>70%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">지칭 문제는 대명사마다 <b>그 문장 안의 행동</b>으로 누구인지 확인하세요. (e)는 <b>freed the slave</b>(노예를 풀어 주었다)이니, 노예를 풀어 줄 수 있는 사람은 부자뿐이에요.</p><div class=\"ck-step\"><span class=\"lab\">(a) · 5번 문장</span><div class=\"en\">(a) He overcooked the food.</div><p class=\"ko\">(a) 그(= 노예)가 음식을 너무 익힌 것이다 → 4번에서 요리하다 실수한 노예</p></div><div class=\"ck-via\"><i>▼</i><span>경비원에게 붙잡혀 부자에게 끌려가는 사람 = 노예</span></div><div class=\"ck-step\"><span class=\"lab\">(b) · 11번 문장</span><div class=\"en\">The guard took (b) him to the rich man, who decided to punish him severely.</div><p class=\"ko\">그 경비원이 (b) 그(= 노예)를 부자에게 데려갔고 … → 10번에서 붙잡힌 노예</p></div><div class=\"ck-via\"><i>▼</i><span>13번에서 방을 탈출한 노예가 숲으로 가요</span></div><div class=\"ck-step\"><span class=\"lab\">(c) · 14번 문장</span><div class=\"en\">(c) He went to a forest.</div><p class=\"ko\">(c) 그(= 노예)는 숲으로 갔다 → 탈출한 노예</p></div><div class=\"ck-via\"><i>▼</i><span>사자 우리에 갇힌 사람 = 12번에서 우리에 넣어진 노예</span></div><div class=\"ck-step\"><span class=\"lab\">(d) · 20번 문장</span><div class=\"en\">As soon as the slave was locked in the lion's cage, the lion came near (d) him …</div><p class=\"ko\">그 노예가 사자 우리에 갇히자마자 사자가 (d) 그(= 노예)에게 가까이 와서 … → 노예</p></div><div class=\"ck-via\"><i>▼</i><span>바로 앞 23번 주어가 The rich man(부자), 노예를 풀어 주는 사람도 부자</span></div><div class=\"ck-step key\"><span class=\"lab\">(e) · 23·24번 문장 · 결정적 단서</span><div class=\"en\"><mark>(e) He freed the slave</mark>, made him his friend …</div><p class=\"ko\"><mark>(e) 그(= 부자)는 노예를 풀어주었고</mark> 그(= 노예)를 그의 친구로 삼았으며 … → 부자</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">(e) He 그 = 부자<small>노예를 풀어 주는 사람이고, 바로 앞 23번 주어가 부자라서 (e)만 부자예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">(b) him 그를 = 노예</span><span class=\"why\">11번에는 the guard(경비원)·the rich man(부자)이 함께 나와 헷갈리기 쉬워요. 하지만 10번에서 붙잡힌 사람이 노예라서, 경비원이 부자에게 데려간 사람도 노예예요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">(a) He 그 = 노예</span><span class=\"why\">4번에서 요리하다 실수한 사람이 one of the slaves(노예 중 한 명)예요. 음식을 너무 익힌 사람도 그 노예예요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">(c) He 그 = 노예</span><span class=\"why\">13번에서 the slave escaped(노예가 탈출했다)고 바로 이어서 숲으로 간 사람이에요. 그래서 노예예요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">(d) him 그 = 노예</span><span class=\"why\">20번 앞부분에서 the slave was locked in the lion's cage(노예가 사자 우리에 갇혔다)고 했으니 사자가 다가간 사람은 노예예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">(A)(1) Once in a village</div><div class=\"k\">옛날에 한 마을에</div></div><div class=\"rc\"><div class=\"e\">lived a rich man.</div><div class=\"k\">부자가 살고 있었다</div></div><div class=\"rnat\">(A) 옛날에 한 마을에 부자가 살고 있었다.</div><div class=\"rst\">학급 연극으로 이 이야기를 올린다고 해 봐요. 1막: 옛날 한 마을에 부자가 살았어요. = 지문 1번이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">(A)(2) He had</div><div class=\"k\">그(= 부자)는 가지고(거느리고) 있었다</div></div><div class=\"rc\"><div class=\"e\">many slaves and servants</div><div class=\"k\">많은 노예들과 하인들을</div></div><div class=\"rc\"><div class=\"e\">for work.</div><div class=\"k\">일을 해 주는</div></div><div class=\"rnat\">그는 일을 해 주는 많은 노예들과 하인들을 가지고(거느리고) 있었다.</div><div class=\"rst\">부자 집에는 일을 해 주는 노예와 하인이 아주 많았어요. = 지문 2번이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">(A)(3) The rich man was very unkind and cruel</div><div class=\"k\">부자는 매우 불친절하고 잔인했다</div></div><div class=\"rc\"><div class=\"e\">to them.</div><div class=\"k\">그들(= 노예들과 하인들)에게</div></div><div class=\"rnat\">부자는 그들에게 매우 불친절하고 잔인했다.</div><div class=\"rst\">그런데 부자는 그들에게 아주 <b>못되고 잔인</b>했어요. = 지문 3번, 이야기의 시작 상황이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">(A)(4) One day</div><div class=\"k\">어느 날</div></div><div class=\"rc\"><div class=\"e\">one of the slaves</div><div class=\"k\">노예 중 한 명이</div></div><div class=\"rc\"><div class=\"e\">made a mistake</div><div class=\"k\">실수를 했다</div></div><div class=\"rc\"><div class=\"e\">while cooking food.</div><div class=\"k\">음식을 요리하던 중</div></div><div class=\"rnat\">어느 날 노예 중 한 명이 음식을 요리하던 중 실수를 했다.</div><div class=\"rst\">어느 날 노예 한 명이 요리하다가 실수를 해요. = 지문 4번이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">(A)(5) (a) He</div><div class=\"k\">(a) 그(= 노예)가</div></div><div class=\"rc\"><div class=\"e\">overcooked the food.</div><div class=\"k\">음식을 너무 익힌 것이다</div></div><div class=\"rnat\">(a)그(노예)가 음식을 너무 익힌 것이다.</div><div class=\"rst\">그 노예가 음식을 너무 익혀 태워 버렸어요. 실수한 사람이니 <b>(a) 그 = 노예</b>예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">(A)(6) When the rich man saw the food,</div><div class=\"k\">부자가 그 음식을 봤을 때</div></div><div class=\"rc\"><div class=\"e\">he became angry</div><div class=\"k\">그(= 부자)는 화가 나서</div></div><div class=\"rc\"><div class=\"e\">and punished the slave.</div><div class=\"k\">그 노예에게 벌을 주었다</div></div><div class=\"rnat\">부자가 그 음식을 봤을 때, 그는 화가 나서 그 노예에게 벌을 주었다.</div><div class=\"rst\">음식을 본 부자는 화가 나서 그 노예에게 벌을 줘요. = 지문 6번이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">(A)(7) He kept the slave in a small room</div><div class=\"k\">그(= 부자)는 그 노예를 작은 방에 가두었고</div></div><div class=\"rc\"><div class=\"e\">and locked it from outside.</div><div class=\"k\">밖에서 그 방을 잠갔다</div></div><div class=\"rnat\">그는 그 노예를 작은 방에 가두었고 밖에서 그 방을 잠갔다.</div><div class=\"rst\">부자는 노예를 작은 방에 가두고 밖에서 문을 잠가요. 가두는 사람 = 부자, 갇힌 사람 = 노예예요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">(B)(1) After a few days</div><div class=\"k\">며칠 뒤에</div></div><div class=\"rc\"><div class=\"e\">the lion recovered.</div><div class=\"k\">사자는 회복되었다</div></div><div class=\"rnat\">(B) 며칠 뒤에 사자는 회복되었다.</div><div class=\"rst\">며칠 뒤 다쳤던 사자가 회복해요. 노예가 돌봐 준 바로 그 사자예요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">(B)(2) The slave and the lion</div><div class=\"k\">그 노예와 사자는</div></div><div class=\"rc\"><div class=\"e\">became very close friends.</div><div class=\"k\">아주 친한 친구가 되었다</div></div><div class=\"rnat\">그 노예와 사자는 아주 친한 친구가 되었다.</div><div class=\"rst\">노예와 사자는 아주 친한 친구가 돼요. = 지문 9번이에요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">(B)(3) A few days went by</div><div class=\"k\">며칠이 지났는데</div></div><div class=\"rc\"><div class=\"e\">but one day</div><div class=\"k\">어느 날</div></div><div class=\"rc\"><div class=\"e\">the slave was caught</div><div class=\"k\">그 노예가 붙잡혔다</div></div><div class=\"rc\"><div class=\"e\">by one of the guards of the rich man.</div><div class=\"k\">부자의 경비원 중 한명에게</div></div><div class=\"rnat\">며칠이 지났는데 어느 날 그 노예가 부자의 경비원 중 한명에게 붙잡혔다.</div><div class=\"rst\">며칠이 지나 노예가 부자의 경비원에게 붙잡혀요. = 지문 10번이에요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">(B)(4) The guard took (b) him</div><div class=\"k\">그 경비원이 (b) 그(= 노예)를 데려갔고</div></div><div class=\"rc\"><div class=\"e\">to the rich man,</div><div class=\"k\">부자에게</div></div><div class=\"rc\"><div class=\"e\">who decided to punish him severely.</div><div class=\"k\">부자는(= 관계대명사 who) 그를 심하게 벌하기로 마음먹었다</div></div><div class=\"rnat\">그 경비원이 (b)그(노예)를 부자에게 데려갔고, 부자는 그를 심하게 벌하기로 마음먹었다.</div><div class=\"rst\">경비원이 붙잡은 사람을 부자에게 끌고 가요. 끌려간 사람이니 <b>(b) 그 = 노예</b>, 부자는 크게 벌주기로 해요.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><div class=\"rc\"><div class=\"e\">(B)(5) The rich man ordered guards</div><div class=\"k\">부자는 경비원들에게 명령했다</div></div><div class=\"rc\"><div class=\"e\">to put him in the lion's cage.</div><div class=\"k\">그(= 노예)를 사자 우리에 넣으라고</div></div><div class=\"rnat\">부자는 경비원들에게 그를 사자 우리에 넣으라고 명령했다.</div><div class=\"rst\">부자는 노예를 사자 우리에 넣으라고 명령해요. 이 문장의 him(그) = 노예예요.</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">13번</span><div class=\"rc\"><div class=\"e\">(C)(1) Somehow</div><div class=\"k\">어쩌다</div></div><div class=\"rc\"><div class=\"e\">the slave escaped from that room</div><div class=\"k\">그 노예는 그 방에서 탈출해서</div></div><div class=\"rc\"><div class=\"e\">and ran away.</div><div class=\"k\">도망갔다</div></div><div class=\"rnat\">(C) 어쩌다 그 노예는 그 방에서 탈출해서 도망갔다.</div><div class=\"rst\">노예가 어쩌다 그 방에서 빠져나와 도망쳐요. (A)에서 갇혔던 작은 방이에요.</div></div><div class=\"rds\" data-ord=\"14\"><span class=\"rn\">14번</span><div class=\"rc\"><div class=\"e\">(C)(2) (c) He</div><div class=\"k\">(c) 그(= 노예)는</div></div><div class=\"rc\"><div class=\"e\">went to a forest.</div><div class=\"k\">숲으로 갔다</div></div><div class=\"rnat\">(c)그(노예)는 숲으로 갔다.</div><div class=\"rst\">방에서 도망친 노예가 숲으로 가요. 탈출한 사람이니 <b>(c) 그 = 노예</b>예요.</div></div><div class=\"rds\" data-ord=\"15\"><span class=\"rn\">15번</span><div class=\"rc\"><div class=\"e\">(C)(3) There</div><div class=\"k\">그곳에서</div></div><div class=\"rc\"><div class=\"e\">he saw a lion.</div><div class=\"k\">그는 사자 한 마리를 보았다</div></div><div class=\"rnat\">그곳에서 그는 사자 한 마리를 보았다.</div><div class=\"rst\">그곳에서 노예는 사자 한 마리를 만나요. = 지문 15번이에요.</div></div><div class=\"rds\" data-ord=\"16\"><span class=\"rn\">16번</span><div class=\"rc\"><div class=\"e\">(C)(4) Instead of becoming afraid of the lion and running away,</div><div class=\"k\">사자를 무서워하여 도망가기보다</div></div><div class=\"rc\"><div class=\"e\">he went close to the lion.</div><div class=\"k\">그는 사자에게 가까이 갔다</div></div><div class=\"rnat\">사자를 무서워하여 도망가기보다, 그는 사자에게 가까이 갔다.</div><div class=\"rst\">무서워서 도망칠 줄 알았는데, 노예는 오히려 사자에게 다가가요. = 지문 16번이에요.</div></div><div class=\"rds\" data-ord=\"17\"><span class=\"rn\">17번</span><div class=\"rc\"><div class=\"e\">(C)(5) He saw</div><div class=\"k\">그는 보았다</div></div><div class=\"rc\"><div class=\"e\">the lion was injured</div><div class=\"k\">사자가 다쳐서</div></div><div class=\"rc\"><div class=\"e\">and one of his legs was bleeding.</div><div class=\"k\">그(= 사자)의 한쪽 다리에서 피가 나는 것을</div></div><div class=\"rnat\">그는 사자가 다쳐서 그(사자)의 한쪽 다리에서 피가 나는 것을 보았다.</div><div class=\"rst\">가까이 가 보니 사자가 다쳐서 한쪽 다리에서 피가 나고 있었어요. = 지문 17번이에요.</div></div><div class=\"rds\" data-ord=\"18\"><span class=\"rn\">18번</span><div class=\"rc\"><div class=\"e\">(C)(6) The slave searched for herbs</div><div class=\"k\">노예는 약초를 찾아서</div></div><div class=\"rc\"><div class=\"e\">to cure the lion's wound</div><div class=\"k\">사자의 상처를 치료해 줄</div></div><div class=\"rc\"><div class=\"e\">and took care of the lion.</div><div class=\"k\">그 사자를 돌봐주었다</div></div><div class=\"rnat\">노예는 사자의 상처를 치료해 줄 약초를 찾아서 그 사자를 돌봐주었다.</div><div class=\"rst\">노예는 약초를 찾아 사자의 상처를 치료하고 사자를 돌봐 줘요. = 지문 18번이에요.</div></div><div class=\"rds\" data-ord=\"19\"><span class=\"rn\">19번</span><div class=\"rc\"><div class=\"e\">(D)(1) The whole village</div><div class=\"k\">온 마을 사람들이</div></div><div class=\"rc\"><div class=\"e\">got the news about it</div><div class=\"k\">그 일에 대한 소식을 듣고</div></div><div class=\"rc\"><div class=\"e\">and came to see.</div><div class=\"k\">보러 왔다</div></div><div class=\"rnat\">(D) 모든 마을 사람들이 그 일에 대한 소식을 듣고 보러 왔다.</div><div class=\"rst\">그 소식을 듣고 온 마을 사람들이 구경하러 와요. = 지문 19번이에요.</div></div><div class=\"rds\" data-ord=\"20\"><span class=\"rn\">20번</span><div class=\"rc\"><div class=\"e\">(D)(2) As soon as the slave was locked in the lion's cage,</div><div class=\"k\">그 노예가 사자 우리에 갇히자마자</div></div><div class=\"rc\"><div class=\"e\">the lion came near (d) him</div><div class=\"k\">사자가 (d) 그(= 노예)에게 가까이 와서</div></div><div class=\"rc\"><div class=\"e\">and started licking his hand</div><div class=\"k\">그의 손을 핥기 시작했고</div></div><div class=\"rc\"><div class=\"e\">and hugged him.</div><div class=\"k\">그를 껴안았다</div></div><div class=\"rnat\">그 노예가 사자 우리에 갇히자마자 사자가 (d)그(노예)에게 가까이 와서 그의 손을 핥기 시작했고 그를 껴안았다.</div><div class=\"rst\">우리에 갇히자마자 사자가 다가와 손을 핥고 껴안아요. 우리에 갇힌 사람이니 <b>(d) 그 = 노예</b>예요.</div></div><div class=\"rds\" data-ord=\"21\"><span class=\"rn\">21번</span><div class=\"rc\"><div class=\"e\">(D)(3) It was the same lion</div><div class=\"k\">같은(바로 그) 사자였다</div></div><div class=\"rc\"><div class=\"e\">that the slave had helped in the forest.</div><div class=\"k\">노예가 숲에서 도와주었던</div></div><div class=\"rnat\">노예가 숲에서 도와주었던 같은(바로 그) 사자였다.</div><div class=\"rst\">바로 숲에서 노예가 돌봐 줬던 그 사자였어요. = 지문 21번이에요.</div></div><div class=\"rds\" data-ord=\"22\"><span class=\"rn\">22번</span><div class=\"rc\"><div class=\"e\">(D)(4) Seeing this,</div><div class=\"k\">이것을 보고</div></div><div class=\"rc\"><div class=\"e\">everyone was surprised.</div><div class=\"k\">모두 놀랐다</div></div><div class=\"rnat\">이것을 보고, 모두 놀랐다.</div><div class=\"rst\">이걸 본 모두가 깜짝 놀라요. = 지문 22번이에요.</div></div><div class=\"rds key\" data-ord=\"23\"><span class=\"rn\">23번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">(D)(5) <span class=\"cw\">The rich man thought</span></div><div class=\"k\"><span class=\"cw\">부자는 생각했다</span></div></div><div class=\"rc\"><div class=\"e\">that the slave was such a great person</div><div class=\"k\">그 노예가 아주 대단한 사람이어서</div></div><div class=\"rc\"><div class=\"e\">that the lion didn't kill him.</div><div class=\"k\">사자가 그(= 노예)를 죽이지 않았다고</div></div><div class=\"rnat\">부자는 그 노예가 아주 대단한 사람이어서 사자가 그를 죽이지 않았다고 생각했다.</div><div class=\"rst\"><b>부자는</b>(The rich man) 노예가 대단한 사람이라 사자가 안 잡아먹었다고 생각해요. 이 문장의 주어가 다음 (e)의 주인공이에요.</div></div><div class=\"rds key\" data-ord=\"24\"><span class=\"rn\">24번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">(D)(6) <span class=\"cw\">(e) He freed the slave,</span></div><div class=\"k\"><span class=\"cw\">(e) 그(= 부자)는 노예를 풀어주었고</span></div></div><div class=\"rc\"><div class=\"e\">made him his friend</div><div class=\"k\">그(= 노예)를 그(= 부자)의 친구로 삼았으며</div></div><div class=\"rc\"><div class=\"e\">and started to treat all his servants and slaves better.</div><div class=\"k\">그(= 부자)의 모든 하인들과 노예들을 더 잘 대하기 시작했다</div></div><div class=\"rnat\">(e)그(부자)는 노예를 풀어주었고, 그(노예)를 그(부자)의 친구로 삼았으며 그(부자)의 모든 하인들과 노예들을 더 잘 대하기 시작했다.</div><div class=\"rst\">노예를 풀어 주는 사람은 노예 자신일 수 없어요. 그래서 <b>(e) 그 = 부자</b>! 부자는 모두를 더 잘 대하기 시작해요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"overcook\" data-m=\"너무 오래 익히다\"><b>overcook</b>너무 오래 익히다</button><button type=\"button\" class=\"wdb\" data-w=\"guard\" data-m=\"경비원\"><b>guard</b>경비원</button><button type=\"button\" class=\"wdb\" data-w=\"severely\" data-m=\"심하게, 엄하게\"><b>severely</b>심하게, 엄하게</button><button type=\"button\" class=\"wdb\" data-w=\"escape\" data-m=\"탈출하다\"><b>escape</b>탈출하다</button><button type=\"button\" class=\"wdb\" data-w=\"lick\" data-m=\"핥다\"><b>lick</b>핥다</button><button type=\"button\" class=\"wdb\" data-w=\"free\" data-m=\"풀어 주다\"><b>free</b>풀어 주다</button></div>", "12": "<p class=\"mtr\">마더텅 정답률 <b>70%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">불일치 문제는 선택지를 <b>지문 순서대로</b> 하나씩 대조하세요. ③의 <b>‘재빨리 달아났다’</b>처럼 행동을 반대로 바꾼 말이 지문의 <b>Instead of</b>(~하는 대신에)와 부딪히는지 확인해요.</p><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>① ↔ 6번</em>became angry(화가 났다) → 같음</span><span><em>② ↔ 10번</em>caught by one of the guards(경비원 중 한 명에게 붙잡혔다) → 같음</span><span><em>④ ↔ 17번</em>one of his legs was bleeding(한쪽 다리에서 피가 났다) → 같음</span><span><em>⑤ ↔ 20번</em>locked in the lion's cage(사자 우리에 갇혔다) → 같음</span></div><div class=\"ck-eq\">⇒ 네 개는 지문과 그대로 같아요. 남은 ③을 16번과 대조해요</div></div><div class=\"ck-via\"><i>▼</i><span>③의 ‘사자를 보자’를 15번에서 찾아요</span></div><div class=\"ck-step\"><span class=\"lab\">15번 문장 · 사자를 만난 장면</span><div class=\"en\">There he saw a lion.</div><p class=\"ko\">그곳에서 그는 사자 한 마리를 보았다</p></div><div class=\"ck-via\"><i>▼</i><span>사자를 본 다음 노예가 한 행동</span></div><div class=\"ck-step key\"><span class=\"lab\">16번 문장 · 결정적 단서</span><div class=\"en\"><mark>Instead of becoming afraid of the lion and running away</mark>, <mark>he went close to the lion</mark>.</div><p class=\"ko\"><mark>사자를 무서워하여 도망가기보다</mark>, <mark>그는 사자에게 가까이 갔다</mark></p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">노예는 사자를 보자 재빨리 달아났다.<small>16번: 도망치는 대신 사자에게 가까이 갔어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">노예는 사자 우리에 갇혔다.</span><span class=\"why\">사자 우리에 갇혔다니 끝이 나쁜 것 같아 틀린 줄 알기 쉽지만, 20번 was locked in the lion's cage(사자 우리에 갇혔다)와 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">부자는 노예가 요리한 음식을 보고 화가 났다.</span><span class=\"why\">6번에서 부자가 노예가 만든 음식을 보고 became angry(화가 났다)라고 했으니 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">노예는 부자의 경비병에게 잡혔다.</span><span class=\"why\">10번 the slave was caught by one of the guards of the rich man(노예가 부자의 경비원 중 한 명에게 붙잡혔다)과 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">사자의 다리에서 피가 나고 있었다.</span><span class=\"why\">17번 one of his legs was bleeding(그의 한쪽 다리에서 피가 나고 있었다)과 같아요. his(그의) = 사자예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">(A)(1) Once in a village</div><div class=\"k\">옛날에 한 마을에</div></div><div class=\"rc\"><div class=\"e\">lived a rich man.</div><div class=\"k\">부자가 살고 있었다</div></div><div class=\"rnat\">(A) 옛날에 한 마을에 부자가 살고 있었다.</div><div class=\"rst\">학급 연극으로 이 이야기를 올린다고 해 봐요. 1막: 옛날 한 마을에 부자가 살았어요. = 지문 1번이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">(A)(2) He had</div><div class=\"k\">그(= 부자)는 가지고(거느리고) 있었다</div></div><div class=\"rc\"><div class=\"e\">many slaves and servants</div><div class=\"k\">많은 노예들과 하인들을</div></div><div class=\"rc\"><div class=\"e\">for work.</div><div class=\"k\">일을 해 주는</div></div><div class=\"rnat\">그는 일을 해 주는 많은 노예들과 하인들을 가지고(거느리고) 있었다.</div><div class=\"rst\">부자 집에는 일을 해 주는 노예와 하인이 아주 많았어요. = 지문 2번이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">(A)(3) The rich man was very unkind and cruel</div><div class=\"k\">부자는 매우 불친절하고 잔인했다</div></div><div class=\"rc\"><div class=\"e\">to them.</div><div class=\"k\">그들(= 노예들과 하인들)에게</div></div><div class=\"rnat\">부자는 그들에게 매우 불친절하고 잔인했다.</div><div class=\"rst\">그런데 부자는 그들에게 아주 <b>못되고 잔인</b>했어요. 이 이야기의 시작 상황이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">(A)(4) One day</div><div class=\"k\">어느 날</div></div><div class=\"rc\"><div class=\"e\">one of the slaves</div><div class=\"k\">노예 중 한 명이</div></div><div class=\"rc\"><div class=\"e\">made a mistake</div><div class=\"k\">실수를 했다</div></div><div class=\"rc\"><div class=\"e\">while cooking food.</div><div class=\"k\">음식을 요리하던 중</div></div><div class=\"rnat\">어느 날 노예 중 한 명이 음식을 요리하던 중 실수를 했다.</div><div class=\"rst\">어느 날 노예 한 명이 요리하다가 실수를 해요. = 지문 4번이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">(A)(5) (a) He</div><div class=\"k\">(a) 그(= 노예)가</div></div><div class=\"rc\"><div class=\"e\">overcooked the food.</div><div class=\"k\">음식을 너무 익힌 것이다</div></div><div class=\"rnat\">(a)그(노예)가 음식을 너무 익힌 것이다.</div><div class=\"rst\">그 노예가 음식을 너무 오래 익혀 버렸어요. 실수한 사람(그) = 노예예요. = 지문 5번이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">(A)(6) When the rich man saw the food,</div><div class=\"k\">부자가 그 음식을 봤을 때</div></div><div class=\"rc\"><div class=\"e\">he became angry</div><div class=\"k\">그(= 부자)는 화가 나서</div></div><div class=\"rc\"><div class=\"e\">and punished the slave.</div><div class=\"k\">그 노예에게 벌을 주었다</div></div><div class=\"rnat\">부자가 그 음식을 봤을 때, 그는 화가 나서 그 노예에게 벌을 주었다.</div><div class=\"rst\">음식을 본 부자는 <b>화가 나서</b> 노예에게 벌을 줘요. 지문 6번 = 선택지 ①과 같아요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">(A)(7) He kept the slave in a small room</div><div class=\"k\">그(= 부자)는 그 노예를 작은 방에 가두었고</div></div><div class=\"rc\"><div class=\"e\">and locked it from outside.</div><div class=\"k\">밖에서 그 방을 잠갔다</div></div><div class=\"rnat\">그는 그 노예를 작은 방에 가두었고 밖에서 그 방을 잠갔다.</div><div class=\"rst\">부자는 노예를 작은 방에 가두고 밖에서 문을 잠가요. = 지문 7번이에요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">(B)(1) After a few days</div><div class=\"k\">며칠 뒤에</div></div><div class=\"rc\"><div class=\"e\">the lion recovered.</div><div class=\"k\">사자는 회복되었다</div></div><div class=\"rnat\">(B) 며칠 뒤에 사자는 회복되었다.</div><div class=\"rst\">며칠 뒤 다쳤던 사자가 회복해요. 노예가 숲에서 돌봐 준 그 사자예요. = 지문 8번이에요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">(B)(2) The slave and the lion</div><div class=\"k\">그 노예와 사자는</div></div><div class=\"rc\"><div class=\"e\">became very close friends.</div><div class=\"k\">아주 친한 친구가 되었다</div></div><div class=\"rnat\">그 노예와 사자는 아주 친한 친구가 되었다.</div><div class=\"rst\">노예와 사자는 아주 친한 친구가 돼요. = 지문 9번이에요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">(B)(3) A few days went by</div><div class=\"k\">며칠이 지났는데</div></div><div class=\"rc\"><div class=\"e\">but one day</div><div class=\"k\">어느 날</div></div><div class=\"rc\"><div class=\"e\">the slave was caught</div><div class=\"k\">그 노예가 붙잡혔다</div></div><div class=\"rc\"><div class=\"e\">by one of the guards of the rich man.</div><div class=\"k\">부자의 경비원 중 한명에게</div></div><div class=\"rnat\">며칠이 지났는데 어느 날 그 노예가 부자의 경비원 중 한명에게 붙잡혔다.</div><div class=\"rst\">며칠이 지나 노예가 <b>부자의 경비원에게 붙잡혀요</b>. 지문 10번 = 선택지 ②와 같아요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">(B)(4) The guard took (b) him</div><div class=\"k\">그 경비원이 (b) 그(= 노예)를 데려갔고</div></div><div class=\"rc\"><div class=\"e\">to the rich man,</div><div class=\"k\">부자에게</div></div><div class=\"rc\"><div class=\"e\">who decided to punish him severely.</div><div class=\"k\">부자는(= 관계대명사 who) 그를 심하게 벌하기로 마음먹었다</div></div><div class=\"rnat\">그 경비원이 (b)그(노예)를 부자에게 데려갔고, 부자는 그를 심하게 벌하기로 마음먹었다.</div><div class=\"rst\">경비원이 노예를 부자에게 끌고 가고, 부자는 크게 벌주기로 해요. = 지문 11번이에요.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><div class=\"rc\"><div class=\"e\">(B)(5) The rich man ordered guards</div><div class=\"k\">부자는 경비원들에게 명령했다</div></div><div class=\"rc\"><div class=\"e\">to put him in the lion's cage.</div><div class=\"k\">그(= 노예)를 사자 우리에 넣으라고</div></div><div class=\"rnat\">부자는 경비원들에게 그를 사자 우리에 넣으라고 명령했다.</div><div class=\"rst\">부자는 노예를 사자 우리에 넣으라고 명령해요. = 지문 12번이에요.</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">13번</span><div class=\"rc\"><div class=\"e\">(C)(1) Somehow</div><div class=\"k\">어쩌다</div></div><div class=\"rc\"><div class=\"e\">the slave escaped from that room</div><div class=\"k\">그 노예는 그 방에서 탈출해서</div></div><div class=\"rc\"><div class=\"e\">and ran away.</div><div class=\"k\">도망갔다</div></div><div class=\"rnat\">(C) 어쩌다 그 노예는 그 방에서 탈출해서 도망갔다.</div><div class=\"rst\">노예가 어쩌다 그 작은 방에서 빠져나와 도망쳐요. = 지문 13번이에요.</div></div><div class=\"rds\" data-ord=\"14\"><span class=\"rn\">14번</span><div class=\"rc\"><div class=\"e\">(C)(2) (c) He</div><div class=\"k\">(c) 그(= 노예)는</div></div><div class=\"rc\"><div class=\"e\">went to a forest.</div><div class=\"k\">숲으로 갔다</div></div><div class=\"rnat\">(c)그(노예)는 숲으로 갔다.</div><div class=\"rst\">노예는 숲으로 도망가요. = 지문 14번이에요.</div></div><div class=\"rds\" data-ord=\"15\"><span class=\"rn\">15번</span><div class=\"rc\"><div class=\"e\">(C)(3) There</div><div class=\"k\">그곳에서</div></div><div class=\"rc\"><div class=\"e\">he saw a lion.</div><div class=\"k\">그는 사자 한 마리를 보았다</div></div><div class=\"rnat\">그곳에서 그는 사자 한 마리를 보았다.</div><div class=\"rst\">그곳에서 노예는 사자 한 마리를 만나요. = 지문 15번이에요.</div></div><div class=\"rds key\" data-ord=\"16\"><span class=\"rn\">16번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">(C)(4) <span class=\"cw\">Instead of becoming afraid of the lion and running away,</span></div><div class=\"k\"><span class=\"cw\">사자를 무서워하여 도망가기보다</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">he went close to the lion.</span></div><div class=\"k\"><span class=\"cw\">그는 사자에게 가까이 갔다</span></div></div><div class=\"rnat\">사자를 무서워하여 도망가기보다, 그는 사자에게 가까이 갔다.</div><div class=\"rst\">여기가 핵심! 무서워 <b>도망치는 대신</b> 노예는 사자에게 <b>가까이 갔어요</b>. 그래서 ③ “재빨리 달아났다”가 지문 16번과 정반대예요.</div></div><div class=\"rds\" data-ord=\"17\"><span class=\"rn\">17번</span><div class=\"rc\"><div class=\"e\">(C)(5) He saw</div><div class=\"k\">그는 보았다</div></div><div class=\"rc\"><div class=\"e\">the lion was injured</div><div class=\"k\">사자가 다쳐서</div></div><div class=\"rc\"><div class=\"e\">and one of his legs was bleeding.</div><div class=\"k\">그(= 사자)의 한쪽 다리에서 피가 나는 것을</div></div><div class=\"rnat\">그는 사자가 다쳐서 그(사자)의 한쪽 다리에서 피가 나는 것을 보았다.</div><div class=\"rst\">가까이 가 보니 사자 한쪽 다리에서 <b>피가 나고</b> 있었어요. 지문 17번 = 선택지 ④와 같아요.</div></div><div class=\"rds\" data-ord=\"18\"><span class=\"rn\">18번</span><div class=\"rc\"><div class=\"e\">(C)(6) The slave searched for herbs</div><div class=\"k\">노예는 약초를 찾아서</div></div><div class=\"rc\"><div class=\"e\">to cure the lion's wound</div><div class=\"k\">사자의 상처를 치료해 줄</div></div><div class=\"rc\"><div class=\"e\">and took care of the lion.</div><div class=\"k\">그 사자를 돌봐주었다</div></div><div class=\"rnat\">노예는 사자의 상처를 치료해 줄 약초를 찾아서 그 사자를 돌봐주었다.</div><div class=\"rst\">노예는 약초를 찾아 사자의 상처를 치료하고 돌봐 줘요. = 지문 18번이에요.</div></div><div class=\"rds\" data-ord=\"19\"><span class=\"rn\">19번</span><div class=\"rc\"><div class=\"e\">(D)(1) The whole village</div><div class=\"k\">온 마을 사람들이</div></div><div class=\"rc\"><div class=\"e\">got the news about it</div><div class=\"k\">그 일에 대한 소식을 듣고</div></div><div class=\"rc\"><div class=\"e\">and came to see.</div><div class=\"k\">보러 왔다</div></div><div class=\"rnat\">(D) 모든 마을 사람들이 그 일에 대한 소식을 듣고 보러 왔다.</div><div class=\"rst\">노예가 사자 우리에 들어간다는 소식에 온 마을 사람들이 구경하러 와요. = 지문 19번이에요.</div></div><div class=\"rds\" data-ord=\"20\"><span class=\"rn\">20번</span><div class=\"rc\"><div class=\"e\">(D)(2) As soon as the slave was locked in the lion's cage,</div><div class=\"k\">그 노예가 사자 우리에 갇히자마자</div></div><div class=\"rc\"><div class=\"e\">the lion came near (d) him</div><div class=\"k\">사자가 (d) 그(= 노예)에게 가까이 와서</div></div><div class=\"rc\"><div class=\"e\">and started licking his hand</div><div class=\"k\">그의 손을 핥기 시작했고</div></div><div class=\"rc\"><div class=\"e\">and hugged him.</div><div class=\"k\">그를 껴안았다</div></div><div class=\"rnat\">그 노예가 사자 우리에 갇히자마자 사자가 (d)그(노예)에게 가까이 와서 그의 손을 핥기 시작했고 그를 껴안았다.</div><div class=\"rst\">노예가 <b>사자 우리에 갇히자마자</b> 사자가 다가와 손을 핥고 껴안아요. 지문 20번 = 선택지 ⑤와 같아요.</div></div><div class=\"rds\" data-ord=\"21\"><span class=\"rn\">21번</span><div class=\"rc\"><div class=\"e\">(D)(3) It was the same lion</div><div class=\"k\">같은(바로 그) 사자였다</div></div><div class=\"rc\"><div class=\"e\">that the slave had helped in the forest.</div><div class=\"k\">노예가 숲에서 도와주었던</div></div><div class=\"rnat\">노예가 숲에서 도와주었던 같은(바로 그) 사자였다.</div><div class=\"rst\">바로 숲에서 노예가 돌봐 줬던 그 사자였어요. = 지문 21번이에요.</div></div><div class=\"rds\" data-ord=\"22\"><span class=\"rn\">22번</span><div class=\"rc\"><div class=\"e\">(D)(4) Seeing this,</div><div class=\"k\">이것을 보고</div></div><div class=\"rc\"><div class=\"e\">everyone was surprised.</div><div class=\"k\">모두 놀랐다</div></div><div class=\"rnat\">이것을 보고, 모두 놀랐다.</div><div class=\"rst\">이걸 본 모두가 깜짝 놀라요. = 지문 22번이에요.</div></div><div class=\"rds\" data-ord=\"23\"><span class=\"rn\">23번</span><div class=\"rc\"><div class=\"e\">(D)(5) The rich man thought</div><div class=\"k\">부자는 생각했다</div></div><div class=\"rc\"><div class=\"e\">that the slave was such a great person</div><div class=\"k\">그 노예가 아주 대단한 사람이어서</div></div><div class=\"rc\"><div class=\"e\">that the lion didn't kill him.</div><div class=\"k\">사자가 그(= 노예)를 죽이지 않았다고</div></div><div class=\"rnat\">부자는 그 노예가 아주 대단한 사람이어서 사자가 그를 죽이지 않았다고 생각했다.</div><div class=\"rst\">부자는 사자가 안 잡아먹을 만큼 노예가 대단한 사람이라고 생각해요. = 지문 23번이에요.</div></div><div class=\"rds\" data-ord=\"24\"><span class=\"rn\">24번</span><div class=\"rc\"><div class=\"e\">(D)(6) (e) He freed the slave,</div><div class=\"k\">(e) 그(= 부자)는 노예를 풀어주었고</div></div><div class=\"rc\"><div class=\"e\">made him his friend</div><div class=\"k\">그(= 노예)를 그(= 부자)의 친구로 삼았으며</div></div><div class=\"rc\"><div class=\"e\">and started to treat all his servants and slaves better.</div><div class=\"k\">그(= 부자)의 모든 하인들과 노예들을 더 잘 대하기 시작했다</div></div><div class=\"rnat\">(e)그(부자)는 노예를 풀어주었고, 그(노예)를 그(부자)의 친구로 삼았으며 그(부자)의 모든 하인들과 노예들을 더 잘 대하기 시작했다.</div><div class=\"rst\">부자는 노예를 풀어 주고 친구로 삼고, 모든 하인과 노예를 더 잘 대하기 시작해요. 연극의 마지막 막이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"cruel\" data-m=\"잔인한\"><b>cruel</b>잔인한</button><button type=\"button\" class=\"wdb\" data-w=\"punish\" data-m=\"벌주다\"><b>punish</b>벌주다</button><button type=\"button\" class=\"wdb\" data-w=\"injured\" data-m=\"다친\"><b>injured</b>다친</button><button type=\"button\" class=\"wdb\" data-w=\"bleeding\" data-m=\"피가 나는\"><b>bleeding</b>피가 나는</button><button type=\"button\" class=\"wdb\" data-w=\"wound\" data-m=\"상처\"><b>wound</b>상처</button><button type=\"button\" class=\"wdb\" data-w=\"cage\" data-m=\"우리\"><b>cage</b>우리</button></div>"};

    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
