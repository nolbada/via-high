var EXP={"07": "<p class=\"mtr\">마더텅 정답률 <b>50%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸이 <b>첫 문장</b>에 있으면 글 전체가 그 답의 설명이에요. 로봇이 일자리 말고 <b>또 무엇을 빼앗는지</b>, 마지막 8·9번의 <b>think</b>(생각하다)·<b>thought process</b>(사고 과정)에서 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (1번)</span><div class=\"en\">We worry that the robots are taking our jobs, <mark>but</mark> just as common a problem is that the robots are taking <span style=\"white-space:nowrap\">our <span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span>.</span></div><p class=\"ko\">로봇이 직업을 빼앗는 것만큼 흔한 문제는 로봇이 우리의 ( ? )을 빼앗는다는 것</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>3번</em>제니퍼가 어디로 갈지, 무엇을 할지 다 말해 줌</span><span><em>4~7번</em>책 18권도 5권·5권·5권·3권으로 쪼개서 시킴</span></div><div class=\"ck-eq\">⇒ 사람은 시키는 대로 몸만 움직이고, 스스로 정하는 게 하나도 없어요</div></div><div class=\"ck-via\"><i>▼</i><span>앞의 장면들을 한 줄로 정리해요</span></div><div class=\"ck-step\"><span class=\"lab\">8번 문장 · 정리</span><div class=\"en\">Working in such conditions <mark>reduces people to machines</mark> made of flesh.</div><p class=\"ko\">그러한 조건에서 일하는 것은 <mark>사람을 살로 만들어진 기계로 격하시킨다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>기계가 된 사람에게서 빠진 것 = 생각하는 힘</span></div><div class=\"ck-step key\"><span class=\"lab\">9번 문장 · 결정적 단서</span><div class=\"en\">Rather than <mark>asking us to think</mark> or adapt, the Jennifer unit <mark>takes over the thought process</mark> …</div><p class=\"ko\">우리에게 <mark>생각하고 적응하라고 요구하기보다는</mark> Jennifer라는 장치는 <mark>사고 과정을 가져가고</mark> …</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">judgment 판단력<small>9번 takes over the thought process(사고 과정을 가져간다) = 판단력을 빼앗는다예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">cooperation 협력</span><span class=\"why\">창고에서 여럿이 일하니 끌려요. 하지만 지문에 사람끼리 함께 일하는 장면은 없고, 9번이 빼앗는 건 thought process(사고 과정)예요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">reliability 신뢰성</span><span class=\"why\">4번에서 제니퍼가 실수를 줄여 준다고 했지, 사람의 믿음직함을 빼앗는다는 말은 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">endurance 인내력</span><span class=\"why\">5~7번처럼 계속 집어도 버티는 힘 이야기가 아니에요. 9번은 생각할 기회를 빼앗는다고 했어요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">sociability 사교성</span><span class=\"why\">사람들과 어울리는 이야기는 한 번도 나오지 않아요. 지문은 제니퍼가 혼자 일하는 작업자에게 지시하는 장면뿐이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">We worry</div><div class=\"k\">우리는 걱정한다</div></div><div class=\"rc\"><div class=\"e\">that the robots are taking our jobs,</div><div class=\"k\">로봇이 우리의 직업을 빼앗고 있다고</div></div><div class=\"rc\"><div class=\"e\">but just as common a problem</div><div class=\"k\">하지만 그만큼 흔한 문제는</div></div><div class=\"rc\"><div class=\"e\">is that the robots are taking</div><div class=\"k\">로봇이 빼앗고 있다는 것이다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">our judgment</span>.</div><div class=\"k\"><span class=\"cw\">우리의 판단력을</span> ※ 문제지엔 빈칸으로 되어 있음 (정답: judgment)</div></div><div class=\"rnat\">우리는 로봇이 우리의 직업을 빼앗고 있다고 걱정하지만, 그만큼 흔한 문제는 로봇이 우리의 판단력을 빼앗고 있다는 것이다.</div><div class=\"rst\">게임에서 자동사냥을 켜면 편하지만, 어디로 갈지 <b>내가 고르는 힘</b>(judgment 판단력)이 사라져요. 지문 1번도 로봇이 우리의 판단력을 빼앗는다고 해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">In the large warehouses</div><div class=\"k\">거대한 창고에서</div></div><div class=\"rc\"><div class=\"e\">so common behind the scenes</div><div class=\"k\">이면에서 아주 흔한</div></div><div class=\"rc\"><div class=\"e\">of today’s economy,</div><div class=\"k\">오늘날의 경제의</div></div><div class=\"rc\"><div class=\"e\">human ‘pickers’ hurry around</div><div class=\"k\">인간 '집게(pickers)'는 서둘러서</div></div><div class=\"rc\"><div class=\"e\">grabbing products off shelves</div><div class=\"k\">선반에서 상품을 집어내고</div></div><div class=\"rc\"><div class=\"e\">and moving them</div><div class=\"k\">그리고 그것들(= 상품)을 이동시킨다</div></div><div class=\"rc\"><div class=\"e\">to where they can be packed and dispatched.</div><div class=\"k\">그것들이 포장되고 발송될 수 있는 곳으로</div></div><div class=\"rnat\">오늘날의 경제 이면에서 아주 흔한 거대한 창고에서, 인간 '집게(pickers)'는 서둘러서 선반에서 상품을 집어내고 그것들이 포장되고 발송될 수 있는 곳으로 그것들을 이동시킨다.</div><div class=\"rst\">자동사냥 캐릭터는 쉬지 않고 바쁘게 돌아다녀요. 지문 2번의 큰 창고에서도 사람들이 물건을 집어 포장할 곳으로 바삐 옮겨요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">In their ears are headpieces:</div><div class=\"k\">그들(= 피커)의 귀에는 헤드폰이 있다</div></div><div class=\"rc\"><div class=\"e\">the voice of ‘Jennifer’,</div><div class=\"k\">'Jennifer'의 목소리가</div></div><div class=\"rc\"><div class=\"e\">a piece of software,</div><div class=\"k\">한 소프트웨어 프로그램인</div></div><div class=\"rc\"><div class=\"e\">tells them where to go and what to do,</div><div class=\"k\">그들에게 어디로 갈지와 무엇을 할지를 말한다</div></div><div class=\"rc\"><div class=\"e\">controlling the smallest details of their movements.</div><div class=\"k\">그들의 움직임의 가장 작은 세부 사항들을 조종하면서</div></div><div class=\"rnat\">그들의 귀에는 헤드폰이 있다. 한 소프트웨어 프로그램인 'Jennifer'의 목소리가, 그들의 움직임의 가장 작은 세부 사항들을 조종하면서, 그들에게 어디로 갈지와 무엇을 할지를 말한다.</div><div class=\"rst\">자동사냥은 갈 곳과 할 일을 하나하나 정해 줘요. 지문 3번의 제니퍼(Jennifer) 프로그램도 작업자 귀에 대고 움직임을 다 조종해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Jennifer breaks down instructions into tiny chunks,</div><div class=\"k\">Jennifer는 지시 사항을 아주 작은 덩어리로 쪼갠다</div></div><div class=\"rc\"><div class=\"e\">to minimise error and maximise productivity</div><div class=\"k\">실수를 최소화하고 생산성을 최대화하기 위해서</div></div><div class=\"rc\"><div class=\"e\">— for example,</div><div class=\"k\">예를 들어,</div></div><div class=\"rc\"><div class=\"e\">rather than picking eighteen copies of a book off a shelf,</div><div class=\"k\">선반에서 책 18권을 집어내기보다</div></div><div class=\"rc\"><div class=\"e\">the human worker would be politely instructed to pick five.</div><div class=\"k\">인간 작업자는 5권을 집어내라고 정중하게 지시받을 것이다</div></div><div class=\"rnat\">Jennifer는 실수를 최소화하고 생산성을 최대화하기 위해서 지시 사항을 아주 작은 덩어리로 쪼갠다. 예를 들어, 인간 작업자는 선반에서 책 18권을 집어내기보다 5권을 집어내라고 정중하게 지시받을 것이다.</div><div class=\"rst\">퀘스트도 “몬스터 5마리 잡기”처럼 잘게 나눠 줘요. 지문 4번도 실수를 줄이려고 책 18권을 “5권 집으세요”로 쪼개 시켜요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Then another five.</div><div class=\"k\">그러고 나서 또 다른 5권.</div></div><div class=\"rnat\">그러고 나서 또 다른 5권.</div><div class=\"rst\">5마리를 잡으면 또 “5마리 더” 하고 다음 퀘스트가 와요. 지문 5번도 다 집으면 바로 “또 5권” 지시가 와요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Then yet another five.</div><div class=\"k\">그러고 나서 다시 또 다른 5권을.</div></div><div class=\"rnat\">그러고 나서 다시 또 다른 5권을.</div><div class=\"rst\">나는 그냥 버튼만 눌러요. 지문 6번에서도 또 5권, 작업자는 세지도 고민하지도 않고 시키는 대로만 해요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Then another three.</div><div class=\"k\">그러고 나서 또 다른 3권을.</div></div><div class=\"rnat\">그러고 나서 또 다른 3권을.</div><div class=\"rst\">퀘스트를 다 깨도 내가 정한 건 없어요. 지문 7번의 마지막 3권까지 18권을 다 집어도 작업자가 스스로 고른 건 하나도 없어요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc\"><div class=\"e\">Working in such conditions</div><div class=\"k\">그러한 조건에서 일하는 것은</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">reduces people to machines</span> made of flesh.</div><div class=\"k\"><span class=\"cw\">사람을 살로 만들어진 기계로 격하시킨다</span></div></div><div class=\"rnat\">그러한 조건에서 일하는 것은 사람을 살로 만들어진 기계로 격하시킨다.</div><div class=\"rst\">이러면 나는 손가락만 움직이는 기계 같아요. 지문 8번도 이렇게 일하면 사람이 <b>살로 만든 기계</b>가 된다고 정리해요.</div></div><div class=\"rds key\" data-ord=\"9\"><span class=\"rn\">9번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Rather than asking us to think or adapt</span>,</div><div class=\"k\"><span class=\"cw\">우리에게 생각하고 적응하라고 요구하기보다는</span></div></div><div class=\"rc ckc\"><div class=\"e\">the Jennifer unit <span class=\"cw\">takes over the thought process</span></div><div class=\"k\">Jennifer라는 장치는 <span class=\"cw\">사고 과정을 가져가고</span></div></div><div class=\"rc\"><div class=\"e\">and treats workers as</div><div class=\"k\">작업자들을 ~로 취급한다</div></div><div class=\"rc\"><div class=\"e\">an inexpensive source</div><div class=\"k\">값싼 자원으로</div></div><div class=\"rc\"><div class=\"e\">of some visual processing</div><div class=\"k\">약간의 시각적인 처리 과정과</div></div><div class=\"rc\"><div class=\"e\">and a pair of opposable thumbs.</div><div class=\"k\">한 쌍의 마주 볼 수 있는 엄지손가락을 가진</div></div><div class=\"rnat\">Jennifer라는 장치는 우리에게 생각하고 적응하라고 요구하기보다는 사고 과정을 가져가고 작업자들을 약간의 시각적인 처리 과정과 한 쌍의 마주 볼 수 있는 엄지손가락을 가진 값싼 자원으로 취급한다.</div><div class=\"rst\">지문 9번처럼 제니퍼가 <b>생각하는 과정</b>(thought process)을 가져가니 사람은 눈과 손만 써요. 그래서 빼앗긴 건 판단력(judgment)이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"warehouse\" data-m=\"창고\"><b>warehouse</b>창고</button><button type=\"button\" class=\"wdb\" data-w=\"dispatch\" data-m=\"발송하다\"><b>dispatch</b>발송하다</button><button type=\"button\" class=\"wdb\" data-w=\"productivity\" data-m=\"생산성\"><b>productivity</b>생산성</button><button type=\"button\" class=\"wdb\" data-w=\"reduce A to B\" data-m=\"A를 B로 격하시키다\"><b>reduce A to B</b>A를 B로 격하시키다</button><button type=\"button\" class=\"wdb\" data-w=\"takes over\" data-m=\"넘겨받다, 가져가다\"><b>takes over</b>넘겨받다, 가져가다</button><button type=\"button\" class=\"wdb\" data-w=\"opposable thumb\" data-m=\"마주 볼 수 있는 엄지\"><b>opposable thumb</b>마주 볼 수 있는 엄지</button></div>", "08": "<p class=\"mtr\">마더텅 정답률 <b>60%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸 바로 뒤 <b>For example</b>(예를 들어)가 신호예요. 뒤 예시(입꼬리 올리기·연필 물기)가 모두 <b>몸을 먼저 바꾸면 감정이 따라온다</b>는 이야기니, 그걸 한 줄로 묶은 말을 고르세요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (4번)</span><div class=\"en\">Strange as it may sound, this theory states <span style=\"white-space:nowrap\">that <span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span>.</span></div><p class=\"ko\">이상하게 들릴지 모르지만, 이 이론은 ( ? )라고 말한다</p></div><div class=\"ck-via\"><i>▼</i><span>For example(예를 들어) 뒤 = 빈칸의 구체적인 예</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 문장 · 결정적 단서</span><div class=\"en\">For example, our mood can be improved by simply <mark>lifting up the corners of our mouth</mark>.</div><p class=\"ko\">예를 들어, 우리의 감정은 단순히 <mark>우리 입꼬리를 올림으로써</mark> 나아질 수 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>몸 모양(미소 모양 입)만 바꿨는데 기분이 달라짐</span></div><div class=\"ck-step\"><span class=\"lab\">6번 문장 · 실험으로 확인</span><div class=\"en\">… (thus <mark>forcing the mouth into a smile-like shape</mark>), they judge cartoons funnier …</div><p class=\"ko\">(그래서 <mark>입을 미소 짓는 것 같은 모양으로 만들면서</mark>) 그들은 만화를 더 재미있다고 판단한다</p></div><div class=\"ck-via\"><i>▼</i><span>몸이 먼저, 감정은 나중</span></div><div class=\"ck-step\"><span class=\"lab\">7번 문장 · 한 줄 정리</span><div class=\"en\"><mark>The primacy of the body</mark> is sometimes summarized in the phrase “I must be afraid, because I’m running.”</div><p class=\"ko\"><mark>몸의 우선함은</mark> 때때로 \"나는 두려워하고 있음이 틀림없다, 왜냐하면 내가 달리고 있기 때문이다\"라는 구절로 요약된다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">emotions arise from our bodies 감정은 우리 몸에서 생긴다<small>5·6번 예시와 7번 primacy of the body(몸의 우선함)를 그대로 묶은 말이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">what others say affects our mood 다른 사람의 말이 기분에 영향을 준다</span><span class=\"why\">1번의 Someone else’s(다른 사람의)만 보고 끌리는 함정이에요. 지문은 남의 말이 아니라 body language(몸짓 언어)와 내 몸이 감정을 만든다고 했어요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">language guides our actions 언어가 행동을 이끈다</span><span class=\"why\">순서가 거꾸로예요. 7번은 달리는 행동(몸)이 먼저고 두려움은 나중이라고 했지, 언어가 행동을 이끈다는 말은 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">body language hides our feelings 몸짓 언어가 감정을 숨긴다</span><span class=\"why\">반대예요. 1번에서 몸짓 언어는 감정을 숨기는 게 아니라 emotional echo(감정적인 메아리)를 만들어 전해 줘요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">negative emotions easily disappear 부정적 감정은 쉽게 사라진다</span><span class=\"why\">5번에서 기분이 나아진다는 말은 있지만, 그 이유가 입꼬리(몸)라는 게 핵심이에요. 나쁜 감정이 저절로 사라진다는 말은 없어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Someone else’s body language</div><div class=\"k\">다른 사람의 몸짓 언어는</div></div><div class=\"rc\"><div class=\"e\">affects our own body,</div><div class=\"k\">우리 자신의 몸에 영향을 주고</div></div><div class=\"rc\"><div class=\"e\">which then creates an emotional echo</div><div class=\"k\">그것은 그 후 감정적인 메아리를 만든다</div></div><div class=\"rc\"><div class=\"e\">that makes us feel accordingly.</div><div class=\"k\">우리가 그에 따라 느끼게 만드는</div></div><div class=\"rnat\">다른 사람의 몸짓 언어는 우리 자신의 몸에 영향을 주고, 그것은 그 후 우리가 그에 따라 느끼게 만드는 감정적인 메아리를 만든다.</div><div class=\"rst\">친구가 활짝 웃으면 나도 모르게 따라 웃고, 그러다 기분까지 좋아져요. 지문 1번, 남의 몸짓이 내 몸을 거쳐 감정이 된다는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">As Louis Armstrong sang,</div><div class=\"k\">Louis Armstrong이 노래 불렀듯이,</div></div><div class=\"rc\"><div class=\"e\">“When you’re smiling,</div><div class=\"k\">\"당신이 미소 지을 때,</div></div><div class=\"rc\"><div class=\"e\">the whole world smiles with you.”</div><div class=\"k\">온 세상이 당신과 함께 미소 짓는다.\"</div></div><div class=\"rnat\">Louis Armstrong이 노래 불렀듯이, \"당신이 미소 지을 때, 온 세상이 당신과 함께 미소 짓는다.\"</div><div class=\"rst\">지문 2번 루이 암스트롱(Louis Armstrong)의 노래처럼 “네가 웃으면 온 세상이 같이 웃어요.” 교실에서 한 명이 웃으면 다 같이 웃는 것처럼요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">If copying another’s smile makes us feel happy,</div><div class=\"k\">다른 사람의 미소를 따라 하는 것이 우리를 행복하게 만든다면</div></div><div class=\"rc\"><div class=\"e\">the emotion of the smiler</div><div class=\"k\">미소 짓는 사람의 감정은</div></div><div class=\"rc\"><div class=\"e\">has been transmitted via our body.</div><div class=\"k\">우리 몸을 통해 전달된 것이다</div></div><div class=\"rnat\">다른 사람의 미소를 따라 하는 것이 우리를 행복하게 만든다면, 미소 짓는 사람의 감정은 우리 몸을 통해 전달된 것이다.</div><div class=\"rst\">친구 미소를 <b>따라 했더니</b> 행복해졌다면, 친구의 기분이 <b>내 몸을 통해</b> 넘어온 거예요. 지문 3번이 이 얘기예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Strange as it may sound,</div><div class=\"k\">이상하게 들릴지 모르지만</div></div><div class=\"rc\"><div class=\"e\">this theory states</div><div class=\"k\">이 이론은 말한다</div></div><div class=\"rc ckc\"><div class=\"e\">that <span class=\"cw\">emotions arise from our bodies</span>.</div><div class=\"k\"><span class=\"cw\">감정이 우리 몸에서 발생한다고</span> ※ 문제지엔 빈칸으로 되어 있음 (정답: emotions arise from our bodies)</div></div><div class=\"rnat\">이상하게 들릴지 모르지만, 이 이론은 감정이 우리 몸에서 발생한다고 말한다.</div><div class=\"rst\">이상하게 들려도 <b>감정은 몸에서 생긴다</b>는 거예요. 기분이 먼저가 아니라 몸이 먼저라는 이론이 빈칸 자리예요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">For example,</div><div class=\"k\">예를 들어,</div></div><div class=\"rc\"><div class=\"e\">our mood can be improved</div><div class=\"k\">우리의 감정은 나아질 수 있다</div></div><div class=\"rc ckc\"><div class=\"e\">by simply <span class=\"cw\">lifting up the corners of our mouth</span>.</div><div class=\"k\">단순히 <span class=\"cw\">우리 입꼬리를 올림으로써</span></div></div><div class=\"rnat\">예를 들어, 우리의 감정은 단순히 우리 입꼬리를 올림으로써 나아질 수 있다.</div><div class=\"rst\"><b>예를 들어</b>(For example) 시험 끝나고 우울할 때 입꼬리만 쓱 올려도 기분이 나아져요. 지문 5번의 예시예요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">If people are asked to bite down on a pencil lengthwise,</div><div class=\"k\">사람들이 연필을 긴 방향으로 꽉 물라고 요구받으면</div></div><div class=\"rc\"><div class=\"e\">taking care not to let the pencil touch their lips</div><div class=\"k\">연필이 그들의 입술에 닿지 않도록 신경 쓰면서</div></div><div class=\"rc ckc\"><div class=\"e\">(thus <span class=\"cw\">forcing the mouth into a smile-like shape</span>),</div><div class=\"k\">(그래서 <span class=\"cw\">입을 미소 짓는 것 같은 모양으로 만들면서</span>)</div></div><div class=\"rc\"><div class=\"e\">they judge cartoons funnier</div><div class=\"k\">그들은 만화를 더 재미있다고 판단한다</div></div><div class=\"rc\"><div class=\"e\">than if they have been asked to frown.</div><div class=\"k\">그들이 얼굴을 찡그리도록 요구받은 때보다</div></div><div class=\"rnat\">사람들이 연필이 그들의 입술에 닿지 않도록 신경 쓰면서 (그래서 입을 미소 짓는 것 같은 모양으로 만들면서) 연필을 긴 방향으로 꽉 물라고 요구받으면, 그들은 그들이 얼굴을 찡그리도록 요구받은 때보다 만화를 더 재미있다고 판단한다.</div><div class=\"rst\">연필을 가로로 물어 입을 웃는 모양으로 만들면 웹툰이 더 웃기게 느껴져요. 찡그릴 때보다요. 지문 6번의 실험이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">The primacy of the body</span></div><div class=\"k\"><span class=\"cw\">몸의 우선함은</span></div></div><div class=\"rc\"><div class=\"e\">is sometimes summarized in the phrase</div><div class=\"k\">때때로 ~라는 구절로 요약된다</div></div><div class=\"rc\"><div class=\"e\">“I must be afraid, because I’m running.”</div><div class=\"k\">\"나는 두려워하고 있음이 틀림없다, 왜냐하면 내가 달리고 있기 때문이다\"</div></div><div class=\"rnat\">몸의 우선함은 때때로 \"나는 두려워하고 있음이 틀림없다, 왜냐하면 내가 달리고 있기 때문이다\"라는 구절로 요약된다.</div><div class=\"rst\">“달리고 있으니 내가 무서운가 봐!” 이렇게 <b>몸이 먼저</b>(primacy of the body 몸의 우선함)예요. 그래서 빈칸은 감정이 몸에서 생긴다예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"emotional echo\" data-m=\"감정적인 메아리\"><b>emotional echo</b>감정적인 메아리</button><button type=\"button\" class=\"wdb\" data-w=\"transmit\" data-m=\"전달하다\"><b>transmit</b>전달하다</button><button type=\"button\" class=\"wdb\" data-w=\"arise\" data-m=\"생기다, 발생하다\"><b>arise</b>생기다, 발생하다</button><button type=\"button\" class=\"wdb\" data-w=\"bite down on\" data-m=\"~을 꽉 물다\"><b>bite down on</b>~을 꽉 물다</button><button type=\"button\" class=\"wdb\" data-w=\"frown\" data-m=\"얼굴을 찡그리다\"><b>frown</b>얼굴을 찡그리다</button><button type=\"button\" class=\"wdb\" data-w=\"primacy\" data-m=\"우선함, 우위\"><b>primacy</b>우선함, 우위</button></div>", "09": "<p class=\"mtr\">마더텅 정답률 <b>70%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">주어진 글 끝의 <b>stage fright</b>(무대 공포증)를 이어받는 단락부터 찾고, <b>The other extreme</b>(다른 극단) → <b>The general rule</b>(일반 규칙) → <b>So</b>(따라서) 순으로 <b>예시 → 규칙 → 적용</b>을 이어 붙이세요.</p><div class=\"ck-step\"><span class=\"lab\">주어진 글 끝</span><div class=\"en\">The extreme of this is <mark>stage fright</mark>, the sudden fear of public performance.</div><p class=\"ko\">이것의 극단적인 예가 대중 앞에서의 공연에 대한 갑작스러운 두려움인 <mark>무대 공포증</mark>이다.</p></div><div class=\"ck-via\"><i>▼</i><span>주어진 글의 stage fright(무대 공포증)를 실제 배우 사례로 이어받아요</span></div><div class=\"ck-step key\"><span class=\"lab\">(B) · 첫 번째 고리</span><div class=\"en\">(B) There are many instances of well-known actors who, in mid-career, <mark>develop stage fright</mark> and simply cannot perform.</div><p class=\"ko\">경력 중반에 <mark>무대 공포증이 생겨서</mark> 전혀 연기를 할 수 없게 된 유명한 배우들의 많은 사례가 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>저하(첫 극단) 다음에 강화(다른 극단)가 나와서 두 효과가 다 모였어요</span></div><div class=\"ck-step\"><span class=\"lab\">(B) 끝 · 반대쪽 극단</span><div class=\"en\"><mark>The other extreme</mark> is that being observed enhances performance, …</div><p class=\"ko\"><mark>다른(반대의) 극단적인 예는</mark> 관찰당하는 것이 수행을 강화시켜 주는 것인데 …</p></div><div class=\"ck-via\"><i>▼</i><span>두 극단을 모아 '새 일은 저하, 익숙한 일은 강화'로 정리해요</span></div><div class=\"ck-step key\"><span class=\"lab\">(C) · 두 번째 고리</span><div class=\"en\">(C) <mark>The general rule</mark> seems to be that if one is doing something new or for the first time, then being observed while doing it decreases performance.</div><p class=\"ko\"><mark>일반 규칙은</mark> 누군가가 새로운 일이나 처음 하는 일을 할 때, 그 일을 하는 동안 관찰당하는 것은 수행을 저하시킨다는 것인 듯하다.</p></div><div class=\"ck-via\"><i>▼</i><span>So(따라서) = (C)의 규칙을 새 운동 배우기에 적용</span></div><div class=\"ck-step key\"><span class=\"lab\">(A) · 세 번째 고리</span><div class=\"en\">(A) <mark>So</mark>, if you are learning to play a new sport, it is better to begin it alone, …</div><p class=\"ko\"><mark>따라서</mark> 만약 당신이 새로운 운동을 배운다면, 그것을 혼자서 시작하는 것이 더 낫지만 …</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">(B) – (C) – (A)<small>무대 공포증 사례 → 일반 규칙 → 따라서 적용, 세 고리가 다 맞아요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">(B) – (A) – (C)</span><span class=\"why\">(A)의 So(따라서)가 가리킬 규칙이 아직 없어요. (B)는 사례뿐이고 '새 일은 혼자'라는 근거는 (C)의 general rule(일반 규칙)에 있어요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">(A) – (C) – (B)</span><span class=\"why\">주어진 글은 무대 공포증에서 끝났는데 바로 So(따라서)로 운동 배우기 결론이 나오면 이어지지 않아요. (B)의 배우 사례가 먼저예요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">(C) – (A) – (B)</span><span class=\"why\">주어진 글은 저하 쪽 극단만 말했어요. 강화 쪽인 (B)의 The other extreme(다른 극단)이 나오기 전에 두 쪽을 묶는 (C) 규칙이 올 수 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">(C) – (B) – (A)</span><span class=\"why\">규칙 (C)가 사례 (B)보다 먼저 와요. (B)의 stage fright(무대 공포증) 사례는 주어진 글 3번에 바로 붙어야 해요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><span class=\"ordc\">정답 순서 주어진 글</span><div class=\"rc\"><div class=\"e\">Interestingly,</div><div class=\"k\">흥미롭게도</div></div><div class=\"rc\"><div class=\"e\">being observed</div><div class=\"k\">(누군가에게) 관찰당하는 것은</div></div><div class=\"rc\"><div class=\"e\">has two quite distinct effects</div><div class=\"k\">두 가지의 꽤 다른 영향을 미친다</div></div><div class=\"rc\"><div class=\"e\">on performance.</div><div class=\"k\">수행에</div></div><div class=\"rnat\">흥미롭게도, (누군가에게) 관찰당하는 것은 수행에 두 가지의 꽤 다른 영향을 미친다.</div><div class=\"rst\">반 친구들이 나를 지켜볼 때를 떠올려 보세요. 지문 1번은 <b>누가 보고 있으면</b> 실력이 두 가지로 달라진다고 해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><span class=\"ordc\">정답 순서 주어진 글</span><div class=\"rc\"><div class=\"e\">In some cases,</div><div class=\"k\">어떤 경우에는</div></div><div class=\"rc\"><div class=\"e\">performance is decreased,</div><div class=\"k\">수행이 저하된다</div></div><div class=\"rc\"><div class=\"e\">even to the point of non-existence.</div><div class=\"k\">심지어 존재하지 않는(전혀 수행이 실행되었다고 볼 수 없는) 정도까지도</div></div><div class=\"rnat\">어떤 경우에는, 심지어 존재하지 않는(전혀 수행이 실행되었다고 볼 수 없는) 정도까지도 수행이 저하된다.</div><div class=\"rst\">어떤 때는 친구들 앞에서 너무 떨려서 실력이 확 떨어지고, 아예 아무것도 못 하기도 해요. 지문 2번의 첫 번째 경우예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><span class=\"ordc\">정답 순서 주어진 글</span><div class=\"rc\"><div class=\"e\">The extreme of this</div><div class=\"k\">이것의 극단적인 예가</div></div><div class=\"rc ckc\"><div class=\"e\">is <span class=\"cw\">stage fright</span>,</div><div class=\"k\"><span class=\"cw\">무대 공포증이다</span></div></div><div class=\"rc\"><div class=\"e\">the sudden fear of public performance.</div><div class=\"k\">대중 앞에서의 공연에 대한 갑작스러운 두려움인</div></div><div class=\"rnat\">이것의 극단적인 예가 대중 앞에서의 공연에 대한 갑작스러운 두려움인, 무대 공포증이다.</div><div class=\"rst\">그 끝판왕이 학예회 무대에서 갑자기 얼어붙는 <b>무대 공포증</b>(stage fright)이에요. 이 말이 다음 단락의 고리가 돼요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">4번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc ckc\"><div class=\"e\">(A) <span class=\"cw\">So,</span></div><div class=\"k\"><span class=\"cw\">따라서</span></div></div><div class=\"rc\"><div class=\"e\">if you are learning to play a new sport,</div><div class=\"k\">만약 당신이 새로운 운동을 배운다면</div></div><div class=\"rc\"><div class=\"e\">it is better to begin it alone,</div><div class=\"k\">그것(= 새로운 운동)을 혼자서 시작하는 것이 더 낫지만</div></div><div class=\"rc\"><div class=\"e\">but when you become skilled at it,</div><div class=\"k\">당신이 그것(을 하는 데)에 능숙해진다면</div></div><div class=\"rc\"><div class=\"e\">then you will probably perform better with an audience.</div><div class=\"k\">당신은 아마 관중이 있을 때 더 잘 할 것이다</div></div><div class=\"rnat\">(A) 따라서 만약 당신이 새로운 운동을 배운다면, 그것을 혼자서 시작하는 것이 더 낫지만, 당신이 그것(을 하는 데)에 능숙해진다면, 당신은 아마 관중이 있을 때 더 잘 할 것이다.</div><div class=\"rst\"><b>따라서</b>(So) 새 운동은 혼자 연습하고, 익숙해지면 친구들 앞에서 하는 게 좋아요. 지문 (A)가 규칙을 적용한 결론이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">5번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">(B) There are many instances of well-known actors</div><div class=\"k\">유명한 배우들의 많은 사례가 있다</div></div><div class=\"rc\"><div class=\"e\">who, in mid-career,</div><div class=\"k\">(연기) 경력 중반에</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">develop stage fright</span></div><div class=\"k\"><span class=\"cw\">무대 공포증이 생겨서</span></div></div><div class=\"rc\"><div class=\"e\">and simply cannot perform.</div><div class=\"k\">전혀 연기를 할 수 없게 된</div></div><div class=\"rnat\">(B) (연기) 경력 중반에 무대 공포증이 생겨서 전혀 연기를 할 수 없게 된, 유명한 배우들의 많은 사례가 있다.</div><div class=\"rst\">실제로 유명한 배우들도 한창 활동하다 <b>무대 공포증이 생겨</b> 연기를 못 하게 된 일이 많아요. 지문 (B)가 3번을 이어받아요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">6번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">The other extreme</span> is</div><div class=\"k\"><span class=\"cw\">다른(반대의) 극단적인 예는</span></div></div><div class=\"rc\"><div class=\"e\">that being observed enhances performance,</div><div class=\"k\">관찰당하는 것이 수행을 강화시켜 주는 것인데</div></div><div class=\"rc\"><div class=\"e\">people doing whatever it might be better</div><div class=\"k\">사람들은 그 일이 무엇이든 더 잘한다</div></div><div class=\"rc\"><div class=\"e\">when they know that others are watching.</div><div class=\"k\">다른 사람들이 지켜보고 있다는 것을 알 때</div></div><div class=\"rnat\">다른(반대의) 극단적인 예는 관찰당하는 것이 수행을 강화시켜 주는 것인데, 다른 사람들이 지켜보고 있다는 것을 알 때, 사람들은 그 일이 무엇이든 더 잘한다.</div><div class=\"rst\">그런데 <b>반대쪽 끝</b>(The other extreme)도 있어요. 친구들이 볼 때 오히려 더 잘하는 거죠. = 지문 6번, 관찰이 실력을 높이는 경우예요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">7번 · 단서</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc ckc\"><div class=\"e\">(C) <span class=\"cw\">The general rule</span> seems to be</div><div class=\"k\"><span class=\"cw\">일반 규칙은</span> ~인 것 같다</div></div><div class=\"rc\"><div class=\"e\">that if one is doing something new or for the first time,</div><div class=\"k\">누군가가 새로운 또는 처음으로 어떤 일을 할 때</div></div><div class=\"rc\"><div class=\"e\">then being observed while doing it</div><div class=\"k\">그것(= 새롭거나 처음 하는 일)을 하는 동안 관찰당하는 것은</div></div><div class=\"rc\"><div class=\"e\">decreases performance.</div><div class=\"k\">수행을 저하시킨다는 것</div></div><div class=\"rnat\">(C) 일반 규칙은(일반적인 경우에는) 만약 누군가가 새로운 또는 처음으로 어떤 일을 할 때, 그것을 하는 동안 관찰당하는 것은 수행을 저하시킨다는 것 같다.</div><div class=\"rst\"><b>정리하면</b>(The general rule 일반 규칙) 처음 해 보는 일은 누가 보면 더 못해요. 지문 (C)가 두 경우를 묶어요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">8번 · 단서</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">On the other hand,</div><div class=\"k\">반면에</div></div><div class=\"rc\"><div class=\"e\">being observed while doing some task or engaging in some activity</div><div class=\"k\">어떤 일을 하거나 어떤 활동에 참여하는 동안 관찰당하는 것은</div></div><div class=\"rc\"><div class=\"e\">that is well known or well practiced</div><div class=\"k\">잘 알고 있는 혹은 잘 훈련된</div></div><div class=\"rc\"><div class=\"e\">tends to enhance performance.</div><div class=\"k\">수행을 강화시키는 경향이 있다</div></div><div class=\"rnat\">반면에, 잘 알고 있는 혹은 잘 훈련된 어떤 일을 하거나 어떤 활동에 참여할 때 관찰당하는 것은 수행을 강화시키는 경향이 있다.</div><div class=\"rst\"><b>반면에</b>(On the other hand) 줄넘기처럼 많이 연습한 건 누가 보면 더 잘해요. 지문 8번이 규칙의 나머지 반쪽이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"distinct\" data-m=\"뚜렷한, 별개의\"><b>distinct</b>뚜렷한, 별개의</button><button type=\"button\" class=\"wdb\" data-w=\"non-existence\" data-m=\"존재하지 않음, 소멸\"><b>non-existence</b>존재하지 않음, 소멸</button><button type=\"button\" class=\"wdb\" data-w=\"stage fright\" data-m=\"무대 공포증\"><b>stage fright</b>무대 공포증</button><button type=\"button\" class=\"wdb\" data-w=\"instance\" data-m=\"사례\"><b>instance</b>사례</button><button type=\"button\" class=\"wdb\" data-w=\"mid-career\" data-m=\"경력 중반에\"><b>mid-career</b>경력 중반에</button><button type=\"button\" class=\"wdb\" data-w=\"enhance\" data-m=\"향상시키다, 강화하다\"><b>enhance</b>향상시키다, 강화하다</button></div>", "10": "<p class=\"mtr\">마더텅 정답률 <b>50%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">요약문은 지문 핵심 문장을 <b>말만 바꿔 옮긴 것</b>이에요. (A)는 2번의 <b>perceive</b>(여기다)를 명사로 바꾼 말, (B)는 6번의 <b>if they don’t change</b>(변하지 않으면)를 옮긴 말이에요.</p><div class=\"ck-step key\"><span class=\"lab\">2번 문장 · (A)의 근거</span><div class=\"en\">… it depends on <mark>whether they perceive the new behavior as safe or risky</mark>.</div><p class=\"ko\">이는 <mark>그들이 새로운 행동을 안전하다고 여기는지 또는 위험하다고 여기는지에</mark> 달려 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>위험하다고 여길 때의 방법: 좋은 점 대신 '안 바꾸면 생길 나쁜 점'을 강조</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · (B)의 근거</span><div class=\"en\">Instead, we need to <mark>destabilize the status quo</mark> and emphasize the bad things that will happen <mark>if they don’t change</mark>.</div><p class=\"ko\">대신 우리는 <mark>그 현재 상태를 불안정하게 만들고</mark>, <mark>그들이 변화하지 않으면</mark> 발생할 나쁜 점들을 강조할 필요가 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>depends on(~에 달려 있다)가 2번과 똑같아요. perceive(여기다) → (A) perception(인식), don’t change(변하지 않다) → (B) unchanged(변하지 않은)</span></div><div class=\"ck-step\"><span class=\"lab\">요약문 (9번) · 짝 맞추기</span><div class=\"en\">The way to modify people’s behavior <mark>depends on their perception</mark>: … but if regarded as risky, highlighting the loss of <mark>staying unchanged</mark> works.</div><p class=\"ko\">사람들의 행동을 수정하는 방식은 <mark>그들의 지각에 달려 있다</mark> … 위험하다고 여겨지면 <mark>변화하지 않은 채로 있는 것</mark>의 손실을 강조하는 것이 효과가 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">perception 인식 … unchanged 변하지 않은<small>2번 perceive(여기다) → perception(인식), 6번 don’t change(변하지 않다) → unchanged(변하지 않은)예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">perception 인식 … changed 변한</span><span class=\"why\">(A)는 맞지만 (B)가 반대예요. 6번은 변하지 않으면 생길 나쁜 점을 강조하라고 했으니, 손실은 '변한 채'가 아니라 '변하지 않은 채로 있는 것'의 손실이에요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">recognition 인정 … changed 변한</span><span class=\"why\">둘 다 틀려요. 2번은 사람들이 안전·위험 중 어떻게 perceive(여기다)하는지가 핵심이지 인정받는 게 아니고, (B)도 6번과 반대예요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">consistency 일관성 … unchanged 변하지 않은</span><span class=\"why\">(B)는 맞지만 (A)가 틀려요. 2번은 행동을 바꾸는 방법이 사람들의 생각(안전/위험)에 달려 있다고 했지, 일관성에 달려 있다고 하지 않았어요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">consistency 일관성 … focused 집중된</span><span class=\"why\">둘 다 틀려요. (A)는 2번의 perceive(여기다)와 맞지 않고, (B)도 6번의 if they don’t change(변하지 않으면)와 상관없는 말이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">If you want to modify people’s behavior,</div><div class=\"k\">만약 당신이 사람들의 행동을 바꾸기를 원한다면</div></div><div class=\"rc\"><div class=\"e\">is it better to highlight the benefits of changing</div><div class=\"k\">변화의 이점을 강조하는 것이 더 좋을까</div></div><div class=\"rc\"><div class=\"e\">or the costs of not changing?</div><div class=\"k\">아니면 변화하지 않는 것의 비용(손실)을 강조하는 것이 더 좋을까?</div></div><div class=\"rnat\">만약 당신이 사람들의 행동을 바꾸기를 원한다면 변화의 이점을 강조하는 것이 더 좋을까 아니면 변화하지 않는 것의 비용(손실)을 강조하는 것이 더 좋을까?</div><div class=\"rst\">게임만 하는 동생에게 운동을 시키고 싶어요. “운동하면 좋아!”라고 할까, “안 하면 큰일 나!”라고 할까? 지문 1번의 질문이에요.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">2번 · 단서</span><div class=\"rc\"><div class=\"e\">According to Peter Salovey,</div><div class=\"k\">Peter Salovey에 따르면</div></div><div class=\"rc\"><div class=\"e\">one of the originators of the concept of emotional intelligence,</div><div class=\"k\">감정 지능 개념의 창시자 중 한 명인</div></div><div class=\"rc\"><div class=\"e\">it depends on</div><div class=\"k\">이는 ~에 달려 있다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">whether they perceive the new behavior as safe or risky</span>.</div><div class=\"k\"><span class=\"cw\">그들이 새로운 행동을 안전하다고 여기는지 또는 위험하다고 여기는지에</span></div></div><div class=\"rnat\">감정 지능 개념의 창시자 중 한 명인 Peter Salovey에 따르면, 이는 그들이 새로운 행동을 안전하다고 여기는지 또는 위험하다고 여기는지에 달려 있다.</div><div class=\"rst\">답은 동생이 운동을 <b>안전하다고 여기는지, 위험하다고 여기는지</b>(perceive 여기다)에 달려 있어요. 지문 2번이 핵심이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">If they think the behavior is safe,</div><div class=\"k\">만약 그들이 그 행동이 안전하다고 생각한다면</div></div><div class=\"rc\"><div class=\"e\">we should emphasize all the good things</div><div class=\"k\">우리는 모든 좋은 점들을 강조해야 한다</div></div><div class=\"rc\"><div class=\"e\">that will happen if they do it</div><div class=\"k\">그들이 그것(= 그 행동)을 한다면 일어날</div></div><div class=\"rc\"><div class=\"e\">— they’ll want to act immediately</div><div class=\"k\">그러면 그들은 즉각적으로 행동하기를 원할 것이다</div></div><div class=\"rc\"><div class=\"e\">to obtain those certain gains.</div><div class=\"k\">그 확실한 이익을 얻기 위해</div></div><div class=\"rnat\">만약 그들이 그 행동이 안전하다고 생각한다면, 우리는 그들이 그것을 한다면 일어날 모든 좋은 점들을 강조해야 한다. 그러면 그들은 그 확실한 이익을 얻기 위해 즉각적으로 행동하기를 원할 것이다.</div><div class=\"rst\">동생이 줄넘기를 쉽고 안전하다고 생각하면 “하면 키 큰대!”처럼 <b>좋은 점</b>을 말해요. 그럼 바로 해요. = 지문 3번, 안전하다고 여기면 좋은 점을 강조하라는 말이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">But when people believe a behavior is risky,</div><div class=\"k\">하지만 사람들이 어떤 행동이 위험하다고 믿는다면</div></div><div class=\"rc\"><div class=\"e\">that approach doesn’t work.</div><div class=\"k\">그러한 접근법(= 좋은 점을 강조하는 방법)은 효과가 없다</div></div><div class=\"rnat\">그러나 사람들이 어떤 행동이 위험하다고 믿는다면, 그러한 접근법은 효과가 없다.</div><div class=\"rst\"><b>하지만</b>(But) 수영처럼 무섭다고 여기면 좋은 점을 말해도 안 통해요. 지문 4번이 방향을 바꿔요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">They’re already comfortable with the status quo,</div><div class=\"k\">그들은 이미 현재 상태를 편하게 생각해서</div></div><div class=\"rc\"><div class=\"e\">so the benefits of change aren’t attractive,</div><div class=\"k\">변화의 이점이 매력적이지 않고</div></div><div class=\"rc\"><div class=\"e\">and the stop system kicks in.</div><div class=\"k\">정지 시스템이 시작된다(변화하려고 하지 않는다)</div></div><div class=\"rnat\">그들은 이미 현재 상태를 편하게 생각해서 변화의 이점이 매력적이지 않고, 정지 시스템이 시작된다(변화하려고 하지 않는다).</div><div class=\"rst\">동생은 지금 방에서 게임하는 게 편해서 “좋대” 소리가 귀에 안 들어오고 멈춰 버려요. 지문 5번의 정지 시스템이에요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">Instead,</div><div class=\"k\">대신</div></div><div class=\"rc\"><div class=\"e\">we need to destabilize the status quo</div><div class=\"k\">우리는 그 현재 상태를 불안정하게 만들 필요가 있다</div></div><div class=\"rc\"><div class=\"e\">and emphasize the bad things</div><div class=\"k\">그리고 나쁜 점들을 강조할 필요가 있다</div></div><div class=\"rc ckc\"><div class=\"e\">that will happen <span class=\"cw\">if they don’t change</span>.</div><div class=\"k\"><span class=\"cw\">그들이 변화하지 않으면</span> 발생할</div></div><div class=\"rnat\">대신, 우리는 그 현재 상태를 불안정하게 만들고 그들이 변화하지 않으면 발생할 나쁜 점들을 강조할 필요가 있다.</div><div class=\"rst\"><b>대신</b>(Instead) “지금처럼 <b>안 바꾸면</b> 체력장에서 꼴찌야!” 하고 나쁜 점을 말해요. 지문 6번의 방법이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Taking a risk is more appealing</div><div class=\"k\">위험을 감수하는 것이 더 매력적이다</div></div><div class=\"rc\"><div class=\"e\">when they’re faced with a guaranteed loss</div><div class=\"k\">(발생할) 확실한 손실에 직면할 때는</div></div><div class=\"rc\"><div class=\"e\">if they don’t.</div><div class=\"k\">그들이 (변화)하지 않는다면</div></div><div class=\"rnat\">그들이 (변화)하지 않는다면 (발생할) 확실한 손실에 직면할 때는 위험을 감수하는 것이 더 매력적이다.</div><div class=\"rst\">안 하면 확실히 손해라는 걸 알면, 무서운 수영도 해 볼 만하다고 느껴요. 지문 7번이 이 얘기예요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">The prospect of a certain loss</div><div class=\"k\">확실한 손실에 대한 예상은</div></div><div class=\"rc\"><div class=\"e\">brings the go system online.</div><div class=\"k\">작동 시스템의 접속을 불러온다(변화하려고 한다)</div></div><div class=\"rnat\">확실한 손실에 대한 예상은 작동 시스템의 접속을 불러온다(변화하려고 한다).</div><div class=\"rst\">확실한 손해가 보이니 동생 마음에 '해 보자' 스위치가 켜져요. 지문 8번의 작동 시스템이에요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">The way to modify people’s behavior</div><div class=\"k\">사람들의 행동을 수정하는 방식은</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">depends on their perception</span>:</div><div class=\"k\"><span class=\"cw\">그들의 지각에 달려 있다</span> ※ 문제지엔 (A) 빈칸으로 되어 있음 (정답: perception)</div></div><div class=\"rc\"><div class=\"e\">if the new behavior is regarded as safe,</div><div class=\"k\">만약 그 새로운 행동이 안전하다고 여겨지면</div></div><div class=\"rc\"><div class=\"e\">emphasizing the rewards works</div><div class=\"k\">보상을 강조하는 것이 효과가 있지만</div></div><div class=\"rc\"><div class=\"e\">but if regarded as risky,</div><div class=\"k\">위험하다고 여겨지면</div></div><div class=\"rc ckc\"><div class=\"e\">highlighting the loss of <span class=\"cw\">staying unchanged</span> works.</div><div class=\"k\"><span class=\"cw\">변화하지 않은 채로 있는 것</span>의 손실을 강조하는 것이 효과가 있다 ※ 문제지엔 (B) 빈칸으로 되어 있음 (정답: unchanged)</div></div><div class=\"rnat\">사람들의 행동을 수정하는 방식은 그들의 (A) 지각에 달려 있다. 따라서 만약 그 새로운 행동이 안전하다고 여겨지면 보상을 강조하는 것이 효과가 있지만 만약 위험하다고 여겨지면 (B) 변화하지 않은 채로 있는 것의 손실을 강조하는 것이 효과가 있다.</div><div class=\"rst\">정리하면 방법은 동생의 <b>생각</b>(perception 인식)에 달렸고, 위험하면 <b>안 바꾼 채로 있는</b>(unchanged) 손해를 말해요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"modify\" data-m=\"바꾸다, 수정하다\"><b>modify</b>바꾸다, 수정하다</button><button type=\"button\" class=\"wdb\" data-w=\"perceive\" data-m=\"인식하다, 여기다\"><b>perceive</b>인식하다, 여기다</button><button type=\"button\" class=\"wdb\" data-w=\"status quo\" data-m=\"현재 상태\"><b>status quo</b>현재 상태</button><button type=\"button\" class=\"wdb\" data-w=\"destabilize\" data-m=\"불안정하게 만들다\"><b>destabilize</b>불안정하게 만들다</button><button type=\"button\" class=\"wdb\" data-w=\"appealing\" data-m=\"매력적인\"><b>appealing</b>매력적인</button><button type=\"button\" class=\"wdb\" data-w=\"guaranteed loss\" data-m=\"확실한 손실\"><b>guaranteed loss</b>확실한 손실</button></div>", "11": "<p class=\"mtr\">마더텅 정답률 <b>60%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">제목은 <b>해결책 문장</b>과 <b>마지막 결론 문장</b>을 묶어서 찾으세요. 5번 <b>instincts to imitate</b>(모방하는 본능)이 해결책이고, 10번 <b>were saved</b>(구해졌다)가 결론이라 '모방 본능 = 생존의 열쇠'예요.</p><div class=\"ck-step\"><span class=\"lab\">3번 문장 · 문제 상황</span><div class=\"en\"><mark>Its survival was being threatened</mark> by the cane toad, an invasive species introduced to Australia in the 1930s.</div><p class=\"ko\">1930년대에 호주에 들여온 외래종인 수수두꺼비에 의해 <mark>그것(= 주머니고양이)의 생존은 위협받고 있었다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>생존 위기를 '모방 본능'으로 풀었어요</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 문장 · 해결책</span><div class=\"en\">Behavioral ecologists identified a clever solution by using <mark>quolls’ instincts to imitate</mark>.</div><p class=\"ko\">행동 생태학자들은 <mark>주머니고양이의 모방하는 본능을</mark> 이용함으로써 영리한 해결책을 찾아냈다.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>6번</em>메스꺼운 두꺼비 소시지로 두꺼비 피하게 길들임</span><span><em>7번</em>풀려난 주머니고양이가 새끼에게 가르침</span><span><em>8번</em>다른 주머니고양이도 사회적 학습으로 따라 함</span></div><div class=\"ck-eq\">⇒ 세 장면의 공통점 = 서로 보고 따라 하며 살아남는 법이 퍼짐</div></div><div class=\"ck-via\"><i>▼</i><span>구해진 이유가 바로 모방 본능이라고 못 박아요</span></div><div class=\"ck-step key\"><span class=\"lab\">10번 문장 · 결정적 결론</span><div class=\"en\"><mark>The quolls were saved</mark> via minimal human interference because ecologists were able to take advantage of <mark>quolls’ natural imitative instincts</mark>.</div><p class=\"ko\">생태학자들이 <mark>주머니고양이의 선천적인 모방 본능을</mark> 이용할 수 있었기 때문에, 최소한의 인간의 개입으로 <mark>주머니고양이는 구해졌다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">Imitative Instinct as a Key to Survival for Animals 동물 생존의 열쇠로서의 모방 본능<small>5번의 모방 본능(해결책)과 10번의 구해짐(생존)을 둘 다 담았어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">How to Stop the Spread of Invasive Species(외래종의 확산을 막는 방법)</span><span class=\"why\">[범위 좁음] 3번의 invasive species(외래종)만 따온 함정이에요. 글은 두꺼비를 없애는 게 아니라 주머니고양이가 두꺼비를 피하도록 배운 이야기예요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">Copy Quickly and Precisely to Be Productive(생산적이려면 빠르고 정확하게 따라 하라)</span><span class=\"why\">[지문에 없음] 사람에게 일을 잘하라고 조언하는 글이 아니에요. 따라 하기는 10번처럼 동물이 살아남는 데 쓰였어요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">The Role of Threats in Animal Cooperation(동물 협력에서 위협의 역할)</span><span class=\"why\">[지문에 없음] 3번에 threatened(위협받은)가 나오지만, 위협이 동물끼리 협력하게 만든다는 말은 없어요. 핵심은 8번의 copied(모방했다)예요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">Ideal Habitats for Diverse Wildlife(다양한 야생 동물을 위한 이상적 서식지)</span><span class=\"why\">[지문에 없음] 7번에서 야생으로 풀어 줬다는 말만 있고, 어떤 서식지가 좋은지는 한 번도 나오지 않아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Behavioral ecologists</div><div class=\"k\">행동 생태학자들은</div></div><div class=\"rc\"><div class=\"e\">have observed clever copying behavior</div><div class=\"k\">영리한 모방 행동을 관찰해 왔다</div></div><div class=\"rc\"><div class=\"e\">among many of our close animal relatives.</div><div class=\"k\">우리와 가까운 다수의 동류 동물들 사이에서의</div></div><div class=\"rnat\">행동 생태학자들은 우리와 가까운 다수의 동류 동물들 사이에서의 영리한 모방 행동을 관찰해 왔다.</div><div class=\"rst\">급식실에서 친구가 하는 걸 보고 따라 배우는 일이 많죠? 지문 1번은 동물들도 이렇게 영리하게 <b>따라 한다</b>고 해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">One example was uncovered</div><div class=\"k\">한 가지 사례가 발견되었다</div></div><div class=\"rc\"><div class=\"e\">by behavioral ecologists</div><div class=\"k\">행동 생태학자들에 의해</div></div><div class=\"rc\"><div class=\"e\">studying the behavior of a small Australian animal</div><div class=\"k\">작은 호주 동물의 행동을 연구하는</div></div><div class=\"rc\"><div class=\"e\">called the quoll.</div><div class=\"k\">주머니고양이(quoll)라고 불리는</div></div><div class=\"rnat\">한 가지 사례가 주머니고양이(quoll)라고 불리는 작은 호주 동물의 행동을 연구하는 행동 생태학자들에 의해 발견되었다.</div><div class=\"rst\">그 예가 호주의 작은 동물 주머니고양이예요. = 지문 2번, 학자들이 이 동물에게서 모방 행동의 사례를 찾았어요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Its survival was being threatened</span></div><div class=\"k\"><span class=\"cw\">그것(= 주머니고양이)의 생존은 위협받고 있었다</span></div></div><div class=\"rc\"><div class=\"e\">by the cane toad,</div><div class=\"k\">수수두꺼비에 의해</div></div><div class=\"rc\"><div class=\"e\">an invasive species introduced to Australia in the 1930s.</div><div class=\"k\">1930년대에 호주에 들여온 외래종인</div></div><div class=\"rnat\">그것의 생존은 1930년대에 호주에 들여온 외래종인 수수두꺼비에 의해 위협받고 있었다.</div><div class=\"rst\">어느 날 매점에 맛있어 보이지만 먹으면 탈 나는 빵이 들어온 셈이에요. 지문 3번, 외래종 두꺼비가 <b>생존을 위협했어요</b>.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">To a quoll,</div><div class=\"k\">주머니고양이에게</div></div><div class=\"rc\"><div class=\"e\">these toads look as tasty as they are poisonous,</div><div class=\"k\">이 두꺼비들은 독성이 있는 만큼 먹음직스럽게 보이고</div></div><div class=\"rc\"><div class=\"e\">and the quolls who ate them</div><div class=\"k\">그것들(= 두꺼비들)을 먹은 주머니고양이들은</div></div><div class=\"rc\"><div class=\"e\">suffered fatal consequences at a speedy rate.</div><div class=\"k\">빠른 속도로 치명적인 결과를 겪었다</div></div><div class=\"rnat\">주머니고양이에게 이 두꺼비들은 독성이 있는 만큼 먹음직스럽게 보이고, 그것들을 먹은 주머니고양이들은 빠른 속도로 치명적인 결과를 겪었다.</div><div class=\"rst\">그 두꺼비는 맛있어 보이는 만큼 독이 있어서, 먹은 주머니고양이들은 금세 큰일을 당했어요. 지문 4번이에요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">Behavioral ecologists identified a clever solution</div><div class=\"k\">행동 생태학자들은 영리한 해결책을 찾아냈다</div></div><div class=\"rc ckc\"><div class=\"e\">by using <span class=\"cw\">quolls’ instincts to imitate</span>.</div><div class=\"k\"><span class=\"cw\">주머니고양이의 모방하는 본능을</span> 이용함으로써</div></div><div class=\"rnat\">행동 생태학자들은 주머니고양이의 모방하는 본능을 이용함으로써 영리한 해결책을 찾아냈다.</div><div class=\"rst\">과학자들은 <b>따라 하는 본능</b>(instincts to imitate 모방하는 본능)을 이용하기로 했어요. 지문 5번이 해결책이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Scientists fed small groups of quolls toad sausages</div><div class=\"k\">과학자들은 주머니고양이 소집단에게 두꺼비 소시지를 먹였다</div></div><div class=\"rc\"><div class=\"e\">containing harmless but nausea-inducing chemicals,</div><div class=\"k\">무해하지만 메스꺼움을 유발하는 화학 물질을 함유한</div></div><div class=\"rc\"><div class=\"e\">conditioning them to avoid the toads.</div><div class=\"k\">그들(= 주머니고양이들)이 두꺼비를 피하도록 길들였다</div></div><div class=\"rnat\">과학자들은 주머니고양이 소집단에게 무해하지만 메스꺼움을 유발하는 화학 물질을 함유한 두꺼비 소시지를 먹여 그것들이 두꺼비를 피하도록 길들였다.</div><div class=\"rst\">먼저 몇 마리에게 먹으면 속이 메스꺼운 두꺼비 소시지를 줘서 두꺼비를 피하게 길들였어요. 지문 6번이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Groups of these ‘toad-smart’ quolls</div><div class=\"k\">이러한 '두꺼비에 대해 똑똑해진' 주머니고양이 집단들은</div></div><div class=\"rc\"><div class=\"e\">were then released back into the wild:</div><div class=\"k\">그 후 다시 야생으로 방출되었다</div></div><div class=\"rc\"><div class=\"e\">they taught their own offspring</div><div class=\"k\">그들(= 방출된 주머니고양이들)은 자기 새끼들에게 가르쳤다</div></div><div class=\"rc\"><div class=\"e\">what they’d learned.</div><div class=\"k\">자신들이 학습한 것을</div></div><div class=\"rnat\">이러한 '두꺼비에 대해 똑똑해진' 주머니고양이 집단들은 그 후 다시 야생으로 방출되었고, 그들은 자신들이 학습한 것을 자기 새끼들에게 가르쳤다.</div><div class=\"rst\">이 똑똑해진 친구들을 다시 야생으로 보내자 자기 새끼에게 배운 걸 가르쳤어요. 지문 7번이에요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">Other quolls copied</div><div class=\"k\">다른 주머니고양이들은 모방했다</div></div><div class=\"rc\"><div class=\"e\">these constructive behaviors</div><div class=\"k\">이러한 건설적인 행동들을</div></div><div class=\"rc\"><div class=\"e\">through a process of social learning.</div><div class=\"k\">사회적 학습의 과정을 통해</div></div><div class=\"rnat\">다른 주머니고양이들은 이러한 건설적인 행동들을 사회적 학습의 과정을 통해 모방했다.</div><div class=\"rst\">다른 주머니고양이들도 보고 <b>따라 했어요</b>(copied 모방했다). 반에서 한 명이 하면 다 따라 하듯 퍼진 거예요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">As each baby quoll learned</div><div class=\"k\">각각의 새끼 주머니고양이들이 배웠기 때문에</div></div><div class=\"rc\"><div class=\"e\">to keep away from the hazardous toads,</div><div class=\"k\">위험한 두꺼비를 피하는 것을</div></div><div class=\"rc\"><div class=\"e\">the chances of the survival of the whole quoll species</div><div class=\"k\">주머니고양이 종 전체의 생존 가능성이</div></div><div class=\"rc\"><div class=\"e\">— and not just that of each individual quoll —</div><div class=\"k\">각각의 주머니고양이들의 생존 가능성뿐만 아니라</div></div><div class=\"rc\"><div class=\"e\">were reduced.</div><div class=\"k\">감소되었다(→ 향상되었다) ※ 문제지엔 reduced(감소되었다)로 되어 있음. 문맥상 '향상되었다(improved)'가 맞음</div></div><div class=\"rnat\">각각의 새끼 주머니고양이들이 위험한 두꺼비를 피하는 것을 배웠기 때문에, 각각의 주머니고양이들의 생존 가능성뿐만 아니라 주머니고양이 종 전체의 생존 가능성이 향상되었다.</div><div class=\"rst\">새끼마다 두꺼비를 피하게 되니, 한 마리가 아니라 종 전체가 살아남을 가능성이 커졌어요. 지문 9번이에요.</div></div><div class=\"rds key\" data-ord=\"10\"><span class=\"rn\">10번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">The quolls were saved</span></div><div class=\"k\"><span class=\"cw\">주머니고양이는 구해졌다</span></div></div><div class=\"rc\"><div class=\"e\">via minimal human interference</div><div class=\"k\">최소한의 인간의 개입을 통해</div></div><div class=\"rc\"><div class=\"e\">because ecologists were able to take advantage of</div><div class=\"k\">왜냐하면 생태학자들이 이용할 수 있었기 때문이었다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">quolls’ natural imitative instincts</span>.</div><div class=\"k\"><span class=\"cw\">주머니고양이의 선천적인 모방 본능을</span></div></div><div class=\"rnat\">주머니고양이는 최소한의 인간의 개입을 통해 구해졌는데, 왜냐하면 생태학자들이 주머니고양이의 선천적인 모방 본능을 이용할 수 있었기 때문이었다.</div><div class=\"rst\"><b>결국 모방 본능 덕분에</b> 사람이 거의 손대지 않고도 주머니고양이가 구해졌어요. 그래서 제목은 '생존의 열쇠인 모방 본능'이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"behavioral ecologist\" data-m=\"행동 생태학자\"><b>behavioral ecologist</b>행동 생태학자</button><button type=\"button\" class=\"wdb\" data-w=\"invasive species\" data-m=\"외래종\"><b>invasive species</b>외래종</button><button type=\"button\" class=\"wdb\" data-w=\"poisonous\" data-m=\"독이 있는\"><b>poisonous</b>독이 있는</button><button type=\"button\" class=\"wdb\" data-w=\"instinct\" data-m=\"본능\"><b>instinct</b>본능</button><button type=\"button\" class=\"wdb\" data-w=\"imitate\" data-m=\"모방하다\"><b>imitate</b>모방하다</button><button type=\"button\" class=\"wdb\" data-w=\"social learning\" data-m=\"사회적 학습\"><b>social learning</b>사회적 학습</button></div>", "12": "<p class=\"mtr\">마더텅 정답률 <b>50%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">6~8번은 피하는 법이 <b>퍼져 나가는 좋은 방향</b>이고, 10번은 <b>were saved</b>(구해졌다)로 끝나요. 그 사이 9번에서 생존 가능성이 <b>줄었다</b>고 하면 방향이 거꾸로예요.</p><div class=\"ck-step\"><span class=\"lab\">7·8번 · 좋은 방향으로 퍼짐</span><div class=\"en\"><mark>Other quolls copied</mark> these (d) constructive behaviors through a process of social learning.</div><p class=\"ko\"><mark>다른 주머니고양이들은</mark> 사회적 학습의 과정을 통해 이러한 건설적인 행동들을 <mark>모방했다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>새끼들까지 위험을 피하게 됐어요 = 살아남을 일이 늘어남</span></div><div class=\"ck-step key\"><span class=\"lab\">9번 앞부분 · 결정적 단서</span><div class=\"en\">As each baby quoll learned to <mark>keep away from the hazardous toads</mark>, …</div><p class=\"ko\">각각의 새끼 주머니고양이들이 <mark>위험한 두꺼비를 피하는 것을</mark> 배웠기 때문에 …</p></div><div class=\"ck-via\"><i>▼</i><span>위험을 피하게 됐는데 생존 가능성이 줄었다? 방향이 거꾸로예요</span></div><div class=\"ck-step\"><span class=\"lab\">문제지 ⑤번 자리 (9번)</span><div class=\"en\">… the chances of the survival of the whole quoll species … were <u>(e) reduced</u>.</div><p class=\"ko\">주머니고양이 종 전체의 생존 가능성이 ( 감소되었다? ) → 향상되었다가 맞아요</p></div><div class=\"ck-via\"><i>▼</i><span>결론이 '구해졌다'이니 9번도 늘어나는 쪽이어야 해요</span></div><div class=\"ck-step\"><span class=\"lab\">10번 · 결과로 확인</span><div class=\"en\"><mark>The quolls were saved</mark> via minimal human interference …</div><p class=\"ko\"><mark>주머니고양이는</mark> 최소한의 인간의 개입을 통해 <mark>구해졌다</mark> …</p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">reduced(감소되었다) ↔ increased(향상되었다)</p><p class=\"gr\">원인이 좋은 쪽(위험을 피함, 따라 배움)이면 결과도 좋은 쪽이어야 해요. 위험을 피했는데 생존 가능성이 reduced(줄었다)면 원인과 결과가 거꾸로예요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I wore a helmet, so the chance of getting hurt was reduced.</div><div class=\"ko\">헬멧을 써서 다칠 가능성이 줄었어요. (안전 → 위험 줄어듦)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I learned to swim, so my chance of being safe in the water was reduced.</div><div class=\"ko\">수영을 배웠는데 물에서 안전할 가능성이 줄었다? 방향이 거꾸로라 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>I learned to swim, so my chance of being safe in the water increased.</div><div class=\"ko\">수영을 배워서 물에서 안전할 가능성이 커졌어요. (배움 → 안전 늘어남)</div></div><p class=\"gb\">지문 9번에서 새끼들이 keep away from(~을 피하다) 위험한 두꺼비를 배웠으니, 생존 가능성은 reduced(감소되었다)가 아니라 increased(향상되었다)여야 해요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">(e) reduced → increased (향상되었다)<small>새끼들이 두꺼비를 피하게 됐으니 종 전체의 생존 가능성은 늘어나야 10번처럼 구해져요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">(d) constructive 건설적인</span><span class=\"why\">두꺼비를 피하는 행동은 살아남게 해 주는 좋은 행동이에요. 그래서 8번에서 다른 주머니고양이들이 따라 한 행동을 constructive(건설적인)라고 한 게 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">(a) threatened 위협받은</span><span class=\"why\">3번은 외래종 두꺼비가 들어온 문제 상황이고, 4번에서 두꺼비를 먹은 주머니고양이가 fatal(치명적인) 결과를 겪었으니 생존이 threatened(위협받은)가 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">(b) poisonous 독이 있는</span><span class=\"why\">4번 뒷부분에서 두꺼비를 먹으면 치명적인 결과를 겪는다고 했으니, 맛있어 보여도 poisonous(독이 있는)가 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">(c) avoid 피하다</span><span class=\"why\">메스꺼운 소시지를 먹여 길들인 목적은 두꺼비를 피하게 하는 거예요. 9번의 keep away from(~을 피하다)과 같은 말이라 avoid(피하다)가 맞아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Behavioral ecologists</div><div class=\"k\">행동 생태학자들은</div></div><div class=\"rc\"><div class=\"e\">have observed clever copying behavior</div><div class=\"k\">영리한 모방 행동을 관찰해 왔다</div></div><div class=\"rc\"><div class=\"e\">among many of our close animal relatives.</div><div class=\"k\">우리와 가까운 다수의 동류 동물들 사이에서의</div></div><div class=\"rnat\">행동 생태학자들은 우리와 가까운 다수의 동류 동물들 사이에서의 영리한 모방 행동을 관찰해 왔다.</div><div class=\"rst\">급식실에서 친구가 하는 걸 보고 따라 배우는 일이 많죠? 지문 1번은 동물들도 이렇게 영리하게 <b>따라 한다</b>고 해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">One example was uncovered</div><div class=\"k\">한 가지 사례가 발견되었다</div></div><div class=\"rc\"><div class=\"e\">by behavioral ecologists</div><div class=\"k\">행동 생태학자들에 의해</div></div><div class=\"rc\"><div class=\"e\">studying the behavior of a small Australian animal</div><div class=\"k\">작은 호주 동물의 행동을 연구하는</div></div><div class=\"rc\"><div class=\"e\">called the quoll.</div><div class=\"k\">주머니고양이(quoll)라고 불리는</div></div><div class=\"rnat\">한 가지 사례가 주머니고양이(quoll)라고 불리는 작은 호주 동물의 행동을 연구하는 행동 생태학자들에 의해 발견되었다.</div><div class=\"rst\">그 예가 호주의 작은 동물 주머니고양이예요. = 지문 2번, 생태학자들이 이 동물의 행동을 연구했대요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Its survival was being (a) threatened</div><div class=\"k\">그것(= 주머니고양이)의 생존은 위협받고 있었다</div></div><div class=\"rc\"><div class=\"e\">by the cane toad,</div><div class=\"k\">수수두꺼비에 의해</div></div><div class=\"rc\"><div class=\"e\">an invasive species introduced to Australia in the 1930s.</div><div class=\"k\">1930년대에 호주에 들여온 외래종인</div></div><div class=\"rnat\">그것의 생존은 1930년대에 호주에 들여온 외래종인 수수두꺼비에 의해 (a) 위협받고 있었다.</div><div class=\"rst\">매점에 맛있어 보이지만 먹으면 탈 나는 빵이 들어온 셈이에요. 외래종 두꺼비 때문에 생존이 <b>위협받았어요</b>(threatened 위협받은).</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">To a quoll,</div><div class=\"k\">주머니고양이에게</div></div><div class=\"rc\"><div class=\"e\">these toads look as tasty as they are (b) poisonous,</div><div class=\"k\">이 두꺼비들은 독성이 있는 만큼 먹음직스럽게 보이고</div></div><div class=\"rc\"><div class=\"e\">and the quolls who ate them</div><div class=\"k\">그것들(= 두꺼비들)을 먹은 주머니고양이들은</div></div><div class=\"rc\"><div class=\"e\">suffered fatal consequences at a speedy rate.</div><div class=\"k\">빠른 속도로 치명적인 결과를 겪었다</div></div><div class=\"rnat\">주머니고양이에게 이 두꺼비들은 (b) 독성이 있는 만큼 먹음직스럽게 보이고, 그것들을 먹은 주머니고양이들은 빠른 속도로 치명적인 결과를 겪었다.</div><div class=\"rst\">그 두꺼비는 맛있어 보이는 만큼 <b>독이 있어서</b>(poisonous 독이 있는), 먹은 주머니고양이들은 금세 큰일을 당했어요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Behavioral ecologists identified a clever solution</div><div class=\"k\">행동 생태학자들은 영리한 해결책을 찾아냈다</div></div><div class=\"rc\"><div class=\"e\">by using quolls’ instincts to imitate.</div><div class=\"k\">주머니고양이의 모방하는 본능을 이용함으로써</div></div><div class=\"rnat\">행동 생태학자들은 주머니고양이의 모방하는 본능을 이용함으로써 영리한 해결책을 찾아냈다.</div><div class=\"rst\">과학자들은 따라 하는 본능을 이용하기로 했어요. 지문 5번이 영리한 해결책이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Scientists fed small groups of quolls toad sausages</div><div class=\"k\">과학자들은 주머니고양이 소집단에게 두꺼비 소시지를 먹였다</div></div><div class=\"rc\"><div class=\"e\">containing harmless but nausea-inducing chemicals,</div><div class=\"k\">무해하지만 메스꺼움을 유발하는 화학 물질을 함유한</div></div><div class=\"rc\"><div class=\"e\">conditioning them to (c) avoid the toads.</div><div class=\"k\">그들(= 주머니고양이들)이 두꺼비를 피하도록 길들였다</div></div><div class=\"rnat\">과학자들은 주머니고양이 소집단에게 무해하지만 메스꺼움을 유발하는 화학 물질을 함유한 두꺼비 소시지를 먹여 그것들이 두꺼비를 (c) 피하도록 길들였다.</div><div class=\"rst\">먹으면 속이 메스꺼운 두꺼비 소시지를 줘서 두꺼비를 <b>피하게</b>(avoid 피하다) 길들였어요. 지문 6번이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Groups of these ‘toad-smart’ quolls</div><div class=\"k\">이러한 '두꺼비에 대해 똑똑해진' 주머니고양이 집단들은</div></div><div class=\"rc\"><div class=\"e\">were then released back into the wild:</div><div class=\"k\">그 후 다시 야생으로 방출되었다</div></div><div class=\"rc\"><div class=\"e\">they taught their own offspring</div><div class=\"k\">그들(= 방출된 주머니고양이들)은 자기 새끼들에게 가르쳤다</div></div><div class=\"rc\"><div class=\"e\">what they’d learned.</div><div class=\"k\">자신들이 학습한 것을</div></div><div class=\"rnat\">이러한 '두꺼비에 대해 똑똑해진' 주머니고양이 집단들은 그 후 다시 야생으로 방출되었고, 그들은 자신들이 학습한 것을 자기 새끼들에게 가르쳤다.</div><div class=\"rst\">똑똑해진 친구들을 다시 야생으로 보내자 자기 새끼에게 배운 걸 가르쳤어요. 지문 7번이에요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Other quolls copied</span></div><div class=\"k\"><span class=\"cw\">다른 주머니고양이들은 모방했다</span></div></div><div class=\"rc\"><div class=\"e\">these (d) constructive behaviors</div><div class=\"k\">이러한 건설적인 행동들을</div></div><div class=\"rc\"><div class=\"e\">through a process of social learning.</div><div class=\"k\">사회적 학습의 과정을 통해</div></div><div class=\"rnat\">다른 주머니고양이들은 이러한 (d) 건설적인 행동들을 사회적 학습의 과정을 통해 모방했다.</div><div class=\"rst\">다른 주머니고양이들도 이 <b>좋은 행동</b>(constructive 건설적인)을 따라 했어요. 반에서 한 명이 하면 다 따라 하듯 퍼졌어요.</div></div><div class=\"rds key\" data-ord=\"9\"><span class=\"rn\">9번 · 단서</span><div class=\"rc\"><div class=\"e\">As each baby quoll learned</div><div class=\"k\">각각의 새끼 주머니고양이들이 배웠기 때문에</div></div><div class=\"rc ckc\"><div class=\"e\">to <span class=\"cw\">keep away from the hazardous toads</span>,</div><div class=\"k\"><span class=\"cw\">위험한 두꺼비를 피하는 것을</span></div></div><div class=\"rc\"><div class=\"e\">the chances of the survival of the whole quoll species</div><div class=\"k\">주머니고양이 종 전체의 생존 가능성이</div></div><div class=\"rc\"><div class=\"e\">— and not just that of each individual quoll —</div><div class=\"k\">각각의 주머니고양이들의 생존 가능성뿐만 아니라</div></div><div class=\"rc\"><div class=\"e\">were (e) reduced.</div><div class=\"k\">감소되었다(→ 향상되었다) ※ 문제지엔 reduced(감소되었다)로 되어 있음. 문맥상 '향상되었다(improved)'가 맞음</div></div><div class=\"rnat\">각각의 새끼 주머니고양이들이 위험한 두꺼비를 피하는 것을 배웠기 때문에, 각각의 주머니고양이들의 생존 가능성뿐만 아니라 주머니고양이 종 전체의 생존 가능성이 (e) 감소되었다(→ 향상되었다).</div><div class=\"rst\">새끼마다 위험한 두꺼비를 <b>피하게 됐으니</b> 종 전체가 살 가능성은 <b>커져야</b> 해요. 그래서 reduced(감소되었다)는 틀린 말이에요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">The quolls were saved</span></div><div class=\"k\"><span class=\"cw\">주머니고양이는 구해졌다</span></div></div><div class=\"rc\"><div class=\"e\">via minimal human interference</div><div class=\"k\">최소한의 인간의 개입을 통해</div></div><div class=\"rc\"><div class=\"e\">because ecologists were able to take advantage of</div><div class=\"k\">왜냐하면 생태학자들이 이용할 수 있었기 때문이었다</div></div><div class=\"rc\"><div class=\"e\">quolls’ natural imitative instincts.</div><div class=\"k\">주머니고양이의 선천적인 모방 본능을</div></div><div class=\"rnat\">주머니고양이는 최소한의 인간의 개입을 통해 구해졌는데, 왜냐하면 생태학자들이 주머니고양이의 선천적인 모방 본능을 이용할 수 있었기 때문이었다.</div><div class=\"rst\"><b>결국 구해졌다</b>(were saved)로 끝나요. 사람이 거의 손대지 않고 모방 본능만으로요. 9번이 '늘었다'여야 하는 확인 문장이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"fatal\" data-m=\"치명적인\"><b>fatal</b>치명적인</button><button type=\"button\" class=\"wdb\" data-w=\"consequence\" data-m=\"결과\"><b>consequence</b>결과</button><button type=\"button\" class=\"wdb\" data-w=\"nausea-inducing\" data-m=\"메스꺼움을 유발하는\"><b>nausea-inducing</b>메스꺼움을 유발하는</button><button type=\"button\" class=\"wdb\" data-w=\"offspring\" data-m=\"자손, 새끼\"><b>offspring</b>자손, 새끼</button><button type=\"button\" class=\"wdb\" data-w=\"hazardous\" data-m=\"위험한\"><b>hazardous</b>위험한</button><button type=\"button\" class=\"wdb\" data-w=\"keep away from\" data-m=\"~을 멀리하다, 피하다\"><b>keep away from</b>~을 멀리하다, 피하다</button></div>"};
document.addEventListener('click',function(e){
 var b=e.target.closest('.stbtn');
 if(b){var box=b.closest('.rdb'),on=!box.classList.contains('story');box.classList.toggle('story',on);
  var L=[].slice.call(box.querySelectorAll('.rds'));L.forEach(function(x){x.classList.remove('lastv');x.style.order='';});
  if(on){L.sort(function(a,c){return (+a.dataset.ord)-(+c.dataset.ord);});L.forEach(function(x,i){x.style.order=i+1;});L[L.length-1].classList.add('lastv');}
  b.textContent=on?'문장별로 보기':'이야기로 이어 읽기';return;}
 var w=e.target.closest('.wdb');
 if(w){var on2=!w.classList.contains('on');w.classList.toggle('on',on2);
  try{if(window.WN){if(on2)WN.add([{w:w.dataset.w,m:w.dataset.m,src:'미니모고',how:'별표',ask:true}]);else if(WN.del)WN.del(w.dataset.w,'미니모고');}}catch(err){}
  var t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s';document.body.appendChild(t);}
  t.textContent=on2?'오답노트장에 담았어요':'오답노트장에서 뺐어요';t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(function(){t.style.opacity='0'},1600);}
});

/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  if(EXP[cq.q]){h+=EXP[cq.q]+'<button class="toq" data-i="'+i+'">빠른 정답으로</button>';return h+'</div></details>';}
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
  mmInit();
}
/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(S.sub&&!S.mmS){S.mmS=1;S.mmP=1;save();WN.hw(lv,day,S.sub.s+'/'+N+(S.mmD?' ✓':''));}else if(!S.sub&&!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
