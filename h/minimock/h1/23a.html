<title>고1 미니모의고사 23회 01–06번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:0}
#app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
#app>.wrap{width:100%}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}
.ko{color:var(--sub);font-size:14px;margin-left:6px}
.cell.bad{background:var(--badbg);border-color:var(--bad)}
.cell.bad .tag{background:var(--bad)}

.bar{position:sticky;margin-top:auto;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}

.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}

.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}
.hcard .chip{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--sub)}

details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.th .hd{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:6px}
.th ol{list-style:none;margin:0;padding:0;counter-reset:n}

.th li:first-child{border-top:0}

.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.th .sub{margin:3px 0 0;color:#444;font-size:14.5px;line-height:1.7}
.sc .lay.sum{border-left:4px solid #2e7d32;background:#f1f8f1}
/* ---- 새 직독직해·해설 화면 ---- */

.sc .ce{font-size:17px}

.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}

.qchip.o{border-color:var(--good);background:var(--goodbg)}

.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}

details.sub2{margin:12px 0 0}

.cr{color:#A3102E;font-weight:700}

": "of the southeast Indonesian province of Papua", "k": "인도네시아 남동쪽 Papua 지방의,"}, {"e": "<b>lives<\/b> the Korowai tribe.", "k": "Korowai 부족이 <b>살고 있다<\/b>."}], "easy": "인도네시아 남동쪽 Papua 지방의 깊은 정글에 Korowai 부족이 산다는 말이에요.", "gist": "글의 소개 — 이 글의 소재는 Korowai 부족이다."}, {"n": 2, "ch": [{"e": "<b>Until<\/b> their discovery by a Dutch man in 1974,", "k": "1974년 한 네덜란드인에 의한 <b>그들<\/b><span class=\"r\">(= Korowai족)<\/span><b>의 발견<\/b>(이 있기) <b>까지<\/b>,"}, {"e": "the Korowai had <b>hardly any contact<\/b>", "k": "Korowai족은 <b>거의 어떠한 접촉도<\/b> 하지 않았다"}, {"e": "with the outside world.", "k": "외부 세계와."}], "easy": "1974년에 네덜란드 사람에게 발견되기 전까지 Korowai족은 바깥세상과 거의 접촉하지 않았다는 말이에요.", "gist": "과거 이야기 — 발견되기 전에는 외부 세계와 거의 접촉이 없었다.", "link": "1974년 한 네덜란드인에 의한 그들의 발견이 있기까지, Korowai족은 외부 세계와 거의 어떠한 접촉도 하지 않았다."}, {"n": 3, "ch": [{"e": "The Korowai are <b>still self-sufficient<\/b>,", "k": "Korowai족은 <b>여전히 자급자족한다<\/b>,"}, {"e": "<b>producing<\/b> almost everything themselves.", "k": "거의 모든 것을 직접 <b>생산하면서<\/b>."}], "easy": "지금도 필요한 것을 거의 다 스스로 만들어 쓴다는 말이에요.", "gist": "현재 생활 모습 — 필요한 것을 스스로 해결한다."}, {"n": 4, "ch": [{"e": "Korowai families <b>have their own gardens<\/b> nearby,", "k": "Korowai족 가족은 가까이에 <b>자신의 정원들을 가지며<\/b>,"}, {"e": "<b>in which<\/b> they cultivate sweet potatoes and vegetables.", "k": "<b>거기에<\/b><span class=\"r\">(= 정원)<\/span> 그들은 고구마와 채소를 <b>재배한다<\/b>."}], "easy": "가족마다 가까이에 텃밭이 있고, 거기서 고구마와 채소를 기른다는 말이에요.", "gist": "현재 생활 모습 — 텃밭에서 먹거리를 기른다."}, {"n": 5, "ch": [{"e": "<b>They<\/b> <b>live off<\/b>", "k": "그들<span class=\"r\">(= Korowai족)<\/span>은 <b>의존하여 살아간다<\/b>"}, {"e": "whatever nature provides", "k": "자연이 무엇을 제공하든"}, {"e": "in their immediate surroundings.", "k": "그들의 바로 인접한 주변 환경에서."}], "easy": "바로 주변의 자연이 주는 것에 기대어 산다는 말이에요.", "gist": "현재 생활 모습 — 주변 자연에 기대어 산다."}, {"n": 6, "ch": [{"e": "They <b>raise pigs<\/b>", "k": "그들은 <b>돼지를 기른다<\/b>"}, {"e": "<b>as a means of exchange<\/b>", "k": "<b>교환의 수단<\/b>으로"}, {"e": "and <b>dogs for hunting<\/b>.", "k": "그리고 <b>사냥을 위해<\/b>   const tabs=[['word','1','유반의어','답 맞춰보기'],['dk','2','직독직해','해석 맞춰보기'],['submit','3','답안지','정답 입력'],['exp','4','해설',S.sub?'정답·근거':'제출하면 열림']];
  return `<header><div class="wrap"><div class="row1"><h1>${esc(TITLE)}</h1><span><button class="link gohome" data-v="home">메뉴</button><a class="link" href="index.html">목록</a></span></div><div class="tabs">`+
    tabs.map(t=>`<button class="tab ${on(t[0])}" data-v="${t[0]}" ${(t[0]==='exp'&&!S.sub)?'disabled':''}><span class="t1"><span class="n">${t[1]}</span>${t[2]}</span><span class="t2">${t[3]}</span></button>`).join('')+
    `</div></div></header>`;
}
function noteList(){
  const out=[],ck=S.checks[WS.id]||{};
  WS.words.forEach((w,i)=>{
    const c=ck[i];if(!c)return;
    const parts=['m','s','a'].filter(p=>c[p]&&(p==='m'||w[p]));
    if(parts.length)out.push({i:i,w:w,parts:parts});
  });
  return out;
}
function render(){
  if(view==='home')renderHome();
  else if(view==='dk')renderDk();
  else if(view==='word')renderWord();
  else if(view==='note')renderNote();
  else if(view==='quiz')renderQuiz();
  else if(view==='result')renderResult();
  else if(view==='submit')renderSubmit();
  else if(view==='exp')renderExp();
  window.scrollTo(0,0);
}

function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}

}

class=\"why\">[지문에 없음] 장학금이나 신청 방법은 나오지 않아요. 8번도 대학에서 행복하게 지내라는 바람뿐이에요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">전공과목에 대한 정보를 제공하려고</span><span class=\"why\">[범위 좁음] 3번의 역사학과가 우수하다는 말은 합격한 대학을 칭찬하는 한마디일 뿐, 과목 정보를 알려 주는 글이 아니에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">My dear Harriet,</div><div class=\"k\">나의 사랑하는 Harriet에게,</div></div><div class=\"rnat\">나의 사랑하는 Harriet에게,</div><div class=\"rst\">가까운 어른이 대학에 붙은 사람에게 카톡을 보낸다고 떠올려 봐요. 지문도 해리엇(Harriet)에게 쓰는 편지로 시작해요.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">2번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">I was so <span class=\"cw\">delighted</span></div><div class=\"k\">나는 <span class=\"cw\">매우 기뻤단다</span></div></div><div class=\"rc\"><div class=\"e\">to receive your letter</div><div class=\"k\">너의 편지를 받고</div></div><div class=\"rc\"><div class=\"e\">and to learn</div><div class=\"k\">그리고 알게 되어</div></div><div class=\"rc ckc\"><div class=\"e\">that you <span class=\"cw\">have been accepted to Royal Holloway</span>.</div><div class=\"k\">네가 <span class=\"cw\">Royal Holloway에 합격했다는 것을</span>.</div></div><div class=\"rnat\">나는 너의 편지를 받고 네가 Royal Holloway(로열 홀러웨이, 영국의 대학교)에 합격했다는 것을 알게 되어 매우 기뻤단다.</div><div class=\"rst\">“네 연락 받고, 원하던 대학 붙었다니 너무 기뻤어!” 지문도 <b>합격</b>(accepted) 소식에 <b>아주 기뻤다</b>(delighted)고 해요. 이게 편지의 목적이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">It’s a good college</div><div class=\"k\">그것(= Royal Holloway)은 좋은 대학이며,</div></div><div class=\"rc\"><div class=\"e\">and I know</div><div class=\"k\">나는 알고 있단다</div></div><div class=\"rc\"><div class=\"e\">that the history department there</div><div class=\"k\">그곳의 역사학과가</div></div><div class=\"rc\"><div class=\"e\">is particularly strong.</div><div class=\"k\">특히 실력 있다(우수하다)는 것을.</div></div><div class=\"rnat\">그것은 좋은 대학이며, 나는 그곳의 역사학과가 특히 실력 있다(우수하다)는 것을 알고 있단다.</div><div class=\"rst\">“거기 좋은 학교잖아, 특히 그 학과가 유명하더라.” 지문도 그 대학이 좋고 역사학과가 특히 우수하다고 칭찬해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">I can see</div><div class=\"k\">나는 이해할 수 있고</div></div><div class=\"rc\"><div class=\"e\">why it was your first choice,</div><div class=\"k\">왜 그것(= Royal Holloway)이 너의 첫 번째 선택이었는지,</div></div><div class=\"rc ckc\"><div class=\"e\">and <span class=\"cw\">I am very pleased for you</span>.</div><div class=\"k\"><span class=\"cw\">나는 너에 대해 매우 기쁘단다</span>.</div></div><div class=\"rnat\">나는 왜 그것이 너의 첫 번째 선택이었는지 이해할 수 있고, (나는) 너에 대해 매우 기쁘단다.</div><div class=\"rst\">“왜 거기가 1지망이었는지 알겠어, 진짜 기쁘다.” 지문도 첫 번째 선택이었던 이유를 알겠다며 <b>매우 기쁘다</b>고 해요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">You worked hard</div><div class=\"k\">너는 열심히 공부했고</div></div><div class=\"rc\"><div class=\"e\">to enter that college,</div><div class=\"k\">그 대학에 들어가기 위해,</div></div><div class=\"rc\"><div class=\"e\">and you deserve your success.</div><div class=\"k\">(너는) 너의 성공을 누릴 자격이 있단다(너의 성공은 마땅하다).</div></div><div class=\"rnat\">너는 그 대학에 들어가기 위해 열심히 공부했고, (너는) 너의 성공을 누릴 자격이 있단다(너의 성공은 마땅하다).</div><div class=\"rst\">“그동안 밤늦게까지 공부한 거 다 알아, 붙을 만했어.” 지문도 열심히 노력했으니 성공을 누릴 자격이 있다고 해요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">I’m so proud of you.</div><div class=\"k\">나는 네가 매우 자랑스럽구나.</div></div><div class=\"rnat\">나는 네가 매우 자랑스럽구나.</div><div class=\"rst\">“네가 정말 자랑스러워!” 지문도 네가 매우 <b>자랑스럽다</b>(proud)며 축하를 이어 가요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Well done</span>, Harriet!</div><div class=\"k\"><span class=\"cw\">정말 잘했어</span>, Harriet!</div></div><div class=\"rnat\">정말 잘했어, Harriet!</div><div class=\"rst\">“진짜 잘했어!” 지문의 <b>Well done</b>(정말 잘했어)도 합격을 축하하는 말이에요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">I send you my best wishes</div><div class=\"k\">나는 너에게 간절한 바람을 보낸다</div></div><div class=\"rc\"><div class=\"e\">for a happy time at university.</div><div class=\"k\">대학에서 행복한 시간을 보내기를.</div></div><div class=\"rnat\">나는 네가 대학에서 행복한 시간을 보내기를 간절히 바란다.</div><div class=\"rst\">“대학 가서도 즐겁게 지내!” 지문도 대학에서 행복한 시간을 보내길 바란다며 응원으로 마무리해요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">With my love,</div><div class=\"k\">사랑을 담아,</div></div><div class=\"rc\"><div class=\"e\">Elaine</div><div class=\"k\">Elaine</div></div><div class=\"rnat\">사랑을 담아, Elaine</div><div class=\"rst\">마지막에 “사랑을 담아” 하고 이름을 쓰듯, 지문도 일레인(Elaine)이 사랑을 담아 서명하며 끝나요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"delighted\" data-m=\"아주 기쁜\"><b>delighted</b>아주 기쁜</button><button type=\"button\" class=\"wdb\" data-w=\"have been accepted to\" data-m=\"~에 합격했다\"><b>have been accepted to</b>~에 합격했다</button><button type=\"button\" class=\"wdb\" data-w=\"department\" data-m=\"학과, 학부\"><b>department</b>학과, 학부</button><button type=\"button\" class=\"wdb\" data-w=\"particularly\" data-m=\"특히\"><b>particularly</b>특히</button><button type=\"button\" class=\"wdb\" data-w=\"deserve\" data-m=\"~할 자격이 있다\"><b>deserve</b>~할 자격이 있다</button><button type=\"button\" class=\"wdb\" data-w=\"proud of\" data-m=\"~을 자랑스러워하는\"><b>proud of</b>~을 자랑스러워하는</button></div>", "02": "<p class=\"mtr\">마더텅 정답률 <b>85%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">불일치 문제는 선택지를 <b>지문 순서대로</b> 하나씩 대조하세요. 지문에 <b>A는 ~용, B는 ~용</b>처럼 둘이 나란히 나오면 <b>짝이 바뀌었는지</b>부터 확인해요.</p><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>① ↔ 1번</em>Deep within the jungle(정글 속 깊은 곳에) 산다 → 같음</span><span><em>② ↔ 2번</em>discovery by a Dutch man(한 네덜란드인에 의한 발견) → 같음</span><span><em>③ ↔ 4번</em>cultivate sweet potatoes and vegetables(고구마와 채소를 재배하다) → 같음</span><span><em>⑤ ↔ 7번</em>houses high up in the trees(나무 위 높은 곳의 집) → 같음</span></div><div class=\"ck-eq\">⇒ 네 개는 지문과 그대로 같아요. 남은 ④를 6번과 대조해요</div></div><div class=\"ck-via\"><i>▼</i><span>④의 ‘교환의 수단’을 6번에서 찾아요</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 결정적 단서</span><div class=\"en\">They raise <mark>pigs</mark> <mark>as a means of exchange</mark> and <mark>dogs for hunting</mark>.</div><p class=\"ko\">그들은 <mark>교환의 수단으로</mark> <mark>돼지를</mark> 기르고, <mark>사냥을 위해 개를</mark> 기른다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">개를 교환의 수단으로 사용한다.<small>6번: 교환의 수단은 pigs(돼지)이고, dogs(개)는 사냥용이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">네덜란드인에 의해 발견되었다.</span><span class=\"why\">2번 hardly any contact(거의 접촉하지 않았다)의 부정 느낌 때문에 틀린 줄 알기 쉽지만, Until their discovery by a Dutch man(한 네덜란드인에게 발견되기까지)이라서 발견된 건 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">정글 속 깊은 곳에 산다.</span><span class=\"why\">1번 Deep within the jungle(정글 속 깊은 곳에) ... lives the Korowai tribe(코로와이족이 산다)와 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">고구마와 채소를 재배한다.</span><span class=\"why\">4번 cultivate sweet potatoes and vegetables(고구마와 채소를 재배하다)와 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">나무의 높은 곳에 있는 집에 산다.</span><span class=\"why\">7번 live in houses high up in the trees(나무 위 높은 곳에 있는 집에서 산다)와 같아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Deep within the jungle</div><div class=\"k\">정글 속 깊은 곳에</div></div><div class=\"rc\"><div class=\"e\">of the southeast Indonesian province of Papua</div><div class=\"k\">인도네시아 남동쪽 Papua 지방의,</div></div><div class=\"rc\"><div class=\"e\">lives the Korowai tribe.</div><div class=\"k\">Korowai 부족이 살고 있다.</div></div><div class=\"rnat\">인도네시아 남동쪽의 Papua(파푸아, 인도네시아 뉴기니섬 서반부 지역) 지방의 정글 속 깊은 곳에 Korowai(코로와이, 파푸아의 열대 밀림에 살고 있는 원시 부족) 부족이 살고 있다.</div><div class=\"rst\">사회 시간에 세계 부족 소개 카드를 만든다고 해 봐요. 첫 칸: 인도네시아 파푸아 정글 깊은 곳에 사는 코로와이족. 지문 1번 = 선택지 ①이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Until their discovery by a Dutch man in 1974,</div><div class=\"k\">1974년 한 네덜란드인에 의한 그들(= Korowai족)의 발견(이 있기) 까지,</div></div><div class=\"rc\"><div class=\"e\">the Korowai had hardly any contact</div><div class=\"k\">Korowai족은 거의 어떠한 접촉도 하지 않았다</div></div><div class=\"rc\"><div class=\"e\">with the outside world.</div><div class=\"k\">외부 세계와.</div></div><div class=\"rnat\">1974년 한 네덜란드인에 의한 그들의 발견(이 있기)까지, Korowai족은 외부 세계와 거의 어떠한 접촉도 하지 않았다.</div><div class=\"rst\">둘째 칸: 1974년에 한 네덜란드인이 발견하기 전까지 바깥세상과 거의 안 만났음. 지문 2번의 <b>네덜란드인의 발견</b> = 선택지 ②예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">The Korowai are still self-sufficient,</div><div class=\"k\">Korowai족은 여전히 자급자족한다,</div></div><div class=\"rc\"><div class=\"e\">producing almost everything themselves.</div><div class=\"k\">거의 모든 것을 직접 생산하면서.</div></div><div class=\"rnat\">Korowai족은 거의 모든 것을 직접 생산하면서 여전히 자급자족한다.</div><div class=\"rst\">셋째 칸: 필요한 걸 거의 다 직접 만들어 씀. 지문 3번의 <b>자급자족</b>이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Korowai families have their own gardens nearby,</div><div class=\"k\">Korowai족 가족은 가까이에 자신의 정원들을 가지며,</div></div><div class=\"rc\"><div class=\"e\">in which they cultivate sweet potatoes and vegetables.</div><div class=\"k\">거기에(= 정원) 그들은 고구마와 채소를 재배한다.</div></div><div class=\"rnat\">Korowai족 가족은 가까이에 자신의 정원들을 가지며, 거기에 그들은 고구마와 채소를 재배한다.</div><div class=\"rst\">넷째 칸: 집 근처 밭에서 고구마와 채소를 키움. 지문 4번 그대로이고, 선택지 ③과 같아요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">They live off</div><div class=\"k\">그들(= Korowai족)은 의존하여 살아간다</div></div><div class=\"rc\"><div class=\"e\">whatever nature provides</div><div class=\"k\">자연이 무엇을 제공하든</div></div><div class=\"rc\"><div class=\"e\">in their immediate surroundings.</div><div class=\"k\">그들의 바로 인접한 주변 환경에서.</div></div><div class=\"rnat\">그들은 그들의 바로 인접한 주변 환경에서 자연이 무엇을 제공하든(자연에) 의존하여 살아간다.</div><div class=\"rst\">다섯째 칸: 주변 자연이 주는 것에 기대어 살아감. 지문 5번도 가까운 자연에 의존한다고 해요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">They raise <span class=\"cw\">pigs</span></div><div class=\"k\">그들은 <span class=\"cw\">돼지를</span> 기른다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">as a means of exchange</span></div><div class=\"k\"><span class=\"cw\">교환의 수단으로</span></div></div><div class=\"rc ckc\"><div class=\"e\">and <span class=\"cw\">dogs for hunting</span>.</div><div class=\"k\">그리고 <span class=\"cw\">사냥을 위해 개를</span> 기른다.</div></div><div class=\"rnat\">그들은 교환의 수단으로 돼지를 기르고, 사냥을 위해 개를 기른다.</div><div class=\"rst\">여섯째 칸이 핵심! <b>돼지는 물건 바꾸는 용</b>, <b>개는 사냥용</b>. 그래서 지문 6번과 ④ “개를 교환 수단으로”는 짝이 바뀌었어요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">The Korowai people live in houses</div><div class=\"k\">Korowai 사람들은 집에서 산다</div></div><div class=\"rc\"><div class=\"e\">high up in the trees.</div><div class=\"k\">나무 위 높은 곳에 있는.</div></div><div class=\"rnat\">Korowai 사람들은 나무 위 높은 곳에 있는 집에서 산다.</div><div class=\"rst\">일곱째 칸: 나무 위 높은 곳에 집을 짓고 삶. 지문 7번 = 선택지 ⑤예요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">The houses protect families</div><div class=\"k\">그 집은 가족들을 보호한다</div></div><div class=\"rc\"><div class=\"e\">not only against a mass of mosquitoes below</div><div class=\"k\">그 아래에 (있는) 수많은 모기들로부터뿐만 아니라</div></div><div class=\"rc\"><div class=\"e\">but also against annoying neighbors and evil spirits.</div><div class=\"k\">성가신 이웃들과 악령으로부터도.</div></div><div class=\"rnat\">그 집은 가족들을 그 아래에 (있는) 수많은 모기들로부터뿐만 아니라 성가신 이웃들과 악령으로부터도 보호한다.</div><div class=\"rst\">마지막 칸: 높은 집 덕분에 아래 모기 떼, 성가신 이웃, 악령을 피함. 지문 8번은 나무 위 집을 짓는 이유예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"tribe\" data-m=\"부족\"><b>tribe</b>부족</button><button type=\"button\" class=\"wdb\" data-w=\"hardly any\" data-m=\"거의 없는\"><b>hardly any</b>거의 없는</button><button type=\"button\" class=\"wdb\" data-w=\"self-sufficient\" data-m=\"자급자족하는\"><b>self-sufficient</b>자급자족하는</button><button type=\"button\" class=\"wdb\" data-w=\"cultivate\" data-m=\"재배하다\"><b>cultivate</b>재배하다</button><button type=\"button\" class=\"wdb\" data-w=\"live off\" data-m=\"~에 의존해 살다\"><b>live off</b>~에 의존해 살다</button><button type=\"button\" class=\"wdb\" data-w=\"a means of exchange\" data-m=\"교환 수단\"><b>a means of exchange</b>교환 수단</button></div>", "03": "<p class=\"mtr\">마더텅 정답률 <b>60%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">밑줄은 <b>비유</b>예요. 남을 탓하는데 왜 <b>내 얼굴</b>을 때리는 셈인지, 2~4번의 <b>Our consumption</b>(우리의 소비)에서 이유를 찾아 속뜻으로 바꾸세요.</p><div class=\"ck-step\"><span class=\"lab\">밑줄 문장 (10번)</span><div class=\"en\">Blaming the fossil fuel industry while engaging in these behaviors is <mark>a slap in our own face</mark>.</div><p class=\"ko\">이러한 행위들에 참여하면서 화석 연료 산업을 탓하는 것은 <mark>스스로의 얼굴 때리기</mark>이다.</p></div><div class=\"ck-via\"><i>▼</i><span>2번 질문 “무엇이 산업을 움직이나?”의 답이 바로 우리예요</span></div><div class=\"ck-step key\"><span class=\"lab\">2~3번 · 산업을 움직이는 진짜 원인</span><div class=\"en\"><mark>Our consumption</mark>.</div><p class=\"ko\"><mark>우리의 소비이다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>우리의 소비가 원인이니, 기후 변화는 각자의 행동이 모인 결과예요</span></div><div class=\"ck-step key\"><span class=\"lab\">4번 문장 · 책임은 개인의 합</span><div class=\"en\">Climate change is <mark>a summed product of each person’s behavior</mark>.</div><p class=\"ko\">기후 변화는 <mark>각 개인 행위가 합쳐진 산물이다</mark>.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>7번</em>우리가 비행기·차로 여행하며 산업에 돈을 대 줌</span><span><em>8번</em>발전소에서 만든 전기를 낭비함</span><span><em>9번</em>원유로 만든 플라스틱을 매일 쓰고 버림</span></div><div class=\"ck-eq\">⇒ 이런 행동을 하면서 산업만 탓하면 = 내 책임을 못 알아보는 것 → ④</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">기후 변화에 대한 우리의 책임을 알아보지 못하는 것<small>산업을 움직이는 건 우리의 소비(3번)인데 남 탓만 하니, 결국 자기 책임을 못 보는 거예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">화석 연료 생산의 이점을 인정하기를 거부하는 것</span><span class=\"why\">1·5·10번에 fossil fuel industry(화석 연료 산업)가 계속 나와 끌리지만, 글은 산업의 이점이 아니라 그 산업을 움직이는 우리의 소비(3번)를 말해요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">미래 세대에게 변화의 여지를 주는 것</span><span class=\"why\">미래 세대 이야기는 지문에 없어요. 10번은 지금 소비하는 우리 자신을 꼬집는 말이에요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">천연자원 부족에 대해 스스로 경고하는 것</span><span class=\"why\">자원이 모자란다는 경고는 없어요. 7~9번은 자원 부족이 아니라 우리가 화석 연료를 쓰는 행동을 보여 줘요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">환경 문제를 개별적으로 다루기 시작하는 것</span><span class=\"why\">글자 그대로 ‘스스로’에 끌린 함정이에요. 4번 each person’s behavior(각 개인의 행위)는 원인이 개인에게 있다는 말이지, 이미 개인이 해결을 시작했다는 뜻이 아니에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">When it comes to climate change,</div><div class=\"k\">기후 변화에 관해서라면,</div></div><div class=\"rc\"><div class=\"e\">many blame the fossil fuel industry</div><div class=\"k\">많은 사람들은 화석 연료 산업을 탓한다</div></div><div class=\"rc\"><div class=\"e\">for pumping greenhouse gases,</div><div class=\"k\">온실가스를 배출하는 것에 대해,</div></div><div class=\"rc\"><div class=\"e\">the agricultural sector for burning rainforests,</div><div class=\"k\">열대 우림을 태우는 것에 대해 농업 분야를,</div></div><div class=\"rc\"><div class=\"e\">or the fashion industry for producing excessive clothes.</div><div class=\"k\">혹은 과다한 의복을 생산하는 것에 대해 패션 산업을.</div></div><div class=\"rnat\">기후 변화에 관해 많은 사람들은 온실가스를 배출하는 것에 대해 화석 연료 산업을, 열대 우림을 태우는 것에 대해 농업 분야를, 혹은 과다한 의복을 생산하는 것에 대해 패션 산업을 탓한다.</div><div class=\"rst\">교실 쓰레기통이 넘치면 다들 “청소 당번이 안 비워서 그래!” 하고 탓해요. 지문 1번도 기후 변화를 화석 연료·농업·패션 산업 탓으로 돌려요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">But wait,</div><div class=\"k\">하지만 자,</div></div><div class=\"rc\"><div class=\"e\">what drives these industrial activities?</div><div class=\"k\">무엇이 이러한 산업 활동들을 가동시키는가?</div></div><div class=\"rnat\">하지만 자, 무엇이 이러한 산업 활동들을 가동시키는가?</div><div class=\"rst\"><b>하지만</b>(But) 잠깐, 쓰레기는 누가 버렸을까요? 지문 2번도 무엇이 이 산업들을 움직이는지 물어요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Our consumption</span>.</div><div class=\"k\"><span class=\"cw\">우리의 소비이다</span>.</div></div><div class=\"rnat\">우리의 소비이다.</div><div class=\"rst\">답은 우리 반 모두가 버린 과자 봉지예요. 지문 3번의 답도 <b>우리의 소비</b>(Our consumption)예요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">Climate change is</div><div class=\"k\">기후 변화는</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">a summed product of each person’s behavior</span>.</div><div class=\"k\"><span class=\"cw\">각 개인 행위가 합쳐진 산물이다</span>.</div></div><div class=\"rnat\">기후 변화는 각 개인 행위가 합쳐진 산물이다.</div><div class=\"rst\">넘친 쓰레기통은 한 명씩 버린 게 모인 결과예요. = 지문 4번, 기후 변화는 <b>각 개인 행위가 합쳐진 산물</b>이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">For example,</div><div class=\"k\">예를 들어,</div></div><div class=\"rc\"><div class=\"e\">the fossil fuel industry is a popular scapegoat</div><div class=\"k\">화석 연료 산업은 일반적인 희생양이다</div></div><div class=\"rc\"><div class=\"e\">in the climate crisis.</div><div class=\"k\">기후 위기에서.</div></div><div class=\"rnat\">예를 들어 화석 연료 산업은 기후 위기의 일반적인 희생양이다.</div><div class=\"rst\">예를 들어 청소 당번이 늘 욕먹는 사람이 되죠. 지문 5번도 화석 연료 산업이 흔한 <b>희생양</b>(scapegoat)이라고 해요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">But why do they</div><div class=\"k\">하지만 왜 그들(= 화석 연료 산업)은</div></div><div class=\"rc\"><div class=\"e\">drill and burn fossil fuels?</div><div class=\"k\">화석 연료를 시추하고 태울까?</div></div><div class=\"rnat\">하지만 왜 그들은 화석 연료를 시추하고 태울까?</div><div class=\"rst\">그런데 당번은 왜 매일 쓰레기를 치워야 할까요? 지문 6번도 산업이 왜 화석 연료를 캐고 태우는지 물어요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">We provide them</span></div><div class=\"k\"><span class=\"cw\">우리가 그들(= 화석 연료 산업)에게 제공한다</span></div></div><div class=\"rc\"><div class=\"e\">strong financial incentives:</div><div class=\"k\">강력한 금전적인 동기를.</div></div><div class=\"rc\"><div class=\"e\">some people regularly travel</div><div class=\"k\">예를 들어, 어떤 사람들은 정기적으로 여행한다</div></div><div class=\"rc\"><div class=\"e\">on airplanes and cars that burn fossil fuels.</div><div class=\"k\">화석 연료를 태우는 비행기와 차로.</div></div><div class=\"rnat\">우리가 그들에게 강력한 금전적인 동기를 제공한다. 예를 들어, 어떤 사람들은 화석 연료를 태우는 비행기와 차로 정기적으로 여행한다.</div><div class=\"rst\">우리가 계속 버리니까요. 지문 7번도 우리가 비행기·차를 타며 산업에 강력한 금전적 동기를 준다고 해요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">Some people waste electricity</div><div class=\"k\">어떤 사람들은 전기를 낭비한다</div></div><div class=\"rc\"><div class=\"e\">generated by burning fuel in power plants.</div><div class=\"k\">발전소에서 연료를 태움으로써 생산된.</div></div><div class=\"rnat\">어떤 사람들은 발전소에서 연료를 태움으로써 생산된 전기를 낭비한다.</div><div class=\"rst\">교실 불을 켜 두고 나가는 친구도 있어요. 지문 8번도 발전소에서 연료를 태워 만든 전기를 낭비한다고 해요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">Some people use and throw away</div><div class=\"k\">어떤 사람들은 사용하고 버린다</div></div><div class=\"rc\"><div class=\"e\">plastic products derived from crude oil</div><div class=\"k\">원유로부터 얻어진 플라스틱 제품을</div></div><div class=\"rc\"><div class=\"e\">every day.</div><div class=\"k\">매일.</div></div><div class=\"rnat\">어떤 사람들은 원유로부터 얻어진 플라스틱 제품을 매일 사용하고 버린다.</div><div class=\"rst\">매일 일회용 컵을 쓰고 버리는 친구도 있어요. 지문 9번도 원유로 만든 플라스틱을 매일 쓰고 버린다고 해요.</div></div><div class=\"rds key\" data-ord=\"10\"><span class=\"rn\">10번 · 단서</span><div class=\"rc\"><div class=\"e\">Blaming the fossil fuel industry</div><div class=\"k\">화석 연료 산업을 탓하는 것은</div></div><div class=\"rc\"><div class=\"e\">while engaging in these behaviors</div><div class=\"k\">이러한 행위들(= 앞에서 말한 소비 행동들)에 참여하면서</div></div><div class=\"rc ckc\"><div class=\"e\">is <span class=\"cw\">a slap in our own face</span>.</div><div class=\"k\"><span class=\"cw\">스스로의 얼굴 때리기</span>(기후 변화에 대한 우리의 책임을 인지하는 것에 실패하기)이다.</div></div><div class=\"rnat\">이러한 행위들에 참여하면서 화석 연료 산업을 탓하는 것은 스스로의 얼굴 때리기(기후 변화에 대한 우리의 책임을 인지하는 것에 실패하기)이다.</div><div class=\"rst\"><b>내가 버리면서 당번만 탓하면 내 얼굴을 때리는 셈이에요.</b> 그래서 밑줄은 “우리의 책임을 못 알아본다”(④)는 뜻이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"when it comes to\" data-m=\"~에 관해서라면\"><b>when it comes to</b>~에 관해서라면</button><button type=\"button\" class=\"wdb\" data-w=\"consumption\" data-m=\"소비\"><b>consumption</b>소비</button><button type=\"button\" class=\"wdb\" data-w=\"summed product\" data-m=\"합산된 결과물\"><b>summed product</b>합산된 결과물</button><button type=\"button\" class=\"wdb\" data-w=\"scapegoat\" data-m=\"희생양\"><b>scapegoat</b>희생양</button><button type=\"button\" class=\"wdb\" data-w=\"financial incentive\" data-m=\"금전적 유인\"><b>financial incentive</b>금전적 유인</button><button type=\"button\" class=\"wdb\" data-w=\"derived from\" data-m=\"~에서 나온\"><b>derived from</b>~에서 나온</button></div>", "04": "<p class=\"mtr\">마더텅 정답률 <b>70%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">주제는 <b>첫 문장</b>에 있어요. <b>We tend to believe</b>(우리는 믿는 경향이 있다)로 일반 원리를 못 박고, <b>For example</b>(예를 들어)부터 끝까지는 그 믿음을 보여 주는 <b>사례·통계</b>예요.</p><div class=\"ck-step key\"><span class=\"lab\">1번 문장 · 결정적 주제문</span><div class=\"en\"><mark>We tend to believe</mark> that we possess <mark>a host of socially desirable characteristics</mark>, and that we are free of most of those that are socially undesirable.</div><p class=\"ko\">우리는 <mark>사회적으로 바람직한 특성들을 많이 지니고 있다고</mark>, 그리고 사회적으로 바람직하지 않은 특성들은 대부분 없다고 <mark>믿는 경향이 있다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>For example(예를 들어)로 1번의 믿음을 구체적으로 보여 줘요</span></div><div class=\"ck-step\"><span class=\"lab\">2번 문장 · 예시 시작</span><div class=\"en\">For example, a large majority of the general public thinks that they are more intelligent … <mark>than the average person</mark>.</div><p class=\"ko\">예를 들어, 대다수의 일반 대중은 자신이 <mark>보통 사람보다</mark> 더 지적이라고 … 생각한다.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>3번</em>이 현상은 흔해서 ‘모든 아이가 평균 이상’인 마을 이름을 딴 효과로 불림</span><span><em>4번</em>졸업반 70%가 리더십이 평균 이상이라고 생각함</span><span><em>5번</em>모든 학생이 남과 잘 지내는 능력이 평균 이상이라고 생각함</span></div><div class=\"ck-eq\">⇒ 세 사례의 공통점 = 우리는 스스로 평균보다 낫다고 믿어요 (1번과 같은 말) → ②</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">우리가 평균보다 낫다고 여기는 우리의 흔한 믿음<small>1번의 tend to believe(믿는 경향이 있다)와 2번의 than the average person(보통 사람보다)을 합친 말이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">리더로서 긍정적 자아상을 갖는 것의 중요성</span><span class=\"why\">[범위 좁음] 4번 leadership ability(리더십 능력)는 여러 사례 중 하나예요. 게다가 글은 그게 중요하다고 권하는 게 아니라 그렇게 믿는 현상을 보여 줄 뿐이에요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">남들이 우리보다 우월하다고 생각하는 경향</span><span class=\"why\">[반대] 2번은 우리가 자신을 보통 사람보다 more intelligent(더 지적인) 사람이라고 믿는다고 해요. 남이 더 낫다는 건 정반대예요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">우리가 늘 평균 이상이 되려고 애쓰는 이유</span><span class=\"why\">[지문에 없음] 글은 이미 평균 이상이라고 believe(믿는다)는 얘기지, 그렇게 되려고 노력하는 이유는 나오지 않아요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">건강한 사회적 관계망을 만드는 데 있어 편견의 위험</span><span class=\"why\">[지문에 없음] 2번 less prejudiced(덜 편견을 가진)와 5번 get along with others(남과 잘 지내다)가 나오지만, 둘 다 스스로를 높게 보는 사례일 뿐 편견의 위험은 말하지 않아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds key\" data-ord=\"1\"><span class=\"rn\">1번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">We tend to believe</span></div><div class=\"k\"><span class=\"cw\">우리는 믿는 경향이 있다</span></div></div><div class=\"rc ckc\"><div class=\"e\">that we possess <span class=\"cw\">a host of socially desirable characteristics</span>,</div><div class=\"k\">우리가 <span class=\"cw\">사회적으로 바람직한 특성들을 많이 지니고 있다고</span>,</div></div><div class=\"rc\"><div class=\"e\">and that we are free of most of those</div><div class=\"k\">그리고 우리는 그것들(= 특성들) 대부분이 없다고</div></div><div class=\"rc\"><div class=\"e\">that are socially undesirable.</div><div class=\"k\">(그것들 중) 사회적으로 바람직하지 않은.</div></div><div class=\"rnat\">우리는 우리가 사회적으로 바람직한 특성들을 많이 지니고 있고, 사회적으로 바람직하지 않은 특성들의 대부분이 없다고 믿는 경향이 있다.</div><div class=\"rst\">우리 반 친구들에게 “너 착해?” 물으면 다들 “응, 나 꽤 괜찮은 편이야” 해요. = 지문 1번, 우리는 좋은 점은 많고 나쁜 점은 없다고 <b>믿는 경향</b>이 있어요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">For example,</div><div class=\"k\">예를 들어,</div></div><div class=\"rc\"><div class=\"e\">a large majority of the general public</div><div class=\"k\">대다수의 일반 대중은</div></div><div class=\"rc\"><div class=\"e\">thinks that they are</div><div class=\"k\">생각한다 그들(= 대다수의 일반 대중)이 ~라고</div></div><div class=\"rc\"><div class=\"e\">more intelligent, more fair-minded, less prejudiced,</div><div class=\"k\">더 지적이고, 더 공정하고, 덜 편견을 가지고,</div></div><div class=\"rc\"><div class=\"e\">and more skilled behind the wheel of an automobile</div><div class=\"k\">자동차의 운전대를 잡을 때(운전할 때) 더 능숙하다고</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">than the average person</span>.</div><div class=\"k\"><span class=\"cw\">보통 사람보다</span>.</div></div><div class=\"rnat\">예를 들어, 대다수의 일반 대중은 그들이 보통 사람보다 더 지적이고, 더 공정하고, 덜 편견을 가지고, 자동차의 운전대를 잡을 때(운전할 때) 더 능숙하다고 생각한다.</div><div class=\"rst\"><b>예를 들어</b>(For example) 대부분이 “나는 반 평균보다 똑똑하고 공정해”라고 생각해요. 지문 2번도 대다수가 자신이 <b>보통 사람보다</b> 낫다고 여겨요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">This phenomenon is so reliable and ubiquitous</div><div class=\"k\">이 현상(= 자신이 평균보다 낫다고 생각하는 현상)은 너무 신뢰할 수 있고 도처에 있어서</div></div><div class=\"rc\"><div class=\"e\">that it has come to be known as</div><div class=\"k\">~라고 알려지게 되었다</div></div><div class=\"rc\"><div class=\"e\">the “Lake Wobegon effect,”</div><div class=\"k\">‘Lake Wobegon effect’라고</div></div><div class=\"rc\"><div class=\"e\">after Garrison Keillor’s fictional community</div><div class=\"k\">Garrison Keillor의 허구적인 공동체를 따라</div></div><div class=\"rc\"><div class=\"e\">where “the women are strong,</div><div class=\"k\">그곳은 ‘여성들은 강하고,</div></div><div class=\"rc\"><div class=\"e\">the men are good-looking, and all the children are above average.”</div><div class=\"k\">남성들은 잘생기고, 모든 아이들은 평균 이상’인 곳이다.</div></div><div class=\"rnat\">이 현상은 너무 신뢰할 수 있고 도처에 있어서 ‘여성들은 강하고, 남성들은 잘생기고, 모든 아이들은 평균 이상’인 Garrison Keillor의 허구적인 공동체를 따라 ‘Lake Wobegon effect’라고 알려지게 되었다.</div><div class=\"rst\">이건 너무 흔해서 ‘모든 아이가 평균 이상’인 동네 이름을 딴 레이크 워비곤 효과(Lake Wobegon effect)라는 이름까지 생겼어요. 지문 3번이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">A survey of one million high school seniors</div><div class=\"k\">고등학교 졸업반 학생 백만 명을 대상으로 한 설문 조사는</div></div><div class=\"rc\"><div class=\"e\">found that 70% thought</div><div class=\"k\">70%가 생각했다는 것을 발견했다</div></div><div class=\"rc\"><div class=\"e\">they were above average in leadership ability,</div><div class=\"k\">자신(= 졸업반 학생들)이 리더십 능력에 있어 평균 이상이라고,</div></div><div class=\"rc\"><div class=\"e\">and only 2% thought they were below average.</div><div class=\"k\">그리고 2%만이 자신이 평균 이하라고 생각했다.</div></div><div class=\"rnat\">고등학교 졸업반 학생 백만 명을 대상으로 한 설문 조사는 70%가 자신이 리더십 능력에 있어 평균 이상이라고 생각했고, 2%만이 자신이 평균 이하라고 생각했다는 것을 발견했다.</div><div class=\"rst\">반장 선거 전에 물으면 70%가 “나 리더십은 평균 이상”이래요. 지문 4번도 졸업반 70%가 그렇게, 2%만 평균 이하라고 답해요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">In terms of ability to get along with others,</div><div class=\"k\">다른 사람들과 잘 지내는 능력에 있어서,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">all students thought they were above average</span>,</div><div class=\"k\"><span class=\"cw\">‘모든’ 학생들은 자신이 평균 이상이라고 생각했고</span>,</div></div><div class=\"rc\"><div class=\"e\">60% thought they were in the top 10%,</div><div class=\"k\">60%는 자신이 상위 10%에 있다고 생각했으며,</div></div><div class=\"rc\"><div class=\"e\">and 25% thought they were in the top 1%!</div><div class=\"k\">25%는 자신이 상위 1%에 있다고 생각했다!</div></div><div class=\"rnat\">다른 사람들과 잘 지내는 능력에 있어서, ‘모든’ 학생들은 자신이 평균 이상이라고 생각했고, 60%는 자신이 상위 10%에 있다고 생각했으며, 25%는 자신이 상위 1%에 있다고 생각했다!</div><div class=\"rst\">“친구랑 잘 지내?”엔 모두가 평균 이상이래요! 지문 5번도 60%는 상위 10%, 25%는 상위 1%라고 믿어요. 모두 1번의 믿음을 보여 주는 예예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"possess\" data-m=\"지니다\"><b>possess</b>지니다</button><button type=\"button\" class=\"wdb\" data-w=\"a host of\" data-m=\"다수의\"><b>a host of</b>다수의</button><button type=\"button\" class=\"wdb\" data-w=\"socially desirable\" data-m=\"사회적으로 바람직한\"><b>socially desirable</b>사회적으로 바람직한</button><button type=\"button\" class=\"wdb\" data-w=\"fair-minded\" data-m=\"공정한\"><b>fair-minded</b>공정한</button><button type=\"button\" class=\"wdb\" data-w=\"ubiquitous\" data-m=\"도처에 있는\"><b>ubiquitous</b>도처에 있는</button><button type=\"button\" class=\"wdb\" data-w=\"in terms of\" data-m=\"~의 면에서\"><b>in terms of</b>~의 면에서</button></div>", "05": "<p class=\"mtr\">마더텅 정답률 <b>20%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">콤마 앞뒤에 <b>동사가 두 개</b>인데 <b>접속사가 없으면</b> 의심하세요. 두 절을 이어 주려면 대명사 them(그것들) 대신 <b>관계대명사 which</b>(그리고 그것들)가 와야 해요.</p><div class=\"ck-step\"><span class=\"lab\">문제지 ③번 자리 (3번)</span><div class=\"en\">More than 35 models of high-efficiency toilets are on the U.S. market today, some of <u>③ them</u> use less than 1.3 gallons per flush.</div><p class=\"ko\">35개 이상의 고효율 변기 모델이 시장에 있다, 그것들 중 일부는 1.3갤런 미만을 사용한다 — 콤마 앞뒤로 동사 are와 use, 접속사 없음</p></div><div class=\"ck-via\"><i>▼</i><span>앞 절은 이미 주어 + 동사 are(있다)로 완성됐어요</span></div><div class=\"ck-step\"><span class=\"lab\">3번 앞 절 · 첫 번째 동사</span><div class=\"en\">More than 35 models of high-efficiency toilets <mark>are</mark> on the U.S. market today,</div><p class=\"ko\">35개 이상의 고효율 변기 모델이 오늘날 미국 시장에 <mark>있으며</mark>,</p></div><div class=\"ck-via\"><i>▼</i><span>뒤 절에도 동사 use(사용하다)가 있는데 접속사가 없어요 → 접속사 역할까지 하는 which(그리고 그것들)</span></div><div class=\"ck-step key\"><span class=\"lab\">3번 뒤 절 · 결정적 단서</span><div class=\"en\"><mark>some of which use</mark> less than 1.3 gallons per flush.</div><p class=\"ko\"><mark>그것들(= 35개 이상의 고효율 변기 모델) 중 일부는</mark> 물을 내릴 때마다 1.3갤런 미만을 <mark>사용한다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">대명사 them(그것들)과 관계대명사 which(그리고 그것들) 구별</p><p class=\"gr\">두 절을 콤마로만 이으면 접속사가 없어서 틀려요. 대명사 them(그것들)은 접속사 역할을 못 하고, 관계대명사 which(그리고 그것들)는 접속사 + 대명사 역할을 함께 해요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I have two cats, and one of them is white.</div><div class=\"ko\">나는 고양이가 두 마리 있고, 그중 한 마리는 하얗다. (접속사 and가 있어서 them이 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I have two cats, one of them is white.</div><div class=\"ko\">콤마 앞뒤로 동사 have와 is가 있는데 접속사가 없어서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>I have two cats, one of which is white.</div><div class=\"ko\">which가 접속사 역할까지 해서 두 절을 이어 주니 맞아요.</div></div><p class=\"gb\">지문 3번도 콤마 앞 are(있다), 뒤 use(사용하다)로 동사가 두 개인데 접속사가 없어요. 그래서 them(그것들)이 아니라 which(그리고 그것들)여야 해요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">them → which (그리고 그것들)<small>are(있다)와 use(사용하다) 두 동사를 이을 접속사가 없으니 which(그리고 그것들)여야 해요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">are 있다</span><span class=\"why\">2번은 there(~이 있다) 구문이라 주어가 뒤에 와요. 진짜 주어 plenty of devices(많은 장치들)가 복수라서 are(있다)가 맞아요. 앞의 technology(기술)를 주어로 착각하면 단수 동사 is(있다)로 바꾸고 싶어져요.</span><div class=\"gm wx\"><p class=\"gt\">there be(~이 있다) 구문: 동사 뒤 명사가 진짜 주어</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>There are many books on the desk.</div><div class=\"ko\">책상 위에 책이 많이 있다. (진짜 주어 many books 많은 책이 복수라서 are가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>There is many books on the desk.</div><div class=\"ko\">주어 books(책들)가 복수인데 is를 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>There is a cat under the chair.</div><div class=\"ko\">의자 밑에 고양이 한 마리가 있다. (a cat 고양이 한 마리는 단수라서 is가 맞아요)</div></div><p class=\"gb\">지문 2번도 are(있다) 뒤의 plenty of devices(많은 장치들)가 진짜 주어이고 복수라 are(있다)가 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">to save 절약하는</span><span class=\"why\">1번은 the cheapest way(가장 저렴한 방법) 바로 뒤예요. 어떤 방법인지 꾸며 주는 자리라 to save(절약하는)가 와서 ‘물을 절약하는 방법’이 돼요.</span><div class=\"gm wx\"><p class=\"gt\">명사 + to(~할, ~하는) + 동사원형: 명사를 뒤에서 꾸밈</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I need a way to solve this problem.</div><div class=\"ko\">나는 이 문제를 푸는 방법이 필요하다. (a way 방법 뒤 to solve 풀 가 꾸며서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I need a way solve this problem.</div><div class=\"ko\">to 없이 동사원형 solve(풀다)를 바로 붙여서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>She has some homework to do.</div><div class=\"ko\">그녀는 해야 할 숙제가 좀 있다. (homework 숙제 뒤 to do 할 이 꾸며서 맞아요)</div></div><p class=\"gb\">지문 1번도 the cheapest way(가장 저렴한 방법) 뒤에서 to save(절약하는)가 어떤 방법인지 꾸며 줘서 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">officially 공식적으로</span><span class=\"why\">5번은 Appliances(기기들) 뒤에서 approved as most efficient(가장 효율적이라고 인정된)가 꾸미는 구조예요. ④는 과거분사 approved(인정된)를 꾸미는 자리라 부사 officially(공식적으로)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">부사 + 과거분사: 분사(동사 성질)는 부사가 꾸밈</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>This is a carefully written letter.</div><div class=\"ko\">이것은 정성껏 쓰인 편지다. (written 쓰인 을 부사 carefully 정성껏 가 꾸며서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>This is a careful written letter.</div><div class=\"ko\">형용사 careful(신중한)은 분사 written(쓰인)을 꾸미지 못해서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>He bought a newly built house.</div><div class=\"ko\">그는 새로 지어진 집을 샀다. (built 지어진 을 부사 newly 새로 가 꾸며서 맞아요)</div></div><p class=\"gb\">지문 5번도 approved(인정된)라는 분사를 꾸미니 부사 officially(공식적으로)가 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">even 훨씬</span><span class=\"why\">7번은 save(절약하다) 뒤에 more water(더 많은 물)라는 비교급이 와요. 비교급 more(더 많은)를 강조하는 자리라 even(훨씬)이 맞아요. 6번 세탁기보다 식기 세척기가 더 아낀다는 흐름이에요.</span><div class=\"gm wx\"><p class=\"gt\">비교급 강조: even(훨씬)·much(훨씬)·far(훨씬) + 비교급, very(매우)는 안 됨</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>This bag is even heavier than that one.</div><div class=\"ko\">이 가방은 저것보다 훨씬 더 무겁다. (비교급 heavier 더 무거운 앞에 even 훨씬 이라 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>This bag is very heavier than that one.</div><div class=\"ko\">very(매우)는 비교급을 강조하지 못해서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>Our dog eats much more food than our cat.</div><div class=\"ko\">우리 개는 고양이보다 훨씬 더 많은 음식을 먹는다. (more 더 많은 앞에 much 훨씬 이라 맞아요)</div></div><p class=\"gb\">지문 7번도 비교급 more water(더 많은 물) 앞이라 even(훨씬)이 비교급을 강조해서 맞아요.</p></div></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Improved consumer water consciousness</div><div class=\"k\">물에 대한 향상된 소비자 의식이</div></div><div class=\"rc\"><div class=\"e\">may be the cheapest way to save the most water,</div><div class=\"k\">가장 많은 물을 절약하는 가장 저렴한 방법일 수도 있지만,</div></div><div class=\"rc\"><div class=\"e\">but it is not the only way</div><div class=\"k\">그러나 그것(= 물에 대한 향상된 소비자 의식)은 유일한 방법은 아니다</div></div><div class=\"rc\"><div class=\"e\">consumers can contribute to water conservation.</div><div class=\"k\">소비자들이 물 보존에 기여할 수 있는.</div></div><div class=\"rnat\">물에 대한 향상된 소비자 의식이 가장 많은 물을 절약하는 가장 저렴한 방법일 수도 있지만, 그것이 소비자들이 물 보존에 기여할 수 있는 유일한 방법은 아니다.</div><div class=\"rst\">물을 아끼려는 마음이 가장 싼 방법이지만, 그게 유일한 방법은 아니에요. 어떤 방법인지 꾸미는 to save(절약하는)가 the cheapest way(가장 저렴한 방법) 뒤에 와요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">With technology progressing faster than ever before,</div><div class=\"k\">기술이 이전보다 더 빠르게 진보함에 따라,</div></div><div class=\"rc\"><div class=\"e\">there are plenty of devices</div><div class=\"k\">많은 장치들이 있다</div></div><div class=\"rc\"><div class=\"e\">that consumers can install in their homes</div><div class=\"k\">소비자들이 자신의 집에 설치할 수 있는</div></div><div class=\"rc\"><div class=\"e\">to save more.</div><div class=\"k\">물을 더 절약하기 위해.</div></div><div class=\"rnat\">기술이 이전보다 더 빠르게 진보함에 따라, 소비자들이 물을 더 절약하기 위해 자신의 집에 설치할 수 있는 많은 장치들이 있다.</div><div class=\"rst\">기술이 빨라져서 집에 달 수 있는 물 절약 장치가 많아요. there are(~이 있다) 뒤 plenty of devices(많은 장치들)가 진짜 주어예요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc\"><div class=\"e\">More than 35 models of high-efficiency toilets</div><div class=\"k\">35개 이상의 고효율 변기 모델이</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">are on the U.S. market today,</span></div><div class=\"k\"><span class=\"cw\">오늘날 미국 시장에 있으며,</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">some of which use</span></div><div class=\"k\"><span class=\"cw\">그것들(= 35개 이상의 고효율 변기 모델) 중 일부는 사용한다</span></div></div><div class=\"rc\"><div class=\"e\">less than 1.3 gallons per flush.</div><div class=\"k\">물을 내릴 때마다 1.3갤런 미만을. ※ 문제지엔 them으로 되어 있음</div></div><div class=\"rnat\">35개 이상의 고효율 변기 모델이 오늘날 미국 시장에 있으며, 그것들 중 일부는 물을 내릴 때마다 1.3갤런 미만을 사용한다.</div><div class=\"rst\">고효율 변기가 35개 넘게 나와 있고 일부는 1.3갤런도 안 써요. 동사가 <b>are</b>(있다)와 <b>use</b>(사용하다) 두 개라 <b>which</b>(그리고 그것들)로 이어야 해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Starting at $200,</div><div class=\"k\">200달러에서 시작하는,</div></div><div class=\"rc\"><div class=\"e\">these toilets are affordable</div><div class=\"k\">이 변기들은 가격이 알맞고</div></div><div class=\"rc\"><div class=\"e\">and can help the average consumer</div><div class=\"k\">일반 소비자가 ~하는 것을 도울 수 있다</div></div><div class=\"rc\"><div class=\"e\">save hundreds of gallons of water per year.</div><div class=\"k\">한 해에 수백 갤런의 물을 절약하는 것을.</div></div><div class=\"rnat\">200달러에서 시작하는 이 변기들은 가격이 알맞고 일반 소비자가 한 해에 수백 갤런의 물을 절약하는 것을 도울 수 있다.</div><div class=\"rst\">200달러부터라 값도 알맞고, 한 해에 물을 수백 갤런 아끼게 도와요. help(돕다) + 사람 + 동사원형 save(절약하다) 구조예요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Appliances</div><div class=\"k\">기기들은</div></div><div class=\"rc\"><div class=\"e\">officially approved as most efficient</div><div class=\"k\">가장 효율적이라고 공식적으로 인정된</div></div><div class=\"rc\"><div class=\"e\">are tagged with the Energy Star logo</div><div class=\"k\">Energy Star 로고(에너지 효율성 마크)가 붙여져 있다</div></div><div class=\"rc\"><div class=\"e\">to alert the shopper.</div><div class=\"k\">(이를) 소비자들에게 알리기 위해.</div></div><div class=\"rnat\">가장 효율적이라고 공식적으로 인정된 기기들은 (이를) 소비자들에게 알리기 위해 Energy Star 로고(에너지 효율성 마크)가 붙여져 있다.</div><div class=\"rst\">가장 효율적이라고 공식 인정된 기기엔 에너지 스타(Energy Star) 로고가 붙어요. 분사 approved(인정된)를 부사 officially(공식적으로)가 꾸며요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Washing machines with that rating</div><div class=\"k\">그런 등급의 세탁기들은</div></div><div class=\"rc\"><div class=\"e\">use 18 to 25 gallons of water per load,</div><div class=\"k\">1회 세탁 시 물 18에서 25갤런을 사용한다,</div></div><div class=\"rc\"><div class=\"e\">compared with older machines</div><div class=\"k\">구형 제품과 비교하면,</div></div><div class=\"rc\"><div class=\"e\">that use 40 gallons.</div><div class=\"k\">40갤런을 사용하는 (구형 제품).</div></div><div class=\"rnat\">40갤런을 사용하는 구형 제품에 비해, 그런 등급의 세탁기들은 1회 세탁 시 18에서 25갤런의 물을 사용한다.</div><div class=\"rst\">그 등급 세탁기는 한 번에 18~25갤런만 써요. 구형은 40갤런을 쓰니 훨씬 적게 쓰는 거예요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">High-efficiency dishwashers save</div><div class=\"k\">고효율 식기 세척기는 절약한다</div></div><div class=\"rc\"><div class=\"e\">even more water.</div><div class=\"k\">훨씬 더 많은 물을.</div></div><div class=\"rnat\">고효율 식기 세척기는 훨씬 더 많은 물을 절약한다.</div><div class=\"rst\">고효율 식기 세척기는 물을 훨씬 더 많이 아껴요. 비교급 more(더 많은) 앞의 even(훨씬)이 그 차이를 강조해요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">These machines use up to 50 percent less water</div><div class=\"k\">이 기계들은 최대 50퍼센트까지 더 적은 물을 사용한다</div></div><div class=\"rc\"><div class=\"e\">than older models.</div><div class=\"k\">구형 모델보다.</div></div><div class=\"rnat\">이러한 기계들은 구형 모델보다 최대 50퍼센트까지 더 적은 물을 사용한다.</div><div class=\"rst\">이 기계들은 구형 모델보다 물을 최대 50퍼센트까지 덜 써요. 7번의 ‘훨씬 더’가 얼마나인지 숫자로 보여 줘요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"consciousness\" data-m=\"의식, 인식\"><b>consciousness</b>의식, 인식</button><button type=\"button\" class=\"wdb\" data-w=\"contribute to\" data-m=\"~에 기여하다\"><b>contribute to</b>~에 기여하다</button><button type=\"button\" class=\"wdb\" data-w=\"install\" data-m=\"설치하다\"><b>install</b>설치하다</button><button type=\"button\" class=\"wdb\" data-w=\"high-efficiency\" data-m=\"고효율의\"><b>high-efficiency</b>고효율의</button><button type=\"button\" class=\"wdb\" data-w=\"affordable\" data-m=\"값이 감당할 만한\"><b>affordable</b>값이 감당할 만한</button><button type=\"button\" class=\"wdb\" data-w=\"appliance\" data-m=\"가전제품\"><b>appliance</b>가전제품</button></div>", "06": "<p class=\"mtr\">마더텅 정답률 <b>45%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">6번 <b>Yet</b>(하지만)에서 방향이 꺾여요. 원인은 <b>하나가 아니라 여러 사건이 모두</b> 결과를 만든다고 했으니, 하나라도 빠지면 결과는 <b>달라져야</b> 해요. 그 방향과 어긋나는 낱말을 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">6번 · 방향 전환</span><div class=\"en\"><mark>Yet</mark> these causal attributions are often <mark>mistaken</mark>.</div><p class=\"ko\"><mark>하지만</mark> 이러한 인과관계의 귀착은 <mark>종종 잘못되기도 한다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>어떻게 잘못되는지: 원인을 하나로만 보는 게 문제예요</span></div><div class=\"ck-step\"><span class=\"lab\">7번 · 원인은 하나가 아님</span><div class=\"en\">and for some things that happen, <mark>there is no single cause</mark>.</div><p class=\"ko\">그리고 발생하는 어떤 일에 대해서는, <mark>단 하나의 원인만 있는 게 아니다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>하나가 아니면 무엇인지: 여러 사건이 모두 결과에 기여해요</span></div><div class=\"ck-step key\"><span class=\"lab\">8번 앞부분 · 결정적 단서</span><div class=\"en\">Rather, there is a complex chain of events <mark>that all contribute to the result</mark>;</div><p class=\"ko\">오히려, <mark>그 결과에 모두 원인이 되는</mark> 복잡한 일련의 사건들이 있다;</p></div><div class=\"ck-via\"><i>▼</i><span>모두가 기여했는데 하나가 빠져도 결과가 비슷하다? 방향이 거꾸로예요</span></div><div class=\"ck-step\"><span class=\"lab\">문제지 ⑤번 자리 (8번 뒷부분)</span><div class=\"en\">if any one of the events would not have occurred, the result would be <u>⑤ similar</u>.</div><p class=\"ko\">사건들 중 어느 하나라도 발생하지 않았었다면, 그 결과는 ( 비슷할? ) 것이다 → 다를 것이 맞아요</p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">similar(비슷한) ↔ different(다른)</p><p class=\"gr\">결과에 모든 원인이 기여했다면, 원인 하나가 빠지면 결과는 different(다른)가 돼요. 아무 영향이 없을 때만 similar(비슷한)를 써요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>Without the sugar, the cake would taste different.</div><div class=\"ko\">설탕이 없으면 케이크 맛이 달라질 것이다. (재료가 빠지면 결과가 달라짐)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>Without the sugar, the cake would taste similar.</div><div class=\"ko\">설탕이 맛에 기여했는데 빠져도 비슷하다? 방향이 거꾸로라 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>Every player helped us win, so without one, the game would be different.</div><div class=\"ko\">모든 선수가 승리를 도왔으니, 한 명만 빠져도 경기는 달라졌을 것이다.</div></div><p class=\"gb\">지문 8번도 모든 사건이 all contribute to the result(모두 결과에 기여한다)라고 했으니, 하나가 빠지면 결과는 similar(비슷한)가 아니라 different(다른)여야 해요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">similar → different (다른)<small>모든 사건이 결과에 기여하니, 하나라도 빠지면 결과는 different(다른)여야 해요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">wrong 잘못된</span><span class=\"why\">부정적인 말이라 어색해 보이지만, 6번 often mistaken(종종 잘못된)을 7번이 이어받아 잘못된 원인을 짚는다는 뜻이에요. 방향이 같아서 wrong(잘못된)이 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">persuasive 설득력 있는</span><span class=\"why\">1번에서 사람은 원인을 찾고 이야기를 만들려는 경향이 있다고 했어요. 그래서 이야기가 잘 통한다는 2번은 persuasive(설득력 있는)가 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">generalizations 일반화</span><span class=\"why\">4번은 경험과 남의 이야기로부터 사람들이 행동하는 방식을 정리한다는 말이라 generalizations(일반화)가 맞아요. 3번 이야기가 사례를 준다는 흐름과 이어져요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">pairings 짝짓기, 연결</span><span class=\"why\">5번 앞부분에서 원인을 사건에 연결한다고 했으니, 원인과 결과를 짝지은 cause-and-effect pairings(원인과 결과의 쌍)가 맞아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">People are innately inclined</div><div class=\"k\">사람들은 선천적으로 ~하는 경향이 있다</div></div><div class=\"rc\"><div class=\"e\">to look for causes of events,</div><div class=\"k\">사건의 원인을 찾는,</div></div><div class=\"rc\"><div class=\"e\">to form explanations and stories.</div><div class=\"k\">즉, 설명과 이야기를 구성하려는.</div></div><div class=\"rnat\">사람들은 선천적으로 사건의 원인을 찾는, 즉, 설명과 이야기를 구성하려는 경향이 있다.</div><div class=\"rst\">반 대항 축구에서 지면 우리는 바로 “왜 졌지?” 하고 원인을 찾아요. 지문 1번도 사람은 원인을 찾고 이야기를 만들려 한다고 해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">That is one reason</div><div class=\"k\">그것(= 원인을 찾고 이야기를 구성하려는 경향)이 한 가지 이유이다</div></div><div class=\"rc\"><div class=\"e\">storytelling is such a persuasive medium.</div><div class=\"k\">스토리텔링이 그토록 설득력 있는 수단인.</div></div><div class=\"rnat\">그것이 스토리텔링이 그토록 설득력 있는 수단인 한 가지 이유이다.</div><div class=\"rst\">그래서 “골키퍼가 넘어져서 졌대” 같은 이야기가 쏙쏙 들어와요. 지문 2번도 그래서 이야기가 <b>설득력 있는</b>(persuasive) 수단이라고 해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Stories resonate with our experiences</div><div class=\"k\">이야기는 우리의 경험을 떠올리게 하고</div></div><div class=\"rc\"><div class=\"e\">and provide examples of new instances.</div><div class=\"k\">새로운 경우의 사례를 제공한다.</div></div><div class=\"rnat\">이야기는 우리의 경험을 떠올리게 하고 새로운 경우의 사례를 제공한다.</div><div class=\"rst\">그런 이야기는 “나도 그랬지” 하고 내 경험이 떠오르게 해요. 지문 3번도 이야기가 경험을 떠올리게 하고 새 사례를 준다고 해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">From our experiences and the stories of others</div><div class=\"k\">우리의 경험과 다른 이들의 이야기로부터</div></div><div class=\"rc\"><div class=\"e\">we tend to form generalizations</div><div class=\"k\">우리는 일반화하는 경향이 있다</div></div><div class=\"rc\"><div class=\"e\">about the way people behave and things work.</div><div class=\"k\">사람들이 행동하고 상황이 작동하는 방식에 관해.</div></div><div class=\"rnat\">우리의 경험과 다른 이들의 이야기로부터 우리는 사람들이 행동하고 상황이 작동하는 방식에 관해 일반화하는 경향이 있다.</div><div class=\"rst\">그러다 “골키퍼가 실수하면 진다”는 법칙을 만들어요. 지문 4번의 <b>일반화</b>(generalizations)가 바로 이거예요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">We attribute causes to events,</div><div class=\"k\">우리는 원인을 사건에 귀착시키고,</div></div><div class=\"rc\"><div class=\"e\">and as long as these cause-and-effect pairings make sense,</div><div class=\"k\">이러한 원인과 결과의 쌍이 이치에 맞는 한,</div></div><div class=\"rc\"><div class=\"e\">we use them for understanding future events.</div><div class=\"k\">우리는 그것들(= 원인과 결과의 쌍)을 미래의 사건을 이해하는 데 사용한다.</div></div><div class=\"rnat\">우리는 원인을 사건에 귀착시키고, 이러한 원인과 결과의 쌍이 이치에 맞는 한, 그것들을 미래의 사건을 이해하는 데 사용한다.</div><div class=\"rst\">골키퍼 실수 → 패배를 짝지어 두고 다음 경기도 그걸로 예상해요. 지문 5번의 <b>원인과 결과의 쌍</b>(pairings)이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Yet</span> these causal attributions</div><div class=\"k\"><span class=\"cw\">하지만</span> 이러한 인과관계의 귀착은</div></div><div class=\"rc\"><div class=\"e\">are often mistaken.</div><div class=\"k\">종종 잘못되기도 한다.</div></div><div class=\"rnat\">하지만 이러한 인과관계의 귀착은 종종 잘못되기도 한다.</div><div class=\"rst\"><b>하지만</b>(Yet) 이런 원인 찾기는 자주 틀려요. 지문 6번에서 글의 방향이 꺾여요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Sometimes they implicate the wrong causes,</div><div class=\"k\">때때로 그것들(= 인과관계의 귀착)은 잘못된 원인을 연관시키기도 하고,</div></div><div class=\"rc\"><div class=\"e\">and for some things that happen,</div><div class=\"k\">그리고 발생하는 어떤 일에 대해서는,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">there is no single cause.</span></div><div class=\"k\"><span class=\"cw\">단 하나의 원인만 있는 게 아니다.</span></div></div><div class=\"rnat\">때때로 그것들은 잘못된 원인을 연관시키기도 하고, 발생하는 어떤 일에 대해서는, 단 하나의 원인만 있는 게 아니다.</div><div class=\"rst\">엉뚱한 사람을 탓하기도 하고, 사실 진 이유가 하나만 있는 것도 아니에요. 지문 7번이 <b>잘못된</b>(wrong) 원인을 말해요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc\"><div class=\"e\">Rather, there is a complex chain of events</div><div class=\"k\">오히려, 복잡한 일련의 사건들이 있다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">that all contribute to the result;</span></div><div class=\"k\"><span class=\"cw\">그 결과에 모두 원인이 되는;</span></div></div><div class=\"rc\"><div class=\"e\">if any one of the events would not have occurred,</div><div class=\"k\">만일 사건들 중 어느 하나라도 발생하지 않았었다면,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">the result would be different.</span></div><div class=\"k\"><span class=\"cw\">그 결과는 다를 것이다.</span> ※ 문제지엔 similar로 되어 있음</div></div><div class=\"rnat\">오히려, 그 결과에 모두 원인이 되는 복잡한 일련의 사건들이 있다. (즉,) 만일 사건들 중 어느 하나라도 발생하지 않았었다면, 그 결과는 유사할(→ 다를) 것이다.</div><div class=\"rst\">패스 실수, 체력, 젖은 운동장이 <b>모두</b> 패배를 만들었으니 하나만 빠져도 결과는 <b>달라져요</b>. = 지문 8번, 그래서 similar(비슷한)는 틀려요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">But even when there is no single causal act,</div><div class=\"k\">하지만 원인이 되는 행동이 단 하나만 있지 않을 때조차도,</div></div><div class=\"rc\"><div class=\"e\">that doesn’t stop people</div><div class=\"k\">그것이 사람들로 하여금 막지는 못한다</div></div><div class=\"rc\"><div class=\"e\">from assigning one.</div><div class=\"k\">하나(= 하나의 원인이 되는 행동)의 탓으로 돌리는 것을.</div></div><div class=\"rnat\">하지만 원인이 되는 행동이 단 하나만 있지 않을 때조차도, 그것이 사람들로 하여금 하나의 (원인이 되는 행동의) 탓으로 돌리는 것을 막지는 못한다.</div><div class=\"rst\">그래도 우리는 “다 골키퍼 탓이야” 하고 하나로 몰아요. 지문 9번도 원인이 하나가 아니어도 사람들은 하나를 갖다 붙인다고 해요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"innately\" data-m=\"선천적으로\"><b>innately</b>선천적으로</button><button type=\"button\" class=\"wdb\" data-w=\"resonate with\" data-m=\"~와 통하다\"><b>resonate with</b>~와 통하다</button><button type=\"button\" class=\"wdb\" data-w=\"generalization\" data-m=\"일반화\"><b>generalization</b>일반화</button><button type=\"button\" class=\"wdb\" data-w=\"causal attribution\" data-m=\"인과 귀인\"><b>causal attribution</b>인과 귀인</button><button type=\"button\" class=\"wdb\" data-w=\"implicate\" data-m=\"연관시키다\"><b>implicate</b>연관시키다</button><button type=\"button\" class=\"wdb\" data-w=\"chain of events\" data-m=\"연쇄적 사건\"><b>chain of events</b>연쇄적 사건</button></div>"};
document.addEventListener('click',function(e){
 var b=e.target.closest('.stbtn');
 if(b){var box=b.closest('.rdb'),on=!box.classList.contains('story');box.classList.toggle('story',on);
  var L=[].slice.call(box.querySelectorAll('.rds'));L.forEach(function(x){x.classList.remove('lastv');x.style.order='';});
  if(on){L.sort(function(a,c){return (+a.dataset.ord)-(+c.dataset.ord);});L.forEach(function(x,i){x.style.order=i+1;});L[L.length-1].classList.add('lastv');}
  b.textContent=on?'문장별로 보기':'이야기로 이어 읽기';return;}
 var w=e.target.closest('.wdb');
 if(w){var on2=!w.classList.contains('on');w.classList.toggle('on',on2);
  try{if(window.WN){if(on2)WN.add([{w:w.dataset.w,m:w.dataset.m,src:'미니모고',how:'별표',ask:true}]);else if(WN.del)WN.del(w.dataset.w,'미니모고');}}catch(err){}
  var t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s';document.body.appendChild(t);}
  t.textContent=on2?'오답노트장에 담았어요':'오답노트장에서 뺐어요';t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(function(){t.style.opacity='0'},1600);}
});

/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  if(EXP[cq.q]){h+=EXP[cq.q]+'<button class="toq" data-i="'+i+'">빠른 정답으로</button>';return h+'</div></details>';}
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
  mmInit();
}
/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(S.sub&&!S.mmS){S.mmS=1;S.mmP=1;save();WN.hw(lv,day,S.sub.s+'/'+N+(S.mmD?' ✓':''));}else if(!S.sub&&!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
