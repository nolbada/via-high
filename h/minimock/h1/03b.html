<style>

<body>
<div id="app"></div>
<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:Canvas;color:CanvasText;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';
    document.body.appendChild(d);
    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');
    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';
      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();
  }

var D=[{"no": "07", "typ": "빈칸 추론", "src": "2017년 11월 32번", "evn": [1, 2, 5, 7], "ev_en": "Music connects people to one another not only through a shared interest or hobby, but also through emotional connections to particular songs, communities, and artists. / The significance of others in the search for the self is meaningful; / For music fans, the genres, artists, and songs in which people find meaning, thus, function as potential “places” through which one’s identity can be positioned in relation to others: / The connections made through shared musical passions provide a sense of safety and security in the notion that there are groups of similar people who can provide the feeling of a community.", "ev_ko": [[1, "음악은 공유된 관심사나 취미를 통해서뿐만 아니라, 특정한 노래, 공동체, 아티스트에 대한 정서적 연결을 통해서도 사람들을 서로 이어 준다."], [2, "자기 자신을 찾아가는 과정에서 다른 사람들의 중요성은 의미가 있다."], [5, "그러므로 음악 팬들에게, 사람들이 그 속에서 의미를 찾는 장르, 아티스트, 노래는 자신의 정체성이 다른 사람들과의 관계 속에서 자리 잡힐 수 있는 잠재적인 '장소'로서 기능한다."], [7, "공유된 음악적 열정을 통해 만들어진 연결은, <b>공동체의 느낌<\/b>을 제공해 줄 수 있는 비슷한 사람들의 집단이 있다는 점에서 안정감과 안도감을 준다."]], "why": ["빈칸은 <b>groups of similar people who can provide ______<\/b>의 끝에 있습니다", "비슷한 사람들의 집단이 줄 수 있는 것이 무엇인지 찾으면 됩니다", "(1)에서 음악은 <b>communities<\/b>(공동체)를 통해서도 사람들을 이어 준다고 했습니다", "(2)는 자기 자신을 찾을 때 <b>다른 사람들<\/b>이 중요하다고 하고, (3)·(5)는 정체성이 <b>타인과의 관계 속에서<\/b> 자리 잡는다는 내용입니다", "(7)은 그런 연결이 안정감과 안도감을 준다는 결론입니다", "그러니 빈칸에는 <b>공동체의 느낌<\/b>이 들어가야 앞뒤가 이어집니다."], "ch": [{"n": "①", "t": "the foundation for social reform", "g": "사회 개혁의 토대", "ok": false, "e": ["사회를 바꾸자는 이야기가 아닙니다", "reform(개혁)이라는 말이 지문에 없습니다."]}, {"n": "②", "t": "the feedback for pop culture", "g": "대중문화에 대한 피드백", "ok": false, "e": ["popular music이라는 말은 나옵니다", "하지만 팬들이 대중문화에 의견을 준다는 내용은 없습니다."]}, {"n": "③", "t": "the feeling of a community", "g": "공동체의 느낌", "ok": true, "e": ["(1)의 communities, (3)·(5)의 in relation to others(타인과의 관계 속에서)가 모두 '공동체'라는 느낌으로 모입니다", "빈칸 앞의 groups of similar people(비슷한 사람들의 집단)과도 자연스럽게 이어집니다."]}, {"n": "④", "t": "the access to traditional songs", "g" \u0002 / \u0001그들이 사랑하는 것에\u0002 / 그리고 \u0001그들이 되고자 열망하는 것에\u0002", "core": "그것은 접근을 제공한다.", "tags": ["주어 It + 동사 provides + 목적어 access", "to what people need = 전치사구(형용사구): access를 꾸밈. <b>to는 전치사</b>, what절은 to의 목적어 [기준: 모양 규칙]", "병렬 둘째: (to) what they love = access를 꾸밈", "병렬 셋째: what they aspire to become = access를 꾸밈, become의 보어가 빠진 what절"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이고, 뒤에 <b>what절 세 개</b>가 이어져 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: It (= The transportation industry, 운송 산업)", "V: provides (provide 제공하다의 3인칭 단수형)", "O: access (접근)", "뼈대 = <b>It provides access</b>"]}, {"t": "<b>to what people need, what they love, and what they aspire to become</b>는 access를 꾸미는 전치사구(형용사구)다. access to (~에 대한 접근)의 <b>to는 전치사</b>라서 뒤에 명사 덩어리가 온다."}, {"t": "to의 목적어가 <b>what절 세 개</b>이고 and로 병렬된다. what = ~하는 것.", "sub": ["what people need (사람들이 필요로 하는 것)", "what they love (그들이 사랑하는 것)", "what they aspire to become (그들이 되기를 열망하는 것). aspire (열망하다)"]}, {"t": "함정: 세 what절 모두 뒤가 불완전하다. need의 목적어, love의 목적어, become의 보어가 what 안에 들어가 있기 때문이다. aspire to become의 to는 전치사가 아니라 to부정사의 to다."}], "sum": "운송 산업, 필요한 것·사랑하는 것·되고 싶은 것에 접근하게 해 줌"}, {"i": "05", "q": "09", "s": "C-2", "title": "S+V+C(2형식) + 이유의 as절(과거완료)", "eng": "This finding<sup>1</sup> was not new, / as humans had observed<sup>2</sup> the rainbow / since the beginning of time<sup>3</sup>.", "notes": [["1", "finding", "발견(된 사실)"], ["2", "observe", "관찰하다"], ["3", "since the beginning of time", "태초부터"]], "lit": "이 발견은 새로운 것이 아니었다 / 인간이 무지개를 관찰해 왔기 때문에 / 태초부터", "nat": "이 발견 자체는 새로울 것이 없었다. 사람들은 아주 오래전부터 무지개를 보아 왔으니까.", "ana": "여기서 <b>as</b>는 '~하면서'도 '~처럼'도 아닌 <b>이유(= because)</b>입니다. 앞이 결과, 뒤가 원인으로 이어지면 이유로 읽으세요. <b>had observed</b>는 was(과거)보다 <b>더 앞선 시점</b>부터 이어져 온 일을 나타내는 과거완료이고, <b>since the beginning of time</b>이 그 기간을 받쳐 줍니다. <b>finding</b>은 '찾는 것'이 아니라 <b>'발견된 사실'</b>이라는 명사입니다.", "pe": "This finding<sup>1</sup> was not new, / \u0001as humans had observed<sup>2</sup> the rainbow\u0002 / \u0001since the beginning of time here\u0002.", "pk": "\u0001버스 정류장까지\u0002 걸어가는 것은 / \u0001적어도\u0002 약간의 움직임을 제공하곤 했다 / 그러나 \u0001지금은\u0002 대부분의 대중교통이 제한적이다 / 그래서 \u0001교외\u0002 사람들은 \u0001어디든\u0002 차로 다닌다", "core": "걸어가는 것은 약간의 움직임을 제공하곤 했고, 대중교통은 제한적이며, 사람들은 운전한다.", "tags": ["<b>동명사구 주어</b>: Walking(동명사). to the bus stop = 전치사구(부사구): Walking을 꾸밈", "동사 used to provide + 목적어 movement. at least = 부사구: some을 꾸밈", "but now: 접속사 but + now(부사: 문장 꾸밈). most public transportation is limited(SVC)", "<b>so</b>(결과) + 주어 people + 동사 drive. suburban = 형용사: people 꾸밈, everywhere = 부사: drive 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식) + but절(수동태 1형식) + so절(1형식)</b>의 세 덩어리다. 접속사로 이어진 세 절이라 길어 보인다."}, {"t": "첫 절의 뼈대부터 찾는다.", "sub": ["S: Walking to the bus stop (버스 정류장까지 걸어가는 것, 동명사구, 단수 취급)", "V: used to provide (used to ~하곤 했다 + provide 제공하다. 동사 덩어리)", "O: at least some movement (적어도 약간의 움직임)", "뼈대 = <b>Walking used to provide movement</b>"]}, {"t": "함정: Walking을 진행형으로 읽으면 used to가 갈 곳을 잃는다. Walking은 주어 자리의 동명사이고, used to + 동사원형은 '(지금은 아니지만) 예전에는 ~했다'라는 뜻이다."}, {"t": "<b>but now most public transportation is limited</b>는 두 번째 절이다.", "sub": ["S: most public transportation (대부분의 대중교통)", "V: is limited (limit 제한하다의 수동태 = 제한되어 있다)", "수동태 주절은 1형식으로 본다(문형 기준).", "now (지금은)는 부사"]}, {"t": "<b>so suburban people drive everywhere</b>는 결과를 나타내는 세 번째 절이다.", "sub": ["S: suburban people (교외 사람들). suburban 교외의", "V: drive (drive 운전하다)", "everywhere (어디든)는 부사", "so = 그래서 (결과)"]}], "sum": "예전엔 정류장까지 걷는 움직임이 있었으나, 지금은 대중교통이 부족해 교외 사람들은 어디든 운전"}, {"i": "07", "q": "11", "s": "A-1", "title": "S+V+IO+DO(4형식) + 동격 + if절 안의 whether절", "eng": "I asked Kenichi Ohmae, / a global management consultant<sup>1</sup>, / if he could sense<sup>2</sup> / whether<sup>3</sup> a company was going to be successful.", "notes": [["1", "consultant", "컨설턴트, 자문가"], ["2", "sense", "감지하다"], ["3", "whether", "~인지 아닌지"]], "lit": "나는 Kenichi Ohmae에게 물었다 / 세계적인 경영 컨설턴트인 / 그가 감지할 수 있는지를 / 한 회사가 성공할 것인지 아닌지를", "nat": "세계적인 경영 컨설턴트인 Kenichi Ohmae에게, 어떤 회사가 성공할지 아닐지를 하다, 암시하다"]], "lit": "무언가가 있었는가 / 그가 냄새 맡거나 감지할 수 있는 / 그가 어떤 조직 안에 있을 때 / 이 회사가 승자가 될 것임을 시사해 주는", "nat": "어떤 조직에 들어갔을 때, 이 회사는 잘될 회사라고 알려 주는, 냄새 맡듯 감지할 수 있는 무언가가 있었을까?", "ana": "something과 he 사이에 <b>목적격 관계대명사(that/which)가 생략</b>돼 있습니다. '명사 + 주어 + 동사'가 붙어 나오면 생략을 의심하세요. 뒤의 <b>that suggested ~</b>도 something을 꾸미는 관계절인데, 사이에 when절이 끼어 있어 <b>선행사와 멀리 떨어져</b> 있습니다. 관계절이 항상 선행사 바로 뒤에 붙는 것은 아닙니다. suggested 뒤에는 <b>접속사 that이 생략</b>돼 있습니다.", "pe": "Was there something / \u0001he could smell<sup>1</sup> or sense\u0002 / \u0001when he was in an organization<sup>2</sup>\u0002 / \u0001that suggested<sup>3</sup> this company was going to be a winner\u0002?", "pk": "무언가가 있었는가 / \u0001그가 냄새 맡거나 감지할 수 있는\u0002 / \u0001그가 어떤 조직 안에 있을 때\u0002 / \u0001이 회사가 승자가 될 것임을 시사해 주는\u0002", "core": "무언가가 있었는가?", "tags": ["there 구문 의문문: Was there something(주어). 동사 Was가 앞으로 나옴", "관계절(형용사절, 목적격 관계사 <b>생략</b>): something을 꾸밈", "when절 = 부사절(시간): smell or sense를 꾸밈", "that절 = 관계절(형용사절): something을 꾸밈 (선행사와 떨어짐). suggested 뒤 접속사 that 생략"], "steps": [{"t": "이 문장은 <b>there 구문의 의문문(1형식)</b>이다. 뒤에 수식어가 줄줄이 붙어 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["V: Was (be의 과거형, 의문문이라 앞으로 나옴)", "S: something (무언가)", "뼈대 = <b>Was there something?</b> (무언가가 있었는가)"]}, {"t": "<b>he could smell or sense</b>는 something을 꾸미는 <b>관계절</b>이다. something과 he 사이에 목적격 관계대명사가 <b>생략</b>돼 있다.", "sub": ["S: he (그)", "V: could smell or sense (smell 냄새로 알아채다, sense 감지하다. 병렬)", "O: 생략된 관계대명사 = something"]}, {"t": "<b>when he was in an organization</b>은 <b>부사절(시간)</b>이다. 'in an organization (조직 안에) 있을 때'라는 뜻이고, 빼도 문장이 완결되므로 부사절이다."}, {"t": "<b>that suggested this company was going to be a winner</b>는 something을 꾸미는 두 번째 관계절이다.", "sub": ["S: that (= something)", "V: suggested (suggest 시사하다의 과거형)", "O: this company was going to be a winner (이 회사가 승자가 될 것이라는 것). suggested 뒤 접속사 that이 생략됨"]}, {"t": "함정: 이 관계절은 something과 사이에 when절이 끼어 멀리 떨어져 있다. 관계절이 항상 선행사 바로 뒤에 오는 것은 아니다."}], "sum": "조직 안에서 이 회사가 승자임을 알려 주는 감지할 만한 무언가가 있었는지 질문"}], "qs": [{"q": "07", "type": "빈칸 추론", "src": "2017년 11월 32번", "ans": "③", "tr": [["1", "음악은 공유된 관심사나 취미를 통해서만이 아니라, 특정한 노래와 공동체, 아티스트에 대한 정서적 유대를 통해서도 사람들을 서로 이어 준다."], ["2", "자아를 찾는 과정에서 타인이 차지하는 비중은 크다. 사회학 교수 Agger의 말대로 \"정체성은 대체로 사회적 산물이며, 타인과의 관계, 그리고 그들이 우리를 어떻게 본다고 우리가 생각하는지 속에서 만들어진다.\""], ["3", "그리고 사회음악학자 Frith는 대중음악에 바로 그런 연결이 있다고 주장한다."], ["4", "음악 팬에게 장르와 아티스트와 노래는 의미를 발견하는 대상이고, 그래서 자기 정체성을 타인과의 관계 속에 놓아 볼 수 있는 잠재적 '장소'로 기능한다. 말하자면 정체성의 적어도 일부를 붙들어 매는 사슬 노릇을 하는 것이다."], ["5", "공유된 음악적 열정을 통해 맺어진 유대는, 나와 비슷한 사람들의 무리가 있어서 그들이 공동체라는 느낌을 줄 수 있다는 생각 속에서 안전함과 안심을 준다."]], "evh": "1 · 5번 문장", "ev": [{"en": true, "h": "Music connects people to one another ... through emotional connections to particular songs, communities, and artists. / there are groups of similar people who can provide ______"}, {"en": false, "h": "빈칸 문장의 주어는 <b>groups of similar people</b>(나와 비슷한 사람들의 무리)입니다. 무리가 줄 수 있는 것이 답입니다. 1번에서 이미 <b>communities</b>가 음악이 이어 주는 대상으로 나왔고, 2·4번은 <b>타인과의 관계 속에서 정체성이 만들어진다</b>는 이야기입니다. 그러니 빈칸에는 <b>공동체 소속감</b>이 들어가야 앞뒤가 하나로 이어집니다."}], "opts": [{"n": "①", "t": "the foundation for social reform (사회 개혁의 토대)", "a": false, "x": true, "trap": false, "e": "사회를 바꾸자는 이야기가 아닙니다. 개혁(reform)이라는 개념 자체가 지문에 없습니다."}, {"n": "②", "t": "the feedback for pop culture (대중문화에 대한 피드백)", "a": false, "x": true, "trap": false, "e": "popular music이라는 말 때문에 눈에 걸리지만, 팬들이 <b>평가·피드백</b>을 한다는 내용은 없습니다."}, {"n": "③", "t": "the feeling of a community (공동체라는 느낌)", "a": true, "x": false, "trap": false, "e": "1번의 communities, 2·4번의 in relation to others가 모두 이 한 마디로 모입니다."}, {"n": "④", "t": "the access to traditional songs (전통 음악에 대한 접근)", "a": false, "x": true, "trap": true, "e": "전통 음악은 언급조차 없습니다. 이 글의 음악은 <b>popular music</b>입니다."}, {"n": "⑤", "t": "the solution for copyright issues (저작권 문제의 해결책)", "a": false, "x": true, "trap": false, "e": "저작권 이야기는 한 줄도 없습니다. 음악이라는 소재만 보고 고르면 안 됩니다."}], "w": [["connect A to B", "A를 B와 연결하다"], ["significance", "중요성"], ["in relation to", "~와의 관계 속에서"], ["largely", "대체로"], ["function as", "~로 기능하다"], ["potential", "잠재적인"], ["position", "자리매김하다"], ["hold A in place", "A를 제자리에 붙들다"], ["notion", "생각, 개념"], ["security", "안심, 안전"]]}, {"q": "08", "type": "빈칸 추론", "src": "2020년 11월 31번", "ans": "②", "tr": [["1", "인간의 정신에 이동할 수 있어야 한다는 욕구보다 더 근본적인 것은 없다."], ["2", "그것은 우리의 상상력에 불을 붙이고 인생을 바꿀 기회로 가는 길을 열어 주는 직관적인 힘이다."], ["3", "그것은 발전과 개인의 자유를 이끄는 촉매다."], ["4", "대중교통은 200년 넘게 그 발전과 자유에 없어서는 안 될 존재였다."], ["5", "운송 산업은 늘 사람을 이곳에서 저곳으로 실어 나르는 것 이상의 일을 해 왔다."], ["6", "그것은 사람과 장소와 가능성을 이어 준다."], ["7", "대중교통은 사람들이 필요로 하는 것, 사랑하는 것, 그리고 되고 싶어 하는 것에 닿을 수 있게 해 준다."], ["8", "그렇게 함으로써 공동체를 키우고, 일자리를 만들고, 경제를 튼튼하게 하고, 사회적·상업적 연결망을 넓히고, 시간과 에너지를 아끼고, 수백만 명이 더 나은 삶을 이루도록 돕는다."]], "evh": "4 · 5 · 6번 문장", "ev": [{"en": true, "h": "Public transportation has been vital to that progress and freedom for more than two centuries. / The transportation industry has always done more than carry travelers from one destination to another. / It connects people, places, and possibilities."}, {"en": false, "h": "빈칸 문장의 <b>It</b>이 2·3번에서 그대로 이어지고, 4번부터는 그것이 <b>public transportation</b>(대중교통)으로 구체화됩니다. 즉 이 글은 처음부터 끝까지 <b>'옮겨 다닐 수 있다는 것'</b>에 관한 글입니다. 빈칸에는 <b>이동할 수 있는</b>이 들어가야 뒤의 교통 이야기가 전부 이어집니다. 빈칸이 1번 문장에 있을 때는 <b>2~3번 문장의 대명사</b>를 따라가는 것이 가장 빠릅니다."}], "opts": [{"n": "①", "t": "secure (안전한)", "a": false, "x": true, "trap": false, "e": "안전은 교통의 조건일 뿐 이 글의 주제가 아닙니다. 안전해지려고 대중교통이 있다는 말은 나오지 않습니다."}, {"n": "②", "t": "mobile (이동할 수 있는)", "a": true, "x": false, "trap": false, "e": "4번부터 끝까지 이어지는 public transportation 이야기가 전부 이 한 단어를 설명합니다."}, {"n": "③", "t": "exceptional (특출한)", "a": false, "x": true, "trap": false, "e": "남보다 뛰어나야 한다는 이야기가 아닙니다. 지문에 비교 대상 자체가 없습니다."}, {"n": "④", "t": "competitive (경쟁력 있는)", "a": false, "x": true, "trap": true, "e": "8번의 creates jobs, strengthens the economy 때문에 경제가 눈에 걸리지만, 그것은 <b>이동이 낳는 결과</b>이지 욕구 자체가 아닙니다."}, {"n": "⑤", "t": "independent (독립적인)", "a": false, "x": true, "trap": false, "e": "3번의 personal freedom 때문에 그럴듯해 보입니다. 그러나 그 자유는 <b>돌아다닐 수 있어서</b> 생기는 것이라, 빈칸에는 원인인 mobile이 들어가야 합니다."}], "w": [["fundamental", "근본적인"], ["intuitive", "직관적인"], ["spark", "불러일으키다"], ["catalyst", "촉매, 기폭제"], ["be vital to", "~에 필수적이다"], ["destination", "목적지"], ["provide access to", "~에 대한 접근을 제공하다"], ["aspire to", "~하기를 열망하다"], ["in so doing", "그렇게 함으로써"], ["strengthen", "강화하다"]]}, {"q": "09", "type": "글의 순서", "src": "2018년 6월 36번", "ans": "③", "tr": [["1", "(주어진 글) 색의 물리적 특성에 대한 과학적 연구는 Isaac Newton까지 거슬러 올라간다."], ["2", "(B) 어느 날 그는 큰 지역 축제에서 프리즘 한 세트를 발견했다. 그는 그것들을 집으로 가져와 실험을 시작했다. 캄캄하게 만든 방에서 그는 가느다란 햇빛 한 줄기가 삼각형 유리 프리즘에 떨어지게 했다."], ["3", "(C) 그 흰 광선이 프리즘에 닿자마자, 그것은 우리에게 익숙한 무지개 색들로 나뉘었다. 이 발견 자체는 새로울 것이 없었다. 사람들은 아주 오래전부터 무지개를 보아 왔으니까."], ["4", "(A) Newton이 그 스펙트럼의 경로에 두 번째 프리즘을 놓았을 때에야 비로소 그는 새로운 것을 발견했다. 합성된 색들이 하나의 백색 광선을 만들어 낸 것이다. 그리하여 그는 백색광이 스펙트럼 색들을 합쳐서 만들어질 수 있다고 결론지었다."]], "evh": "(B) 첫 문장 → (C) 첫 문장 → (A) 첫 문장", "ev": [{"en": true, "h": "One day, he spotted a set of prisms ... / As soon as the white ray hit the prism, it separated ... / It was only when Newton placed a second prism ..."}, {"en": false, "h": "순서 문제는 <b>사건의 시간표</b>를 그리면 끝납니다. 주어진 글은 '뉴턴부터 시작한다'는 소개뿐이니, <b>프리즘을 손에 넣는 장면(B)</b>이 먼저입니다. (C)의 <b>the white ray hit the prism</b>은 (B) 마지막의 <b>a thin ray of sunlight ... on a triangular glass prism</b>을 그대로 받습니다. (A)의 <b>a second prism</b>은 '두 번째'라는 말 자체가 첫 번째 프리즘 실험이 이미 있었음을 알려 주므로 마지막입니다."}], "opts": [{"n": "①", "t": "(A) – (C) – (B)", "a": false, "x": true, "trap": false, "e": "(A)의 a second prism이 맨 앞에 올 수 없습니다. 첫 번째 프리즘 실험이 아직 안 나왔습니다."}, {"n": "②", "t": "(B) – (A) – (C)", "a": false, "x": true, "trap": false, "e": "(A)에서 이미 결론까지 냈는데 (C)에서 다시 '이 발견은 새롭지 않았다'로 돌아가면 이야기가 거꾸로 흐릅니다."}, {"n": "③", "t": "(B) – (C) – (A)", "a": true, "x": false, "trap": false, "e": "프리즘 입수·실험(B) → 무지개로 갈라짐, 그런데 새롭지 않음(C) → 두 번째 프리즘으로 진짜 발견(A)."}, {"n": "④", "t": "(C) – (A) – (B)", "a": false, "x": true, "trap": false, "e": "(C)의 the white ray는 앞에 프리즘에 빛을 쏘는 장면이 있어야 나올 수 있습니다. 맨 앞에 못 옵니다."}, {"n": "⑤", "t": "(C) – (B) – (A)",     const i=+b.dataset.i,p=b.dataset.p;

    const c=S.checks[WS.id][i]=S.checks[WS.id][i]||{};
    c[p]=c[p]?0:1;save();
    if(c[p]){const ww=WS.words[i],x=p==='m'?[ww.w,ww.m]:p==='s'?ww.s:ww.a;if(x&&x[0]&&x[1])WN.add([{w:x[0],m:x[1],src:'미니모고',how:'별표',ask:true}]);}
    b.classList.toggle('bad',!!c[p]);
    if(c[p]){let t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s';document.body.appendChild(t);}t.textContent='오답노트장에 담았어요';t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(()=>{t.style.opacity='0'},1400);}
  });
  const lk=$('#lock');if(lk)lk.onclick=()=>{
    if(armed==='lock'){S.locked[WS.id]=1;armed=null;save();
      recSend({type:'word',marks:noteList().map(it=>({w:it.w.w,parts:it.parts}))});}
    else armed='lock';
    render();
  };
}
function renderNote(){
  const list=noteList();
  let h=`<header><div class="wrap hd2"><h1>단어 오답노트 <span class="meta">${list.length}개</span></h1><button class="link" id="back">확인표</button></div></header><div class="wrap">`;
  if(!list.length)h+=`<div class="empty">아직 표시한 단어가 없습니다</div>`;
  list.forEach(it=>{
    const w=it.w,r=(S.res[WS.id]||{})[it.i]||{};
    h+=`<div class="note-item"><span class="w">${esc(w.w)}</span><span class="meta">${esc(w.src)}번</span>`;
    const row=(p,tag,txt,ko)=>{
      const bad=it.parts.includes(p);
      const rs=r[p]===1?'<span class="res o">맞춤</span>':r[p]===0?'<span class="res x">틀림</span>':'';
      return `<div class="part ${p} ${bad?'bad':''}"><span class="tag">${tag}</span><span>${esc(txt)}${ko?`<span class="ko"> ${esc(ko)}</span>`:''}</span>${bad?rs:''}</div>`;
    };
    h+=row('m','뜻',w.m,'');
    if(w.s)h+=row('s','유',w.s[0],w.s[1]);
    if(w.a)h+=row('a','반',w.a[0],w.a[1]);
    h+=`</div>`;
  });
  h+=`</div><div class="bar"><div class="wrap"><button class="btn" id="back2">확인표</button><button class="btn pri" id="start" ${list.length?'':'disabled'}>복습 시작</button></div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='word';armed=null;render();};
  $('#back2').onclick=()=>{view='word';render();};
  $('#start').onclick=()=>{quiz={qs:buildQuestions(),n:0,right:0,done:false,shown:false};view='quiz';render();};
}
function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
/* ---- 답 제출 ---- */
function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});try{var _m=String(FILE).match(/^(\d\d)([ab])$/);if(_m&&window.WN)WN.hw('미니모고 '+(GCODE==='h2'?'고2':'고1'),(+_m[1])*2-(_m[2]==='a'?1:0),s+'/'+N);}catch(e){}
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}
/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
  mmInit();
}
/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
