<style>

<body>
<div id="app"></div>
<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:Canvas;color:CanvasText;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';
    document.body.appendChild(d);
    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');
    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';
      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();
  }

}
function noteList(){
  const out=[],ck=S.checks[WS.id]||{};
  WS.words.forEach((w,i)=>{
    const c=ck[i];if(!c)return;
    const parts=['m','s','a'].filter(p=>c[p]&&(p==='m'||w[p]));
    if(parts.length)out.push({i:i,w:w,parts:parts});
  });
  return out;
}
function render(){

  else if(view==='result')renderResult();
  else if(view==='submit')renderSubmit();
  else if(view==='exp')renderExp();
  window.scrollTo(0,0);
}

, 열리다"], ["3", "be held", "열리다, 개최되다"]], "lit": "열쇠를 찾으려 애쓰는 것 / 기억해 내려 애쓰는 것 / 어떤 행사가 언제 열리기로 되어 있는지 / 그것이 어디서 열릴 것인지 / 그리고 누구와 함께 갈 것인지를", "nat": "열쇠를 찾으려 애쓰는 것, 행사가 언제 열리는지·어디서 열리는지·누구와 함께 가는지를 기억해 내려 애쓰는 것이 그것이다.", "ana": "동명사 <b>Trying …과 trying …이 병렬</b>입니다. 두 번째 trying의 목적어로 <b>간접의문문 세 개</b>(when절·where절·with whom절)가 이어집니다. <b>with whom you are going</b>은 「전치사 + 관계대명사」가 아니라 <b>전치사 + 의문사</b> — “누구와 함께 갈 것인지”입니다.", "pe": "Trying to find the keys, / trying to remember / when an event is supposed to<sup>1</sup> take place<sup>2</sup>, / where it's going to be held<sup>3</sup>, / and with whom you are going.", "pk": "열쇠를 찾으려 애쓰는 것 / 기억해 내려 애쓰는 것 / 어떤 행사가 언제 열리기로 되어 있는지 / 그것이 어디서 열릴 것인지 / 그리고 누구와 함께 갈 것인지를", "core": "열쇠를 찾으려 애쓰는 것, 그리고 행사가 언제, 어디서 열리는지, 누구와 갈지 기억하려 애쓰는 것.", "tags": ["<b>동명사구</b> Trying(명사 역할)과 목적어 to find the keys. 완전한 문장이 아닌 나열", "<b>동명사 병렬</b> 둘째: trying + 목적어 to remember", "remember의 목적어절 ①: when ~ take place (간접의문문). is supposed to = ~하기로 되어 있다", "목적어절 ②: where it's going to be held (간접의문문)", "목적어절 ③: with whom you are going (전치사 + 의문사, 간접의문문)"], "steps": [{"t": "이 문장은 <b>동사가 없는 나열 문장</b>이다. 완전한 문장이 아니고, 앞뒤 문장에 이어지는 덩어리다."}, {"t": "먼저 큰 덩어리 두 개를 본다.", "sub": ["Trying to find the keys (열쇠를 찾으려 애쓰는 것) - 동명사구", "trying to remember ~ (~을 기억해 내려 애쓰는 것) - 동명사구, 위와 병렬"]}, {"t": "둘째 덩어리의 <b>remember</b> (기억하다) 뒤에 목적어가 <b>간접의문문 세 개</b>로 이어진다. 이게 문장을 길게 만든다.", "sub": ["when an event is supposed to take place (행사가 언제 열리기로 되어 있는지) - be supposed to = ~하기로 되어 있다", "where it's going to be held (그것이 어디서 열릴지) - it = an event (행사)", "and with whom you are going (그리고 누구와 함께 갈지) - 전치사 with가 의문사 whom 앞에 옴"]}, {"t": "주의할 점은 세 개의 의문절이 모두 <b>「의문사 + 주어 + 동사」 어순</b>이라는 것이다."}], "sum": "열쇠 찾기, 행사 시간·장소·동행 기억하기 같은 애쓰는 일들 나열"}, {"i": "06", "q": "10", "s": "7", "title": "S+V+O + 분사구문", "eng": "According to the constitution<sup>1</sup>, / a citizen might file suit<sup>2</sup> / on behalf of<sup>3</sup> an injured watershed<sup>4</sup>, / recognizing / that its health is crucial<sup>5</sup> to the common good.", "notes": [["1", "constitution", "헌법"], ["2", "file suit", "소송을 제기하다"], ["3", "on behalf of", "~을 대신하여"], ["4", "watershed", "(강) 유역"], ["5", "crucial", "중대한"]], "lit": "헌법에 따르면 / 시민은 소송을 제기할 수도 있다 / 훼손된 유역을 대신하여 / 인정하면서 / 그 유역의 건강이 공익에 중대하다는 것을", "nat": "헌법에 따르면 시민은 훼손된 강 유역을 대신해 소송을 제기할 수 있으며, 이는 그 유역의 건강이 공익에 중대하다는 것을 인정하는 것이다.", "ana": "콤마 뒤 <b>recognizing</b>은 동사가 아니라 <b>분사구문</b>입니다. 의미상 주어는 앞 절의 a citizen — “인정하면서 / 인정하는 셈이다”로 이어 읽습니다. 그 뒤 that절은 recognizing의 목적어입니다. file suit = 소송을 제기하다.", "pe": "\u0001According to the constitution<sup>1</sup>\u0002, / a citizen might file suit<sup>2</sup> / \u0001on behalf of<sup>3</sup> an injured watershed<sup>4</sup>\u0002, / \u0001recognizing\u0002 / \u0001that its health is crucial<sup>5</sup> to the common good\u0002.", "pk": "\u0001헌법에 따르면\u0002 / 시민은 소송을 제기할 수도 있다 / \u0001훼손된 유역을 대신하여\u0002 / \u0001인정하면서\u0002 / \u0001그 유역의 건강이 공익에 중대하다는 것을\u0002", "core": "시민은 소송을 제기할 수도 있다.", "tags": ["According to the constitution = 전치사구(부사구): 문장 전체를 꾸밈", "주어 a citizen + 동사 might file + 목적어 suit (file suit = 소송을 제기하다)", "on behalf of an injured watershed = 전치사구(부사구): file suit를 꾸밈", "recognizing = 분사구문(부사적: 동시 상황): 주절을 꾸밈, 주어는 a citizen. 동사 아님", "that절 = recognizing의 목적어절 (분사구 안에 속함)"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식) + 분사구문</b>이다. 앞에 부사구가 붙고 뒤에 분사구문이 붙어 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: a citizen (시민 한 명)", "V: might file (file 제기하다, 조동사 might와 함께 쓴 동사)", "O: suit (소송) - file suit = 소송을 제기하다", "뼈대 = <b>a citizen might file suit</b>"]}, {"t": "앞의 <b>According to the constitution</b> (헌법에 따르면)은 전치사구(부사구)로 문장 전체를 꾸민다."}, {"t": "<b>on behalf of an injured watershed</b>는 전치사구(부사구)로 file suit를 꾸민다. 훼손된 강 유역을 대신해 (injured 훼손된, watershed 강 유역)."}, {"t": "끝의 <b>recognizing ~</b>은 동사가 아니라 <b>분사구문(부사 덩어리)</b>이다. 의미상 주어는 a citizen이고 '인정하면서'라는 동시 상황이다.", "sub": ["recognizing (인정하다)의 목적어: that its health is crucial to the common good (그 건강이 공익에 중대하다는 것)", "its = an injured watershed의 (그 강 유역의)", "crucial (중대한), the common good (공익)"]}], "sum": "시민, 강 유역의 건강이 공익에 중대함을 인정하며 소송 제기 가능"}, {"i": "07", "q": "11", "s": "1", "title": "긴 주어 + S+V+O(what절)", "eng": "Like all humans, / the first Homo species<sup>1</sup> to begin the long difficult process of constructing a language from scratch<sup>2</sup> / almost certainly never said entirely<sup>3</sup> / what was on their minds.", "notes": [["1", "species", "종"], ["2", "from scratch", "맨 처음부터"], ["3", "entirely", "완전히"]], "lit": "모든 인간과 마찬가지로 / 맨 처음부터 언어를 만들어 내는 길고 어려운 과정을 시작한 최초의 호모 종은 / 거의 확실히 결코 온전히 말하지 않았다 / 자기들 마음속에 있는 것을", "nat": "모든 인간이 그렇듯, 맨 처음부터 언어를 만들어 내는 길고 어려운 과정을 시작한 최초의 호모 종도 마음속에 있는 것을 온전히 말한 적이 거의 확실히 없었다.", "ana": "주어는 <b>the first Homo species</b> 하나이고, 뒤의 to begin ~ from scratch가 그 주어를 꾸미는 <b>to부정사 형용사적 용법</b>입니다. 동사는 한참 뒤의 <b>said</b>. 목적어는 <b>what was on their minds</b>(선행사 없는 what절). 주어와 동사를 먼저 묶어 놓고 나머지를 얹으세요.", "pe": "\u0001Like all humans\u0002, / the first Homo species<sup>1</sup> \u0001to begin the long difficult process of constructing a language from scratch<sup>2</sup>\u0002 / \u0001almost certainly\u0002 never said \u0001entirely<sup>3</sup>\u0002 / what was on their minds.", "pk": "\u0001모든 인간과 마찬가지로\u0002 / \u0001맨 처음부터 언어를 만들어 내는 길고 어려운 과정을 시작한\u0002 최초의 호모 종은 / \u0001거의 확실히\u0002 결코 \u0001온전히\u0002 말하지 않았다 / 자기들 마음속에 있는 것을", "core": "최초의 호모 종은 마음속에 있는 것을 결코 말하지 않았다.", "tags": ["Like all humans = 전치사구(부사구): 문장 전체를 꾸밈", "주어 the first Homo species. to begin ~ = to부정사(형용사적): species를 뒤에서 꾸밈", "never(부정어) + 동사 said. almost certainly = 부사구: said를 꾸밈, entirely = 부사: said를 꾸밈", "<b>목적어절</b>: what was on their minds (선행사 없는 what절, said의 목적어)"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이다. 주어가 to부정사로 길게 꾸며져서 동사가 한참 뒤에 나온다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: the first Homo species (최초의 호모 종)", "V: said (say 말하다의 과거형)", "O: what was on their minds (그들 마음속에 있던 것) - what절, 선행사 없는 명사절", "뼈대 = <b>the first Homo species said what was on their minds</b>", "never (결코 ~않다)는 동사 said와 한 묶음, almost certainly (거의 확실히)와 entirely (온전히)는 said를 꾸미는 부사"]}, {"t": "앞의 <b>Like all humans</b> (모든 인간이 그렇듯)은 전치사구(부사구)로 문장 전체를 꾸민다."}, {"t": "주어 바로 뒤의 <b>to begin the long difficult process of constructing a language from scratch</b>는 <b>to부정사 형용사적 용법</b>이다. species를 뒤에서 꾸민다 (처음부터 언어를 만드는 길고 어려운 과정을 시작한).", "sub": ["begin (시작하다)의 목적어: the long difficult process (길고 어려운 과정)", "of constructing a language (언어를 만드는) - 전치사 뒤라서 동명사", "from scratch (맨 처음부터)"]}, {"t": "이 to부정사구가 길어서 주어와 동사 said가 멀어졌다는 점이 함정이다."}], "sum": "최초의 호모 종, 마음속 말을 온전히 한 적이 거의 없음"}, {"i": "08", "q": "11", "s": "6", "title": "S+V + as 도치절 + 목적의 to부정사", "eng": "Every aspect<sup>1</sup> of human language has evolved<sup>2</sup>, / as have components<sup>3</sup> of the human brain and body, / to engage in<sup>4</sup> conversation and social life.", "notes": [["1", "aspect", "측면"], ["2", "evolve", "진화하다"], ["3", "component", "구성 요소"], ["4", "engage in", "~에 참여하다"]], "lit": "인간 언어의 모든 측면은 진화해 왔다 / 인간의 뇌와 신체의 구성 요소들이 그러했듯이 / 대화와 사회생활에 참여하기 위해", "nat": "인간의 뇌와 신체의 구성 요소들이 그래 왔듯, 인간 언어의 모든 측면도 대화와 사회생활에 참여하기 위해 진화해 왔다.", "ana": "<b>as have components …</b>는 “~도 그러했듯이”라는 뜻으로, as 뒤에서 <b>조동사 have와 주어가 도치</b>된 형태입니다(= as components … have evolved). 삽입된 이 덩어리를 걷어내면 뼈대는 <b>Every aspect has evolved to engage in ~</b> 하나입니다.", "pe": "Every aspect<sup>1</sup> \u0001of human language\u0002 has evolved<sup>2</sup>, / \u0001as have components<sup>3</sup> of the human brain and body\u0002, / \u0001to engage in<sup>4</sup> conversation and social life\u0002.", "pk": "\u0001인간 언어의\u0002 모든 측면은 진화해 왔다 / \u0001인간의 뇌와 신체의 구성 요소들이 그러했듯이\u0002 / \u0001대화와 사회생활에 참여하기 위해\u0002", "core": "모든 측면은 진화해 왔다.", "tags": ["주어 Every aspect + 동사 has evolved(현재완료). of human language = 전치사구(형용사구): aspect를 꾸밈", "<b>as have components</b> = 부사절(비교, 도치): has evolved를 꾸밈. as 뒤 have + 주어 도치(= as components have evolved)", "to engage in ~ = to부정사(부사적: 목적): has evolved를 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V(1형식)</b>이고 중간에 <b>as 도치절</b>이 끼어 있다."}, {"t": "뼈대부터 찾는다."   });

function sHtmlP(s){
  let x='<div class="s"><div class="sn"><span class="lb">문장 '+s.n+'</span></div>';

function esc2(s){return String(s)}
function mdWrap(s){s=String(s);let o='',d=0,buf='',i=0;
const flush=()=>{if(buf){o+=(d===0&&/[A-Za-z0-9가-힣]/.test(buf))?'<span class="cr">'+buf+'</span>':buf;buf='';}};
while(i<s.length){const ch=s[i];
if(ch==='<'){const j=s.indexOf('>',i);buf+=s.slice(i,j+1);i=j+1;continue;}
if(ch==='\x01'){flush();if(d===0)o+='<span class="md">';o+='(';d++;i++;continue;}
if(ch==='\x02'){flush();o+=')';d--;if(d===0)o+='</span>';i++;continue;}
buf+=ch;i++;}
flush();return o;}
function chunkSplit(s){return String(s).split(' / ')}
function scHtml(c){
  const esc=String;
  const E=chunkSplit(c.pe||c.eng),K=chunkSplit(c.pk||c.lit);
  let x='<div class="sc"><div class="sc-h"><span class="no2">'+esc(c.q)+'</span><span class="at">'+esc(c.q)+'번 문제 · '+esc(c.s)+'번 문장</span><span class="tt">'+esc(c.title)+'</span><span class="chv"></span></div><div class="sc-b">';
  if(c.steps&&c.steps.length){x+='<div class="lay th"><div class="hd">이 문장 읽는 순서</div><ol>'+c.steps.map(p=>'<li>'+p.t+(p.sub||[]).map(u=>'<div class="sub">'+u+'</div>').join('')+'</li>').join('')+'</ol></div>';}
  for(let j=0;j<E.length;j++)x+='<div class="ch"><div class="ce">'+mdWrap(E[j])+'</div><div class="ck">'+mdWrap(K[j]||'')+'</div></div>';
  if(c.notes.length){x+='<div class="nts">'+c.notes.map(n=>'<span class="nt"><sup>'+n[0]+'</sup> <b>'+esc(n[1])+'</b> '+esc(n[2])+'</span>').join('')+'</div>';}
  x+='<div class="lay nat"><span class="lb">자연스러운 해석</span>'+esc(c.nat)+'</div>';
  const sm=c.sum||c.core;
  if(sm){x+='<div class="lay sum"><span class="lb">한 줄 정리</span>'+esc(sm)+'</div>';}
  x+='</div></div>';
  return x;
}

/* ---- 단어 확인 ---- */
function renderWord(){
  const ck=S.checks[WS.id]||{},locked=!!S.locked[WS.id],n=noteList().length;
  let h=hdr()+band(1)+`<div class="wrap ${locked?'locked':''}">`;
  WS.words.forEach((w,i)=>{
    const c=ck[i]||{};
    h+=`<div class="row"><div class="top"><span class="no">${i+1}</span><span class="word">${esc(w.w)}</span><span class="src">${esc(w.src)}번</span></div><div class="cells">`;

    if(w.s)h+=`<button class="cell s ${c.s?'bad':''}" data-i="${i}" data-p="s"><span class="tag">유</span><span>${esc(w.s[0])}<span class="ko">${esc(w.s[1])}</span></span></button>`;
    if(w.a)h+=`<button class="cell a ${c.a?'bad':''}" data-i="${i}" data-p="a"><span class="tag">반</span><span>${esc(w.a[0])}<span class="ko">${esc(w.a[1])}</span></span></button>`;

  app.querySelectorAll('.cell').forEach(b=>b.onclick=()=>{

    const c=S.checks[WS.id][i]=S.checks[WS.id][i]||{};
    c[p]=c[p]?0:1;save();
    if(c[p]){const ww=WS.words[i],x=p==='m'?[ww.w,ww.m]:p==='s'?ww.s:ww.a;if(x&&x[0]&&x[1])WN.add([{w:x[0],m:x[1],src:'미니모고',how:'별표',ask:true}]);}
    b.classList.toggle('bad',!!c[p]);
    $('#gonote').textContent='단어 오답노트 '+noteList().length;
  });
  const lk=$('#lock');if(lk)lk.onclick=()=>{
    if(armed==='lock'){S.locked[WS.id]=1;armed=null;save();
      recSend({type:'word',marks:noteList().map(it=>({w:it.w.w,parts:it.parts}))});}

}
function renderNote(){
  const list=noteList();
  let h=`<header><div class="wrap hd2"><h1>단어 오답노트 <span class="meta">${list.length}개</span></h1><button class="link" id="back">확인표</button></div></header><div class="wrap">`;
  if(!list.length)h+=`<div class="empty">아직 표시한 단어가 없습니다</div>`;

    const w=it.w,r=(S.res[WS.id]||{})[it.i]||{};
    h+=`<div class="note-item"><span class="w">${esc(w.w)}</span><span class="meta">${esc(w.src)}번</span>`;
    const row=(p,tag,txt,ko)=>{
      const bad=it.parts.includes(p);
      const rs=r[p]===1?'<span class="res o">맞춤</span>':r[p]===0?'<span class="res x">틀림</span>':'';
      return `<div class="part ${p} ${bad?'bad':''}"><span class="tag">${tag}</span><span>${esc(txt)}${ko?`<span class="ko"> ${esc(ko)}</span>`:''}</span>${bad?rs:''}</div>`;
    };
    h+=row('m','뜻',w.m,'');
    if(w.s)h+=row('s','유',w.s[0],w.s[1]);

  });

  app.innerHTML=h;
  $('#back').onclick=()=>{view='word';armed=null;render();};
  $('#back2').onclick=()=>{view='word';render();};
  $('#start').onclick=()=>{quiz={qs:buildQuestions(),n:0,right:0,done:false,shown:false};view='quiz';render();};
}
function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
/* ---- 답 제출 ---- */
function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;

    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;

    recSend({type:'submit',a:S.sub.a,s:s,n:N});

  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};

/* ---- 해설 ---- */

function renderExp(){

/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
