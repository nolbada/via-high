<title>고1 미니모의고사 7회 07–12번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:0}
#app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
#app>.wrap{width:100%}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}
.ko{color:var(--sub);font-size:14px;margin-left:6px}
.cell.bad{background:var(--badbg);border-color:var(--bad)}
.cell.bad .tag{background:var(--bad)}
.locked .cell{pointer-events:none}
.bar{position:sticky;margin-top:auto;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.done .opt{pointer-events:none}
.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}
.hcard .chip{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--sub)}
.hcard .chip.ok{background:var(--goodbg);color:var(--good)}
.hcard .chip.warn{background:var(--badbg);color:var(--bad)}
.hcard[disabled]{opacity:.55}
details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.th .hd{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:6px}
.th ol{list-style:none;margin:0;padding:0;counter-reset:n}
.th li{counter-increment:n;position:relative;padding:7px 0 7px 30px;font-size:15px;line-height:1.7;border-top:1px dashed #cfdcf0}
.th li:first-child{border-top:0}
.th li:before{content:counter(n);position:absolute;left:0;top:9px;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;text-align:center;line-height:21px}
.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.th .sub{margin:3px 0 0;color:#444;font-size:14.5px;line-height:1.7}
.sc .lay.sum{border-left:4px solid #2e7d32;background:#f1f8f1}
/* ---- 새 직독직해·해설 화면 ---- */
.sc{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden;background:var(--bg)}
.sc-h{padding:11px 14px 10px;background:#eef2f8;border-bottom:1px solid var(--line)}
.sc-h .no2{display:inline-block;min-width:26px;height:26px;line-height:26px;border-radius:13px;background:var(--accent);color:#fff;font-weight:800;font-size:13px;text-align:center;padding:0 7px;margin-right:8px}
.sc-h .at{font-size:13px;color:var(--sub)}
.sc-h .tt{display:block;margin-top:7px;font-size:15.5px;font-weight:800;color:var(--accent);line-height:1.45}
.sc-b{padding:10px 12px 12px}
.sc .ch{margin-bottom:6px}
.sc .ce{font-size:17px}
.sc .ce sup,.nt sup{font-size:10px;font-weight:800;color:#b8651f;margin-left:1px}
.nts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.nt{font-size:13.5px;line-height:1.5;background:#fbf6ee;border:1px solid #f0e2cd;border-radius:8px;padding:5px 9px;color:#4a3a22}
.nt b{color:#33260f}
.sc .lay{border-radius:10px}
.sc .lay.nat{border-left:4px solid var(--accent);background:#f7f9fc}
.sc .lay.ana{background:#fff8e6;border-color:#f0dcc0;color:#4d3b05}
.sc .lay.ana b,.why2 b,.opx b,.evx b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.sc .lb{margin-bottom:4px}
.qc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}
.qchip small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-bottom:1px}
.qchip.o{border-color:var(--good);background:var(--goodbg)}
.qchip.x{border-color:var(--bad);background:var(--badbg)}
.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.trs{list-style:none;margin:0;padding:0;background:var(--soft);border-radius:10px;padding:8px 12px}
.trs li{font-size:15px;line-height:1.75;padding:2px 0}
.trs .n{display:inline-block;min-width:20px;font-size:12px;color:var(--sub);font-weight:700}
.evx{background:var(--goodbg);border:1px solid #bfe0cd;border-radius:10px;padding:10px 12px}

.evx p{margin:6px 0;font-size:15.5px;line-height:1.75}
.evx .evh{font-size:13px;font-weight:800;color:var(--good);margin-bottom:6px}
.opx{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px;background:var(--bg)}
.opx.a{border-color:var(--good);background:var(--goodbg)}
.opx .ot{font-size:15.5px;font-weight:700;line-height:1.55}
.opx .mk{display:inline-block;min-width:22px;font-weight:800;color:var(--sub);margin-right:4px}
.opx.a .mk{color:var(--good)}
.opx .bd{display:inline-block;font-size:11.5px;font-weight:800;color:#fff;border-radius:4px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.opx .bd.g{background:var(--good)}
.opx .bd.t{background:#b4472f}
.opx p{margin:5px 0 0;font-size:14.5px;line-height:1.7;color:#333}
.opx .xm{color:var(--bad);font-weight:800;margin-right:3px}
.wds{display:flex;flex-wrap:wrap;gap:6px}
.wds span{font-size:14px;background:var(--soft);border-radius:8px;padding:5px 9px;line-height:1.45}
.wds b{margin-right:5px}
.toq{display:block;width:100%;margin-top:14px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}
details.sub2{margin:12px 0 0}
details.sub2>summary{list-style:none;cursor:pointer;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px;padding:6px 0}
details.sub2>summary::-webkit-details-marker{display:none}
details.sub2>summary:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
details.sub2>summary:after{content:"+";margin-left:auto;font-size:18px;color:var(--sub)}
details.sub2[open]>summary:after{content:"\2212"}

.cr{color:#A3102E;font-weight:700}
.sc .lay.core{border-left:4px solid #2e7d32;background:#f1f8f1}
.ct{display:none;margin:7px 0 2px;padding:6px 9px;border-left:3px solid #d9a21b;background:#fff8e6;border-radius:6px;font-size:13.5px;line-height:1.55;color:#4d3b05}
.ch.open .ct{display:block}

.sc .ch{background:#fafbfe;border:1px solid #e8ecf5;border-bottom:1px solid #e8ecf5;padding:10px 12px}
.sc .ce{font-size:18px;line-height:1.5;font-weight:800;color:#c62828}

.cks{margin:0 0 6px}.cchip{display:inline-block;font-size:12.5px;font-weight:700;color:#1f6f5f;background:#e5f4f0;border:1px solid #bfe3da;border-radius:999px;padding:4px 10px;text-decoration:none;margin:2px 4px 2px 0}

.sc .sc-b{background:#fff}

.sc .fin.n2{background:#fff8e1;border-color:#f0e2b0;border-left-color:#d9a21b}.sc .fin.n2 b{color:#8a6d00}


.rst{margin-top:8px;background:#fff8e1;border:1px solid #efe3b8;border-left:4px solid #d9a21b;border-radius:8px;padding:8px 10px;font-size:15px;line-height:1.7;word-break:keep-all}
.rst:before{content:"결국 이 얘기  ";font-size:11.5px;font-weight:800;color:#8a6d00}

.wc{padding:14px 0;border-bottom:1px solid var(--line)}

function dwItem(q,k){const L=DW[q]||[];for(let i=0;i<L.length;i++)if(L[i][0]===k)return L[i];return null;}
function dwMark(head,on){document.querySelectorAll('.dw').forEach(function(x){const p=x.closest('[data-q]');const y=p&&dwItem(p.dataset.q,x.dataset.k);if(y&&(y[2]||y[0])===head)x.classList.toggle('on',on);});}
function dwWrap(){
  S.dw=S.dw||{};
  const roots=[];
  document.querySelectorAll('.sc[data-q]').forEach(function(sc){roots.push([sc.dataset.q,sc.querySelectorAll('.ce')]);});
  document.querySelectorAll('details.qd[data-q]').forEach(function(d){roots.push([d.dataset.q,d.querySelectorAll('.e,.en')]);});
  roots.forEach(function(r){
    const q=r[0],L=DW[q]||[];if(!L.length)return;
    const re=new RegExp("(^|[^A-Za-z])("+L.map(function(x){return x[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/'/g,"['\u2019]")}).join('|')+")(?![A-Za-z])",'gi');
    r[1].forEach(function(el){
      const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),nodes=[];let n;while((n=w.nextNode()))nodes.push(n);
      nodes.forEach(function(nd){
        if(nd.parentNode.closest('.dw'))return;
        const s=nd.nodeValue;re.lastIndex=0;let m,last=0,frag=null;
        while((m=re.exec(s))){
          const st=m.index+m[1].length,surf=m[2],key=surf.toLowerCase().replace(/\u2019/g,"'");
          const it=dwItem(q,key);if(!it)continue;
          if(!frag)frag=document.createDocumentFragment();
          if(st>last)frag.appendChild(document.createTextNode(s.slice(last,st)));
          const sp=document.createElement('span');sp.className='dw'+(S.dw[it[2]||it[0]]?' on':'');sp.dataset.k=key;sp.textContent=surf;frag.appendChild(sp);
          last=st+surf.length;
        }
        if(frag){if(last<s.length)frag.appendChild(document.createTextNode(s.slice(last)));nd.parentNode.replaceChild(frag,nd);}
      });
    });
  });
}

은 <b>to부정사 부사적 용법(목적)</b>이다 (음악을 즐기려고)."}, {"t": "<b>while at the same time e-mailing ~</b>는 접속사가 남은 <b>분사구문</b>이다. 풀면 'while we are e-mailing'이다 (동시에 이메일을 쓰면서).", "sub": ["and being interrupted by constant messages on our mobile phones - e-mailing과 병렬", "수동이라서 being interrupted (방해받으면서, interrupt 방해하다)", "constant (끊임없는), on our mobile phones (우리 휴대전화로 온)는 messages를 꾸밈"]}], "sum": "우리, 이메일과 메시지에 방해받으며 음악까지 즐기려 드는 식으로 과욕"}, {"i": "08", "q": "11", "s": "B-4", "title": "동명사 주어 + S+V+O", "eng": "Trying to<sup>1</sup> talk about complex subjects<sup>2</sup> / and drive well at the same time<sup>3</sup> / pushes our abilities to their limits.", "notes": [["1", "try to", "~하려 애쓰다"], ["2", "complex subject", "복잡한 주제"], ["3", "at the same time", "동시에"], ["4", "push ~ to the limits", "~을 한계까지 밀어붙이다"]], "lit": "복잡한 주제에 대해 이야기하려 하는 것 / 그리고 동시에 운전을 잘하려 하는 것은 / 우리 능력을 한계까지 밀어붙인다", "nat": "복잡한 주제를 이야기하면서 동시에 운전까지 잘하려 드는 것은 우리 능력을 한계까지 몰아붙인다.", "ana": "이 문장의 주어는 <b>Trying ~ at the same time</b> 전체인 <b>동명사구</b>입니다. Trying을 진행형으로 읽으면 앞에 있어야 할 be동사가 없어 막힙니다. <b>to talk ~ and drive</b>는 to를 함께 쓰는 <b>원형부정사의 병렬</b>이라 drive 앞의 to가 생략된 것입니다(and drive를 새 동사로 보면 안 됩니다). 동명사 주어는 <b>단수 취급</b>이므로 동사가 <b>pushes</b>입니다 — 바로 앞 명사 subjects에 끌려 push로 읽지 않도록 주의하세요.", "pe": "Trying to<sup>1</sup> talk \u0001about complex subjects<sup>2</sup>\u0002 / and drive \u0001well\u0002 \u0001at the same time<sup>3</sup>\u0002 / pushes our abilities \u0001to their limits\u0002.", "pk": "\u0001복잡한 주제에 대해\u0002 이야기하려 하는 것 / 그리고 \u0001동시에\u0002 운전을 잘하려 하는 것은 / 우리 능력을 \u0001한계까지\u0002 밀어붙인다", "core": "말하려 하고 운전하려 하는 것은 우리 능력을 밀어붙인다.", "tags": ["동명사구 주어 시작: Trying to talk. about ~ = 전치사구(부사구): talk 꾸밈. 거의 필수에 가까운 부사구[천일문S 표기 A] [기준: 모양 규칙]", "주어 병렬: (to) drive. well = 부사: drive를 꾸밈, at the same time = 부사구: drive를 꾸밈", "동사 <b>pushes</b>(동명사 주어는 단수) + 목적어. to their limits = 전치사구(부사구): pushes 꾸밈. 거의 필수에 가까운 부사구[천일문S 표기 A] [기준: 모양 규칙]"], "steps": [{"t": "이 문장은 <b>동명사구 주어 + S+V+O(3형식)</b>이다. 주어가 길어서 동사가 한참 뒤에 나온다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: Trying to talk about complex subjects and (to) drive well at the same time (복잡한 주제를 이야기하면서 동시에 운전도 잘하려 애쓰는 것)", "V: pushes (push 몰아붙이다의 3인칭 단수형) - 동명사 주어는 단수 취급", "O: our abilities (우리 능력들)", "뼈대 = <b>Trying ~ pushes our abilities</b>"]}, {"t": "주어 안을 본다. <b>talk</b>와 <b>drive</b>가 and로 병렬이다.", "sub": ["about complex subjects (복잡한 주제에 대해) - talk를 꾸미는 전치사구", "well (잘), at the same time (동시에) - drive를 꾸미는 부사 표현"]}, {"t": "끝의 <b>to their limits</b> (그들의 한계까지)는 전치사구(부사구)다. push A to B에서 거의 필수에 가까운 부사구지만 수식어로 분류한다 (문형 기준). their = our abilities를 가리키는 말."}, {"t": "함정은 동사 모양이다. 주어가 talk와 drive 두 개라서 복수처럼 보이지만, 하나의 동명사구라 단수 pushes를 쓴 것이다."}], "sum": "말하면서 운전도 잘하려 드는 일, 능력을 한계까지 몰아붙임"}], "qs": [{"q": "07", "type": "빈칸 추론", "src": "2022년 6월 32번", "ans": "②", "tr": [["1", "수요의 법칙이란 상품과 서비스에 대한 수요가 가격이 내리면 늘어나고 가격이 오르면 줄어든다는 것이다."], ["2", "기펜재는 전통적인 수요의 법칙이 통하지 않는 특별한 종류의 상품이다."], ["3", "소비자들은 더 싼 대체품으로 갈아타는 대신, 기펜재의 가격이 오르면 그것을 더 많이 원하고 가격이 내리면 더 적게 원한다."], ["4", "예를 들어 중국의 쌀은 기펜재인데, 가격이 내려가면 사람들이 쌀을 오히려 덜 사는 경향이 있기 때문이다."], ["5", "그 이유는, 쌀값이 내려가면 사람들에게 고기나 유제품 같은 다른 종류의 상품에 쓸 돈이 더 생겨서 소비 패턴을 바꾸기 때문이다."], ["6", "반대로 쌀값이 오르면 사람들은 ______."]], "evh": "3 · 5번 문장", "ev": [{"en": true, "h": "Instead of switching to cheaper replacements, consumers demand more of giffen goods when the price increases and less of them when the price decreases. / ... when the price of rice falls, people have more money to spend on other types of products such as meat and dairy and, therefore, change their spending pattern."}, {"en": false, "h": "빈칸 문장 앞의 <b>On the other hand</b>는 '<b>앞과 반대 상황</b>'이라는 신호입니다. 5번은 <b>가격이 내릴 때</b> 벌어지는 일(다른 데 쓸 돈이 생겨 쌀을 덜 산다)이므로, 빈칸은 <b>가격이 오를 때</b>의 반대 결과여야 합니다. 그리고 3번이 기펜재의 정의를 못 박습니다 — <b>가격이 오르면 더 많이(demand more), 내리면 더 적게</b>. 두 문장을 겹치면 답은 '<b>쌀을 더 많이 소비한다</b>' 하나로 좁혀집니다."}], "opts": [{"n": "①", "t": "order more meat", "a": false, "x": true, "trap": true, "e": "고기를 더 사는 것은 <b>쌀값이 내려</b> 여윳돈이 생겼을 때의 이야기입니다(5번). 빈칸은 쌀값이 <b>오른</b> 상황이라 시점이 반대입니 it — positively reframing their experiences with their personal values."}, {"en": false, "h": "요약문의 빈칸은 <b>본문의 핵심어를 한 단계 추상화한 말</b>입니다. (A)는 학생들이 쓴 대상, 즉 <b>most important personal values</b>(가장 중요한 가치관)를 받아야 하므로 '<b>가치 있는(worthwhile)</b>'이 됩니다. (B)는 마지막 문장의 <b>reframing ~ in a new way</b>를 받아야 하므로 '<b>다시 생각하기(rethinking)</b>'입니다. 요약문의 in a new way가 reframing과 짝을 이루는 결정적 단서입니다."}], "opts": [{"n": "①", "t": "factual ...... rethinking", "a": false, "x": true, "trap": false, "e": "(B)는 맞지만 (A)가 틀렸습니다. 학생들이 쓴 것은 '<b>사실</b>'이 아니라 <b>자신에게 중요한 가치</b>입니다. 오히려 사실만 적은 쪽은 비교 집단에 가깝습니다."}, {"n": "②", "t": "worthwhile ...... rethinking", "a": true, "x": false, "trap": false, "e": "(A) most important personal values → <b>worthwhile</b>, (B) positively reframing ~ in a new way → <b>rethinking</b>으로 둘 다 대응합니다."}, {"n": "③", "t": "outdated ...... generalizing", "a": false, "x": true, "trap": false, "e": "(A) '시대에 뒤떨어진'은 본문과 아무 관계가 없고, (B) '일반화'도 나오지 않습니다. 본문은 <b>자기 경험을 다시 보는</b> 이야기입니다."}, {"n": "④", "t": "objective ...... generalizing", "a": false, "x": true, "trap": true, "e": "(A) '객관적인'이 그럴듯해 보이지만, 가치관은 지극히 <b>개인적(personal)</b>인 것입니다. 본문의 personal과 정면으로 부딪칩니다."}, {"n": "⑤", "t": "demanding ...... describing", "a": false, "x": true, "trap": false, "e": "(A) '부담이 큰'은 근거가 없고, (B) '묘사하기'는 <b>있는 그대로 적는</b> 쪽이라 '새로운 방식으로'라는 조건을 살리지 못합니다."}], "w": [["reflective journaling", "성찰 일기 쓰기"], ["think back on", "~을 되돌아보다"], ["undergraduate student", "학부생"], ["personal value", "개인의 가치관"], ["confident", "자신 있는"], ["perspective", "관점"], ["hassle", "귀찮은 일"], ["demonstration", "보여 주는 사례"], ["reframe", "다시 틀 짓다, 재해석하다"], ["worthwhile", "가치 있는"]]}, {"q": "11", "type": "장문 · 글의 제목", "src": "2017년 6월 41번", "ans": "⑤", "tr": [["1", "수천 개의 웹사이트와 텔레비전 채널, 문자 메시지, 전화 통화 속에서 미디어의 홍수에 빠져 허우적대기 쉽다."], ["2", "우리는 흔히 너무 많은 것을 너무 여러 방식으로 받아들이려 한다 — 노트북으로 이메일을 쓰고 휴대전화 메시지에 계속 방해받으면서 음악까지 즐기려 드는 식이다."], ["3", "내가 살아남는 데 도움이 된다고 배운 단 한 가지가 있을까?"], ["4", "있다. 한 번에 한 종류의 미디어만 붙잡으려고 애써라."], ["5", "상당한 정도로 우리에게는 집중할 능 and, therefore, change their spending pattern.</div><div class=\"k\">그 결과 그들의 소비 패턴을 바꾸기 때문이다</div></div><div class=\"rnat\">그 이유는, 쌀값이 하락하면, 사람들이 고기나 유제품 같은 다른 종류의 상품에 쓸 돈이 많아지고, 그 결과 소비 패턴을 바꾸기 때문이다.</div><div class=\"rst\">쌀값이 내려 엄마 장바구니에 돈이 남으면, 그 돈으로 고기와 우유를 더 사요. 지문 5번처럼 소비 패턴이 바뀌는 거예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">On the other hand,</span></div><div class=\"k\"><span class=\"cw\">반면에</span></div></div><div class=\"rc\"><div class=\"e\">as rice prices increase,</div><div class=\"k\">쌀값이 상승하면</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">people consume more rice.</span></div><div class=\"k\"><span class=\"cw\">사람들은 더 많은 쌀을 소비한다</span> ※ 문제지엔 빈칸으로 되어 있음 (정답: consume more rice)</div></div><div class=\"rnat\">반면에, 쌀값이 상승하면, 사람들은 더 많은 쌀을 소비한다.</div><div class=\"rst\"><b>반면에</b>(On the other hand) 쌀값이 오르면 고기 살 돈이 없어 밥을 더 먹어요. 그래서 빈칸은 쌀을 <b>더 많이 소비한다</b>예요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"law of demand\" data-m=\"수요의 법칙\"><b>law of demand</b>수요의 법칙</button><button type=\"button\" class=\"wdb\" data-w=\"apply\" data-m=\"적용되다\"><b>apply</b>적용되다</button><button type=\"button\" class=\"wdb\" data-w=\"replacement\" data-m=\"대체품\"><b>replacement</b>대체품</button><button type=\"button\" class=\"wdb\" data-w=\"purchase\" data-m=\"구매하다\"><b>purchase</b>구매하다</button><button type=\"button\" class=\"wdb\" data-w=\"dairy\" data-m=\"유제품\"><b>dairy</b>유제품</button><button type=\"button\" class=\"wdb\" data-w=\"spending pattern\" data-m=\"소비 패턴\"><b>spending pattern</b>소비 패턴</button></div>", "08": "<p class=\"mtr\">마더텅 정답률 <b>45%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸이 <b>첫 문장</b>에 있으면 답은 뒤의 <b>For example</b>(예를 들어) 실험이 보여 주는 결론이에요. 실험에서 <b>바뀐 것(겉모습)</b>과 <b>끝까지 안 바뀐 것(삼각형이라는 모양 구조)</b>을 나눠 보세요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (1번)</span><div class=\"en\">… in organic development, perception starts with <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span>.</span></div><p class=\"ko\">유기적 발달에서 지각은 ( ? )에서 시작한다</p></div><div class=\"ck-via\"><i>▼</i><span>For example(예를 들어)로 1번을 증명하는 실험이 시작돼요</span></div><div class=\"ck-step\"><span class=\"lab\">2번 문장 · 실험 결과</span><div class=\"en\">… they had <mark>no difficulty applying their training</mark> to <mark>triangles of very different appearance</mark>.</div><p class=\"ko\">그들은 <mark>겉모습이 아주 다른 삼각형에</mark> <mark>그들의 학습을 적용하는 데 어려움을 겪지 않았다</mark>.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>3번</em>더 작게·더 크게·거꾸로 뒤집기 (크기·방향)</span><span><em>4번</em>검정↔하양 바꾸기, 윤곽선 → 속이 꽉 찬 것 (색·채우기)</span></div><div class=\"ck-eq\">⇒ 바뀐 건 전부 겉모습, 안 바뀐 건 ‘삼각형’이라는 모양의 뼈대(구조)</div></div><div class=\"ck-via\"><i>▼</i><span>겉모습을 다 바꿔도 알아봤다 = 구조만 보고 알아본다</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 문장 · 결정적 단서</span><div class=\"en\">These changes <mark>seemed not to interfere with recognition</mark>.</div><p class=\"ko\">이러한 변화들은 <mark>재인(알아봄)을</mark> 방해하지 않는 것처럼 보였다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">recognizing outstanding structural features 두드러진 구조적 특징을 인식하는 것<small>겉모습이 달라도 ‘삼각형’이라는 뼈대만 보고 알아봤어요(5번)</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">identifying the information of colors 색깔 정보를 식별하는 것</span><span class=\"why\">4번에 black(검정)·white(하양)가 나와서 끌려요. 하지만 색을 바꿔도 알아봤으니(5번) 색은 알아보는 기준이 아니에요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">interpreting different gestures 다양한 몸짓을 해석하는 것</span><span class=\"why\">실험은 상자에 붙은 삼각형 모양 이야기예요. 몸짓(gestures)은 지문에 하나도 안 나와요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">establishing social frameworks 사회적 틀을 세우는 것</span><span class=\"why\">2~6번은 아이·침팬지·쥐가 모양을 알아보는 실험이에요. 사회적 관계 이야기는 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">separating the self from the environment 자신을 환경과 분리하는 것</span><span class=\"why\">‘나와 주변을 나눈다’는 말은 지문에 없어요. 4번의 background(배경)는 삼각형 뒤의 바탕색일 뿐이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">There is good evidence</div><div class=\"k\">좋은 증거가 있다</div></div><div class=\"rc\"><div class=\"e\">that in organic development,</div><div class=\"k\">유기적 발달에서</div></div><div class=\"rc\"><div class=\"e\">perception starts with</div><div class=\"k\">지각은 ~에서 시작한다는</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">recognizing outstanding structural features.</span></div><div class=\"k\"><span class=\"cw\">두드러진 구조적 특징을 인식하는 것</span> ※ 문제지엔 빈칸으로 되어 있음 (정답: recognizing outstanding structural features)</div></div><div class=\"rnat\">유기적 발달에서 지각은 두드러진 구조적 특징을 인식하는 것에서 시작한다는 좋은 증거가 있다.</div><div class=\"rst\">아기 동생은 처음 세상을 볼 때 세세한 것보다 큰 모양부터 알아봐요. 지문 1번은 지각이 <b>두드러진 구조적 특징</b>에서 시작한다고 말해요.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">2번 · 단서</span><div class=\"rc\"><div class=\"e\">For example,</div><div class=\"k\">예를 들어</div></div><div class=\"rc\"><div class=\"e\">when two-year-old children and chimpanzees had learned</div><div class=\"k\">2살 아이들과 침팬지들이 학습했을 때</div></div><div class=\"rc\"><div class=\"e\">that, of two boxes presented to them,</div><div class=\"k\">그들에게 제시된 2개의 상자 중</div></div><div class=\"rc\"><div class=\"e\">the one with a triangle of a particular size and shape</div><div class=\"k\">특정한 크기와 형태의 삼각형이 있는 것(상자)이</div></div><div class=\"rc\"><div class=\"e\">always contained attractive food,</div><div class=\"k\">항상 매력적인 음식을 담고 있다는 것을</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">they had no difficulty applying their training</span></div><div class=\"k\">그들(= 아이들과 침팬지들)은 <span class=\"cw\">그들의 학습을 적용하는 데 어려움을 겪지 않았다</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">to triangles of very different appearance.</span></div><div class=\"k\"><span class=\"cw\">겉모습이 아주 다른 삼각형에</span></div></div><div class=\"rnat\">예를 들어, 2살 아이들과 침팬지들이 그들에게 제시된 2개의 상자 중 특정한 크기와 형태를 갖고 있는 삼각형이 있는 것(상자)이 항상 매력적인 음식을 담고 있다는 것을 학습했을 때, 그들은 그들의(그들이 배운) 학습을 다른 모양의 삼각형에 적용하는 데 어려움을 겪지 않았다.</div><div class=\"rst\">동생에게 “세모 스티커 상자에 젤리가 있어!”를 가르쳤더니, 모양이 다른 세모 상자도 바로 열었어요. 지문 2번의 실험이 이거예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">The triangles were made</div><div class=\"k\">삼각형들은 만들어졌다</div></div><div class=\"rc\"><div class=\"e\">smaller or larger or turned upside down.</div><div class=\"k\">더 작게 혹은 더 크게 혹은 거꾸로 뒤집혀</div></div><div class=\"rnat\">삼각형들은 더 작거나 더 크게 혹은 거꾸로 뒤집혀 만들어졌다.</div><div class=\"rst\">세모를 더 작게, 더 크게, 거꾸로 뒤집어 붙여도 동생은 헷갈리지 않아요. = 지문 3번의 바꾼 삼각형들이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">A black triangle on a white background</div><div class=\"k\">하얀 배경의 검정 삼각형은</div></div><div class=\"rc\"><div class=\"e\">was replaced by a white triangle on a black background,</div><div class=\"k\">검정 배경의 하얀 삼각형으로 대체되었다</div></div><div class=\"rc\"><div class=\"e\">or an outlined triangle by a solid one.</div><div class=\"k\">또는 윤곽만 있는 삼각형은 단색의 것으로</div></div><div class=\"rnat\">하얀 색 배경의 검정색 삼각형은 검정색 배경의 하얀색 삼각형으로, 또는 윤곽이 드러나 있는(외곽선이 그려져 있는) 삼각형은 단색의 것(삼각형)으로 대체되었다.</div><div class=\"rst\">검정 세모를 하얀 세모로, 테두리만 있는 세모를 꽉 찬 세모로 바꿔도 마찬가지예요. 지문 4번처럼 색과 채우기만 달라졌어요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">These changes seemed not to interfere</span></div><div class=\"k\"><span class=\"cw\">이러한 변화들은 방해하지 않는 것처럼 보였다</span></div></div><div class=\"rc\"><div class=\"e\">with recognition.</div><div class=\"k\">재인(알아봄)을</div></div><div class=\"rnat\">이러한 변화들은 재인을 방해하지 않는 것처럼 보였다.</div><div class=\"rst\"><b>겉모습을 다 바꿔도 알아봤어요.</b> 지문 5번, 이런 변화가 알아보는 걸 방해하지 않았다는 말이에요. ‘세모’라는 뼈대만 보는 거죠.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Similar results were obtained</div><div class=\"k\">비슷한 결과들이 얻어졌다</div></div><div class=\"rc\"><div class=\"e\">with rats.</div><div class=\"k\">(실험용) 쥐에서도</div></div><div class=\"rnat\">(실험용) 쥐에서도 비슷한 결과들이 얻어졌다.</div><div class=\"rst\">우리 집 햄스터에게 해 봐도 비슷했대요. 지문 6번, 쥐에게서도 같은 결과가 나왔다는 말이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Karl Lashley, a psychologist,</div><div class=\"k\">심리학자 Karl Lashley는</div></div><div class=\"rc\"><div class=\"e\">has asserted that</div><div class=\"k\">주장해왔다</div></div><div class=\"rc\"><div class=\"e\">simple transpositions of this type</div><div class=\"k\">이러한 유형의 단순한 치환은</div></div><div class=\"rc\"><div class=\"e\">are universal in all animals</div><div class=\"k\">모든 동물들에게 보편적이라고</div></div><div class=\"rc\"><div class=\"e\">including humans.</div><div class=\"k\">사람을 포함한</div></div><div class=\"rnat\">심리학자 Karl Lashley는 이러한 유형의 단순한 치환은 사람을 포함한 모든 동물들에게 보편적이라고 주장해왔다.</div><div class=\"rst\">그래서 심리학자는 사람도 동물도 다 이렇게 모양의 뼈대로 알아본다고 해요. 지문 7번, 이런 치환은 <b>보편적</b>(universal)이라는 결론이에요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"perception\" data-m=\"지각, 인식\"><b>perception</b>지각, 인식</button><button type=\"button\" class=\"wdb\" data-w=\"present\" data-m=\"제시하다\"><b>present</b>제시하다</button><button type=\"button\" class=\"wdb\" data-w=\"appearance\" data-m=\"겉모습\"><b>appearance</b>겉모습</button><button type=\"button\" class=\"wdb\" data-w=\"interfere with\" data-m=\"~을 방해하다\"><b>interfere with</b>~을 방해하다</button><button type=\"button\" class=\"wdb\" data-w=\"assert\" data-m=\"주장하다\"><b>assert</b>주장하다</button><button type=\"button\" class=\"wdb\" data-w=\"universal\" data-m=\"보편적인\"><b>universal</b>보편적인</button></div>", "09": "<p class=\"mtr\">마더텅 정답률 <b>85%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">불일치 선택지는 <b>지문 순서대로</b> 나와요. 연도·나이 같은 <b>숫자</b>는 그대로 맞춰 보고, 마지막 ⑤는 <b>recognition</b>(인정)이 ‘비난’으로 <b>뒤집혔는지</b> 확인하세요.</p><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>① ↔ 2번</em>The second of six children(여섯 명의 아이 중 둘째) → 같음</span><span><em>② ↔ 3번</em>At the age of fourteen(열네 살에) 첫 카메라를 받음 → 같음</span><span><em>③ ↔ 5번</em>worked in the dining room(식당에서 일했다) of the Hotel Chamberlin(Chamberlin 호텔) → 같음</span><span><em>④ ↔ 7번</em>opened his own studio(자신의 스튜디오를 열었다), 1916년 → 같음</span></div><div class=\"ck-eq\">⇒ 네 개는 지문과 그대로 같아요. 남은 ⑤를 9번과 대조해요</div></div><div class=\"ck-via\"><i>▼</i><span>⑤의 1969년을 9번에서 찾아 뒤의 말을 비교해요</span></div><div class=\"ck-step key\"><span class=\"lab\">9번 문장 · 결정적 단서</span><div class=\"en\">In 1969, the exhibition, Harlem On My Mind, brought him <mark>international recognition</mark>.</div><p class=\"ko\">1969년에 전시회 Harlem On My Mind는 그에게 <mark>국제적인 인정을</mark> 가져다 주었다.</p></div><div class=\"ck-via\"><i>▼</i><span>연도(1969)·전시회·국제적까지는 같고, 딱 한 단어만 반대로 바뀌었어요</span></div><div class=\"ck-step\"><span class=\"lab\">⑤ 선택지 · 어긋나는 말</span><div class=\"en\">recognition = 인정 ≠ 비난</div><p class=\"ko\">1969년에 전시회로 인해 국제적인 <mark>비난</mark>을 받았다 → 지문은 <mark>인정</mark></p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">1969년에 전시회로 인해 국제적인 비난을 받았다.<small>9번: 비난이 아니라 international recognition(국제적인 인정)을 받았어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">Chamberlin 호텔의 식당에서 일을 했다.</span><span class=\"why\">6번에 photographer(사진가)로 일했다는 말이 있어 식당 일은 틀린 줄 알기 쉬워요. 하지만 5번에서 식당에서 일했고, 6번은 사진 일을 also(또한) 파트타임으로 했다는 뜻이라 둘 다 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">여섯 명의 아이들 중 둘째였다.</span><span class=\"why\">2번 The second of six children(여섯 명의 아이 중 둘째)과 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">열네 살에 그의 첫 번째 카메라를 받았다.</span><span class=\"why\">3번 At the age of fourteen(열네 살에) he received his first camera(그는 첫 카메라를 받았다)와 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">자신의 스튜디오를 1916년에 열었다.</span><span class=\"why\">7번 opened his own studio(자신의 스튜디오를 열었다)와 연도 1916이 그대로 같아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">James Van Der Zee was born</div><div class=\"k\">James Van Der Zee는 태어났다</div></div><div class=\"rc\"><div class=\"e\">on June 29, 1886,</div><div class=\"k\">1886년 6월 29일에</div></div><div class=\"rc\"><div class=\"e\">in Lenox, Massachusetts.</div><div class=\"k\">Massachusetts주의 Lenox에서</div></div><div class=\"rnat\">James Van Der Zee는 1886년 6월 29일에 Massachusetts주의 Lenox에서 태어났다.</div><div class=\"rst\">사회 수행평가로 사진가 인물 카드를 만든다고 해 봐요. 첫 칸: 1886년 6월 29일, 매사추세츠주의 한 마을에서 태어남. 지문 1번 그대로예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">The second of six children,</div><div class=\"k\">여섯 명의 아이 중 둘째였던</div></div><div class=\"rc\"><div class=\"e\">James grew up</div><div class=\"k\">James는 자랐다</div></div><div class=\"rc\"><div class=\"e\">in a family of creative people.</div><div class=\"k\">창의적인 (사람들의) 가정에서</div></div><div class=\"rnat\">여섯 명의 아이 중 둘째였던 James는 창의적인 (사람들의) 가정에서 자랐다.</div><div class=\"rst\">둘째 칸: <b>여섯 아이 중 둘째</b>, 창의적인 가족 속에서 자람. 지문 2번 = 선택지 ①이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">At the age of fourteen</div><div class=\"k\">열네 살의 나이에</div></div><div class=\"rc\"><div class=\"e\">he received his first camera</div><div class=\"k\">그는 그의 첫 카메라를 받았다</div></div><div class=\"rc\"><div class=\"e\">and took hundreds of photographs</div><div class=\"k\">그리고 수백 장의 사진을 찍었다</div></div><div class=\"rc\"><div class=\"e\">of his family and town.</div><div class=\"k\">그의 가족과 도시의</div></div><div class=\"rnat\">열네 살의 나이에 그는 그의 첫 카메라를 받았으며 수백 장의 그의 가족과 도시의 사진을 찍었다.</div><div class=\"rst\">셋째 칸: <b>열네 살</b>에 첫 카메라를 받고 가족과 동네 사진을 수백 장 찍음. 지문 3번 = 선택지 ②예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">By 1906,</div><div class=\"k\">1906년 즈음에</div></div><div class=\"rc\"><div class=\"e\">he had moved to New York, married,</div><div class=\"k\">그는 뉴욕으로 이사했고 결혼한 채였다</div></div><div class=\"rc\"><div class=\"e\">and was taking jobs</div><div class=\"k\">그리고 일을 하고 있었다</div></div><div class=\"rc\"><div class=\"e\">to support his growing family.</div><div class=\"k\">그의 늘어나는 가족을 부양하기 위해</div></div><div class=\"rnat\">1906년 즈음에, 그는 결혼한 채로 뉴욕으로 이사했고, 그의 커가는(늘어나는) 가족을 부양하기 위해 일을 하고 있었다.</div><div class=\"rst\">넷째 칸: 1906년 즈음 뉴욕으로 이사하고 결혼, 늘어나는 가족을 위해 일함. 지문 4번 순서 그대로 적어요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">In 1907,</div><div class=\"k\">1907년에</div></div><div class=\"rc\"><div class=\"e\">he moved to Phoetus, Virginia,</div><div class=\"k\">그는 Virginia주의 Phoetus로 이사했다</div></div><div class=\"rc\"><div class=\"e\">where he worked in the dining room</div><div class=\"k\">그곳에서 그는 식당에서 일했다</div></div><div class=\"rc\"><div class=\"e\">of the Hotel Chamberlin.</div><div class=\"k\">Chamberlin 호텔의</div></div><div class=\"rnat\">1907년에, 그는 Virginia주의 Phoetus로 이사했으며, 그곳에서 그는 Chamberlin 호텔의 식당에서 일했다.</div><div class=\"rst\">다섯째 칸: 1907년 버지니아주로 이사해 <b>호텔 식당</b>에서 일함. 지문 5번 = 선택지 ③이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">During this time</div><div class=\"k\">이 기간 동안</div></div><div class=\"rc\"><div class=\"e\">he also worked as a photographer</div><div class=\"k\">그는 또한 사진가로 일했다</div></div><div class=\"rc\"><div class=\"e\">on a part-time basis.</div><div class=\"k\">파트타임으로</div></div><div class=\"rnat\">이 기간에 그는 또한 파트타임 사진가로 일했다.</div><div class=\"rst\">같은 칸에 덧붙여요: 그 기간에 파트타임 사진가로도 일함. 지문 6번의 also(또한)라서 식당 일과 함께 한 거예요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">He opened his own studio</div><div class=\"k\">그는 자신의 스튜디오를 열었다</div></div><div class=\"rc\"><div class=\"e\">in 1916.</div><div class=\"k\">1916년에</div></div><div class=\"rnat\">그는 1916년에 자신의 스튜디오를 열었다.</div><div class=\"rst\">여섯째 칸: <b>1916년</b>에 자기 스튜디오를 엶. 지문 7번 = 선택지 ④예요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">World War I had begun</div><div class=\"k\">1차 세계대전이 시작되었다</div></div><div class=\"rc\"><div class=\"e\">and many young soldiers came to the studio</div><div class=\"k\">그리고 많은 젊은 군인들이 스튜디오로 왔다</div></div><div class=\"rc\"><div class=\"e\">to have their pictures taken.</div><div class=\"k\">그들의 사진을 찍기 위해</div></div><div class=\"rnat\">1차 세계대전이 시작되었고 많은 젊은 군인들이 그들의 사진을 찍기 위해 스튜디오로 왔다.</div><div class=\"rst\">일곱째 칸: 1차 세계대전이 시작되어 젊은 군인들이 사진을 찍으러 스튜디오에 옴. 지문 8번 내용이에요.</div></div><div class=\"rds key\" data-ord=\"9\"><span class=\"rn\">9번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">In 1969,</span></div><div class=\"k\"><span class=\"cw\">1969년에</span></div></div><div class=\"rc\"><div class=\"e\">the exhibition, Harlem On My Mind,</div><div class=\"k\">전시회 Harlem On My Mind는</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">brought him international recognition.</span></div><div class=\"k\"><span class=\"cw\">그에게 국제적인 인정을 가져다 주었다</span></div></div><div class=\"rnat\">1969년에, 전시회 《Harlem On My Mind》는 그에게 국제적인 인정을 가져다 주었다.</div><div class=\"rst\">여덟째 칸이 핵심! 1969년 전시회로 세계적인 <b>인정</b>(recognition)을 받음. 그래서 ⑤ “비난”은 지문 9번과 반대예요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">He died</div><div class=\"k\">그는 사망하였다</div></div><div class=\"rc\"><div class=\"e\">in 1983.</div><div class=\"k\">1983년에</div></div><div class=\"rnat\">그는 1983년에 사망하였다.</div><div class=\"rst\">마지막 칸: 1983년에 세상을 떠남. 지문 10번으로 카드가 끝나요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"support\" data-m=\"부양하다\"><b>support</b>부양하다</button><button type=\"button\" class=\"wdb\" data-w=\"dining room\" data-m=\"식당\"><b>dining room</b>식당</button><button type=\"button\" class=\"wdb\" data-w=\"on a part-time basis\" data-m=\"시간제로\"><b>on a part-time basis</b>시간제로</button><button type=\"button\" class=\"wdb\" data-w=\"exhibition\" data-m=\"전시회\"><b>exhibition</b>전시회</button><button type=\"button\" class=\"wdb\" data-w=\"recognition\" data-m=\"인정, 명성\"><b>recognition</b>인정, 명성</button><button type=\"button\" class=\"wdb\" data-w=\"international\" data-m=\"국제적인\"><b>international</b>국제적인</button></div>", "10": "<p class=\"mtr\">마더텅 정답률 <b>65%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">요약문은 실험 결과를 <b>말만 바꿔 옮긴 것</b>이에요. (A)는 학생들이 <b>무엇에 대해</b> 썼는지(<b>values</b> 가치), (B)는 그 결과 경험을 <b>어떻게 바꿔 보았는지</b>(<b>reframing</b> 재구성)를 받아요.</p><div class=\"ck-step\"><span class=\"lab\">2번 문장 · (A)의 재료</span><div class=\"en\">… to journal about their <mark>most important personal values</mark> and their daily activities;</div><p class=\"ko\">그들의 <mark>가장 중요한 개인적인 가치</mark>에 대해 쓰도록</p></div><div class=\"ck-via\"><i>▼</i><span>가치에 비추어 성찰했더니 활동을 보는 눈이 바뀌었어요</span></div><div class=\"ck-step\"><span class=\"lab\">5번 문장 · (B)의 재료</span><div class=\"en\">… students had gained <mark>a new perspective</mark> on those activities and choices.</div><p class=\"ko\">학생들은 <mark>새로운 관점</mark>을 얻었다</p></div><div class=\"ck-via\"><i>▼</i><span>가치(values)로 경험을 다시 짠다 = 요약문의 (A)·(B)가 한 문장에 다 있어요</span></div><div class=\"ck-step key\"><span class=\"lab\">8번 문장 · 결정적 단서</span><div class=\"en\">… <mark>positively reframing their experiences</mark> with their personal values.</div><p class=\"ko\">그들의 개인적인 가치로 <mark>그들의 경험을 긍정적으로 재구성하면서</mark></p></div><div class=\"ck-via\"><i>▼</i><span>personal values(개인적인 가치) → (A) worthwhile(가치 있는), reframing(재구성) + new(새로운) → (B) rethinking(다시 생각하기)</span></div><div class=\"ck-step key\"><span class=\"lab\">요약문 (9번) · 짝 맞추기</span><div class=\"en\">… based on what we believe to be <mark>worthwhile</mark> … by <mark>rethinking</mark> our experiences in a new way.</div><p class=\"ko\">우리가 <mark>가치 있다고</mark> 믿는 것에 근거하여 … 새로운 방식으로 자신의 경험을 <mark>다시 생각함으로써</mark></p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">worthwhile 가치 있는 … rethinking 다시 생각하기<small>2번 values(가치) → worthwhile(가치 있는), 8번 reframing(재구성) → rethinking(다시 생각하기)이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">factual 사실의 … rethinking 다시 생각하기</span><span class=\"why\">(B)는 맞지만 (A)가 틀려요. 2번에서 학생들은 사실이 아니라 personal values(개인적인 가치)에 대해 썼어요. 요약문의 (A)는 '우리가 믿는 것'이라 사실보다 가치가 어울려요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">outdated 시대에 뒤떨어진 … generalizing 일반화하기</span><span class=\"why\">둘 다 틀려요. 2번의 가치는 가장 중요한(most important) 것이지 낡은 것이 아니고, 8번은 경험을 reframing(재구성)한 것이지 일반화한 게 아니에요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">objective 객관적인 … generalizing 일반화하기</span><span class=\"why\">둘 다 틀려요. 2번의 가치는 personal(개인적인) 것이라 객관적인 것과 반대이고, 5번처럼 새로운 관점(new perspective)을 얻은 것이지 일반화한 게 아니에요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">demanding 까다로운 … describing 묘사하기</span><span class=\"why\">둘 다 틀려요. 가치가 까다롭다는 말은 없고, 그냥 있는 그대로 묘사한 게 아니라 8번처럼 긍정적으로 다시 짜(reframing 재구성) 본 거예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">One of the most powerful tools</div><div class=\"k\">가장 강력한 도구들 중 하나는</div></div><div class=\"rc\"><div class=\"e\">to find meaning in our lives</div><div class=\"k\">우리의 삶에서 의미를 찾기 위한</div></div><div class=\"rc\"><div class=\"e\">is reflective journaling —</div><div class=\"k\">성찰적 일기 쓰기이다</div></div><div class=\"rc\"><div class=\"e\">thinking back on and writing about</div><div class=\"k\">회상해 보고 그것에 대해 쓰는 것</div></div><div class=\"rc\"><div class=\"e\">what has happened to us.</div><div class=\"k\">우리에게 일어난 일을</div></div><div class=\"rnat\">우리의 삶에서 의미를 찾기 위한 가장 강력한 도구들 중 하나는 성찰적 일기 쓰기, 즉 우리에게 일어난 일을 회상해 보고 그것에 대해 쓰는 것이다.</div><div class=\"rst\">방학 동안 매일 밤 일기를 쓴다고 해 봐요. 지문 1번은 그날 일을 <b>돌아보며 쓰는 일기</b>가 삶의 의미를 찾는 강력한 도구라고 말해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">In the 1990s,</div><div class=\"k\">1990년대에</div></div><div class=\"rc\"><div class=\"e\">Stanford University researchers asked</div><div class=\"k\">Stanford University 연구원들이 요청했다</div></div><div class=\"rc\"><div class=\"e\">undergraduate students on spring break</div><div class=\"k\">봄방학에 학부생들에게</div></div><div class=\"rc ckc\"><div class=\"e\">to journal about <span class=\"cw\">their most important personal values</span></div><div class=\"k\"><span class=\"cw\">그들의 가장 중요한 개인적인 가치</span>에 대해 쓰도록</div></div><div class=\"rc\"><div class=\"e\">and their daily activities;</div><div class=\"k\">그리고 그들의 매일의 활동들에 대해</div></div><div class=\"rnat\">1990년대에 Stanford University 연구원들이 봄방학에 학부생들에게 그들의 가장 중요한 개인적인 가치와 그들의 매일의 활동들에 대해 쓰도록 요청했다.</div><div class=\"rst\">우리 반 절반은 “내가 소중히 여기는 것(가족, 우정)”과 그날 한 일을 같이 써요. 지문 2번, 대학생들이 <b>가치</b>와 일상을 쓴 것이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">others were asked</div><div class=\"k\">다른 사람들은 요청받았다</div></div><div class=\"rc\"><div class=\"e\">to write about only the good things</div><div class=\"k\">오직 좋은 일에 대해서만 쓰도록</div></div><div class=\"rc\"><div class=\"e\">that happened to them in the day.</div><div class=\"k\">그날 그들에게 일어난</div></div><div class=\"rnat\">반면, 다른 사람들은 그날 그들에게 일어난 좋은 일에 대해서만 쓰도록 요청받았다.</div><div class=\"rst\">나머지 절반은 “오늘 좋았던 일”만 써요. = 지문 3번, 다른 학생들은 좋은 일에 대해서만 썼어요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Three weeks later,</div><div class=\"k\">3주 후</div></div><div class=\"rc\"><div class=\"e\">the students who had written about their values</div><div class=\"k\">자신의 가치에 대해 썼던 학생들은</div></div><div class=\"rc\"><div class=\"e\">were happier, healthier,</div><div class=\"k\">더 행복하고 더 건강했다</div></div><div class=\"rc\"><div class=\"e\">and more confident about their ability to handle stress</div><div class=\"k\">그리고 스트레스를 다루는 자신의 능력에 대해 더 자신감이 있었다</div></div><div class=\"rc\"><div class=\"e\">than the ones who had only focused on the good stuff.</div><div class=\"k\">좋은 것에만 초점을 맞췄던 학생들보다</div></div><div class=\"rnat\">3주 후, 자신의 가치에 대해 썼던 학생들은 좋은 것에만 초점을 맞췄던 학생들보다 더 행복하고, 더 건강하고, 스트레스를 다루는 자신의 능력에 대해 더 자신감이 있었다.</div><div class=\"rst\">3주 뒤, 가치를 쓴 친구들이 더 행복하고 건강하고 스트레스도 잘 견뎌요. 지문 4번의 실험 결과예요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">By reflecting on</div><div class=\"k\">성찰함으로써</div></div><div class=\"rc\"><div class=\"e\">how their daily activities supported their values,</div><div class=\"k\">그들의 하루 활동들이 어떻게 그들의 가치를 뒷받침했는지에 대해</div></div><div class=\"rc\"><div class=\"e\">students had gained a new perspective</div><div class=\"k\">학생들은 새로운 관점을 얻었다</div></div><div class=\"rc\"><div class=\"e\">on those activities and choices.</div><div class=\"k\">그 활동들과 선택들에 관한</div></div><div class=\"rnat\">그들의 하루 활동들이 어떻게 그들의 가치를 뒷받침했는지에 대해 성찰함으로써, 학생들은 그 활동들과 선택들에 관한 새로운 관점을 얻었다.</div><div class=\"rst\">“동생 숙제 봐 준 건 가족을 아끼는 내 마음이었구나” 하고 깨달아요. 지문 5번, 활동을 보는 <b>새로운 관점</b>을 얻은 거예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Little stresses and hassles</div><div class=\"k\">작은 스트레스와 귀찮은 일들은</div></div><div class=\"rc\"><div class=\"e\">were now demonstrations of their values in action.</div><div class=\"k\">이제 행동에서 그들의 가치를 보여주는 것들이었다</div></div><div class=\"rnat\">작은 스트레스와 귀찮은 일들은 이제 행동에서 그들의 가치를 보여주는 것들이었다.</div><div class=\"rst\">귀찮던 설거지도 이제는 가족을 아끼는 내 가치를 실천하는 일이 돼요. 지문 6번, 작은 스트레스가 가치를 보여 주는 행동이 됐다는 말이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Suddenly,</div><div class=\"k\">갑자기</div></div><div class=\"rc\"><div class=\"e\">their lives were full of meaningful activities.</div><div class=\"k\">그들의 삶은 의미 있는 활동들로 가득 찼다</div></div><div class=\"rnat\">갑자기, 그들의 삶은 의미 있는 활동들로 가득 찼다.</div><div class=\"rst\">갑자기 내 하루가 의미 있는 일들로 가득 차 보여요. = 지문 7번 그대로예요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc\"><div class=\"e\">And all they had to do</div><div class=\"k\">그리고 그들이 해야 할 모든 것은</div></div><div class=\"rc\"><div class=\"e\">was reflect and write about it —</div><div class=\"k\">그것에 대해 성찰하고 쓰는 것이었다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">positively reframing their experiences</span></div><div class=\"k\"><span class=\"cw\">그들의 경험을 긍정적으로 재구성하면서</span></div></div><div class=\"rc\"><div class=\"e\">with their personal values.</div><div class=\"k\">그들의 개인적인 가치로</div></div><div class=\"rnat\">그리고 그들이 했어야 할 모든 것은 그들의 경험을 개인적인 가치로 긍정적으로 재구성하면서 그것에 대해 성찰하고 쓰는 것이었다.</div><div class=\"rst\">한 일은 그저 돌아보고 쓰면서, 내 가치로 경험을 <b>좋게 다시 짜 본</b>(reframing) 것뿐이에요. 지문 8번이 이 실험의 핵심이에요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">Journaling about daily activities</div><div class=\"k\">일상의 활동에 대해 일기를 쓰는 것은</div></div><div class=\"rc ckc\"><div class=\"e\">based on what we believe to be <span class=\"cw\">worthwhile</span></div><div class=\"k\">우리가 <span class=\"cw\">가치 있다고</span> 믿는 것에 근거하여 ※ 문제지엔 빈칸으로 되어 있음 (정답: worthwhile)</div></div><div class=\"rc\"><div class=\"e\">can make us feel that our life is meaningful</div><div class=\"k\">우리가 자신의 삶이 의미 있다고 느끼게 만들 수 있다</div></div><div class=\"rc ckc\"><div class=\"e\">by <span class=\"cw\">rethinking</span> our experiences in a new way.</div><div class=\"k\">새로운 방식으로 자신의 경험을 <span class=\"cw\">다시 생각함으로써</span> ※ 문제지엔 빈칸으로 되어 있음 (정답: rethinking)</div></div><div class=\"rnat\">우리가 (A)가치 있다고 믿는 것에 근거하여 일상의 활동에 대해 일기를 쓰는 것은 새로운 방식으로 자신의 경험을 (B)다시 생각함으로써 우리가 자신의 삶이 의미 있다는 것을 느끼게 만들 수 있다.</div><div class=\"rst\">정리하면, <b>가치 있다고</b>(worthwhile) 믿는 것을 바탕으로 쓰고 경험을 <b>다시 생각하면</b>(rethinking) 삶이 의미 있게 느껴져요. 2·8번을 옮긴 요약이에요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"reflective journaling\" data-m=\"성찰적 일기 쓰기\"><b>reflective journaling</b>성찰적 일기 쓰기</button><button type=\"button\" class=\"wdb\" data-w=\"undergraduate student\" data-m=\"학부생\"><b>undergraduate student</b>학부생</button><button type=\"button\" class=\"wdb\" data-w=\"perspective\" data-m=\"관점\"><b>perspective</b>관점</button><button type=\"button\" class=\"wdb\" data-w=\"hassle\" data-m=\"귀찮은 일\"><b>hassle</b>귀찮은 일</button><button type=\"button\" class=\"wdb\" data-w=\"demonstration\" data-m=\"보여 주는 것, 사례\"><b>demonstration</b>보여 주는 것, 사례</button><button type=\"button\" class=\"wdb\" data-w=\"worthwhile\" data-m=\"가치 있는\"><b>worthwhile</b>가치 있는</button></div>", "11": "<p class=\"mtr\">마더텅 정답률 <b>60%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">속담형 제목은 <b>명령문(Try to ~)</b>이 담은 충고를 찾아 우리말로 풀어 맞춰요. 5번 “<b>한 번에 한 종류만</b>”이 11번 “<b>one at a time</b>(한 번에 하나씩)”으로 되풀이되니, ‘감당할 만큼만 하라’는 속담이 정답이에요.</p><div class=\"ck-step\"><span class=\"lab\">2번 문장 · 문제 상황</span><div class=\"en\">We often try to <mark>absorb too much</mark> in too many ways, …</div><p class=\"ko\">우리는 흔히 <mark>너무 많은 것을 흡수하려고</mark> 노력한다</p></div><div class=\"ck-via\"><i>▼</i><span>3번 질문 “살아남는 법이 있나?”에 4번 Yes(그렇다) 다음 바로 나온 답이에요</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 문장 · 결론 신호(명령문)</span><div class=\"en\">Try to <mark>stick to one type of media at a time</mark>.</div><p class=\"ko\"><mark>한 번에</mark> <mark>한 종류의 매체에(만) 충실하려고</mark> 노력하라.</p></div><div class=\"ck-via\"><i>▼</i><span>왜 하나만 해야 하는지: 집중력이 제한되어 있어서(6번)</span></div><div class=\"ck-step\"><span class=\"lab\">7번 문장 · 이유</span><div class=\"en\">If we try to absorb <mark>too many things at once</mark>, they often conflict.</div><p class=\"ko\">만약 우리가 <mark>한 번에 너무 많은 것들을</mark> 흡수하려고 노력하면, 그것들은 종종 충돌한다.</p></div><div class=\"ck-via\"><i>▼</i><span>5번의 at a time(한 번에)을 마지막에 한 번 더 못 박아요</span></div><div class=\"ck-step key\"><span class=\"lab\">11번 문장 · 마지막 결론</span><div class=\"en\">Many forms of communication are only really enjoyed <mark>one at a time</mark>.</div><p class=\"ko\">많은 형태의 통신 수단들은 오직 <mark>한 번에 하나씩(사용될 때에만)</mark> 제대로 즐겨질 뿐이다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">Don't Bite off More Than You Can Chew 씹을 수 있는 것보다 더 많이 베어 물지 마라<small>감당할 만큼만 하라 = 5·11번의 “한 번에 하나씩”이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">Two Heads Are Better Than One 두 머리가 하나보다 낫다</span><span class=\"why\">[지문에 없음] ‘둘이 힘을 합치면 낫다’는 협력 이야기예요. 지문은 사람끼리 협력이 아니라 매체를 한 번에 하나만 쓰라는(5번) 이야기예요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">Don't Judge a Book by Its Cover 겉모습으로 판단하지 마라</span><span class=\"why\">[지문에 없음] 겉모습과 속을 비교하는 내용은 없어요. 지문은 매체를 한 번에 하나만 쓰라는 이야기예요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">The Early Bird Catches the Worm 일찍 일어나는 새가 벌레를 잡는다</span><span class=\"why\">[지문에 없음] 부지런함·시간 이야기는 없어요. 5번의 충고는 일찍이 아니라 한 번에 하나씩이에요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">A Friend in Need Is a Friend Indeed 어려울 때 친구가 진짜 친구다</span><span class=\"why\">[지문에 없음] 친구·우정 이야기는 없어요. 1번의 문자·전화도 친구 이야기가 아니라 넘치는 매체의 예시예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">With thousands of websites, television channels, text messages, and phone calls,</div><div class=\"k\">수천 개의 웹사이트, 텔레비전 채널, 문자 메시지, 그리고 전화 통화로 인해</div></div><div class=\"rc\"><div class=\"e\">it is easy to become drowned</div><div class=\"k\">빠지게 되기 쉽다</div></div><div class=\"rc\"><div class=\"e\">in a flood of media.</div><div class=\"k\">매체의 홍수에</div></div><div class=\"rnat\">수천 개의 웹사이트, 텔레비전 채널, 문자 메시지, 그리고 전화 통화로 인해 (우리는) 매체의 홍수에 빠지게 되기 쉽다.</div><div class=\"rst\">시험 기간에 내 방 책상을 떠올려 봐요. 유튜브, 웹툰, 카톡, 전화가 한꺼번에 쏟아져요. = 지문 1번, 매체의 <b>홍수</b>에 빠지기 쉽다는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">We often try to absorb too much</div><div class=\"k\">우리는 흔히 너무 많은 것을 흡수하려고 노력한다</div></div><div class=\"rc\"><div class=\"e\">in too many ways,</div><div class=\"k\">너무 많은 방법들로</div></div><div class=\"rc\"><div class=\"e\">to enjoy music</div><div class=\"k\">음악을 즐기는 것처럼</div></div><div class=\"rc\"><div class=\"e\">while at the same time e-mailing someone on our laptops</div><div class=\"k\">동시에 우리의 노트북 컴퓨터로 누군가에게 이메일을 보내면서</div></div><div class=\"rc\"><div class=\"e\">and being interrupted by constant messages</div><div class=\"k\">그리고 끊임없는 메시지의 방해를 받으면서</div></div><div class=\"rc\"><div class=\"e\">on our mobile phones.</div><div class=\"k\">우리의 휴대폰으로 (보내지는)</div></div><div class=\"rnat\">우리는 우리의 노트북 컴퓨터로 누군가에게 이메일을 보내고 우리의 휴대폰으로 (보내지는) 끊임없는 메시지의 방해를 받는 동시에 음악을 즐기는 것처럼, 흔히 너무 많이(많은 것을) 너무 많은 방법들로 흡수하려고 노력한다.</div><div class=\"rst\">음악 틀고, 노트북으로 숙제 메일 보내고, 폰 알림까지 계속 확인해요. 지문 2번처럼 <b>너무 많은 걸 한꺼번에</b> 받아들이려는 거예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Is there any one thing</div><div class=\"k\">어느 한 가지라도 있는가</div></div><div class=\"rc\"><div class=\"e\">I have learned</div><div class=\"k\">내가 배웠던</div></div><div class=\"rc\"><div class=\"e\">to help me survive?</div><div class=\"k\">내가 살아남는 것을 도와주도록</div></div><div class=\"rnat\">내가 살아남는 것을 도와주도록 내가 배웠던 어느 한 가지라도 있는가?</div><div class=\"rst\">“이 속에서 버틸 방법이 하나라도 있을까?” 지문 3번이 이렇게 질문을 던져요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Yes.</div><div class=\"k\">그렇다(있다).</div></div><div class=\"rnat\">그렇다(있다).</div><div class=\"rst\">있어요! 지문 4번의 Yes(그렇다)는 바로 뒤에 답이 나온다는 신호예요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Try to stick to one type of media</span></div><div class=\"k\"><span class=\"cw\">한 종류의 매체에(만) 충실하려고 노력하라</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">at a time.</span></div><div class=\"k\"><span class=\"cw\">한 번에</span></div></div><div class=\"rnat\">한 번에 한 종류의 매체에(만) 충실하려고 노력하라.</div><div class=\"rst\"><b>한 번에 하나만</b> 하라는 거예요. 공부할 땐 폰을 엎어 두고 책만 봐요. 지문 5번이 글 전체의 충고예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">To a large extent</div><div class=\"k\">대체로</div></div><div class=\"rc\"><div class=\"e\">we have a very limited ability</div><div class=\"k\">우리는 매우 제한된 능력을 가지고 있다</div></div><div class=\"rc\"><div class=\"e\">to focus.</div><div class=\"k\">집중하는 데</div></div><div class=\"rnat\">대체로 우리는 집중하는 데 매우 제한된 능력을 가지고 있다.</div><div class=\"rst\">우리 머리는 한꺼번에 많은 데 집중하지 못해요. = 지문 6번, 집중하는 능력이 매우 제한되어 있다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">If we try to absorb</div><div class=\"k\">만약 우리가 흡수하려고 노력하면</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">too many things at once,</span></div><div class=\"k\"><span class=\"cw\">한 번에 너무 많은 것들을</span></div></div><div class=\"rc\"><div class=\"e\">they often conflict.</div><div class=\"k\">그것들(= 너무 많은 것들)은 종종 충돌한다</div></div><div class=\"rnat\">만약 우리가 한 번에 너무 많은 것들을 흡수하려고 노력하면, 그것들은 종종 충돌한다.</div><div class=\"rst\">음악 가사와 영어 단어가 머릿속에서 서로 부딪혀요. 지문 7번처럼 한꺼번에 받아들이면 <b>충돌</b>(conflict)해요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">Just the action of talking</div><div class=\"k\">그저 말하는 행위가</div></div><div class=\"rc\"><div class=\"e\">takes up much of our working memory.</div><div class=\"k\">우리의 작동 기억의 대부분을 차지한다</div></div><div class=\"rnat\">그저 말하는 행위가(행위조차도) 우리의 작동 기억의 대부분을 차지한다.</div><div class=\"rst\">친구랑 통화만 해도 머리가 꽤 바빠요. 지문 8번, 말하기만으로도 작업 기억을 많이 차지한다는 말이에요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">Trying to talk about complex subjects</div><div class=\"k\">복잡한 주제에 대해 말하려고 노력하는 것은</div></div><div class=\"rc\"><div class=\"e\">and drive well at the same time</div><div class=\"k\">그리고 동시에 운전을 잘 하려고 노력하는 것은</div></div><div class=\"rc\"><div class=\"e\">pushes our abilities to their limits.</div><div class=\"k\">우리의 능력들을 그것들(= 우리의 능력들)의 한계점까지 밀어붙인다</div></div><div class=\"rnat\">복잡한 주제에 대해 말하면서 동시에 운전을 잘 하려고 노력하는 것은 우리의 능력들을 그것들(우리의 능력들)의 한계점까지 밀어붙인다.</div><div class=\"rst\">아빠가 운전하며 어려운 통화를 하면 둘 다 힘들어져요. = 지문 9번, 능력을 한계까지 밀어붙인다는 예예요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">This is one of the reasons</div><div class=\"k\">이것이 이유들 중 하나다</div></div><div class=\"rc\"><div class=\"e\">why people still go to cinemas for good films;</div><div class=\"k\">사람들이 여전히 좋은 영화를 (관람하기) 위해 극장에 가는</div></div><div class=\"rc\"><div class=\"e\">it is a full experience</div><div class=\"k\">그것은 하나의 완전한 경험이다 ※ 문제지엔 빈칸으로 되어 있음 (정답: full)</div></div><div class=\"rc\"><div class=\"e\">because all mobile phones are switched off.</div><div class=\"k\">모든 휴대폰들이 꺼지기 때문에</div></div><div class=\"rnat\">이것이 사람들이 여전히 좋은 영화를 (관람하기) 위해 극장에 가는 이유들 중 하나다. 모든 휴대폰들이 꺼지기 때문에 그것은 하나의 완전한 경험이 되는 것이다.</div><div class=\"rst\">그래서 영화관이 좋아요. 모두 폰을 꺼서 영화 하나에만 푹 빠져요. 지문 10번, 그래서 사람들이 아직도 극장에 간다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"11\"><span class=\"rn\">11번 · 단서</span><div class=\"rc\"><div class=\"e\">Many forms of communication</div><div class=\"k\">많은 형태의 통신 수단들은</div></div><div class=\"rc\"><div class=\"e\">are only really enjoyed</div><div class=\"k\">오직 제대로 즐겨질 뿐이다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">one at a time.</span></div><div class=\"k\"><span class=\"cw\">한 번에 하나씩(사용될 때에만)</span></div></div><div class=\"rnat\">많은 형태의 통신 수단들은 오직 한 번에 하나씩(사용될 때에만) 제대로 즐겨질 뿐이다.</div><div class=\"rst\">결국 <b>한 번에 하나씩</b>(one at a time) 할 때 제대로 즐겨요. 지문 11번이 5번을 되풀이하니, 제목은 “감당할 만큼만 하라”예요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"a flood of\" data-m=\"홍수처럼 밀려드는\"><b>a flood of</b>홍수처럼 밀려드는</button><button type=\"button\" class=\"wdb\" data-w=\"absorb\" data-m=\"받아들이다, 흡수하다\"><b>absorb</b>받아들이다, 흡수하다</button><button type=\"button\" class=\"wdb\" data-w=\"constant\" data-m=\"끊임없는\"><b>constant</b>끊임없는</button><button type=\"button\" class=\"wdb\" data-w=\"stick to\" data-m=\"~을 고수하다\"><b>stick to</b>~을 고수하다</button><button type=\"button\" class=\"wdb\" data-w=\"conflict\" data-m=\"충돌하다\"><b>conflict</b>충돌하다</button><button type=\"button\" class=\"wdb\" data-w=\"working memory\" data-m=\"작업 기억\"><b>working memory</b>작업 기억</button></div>", "12": "<p class=\"mtr\">마더텅 정답률 <b>40%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸 바로 뒤 <b>because</b>(~ 때문에)가 답을 정해요. <b>폰이 모두 꺼져 방해가 없다</b> → 영화 하나에만 빠지는 경험이고, 11번 <b>one at a time</b>(한 번에 하나씩)이 그 뜻을 굳혀 줘요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (10번)</span><div class=\"en\">… it is a <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span></span> experience <mark>because all mobile phones are switched off</mark>.</div><p class=\"ko\"><mark>모든 휴대폰들이 꺼지기 때문에</mark> 그것은 하나의 ( ? ) 경험이다</p></div><div class=\"ck-via\"><i>▼</i><span>한꺼번에는 안 된다 = 5번 충고(한 번에 하나만)의 이유예요</span></div><div class=\"ck-step\"><span class=\"lab\">7번 문장 · 한꺼번에는 충돌</span><div class=\"en\">If we try to absorb <mark>too many things at once</mark>, they often conflict.</div><p class=\"ko\">만약 우리가 <mark>한 번에 너무 많은 것들을</mark> 흡수하려고 노력하면, 그것들은 종종 충돌한다.</p></div><div class=\"ck-via\"><i>▼</i><span>한 번에 하나일 때만 제대로 즐긴다 = 방해 없이 꽉 찬 경험</span></div><div class=\"ck-step key\"><span class=\"lab\">11번 문장 · 결정적 단서</span><div class=\"en\">Many forms of communication are <mark>only really enjoyed one at a time</mark>.</div><p class=\"ko\">많은 형태의 통신 수단들은 한 번에 하나씩(사용될 때에만) <mark>오직 제대로 즐겨질 뿐이다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">full 온전한, 충만한<small>폰이 꺼져 영화 하나에만 빠지니 경험이 꽉 차요(10·11번)</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">painful 고통스러운</span><span class=\"why\">폰을 꺼야 해서 답답하다고 생각하면 끌려요. 하지만 10번은 사람들이 여전히 극장에 가는 이유, 즉 좋은 점을 말하는 문장이에요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">wrong 잘못된</span><span class=\"why\">10번은 극장에 가는 이유(one of the reasons 이유들 중 하나)라서 좋은 경험이어야 해요. 잘못된 경험이면 갈 이유가 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">indirect 간접적인</span><span class=\"why\">폰이 꺼져 방해 없이 영화를 직접 즐기는 거예요. 11번 really enjoyed(제대로 즐겨진다)와 간접적인 경험은 맞지 않아요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">moral 도덕적인</span><span class=\"why\">지문은 집중(6번)과 방해 이야기예요. 옳고 그름을 따지는 도덕 이야기는 하나도 없어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">With thousands of websites, television channels, text messages, and phone calls,</div><div class=\"k\">수천 개의 웹사이트, 텔레비전 채널, 문자 메시지, 그리고 전화 통화로 인해</div></div><div class=\"rc\"><div class=\"e\">it is easy to become drowned</div><div class=\"k\">빠지게 되기 쉽다</div></div><div class=\"rc\"><div class=\"e\">in a flood of media.</div><div class=\"k\">매체의 홍수에</div></div><div class=\"rnat\">수천 개의 웹사이트, 텔레비전 채널, 문자 메시지, 그리고 전화 통화로 인해 (우리는) 매체의 홍수에 빠지게 되기 쉽다.</div><div class=\"rst\">시험 기간에 내 방 책상을 떠올려 봐요. 유튜브, 웹툰, 카톡, 전화가 한꺼번에 쏟아져요. = 지문 1번, 매체의 <b>홍수</b>에 빠지기 쉽다는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">We often try to absorb too much</div><div class=\"k\">우리는 흔히 너무 많은 것을 흡수하려고 노력한다</div></div><div class=\"rc\"><div class=\"e\">in too many ways,</div><div class=\"k\">너무 많은 방법들로</div></div><div class=\"rc\"><div class=\"e\">to enjoy music</div><div class=\"k\">음악을 즐기는 것처럼</div></div><div class=\"rc\"><div class=\"e\">while at the same time e-mailing someone on our laptops</div><div class=\"k\">동시에 우리의 노트북 컴퓨터로 누군가에게 이메일을 보내면서</div></div><div class=\"rc\"><div class=\"e\">and being interrupted by constant messages</div><div class=\"k\">그리고 끊임없는 메시지의 방해를 받으면서</div></div><div class=\"rc\"><div class=\"e\">on our mobile phones.</div><div class=\"k\">우리의 휴대폰으로 (보내지는)</div></div><div class=\"rnat\">우리는 우리의 노트북 컴퓨터로 누군가에게 이메일을 보내고 우리의 휴대폰으로 (보내지는) 끊임없는 메시지의 방해를 받는 동시에 음악을 즐기는 것처럼, 흔히 너무 많이(많은 것을) 너무 많은 방법들로 흡수하려고 노력한다.</div><div class=\"rst\">음악 틀고, 노트북으로 숙제 메일 보내고, 폰 알림까지 계속 확인해요. 지문 2번처럼 <b>너무 많은 걸 한꺼번에</b> 받아들이려는 거예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Is there any one thing</div><div class=\"k\">어느 한 가지라도 있는가</div></div><div class=\"rc\"><div class=\"e\">I have learned</div><div class=\"k\">내가 배웠던</div></div><div class=\"rc\"><div class=\"e\">to help me survive?</div><div class=\"k\">내가 살아남는 것을 도와주도록</div></div><div class=\"rnat\">내가 살아남는 것을 도와주도록 내가 배웠던 어느 한 가지라도 있는가?</div><div class=\"rst\">“이 속에서 버틸 방법이 하나라도 있을까?” 지문 3번이 이렇게 질문을 던져요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Yes.</div><div class=\"k\">그렇다(있다).</div></div><div class=\"rnat\">그렇다(있다).</div><div class=\"rst\">있어요! 지문 4번의 Yes(그렇다)는 바로 뒤에 답이 나온다는 신호예요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Try to stick to one type of media</div><div class=\"k\">한 종류의 매체에(만) 충실하려고 노력하라</div></div><div class=\"rc\"><div class=\"e\">at a time.</div><div class=\"k\">한 번에</div></div><div class=\"rnat\">한 번에 한 종류의 매체에(만) 충실하려고 노력하라.</div><div class=\"rst\"><b>한 번에 하나만</b> 하라는 거예요. 공부할 땐 폰을 엎어 두고 책만 봐요. 지문 5번이 글 전체의 충고예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">To a large extent</div><div class=\"k\">대체로</div></div><div class=\"rc\"><div class=\"e\">we have a very limited ability</div><div class=\"k\">우리는 매우 제한된 능력을 가지고 있다</div></div><div class=\"rc\"><div class=\"e\">to focus.</div><div class=\"k\">집중하는 데</div></div><div class=\"rnat\">대체로 우리는 집중하는 데 매우 제한된 능력을 가지고 있다.</div><div class=\"rst\">우리 머리는 한꺼번에 많은 데 집중하지 못해요. = 지문 6번, 집중하는 능력이 매우 제한되어 있다는 말이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">If we try to absorb</div><div class=\"k\">만약 우리가 흡수하려고 노력하면</div></div><div class=\"rc\"><div class=\"e\">too many things at once,</div><div class=\"k\">한 번에 너무 많은 것들을</div></div><div class=\"rc\"><div class=\"e\">they often conflict.</div><div class=\"k\">그것들(= 너무 많은 것들)은 종종 충돌한다</div></div><div class=\"rnat\">만약 우리가 한 번에 너무 많은 것들을 흡수하려고 노력하면, 그것들은 종종 충돌한다.</div><div class=\"rst\">음악 가사와 영어 단어가 머릿속에서 서로 부딪혀요. 지문 7번처럼 한꺼번에 받아들이면 <b>충돌</b>(conflict)해요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">Just the action of talking</div><div class=\"k\">그저 말하는 행위가</div></div><div class=\"rc\"><div class=\"e\">takes up much of our working memory.</div><div class=\"k\">우리의 작동 기억의 대부분을 차지한다</div></div><div class=\"rnat\">그저 말하는 행위가(행위조차도) 우리의 작동 기억의 대부분을 차지한다.</div><div class=\"rst\">친구랑 통화만 해도 머리가 꽤 바빠요. 지문 8번, 말하기만으로도 작업 기억을 많이 차지한다는 말이에요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">Trying to talk about complex subjects</div><div class=\"k\">복잡한 주제에 대해 말하려고 노력하는 것은</div></div><div class=\"rc\"><div class=\"e\">and drive well at the same time</div><div class=\"k\">그리고 동시에 운전을 잘 하려고 노력하는 것은</div></div><div class=\"rc\"><div class=\"e\">pushes our abilities to their limits.</div><div class=\"k\">우리의 능력들을 그것들(= 우리의 능력들)의 한계점까지 밀어붙인다</div></div><div class=\"rnat\">복잡한 주제에 대해 말하면서 동시에 운전을 잘 하려고 노력하는 것은 우리의 능력들을 그것들(우리의 능력들)의 한계점까지 밀어붙인다.</div><div class=\"rst\">운전하면서 어려운 통화까지 하면 둘 다 엉망이 되기 쉬워요. = 지문 9번, 능력을 한계까지 밀어붙인다는 예예요.</div></div><div class=\"rds key\" data-ord=\"10\"><span class=\"rn\">10번 · 단서</span><div class=\"rc\"><div class=\"e\">This is one of the reasons</div><div class=\"k\">이것이 이유들 중 하나다</div></div><div class=\"rc\"><div class=\"e\">why people still go to cinemas for good films;</div><div class=\"k\">사람들이 여전히 좋은 영화를 (관람하기) 위해 극장에 가는</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">it is a full experience</span></div><div class=\"k\">그것은 <span class=\"cw\">하나의 완전한 경험이다</span> ※ 문제지엔 빈칸으로 되어 있음 (정답: full)</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">because all mobile phones are switched off.</span></div><div class=\"k\"><span class=\"cw\">모든 휴대폰들이 꺼지기 때문에</span></div></div><div class=\"rnat\">이것이 사람들이 여전히 좋은 영화를 (관람하기) 위해 극장에 가는 이유들 중 하나다. 모든 휴대폰들이 꺼지기 때문에 그것은 하나의 완전한 경험이 되는 것이다.</div><div class=\"rst\">그래서 영화관이 좋아요. 모두 폰을 꺼서 방해가 하나도 없으니 영화에 <b>온전히</b> 빠져요. 그래서 지문 10번 빈칸은 full(온전한)이에요.</div></div><div class=\"rds key\" data-ord=\"11\"><span class=\"rn\">11번 · 단서</span><div class=\"rc\"><div class=\"e\">Many forms of communication</div><div class=\"k\">많은 형태의 통신 수단들은</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">are only really enjoyed</span></div><div class=\"k\"><span class=\"cw\">오직 제대로 즐겨질 뿐이다</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">one at a time.</span></div><div class=\"k\"><span class=\"cw\">한 번에 하나씩(사용될 때에만)</span></div></div><div class=\"rnat\">많은 형태의 통신 수단들은 오직 한 번에 하나씩(사용될 때에만) 제대로 즐겨질 뿐이다.</div><div class=\"rst\">결국 <b>한 번에 하나씩</b>(one at a time) 할 때 제대로 즐겨요. 지문 11번이 10번 빈칸 “온전한 경험”의 이유를 한 줄로 정리해요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"to a large extent\" data-m=\"상당한 정도로\"><b>to a large extent</b>상당한 정도로</button><button type=\"button\" class=\"wdb\" data-w=\"limited ability\" data-m=\"제한된 능력\"><b>limited ability</b>제한된 능력</button><button type=\"button\" class=\"wdb\" data-w=\"working memory\" data-m=\"작업 기억\"><b>working memory</b>작업 기억</button><button type=\"button\" class=\"wdb\" data-w=\"cinema\" data-m=\"영화관\"><b>cinema</b>영화관</button><button type=\"button\" class=\"wdb\" data-w=\"switc   for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
  mmInit();
}
/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(S.sub&&!S.mmS){S.mmS=1;S.mmP=1;save();WN.hw(lv,day,S.sub.s+'/'+N+(S.mmD?' ✓':''));}else if(!S.sub&&!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
