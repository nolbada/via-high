var EXP={"01": "<p class=\"mtr\">마더텅 정답률 <b>80%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">주장은 <b>However</b>(그러나)·<b>Instead</b>(대신) 뒤의 <b>명령문</b>에 있어요. 다이어트는 예시일 뿐이니, 반복되는 <b>outcome</b>(결과) 대 <b>process</b>(과정)의 대결을 잡으세요.</p><div class=\"ck-step\"><span class=\"lab\">5번 문장 · 반전 신호</span><div class=\"en\"><mark>However</mark>, if you end the discussion there, then the only feedback your friend is getting is about her progress toward <mark>an outcome</mark>.</div><p class=\"ko\"><mark>그러나</mark> 만약 당신이 거기서 대화를 끝낸다면, 친구가 받는 유일한 피드백은 <mark>결과</mark>를 향한 그녀의 진전에 대한 것(뿐)이다.</p></div><div class=\"ck-via\"><i>▼</i><span>However(그러나)로 ‘칭찬만 하고 끝내기’를 꺾은 뒤, 대신 할 일을 명령문으로 시켜요</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 명령문으로 대안 제시</span><div class=\"en\"><mark>Instead</mark>, <mark>continue the discussion</mark>.</div><p class=\"ko\"><mark>대신</mark>, <mark>그 대화를 계속해라</mark>.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>7번</em>성공하게 해 준 행동이 뭔지 물어라</span><span><em>8~10번</em>무엇을 먹는지·어디서 운동하는지·생활을 어떻게 바꿨는지</span></div><div class=\"ck-eq\">⇒ 질문들의 공통점 = 결과(몸무게)가 아니라 거기까지 간 과정을 묻기</div></div><div class=\"ck-via\"><i>▼</i><span>질문 예시를 한 줄로 정리하며 결론을 못 박아요</span></div><div class=\"ck-step key\"><span class=\"lab\">11번 문장 · 결정적 단서</span><div class=\"en\">When the conversation focuses on <mark>the process of change</mark> <mark>rather than the outcome</mark>, it reinforces the value of creating a sustainable process.</div><p class=\"ko\">그 대화가 <mark>결과보다는</mark> <mark>변화의 과정에</mark> 초점을 맞출 때, 그것은 지속 가능한 과정을 만들어 내는 것의 가치를 강화시킨다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">행동을 바꾸려는 사람과는 과정에 초점을 두어 대화해야 한다.<small>1번의 changing their behavior(행동을 바꾸다) + 11번의 process(과정)를 그대로 옮긴 말이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">효과적인 다이어트를 위해 구체적인 계획을 세워야 한다.</span><span class=\"why\">[범위 좁음] 2번의 diet(다이어트)는 예시일 뿐이에요. 필자는 다이어트하는 법이 아니라 그런 친구와 어떻게 대화할지를 말해요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">상대방의 감정을 고려하여 조언해야 한다.</span><span class=\"why\">[지문에 없음] 조언하라는 말은 없어요. 7~10번은 조언이 아니라 친구가 뭘 하고 있는지 묻는 질문이에요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">토론 중에는 지나치게 공격적인 질문을 삼가야 한다.</span><span class=\"why\">[반대] 6번은 오히려 continue the discussion(대화를 계속해라)이라고 하며 질문을 더 하라고 해요. 질문을 삼가라는 건 정반대예요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">지속적인 성장을 위해서는 단점보다 장점에 집중해야 한다.</span><span class=\"why\">[지문에 없음] 지문의 대결은 장점 대 단점이 아니라 outcome(결과) 대 process(과정)예요. 11번 sustainable(지속 가능한)만 보고 고르면 안 돼요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">How do you encourage other people</div><div class=\"k\">당신은 다른 사람들에게 어떻게 힘을 북돋아 주는가</div></div><div class=\"rc\"><div class=\"e\">when they are changing their behavior?</div><div class=\"k\">그들이 자신의 행동을 바꾸려고 하고 있을 때?</div></div><div class=\"rnat\">당신은 다른 사람들이 그들의 행동을 바꾸려고 하고 있을 때 어떻게 (그들에게) 힘을 북돋아 주는가?</div><div class=\"rst\">줄넘기로 살을 빼는 친구에게 어떻게 힘을 줄까요? 지문도 행동을 바꾸는 사람을 어떻게 격려하느냐고 물으며 시작해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Suppose you see a friend</div><div class=\"k\">당신이 한 친구를 만난다고 가정해 보자</div></div><div class=\"rc\"><div class=\"e\">who is on a diet</div><div class=\"k\">다이어트 중인</div></div><div class=\"rc\"><div class=\"e\">and has been losing a lot of weight.</div><div class=\"k\">그리고 몸무게가 많이 줄고 있는.</div></div><div class=\"rnat\">당신이 다이어트 중이며 몸무게가 많이 줄고 있는 한 친구를 만난다고 가정해 보자.</div><div class=\"rst\">반 친구가 매일 줄넘기를 해서 몸무게가 많이 줄었어요. = 지문의 ‘다이어트로 살이 많이 빠진 친구’예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">It’s tempting to tell her</div><div class=\"k\">그녀에게 말하는 것은 솔깃하다</div></div><div class=\"rc\"><div class=\"e\">that she looks great</div><div class=\"k\">그녀가 멋져 보인다고</div></div><div class=\"rc\"><div class=\"e\">and she must feel wonderful.</div><div class=\"k\">그리고 기분이 정말 좋겠다고.</div></div><div class=\"rnat\">그녀가 멋져 보이고 기분이 정말 좋겠다고 그녀에게 말하는 것은 솔깃할 것이다(말하고 싶을 것이다).</div><div class=\"rst\">보자마자 “와, 멋지다! 기분 좋겠다!” 하고 말하고 싶어져요. 지문도 이 말이 솔깃하다(tempting)고 해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">It feels good</div><div class=\"k\">기분이 좋고</div></div><div class=\"rc\"><div class=\"e\">for someone to hear positive comments,</div><div class=\"k\">누구든지 긍정적인 말을 듣는 것은,</div></div><div class=\"rc\"><div class=\"e\">and this feedback will often be encouraging.</div><div class=\"k\">이런 피드백(= 긍정적인 말)은 종종 힘을 북돋아 줄 것이다.</div></div><div class=\"rnat\">누구든지 긍정적인 말을 듣는 것은 기분이 좋고, 이런 피드백은 종종 힘을 북돋아 줄 것이다.</div><div class=\"rst\">칭찬을 들으면 친구도 기분이 좋고 힘이 나요. 지문도 긍정적인 말은 힘을 북돋아 준다고 인정해요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">However</span>, if you end the discussion there,</div><div class=\"k\"><span class=\"cw\">그러나</span> 만약 당신이 거기서 대화를 끝낸다면,</div></div><div class=\"rc\"><div class=\"e\">then the only feedback</div><div class=\"k\">그렇다면 유일한 피드백은</div></div><div class=\"rc\"><div class=\"e\">your friend is getting</div><div class=\"k\">당신의 친구가 받고 있는</div></div><div class=\"rc\"><div class=\"e\">is about her progress toward an outcome.</div><div class=\"k\">결과를 향한 그녀의 진전에 대한 것(뿐)이다.</div></div><div class=\"rnat\">그러나 만약 당신이 거기서 대화를 끝낸다면, 당신의 친구가 받게 되는 유일한 피드백은 결과를 향한 그녀의 진전에 대한 것(뿐)이다.</div><div class=\"rst\"><b>그런데</b>(However) 칭찬만 하고 끝내면, 친구는 ‘몇 킬로 빠졌다’는 <b>결과</b>(outcome) 얘기만 듣게 돼요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Instead,</span></div><div class=\"k\"><span class=\"cw\">대신,</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">continue the discussion.</span></div><div class=\"k\"><span class=\"cw\">그 대화를 계속해라.</span></div></div><div class=\"rnat\">대신, 그 대화를 계속해라.</div><div class=\"rst\"><b>대신</b>(Instead) 대화를 이어 가요. = 지문의 명령문 ‘그 대화를 계속해라’가 필자의 주장이에요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">Ask about what she is doing</div><div class=\"k\">그녀가 하고 있는 것이 무엇인지 물어라</div></div><div class=\"rc\"><div class=\"e\">that has allowed her to be successful.</div><div class=\"k\">그녀가 성공할 수 있게 해 준.</div></div><div class=\"rnat\">그녀에게 성공을 가능케 한 어떤 것을 하고 있는지 물어라.</div><div class=\"rst\">“어떻게 그렇게 해냈어?” 하고 물어봐요. 지문도 성공하게 해 준 행동이 뭔지 물으라고 해요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">What is she eating?</div><div class=\"k\">그녀가 무엇을 먹고 있는가?</div></div><div class=\"rnat\">그녀가 무엇을 먹고 있는가?</div><div class=\"rst\">“요즘 급식은 어떻게 먹어?” 지문의 첫 질문, 무엇을 먹는지예요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">Where is she working out?</div><div class=\"k\">그녀가 어디서 운동을 하고 있는가?</div></div><div class=\"rnat\">그녀가 어디서 운동을 하고 있는가?</div><div class=\"rst\">“줄넘기는 어디서 해? 운동장?” 지문의 두 번째 질문, 어디서 운동하는지예요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">What are the lifestyle changes</div><div class=\"k\">생활양식의 변화는 무엇인가</div></div><div class=\"rc\"><div class=\"e\">she has made?</div><div class=\"k\">그녀가 만들어 낸?</div></div><div class=\"rnat\">그녀가 만들어 낸 생활양식의 변화는 무엇인가?</div><div class=\"rst\">“밤에 야식은 끊었어?” 지문의 세 번째 질문, 생활을 어떻게 바꿨는지예요.</div></div><div class=\"rds key\" data-ord=\"11\"><span class=\"rn\">11번 · 단서</span><div class=\"rc\"><div class=\"e\">When the conversation focuses on</div><div class=\"k\">그 대화가 초점을 맞출 때</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">the process of change</span></div><div class=\"k\"><span class=\"cw\">변화의 과정에</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">rather than the outcome,</span></div><div class=\"k\"><span class=\"cw\">결과보다는,</span></div></div><div class=\"rc\"><div class=\"e\">it reinforces the value</div><div class=\"k\">그것(= 그 대화)은 가치를 강화시킨다</div></div><div class=\"rc\"><div class=\"e\">of creating a sustainable process.</div><div class=\"k\">지속 가능한 과정을 만들어 내는 것의.</div></div><div class=\"rnat\">그 대화가 결과보다 변화의 과정에 초점을 맞출 때, 그것은 지속 가능한 과정을 만들어 내는 것의 가치를 강화시킨다(변화를 위한 노력을 계속하게끔 북돋아준다).</div><div class=\"rst\">이렇게 결과보다 <b>과정</b>(process)을 물으면 친구는 계속 해낼 힘을 얻어요. 지문의 결론이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"tempting\" data-m=\"솔깃한, 유혹적인\"><b>tempting</b>솔깃한, 유혹적인</button><button type=\"button\" class=\"wdb\" data-w=\"encouraging\" data-m=\"힘을 북돋우는, 격려가 되는\"><b>encouraging</b>힘을 북돋우는, 격려가 되는</button><button type=\"button\" class=\"wdb\" data-w=\"outcome\" data-m=\"결과\"><b>outcome</b>결과</button><button type=\"button\" class=\"wdb\" data-w=\"process\" data-m=\"과정\"><b>process</b>과정</button><button type=\"button\" class=\"wdb\" data-w=\"reinforce\" data-m=\"강화시키다\"><b>reinforce</b>강화시키다</button><button type=\"button\" class=\"wdb\" data-w=\"sustainable\" data-m=\"지속 가능한\"><b>sustainable</b>지속 가능한</button></div>", "02": "<p class=\"mtr\">마더텅 정답률 <b>95%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">심경 변화는 <b>맨 앞 감정</b>과 <b>맨 뒤 감정</b>만 잡으면 돼요. 선생님 말씀을 <b>떠올리는 6번</b>이 꺾이는 지점이고, 몸의 반응(떨림 → 안정)이 감정을 그대로 보여 줘요.</p><div class=\"ck-step key\"><span class=\"lab\">2번 문장 · 처음 감정</span><div class=\"en\">I was <mark>deeply troubled and unhappy</mark>.</div><p class=\"ko\">나는 <mark>몹시 힘들고 불행했다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>속상한 마음이 몸의 떨림으로 드러나요</span></div><div class=\"ck-step\"><span class=\"lab\">3번 문장 · 몸으로 보이는 처음 감정</span><div class=\"en\">My body <mark>was shaking</mark> with <mark>uneasiness</mark>.</div><p class=\"ko\">내 몸은 <mark>불쾌감으로</mark> 떨리고 있었다.</p></div><div class=\"ck-via\"><i>▼</i><span>혼자 계단에 앉아 선생님 말씀을 떠올리며 분위기가 바뀌어요</span></div><div class=\"ck-step\"><span class=\"lab\">6번 문장 · 전환 지점</span><div class=\"en\">Sitting on the stairs alone, <mark>I recalled what my teacher had said</mark>.</div><p class=\"ko\">계단에 홀로 앉아, <mark>나는 나의 선생님께서 말씀하신 것을 기억해 냈다</mark>.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>7~8번</em>남을 이기는 게 아니라 나 자신이 되는 데서 이겨라</span><span><em>10~11번</em>친구와 맞설 이유 없음, 내 발전에 집중</span><span><em>12~13번</em>천천히 숨 내쉬기, 손이 안정됨</span></div><div class=\"ck-eq\">⇒ 생각이 바뀌자 몸도 가라앉아요 = 마음이 차분해지는 과정</div></div><div class=\"ck-via\"><i>▼</i><span>At last(마침내)로 바뀐 끝 감정을 확정해요</span></div><div class=\"ck-step key\"><span class=\"lab\">14번 문장 · 나중 감정</span><div class=\"en\">At last, <mark>my mind was at peace</mark>.</div><p class=\"ko\">마침내, <mark>내 마음은 평화로워졌다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">upset → calm 속상한 → 차분한<small>troubled(힘든)·shaking(떨리는) → steady(안정된)·at peace(평화로운), 양 끝이 딱 맞아요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">surprised → disappointed 놀란 → 실망한</span><span class=\"why\">앞이 틀려요. 2번은 놀란 게 아니라 deeply troubled(몹시 힘든) 상태예요. 뒤도 틀려요. 14번 at peace(평화로운)는 실망이 아니라 차분해진 거예요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">grateful → sorrowful 고마워하는 → 슬픈</span><span class=\"why\">방향이 거꾸로예요. 지문은 2번 troubled(힘든)에서 14번 at peace(평화로운)로 좋아지는데, 이 보기는 좋았다가 나빠져요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">envious → doubtful 부러워하는 → 의심하는</span><span class=\"why\">뒤가 틀려요. 9번에서 선생님 말씀이 absolutely right(틀림없이 옳았다)고 믿었으니 의심하는 마음이 아니에요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">bored → relieved 지루한 → 안도한</span><span class=\"why\">앞이 틀려요. 3~4번 몸이 떨리고 심장이 빨리 뛰는 건 지루함이 아니라 몹시 속상한 상태예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Once again,</div><div class=\"k\">또다시,</div></div><div class=\"rc\"><div class=\"e\">I had lost the piano contest</div><div class=\"k\">나는 피아노 경연대회에서 졌다</div></div><div class=\"rc\"><div class=\"e\">to my friend.</div><div class=\"k\">내 친구에게.</div></div><div class=\"rnat\">또다시, 나는 피아노 경연대회에서 내 친구에게 졌다.</div><div class=\"rst\">학교 합창 대회 피아노 반주 오디션에서 또 단짝에게 졌어요. 지문의 ‘또다시 친구에게 피아노 대회에서 졌다’예요.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">2번 · 단서</span><div class=\"rc\"><div class=\"e\">When I learned</div><div class=\"k\">내가 알게 되었을 때</div></div><div class=\"rc\"><div class=\"e\">that Linda had won,</div><div class=\"k\">Linda가 우승했다는 것을,</div></div><div class=\"rc ckc\"><div class=\"e\">I was <span class=\"cw\">deeply troubled and unhappy</span>.</div><div class=\"k\">나는 <span class=\"cw\">몹시 힘들고 불행했다</span>.</div></div><div class=\"rnat\">Linda가 우승했다는 것을 내가 알게 되었을 때, 나는 몹시 힘들고 불행했다.</div><div class=\"rst\">단짝이 뽑혔다는 걸 듣고 <b>너무 속상해요</b>. = 지문의 처음 감정, troubled and unhappy(힘들고 불행한)예요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc\"><div class=\"e\">My body was shaking</div><div class=\"k\">내 몸은 떨리고 있었다</div></div><div class=\"rc ckc\"><div class=\"e\">with <span class=\"cw\">uneasiness</span>.</div><div class=\"k\"><span class=\"cw\">불쾌감으로</span>.</div></div><div class=\"rnat\">내 몸은 불쾌감으로 떨리고 있었다.</div><div class=\"rst\">분해서 몸이 <b>부들부들 떨려요</b>. 지문도 불쾌감으로 몸이 떨렸다고 해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">My heart beat quickly</div><div class=\"k\">내 심장은 빠르게 뛰었고</div></div><div class=\"rc\"><div class=\"e\">and my face became reddish.</div><div class=\"k\">내 얼굴은 불그스름해졌다.</div></div><div class=\"rnat\">내 심장은 빠르게 뛰었고 내 얼굴은 불그스름해졌다.</div><div class=\"rst\">심장은 쿵쾅대고 얼굴은 빨개져요. 지문도 같은 몸의 반응으로 속상함을 보여 줘요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">I had to run out of the concert hall</div><div class=\"k\">나는 공연장으로부터 달아나야 했다</div></div><div class=\"rc\"><div class=\"e\">to settle down.</div><div class=\"k\">마음을 가라앉히기 위해.</div></div><div class=\"rnat\">나는 마음을 가라앉히기 위해 공연장으로부터 달아나야 했다.</div><div class=\"rst\">마음을 가라앉히려고 음악실 밖으로 뛰쳐나가요. 지문의 ‘공연장 밖으로 달려 나갔다’예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Sitting on the stairs alone,</div><div class=\"k\">계단에 홀로 앉아,</div></div><div class=\"rc\"><div class=\"e\">I recalled what my teacher had said.</div><div class=\"k\">나는 나의 선생님께서 말씀하신 것을 기억해 냈다.</div></div><div class=\"rnat\">계단에 홀로 앉아, 나는 나의 선생님께서 말씀하신 것을 기억해 냈다.</div><div class=\"rst\">복도 계단에 혼자 앉아 <b>쌤이 해 준 말을 떠올려요</b>. 지문은 여기서 분위기가 바뀌어요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">“Life is about winning,</div><div class=\"k\">“인생은 이기는 것에 관한 것인데,</div></div><div class=\"rc\"><div class=\"e\">not necessarily about winning against others</div><div class=\"k\">반드시 다른 이들을 상대로 이기는 것에 관한 것이 아니라</div></div><div class=\"rc\"><div class=\"e\">but winning at being you.</div><div class=\"k\">너 자신이 되는 것에서 이기는 것이다.</div></div><div class=\"rnat\">\"인생은 이기는 것에 관한 것인데, 반드시 다른 이들을 상대로 이기는 것에 관한 것이 아니라 너 자신이 되는 것에서 이기는 것이다.\"</div><div class=\"rst\">“남을 이기는 게 다가 아니야. 너다운 네가 되는 데서 이기는 거야.” 지문 속 선생님 말씀이에요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">And the way to win</div><div class=\"k\">그리고 이기는 방법은</div></div><div class=\"rc\"><div class=\"e\">is to figure out who you are</div><div class=\"k\">너 자신이 누구인가를 알아내고</div></div><div class=\"rc\"><div class=\"e\">and do your best.”</div><div class=\"k\">최선을 다하는 것이다.”</div></div><div class=\"rnat\">\"그리고 이기는 방법은 너 자신이 누구인가를 알아내고 최선을 다하는 것이다.\"</div><div class=\"rst\">“네가 누군지 알고 최선을 다하면 그게 이기는 거야.” 지문도 이기는 방법을 이렇게 말해요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">He was absolutely right.</div><div class=\"k\">그가 틀림없이 옳았다.</div></div><div class=\"rnat\">그가 틀림없이 옳았다.</div><div class=\"rst\">생각해 보니 쌤 말씀이 딱 맞아요. 지문도 그가 틀림없이 옳았다고 해요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">I had no reason</div><div class=\"k\">나는 이유가 없었다</div></div><div class=\"rc\"><div class=\"e\">to oppose my friend.</div><div class=\"k\">내 친구를 적대할.</div></div><div class=\"rnat\">나는 내 친구를 적대할 이유가 없었다.</div><div class=\"rst\">단짝을 미워할 이유가 하나도 없어요. 지문의 ‘친구를 적대할 이유가 없었다’예요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">Instead,</div><div class=\"k\">대신,</div></div><div class=\"rc\"><div class=\"e\">I should focus on myself</div><div class=\"k\">나는 나 자신에게 집중해야 한다</div></div><div class=\"rc\"><div class=\"e\">and my own improvement.</div><div class=\"k\">그리고 나 자신의 발전에.</div></div><div class=\"rnat\">대신, 나는 나 자신과 나 자신의 발전에 집중해야 한다.</div><div class=\"rst\">대신 내 연습과 내 실력에 집중하면 돼요. 지문도 나 자신의 발전에 집중하자고 해요.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><div class=\"rc\"><div class=\"e\">I breathed out slowly.</div><div class=\"k\">나는 천천히 숨을 내쉬었다.</div></div><div class=\"rnat\">나는 천천히 숨을 내쉬었다.</div><div class=\"rst\">후— 하고 천천히 숨을 내쉬어요. 지문도 천천히 숨을 내쉬며 마음이 풀리기 시작해요.</div></div><div class=\"rds key\" data-ord=\"13\"><span class=\"rn\">13번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">My hands were <span class=\"cw\">steady</span> now.</div><div class=\"k\">내 손은 이제 <span class=\"cw\">안정되었다</span>.</div></div><div class=\"rnat\">내 손은 이제 안정되었다.</div><div class=\"rst\">떨리던 손이 이제 <b>멈췄어요</b>. = 지문의 steady(안정된), 3번의 떨림과 반대예요.</div></div><div class=\"rds key\" data-ord=\"14\"><span class=\"rn\">14번 · 단서</span><div class=\"rc\"><div class=\"e\">At last,</div><div class=\"k\">마침내,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">my mind was at peace</span>.</div><div class=\"k\"><span class=\"cw\">내 마음은 평화로워졌다</span>.</div></div><div class=\"rnat\">마침내, 내 마음은 평화로워졌다.</div><div class=\"rst\">마침내 마음이 <b>평화로워요</b>. = 지문의 나중 감정, at peace(평화로운) 즉 차분해졌어요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"troubled\" data-m=\"괴로운, 힘든\"><b>troubled</b>괴로운, 힘든</button><button type=\"button\" class=\"wdb\" data-w=\"uneasiness\" data-m=\"불쾌감, 불안\"><b>uneasiness</b>불쾌감, 불안</button><button type=\"button\" class=\"wdb\" data-w=\"settle down\" data-m=\"마음을 가라앉히다, 진정하다\"><b>settle down</b>마음을 가라앉히다, 진정하다</button><button type=\"button\" class=\"wdb\" data-w=\"recall\" data-m=\"기억해 내다, 떠올리다\"><b>recall</b>기억해 내다, 떠올리다</button><button type=\"button\" class=\"wdb\" data-w=\"oppose\" data-m=\"반대하다, 적대하다\"><b>oppose</b>반대하다, 적대하다</button><button type=\"button\" class=\"wdb\" data-w=\"steady\" data-m=\"안정된, 흔들리지 않는\"><b>steady</b>안정된, 흔들리지 않는</button></div>", "03": "<p class=\"mtr\">마더텅 정답률 <b>90%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">요지는 <b>문제 → 해결책</b> 짝으로 나와요. 2번 “<b>피하기 어렵다</b>(difficult to avoid)”가 문제, 3번 “<b>사회적 대응</b>(societal action)”이 해결책이에요. 4~5번은 그 이유를 보여 주는 사례예요.</p><div class=\"ck-step key\"><span class=\"lab\">2번 문장 · 문제 제기</span><div class=\"en\">Some environmental contaminants are <mark>difficult to avoid</mark> … in these circumstances, exposure is largely <mark>involuntary</mark>.</div><p class=\"ko\">일부 환경 오염 물질은 <mark>피하기 어렵다</mark> … 이러한 상황에서, 노출은 대체로 <mark>자기도 모르게 이루어진다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>these factors(이런 요인들) = 2번의 피하기 어려운 오염 물질, 그 해결책을 말해요</span></div><div class=\"ck-step key\"><span class=\"lab\">3번 문장 · 결정적 요지</span><div class=\"en\">Reduction or elimination of these factors may require <mark>societal action</mark>, such as public awareness and public health measures.</div><p class=\"ko\">이런 요인들의 감소나 제거는 대중의 인식과 공공 보건 조치와 같은 <mark>사회적 대응을</mark> 필요로 할 수도 있다.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>4번</em>개인이 피하기 어려운 위험이 더 나쁘게 느껴짐</span><span><em>5번</em>비소 섞인 물·식당 간접흡연 → 내가 담배 피우는 것보다 더 화가 남</span></div><div class=\"ck-eq\">⇒ 두 사례의 공통점 = 개인이 못 피하는 위험이라 혼자 해결 못 함 (2·3번을 뒷받침)</div></div><div class=\"ck-via\"><i>▼</i><span>These factors(이런 요인들)로 앞 내용을 묶어, 위험을 줄일 때 꼭 따져야 한다고 마무리해요</span></div><div class=\"ck-step\"><span class=\"lab\">6번 문장 · 요지 다시 확인</span><div class=\"en\">These factors are important when one considers how change (risk reduction) happens.</div><p class=\"ko\">이런 요인들은 어떻게 변화(위험 감소)가 일어나는지를 고려할 때 중요하다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">개인이 피하기 어려운 유해 환경 요인에 대해서는 사회적 대응이 필요하다.<small>2번 difficult to avoid(피하기 어려운) + 3번 societal action(사회적 대응)을 그대로 옮겼어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">다수의 건강을 해치는 행위에 대해 도덕적 비난 이상의 조치가 요구된다.</span><span class=\"why\">[지문에 없음] 4번 morally(도덕적으로)를 이용한 함정이에요. 4번은 사람들이 더 나쁘게 ‘느낀다’는 사례일 뿐, 비난보다 센 조치를 하라는 말은 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">환경오염으로 인한 피해자들에게 적절한 보상을 하는 것이 바람직하다.</span><span class=\"why\">[지문에 없음] 보상 얘기는 한 번도 안 나와요. 3번의 해결책은 보상이 아니라 Reduction or elimination(감소나 제거)이에요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">환경오염 문제를 해결하기 위해서는 사후 대응보다 예방이 중요하다.</span><span class=\"why\">[지문에 없음] 지문은 예방과 사후 대응을 비교하지 않아요. 대결 축은 개인이 피할 수 있느냐 없느냐예요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">대기오염 문제는 인접 국가들과의 긴밀한 협력을 통해 해결할 수 있다.</span><span class=\"why\">[범위 좁음] 2번 polluted air(오염된 공기)는 예시 하나일 뿐이고, 이웃 나라와의 협력은 지문에 없어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Environmental hazards include</div><div class=\"k\">환경 위험 요인들은 포함한다</div></div><div class=\"rc\"><div class=\"e\">biological, physical, and chemical ones,</div><div class=\"k\">생물학적, 물리적, 화학적인 것들을,</div></div><div class=\"rc\"><div class=\"e\">along with the human behaviors</div><div class=\"k\">인간의 행동과 함께</div></div><div class=\"rc\"><div class=\"e\">that promote or allow exposure.</div><div class=\"k\">노출을 촉진하거나 허용하는.</div></div><div class=\"rnat\">환경 위험 요인들은 노출을 촉진하거나 허용하는 인간의 행동과 함께 생물학적, 물리적, 화학적인 것들을 포함한다.</div><div class=\"rst\">학교에도 우리를 아프게 할 수 있는 것들이 있어요. 지문도 환경 위험 요인에는 여러 종류와 사람의 행동이 있다고 해요.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">2번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">Some environmental contaminants are <span class=\"cw\">difficult to avoid</span></div><div class=\"k\">일부 환경 오염 물질은 <span class=\"cw\">피하기 어렵다</span></div></div><div class=\"rc\"><div class=\"e\">(the breathing of polluted air,</div><div class=\"k\">(오염된 공기의 호흡,</div></div><div class=\"rc\"><div class=\"e\">the drinking of chemically contaminated public drinking water,</div><div class=\"k\">화학적으로 오염된 공공 식수의 음용,</div></div><div class=\"rc\"><div class=\"e\">noise in open public spaces);</div><div class=\"k\">개방된 공공장소에서의 소음 등);</div></div><div class=\"rc\"><div class=\"e\">in these circumstances,</div><div class=\"k\">이러한 상황에서,</div></div><div class=\"rc ckc\"><div class=\"e\">exposure is largely <span class=\"cw\">involuntary</span>.</div><div class=\"k\">노출은 대체로 <span class=\"cw\">자기도 모르게 이루어진다</span>.</div></div><div class=\"rnat\">(오염된 공기의 호흡, 화학적으로 오염된 공공 식수의 음용, 개방된 공공장소에서의 소음 등) 일부 환경 오염 물질은 피하기 어려운데, 이러한 상황에서 노출은 대체로 자기도 모르게 이루어진다.</div><div class=\"rst\">교실 미세먼지, 정수기 물, 공사장 소음은 내가 <b>피하기 어려워요</b>. 지문도 이런 노출은 자기도 모르게 일어난다고 해요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc\"><div class=\"e\">Reduction or elimination of these factors</div><div class=\"k\">이런 요인들의 감소나 제거는</div></div><div class=\"rc ckc\"><div class=\"e\">may require <span class=\"cw\">societal action</span>,</div><div class=\"k\"><span class=\"cw\">사회적 대응을</span> 필요로 할 수도 있다,</div></div><div class=\"rc\"><div class=\"e\">such as public awareness and public health measures.</div><div class=\"k\">대중의 인식과 공공 보건 조치와 같은.</div></div><div class=\"rnat\">이런 요인들의 감소나 제거는 대중의 인식과 공공 보건 조치와 같은 사회적 대응을 필요로 할 수도 있다.</div><div class=\"rst\">그래서 학교 전체가 공기청정기를 달고 정수기를 점검해야 해요. = 지문의 요지, <b>사회적 대응</b>(societal action)이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">In many countries,</div><div class=\"k\">많은 국가에서,</div></div><div class=\"rc\"><div class=\"e\">the fact that some environmental hazards are difficult to avoid</div><div class=\"k\">일부 환경 위험 요인들이 피하기 어렵다는 사실은</div></div><div class=\"rc\"><div class=\"e\">at the individual level</div><div class=\"k\">개인의 수준에서</div></div><div class=\"rc\"><div class=\"e\">is felt to be more morally egregious</div><div class=\"k\">도덕적으로 더욱 매우 나쁘게 느껴진다</div></div><div class=\"rc\"><div class=\"e\">than those hazards that can be avoided.</div><div class=\"k\">피할 수 있는 그러한 위험 요인들보다.</div></div><div class=\"rnat\">많은 국가에서, 일부 환경 위험 요인들이 개인의 수준에서 피하기 어렵다는 사실은 피할 수 있는 그러한 위험 요인들보다 도덕적으로 더욱 매우 나쁘게 느껴진다.</div><div class=\"rst\">내가 못 피하는 위험은 더 억울하고 나쁘게 느껴져요. 지문도 피하기 어려운 위험이 도덕적으로 더 나쁘게 느껴진다고 해요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Having no choice but to drink water</div><div class=\"k\">물을 마실 수밖에 없는 것</div></div><div class=\"rc\"><div class=\"e\">contaminated with very high levels of arsenic,</div><div class=\"k\">매우 높은 수치의 비소로 오염된,</div></div><div class=\"rc\"><div class=\"e\">or being forced to passively breathe in tobacco smoke</div><div class=\"k\">혹은 담배 연기를 간접적으로 마시도록 강요당하는 것은</div></div><div class=\"rc\"><div class=\"e\">in restaurants,</div><div class=\"k\">식당에서,</div></div><div class=\"rc\"><div class=\"e\">outrages people more</div><div class=\"k\">사람들을 더 격분하게 만든다</div></div><div class=\"rc\"><div class=\"e\">than the personal choice</div><div class=\"k\">개인의 선택보다도</div></div><div class=\"rc\"><div class=\"e\">of whether an individual smokes tobacco.</div><div class=\"k\">개인이 담배를 피울지 말지에 대한.</div></div><div class=\"rnat\">매우 높은 수치의 비소로 오염된 물을 마실 수밖에 없는 것, 혹은 식당에서 간접적으로 담배 연기를 마시도록 강요당하는 것은 개인이 담배를 피울지 말지에 대한 개인의 선택보다도 사람들을 격분하게 만든다.</div><div class=\"rst\">정수기 물이 오염돼 있다면, 내가 군것질하는 것보다 훨씬 화나요. 지문의 비소 물·간접흡연 사례가 바로 이거예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">These factors are important</div><div class=\"k\">이런 요인들은 중요하다</div></div><div class=\"rc\"><div class=\"e\">when one considers</div><div class=\"k\">고려할 때</div></div><div class=\"rc\"><div class=\"e\">how change (risk reduction) happens.</div><div class=\"k\">어떻게 변화(위험 감소)가 일어나는지를.</div></div><div class=\"rnat\">이런 요인들은 어떻게 변화(위험 감소)가 일어나는지를 고려할 때 중요하다.</div><div class=\"rst\">그러니 위험을 줄이려면 ‘혼자 피할 수 있나’를 꼭 따져야 해요. 지문도 이 요인들이 위험 감소에서 중요하다고 끝맺어요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"hazard\" data-m=\"위험 요인\"><b>hazard</b>위험 요인</button><button type=\"button\" class=\"wdb\" data-w=\"contaminant\" data-m=\"오염 물질\"><b>contaminant</b>오염 물질</button><button type=\"button\" class=\"wdb\" data-w=\"exposure\" data-m=\"노출\"><b>exposure</b>노출</button><button type=\"button\" class=\"wdb\" data-w=\"involuntary\" data-m=\"자기도 모르게 이루어지는, 원치 않는\"><b>involuntary</b>자기도 모르게 이루어지는, 원치 않는</button><button type=\"button\" class=\"wdb\" data-w=\"societal\" data-m=\"사회적인\"><b>societal</b>사회적인</button><button type=\"button\" class=\"wdb\" data-w=\"egregious\" data-m=\"매우 나쁜, 지독한\"><b>egregious</b>매우 나쁜, 지독한</button></div>", "04": "<p class=\"mtr\">마더텅 정답률 <b>40%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">비교 표현 <b>as well as</b>(~만큼 잘) 뒤에서 동사를 대신 받는 말은 <b>앞 동사의 종류</b>를 따라가요. 앞이 일반동사 make(내리다)면 are(~이다)가 아니라 <b>do</b>(대동사: 그렇게 하다)예요.</p><div class=\"ck-step\"><span class=\"lab\">문제지 ②번 자리 (3번)</span><div class=\"en\">Selfish adults or kids do not make sound decisions as well as <u>② are</u> grateful people.</div><p class=\"ko\">이기적인 사람들은 고마움을 아는 사람들이 ( ? )하는 만큼 올바른 결정을 잘 내리지 못한다</p></div><div class=\"ck-via\"><i>▼</i><span>as well as(~만큼 잘) 뒤 동사는 앞에서 쓴 동사를 대신 받아요. 앞 동사부터 확인해요</span></div><div class=\"ck-step\"><span class=\"lab\">같은 문장 앞쪽 · 비교 대상</span><div class=\"en\">Selfish adults or kids <mark>do not make sound decisions</mark></div><p class=\"ko\">이기적인 어른들이나 아이들은 <mark>올바른 결정을 잘 내리지 못한다</mark></p></div><div class=\"ck-via\"><i>▼</i><span>앞 동사 make(내리다)는 일반동사 → 대신 받는 말도 일반동사용 do(대동사)</span></div><div class=\"ck-step key\"><span class=\"lab\">3번 문장 · 결정적 단서</span><div class=\"en\">as well as <mark>do grateful people</mark>.</div><p class=\"ko\"><mark>고마움을 아는 사람들이 그러한 만큼</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">대동사 do(그렇게 하다)와 are(~이다) 구별</p><p class=\"gr\">앞에 나온 동사를 대신 받을 때, 앞이 일반동사면 do(그렇게 하다)를, 앞이 are(~이다)·is(~이다) 같은 동사면 그 동사를 그대로 써요. as well as(~만큼 잘) 뒤에서는 주어와 대동사의 순서가 바뀌기도 해요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>She runs faster than I do.</div><div class=\"ko\">그녀는 나보다 더 빨리 달린다. (runs 달린다 는 일반동사라 do로 받아서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>She runs faster than I am.</div><div class=\"ko\">일반동사 runs(달린다)를 be동사 am으로 받아서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>She is taller than I am.</div><div class=\"ko\">그녀는 나보다 키가 크다. (is ~이다 는 be동사라 am으로 받아서 맞아요)</div></div><p class=\"gb\">지문 3번도 앞 동사가 일반동사 make(내리다)라서, 뒤에서 받는 말은 are(~이다)가 아니라 do(그렇게 하다)여야 해요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">are → do (대동사: 그렇게 하다)<small>grateful people make sound decisions(고마움을 아는 사람들이 올바른 결정을 내린다)에서 make(내리다)를 do(그렇게 하다)로 대신 받아요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">discouraged 의욕을 잃은</span><span class=\"why\">6번은 my child gets(내 아이가 ~하게 되다) 뒤 보어 자리예요. 아이가 남을 의욕 꺾는 게 아니라 스스로 의욕이 ‘꺾인’ 상태라서 과거분사 discouraged(의욕을 잃은)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">get(~하게 되다) + 과거분사: 사람이 감정을 ‘느끼는’ 쪽이면 과거분사</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I got bored in class.</div><div class=\"ko\">나는 수업 시간에 지루해졌다. (내가 지루함을 느끼는 쪽이라 bored 지루해진 이 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I got boring in class.</div><div class=\"ko\">boring(지루하게 하는)은 내가 남을 지루하게 만든다는 뜻이 되어 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>She got tired after the game.</div><div class=\"ko\">그녀는 경기 후에 지쳤다. (그녀가 피곤함을 느끼니 tired 지친 이 맞아요)</div></div><p class=\"gb\">지문 6번도 my child(내 아이)가 의욕을 잃은 느낌을 받는 쪽이라 gets discouraged(의욕을 잃게 되다)가 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">where ~하는 (관계부사)</span><span class=\"why\">2번은 many situations(많은 상황들) 뒤에 ① 자리가 와요. 뒤의 critical and difficult decisions have to be made(중요하고 어려운 결정들이 내려져야 한다)는 주어·동사가 다 갖춰진 완전한 절이라 관계부사 where(~하는)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">장소·상황 명사 + where(~하는) + 완전한 절</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>This is the room where I study.</div><div class=\"ko\">이곳은 내가 공부하는 방이다. (I study 내가 공부한다 가 완전해서 where가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>This is the room which I study.</div><div class=\"ko\">I study(나는 공부한다) 뒤에 빠진 목적어가 없는데 which를 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>This is the park where we play soccer.</div><div class=\"ko\">이곳은 우리가 축구하는 공원이다. (we play soccer 우리가 축구한다 가 완전해서 맞아요)</div></div><p class=\"gb\">지문 2번도 situations(상황들) 뒤에 완전한 절 decisions have to be made(결정들이 내려져야 한다)가 와서 where(~하는)가 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">to motivate 동기를 부여하는 것</span><span class=\"why\">8번은 It is difficult(어렵다)로 시작해요. 앞의 It(그것)은 가짜 주어이고, 진짜 주어 ‘무엇이 어려운지’가 뒤에 오므로 to motivate(동기를 부여하는 것)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">가주어 It(그것) ~ 진주어 to(~하는 것) + 동사원형</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>It is hard to wake up early.</div><div class=\"ko\">일찍 일어나는 것은 어렵다. (진짜 주어 to wake up 일어나는 것 이 뒤에 와서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>It is hard wake up early.</div><div class=\"ko\">to 없이 동사원형 wake(깨다)를 바로 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>It is fun to play soccer.</div><div class=\"ko\">축구하는 것은 재미있다. (to play 하는 것 이 진짜 주어라 맞아요)</div></div><p class=\"gb\">지문 8번도 It is difficult(어렵다) 뒤에 진짜 주어 to motivate kids or adults(아이들이나 어른들에게 동기를 부여하는 것)가 와서 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">themselves 그들 스스로를</span><span class=\"why\">9번의 주어는 kids and adults(아이들과 어른들)이고, motivate(동기를 부여하다)의 대상도 바로 그 사람들 자신이에요. 주어와 목적어가 같으니 재귀대명사 themselves(그들 스스로를)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">주어 = 목적어일 때 재귀대명사 themselves(그들 스스로를)</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>They taught themselves English.</div><div class=\"ko\">그들은 스스로 영어를 익혔다. (가르친 사람과 배운 사람이 같아서 themselves 그들 스스로를 이 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>They taught them English.</div><div class=\"ko\">them(그들을)을 쓰면 주어와 다른 사람들을 가르쳤다는 뜻이 되어, 같은 사람이라면 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>I made myself a sandwich.</div><div class=\"ko\">나는 나 자신에게 샌드위치를 만들어 주었다. (주어 I 나 와 받는 사람이 같아서 myself 나 자신 이 맞아요)</div></div><p class=\"gb\">지문 9번도 동기를 주는 사람과 받는 사람이 kids and adults(아이들과 어른들) 자신이라 themselves(그들 스스로를)가 맞아요.</p></div></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Grateful people are inclined</div><div class=\"k\">고마워할 줄 아는 사람들은 경향이 있다</div></div><div class=\"rc\"><div class=\"e\">to make healthy decisions.</div><div class=\"k\">건전한 선택을 하는.</div></div><div class=\"rnat\">고마워할 줄 아는 사람들은 건전한 선택을 하는 경향이 있다.</div><div class=\"rst\">고마워할 줄 아는 사람은 건전한 선택을 잘해요. 지문의 첫 문장이 글 전체의 주제예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Life and sports present many situations</div><div class=\"k\">인생과 스포츠는 많은 상황들을 제시해준다</div></div><div class=\"rc\"><div class=\"e\">where critical and difficult decisions</div><div class=\"k\">중요하고 어려운 결정들을</div></div><div class=\"rc\"><div class=\"e\">have to be made.</div><div class=\"k\">내려야만 하는.</div></div><div class=\"rnat\">인생과 스포츠는 중요하고 어려운 결정들을 내려야만 하는 많은 상황들을 제시해준다.</div><div class=\"rst\">인생과 운동에는 어려운 결정을 내려야 하는 상황이 많아요. situations(상황들) 뒤 완전한 절이라 <b>where</b>(~하는)예요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc\"><div class=\"e\">Selfish adults or kids</div><div class=\"k\">이기적인 어른들이나 아이들은</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">do not make sound decisions</span></div><div class=\"k\"><span class=\"cw\">올바른 결정을 잘 내리지 못한다</span></div></div><div class=\"rc ckc\"><div class=\"e\">as well as <span class=\"cw\">do grateful people</span>.</div><div class=\"k\"><span class=\"cw\">고마움을 아는 사람들이 그러한 만큼</span>. ※ 문제지엔 are로 되어 있음</div></div><div class=\"rnat\">이기적인 어른들이나 아이들은 고마움을 아는 사람들이 그러한 만큼 올바른 결정을 잘 내리지 못한다.</div><div class=\"rst\">이기적인 사람은 고마워하는 사람만큼 결정을 잘 못 내려요. 앞이 <b>make</b>(내리다)라서 뒤는 <b>do</b>(그렇게 하다)로 받아요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">This includes the decision</div><div class=\"k\">이것은 결정을 포함한다</div></div><div class=\"rc\"><div class=\"e\">to be self-motivated.</div><div class=\"k\">스스로 동기가 부여되려는.</div></div><div class=\"rnat\">이는 스스로 동기가 부여된 결정을 포함한다.</div><div class=\"rst\">그 결정 중에는 스스로 의욕을 내려는 결정도 들어가요. 지문의 self-motivated(스스로 동기가 부여된)예요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Frustrated parents ask:</div><div class=\"k\">불만스러운 부모들이 묻는다:</div></div><div class=\"rc\"><div class=\"e\">“How do I motivate my child</div><div class=\"k\">“내가 어떻게 내 아이에게 동기를 부여할 수 있나</div></div><div class=\"rc\"><div class=\"e\">to do sports or continue in sports?</div><div class=\"k\">스포츠를 시작하도록 혹은 계속해서 스포츠를 하도록?</div></div><div class=\"rnat\">불만스러운 부모들이 묻길, \"내가 어떻게 하면 내 아이에게 스포츠를 시작하도록 혹은 계속해서 스포츠를 할 수 있도록 동기를 부여할 수 있나?</div><div class=\"rst\">답답한 부모들은 “어떻게 우리 아이가 운동을 계속하게 하지?” 하고 물어요. 지문 속 부모의 질문이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Sometimes my child gets discouraged</div><div class=\"k\">가끔 내 아이가 의욕을 잃고</div></div><div class=\"rc\"><div class=\"e\">and does not want to put the required effort</div><div class=\"k\">필요한 노력을 기울이지 않으려 하지는 않을까</div></div><div class=\"rc\"><div class=\"e\">into his or her sports?</div><div class=\"k\">그(녀)의 스포츠에?</div></div><div class=\"rnat\">가끔 내 아이가 의욕을 잃고 그(녀)가 스포츠에 필요한 노력을 기울이지 않으려 하지는 않을까?</div><div class=\"rst\">아이가 의욕이 꺾여서 노력을 안 하려 할 때도 있어요. 아이가 의욕을 잃는 쪽이라 <b>discouraged</b>(의욕을 잃은)예요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">What can I, as a parent,</div><div class=\"k\">내가 부모로서 무엇을 할 수 있을까</div></div><div class=\"rc\"><div class=\"e\">do or say to help?”</div><div class=\"k\">도움을 주기 위해 하거나 말해야 하지?”</div></div><div class=\"rnat\">내가 부모로서 도움을 주기 위해 무엇을 하거나 말해야 하지?\"</div><div class=\"rst\">“부모로서 뭘 해 주거나 말해 줘야 하지?” 지문 속 부모의 마지막 고민이에요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">It is difficult and almost impossible</div><div class=\"k\">어렵고 거의 불가능한 일이다</div></div><div class=\"rc\"><div class=\"e\">to motivate kids or adults</div><div class=\"k\">아이들이나 어른들에게 동기를 부여하는 것은</div></div><div class=\"rc\"><div class=\"e\">who are centered on their own narrow selfish desires.</div><div class=\"k\">그들 자신만의 편협하고 이기적인 욕구들에 집중하는.</div></div><div class=\"rnat\">그들 자신만의 편협하고 이기적인 욕구들에 집중하는 아이들이나 어른들에게 동기를 부여하는 것은 어렵고 거의 불가능한 일이다.</div><div class=\"rst\">자기 욕심만 챙기는 사람에게 의욕을 주기는 거의 불가능해요. It(가주어) 뒤 진짜 주어라서 <b>to motivate</b>(동기를 부여하는 것)예요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">However, kids and adults</div><div class=\"k\">그러나, 아이들과 어른들은</div></div><div class=\"rc\"><div class=\"e\">who live as grateful people</div><div class=\"k\">고마워하는 사람으로서 사는</div></div><div class=\"rc\"><div class=\"e\">are able to motivate themselves.</div><div class=\"k\">그들 스스로에게 동기를 부여할 수 있다.</div></div><div class=\"rnat\">그러나, 고마워하는 사람으로서 사는 아이들과 어른들은(고마워할 줄 아는 아이들이나 어른들은) 그들 스스로에게 동기를 부여할 수 있다.</div><div class=\"rst\"><b>하지만</b>(However) 고마워할 줄 아는 사람은 스스로 의욕을 내요. 자기 자신에게 주니 <b>themselves</b>(그들 스스로를)예요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">They also welcome suggestions</div><div class=\"k\">그들(= 고마워하는 사람들)은 또한 의견들을 기꺼이 받아들인다</div></div><div class=\"rc\"><div class=\"e\">from others, even parents.</div><div class=\"k\">다른 이들로부터, 심지어는 부모의 것까지도.</div></div><div class=\"rnat\">그들은 또한 다른 이들, 심지어는 부모의 의견들까지도 기꺼이 받아들인다.</div><div class=\"rst\">게다가 다른 사람의 말, 심지어 부모님 말도 기꺼이 들어요. 지문은 고마워하는 사람의 장점으로 끝맺어요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"be inclined to\" data-m=\"~하는 경향이 있다\"><b>be inclined to</b>~하는 경향이 있다</button><button type=\"button\" class=\"wdb\" data-w=\"sound decisions\" data-m=\"올바른 결정 (sound 올바른, 건전한)\"><b>sound decisions</b>올바른 결정 (sound 올바른, 건전한)</button><button type=\"button\" class=\"wdb\" data-w=\"self-motivated\" data-m=\"스스로 동기가 부여된\"><b>self-motivated</b>스스로 동기가 부여된</button><button type=\"button\" class=\"wdb\" data-w=\"frustrated\" data-m=\"불만스러운, 좌절한\"><b>frustrated</b>불만스러운, 좌절한</button><button type=\"button\" class=\"wdb\" data-w=\"discouraged\" data-m=\"의욕을 잃은\"><b>discouraged</b>의욕을 잃은</button><button type=\"button\" class=\"wdb\" data-w=\"centered on\" data-m=\"~에 집중된\"><b>centered on</b>~에 집중된</button></div>", "05": "<p class=\"mtr\">마더텅 정답률 <b>60%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">밑줄은 <b>비유</b>예요. hands(손) = 몸으로 하는 일, head(머리) = 디지털 세계의 일로 바꾼 뒤, <b>바로 앞 6번</b>에서 사람들이 어느 쪽으로 몰리는지 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">밑줄 문장 (7번)</span><div class=\"en\"><mark>The divorce of the hands from the head</mark> puts a stress on the human mind.</div><p class=\"ko\"><mark>머리로부터 손의 분리</mark>(는) 인간의 정신에 부담을 준다.</p></div><div class=\"ck-via\"><i>▼</i><span>손과 머리가 각각 무엇인지 바로 앞 문장이 풀어 줘요</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · hands와 head의 정체</span><div class=\"en\">mass education and media train humans to avoid <mark>low-tech physical work</mark>, to seek <mark>jobs working in the digital world</mark>.</div><p class=\"ko\">대중 교육과 매체는 인간을 <mark>낮은 기술의 육체적 노동을</mark> 피하도록, <mark>디지털 세계에서 일하는 직업을</mark> 찾도록 훈련시킨다.</p></div><div class=\"ck-via\"><i>▼</i><span>Indeed(실제로)로 머리만 쓰는 일의 결과를 덧붙여요</span></div><div class=\"ck-step\"><span class=\"lab\">8번 문장 · 뒤에서 한 번 더 확인</span><div class=\"en\">Indeed, <mark>the sedentary nature</mark> of the best-paying jobs is a health risk — for body and mind.</div><p class=\"ko\">실제로, 가장 보수가 좋은 일자리의 <mark>주로 앉아서 하는 특성은</mark> 신체와 정신에 건강 위험 요소이다.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>hands</em>손 = 몸을 쓰는 낮은 기술의 일 (피하도록 배움)</span><span><em>head</em>머리 = 디지털 세계의 일 (찾도록 배움)</span><span><em>divorce</em>분리 = 손은 버리고 머리 쪽 첨단 기술 일만 늘어남</span></div><div class=\"ck-eq\">⇒ 밑줄의 속뜻 = 일터에서 첨단 기술 사용이 점점 늘어나는 것 → ⑤</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">our increasing use of high technology in the workplace 직장에서 첨단 기술 사용의 증가<small>몸 쓰는 일(손)을 피하고 디지털 일(머리)만 찾게 된 상황을 한 줄로 바꾼 말이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">not getting along well with our coworkers 동료들과 잘 지내지 못하는 것</span><span class=\"why\">divorce(이혼, 분리)를 글자 그대로 ‘사이가 나빠짐’으로 읽은 함정이에요. 지문에서 갈라지는 건 사람과 사람이 아니라 손(몸 쓰는 일)과 머리(디지털 일)예요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">ignorance of modern technology 현대 기술에 대한 무지</span><span class=\"why\">정반대예요. 6번에서 사람들은 digital world(디지털 세계)의 일을 찾도록 훈련받아요. 기술을 모르는 게 아니라 기술 쪽으로 더 몰리는 거예요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">endless competition in the labor market 노동 시장에서의 끝없는 경쟁</span><span class=\"why\">일자리 이야기는 나오지만 경쟁하는 장면은 없어요. 2번은 경쟁이 아니라 progress(발전) 때문에 전통 직업이 밀려났다고 해요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">working without any realistic goals for our career 직업에 대한 현실적 목표 없이 일하는 것</span><span class=\"why\">3번에 싫어하는 일을 한다는 말은 있지만, 목표가 없다는 말은 지문에 없어요. 밑줄 바로 앞 6번의 손과 머리 이야기와도 이어지지 않아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">If we adopt technology,</div><div class=\"k\">만약 우리가 기술을 받아들인다면,</div></div><div class=\"rc\"><div class=\"e\">we need to pay its costs.</div><div class=\"k\">우리는 그것의 비용을 지불해야 한다.</div></div><div class=\"rnat\">만약 우리가 기술을 받아들인다면, 우리는 그것의 비용을 지불해야 한다.</div><div class=\"rst\">학교에 태블릿이 들어오면 편하지만 대가도 있어요. = 지문의 ‘기술을 받아들이면 그 비용을 치러야 한다’예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Thousands of traditional livelihoods have been pushed aside</div><div class=\"k\">수천 개의 전통적인 생계 수단들은 옆으로 밀려났다</div></div><div class=\"rc\"><div class=\"e\">by progress,</div><div class=\"k\">발전에 의해,</div></div><div class=\"rc\"><div class=\"e\">and the lifestyles around those jobs removed.</div><div class=\"k\">그리고 그 직업과 관련된 생활 방식은 사라졌다.</div></div><div class=\"rnat\">수천 개의 전통적인 생계 수단들은 발전에 의해 옆으로 밀려났고, 그 직업과 관련된 생활 방식은 사라졌다.</div><div class=\"rst\">손으로 하던 만들기·바느질 수업은 하나둘 사라져요. 지문도 발전 때문에 전통 일자리와 생활 방식이 밀려났다고 해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Hundreds of millions of humans today</div><div class=\"k\">오늘날 수억 명의 사람들은</div></div><div class=\"rc\"><div class=\"e\">work at jobs they hate,</div><div class=\"k\">자신들이 싫어하는 일자리에서 일한다,</div></div><div class=\"rc\"><div class=\"e\">producing things they have no love for.</div><div class=\"k\">애정을 가지지 않은 것들을 생산하면서.</div></div><div class=\"rnat\">오늘날 수억 명의 사람들은 애정을 가지지 않은 것들을 생산하면서, 자신들이 싫어하는 일자리에서 일한다.</div><div class=\"rst\">그런데 많은 어른들은 좋아하지도 않는 일을 억지로 해요. 지문도 수억 명이 싫어하는 일을 한다고 해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Sometimes these jobs cause</div><div class=\"k\">때때로 이 일자리들(= 싫어하는 일자리)은 유발한다</div></div><div class=\"rc\"><div class=\"e\">physical pain, disability, or chronic disease.</div><div class=\"k\">육체적 고통, 장애, 혹은 만성적 질환을.</div></div><div class=\"rnat\">때때로 이 일자리들은 육체적 고통, 장애, 혹은 만성적 질환을 유발한다.</div><div class=\"rst\">그런 일은 몸을 아프게 하거나 병을 남기기도 해요. 지문의 육체적 고통·장애·만성 질환이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Technology creates many new jobs</div><div class=\"k\">기술은 많은 새로운 일자리를 만든다</div></div><div class=\"rc\"><div class=\"e\">that are certainly dangerous.</div><div class=\"k\">확실히 위험한.</div></div><div class=\"rnat\">기술은 확실히 위험한 많은 새로운 일자리를 만든다.</div><div class=\"rst\">기술이 만든 새 일자리도 위험한 게 많아요. 지문도 기술이 위험한 새 일자리를 만든다고 말해요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">At the same time,</div><div class=\"k\">동시에,</div></div><div class=\"rc\"><div class=\"e\">mass education and media train humans</div><div class=\"k\">대중 교육과 매체는 인간을 훈련시킨다</div></div><div class=\"rc ckc\"><div class=\"e\">to avoid <span class=\"cw\">low-tech physical work</span>,</div><div class=\"k\">(수준이) <span class=\"cw\">낮은 기술의 육체적 노동을</span> 피하도록,</div></div><div class=\"rc ckc\"><div class=\"e\">to seek <span class=\"cw\">jobs working in the digital world</span>.</div><div class=\"k\"><span class=\"cw\">디지털 세계에서 일하는 직업을</span> 찾도록.</div></div><div class=\"rnat\">동시에, 대중 교육과 매체는 (수준이) 낮은 기술의 육체적 노동을 피하도록, 디지털 세계에서 일하는 직업을 찾도록 인간을 훈련시킨다.</div><div class=\"rst\">학교와 유튜브는 “몸 쓰는 일 말고 컴퓨터 일을 해” 하고 가르쳐요. = 지문의 <b>낮은 기술의 육체 노동</b>(손) 대신 <b>디지털 일</b>(머리)이에요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">The divorce of the hands from the head</span></div><div class=\"k\"><span class=\"cw\">머리로부터 손의 분리</span></div></div><div class=\"rc\"><div class=\"e\">puts a stress on the human mind.</div><div class=\"k\">인간의 정신에 부담을 준다.</div></div><div class=\"rnat\">머리로부터 손의 분리(직장에서의 첨단 기술 사용의 증가)는 인간의 정신에 부담을 준다.</div><div class=\"rst\">그래서 손은 쉬고 머리만 쓰게 돼요. 이게 밑줄 <b>손과 머리의 분리</b>(divorce)이고, 일터의 첨단 기술이 늘어난다는 뜻(⑤)이에요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc ckc\"><div class=\"e\">Indeed, <span class=\"cw\">the sedentary nature</span></div><div class=\"k\">실제로, <span class=\"cw\">주로 앉아서 하는 특성은</span></div></div><div class=\"rc\"><div class=\"e\">of the best-paying jobs</div><div class=\"k\">가장 보수가 좋은 일자리의</div></div><div class=\"rc\"><div class=\"e\">is a health risk</div><div class=\"k\">건강 위험 요소이다</div></div><div class=\"rc\"><div class=\"e\">— for body and mind.</div><div class=\"k\">— 신체와 정신에.</div></div><div class=\"rnat\">실제로, 가장 보수가 좋은 일자리의 주로 앉아서 하는 특성은 신체와 정신에 건강 위험 요소이다.</div><div class=\"rst\">하루 종일 앉아서 화면만 보면 몸도 마음도 지쳐요. 지문도 앉아서 하는(sedentary) 일이 몸과 마음에 위험하다고 끝맺어요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"adopt\" data-m=\"받아들이다, 채택하다\"><b>adopt</b>받아들이다, 채택하다</button><button type=\"button\" class=\"wdb\" data-w=\"livelihood\" data-m=\"생계 수단\"><b>livelihood</b>생계 수단</button><button type=\"button\" class=\"wdb\" data-w=\"chronic disease\" data-m=\"만성 질환\"><b>chronic disease</b>만성 질환</button><button type=\"button\" class=\"wdb\" data-w=\"mass education\" data-m=\"대중 교육\"><b>mass education</b>대중 교육</button><button type=\"button\" class=\"wdb\" data-w=\"divorce\" data-m=\"분리, 단절\"><b>divorce</b>분리, 단절</button><button type=\"button\" class=\"wdb\" data-w=\"sedentary\" data-m=\"주로 앉아서 하는\"><b>sedentary</b>주로 앉아서 하는</button></div>", "06": "<p class=\"mtr\">마더텅 정답률 <b>45%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸 뒤 <b>require little</b>(거의 요구하지 않는다)와 <b>master the planned objective</b>(계획된 목표를 숙달하다)가 힌트예요. 앞에서 반복된 <b>predetermined</b>(미리 정해진)를 한 단어로 묶는 말을 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (8번)</span><div class=\"en\">This is exemplified by toys, games, and lessons that are a(n) <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span></span> in and of themselves and <mark>require little</mark> of the individual other than to <mark>master the planned objective</mark>.</div><p class=\"ko\">이것은 그 자체로 ( ? )이 되어, 개인에게 <mark>계획된 목표를 숙달하는 것</mark> 이외에는 <mark>거의 요구하지 않는</mark> 장난감, 게임, 수업에서 잘 드러난다.</p></div><div class=\"ck-via\"><i>▼</i><span>과학 수업이 어떻게 짜여 있는지부터 봐요</span></div><div class=\"ck-step\"><span class=\"lab\">4번 문장 · 첫 번째 단서</span><div class=\"en\">The exercises or activities are devised to <mark>eliminate different options</mark> and to focus on <mark>predetermined results</mark>.</div><p class=\"ko\">연습이나 활동들은 <mark>여러 가지 선택권들을 없애고</mark> <mark>미리 정해진 결과에</mark> 집중하도록 만들어진다.</p></div><div class=\"ck-via\"><i>▼</i><span>빈칸 바로 앞 문장이 장난감·수업에도 ‘미리 정해진 결론’이 있다고 한 번 더 말해요</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 문장 · 결정적 단서</span><div class=\"en\">The loss of cognitive intrigue may be initiated by the sole use of play items with <mark>predetermined conclusions</mark> and reinforced by rote instruction in school.</div><p class=\"ko\">인지적 호기심의 상실은 <mark>미리 정해진 결론을 가진</mark> 놀잇감만 쓰는 데서 시작되고, 학교의 기계적인 암기 교육으로 더 강해질지도 모른다.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>4번</em>선택권 없애고 미리 정해진 결과만 보기</span><span><em>7번</em>미리 정해진 결론을 가진 놀잇감</span><span><em>8번</em>계획된 목표 숙달 말고는 요구하는 게 없음</span></div><div class=\"ck-eq\">⇒ 공통점 = 정해진 목표에 도달하는 것 자체가 전부 → 그 자체로 ‘목적’(end)</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">end 목적<small>an end in and of themselves(그 자체로 목적), 정해진 목표 숙달이 전부라는 뜻이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">puzzle 수수께끼</span><span class=\"why\">games(게임)이 나와서 끌리지만, 수수께끼는 머리를 쓰게 해요. 8번은 require little(거의 요구하지 않는다)이라 정반대예요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">input 투입, 입력</span><span class=\"why\">무언가를 넣어 준다는 이야기는 지문에 없어요. 8번의 핵심은 넣는 것이 아니라 planned objective(계획된 목표)만 숙달하면 끝난다는 거예요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">interest 흥미</span><span class=\"why\">5번에서 wonder(경이감)가 사라지고, 7번에서 cognitive intrigue(인지적 호기심)를 잃는다고 했어요. 흥미를 주는 게 아니라 빼앗는 장난감이에요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">alternative 대안</span><span class=\"why\">4번에서 활동들은 eliminate different options(여러 선택권을 없앤다)고 했어요. 다른 길을 열어 주는 대안과 정반대예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">The creativity that children possess</div><div class=\"k\">아이들이 지닌 창의력은</div></div><div class=\"rc\"><div class=\"e\">needs to be cultivated</div><div class=\"k\">계발되어야 할 필요가 있다</div></div><div class=\"rc\"><div class=\"e\">throughout their development.</div><div class=\"k\">그들의 성장 (기간) 동안 내내.</div></div><div class=\"rnat\">아이들이 지닌 창의력은 그들의 성장 (기간) 동안 내내 계발되어야 할 필요가 있다.</div><div class=\"rst\">과학 시간에 우리가 가진 상상력은 계속 키워 줘야 해요. 지문도 아이들의 창의력은 자라는 내내 길러져야 한다고 해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Research suggests</div><div class=\"k\">연구는 보여준다</div></div><div class=\"rc\"><div class=\"e\">that overstructuring the child’s environment</div><div class=\"k\">아이의 환경을 지나치게 구조화하는 것이</div></div><div class=\"rc\"><div class=\"e\">may actually limit</div><div class=\"k\">실제로는 제한할 수도 있다는 것을</div></div><div class=\"rc\"><div class=\"e\">creative and academic development.</div><div class=\"k\">창의적이고 학문적인 발달을.</div></div><div class=\"rnat\">연구는 아이의 환경을 지나치게 구조화하는 것이 실제로는 창의적이고 학문적인 발달을 제한할 수도 있다는 것을 보여준다.</div><div class=\"rst\">그런데 쌤이 “순서대로 이것만 해” 하고 다 정해 주면 오히려 생각이 막혀요. = 지문의 ‘지나친 구조화가 발달을 제한한다’예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">This is a central problem</div><div class=\"k\">이것(= 환경을 지나치게 구조화하는 것)은 주요한 문제이다</div></div><div class=\"rc\"><div class=\"e\">with much of science instruction.</div><div class=\"k\">과학 교육의 대부분에서.</div></div><div class=\"rnat\">이것은 과학 교육의 대부분에서 주요한 문제이다.</div><div class=\"rst\">이게 바로 많은 과학 수업의 큰 문제예요. 지문도 this(이것)가 과학 교육의 주요 문제라고 말해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">The exercises or activities are devised</div><div class=\"k\">연습이나 활동들은 만들어진다</div></div><div class=\"rc\"><div class=\"e\">to eliminate different options</div><div class=\"k\">여러 가지 선택권들을 없애고</div></div><div class=\"rc ckc\"><div class=\"e\">and to focus on <span class=\"cw\">predetermined results</span>.</div><div class=\"k\"><span class=\"cw\">미리 정해진 결과에</span> 집중하도록.</div></div><div class=\"rnat\">연습이나 활동들은 여러 가지 선택권들을 없애고 미리 정해진 결과에 집중하도록 만들어진다.</div><div class=\"rst\">실험지에는 다른 방법은 지워져 있고 <b>미리 정해진 결과</b>(predetermined results)만 맞히게 돼 있어요. 지문 4번 그대로예요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">The answers are structured</div><div class=\"k\">정답은 구조화되며</div></div><div class=\"rc\"><div class=\"e\">to fit the course assessments,</div><div class=\"k\">교과 과정 평가에 적합하도록,</div></div><div class=\"rc\"><div class=\"e\">and the wonder of science is lost</div><div class=\"k\">과학의 경이감은 상실된다</div></div><div class=\"rc\"><div class=\"e\">along with cognitive intrigue.</div><div class=\"k\">인지적 호기심과 함께.</div></div><div class=\"rnat\">정답은 교과 과정 평가에 적합하도록 구조화되며, 과학의 경이감은 인지적 호기심과 함께 상실된다.</div><div class=\"rst\">답은 시험에 맞게 짜여 있어서 “우와, 신기하다!” 하는 마음이 사라져요. 지문의 경이감과 호기심의 상실이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">We define cognitive intrigue as the wonder</div><div class=\"k\">우리는 인지적 호기심을 경이감으로 정의한다</div></div><div class=\"rc\"><div class=\"e\">that stimulates and intrinsically motivates an individual</div><div class=\"k\">한 개인을 자극하고 내재적으로 동기를 부여하는</div></div><div class=\"rc\"><div class=\"e\">to voluntarily engage in an activity.</div><div class=\"k\">어떤 활동에 자발적으로 참여하도록.</div></div><div class=\"rnat\">우리는 인지적 호기심을 한 개인이 어떤 활동에 자발적으로 참여하도록 자극하고 내재적으로 동기를 부여하는 경이감으로 정의한다.</div><div class=\"rst\">그 “신기하다!”는 마음이 내가 스스로 실험해 보고 싶게 만드는 힘이에요. 지문은 이것을 인지적 호기심이라고 정의해요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">The loss of cognitive intrigue</div><div class=\"k\">인지적 호기심의 상실은</div></div><div class=\"rc\"><div class=\"e\">may be initiated</div><div class=\"k\">시작될지도 모른다</div></div><div class=\"rc\"><div class=\"e\">by the sole use of play items</div><div class=\"k\">놀잇감의 단 한 가지 사용에 의해</div></div><div class=\"rc ckc\"><div class=\"e\">with <span class=\"cw\">predetermined conclusions</span></div><div class=\"k\"><span class=\"cw\">미리 정해진 결론을 가진</span></div></div><div class=\"rc\"><div class=\"e\">and reinforced by rote instruction in school.</div><div class=\"k\">그리고 학교에서의 기계적인 암기 교육에 의해 강화될지도 모른다.</div></div><div class=\"rnat\">인지적 호기심의 상실은 미리 정해진 결론을 가진 놀잇감의 단 한 가지 사용에 의해(놀잇감을 한 가지 방식으로만 사용함으로써) 시작되고 학교에서의 기계적인 암기 교육에 의해 강화될지도 모른다.</div><div class=\"rst\">조립 설명서대로만 만드는 장난감과 외우기 수업이 그 마음을 꺼요. 지문의 <b>미리 정해진 결론</b>(predetermined conclusions)이에요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc\"><div class=\"e\">This is exemplified by toys, games, and lessons</div><div class=\"k\">이것(= 호기심의 상실)은 장난감, 게임, 그리고 수업에 의해 예시된다</div></div><div class=\"rc ckc\"><div class=\"e\">that are a(n) <span class=\"cw\">end</span> in and of themselves</div><div class=\"k\">그것들 자체로 <span class=\"cw\">목적이 되어</span> ※ 문제지엔 end가 빈칸으로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">and require little of the individual</div><div class=\"k\">개인에게 거의 요구하지 않는</div></div><div class=\"rc ckc\"><div class=\"e\">other than to <span class=\"cw\">master the planned objective</span>.</div><div class=\"k\"><span class=\"cw\">계획된 목표를 숙달하는 것</span> 이외에는.</div></div><div class=\"rnat\">이것은 그것들 자체로 목적이 되어 계획된 목표를 숙달하는 것 이외에는 개인에게 거의 (아무것도) 요구하지 않는 장난감, 게임, 그리고 수업에 의해 예시된다.</div><div class=\"rst\">설명서대로 완성하면 끝인 장난감은 <b>그 자체가 목적</b>이에요. 그래서 빈칸은 end(목적)예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"cultivate\" data-m=\"계발하다, 기르다\"><b>cultivate</b>계발하다, 기르다</button><button type=\"button\" class=\"wdb\" data-w=\"eliminate\" data-m=\"없애다, 제거하다\"><b>eliminate</b>없애다, 제거하다</button><button type=\"button\" class=\"wdb\" data-w=\"predetermined\" data-m=\"미리 정해진\"><b>predetermined</b>미리 정해진</button><button type=\"button\" class=\"wdb\" data-w=\"cognitive intrigue\" data-m=\"인지적 호기심\"><b>cognitive intrigue</b>인지적 호기심</button><button type=\"button\" class=\"wdb\" data-w=\"rote instruction\" data-m=\"기계적인 암기 교육\"><b>rote instruction</b>기계적인 암기 교육</button><button type=\"button\" class=\"wdb\" data-w=\"objective\" data-m=\"목표, 목적\"><b>objective</b>목표, 목적</button></div>"};

      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
