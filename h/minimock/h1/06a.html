<style>

<body>
<div id="app"></div>
<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:Canvas;color:CanvasText;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';
    document.body.appendChild(d);
    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');
    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';
      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();
  }

sub": ["possess 소유하다, 가지고 있다 (복수 선행사라 s가 안 붙음)", "the highest-quality information = 가장 질 높은 정보"]}, {"t": "<b>are likely to prosper</b>의 to prosper는 보어 likely를 꾸미는 to부정사이다.", "sub": ["prosper 번영하다"]}, {"t": "끝의 <b>economically, socially, and politically</b>는 부사 3개가 병렬된 것이다. prosper를 꾸민다. (경제적으로, 사회적으로, 정치적으로)"}], "sum": "질 높은 정보를 가진 사람·조직·국가, 경제·사회·정치적으로 번영할 가능성 큼"}, {"i": "05", "q": "04", "s": "2", "title": "S+V(수동태, 1형식) + 과거분사 후치수식", "eng": "Physically<sup>1</sup>, / animal cartoon characters and toys made after<sup>2</sup> animals / are also most often<sup>3</sup> deformed<sup>4</sup> / in such a way as to<sup>5</sup> resemble<sup>6</sup> humans.", "notes": [["1", "physically", "신체적으로, 생김새 면에서"], ["2", "be made after", "~을 본떠 만들어지다"], ["3", "most often", "대개, 가장 흔히"], ["4", "deform", "변형하다"], ["5", "in such a way as to V", "~하도록 그런 방식으로"], ["6", "resemble", "닮다"]], "lit": "신체적으로는 / 동물 만화 캐릭터와 동물을 본떠 만든 장난감은 / 또한 대개 변형된다 / 사람을 닮도록 그런 방식으로", "nat": "생김새 면에서도 동물 만화 캐릭터나 동물을 본떠 만든 장난감은 대개 사람을 닮는 쪽으로 변형된다.", "ana": "<b>made after animals</b>는 <b>toys</b>를 뒤에서 꾸미는 <b>과거분사</b>입니다. made를 문장의 동사로 읽으면 바로 뒤의 <b>are</b>를 처리할 수 없습니다 — 동사가 두 개면 하나는 반드시 수식어입니다. <b>be made after</b>는 '~을 본떠 만들어지다'입니다. <b>in such a way as to V</b>는 '<b>~하도록 그런 방식으로</b>'인 한 덩어리 표현이라 통째로 외워 두세요.", "pe": "\u0001Physically<sup>1</sup>\u0002, / animal cartoon characters and toys \u0001made after<sup>2</sup> animals\u0002 / are \u0001also most often<sup>3</sup>\u0002 deformed<sup>4</sup> / \u0001in such a way as to<sup>5</sup> resemble<sup>6</sup> humans\u0002.", "pk": "\u0001신체적으로는\u0002 / 동물 만화 캐릭터와 \u0001동물을 본떠 만든\u0002 장난감은 / \u0001또한 대개\u0002 변형된다 / \u0001사람을 닮도록 그런 방식으로\u0002", "core": "동물 만화 캐릭터와 장난감은 변형된다.", "tags": ["Physically = 부사: 문장 전체를 꾸밈", "주어: animal cartoon characters and toys. made after animals = <b>과거분사구</b>: toys를 뒤에서 꾸밈 (동사 아님)", "동사 are deformed(수동). also most often = 부사구: are deformed를 꾸밈", "<b>in such a way as to V</b> = 전치사구(부사구): deformed를 꾸밈 ('~하도록 그런 방식으로')"], "steps": [{"t 잘못 이끌다"], ["4", "insufficiently", "불충분하게"], ["5", "be attentive to", "~에 주의를 기울이다"], ["6", "assumption", "가정, 전제"], ["7", "explicit", "명시적인"], ["8", "exhaust", "남김없이 다 담다"], ["9", "sensible", "합리적인"], ["10", "alternative", "대안"]], "lit": "잘못된 양자택일의 오류는 사람을 잘못 이끈다 / 우리가 중요한 숨은 전제에 충분히 주의를 기울이지 않을 때 / 즉 명시적으로 드러난 선택지들이 / 합리적인 대안을 남김없이 다 담고 있다는 (전제)", "nat": "잘못된 양자택일의 오류는, 겉으로 드러난 선택지가 합리적인 대안을 남김없이 다 담고 있다는 중요한 숨은 전제에 우리가 충분히 주의하지 않을 때 우리를 잘못된 길로 이끈다.", "ana": "콤마 뒤의 <b>that절</b>은 관계사가 아니라 <b>assumption의 동격 that</b>입니다. '<b>~라는 전제</b>'로 붙여 읽어야 하고, '그 전제, 그것은'처럼 새 문장으로 끊으면 안 됩니다. that절 안에서 주어는 <b>the choices</b>, 동사는 <b>exhaust</b>인데 사이에 관계사절 <b>which have been made explicit</b>이 끼어 있어 동사를 놓치기 쉽습니다. 이 관계사절은 <b>make + 목적어 + 형용사</b>의 수동형입니다. <b>exhaust</b>는 '지치게 하다'가 아니라 여기서 <b>'남김없이 다 담다'</b>입니다.", "pe": "The fallacy<sup>1</sup> \u0001of false choice<sup>2</sup>\u0002 misleads<sup>3</sup> / \u0001when we're insufficiently<sup>4</sup> attentive to<sup>5</sup> an important hidden assumption<sup>6</sup>\u0002, / \u0001that the choices which have been made explicit<sup>7</sup>\u0002 / \u0001exhaust<sup>8</sup> the sensible<sup>9</sup> alternatives<sup>10</sup>\u0002.", "pk": "\u0001잘못된 양자택일의\u0002 오류는 사람을 잘못 이끈다 / \u0001우리가 중요한 숨은 전제에 충분히 주의를 기울이지 않을 때\u0002 / 즉 \u0001명시적으로 드러난 선택지들이\u0002 / \u0001합리적인 대안을 남김없이 다 담고 있다는\u0002 (전제)", "core": "그 오류는 사람을 잘못 이끈다.", "tags": ["주어 The fallacy + 동사 misleads. of false choice = 전치사구(형용사구): fallacy를 꾸밈", "when절 = 부사절(시간): misleads를 꾸밈", "that절 = <b>동격절</b>: assumption의 내용을 설명. 주어 choices, 그 사이 which절(관계절)이 끼어듦", "동격절의 동사 <b>exhaust</b> + 목적어 alternatives (여기서는 '남김없이 다 담다')"], "steps": [{"t": "이 문장은 <b>S+V(1형식)</b>이다. 뒤에 붙은 when절과 동격 that절이 길어서 어려워 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: The fallacy of false choice (잘못된 양자택일의 오류. of false choice는 fallacy를 꾸미는 전치사구)", "V: misleads (mislead 잘못 이끌다. 여기서는 목적어 없이 쓰임)", "뼈대 = <b>The fallacy misleads</b>"]}, {"t": "<b>when we're insufficiently attentive to an important hidden assumption</b>은 부사절(때)이다. misleads를 꾸민다.", "sub": ["we're = we are + attentive (주의를 기울이는). S+V+C(2형식)", "insufficiently 충분하지 않게, hidden 숨은, assumption 전제"]}, {"t": "콤마 뒤 <b>that the choices ~ exhaust the sensible alternatives</b>는 <b>동격의 that절</b>이다. assumption의 내용을 설명한다. '~라는 전제'로 읽는다.", "sub": ["the choices which have been made explicit = 명시적으로 드러난 선택지들 (which절이 choices를 꾸미는 관계절. made explicit 명시적으로 만들어진)", "exhaust = 남김없이 다 담다 (여기서는 '다 써버리다'가 아니라 '빠짐없이 포함하다'). 동격절 안의 동사", "the sensible alternatives = 합리적인 대안들"]}, {"t": "함정: 콤마 뒤 that절을 앞 문장에 붙은 일반 명사절로 읽으면 안 된다. assumption과 같은 말인 동격절이다."}], "sum": "잘못된 양자택일의 오류, 드러난 선택지가 대안을 다 담았다는 숨은 전제를 놓칠 때 발생"}, {"i": "08", "q": "06", "s": "2", "title": "S+V+C(2형식) + 병렬 동사 + 지각동사 see+O+-ing", "eng": "They are aware<sup>1</sup> / that no two people<sup>2</sup> act in exactly the same way / and so do not feel threatened<sup>3</sup> / if they see one employee<sup>4</sup> going about<sup>5</sup> a task<sup>6</sup> differently than another.", "notes": [["1", "be aware that", "~임을 알다"], ["2", "no two ~", "어떤 두 ~도 …않다"], ["3", "threatened", "위협받는"], ["4", "employee", "직원"], ["5", "go about", "(일을) 처리해 나가다"], ["6", "task", "업무, 과제"]], "lit": "그들은 알고 있다 / 어떤 두 사람도 정확히 같은 방식으로 행동하지는 않는다는 것을 / 그래서 위협을 느끼지 않는다 / 만약 한 직원이 다른 직원과 다르게 업무를 처리하는 것을 보더라도", "nat": "좋은 관리자는 어떤 두 사람도 똑같은 방식으로 일하지는 않는다는 걸 알기에, 한 직원이 다른 직원과 다르게 업무를 해 나가는 것을 봐도 위협을 느끼지 않는다.", "ana": "<b>are aware</b>와 <b>do not feel</b>이 and로 이어진 <b>동사 병렬</b>이고 둘 다 주어 They에 걸립니다. do not feel을 that절 안으로 넣어 읽으면 '위협을 느끼지 않는다는 것을 안다'가 되어 뜻이 완전히 달라집니다. <b>no two people</b>은 '두 사람이 아니다'가 아니라 <b>'어떤 두 사람도 ~하지 않다'</b>입니다. 마지막의 <b>see + 목적어 + -ing</b>는 지각동사 구문이라 going은 동사가 아니라 <b>목적격보어</b>입니다.", "pe": "They are aware<sup>1</sup> / \u0001that no two people<sup>2</sup> act in exactly the same way\u0002 / and \u0001so\u0002 do not feel threatened<sup>3</sup> / \u0001if they see one employee<sup>4</sup> going about<sup>5</sup> a task<sup>6</sup> differently than another\u0002.", "pk": "그들은 알고 있다 / \u0001어떤 두 사람도 정확히 같은 방식으로 행동하지는 않는다는 것을\u0002 / \u0001그래서\u0002 위협을 느끼지 않는다 / \u0001만약 한 직원이 다른 직원과 다르게 업무를 처리하는 것을 보더라도\u0002", "core": "그들은 알고 있고, 위협을 느끼지 않는다.", "tags": ["주어 They + 동사 are + 보어 aware(SVC)", "that절 = 접속사절(부사적): aware의 내용. SVC가 이미 완성되어 수식어. <b>no two people</b> = 어떤 두 사람도 ~않다 [기준: SVC 완성 후 that절은 수식어]", "<b>동사 병렬</b>: and do not feel threatened (feel + 보어 threatened). so = 부사: 결과", "if절 = 부사절(조건·양보): do not feel을 꾸밈. <b>see + O + -ing</b>(지각동사): going은 목적격보어"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식) 뒤에 and로 동사가 하나 더 이어진 문장</b>이다. 안에 that절과 if절이 들어 있어 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: They (그들)", "V: are (be동사)", "C: aware (알고 있는)", "뼈대 = <b>They are aware</b>", "이어서 and로 병렬된 두 번째 동사: (They) do not feel threatened (threatened 위협을 느끼는, feel+형용사 2형식)"]}, {"t": "<b>that no two people act in exactly the same way</b>는 aware의 내용을 설명하는 that절이다. SVC가 이미 완성된 뒤라 수식어로 본다.", "sub": ["no two people = 어떤 두 사람도 ~않다", "act 행동하다, exactly 정확히"]}, {"t": "<b>and so do not feel threatened</b>에서 so는 '그래서'라는 부사이다. are aware와 do not feel이 and로 병렬이다."}, {"t": "<b>if they see one employee going about a task differently than another</b>는 부사절(조건)이다. 안에서 <b>see+O+-ing</b>(지각동사 5형식)가 쓰였다.", "sub": ["O: one employee (한 직원), C: going about a task (업무를 처리하고 있는). go about = 착수하다, 처리하다", "differently than another = 다른 직원과 다르게 (another = another employee)", "employee 직원, task 업무"]}], "sum": "그들, 두 사람이 똑같이 일하지 않음을 알기에 다르게 일하는 직원을 봐도 위협 못 느낌"}], "qs": [{"q": "01", "type": "필자 주장", "src": "2018년 6월 20번", "ans": "①", "tr": [["1", "대부분의 사람은 글을 쓰기 시작하면 뭔가에 사로잡힌다."], ["2", "사람들은 친구에게 말할 때라면 썼을 법한 말과는 다른 언어로 글을 쓴다."], ["3", "하지만 사람들이 당신의 글을 읽고 이해하기를 바란다면, 구어체로 쓰라."], ["4", "문어체는 더 복잡해서 읽는 데 더 많은 수고가 든다."], ["5", "또 더 격식 차리고 거리감이 있어서 독자가 집중력을 잃게 만든다."], ["6", "생각을 표현하는 데 복잡한 문장이 필요한 것은 아니다."], ["7", "복잡한 분야의 전문가들조차 자기 생각을 표현할 때, 점심에 뭘 먹을지 얘기할 때 쓰는 문장보다 조금이라도 더 복잡한 문장을 쓰지는 않는다."], ["8", "그저 구어체로 쓰기만 해도 당신은 글쓴이로서 좋은 출발을 한 것이다."]], "evh": "3 · 8번 문장", "ev": [{"en": true, "h": "If, however, you want people to read and understand what you write, write it in spoken language. / If you simply manage to write in spoken language, you have a good start as a writer."}, {"en": false, "h": "주장 문제의 답은 <b>명령문</b>과 <b>맨 마지막 문장</b>에 있습니다. 3번의 <b>write it in spoken language</b>가 유일한 명령문이고, 8번이 그 말을 다시 확인해 줍니다. 4·5번의 '문어체는 복잡하고 거리감이 있다'는 주장이 아니라 <b>그렇게 하라는 이유</b>이고, 6·7번의 '복잡한 문장은 필요 없다'는 <b>간결하게</b>라는 조건을 더해 줍니다. 그래서 답은 '구어체로 · 간결하게' 두 조건을 모두 담은 것이어야 합니다."}], "opts": [{"n": "①", "t": "구어체로 간결하게 글을 쓰라.", "a": true, "x": false, "trap": false, "e": "3번의 <b>spoken language</b>가 '구어체로', 6·7번의 '복잡한 문장은 필요 없다'가 '간결하게'에 그대로 대응합니다. 두 조건을 모두 담은 선지는 이것뿐입니다."}, {"n": "②", "t": "자신의 생각을 명확하게 표현하라.", "a": false, "x": true, "trap": true, "e": "글은 '<b>어떤 문체로</b> 쓸 것인가'를 말하고 있지, 생각을 명확히 하라는 말은 하지 않습니다. express ideas라는 표현이 6번에 나오지만 그건 '복잡한 문장이 필요 없다'는 말의 일부입니다."}, {"n": "③", "t": "상대방의 입장을 고려하여 말하라.", "a": false, "x": true, "trap": false, "e": "이 글은 <b>말하기</b>가 아니라 <b>글쓰기</b>에 대한 글입니다. spoken language는 '말하라'가 아니라 '말하듯이 쓰라'는 뜻입니다."}, {"n": "④", "t": "글을 쓸 때 진부한 표현을 자제하라.", "a": false, "x": true, "trap": false, "e": "진부한 표현(cliché)에 대한 언급은 한 줄도 없습니다. 글이 경계하는 것은 진부함이 아니라 <b>복잡함과 격식</b>입니다."}, {"n": "⑤", "t": "친근한 소재를 사용하여 대화를 시작하라.", "a": false, "x": true, "trap": false, "e": "7번에 lunch 같은 친근한 소재가 나오지만 그건 '전문가도 평소엔 쉬운 문장을 쓴다'는 <b>비유</b>일 뿐, 소재를 고르라는 조언이 아닙니다."}], "w": [["come over", "(감정 등이) ~에게 밀려오다"], ["spoken language", "구어(체)"], ["written language", "문어(체)"], ["complex", "복잡한"], ["formal", "격식을 차린"], ["distant", "거리감 있는"], ["lose attention", "집중력을 잃다"], ["specialist", "전문가"], ["complicated", "복잡한, 까다로운"], ["manage to", "그럭저럭 ~해내다"]]}, {"q": "02", "type": "밑줄 함의", "src": "2022년 9월 21번", "ans": "③", "tr": [["1", "고객은 '항상' 옳은가?"], ["2", "주방과 욕실 붙박이 설비를 만드는 어느 유명 회사에 고객이 고장 난 제품을 반품하면, 그 회사는 좋은 고객 관계를 유지하려고 거의 언제나 교체품을 내준다."], ["3", "그래도 \"'안 된다'고 말해야만 하는 때가 있다\"고 그 회사의 품질 보증 전문가는 설명한다. \"제품이 손상되지 않았거나 함부로 사용된 경우 같은 때 말이다.\""], ["4", "전자상거래 회사를 소유한 기업가 Lauren Thorp는 말한다. \"고객이 '항상' 옳긴 하지만, 때로는 그냥 고객을 해고해야 합니다.\""], ["5", "Thorp는 불만을 해결하려고 온갖 방법을 다 써 봤는데도 그 고객이 무슨 수를 써도 만족하지 않으리라는 것을 깨달으면, 자신이 \"내 성공의 이유\"라고 말하는 나머지 고객들에게로 관심을 돌린다."]], "evh": "3 · 5번 문장", "ev": [{"en": true, "h": "\"there are times you've got to say 'no,'\" ... \"such as when a product is undamaged or has been abused.\" / When Thorp has tried everything to resolve a complaint and realizes that the customer will be dissatisfied no matter what, she returns her attention to the rest of her customers."}, {"en": false, "h": "밑줄 표현은 <b>바로 앞뒤에서 다른 말로 반드시 한 번 더 설명</b>됩니다. 앞의 3번이 '<b>안 된다고 말해야 할 때</b>가 있다 — 제품이 멀쩡하거나 함부로 쓴 경우'라고 미리 풀어 주었고, 뒤의 5번이 '<b>무슨 수를 써도 만족하지 않을 고객</b>은 놓고 나머지 고객에게 간다'로 다시 풀어 줍니다. 즉 fire a customer는 '해고'가 아니라 <b>정당하지 않은 요구를 더는 받아 주지 않는다</b>는 뜻입니다."}], "opts": [{"n": "①", "t": "deal with a customer's emergency", "a": false, "x": true, "trap": false, "e": "'고객의 비상 상황을 처리하다'입니다. 급한 상황을 <b>더 챙겨 준다</b>는 뜻이라 '그만 받아 준다'는 흐름과 정반대입니다."}, {"n": "②", "t": "delete a customer's purchasing record", "a": false, "x": true, "trap": false, "e": "'구매 기록을 삭제하다'입니다. 기록이나 개인정보 이야기는 글에 전혀 없습니다. fire를 '기록을 지운다'로 억지로 연결한 선지입니다."}, {"n": "③", "t": "reject a customer's unreasonable demand", "a": true, "x": false, "trap": false, "e": "3번의 <b>undamaged or has been abused</b>(멀쩡하거나 함부로 쓴 제품)가 바로 '부당한 요구'이고, say 'no'가 reject입니다."}, {"n": "④", "t": "uncover the hidden intention of a customer", "a": false, "x": true, "trap": true, "e": "'숨은 의도를 밝혀내다'입니다. Thorp는 고객의 속셈을 <b>파헤치는</b> 것이 아니라 더 이상 붙잡지 않고 <b>관심을 돌립니다</b>."}, {"n": "⑤", "t": "rely on the power of an influential customer", "a": false, "x": true, "trap": false, "e": "'영향력 있는 고객의 힘에 의존하다'입니다. 5번의 the rest of her customers는 '영향력 있는' 고객이 아니라 그냥 <b>나머지 다수</b>입니다."}], "w": [["fixture", "붙박이 설비"], ["replacement", "교체(품)"], ["maintain", "유지하다"], ["warranty", "품질 보증(서)"], ["undamaged", "손상되지 않은"], ["abuse", "함부로 다루다"], ["entrepreneur", "기업가"], ["resolve", "해결하다"], ["dissatisfied", "불만족한"], ["no matter what", "무슨 일이 있어도"]]}, {"q": "03", "type": "글의 요지", "src": "2019학년도 수능 22번", "ans": "④", "tr": [["1", "산업 사회가 정보 기반 사회로 진화하면서, 하나의 제품으로서, 즉 그 자체의 가치를 지닌 상품으로서의 정보라는 개념이 등장했다."], ["2", "그 결과 최고 수준의 정보를 가진 사람과 조직, 국가가 경제적·사회적·정치적으로 번영할 가능성이 크다."], ["3", "정보의 경제적 측면에 대한 연구는 정보와 정보 서비스의 비용, 정보가 의사 결정에 미치는 영향, 효과적인 정보 획득에서 오는 절약, 정보가 생산성에 미치는 영향, 그리고 (기업·기술·의학 도서관 같은) 특정 기관이 조직의 생산성에 미치는 영향 등 다양한 범주를 아우른다."], ["4", "분명 이 영역들 중 다수가 서로 겹치지만, 정보가 그것을 담고 있는 매체 바깥에서 독자적인 생명력을 갖게 되었다는 것은 분명하다."], ["5", "정보는 측정되고 평가되고 값이 매겨지는, 인정받는 실체가 되었다."]], "evh": "1 · 4 · 5번 문장", "ev": [{"en": true, "h": "the concept of information as a product, a commodity with its own value, has emerged. / information has taken on a life of its own outside the medium in which it is contained. / Information has become a recognized entity to be measured, evaluated, and priced."}, {"en": false, "h": "요지는 <b>첫 문장과 마지막 두 문장</b>에 몰려 있습니다. 1번의 <b>a commodity with its own value</b>(그 자체의 가치를 지닌 상품), 4번의 <b>a life of its own</b>(독자적인 생명력), 5번의 <b>measured, evaluated, and priced</b>(측정·평가·가격 책정)가 모두 같은 말입니다 — 정보가 <b>그 자체로 값이 매겨지는 상품</b>이 되었다는 것. 3번의 긴 나열은 근거를 늘어놓은 <b>예시</b>일 뿐이므로 요지가 될 수 없습니다."}], "opts": [{"n": "①", "t": "정보화된 사회일수록 개인 정보 보호가 필요하다.", "a": false, "x": true, "trap": false, "e": "개인 정보(privacy)나 보호에 관한 말은 한 줄도 없습니다. '정보'라는 단어만 겹칩니다."}, {"n": "②", "t": "정보의 효율적 교환은 조직의 생산성을 향상시킨다.", "a": false, "x": true, "trap": true, "e": "3번에 productivity가 나오긴 하지만 그건 <b>연구 범주를 나열한 예시</b>의 일부입니다. 예시에 나온 표현을 요지로 올리면 안 됩니다."}, {"n": "③", "t": "정보 처리의 단순화는 신속한 의사 결정에 도움이 된다.", "a": false, "x": true, "trap": false, "e": "decision making도 3번의 나열 속 한 항목일 뿐이고, '단순화'나 '신속함'은 글에 없는 말입니다."}, {"n": "④", "t": "정보 기반 사회에서 정보는 독자적 상품 가치를 지닌다.", "a": true, "x": false, "trap": false, "e": "1번의 commodity with its own value와 4번의 a life of its own, 5번의 priced를 그대로 옮긴 문장입니다."}, {"n": "⑤", "t": "정보 기반 사회에서는 정보를 전달하는 방식이 중요하다.", "a": false, "x": true, "trap": false, "e": "4번의 <b>medium</b>(매체)을 보고 고르기 쉽지만, 글은 정보가 매체 <b>바깥에서</b> 독자적 가치를 갖게 되었다고 말합니다. 전달 방식이 중요하다는 말과는 정반대에 가깝습니다."}], "w": [["evolve into", "~로 진화하다"], ["commodity", "상품, 물품"], ["emerge", "나타나다, 등장하다"], ["as a consequence", "그 결과"], ["possess", "소유하다"], ["prosper", "번영하다"], ["encompass", "아우르다, 포함하다"], ["acquisition", "획득, 습득"], ["productivity", "생산성"], ["entity", "실재(물), 개체"]]}, {"q": "04", "type": "어법", "src": "2023년 3월 29번", "ans": "⑤", "tr": [["1", "동물에게 투영되는 가장 눈에 띄는 인간적 특징은 그들이 인간의 언어로 말할 수 있다는 것이다."], ["2", "생김새 면에서도 동물 만화 캐릭터나 동물을 본떠 만든 장난감은 대개 사람을 닮는 쪽으로 변형된다."], ["3", "이는 사람 같은 얼굴 이목구비와, 사람 손을 닮도록 변형된 앞다리를 가진 모습으로 그들을 보여 줌으로써 이루어진다."], ["4", "더 최근의 애니메이션 영화에서는 동물을 더 '자연스러운' 방식으로 보여 주는 것이 추세였다."], ["5", "하지만 동물들은 여전히 앞다리를 사람 손처럼 쓰고(가령 사자는 발 하나로 작은 물건을 집어 들어 올릴 수 있다), 여전히 알맞은 표정으로 말을 한다."], ["6", "동물 캐릭터를 아이와 어른 모두에게 정서적으로 더 매력적으로 만들기 위해 쓰이는 일반적인 전략은, 그들에게 확대되고 변형된 어린아이 같은 특징을 부여하는 것이다."]], "evh": "6번 문장", "ev": [{"en": true, "h": "A general strategy that is used to make the animal characters more emotionally appealing, both to children and adults, ⑤ are to give them enlarged and deformed childlike features."}, {"en": false, "h": "어법 문제에서 <b>동사가 밑줄</b>이면 가장 먼저 <b>주어를 찾습니다</b>. 이 문장의 주어는 <b>A general strategy</b>로 <b>단수</b>입니다. 그 뒤의 that is used ~ appealing은 주어를 꾸미는 <b>관계사절</b>, both to children and adults는 <b>삽입구</b>라 주어와 동사 사이를 길게 벌려 놓았을 뿐입니다. 바로 앞의 복수명사 adults를 주어로 착각하게 만드는 것이 이 문제의 함정입니다. 따라서 <b>are → is</b>."}], "opts": [{"n": "①", "t": "that (is ① that they can talk)", "a": false, "x": true, "trap": false, "e": "be동사 뒤에서 <b>보어 역할을 하는 명사절</b>을 이끄는 접속사 that입니다. 뒤에 they can talk이라는 완전한 절이 오므로 what이 아니라 that이 맞습니다."}, {"n": "②", "t": "made (toys ② made after animals)", "a": false, "x": true, "trap": false, "e": "toys를 뒤에서 꾸미는 <b>과거분사</b>입니다. 장난감은 '만든' 것이 아니라 '<b>만들어진</b>' 것이므로 수동인 made가 맞습니다. 뒤에 진짜 동사 are가 따로 있습니다."}, {"n": "③", "t": "showing (by ③ showing them)", "a": false, "x": true, "trap": false, "e": "<b>by는 전치사</b>이므로 뒤에는 명사 자리입니다. 동사원형 show가 아니라 <b>동명사 showing</b>이 맞습니다."}, {"n": "④", "t": "like (their front legs ④ like human hands)", "a": false, "x": true, "trap": true, "e": "뒤에 절이 아니라 명사구(human hands)만 오므로 '<b>~처럼</b>'이라는 <b>전치사 like</b>가 맞습니다. as로 바꾸려면 뒤에 절이 와야 합니다."}, {"n": "⑤", "t": "are → is", "a": true, "x": false, "trap": false, "e": "주어가 단수 <b>A general strategy</b>이므로 동사도 단수 is여야 합니다. 주어와 동사 사이에 관계사절과 삽입구가 끼어 있을 뿐입니다."}], "w": [["noticeable", "눈에 띄는"], ["project onto", "~에 투영하다"], ["deform", "변형하다"], ["in such a way as to", "~하도록 그런 방식으로"], ["resemble", "닮다"], ["facial features", "얼굴 이목구비"], ["appropriate", "적절한"], ["appealing", "마음을 끄는"], ["enlarged", "확대된"], ["childlike", "어린아이 같은"]]}, {"q": "05", "type": "문맥상 어휘", "src": "2020학년도 수능 30번", "ans": "④", "tr": [["1", "Paula가 심한 공포증을 앓고 있다는 것을 우리가 안다고 가정해 보자."], ["2", "우리가 Paula는 뱀이나 거미 둘 중 하나를 무서워한다고 추론하고, 그다음 그녀가 뱀을 무서워하지 않는다는 것을 밝히면, 우리는 Paula가 거미를 무서워한다고 결론지을 것이다."], ["3", "하지만 우리의 결론은 Paula의 두려움이 정말로 뱀 아니면 거미와 관련될 때에만 타당하다."], ["4", "우리가 Paula에게 공포증이 있다는 것만 안다면, 그녀가 뱀을 무서워하지 않는다는 사실은 그녀가 높은 곳이나 물, 개, 혹은 숫자 13을 무서워하는 것과 전혀 모순되지 않는다."], ["5", "더 일반적으로, 어떤 현상에 대한 여러 대안적 설명의 목록을 제시받고 그중 하나만 빼고 전부 만족스럽지 못하다고 설득당했을 때, 우리는 잠시 멈춰 생각해 봐야 한다."], ["6", "남은 설명이 옳은 것이라고 부정하기(→ 받아들이기) 전에, 다른 그럴듯한 선택지가 무시되거나 간과되고 있지는 않은지 따져 보라."], ["7", "잘못된 양자택일의 오류는, 겉으로 드러난 선택지가 합리적인 대안을 남김없이 다 담고 있다는 중요한 숨은 전제에 우리가 충분히 주의하지 않을 때 우리를 잘못된 길로 이끈다."]], "evh": "5 · 6번 문장", "ev": [{"en": true, "h": "when we are presented with a list of alternative explanations ... and are then persuaded that all but one of those explanations are unsatisfactory, we should pause to reflect. / Before ④ denying that the remaining explanation is the correct one, consider whether other plausible options are being ignored or overlooked."}, {"en": false, "h": "5번이 상황을 깔아 줍니다 — '<b>하나만 빼고 다 틀렸다</b>고 설득당하면 멈춰서 생각하라'. 그러면 6번은 그 <b>남은 하나를 정답으로 받아들이기 전에</b> 다른 선택지가 빠지지 않았는지 확인하라는 말이 되어야 합니다. 그런데 <b>denying</b>(부정하기)을 넣으면 '남은 설명이 옳다고 부정하기 전에'가 되어 흐름이 <b>거꾸로</b> 뒤집힙니다. accepting / concluding 정도가 들어가야 합니다."}], "opts": [{"n": "①", "t": "establish (그다음 그녀가 뱀을 무서워하지 않음을 밝히면)", "a": false, "x": true, "trap": false, "e": "양자택일 추론의 <b>둘째 단계</b>입니다. 하나를 <b>사실로 확정해야</b> 나머지 하나로 결론이 나므로 establish가 맞습니다."}, {"n": "②", "t": "consistent with (뱀을 안 무서워한다는 사실은 ~와 모순되지 않는다)", "a": false, "x": true, "trap": false, "e": "공포증이 있다는 것만 알 때, 뱀을 안 무서워한다는 사실은 높은 곳·물·개를 무서워하는 것과 <b>얼마든지 양립합니다</b>. 그래서 결론이 성급하다는 논지입니다."}, {"n": "③", "t": "unsatisfactory (하나만 빼고 전부 만족스럽지 못하다고)", "a": false, "x": true, "trap": false, "e": "'나머지가 다 <b>탈락</b>했다'는 뜻이라야 남은 하나가 정답처럼 보입니다. 흐름에 맞습니다."}, {"n": "④", "t": "denying → accepting", "a": true, "x": false, "trap": false, "e": "5번이 '남은 하나를 정답으로 삼기 전에 멈추라'고 했으므로, 6번은 <b>받아들이기 전에</b> 확인하라가 되어야 합니다. denying은 방향이 정반대입니다."}, {"n": "⑤", "t": "sensible (합리적인 대안을 남김없이 다 담고 있다)", "a": false, "x": true, "trap": true, "e": "숨은 전제는 '<b>드러난 선택지가 말이 되는 대안 전부</b>'라는 것입니다. sensible alternatives가 그 전제를 정확히 표현합니다."}], "w": [["suffer from", "~을 앓다"], ["phobia", "공포증"], ["reason", "추론하다"], ["establish", "(사실로) 밝히다"], ["consistent with", "~와 모순되지 않는"], ["alternative", "대안(의)"], ["all but one", "하나만 빼고 전부"], ["plausible", "그럴듯한"], ["fallacy", "오류"], ["exhaust", "남김없이 다 담다"]]}, {"q": "06", "type": "빈칸 추론", "src": "2018년 6월 32번", "ans": "①", "tr": [["1", "유능한 관리자는 업무를 맡길 때 처음에 드는 불안감을 극복하는 법을 배웠다."], ["2", "그들은 어떤 두 사람도 똑같은 방식으로 일하지는 않는다는 것을 알기에, 한 직원이 다른 직원과 다르게 업무를 해 나가는 것을 봐도 위협을 느끼지 않는다."], ["3", "대신 그들은 최종 결과에 집중한다."], ["4", "일이 성공적으로 처리되었다면, 사람들이 조직이 받아들일 만한 방식으로 일하고 있는 한(예를 들어 영업 사원이 회사의 윤리적 판매 방침을 지키고 있는 한) 그것으로 괜찮다."], ["5", "받아들일 만한 최종 결과가 나오지 않았다면, 그런 관리자는 직원과 그 일을 논의하고 상황을 분석하면서, 그 사람이 앞으로 그 업무를 성공적으로 해내려면 어떤 교육이나 추가 기술이 필요할지 알아내는 식으로 대응한다."]], "evh": "4 · 5번 문장", "ev": [{"en": true, "h": "If a job was successfully done ... then that's fine. / If an acceptable final outcome wasn't achieved, then such managers respond by discussing it with the employee ..."}, {"en": false, "h": "빈칸의 답은 <b>빈칸 뒤 두 문장</b>에 그대로 있습니다. 4번은 '<b>일이 잘 되었으면</b> 그걸로 괜찮다', 5번은 '<b>받아들일 만한 최종 결과가 안 나왔으면</b> 그때 개입한다'입니다. 두 문장 모두 판단 기준이 <b>과정</b>이 아니라 <b>결과</b>입니다. 게다가 5번에 <b>final outcome</b>이라는 표현이 아예 그대로 등장합니다. 2번의 '사람마다 방식이 다르다'는 <b>과정은 따지 function esc2(s){return String(s)}
function mdWrap(s){s=String(s);let o='',d=0,buf='',i=0;
const flush=()=>{if(buf){o+=(d===0&&/[A-Za-z0-9가-힣]/.test(buf))?'<span class="cr">'+buf+'</span>':buf;buf='';}};
while(i<s.length){const ch=s[i];
if(ch==='<'){const j=s.indexOf('>',i);buf+=s.slice(i,j+1);i=j+1;continue;}
if(ch==='\x01'){flush();if(d===0)o+='<span class="md">';o+='(';d++;i++;continue;}
if(ch==='\x02'){flush();o+=')';d--;if(d===0)o+='</span>';i++;continue;}
buf+=ch;i++;}
flush();return o;}

function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}

  mmInit();
}
/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
