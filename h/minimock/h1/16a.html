<title>고1 미니모의고사 16회 01–06번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:84px}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}
.ko{color:var(--sub);font-size:14px;margin-left:6px}
.cell.bad{background:var(--badbg);border-color:var(--bad)}
.cell.bad .tag{background:var(--bad)}
.locked .cell{pointer-events:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.done .opt{pointer-events:none}
.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}
.hcard .chip{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--sub)}
.hcard .chip.ok{background:var(--goodbg);color:var(--good)}
.hcard .chip.warn{background:var(--badbg);color:var(--bad)}
.hcard[disabled]{opacity:.55}
details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.th .hd{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:6px}
.th ol{list-style:none;margin:0;padding:0;counter-reset:n}
.th li{counter-increment:n;position:relative;padding:7px 0 7px 30px;font-size:15px;line-height:1.7;border-top:1px dashed #cfdcf0}
.th li:first-child{border-top:0}
.th li:before{content:counter(n);position:absolute;left:0;top:9px;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;text-align:center;line-height:21px}
.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.th .sub{margin:3px 0 0;color:#444;font-size:14.5px;line-height:1.7}
.sc .lay.sum{border-left:4px solid #2e7d32;background:#f1f8f1}
/* ---- 새 직독직해·해설 화면 ---- */
.sc{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden;background:var(--bg)}
.sc-h{padding:11px 14px 10px;background:#eef2f8;border-bottom:1px solid var(--line)}
.sc-h .no2{display:inline-block;min-width:26px;height:26px;line-height:26px;border-radius:13px;background:var(--accent);color:#fff;font-weight:800;font-size:13px;text-align:center;padding:0 7px;margin-right:8px}
.sc-h .at{font-size:13px;color:var(--sub)}
.sc-h .tt{display:block;margin-top:7px;font-size:15.5px;font-weight:800;color:var(--accent);line-height:1.45}
.sc-b{padding:10px 12px 12px}
.sc .ch{margin-bottom:6px}
.sc .ce{font-size:17px}
.sc .ce sup,.nt sup{font-size:10px;font-weight:800;color:#b8651f;margin-left:1px}
.nts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.nt{font-size:13.5px;line-height:1.5;background:#fbf6ee;border:1px solid #f0e2cd;border-radius:8px;padding:5px 9px;color:#4a3a22}

.sc .lay{border-radius:10px}
.sc .lay.nat{border-left:4px solid var(--accent);background:#f7f9fc}

.sc .lb{margin-bottom:4px}
.qc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}
.qchip small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-bottom:1px}
.qchip.o{border-color:var(--good);background:var(--goodbg)}
.qchip.x{border-color:var(--bad);background:var(--badbg)}
.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.trs{list-style:none;margin:0;padding:0;background:var(--soft);border-radius:10px;padding:8px 12px}
.trs li{font-size:15px;line-height:1.75;padding:2px 0}
.trs .n{display:inline-block;min-width:20px;font-size:12px;color:var(--sub);font-weight:700}
.evx{background:var(--goodbg);border:1px solid #bfe0cd;border-radius:10px;padding:10px 12px}

.opx{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px;background:var(--bg)}

.wds{display:flex;flex-wrap:wrap;gap:6px}
.wds span{font-size:14px;background:var(--soft);border-radius:8px;padding:5px 9px;line-height:1.45}
.wds b{margin-right:5px}
.toq{display:block;width:100%;margin-top:14px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}
details.sub2{margin:12px 0 0}
details.sub2>summary{list-style:none;cursor:pointer;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px;padding:6px 0}

.cr{color:#A3102E;font-weight:700}
.sc .lay.core{border-left:4px solid #2e7d32;background:#f1f8f1}
.ct{display:none;margin:7px 0 2px;padding:6px 9px;border-left:3px solid #d9a21b;background:#fff8e6;border-radius:6px;font-size:13.5px;line-height:1.55;color:#4d3b05}

.rst{margin-top:8px;background:#fff8e1;border:1px solid #efe3b8;border-left:4px solid #d9a21b;border-radius:8px;padding:8px 10px;font-size:15px;line-height:1.7;word-break:keep-all}

, "typ": "제목 추론", "src": "2022학년도 수능 24번", "evn": [5, 7], "ev_en": "But repair continued to require a larger grasp of design and materials, an understanding of the whole and a comprehension of the designer’s intentions. / But all repairing must be done by hand.", "ev_ko": [[5, "그러나 수리는 설계와 재료에 대한 더 큰 이해, 즉 전체와 설계자의 의도에 대한 이해를 계속 필요로 했다."], [7, "\"그러나 모든 수리는 반드시 손으로 '해야 한다'."]], "why": ["7번에서 모든 수리는 반드시 <b>'손으로'<\/b> 해야 한다고 합니다", "기계가 아니라 사람의 몫이라는 뜻입니다", "5번에서도 수리는 계속 더 큰 <b>이해<\/b>를 필요로 했다고 합니다", "이 내용을 가장 잘 묶은 제목이 ①입니다."], "ch": [{"n": "①", "t": "Still Left to the Modern Blacksmith: The Art of Repair", "g": "현대 대장장이에게 여전히 남겨진 것: 수리의 기술", "ok": true, "e": ["산업화 이후에도 수리는 기계가 아니라 사람의 몫이라는 내용(5번·7번)과 일치합니다."]}, {"n": "②", "t": "A Historical Survey of How Repairing Skills Evolved", "g": "수리의 기술이 어떻게 발전했는가에 관한 역사적 조사", "ok": false, "e": ["역사를 쭉 훑어보는 글이 아닙니다", "지문은 수리가 사람의 손과 이해를 필요로 한다는 점을 말합니다(5번·7번)."]}, {"n": "③", "t": "How to Be a Creative Repairperson: Tips and Ideas", "g": "창의적 수리공이 되는 방법: 조언과 아이디어", "ok": false, "e": ["창의적인 수리공이 되는 <b>방법·조언<\/b>을 주는 글이 아닙니다."]}, {"n": "④", "t": "A Process of Repair: Create, Modify, Transform!", "g": "수리의 과정: 만들고, 수정하고, 변형하라!", "ok": false, "e": ["수정(modifying)·변형(transforming)은 2번에서 대장장이의 작업으로 나올 뿐입니다", "글 전체가 말하는 내용(수리는 사람의 몫)은 아닙니다."]}, {"n": "⑤", "t": "Can Industrialization Mend Our Broken Past?", "g": "산업화가 우리의 부서진 과거를 고칠 수 있을까?", "ok": false, "e": ["산업화가 과거를 고칠 수 있는지 묻는 글이 아닙니다", "기계는 고장 난 것을 고칠 수 없다(8번)는 내용과 오히려 반대 방향입니다."]}], "tr": ["물건을 고치고 복원하는 것은 흔히 최초 제작보다 훨씬 더 많은 창의력을 필요로 한다.", "산업화 이전의 대장장이는 아주 가까이에 있는 그의 지역 사회 사람들을 위해 주문에 따라 물건을 만들었고, 제품을 주문 제작하고 사용자에게 맞게 그것을 수정하거나 변형하는 일이 일상적이었다.", "고객들은 뭔가 잘못되면 물건을 (대장장이에게) 다시 가져오곤 했고, 따라서 수리는 제작의 연장이었다.", "산업화와 함께 결국 대량 생산이 이루어지면서, 물건을 만드는 것은 제한된 지식을 지닌 기계 관리자의 영역이 되었다.", "그러나 수리는 설계와 재료에 대한 더 큰 이해, 즉 전체와 설계자의 의도에 대한 이해를 계속 필요로 했다.", "1896년의 〈Manual of Mending and Repairing(고치고 수리하는 것의 설명서)〉은 \"제조업자들은 모두 기계나 노동의 방대한 세분화로(분업으로) 일하고, 말하자면 수작업으로 일하지 않는다.\"라고 설명했다.", "\"그러나 모든 수리는 반드시 function esc(x){return String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function shuffle(arr,seed){const a=arr.slice();let s=hash(seed)||1;for(let i=a.length-1;i>0;i--){s=Math.imul(s^(s>>>15),2246822519)>>>0;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}

function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}

}

var EXP={"01": "<p class=\"mtr\">마더텅 정답률 <b>85%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">첫 문장은 ‘어른도 놀이에 끼자’지만 바로 <b>However</b>(하지만)로 뒤집혀요. 전환어 뒤 <b>must</b>(~해야 한다) 문장이 주장이고, 4번 <b>control</b>(통제)이 그 뜻을 풀어 줘요.</p><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 앞부분(뒤집힐 말)</span><div class=\"en\">we should strongly encourage, and even join in their language play.</div><p class=\"ko\">우리는 적극적으로 장려해야 하고, 심지어 그들의 언어 놀이에 동참해야 한다.</p></div><div class=\"ck-via\"><i>▼</i><span>However(하지만) 뒤가 필자의 진짜 생각</span></div><div class=\"ck-step key\"><span class=\"lab\">2번 문장 · 결정적 단서</span><div class=\"en\"><mark>However</mark>, the play <mark>must be owned by the children</mark>.</div><p class=\"ko\"><mark>하지만</mark>, 그 놀이는 <mark>아이들에 의해 소유되어야 한다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>주인이 아이가 아니면 어떻게 되는지 경고해요</span></div><div class=\"ck-step\"><span class=\"lab\">3번 문장 · 어른이 쥐면 생기는 일</span><div class=\"en\">If it becomes another educational tool for adults to use … it loses its very essence.</div><p class=\"ko\">어른들이 사용하는 또 다른 교육적 수단이 된다면 … 그것은 참된 본질을 잃게 된다.</p></div><div class=\"ck-via\"><i>▼</i><span>owned(소유된)를 ‘통제권’으로 구체화해요</span></div><div class=\"ck-step key\"><span class=\"lab\">4번 문장 · ‘주인’의 뜻 풀이</span><div class=\"en\">Children need to be able to … <mark>have control over the pace, timing, direction, and flow</mark>.</div><p class=\"ko\">아이들은 … <mark>속도, 타이밍, 방향, 흐름을 통제할 수 있어야 한다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">아이들이 언어 놀이를 주도하게 하라.<small>owned by the children(아이들이 주인)·control(통제)을 ‘주도’로 옮긴 말이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">아이들에게 다양한 언어 자극을 제공하라.</span><span class=\"why\">[반대] 어른이 자극을 ‘주는’ 쪽이라 놀이의 주인이 어른이 돼요. 3번은 놀이가 어른이 쓰는 교육 수단(educational tool)이 되면 본질을 잃는다고 했어요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">아이들의 질문에 즉각적으로 반응하라.</span><span class=\"why\">[지문에 없음] 4번 immediate(즉각적인)는 아이들의 놀이를 꾸미는 말이지, 어른의 반응 속도 얘기가 아니에요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">대화를 통해 아이들의 공감 능력을 키워라.</span><span class=\"why\">[지문에 없음] 공감 능력은 한 번도 안 나와요. 지문의 화제는 놀이의 주인이 누구냐예요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">언어 놀이를 통해 자녀와의 관계를 회복하라.</span><span class=\"why\">[지문에 없음] 부모와 자녀 사이가 나빠졌다거나 회복하자는 말이 없어요. 1번처럼 지문은 아이의 언어 학습과 발달(development)을 말해요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Language play is good</div><div class=\"k\">언어 놀이는 유익하다</div></div><div class=\"rc\"><div class=\"e\">for children’s language learning and development,</div><div class=\"k\">아이들의 언어 학습과 발달에,</div></div><div class=\"rc\"><div class=\"e\">and therefore we should strongly encourage,</div><div class=\"k\">그래서 우리는 적극적으로 장려해야 한다,</div></div><div class=\"rc\"><div class=\"e\">and even join in their language play.</div><div class=\"k\">그리고 심지어 그들(= 아이들)의 언어 놀이에 동참해야 한다.</div></div><div class=\"rnat\">언어 놀이는 아이들의 언어 학습과 발달에 유익하기 때문에 우리는 아이들의 언어 놀이를 적극적으로 장려하고 심지어 그들(아이들)의 언어 놀이에 동참해야 한다.</div><div class=\"rst\">동생이 말장난 놀이를 하면 좋아요. 그래서 형·누나도 같이 끼어 줘야 해요. = 지문의 ‘장려하고 동참하라’예요.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">2번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">However</span>,</div><div class=\"k\"><span class=\"cw\">하지만</span>,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">the play must be owned by the children</span>.</div><div class=\"k\">그 놀이는 <span class=\"cw\">아이들에 의해 소유되어야 한다</span>(아이들이 주체가 되어야 한다).</div></div><div class=\"rnat\">하지만 언어 놀이는 아이들에 의해 소유되어야 한다(아이들이 주체가 되어야 한다).</div><div class=\"rst\"><b>하지만</b>(However) 놀이의 대장은 동생이어야 해요. 지문도 놀이는 <b>아이들 것</b>이어야 한다고 못 박아요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">If it becomes</div><div class=\"k\">만약 그것(= 언어 놀이)이 ~이 된다면</div></div><div class=\"rc\"><div class=\"e\">another educational tool</div><div class=\"k\">또 다른 교육적 수단</div></div><div class=\"rc\"><div class=\"e\">for adults to use</div><div class=\"k\">어른들이 사용하는</div></div><div class=\"rc\"><div class=\"e\">to produce outcomes,</div><div class=\"k\">(의도한) 결과를 만들어내기 위해,</div></div><div class=\"rc\"><div class=\"e\">it loses its very essence.</div><div class=\"k\">그것은 그것의 참된 본질을 잃게 된다.</div></div><div class=\"rnat\">만약 그것(언어 놀이)이 (의도한) 결과를 만들어내기 위해 어른들이 사용하는 또 다른 교육적 수단이 된다면, 그것은 그것의 참된 본질을 잃게 된다.</div><div class=\"rst\">내가 “자, 이제 단어 공부하자!” 하고 놀이를 숙제로 바꾸면 재미가 사라져요. 지문도 그러면 본질(essence)을 잃는다고 해요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">Children need to be able to</div><div class=\"k\">아이들은 ~할 수 있어야 한다</div></div><div class=\"rc\"><div class=\"e\">delight in creative and immediate language play,</div><div class=\"k\">창의적이고 즉각적인 언어 놀이에서 즐거워하고,</div></div><div class=\"rc\"><div class=\"e\">to say silly things</div><div class=\"k\">유치한 것들을 말하고</div></div><div class=\"rc\"><div class=\"e\">and make themselves laugh,</div><div class=\"k\">그들 자신을 웃게 만들고,</div></div><div class=\"rc ckc\"><div class=\"e\">and <span class=\"cw\">to have control over the pace, timing, direction, and flow</span>.</div><div class=\"k\">(언어 놀이의) 속도, 타이밍, 방향, <span class=\"cw\">흐름을 통제할 수 있어야 한다</span>.</div></div><div class=\"rnat\">아이들은 창의적이고 즉각적인 언어 놀이에서 즐거워하고, 유치한 것들을 말해서 그들 자신을 웃게 만들고, (언어 놀이의) 속도, 타이밍, 방향, 흐름을 통제할 수 있어야 한다.</div><div class=\"rst\">동생이 엉뚱한 말로 깔깔 웃고, 언제 멈출지 어디로 갈지도 <b>스스로 정해야</b> 해요. = 지문의 속도·방향 통제(control)예요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">When children are allowed to develop their language play,</div><div class=\"k\">아이들이 자신의 언어 놀이를 발전시키는 것이 허용될 때,</div></div><div class=\"rc\"><div class=\"e\">a range of benefits result from it.</div><div class=\"k\">다양한 이점들이 그것으로부터 생긴다.</div></div><div class=\"rnat\">아이들이 자신의 언어 놀이를 발전시키는 것이 허용될 때, 그것으로부터 다양한 이점들이 생긴다.</div><div class=\"rst\">동생이 대장 노릇을 하게 두면 말도 늘고 좋은 점이 많아져요. 그래서 지문은 다양한 이점(benefits)이 생긴다고 마무리해요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"own\" data-m=\"소유하다, 주도하다\"><b>own</b>소유하다, 주도하다</button><button type=\"button\" class=\"wdb\" data-w=\"essence\" data-m=\"본질\"><b>essence</b>본질</button><button type=\"button\" class=\"wdb\" data-w=\"delight in\" data-m=\"~을 즐거워하다\"><b>delight in</b>~을 즐거워하다</button><button type=\"button\" class=\"wdb\" data-w=\"immediate\" data-m=\"즉각적인\"><b>immediate</b>즉각적인</button><button type=\"button\" class=\"wdb\" data-w=\"have control over\" data-m=\"~을 통제하다\"><b>have control over</b>~을 통제하다</button><button type=\"button\" class=\"wdb\" data-w=\"a range of\" data-m=\"다양한\"><b>a range of</b>다양한</button></div>", "02": "<p class=\"mtr\">마더텅 정답률 <b>80%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">도표 문제는 <b>분수·비율 표현</b>(more than half(절반이 넘는), a third(3분의 1))을 숫자로 바꿔서 도표와 맞춰 보세요. 한 선지에 두 해가 같이 나오면 <b>두 해 모두</b> 확인해야 해요.</p><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>①</em>2번: 노트북이 두 해 모두 1위 → 도표와 같음</span><span><em>②</em>3번: 태블릿이 두 해 모두 10명 중 6명 넘음 → 도표와 같음</span><span><em>④</em>5번: 스마트폰 비율이 두 해 같음 → 도표와 같음</span><span><em>⑤</em>6번: 전자책 단말기가 두 해 모두 꼴찌(11%, 5%) → 도표와 같음</span></div><div class=\"ck-eq\">⇒ 네 개는 도표와 같아요 → 남은 ③의 ‘절반’을 숫자로 확인</div></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step key\"><span class=\"lab\">4번 문장 · 결정적 단서</span><div class=\"en\"><mark>More than half</mark> the students used desktops to access digital content in 2016,</div><p class=\"ko\"><mark>절반이 넘는</mark> 학생들이 2016년에 디지털 콘텐츠에 접근하기 위해 데스크톱을 사용했고,</p></div><div class=\"ck-via\"><i>▼</i><span>앞부분이 이미 틀렸지만, 뒷부분은 맞는 말이라 더 헷갈려요</span></div><div class=\"ck-step\"><span class=\"lab\">4번 문장 · 뒷부분</span><div class=\"en\">and more than a third used desktops in 2019.</div><p class=\"ko\">2019년에 3분의 1이 넘는 학생들이 데스크톱을 사용했다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">2016년 데스크톱이 절반이 넘었다(more than half)<small>도표의 2016년 데스크톱은 49%라 절반(50%)에 못 미쳐요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">전자책 단말기(E-readers)가 두 해 모두 최하위(11%, 5%)</span><span class=\"why\">6번과 같아요. 숫자가 두 개나 나와서 의심되지만 11 percent(11퍼센트)·5 percent(5퍼센트) 모두 도표 그대로예요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">노트북(Laptops)이 두 해 모두 가장 많이 쓰임</span><span class=\"why\">2번과 같아요. 2016년과 2019년 모두 노트북 막대가 가장 길어요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">두 해 모두 10명 중 6명 넘게 태블릿(tablets) 사용</span><span class=\"why\">3번과 같아요. 10명 중 6명은 60%이고, 두 해 모두 태블릿 비율이 그보다 높아요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">스마트폰(smartphones) 비율이 2016년과 2019년에 같음</span><span class=\"why\">5번과 같아요. the same as(~와 같은) 그대로 두 해의 스마트폰 비율이 같아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">The above graph shows</div><div class=\"k\">위의 그래프는 보여준다</div></div><div class=\"rc\"><div class=\"e\">the percentage of students from kindergarten to 12th grade</div><div class=\"k\">유치원부터 12학년까지의 학생들의 비율을</div></div><div class=\"rc\"><div class=\"e\">who used devices to access digital educational content</div><div class=\"k\">디지털 교육 콘텐츠에 접근하기 위해 기기를 사용한</div></div><div class=\"rc\"><div class=\"e\">in 2016 and in 2019.</div><div class=\"k\">2016년과 2019년에.</div></div><div class=\"rnat\">위 그래프는 2016년과 2019년에 디지털 교육 콘텐츠에 접근하기 위해 기기를 사용한 유치원생부터 12학년까지 학생들의 비율을 보여준다.</div><div class=\"rst\">우리 반이 숙제할 때 무슨 기기를 쓰는지 두 해 동안 조사한 표라고 생각해요. = 지문의 학생 기기 사용 비율 그래프예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">① Laptops were the most used device</div><div class=\"k\">① 노트북은 가장 많이 사용된 기기였다</div></div><div class=\"rc\"><div class=\"e\">for students to access digital content</div><div class=\"k\">학생들이 디지털 콘텐츠에 접근하기 위해</div></div><div class=\"rc\"><div class=\"e\">in both years.</div><div class=\"k\">두 해 모두.</div></div><div class=\"rnat\">노트북은 두 해 모두 학생들이 디지털 콘텐츠에 접근하기 위해 가장 많이 사용한 기기였다.</div><div class=\"rst\">두 해 모두 노트북을 쓰는 친구가 제일 많았어요. = 지문의 the most used device(가장 많이 사용된 기기)예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">② Both in 2016 and in 2019,</div><div class=\"k\">② 2016년과 2019년 모두,</div></div><div class=\"rc\"><div class=\"e\">more than 6 out of 10 students</div><div class=\"k\">10명 중 6명이 넘는 학생이</div></div><div class=\"rc\"><div class=\"e\">used tablets.</div><div class=\"k\">태블릿을 사용했다.</div></div><div class=\"rnat\">2016년과 2019년 모두, 10명 중 6명이 넘는 학생이 태블릿을 사용했다.</div><div class=\"rst\">10명 중 6명 넘는 친구가 두 해 모두 태블릿을 썼어요. = 지문 3번, 태블릿이 두 해 모두 60%를 넘었다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">③ <span class=\"cw\">More than half</span> the students</div><div class=\"k\">③ <span class=\"cw\">절반이 넘는</span>(→ 절반 미만의) 학생들이</div></div><div class=\"rc ckc\"><div class=\"e\">used desktops to access digital content <span class=\"cw\">in 2016</span>,</div><div class=\"k\"><span class=\"cw\">2016년에</span> 디지털 콘텐츠에 접근하기 위해 데스크톱을 사용했고,</div></div><div class=\"rc\"><div class=\"e\">and more than a third used desktops in 2019.</div><div class=\"k\">2019년에 (전체의) 3분의 1이 넘는 학생들이 데스크톱을 사용했다.</div></div><div class=\"rnat\">2016년에 절반이 넘는(→ 절반 미만의) 학생들이 디지털 콘텐츠에 접근하기 위해 데스크톱을 사용했고, 2019년에 (전체의) 3분의 1이 넘는 학생들이 데스크톱을 사용했다.</div><div class=\"rst\">2016년 데스크톱은 49%라 <b>반이 안 돼요</b>. 그런데 지문은 more than half(절반이 넘는)라고 해서 틀렸어요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">④ The percentage of smartphones in 2016</div><div class=\"k\">④ 2016년의 스마트폰(이 차지한) 비율은</div></div><div class=\"rc\"><div class=\"e\">was the same as that in 2019.</div><div class=\"k\">2019년의 그것(= 스마트폰 비율)과 같았다.</div></div><div class=\"rnat\">2016년 스마트폰 사용 비율은 2019년의 그것과 같았다.</div><div class=\"rst\">스마트폰을 쓰는 친구 비율은 두 해가 똑같았어요. = 지문의 the same as(~와 같은)예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">⑤ E-readers ranked the lowest in both years,</div><div class=\"k\">⑤ 전자책 단말기는 두 해 모두 가장 낮은 순위를 차지했는데,</div></div><div class=\"rc\"><div class=\"e\">with 11 percent in 2016 and 5 percent in 2019.</div><div class=\"k\">2016년에 11퍼센트와 2019년에 5퍼센트였다.</div></div><div class=\"rnat\">전자책 단말기는 두 해 모두 가장 낮은 순위였는데, 2016년에는 11퍼센트, 2019년에는 5퍼센트였다.</div><div class=\"rst\">전자책 단말기는 두 해 모두 꼴찌였어요. 그래서 지문은 11퍼센트, 5퍼센트로 the lowest(가장 낮은)라고 해요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"percentage\" data-m=\"비율\"><b>percentage</b>비율</button><button type=\"button\" class=\"wdb\" data-w=\"access\" data-m=\"접근하다\"><b>access</b>접근하다</button><button type=\"button\" class=\"wdb\" data-w=\"device\" data-m=\"기기\"><b>device</b>기기</button><button type=\"button\" class=\"wdb\" data-w=\"rank\" data-m=\"순위를 차지하다\"><b>rank</b>순위를 차지하다</button><button type=\"button\" class=\"wdb\" data-w=\"more than half\" data-m=\"절반이 넘는\"><b>more than half</b>절반이 넘는</button><button type=\"button\" class=\"wdb\" data-w=\"a third\" data-m=\"3분의 1\"><b>a third</b>3분의 1</button></div>", "03": "<p class=\"mtr\">마더텅 정답률 <b>55%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">제목은 <b>But</b>(그러나)으로 뒤집히는 문장을 잡으세요. 산업화로 ‘만들기’는 기계에 넘어갔지만, <b>수리(repair)</b>는 여전히 사람 손에 남았다는 게 반복되는 결론이에요.</p><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 화제 제시</span><div class=\"en\"><mark>Mending and restoring objects</mark> often require even more creativity than original production.</div><p class=\"ko\"><mark>물건을 고치고 복원하는 것은</mark> 흔히 최초 제작보다 훨씬 더 많은 창의력을 필요로 한다.</p></div><div class=\"ck-via\"><i>▼</i><span>대장장이 시절(2·3번) 뒤 산업화로 시대가 바뀌어요</span></div><div class=\"ck-step\"><span class=\"lab\">4번 문장 · 상황 변화</span><div class=\"en\">With industrialization … making things became the province of machine tenders with limited knowledge.</div><p class=\"ko\">산업화와 함께 … 물건을 만드는 것은 제한된 지식을 지닌 기계 관리자의 영역이 되었다.</p></div><div class=\"ck-via\"><i>▼</i><span>But(그러나)으로 ‘수리만은 다르다’고 뒤집어요</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 문장 · 결정적 단서</span><div class=\"en\"><mark>But repair continued to require</mark> a larger grasp of design and materials,</div><p class=\"ko\"><mark>그러나 수리는</mark> 설계와 재료에 대한 더 큰 이해를 <mark>계속 필요로 했다</mark>,</p></div><div class=\"ck-via\"><i>▼</i><span>1896년 설명서 인용으로 결론을 못 박아요</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 문장 · 결론 한 번 더</span><div class=\"en\">“But <mark>all repairing must be done by hand</mark>.</div><p class=\"ko\">“그러나 <mark>모든 수리는 반드시 손으로 해야 한다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">Still Left to the Modern Blacksmith(현대의 대장장이에게 여전히 남겨진 것): The Art of Repair 수리의 기술<small>5번 continued(계속)를 Still(여전히)로, repair(수리)를 그대로 받았어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">A Historical Survey of How Repairing Skills Evolved 수리 기술이 어떻게 발달했는지에 대한 역사적 조사</span><span class=\"why\">[지문에 없음] 대장장이·산업화처럼 옛날 얘기가 나와서 끌리지만, 수리 기술이 시대마다 어떻게 발달했는지는 없어요. 5번은 수리가 ‘변하지 않고’ 계속 손을 필요로 했다는 말이에요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">How to Be a Creative Repairperson(창의적인 수리공이 되는 법): Tips and Ideas 조언과 아이디어</span><span class=\"why\">[지문에 없음] 1번에 creativity(창의력)가 나오지만, 수리공이 되는 요령을 알려 주는 문장은 하나도 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">A Process of Repair(수리의 과정): Create(만들고), Modify(수정하고), Transform 변형하라</span><span class=\"why\">[범위 좁음] 2번의 modifying(수정)·transforming(변형)은 옛 대장장이의 일상을 말한 부분일 뿐이고, 수리의 단계를 설명한 글이 아니에요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">Can Industrialization Mend Our Broken Past(산업화가 우리의 망가진 과거를 고칠 수 있을까)?</span><span class=\"why\">[반대] 8번은 기계가 고장 난 것을 고칠 수 없다(cannot mend)고 해요. 산업화가 고쳐 준다는 방향은 정반대예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Mending and restoring objects</span></div><div class=\"k\"><span class=\"cw\">물건을 고치고 복원하는 것은</span></div></div><div class=\"rc\"><div class=\"e\">often require even more creativity</div><div class=\"k\">흔히 훨씬 더 많은 창의력을 필요로 한다</div></div><div class=\"rc\"><div class=\"e\">than original production.</div><div class=\"k\">최초 제작보다.</div></div><div class=\"rnat\">물건을 고치고 복원하는 것은 흔히 최초 제작보다 훨씬 더 많은 창의력을 필요로 한다.</div><div class=\"rst\">망가진 자전거를 고치는 건 새 자전거를 만드는 것보다 머리를 더 써야 해요. = 지문의 ‘수리는 최초 제작보다 창의력이 더 필요하다’예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">The preindustrial blacksmith</div><div class=\"k\">산업화 이전의 대장장이는</div></div><div class=\"rc\"><div class=\"e\">made things to order</div><div class=\"k\">주문에 따라 물건을 만들었다</div></div><div class=\"rc\"><div class=\"e\">for people in his immediate community;</div><div class=\"k\">아주 가까이에 있는 그의 지역 사회 사람들을 위해;</div></div><div class=\"rc\"><div class=\"e\">customizing the product,</div><div class=\"k\">제품을 주문 제작하고,</div></div><div class=\"rc\"><div class=\"e\">modifying or transforming it according to the user,</div><div class=\"k\">사용자에게 맞게 그것을 수정하거나 변형하는 것이</div></div><div class=\"rc\"><div class=\"e\">was routine.</div><div class=\"k\">일상적이었다.</div></div><div class=\"rnat\">산업화 이전의 대장장이는 아주 가까이에 있는 그의 지역 사회 사람들을 위해 주문에 따라 물건을 만들었고, 제품을 주문 제작하고 사용자에게 맞게 그것을 수정하거나 변형하는 일이 일상적이었다.</div><div class=\"rst\">옛날 동네 자전거 가게 사장님은 손님 키에 맞춰 안장도 바꿔 주며 직접 만들어 줬어요. 지문의 대장장이가 주문 제작하던 모습이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Customers would bring things back</div><div class=\"k\">고객들은 물건을 (대장장이에게) 다시 가져오곤 했다</div></div><div class=\"rc\"><div class=\"e\">if something went wrong;</div><div class=\"k\">뭔가 잘못되면;</div></div><div class=\"rc\"><div class=\"e\">repair was thus an extension of fabrication.</div><div class=\"k\">따라서 수리는 제작의 연장이었다.</div></div><div class=\"rnat\">고객들은 뭔가 잘못되면 물건을 (대장장이에게) 다시 가져오곤 했고, 따라서 수리는 제작의 연장이었다.</div><div class=\"rst\">고장 나면 손님이 다시 들고 왔고, 사장님이 고쳐 줬어요. 그래서 지문은 수리가 제작의 연장(extension)이었다고 해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">With industrialization and eventually with mass production,</div><div class=\"k\">산업화와 함께, 그리고 결국 대량 생산이 이루어지면서,</div></div><div class=\"rc\"><div class=\"e\">making things became the province of machine tenders</div><div class=\"k\">물건을 만드는 것은 기계 관리자의 영역이 되었다</div></div><div class=\"rc\"><div class=\"e\">with limited knowledge.</div><div class=\"k\">제한된 지식을 지닌.</div></div><div class=\"rnat\">산업화와 함께 결국 대량 생산이 이루어지면서, 물건을 만드는 것은 제한된 지식을 지닌 기계 관리자의 영역이 되었다.</div><div class=\"rst\">이제 자전거는 공장 기계가 한꺼번에 찍어 내고, 직원은 기계만 지켜봐요. = 지문의 ‘만들기는 기계 관리자의 영역’이에요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">But repair continued to require</span></div><div class=\"k\"><span class=\"cw\">그러나 수리는 계속 필요로 했다</span></div></div><div class=\"rc\"><div class=\"e\">a larger grasp of design and materials,</div><div class=\"k\">설계와 재료에 대한 더 큰 이해를,</div></div><div class=\"rc\"><div class=\"e\">an understanding of the whole</div><div class=\"k\">즉 전체에 대한 이해와</div></div><div class=\"rc\"><div class=\"e\">and a comprehension of the designer’s intentions.</div><div class=\"k\">설계자의 의도에 대한 이해를.</div></div><div class=\"rnat\">그러나 수리는 설계와 재료에 대한 더 큰 이해, 즉 전체와 설계자의 의도에 대한 이해를 계속 필요로 했다.</div><div class=\"rst\"><b>그러나</b>(But) 고칠 때는 여전히 자전거 전체 구조를 다 알아야 해요. 지문도 <b>수리는 계속</b> 설계와 재료의 이해가 필요하다고 해요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">“Manufacturers all work</div><div class=\"k\">“제조업자들은 모두 일하고,</div></div><div class=\"rc\"><div class=\"e\">by machinery or by vast subdivision of labour</div><div class=\"k\">기계나 노동의 방대한 세분화(분업)로</div></div><div class=\"rc\"><div class=\"e\">and not, so to speak, by hand,”</div><div class=\"k\">말하자면 수작업으로는 (일하지) 않는다”</div></div><div class=\"rc\"><div class=\"e\">an 1896 Manual of Mending and Repairing explained.</div><div class=\"k\">라고 1896년의 〈Manual of Mending and Repairing〉(고치고 수리하는 것의 설명서)은 설명했다.</div></div><div class=\"rnat\">1896년의 〈Manual of Mending and Repairing(고치고 수리하는 것의 설명서)〉은 \"제조업자들은 모두 기계나 노동의 방대한 세분화로(분업으로) 일하고, 말하자면 수작업으로 일하지 않는다.\"라고 설명했다.</div><div class=\"rst\">공장은 기계와 분업으로 만들고 사람 손으로 만들지 않아요. 지문의 1896년 설명서가 바로 그렇게 말해요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">“But <span class=\"cw\">all repairing must be done by hand</span>.</div><div class=\"k\">“그러나 <span class=\"cw\">모든 수리는 반드시 손으로 해야 한다</span>.</div></div><div class=\"rnat\">\"그러나 모든 수리는 반드시 손으로 '해야 한다'.</div><div class=\"rst\"><b>하지만 고치는 건 꼭 사람 손으로</b> 해야 해요. 지문의 설명서 인용이 이 글의 결론이에요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">We can make every detail of a watch or of a gun by machinery,</div><div class=\"k\">우리는 기계로 손목시계나 총의 모든 세부적인 것을 만들 수 있지만,</div></div><div class=\"rc\"><div class=\"e\">but the machine cannot mend it when broken,</div><div class=\"k\">고장 났을 때 기계는 그것을 고칠 수 없으며,</div></div><div class=\"rc\"><div class=\"e\">much less a clock or a pistol!”</div><div class=\"k\">시계나 권총은 말할 것도 없다!”</div></div><div class=\"rnat\">우리는 기계로 손목시계나 총의 모든 세부적인 것을 만들 수 있지만, 고장 났을 때 기계는 그것을 고칠 수 없으며, 시계나 권총은 말할 것도 없다!\"</div><div class=\"rst\">기계가 바퀴살 하나하나는 만들어도, 부러진 자전거는 못 고쳐요. 지문의 ‘기계는 고장 난 시계를 못 고친다’예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"mend\" data-m=\"고치다\"><b>mend</b>고치다</button><button type=\"button\" class=\"wdb\" data-w=\"blacksmith\" data-m=\"대장장이\"><b>blacksmith</b>대장장이</button><button type=\"button\" class=\"wdb\" data-w=\"extension\" data-m=\"연장, 확장\"><b>extension</b>연장, 확장</button><button type=\"button\" class=\"wdb\" data-w=\"industrialization\" data-m=\"산업화\"><b>industrialization</b>산업화</button><button type=\"button\" class=\"wdb\" data-w=\"province\" data-m=\"영역, 분야\"><b>province</b>영역, 분야</button><button type=\"button\" class=\"wdb\" data-w=\"grasp\" data-m=\"이해, 파악\"><b>grasp</b>이해, 파악</button></div>", "04": "<p class=\"mtr\">마더텅 정답률 <b>45%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">밑줄 <b>matter out of place</b>(제자리를 벗어난 물질)는 글자보다 <b>뒤의 예시</b>로 풀어야 해요. 4번 예시가 전부 ‘물건이 있을 곳에 없는 것’이고, 5번 <b>ordering</b>(정리)이 그 반대말이에요.</p><div class=\"ck-step\"><span class=\"lab\">밑줄 문장 (2번)</span><div class=\"en\">the common saying that dirt is “<mark>matter out of place</mark>.”</div><p class=\"ko\">더러운 것은 '<mark>제자리에 있지 않은 상태</mark>(정리되지 않은 것)'라는 흔히 하는 말을</p></div><div class=\"ck-via\"><i>▼</i><span>1번 ‘본래 쓰레기는 없다’를 relative(상대적인)로 이어 받아요</span></div><div class=\"ck-step\"><span class=\"lab\">1·3번 · 더러움은 물건 자체가 아니다</span><div class=\"en\"><mark>Dirt is relative</mark>, she emphasizes.</div><p class=\"ko\"><mark>더러운 것은 상대적이라고</mark> 그녀는 강조한다.</p></div><div class=\"ck-via\"><i>▼</i><span>‘상대적’이 무슨 뜻인지 집 안 장면으로 보여 줘요</span></div><div class=\"ck-step key\"><span class=\"lab\">4번 문장 · 결정적 예시</span><div class=\"en\">“Shoes are not dirty in themselves, but it is dirty to <mark>place them on the dining-table</mark>; … outdoor things placed indoors; upstairs things downstairs</div><p class=\"ko\">“신발은 그 자체로 더럽지 않지만 <mark>식탁 위에 그것들을 올려 놓는 것은</mark> 더러운 것이고, … 야외 용품을 실내에, 위층의 물건을 아래층에</p></div><div class=\"ck-via\"><i>▼</i><span>더러움을 없애는 일 = 제자리로 돌려놓는 일</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 문장 · 반대말로 확인</span><div class=\"en\">Sorting the dirty from the clean … involves <mark>systematic ordering and classifying</mark>.</div><p class=\"ko\">깨끗한 것으로부터 더러운 것을 구분하는 것은 … <mark>체계적인 정리와 분류를</mark> 포함한다.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>신발</em>그 자체는 OK → 식탁 위면 더러움</span><span><em>음식</em>그 자체는 OK → 침실·옷 위면 더러움</span><span><em>치우기</em>신발은 식탁에서, 옷은 세탁기로 = 정리</span></div><div class=\"ck-eq\">⇒ 밑줄의 속뜻 = 있어야 할 곳(질서)에 있지 않은 것 → ⑤</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">a thing that is not in order 질서 속에 있지 않은(정리되지 않은) 것<small>out of place(제자리를 벗어난)를 not in order(정돈되지 않은)로 바꿔 말했어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">something that is completely broken 완전히 망가진 것</span><span class=\"why\">[글자 그대로] 4번 신발·음식은 망가진 게 아니라 멀쩡해요. 그 자체로 더럽지 않다(not dirty in themselves)고 했어요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">a tiny dust that nobody notices 아무도 알아채지 못하는 작은 먼지</span><span class=\"why\">[글자 그대로] dirt(더러운 것)를 ‘먼지’로 읽은 함정이에요. 식탁 위 신발은 작지도 않고 누구나 알아채요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">a dirty but renewable material 더럽지만 재생 가능한 물질</span><span class=\"why\">[지문에 없음] 재활용·재생 얘기는 한 문장도 없어요. 6번의 positive process(긍정적인 과정)는 정리하는 일을 말해요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">what can be easily replaced 쉽게 대체될 수 있는 것</span><span class=\"why\">[지문에 없음] 5번은 물건을 바꾸라는 게 아니라 식탁의 신발을 치우듯 제자리로 옮기라는 말이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Nothing is trash by nature.</div><div class=\"k\">어느 것도 본래 쓰레기인 것은 없다.</div></div><div class=\"rnat\">어느 것도 본래 쓰레기인 것은 없다.</div><div class=\"rst\">내 방 물건 중에 원래부터 쓰레기인 건 없어요. 지문도 어떤 것도 본래(by nature) 쓰레기는 아니라고 시작해요.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">2번 · 단서</span><div class=\"rc\"><div class=\"e\">Anthropologist Mary Douglas</div><div class=\"k\">인류학자 Mary Douglas는</div></div><div class=\"rc\"><div class=\"e\">brings back and analyzes</div><div class=\"k\">다시 가져와서 분석한다</div></div><div class=\"rc\"><div class=\"e\">the common saying</div><div class=\"k\">흔히 하는 말을</div></div><div class=\"rc ckc\"><div class=\"e\">that dirt is “<span class=\"cw\">matter out of place</span>.”</div><div class=\"k\">더러운 것은 '<span class=\"cw\">제자리에 있지 않은 상태</span>(정리되지 않은 것)'라는</div></div><div class=\"rnat\">인류학자 Mary Douglas는 더러운 것은 '제자리에 있지 않은 상태(정리되지 않은 것)'라는 흔히 하는 말을 다시 가져와서 분석한다.</div><div class=\"rst\">엄마가 “방이 더럽다!” 할 때, 사실은 <b>물건이 제자리에 없다</b>는 뜻이에요. = 지문의 matter out of place(제자리를 벗어난 물질)예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Dirt is relative</span>,</div><div class=\"k\"><span class=\"cw\">더러운 것은 상대적이라고</span></div></div><div class=\"rc\"><div class=\"e\">she emphasizes.</div><div class=\"k\">그녀는 강조한다.</div></div><div class=\"rnat\">그녀는 더러운 것은 상대적이라고 강조한다.</div><div class=\"rst\">같은 물건도 어디 있느냐에 따라 깨끗하기도, 더럽기도 해요. 그래서 지문은 더러움이 <b>상대적</b>(relative)이라고 강조해요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">“Shoes are not dirty in themselves,</div><div class=\"k\">“신발은 그 자체로 더럽지 않지만</div></div><div class=\"rc ckc\"><div class=\"e\">but <span class=\"cw\">it is dirty to place them on the dining-table</span>;</div><div class=\"k\"><span class=\"cw\">식탁 위에 그것들을 올려 놓는 것은 더러운 것이고</span>,</div></div><div class=\"rc\"><div class=\"e\">food is not dirty in itself,</div><div class=\"k\">음식은 그 자체로 더럽지 않지만</div></div><div class=\"rc\"><div class=\"e\">but it is dirty to leave pots and pans in the bedroom,</div><div class=\"k\">냄비와 팬을 침실에 두는 것은 더러운 것이고,</div></div><div class=\"rc\"><div class=\"e\">or food all over clothing;</div><div class=\"k\">혹은 옷 전체에 음식이 묻는 것(도 그렇다);</div></div><div class=\"rc\"><div class=\"e\">similarly, bathroom items in the living room;</div><div class=\"k\">(이와) 비슷하게 거실에 욕실 용품을 (두는 것),</div></div><div class=\"rc\"><div class=\"e\">clothing lying on chairs;</div><div class=\"k\">의자 위에 옷을 (두는 것),</div></div><div class=\"rc\"><div class=\"e\">outdoor things placed indoors;</div><div class=\"k\">야외 용품을 실내에,</div></div><div class=\"rc\"><div class=\"e\">upstairs things downstairs, and so on.”</div><div class=\"k\">위층의 물건을 아래층에 두는 것 등은 더러운 것이다.”</div></div><div class=\"rnat\">\"신발은 그 자체로 더럽지 않지만 식탁 위에 그것들을 올려 놓는 것은 더러운 것이고, 음식은 그 자체로 더럽지 않지만 냄비와 팬을 침실에 두는 것, 혹은 옷 전체에 음식이 묻는 것, (이와) 비슷하게 거실에 욕실 용품을, 의자 위에 옷을, 야외 용품을 실내에, 위층의 물건을 아래층에 두는 것 등은 더러운 것이다.\"</div><div class=\"rst\">축구화가 신발장에 있으면 괜찮지만 <b>식탁 위에 있으면</b> 더러워요. 지문의 신발·냄비·욕실 용품 예시가 모두 이 얘기예요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">Sorting the dirty from the clean</div><div class=\"k\">깨끗한 것으로부터 더러운 것을 구분하는 것은</div></div><div class=\"rc\"><div class=\"e\">— removing the shoes from the table,</div><div class=\"k\">— 식탁에서 신발을 치우는 것,</div></div><div class=\"rc\"><div class=\"e\">putting the dirty clothing in the washing machine —</div><div class=\"k\">더러운 옷을 세탁기에 넣는 것(과 같은) —</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">involves systematic ordering and classifying</span>.</div><div class=\"k\"><span class=\"cw\">체계적인 정리와 분류를 포함한다</span>.</div></div><div class=\"rnat\">식탁에서 신발을 치우는 것, 더러운 옷을 세탁기에 넣는 것(과 같이) 깨끗한 것으로부터 더러운 것을 구분하는 것은 체계적인 정리와 분류를 포함한다.</div><div class=\"rst\">축구화를 식탁에서 내리고 젖은 체육복을 세탁기에 넣는 게 청소예요. = 지문의 <b>정리와 분류</b>(ordering and classifying)예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Eliminating dirt is thus a positive process.</div><div class=\"k\">그러므로 더러운 것을 제거하는 것은 긍정적인 과정이다.</div></div><div class=\"rnat\">그러므로 더러운 것을 제거하는 것은 긍정적인 과정이다.</div><div class=\"rst\">그러니 방 청소는 물건을 제자리로 돌려놓는 좋은 일이에요. 지문도 더러움을 없애는 것이 긍정적인 과정이라고 마무리해요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"anthropologist\" data-m=\"인류학자\"><b>anthropologist</b>인류학자</button><button type=\"button\" class=\"wdb\" data-w=\"by nature\" data-m=\"본래, 원래\"><b>by nature</b>본래, 원래</button><button type=\"button\" class=\"wdb\" data-w=\"out of place\" data-m=\"제자리를 벗어난\"><b>out of place</b>제자리를 벗어난</button><button type=\"button\" class=\"wdb\" data-w=\"relative\" data-m=\"상대적인\"><b>relative</b>상대적인</button><button type=\"button\" class=\"wdb\" data-w=\"classify\" data-m=\"분류하다\"><b>classify</b>분류하다</button><button type=\"button\" class=\"wdb\" data-w=\"eliminating\" data-m=\"제거하는 것 (eliminate 제거하다)\"><b>eliminating</b>제거하는 것 (eliminate 제거하다)</button></div>", "05": "<p class=\"mtr\">마더텅 정답률 <b>55%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">글 전체 방향은 <b>이사는 아이에게 힘들다</b>(stressful 스트레스가 큰)예요. 4번은 앞에 <b>literal</b>(융통성 없는)이 원인으로 붙어 있으니, 그 결과가 ‘쉽다’일 수 없어요.</p><div class=\"ck-step\"><span class=\"lab\">1번 · 글의 방향</span><div class=\"en\">While moving is difficult for everyone, it is <mark>particularly stressful</mark> for children.</div><p class=\"ko\">이사는 모두에게 힘들지만, 아이들에게 <mark>특히 스트레스가 크다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>힘든 아이들 중에서도 3~6세가 특히 그래요</span></div><div class=\"ck-step\"><span class=\"lab\">3번 · 대상이 좁혀짐</span><div class=\"en\">Young children, ages 3–6, are particularly affected by a move.</div><p class=\"ko\">3세에서 6세 사이의 어린아이들은 이사에 특히 영향을 받는다.</p></div><div class=\"ck-via\"><i>▼</i><span>왜 특히 힘든지 이유가 나와요</span></div><div class=\"ck-step key\"><span class=\"lab\">4번 · 결정적 단서(원인)</span><div class=\"en\">Their understanding at this stage is <mark>quite literal</mark>,</div><p class=\"ko\">이 시기 그들의 이해력은 <mark>꽤 융통성이 없어서</mark>,</p></div><div class=\"ck-via\"><i>▼</i><span>융통성이 없는데 미리 상상하기가 쉽다? 방향이 거꾸로예요</span></div><div class=\"ck-step\"><span class=\"lab\">문제지 ②번 자리 (4번)</span><div class=\"en\">and it is <u>② easy</u> for them to imagine beforehand a new home and their new room.</div><p class=\"ko\">그들이 새 집과 새 방을 미리 상상하기는 ( 쉽다? ) → 어렵다가 맞아요</p></div><div class=\"ck-via\"><i>▼</i><span>상상을 못 하니까 이런 걱정이 생겨요</span></div><div class=\"ck-step\"><span class=\"lab\">5번 · 결과로 확인</span><div class=\"en\"><mark>“Will my toys and bed come with us?”</mark></div><p class=\"ko\"><mark>“내 장난감과 침대는 우리랑 같이 가는 거야?”</mark></p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">easy(쉬운) ↔ hard(어려운)</p><p class=\"gr\">앞에 literal(융통성 없는)·stressful(스트레스가 큰) 같은 힘든 원인이 오면 뒤의 결과도 hard(어려운)여야 해요. 원인과 결과의 방향이 같아야 해요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I am very tired, so it is hard for me to study.</div><div class=\"ko\">나는 너무 피곤해서 공부하기 어려워요. (피곤함 → 어려움)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I am very tired, so it is easy for me to study.</div><div class=\"ko\">너무 피곤한데 공부하기 쉽다? 방향이 거꾸로라 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>The map is clear, so it is easy to find the school.</div><div class=\"ko\">지도가 분명해서 학교를 찾기 쉬워요. (분명함 → 쉬움)</div></div><p class=\"gb\">지문 4번에서 아이들의 이해력이 literal(융통성 없는)하다고 했으니, 새 집을 미리 상상하기는 easy(쉬운)가 아니라 hard(어려운)여야 해요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">easy → hard (어려운)<small>융통성 없는(literal) 아이는 새 집을 미리 그려 보기 어려워서 5번 같은 걱정을 해요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">transition 변화, 전환</span><span class=\"why\">8번의 those in transition(변화 속에 있는 아이들)은 지금 이사 중인 아이들을 말해요. 글 내내 이사라는 변화를 다루니 transition(변화)이 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">familiar 익숙한</span><span class=\"why\">2번은 이사로 일상이 흐트러지고 안정감을 잃는 장면이에요. 없어지는 건 익숙한 것들이어야 하니 familiar(익숙한)가 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">adjust 적응하다</span><span class=\"why\">6번은 과거 경험 인정과 새 곳에 대한 도움 사이의 균형이에요. 새 곳에서 도울 일은 adjust to(~에 적응하다)라서 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">respects 존중하다</span><span class=\"why\">7번은 과거를 자신의 중요한 일부(an important part of who they are)로 본다고 해요. 그러니 과거를 존중하는(respects) 방식이 맞아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">While moving is difficult for everyone,</div><div class=\"k\">이사는 모두에게 힘들지만,</div></div><div class=\"rc ckc\"><div class=\"e\">it is <span class=\"cw\">particularly stressful</span> for children.</div><div class=\"k\">아이들에게 <span class=\"cw\">특히 스트레스가 크다</span>.</div></div><div class=\"rnat\">이사는 모두에게 힘들지만, 아이들에게 특히 스트레스가 크다.</div><div class=\"rst\">가족이 이사 가면 모두 힘들지만, 특히 어린 동생이 제일 힘들어해요. = 지문의 ‘아이들에게 특히 <b>스트레스가 크다</b>’예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">They lose their sense of security</div><div class=\"k\">그들은 안정감을 잃고</div></div><div class=\"rc\"><div class=\"e\">and may feel disoriented</div><div class=\"k\">혼란을 느낄 수도 있다</div></div><div class=\"rc\"><div class=\"e\">when their routine is disrupted</div><div class=\"k\">자신의 일상이 지장을 받고</div></div><div class=\"rc\"><div class=\"e\">and all that is ① familiar is taken away.</div><div class=\"k\">① 익숙한 모든 것이 없어지면.</div></div><div class=\"rnat\">그들은 안정감을 잃고, 자신의 일상이 지장을 받고 익숙한 모든 것이 없어지면 혼란을 느낄 수도 있다.</div><div class=\"rst\">매일 놀던 놀이터와 늘 자던 방이 갑자기 사라지면 동생은 어리둥절해요. 지문도 <b>익숙한</b>(familiar) 것이 없어지면 혼란스럽다고 해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Young children, ages 3–6,</div><div class=\"k\">3세에서 6세 사이의 어린아이들은</div></div><div class=\"rc\"><div class=\"e\">are particularly affected by a move.</div><div class=\"k\">이사에 특히 영향을 받는다.</div></div><div class=\"rnat\">3세에서 6세 사이의 어린아이들은 이사에 특히 영향을 받는다.</div><div class=\"rst\">특히 유치원 다니는 서너 살~여섯 살 동생이 제일 크게 흔들려요. 지문도 3~6세가 특히 영향을 받는다고 해요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">Their understanding at this stage is <span class=\"cw\">quite literal</span>,</div><div class=\"k\">이 시기 그들의 이해력은 <span class=\"cw\">꽤 융통성이 없어서</span>,</div></div><div class=\"rc ckc\"><div class=\"e\">and it is ② <span class=\"cw\">hard</span> for them to imagine beforehand</div><div class=\"k\">그들이 <span class=\"cw\">미리 상상하기는 어렵다</span> ※ 문제지엔 easy(쉽다)로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">a new home and their new room.</div><div class=\"k\">새로운 집과 자신의 새 방을.</div></div><div class=\"rnat\">이 시기 그들의 이해력은 꽤 융통성이 없어서, 그들이 새로운 집과 자신의 새 방을 미리 상상하기는 쉽다(→ 어렵다).</div><div class=\"rst\">동생은 눈앞에 보이는 것만 알아서, 아직 못 본 새 방을 <b>미리 그려 보기 어려워요</b>. = 지문 4번, 그래서 easy(쉬운)가 아니라 hard(어려운)예요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Young children may have worries such as</div><div class=\"k\">어린아이들은 ~와 같은 걱정을 할지도 모른다</div></div><div class=\"rc\"><div class=\"e\">“Will I still be me in the new place?”</div><div class=\"k\">“나는 새로운 곳에서도 여전히 나일까?”</div></div><div class=\"rc ckc\"><div class=\"e\">and <span class=\"cw\">“Will my toys and bed come with us?”</span></div><div class=\"k\">그리고 <span class=\"cw\">“내 장난감과 침대는 우리랑 같이 가는 거야?”</span></div></div><div class=\"rnat\">어린아이들은 \"나는 새로운 곳에서도 여전히 나일까?\"와 \"내 장난감과 침대는 우리랑 같이 가는 거야?\"와 같은 걱정을 할지도 모른다.</div><div class=\"rst\">그래서 “새 집 가도 나는 나야?”, “내 인형이랑 침대도 가?” 하고 물어요. 지문의 걱정 두 가지가 바로 이거예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">It is important to establish a balance</div><div class=\"k\">균형을 설정하는 것이 중요하다</div></div><div class=\"rc\"><div class=\"e\">between validating children’s past experiences</div><div class=\"k\">아이들의 과거 경험을 인정해주는 것과</div></div><div class=\"rc\"><div class=\"e\">and focusing on helping them ③ adjust to the new place.</div><div class=\"k\">그들이 새로운 곳에 ③ 적응하도록 돕는 데 집중하는 것 사이에.</div></div><div class=\"rnat\">아이들의 과거 경험을 인정해주는 것과 그들이 새로운 곳에 적응하도록 돕는 데 집중하는 것 사이에 균형을 설정하는 것이 중요하다.</div><div class=\"rst\">옛 동네 얘기도 들어주고, 새 동네에 <b>적응하게</b>(adjust) 도와주는 것도 둘 다 해야 해요. 지문은 그 균형이 중요하다고 해요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Children need to have opportunities</div><div class=\"k\">아이들은 기회를 가져봐야 한다</div></div><div class=\"rc\"><div class=\"e\">to share their backgrounds</div><div class=\"k\">자기 배경을 공유할</div></div><div class=\"rc\"><div class=\"e\">in a way that ④ respects their past</div><div class=\"k\">자기 과거를 ④ 존중하는 방식으로</div></div><div class=\"rc\"><div class=\"e\">as an important part of who they are.</div><div class=\"k\">자신이 누구인지에 대한 중요한 일부로서.</div></div><div class=\"rnat\">아이들은 자신이 누구인지에 대한 중요한 일부로서 자기 과거를 존중하는 방식으로 자기 배경을 공유할 기회를 가져봐야 한다.</div><div class=\"rst\">동생이 옛 유치원 친구 얘기를 자랑하게 해 줘요. 지문도 과거를 <b>존중하는</b>(respects) 방식으로 나눌 기회가 필요하다고 해요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">This contributes to building a sense of community,</div><div class=\"k\">이것은 공동체 의식을 형성하는 데 기여하고,</div></div><div class=\"rc\"><div class=\"e\">which is essential for all children,</div><div class=\"k\">이는 모든 아이들에게 중요한데,</div></div><div class=\"rc\"><div class=\"e\">especially those in ⑤ transition.</div><div class=\"k\">특히 ⑤ 변화 속에 있는 아이들에게 그렇다.</div></div><div class=\"rnat\">이것은 공동체 의식을 형성하는 데 기여하고, 이는 모든 아이들에게 중요한데, 특히 변화 속에 있는 아이들에게 그렇다.</div><div class=\"rst\">그러면 새 동네 친구들과도 한 팀이 된 느낌이 들어요. 지문은 이게 특히 <b>변화</b>(transition) 속 아이에게 중요하다고 해요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"disoriented\" data-m=\"혼란스러운, 방향 감각을 잃은\"><b>disoriented</b>혼란스러운, 방향 감각을 잃은</button><button type=\"button\" class=\"wdb\" data-w=\"disrupt\" data-m=\"지장을 주다, 방해하다\"><b>disrupt</b>지장을 주다, 방해하다</button><button type=\"button\" class=\"wdb\" data-w=\"literal\" data-m=\"문자 그대로의, 융통성 없는\"><b>literal</b>문자 그대로의, 융통성 없는</button><button type=\"button\" class=\"wdb\" data-w=\"beforehand\" data-m=\"미리, 사전에\"><b>beforehand</b>미리, 사전에</button><button type=\"button\" class=\"wdb\" data-w=\"validate\" data-m=\"인정해 주다\"><b>validate</b>인정해 주다</button><button type=\"button\" class=\"wdb\" data-w=\"transition\" data-m=\"변화, 전환\"><b>transition</b>변화, 전환</button></div>", "06": "<p class=\"mtr\">마더텅 정답률 <b>65%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸 앞 <b>To a certain extent</b>(어느 정도까지는)는 ‘나쁜 편견에도 좋은 면이 있다’는 신호예요. 뒤 예시의 <b>빠른 판단 → 도망칠 시간</b>을 한 말로 묶으세요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (4번)</span><div class=\"en\"><mark>To a certain extent</mark>, bias is a <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span>.</span></div><p class=\"ko\">어느 정도까지는, 편견이 ( ? )이다</p></div><div class=\"ck-via\"><i>▼</i><span>5번에서 정글에 동물이 다가와요. 그때 해야 할 일</span></div><div class=\"ck-step\"><span class=\"lab\">6번 문장 · 초기 인류의 장면</span><div class=\"en\">You have to <mark>make very fast assumptions</mark> about whether that animal is safe or not,</div><p class=\"ko\">당신은 그 동물이 안전한지 아닌지에 대해 <mark>매우 빠른 추측을 해야 한다</mark>,</p></div><div class=\"ck-via\"><i>▼</i><span>빠른 판단의 목적 = 살아남기</span></div><div class=\"ck-step key\"><span class=\"lab\">8번 문장 · 결정적 단서</span><div class=\"en\">You make <mark>split-second decisions about threats</mark> in order to have plenty of time <mark>to escape</mark>,</div><p class=\"ko\">당신은 필요할 경우 <mark>도망칠</mark> 충분한 시간을 갖기 위해 <mark>위협에 대해서 순식간의 결정을 내린다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">necessary survival skill 필수적인 생존 기술<small>위협을 순식간에 판단해 도망치는 것 = 살아남는 데 꼭 필요한 기술이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">undesirable mental capacity 바람직하지 않은 정신 능력</span><span class=\"why\">1·2번의 unpleasant(불편한)·incorrect(부정확한)만 보면 끌려요. 하지만 빈칸 앞 To a certain extent(어느 정도까지는)는 좋은 면을 말하겠다는 신호라 방향이 반대예요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">origin of imagination 상상력의 기원</span><span class=\"why\">9번에 root(근원)가 나오지만, 그건 남을 외모로 분류하는 성향의 근원이에요. 상상력 얘기는 지문에 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">barrier to relationships 관계에 대한 장벽</span><span class=\"why\">뒤의 예시는 사람 사이가 멀어지는 게 아니라 위협(threats)을 피해 도망치는(escape) 장면이에요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">challenge to moral judgment 도덕적 판단에 대한 도전</span><span class=\"why\">옳고 그름을 따지는 문장이 없어요. 6번은 동물이 안전한지 아닌지(safe or not)만 빨리 판단하는 얘기예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Here’s the unpleasant truth:</div><div class=\"k\">여기 불편한 진실이 있다:</div></div><div class=\"rc\"><div class=\"e\">we are all biased.</div><div class=\"k\">우리는 모두 편견을 갖고 있다(는 것이다).</div></div><div class=\"rnat\">여기 불편한 진실이 있다. 우리는 모두 편견을 갖고 있다(는 것이다).</div><div class=\"rst\">솔직히 말하면, 우리 반 친구들 모두 남을 보고 ‘딱 보니 이렇겠다’ 하는 버릇이 있어요. = 지문의 ‘우리는 모두 편견이 있다’예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Every human being is affected</div><div class=\"k\">모든 인간은 영향을 받는다</div></div><div class=\"rc\"><div class=\"e\">by unconscious biases</div><div class=\"k\">무의식적인 편견에 의해</div></div><div class=\"rc\"><div class=\"e\">that lead us to make incorrect assumptions</div><div class=\"k\">우리를 부정확한 추측을 하도록 이끄는</div></div><div class=\"rc\"><div class=\"e\">about other people.</div><div class=\"k\">다른 사람들에 대해.</div></div><div class=\"rnat\">모든 인간은 우리를 다른 사람들에 대해 부정확한 추측을 하도록 이끄는 무의식적인 편견에 의해 영향을 받는다.</div><div class=\"rst\">그 버릇 때문에 처음 본 전학생을 잘못 짐작하기도 해요. 지문도 무의식적인 편견이 부정확한 추측을 하게 한다고 해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Everyone.</div><div class=\"k\">모두(가 그렇다).</div></div><div class=\"rnat\">모두(가 그렇다).</div><div class=\"rst\">나도, 너도, 선생님도 예외 없이 다 그래요. 지문은 딱 한 단어 Everyone(모두)으로 못 박아요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">To a certain extent,</div><div class=\"k\">어느 정도까지는,</div></div><div class=\"rc ckc\"><div class=\"e\">bias is <span class=\"cw\">a necessary survival skill</span>.</div><div class=\"k\">편견이 <span class=\"cw\">필수적인 생존 기술이다</span>. ※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rnat\">어느 정도까지는, 편견이 (          )이다.</div><div class=\"rst\"><b>그런데 어느 정도까지는</b> 이 버릇이 우리를 지켜 줘요. 그래서 빈칸은 <b>필수적인 생존 기술</b>(necessary survival skill)이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">If you’re an early human,</div><div class=\"k\">만약 당신이 초기 인류라면,</div></div><div class=\"rc\"><div class=\"e\">perhaps Homo Erectus,</div><div class=\"k\">아마 '호모 에렉투스'처럼</div></div><div class=\"rc\"><div class=\"e\">walking around the jungles,</div><div class=\"k\">정글을 돌아다니는</div></div><div class=\"rc\"><div class=\"e\">you may see an animal approaching.</div><div class=\"k\">당신은 동물이 다가오는 것을 볼지도 모른다.</div></div><div class=\"rnat\">만약 당신이 아마 '호모 에렉투스'처럼 정글을 돌아다니는 초기 인류라면, 당신은 동물이 다가오는 것을 볼지도 모른다.</div><div class=\"rst\">캠프 날 밤 숲길을 걷는데, 무언가가 이쪽으로 다가와요. 지문의 정글 속 초기 인류에게 동물이 다가오는 장면이에요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">You have to <span class=\"cw\">make very fast assumptions</span></div><div class=\"k\">당신은 <span class=\"cw\">매우 빠른 추측을 해야 한다</span></div></div><div class=\"rc\"><div class=\"e\">about whether that animal is safe or not,</div><div class=\"k\">그 동물이 안전한지 아닌지에 대해,</div></div><div class=\"rc\"><div class=\"e\">based solely on its appearance.</div><div class=\"k\">오로지 그것(= 다가오는 동물)의 외양에만 기초하여.</div></div><div class=\"rnat\">당신은 오로지 그것(다가오는 동물)의 외양에만 기초하여 그 동물이 안전한지 아닌지에 대해 매우 빠른 추측을 해야 한다.</div><div class=\"rst\">자세히 볼 틈 없이 생김새만 보고 “위험한가?”를 <b>바로 판단</b>해야 해요. = 지문의 매우 빠른 추측(fast assumptions)이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">The same is true of other humans.</div><div class=\"k\">다른 인류에게도 마찬가지이다.</div></div><div class=\"rnat\">다른 인류에게도 마찬가지이다.</div><div class=\"rst\">모르는 사람이 다가올 때도 똑같아요. 지문도 다른 사람에게도 마찬가지라고 해요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">You make <span class=\"cw\">split-second decisions about threats</span></div><div class=\"k\">당신은 위협에 대해서 <span class=\"cw\">순식간의 결정을 내린다</span></div></div><div class=\"rc ckc\"><div class=\"e\">in order to have plenty of time <span class=\"cw\">to escape</span>,</div><div class=\"k\"><span class=\"cw\">도망칠</span> 충분한 시간을 갖기 위해</div></div><div class=\"rc\"><div class=\"e\">if necessary.</div><div class=\"k\">필요할 경우.</div></div><div class=\"rnat\">당신은 필요할 경우 도망칠 충분한 시간을 갖기 위해 위협에 대해서 순식간의 결정을 내린다.</div><div class=\"rst\"><b>순식간에 판단해야 도망칠 시간이 생겨요.</b> 지문의 split-second decisions(순식간의 결정)가 바로 살아남는 기술이에요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">This could be one root</div><div class=\"k\">이것은 한 근원일 수 있다</div></div><div class=\"rc\"><div class=\"e\">of our tendency to categorize and label others</div><div class=\"k\">다른 사람들을 범주에 넣고 분류하는 우리 성향의</div></div><div class=\"rc\"><div class=\"e\">based on their looks and their clothes.</div><div class=\"k\">(그들의) 외모와 옷에 기초하여.</div></div><div class=\"rnat\">이것은 (그들의) 외모와 옷에 기초하여 다른 사람들을 범주에 넣고 분류하는 우리 성향의 한 근원일 수 있다.</div><div class=\"rst\">그래서 우리가 옷차림만 보고 친구를 ‘이런 애’로 나누는 버릇이 생겼을지도 몰라요. 지문은 이게 그 성향의 뿌리일 수 있다고 해요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"biased\" data-m=\"편견을 가진, 편향된\"><b>biased</b>편견을 가진, 편향된</button><button type=\"button\" class=\"wdb\" data-w=\"unconscious\" data-m=\"무의식적인\"><b>unconscious</b>무의식적인</button><button type=\"button\" class=\"wdb\" data-w=\"assumption\" data-m=\"추측, 가정\"><b>assumption</b>추측, 가정</button><button type=\"button\" class=\"wdb\" data-w=\"to a certain extent\" data-m=\"어느 정도까지는\"><b>to a certain extent</b>어느 정도까지는</button><button type=\"button\" class=\"wdb\" data-w=\"solely\" data-m=\"오로지, 단지\"><b>solely</b>오로지, 단지</button><button type=\"button\" class=\"wdb\" data-w=\"split-second\" data-m=\"순식간의\"><b>split-second</b>순식간의</button></div>"};

function mmInit(){

    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});

    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}

    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
</body>
</html>
