<body>
<div id="app"></div>
<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:Canvas;color:CanvasText;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';
    document.body.appendChild(d);
    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');
    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';
      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();
  }

y in which it was meant.", "ev_ko": [[5, "(C) 이 법칙은 어느 수준에서는 말이 되는데, 만약 우리가 대접받고 싶은 만큼 다른 사람을 대접한다면, 우리는 보답으로 잘 대접받게 될 것이다."], [4, "(B) 그러나 단어, 제스처, 신념과 관점이 다른 의미를 가질지도 모르는 다문화 환경에서는 이 법칙은 의도하지 않은 결과를 갖는데, 그것은 나의 문화가 너의 것(문화)보다 낫다는 메시지를 줄 수 있다."], [2, "(A) 그것은 또한 우리가 옳은 것을 하고 있다고 믿지만, 우리가 하고 있는 것이 의도된 방식대로 해석되지 않고 있는 답답한 상황을 야기할 수 있다."]], "why": ["(5)의 <b>This rule<\/b>은 주어진 글 (1)의 <b>the golden rule<\/b>(황금률)을 가리킵니다", "그래서 주어진 글 다음에는 (C)가 옵니다", "다음으로 (C)의 (6)에 나오는 <b>monocultural setting<\/b>(단일 문화 환경)과 반대되는 <b>multicultural setting<\/b>(다문화 환경)이 (B)의 (4)에 <b>however<\/b>와 함께 나옵니다", "그래서 (C) 다음은 (B)입니다", "(B)는 황금률이 낳는 <b>의도하지 않은 결과<\/b>를 말합니다", "(A)의 (2)는 <b>also<\/b>로 <b>답답한 상황<\/b>도 생길 수 있다고 덧붙입니다", "그러니 (C) – (B) – (A) 순서입니다."], "ch": [{"n": "①", "t": "(A) – (C) – (B)", "g": "", "ok": false, "e": ["(A)의 also는 이미 나온 부작용에 또 하나를 덧붙이는 말입니다", "그런데 (B)에서 부작용(an unintended result)을 먼저 말한 뒤에 (A)가 와야 합니다", "또 주어진 글을 바로 받는 것은 (A)가 아니라 This rule로 시작하는 (C)입니다."]}, {"n": "②", "t": "(B) – (A) – (C)", "g": "", "ok": false, "e": ["(B)의 however는 앞에서 말한 내용과 대비되는 말을 이끕니다", "(C)의 monocultural setting이 먼저 나와야 (B)의 multicultural setting과 대비됩니다", "또 주어진 글 바로 뒤에는 황금률을 This rule로 받는 (C)가 옵니다."]}, {"n": "③", "t": "(B) – (C) – (A)", "g": "", "ok": false, "e": ["(B)를 맨 앞에 두면 however가 대비시킬 앞 내용이 없습니다", "주어진 글의 the golden rule을 This rule로 바로 받는 (C)가 먼저 와야 합니다."]}, {"n": "④", "t": "(C) – (A) – (B)", "g": "", "ok": false, "e": ["(C)가 맨 처음에 오는 것까지는 맞습니다", "하지만 (C)의 monocultural setting과 대비되는 것은 (B)의 multicultural setting입니다", "또 (A)의 also는 (B)에서 말한 부작용 뒤에 또 하나를 덧붙이는 말이므로 (A)는 (B) 뒤에 옵니다."]}, {"n": "⑤", "t": "(C) – (B) – (A)", "g": "", "ok": true, "e": ["주어진 글 → (C) This rule이 황금률을 받음 → (B) however로 다문화 환경의 부작용 → (A) also로 답답한 상황까지 덧붙임, 순으로 이어집니다."]}], "tr": ["다른 문화에 대한 존중과 지식을 발달시키는 방법을 이해하는 것은 황금률을 재검토하는 것에서 시작된다. “나는 내가 대접받고 싶은 방식대로 다른 사람을 대접한다.”", "(A) 그것은 또한 우리가 옳은 것을 하고 있다고 믿지만, 우리가 하고 있는 것이 의도된 방식대로 해석되지 않고 있는 답답한 상황을 야기할 수 있다.", "이러한 의사소통 오류는 문제로 이어질 수 있다.", "(B) 그러나 단어, 제스처, 신념과 관점이 다른 >(= 문화)<\/span>보다 낫다는"}], "easy": "하지만 말, 몸짓, 믿음, 생각이 서로 다른 뜻을 가질 수 있는 다문화 환경에서는, 이 법칙이 뜻하지 않은 결과를 낳아요. 내 문화가 네 문화보다 낫다는 메시지를 줄 수 있거든요.", "gist": "(B) — however로, 다문화 환경에서는 이 법칙에 부작용이 있다고 말한다."}, {"n": 5, "ch": [{"e": "<b>This rule<\/b>", "k": "이 법칙<span class=\"r\">(= 황금률)<\/span>은"}, {"e": "makes sense on some level;", "k": "어느 수준에서는 말이 된다"}, {"e": "if we treat others", "k": "만약 우리가 다른 사람을 대접한다면"}, {"e": "as well as we want to be treated,", "k": "우리가 대접받고 싶은 만큼"}, {"e": "we will be treated well", "k": "우리는 잘 대접받게 될 것이다"}, {"e": "in return.", "k": "보답으로"}], "easy": "이 법칙은 어느 정도는 말이 돼요. 우리가 대접받고 싶은 만큼 남을 대접하면, 우리도 그만큼 잘 대접받을 거예요.", "gist": "(C) — This rule로 주어진 글의 황금률을 바로 받아, 그 규칙이 어느 정도 타당하다고 말한다."}, {"n": 6, "ch": [{"e": "This rule works well", "k": "이 법칙<span class=\"r\">(= 황금률)<\/span>은 잘 작동한다"}, {"e": "in a <b>monocultural setting<\/b>,", "k": "단일 문화 환경에서는"}, {"e": "where everyone is working", "k": "모든 사람들이 일하는"}, {"e": "within the same cultural framework.", "k": "같은 문화적 틀 안에서"}], "easy": "이 법칙은 모두가 같은 문화적 틀 안에서 일하는 단일 문화 환경에서는 잘 작동해요.", "gist": "(C)의 마무리 — 규칙이 잘 통하는 곳은 단일 문화 환경이라고 말한다. (B)의 다문화 환경과 대비된다."}]}, {"no": "10", "typ": "무관한 문장", "src": "2022년 9월 35번", "evn": [5], "ev_en": "Increasing competitiveness among service providers does not necessarily mean promoting quality of customer services.", "ev_ko": [[5, "④ 서비스 제공자 간 경쟁력을 높이는 것은 반드시 고객 서비스의 질을 향상시키는 것을 의미하지는 않는다."]], "why": ["글 전체는 ICT 발전이 가져온 변화를 이야기합니다", "(2)는 서비스 제공자 간 경쟁력, (3)은 고객 만족과 충성도, (4)는 ICT 발전의 대표적인 예인 <b>mobile applications<\/b>를 말하고, (6)은 그 mobile applications를 부연 설명합니다", "그런데 (5)는 경쟁력을 높인다고 해서 고객 서비스의 질이 꼭 좋아지는 것은 아니라는 내용입니다", "ICT 발전과는 거리가 먼 내용이므로, (5)에 해당하는 ④가 정답입니다."], "ch": [{"n": "①", "t": "This leads to new levels/forms of competitiveness among service providers and transforms the customer experience through new services.", "g": "이것은 서비스 제공자 간 새로운 수준/형태의 경쟁력으로 이어지고, 새로운 서비스를 통해 고객 경험을 변화시킨다.", "ok": false, "e": ["(2)입니다", "(1)의 ICT 발전이 가져온 변화를 이어받아, 서비스 제공자 간 경쟁력과 새로운 서비스를 통한 고객 경험의 변화를 말합니다", "흐름에 맞습니다."]}, {"n": "②", "t": "Creating unique experiences and providing convenient services to customers leads to satisfaction and, eventually, customer loyalty to the service provider or brand (i.e., hotels).", "g": "독특한 경험을 만들고 편리한 서비스를 고객에게 제공하는 것은 만족과 결과적으로 서비스 제공자나 브랜드(즉, 호텔)에 대한 고객 충성도로 이어진다.", "ok": false, "e": ["(3)입니다", "독특한 경험과 편리한 서비스가 고객 만족과 충성도로 이어진다는 내용으로, 흐름에 맞습니다."]}, {"n": "③", "t": "In particular, the most recent technological boost received by the tourism sector is represented by mobile applications.", "g": "특히 관광업 분야가 받은 가장 최근의 '기술적' 향상은 모바일 어플리케이션으로 대표된다.", "ok": false, "e": ["(4)입니다", "ICT 발전의 대표적인 예로 mobile applications를 제시합니다", "(6)이 이 내용을 이어 설명하므로 흐름에 맞습니다."]}, {"n": "④", "t": "Increasing competitiveness among service providers does not necessarily mean promoting quality of customer services.", "g": "서비스 제공자 간 경쟁력을 높이는 것은 반드시 고객 서비스의 질을 향상시키는 것을 의미하지는 않는다.", "ok": true, "e": ["(5)입니다", "경쟁력을 높이는 것이 고객 서비스의 질 향상을 뜻하지는 않는다는 내용으로, ICT 발전과는 거리가 먼 내용입니다", "(4)의 mobile applications와 (6)의 mobile access가 이어지는 흐름 사이에 끼어 있습니다."]}, {"n": "⑤", "t": "Indeed, empowering tourists with mobile access to services such as hotel reservations, airline ticketing, and recommendations for local attractions generates strong interest and considerable profits.", "g": "사실 관광객에게 호텔 예약, 항공권 발권, 지역 명소 추천과 같은 서비스에 대한 모바일 접근 권한을 주는 것은 강한 관심과 상당한 이익을 발생시킨다.", "ok": false, "e": ["(6)입니다", "(4)의 mobile applications를 이어받아, 모바일 접근 권한이 가져오는 관심과 이익을 구체적으로 설명합니다", "흐름에 맞습니다."]}], "tr": ["빠른 속도의 정보 통신 기술(ICTs)의 진화는 관광업과 서비스업의 역동성과 비즈니스 모델을 급격하게 변화시켜 왔다.", "① 이것은 서비스 제공자 간 새로운 수준/형태의 경쟁력으로 이어지고, 새로운 서비스를 통해 고객 경험을 변화시킨다.", "② 독특한 경험을 만들고 편리한 서비스를 고객에게 제공하는 것은 만족과 결과적으로 서비스 제공자나 브랜드(즉, 호텔)에 대한 고객 충성도로 이어진다.", "③ 특히 관광업 분야가 받은 가장 최근의 '기술적' 향상은 모바일 어플리케이션으로 대표된다.", "④ 서비스 제공자 간 경쟁력을 높이는 것은 반드시 고객 서비스의 질을 향상시키는 것을 의미하지는 않는다.", "⑤ 사실 관광객에게 호텔 예약, 항공권 발권, 지역 명소 추천과 같은 서비스에 대한 모바일 접근 권한을 주는 것은 강한 관심과 상당한 이익을 발생시킨다."], "ps": [{"n": 1, "ch": [{"e": "The <b>fast-paced evolution function shuffle(arr,seed){const a=arr.slice();let s=hash(seed)||1;for(let i=a.length-1;i>0;i--){s=Math.imul(s^(s>>>15),2246822519)>>>0;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
const WS=WORDS.sets[0];

function hdr(){
  const on=id=>(view===id)?'on':'';
  const tabs=[['word','1','유반의어','답 맞춰보기'],['dk','2','직독직해','해석 맞춰보기'],['submit','3','답안지','정답 입력'],['exp','4','해설',S.sub?'정답·근거':'제출하면 열림']];
  return `<header><div class="wrap"><div class="row1"><h1>${esc(TITLE)}</h1><span><button class="link gohome" data-v="home">메뉴</button><a class="link" href="index.html">목록</a></span></div><div class="tabs">`+
    tabs.map(t=>`<button class="tab ${on(t[0])}" data-v="${t[0]}" ${(t[0]==='exp'&&!S.sub)?'disabled':''}><span class="t1"><span class="n">${t[1]}</span>${t[2]}</span><span class="t2">${t[3]}</span></button>`).join('')+
    `</div></div></header>`;
}
function noteList(){
  const out=[],ck=S.checks[WS.id]||{};
  WS.words.forEach((w,i)=>{
    const c=ck[i];if(!c)return;
    const parts=['m','s','a'].filter(p=>c[p]&&(p==='m'||w[p]));
    if(parts.length)out.push({i:i,w:w,parts:parts});
  });
  return out;
}
function render(){
  if(view==='home')renderHome();
  else if(view==='dk')renderDk();
  else if(view==='word')renderWord();
  else if(view==='note')renderNote();
  else if(view==='quiz')renderQuiz();
  else if(view==='result')renderResult();
  else if(view==='submit')renderSubmit();
  else if(view==='exp')renderExp();
  window.scrollTo(0,0);
}

p> their food in the winter / - by burying<sup>3</sup> the meats and vegetables in the snow.", "notes": [["1", "inhabitant", "주민"], ["2", "store", "저장하다"], ["3", "bury", "묻다"]], "lit": "많은 이들이 보았다 / 북부 지역 주민들이 겨울에 어떻게 음식을 저장하는지를 / 즉 고기와 채소를 눈 속에 묻는 방식으로", "nat": "많은 사람이 북부 지역 주민들이 겨울에 음식을 어떻게 저장하는지, 즉 고기와 채소를 눈 속에 묻어 두는 방식을 목격했다.", "ana": "<b>how ~</b>가 saw의 목적어 역할을 하는 의문사절이다. 대시(-) 뒤의 <b>by burying ~</b>은 그 방법을 구체적으로 덧붙여 설명하는 부연이다.", "pe": "Many saw / how inhabitants<sup>1</sup> \u0001of the northern regions\u0002 stored<sup>2</sup> their food \u0001in the winter\u0002 / - \u0001by burying<sup>3</sup> the meats and vegetables in the snow\u0002.", "pk": "많은 이들이 보았다 / 북부 지역 주민들이 \u0001겨울에\u0002 어떻게 음식을 저장하는지를 / 즉 \u0001고기와 채소를 눈 속에 묻는 방식으로\u0002", "core": "많은 이들이 북부 지역 주민들이 음식을 어떻게 저장하는지를 보았다.", "tags": ["주어 Many, 동사 saw (SVO)", "목적어 how절(의문사절, 명사절): 주어 inhabitants, 동사 stored. (of the northern regions) = 형용사구: inhabitants 꾸밈. (in the winter) = 부사구: stored 꾸밈", "(by burying ~) = 전치사구(부사구): stored 꾸밈, 방법을 구체화하는 부연. how절 안쪽 수식어"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이고, 목적어가 how절이라 길어 보인다."}, {"t": "큰 뼈대부터 찾는다.", "sub": ["S: Many (많은 사람들)", "V: saw (see 보다의 과거형)", "O: how절 (명사절)", "뼈대 = <b>Many saw how ~</b>"]}, {"t": "how절 안의 뼈대를 찾는다.", "sub": ["S: inhabitants (주민들). of the northern regions (북부 지역의)는 inhabitants를 꾸미는 전치사구", "V: stored (store 저장하다의 과거형)", "O: their food (그들의 음식). their = inhabitants", "in the winter (겨울에) = 부사구", "how ~ = 어떻게 ~하는지"]}, {"t": "대시(—) 뒤 <b>by burying the meats and vegetables in the snow</b>는 stored를 꾸미는 전치사구다. 저장하는 방법을 구체적으로 풀어 준다.", "sub": ["by + 동명사 = ~함으로써. bury (묻다)", "O: the meats and vegetables (고기와 채소). in the snow (눈 속에)"]}], "sum": "북부 주민이 겨울에 고기와 채소를 눈 속에 묻어 저장하는 방식을 많은 사람이 목격"}, {"i": "07", "q": "11", "s": "4", "title": "S+V+C(2형식) + 관계절 + 과거분사구", "eng": "One who did / was a young man / named<sup>1</sup> Clarence Birdseye.", "notes": [["1", "name", "~라고 이름 붙이다"]], "lit": "그렇게 생각해 본 한 사람은 / 젊은이였다 / Clarence Birdseye라는 이름의", "n 0002, / \u0001kept their taste and texture<sup>4</sup>\u0002.", "pk": "그는 \u0001알고서\u0002 깜짝 놀랐다 / \u0001갓 잡은 생선과 오리가\u0002 / \u0001그런 방식으로 빠르게 얼려져도\u0002 / \u0001맛과 식감을 그대로 유지한다는 것을\u0002", "core": "그는 깜짝 놀랐다.", "tags": ["<b>2형식</b> 주어 He + 동사 was + 보어 amazed. to find = to부정사(부사적: 감정의 원인): amazed를 꾸밈", "that절 = find의 목적어(명사절)이며 to find 덩어리 안쪽. 주어 fish and duck", "frozen ~ = 과거분사구(분사구문): 주어를 꾸미는 삽입 (같은 that절 안쪽)", "that절의 동사 kept + 목적어 their taste and texture"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식)</b>이다. 뒤에 to find와 긴 that절이 붙어 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: He (그)", "V: was (be ~이었다)", "C: amazed (깜짝 놀란). (문형 기준) be + 분사형 형용사 = 2형식", "뼈대 = <b>He was amazed</b>"]}, {"t": "<b>to find ~</b>는 <b>to부정사(부사적 용법)</b>로 놀란 이유를 나타낸다. '알고서 놀랐다'라는 뜻이고, find (알게 되다)의 목적어가 that절이다."}, {"t": "that절 안의 뼈대를 찾는다.", "sub": ["S: freshly caught fish and duck (갓 잡은 생선과 오리). freshly caught 갓 잡은", "V: kept (keep 유지하다의 과거형)", "O: their taste and texture (그것들의 맛과 식감). texture 식감, 질감", "뼈대 = <b>fish and duck kept their taste and texture</b>"]}, {"t": "함정: 주어와 동사 사이에 낀 <b>frozen quickly in such a fashion</b>은 동사가 아니라 <b>과거분사구</b>다. freeze (얼리다)의 p.p.인 frozen이고, '그런 방식으로 빠르게 얼려진'이라는 뜻이다. in such a fashion은 '그런 방식으로'라는 뜻이다."}], "sum": "갓 잡은 생선과 오리를 빠르게 얼려도 맛과 식감이 유지돼 깜짝 놀람"}], "qs": [{"q": "07", "type": "빈칸 추론", "src": "2018년 9월 31번", "ans": "②", "tr": [["1", "실리콘밸리에서 가장 혁신적인 회사 중 한 곳의 어느 CEO에게는 지루하고 창의력을 죽일 법해 보이는 일과가 있다."], ["2", "그는 일주일에 하루, 오전 9시에 시작하는 세 시간짜리 회의를 연다."], ["3", "그 회의는 절대 빠지거나 다른 시간으로 옮겨지지 않는다."], ["4", "그 회의는 의무다. 얼마나 철저한지, 이 국제적인 회사의 임원들조차 회의와 겹치는 출장은 절대 잡지 않아야 한다는 것을 다들 알고 있을 정도다."], ["5", "언뜻 보면 여기에 특별히 독특한 점은 없다."], ["6", "하지만 정말 독특한 것은 그 정기 회의에서 나오는 아이디어의 질이다."], ["7", "CEO가 회의를 준비하거나 누가 올지 안 올지를 신경 쓰는 데 드는 정신적 비용을 없애 주었기 때문에, 사람들은 창의적인 문제 해결에 집중할 수 있다."]], "evh": "7번 문장", "ev": [{"en": true, "h": "Because the CEO has eliminated the mental cost involved in planning the meeting or thinking about who will or won't be there, people can focus on creative problem solving."}, {"en": false, "h": "빈칸 바로 뒤 문장이 이유를 설명하며 the meeting을 두 번이나 반복한다. 즉 아이디어가 나오는 곳은 '그 회의'다. 앞에서 계속 이야기한 매주 같은 시간의 회의를 한 단어로 요약하면 the regular meetings가 된다."}], "opts": [{"n": "①", "t": "소비자 불만", "a": false, "x": true, "trap": false, "e": "소비자나 고객에 관한 내용은 지문에 전혀 없다."}, {"n": "②", "t": "그 정기 회의", "a": true, "x": false, "trap": false, "e": "매주 같은 요일·같은 시간에 절대 옮기지 않고 여는 회의를 가리키므로 regular(정기적인)가 정확하다."}, {"n": "③", "t": "출장 경험", "a": false, "x": true, "trap": true, "e": "travel은 '회의와 겹치면 안 되는 것'으로만 언급되며 아이디어의 출처가 아니다."}, {"n": "④", "t": "탄력 근무 시간", "a": false, "x": true, "trap": false, "e": "이 회의는 시간이 고정되어 있어 오히려 flexible(탄력적)의 반대다."}, {"n": "⑤", "t": "금전적 유인", "a": false, "x": true, "trap": false, "e": "보상이나 돈에 관한 언급이 없다."}], "w": [["innovative", "혁신적인"], ["creativity-killing", "창의력을 죽이는"], ["routine", "틀에 박힌 일과"], ["reschedule", "일정을 다시 잡다"], ["mandatory", "의무적인"], ["executive", "임원"], ["conflict with", "~와 겹치다"], ["at first glance", "언뜻 보기에"], ["eliminate", "없애다"], ["mental cost", "정신적 비용"]]}, {"q": "08", "type": "빈칸 추론", "src": "2013년 6월 36번", "ans": "⑤", "tr": [["1", "대부분의 경우 소리는 공기를 통해 귀에 도달한다. 그러나 공기가 소리를 전달하는 유일한 매질은 아니다."], ["2", "우리가 큰 소리를 내면 물고기가 놀라 헤엄쳐 달아난다."], ["3", "그래서 우리는 그 소리가 물을 통해 물고기에게 도달했음이 틀림없다고 결론짓는다."], ["4", "어떤 인디언은 먼 발소리를 알아채기 위해 땅에 귀를 댄다."], ["5", "그런 소리는 땅을 통해 전달될 때 비교적 또렷하다."], ["6", "마찬가지로 긴 탁자의 한쪽 끝을 가볍게 두드리는 소리도 귀를 탁자에 대고 있으면 반대쪽 끝에서 또렷이 들릴 수 있다."], ["7", "이런 사실들로부터 우리는 소리가 여러 가지 물질을 통해 귀로 전달될 수 있다는 것을 알 수 있다."]], "evh": "1번 문장", "ev": [{"en": true, "h": "In most cases sound reaches the ear through the air; but air is not the only medium through which sound is carried."}, {"en": false, "h": "첫 문장이 '공기만이 유일한 매질은 아니다'라고 화제를 던지고, 물(2~3번) · 땅(4~5번) · 나무 탁자(6번) 세 가지 예가 이어진다. 마지막 빈칸은 이 세 예를 한 문장으로 묶는 자리이므로 various materials(여러 물질)가 들어간다."}], "opts": [{"n": "①", "t": "듣는 것이 보는 것보다 더 효과적일 수 있다", "a": false, "x": true, "trap": false, "e": "보는 것(seeing)과 비교하는 내용은 전혀 없다."}, {"n": "②", "t": "사람마다 청력의 범위가 다양하다", "a": false, "x": true, "trap": buf+=ch;i++;}
flush();return o;}
function chunkSplit(s){return String(s).split(' / ')}
function scHtml(c){
  const esc=String;
  const E=chunkSplit(c.pe||c.eng),K=chunkSplit(c.pk||c.lit);
  let x='<div class="sc"><div class="sc-h"><span class="no2">'+esc(c.q)+'</span><span class="at">'+esc(c.q)+'번 문제 · '+esc(c.s)+'번 문장</span><span class="tt">'+esc(c.title)+'</span><span class="chv"></span></div><div class="sc-b">';
  if(c.steps&&c.steps.length){x+='<div class="lay th"><div class="hd">이 문장 읽는 순서</div><ol>'+c.steps.map(p=>'<li>'+p.t+(p.sub||[]).map(u=>'<div class="sub">'+u+'</div>').join('')+'</li>').join('')+'</ol></div>';}
  for(let j=0;j<E.length;j++)x+='<div class="ch"><div class="ce">'+mdWrap(E[j])+'</div><div class="ck">'+mdWrap(K[j]||'')+'</div></div>';
  if(c.notes.length){x+='<div class="nts">'+c.notes.map(n=>'<span class="nt"><sup>'+n[0]+'</sup> <b>'+esc(n[1])+'</b> '+esc(n[2])+'</span>').join('')+'</div>';}
  x+='<div class="lay nat"><span class="lb">자연스러운 해석</span>'+esc(c.nat)+'</div>';
  const sm=c.sum||c.core;
  if(sm){x+='<div class="lay sum"><span class="lb">한 줄 정리</span>'+esc(sm)+'</div>';}
  x+='</div></div>';
  return x;
}
function renderDk(){
  let h=hdr()+band(2)+'<div class="wrap"><div class="dkbody" style="padding:8px 0 12px"><div class="tool"><button class="tbtn" data-all="1">전체 보이기</button><button class="tbtn" data-all="0">전체 가리기</button></div>';
  CF.sn.forEach(c=>{h+=scHtml(c);});
  h+='</div></div>';

/* ---- 단어 확인 ---- */
function renderWord(){
  const ck=S.checks[WS.id]||{},locked=!!S.locked[WS.id],n=noteList().length;
  let h=hdr()+band(1)+`<div class="wrap ${locked?'locked':''}">`;
  WS.words.forEach((w,i)=>{
    const c=ck[i]||{};
    h+=`<div class="row"><div class="top"><span class="no">${i+1}</span><span class="word">${esc(w.w)}</span><span class="src">${esc(w.src)}번</span></div><div class="cells">`;
    h+=`<button class="cell m ${c.m?'bad':''}" data-i="${i}" data-p="m"><span class="tag">뜻</span><span>${esc(w.m)}</span></button>`;
    if(w.s)h+=`<button class="cell s ${c.s?'bad':''}" data-i="${i}" data-p="s"><span class="tag">유</span><span>${esc(w.s[0])}<span class="ko">${esc(w.s[1])}</span></span></button>`;
    if(w.a)h+=`<button class="cell a ${c.a?'bad':''}" data-i="${i}" data-p="a"><span class="tag">반</span><span>${esc(w.a[0])}<span class="ko">${esc(w.a[1])}</span></span></button>`;
    h+=`</div></div>`;
  });
  h+=`</div><div class="bar"><div class="wrap">`;
  h+=locked?`<button class="btn" disabled>확인 끝</button>`:`<button class="btn ${armed==='lock'?'arm':''}" id="lock">${armed==='lock'?'한 번 더 누르면 확인 끝':'확인 끝'}</button>`;
  h+=`<button class="btn pri" id="gonote">단어 오답노트 ${n}</button></div></div>`;
  app.innerHTML=h;
  app.querySelectorAll('.cell').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,p=b.dataset.p;
    S.checks[WS.id]=S.checks[WS.id]||{};
    const c=S.checks[WS.id][i]=S.checks[WS.id][i]||{};
    c[p]=c[p]?0:1;save();
    if(c[p]){const ww=WS.words[i],x=p==='m'?[ww.w,ww.m]:p==='s'?ww.s:ww.a;if(x&&x[0]&&x[1])WN.add([{w:x[0],m:x[1],src:'미니모고',how:'별표',ask:true}]);}
    b.classList.toggle('bad',!!c[p]);
    $('#gonote').textContent='단어 오답노트 '+noteList().length;
  });
  const lk=$('#lock');if(lk)lk.onclick=()=>{
    if(armed==='lock'){S.locked[WS.id]=1;armed=null;save();
      recSend({type:'word',marks:noteList().map(it=>({w:it.w.w,parts:it.parts}))});}
    else armed='lock';
    render();
  };
  $('#gonote').onclick=()=>{view='note';armed=null;render();};
}
function renderNote(){
  const list=noteList();
  let h=`<header><div class="wrap hd2"><h1>단어 오답노트 <span class="meta">${list.length}개</span></h1><button class="link" id="back">확인표</button></div></header><div class="wrap">`;
  if(!list.length)h+=`<div class="empty">아직 표시한 단어가 없습니다</div>`;
  list.forEach(it=>{
    const w=it.w,r=(S.res[WS.id]||{})[it.i]||{};
    h+=`<div class="note-item"><span class="w">${esc(w.w)}</span><span class="meta">${esc(w.src)}번</span>`;
    const row=(p,tag,txt,ko)=>{
      const bad=it.parts.includes(p);
      const rs=r[p]===1?'<span class="res o">맞춤</span>':r[p]===0?'<span class="res x">틀림</span>':'';
      return `<div class="part ${p} ${bad?'bad':''}"><span class="tag">${tag}</span><span>${esc(txt)}${ko?`<span class="ko"> ${esc(ko)}</span>`:''}</span>${bad?rs:''}</div>`;
    };
    h+=row('m','뜻',w.m,'');
    if(w.s)h+=row('s','유',w.s[0],w.s[1]);
    if(w.a)h+=row('a','반',w.a[0],w.a[1]);
    h+=`</div>`;
  });
  h+=`</div><div class="bar"><div class="wrap"><button class="btn" id="back2">확인표</button><button class="btn pri" id="start" ${list.length?'':'disabled'}>복습 시작</button></div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='word';armed=null;render();};
  $('#back2').onclick=()=>{view='word';render();};
  $('#start').onclick=()=>{quiz={qs:buildQuestions(),n:0,right:0,done:false,shown:false};view='quiz';render();};
}
function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
/* ---- 답 제출 ---- */
function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}
/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}

/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
