<title>고1 미니모의고사 21회 01–06번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:0}
#app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
#app>.wrap{width:100%}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}
.ko{color:var(--sub);font-size:14px;margin-left:6px}
.cell.bad{background:var(--badbg);border-color:var(--bad)}
.cell.bad .tag{background:var(--bad)}
.locked .cell{pointer-events:none}
.bar{position:sticky;margin-top:auto;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.done .opt{pointer-events:none}
.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}
.hcard .chip{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--sub)}
.hcard .chip.ok{background:var(--goodbg);color:var(--good)}
.hcard .chip.warn{background:var(--badbg);color:var(--bad)}
.hcard[disabled]{opacity:.55}
details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.th .hd{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:6px}
.th ol{list-style:none;margin:0;padding:0;counter-reset:n}
.th li{counter-increment:n;position:relative;padding:7px 0 7px 30px;font-size:15px;line-height:1.7;border-top:1px dashed #cfdcf0}
.th li:first-child{border-top:0}
.th li:before{content:counter(n);position:absolute;left:0;top:9px;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;text-align:center;line-height:21px}
.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.th .sub{margin:3px 0 0;color:#444;font-size:14.5px;line-height:1.7}
.sc .lay.sum{border-left:4px solid #2e7d32;background:#f1f8f1}
/* ---- 새 직독직해·해설 화면 ---- */
.sc{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden;background:var(--bg)}
.sc-h{padding:11px 14px 10px;background:#eef2f8;border-bottom:1px solid var(--line)}
.sc-h .no2{display:inline-block;min-width:26px;height:26px;line-height:26px;border-radius:13px;background:var(--accent);color:#fff;font-weight:800;font-size:13px;text-align:center;padding:0 7px;margin-right:8px}
.sc-h .at{font-size:13px;color:var(--sub)}
.sc-h .tt{display:block;margin-top:7px;font-size:15.5px;font-weight:800;color:var(--accent);line-height:1.45}
.sc-b{padding:10px 12px 12px}
.sc .ch{margin-bottom:6px}
.sc .ce{font-size:17px}

.nt{font-size:13.5px;line-height:1.5;background:#fbf6ee;border:1px solid #f0e2cd;border-radius:8px;padding:5px 9px;color:#4a3a22}

.qc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}
.qchip small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-bottom:1px}
.qchip.o{border-color:var(--good);background:var(--goodbg)}
.qchip.x{border-color:var(--bad);background:var(--badbg)}
.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.trs{list-style:none;margin:0;padding:0;background:var(--soft);border-radius:10px;padding:8px 12px}

.wds{display:flex;flex-wrap:wrap;gap:6px}

.toq{display:block;width:100%;margin-top:14px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}
details.sub2{margin:12px 0 0}
details.sub2>summary{list-style:none;cursor:pointer;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px;padding:6px 0}

.cr{color:#A3102E;font-weight:700}
.sc .lay.core{border-left:4px solid #2e7d32;background:#f1f8f1}

.rst{margin-top:8px;background:#fff8e1;border:1px solid #efe3b8;border-left:4px solid #d9a21b;border-radius:8px;padding:8px 10px;font-size:15px;line-height:1.7;word-break:keep-all}

o earn<sup>2</sup> it.", "notes": [["1", "consistently", "한결같이"], ["2", "earn", "얻다"], ["3", "focus on", "~에 집중하다"]], "lit": "만약 당신이 아이의 성취에 대해 한결같이 보상을 준다면 / 그 아이는 보상을 받는 것에 더 집중하기 시작한다 / 그것을 얻기 위해 자신이 무엇을 했는지보다", "nat": "아이가 무언가를 해낼 때마다 늘 보상을 주면, 아이는 그 보상을 얻으려고 자신이 무엇을 했는지보다 보상 자체에 더 집중하게 된다.", "ana": "<b>more on A than on B</b>처럼 비교 대상 앞에 전치사 on을 똑같이 붙여 형태를 맞춘 병렬 구조이다. <b>what</b>은 선행사를 포함한 관계대명사로 전치사 on의 목적어절을 이끈다.", "pe": "\u0001If you consistently<sup>1</sup> reward a child for her accomplishments\u0002, / she starts to focus more \u0001on getting the reward\u0002 / \u0001than on what she did to earn<sup>2</sup> it\u0002.", "pk": "\u0001만약 당신이 아이의 성취에 대해 한결같이 보상을 준다면\u0002 / 그 아이는 \u0001보상을 받는 것에\u0002 더 집중하기 시작한다 / \u0001그것을 얻기 위해 자신이 무엇을 했는지보다\u0002", "core": "그 아이는 더 집중하기 시작한다.", "tags": ["If ~ = 접속사절(부사절, 조건): 주절을 꾸밈", "<b>3형식</b> 주어 she + 동사 starts + 목적어 to focus more(to부정사). on getting the reward = 거의 필수에 가까운 부사구(focus가 on을 거의 요구): focus를 꾸밈 [기준: 모양 규칙]", "than on ~ = 비교 접속사구(부사적): more를 꾸밈. on 뒤 what절은 전치사의 목적어(명사절)"], "steps": [{"t": "이 문장은 <b>If절 + S+V+O(3형식)</b>이다. 목적어 to부정사 안에 비교 구문이 들어 있다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: she (그 아이, a child)", "V: starts (start 시작하다의 3인칭 단수형)", "O: to focus more ~ (to부정사)", "뼈대 = <b>she starts to focus</b>"]}, {"t": "<b>If you consistently reward a child for her accomplishments</b>는 <b>부사절(조건)</b>이다.", "sub": ["S: you  V: reward (보상하다)  O: a child", "consistently = 한결같이, for her accomplishments = 아이의 성취에 대해 (her = a child)"]}, {"t": "to focus 이하는 <b>more A than B</b> 비교 구조이다.", "sub": ["more on getting the reward = 보상을 받는 것에 더 (focus on ~에 집중하다)", "than on what she did to earn it = 그것을 얻으려고 자신이 한 것보다", "what she did = on의 목적어인 명사절 (S: she  V: did  O: what). to earn it은 목적을 나타내는 to부정사 (earn 얻다, it = the reward)"]}, {"t": "함정: than 뒤에도 on이 반복된다. 보상을 받는 것에 집중하는 정도와 자신이 한 일에 집중하는 정도를 비교한다."}], "sum": "일관되게 보상을 주면 아이는 한 일보다 보상 자체에 집중하게 됨"}, {"i": "08", "q": "06", "s": "1", "title": "S+V+O + 콜론 뒤 동격 질문", "eng": "Most people have no doubt<sup>1</sup> heard this question: / If a tree falls in the forest<sup>2</sup> / and there is no one there to hear it fall, / does it make a sound?", "notes": [["1", "no doubt", "틀림없이"], ["2", "forest", "숲"]], "lit": "대부분의 사람들은 틀림없이 이 질문을 들어 보았을 것이다 / 숲에서 나무가 쓰러지는데 / 그것이 쓰러지는 소리를 들을 사람이 아무도 없다면 / 그것은 소리를 내는 것일까?", "nat": "대부분의 사람은 이런 질문을 한 번쯤 들어 보았을 것이다. 숲에서 나무가 쓰러지는데 그 소리를 들을 사람이 아무도 없다면, 그것은 과연 소리를 낸 것일까?", "ana": "콜론(:) 뒤의 의문문 전체가 앞의 <b>this question</b>을 구체적으로 풀어 주는 동격이다. <b>to hear</b>는 no one을 꾸미는 to부정사의 형용사적 용법이고, hear의 목적격보어로 원형부정사 <b>fall</b>이 쓰였다.", "pe": "Most people have \u0001no doubt<sup>1</sup>\u0002 heard this question: / \u0001If a tree falls in the forest<sup>2</sup>\u0002 / \u0001and there is no one there to hear it fall\u0002, / \u0001does it make a sound\u0002?", "pk": "대부분의 사람들은 \u0001틀림없이\u0002 이 질문을 들어 보았을 것이다 / \u0001숲에서 나무가 쓰러지는데\u0002 / \u0001그것이 쓰러지는 소리를 들을 사람이 아무도 없다면\u0002 / \u0001그것은 소리를 내는 것일까\u0002?", "core": "대부분의 사람들은 이 질문을 들어 보았을 것이다.", "tags": ["<b>3형식</b> 주어 Most people + 동사 have heard + 목적어 this question. no doubt = 삽입 부사구: have heard를 꾸밈", "If ~ = 콜론 뒤 동격(질문 내용): question을 풀어 줌. 안은 접속사절 if절 [기준: 콜론 뒤를 동격 수식어로 봄]", "and there is no one ~ = 위 if절과 병렬. to hear it fall은 no one을 꾸미는 to부정사(형용사적). hear + 목적어 + 원형 fall", "does it make a sound = 동격 질문의 주절. 의문문 어순"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이고, 콜론 뒤에 질문의 내용이 길게 붙었다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: most people (대부분의 사람들)", "V: have heard (hear 듣다의 과거분사, 현재완료)", "O: this question (이 질문)", "no doubt = 틀림없이 (삽입 부사구)", "뼈대 = <b>Most people have heard this question</b>"]}, {"t": "콜론 뒤는 this question의 내용(동격)이다. 질문은 if절과 의문문으로 이루어져 있다.", "sub": ["If a tree falls in the forest = 부사절(조건). 숲에서 나무가 쓰러진다면 (fall 쓰러지다)", "and there is no one there to hear it fall = if절에 병렬된 절. 거기에 아무도 없다면"]}, {"t": "<b>to hear it fall</b>은 <b>to부정사(형용사적 용법)</b>으로 no one을 꾸민다.", "sub": ["hear + O + 원형: it(나무)이 fall하는 것을 듣다 (지각동사 5형식)", "no one to hear it fall = 쓰러지는 소리를 들을 사람이 아무도"]}, {"t": "마지막 <b>does it make a sound?</b>는 질문의 주절이다. 의문문 어순(do + 주어 + 동사)이고 it은 a tree이다. make a sound는 소리를 내다이다."}], "sum": "숲에서 쓰러진 나무, 듣는 이 없어도 소리가 나는지 묻는 질문"}], "qs": [{"q": "01", "type": "글의 목적", "src": "2014년 6월 18번", "ans": "③", "tr": [["1", "음악 사업은 매우 인기가 있고, 여러분 같은 많은 젊은이가 이 업계에 마음이 끌린다."], ["2", "음악을 더 쉽게 접할 수 있게 되면서, 음악이 복제되는 일도 점점 더 쉬워지고 있다."], ["3", "일부 신인 음악가들은 인기 아티스트를 베끼고 그것을 자기 작품인 양 시장에 내놓는 방식으로 남의 작품을 훔친다."], ["4", "그것이 바로 음악 라이선싱(사용 허가)이 중요한 이유이다."], ["5", "자신의 원곡이 도난당하고 복제되는 것을 막기 위해, 여러분은 아티스트로서 자신이 만든 것에 사용 허가를 등록하고 그 작품을 사용할 권리를 다른 사람에게 팔 수 있다."], ["6", "그렇게 해 두면 누군가가 허락 없이 당신의 음악을 쓰더라도 원작자인 당신은 여전히 대가를 받을 수 있다."], ["7", "라이선싱은 음악이 도난당하지 않도록 보호하고 새 음악과 오래된 음악을 모두 지켜 주며, 이것이 음악 라이선싱이 존재하는 이유이다."]], "evh": "4·7번 문장", "ev": [{"en": true, "h": "That is why music licensing is important. ... Licensing protects music from being stolen and preserves both new and older music, and this is why music licensing exists."}, {"en": false, "h": "4번 문장에서 '그래서 음악 라이선싱이 중요하다'라고 화제를 던지고, 마지막 7번 문장에서 '이것이 음악 라이선싱이 존재하는 이유'라고 다시 못 박는다. 앞뒤로 같은 말을 반복하는 자리가 곧 글의 목적이다."}], "opts": [{"n": "①", "t": "뛰어난 신인 음악 작곡가를 모집하려고", "a": false, "x": true, "trap": false, "e": "budding musicians(신인 음악가)는 '모집 대상'이 아니라 '남의 작품을 베끼는 사람'의 예로 등장한다."}, {"n": "②", "t": "음원 이용료의 책정 기준을 안내하려고", "a": false, "x": true, "trap": true, "e": "돈을 받을 수 있다(get paid)는 말은 나오지만 이용료를 얼마로 정하는지에 대한 기준은 전혀 없다."}, {"n": "③", "t": "음악 사용 허가권 등록의 필요성을 알리려고", "a": true, "x": false, "trap": false, "e": "license what you have made(자신이 만든 것에 사용 허가를 등록하라)가 글쓴이가 독자에게 시키는 유일한 행동이며, 4번·7번 문장이 그 필요성을 두 번 강조한다."}, {"n": "④", "t": "젊은 층이 가장 선호하는 음악을 소개하려고", "a": false, "x": true, "trap": false, "e": "young people은 첫 문장에서 독자를 부르는 말로 쓰였을 뿐, 어떤 음악을 좋아하는지는 언급되지 않는다."}, {"n": "⑤", "t": "고전 음악의 현대적인 해석 방법을 설명하려고", "a": false, "x": true, "trap": false, "e": "older music이 나오지만 '오래된 음악도 보존된다'는 뜻이지 고전 음악 해석과는 무관하다."}], "w": [["budding", "신인의"], ["accessible", "이용하기 쉬운"], ["license", "사용을 허가하다"], ["permission", "허락"], ["preserve", "보존하다"], ["right", "권리"], ["get paid", "돈을 받다"], ["exist", "존재하다"]]}, {"q": "02", "type": "글의 주제", "src": "2018년 11월 22번", "ans": "①", "tr": [["1", "우리가 숫자를 읽을 때, 우리는 가장 오른쪽 자리보다 가장 왼쪽 자리의 숫자에 더 큰 영향을 받는다. 그것이 우리가 숫자를 읽고 처리하는 순서이기 때문이다."], ["2", "799라는 숫자는 800보다 훨씬 적게 느껴진다. 앞의 것은 '7 얼마'로, 뒤의 것은 '8 얼마'로 보기 때문이다. 반면 798은 799와 거의 다를 바 없게 느껴진다."], ["3", "19세기 이래로 가게 주인들은 제품이 실제보다 싸다는 인상을 주려고 9로 끝나는 가격을 골라 이 수법을 이용해 왔다."], ["4", "조사에 따르면 오늘날 모든 소매 가격의 3분의 1에서 3분의 2 정도가 9로 끝난다."], ["5", "우리 모두 쇼핑에 노련하지만, 여전히 속아 넘어간다."], ["6", "2008년에 남브르타뉴 대학 연구진은 다섯 종류의 피자를 각각 8유로에 팔고 있던 한 동네 피자 가게를 관찰했다."], ["7", "그중 한 피자의 가격이 7.99유로로 내려가자, 그 피자의 판매 점유율은 전체의 3분의 1에서 절반으로 뛰었다."]], "evh": "1·3번 문장", "ev": [{"en": true, "h": "When we read a number, we are more influenced by the leftmost digit than by the rightmost ... shopkeepers have taken advantage of this trick by choosing prices ending in a 9."}, {"en": false, "h": "1번 문장에서 '사람은 왼쪽 자리 숫자에 더 영향을 받는다'는 읽기 방식을 제시하고, 3번 문장에서 '가게 주인들이 그 점을 이용해 9로 끝나는 가격을 붙인다'로 연결된다. 읽는 방식 + 가격 책정이 한 문장에 다 들어가야 주제가 된다."}], "opts": [{"n": "①", "t": "사람들이 숫자를 읽는 방식을 이용한 가격 책정 전략", "a": true, "x": false, "trap": false, "e": "leftmost digit(왼쪽 자리 숫자)에 영향을 받는 '읽기 방식'과 prices ending in a 9라는 '가격 책정'이 모두 담긴 유일한 선택지이다."}, {"n": "②", "t": "지역 경제 흐름을 반영하는 소비 패턴", "a": false, "x": true, "trap": false, "e": "local pizza restaurant의 local은 '동네의'라는 뜻이지 지역 경제와는 무관하다."}, {"n": "③", "t": "판매자의 신뢰성을 높이기 위해 숫자를 더하기", "a": false, "x": true, "trap": false, "e": "숫자를 '더한다'는 내용도, 신뢰성(credibility)에 관한 언급도 지문에 없다."}, {"n": "④", "t": "시장 규모와 제품 가격의 인과관계", "a": false, "x": true, "trap": false, "e": "시장 규모(market size)는 전혀 다뤄지지 않는다."}, {"n": "⑤", "t": "매장 환경을 바꿔 고객을 속이는 판매 수법", "a": false, "x": true, "trap": true, "e": "trick, fooled 같은 단어가 그대로 보여 고르기 쉽지만, 바뀐 것은 매장 환경이 아니라 가격의 '끝자리 숫자'다."}], "w": [["leftmost", "가장 왼쪽의"], ["digit", "숫자, 자릿수"], ["the former", "전자"], ["the latter", "후자"], ["whereas", "반면에"], ["take advantage of", "~을 이용하다"], ["impression", "인상"], ["retail price", "소매 가격"], function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}

var EXP={"01": "<p class=\"mtr\">마더텅 정답률 <b>90%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">목적 문제는 <b>That is why</b>(그것이 ~한 이유이다)처럼 결론을 알리는 신호를 찾으세요. 1~3번의 도용 문제는 배경이고, 4번과 7번에서 <b>music licensing</b>(음악 사용 허가권)이 왜 필요한지 두 번 못 박아요.</p><div class=\"ck-step\"><span class=\"lab\">3번 문장 · 문제 상황</span><div class=\"en\">Some budding musicians steal other people’s work by copying popular artists …</div><p class=\"ko\">몇몇 신인 음악가들은 인기 있는 예술가들의 작품을 복제해 다른 사람들의 작품을 훔친다 …</p></div><div class=\"ck-via\"><i>▼</i><span>That(그것) = 3번의 도용 문제. 그래서 허가권이 중요하다고 결론을 내려요</span></div><div class=\"ck-step key\"><span class=\"lab\">4번 문장 · 결정적 단서</span><div class=\"en\"><mark>That is why</mark> music licensing is important.</div><p class=\"ko\"><mark>그것이</mark> 음악 사용 허가권이 중요한 <mark>이유이다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>5·6번의 허가권 장점을 정리하며 같은 말을 한 번 더 해요</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 문장 · 결론 다시 확인</span><div class=\"en\">Licensing protects music from being stolen … and <mark>this is why music licensing exists</mark>.</div><p class=\"ko\">음악 사용 허가권은 음악이 도용되는 것으로부터 보호하고, … <mark>이것이 음악 사용 허가권이 존재하는 이유이다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">음악 사용 허가권 등록의 필요성을 알리려고<small>4번 is important(중요하다)와 7번 this is why(이것이 ~한 이유이다)를 그대로 옮겼어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">음원 이용료의 책정 기준을 안내하려고</span><span class=\"why\">[지문에 없음] 5·6번에 sell the right(권리를 팔다), get paid(돈을 받다)가 나와 돈 얘기 같지만, 얼마를 받는지 기준은 한 번도 안 나와요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">뛰어난 신인 음악 작곡가를 모집하려고</span><span class=\"why\">[지문에 없음] 3번의 budding musicians(신인 음악가들)는 모집 대상이 아니라 남의 작품을 훔치는 문제 사례로 나와요. 작곡가 모집 이야기는 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">젊은 층이 가장 선호하는 음악을 소개하려고</span><span class=\"why\">[지문에 없음] 1번은 젊은 사람들이 음악 산업에 끌린다는 도입일 뿐, 어떤 음악을 좋아하는지는 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">고전 음악의 현대적인 해석 방법을 설명하려고</span><span class=\"why\">[지문에 없음] 7번 older music(기존의 음악)은 허가권이 보존해 준다는 말이지, 해석 방법 이야기가 아니에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">The music business is very popular,</div><div class=\"k\">음악 사업은 매우 인기가 있으며,</div></div><div class=\"rc\"><div class=\"e\">and many young people like you</div><div class=\"k\">당신과 같은 많은 젊은 사람들이</div></div><div class=\"rc\"><div class=\"e\">are attracted towards this industry.</div><div class=\"k\">이 산업에 대해 매력을 느낀다.</div></div><div class=\"rnat\">음악 사업은 매우 인기가 있으며, 당신과 같은 많은 젊은 사람들은 이 산업에 대해 매력을 느낀다.</div><div class=\"rst\">우리 반에도 직접 노래를 만들어 올리는 친구가 있어요. = 지문 1번, 젊은 사람들이 음악 사업에 끌린다는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">As music becomes more accessible,</div><div class=\"k\">음악이 더 접근하기 쉬워지면서,</div></div><div class=\"rc\"><div class=\"e\">it is increasingly easy</div><div class=\"k\">점점 쉬워지고 있다</div></div><div class=\"rc\"><div class=\"e\">for music to be copied.</div><div class=\"k\">음악이 복제되는 것이.</div></div><div class=\"rnat\">음악이 더 접근하기 쉬워지면서, 음악이 복제되는 것이 점점 쉬워지고 있다.</div><div class=\"rst\">그런데 요즘은 그 노래를 누구나 쉽게 듣고 내려받아 복사할 수 있어요. = 지문 2번, 음악이 <b>복제되기</b> 쉬워졌다는 말이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Some budding musicians steal other people’s work</div><div class=\"k\">몇몇 신인 음악가들은 다른 사람들의 작품을 훔친다</div></div><div class=\"rc\"><div class=\"e\">by copying popular artists</div><div class=\"k\">인기 있는 예술가들(의 작품)을 복제하고</div></div><div class=\"rc\"><div class=\"e\">and presenting it in the market</div><div class=\"k\">그것을 시장에 내놓음으로써</div></div><div class=\"rc\"><div class=\"e\">as their own work.</div><div class=\"k\">그들 자신의 작품으로.</div></div><div class=\"rnat\">몇몇 신인 음악가들은 인기 있는 예술가들의 작품을 복제하고, 그것을 그들 자신의 작품으로 시장에 내놓음으로써 다른 사람들의 작품을 훔친다.</div><div class=\"rst\">어떤 아이는 그 친구 노래를 베껴서 자기 노래라고 올려요. = 지문 3번, 신인 음악가가 남의 작품을 <b>훔친다</b>는 말이에요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">That is why</span></div><div class=\"k\"><span class=\"cw\">그것이 ~한 이유이다</span></div></div><div class=\"rc\"><div class=\"e\">music licensing is important.</div><div class=\"k\">음악 사용 허가권이 중요한</div></div><div class=\"rnat\">그것이 음악 사용 허가권이 중요한 이유이다.</div><div class=\"rst\"><b>그래서</b>(That is why) “이 노래 주인은 나야” 하고 등록해 두는 게 중요해요. 지문 4번, 음악 사용 허가권이 중요하다는 게 글의 목적이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">To protect your original songs</div><div class=\"k\">당신의 원곡들을 보호하기 위해</div></div><div class=\"rc\"><div class=\"e\">from being stolen and copied,</div><div class=\"k\">도용되고 복제되는 것으로부터,</div></div><div class=\"rc\"><div class=\"e\">you as an artist can license what you have made</div><div class=\"k\">당신은 예술가로서 당신이 만든 것의 사용을 허가할 수 있고,</div></div><div class=\"rc\"><div class=\"e\">and then sell the right to use your work to others.</div><div class=\"k\">그 다음에 당신의 작품을 사용할 권리를 다른 사람들에게 팔 수 있다.</div></div><div class=\"rnat\">당신의 원곡들이 도용되고 복제되는 것으로부터 보호하기 위해, 당신은 예술가로서 당신이 만든 것의 사용을 허가할 수 있고, 그 다음에 당신의 작품을 사용할 권리를 다른 사람들에게 팔 수 있다.</div><div class=\"rst\">친구는 노래를 등록해 두고, 쓰고 싶은 사람에게 쓸 권리를 팔 수 있어요. = 지문 5번, 원곡을 지키려고 사용을 허가하고 권리를 판다는 말이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Then,</div><div class=\"k\">그러면,</div></div><div class=\"rc\"><div class=\"e\">although someone uses your music without permission,</div><div class=\"k\">비록 누군가가 허가 없이 당신의 음악을 사용할지라도,</div></div><div class=\"rc\"><div class=\"e\">you, the original artist, can still get paid.</div><div class=\"k\">원작자인 당신은 여전히 돈을 지불받을 수 있다.</div></div><div class=\"rnat\">그러면, 비록 누군가가 허가 없이 당신의 음악을 사용할지라도, 원작자인 당신은 여전히 돈을 지불받을 수 있다.</div><div class=\"rst\">그러면 누가 몰래 그 노래를 써도 친구는 돈을 받을 수 있어요. = 지문 6번, 허가 없이 써도 원작자가 돈을 받는다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">Licensing protects music from being stolen</div><div class=\"k\">음악 사용 허가권은 음악이 도용되는 것으로부터 보호하고,</div></div><div class=\"rc\"><div class=\"e\">and preserves both new and older music,</div><div class=\"k\">새로운 음악과 기존의 음악 둘 다를 보존하며,</div></div><div class=\"rc ckc\"><div class=\"e\">and <span class=\"cw\">this is why music licensing exists</span>.</div><div class=\"k\"><span class=\"cw\">이것이 음악 사용 허가권이 존재하는 이유이다</span>.</div></div><div class=\"rnat\">음악 사용 허가권은 음악이 도용되는 것으로부터 보호하고, 새로운 음악과 기존의 음악 둘 다를 보존하며, 이것이 음악 사용 허가권이 존재하는 이유이다.</div><div class=\"rst\">새 노래도 옛날 노래도 안전하게 지켜지죠. 지문 7번이 <b>이것이 허가권이 존재하는 이유</b>라고 다시 못 박아요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"budding\" data-m=\"신인의, 막 싹트는\"><b>budding</b>신인의, 막 싹트는</button><button type=\"button\" class=\"wdb\" data-w=\"accessible\" data-m=\"접근하기 쉬운, 이용하기 쉬운\"><b>accessible</b>접근하기 쉬운, 이용하기 쉬운</button><button type=\"button\" class=\"wdb\" data-w=\"license\" data-m=\"사용을 허가하다\"><b>license</b>사용을 허가하다</button><button type=\"button\" class=\"wdb\" data-w=\"permission\" data-m=\"허락, 허가\"><b>permission</b>허락, 허가</button><button type=\"button\" class=\"wdb\" data-w=\"preserve\" data-m=\"보존하다\"><b>preserve</b>보존하다</button><button type=\"button\" class=\"wdb\" data-w=\"get paid\" data-m=\"돈을 받다\"><b>get paid</b>돈을 받다</button></div>", "02": "<p class=\"mtr\">마더텅 정답률 <b>65%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">주제는 <b>원리 문장(1번)</b>과 그 원리를 <b>이용하는 문장(3번)</b>을 묶어서 찾으세요. 1번 “왼쪽 숫자에 더 끌린다” + 3번 “<b>this trick</b>(이 속임수)으로 9로 끝나는 가격” = 주제예요.</p><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 숫자 읽는 원리</span><div class=\"en\">When we read a number, we are more influenced by <mark>the leftmost digit</mark> than by the rightmost …</div><p class=\"ko\">우리가 숫자를 읽을 때, 우리는 <mark>가장 왼쪽의 숫자에</mark> 의해 더 영향을 받는다 …</p></div><div class=\"ck-via\"><i>▼</i><span>this trick(이 속임수) = 1·2번의 왼쪽 숫자 원리. 그걸 가격 정하기에 써먹어요</span></div><div class=\"ck-step key\"><span class=\"lab\">3번 문장 · 결정적 단서</span><div class=\"en\">… shopkeepers have <mark>taken advantage of this trick</mark> by <mark>choosing prices ending in a 9</mark> …</div><p class=\"ko\">… 소매상인들은 <mark>이 속임수를 이용해왔다</mark> <mark>9로 끝나는 가격을 정함으로써</mark> …</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>2번</em>799는 800보다 훨씬 작게 느껴짐</span><span><em>4번</em>소매 가격의 3분의 1~3분의 2가 9로 끝남</span><span><em>7번</em>8.00유로 피자를 7.99유로로 → 판매 점유율 3분의 1에서 절반</span></div><div class=\"ck-eq\">⇒ 모두 같은 말 = 숫자 읽는 방식을 이용한 가격 정하기 (1번 + 3번)</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">사람들이 숫자를 읽는 방식을 이용한 가격 책정 전략<small>1번 읽는 방식 + 3번 taken advantage of(이용해왔다) 가격 정하기를 둘 다 담았어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">매장 환경을 바꿔 고객을 속이는 판매 수법</span><span class=\"why\">[지문에 없음] 5번 fooled(속는)만 보고 고르면 함정이에요. 속이는 수단은 매장 환경이 아니라 3번의 9로 끝나는 가격이에요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">지역 경제 흐름을 반영하는 소비 패턴</span><span class=\"why\">[지문에 없음] 6번 a local pizza restaurant(한 지역 피자 가게)는 실험 장소일 뿐, 지역 경제 흐름 이야기는 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">판매자의 신뢰성을 높이기 위해 숫자를 더하기</span><span class=\"why\">[반대] 3번은 신뢰가 아니라 cheaper(더 싼) 인상을 주려는 거예요. 숫자를 더하는 게 아니라 8.00을 7.99로 낮춰요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">시장 규모와 제품 가격의 인과관계</span><span class=\"why\">[지문에 없음] 7번 share of sales(판매 점유율)가 나오지만 시장 크기와 가격의 관계는 한 번도 안 나와요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds key\" data-ord=\"1\"><span class=\"rn\">1번 · 단서</span><div class=\"rc\"><div class=\"e\">When we read a number,</div><div class=\"k\">우리가 숫자를 읽을 때,</div></div><div class=\"rc ckc\"><div class=\"e\">we are more influenced by <span class=\"cw\">the leftmost digit</span></div><div class=\"k\">우리는 <span class=\"cw\">가장 왼쪽의 숫자에</span> 의해 더 영향을 받는다</div></div><div class=\"rc\"><div class=\"e\">than by the rightmost,</div><div class=\"k\">가장 오른쪽의 숫자보다,</div></div><div class=\"rc\"><div class=\"e\">since that is the order in which we read, and process, them.</div><div class=\"k\">그것이 우리가 그것들(= 숫자)을 읽고 처리하는 순서이기 때문이다.</div></div><div class=\"rnat\">우리가 숫자를 읽을 때, 우리는 가장 오른쪽의 숫자보다 가장 왼쪽의 숫자에 의해 더 영향을 받는데, 그것이 우리가 그것들(숫자)을 읽고 처리하는 순서이기 때문이다.</div><div class=\"rst\">학교 앞 문구점에서 가격표를 볼 때, 우리 눈은 맨 앞(왼쪽) 숫자부터 봐요. = 지문 1번, 사람은 <b>가장 왼쪽 숫자</b>에 더 영향을 받는다는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">The number 799 feels significantly less than 800</div><div class=\"k\">숫자 799는 800보다 상당히 더 작게 느껴지는데,</div></div><div class=\"rc\"><div class=\"e\">because we see the former as 7-something</div><div class=\"k\">왜냐하면 우리가 전자를 7로 시작하는 어떤 것으로 보고</div></div><div class=\"rc\"><div class=\"e\">and the latter as 8-something,</div><div class=\"k\">후자를 8로 시작하는 어떤 것으로 보기 때문이고,</div></div><div class=\"rc\"><div class=\"e\">whereas 798 feels pretty much like 799.</div><div class=\"k\">반면에 798은 799와 거의 비슷하게 느껴진다.</div></div><div class=\"rnat\">숫자 799는 800보다 상당히 더 작게 느껴지는데, 왜냐하면 우리가 전자를 7로 시작하는 어떤 것으로 보고 후자를 8로 시작하는 어떤 것으로 보기 때문이고, 반면에 798은 799와 거의 비슷하게 느껴진다.</div><div class=\"rst\">그래서 1,990원 볼펜은 2,000원 볼펜보다 훨씬 싸 보여요. = 지문 2번, 799가 800보다 상당히 작게 느껴진다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc\"><div class=\"e\">Since the nineteenth century,</div><div class=\"k\">19세기부터</div></div><div class=\"rc ckc\"><div class=\"e\">shopkeepers have <span class=\"cw\">taken advantage of this trick</span></div><div class=\"k\">소매상인들은 <span class=\"cw\">이 속임수를 이용해왔다</span></div></div><div class=\"rc ckc\"><div class=\"e\">by <span class=\"cw\">choosing prices ending in a 9</span>,</div><div class=\"k\"><span class=\"cw\">9로 끝나는 가격을 정함으로써</span>,</div></div><div class=\"rc\"><div class=\"e\">to give the impression that a product is cheaper than it is.</div><div class=\"k\">상품이 원래보다 더 싸다는 인상을 주기 위해.</div></div><div class=\"rnat\">19세기부터 소매상인들은 상품이 원래보다 더 싸다는 인상을 주기 위해 9로 끝나는 가격을 정함으로써 이 속임수를 이용해왔다.</div><div class=\"rst\">문구점 사장님은 이걸 알고 일부러 9로 끝나는 가격을 붙여요. 지문 3번, 가게 주인들이 <b>이 속임수를 이용해</b> 9로 끝나는 가격을 정한다는 게 핵심이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Surveys show that</div><div class=\"k\">설문조사들은 보여준다</div></div><div class=\"rc\"><div class=\"e\">around a third to two-thirds of all retail prices</div><div class=\"k\">모든 소매 가격의 약 3분의 1에서 3분의 2 정도가</div></div><div class=\"rc\"><div class=\"e\">now end in a 9.</div><div class=\"k\">이제 9로 끝난다는 것을.</div></div><div class=\"rnat\">설문조사들은 이제 모든 소매 가격의 약 3분의 1에서 3분의 2 정도가 9로 끝난다는 것을 보여준다.</div><div class=\"rst\">둘러보면 진열대 가격표 중 꽤 많은 게 9로 끝나요. = 지문 4번, 소매 가격의 3분의 1에서 3분의 2가 9로 끝난다는 말이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Though we are all experienced shoppers,</div><div class=\"k\">우리 모두 경험 있는 쇼핑객들이지만,</div></div><div class=\"rc\"><div class=\"e\">we are still fooled.</div><div class=\"k\">우리는 여전히 속임수에 넘어간다.</div></div><div class=\"rnat\">우리 모두 경험 있는 쇼핑객들이지만, 우리는 여전히 속임수에 넘어간다.</div><div class=\"rst\">우리가 매일 장을 보는데도 또 “싸다!” 하고 넘어가요. = 지문 5번, 경험 많은 쇼핑객도 여전히 속는다는 말이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">In 2008,</div><div class=\"k\">2008년에,</div></div><div class=\"rc\"><div class=\"e\">researchers at the University of Southern Brittany</div><div class=\"k\">Southern Brittany 대학의 연구원들은</div></div><div class=\"rc\"><div class=\"e\">monitored a local pizza restaurant</div><div class=\"k\">한 지역(인근) 피자 가게를 관찰했다</div></div><div class=\"rc\"><div class=\"e\">that was serving five types of pizza at €8.00 each.</div><div class=\"k\">각각 8.00유로에 다섯 종류의 피자를 제공하는.</div></div><div class=\"rnat\">2008년에, Southern Brittany 대학의 연구원들은 각각 8.00유로에 다섯 종류의 피자를 제공하는 한 지역(인근) 피자 가게를 관찰했다.</div><div class=\"rst\">실제로 실험도 있었어요. 지문 6번, 2008년 연구원들이 피자 다섯 종류를 각각 8.00유로에 파는 가게를 지켜봤어요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">When one of the pizzas was reduced in price to €7.99,</div><div class=\"k\">그 피자 중 하나가 7.99유로로 가격이 줄었을 때,</div></div><div class=\"rc\"><div class=\"e\">its share of sales rose</div><div class=\"k\">그것의 판매 점유율이 올랐다</div></div><div class=\"rc\"><div class=\"e\">from a third of the total to a half.</div><div class=\"k\">전체의 3분의 1에서 절반으로.</div></div><div class=\"rnat\">그 피자 중 하나가 7.99유로로 가격이 줄었을 때, 그것의 판매 점유율이 전체의 3분의 1에서 절반으로 올랐다.</div><div class=\"rst\">그중 하나만 7.99유로로 바꾸자 그 피자가 훨씬 많이 팔렸어요. 지문 7번처럼, 숫자 읽는 방식을 이용한 가격 전략이 진짜 통한 거예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"leftmost\" data-m=\"가장 왼쪽의\"><b>leftmost</b>가장 왼쪽의</button><button type=\"button\" class=\"wdb\" data-w=\"digit\" data-m=\"숫자, 자릿수\"><b>digit</b>숫자, 자릿수</button><button type=\"button\" class=\"wdb\" data-w=\"whereas\" data-m=\"반면에\"><b>whereas</b>반면에</button><button type=\"button\" class=\"wdb\" data-w=\"take advantage of\" data-m=\"~을 이용하다\"><b>take advantage of</b>~을 이용하다</button><button type=\"button\" class=\"wdb\" data-w=\"impression\" data-m=\"인상\"><b>impression</b>인상</button><button type=\"button\" class=\"wdb\" data-w=\"retail price\" data-m=\"소매 가격\"><b>retail price</b>소매 가격</button></div>", "03": "<p class=\"mtr\">마더텅 정답률 <b>85%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">제목은 <b>수단(누가 돕나)</b>과 <b>대상(누구를 돕나)</b>을 둘 다 담아야 해요. 2번의 <b>pet therapy</b>(반려동물 치료)·<b>fight stress</b>(스트레스에 맞서다)와 4번의 <b>beneficial</b>(도움이 되는)을 묶으세요.</p><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 화제 제시</span><div class=\"en\">… some animals are <mark>helping students in need</mark>.</div><p class=\"ko\">… 몇몇 동물들이 <mark>도움이 필요한 학생들을 도와주고 있다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>도움이 필요한 이유(우울·불안)와 해결 수단(반려동물 행사)이 정해져요</span></div><div class=\"ck-step key\"><span class=\"lab\">2번 문장 · 결정적 단서</span><div class=\"en\">With many students reporting depression and anxiety, school officials arrange <mark>pet therapy events</mark> to spread cheer and <mark>fight stress</mark> …</div><p class=\"ko\">많은 학생들이 우울감과 불안을 보고함에 따라, 학교 관계자들은 즐거움을 퍼뜨리고 <mark>스트레스에 맞서 싸울</mark> 수 있도록 <mark>반려동물 치료 행사</mark>를 마련한다</p></div><div class=\"ck-via\"><i>▼</i><span>그 방문이 정말 효과가 있다는 연구 근거로 못 박아요</span></div><div class=\"ck-step key\"><span class=\"lab\">4번 문장 · 효과 확인</span><div class=\"en\">Their visits are <mark>obviously beneficial</mark>: Research shows that contact with pets can <mark>decrease blood pressure and stress-hormone levels</mark> …</div><p class=\"ko\">그것들(= 반려동물)의 방문은 <mark>분명히 도움이 된다</mark>. … 반려동물과의 접촉이 <mark>혈압과 스트레스 호르몬 수치를 낮추고</mark></p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">반려동물: 스트레스받는 학생들을 위한 해법<small>수단 pets(반려동물) + 대상 스트레스에 시달리는 students(학생들)를 둘 다 담았어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">도우미 동물이란 무엇인가?</span><span class=\"why\">[반대] 3번은 These are not service animals(이것들은 보조 동물이 아니다)라고 했어요. 도우미 동물은 이 글의 주인공이 아니에요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">호르몬은 기분에 어떤 영향을 주는가</span><span class=\"why\">[범위 좁음] 4번의 호르몬은 반려동물 방문이 효과 있다는 근거일 뿐이에요. 호르몬만 다루면 반려동물과 학생이 빠져요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">당신이 자원봉사를 하면 다른 사람들도 함께할 것이다</span><span class=\"why\">[지문에 없음] 3번에 volunteers(자원봉사자들)가 나오지만 동물 주인이라는 말뿐, 남들도 따라 한다는 내용은 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">감정 관리가 학교 성적을 높인다</span><span class=\"why\">[지문에 없음] 5번 path to success(성공으로 가는 길)가 나오지만, 성적이 오른다는 결과는 한 번도 안 나와요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">On college campuses in the U.S. and around the world,</div><div class=\"k\">미국과 전 세계의 대학 캠퍼스에서,</div></div><div class=\"rc\"><div class=\"e\">some animals are helping students in need.</div><div class=\"k\">몇몇 동물들이 도움이 필요한 학생들을 도와주고 있다.</div></div><div class=\"rnat\">미국과 전 세계의 대학 캠퍼스에서, 몇몇 동물들이 도움이 필요한 학생들을 도와주고 있다.</div><div class=\"rst\">시험 기간, 우리 학교 운동장에 강아지들이 찾아왔어요. = 지문 1번, 동물들이 <b>도움이 필요한 학생들</b>을 돕고 있다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">2번 · 단서</span><div class=\"rc\"><div class=\"e\">With many students reporting depression and anxiety,</div><div class=\"k\">많은 학생들이 우울감과 불안을 보고함에 따라,</div></div><div class=\"rc ckc\"><div class=\"e\">school officials arrange <span class=\"cw\">pet therapy events</span></div><div class=\"k\">학교 관계자들은 <span class=\"cw\">반려동물 치료 행사</span>를 마련한다</div></div><div class=\"rc ckc\"><div class=\"e\">to spread cheer and <span class=\"cw\">fight stress</span>,</div><div class=\"k\">즐거움을 퍼뜨리고 <span class=\"cw\">스트레스에 맞서 싸울</span> 수 있도록,</div></div><div class=\"rc\"><div class=\"e\">especially during exams.</div><div class=\"k\">특히 시험기간 동안에.</div></div><div class=\"rnat\">많은 학생들이 우울감과 불안을 보고함에 따라, 학교 관계자들은 특히 시험기간 동안에 즐거움을 퍼뜨리고 스트레스에 맞서 싸울 수 있도록 반려동물 치료 행사를 마련한다.</div><div class=\"rst\">시험 걱정에 우울한 친구가 많아서, 선생님들이 강아지랑 노는 시간을 마련했어요. 지문 2번의 <b>스트레스에 맞서는</b> 반려동물 행사가 글의 중심이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">These are not service animals</div><div class=\"k\">이것들(= 반려동물)은 보조 동물이 아니라</div></div><div class=\"rc\"><div class=\"e\">trained to help people with disabilities;</div><div class=\"k\">장애를 가진 사람들을 돕기 위해 훈련된;</div></div><div class=\"rc\"><div class=\"e\">most are the pets of volunteers.</div><div class=\"k\">대부분이 자원봉사자들의 반려동물이다.</div></div><div class=\"rnat\">이것들(반려동물)은 장애를 가진 사람들을 돕기 위해 훈련된 보조 동물이 아니라, 대부분이 자원봉사자들의 반려동물이다.</div><div class=\"rst\">이 강아지들은 특별 훈련을 받은 안내견이 아니라 동네 봉사자들이 키우는 강아지예요. = 지문 3번, 보조 동물이 아니라 자원봉사자들의 반려동물이에요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">Their visits are <span class=\"cw\">obviously beneficial</span>:</div><div class=\"k\">그것들(= 반려동물)의 방문은 <span class=\"cw\">분명히 도움이 된다</span>.</div></div><div class=\"rc\"><div class=\"e\">Research shows that contact with pets</div><div class=\"k\">연구는 보여준다 반려동물과의 접촉이</div></div><div class=\"rc ckc\"><div class=\"e\">can <span class=\"cw\">decrease blood pressure and stress-hormone levels</span></div><div class=\"k\"><span class=\"cw\">혈압과 스트레스 호르몬 수치를 낮추고</span></div></div><div class=\"rc\"><div class=\"e\">and increase so-called happiness hormones.</div><div class=\"k\">이른바 행복 호르몬을 증가시킬 수 있다는 것을.</div></div><div class=\"rnat\">그것들(반려동물)의 방문은 분명히 도움이 된다. 연구는 반려동물과의 접촉이 혈압과 스트레스 호르몬 수치를 낮추고 이른바 행복 호르몬(이라 불리는 것)을 증가시킬 수 있다는 것을 보여준다.</div><div class=\"rst\">강아지를 쓰다듬으면 두근거림이 가라앉고 기분이 좋아져요. 지문 4번처럼 방문이 <b>분명히 도움이 되고</b>, 스트레스 호르몬이 낮아진대요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Mary Callahan, a director at Pet Partners,</div><div class=\"k\">Pet Partners의 책임자인 Mary Callahan은</div></div><div class=\"rc\"><div class=\"e\">considers pet visits on campus</div><div class=\"k\">캠퍼스의 반려동물 방문을 ~라고 생각한다</div></div><div class=\"rc\"><div class=\"e\">a great way to support students</div><div class=\"k\">학생들을 도와주는 훌륭한 방법</div></div><div class=\"rc\"><div class=\"e\">on their path to success.</div><div class=\"k\">성공으로 가는 길에 있는.</div></div><div class=\"rnat\">Pet Partners의 책임자인 Mary Callahan은 캠퍼스의 반려동물 방문이 성공으로 가는 길에 있는 학생들을(학생들의 성공을) 도와주는 훌륭한 방법이라고 생각한다.</div><div class=\"rst\">그래서 전문가도 “이건 학생들을 돕는 좋은 방법”이라고 해요. 지문 5번까지 모아 보면 제목은 “반려동물: 스트레스받는 학생들을 위한 해법”이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"in need\" data-m=\"도움이 필요한\"><b>in need</b>도움이 필요한</button><button type=\"button\" class=\"wdb\" data-w=\"depression\" data-m=\"우울\"><b>depression</b>우울</button><button type=\"button\" class=\"wdb\" data-w=\"anxiety\" data-m=\"불안\"><b>anxiety</b>불안</button><button type=\"button\" class=\"wdb\" data-w=\"arrange\" data-m=\"마련하다\"><b>arrange</b>마련하다</button><button type=\"button\" class=\"wdb\" data-w=\"beneficial\" data-m=\"이로운, 도움이 되는\"><b>beneficial</b>이로운, 도움이 되는</button><button type=\"button\" class=\"wdb\" data-w=\"blood pressure\" data-m=\"혈압\"><b>blood pressure</b>혈압</button></div>", "04": "<p class=\"mtr\">마더텅 정답률 <b>95%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">안내문 일치는 <b>선택지 순서 = 안내문 순서</b>예요. 위에서부터 짝지어 대조하며 <b>시간(오전·오후)·층수·수준·인원 제한</b>처럼 단어 하나로 갈리는 곳을 지워 나가세요.</p><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>①</em>6번 시간</span><span><em> ummary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Jason’s Photography Class</div><div class=\"k\">Jason의 사진 수업</div></div><div class=\"rnat\">Jason의 사진 수업</div><div class=\"rst\">사진 찍기를 좋아하는 내가 동네 게시판에서 포스터 하나를 발견했어요. = 지문 1번 제목, 제이슨(Jason)의 사진 수업이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Are you tired of taking pictures</div><div class=\"k\">당신은 사진을 찍는 것에 싫증이 나셨나요</div></div><div class=\"rc\"><div class=\"e\">with your camera set to “Auto”?</div><div class=\"k\">당신의 카메라가 '자동'으로 설정된 채로?</div></div><div class=\"rnat\">당신은 당신의 카메라가 '자동'으로 설정된 채로 사진을 찍는 것에 싫증이 나셨나요?</div><div class=\"rst\">맨날 핸드폰 카메라를 ‘자동’(Auto)에만 두고 찍어서 좀 지겨웠거든요. = 지문 2번, 자동 설정으로 찍는 게 싫증 났냐고 물어요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Do you want to create</div><div class=\"k\">당신은 만들어 내고 싶으신가요</div></div><div class=\"rc\"><div class=\"e\">more professional-looking photos?</div><div class=\"k\">더 전문가처럼 보이는 사진을?</div></div><div class=\"rnat\">당신은 더 전문가처럼 보이는 사진을 만들어 내고 싶으신가요?</div><div class=\"rst\">“나도 사진작가처럼 멋지게 찍어 보고 싶다!” = 지문 3번, 더 전문가처럼 보이는 사진을 만들고 싶냐고 물어요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">You won’t want to miss this opportunity.</div><div class=\"k\">당신은 이 기회를 놓치고 싶지 않으실 것입니다.</div></div><div class=\"rnat\">당신은 이 기회를 놓치고 싶지 않으실 것입니다.</div><div class=\"rst\">포스터는 이 기회를 놓치지 말라고 해요. = 지문 4번이에요. 이제 아래 세부 사항을 하나씩 확인해요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Date: Saturday, December 19</div><div class=\"k\">날짜: 12월 19일, 토요일</div></div><div class=\"rnat\">• 날짜: 12월 19일, 토요일</div><div class=\"rst\">먼저 날짜부터 달력에 표시해요. 지문 5번, 12월 19일 토요일이에요.</div></div><div class=\" a-w=\"professional-looking\" data-m=\"전문가처럼 보이는\"><b>professional-looking</b>전문가처럼 보이는</button><button type=\"button\" class=\"wdb\" data-w=\"tuition fee\" data-m=\"수업료\"><b>tuition fee</b>수업료</button><button type=\"button\" class=\"wdb\" data-w=\"be covered\" data-m=\"다루어지다\"><b>be covered</b>다루어지다</button><button type=\"button\" class=\"wdb\" data-w=\"equipment\" data-m=\"장비\"><b>equipment</b>장비</button><button type=\"button\" class=\"wdb\" data-w=\"limited to\" data-m=\"~로 제한되는\"><b>limited to</b>~로 제한되는</button></div>", "05": "<p class=\"mtr\">마더텅 정답률 <b>40%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\"><b>who</b>(~하는 사람) 뒤 동사는 <b>선행사</b>에 수를 맞춰요. 8번 who(~하는 사람) 앞의 <b>a praise lover</b>(칭찬받기 좋아하는 사람)는 한 명(단수)이니 동사에 -s가 붙어야 해요.</p><div class=\"ck-step\"><span class=\"lab\">문제지 ⑤번 자리 (8번)</span><div class=\"en\">… she may become a praise lover who eventually <u>⑤ become</u> less interested …</div><p class=\"ko\">칭찬받기 좋아하는 사람이 될지도 모른다, 결국 덜 관심을 ( ? ) — who 바로 뒤 동사 자리</p></div><div class=\"ck-via\"><i>▼</i><span>who(~하는 사람) 바로 앞 명사가 선행사예요. a(한) + 단수 명사 lover(좋아하는 사람)</span></div><div class=\"ck-step key\"><span class=\"lab\">8번 문장 · 선행사 찾기</span><div class=\"en\">she may become <mark>a praise lover</mark></div><p class=\"ko\">그녀(= 아이)는 <mark>칭찬받기 좋아하는 사람이</mark> 될지도 모른다</p></div><div class=\"ck-via\"><i>▼</i><span>선행사가 단수이니 관계절 동사도 단수 → becomes(되다)</span></div><div class=\"ck-step key\"><span class=\"lab\">8번 문장 · 결정적 단서</span><div class=\"en\">who eventually <mark>becomes</mark> less interested in learning the alphabet for its own sake</div><p class=\"ko\">결국 알파벳을 배우는 그 자체를 위한 것에 <mark>덜 관심을 갖는</mark></p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">주격 관계대명사 who(~하는 사람) 뒤 동사의 수 일치</p><p class=\"gr\">who(~하는 사람) 뒤 동사는 바로 앞 선행사에 수를 맞춰요. 선행사가 한 명(단수)이면 동사에 -s, 여러 명(복수)이면 -s 없이 써요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I have a friend who plays the piano.</div><div class=\"ko\">나는 피아노를 치는 친구가 한 명 있다. (a friend 한 명 → plays가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I have a friend who play the piano.</div><div class=\"ko\">선행사 a friend(한 친구)는 단수인데 play로 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>I have two friends who play the piano.</div><div class=\"ko\">나는 피아노를 치는 친구가 두 명 있다. (two friends 여러 명 → play가 맞아요)</div></div><p class=\"gb\">지문 8번도 who(~하는 사람) 앞이 a praise lover(칭찬받기 좋아하는 사람) 한 명이라 become(되다)이 아니라 becomes(되다)가 맞아요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">become → becomes (되다)<small>선행사 a praise lover(칭찬받기 좋아하는 사람)가 단수라서 becomes(되다)예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">what ~하는 것</span><span class=\"why\">6번 than on(~보다) 뒤 자리예요. 전치사 on(~에) 뒤라 명사 덩어리가 와야 하고, she did(그녀가 했다) 뒤에 '무엇을' 했는지가 비어 있어서 what(~하는 것)이 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">관계대명사 what(~하는 것): 앞에 선행사 없음 + 뒤에 빠진 자리 있음</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I like what you made.</div><div class=\"ko\">나는 네가 만든 것이 좋다. (made 뒤에 '무엇을'이 비어 있고 앞에 선행사가 없어서 what이 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I like that you made.</div><div class=\"ko\">that 앞에 받아 줄 명사가 없는데 뒤가 비어 있어서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>I like the cake that you made.</div><div class=\"ko\">나는 네가 만든 케이크가 좋다. (앞에 the cake 케이크가 있으니 that이 맞아요)</div></div><p class=\"gb\">지문 6번도 on(~에) 뒤에 선행사 없이 she did(그녀가 했다)의 목적어가 비어 있으니 what(~하는 것)이 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">to offer 주는 것</span><span class=\"why\">3번은 it is misguided(잘못된 것이다)로 시작해요. 앞의 it(그것)은 가짜 주어이고, 진짜 주어는 뒤의 to offer your child false praise(아이에게 거짓 칭찬을 하는 것)라서 to offer(주는 것)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">가주어 it(그것) + 진주어 to offer(주는 것)</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>It is fun to ride a bike.</div><div class=\"ko\">자전거를 타는 것은 재미있다. (It이 가짜 주어, to ride 타는 것이 진짜 주어라서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>It is fun ride a bike.</div><div class=\"ko\">to 없이 ride(타다)를 바로 써서 진짜 주어가 될 수 없어 틀려요.</div></div><p class=\"gb\">지문 3번도 it is misguided(잘못된 것이다) 뒤에 진짜 주어가 와야 하니 to offer(주는 것)가 맞아요. 같은 문장 뒤쪽 to reward(보상을 주는 것)도 같은 구조예요.</p></div></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">positive 긍정적인</span><span class=\"why\">4번은 rewards sound(보상이 들린다) 바로 뒤예요. sound(~하게 들리다)는 뒤에 '어떻게' 들리는지 형용사가 오는 동사라서 positive(긍정적인)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">감각동사 sound(~하게 들리다) + 형용사</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>Your idea sounds great.</div><div class=\"ko\">네 생각은 아주 좋게 들린다. (sounds 뒤에 형용사 great 좋은이 와서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>Your idea sounds greatly.</div><div class=\"ko\">greatly(크게)는 부사라 sounds 뒤 보어 자리에 올 수 없어 틀려요.</div></div><p class=\"gb\">지문 4번도 rewards sound(보상이 들린다) 뒤라 부사 positively(긍정적으로)가 아니라 형용사 positive(긍정적인)가 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">pleasing 기쁘게 하는 것</span><span class=\"why\">7번은 from enjoying learning itself(배움 그 자체를 즐기는 것에서) to(~로) ④ 구조예요. from A to B(A에서 B로)의 to(~로)는 전치사라 뒤에 동명사가 오고, 앞의 enjoying(즐기는 것)과 모양도 맞춰 pleasing(기쁘게 하는 것)이 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">from A to B(A에서 B로): 전치사 to(~로) 뒤 동명사, A·B 같은 모양</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>His hobby changed from reading to playing games.</div><div class=\"ko\">그의 취미는 책 읽기에서 게임하기로 바뀌었다. (reading과 playing 둘 다 -ing라 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>His hobby changed from reading to play games.</div><div class=\"ko\">to가 전치사인데 동사원형 play를 써서 틀려요.</div></div><p class=\"gb\">지문 7번도 from enjoying(즐기는 것에서) to(~로) 뒤라 동명사 pleasing(기쁘게 하는 것)이 맞아요.</p></div></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">What could be wrong</div><div class=\"k\">무엇이 잘못될 수 있을까</div></div><div class=\"rc\"><div class=\"e\">with the compliment “I’m so proud of you”?</div><div class=\"k\">\"나는 네가 너무 자랑스러워\"라고 칭찬하는 것이?</div></div><div class=\"rnat\">\"나는 네가 너무 자랑스러워\"라고 칭찬하는 것이 잘못된 걸까?</div><div class=\"rst\">“너 정말 자랑스러워!” 이 칭찬에 무슨 문제가 있을까요? 지문 1번은 이 질문으로 글을 열어요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Plenty.</div><div class=\"k\">많이 그렇다.</div></div><div class=\"rnat\">많이 그렇다.</div><div class=\"rst\">답은 “문제가 꽤 많다”예요. 지문 2번 Plenty(많이)가 바로 그 대답이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Just as it is misguided</div><div class=\"k\">잘못된 것처럼</div></div><div class=\"rc\"><div class=\"e\">to offer your child false praise,</div><div class=\"k\">당신의 아이에게 사실이 아닌 칭찬을 하는 것이,</div></div><div class=\"rc\"><div class=\"e\">it is also a mistake</div><div class=\"k\">또한 잘못된 것이다</div></div><div class=\"rc\"><div class=\"e\">to reward all of his accomplishments.</div><div class=\"k\">그의(= 아이) 모든 성취에 대해 보상을 주는 것이.</div></div><div class=\"rnat\">당신의 아이에게 사실이 아닌 칭찬을 하는 것이 잘못된 것처럼, 그(아이)의 모든 성취에 대해 보상을 주는 것 또한 잘못된 것이다.</div><div class=\"rst\">거짓 칭찬도 잘못이지만, 잘한 걸 하나하나 다 보상해 주는 것도 잘못이래요. 지문 3번은 가주어 it(그것) + 진주어 <b>to offer</b>(주는 것) 구조예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Although rewards sound so positive,</div><div class=\"k\">비록 보상이 아주 긍정적으로 들리긴 하지만,</div></div><div class=\"rc\"><div class=\"e\">they can often lead to negative consequences.</div><div class=\"k\">그것은 종종 부정적인 결과로 이어질 수 있다.</div></div><div class=\"rnat\">비록 보상이 아주 긍정적으로 들리긴 하지만, 그것은 종종 부정적인 결과로 이어질 수 있다.</div><div class=\"rst\">보상은 좋게 들리지만 나쁜 결과로 이어질 수 있어요. 지문 4번 sound(~하게 들리다) 뒤라 형용사 <b>positive</b>(긍정적인)가 맞아요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">It is because</div><div class=\"k\">그것은 ~때문이다</div></div><div class=\"rc\"><div class=\"e\">they can take away from the love of learning.</div><div class=\"k\">그것이 배움에 대한 즐거움을 빼앗아 갈 수 있기</div></div><div class=\"rnat\">그것이 배움에 대한 즐거움을 빼앗아 갈 수 있기 때문이다.</div><div class=\"rst\">왜냐하면 보상 때문에 배우는 재미가 사라질 수 있기 때문이에요. = 지문 5번, 배움에 대한 즐거움을 빼앗는다는 말이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">If you consistently reward a child for her accomplishments,</div><div class=\"k\">만약 당신이 지속적으로 그녀(= 아이)의 성취에 대해 보상을 준다면,</div></div><div class=\"rc\"><div class=\"e\">she starts to focus more on getting the reward</div><div class=\"k\">그녀는 보상을 받는 것에 더 집중하기 시작한다</div></div><div class=\"rc ckc\"><div class=\"e\">than on <span class=\"cw\">what she did</span> to earn it.</div><div class=\"k\">그것을 얻기 위해 <span class=\"cw\">했던 것보다</span>.</div></div><div class=\"rnat\">만약 당신이 지속적으로 그녀(아이)의 성취에 대해 보상을 준다면, 그녀는 그것을 얻기 위해 했던 것보다 보상을 받는 것에 더 집중하기 시작한다.</div><div class=\"rst\">늘 상을 주면 아이는 자기가 한 노력보다 상 받는 데 더 집중해요. 지문 6번 on(~에) 뒤 빠진 자리가 있어 <b>what</b>(~하는 것)이 맞아요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">The focus of her excitement shifts</div><div class=\"k\">그녀(= 아이)의 즐거움의 초점이 옮겨진다</div></div><div class=\"rc\"><div class=\"e\">from enjoying learning itself</div><div class=\"k\">배움 그 자체를 즐기는 것에서</div></div><div class=\"rc\"><div class=\"e\">to pleasing you.</div><div class=\"k\">당신을 기쁘게 하는 것으로.</div></div><div class=\"rnat\">그녀(아이)의 즐거움의 초점이 배움 그 자체를 즐기는 것에서 당신을 기쁘게 하는 것으로 옮겨진다.</div><div class=\"rst\">배우는 재미에서 부모님 기분 맞추기로 관심이 옮겨 가요. 지문 7번 from A to B(A에서 B로) 구조라 <b>pleasing</b>(기쁘게 하는 것)이에요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc\"><div class=\"e\">If you applaud every time your child identifies a letter,</div><div class=\"k\">만약 당신이 아이가 글자를 알아볼 때마다 박수를 쳐준다면,</div></div><div class=\"rc ckc\"><div class=\"e\">she may become <span class=\"cw\">a praise lover</span></div><div class=\"k\">그녀(= 아이)는 <span class=\"cw\">칭찬받기 좋아하는 사람이</span> 될지도 모른다</div></div><div class=\"rc ckc\"><div class=\"e\">who eventually <span class=\"cw\">becomes</span> less interested in learning the alphabet for its own sake</div><div class=\"k\">결국 알파벳을 배우는 그 자체를 위한 것에 <span class=\"cw\">덜 관심을 갖는</span> ※ 문제지엔 become으로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">than for hearing you applaud.</div><div class=\"k\">당신이 박수치는 것을 듣는 것보다.</div></div><div class=\"rnat\">만약 당신이 아이가 글자를 알아볼 때마다 박수를 쳐준다면, 그녀는 결국 당신이 박수치는 것을 듣는 것보다 알파벳을 배우는 것 그 자체를 위한 것에 덜 관심을 갖는(알파벳을 배우는 그 자체보다 당신이 박수치는 것에 더 관심이 있는) 칭찬받기 좋아하는 사람이 될지도 모른다.</div><div class=\"rst\">글자 하나 맞힐 때마다 박수 치면, 아이는 박수 듣는 걸 더 좋아하는 사람이 돼요. 선행사 <b>a praise lover</b>(칭찬받기 좋아하는 사람)가 단수라 becomes(되다)예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"compliment\" data-m=\"칭찬\"><b>compliment</b>칭찬</button><button type=\"button\" class=\"wdb\" data-w=\"misguided\" data-m=\"잘못된\"><b>misguided</b>잘못된</button><button type=\"button\" class=\"wdb\" data-w=\"accomplishment\" data-m=\"성취\"><b>accomplishment</b>성취</button><button type=\"button\" class=\"wdb\" data-w=\"consequence\" data-m=\"결과\"><b>consequence</b>결과</button><button type=\"button\" class=\"wdb\" data-w=\"applaud\" data-m=\"박수를 보내다\"><b>applaud</b>박수를 보내다</button><button type=\"button\" class=\"wdb\" data-w=\"for its own sake\" data-m=\"그 자체를 위해\"><b>for its own sake</b>그 자체를 위해</button></div>", "06": "<p class=\"mtr\">마더텅 정답률 <b>50%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">밑줄은 2번 <b>나무 비유</b>를 논문에 그대로 옮긴 말이에요. 나무가 쓰러진다 = <b>논문이 발표된다</b>, 듣는 사람이 없다 = <b>이해하는 독자가 없다</b>로 짝지어 속뜻을 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">밑줄 문장 (10번)</span><div class=\"en\">Too many scientific papers <mark>fall silently in the woods</mark>.</div><p class=\"ko\">너무 많은 과학 논문이 <mark>소리 없이 숲에서 쓰러진다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>숲에서 쓰러지는 나무 = 2번 질문. 듣는 사람이 없으면 소리가 없다는 게 4번의 답</span></div><div class=\"ck-step\"><span class=\"lab\">2·4번 문장 · 비유의 출발점</span><div class=\"en\">… indeed there can be <mark>no sound without a hearer</mark>.</div><p class=\"ko\">… 정말로 <mark>듣는 사람 없이는 소리가 있을 수 없다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>and similarly(그리고 마찬가지로) 뒤에서 소리 = 신호 = 논문으로 바꿔 말해요</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 비유를 논문에 연결</span><div class=\"en\">… a published scientific paper (signal) is useless unless it is <mark>both received and understood</mark> by its intended audience.</div><p class=\"ko\">… 출판된 과학 논문(신호)은 의도된 독자에 의해 <mark>수신되고 이해되지</mark> 않으면 쓸모가 없다.</p></div><div class=\"ck-via\"><i>▼</i><span>밑줄 바로 앞에서 “발표만 하고 이해 못 받으면 압력파일 뿐”이라고 풀어 줘요</span></div><div class=\"ck-step key\"><span class=\"lab\">9번 문장 · 결정적 단서</span><div class=\"en\">Publication is no more than pressure waves <mark>unless the published paper is understood</mark>.</div><p class=\"ko\"><mark>출판된 논문이 이해되지 않으면</mark> 출판은 단지 압력파에 지나지 않는다.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>fall(쓰러지다)</em>논문이 발표되다</span><span><em>in the woods(숲에서)</em>아무도 제대로 받아 주지 않는 곳에서</span><span><em>silently(소리 없이)</em>독자가 이해하지 못해 아무 반응이 없음</span></div><div class=\"ck-eq\">⇒ 밑줄의 속뜻 = 발표되기는 하지만 독자들이 이해하지 못한다 → ⑤</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">발표되기는 하지만 독자들이 이해하지 못한다<small>fall(쓰러지다) = 발표, silently(소리 없이) = 9번 unless understood(이해되지 않으면)예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">발표되지 않아서 쓸모없어진다</span><span class=\"why\">6번 useless(쓸모없는)만 따온 함정이에요. 나무는 이미 쓰러졌듯 논문도 published(출판된) 상태예요. 문제는 발표가 아니라 이해예요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">선행 연구를 포함하지 못한다</span><span class=\"why\">논문 안에 무엇이 들어 있느냐는 말은 지문에 없어요. 6·9번은 독자가 understood(이해된) 하느냐만 따져요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">결국 완전히 틀렸다고 여겨진다</span><span class=\"why\">논문이 틀렸다는 말은 한 번도 안 나와요. silently(소리 없이)는 틀린 게 아니라 아무도 이해하지 못해 반응이 없다는 뜻이에요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">대중의 요구를 충족하기 위한 소통에 집중한다</span><span class=\"why\">[반대] 5번은 소통이 two-way(양방향)여야 한다는 말이고, 밑줄은 그 소통이 실패한 모습이에요. 소통에 집중한다는 건 정반대예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Most people have no doubt heard this question:</div><div class=\"k\">대부분의 사람들은 틀림없이 이 질문을 들어봤을 것이다.</div></div><div class=\"rnat\">대부분의 사람들은 틀림없이 이 질문을 들어봤을 것이다.</div><div class=\"rst\">과학 시간에 선생님이 유명한 질문 하나를 던졌어요. = 지문 1번, 다들 들어 봤을 질문을 꺼낸다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">2번 · 단서</span><div class=\"rc\"><div class=\"e\">If a tree falls in the forest</div><div class=\"k\">만약 숲에서 나무가 쓰러지고</div></div><div class=\"rc\"><div class=\"e\">and there is no one there to hear it fall,</div><div class=\"k\">그것이 쓰러지는 것을 들을 사람이 거기에 아무도 없다면,</div></div><div class=\"rc\"><div class=\"e\">does it make a sound?</div><div class=\"k\">그것이 소리를 내는 것일까?</div></div><div class=\"rnat\">만약 숲에서 나무가 쓰러지고 그것이 쓰러지는 것을 들을 사람이 거기에 아무도 없다면, 그것이 소리를 내는 것일까?</div><div class=\"rst\">“아무도 없는 숲에서 나무가 쓰러지면 소리가 날까?” = 지문 2번, 들을 사람이 없을 때의 <b>나무 비유</b>예요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc\"><div class=\"e\">The correct answer is no.</div><div class=\"k\">정답은 '아니요'이다.</div></div><div class=\"rnat\">정답은 '아니요'이다.</div><div class=\"rst\">선생님이 말한 정답은 “아니요”였어요. = 지문 3번, 정답이 no(아니요)라는 말이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Sound is more than pressure waves,</div><div class=\"k\">소리는 압력파 이상이며,</div></div><div class=\"rc ckc\"><div class=\"e\">and indeed there can be <span class=\"cw\">no sound without a hearer</span>.</div><div class=\"k\">정말로 <span class=\"cw\">듣는 사람 없이는 소리가 있을 수 없다</span>.</div></div><div class=\"rnat\">소리는 압력파 이상이며, 정말로 듣는 사람 없이는 소리가 있을 수 없다.</div><div class=\"rst\">소리는 공기의 떨림만이 아니라 누가 들어야 비로소 소리가 돼요. = 지문 4번, <b>듣는 사람 없이는 소리가 없다</b>는 말이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">And similarly,</div><div class=\"k\">그리고 마찬가지로,</div></div><div class=\"rc\"><div class=\"e\">scientific communication is a two-way process.</div><div class=\"k\">과학적 소통은 양방향 프로세스이다.</div></div><div class=\"rnat\">그리고 마찬가지로, 과학적 소통은 양방향 프로세스이다.</div><div class=\"rst\">모둠 발표도 똑같아요. 말하는 사람과 듣는 사람이 다 있어야 해요. = 지문 5번, 과학적 소통은 양방향이라는 말이에요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">Just as a signal of any kind is useless unless it is perceived,</div><div class=\"k\">어떤 종류의 신호든 그것이 감지되지 않으면 쓸모가 없는 것처럼,</div></div><div class=\"rc\"><div class=\"e\">a published scientific paper (signal) is useless</div><div class=\"k\">출판된 과학 논문(신호)은 쓸모가 없다</div></div><div class=\"rc\"><div class=\"e\">unless it is both received and understood</div><div class=\"k\">그것이 둘 다 수신 그리고 이해되지 않으면</div></div><div class=\"rc\"><div class=\"e\">by its intended audience.</div><div class=\"k\">의도된 독자에 의해.</div></div><div class=\"rnat\">어떤 종류의 신호든 그것이 감지되지 않으면 쓸모가 없는 것처럼, 출판된 과학 논문(신호)은 그것이 의도된 독자에 의해 수신 '그리고' 이해가 둘 다 되지 않으면 쓸모가 없다.</div><div class=\"rst\">열심히 만든 발표 자료도 친구들이 보고 이해해야 쓸모가 있어요. 지문 6번, 논문은 독자가 <b>받고 이해해야</b> 쓸모 있다는 말이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Thus we can restate the axiom of science as follows:</div><div class=\"k\">따라서 우리는 과학의 자명한 이치를 다음과 같이 다시 진술할 수 있다.</div></div><div class=\"rnat\">따라서 우리는 과학의 자명한 이치를 다음과 같이 다시 진술할 수 있다.</div><div class=\"rst\">그래서 선생님이 과학의 기본 규칙을 다시 정리해 줬어요. = 지문 7번, 자명한 이치를 다시 말한다는 말이에요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">A scientific experiment is not complete</div><div class=\"k\">과학 실험은 완성되지 않는다</div></div><div class=\"rc\"><div class=\"e\">until the results have been published and understood.</div><div class=\"k\">그 결과가 출판되고 그리고 이해될 때까지는.</div></div><div class=\"rnat\">과학 실험은 그 결과가 출판되고 '그리고 이해될' 때까지는 완성되지 않는다.</div><div class=\"rst\">실험은 결과를 발표하고, 친구들이 이해해야 진짜 끝나는 거예요. = 지문 8번, 출판되고 이해될 때까지 실험은 완성되지 않는다는 말이에요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">Publication is no more than pressure waves</div><div class=\"k\">출판은 단지 압력파에 지나지 않는다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">unless the published paper is understood</span>.</div><div class=\"k\"><span class=\"cw\">출판된 논문이 이해되지 않으면</span>.</div></div><div class=\"rnat\">출판된 논문이 이해되지 않으면 출판은 단지 압력파에 지나지 않는다.</div><div class=\"rst\">아무도 못 알아들은 발표는 그냥 공기를 울린 소리일 뿐이에요. 지문 9번, <b>이해되지 않으면</b> 출판은 압력파에 지나지 않는다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"10\"><span class=\"rn\">10번 · 단서</span><div class=\"rc\"><div class=\"e\">Too many scientific papers</div><div class=\"k\">너무 많은 과학 논문이</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">fall silently in the woods</span>.</div><div class=\"k\"><span class=\"cw\">소리 없이 숲에서 쓰러진다</span>.</div></div><div class=\"rnat\">너무 많은 과학 논문이 소리 없이 숲에서 쓰러진다(출판되었지만 독자들은 그것들을 이해하지 못한다).</div><div class=\"rst\"><b>숲에서 소리 없이 쓰러진 나무</b> = 발표는 했는데 아무도 이해 못 한 논문이에요. 그래서 밑줄은 ⑤예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"no doubt\" data-m=\"틀림없이\"><b>no doubt</b>틀림없이</button><button type=\"button\" class=\"wdb\" data-w=\"pressure wave\" data-m=\"압력파\"><b>pressure wave</b>압력파</button><button type=\"button\" class=\"wdb\" data-w=\"perceive\" data-m=\"감지하다\"><b>perceive</b>감지하다</button><button type=\"button\" class=\"wdb\" data-w=\"intended audience\" data-m=\"의도한 독자층\"><b>intended audience</b>의도한 독자층</button><button type=\"button\" class=\"wdb\" data-w=\"restate\" data-m=\"다시 진술하다\"><b>restate</b>다시 진술하다</button><button type=\"button\" class=\"wdb\" data-w=\"no more than\" data-m=\"~에 지나지 않는\"><b>no more than</b>~에 지나지 않는</button></div>"};
document.addEventListener('click',function(e){
 var b=e.target.closest('.stbtn');
 if(b){var box=b.closest('.rdb'),on=!box.classList.contains('story');box.classList.toggle('story',on);
  var L=[].slice.call(box.querySelectorAll('.rds'));L.forEach(function(x){x.classList.remove('lastv');x.style.order='';});
  if(on){L.sort(function(a,c){return (+a.dataset.ord)-(+c.dataset.ord);});L.forEach(function(x,i){x.style.order=i+1;});L[L.length-1].classList.add('lastv');}
  b.textContent=on?'문장별로 보기':'이야기로 이어 읽기';return;}
 var w=e.target.closest('.wdb');
 if(w){var on2=!w.classList.contains('on');w.classList.toggle('on',on2);
  try{if(window.WN){if(on2)WN.add([{w:w.dataset.w,m:w.dataset.m,src:'미니모고',how:'별표',ask:true}]);else if(WN.del)WN.del(w.dataset.w,'미니모고');}}catch(err){}
  var t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s';document.body.appendChild(t);}
  t.textContent=on2?'오답노트장에 담았어요':'오답노트장에서 뺐어요';t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(function(){t.style.opacity='0'},1600);}
});

/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  if(EXP[cq.q]){h+=EXP[cq.q]+'<button class="toq" data-i="'+i+'">빠른 정답으로</button>';return h+'</div></details>';}
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
  mmInit();
}
/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(S.sub&&!S.mmS){S.mmS=1;S.mmP=1;save();WN.hw(lv,day,S.sub.s+'/'+N+(S.mmD?' ✓':''));}else if(!S.sub&&!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
