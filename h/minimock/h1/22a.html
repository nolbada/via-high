<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});

function noteList(){
  const out=[],ck=S.checks[WS.id]||{};
  WS.words.forEach((w,i)=>{
    const c=ck[i];if(!c)return;
    const parts=['m','s','a'].filter(p=>c[p]&&(p==='m'||w[p]));
    if(parts.length)out.push({i:i,w:w,parts:parts});
  });
  return out;
}

  else if(view==='exp')renderExp();

}

>4</sup> instinct<sup>5</sup>\u0002, / \u0001not intelligence\u0002.", "pk": "\u0001어떤 동물이 인지적 과제에서 우리를 이길 수 있으면\u0002 / \u0001예컨대 어떤 새 종들이 수천 개 씨앗의 정확한 위치를 기억할 수 있는 것처럼\u0002 / 사람들은 그것을 본능으로 치부해 버린다 / \u0001지능이 아니라\u0002", "core": "사람들은 그것을 치부해 버린다.", "tags": ["If ~ = 접속사절(부사절, 조건): 주절을 꾸밈", "like how ~ = 대시 사이 삽입(예시): 앞 if절 내용을 구체화함", "주어 they, 동사 <b>write off</b>(타동사+부사 불변화사), 목적어 it. (as instinct) = 전치사구(부사구): write off 꾸밈. write A off as B = 3형식+as 전치사구 [기준: 모양 규칙]", "not intelligence = 대조 어구(삽입): as instinct와 대비됨 [기준: 대조 삽입 수식어로 봄]"], "steps": [{"t": "이 문장은 <b>조건 if절 + S+V+O(3형식)</b>이다. 중간에 대시(-) 삽입이 있어 길어 보인다."}, {"t": "뼈대(주절)부터 찾는다.", "sub": ["S: they (뜻으로는 '사람들')", "V: write off (write A off as B, A를 B로 치부하다)", "O: it (동물이 우리를 이기는 일)", "뼈대 = <b>they write it off</b>", "판정 기준: write A off as B는 3형식 + as 전치사구"]}, {"t": "<b>as instinct, not intelligence</b>는 '본능이라고, 지능이 아니라'이다 (instinct 본능, intelligence 지능). not intelligence는 대조를 나타내는 덧붙임이다."}, {"t": "맨 앞 <b>If</b>절은 조건 부사절이다.", "sub": ["S: an animal (동물) / V: can beat (이길 수 있다) / O: us (우리)", "at a cognitive task = 인지적 과제에서 (cognitive 인지적인, task 과제)"]}, {"t": "대시 사이 <b>like how ~ seeds</b>는 예시이다 ('~하는 것처럼').", "sub": ["S: certain bird species (특정 새 종들. species 종) / V: can remember (기억할 수 있다)", "O: the precise locations of thousands of seeds (수천 개 씨앗의 정확한 위치. precise 정확한, location 위치, seed 씨앗)"]}], "sum": "동물이 과제에서 우리를 이기면, 사람들은 지능이 아닌 본능으로 치부"}, {"i": "06", "q": "05", "s": "1", "title": "S+V+O + 동명사 전치사구 + 관계절(that 생략)", "eng": "Advertisers often displayed<sup>1</sup> considerable<sup>2</sup> facility<sup>3</sup> / in adapting their claims to the market status<sup>4</sup> of the goods they promoted<sup>5</sup>.", "notes": [["1", "display", "보여 주다"], ["2", "considerable", "상당한"], ["3", "facility", "재능, 능력"], ["4", "market status", "시장 지위"], ["5", "promote", "홍보하다"]], "lit": "광고주들은 종종 상당한 능력을 보여 주었다 / 자신들이 홍보하는 상품의 시장 지위에 자기 주장을 맞추는 데 있어", "nat": "광고주들은 자기가 홍보하는 상품의 시장 내 위치에 맞춰 주장을 조정하는 데 상당한 재주를 보이곤 했다.", "ana": "<b>facility in v-ing</b>는 '~하는 데 있어서의 재능'이라는 뜻으로, facility를 '시설'로 읽으면 문장이 무너진다. <b>the goods they promoted</b>에서 goods와 they 사이에는 목적격 관계대명사가 생략되어 있는데, 수식이 짧으므로 끊지 않고 한 덩어리로 읽는다.", "pe": "Advertisers \u0001often\u0002 displayed<sup>1</sup> \u0001considerable<sup>2</sup>\u0002 facility<sup>3</sup> / \u0001in adapting their claims to the market status<sup>4</sup> of the goods they promoted<sup>5</sup>\u0002.", "pk": "광고주들은 \u0001종종\u0002 \u0001상당한\u0002 능력을 보여 주었다 / \u0001자신들이 홍보하는 상품의 시장 지위에 자기 주장을 맞추는 데 있어\u0002", "core": "광고주들은 능력을 보여 주었다.", "tags": ["<b>3형식</b> 주어 Advertisers + 동사 displayed + 목적어 facility. often = 부사: displayed를 꾸밈. considerable = 형용사: facility를 꾸밈. facility = 재주(시설 아님)", "in adapting ~ = 전치사+동명사구(형용사구): facility를 꾸밈. goods와 they 사이에 목적격 관계대명사 생략"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이다. 뒤에 in v-ing 덩어리와 생략된 관계절이 붙어 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: Advertisers (광고주들)", "V: displayed (display 보여 주다의 과거형)", "O: considerable facility (상당한 재주. considerable 상당한, facility 재주, 능숙함)", "뼈대 = <b>Advertisers often displayed considerable facility</b> (often 종종, displayed를 꾸미는 부사)"]}, {"t": "<b>in adapting their claims to the market status of the goods</b>는 facility를 꾸민다 (~하는 데 있어서의).", "sub": ["전치사 in 뒤의 adapting은 동명사 (adapt A to B, A를 B에 맞추다)", "their claims = 광고주들의 주장 (claim 주장)", "the market status of the goods = 상품의 시장 지위 (status 지위, goods 상품)"]}, {"t": "<b>(that) they promoted</b>는 목적격 관계대명사 that이 생략된 관계절이다. the goods를 꾸민다 (promote 홍보하다의 과거형).", "sub": ["they = Advertisers"]}, {"t": "함정: 여기서 facility는 '시설'이 아니라 '재주'이다."}], "sum": "광고주들, 상품의 시장 위치에 맞춰 주장을 조정하는 재주를 자주 발휘"}, {"i": "07", "q": "05", "s": "5", "title": "분사구문 (being 생략) + S+V+O", "eng": "No longer the \"Soul of Bread,\" / the Thompson agency<sup>1</sup> first turned yeast<sup>2</sup> into an important source<sup>3</sup> of vitamins / with significant<sup>4</sup> health benefits.", "notes": [["1", "agency", "대행사"], ["2", "yeast", "효모"], ["3", "source", "공급원"], ["4", "significant", "상당한"]], "lit": "더 이상 '빵의 영혼'이 아니게 되어 / Thompson 대행사는 우선 효모를 중요한 비타민 공급원으로 바꾸었다 / 상당한 건강상의 이점을 지닌", "nat": "더 이상 '빵의 영혼'이 아니게 된 효모를, Thompson 대행사는 우선 건강에 큰 도움이 되는 중요한 비타민 공급원으로 바꾸어 놓았다.", "ana": "문장 맨 앞의 <b>No longer the \"Soul of Bread,\"</b>는 being이 생략된 분사구문에서 부정어가 앞으로 나온 형태로, 뒤에 완전한 문장이 이어진다. 주어는 the Thompson agency이고 동사는 <b>turned</b>이다. <b>turn A into B</b>는 'A를 B로 바꾸다'이다.", "pe": "\u0001No longer the \"Soul of Bread,\"\u0002 / the Thompson agency<sup>1</sup> \u0001first\u0002 turned yeast<sup>2</sup> \u0001into an important source<sup>3</sup> of vitamins\u0002 / \u0001with significant<sup>4</sup> health benefits\u0002.", "pk": "더 이상 '빵의 영혼'이 아니게 되어 / Thompson 대행사는 \u0001우선\u0002 효모를 \u0001중요한 비타민 공급원으로\u0002 바꾸었다 / \u0001상당한 건강상의 이점을 지닌\u0002", "core": "Thompson 대행사는 효모를 바꾸었다.", "tags": ["No longer ~ = 분사구문(being 생략, 부사적): 주절을 꾸밈", "<b>3형식</b> 주어 the Thompson agency + 동사 turned + 목적어 yeast. first = 부사: turned 꾸밈. into ~ = 거의 필수에 가까운 부사구(turn A into B) [기준: 모양 규칙]", "with ~ = 전치사구(형용사구): source of vitamins를 꾸밈"], "steps": [{"t": "이 문장은 <b>분사구문 + S+V+O(3형식)</b>이다. 맨 앞 덩어리는 동사가 없다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: the Thompson agency (Thompson 대행사. agency 대행사)", "V: turned (turn 바꾸다의 과거형)", "O: yeast (효모)", "뼈대 = <b>the Thompson agency turned yeast</b> (first 우선, turned를 꾸미는 부사)"]}, {"t": "<b>into an important source of vitamins</b>는 turn A into B (A를 B로 바꾸다)의 into 전치사구이다.", "sub": ["판정 기준: 거의 필수에 가까운 부사구로 보되 뼈대에는 넣지 않음", "source 공급원, vitamin 비타민"]}, {"t": "<b>with significant health benefits</b>는 '상당한 건강상의 이점을 지닌'이라는 전치사구로 a source of vitamins를 꾸민다 (significant 상당한, benefit 이점)."}, {"t": "맨 앞 <b>No longer the 'Soul of Bread,'</b>는 Being이 생략된 분사구문이다 ('더 이상 빵의 영혼이 아니게 되어').", "sub": ["no longer = 더 이상 ~ 아닌", "soul 영혼, bread 빵", "문법상 의미상 주어는 주절 주어 the Thompson agency이고 직독 해석도 그렇게 읽는다. 그러나 뜻으로는 '빵의 영혼'이었던 것이 yeast(효모)여서 자연스러운 해석은 효모에 걸어 해석한다 (기준이 갈리는 곳)"]}], "sum": "더 이상 빵의 영혼이 아닌 효모, 대행사가 비타민 공급원으로 재포장"}, {"i": "08", "q": "06", "s": "6", "title": "when절 + 관계절 + can't help v-ing", "eng": "When people pursue<sup>1</sup> goods<sup>2</sup> that are positional<sup>3</sup>, / they can't help being in the rat race<sup>4</sup>.", "notes": [["1", "pursue", "추구하다"], ["2", "goods", "재화, 상품"], ["3", "positional", "상대적 위치와 관련된"], ["4", "rat race", "치열한 경쟁"]], "lit": "사람들이 상대적 위치와 관련된 재화를 추구할 때 / 그들은 치열한 경쟁 속에 있을 수밖에 없다", "nat": "사람들이 남과의 상대적 위치로 값이 매겨지는 재화를 좇을 때는, 치열한 경쟁판에 들어가지 않을 수 없다.", "ana": "<b>that</b>은 goods를 수식하는 주격 관계대명사이다. <b>can't help v-ing</b>는 '~하지 않을 수 없다'는 관용 표현으로, help를 '돕다'로 읽으면 뜻이 정반대가 된다.", "pe": "\u0001When people pursue<sup>1</sup> goods<sup>2</sup> that are positional<sup>3</sup>\u0002, / they can't help being \u0001in the rat race<sup>4</sup>\u0002.", "pk": "\u0001사람들이 상대적 위치와 관련된 재화를 추구할 때\u0002 / 그들은 \u0001치열한 경쟁 속에\u0002 있을 수밖에 없다", "core": "그들은 있을 수밖에 없다.", "tags": ["When ~ = 접속사절(부사절, 시간): 주절을 꾸밈. 안의 that are positional은 goods를 꾸미는 관계절", "<b>can't help v-ing</b> = ~하지 않을 수 없다(help를 '돕다'로 읽으면 안 됨). 동명사 being이 목적어. in the rat race = 거의 필수에 가까운 부사구(be + 장소): being을 꾸밈 [기준: 모양 규칙]"], "steps": [{"t": "이 문장은 <b>when 시간절 + S+V+O(3형식)</b>이다. 주절의 can't help v-ing가 핵심이다."}, {"t": "뼈대(주절)부터 찾는다.", "sub": ["S: they (= people, 사람들)", "V: can't help (can not help v-ing, ~하지 않을 수 없다)", "O: being in the rat race (치열한 경쟁 속에 있는 것. 동명사)", "뼈대 = <b>they can't help being in the rat race</b>"]}, {"t": "<b>in the rat race</b>는 '치열한 경쟁 속에'라는 전치사구이다 (rat race 치열한 경쟁). being을 꾸민다."}, {"t": "맨 앞 <b>When people pursue goods</b>는 시간 부사절(~할 때)이다.", "sub": ["S: people / V: pursue (추구하다) / O: goods (재화)"]}, {"t": "<b>that are positional</b>은 관계절(형용사절)이다. goods를 꾸민다 (positional 상대적 위치와 관련된).", "sub": ["함정: can't help의 help는 '돕다'가 아니라 '~하지 않을 수 없다'의 뜻이다."]}], "sum": "상대적 위치를 좇는 재화를 추구하면 치열한 경쟁에 빠질 수밖에 없음"}], "qs": [{"q": "01", "type": "필자 주장", "src": "2016년 9월 20번", "ans": "①", "tr": [["1", "아이들은 대부분 본보기를 보고 배운다."], ["2", "아이들은 부모와 손위 형제자매를 본떠 자기 행동을 만들어 간다."], ["3", "당신의 아이가 나쁜 식습관을 가지고 있다면, 애초에 그것이 어떻게 생긴 일인지 스스로에게 물어보라."], ["4", "당신부터 형편없이 먹고, 건강을 소홀히 하고, 아이들 앞에서 담배를 피우고 술을 마신다면, 아이들이 똑같은 길을 간다 해도 놀랄 일이 아니다."], ["5", "그러니 좋은 본보기가 되어, 집에서든 가족이 다 함께 외식할 때든 건강하게 먹을 수 있는 판을 깔아 주어라."], ["6", "당신의 행동은 당신의 말보다 더 크게 말한다."], ["7", "무엇이 자기에게 좋은지를 아이들이 스스로 알아내리라 기대하지 마라."]], "evh": "5·6번 문장", "ev": [{"en": true, "h": "So be a good role model and set the stage for healthy eating at home and when you eat out as a family. Your actions speak louder than your words."}, {"en": false, "h": "명령문 <b>be a good role model</b>이 이 글에서 필자가 독자에게 직접 시키는 유일한 행동이고, 바로 다음 문장에서 '행동이 말보다 크게 말한다'며 그 이유를 못 박는다. 주장 문항은 명령문 자리를 먼저 찾는 것이 가장 빠르다."}], "opts": [{"n": "①", "t": "자녀의 건강한 식습관 형성을 위해 모범을 보여라.", "a": true, "x": false, "trap": false, "e": "be a good role model(좋은 본보기가 되어라)과 healthy eating(건강한 식사)이 그대로 겹치는 유일한 선택지이다."}, {"n": "②", "t": "가족이 함께 식사할 수 있는 시간을 확보하라.", "a": false, "x": true, "trap": true, "e": "as a family가 나오지만 '함께 외식할 때도'라는 상황 설명일 뿐, 식사 시간을 확보하라는 말은 없다."}, {"n": "③", "t": "비만을 예방하기 위해 채소 섭취를 늘려라.", "a": false, "x": true, "trap": false, "e": "비만(obesity)도 채소도 지문에 전혀 등장하지 않는다."}, {"n": "④", "t": "건강을 해치는 무리한 다이어트를 피하라.", "a": false, "x": true, "trap": false, "e": "poor diet는 '무리한 다이어트'가 아니라 '형편없는 식사'라는 뜻이다."}, {"n": "⑤", "t": "자녀의 체질을 고려하여 식단을 짜라.", "a": false, "x": true, "trap": false, "e": "체질이나 식단 구성에 관한 언급은 없다."}], "w": [["by example", "본보기로"], ["model A after B", "B를 본떠 A를 만들다"], ["sibling", "형제자매"], ["in the first place", "애초에"], ["neglect", "소홀히 하다"], ["go down the same road", "같은 길을 가다"], ["set the stage for", "~의 발판을 마련하다"], ["eat out", "외식하다"], ["for oneself", "스스로"]]}, {"q": "02", "type": "심경 변화", "src": "2015년 9월 23번", "ans": "①", "tr": [["1", "형과 누나들이 선물을 뜯는 모습을 이미 봐 둔 터라, 큰 선물이 꼭 제일 좋은 선물은 아니라는 걸 나는 이미 알고 있었다."], ["2", "나와 동갑인 한 여자아이는 역사 인물이 담긴 커다란 색칠 공부책을 받았고, 반면에 욕심을 덜 부려 더 작은 상자를 고른 여자아이는 예쁜 머리핀을 받았다."], ["3", "내 차례가 가까워지자, 내 심장은 기대감에 더 빨리 뛰었다."], ["4", "자루 안을 들여다보면서 나는 남은 선물들을 재빨리 만져 보았고, 무게를 재 보며 그 안에 무엇이 들었을까 상상했다."], ["5", "나는 반짝이는 은박지와 빨간 리본으로 포장된, 작지만 묵직한 것을 골랐다."], ["6", "그것은 건전지 한 팩이었고, 내가   });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
/* ---- 답 제출 ---- */
function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});try{var _m=String(FILE).match(/^(\d\d)([ab])$/);if(_m&&window.WN)WN.hw('미니모고 '+(GCODE==='h2'?'고2':'고1'),(+_m[1])*2-(_m[2]==='a'?1:0),s+'/'+N);}catch(e){}
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}
/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
  mmInit();
}
/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
