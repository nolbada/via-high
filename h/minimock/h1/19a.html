<title>고1 미니모의고사 19회 01–06번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:0}
#app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
#app>.wrap{width:100%}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}
.ko{color:var(--sub);font-size:14px;margin-left:6px}
.cell.bad{background:var(--badbg);border-color:var(--bad)}
.cell.bad .tag{background:var(--bad)}
.locked .cell{pointer-events:none}
.bar{position:sticky;margin-top:auto;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.done .opt{pointer-events:none}
.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}
.hcard .chip{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--sub)}
.hcard .chip.ok{background:var(--goodbg);color:var(--good)}
.hcard .chip.warn{background:var(--badbg);color:var(--bad)}
.hcard[disabled]{opacity:.55}
details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.th .hd{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:6px}
.th ol{list-style:none;margin:0;padding:0;counter-reset:n}
.th li{counter-increment:n;position:relative;padding:7px 0 7px 30px;font-size:15px;line-height:1.7;border-top:1px dashed #cfdcf0}
.th li:first-child{border-top:0}
.th li:before{content:counter(n);position:absolute;left:0;top:9px;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;text-align:center;line-height:21px}
.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.th .sub{margin:3px 0 0;color:#444;font-size:14.5px;line-height:1.7}
.sc .lay.sum{border-left:4px solid #2e7d32;background:#f1f8f1}
/* ---- 새 직독직해·해설 화면 ---- */
.sc{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden;background:var(--bg)}
.sc-h{padding:11px 14px 10px;background:#eef2f8;border-bottom:1px solid var(--line)}
.sc-h .no2{display:inline-block;min-width:26px;height:26px;line-height:26px;border-radius:13px;background:var(--accent);color:#fff;font-weight:800;font-size:13px;text-align:center;padding:0 7px;margin-right:8px}
.sc-h .at{font-size:13px;color:var(--sub)}
.sc-h .tt{display:block;margin-top:7px;font-size:15.5px;font-weight:800;color:var(--accent);line-height:1.45}
.sc-b{padding:10px 12px 12px}
.sc .ch{margin-bottom:6px}
.sc .ce{font-size:17px}
.sc .ce sup,.nt sup{font-size:10px;font-weight:800;color:#b8651f;margin-left:1px}
.nts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.nt{font-size:13.5px;line-height:1.5;background:#fbf6ee;border:1px solid #f0e2cd;border-radius:8px;padding:5px 9px;color:#4a3a22}

.sc .lay{border-radius:10px}

.sc .lb{margin-bottom:4px}
.qc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}
.qchip small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-bottom:1px}
.qchip.o{border-color:var(--good);background:var(--goodbg)}
.qchip.x{border-color:var(--bad);background:var(--badbg)}
.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.trs{list-style:none;margin:0;padding:0;background:var(--soft);border-radius:10px;padding:8px 12px}

.evx{background:var(--goodbg);border:1px solid #bfe0cd;border-radius:10px;padding:10px 12px}

.opx{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px;background:var(--bg)}

.wds{display:flex;flex-wrap:wrap;gap:6px}

.wds b{margin-right:5px}
.toq{display:block;width:100%;margin-top:14px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}
details.sub2{margin:12px 0 0}
details.sub2>summary{list-style:none;cursor:pointer;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px;padding:6px 0}

.cr{color:#A3102E;font-weight:700}
.sc .lay.core{border-left:4px solid #2e7d32;background:#f1f8f1}
.ct{display:none;margin:7px 0 2px;padding:6px 9px;border-left:3px solid #d9a21b;background:#fff8e6;border-radius:6px;font-size:13.5px;line-height:1.55;color:#4d3b05}

.rst{margin-top:8px;background:#fff8e1;border:1px solid #efe3b8;border-left:4px solid #d9a21b;border-radius:8px;padding:8px 10px;font-size:15px;line-height:1.7;word-break:keep-all}

function esc(x){return String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function shuffle(arr,seed){const a=arr.slice();let s=hash(seed)||1;for(let i=a.length-1;i>0;i--){s=Math.imul(s^(s>>>15),2246822519)>>>0;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}

span class=\"why\">[범위 좁음] 5·6번의 이사·가족 사정은 시간이 더 필요한 이유일 뿐이에요. 7번 부탁을 위한 배경이지 편지의 목적이 아니에요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">직장을 소개해 준 것에 대해 감사하려고</span><span class=\"why\">[범위 좁음] 3번 grateful(감사하는)은 앞부분 인사예요. 4번 However(하지만) 뒤에 진짜 용건이 따로 나와요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">취업을 위한 기본 자격 조건을 문의하려고</span><span class=\"why\">[지문에 없음] 자격 조건을 묻는 말은 없어요. 7번에서 묻는 건 ‘일주일을 더 줄 수 있는지’예요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">어려운 업무를 맡아달라는 부탁을 거절하려고</span><span class=\"why\">[반대] 거절이 아니라 3번에서 제안을 받아들이는 것을 적극적으로 고려 중이라고 해요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Dear Ms. Franklin,</div><div class=\"k\">친애하는 Franklin 씨,</div></div><div class=\"rnat\">친애하는 Franklin 씨,</div><div class=\"rst\">친구가 “주말 캠프 같이 갈래?” 하고 제안한 장면을 떠올려 봐요. 지문도 프랭클린(Franklin) 씨에게 쓰는 편지로 시작해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">I am writing</div><div class=\"k\">저는 편지를 씁니다</div></div><div class=\"rc\"><div class=\"e\">regarding your company’s job offer.</div><div class=\"k\">귀하의 회사의 일자리 제안과 관련하여.</div></div><div class=\"rnat\">저는 귀하의 회사의 일자리 제안과 관련하여 편지를 씁니다.</div><div class=\"rst\">“캠프 얘기 때문에 연락했어.” 하고 말을 꺼내듯, 지문도 <b>일자리 제안</b>(job offer)에 관해 쓴다고 밝혀요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">I am very grateful for this opportunity</div><div class=\"k\">저는 이 기회에 대해 매우 감사드리며</div></div><div class=\"rc\"><div class=\"e\">and am strongly considering accepting it.</div><div class=\"k\">그것(= 일자리 제안)을 받아들이는 것을 적극적으로 고려하고 있습니다.</div></div><div class=\"rnat\">저는 이 기회에 대해 매우 감사드리며 그것(일자리 제안)을 받아들이는 것을 적극적으로 고려하고 있습니다.</div><div class=\"rst\">“불러 줘서 진짜 고마워, 꼭 가고 싶어!” 지문도 기회에 감사하며 제안을 받아들이는 걸 적극 고려 중이라고 해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">However</span>,</div><div class=\"k\"><span class=\"cw\">하지만</span></div></div><div class=\"rc\"><div class=\"e\">I have concerns</div><div class=\"k\">저는 걱정이 있습니다</div></div><div class=\"rc\"><div class=\"e\">regarding your request for an answer by December 1, 2015.</div><div class=\"k\">2015년 12월 1일까지 답변을 원하는 귀하의 요청에 대해서.</div></div><div class=\"rnat\">하지만 저는 2015년 12월 1일까지 답변을 원하는 귀하의 요청에 대해서 걱정이 있습니다.</div><div class=\"rst\"><b>하지만</b>(However) 친구가 “내일까지 답 줘!” 해서 걱정이에요. 지문도 12월 1일까지 답해 달라는 요청이 걱정이라고 해요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">As you know,</div><div class=\"k\">아시는 바와 같이,</div></div><div class=\"rc\"><div class=\"e\">accepting this offer would require</div><div class=\"k\">이 제안을 받아들이는 것은 필요로 합니다</div></div><div class=\"rc\"><div class=\"e\">moving my family across several states.</div><div class=\"k\">저의 가족이 몇 개의 주를 건너 이주하는 것을.</div></div><div class=\"rnat\">아시는 바와 같이, 이 제안을 받아들이는 것은 저의 가족이 몇 개의 주를 건너 이주하는 것을 필요로 합니다.</div><div class=\"rst\">캠프에 가려면 가족 일정도 다 바꿔야 해요. 지문도 제안을 받으면 가족이 몇 개 주를 건너 이사해야 한다고 해요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">I have a child in elementary school</div><div class=\"k\">저는 초등학교에 다니는 아이가 있고</div></div><div class=\"rc\"><div class=\"e\">and my wife needs to care for her mother</div><div class=\"k\">저의 아내는 그녀(= 아내)의 어머니를 돌볼 필요가 있습니다</div></div><div class=\"rc\"><div class=\"e\">who lives here.</div><div class=\"k\">이곳에 거주하시는.</div></div><div class=\"rnat\">저는 초등학교에 다니는 아이가 있고 저의 아내는 이곳에 거주하시는 그녀의 어머니를 돌볼 필요가 있습니다.</div><div class=\"rst\">동생도 챙겨야 하고 할머니 일도 있어요. 지문도 초등학생 아이와 장모님을 돌봐야 하는 아내 이야기를 해요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">As a result,</div><div class=\"k\">그 결과,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">I would like to ask</span></div><div class=\"k\"><span class=\"cw\">저는 묻고 싶습니다</span></div></div><div class=\"rc ckc\"><div class=\"e\">if you might consider <span class=\"cw\">giving an additional week</span></div><div class=\"k\">귀하가 <span class=\"cw\">추가적인 일주일을 주는 것을</span> 고려해 주실 수 있는지</div></div><div class=\"rc\"><div class=\"e\">to consider your offer.</div><div class=\"k\">귀하의 제안을 고려할.</div></div><div class=\"rnat\">그 결과, 저는 귀하가 (저에게) 귀하의 제안을 고려할 추가적인 일주일(일주일의 추가적인 시간)을 주는 것을 고려해 주실 수 있는지 묻고 싶습니다.</div><div class=\"rst\">그래서 “일주일만 더 생각해 봐도 될까?” 하고 물어요. 지문의 <b>추가적인 일주일</b>(an additional week) 부탁이 바로 목적이에요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">Please let me know</div><div class=\"k\">저에게 알려주시기 바랍니다</div></div><div class=\"rc ckc\"><div class=\"e\">if <span class=\"cw\">this extension</span> can be made.</div><div class=\"k\"><span class=\"cw\">이러한 (시간) 연장이</span> 만들어질 수 있는지(가능한지).</div></div><div class=\"rnat\">이러한 (시간) 연장이 만들어질 수 있는지(가능한지) 저에게 알려주시기 바랍니다.</div><div class=\"rst\">“그렇게 해도 되는지 알려 줘.” 지문도 이런 <b>연장</b>(extension)이 가능한지 알려 달라고 다시 확인해요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">Thank you.</div><div class=\"k\">감사합니다.</div></div><div class=\"rnat\">감사합니다.</div><div class=\"rst\">“고마워!” 하고 인사하듯, 지문도 감사 인사로 부탁을 마무리해요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">Sincerely,</div><div class=\"k\">진심을 담아,</div></div><div class=\"rc\"><div class=\"e\">Bradley Markle</div><div class=\"k\">Bradley Markle (드림)</div></div><div class=\"rnat\">진심을 담아, Bradley Markle (드림)</div><div class=\"rst\">메시지 끝에 내 이름을 쓰듯, 지문도 보낸 사람 브래들리 마클(Bradley Markle)의 이름으로 끝나요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"regarding\" data-m=\"~에 관하여\"><b>regarding</b>~에 관하여</button><button type=\"button\" class=\"wdb\" data-w=\"job offer\" data-m=\"일자리 제안\"><b>job offer</b>일자리 제안</button><button type=\"button\" class=\"wdb\" data-w=\"grateful\" data-m=\"감사하는\"><b>grateful</b>감사하는</button><button type=\"button\" class=\"wdb\" data-w=\"concern\" data-m=\"우려, 걱정\"><b>concern</b>우려, 걱정</button><button type=\"button\" class=\"wdb\" data-w=\"additional\" data-m=\"추가의\"><b>additional</b>추가의</button><button type=\"button\" class=\"wdb\" data-w=\"extension\" data-m=\"연장\"><b>extension</b>연장</button></div>", "02": "<p class=\"mtr\">마더텅 정답률 <b>90%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">불일치 문제는 선택지를 <b>지문 순서대로</b> 하나씩 대조하세요. 한 문장에 <b>학교 이름이 두 개</b> 나오면, 선택지가 <b>‘졸업한 곳’과 ‘일한 곳’을 바꿔치기</b>했는지 확인해요.</p><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>① ↔ 1번</em>an American father and a Danish mother(미국인 아버지와 덴마크인 어머니) → 같음</span><span><em>② ↔ 2번</em>published five books(다섯 권의 책을 출판했다) → 같음</span><span><em>④ ↔ 5번</em>jazz pianist(재즈 피아노 연주자), a Grammy Award(그래미상) → 같음</span><span><em>⑤ ↔ 6번</em>2005년, 69세의 나이에(at the age of 69) 사망 → 같음</span></div><div class=\"ck-eq\">⇒ 네 개는 지문과 그대로 같아요. 남은 ③을 4번과 대조해요</div></div><div class=\"ck-via\"><i>▼</i><span>③의 ‘졸업’을 4번 graduated from(~를 졸업했다)에서 찾아요</span></div><div class=\"ck-step key\"><span class=\"lab\">4번 문장 앞부분 · 결정적 단서</span><div class=\"en\">Conroy <mark>graduated from Haverford College</mark> …</div><p class=\"ko\">Conroy는 <mark>Haverford College를 졸업했고</mark> …</p></div><div class=\"ck-via\"><i>▼</i><span>아이오와 대학은 졸업한 곳이 아니라 책임자로 일한 곳이에요</span></div><div class=\"ck-step\"><span class=\"lab\">4번 문장 뒷부분 · 아이오와 대학은 일한 곳</span><div class=\"en\">… and <mark>was the director</mark> of the influential Iowa Writers’ Workshop at the University of Iowa …</div><p class=\"ko\">… Iowa 대학에서 영향력 있는 Iowa 작가 워크숍의 <mark>책임자였다</mark> …</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">University of Iowa를 졸업하였다.<small>4번: 졸업은 하버포드 칼리지(Haverford College), 아이오와 대학은 책임자로 일한 곳이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">2005년 69세의 나이로 사망했다.</span><span class=\"why\">4번의 ‘1987년부터 2005년까지’를 보고 헷갈리기 쉽지만, 6번 ‘2005년 4월 6일에(on April 6, 2005)’, ‘69세의 나이에(at the age of 69)’와 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">미국인 아버지와 덴마크인 어머니 사이에서 태어났다.</span><span class=\"why\">1번 to an American father and a Danish mother(미국인 아버지와 덴마크인 어머니 사이에서)와 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">5권의 책을 출판하였다.</span><span class=\"why\">2번 published five books(다섯 권의 책을 출판했다)와 같아요. five(다섯) = 5예요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">재즈 피아노 연주자로 Grammy상을 수상하였다.</span><span class=\"why\">5번 an accomplished jazz pianist(뛰어난 재즈 피아노 연주자), winning a Grammy Award(그래미상을 수상했다)와 같아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Frank Conroy was an American author</div><div class=\"k\">Frank Conroy는 미국인 작가였다</div></div><div class=\"rc\"><div class=\"e\">born in New York, New York</div><div class=\"k\">뉴욕주 뉴욕시에서 태어난</div></div><div class=\"rc\"><div class=\"e\">to an American father and a Danish mother.</div><div class=\"k\">미국인 아버지와 덴마크인 어머니 사이에서.</div></div><div class=\"rnat\">프랭크 콘로이는 미국인 아버지와 덴마크인 어머니 사이에서 뉴욕주 뉴욕시에서 태어난 미국인 작가였다.</div><div class=\"rst\">국어 시간에 작가 소개 카드를 만든다고 해 봐요. 첫 칸: 뉴욕 출생, <b>미국인 아빠·덴마크인 엄마</b>. 지문 1번 = 선택지 ①이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">He published five books,</div><div class=\"k\">그는 다섯 권의 책을 출판했다,</div></div><div class=\"rc\"><div class=\"e\">including the highly acclaimed memoir Stop-Time.</div><div class=\"k\">매우 극찬을 받은 회고록 Stop-Time을 포함하여.</div></div><div class=\"rnat\">그는 매우 극찬을 받은 회고록 『Stop-Time』을 포함하여 다섯 권의 책을 출판하였다.</div><div class=\"rst\">둘째 칸: 책을 <b>다섯 권</b> 냄, 그중 회고록 『스톱타임(Stop-Time)』이 극찬을 받음. 지문 2번 = 선택지 ②예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Published in 1967,</div><div class=\"k\">1967년에 출간되어,</div></div><div class=\"rc\"><div class=\"e\">this ultimately made Conroy a noted figure</div><div class=\"k\">이것(= 그 회고록)은 궁극적으로 Conroy를 주목 받는 인물로 만들었다</div></div><div class=\"rc\"><div class=\"e\">in the literary world.</div><div class=\"k\">문학계에서.</div></div><div class=\"rnat\">1967년에 출간되어, 이것(책)은 궁극적으로 Conroy를 문학계에서 주목 받는 인물로 만들었다.</div><div class=\"rst\">셋째 칸: 1967년에 나온 그 책 덕분에 문학계에서 유명해짐. 지문 3번의 this(이것)는 그 회고록이에요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">Conroy <span class=\"cw\">graduated from Haverford College</span></div><div class=\"k\">Conroy는 <span class=\"cw\">Haverford College를 졸업했고</span></div></div><div class=\"rc ckc\"><div class=\"e\">and <span class=\"cw\">was the director</span> of the influential Iowa Writers’ Workshop</div><div class=\"k\">영향력 있는 Iowa 작가 워크숍의 <span class=\"cw\">책임자였다</span></div></div><div class=\"rc\"><div class=\"e\">at the University of Iowa</div><div class=\"k\">Iowa 대학에서</div></div><div class=\"rc\"><div class=\"e\">for 18 years, from 1987 until 2005.</div><div class=\"k\">18년 동안, 1987년부터 2005년까지.</div></div><div class=\"rnat\">Conroy는 Haverford College(하버포드 컬리지)를 졸업했고, 1987년부터 2005년까지 18년 동안 Iowa 대학에서 영향력 있는 Iowa 작가 워크숍의 책임자였다.</div><div class=\"rst\">넷째 칸이 핵심! <b>졸업은 하버포드 칼리지</b>, 아이오와 대학에선 <b>책임자로 18년 일함</b>. 그래서 지문 4번과 ③이 어긋나요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">In addition to writing,</div><div class=\"k\">글쓰기뿐만 아니라,</div></div><div class=\"rc\"><div class=\"e\">Conroy was an accomplished jazz pianist,</div><div class=\"k\">Conroy는 뛰어난 재즈 피아노 연주자였는데,</div></div><div class=\"rc\"><div class=\"e\">winning a Grammy Award in 1986.</div><div class=\"k\">1986년에 Grammy상을 수상했다.</div></div><div class=\"rnat\">글쓰기 외에도, 콘로이는 뛰어난 재즈 피아니스트이기도 했는데, 1986년에는 그래미상을 수상했다.</div><div class=\"rst\">다섯째 칸: 글뿐 아니라 <b>재즈 피아노</b>도 잘 쳐서 1986년 그래미상을 받음. 지문 5번 = 선택지 ④예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Conroy died of colon cancer</div><div class=\"k\">Conroy는 대장암으로 사망했다</div></div><div class=\"rc\"><div class=\"e\">on April 6, 2005,</div><div class=\"k\">2005년 4월 6일에,</div></div><div class=\"rc\"><div class=\"e\">in Iowa City, Iowa,</div><div class=\"k\">Iowa주 Iowa City에서,</div></div><div class=\"rc\"><div class=\"e\">at the age of 69.</div><div class=\"k\">69세의 나이에.</div></div><div class=\"rnat\">콘로이는 2005년 4월 6일 아이오와주 아이오와시티에서 69세의 나이로 대장암으로 세상을 떠났다.</div><div class=\"rst\">여섯째 칸: 2005년 4월 6일, <b>69세</b>에 아이오와시티에서 세상을 떠남. 지문 6번 = 선택지 ⑤예요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">The Frank Conroy Reading Room</div><div class=\"k\">Frank Conroy Reading Room은</div></div><div class=\"rc\"><div class=\"e\">in the Dey House</div><div class=\"k\">Dey House에 있는</div></div><div class=\"rc\"><div class=\"e\">was named in his honor.</div><div class=\"k\">그(= Conroy)를 기리기 위해 이름 붙여졌다.</div></div><div class=\"rnat\">Dey House(데이 하우스; Iowa 작가 워크숍의 장소)에 있는 Frank Conroy Reading Room은 그를 기리기 위해 이름 붙여졌다.</div><div class=\"rst\">마지막 칸: 그를 기려 데이 하우스(Dey House)의 열람실에 그의 이름을 붙임. 지문 7번의 마무리예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"acclaimed\" data-m=\"극찬받은\"><b>acclaimed</b>극찬받은</button><button type=\"button\" class=\"wdb\" data-w=\"memoir\" data-m=\"회고록\"><b>memoir</b>회고록</button><button type=\"button\" class=\"wdb\" data-w=\"literary world\" data-m=\"문학계\"><b>literary world</b>문학계</button><button type=\"button\" class=\"wdb\" data-w=\"graduate\" data-m=\"졸업하다\"><b>graduate</b>졸업하다</button><button type=\"button\" class=\"wdb\" data-w=\"influential\" data-m=\"영향력 있는\"><b>influential</b>영향력 있는</button><button type=\"button\" class=\"wdb\" data-w=\"accomplished\" data-m=\"뛰어난, 재주가 많은\"><b>accomplished</b>뛰어난, 재주가 많은</button></div>", "03": "<p class=\"mtr\">마더텅 정답률 <b>90%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">주장은 <b>but</b>(하지만) 뒤의 <b>지혜</b>(wisdom)와 마지막 <b>never</b>(결코 ~ 않다) 문장에 있어요. 침대 정리는 예시일 뿐이니, 반복되는 <b>little things</b>(작은 일들) → <b>big things</b>(큰일들)를 잡으세요.</p><div class=\"ck-step\"><span class=\"lab\">3번 문장 · 방향 전환</span><div class=\"en\">It seemed a little ridiculous at the time, <mark>but the wisdom of this simple act</mark> has been proven to me many times over.</div><p class=\"ko\">그 당시에는 약간 우스꽝스럽게 보였지만, <mark>이 단순한 행위의 지혜는</mark> 여러 차례 거듭하여 나에게 증명되었다.</p></div><div class=\"ck-via\"><i>▼</i><span>그 ‘지혜’가 무엇인지 풀기 시작해요: 침대 정리 = 하루의 첫 과업</span></div><div class=\"ck-step\"><span class=\"lab\">4번 문장 · 작은 일 하나</span><div class=\"en\">If you make your bed every morning, you will have accomplished <mark>the first task of the day</mark>.</div><p class=\"ko\">만약 여러분이 매일 아침 침대를 정돈한다면, 여러분은 <mark>하루의 첫 번째 과업을</mark> 성취한 것이 된다.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>5번</em>작은 자존감 → 다음 과업, 또 다음 과업을 하게 됨</span><span><em>6번</em>하나의 완수된 과업 → 여러 개의 완수된 과업</span></div><div class=\"ck-eq\">⇒ 공통점 = 작은 일 하나를 잘 해내면 그게 점점 커진다</div></div><div class=\"ck-via\"><i>▼</i><span>침대 이야기를 일반 법칙으로 넓혀 결론을 못 박아요</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 문장 · 결정적 단서</span><div class=\"en\">If you can’t do <mark>little things</mark> right, you will <mark>never do the big things right</mark>.</div><p class=\"ko\"><mark>작은 일들을</mark> 제대로 할 수 없으면, 여러분은 <mark>결코 큰일들을 제대로 할 수 없을 것이다.</mark></p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">큰일을 잘 이루려면 작은 일부터 제대로 수행해야 한다.<small>7번 little things(작은 일들) → big things(큰일들)를 그대로 옮긴 말이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">숙면을 위해서는 침대를 깔끔하게 관리해야 한다.</span><span class=\"why\">[범위 좁음] 침대 정리는 2·4번의 예시일 뿐이에요. 게다가 지문은 잠(숙면)이 아니라 하루의 과업을 이루는 이야기를 해요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">일의 효율성을 높이려면 협동심을 발휘해야 한다.</span><span class=\"why\">[지문에 없음] 함께 힘을 모으는 이야기는 없어요. 5·6번은 혼자 작은 일을 끝내며 자존감을 얻는 이야기예요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">올바른 습관을 기르려면 정해진 규칙을 따라야 한다.</span><span class=\"why\">[지문에 없음] 2번에서 침대 정리를 요구받았지만, 필자가 강조하는 건 규칙을 따르는 게 아니라 3번의 그 행위가 주는 지혜(wisdom)예요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">건강을 유지하기 위해서는 기상 시간이 일정해야 한다.</span><span class=\"why\">[지문에 없음] 2·4번에 every morning(매일 아침)이 나오지만, 일어나는 시간이나 건강 이야기는 한 번도 안 나와요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">When I was in the army,</div><div class=\"k\">내가 군대에 있었을 때,</div></div><div class=\"rc\"><div class=\"e\">my instructors would show up in my barracks room,</div><div class=\"k\">교관들이 나의 병영 생활관에 모습을 드러내곤 했었는데,</div></div><div class=\"rc\"><div class=\"e\">and the first thing they would inspect</div><div class=\"k\">그들(= 교관들)이 맨 먼저 검사하곤 했던 것은</div></div><div class=\"rc\"><div class=\"e\">was our bed.</div><div class=\"k\">우리의 침대였다.</div></div><div class=\"rnat\">내가 군대에 있었을 때, 교관들이 나의 병영 생활관에 모습을 드러내곤 했었는데, 그들이 맨 먼저 검사하곤 했던 것은 우리의 침대였다.</div><div class=\"rst\">학교 가기 전 아침을 떠올려 봐요. 엄마가 제일 먼저 확인하는 건 내 침대예요. = 지문의 교관이 맨 먼저 검사하던 <b>침대</b>예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">It was a simple task,</div><div class=\"k\">단순한 일이었지만,</div></div><div class=\"rc\"><div class=\"e\">but every morning we were required</div><div class=\"k\">매일 아침 우리는 요구받았다</div></div><div class=\"rc\"><div class=\"e\">to make our bed to perfection.</div><div class=\"k\">침대를 완벽하게 정돈하도록.</div></div><div class=\"rnat\">단순한 일이었지만, 매일 아침 우리는 침대를 완벽하게 정돈하도록 요구받았다.</div><div class=\"rst\">이불 개기는 쉬운 일인데, 매일 아침 반듯하게 해 놓으래요. 지문도 단순한 일이지만 매일 완벽하게 정돈하라고 요구받았다고 해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">It seemed a little ridiculous at the time,</div><div class=\"k\">그 당시에는 약간 우스꽝스럽게 보였지만,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">but the wisdom of this simple act</span></div><div class=\"k\"><span class=\"cw\">이 단순한 행위의 지혜는</span></div></div><div class=\"rc\"><div class=\"e\">has been proven to me many times over.</div><div class=\"k\">여러 차례 거듭하여 나에게 증명되었다.</div></div><div class=\"rnat\">그 당시에는 약간 우스꽝스럽게 보였지만, 이 단순한 행위의 지혜는 여러 차례 거듭하여 나에게 증명되었다.</div><div class=\"rst\">그땐 “이게 뭐라고…” 싶었는데, <b>하지만</b>(but) 해 보니 그 안에 <b>지혜</b>(wisdom)가 있었어요. 지문도 그 지혜가 여러 번 증명됐다고 해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">If you make your bed every morning,</div><div class=\"k\">만약 여러분이 매일 아침 침대를 정돈한다면,</div></div><div class=\"rc ckc\"><div class=\"e\">you will have accomplished <span class=\"cw\">the first task of the day</span>.</div><div class=\"k\">여러분은 <span class=\"cw\">하루의 첫 번째 과업을</span> 성취한 것이 된다.</div></div><div class=\"rnat\">여러분이 매일 아침 침대를 정돈한다면, 여러분은 하루의 첫 번째 과업을 성취한 것이 된다.</div><div class=\"rst\">아침에 이불을 개면 벌써 오늘 할 일 하나를 끝낸 거예요. = 지문의 <b>하루의 첫 번째 과업</b>을 성취한 것이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">It will give you a small sense of pride</div><div class=\"k\">그것은 여러분에게 작은 자존감을 주고,</div></div><div class=\"rc\"><div class=\"e\">and it will encourage you</div><div class=\"k\">또 여러분에게 용기를 줄 것이다</div></div><div class=\"rc\"><div class=\"e\">to do another task and another.</div><div class=\"k\">또 다른 과업을 잇따라 하도록.</div></div><div class=\"rnat\">그것은 여러분에게 작은 자존감을 주고, 또 다른 과업을 잇따라 이어가도록 용기를 줄 것이다.</div><div class=\"rst\">“나 벌써 하나 했다!” 하는 뿌듯함에 숙제도 하고 준비물도 챙겨요. 지문도 작은 자존감이 또 다른 과업을 하게 해 준다고 해요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">By the end of the day,</div><div class=\"k\">하루가 끝날 때쯤에는,</div></div><div class=\"rc\"><div class=\"e\">that one task completed</div><div class=\"k\">완수된 그 하나의 과업이</div></div><div class=\"rc\"><div class=\"e\">will have turned into many tasks completed.</div><div class=\"k\">여러 개의 완수된 과업으로 변해 있을 것이다.</div></div><div class=\"rnat\">하루가 끝날 때쯤에는, 완수된 그 하나의 과업이 여러 개의 완수된 과업으로 변해 있을 것이다.</div><div class=\"rst\">저녁이 되면 그 하나가 여러 개의 끝낸 일로 불어나 있어요. 지문도 하나의 과업이 많은 과업으로 변한다고 말해요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">If you can’t do <span class=\"cw\">little things</span> right,</div><div class=\"k\"><span class=\"cw\">작은 일들을</span> 제대로 할 수 없으면,</div></div><div class=\"rc ckc\"><div class=\"e\">you will <span class=\"cw\">never do the big things right</span>.</div><div class=\"k\">여러분은 <span class=\"cw\">결코 큰일들을 제대로 할 수 없을 것이다.</span></div></div><div class=\"rnat\">작은 일들을 제대로 할 수 없으면, 여러분은 결코 큰일들을 제대로 할 수 없을 것이다.</div><div class=\"rst\">그래서 필자의 주장은 이거예요. <b>작은 일</b>(little things)을 제대로 못 하면 <b>큰일</b>(big things)도 절대 제대로 못 한다는 것이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"inspect\" data-m=\"검사하다\"><b>inspect</b>검사하다</button><button type=\"button\" class=\"wdb\" data-w=\"perfection\" data-m=\"완벽\"><b>perfection</b>완벽</button><button type=\"button\" class=\"wdb\" data-w=\"ridiculous\" data-m=\"우스꽝스러운\"><b>ridiculous</b>우스꽝스러운</button><button type=\"button\" class=\"wdb\" data-w=\"wisdom\" data-m=\"지혜\"><b>wisdom</b>지혜</button><button type=\"button\" class=\"wdb\" data-w=\"accomplish\" data-m=\"성취하다\"><b>accomplish</b>성취하다</button><button type=\"button\" class=\"wdb\" data-w=\"sense of pride\" data-m=\"자부심\"><b>sense of pride</b>자부심</button></div>", "04": "<p class=\"mtr\">마더텅 정답률 <b>70%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">주제는 <b>When one person lies</b>(한 사람이 거짓말을 하면)로 화제가 바뀌는 4번에 있어요. 솔직한 대화(1~3번)는 비교 대상이고, 반복되는 <b>more slowly</b>(더 느리게)·<b>time lag</b>(시간의 지연)를 잡으세요.</p><div class=\"ck-step\"><span class=\"lab\">3번 문장 · 비교 대상: 솔직한 대화</span><div class=\"en\">… the pace of the exchange is <mark>as fast as memory</mark>.</div><p class=\"ko\">주고받는 속도는 <mark>기억만큼 빠르다.</mark></p></div><div class=\"ck-via\"><i>▼</i><span>솔직할 때(빠름)와 반대로, 거짓말할 때는 느려진다고 대조해요</span></div><div class=\"ck-step key\"><span class=\"lab\">4번 문장 · 결정적 단서</span><div class=\"en\">When one person lies, their responses will come <mark>more slowly</mark> because the brain needs more time to process the details of a new invention …</div><p class=\"ko\">한 사람이 거짓말을 하면, 뇌가 새로 꾸며 낸 이야기의 세부 사항을 처리하는 데 더 많은 시간이 필요하기 때문에 … 그 사람의 반응이 <mark>더 느리게 나올 것이다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>속도(타이밍)가 핵심이라고 한 번 더 못 박아요</span></div><div class=\"ck-step\"><span class=\"lab\">5번 문장 · 강조</span><div class=\"en\">“<mark>Timing is everything</mark>.”</div><p class=\"ko\">“<mark>타이밍이 모든 것이다</mark>(가장 중요하다).”</p></div><div class=\"ck-via\"><i>▼</i><span>more slowly(더 느리게)를 time lag(시간의 지연)로 바꿔 말해요</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 핵심어 반복</span><div class=\"en\">You will notice <mark>the time lag</mark> when you are having a conversation with someone who is making things up as they go.</div><p class=\"ko\">말을 하면서 이야기를 꾸며내고 있는 누군가와 대화를 하고 있으면, 당신은 <mark>시간의 지연을</mark> 알아차릴 것이다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">delayed responses as a sign of lying 거짓말의 신호로서의 지연된 반응<small>4번 more slowly(더 느리게) + 6번 time lag(시간의 지연) = delayed responses(지연된 반응)예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">shared experiences as conversation topics 대화 주제로서의 공유된 경험</span><span class=\"why\">[범위 좁음] 3번 past personal experiences(개인적인 과거 경험)는 솔직한 대화가 빠른 이유일 뿐이에요. 경험을 대화 주제로 삼자는 말은 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">ways listeners encourage the speaker 듣는 사람이 말하는 사람을 격려하는 방법</span><span class=\"why\">[지문에 없음] 격려 이야기는 없어요. 7번 몸짓 언어도 상대가 의심하는 걸 읽고 멈춘다는 말이지 격려가 아니에요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">difficulties in finding useful information 유용한 정보를 찾는 것의 어려움</span><span class=\"why\">[지문에 없음] 1번 flow of information(정보의 흐름)이 나오지만, 정보를 찾기 어렵다는 내용은 없어요. 지문은 반응 속도를 말해요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">necessity of white lies in social settings 사회적 상황에서 선의의 거짓말의 필요성</span><span class=\"why\">[지문에 없음] 4번 lies(거짓말을 하다)가 나오지만, 거짓말이 필요하다는 게 아니라 거짓말이 느린 반응으로 들킨다는 이야기예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">When two people are involved in an honest and open conversation,</div><div class=\"k\">두 사람이 솔직하고 진솔한 대화에 참여할 때</div></div><div class=\"rc\"><div class=\"e\">there is a back and forth flow of information.</div><div class=\"k\">왔다 갔다 하는 정보의 흐름이 있다.</div></div><div class=\"rnat\">두 사람이 솔직하고 진솔한 대화에 참여할 때 왔다 갔다 하는 정보의 흐름이 있다.</div><div class=\"rst\">부모님과 저녁에 오늘 하루 얘기를 하는 장면이에요. 솔직하게 말하면 말이 술술 오가요. = 지문의 <b>왔다 갔다 하는 정보의 흐름</b>이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">It is a smooth exchange.</div><div class=\"k\">그것은 순조로운 주고받기이다.</div></div><div class=\"rnat\">그것은 순조로운 주고받기이다.</div><div class=\"rst\">“학교 어땠어?” “재밌었어!” 막힘없이 주고받아요. 지문도 그걸 <b>순조로운 주고받기</b>라고 해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Since each one is drawing on their past personal experiences,</div><div class=\"k\">각자가 자신의 개인적인 과거 경험에 의존하고 있기 때문에,</div></div><div class=\"rc\"><div class=\"e\">the pace of the exchange</div><div class=\"k\">주고받는 속도는</div></div><div class=\"rc\"><div class=\"e\">is as fast as memory.</div><div class=\"k\">기억만큼 빠르다.</div></div><div class=\"rnat\">각자가 자신의 개인적인 과거 경험에 의존하고 있기 때문에, 주고받는 속도는 기억만큼 빠르다.</div><div class=\"rst\">진짜 있었던 일이라 떠올리기만 하면 되니까 대답이 <b>기억만큼 빨라요</b>. 지문도 각자 과거 경험에 기대서 그렇다고 말해요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">When one person lies,</div><div class=\"k\">한 사람이 거짓말을 하면,</div></div><div class=\"rc ckc\"><div class=\"e\">their responses will come <span class=\"cw\">more slowly</span></div><div class=\"k\">그 사람의 반응이 <span class=\"cw\">더 느리게 나올 것이다</span></div></div><div class=\"rc\"><div class=\"e\">because the brain needs more time to process the details of a new invention</div><div class=\"k\">뇌가 새로 꾸며 낸 이야기의 세부 사항을 처리하는 데 더 많은 시간이 필요하기 때문에</div></div><div class=\"rc\"><div class=\"e\">than to recall stored facts.</div><div class=\"k\">저장된 사실을 기억해 내는 것에 비해.</div></div><div class=\"rnat\">한 사람이 거짓말을 하면, 뇌는 저장된 사실을 기억해 내는 데 비해 새로 꾸며 낸 이야기의 세부 사항을 처리하는 데에 더 많은 시간이 필요하기 때문에, 그 사람의 반응이 더 느리게 나올 것이다.</div><div class=\"rst\">그런데 학원을 빠지고 “갔다 왔어…” 하고 거짓말하면, 이야기를 지어내느라 대답이 <b>더 느리게</b>(more slowly) 나와요. 이게 지문의 주제예요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">As they say,</div><div class=\"k\">사람들이 말하듯</div></div><div class=\"rc ckc\"><div class=\"e\">“<span class=\"cw\">Timing is everything</span>.”</div><div class=\"k\">“<span class=\"cw\">타이밍이 모든 것이다</span>(가장 중요하다).”</div></div><div class=\"rnat\">사람들이 말하듯 \"타이밍이 모든 것이다(가장 중요하다).\"</div><div class=\"rst\">그래서 대답이 언제 나오느냐가 중요해요. 지문도 “<b>타이밍이 모든 것이다</b>”라는 말을 가져와요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc ckc\"><div class=\"e\">You will notice <span class=\"cw\">the time lag</span></div><div class=\"k\">당신은 <span class=\"cw\">시간의 지연을</span> 알아차릴 것이다</div></div><div class=\"rc\"><div class=\"e\">when you are having a conversation</div><div class=\"k\">대화를 하고 있으면</div></div><div class=\"rc\"><div class=\"e\">with someone who is making things up</div><div class=\"k\">이야기를 꾸며내고 있는 누군가와</div></div><div class=\"rc\"><div class=\"e\">as they go.</div><div class=\"k\">말을 하면서.</div></div><div class=\"rnat\">말을 하면서 이야기를 꾸며내고 있는 누군가와 (당신이) 대화를 하고 있으면, 당신은 시간의 지연을 알아차릴 것이다.</div><div class=\"rst\">부모님은 “어… 그러니까…” 하는 그 <b>멈칫하는 틈</b>(time lag 시간의 지연)을 바로 알아채요. 지문도 꾸며 내는 사람과 대화하면 그 지연이 보인다고 해요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Don’t forget that the other person may be reading your body language as well,</div><div class=\"k\">상대방도 당신의 몸짓 언어를 역시 읽고 있을지도 모른다는 것을 잊지 마라,</div></div><div class=\"rc\"><div class=\"e\">and if you seem to be disbelieving their story,</div><div class=\"k\">만약 당신이 그 사람의 이야기를 믿지 않고 있는 것처럼 보이면,</div></div><div class=\"rc\"><div class=\"e\">they will have to pause to process that information, too.</div><div class=\"k\">그 사람은 그 정보를 처리하기 위해 또한 잠시 멈춰야 할 것이다.</div></div><div class=\"rnat\">상대방도 당신의 몸짓 언어 역시 읽고 있을지도 모른다는 것과 만약 당신이 그 사람의 이야기를 믿지 않고 있는 것처럼 보이면, 그 사람은 그 정보를 처리하기 위해 또한 잠시 멈춰야 한다는 것을 잊지 마라.</div><div class=\"rst\">부모님이 “안 믿는” 표정을 보이면, 그걸 읽은 나는 또 멈칫해요. 지문도 상대가 당신의 몸짓 언어를 읽고 또 멈춘다고 해요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"back and forth\" data-m=\"왔다 갔다 하는\"><b>back and forth</b>왔다 갔다 하는</button><button type=\"button\" class=\"wdb\" data-w=\"process\" data-m=\"처리하다\"><b>process</b>처리하다</button><button type=\"button\" class=\"wdb\" data-w=\"invention\" data-m=\"꾸며 낸 이야기\"><b>invention</b>꾸며 낸 이야기</button><button type=\"button\" class=\"wdb\" data-w=\"recall\" data-m=\"기억해 내다\"><b>recall</b>기억해 내다</button><button type=\"button\" class=\"wdb\" data-w=\"time lag\" data-m=\"시간의 지연\"><b>time lag</b>시간의 지연</button><button type=\"button\" class=\"wdb\" data-w=\"make things up\" data-m=\"이야기를 지어내다\"><b>make things up</b>이야기를 지어내다</button></div>", "05": "<p class=\"mtr\">마더텅 정답률 <b>65%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">밑줄 바로 <b>앞에 명사(선행사)가 있는지</b>부터 보세요. 앞에 명사가 있으면 <b>that</b>(~하는)이고, <b>what</b>(~하는 것)은 선행사를 품고 있어서 명사 뒤에 못 와요.</p><div class=\"ck-step\"><span class=\"lab\">문제지 ③번 자리 (6번)</span><div class=\"en\">I thought that I would be able to find another job <u>③ what</u> was a better match.</div><p class=\"ko\">나는 ( ? ) 더 잘 맞는 다른 직업을 찾을 수 있을 것이라고 생각했다 — 앞은 명사 another job, 뒤는 바로 동사 was</p></div><div class=\"ck-via\"><i>▼</i><span>밑줄 바로 앞에 명사 another job(다른 직업)이 있어요</span></div><div class=\"ck-step\"><span class=\"lab\">6번 문장 · 앞에 선행사가 있다</span><div class=\"en\">I would be able to find <mark>another job</mark></div><p class=\"ko\">내가 <mark>다른 직업을</mark> 찾을 수 있을 것이라고</p></div><div class=\"ck-via\"><i>▼</i><span>뒤는 주어 없이 was(~이었다)부터 → 선행사를 꾸미는 관계대명사 that(~하는)</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 결정적 단서</span><div class=\"en\"><mark>that was a better match</mark>.</div><p class=\"ko\"><mark>더 잘 맞는 (직업)</mark></p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">관계대명사 what(~하는 것)과 that(~하는) 구별</p><p class=\"gr\">what(~하는 것)은 선행사를 품고 있어서 앞에 명사가 없을 때만 써요. 앞에 꾸밀 명사(선행사)가 있으면 that(~하는)이나 which(~하는)를 써요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I found a bag that was cheap.</div><div class=\"ko\">나는 값이 싼 가방을 찾았다. (앞에 a bag이 있으니 that)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I found a bag what was cheap.</div><div class=\"ko\">앞에 선행사 a bag이 있는데 what을 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>I found what was cheap.</div><div class=\"ko\">나는 값이 싼 것을 찾았다. (앞에 명사가 없으니 what)</div></div><p class=\"gb\">지문 6번도 앞에 another job(다른 직업)이 있고 뒤는 주어가 빠진 was(~이었다)부터예요. 그래서 what(~하는 것)이 아니라 that(~하는)이에요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">what → that (~하는)<small>선행사 another job(다른 직업)이 앞에 있으니 what(~하는 것)이 아니라 that(~하는)이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">was offered 제안받았다</span><span class=\"why\">3번은 I(나)가 일자리를 ‘제안한’ 게 아니라 ‘제안받은’ 쪽이라 수동태가 맞아요. 뒤에 a job(일자리)이 남아 있는 건 offer(제안하다)가 목적어를 두 개 가지는 동사라서예요.</span><div class=\"gm wx\"><p class=\"gt\">수동태 was offered(제안받았다): 주어가 동작을 ‘받는’ 쪽이면 ‘~받다, ~되다’ 형태</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I was given a gift.</div><div class=\"ko\">나는 선물을 받았다. (내가 받는 쪽이라 수동태 was given이 맞고, 뒤에 a gift가 남아도 돼요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I offered a job by the company.</div><div class=\"ko\">by the company(그 회사에 의해)가 있는데 능동 offered(제안했다)를 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>She was offered a seat.</div><div class=\"ko\">그녀는 자리를 권유받았다. (그녀가 받는 쪽이라 맞아요)</div></div><p class=\"gb\">지문 3번도 졸업 후 내가 일자리를 받은 쪽이라 was offered(제안받았다) + a job(일자리)이 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">turn it down 그것을 거절하다</span><span class=\"why\">5번 turn down(거절하다)은 동사 + 부사로 된 이어동사예요. 목적어가 대명사 it(그것)이면 반드시 가운데에 넣어야 해서 turn it down(그것을 거절하다)이 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">이어동사(동사 + 부사) + 대명사 목적어는 가운데에</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>Please turn it off.</div><div class=\"ko\">그것을 꺼 주세요. (대명사 it이 가운데에 와서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>Please turn off it.</div><div class=\"ko\">대명사 it을 맨 뒤에 둬서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>Please turn off the TV.</div><div class=\"ko\">TV를 꺼 주세요. (대명사가 아닌 명사는 뒤에 와도 맞아요)</div></div><p class=\"gb\">지문 5번도 it(그것) = 그 기회라서 turn it down(그것을 거절하다)처럼 가운데에 넣은 게 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">looking 찾느라고</span><span class=\"why\">7번은 I spent months(나는 몇 달을 보냈다) 뒤예요. spend(보내다) + 시간 + -ing(~하느라고)가 짝이라 looking(찾느라고)이 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">spend(보내다) + 시간 + -ing(~하느라고)</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I spent two hours doing my homework.</div><div class=\"ko\">나는 숙제하느라 두 시간을 보냈다. (spent two hours 뒤에 doing이 와서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I spent two hours to do my homework.</div><div class=\"ko\">spend(보내다) 뒤에 to do를 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>He spent the day playing games.</div><div class=\"ko\">그는 게임하느라 하루를 보냈다. (playing이 맞아요)</div></div><p class=\"gb\">지문 7번도 spent months(몇 달을 보냈다) 다음이라 looking for(~을 찾느라고)가 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">not taking 받아들이지 않은 것</span><span class=\"why\">8번은 전치사 for(~에 대해) 바로 뒤라 동명사 taking(받아들인 것)이 와야 해요. 동명사를 부정할 때는 not(~않다)을 그 바로 앞에 붙이므로 not taking(받아들이지 않은 것)이 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">전치사 뒤 동명사, 부정은 not(~않다)을 동명사 바로 앞에</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>Thank you for not being late.</div><div class=\"ko\">늦지 않아 줘서 고마워. (for 뒤에 not being이 와서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>Thank you for not be late.</div><div class=\"ko\">전치사 for(~에 대해) 뒤에 동사원형 be를 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>I am sorry for not calling you.</div><div class=\"ko\">너에게 전화하지 않아서 미안해. (not이 동명사 calling 바로 앞에 와서 맞아요)</div></div><p class=\"gb\">지문 8번도 for(~에 대해) 뒤라서 not taking(받아들이지 않은 것)이 그 일자리를 거절한 걸 후회하는 뜻으로 맞아요.</p></div></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">It’s important to remember</div><div class=\"k\">기억하는 것이 중요하다</div></div><div class=\"rc\"><div class=\"e\">that good decisions can still lead to bad outcomes.</div><div class=\"k\">올바른 결정이 여전히 나쁜 결과를 야기할 수 있다는 것을.</div></div><div class=\"rnat\">올바른 결정이 여전히 나쁜 결과를 야기할 수 있다는 것을 기억하는 것이 중요하다.</div><div class=\"rst\">좋은 결정을 해도 결과는 나쁠 수 있다는 걸 기억하래요. 이 글 전체가 하려는 말이에요. (lead to = ~로 이어지다)</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Here is an example.</div><div class=\"k\">여기에 한 예가 있다.</div></div><div class=\"rnat\">여기에 한 예가 있다.</div><div class=\"rst\">이제 그 예를 하나 보여 준대요. 아래 3~9번이 전부 그 예시예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Soon after I got out of school,</div><div class=\"k\">내가 학교를 졸업한 후에 곧,</div></div><div class=\"rc\"><div class=\"e\">I was offered a job.</div><div class=\"k\">나는 한 일자리를 제안받았다.</div></div><div class=\"rnat\">내가 학교를 졸업한 후에 곧, 나는 한 일자리를 제안받았다.</div><div class=\"rst\">학교를 졸업하자마자 일자리를 <b>제안받았어요</b>. 내가 받는 쪽이라 수동태 was offered(제안받았다)예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">I wasn’t sure</div><div class=\"k\">나는 확신할 수 없었다</div></div><div class=\"rc\"><div class=\"e\">that was a great fit for me.</div><div class=\"k\">그것(= 그 일자리)이 나에게 잘 맞는 것인지를.</div></div><div class=\"rnat\">나는 그것이 나에게 잘 맞는 것인지를 확신할 수 없었다.</div><div class=\"rst\">그런데 그 일이 나한테 잘 맞는지 확신이 없었어요. 여기 that(그것)은 그 일자리를 가리키고, 그 앞에 접속사 that(~라는 것)이 생략됐어요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">After carefully considering the opportunity,</div><div class=\"k\">그 기회를 신중하게 고려한 후에</div></div><div class=\"rc\"><div class=\"e\">I decided to turn it down.</div><div class=\"k\">나는 그것(= 그 기회)을 거절하기로 결정했다.</div></div><div class=\"rnat\">그 기회를 신중하게 고려한 후에 나는 그것을 거절하기로 결정했다.</div><div class=\"rst\">꼼꼼히 따져 본 뒤 그 기회를 <b>거절했어요</b>. it(그것)이 가운데 들어간 turn it down(그것을 거절하다)이에요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">I thought</div><div class=\"k\">나는 생각했다</div></div><div class=\"rc ckc\"><div class=\"e\">that I would be able to find <span class=\"cw\">another job</span></div><div class=\"k\">내가 <span class=\"cw\">다른 직업을</span> 찾을 수 있을 것이라고</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">that was a better match</span>.</div><div class=\"k\"><span class=\"cw\">더 잘 맞는 (직업)</span> ※ 문제지엔 what으로 되어 있음</div></div><div class=\"rnat\">나는 더 잘 맞는 다른 직업을 찾을 수 있을 것이라고 생각했다.</div><div class=\"rst\">더 잘 맞는 <b>다른 직업</b>을 찾을 줄 알았어요. 앞의 another job(다른 직업)을 꾸미니 what(~하는 것)이 아니라 <b>that</b>(~하는)이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Unfortunately,</div><div class=\"k\">불행하게도,</div></div><div class=\"rc\"><div class=\"e\">the economy soon grew worse quickly</div><div class=\"k\">경제 상황이 곧 빠르게 악화되었고</div></div><div class=\"rc\"><div class=\"e\">and I spent months looking for another job.</div><div class=\"k\">나는 다른 직업을 찾느라고 몇 달을 보냈다.</div></div><div class=\"rnat\">불행하게도, 경제상황이 곧 빠르게 악화되었고, 나는 다른 직업을 찾느라고 몇 달을 보냈다.</div><div class=\"rst\">그런데 경제가 갑자기 나빠져서 다른 일을 <b>찾느라</b> 몇 달을 보냈어요. spend(보내다) + 시간 + looking(찾느라고)이에요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">I kicked myself for not taking that position,</div><div class=\"k\">나는 그 일자리를 받아들이지 않은 것에 대해서 자책했고,</div></div><div class=\"rc\"><div class=\"e\">which started to look more and more appealing.</div><div class=\"k\">그것(= 그 일자리)은 점점 더 매력적으로 보이기 시작했다.</div></div><div class=\"rnat\">나는 그 일자리를 받아들이지 않은 것에 대해서 자책했고, 그 일자리가 점점 매력적으로 보이기 시작했다.</div><div class=\"rst\">그 자리를 <b>받아들이지 않은 것</b>을 자책했어요. for(~에 대해) 뒤라 동명사, 부정이라 not taking(받아들이지 않은 것)이에요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">I had made a good decision,</div><div class=\"k\">나는 올바른 결정을 내렸다,</div></div><div class=\"rc\"><div class=\"e\">based upon all the information I had at the time,</div><div class=\"k\">그 당시에 내가 가지고 있던 모든 정보를 근거로,</div></div><div class=\"rc\"><div class=\"e\">but in the short run</div><div class=\"k\">하지만 단기적인 관점에서</div></div><div class=\"rc\"><div class=\"e\">it didn’t lead to a great outcome.</div><div class=\"k\">그것(= 그 결정)이 좋은 결과로 이어진 것은 아니었다.</div></div><div class=\"rnat\">나는 그 당시에 내가 가지고 있는 모든 정보를 근거로 올바른 결정을 내렸지만 단기적인 관점에서 그것이 좋은 결과를 가져온 것은 아니었다.</div><div class=\"rst\">그때 가진 정보로는 좋은 결정이었지만, 당장은 좋은 결과가 아니었어요. 1번의 말이 이 예로 증명돼요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"outcome\" data-m=\"결과\"><b>outcome</b>결과</button><button type=\"button\" class=\"wdb\" data-w=\"turn down\" data-m=\"거절하다\"><b>turn down</b>거절하다</button><button type=\"button\" class=\"wdb\" data-w=\"grow worse\" data-m=\"악화되다\"><b>grow worse</b>악화되다</button><button type=\"button\" class=\"wdb\" data-w=\"kick oneself for\" data-m=\"~에 대해 자책하다\"><b>kick oneself for</b>~에 대해 자책하다</button><button type=\"button\" class=\"wdb\" data-w=\"appealing\" data-m=\"매력적인\"><b>appealing</b>매력적인</button><button type=\"button\" class=\"wdb\" data-w=\"in the short run\" data-m=\"단기적으로는\"><b>in the short run</b>단기적으로는</button></div>", "06": "<p class=\"mtr\">마더텅 정답률 <b>65%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">이 글은 처음부터 끝까지 <b>리듬을 함께하면 관계가 좋아진다</b>는 <b>한 방향</b>이에요. 1번 <b>stronger</b>(더 강한), 4번 <b>strong bonds</b>(강한 결속력)와 거꾸로 가는 낱말을 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">1번 · 글의 방향</span><div class=\"en\">When people share the same daily, weekly, monthly, and seasonal rhythms, connections among them form faster and <mark>stay stronger</mark>.</div><p class=\"ko\">사람들이 똑같은 매일, 매주, 매달 그리고 계절 리듬을 공유할 때, 그들 간의 관계는 더욱 빠르게 형성되고 <mark>더욱 강한 상태를 유지한다.</mark></p></div><div class=\"ck-via\"><i>▼</i><span>정기 회의를 하는 이유도 관계를 ‘강하게’ 유지하려는 것</span></div><div class=\"ck-step\"><span class=\"lab\">4번 · 같은 방향 반복</span><div class=\"en\">… several organizations use regular stand-up meetings to <mark>maintain strong bonds</mark> …</div><p class=\"ko\">몇몇 조직들은 <mark>강한 결속력을 유지</mark>하기 위해 정기 스탠딩 회의를 이용한다 …</p></div><div class=\"ck-via\"><i>▼</i><span>자주 만나 생긴 리듬이 관계를 약하게? 방향이 거꾸로예요</span></div><div class=\"ck-step key\"><span class=\"lab\">문제지 ④번 자리 (6번)</span><div class=\"en\">“The rhythm that frequency generates allows relationships to <u>④ weaken</u>, personal habits to be understood, and stressors to be identified.</div><p class=\"ko\">빈번함이 만드는 리듬은 관계가 ( 약해지게? ) 하고, 개인의 습관이 이해되게 하고, 스트레스 요인이 확인되게 한다 → '발전하도록'이 맞아요.</p></div><div class=\"ck-via\"><i>▼</i><span>같이 나열된 두 개가 모두 좋은 결과라 ④도 좋은 쪽이어야 해요</span></div><div class=\"ck-step\"><span class=\"lab\">6번 · 바로 뒤 두 짝</span><div class=\"en\"><mark>personal habits to be understood</mark>, and stressors to be identified.</div><p class=\"ko\"><mark>개인의 습관이 이해되게 하고</mark>, 스트레스 요인도 확인되게 한다.</p></div><div class=\"ck-via\"><i>▼</i><span>All of this(이 모든 것) = 6번 세 가지가 팀을 돕는다</span></div><div class=\"ck-step\"><span class=\"lab\">7번 · 결과로 확인</span><div class=\"en\">All of this helps the members of the team understand not only their roles …</div><p class=\"ko\">이 모든 것은 팀의 구성원들이 자신의 역할뿐만 아니라 … 이해하도록 돕는다.</p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">develop(발전하다) ↔ weaken(약해지다)</p><p class=\"gr\">앞에서 stronger(더 강한)·trust(신뢰하다)처럼 좋아지는 방향이 계속되면, 나열된 결과도 develop(발전하다)처럼 같은 방향이어야 해요. weaken(약해지다)은 정반대 방향이에요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>We practice together every day, so our team gets stronger.</div><div class=\"ko\">우리는 매일 같이 연습해서 팀이 더 강해져요. (함께함 → 강해짐)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>We practice together every day, so our friendship weakens.</div><div class=\"ko\">매일 같이 연습하는데 우정이 약해진다? 방향이 거꾸로라 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>Talking often helps our friendship develop.</div><div class=\"ko\">자주 이야기하면 우정이 발전해요. (자주 → 발전)</div></div><p class=\"gb\">지문 6번도 frequency(빈번함)가 만드는 리듬은 1번처럼 관계를 강하게 하니, weaken(약해지다)이 아니라 develop(발전하다)이어야 해요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">weaken → develop (발전하다)<small>리듬을 함께하면 관계가 stronger(더 강한)가 되니, 약해지는 게 아니라 발전해야 해요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">helps 돕다</span><span class=\"why\">7번 All of this(이 모든 것)는 6번의 관계 발전·습관 이해·스트레스 요인 확인이에요. 모두 좋은 일이라 팀원들을 helps(돕다)가 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">coordination 협동</span><span class=\"why\">2번 앞부분이 trust each other more deeply(서로를 더 깊이 신뢰하다)예요. 믿음이 깊어지면 협동(coordination)도 쉬워지니 같은 방향이라 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">frequently 빈번하게</span><span class=\"why\">3번은 After all(결국)로 2번의 이유를 대요. 같은 리듬을 공유하니 같은 일을 frequently(빈번하게) 함께 하는 게 자연스러워요. 6번 frequency(빈번함)와도 이어져요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">shared 공유된</span><span class=\"why\">4번은 maintain strong bonds(강한 결속력을 유지하다)와 함께 쓰여서 생각도 a shared mindset(공유된 사고방식)으로 강화한다는 말이에요. 1번 share(공유하다)와 같은 방향이라 맞아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">When people share the same daily, weekly, monthly, and seasonal rhythms,</div><div class=\"k\">사람들이 똑같은 매일, 매주, 매달 그리고 계절 리듬을 공유할 때,</div></div><div class=\"rc\"><div class=\"e\">connections among them</div><div class=\"k\">그들 간의 관계는</div></div><div class=\"rc ckc\"><div class=\"e\">form faster and <span class=\"cw\">stay stronger</span>.</div><div class=\"k\">더욱 빠르게 형성되고 <span class=\"cw\">더욱 강한 상태를 유지한다</span>.</div></div><div class=\"rnat\">사람들이 똑같은 매일, 매주, 매달 그리고 계절 리듬을 공유할 때, 그들 간의 관계는 더욱 빠르게 형성되고 더욱 강한 상태를 유지한다.</div><div class=\"rst\">축구부가 매일 같은 시간에 모여 연습하면 금방 친해지고 사이도 단단해져요. = 지문의 리듬을 공유하면 관계가 <b>더 강하게 유지된다</b>는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">The people trust each other more deeply,</div><div class=\"k\">사람들은 서로를 더욱 깊이 신뢰하게 되고</div></div><div class=\"rc\"><div class=\"e\">and coordination becomes easier.</div><div class=\"k\">협동도 더 쉬워진다.</div></div><div class=\"rnat\">사람들은 서로를 더욱 깊이 신뢰하게 되고 협동도 더 쉬워진다.</div><div class=\"rst\">서로 믿게 되니까 패스 맞추기도 쉬워져요. 지문도 신뢰가 깊어지면 <b>협동</b>(coordination)이 쉬워진다고 해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">After all,</div><div class=\"k\">결국</div></div><div class=\"rc\"><div class=\"e\">they are frequently doing the same things</div><div class=\"k\">그들은 빈번하게 똑같은 일을 하고</div></div><div class=\"rc\"><div class=\"e\">and working on the same problems together.</div><div class=\"k\">똑같은 문제들을 함께 해결하고 있다.</div></div><div class=\"rnat\">결국 그들은 빈번하게 똑같은 일을 하고 똑같은 문제들을 함께 해결하고 있다.</div><div class=\"rst\">결국 매일 같은 훈련을 하고 같은 약점을 함께 고치니까요. 지문도 같은 일을 <b>빈번하게</b>(frequently) 함께 한다고 해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">In fact, several organizations use regular stand-up meetings</div><div class=\"k\">사실, 몇몇 조직들은 정기 스탠딩 회의를 이용한다</div></div><div class=\"rc ckc\"><div class=\"e\">to <span class=\"cw\">maintain strong bonds</span></div><div class=\"k\"><span class=\"cw\">강한 결속력을 유지하고</span></div></div><div class=\"rc\"><div class=\"e\">and reinforce a shared mindset.</div><div class=\"k\">공유된 사고방식을 강화시키기 위해.</div></div><div class=\"rnat\">사실, 몇몇 조직들은 강한 결속력을 유지하고 공유된 사고방식을 강화시키기 위해 정기 스탠딩 회의를 이용한다.</div><div class=\"rst\">그래서 코치는 매일 짧게 서서 하는 모임을 해요. 지문도 조직이 <b>강한 결속력을 유지하려고</b> 정기 스탠딩 회의를 쓴다고 해요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">A CEO of a food company</div><div class=\"k\">한 식품 회사의 최고 경영자는</div></div><div class=\"rc\"><div class=\"e\">talks about his short daily meeting</div><div class=\"k\">그의 매일의 짧은 회의에 대해 말한다</div></div><div class=\"rc\"><div class=\"e\">with his team.</div><div class=\"k\">그의 팀과 함께 하는.</div></div><div class=\"rnat\">한 식품 회사의 최고 경영자는 그의 팀과 함께 하는 매일의 짧은 회의에 대해 말한다.</div><div class=\"rst\">어느 식품 회사 최고 경영자도 자기 팀과 매일 하는 짧은 회의 이야기를 해요. 지문 5번의 예시예요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">He explains,</div><div class=\"k\">그(= 최고 경영자)가 설명하기를,</div></div><div class=\"rc\"><div class=\"e\">“The rhythm that frequency generates</div><div class=\"k\">“(회의의) 빈번함이 만들어내는 리듬은</div></div><div class=\"rc ckc\"><div class=\"e\">allows relationships to <span class=\"cw\">develop</span>,</div><div class=\"k\"><span class=\"cw\">관계가 발전하도록 하고</span> ※ 문제지엔 weaken으로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">personal habits to be understood,</div><div class=\"k\">개인의 습관이 이해되게 하고</div></div><div class=\"rc\"><div class=\"e\">and stressors to be identified.</div><div class=\"k\">스트레스 요인도 확인되게 한다.</div></div><div class=\"rnat\">그가 설명하기를, \"(회의의) 빈번함이 만들어내는 리듬은 관계가 약화되도록(→ 발전하도록) 하고 개인의 습관이 이해되게 하고 스트레스 요인도 확인되게 한다.</div><div class=\"rst\">자주 모이니 사이가 <b>발전하고</b>(develop), 서로의 습관도 알고, 힘든 점도 찾아내요. 그래서 문제지의 weaken(약해지다)은 방향이 거꾸로예요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">All of this helps the members of the team understand</div><div class=\"k\">이 모든 것은 팀의 구성원들이 이해하도록 돕는다</div></div><div class=\"rc\"><div class=\"e\">not only their roles</div><div class=\"k\">자신의 역할뿐만 아니라</div></div><div class=\"rc\"><div class=\"e\">but also how they can get the best out of one another.”</div><div class=\"k\">그들이 어떻게 서로가 서로에게서 최상의 것을 얻어낼 수 있는지도.”</div></div><div class=\"rnat\">이 모든 것은 팀의 구성원들이 자신의 역할뿐만 아니라 그들이 어떻게 서로가 서로에게서 최상의 것을 얻어낼 수 있는지를 이해하도록 돕는다.\"</div><div class=\"rst\">이 모든 게 팀원들이 자기 포지션과 서로 잘하는 걸 끌어내는 법을 알게 <b>도와요</b>. = 지문 7번 helps(돕다)예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"coordination\" data-m=\"협동\"><b>coordination</b>협동</button><button type=\"button\" class=\"wdb\" data-w=\"maintain\" data-m=\"유지하다\"><b>maintain</b>유지하다</button><button type=\"button\" class=\"wdb\" data-w=\"bond\" data-m=\"유대감, 결속력\"><b>bond</b>유대감, 결속력</button><button type=\"button\" class=\"wdb\" data-w=\"reinforce\" data-m=\"강화하다\"><b>reinforce</b>강화하다</button><button type=\"button\" class=\"wdb\" data-w=\"generate\" data-m=\"만들어 내다\"><b>generate</b>만들어 내다</button><button type=\"button\" class=\"wdb\" data-w=\"get the best out of\" data-m=\"~에게서 최상의 것을 끌어내다\"><b>get the best out of</b>~에게서 최상의 것을 끌어내다</button></div>"};
document.addEventListener('click',function(e){
 var b=e.target.closest('.stbtn');
 if(b){var box=b.closest('.rdb'),on=!box.classList.contains('story');box.classList.toggle('story',on);
  var L=[].slice.call(box.querySelectorAll('.rds'));L.forEach(function(x){x.classList.remove('lastv');x.style.order='';});
  if(on){L.sort(function(a,c){return (+a.dataset.ord)-(+c.dataset.ord);});L.forEach(function(x,i){x.style.order=i+1;});L[L.length-1].classList.add('lastv');}
  b.textContent=on?'문장별로 보기':'이야기로 이어 읽기';return;}
 var w=e.target.closest('.wdb');
 if(w){var on2=!w.classList.contains('on');w.classList.toggle('on',on2);
  try{if(window.WN){if(on2)WN.add([{w:w.dataset.w,m:w.dataset.m,src:'미니모고',how:'별표',ask:true}]);else if(WN.del)WN.del(w.dataset.w,'미니모고');}}catch(err){}
  var t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s';document.body.appendChild(t);}
  t.textContent=on2?'오답노트장에 담았어요':'오답노트장에서 뺐어요';t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(function(){t.style.opacity='0'},1600);}
});

/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  if(EXP[cq.q]){h+=EXP[cq.q]+'<button class="toq" data-i="'+i+'">빠른 정답으로</button>';return h+'</div></details>';}
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
  mmInit();
}
/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(S.sub&&!S.mmS){S.mmS=1;S.mmP=1;save();WN.hw(lv,day,S.sub.s+'/'+N+(S.mmD?' ✓':''));}else if(!S.sub&&!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
