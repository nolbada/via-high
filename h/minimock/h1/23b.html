var EXP={"07": "<p class=\"mtr\">마더텅 정답률 <b>70%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸 앞의 <b>The same principle applies</b>(동일한 원리가 적용된다)가 열쇠예요. 앞에서 되풀이된 <b>원리</b>(함께 결합하기)를 찾아 인간에게 그대로 옮기면 빈칸이 나와요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (7번)</span><div class=\"en\">… and we humans, <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span>,</span> have become the earth’s dominant species.</div><p class=\"ko\">우리 인간들은 ( ? ) 지구의 지배적인 종이 되었다</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>1번</em>분자들이 함께 결합해 세포가 됨</span><span><em>2번</em>세포들이 함께 결합해 더 복합적인 세포가 됨</span><span><em>3번</em>복합 세포들이 함께 결합해 다세포 생물이 됨</span></div><div class=\"ck-eq\">⇒ 세 장면의 공통점 = 함께 결합했다(joined together)</div></div><div class=\"ck-via\"><i>▼</i><span>세 장면을 한마디로 정리해 준 문장</span></div><div class=\"ck-step key\"><span class=\"lab\">4번 문장 · 결정적 단서</span><div class=\"en\">All of these evolved because the participating individuals could, <mark>by working together</mark>, spread their genetic material in new and more effective ways.</div><p class=\"ko\">관여하는 개체들이 <mark>함께 일함으로써</mark> 유전 물질을 새롭고 더 효과적인 방식으로 퍼뜨릴 수 있었기 때문에 이 모든 것이 진화했다.</p></div><div class=\"ck-via\"><i>▼</i><span>4번의 원리가 개미·늑대·사람에게도 똑같이 통한다고 이어 줘요</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 원리를 넘겨줌</span><div class=\"en\"><mark>The same principle applies</mark>.</div><p class=\"ko\"><mark>동일한 원리가 적용된다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">서로 협력함으로써<small>4번 by working together(함께 일함으로써)를 다른 말로 바꿨어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">적에 맞서 싸움으로써</span><span class=\"why\">dominant species(지배적인 종)라는 말에 끌린 함정이에요. 지문은 싸워서가 아니라 4번 by working together(함께 일함으로써)로 살아남았다고 해요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">다른 종을 연구함으로써</span><span class=\"why\">7번의 개미·늑대는 연구 대상이 아니라 6번의 같은 원리(무리 지어 함께 하기)를 보여 주는 예예요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">다양한 기계를 발명함으로써</span><span class=\"why\">기계나 발명 이야기는 지문 어디에도 없어요. 1~4번은 내내 함께 결합하는 이야기예요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">차이에 주의를 기울임으로써</span><span class=\"why\">지문은 차이를 따지지 않아요. 1~3번 joined together(함께 결합했다)처럼 합치는 것만 되풀이해요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds key\" data-ord=\"1\"><span class=\"rn\">1번 · 단서</span><div class=\"rc\"><div class=\"e\">About four billion years ago,</div><div class=\"k\">약 40억 년 전에</div></div><div class=\"rc ckc\"><div class=\"e\">molecules <span class=\"cw\">joined together</span></div><div class=\"k\">분자들은 <span class=\"cw\">함께 결합하여</span></div></div><div class=\"rc\"><div class=\"e\">to form cells.</div><div class=\"k\">세포들을 형성했다</div></div><div class=\"rnat\">약 40억 년 전에, 분자들은 함께 결합하여 세포들을 형성했다.</div><div class=\"rst\">레고 블록 하나는 혼자선 별것 아니지만, 몇 개를 끼우면 작은 덩어리가 돼요. = 지문 1번, 분자들이 <b>함께 결합해</b>(joined together) 세포가 됐어요.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">2번 · 단서</span><div class=\"rc\"><div class=\"e\">About two billion years later,</div><div class=\"k\">약 20억 년 후에</div></div><div class=\"rc\"><div class=\"e\">cells joined together</div><div class=\"k\">세포들이 함께 결합하여</div></div><div class=\"rc\"><div class=\"e\">to form more complex cells.</div><div class=\"k\">더 복합적인 세포들을 형성했다</div></div><div class=\"rnat\">약 20억 년 후에, 세포들이 함께 결합하여 더 복합적인 세포들을 형성했다.</div><div class=\"rst\">그 덩어리끼리 또 끼우면 벽이나 바퀴처럼 더 복잡한 부품이 돼요. = 지문 2번, 세포들이 모여 더 복합적인 세포가 됐다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc\"><div class=\"e\">And then a billion years later,</div><div class=\"k\">그러고는 10억 년 후에</div></div><div class=\"rc\"><div class=\"e\">these more complex cells</div><div class=\"k\">이러한 더 복합적인 세포들은</div></div><div class=\"rc\"><div class=\"e\">joined together</div><div class=\"k\">함께 결합하여</div></div><div class=\"rc\"><div class=\"e\">to form multicellular organisms.</div><div class=\"k\">다세포 생물들을 형성했다</div></div><div class=\"rnat\">그러고는 10억 년 후에, 이러한 더 복합적인 세포들은 함께 결합하여 다세포 생물들을 형성했다.</div><div class=\"rst\">부품을 다시 합치면 드디어 굴러가는 레고 자동차가 완성돼요. = 지문 3번, 복합 세포들이 모여 다세포 생물이 됐어요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">All of these evolved</div><div class=\"k\">이 모든 것(= 다세포 생물)들이 진화했다</div></div><div class=\"rc\"><div class=\"e\">because the participating individuals could,</div><div class=\"k\">관여하는 개체들이 ~할 수 있었기 때문에</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">by working together</span>,</div><div class=\"k\"><span class=\"cw\">함께 일함으로써</span></div></div><div class=\"rc\"><div class=\"e\">spread their genetic material</div><div class=\"k\">그들(= 개체들)의 유전 물질을 퍼뜨릴</div></div><div class=\"rc\"><div class=\"e\">in new and more effective ways.</div><div class=\"k\">새롭고 더 효과적인 방식들로</div></div><div class=\"rnat\">관여하는 개체들이, 함께 일함으로써, 그(개체)들의 유전 물질을 새롭고 더 효과적인 방식들로 퍼뜨릴 수 있었기 때문에, 이 모든 것(다세포 생물)들이 진화했다.</div><div class=\"rst\">블록 하나로는 못 하던 걸 <b>함께 붙어서</b> 해낸 거예요. 지문 4번도 개체들이 함께 일해서(by working together) 더 잘 퍼졌다고 정리해요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Fast-forward another billion years</div><div class=\"k\">또 다른 10억 년을 앞으로 빨리 감아</div></div><div class=\"rc\"><div class=\"e\">to our world,</div><div class=\"k\">우리의 세상(현재)으로 오면</div></div><div class=\"rc\"><div class=\"e\">which is full of social animals,</div><div class=\"k\">그 세상(= 우리의 세상)은 사회적 동물들로 가득하다</div></div><div class=\"rc\"><div class=\"e\">from ants to wolves to humans.</div><div class=\"k\">개미부터 늑대, 사람에 이르기까지</div></div><div class=\"rnat\">또 다른 10억 년을 빨리 감아 우리의 세상으로 오면, 그곳은 개미부터 늑대, 사람(에 이르기)까지 사회적 동물들로 가득하다.</div><div class=\"rst\">이제 시간을 빨리 감아 우리 반 교실로 와요. = 지문 5번, 지금 세상은 개미·늑대·사람처럼 무리 지어 사는 동물로 가득해요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">The same principle applies</span>.</div><div class=\"k\"><span class=\"cw\">동일한 원리가 적용된다</span></div></div><div class=\"rnat\">동일한 원리가 적용된다.</div><div class=\"rst\"><b>똑같은 원리</b>가 우리 반에도 통해요. = 지문 6번, 블록이 뭉치던 원리가 사회적 동물에게도 그대로 적용된다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">Ants and wolves in groups</div><div class=\"k\">개미들과 늑대들은 무리를 지어</div></div><div class=\"rc\"><div class=\"e\">can do things</div><div class=\"k\">일들을 할 수 있다</div></div><div class=\"rc\"><div class=\"e\">that no single ant or wolf can do,</div><div class=\"k\">단 한 마리의 개미나 늑대가 할 수 없는</div></div><div class=\"rc\"><div class=\"e\">and we humans,</div><div class=\"k\">그리고 우리 인간들은</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">by cooperating with one another</span>,</div><div class=\"k\"><span class=\"cw\">서로서로 협력함으로써</span> ※ 문제지엔 빈칸으로 되어 있음 (정답: cooperating with one another)</div></div><div class=\"rc\"><div class=\"e\">have become the earth’s dominant species.</div><div class=\"k\">지구의 지배적인 종이 되었다</div></div><div class=\"rnat\">개미들과 늑대들은 무리를 지어 단 한 마리의 개미나 늑대가 할 수 없는 일들을 할 수 있고, 우리 인간들은, 서로서로 협력함으로써, 지구의 지배적인 종이 되었다.</div><div class=\"rst\">혼자선 못 만드는 레고 도시도 반 친구들이 <b>서로 협력하면</b> 완성돼요. 그래서 지문은 인간이 협력해서 지구의 지배적인 종이 됐다고 해요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"molecule\" data-m=\"분자\"><b>molecule</b>분자</button><button type=\"button\" class=\"wdb\" data-w=\"multicellular organism\" data-m=\"다세포 생물\"><b>multicellular organism</b>다세포 생물</button><button type=\"button\" class=\"wdb\" data-w=\"evolve\" data-m=\"진화하다\"><b>evolve</b>진화하다</button><button type=\"button\" class=\"wdb\" data-w=\"genetic material\" data-m=\"유전 물질\"><b>genetic material</b>유전 물질</button><button type=\"button\" class=\"wdb\" data-w=\"fast-forward\" data-m=\"(시간을) 빨리 감다\"><b>fast-forward</b>(시간을) 빨리 감다</button><button type=\"button\" class=\"wdb\" data-w=\"dominant species\" data-m=\"지배적인 종\"><b>dominant species</b>지배적인 종</button></div>", "08": "<p class=\"mtr\">마더텅 정답률 <b>80%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸 문장이 <b>Therefore</b>(따라서)로 시작하니 결론이에요. 바로 뒤 3번이 <b>who we are</b>(우리가 어떤 사람인지), <b>you and no one else</b>(다른 누구도 아닌 당신)로 같은 말을 풀어 줘요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (2번)</span><div class=\"en\"><mark>Therefore</mark>, designing a home is <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span>.</span></div><p class=\"ko\"><mark>따라서</mark> 집을 디자인하는 것은 ( ? )이다</p></div><div class=\"ck-via\"><i>▼</i><span>Therefore(따라서)가 받는 이유: 집은 나의 감정을 표현하는 곳</span></div><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 앞 근거</span><div class=\"en\">… it is also the safe place where we can <mark>express our feelings</mark> …</div><p class=\"ko\">그것(= 집)은 또한 <mark>우리의 감정을 표현할 수 있는</mark> 안전한 장소이다 …</p></div><div class=\"ck-via\"><i>▼</i><span>빈칸 바로 뒤에서 결론을 다른 말로 풀어 줘요</span></div><div class=\"ck-step key\"><span class=\"lab\">3번 문장 · 결정적 단서</span><div class=\"en\">I strongly believe that a home provides a canvas on which we can illustrate <mark>who we are</mark>; your space should <mark>look like you and no one else</mark> …</div><p class=\"ko\">집은 그 위에 <mark>우리가 어떤 사람인지</mark> 보여 줄 수 있는 캔버스를 제공한다; 당신의 공간은 다른 어떤 사람도 아닌 <mark>당신을 닮아야 한다</mark> …</p></div><div class=\"ck-via\"><i>▼</i><span>디자이너가 일할 때도 고객 개인의 이야기와 취향이 중심</span></div><div class=\"ck-step\"><span class=\"lab\">4번 문장 · 한 번 더 확인</span><div class=\"en\">I prefer to work with clients who have <mark>an opinion and a story</mark>, … to be the best possible version of <mark>their taste</mark>.</div><p class=\"ko\">나는 <mark>의견과 이야기를</mark> 가진 고객들과 작업하는 것을 선호하고 … <mark>그들(= 고객들)의 취향</mark>에 맞는 가능한 최선의 버전이 되길 원한다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">매우 개인적인 작업<small>3번 who we are(우리가 어떤 사람인지)·you and no one else(다른 누구도 아닌 당신)를 한마디로 묶었어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">최신 유행의 반영</span><span class=\"why\">정반대예요. 남들 따라 하는 유행이 아니라 3번에서 you and no one else(다른 누구도 아닌 당신)를 닮아야 한다고 했어요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">길고 스트레스가 많은 여정</span><span class=\"why\">오래 걸리거나 힘들다는 말이 없어요. 1번은 집을 오히려 safe place(안전한 장소)라고 해요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">대단히 비용이 많이 드는 일</span><span class=\"why\">돈 이야기는 지문에 없어요. 3번 interior designer(인테리어 디자이너)도 비용이 아니라 그래도 나를 닮아야 한다는 말이에요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">지식을 쌓아 가는 과정</span><span class=\"why\">배우는 이야기가 아니에요. 3번은 집을 배우는 곳이 아니라 나를 보여 주는 canvas(캔버스)라고 해요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">While a home provides shelter and a place to gather,</div><div class=\"k\">집은 피난처와 모이는 장소를 제공하면서</div></div><div class=\"rc\"><div class=\"e\">it is also the safe place</div><div class=\"k\">그것(= 집)은 또한 안전한 장소이다</div></div><div class=\"rc\"><div class=\"e\">where we can express our feelings</div><div class=\"k\">우리가 우리의 감정을 표현할 수 있는</div></div><div class=\"rc\"><div class=\"e\">and enjoy some of the most important and meaningful events in our lives.</div><div class=\"k\">그리고 우리 삶에서 가장 중요하고 의미 있는 일들 중 일부를 즐길 수 있는</div></div><div class=\"rnat\">집은 피난처와 모이는 장소를 제공하면서, 그것은 또한 우리가 우리의 감정을 표현하고 우리의 삶에 있어서 가장 중요하고 의미 있는 일들 중 일부를 즐길 수 있는 안전한 장소이다.</div><div class=\"rst\">내 방은 쉬고 친구랑 모이는 곳이자 마음껏 웃고 울 수 있는 곳이에요. = 지문 1번, 집은 감정을 표현하고 중요한 일을 즐기는 안전한 장소예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Therefore,</div><div class=\"k\">따라서</div></div><div class=\"rc\"><div class=\"e\">designing a home is</div><div class=\"k\">집을 디자인하는 것은</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">a very personal venture</span>.</div><div class=\"k\"><span class=\"cw\">매우 개인적인 모험이다</span> ※ 문제지엔 빈칸으로 되어 있음 (정답: a very personal venture)</div></div><div class=\"rnat\">따라서, 집을 디자인하는 것은 매우 개인적인 모험이다.</div><div class=\"rst\"><b>그래서</b>(Therefore) 내 방을 꾸미는 건 <b>나만의 일</b>이에요. = 지문 2번, 집을 디자인하는 건 매우 개인적인 일(빈칸)이에요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc\"><div class=\"e\">I strongly believe</div><div class=\"k\">나는 굳게 믿는다</div></div><div class=\"rc\"><div class=\"e\">that a home provides a canvas</div><div class=\"k\">집은 캔버스를 제공한다고</div></div><div class=\"rc ckc\"><div class=\"e\">on which we can illustrate <span class=\"cw\">who we are</span>;</div><div class=\"k\">그 위에 <span class=\"cw\">우리가 어떤 사람인지</span> 보여 줄 수 있는</div></div><div class=\"rc ckc\"><div class=\"e\">your space should <span class=\"cw\">look like you and no one else</span></div><div class=\"k\">당신의 공간은 <span class=\"cw\">당신을 닮아야 한다</span>, 다른 어떤 사람도 아닌</div></div><div class=\"rc\"><div class=\"e\">— even if you are using an interior designer.</div><div class=\"k\">당신이 인테리어 디자이너를 쓰고 있을지라도</div></div><div class=\"rnat\">나는 집은 우리가 어떤 사람인지 그 위에 보여줄 수 있는 캔버스를 제공한다고 굳게 믿고 있으며, 당신이 인테리어 디자이너를 쓰고(고용하고) 있을지라도 당신의 공간은 다른 어떤 사람도 아닌 당신을 닮아야 한다.</div><div class=\"rst\">벽의 포스터, 책상 위 피규어가 ‘나는 이런 사람’이라고 말해 줘요. 지문 3번도 집은 <b>나를 그리는 캔버스</b>이고, 남이 아닌 나를 닮아야 한다고 해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">While some designers love</div><div class=\"k\">어떤 디자이너들은 좋아하지만</div></div><div class=\"rc\"><div class=\"e\">a blank slate</div><div class=\"k\">백지 상태를</div></div><div class=\"rc\"><div class=\"e\">and the freedom to do whatever they want,</div><div class=\"k\">그리고 그들이 원하는 무엇이든지 할 수 있는 자유를</div></div><div class=\"rc\"><div class=\"e\">I prefer to work with clients</div><div class=\"k\">나는 고객들과 작업하는 것을 선호한다</div></div><div class=\"rc\"><div class=\"e\">who have an opinion and a story,</div><div class=\"k\">의견과 이야기를 가진</div></div><div class=\"rc\"><div class=\"e\">and I always want the end result</div><div class=\"k\">그리고 나는 언제나 최종 결과물이 ~이길 원한다</div></div><div class=\"rc ckc\"><div class=\"e\">to be the best possible version of <span class=\"cw\">their taste</span>.</div><div class=\"k\"><span class=\"cw\">그들(= 고객들)의 취향</span>에 맞는 가능한 최선의 버전</div></div><div class=\"rnat\">어떤 디자이너들은 백지 상태와 그들이 원하는 무엇이든지 할 수 있는 자유를 좋아하지만, 나는 의견과 이야기를 가진 고객들과 작업하는 것을 선호하고, 나는 언제나 최종 결과물이 그들의 취향에 맞는 가능한 최선의 버전이 되길 원한다.</div><div class=\"rst\">가족이 도와줘도 내 취향을 물어보고 꾸며 주면 제일 좋아요. = 지문 4번, 글쓴이는 고객의 이야기를 살려 그 <b>취향</b>의 최고 버전을 만들고 싶어 해요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"shelter\" data-m=\"쉴 곳, 은신처\"><b>shelter</b>쉴 곳, 은신처</button><button type=\"button\" class=\"wdb\" data-w=\"canvas\" data-m=\"캔버스, 화폭\"><b>canvas</b>캔버스, 화폭</button><button type=\"button\" class=\"wdb\" data-w=\"illustrate\" data-m=\"그려 보이다, 보여 주다\"><b>illustrate</b>그려 보이다, 보여 주다</button><button type=\"button\" class=\"wdb\" data-w=\"blank slate\" data-m=\"백지 상태\"><b>blank slate</b>백지 상태</button><button type=\"button\" class=\"wdb\" data-w=\"taste\" data-m=\"취향\"><b>taste</b>취향</button><button type=\"button\" class=\"wdb\" data-w=\"venture\" data-m=\"시도, 모험적인 일\"><b>venture</b>시도, 모험적인 일</button></div>", "09": "<p class=\"mtr\">마더텅 정답률 <b>70%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">삽입은 주어진 문장의 <b>연결 신호</b>를 잡는 문제. <b>However</b>(그러나)로 카페인의 <b>좋은 점 → 한계</b>가 뒤집히니, 칭찬이 끝나고 수면 부족 이야기가 시작되는 자리를 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">주어진 문장 · 연결 신호</span><div class=\"en\"><mark>However</mark>, using caffeine to improve alertness and mental performance <mark>doesn’t replace</mark> getting a good night’s sleep.</div><p class=\"ko\"><mark>그러나</mark> 각성도와 정신적인 수행 능력을 높이기 위해 카페인을 이용하는 것은 숙면을 취하는 것을 <mark>대체하지 못한다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>2·3·4번 내내 카페인의 좋은 점, 여기서 칭찬이 끝나요</span></div><div class=\"ck-step\"><span class=\"lab\">4번 · 앞 문장 (③ 바로 앞)</span><div class=\"en\">As little as 60mg … can lead to <mark>a faster reaction time</mark>.</div><p class=\"ko\">60mg만큼 적은 양도 … <mark>더 빠른 반응 시간</mark>으로 이어질 수 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>but(그러나)으로 한계가 처음 나오고, little sleep(적은 수면)이 주어진 문장의 good night’s sleep(숙면)을 받아요</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 · 뒤 문장 (③ 바로 뒤)</span><div class=\"en\">One study from 2018 showed that coffee improved reaction times … <mark>but</mark> caffeine seemed to increase errors <mark>in the group with little sleep</mark>.</div><p class=\"ko\">2018년의 한 연구는 커피가 반응 시간을 향상시켰다는 것을 보여 주었다 … <mark>그러나</mark> 카페인은 <mark>수면이 부족한 집단에서</mark> 오류를 증가시키는 것처럼 보였다.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>2~4번</em>두통 치료·하루 종일 각성·빠른 반응 = 좋은 점</span><span><em>주어진 문장</em>그러나 숙면은 대체 못 함</span><span><em>5~7번</em>잠 부족하면 오류 증가·점수 낮음 = 한계</span></div><div class=\"ck-eq\">⇒ 좋은 점 → 전환 → 한계, 흐름이 바뀌는 자리 = ③</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">4번 문장과 5번 문장 사이<small>카페인 칭찬이 끝나고 수면 부족의 한계가 시작되는 곳이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">5번 문장과 6번 문장 사이</span><span class=\"why\">6번 Additionally(게다가)·this study(이 연구)와 어울려 보이지만, 한계는 이미 5번 but(그러나)에서 시작됐어요. 전환 신호는 한계가 처음 나오기 전에 와야 해요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">2번 문장과 3번 문장 사이</span><span class=\"why\">3번 also(마찬가지로)가 2번의 좋은 점에 또 좋은 점을 더해요. 그 사이에 However(그러나)가 끼면 칭찬 흐름이 끊겨요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">3번 문장과 4번 문장 사이</span><span class=\"why\">4번 차 한 잔 양의 카페인으로도 반응이 빨라진다는 말은 3번 각성 효과를 이어 가는 좋은 점이에요. 아직 뒤집을 때가 아니에요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">6번 문장과 7번 문장 사이</span><span class=\"why\">7번 It(이것)은 5·6번 연구 결과를 받아 결론을 내는 문장이에요. 사이에 끼면 It(이것)이 가리킬 연구 결과와 떨어져요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds key\" data-ord=\"1\"><span class=\"rn\">1번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">However</span>,</div><div class=\"k\"><span class=\"cw\">그러나</span></div></div><div class=\"rc\"><div class=\"e\">using caffeine</div><div class=\"k\">카페인을 이용하는 것은</div></div><div class=\"rc\"><div class=\"e\">to improve alertness and mental performance</div><div class=\"k\">각성도와 정신적인 수행 능력을 높이기 위해</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">doesn’t replace</span></div><div class=\"k\"><span class=\"cw\">대체하지 못한다</span></div></div><div class=\"rc\"><div class=\"e\">getting a good night’s sleep.</div><div class=\"k\">숙면을 취하는 것을</div></div><div class=\"rnat\">[주어진 문장] 그러나 각성도와 정신적인 수행 능력을 높이기 위해 카페인을 이용하는 것은 숙면을 취하는 것을 대체하지 못한다.</div><div class=\"rst\">〈주어진 문장〉 <b>그러나</b>(However) 커피로 정신을 번쩍 들게 해도 밤에 푹 자는 걸 <b>대신할 수는 없어요</b>. = 지문의 ‘카페인은 숙면을 대체하지 못한다’.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Studies have consistently shown</div><div class=\"k\">연구들은 지속적으로 보여 주었다</div></div><div class=\"rc\"><div class=\"e\">caffeine to be effective</div><div class=\"k\">카페인이 효과적이라는 것을</div></div><div class=\"rc\"><div class=\"e\">when used together with a pain reliever</div><div class=\"k\">진통제와 함께 사용되었을 때</div></div><div class=\"rc\"><div class=\"e\">to treat headaches.</div><div class=\"k\">두통을 치료하기 위해</div></div><div class=\"rnat\">연구들은 두통을 치료하기 위해 진통제와 함께 사용(복용)되었을 때 카페인이 효과적이라는 것을 지속적으로 보여 주었다.</div><div class=\"rst\">고등학생 형은 머리가 아플 때 진통제랑 커피를 같이 먹으면 잘 듣는대요. = 지문 2번, 카페인은 진통제와 함께 쓰면 두통에 효과적이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">The positive correlation</div><div class=\"k\">양의 상관관계는</div></div><div class=\"rc\"><div class=\"e\">between caffeine intake and staying alert throughout the day</div><div class=\"k\">카페인 섭취량과 하루 종일 각성 상태로 있는 것 사이의</div></div><div class=\"rc\"><div class=\"e\">has also been well established.</div><div class=\"k\">마찬가지로 잘 확립되어 있다</div></div><div class=\"rnat\">카페인 섭취량과 하루 종일 각성 상태로 있는 것 사이의 양의 상관관계는 마찬가지로 잘 확립되어 있다.</div><div class=\"rst\">커피를 마신 날 형은 하루 종일 졸지 않고 수업에 집중해요. 지문 3번도 카페인 섭취와 깨어 있는 상태가 함께 간다고 해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">As little as 60mg</div><div class=\"k\">60mg만큼 적은 양도</div></div><div class=\"rc\"><div class=\"e\">(the amount typically in one cup of tea)</div><div class=\"k\">(일반적으로 차 한 잔에 든 양인)</div></div><div class=\"rc\"><div class=\"e\">can lead to a faster reaction time.</div><div class=\"k\">더 빠른 반응 시간으로 이어질 수 있다</div></div><div class=\"rnat\">(일반적으로 차 한 잔에 든 양인) 60mg만큼 적은 양도 더 빠른 반응 시간(속도)으로 이어질 수 있다.</div><div class=\"rst\">차 한 잔 정도만 마셔도 형의 손이 게임에서 더 빨라져요. = 지문 4번, 적은 양으로도 반응 시간이 빨라진다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">One study from 2018 showed</div><div class=\"k\">2018년의 한 연구는 보여 주었다</div></div><div class=\"rc\"><div class=\"e\">that coffee improved reaction times</div><div class=\"k\">커피가 반응 시간을 향상시켰다는 것을</div></div><div class=\"rc\"><div class=\"e\">in those with or without poor sleep,</div><div class=\"k\">수면이 부족하거나 부족하지 않은 사람들의</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">but caffeine seemed to increase errors</span></div><div class=\"k\"><span class=\"cw\">그러나 카페인은 오류를 증가시키는 것처럼 보였다</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">in the group with little sleep</span>.</div><div class=\"k\"><span class=\"cw\">수면이 부족한 집단에서</span></div></div><div class=\"rnat\">2018년의 한 연구는 커피가 수면이 부족하거나 부족하지 않은 사람들의 반응 시간(속도)을 향상시켰다는 것을 보여 주었으나, 카페인은 수면이 부족한 집단에서 오류를 증가시키는 것처럼 보였다.</div><div class=\"rst\">그런데 밤새우고 커피 마신 날은 빨라지긴 해도 실수가 늘어요. 지문 5번의 <b>잠 부족 집단에서 오류가 늘었다</b>는 바로 그 한계예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Additionally,</div><div class=\"k\">게다가</div></div><div class=\"rc\"><div class=\"e\">this study showed</div><div class=\"k\">이 연구는 보여 주었다</div></div><div class=\"rc\"><div class=\"e\">that even with caffeine,</div><div class=\"k\">카페인을 섭취하였더라도</div></div><div class=\"rc\"><div class=\"e\">the group with little sleep</div><div class=\"k\">수면이 부족한 집단은</div></div><div class=\"rc\"><div class=\"e\">did not score as well</div><div class=\"k\">점수를 잘 얻지 못했다는 것을</div></div><div class=\"rc\"><div class=\"e\">as those with adequate sleep.</div><div class=\"k\">충분한 수면을 취한 사람들만큼</div></div><div class=\"rnat\">게다가 이 연구는 카페인을 섭취하였더라도 수면이 부족한 집단은 충분한 수면을 취한 사람들만큼 점수를 얻지 못했다는 것을 보여 주었다.</div><div class=\"rst\"><b>게다가</b>(Additionally) 커피를 마셔도 푹 잔 친구보다 시험 점수가 낮아요. = 지문 6번, 잠이 부족한 집단은 충분히 잔 사람만큼 점수를 못 받았어요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">It suggests</div><div class=\"k\">이것(= 앞의 연구 결과)은 시사한다</div></div><div class=\"rc\"><div class=\"e\">that caffeine does not fully make up for</div><div class=\"k\">카페인이 완전히 보상하지 못한다는 것을</div></div><div class=\"rc\"><div class=\"e\">inadequate sleep.</div><div class=\"k\">불충분한 수면을</div></div><div class=\"rnat\">이것은 카페인이 불충분한 수면을 완전히 보상하지 못한다는 것을 시사한다.</div><div class=\"rst\">결국 커피는 못 잔 잠을 다 채워 주지 못해요. 지문 7번 결론이 주어진 문장의 ‘숙면을 대체 못 한다’와 같은 말이에요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"alertness\" data-m=\"각성 상태\"><b>alertness</b>각성 상태</button><button type=\"button\" class=\"wdb\" data-w=\"pain reliever\" data-m=\"진통제\"><b>pain reliever</b>진통제</button><button type=\"button\" class=\"wdb\" data-w=\"correlation\" data-m=\"상관관계\"><b>correlation</b>상관관계</button><button type=\"button\" class=\"wdb\" data-w=\"reaction time\" data-m=\"반응 시간\"><b>reaction time</b>반응 시간</button><button type=\"button\" class=\"wdb\" data-w=\"adequate\" data-m=\"충분한\"><b>adequate</b>충분한</button><button type=\"button\" class=\"wdb\" data-w=\"make up for\" data-m=\"~을 보충하다, 메우다\"><b>make up for</b>~을 보충하다, 메우다</button></div>", "10": "<p class=\"mtr\">마더텅 정답률 <b>40%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">순서 문제는 <b>고리</b>를 찾는 문제예요. (B)의 <b>that difference</b>(그런 차이)가 건강 격차를 받고, (B) 끝 <b>질문</b>에 (A)가 <b>답</b>하고, (C)의 <b>such responses</b>(그런 반응)가 (A)의 스트레스 반응을 받아요.</p><div class=\"ck-step\"><span class=\"lab\">주어진 글 끝</span><div class=\"en\">Members of minority groups in general have <mark>poorer health outcomes</mark> than the majority group.</div><p class=\"ko\">일반적으로 소수 집단의 구성원들은 다수 집단보다 <mark>더 나쁜 건강 결과를</mark> 갖는다.</p></div><div class=\"ck-via\"><i>▼</i><span>that difference(그런 차이) = 위의 소수·다수 집단의 건강 격차</span></div><div class=\"ck-step key\"><span class=\"lab\">(B) · 첫 번째 고리</span><div class=\"en\">But <mark>that difference</mark> remains even when obvious factors … are controlled for.</div><p class=\"ko\">그러나 <mark>그런 차이</mark>는 명백한 요인들이 통제될 때에도 남아 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>질문이 나오면 바로 다음에는 답이 와야 해요</span></div><div class=\"ck-step\"><span class=\"lab\">(B) 끝 · 질문</span><div class=\"en\"><mark>How could that be the case?</mark></div><p class=\"ko\"><mark>그것이 어떻게 사실일 수 있을까?</mark></p></div><div class=\"ck-via\"><i>▼</i><span>(B) 끝 질문에 대한 답 = 스트레스</span></div><div class=\"ck-step key\"><span class=\"lab\">(A) · 두 번째 고리</span><div class=\"en\"><mark>One possible answer</mark> is stress.</div><p class=\"ko\"><mark>하나의 가능한 답은</mark> 스트레스이다.</p></div><div class=\"ck-via\"><i>▼</i><span>such responses(그런 반응) = (A)의 stress responses(스트레스 반응)</span></div><div class=\"ck-step key\"><span class=\"lab\">(C) · 세 번째 고리</span><div class=\"en\">Minority individuals have many encounters with majority individuals, each of which may trigger <mark>such responses</mark>.</div><p class=\"ko\">소수 집단의 개인들은 다수 집단의 개인들과 많은 만남을 갖는데, 각각이 <mark>그런(= 스트레스) 반응을</mark> 유발할 수 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">(B) – (A) – (C)<small>그런 차이 → 질문과 답 → 그런 반응, 세 고리가 모두 맞아요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">(B) – (C) – (A)</span><span class=\"why\">(B) 끝 질문 How could that be the case(그것이 어떻게 사실일까)? 뒤에 답 (A)가 아니라 (C)가 오면, such responses(그런 반응)가 가리킬 스트레스 반응이 아직 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">(A) – (C) – (B)</span><span class=\"why\">(A) One possible answer(하나의 가능한 답)가 주어진 글 바로 뒤에 오면 답할 질문이 없어요. 질문은 (B) 끝에 있어요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">(C) – (A) – (B)</span><span class=\"why\">(C)의 such responses(그런 반응)가 가리킬 스트레스 반응이 주어진 글에 없어요. 주어진 글은 건강 격차까지만 말해요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">(C) – (B) – (A)</span><span class=\"why\">(C)가 먼저 오면 such responses(그런 반응)가 받을 말이 없고, (B)의 that difference(그런 차이)도 건강 격차와 멀리 떨어져요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><span class=\"ordc\">정답 순서 주어진 글</span><div class=\"rc\"><div class=\"e\">Many studies have shown</div><div class=\"k\">많은 연구들이 보여주었다</div></div><div class=\"rc\"><div class=\"e\">that people’s health and subjective well-being</div><div class=\"k\">사람들의 건강과 주관적인 웰빙은</div></div><div class=\"rc\"><div class=\"e\">are affected by ethnic relations.</div><div class=\"k\">민족적인 관계에 영향을 받는다는 것을</div></div><div class=\"rnat\">많은 연구들이 사람들의 건강과 주관적인 웰빙은 민족적인 관계에 영향을 받는다는 것을 보여주었다.</div><div class=\"rst\">반에서 내가 어떤 무리에 속하느냐가 기분과 몸 상태까지 바꿔요. = 지문 1번, 건강과 행복이 집단 사이의 관계에 영향을 받는다는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><span class=\"ordc\">정답 순서 주어진 글</span><div class=\"rc\"><div class=\"e\">Members of minority groups in general</div><div class=\"k\">일반적으로 소수 집단의 구성원들은</div></div><div class=\"rc\"><div class=\"e\">have poorer health outcomes</div><div class=\"k\">더 나쁜 건강 결과를 갖는다</div></div><div class=\"rc\"><div class=\"e\">than the majority group.</div><div class=\"k\">다수 집단보다</div></div><div class=\"rnat\">일반적으로 소수 집단의 구성원들은 다수 집단보다 더 나쁜 건강 결과를 갖는다(건강이 더 나쁘다).</div><div class=\"rst\">몇 명뿐인 전학생 무리, 즉 <b>소수</b> 아이들이 다수 아이들보다 더 자주 아파요. = 지문 2번, 소수 집단은 다수 집단보다 건강 결과가 나빠요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">3번 · 단서</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc ckc\"><div class=\"e\">(A) <span class=\"cw\">One possible answer</span></div><div class=\"k\">(A) <span class=\"cw\">하나의 가능한 답은</span></div></div><div class=\"rc\"><div class=\"e\">is stress.</div><div class=\"k\">스트레스이다</div></div><div class=\"rnat\">(A) 하나의 가능한 답은 스트레스이다.</div><div class=\"rst\"><b>답은 스트레스</b>(stress)예요. = 지문 3번, (B) 끝 질문에 (A)가 바로 답해요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">4번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">From multiple physiological studies,</div><div class=\"k\">다수의 생리학 연구로부터</div></div><div class=\"rc\"><div class=\"e\">we know that encounters</div><div class=\"k\">우리는 만남이 ~라는 것을 안다</div></div><div class=\"rc\"><div class=\"e\">with members of other ethnic-racial categories,</div><div class=\"k\">다른 민족적-인종적 범주의 구성원들과의</div></div><div class=\"rc\"><div class=\"e\">even in the relatively safe environment of laboratories,</div><div class=\"k\">심지어는 상대적으로 안전한 실험실 환경에서조차</div></div><div class=\"rc\"><div class=\"e\">trigger stress responses.</div><div class=\"k\">스트레스 반응을 유발한다</div></div><div class=\"rnat\">다수의 생리학 연구로부터, 우리는 다른 민족적-인종적 범주의 구성원들과의 만남이 심지어는 상대적으로 안전한 실험실 환경에서조차 스트레스 반응을 유발한다는 것을 안다.</div><div class=\"rst\">낯선 무리 아이와 마주치면 안전한 교실에서도 가슴이 콩닥거려요. = 지문 4번, 다른 집단과의 만남이 실험실에서조차 스트레스 반응을 일으켜요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">5번 · 단서</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc ckc\"><div class=\"e\">(B) But <span class=\"cw\">that difference</span> remains</div><div class=\"k\">(B) 그러나 <span class=\"cw\">그런 차이</span>(= 소수 집단과 다수 집단의 건강 결과 차이)는 남아 있다</div></div><div class=\"rc\"><div class=\"e\">even when obvious factors,</div><div class=\"k\">심지어 명백한 요인들이</div></div><div class=\"rc\"><div class=\"e\">such as social class and access to medical services</div><div class=\"k\">사회 계층과 의료 서비스에 대한 접근성과 같은</div></div><div class=\"rc\"><div class=\"e\">are controlled for.</div><div class=\"k\">통제될 때에도</div></div><div class=\"rnat\">(B) 그러나 그런 차이는 심지어 사회 계층과 의료 서비스에 대한 접근성과 같은 명백한 요인들이 통제될 때에도 남아 있다.</div><div class=\"rst\"><b>그런 차이</b>(that difference)는 집이 잘사는지, 병원이 가까운지를 똑같이 맞춰도 남아요. = 지문 5번, 명백한 요인을 통제해도 차이가 남아요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">6번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">This suggests</div><div class=\"k\">이것(= 명백한 요인을 통제해도 그 차이가 남는다는 사실)은 암시한다</div></div><div class=\"rc\"><div class=\"e\">that dominance relations</div><div class=\"k\">우세 관계가</div></div><div class=\"rc\"><div class=\"e\">have their own effect on people’s health.</div><div class=\"k\">사람들의 건강에 그 나름의 영향을 끼친다는 것을</div></div><div class=\"rnat\">이것은 우세 관계가 사람들의 건강에 그 나름의 영향을 끼친다는 것을 암시한다.</div><div class=\"rst\">그러니 누가 다수고 누가 소수인지, 그 관계 자체가 건강에 영향을 준다는 뜻이에요. = 지문 6번, 우세 관계가 건강에 나름의 영향을 끼쳐요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">7번 · 단서</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">How could that be the case?</span></div><div class=\"k\"><span class=\"cw\">그것이 어떻게 사실일 수 있을까?</span></div></div><div class=\"rnat\">그것이 어떻게 사실일 수 있을까?</div><div class=\"rst\"><b>그게 어떻게 가능할까요?</b> 질문이 나왔으니 바로 다음엔 답이 와야 해요. = 지문 7번, (B)는 질문으로 끝나요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">(C) Minority individuals have many encounters</div><div class=\"k\">(C) 소수 집단의 개인들은 많은 만남을 갖는다</div></div><div class=\"rc\"><div class=\"e\">with majority individuals,</div><div class=\"k\">다수 집단의 개인들과</div></div><div class=\"rc\"><div class=\"e\">each of which</div><div class=\"k\">그 만남들(= 소수 집단과 다수 집단 개인 사이의 만남) 각각이</div></div><div class=\"rc ckc\"><div class=\"e\">may trigger <span class=\"cw\">such responses</span>.</div><div class=\"k\"><span class=\"cw\">그런(= 스트레스) 반응을</span> 유발할 수 있다</div></div><div class=\"rnat\">(C) 소수 집단의 개인들은 다수 집단의 개인들과 많은 만남을 갖는데, 각각의 만남이 그런(스트레스) 반응을 유발할 수 있다.</div><div class=\"rst\">전학생은 하루에도 다수 아이들을 수없이 마주치고, 그때마다 <b>그런 반응</b>(such responses)이 생길 수 있어요. = 지문 8번.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">However minimal these effects may be,</div><div class=\"k\">이런 영향이 아무리 작을지라도</div></div><div class=\"rc\"><div class=\"e\">their frequency may increase total stress,</div><div class=\"k\">그것들(= 만남)의 빈번한 발생은 전체적인 스트레스를 증가시킬 수도 있으며</div></div><div class=\"rc\"><div class=\"e\">which would account for</div><div class=\"k\">이것(= 만남이 잦아 전체 스트레스가 커지는 것)은 ~을 설명할 것이다</div></div><div class=\"rc\"><div class=\"e\">part of the health disadvantage</div><div class=\"k\">건강상 불이익의 일부를</div></div><div class=\"rc\"><div class=\"e\">of minority individuals.</div><div class=\"k\">소수 집단의 개인들의</div></div><div class=\"rnat\">이런 영향이 아무리 작을지라도, 그것들(만남)의 빈번한 발생은 전체적인 스트레스를 증가시킬 수도 있으며, 이것은 소수 집단의 개인들의 건강상 불이익의 일부를 설명할 것이다.</div><div class=\"rst\">한 번은 작아도 매일 쌓이면 큰 스트레스가 돼요. 지문 9번은 이게 소수 집단의 건강 불이익을 일부 설명해 준다고 해요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"subjective well-being\" data-m=\"주관적 행복(웰빙)\"><b>subjective well-being</b>주관적 행복(웰빙)</button><button type=\"button\" class=\"wdb\" data-w=\"controlled for\" data-m=\"(변수로) 통제된\"><b>controlled for</b>(변수로) 통제된</button><button type=\"button\" class=\"wdb\" data-w=\"physiological\" data-m=\"생리학적인\"><b>physiological</b>생리학적인</button><button type=\"button\" class=\"wdb\" data-w=\"encounter\" data-m=\"만남, 마주침\"><b>encounter</b>만남, 마주침</button><button type=\"button\" class=\"wdb\" data-w=\"trigger\" data-m=\"유발하다\"><b>trigger</b>유발하다</button><button type=\"button\" class=\"wdb\" data-w=\"account for\" data-m=\"~을 설명하다\"><b>account for</b>~을 설명하다</button></div>", "11": "<p class=\"mtr\">마더텅 정답률 <b>75%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">제목은 <b>대조 신호</b>와 <b>조건 문장</b>을 묶어 찾으세요. 6번 <b>something else</b>(또 다른 것)로 똑똑함 말고 <b>질문하는 능력</b>이 나오고, 8번 <b>To be a great scientist</b>(위대한 과학자가 되려면)가 그 조건을 못 박아요.</p><div class=\"ck-step\"><span class=\"lab\">3번 문장 · 첫 번째 공통점</span><div class=\"en\">Well, <mark>for one thing</mark>, they’re all very smart.</div><p class=\"ko\"><mark>우선 한 가지로는</mark> 그들은 모두 매우 똑똑하다.</p></div><div class=\"ck-via\"><i>▼</i><span>something else(또 다른 것)로 똑똑함 말고 과학자를 구분해 준 것을 꺼내요</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 진짜 차이</span><div class=\"en\">There is <mark>something else</mark> they all had in common that set them apart … — <mark>their ability to ask questions</mark>.</div><p class=\"ko\">그들 모두가 공통적으로 갖고 있던 <mark>또 다른 것</mark>이 있다 … 바로 <mark>질문을 하는 그들의 능력</mark>이다.</p></div><div class=\"ck-via\"><i>▼</i><span>좋은 두뇌 하나로는 안 된다고 한 번 더 확인해요</span></div><div class=\"ck-step\"><span class=\"lab\">7번 문장 · 똑똑함만으론 부족</span><div class=\"en\"><mark>Just having a good brain isn’t always enough</mark>.</div><p class=\"ko\"><mark>단지 좋은 두뇌를 갖는 것이 항상 충분한 것은 아니다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>위대한 과학자가 되는 조건을 직접 말해요 = 제목의 답</span></div><div class=\"ck-step key\"><span class=\"lab\">8번 문장 · 결정적 조건</span><div class=\"en\"><mark>To be a great scientist</mark>, you need to be able to look at a problem … and <mark>ask the question in a new way</mark>.</div><p class=\"ko\"><mark>위대한 과학자가 되기 위해서</mark> 당신은 문제를 볼 수 있어야 하고 … <mark>새로운 방식으로 질문할 수 있어야 한다</mark>.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>3번</em>모두 매우 똑똑함</span><span><em>6·8번</em>새로운 방식으로 질문하는 능력</span><span><em>11번</em>지성과 호기심을 함께 가짐</span></div><div class=\"ck-eq\">⇒ 글 전체 = 위대한 과학자가 되는 조건(똑똑함 + 질문하는 힘)</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">위대한 과학자가 되려면 무엇이 필요한가?<small>8번 To be a great scientist(위대한 과학자가 되려면)를 그대로 질문으로 바꿨어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">감정이 없으면 지능도 없다</span><span class=\"why\">[지문에 없음] 11번 intelligence(지성)만 따온 함정이에요. 지문은 감정이 아니라 curiosity(호기심)를 지성과 함께 가져야 한다고 해요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">과학: 독인가 약인가?</span><span class=\"why\">[지문에 없음] 과학이 해로운지 이로운지 따지는 문장이 하나도 없어요. 글은 처음부터 끝까지 과학자의 조건 이야기예요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">더 나은 미래를 위해 당신의 재능을 나누어라</span><span class=\"why\">[지문에 없음] 재능을 남과 나눈다는 말은 없어요. 6번은 과학자를 구분해 주는(set them apart) 질문하는 능력을 말해요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">예술 속의 과학, 과학 속의 예술</span><span class=\"why\">[지문에 없음] 예술은 한 번도 안 나와요. 1번의 과학자 이름들도 예술 이야기가 아니라 공통점을 찾기 위한 예예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Think of the most famous scientists</div><div class=\"k\">가장 유명한 과학자들을 생각해보아라</div></div><div class=\"rc\"><div class=\"e\">you know</div><div class=\"k\">당신이 알고 있는</div></div><div class=\"rc\"><div class=\"e\">— Isaac Newton, Louis Pasteur, Albert Einstein,</div><div class=\"k\">아이작 뉴턴, 루이 파스퇴르, 알베르트 아인슈타인</div></div><div class=\"rc\"><div class=\"e\">Thomas Edison, Pierre and Marie Curie,</div><div class=\"k\">토머스 에디슨, 피에르 퀴리와 마리 퀴리 부부</div></div><div class=\"rc\"><div class=\"e\">Stephen Hawking, and so on.</div><div class=\"k\">스티븐 호킹 등</div></div><div class=\"rnat\">Isaac Newton(아이작 뉴턴), Louis Pasteur(루이 파스퇴르), Albert Einstein(알베르트 아인슈타인), Thomas Edison(토머스 에디슨), Pierre and Marie Curie(피에르 퀴리와 마리 퀴리 부부), Stephen Hawking(스티븐 호킹) 등 당신이 알고 있는 가장 유명한 과학자들을 생각해보아라.</div><div class=\"rst\">우리 학교에서 공부 잘하기로 유명한 선배들을 떠올려 봐요. = 지문 1번, 뉴턴·아인슈타인·퀴리 부부 같은 유명한 과학자들을 생각해 보라는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">What do all these people</div><div class=\"k\">이 사람들 모두가</div></div><div class=\"rc\"><div class=\"e\">have in common?</div><div class=\"k\">공통적으로 갖고 있는 것은 무엇일까?</div></div><div class=\"rnat\">이 사람들 모두가 공통적으로 갖고 있는 것은 무엇일까?</div><div class=\"rst\">그 선배들의 <b>공통점</b>은 뭘까요? = 지문 2번, 이 과학자들이 모두 같이 가진 게 무엇인지 묻는 질문이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Well, for one thing,</div><div class=\"k\">우선 한 가지로는</div></div><div class=\"rc\"><div class=\"e\">they’re all very smart.</div><div class=\"k\">그들(= 유명한 과학자들)은 모두 매우 똑똑하다</div></div><div class=\"rnat\">우선 한 가지로는 그들은 모두 매우 똑똑하다.</div><div class=\"rst\"><b>우선 한 가지</b>(for one thing)는 다들 머리가 좋다는 거예요. = 지문 3번, 과학자들은 모두 매우 똑똑해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">In some cases</div><div class=\"k\">어떤 경우에는</div></div><div class=\"rc\"><div class=\"e\">they even taught themselves</div><div class=\"k\">그들(= 유명한 과학자들)은 심지어 스스로 독학했다</div></div><div class=\"rc\"><div class=\"e\">most of what they knew</div><div class=\"k\">그들이 알게 된 것의 대부분을</div></div><div class=\"rc\"><div class=\"e\">about their particular subject.</div><div class=\"k\">그들의 특정 과목(분야)에 대해서</div></div><div class=\"rnat\">그들은 심지어 어떤 경우에는 그들의 특정 과목(분야)에 대해서 그들이 알게 된 것의 대부분을 스스로 독학했다.</div><div class=\"rst\">학원 없이 혼자 책 보고 공부한 선배도 있어요. = 지문 4번, 과학자들은 자기 분야에서 아는 것 대부분을 독학했어요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">In fact,</div><div class=\"k\">사실</div></div><div class=\"rc\"><div class=\"e\">Sir Isaac Newton had to invent</div><div class=\"k\">아이작 뉴턴 경은 고안해야 했다</div></div><div class=\"rc\"><div class=\"e\">a new branch of mathematics (calculus)</div><div class=\"k\">수학의 새로운 분과(미적분학)를</div></div><div class=\"rc\"><div class=\"e\">just to solve the problems</div><div class=\"k\">단지 문제를 해결하기 위해서</div></div><div class=\"rc\"><div class=\"e\">he was trying to do in physics.</div><div class=\"k\">그가 물리학에서 풀려고 애썼던</div></div><div class=\"rnat\">사실 Isaac Newton(아이작 뉴턴) 경은 단지 그가 물리학에서 풀려고 애썼던 문제를 해결하기 위해서 수학의 새로운 분과(미적분학)를 고안해야 했다.</div><div class=\"rst\">한 선배는 문제를 풀려고 아예 자기만의 풀이법을 새로 만들었대요. = 지문 5번, 뉴턴은 물리 문제를 풀려고 미적분학을 고안했어요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">There is <span class=\"cw\">something else</span> they all had in common</div><div class=\"k\">그들(= 유명한 과학자들) 모두가 공통적으로 갖고 있던 <span class=\"cw\">또 다른 것</span>이 있다</div></div><div class=\"rc\"><div class=\"e\">that set them apart</div><div class=\"k\">그들을 구분해 주는</div></div><div class=\"rc\"><div class=\"e\">from the other smart people of their time</div><div class=\"k\">당시의 다른 똑똑한 사람들과</div></div><div class=\"rc ckc\"><div class=\"e\">— <span class=\"cw\">their ability to ask questions</span>.</div><div class=\"k\"><span class=\"cw\">바로 질문을 하는 그들의 능력이다</span></div></div><div class=\"rnat\">그 외에 당시의 다른 똑똑한 사람들과 그들(과학자들)을 구분해주면서, 그들 모두가 공통적으로 갖고 있던 또 다른 것도 있는데, 바로 질문을 하는 그들의 능력(이다).</div><div class=\"rst\">그런데 똑똑한 애는 많아요. 선배들을 특별하게 만든 <b>또 다른 것</b>은 <b>질문하는 힘</b>이에요. = 지문 6번, 질문하는 능력이 그들을 구분해 줘요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Just having a good brain</span></div><div class=\"k\"><span class=\"cw\">단지 좋은 두뇌를 갖는 것이</span></div></div><div class=\"rc\"><div class=\"e\">isn’t always enough.</div><div class=\"k\">항상 충분한 것은 아니다</div></div><div class=\"rnat\">단지 좋은 두뇌를 갖는 것이 항상 충분한 것은 아니다(좋은 두뇌로는 부족하다).</div><div class=\"rst\">머리만 좋다고 다 되는 건 아니에요. = 지문 7번, 좋은 두뇌만으로는 항상 충분하지 않다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">To be a great scientist</span>,</div><div class=\"k\"><span class=\"cw\">위대한 과학자가 되기 위해서</span></div></div><div class=\"rc\"><div class=\"e\">you need to be able to look at a problem</div><div class=\"k\">당신은 문제를 볼 수 있어야 한다</div></div><div class=\"rc\"><div class=\"e\">that hundreds, maybe even thousands, of people</div><div class=\"k\">수백의 심지어 어쩌면 수천 명의 사람들이</div></div><div class=\"rc\"><div class=\"e\">have already looked at</div><div class=\"k\">이미 보았으면서도</div></div><div class=\"rc\"><div class=\"e\">and have been unable to solve,</div><div class=\"k\">풀 수 없었던</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">and ask the question in a new way</span>.</div><div class=\"k\"><span class=\"cw\">그리고 새로운 방식으로 질문할 수 있어야 한다</span></div></div><div class=\"rnat\">위대한 과학자가 되기 위해서 당신은 수백의 심지어 어쩌면 수천 명의 사람들이 이미 보았으면서도 풀 수 없었던 문제를 볼 수 있어야 하고, 새로운 방식으로 질문할 수 있어야 한다.</div><div class=\"rst\"><b>위대한 과학자가 되려면</b> 모두가 포기한 문제를 <b>새로운 방식으로 물어야</b> 해요. 지문 8번이 바로 제목의 답이에요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">Then you take that question</div><div class=\"k\">그 다음에 당신은 그 질문을 갖고</div></div><div class=\"rc\"><div class=\"e\">and come up with a new way</div><div class=\"k\">새로운 방식을 떠올린다</div></div><div class=\"rc\"><div class=\"e\">to answer it.</div><div class=\"k\">그것(= 그 질문)에 답할</div></div><div class=\"rnat\">그 다음에 당신은 그 질문을 갖고 이(질문)에 답할 새로운 방식을 떠올린다(떠올려내야 한다).</div><div class=\"rst\">그다음엔 그 질문에 답할 새로운 방법을 떠올려요. = 지문 9번, 질문을 붙잡고 새로운 답법을 찾아내요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">That is what made</div><div class=\"k\">이것(= (8)(9)에서 말한 내용)이 만든 것이다</div></div><div class=\"rc\"><div class=\"e\">Newton and the others</div><div class=\"k\">Newton과 다른 사람들을</div></div><div class=\"rc\"><div class=\"e\">so famous.</div><div class=\"k\">그렇게 유명하게</div></div><div class=\"rnat\">이것이 Newton과 다른 사람들(다른 유명한 과학자들)을 그렇게 유명하게 만든 것이다.</div><div class=\"rst\">이게 선배들을 유명하게 만든 비결이에요. = 지문 10번, 이것이 뉴턴과 다른 과학자들을 유명하게 만들었어요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">They coupled intelligence</div><div class=\"k\">그들(= 위대한 과학자들)은 지성을 결합했다 ※ 문제지엔 빈칸으로 되어 있음 (정답: coupled)</div></div><div class=\"rc\"><div class=\"e\">with a curiosity</div><div class=\"k\">호기심과</div></div><div class=\"rc\"><div class=\"e\">that said, “I want to know the answer to this.”</div><div class=\"k\">“나는 이것(= 질문)에 대한 답을 알고 싶어.”라고 말하는</div></div><div class=\"rnat\">그들은 지성을 “나는 이것(질문)에 대한 답을 알고 싶어.”라고 말하는 호기심과 결합했다.</div><div class=\"rst\">똑똑한 머리에 ‘이거 정말 궁금해!’ 하는 마음을 더했어요. = 지문 11번, 그들은 지성을 호기심과 결합했어요.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><div class=\"rc\"><div class=\"e\">After coming up with the right questions,</div><div class=\"k\">알맞은 질문을 떠올린 후에</div></div><div class=\"rc\"><div class=\"e\">they discovered ways of answering those questions</div><div class=\"k\">그들은 그러한 질문에 답하는 방식을 발견했고</div></div><div class=\"rc\"><div class=\"e\">and became famous</div><div class=\"k\">유명해진 것이다</div></div><div class=\"rc\"><div class=\"e\">for their discoveries.</div><div class=\"k\">그들의 (그러한) 발견으로</div></div><div class=\"rnat\">알맞은 질문을 떠올린 후에 그들은 그러한 질문에 답하는 방식을 발견했고, 그들의 (그러한) 발견으로 유명해진 것이다.</div><div class=\"rst\">좋은 질문을 먼저 떠올리고 답을 찾아내서 유명해졌어요. 지문 12번이 정리하듯, 위대한 과학자의 조건은 똑똑함 + 질문이에요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"have in common\" data-m=\"~을 공통점으로 갖다\"><b>have in common</b>~을 공통점으로 갖다</button><button type=\"button\" class=\"wdb\" data-w=\"for one thing\" data-m=\"우선 한 가지는\"><b>for one thing</b>우선 한 가지는</button><button type=\"button\" class=\"wdb\" data-w=\"calculus\" data-m=\"미적분학\"><b>calculus</b>미적분학</button><button type=\"button\" class=\"wdb\" data-w=\"set apart\" data-m=\"(다른 이들과) 구별 짓다\"><b>set apart</b>(다른 이들과) 구별 짓다</button><button type=\"button\" class=\"wdb\" data-w=\"come up with\" data-m=\"~을 생각해 내다\"><b>come up with</b>~을 생각해 내다</button><button type=\"button\" class=\"wdb\" data-w=\"curiosity\" data-m=\"호기심\"><b>curiosity</b>호기심</button></div>", "12": "<p class=\"mtr\">마더텅 정답률 <b>30%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸 뒤 <b>with</b>(~와)를 보세요. 글 내내 나란히 나온 intelligence(지성)와 curiosity(호기심), <b>두 가지를 하나로 묶는</b> 동사가 들어가야 해요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (11번)</span><div class=\"en\">They <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span></span> intelligence <mark>with</mark> a curiosity that said, “I want to know the answer to this.”</div><p class=\"ko\">그들은 지성을 “나는 이것에 대한 답을 알고 싶어.”라고 말하는 호기심과 ( ? )</p></div><div class=\"ck-via\"><i>▼</i><span>하나는 똑똑함, 즉 빈칸 뒤 intelligence(지성)</span></div><div class=\"ck-step\"><span class=\"lab\">3번 문장 · 첫 번째 재료</span><div class=\"en\">Well, for one thing, <mark>they’re all very smart</mark>.</div><p class=\"ko\">우선 한 가지로는 그들은 <mark>모두 매우 똑똑하다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>또 하나는 질문하는 능력, 즉 빈칸 뒤 curiosity(호기심)</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 두 번째 재료</span><div class=\"en\">There is something else they all had in common … — <mark>their ability to ask questions</mark>.</div><p class=\"ko\">그들 모두가 공통적으로 갖고 있던 또 다른 것이 있다 … <mark>바로 질문을 하는 그들의 능력이다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>좋은 두뇌 하나로는 모자라니 두 재료를 합쳐야 해요</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 문장 · 하나만으론 부족</span><div class=\"en\">Just having a good brain <mark>isn’t always enough</mark>.</div><p class=\"ko\">단지 좋은 두뇌를 갖는 것이 <mark>항상 충분한 것은 아니다</mark>.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>3번</em>똑똑함 = 지성</span><span><em>6·8번</em>새롭게 질문하는 능력 = 호기심</span><span><em>11번 빈칸</em>지성 ( ? ) with(~와) 호기심</span></div><div class=\"ck-eq\">⇒ 두 재료를 하나로 = 결합시켰다</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">coupled 결합시켰다<small>with(~와)와 짝을 이뤄 ‘지성을 호기심과 결합시켰다’가 되고, 3번 똑똑함과 6번 질문을 하나로 묶어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">replaced 대체했다</span><span class=\"why\">7번은 좋은 두뇌가 충분하지 않다고 했지 버리라고 하지 않았어요. 3번 똑똑함은 여전히 공통점이라 지성을 호기심으로 바꾼 게 아니에요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">confused 혼동했다</span><span class=\"why\">둘을 헷갈렸다는 말은 없어요. 10·12번은 둘을 잘 써서 질문하고 답을 찾아 유명해졌다고 해요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">minimized 최소화했다</span><span class=\"why\">지성을 줄였다는 말은 없어요. 3번에서 모두 very smart(매우 똑똑한)를 공통점으로 꼽았어요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">compared 비교했다</span><span class=\"why\">둘을 견주는 장면이 없어요. 8·9번은 머리를 쓰며 새롭게 질문하고 답을 찾는, 즉 둘을 함께 쓰는 이야기예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Think of the most famous scientists</div><div class=\"k\">가장 유명한 과학자들을 생각해보아라</div></div><div class=\"rc\"><div class=\"e\">you know</div><div class=\"k\">당신이 알고 있는</div></div><div class=\"rc\"><div class=\"e\">— Isaac Newton, Louis Pasteur, Albert Einstein,</div><div class=\"k\">아이작 뉴턴, 루이 파스퇴르, 알베르트 아인슈타인</div></div><div class=\"rc\"><div class=\"e\">Thomas Edison, Pierre and Marie Curie,</div><div class=\"k\">토머스 에디슨, 피에르 퀴리와 마리 퀴리 부부</div></div><div class=\"rc\"><div class=\"e\">Stephen Hawking, and so on.</div><div class=\"k\">스티븐 호킹 등</div></div><div class=\"rnat\">Isaac Newton(아이작 뉴턴), Louis Pasteur(루이 파스퇴르), Albert Einstein(알베르트 아인슈타인), Thomas Edison(토머스 에디슨), Pierre and Marie Curie(피에르 퀴리와 마리 퀴리 부부), Stephen Hawking(스티븐 호킹) 등 당신이 알고 있는 가장 유명한 과학자들을 생각해보아라.</div><div class=\"rst\">우리 학교에서 공부 잘하기로 유명한 선배들을 떠올려 봐요. = 지문 1번, 뉴턴·아인슈타인·퀴리 부부 같은 유명한 과학자들을 생각해 보라는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">What do all these people</div><div class=\"k\">이 사람들 모두가</div></div><div class=\"rc\"><div class=\"e\">have in common?</div><div class=\"k\">공통적으로 갖고 있는 것은 무엇일까?</div></div><div class=\"rnat\">이 사람들 모두가 공통적으로 갖고 있는 것은 무엇일까?</div><div class=\"rst\">그 선배들의 <b>공통점</b>은 뭘까요? = 지문 2번, 이 과학자들이 모두 같이 가진 게 무엇인지 묻는 질문이에요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc\"><div class=\"e\">Well, for one thing,</div><div class=\"k\">우선 한 가지로는</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">they’re all very smart</span>.</div><div class=\"k\">그들(= 유명한 과학자들)은 <span class=\"cw\">모두 매우 똑똑하다</span></div></div><div class=\"rnat\">우선 한 가지로는 그들은 모두 매우 똑똑하다.</div><div class=\"rst\"><b>첫 번째 재료</b>는 다들 머리가 좋다는 거예요. = 지문 3번, 과학자들은 모두 매우 똑똑해요. 빈칸 뒤 지성이 바로 이거예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">In some cases</div><div class=\"k\">어떤 경우에는</div></div><div class=\"rc\"><div class=\"e\">they even taught themselves</div><div class=\"k\">그들(= 유명한 과학자들)은 심지어 스스로 독학했다</div></div><div class=\"rc\"><div class=\"e\">most of what they knew</div><div class=\"k\">그들이 알게 된 것의 대부분을</div></div><div class=\"rc\"><div class=\"e\">about their particular subject.</div><div class=\"k\">그들의 특정 과목(분야)에 대해서</div></div><div class=\"rnat\">그들은 심지어 어떤 경우에는 그들의 특정 과목(분야)에 대해서 그들이 알게 된 것의 대부분을 스스로 독학했다.</div><div class=\"rst\">학원 없이 혼자 책 보고 공부한 선배도 있어요. = 지문 4번, 과학자들은 자기 분야에서 아는 것 대부분을 독학했어요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">In fact,</div><div class=\"k\">사실</div></div><div class=\"rc\"><div class=\"e\">Sir Isaac Newton had to invent</div><div class=\"k\">아이작 뉴턴 경은 고안해야 했다</div></div><div class=\"rc\"><div class=\"e\">a new branch of mathematics (calculus)</div><div class=\"k\">수학의 새로운 분과(미적분학)를</div></div><div class=\"rc\"><div class=\"e\">just to solve the problems</div><div class=\"k\">단지 문제를 해결하기 위해서</div></div><div class=\"rc\"><div class=\"e\">he was trying to do in physics.</div><div class=\"k\">그가 물리학에서 풀려고 애썼던</div></div><div class=\"rnat\">사실 Isaac Newton(아이작 뉴턴) 경은 단지 그가 물리학에서 풀려고 애썼던 문제를 해결하기 위해서 수학의 새로운 분과(미적분학)를 고안해야 했다.</div><div class=\"rst\">한 선배는 문제를 풀려고 아예 자기만의 풀이법을 새로 만들었대요. = 지문 5번, 뉴턴은 물리 문제를 풀려고 미적분학을 고안했어요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">There is something else they all had in common</div><div class=\"k\">그들(= 유명한 과학자들) 모두가 공통적으로 갖고 있던 또 다른 것이 있다</div></div><div class=\"rc\"><div class=\"e\">that set them apart</div><div class=\"k\">그들을 구분해 주는</div></div><div class=\"rc\"><div class=\"e\">from the other smart people of their time</div><div class=\"k\">당시의 다른 똑똑한 사람들과</div></div><div class=\"rc ckc\"><div class=\"e\">— <span class=\"cw\">their ability to ask questions</span>.</div><div class=\"k\"><span class=\"cw\">바로 질문을 하는 그들의 능력이다</span></div></div><div class=\"rnat\">그 외에 당시의 다른 똑똑한 사람들과 그들(과학자들)을 구분해주면서, 그들 모두가 공통적으로 갖고 있던 또 다른 것도 있는데, 바로 질문을 하는 그들의 능력(이다).</div><div class=\"rst\">그런데 똑똑한 애는 많아요. <b>두 번째 재료</b>는 <b>질문하는 힘</b>이에요. = 지문 6번, 질문하는 능력이 그들을 구분해 줘요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Just having a good brain</div><div class=\"k\">단지 좋은 두뇌를 갖는 것이</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">isn’t always enough</span>.</div><div class=\"k\"><span class=\"cw\">항상 충분한 것은 아니다</span></div></div><div class=\"rnat\">단지 좋은 두뇌를 갖는 것이 항상 충분한 것은 아니다(좋은 두뇌로는 부족하다).</div><div class=\"rst\">머리만 좋다고 다 되는 건 아니에요. = 지문 7번, 좋은 두뇌 하나로는 부족하니 두 재료가 다 있어야 해요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">To be a great scientist,</div><div class=\"k\">위대한 과학자가 되기 위해서</div></div><div class=\"rc\"><div class=\"e\">you need to be able to look at a problem</div><div class=\"k\">당신은 문제를 볼 수 있어야 한다</div></div><div class=\"rc\"><div class=\"e\">that hundreds, maybe even thousands, of people</div><div class=\"k\">수백의 심지어 어쩌면 수천 명의 사람들이</div></div><div class=\"rc\"><div class=\"e\">have already looked at</div><div class=\"k\">이미 보았으면서도</div></div><div class=\"rc\"><div class=\"e\">and have been unable to solve,</div><div class=\"k\">풀 수 없었던</div></div><div class=\"rc\"><div class=\"e\">and ask the question in a new way.</div><div class=\"k\">그리고 새로운 방식으로 질문할 수 있어야 한다</div></div><div class=\"rnat\">위대한 과학자가 되기 위해서 당신은 수백의 심지어 어쩌면 수천 명의 사람들이 이미 보았으면서도 풀 수 없었던 문제를 볼 수 있어야 하고, 새로운 방식으로 질문할 수 있어야 한다.</div><div class=\"rst\">모두가 포기한 문제를 <b>새로운 방식으로 물어야</b> 해요. = 지문 8번, 위대한 과학자가 되려면 새롭게 질문할 줄 알아야 해요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">Then you take that question</div><div class=\"k\">그 다음에 당신은 그 질문을 갖고</div></div><div class=\"rc\"><div class=\"e\">and come up with a new way</div><div class=\"k\">새로운 방식을 떠올린다</div></div><div class=\"rc\"><div class=\"e\">to answer it.</div><div class=\"k\">그것(= 그 질문)에 답할</div></div><div class=\"rnat\">그 다음에 당신은 그 질문을 갖고 이(질문)에 답할 새로운 방식을 떠올린다(떠올려내야 한다).</div><div class=\"rst\">그다음엔 그 질문에 답할 새로운 방법을 떠올려요. = 지문 9번, 질문을 붙잡고 새로운 답하는 방법을 찾아내요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">That is what made</div><div class=\"k\">이것(= (8)(9)에서 말한 내용)이 만든 것이다</div></div><div class=\"rc\"><div class=\"e\">Newton and the others</div><div class=\"k\">Newton과 다른 사람들을</div></div><div class=\"rc\"><div class=\"e\">so famous.</div><div class=\"k\">그렇게 유명하게</div></div><div class=\"rnat\">이것이 Newton과 다른 사람들(다른 유명한 과학자들)을 그렇게 유명하게 만든 것이다.</div><div class=\"rst\">이게 선배들을 유명하게 만든 비결이에요. = 지문 10번, 이것이 뉴턴과 다른 과학자들을 유명하게 만들었어요.</div></div><div class=\"rds key\" data-ord=\"11\"><span class=\"rn\">11번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">They <span class=\"cw\">coupled</span> intelligence</div><div class=\"k\">그들(= 위대한 과학자들)은 지성을 <span class=\"cw\">결합했다</span> ※ 문제지엔 빈칸으로 되어 있음 (정답: coupled)</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">with a curiosity</span></div><div class=\"k\"><span class=\"cw\">호기심과</span></div></div><div class=\"rc\"><div class=\"e\">that said, “I want to know the answer to this.”</div><div class=\"k\">“나는 이것(= 질문)에 대한 답을 알고 싶어.”라고 말하는</div></div><div class=\"rnat\">그들은 지성을 “나는 이것(질문)에 대한 답을 알고 싶어.”라고 말하는 호기심과 결합했다.</div><div class=\"rst\">똑똑한 머리에 ‘이거 정말 궁금해!’ 하는 마음을 <b>합쳤어요</b>. = 지문 11번, 그래서 빈칸은 지성을 호기심과 결합시켰다(coupled)예요.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><div class=\"rc\"><div class=\"e\">After coming up with the right questions,</div><div class=\"k\">알맞은 질문을 떠올린 후에</div></div><div class=\"rc\"><div class=\"e\">they discovered ways of answering those questions</div><div class=\"k\">그들은 그러한 질문에 답하는 방식을 발견했고</div></div><div class=\"rc\"><div class=\"e\">and became famous</div><div class=\"k\">유명해진 것이다</div></div><div class=\"rc\"><div class=\"e\">for their discoveries.</div><div class=\"k\">그들의 (그러한) 발견으로</div></div><div class=\"rnat\">알맞은 질문을 떠올린 후에 그들은 그러한 질문에 답하는 방식을 발견했고, 그들의 (그러한) 발견으로 유명해진 것이다.</div><div class=\"rst\">좋은 질문을 먼저 떠올리고 답을 찾아내서 유명해졌어요. = 지문 12번, 두 재료를 합친 결과가 위대한 발견이었어요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"couple\" data-m=\"결합시키다 (couple A with B: A를 B와 결합시키다)\"><b>couple</b>결합시키다 (couple A with B: A를 B와 결합시키다)</button><button type=\"button\" class=\"wdb\" data-w=\"intelligence\" data-m=\"지능, 지성\"><b>intelligence</b>지능, 지성</button><button type=\"button\" class=\"wdb\" data-w=\"curiosity\" data-m=\"호기심\"><b>curiosity</b>호기심</button><button type=\"button\" class=\"wdb\" data-w=\"for one thing\" data-m=\"우선 한 가지는\"><b>for one thing</b>우선 한 가지는</button><button type=\"button\" class=\"wdb\" data-w=\"come up with\" data-m=\"~을 생각해 내다\"><b>come up with</b>~을 생각해 내다</button><button type=\"button\" class=\"wdb\" data-w=\"calculus\" data-m=\"미적분학\"><b>calculus</b>미적분학</button></div>"};

function qHtml(i,a){

  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" data-q="'+d.no+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  if(EXP[cq.q]){h+=EXP[cq.q]+'<button class="toq" data-i="'+i+'">빠른 정답으로</button>';return h+'</div></details>';}
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';

}

/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(S.sub&&!S.mmS){S.mmS=1;S.mmP=1;save();WN.hw(lv,day,S.sub.s+'/'+N+(S.mmD?' ✓':''));}else if(!S.sub&&!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
</body>
</html>
