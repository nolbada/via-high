<style>

<body>
<div id="app"></div>
<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:Canvas;color:CanvasText;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';
    document.body.appendChild(d);
    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');
    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';
      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();
  }

은 배우게 된다."], [9, "모든 사람이 당신과 똑같은 방식으로 삶을 보고 경험한다고 생각할 이유가 어디 있는가?"], [10, "그렇게 되면 얼마나 지루할지는 말할 것도 없고, 새로운 기회와 아이디어, 발명과 창의성이 전부 사라져 버릴 것이다."]], "why": ["제목 유형은 <b>첫 주장 문장<\/b>과 <b>마지막 결론 문장<\/b>이 같은 말을 하는지 확인하면 끝납니다", "3번의 <b>close off the possibility<\/b>(가능성을 닫아 버린다)와 10번의 <b>eliminate all new opportunities<\/b>(모든 새로운 기회를 없앤다)가 정확히 같은 방향입니다", "8·9번은 <b>상대의 입장(their side)<\/b>을 살피면 새로운 것을 보게 되고, 모두가 나처럼 세상을 본다고 생각할 이유가 없다고 하여 같은 결론으로 이어 줍니다", "즉 <b>'내가 옳다'가 새로운 가능성을 막는다<\/b>가 이 글의 뼈대입니다."], "ch": [{"n": "①", "t": "The Value of Being Honest", "g": "정직함의 가치", "ok": false, "e": ["정직(honest) 이야기는 나오지 않습니다", "being right(옳음)와 being honest(정직함)를 같은 말로 묶으면 안 됩니다."]}, {"n": "②", "t": "Filter Out Negative Points of View", "g": "부정적인 관점을 걸러 내라", "ok": false, "e": ["글은 오히려 <b>다른 관점을 들여다보라<\/b>(7·8번)고 합니다", "걸러 내라는 것은 정반대 주장입니다."]}, {"n": "③", "t": "Keeping Your Word: A Road to Success", "g": "약속 지키기: 성공으로 가는 길", "ok": false, "e": ["약속을 지킨다는 내용이 없습니다", "성공이라는 단어도 나오지 않습니다."]}, {"n": "④", "t": "Being Right Can Block New Possibilities", "g": "옳은 것이 새로운 가능성을 막을 수 있다", "ok": true, "e": ["3번의 close off the possibility, 10번의 eliminate all new opportunities를 한 줄로 압축한 것입니다."]}, {"n": "⑤", "t": "Look Back When Everyone Looks Forward", "g": "모두가 앞을 볼 때 뒤를 돌아보라", "ok": false, "e": ["9번의 'everyone sees ~ the way you do' 때문에 everyone이 눈에 걸리지만, 글은 <b>과거를 돌아보라<\/b>는 이야기를 한 적이 없습니다."]}], "tr": ["누군가에게 아이디어나 제안을 꺼냈다가 곧바로 \"안 돼, 그건 안 될 거야\"라는 말을 들어 본 적 있는가?", "아마 이렇게 생각했을 것이다. \"저 사람은 기회조차 주지 않았잖아. 안 될 거라는 걸 어떻게 알지?\"", "무언가에 대해 자신이 옳다고 여기는 순간, 당신은 다른 관점이나 기회의 가능성을 닫아 버린다.", "무언가에 대해 옳다는 것은 \"원래 그런 거야, 끝\"이라는 뜻이 된다.", "당신이 맞을 수도 있다.", "당신 나름의 그 시각이 사실과 딱 맞아떨어질 수도 있다.", "하지만 다른 선택지나 다른 사람의 관점을 한 번 고려해 보는 것은 이로울 수 있다.", "상대편 입장에서 보면 새로운 것을 발견하게 되고, 최악의 경우라도 그 사람이 세상을 어떻게 보는지 하나쯤은 배우게 된다.", "모든 사람이 당신과 똑같은 방식으로 삶을 보고 경험한다고 생각할 이유가 어디 있는가?", "그렇게 되면 얼마나 지루할지는 말할 것도 없고, 새로운 기회와 아이디어, 발명과 창의성이 전부 사라져 버릴 것이다."], "ps": [{"n": 1, "ch": [{"e": "Have you ever <b>brought up<\/b> an idea or suggestion to s   const tabs=[['word','1','유반의어','답 맞춰보기'],['dk','2','직독직해','해석 맞춰보기'],['submit','3','답안지','정답 입력'],['exp','4','해설',S.sub?'정답·근거':'제출하면 열림']];
  return `<header><div class="wrap"><div class="row1"><h1>${esc(TITLE)}</h1><span><button class="link gohome" data-v="home">메뉴</button><a class="link" href="index.html">목록</a></span></div><div class="tabs">`+
    tabs.map(t=>`<button class="tab ${on(t[0])}" data-v="${t[0]}" ${(t[0]==='exp'&&!S.sub)?'disabled':''}><span class="t1"><span class="n">${t[1]}</span>${t[2]}</span><span class="t2">${t[3]}</span></button>`).join('')+
    `</div></div></header>`;
}
function noteList(){
  const out=[],ck=S.checks[WS.id]||{};
  WS.words.forEach((w,i)=>{
    const c=ck[i];if(!c)return;
    const parts=['m','s','a'].filter(p=>c[p]&&(p==='m'||w[p]));
    if(parts.length)out.push({i:i,w:w,parts:parts});
  });
  return out;
}
function render(){
  if(view==='home')renderHome();
  else if(view==='dk')renderDk();
  else if(view==='word')renderWord();
  else if(view==='note')renderNote();
  else if(view==='quiz')renderQuiz();
  else if(view==='result')renderResult();
  else if(view==='submit')renderSubmit();
  else if(view==='exp')renderExp();
  window.scrollTo(0,0);
}

 up an idea</b> and <b>heard them say</b>"]}, {"t": "<b>to someone</b>은 전치사구(부사구)로 brought up을 꾸민다. 누군가에게 꺼냈다는 뜻이다."}, {"t": "두 번째 동사 heard는 <b>지각동사 hear + 목적어 + 원형부정사</b> 구조이다.", "sub": ["O: them (그들)", "C: say (말하다). 지각동사 뒤라서 to 없이 동사원형", "immediately = 즉시 (say를 꾸미는 부사)", "“No, that won't work.” = say의 목적어인 인용문. work는 효과가 있다, 통하다"]}, {"t": "함정: heard는 과거 동사처럼 보이지만 앞의 Have와 이어지는 <b>과거분사(현재완료)</b>이다. Have you ever ~ and heard ~로 병렬된다."}], "sum": "아이디어를 꺼내자마자 \"안 돼\"라는 말을 들은 경험 묻기"}, {"i": "05", "q": "03", "s": "8", "title": "if절 + S+V+O 병렬 + 간접의문 how절", "eng": "If you see their side<sup>1</sup>, / you will see something new / or, at worst<sup>2</sup>, / learn something about / how the other person looks at life<sup>3</sup>.", "notes": [["1", "see one's side", "~의 입장에서 보다"], ["2", "at worst", "최악의 경우에도"], ["3", "look at life", "삶을 바라보다"]], "lit": "만약 당신이 그들의 입장에서 본다면 / 당신은 새로운 무언가를 보게 될 것이다 / 혹은, 최악의 경우에도 / 무언가를 배우게 될 것이다 / 다른 사람이 삶을 어떻게 바라보는지에 대해", "nat": "상대편 입장에서 보면 새로운 것을 발견하게 되고, 최악의 경우라도 그 사람이 세상을 어떻게 보는지 하나쯤은 배우게 된다.", "ana": "<b>will see ~ or (will) learn ~</b> — 조동사 will 하나에 <b>동사원형 두 개가 병렬</b>로 걸립니다. or 뒤의 learn을 과거형으로 착각하지 마세요. 콤마로 둘러싸인 <b>at worst</b>는 삽입어구라 괄호를 치고 지나가면 구조가 훤히 보입니다. 맨 뒤 <b>how the other person looks at life</b>는 전치사 about의 목적어로 들어간 <b>간접의문문</b>이라 <b>주어+동사 순서</b>를 지킵니다.", "pe": "\u0001If you see their side<sup>1</sup>\u0002, / you will see something \u0001new\u0002 / or, \u0001at worst<sup>2</sup>\u0002, / learn something \u0001about\u0002 / \u0001how the other person looks at life<sup>3</sup>\u0002.", "pk": "\u0001만약 당신이 그들의 입장에서 본다면\u0002 / 당신은 \u0001새로운\u0002 무언가를 보게 될 것이다 / 혹은, \u0001최악의 경우에도\u0002 / 무언가를 배우게 될 것이다 / \u0001다른 사람이 삶을 어떻게 바라보는지에 대해\u0002", "core": "당신은 무언가를 보게 되거나 무언가를 배우게 될 것이다.", "tags": ["If절 = 부사절(조건): 주절을 꾸밈", "주어 you + 동사 will see + 목적어 something. new = 형용사(후치수식): something을 꾸밈", "at worst = 삽입 부사구: 문장을 꾸밈. <b>will 하나에 동사원형 병렬</b>(see / learn)", "learn(동사) + something(목적어). about ~ = 전치사구(형용사구): something을 꾸밈", "how절 = about의 목적어인 간접의문문(명사절, 위 전치사구에 포함). 어순은 주어+동사"], "steps": [{"t": "이 문장은 <b>if절 + S+V+O(3형식) 두 개 병렬</b>이다. will 하나에 동사 see와 learn이 이어져 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: you (당신, 일반적인 사람)", "V1: will see (see 보다)  O1: something (무언가), new가 뒤에서 꾸밈 (new 새로운)", "V2: (will) learn (learn 배우다)  O2: something (무언가)", "뼈대 = <b>You will see something</b> or <b>learn something</b>"]}, {"t": "<b>If you see their side</b>는 <b>부사절(조건)</b>이다. 상대 입장에서 본다면이라는 뜻이다. side는 입장, 편이다."}, {"t": "<b>at worst</b>는 중간에 낀 삽입 부사구이다. 최악의 경우에도라는 뜻이고, see와 learn 사이에 끼어 있다."}, {"t": "<b>about how ~</b>는 전치사구(형용사구)로 something을 꾸민다. 전치사 about 뒤에 명사절이 왔다.", "sub": ["how the other person looks at life = 간접의문(명사절)", "S: the other person (다른 사람)  V: looks at (look at 바라보다, looks는 3인칭 단수형)  O: life (삶)", "어순은 의문문이 아니라 how + 주어 + 동사"]}], "sum": "입장을 바꿔 보면 새것을 보고, 최악에도 상대의 시각을 배움"}, {"i": "06", "q": "04", "s": "2", "title": "when절 + S+V + 부정어 nor 도치", "eng": "When you are searching<sup>1</sup>, / you are not browsing<sup>2</sup>, / nor<sup>3</sup> are you \"just looking\".", "notes": [["1", "search", "(일자리를) 찾다"], ["2", "browse", "그냥 훑어보다, 둘러보다"], ["3", "nor", "~도 또한 아니다"]], "lit": "당신이 (일자리를) 찾고 있을 때 / 당신은 그냥 둘러보고 있는 것이 아니다 / 그리고 \"그냥 구경만\" 하고 있는 것도 아니다", "nat": "구직 중이라는 것은 그냥 둘러보는 것도, \"그냥 한번 보는\" 것도 아니라는 뜻이다.", "ana": "<b>nor</b>가 절 맨 앞에 나오면 뒤는 반드시 <b>의문문 어순(are you)</b>으로 <b>도치</b>됩니다. are you를 보고 의문문이라고 읽으면 통째로 어긋납니다 — 앞의 nor 때문에 뒤집힌 <b>평서문</b>입니다. nor 자체가 <b>and not</b>이라 not을 또 붙이지 않습니다. 같은 도치: Never did I ~, Not only did he ~, Little did she know ~.", "pe": "\u0001When you are searching<sup>1</sup>\u0002, / you are not browsing<sup>2</sup>, / nor<sup>3</sup> are you \"\u0001just\u0002 looking\".", "pk": "\u0001당신이 (일자리를) 찾고 있을 때\u0002 / 당신은 그냥 둘러보고 있는 것이 아니다 / 그리고 \"그냥 구경만\" 하고 있는 것도 아니다", "core": "당신은 둘러보고 있는 것이 아니고, 구경만 하고 있는 것도 아니다.", "tags": ["When절 = 부사절(시간): 주절을 꾸밈", "주어 you + 동사 are browsing(진행형, not은 부정어)", "<b>nor + be동사 + 주어</b> 도치: 의문문처럼 보여도 평서문. just = 부사: looking을 꾸밈"], "steps": [{"t": "이 문장은 <b>when절 + S+V(진행형) + nor 도치</b>이다. 의문문처럼 생긴 부분이 있어 헷갈리지만 평서문이다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: you (당신)", "V: are not browsing (browse 둘러보다, be + -ing 진행형. not은 부정어)", "뼈대 = <b>You are not browsing</b>"]}, {"t": "<b>When you are searching</b>은 <b>부사절(때)</b>이다. search는 찾다, 구하다이다."}, {"t": "<b>nor are you “just looking”</b>이 도치 부분이다.", "sub": ["nor는 부정어라서 뒤가 <b>be동사 + 주어</b> 순서로 바뀐다 (are you)", "풀면: nor you are just looking → ~도 아니다", "just = 단지, looking(look 보다)을 꾸미는 부사. “just looking”은 가게에서 그냥 구경만 한다고 할 때의 표현"]}, {"t": "함정: nor are you는 의문문이 아니라 부정어 때문에 일어난 <b>도치</b>이다. 물음표가 없다는 점이 단서이다."}], "sum": "당신, 구직 중이면 그냥 둘러보는 것도 구경만 하는 것도 아님"}, {"i": "07", "q": "05", "s": "5", "title": "명령문 + wherever절 + so that절", "eng": "Post<sup>1</sup> it / wherever<sup>2</sup> you need it most, / such as on your refrigerator<sup>3</sup> or at work / — so that every time you see it, / you will smile and feel your spirit<sup>4</sup> lifted<sup>5</sup>.", "notes": [["1", "post", "붙이다, 게시하다"], ["2", "wherever", "~하는 곳은 어디든지"], ["3", "refrigerator", "냉장고"], ["4", "spirit", "기분, 마음"], ["5", "lift", "(기분을) 북돋우다"]], "lit": "그것을 붙여라 / 네가 그것을 가장 필요로 하는 곳이면 어디에든 / 냉장고 위나 직장 같은 곳에 / 그래서 네가 그것을 볼 때마다 / 너는 미소 짓고 네 기분이 들뜨는 것을 느끼도록", "nat": "냉장고든 직장이든, 가장 필요한 곳이라면 어디에든 붙여 두라. 그러면 볼 때마다 미소가 지어지고 기분이 살아나는 것을 느끼게 된다.", "ana": "<b>wherever</b>는 '~하는 곳은 어디든지'로 그 자체가 <b>부사절 전체</b>를 이끕니다. where와 ever로 쪼개 읽지 마세요. <b>so that</b>은 여기서 <b>목적·결과</b>이고, <b>every time</b>은 접속사처럼 쓰여 '~할 때마다'입니다. 마지막 <b>feel + 목적어 + 과거분사(lifted)</b> — 기분이 스스로 드는 것이 아니라 <b>들어 올려지는</b> 쪽이라 수동 관계의 과거분사가 옵니다.", "pe": "Post<sup>1</sup> it / \u0001wherever<sup>2</sup> you need it most\u0002, / \u0001such as on your refrigerator<sup>3</sup> or at work\u0002 / — \u0001so that every time you see it\u0002, / \u0001you will smile and feel your spirit<sup>4</sup> lifted<sup>5</sup>\u0002.", "pk": "그것을 붙여라 / \u0001네가 그것을 가장 필요로 하는 곳이면 어디에든\u0002 / \u0001냉장고 위나 직장 같은 곳에\u0002 / \u0001그래서 네가 그것을 볼 때마다\u0002 / \u0001너는 미소 짓고 네 기분이 들뜨는 것을 느끼도록\u0002", "core": "그것을 붙여라.", "tags": ["<b>명령문</b>: Post(동사) + it(목적어)", "wherever절 = 부사절(<b>복합관계부사</b>, 장소): Post를 꾸밈", "such as ~ = 전치사구(예시): 앞 wherever절(장소)을 꾸밈", "so that every time ~ = 부사절(목적): Post를 꾸밈. every time은 접속사처럼 쓰임", "(so that절 안) smile and feel 병렬. <b>feel + 목적어 + 과거분사</b>: your spirit(목적어) lifted(수동 보어)"], "steps": [{"t": "이 문장은 <b>명령문 + 부사절 두 개(wherever절, so that절)</b>이다. 뼈대가 짧고 뒤의 절들이 길다."}, {"t": "뼈대부터 찾는다.", "sub": ["V: Post (붙이다, 게시하다). 주어 You는 생략", "O: it (그것)", "뼈대 = <b>Post it</b>"]}, {"t": "<b>wherever you need it most</b>는 <b>부사절(복합관계부사, 장소)</b>이다. 어디에든 ~하는 곳이라는 뜻이다.", "sub": ["you need it most = 네가 그것을 가장 필요로 하는 (need 필요로 하다)"]}, {"t": "<b>such as on your refrigerator or at work</b>는 예시를 드는 전치사구로, wherever절이 가리키는 곳의 예를 들어 준다. 냉장고(refrigerator) 위나 직장 같은 곳이다."}, {"t": "<b>so that ~</b>는 <b>부사절(목적)</b>이다. 그래서 ~하도록이라는 뜻이다.", "sub": ["every time you see it = 네가 그것을 볼 때마다 (every time은 접속사처럼 씀)", "you will smile (S+V, smile 미소 짓다) and (will) feel your spirit lifted", "feel + O + C: your spirit(O, 기분) lifted(C, lift 들어올리다의 과거분사 = 들어 올려진)"]}], "sum": "가장 필요한 곳에 붙이면 볼 때마다 웃고 기분이 살아남"}, {"i": "08", "q": "06", "s": "3", "title": "인용문 + 도치 + 동격 콤마", "eng": "\"If everyone's doing it, / it must be a sensible<sup>1</sup> thing to do,\" / explains<sup>2</sup> famous psychologist<sup>3</sup> and best selling writer of Influence, / Robert Cialdini.", "notes": [["1", "sensible", "분별 있는, 현명한"], ["2", "explain", "설명하다"], ["3", "psychologist", "심리학자"]], "lit": "\"모두가 그것을 하고 있다면 / 그것은 분별 있는 행동임이 틀림없다\"라고 / 유명한 심리학자이자 『Influence』의 베스트셀러 작가가 설명한다 / 즉 Robert Cialdini가", "nat": "\"다들 그렇게 하고 있다면 분명 그럴 만한 이유가 있는 것이다.\" 유명 심리학자이자 『Influence』의 베스트셀러 작가인 Robert Cialdini의 설명이다.", "ana": "인용부호가 닫힌 뒤 <b>explains + 주어</b>로 <b>동사가 주어보다 먼저</b> 나왔습니다. 인용문을 앞세우면 뒤에서 이렇게 <b>도치</b>되는 일이 흔합니다 — explains를 명령문이나 다른 문장의 동사로 오해하지 마세요. 맨 뒤 콤마 뒤의 <b>Robert Cialdini</b>는 앞의 psychologist and writer를 다시 말해 주는 <b>동격</b>입니다. <b>must be</b>는 의무가 아니라 <b>강한 추측('~임이 틀림없다')</b>입니다.", "pe": "\"\u0001If everyone's doing it\u0002, / it must be a \u0001sensible<sup>1</sup>\u0002 thing \u0001to do\u0002,\" / explains<sup>2</sup> \u0001famous\u0002 psychologist<sup>3</sup> and \u0001best selling\u0002 writer \u0001of Influence\u0002, / \u0001Robert Cialdini\u0002.", "pk": "\"\u0001모두가 그것을 하고 있다면\u0002 / 그것은 \u0001분별 있는\u0002 행동임이 틀림없다\"라고 / \u0001유명한\u0002 심리학자이자 『Influence』의 \u0001베스트셀러\u0002 작가가 설명한다 / \u0001즉 Robert Cialdini가\u0002", "core": "그것은 분별 있는 행동임이 틀림없다고 심리학자이자 작가가 설명한다.", "tags": ["인용문 속 If절 = 부사절(조건): it must be ~를 꾸밈", "it must be a thing = 뼈대(SVC, <b>must be</b> = 강한 추측). sensible = 형용사: thing을 꾸밈, to do = to부정사(형용사적): thing을 꾸밈", "<b>인용 뒤 도치</b>: explains + 주어 psychologist and writer. famous, best selling = 형용사, of Influence = 전치사구(형용사구): 각각 명사 꾸밈", "Robert Cialdini = <b>동격</b>: psychologist and writer를 다시 말해 줌"], "steps": [{"t": "이 문장은 <b>인용문이 앞으로 나간 문장</b>이다. 인용문이 explain의 목적어이고, 뒤에 주어가 따라온다."}, {"t": "뼈대부터 찾는다.", "sub": ["V: explains (explain 설명하다의 3인칭 단수형)", "O: 앞의 인용문 전체", "S: Robert Cialdini (사람 이름). 앞의 famous psychologist and best selling writer of Influence(유명한 심리학자이자 『Influence』의 베스트셀러 작가)가 그를 설명하는 <b>동격</b>", "뼈대 = <b>“…,” explains Robert Cialdini</b>"]}, {"t": "인용문 속에도 문장이 하나 들어 있다.", "sub": ["If everyone's doing it = 부사절(조건). 모두가 그것을 하고 있다면 (everyone's = everyone is)", "it must be a sensible thing = S+V+C (2형식). must be ~임이 틀림없다, sensible 분별 있는", "to do = to부정사(형용사적), thing을 꾸밈. 할 만한 일"]}, {"t": "<b>of Influence</b>는 책 이름을 붙인 전치사구(형용사구)로 writer를 꾸민다. 쉼표 뒤 Robert Cialdini는 앞 사람의 이름을 밝히는 동격이다."}, {"t": "함정: 인용문 뒤에서는 <b>explains + 주어</b>로 순서가 바뀌는 일이 흔하다. 동사가 먼저 나와도 의문문이 아니다."}], "sum": "“모두가 하면 분별 있는 일임이 틀림없다”, Cialdini의 설명"}], "qs": [{"q": "01", "type": "글의 목적", "src": "2017년 11월 18번", "ans": "②", "tr": [["1", "투숙객 여러분, 저희 호텔에 묵어 주셔서 감사합니다."], ["2", "1976년 개관 이래로 저희는 에너지 사용과 쓰레기를 줄여 가며 지구를 지키는 일에 힘써 왔습니다."], ["3", "지구를 살리려는 노력의 하나로 저희는 새로운 정책을 도입했고, 여기에는 고객님의 도움이 필요합니다."], ["4", "문에 에코 카드(Eco-card)를 걸어 두시면 저희는 시트와 베갯잇, 잠옷을 교체하지 않습니다."], ["5", "또한 씻어야 할 필요가 없는 한 컵도 손대지 않고 그대로 둡니다."], ["6", "협조해 주시는 데 대한 보답으로 저희는 고객님의 이름으로 국가 산림 복원 사업에 기부하겠습니다."], ["7", "저희의 친환경 정책에 협조해 주시는 데 감사드립니다."]], "evh": "3 · 7번 문장", "ev": [{"en": true, "h": "In an effort to save the planet, we have adopted a new policy and we need your help. / We appreciate your cooperation on our eco-friendly policy."}, {"en": false, "h": "목적 유형은 <b>we need / please / we appreciate</b> 같은 <b>요청·부탁 표현</b>에 답이 있습니다. 3번의 <b>we need your help</b>가 이 편지를 쓴 이유를 그대로 말해 주고, 마지막 7번의 <b>your cooperation on our eco-friendly policy</b>가 무엇에 대한 협조인지를 못 박습니다. 앞부분(1976년, 에너지 절감)은 <b>배경</b>일 뿐이니 거기서 답을 고르면 안 됩니다."}], "opts": [{"n": "①", "t": "생활 속에서 실천 가능한 에너지 절약법을 소개하려고", "a": false, "x": true, "trap": false, "e": "에너지를 줄인다는 말은 <b>호텔이 해 온 일</b>이지, 투숙객에게 절약법을 가르쳐 주는 글이 아닙니다."}, {"n": "②", "t": "호텔의 친환경 정책에 대한 고객의 협조를 당부하려고", "a": true, "x": false, "trap": false, "e": "3번의 we need your help, 7번의 We appreciate your cooperation이 그대로 이 말입니다."}, {"n": "③", "t": "환경 보호를 위한 자원봉사 활동 참여를 권장하려고", "a": false, "x": true, "trap": false, "e": "자원봉사(volunteer)라는 말도, 활동에 나와 달라는 요청도 없습니다. 부탁하는 것은 <b>카드를 걸어 두는 일</b>뿐입니다."}, {"n": "④", "t": "호텔의 내부 공사로 인한 영업 중단을 공지하려고", "a": false, "x": true, "trap": false, "e": "공사나 영업 중단에 관한 언급이 한 줄도 없습니다."}, {"n": "⑤", "t": "호텔과 연계된 숲 체험 여행 상품을 홍보하려고", "a": false, "x": true, "trap": true, "e": "6번의 <b>National Forest Restoration Project</b> 때문에 '숲'이 눈에 걸립니다. 그러나 그것은 협조에 대한 보답으로 <b>기부</b>하는 대상이지 판매하는 상품이 아닙니다."}], "w": [["be committed to", "~에 전념하다"], ["consumption", "소비"], ["in an effort to", "~하려는 노력으로"], ["adopt", "채택하다"], ["policy", "정책"], ["hang", "걸다"], ["untouched", "손대지 않은"], ["in return for", "~에 대한 보답으로"], ["on one's behalf", "~을 대신하여"], ["restoration", "복원"]]}, {"q": "02", "type": "안내문 불일치", "src": "2020학년도 수능 27번", "ans": "③", "tr": [["1", "이번 대회에서 TIIS Tea의 신제품 녹차 포장 상자를 디자인할 기회를 잡으세요!"], ["2", "마감: 2019년 12월 2일 오후 6시."], ["3", "참가 대상: Lokota County 주민만."], ["4", "세부 사항 — 디자인에 회사명 \"TIIS Tea\"가 반드시 들어가야 합니다."], [ }

function mdWrap(s){s=String(s);let o='',d=0,buf='',i=0;
const flush=()=>{if(buf){o+=(d===0&&/[A-Za-z0-9가-힣]/.test(buf))?'<span class="cr">'+buf+'</span>':buf;buf='';}};
while(i<s.length){const ch=s[i];
if(ch==='<'){const j=s.indexOf('>',i);buf+=s.slice(i,j+1);i=j+1;continue;}
if(ch==='\x01'){flush();if(d===0)o+='<span class="md">';o+='(';d++;i++;continue;}
if(ch==='\x02'){flush();o+=')';d--;if(d===0)o+='</span>';i++;continue;}
buf+=ch;i++;}
flush();return o;}
function chunkSplit(s){return String(s).split(' / ')}
function scHtml(c){
  const esc=String;
  const E=chunkSplit(c.pe||c.eng),K=chunkSplit(c.pk||c.lit);
  let x='<div class="sc"><div class="sc-h"><span class="no2">'+esc(c.q)+'</span><span class="at">'+esc(c.q)+'번 문제 · '+esc(c.s)+'번 문장</span><span class="tt">'+esc(c.title)+'</span><span class="chv"></span></div><div class="sc-b">';
  if(c.steps&&c.steps.length){x+='<div class="lay th"><div class="hd">이 문장 읽는 순서</div><ol>'+c.steps.map(p=>'<li>'+p.t+(p.sub||[]).map(u=>'<div class="sub">'+u+'</div>').join('')+'</li>').join('')+'</ol></div>';}
  for(let j=0;j<E.length;j++)x+='<div class="ch"><div class="ce">'+mdWrap(E[j])+'</div><div class="ck">'+mdWrap(K[j]||'')+'</div></div>';
  if(c.notes.length){x+='<div class="nts">'+c.notes.map(n=>'<span class="nt"><sup>'+n[0]+'</sup> <b>'+esc(n[1])+'</b> '+esc(n[2])+'</span>').join('')+'</div>';}
  x+='<div class="lay nat"><span class="lb">자연스러운 해석</span>'+esc(c.nat)+'</div>';
  const sm=c.sum||c.core;
  if(sm){x+='<div class="lay sum"><span class="lb">한 줄 정리</span>'+esc(sm)+'</div>';}
  x+='</div></div>';
  return x;
}

/* ---- 단어 확인 ---- */
function renderWord(){
  const ck=S.checks[WS.id]||{},locked=!!S.locked[WS.id],n=noteList().length;
  let h=hdr()+band(1)+`<div class="wrap ${locked?'locked':''}">`;
  WS.words.forEach((w,i)=>{
    const c=ck[i]||{};
    h+=`<div class="row"><div class="top"><span class="no">${i+1}</span><span class="word">${esc(w.w)}</span><span class="src">${esc(w.src)}번</span></div><div class="cells">`;
    h+=`<button class="cell m ${c.m?'bad':''}" data-i="${i}" data-p="m"><span class="tag">뜻</span><span>${esc(w.m)}</span></button>`;
    if(w.s)h+=`<button class="cell s ${c.s?'bad':''}" data-i="${i}" data-p="s"><span class="tag">유</span><span>${esc(w.s[0])}<span class="ko">${esc(w.s[1])}</span></span></button>`;
    if(w.a)h+=`<button class="cell a ${c.a?'bad':''}" data-i="${i}" data-p="a"><span class="tag">반</span><span>${esc(w.a[0])}<span class="ko">${esc(w.a[1])}</span></span></button>`;

  h+=locked?`<button class="btn" disabled>확인 끝</button>`:`<button class="btn ${armed==='lock'?'arm':''}" id="lock">${armed==='lock'?'한 번 더 누르면 확인 끝':'확인 끝'}</button>`;

  app.querySelectorAll('.cell').forEach(b=>b.onclick=()=>{

    const c=S.checks[WS.id][i]=S.checks[WS.id][i]||{};
    c[p]=c[p]?0:1;save();
    if(c[p]){const ww=WS.words[i],x=p==='m'?[ww.w,ww.m]:p==='s'?ww.s:ww.a;if(x&&x[0]&&x[1])WN.add([{w:x[0],m:x[1],src:'미니모고',how:'별표',ask:true}]);}
    b.classList.toggle('bad',!!c[p]);
    $('#gonote').textContent='단어 오답노트 '+noteList().length;
  });
  const lk=$('#lock');if(lk)lk.onclick=()=>{
    if(armed==='lock'){S.locked[WS.id]=1;armed=null;save();

function renderNote(){
  const list=noteList();
  let h=`<header><div class="wrap hd2"><h1>단어 오답노트 <span class="meta">${list.length}개</span></h1><button class="link" id="back">확인표</button></div></header><div class="wrap">`;
  if(!list.length)h+=`<div class="empty">아직 표시한 단어가 없습니다</div>`;
  list.forEach(it=>{
    const w=it.w,r=(S.res[WS.id]||{})[it.i]||{};
    h+=`<div class="note-item"><span class="w">${esc(w.w)}</span><span class="meta">${esc(w.src)}번</span>`;
    const row=(p,tag,txt,ko)=>{
      const bad=it.parts.includes(p);
      const rs=r[p]===1?'<span class="res o">맞춤</span>':r[p]===0?'<span class="res x">틀림</span>':'';
      return `<div class="part ${p} ${bad?'bad':''}"><span class="tag">${tag}</span><span>${esc(txt)}${ko?`<span class="ko"> ${esc(ko)}</span>`:''}</span>${bad?rs:''}</div>`;
    };
    h+=row('m','뜻',w.m,'');
    if(w.s)h+=row('s','유',w.s[0],w.s[1]);

  });
  h+=`</div><div class="bar"><div class="wrap"><button class="btn" id="back2">확인표</button><button class="btn pri" id="start" ${list.length?'':'disabled'}>복습 시작</button></div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='word';armed=null;render();};
  $('#back2').onclick=()=>{view='word';render();};
  $('#start').onclick=()=>{quiz={qs:buildQuestions(),n:0,right:0,done:false,shown:false};view='quiz';render();};
}
function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
/* ---- 답 제출 ---- */

  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];

    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;

    $('#sub').disabled=!S.q.every(v=>v>0);

  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});

  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};

/* ---- 해설 ---- */
function qHtml(i,a){

  const d=D[i],ok=isRight(i,a);

  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';

function renderExp(){

/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
