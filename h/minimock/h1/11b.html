var EXP={"07": "<p class=\"mtr\">마더텅 정답률 <b>40%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸 문장은 <b>Just like</b>(~와 마찬가지로)로 보일러 이야기를 그대로 받아요. 기사가 <b>짧은 시간</b>(only a few moments)에 고치고 <b>시간이 아니라 경험</b>에 돈을 받았다는 6번을 빈칸에 옮기세요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (7번)</span><div class=\"en\"><mark>Just like</mark> the expert engineer tapping the boiler, effective change <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span>.</span></div><p class=\"ko\">보일러를 두드리는 전문 기사와 <mark>마찬가지로</mark>, 효과적인 변화는 ( ? )</p></div><div class=\"ck-via\"><i>▼</i><span>Just like(마찬가지로)가 가리키는 보일러 장면으로 돌아가요</span></div><div class=\"ck-step\"><span class=\"lab\">4·5번 문장 · 이야기 속 장면</span><div class=\"en\">… the job took the engineer <mark>only a few moments</mark>.</div><p class=\"ko\">그 일이 기사에게 <mark>얼마 안 되는 짧은 시간밖에</mark> 걸리지 않았기 때문에</p></div><div class=\"ck-via\"><i>▼</i><span>짧게 끝났지만 돈을 내는 이유는 시간이 아니라고 못 박아요</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 결정적 단서</span><div class=\"en\">… the man is <mark>not paying for the time</mark> he took to tap the boiler but rather the years of experience involved in <mark>knowing exactly where to tap</mark>.</div><p class=\"ko\">그 남자는 보일러를 두드리는 데 걸린 시간에 대해 <mark>돈을 내는 것이 아니라</mark>, 오히려 <mark>정확하게 어디를 두드려야 할지 아는 것</mark>과 관련된 수년의 경험에 대해서라고</p></div><div class=\"ck-via\"><i>▼</i><span>In fact(사실)로 빈칸 내용을 한 번 더 굳혀요</span></div><div class=\"ck-step\"><span class=\"lab\">8번 문장 · 빈칸 뒤 확인</span><div class=\"en\">In fact, it is often <mark>simply a question of knowing exactly where to tap</mark>.</div><p class=\"ko\">사실, 그것은 대개 <mark>단순히</mark> 정확하게 어디를 두드려야 할지 아는 것의 <mark>문제이다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">does not have to be time-consuming 시간이 걸려야만 하는 것은 아니다<small>한 번 톡 두드려 바로 고친 기사처럼, 변화도 오래 걸릴 필요가 없어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">does not come from previous experience 이전 경험에서 오지 않는다</span><span class=\"why\">6번과 정반대예요. 기사는 the years of experience(수년의 경험)에 돈을 받는다고 했으니, 변화는 오히려 경험에서 와요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">needs competition among experts 전문가들 사이의 경쟁이 필요하다</span><span class=\"why\">3번에서 부른 전문가는 한 명뿐이에요. 전문가끼리 겨루는 장면은 지문에 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">requires the development of equipment 장비 개발을 필요로 한다</span><span class=\"why\">4번에서 기사는 새 장비 없이 one gentle tap(한 번 가볍게 두드리기)만으로 고쳤어요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">often takes place as a result of good luck 흔히 행운의 결과로 일어난다</span><span class=\"why\">6·8번은 운이 아니라 어디를 두드릴지 정확히 아는 것(경험) 덕분이라고 했어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">There is a very old story</div><div class=\"k\">매우 오래된 이야기가 있다</div></div><div class=\"rc\"><div class=\"e\">involving a man</div><div class=\"k\">한 남자와 관련된</div></div><div class=\"rc\"><div class=\"e\">trying to fix</div><div class=\"k\">고치려고 애쓰는</div></div><div class=\"rc\"><div class=\"e\">his broken boiler.</div><div class=\"k\">그의 고장 난 보일러를</div></div><div class=\"rnat\">고장 난 보일러를 고치기 위해 노력하는 한 남자에 관련된 매우 오래된 이야기가 있다.</div><div class=\"rst\">동네 아저씨가 자전거 체인이 자꾸 빠져서 직접 고쳐 보려고 했어요. = 지문 1번, 고장 난 보일러를 고치려는 남자 이야기예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Despite his best efforts</div><div class=\"k\">그의 최선의 노력에도 불구하고</div></div><div class=\"rc\"><div class=\"e\">over many months,</div><div class=\"k\">수개월에 걸친</div></div><div class=\"rc\"><div class=\"e\">he can’t do it.</div><div class=\"k\">그는 그것을 할 수 없다</div></div><div class=\"rnat\">수개월에 걸친 그의 최선의 노력에도 불구하고, 그는 그것을 할 수 없다(고칠 수 없다).</div><div class=\"rst\">몇 달 동안 주말마다 붙잡고 씨름했지만 끝내 못 고쳤어요. 지문 2번처럼 최선을 다해도 안 됐어요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Eventually,</div><div class=\"k\">결국</div></div><div class=\"rc\"><div class=\"e\">he gives up</div><div class=\"k\">그는 포기하고</div></div><div class=\"rc\"><div class=\"e\">and decides to call in an expert.</div><div class=\"k\">전문가를 불러들이기로 결심한다</div></div><div class=\"rnat\">결국 그는 포기하고 전문가를 불러들이기로 결심한다.</div><div class=\"rst\">결국 아저씨는 포기하고 자전거 가게 사장님을 불렀어요. = 지문 3번, 전문가를 불러들이기로 한 거예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">The engineer arrives,</div><div class=\"k\">기사가 도착해서</div></div><div class=\"rc\"><div class=\"e\">gives one gentle tap</div><div class=\"k\">한 번 가볍게 두드리자</div></div><div class=\"rc\"><div class=\"e\">on the side of the boiler,</div><div class=\"k\">보일러 옆면을</div></div><div class=\"rc\"><div class=\"e\">and it springs to life.</div><div class=\"k\">그것(= 보일러)이 갑자기 활기를 되찾는다(갑자기 작동하기 시작한다)</div></div><div class=\"rnat\">기사가 도착하여 보일러 옆면을 한 번 가볍게 두드리자, 그것이(보일러가) 갑자기 활기를 되찾는다(갑자기 작동하기 시작한다).</div><div class=\"rst\">사장님이 와서 체인 옆을 한 번 톡 치니까 바로 쌩쌩 돌아가요. 지문 4번의 한 번 가볍게 두드리기(gentle tap)예요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">The engineer gives a bill to the man,</div><div class=\"k\">기사는 그 남자에게 청구서를 주고</div></div><div class=\"rc\"><div class=\"e\">and the man argues</div><div class=\"k\">그 남자는 주장한다</div></div><div class=\"rc\"><div class=\"e\">that he should pay only a small fee</div><div class=\"k\">그가(= 그 남자) 오직 적은 비용만을 지불해야 한다고</div></div><div class=\"rc ckc\"><div class=\"e\">as the job took the engineer <span class=\"cw\">only a few moments</span>.</div><div class=\"k\">그 일이 기사에게 <span class=\"cw\">얼마 안 되는 짧은 시간밖에</span> 걸리지 않았기 때문에</div></div><div class=\"rnat\">기사는 그 남자에게 청구서를 주고 그 남자는 그 일이 기술자에게는 얼마 안 되는 짧은 시간밖에 걸리지 않았기 때문에 그가 오직 적은 비용만을 지불해야 한다고(지불하면 된다고) 주장한다.</div><div class=\"rst\">사장님이 수리비를 말하자 아저씨가 “<b>몇 초밖에</b> 안 걸렸잖아요” 하며 깎아 달래요. 지문 5번, 걸린 시간이 짧으니 조금만 내겠다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">The engineer explains that</div><div class=\"k\">기사는 설명한다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">the man is not paying for</span></div><div class=\"k\"><span class=\"cw\">그 남자는 ~에 대해 돈을 내는 것이 아니라고</span></div></div><div class=\"rc\"><div class=\"e\">the time he took to tap the boiler</div><div class=\"k\">그가(= 기사) 보일러를 두드리는 데 걸린 시간</div></div><div class=\"rc\"><div class=\"e\">but rather the years of experience</div><div class=\"k\">오히려 수년의 경험에 대해서라고</div></div><div class=\"rc ckc\"><div class=\"e\">involved in <span class=\"cw\">knowing exactly where to tap</span>.</div><div class=\"k\"><span class=\"cw\">정확하게 어디를 두드려야 할지 아는 것과 관련된</span></div></div><div class=\"rnat\">그 기사는 그 남자가 그가 보일러를 두드리는 데 걸린 시간에 대해서 돈을 내는 것이 아니라, 그보다는 정확하게 어디를 두드려야 할지 아는 것과 관련된 수년의 경험에 대해서라고(경험에 대해서 돈을 내는 것이라고) 설명한다.</div><div class=\"rst\">사장님은 “톡 친 시간값이 아니라 <b>어디를 칠지 아는</b> 몇 년 경험값이에요” 해요. = 지문 6번의 설명이에요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">Just like the expert engineer</div><div class=\"k\">전문 기사와 마찬가지로</div></div><div class=\"rc\"><div class=\"e\">tapping the boiler,</div><div class=\"k\">보일러를 두드리는</div></div><div class=\"rc\"><div class=\"e\">effective change</div><div class=\"k\">효과적인 변화는</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">does not have to be time-consuming</span>.</div><div class=\"k\"><span class=\"cw\">시간이 걸려야만 하는 것은 아니다</span> ※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rnat\">전문 기사가 보일러를 두드리는 것과 마찬가지로, 효과적인 변화는 시간이 걸려야만 하는 것은 아니다.</div><div class=\"rst\">그 사장님처럼, 제대로 된 변화는 <b>오래 걸릴 필요가 없어요</b>. 그래서 빈칸은 시간이 걸려야만 하는 건 아니다(②)예요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc\"><div class=\"e\">In fact,</div><div class=\"k\">사실</div></div><div class=\"rc\"><div class=\"e\">it is often simply a question</div><div class=\"k\">그것(= 효과적인 변화)은 대개 단순히 문제이다</div></div><div class=\"rc\"><div class=\"e\">of knowing exactly where to tap.</div><div class=\"k\">정확하게 어디를 두드려야 할지 아는 것의</div></div><div class=\"rnat\">사실, 그것은 대개 단순히 정확하게 어디를 두드려야 할지 아는 것의 문제이다.</div><div class=\"rst\">사실 중요한 건 시간이 아니라 정확히 <b>어디를 건드릴지 아는 것</b>이에요. 지문 8번이 빈칸 내용을 다시 확인해 줘요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"involve\" data-m=\"관련되다, 관련시키다\"><b>involve</b>관련되다, 관련시키다</button><button type=\"button\" class=\"wdb\" data-w=\"despite\" data-m=\"~에도 불구하고\"><b>despite</b>~에도 불구하고</button><button type=\"button\" class=\"wdb\" data-w=\"call in\" data-m=\"불러들이다\"><b>call in</b>불러들이다</button><button type=\"button\" class=\"wdb\" data-w=\"eventually\" data-m=\"결국\"><b>eventually</b>결국</button><button type=\"button\" class=\"wdb\" data-w=\"bill\" data-m=\"청구서\"><b>bill</b>청구서</button><button type=\"button\" class=\"wdb\" data-w=\"time-consuming\" data-m=\"시간이 많이 걸리는\"><b>time-consuming</b>시간이 많이 걸리는</button></div>", "08": "<p class=\"mtr\">마더텅 정답률 <b>35%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸 앞의 <b>such</b>(이러한)가 핵심이에요. 앞의 2·3번 장면(수학자·작가)이 모두 <b>gets nowhere</b>(성과 없음)로 끝나니, 그 공통점을 한 단어로 묶으세요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (4번)</span><div class=\"en\">To produce something worthwhile … may require years of <mark>such</mark> <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span> labor.</span></div><p class=\"ko\">가치 있는 것을 만드는 것은 수년간의 <mark>이러한</mark> ( ? ) 노동을 필요로 할지도 모른다</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>2번</em>수학자: 증명을 시도하지만 아무 성과 없이 하루 끝</span><span><em>3번</em>작가: 쓴 글이 쓸모없어서 쓰레기통에 버림</span></div><div class=\"ck-eq\">⇒ such(이러한)가 가리키는 공통점 = 애써도 결과가 안 나오는 일</div></div><div class=\"ck-via\"><i>▼</i><span>such(이러한)가 가리키는 장면 ①</span></div><div class=\"ck-step\"><span class=\"lab\">2번 문장 · 첫 번째 장면</span><div class=\"en\">A mathematician … tries a few approaches, <mark>gets nowhere</mark>, and finishes for the day.</div><p class=\"ko\">몇 가지 접근법을 시도하고, <mark>아무런 성과도 보지 못하고</mark> 하루를 끝마친다</p></div><div class=\"ck-via\"><i>▼</i><span>빈칸 뒤에서 노벨상 학자 말로 다시 확인해요</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 문장 · 결정적 단서</span><div class=\"en\">… about four-fifths of his time in science <mark>was wasted</mark>, adding sadly that “nearly all scientific research <mark>leads nowhere</mark>.”</div><p class=\"ko\">과학에 들인 그의 시간 중 약 4/5는 <mark>헛되었다고</mark> … “거의 모든 과학 연구가 <mark>성공적인 결과에 도달하지 못한다</mark>”고</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">fruitless 성과 없는<small>gets nowhere(성과 없음)·no good(쓸모없는)·wasted(헛된)를 한 단어로 묶은 말이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">productive 생산적인</span><span class=\"why\">③과 정반대예요. 2번 gets nowhere(성과 없음), 5번 wasted(헛된)처럼 결과가 안 나오는 노동이라 생산적이지 않아요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">cooperative 협력하는</span><span class=\"why\">2번 수학자도 3번 작가도 혼자 일해요. 함께 협력하는 장면은 지문에 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">dangerous 위험한</span><span class=\"why\">연필 깎기·글쓰기는 위험한 일이 아니에요. 1번은 boring and repetitive(지루하고 반복적인) 일이라고 했어요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">irregular 불규칙한</span><span class=\"why\">1번은 오히려 day-to-day(일상적인)·repetitive(반복적인) 일이라고 했으니 불규칙과 반대예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Since a great deal of day-to-day academic work</div><div class=\"k\">많은 일상적인 학업이</div></div><div class=\"rc\"><div class=\"e\">is boring and repetitive,</div><div class=\"k\">지루하고 반복적이기 때문에</div></div><div class=\"rc\"><div class=\"e\">you need to be well motivated</div><div class=\"k\">당신은 동기 부여를 잘 해야 할 필요가 있다</div></div><div class=\"rc\"><div class=\"e\">to keep doing it.</div><div class=\"k\">그것(= 반복적인 학업)을 계속하기 위해서</div></div><div class=\"rnat\">많은 일상적인 학업이 (대부분) 지루하고 반복적이기 때문에, 당신은 그것(반복적인 학업)을 계속하기 위해서 동기 부여를 잘 해야 할 필요가 있다.</div><div class=\"rst\">수학 학원 숙제는 매일 비슷한 문제 풀기라 지루해요. 그래서 꾸준히 하려면 마음을 다잡아야 해요. = 지문 1번 이야기예요.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">2번 · 단서</span><div class=\"rc\"><div class=\"e\">A mathematician sharpens her pencils,</div><div class=\"k\">어느 수학자는 그녀의 연필을 깎고</div></div><div class=\"rc\"><div class=\"e\">works on a proof,</div><div class=\"k\">어떤 증명을 하려고 애쓰며</div></div><div class=\"rc\"><div class=\"e\">tries a few approaches,</div><div class=\"k\">몇 가지 접근법을 시도하고</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">gets nowhere</span>,</div><div class=\"k\"><span class=\"cw\">아무런 성과도 보지 못하고</span></div></div><div class=\"rc\"><div class=\"e\">and finishes for the day.</div><div class=\"k\">하루를 끝마친다</div></div><div class=\"rnat\">어느 수학자는 그녀의 연필을 깎고, 어떤 증명을 하려고 애쓰며, 몇 가지 접근법을 시도하고, 아무런 성과도 보지 못하고 하루를 끝마친다.</div><div class=\"rst\">짝꿍이 연필을 깎고 어려운 문제를 이렇게 저렇게 풀어 보지만 <b>답이 안 나와요</b>. 지문 2번 수학자도 성과 없이 하루를 끝내요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc\"><div class=\"e\">A writer sits down at his desk,</div><div class=\"k\">어느 작가는 그의 책상에 앉아서</div></div><div class=\"rc\"><div class=\"e\">produces a few hundred words,</div><div class=\"k\">몇백 개의 단어들을 만들어 내지만</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">decides they are no good</span>,</div><div class=\"k\">그것들(= 몇백 개의 단어들)이 <span class=\"cw\">쓸모없다고 판단하고는</span></div></div><div class=\"rc\"><div class=\"e\">throws them in the bin,</div><div class=\"k\">그것들을 쓰레기통으로 던져버리고</div></div><div class=\"rc\"><div class=\"e\">and hopes for better inspiration tomorrow.</div><div class=\"k\">내일의 보다 나은 영감을 기대한다</div></div><div class=\"rnat\">어느 작가는 그의 책상에 앉아서 몇백 개의 단어들을 만들어 내지만(글을 쓰지만), 그것들이 쓸모없다고 판단하고는 그것들을 쓰레기통으로 던져버리고, 내일의 보다 나은 영감을 기대한다.</div><div class=\"rst\">옆자리 친구는 독후감을 한 장 써 보고 별로라서 구겨 버리고, 내일은 더 잘 써지길 바라요. = 지문 3번 작가예요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">To produce something worthwhile</div><div class=\"k\">가치 있는 어떤 것을 만드는 것은</div></div><div class=\"rc\"><div class=\"e\">— if it ever happens —</div><div class=\"k\">만약 이 일(= 가치 있는 것을 만드는 일)이 언젠가 발생한다면</div></div><div class=\"rc\"><div class=\"e\">may require years</div><div class=\"k\">수년 간을 필요로 할지도 모른다</div></div><div class=\"rc ckc\"><div class=\"e\">of such <span class=\"cw\">fruitless labor</span>.</div><div class=\"k\">이러한 <span class=\"cw\">성과 없는 노동의</span> ※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rnat\">가치 있는 어떤 것을 만드는 것은, 만약 이 일(가치 있는 것을 만드는 일)이 언젠가 발생한다면, 이러한 수년 간의 성과 없는 노동을 필요로 할지도 모른다.</div><div class=\"rst\">좋은 결과 하나를 얻으려면 이렇게 <b>헛수고 같은 날</b>이 몇 년 쌓여야 할 수도 있어요. 그래서 빈칸은 성과 없는(fruitless)이에요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">The Nobel Prize-winning biologist Peter Medawar said</div><div class=\"k\">노벨상을 수상한 생물학자인 Peter Medawar는 말했다</div></div><div class=\"rc ckc\"><div class=\"e\">that about four-fifths of his time in science <span class=\"cw\">was wasted</span>,</div><div class=\"k\">과학에 들인 그의 시간 중 약 4/5는 <span class=\"cw\">헛되었다고</span></div></div><div class=\"rc\"><div class=\"e\">adding sadly</div><div class=\"k\">슬프게 덧붙였다</div></div><div class=\"rc ckc\"><div class=\"e\">that “nearly all scientific research <span class=\"cw\">leads nowhere</span>.”</div><div class=\"k\">“거의 모든 과학 연구가 <span class=\"cw\">성공적인 결과에 도달하지 못한다</span>”고</div></div><div class=\"rnat\">노벨상을 수상한 생물학자인 Peter Medawar는 과학에 들인 그의 시간 중 약 4/5는 헛되었다고 말하면서, \"거의 모든 과학 연구가 성공적인 결과에 도달하지 못한다.\"라고 슬프게 덧붙였다.</div><div class=\"rst\">노벨상 받은 과학자도 “내 시간의 4/5는 <b>헛되었다</b>”고 했대요. 지문 5번이 빈칸의 뜻을 확인해 줘요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">What kept all of these people going</div><div class=\"k\">이 모든 사람들을 계속하게 한 것은</div></div><div class=\"rc\"><div class=\"e\">when things were going badly</div><div class=\"k\">상황이 나빠지고 있을 때</div></div><div class=\"rc\"><div class=\"e\">was their passion for their subject.</div><div class=\"k\">그들의 주제(분야)에 대한 그들의 열정이었다</div></div><div class=\"rnat\">상황이 나빠지고 있을 때, 이 모든 사람들을 계속하게 한(계속 일하게 한) 것은 그들의 주제(분야)에 대한 그들의 열정이었다.</div><div class=\"rst\">그래도 두 친구가 포기 안 한 건 그 과목을 정말 좋아해서예요. 지문 6번, 계속하게 한 건 열정이었다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">Without such passion,</div><div class=\"k\">그러한 열정이 없었다면</div></div><div class=\"rc\"><div class=\"e\">they would have achieved nothing.</div><div class=\"k\">그들(= 이 모든 사람들)은 아무것도 이루지 못했을 것이다</div></div><div class=\"rnat\">그러한 열정이 없었다면, 그들은 아무것도 이루지 못했을 것이다.</div><div class=\"rst\">좋아하는 마음이 없었다면 아무것도 못 해냈을 거예요. 지문 7번이 열정의 중요함으로 글을 닫아요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"day-to-day\" data-m=\"일상적인\"><b>day-to-day</b>일상적인</button><button type=\"button\" class=\"wdb\" data-w=\"repetitive\" data-m=\"반복적인\"><b>repetitive</b>반복적인</button><button type=\"button\" class=\"wdb\" data-w=\"sharpen\" data-m=\"깎다, 날카롭게 하다\"><b>sharpen</b>깎다, 날카롭게 하다</button><button type=\"button\" class=\"wdb\" data-w=\"inspiration\" data-m=\"영감\"><b>inspiration</b>영감</button><button type=\"button\" class=\"wdb\" data-w=\"worthwhile\" data-m=\"가치 있는\"><b>worthwhile</b>가치 있는</button><button type=\"button\" class=\"wdb\" data-w=\"no good\" data-m=\"쓸모없는, 소용없는\"><b>no good</b>쓸모없는, 소용없는</button></div>", "09": "<p class=\"mtr\">마더텅 정답률 <b>85%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">순서 문제는 <b>고리</b>를 찾는 문제예요. 역접(<b>But</b> 그러나) → 대명사(<b>They</b> 그들 = many others 다른 사람들) → 질문과 답(<b>It</b> 그것 = 차이) 순으로 이어 붙이세요.</p><div class=\"ck-step\"><span class=\"lab\">주어진 글 끝</span><div class=\"en\">Sure, over time they may <mark>get fatter, gather lines, and go gray</mark>.</div><p class=\"ko\">물론, 시간이 지나면서 그들은 <mark>살이 찌고, 주름살이 생기고, 머리가 희끗희끗해질지도 모른다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>Sure(물론) 겉모습은 변해도 → But(그러나) 생활은 그대로</span></div><div class=\"ck-step key\"><span class=\"lab\">(B) · 첫 번째 고리</span><div class=\"en\"><mark>But</mark> they wear their hair the same way, buy the same brand of shoes, eat the same breakfast …</div><p class=\"ko\"><mark>그러나</mark> 그들은 똑같은 방식의 머리를 하고, 똑같은 브랜드의 신발을 사고, 똑같은 아침을 먹으며 …</p></div><div class=\"ck-via\"><i>▼</i><span>Yet(하지만)으로 변화하는 다른 사람들을 꺼내요</span></div><div class=\"ck-step\"><span class=\"lab\">(B) 끝 · 새 집단 등장</span><div class=\"en\">Yet as both research and real life show, <mark>many others</mark> do make important changes.</div><p class=\"ko\">하지만 연구와 실제 삶이 둘 다 보여 주듯이, <mark>많은 다른 사람들은</mark> 실제로 중요한 변화를 한다.</p></div><div class=\"ck-via\"><i>▼</i><span>They(그들) = 바로 앞의 many others(많은 다른 사람들)</span></div><div class=\"ck-step key\"><span class=\"lab\">(A) · 두 번째 고리</span><div class=\"en\"><mark>They</mark> train for marathons, quit smoking, switch fields …</div><p class=\"ko\"><mark>그들은</mark> 마라톤을 위해 훈련하고, 담배를 끊고, 분야를 바꾸고 …</p></div><div class=\"ck-via\"><i>▼</i><span>(A) 끝 질문 “두 집단의 차이는?”에 대한 답, It(그것) = 차이</span></div><div class=\"ck-step key\"><span class=\"lab\">(C) · 세 번째 고리</span><div class=\"en\"><mark>It</mark>’s their perspective.</div><p class=\"ko\"><mark>그것(= 두 집단의 차이)은</mark> 그들의 관점이다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">(B) – (A) – (C)<small>But(그러나) → They(그들 = 다른 사람들) → It(그것 = 차이), 세 고리가 모두 맞아요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">(B) – (C) – (A)</span><span class=\"why\">(C)의 It(그것)은 “차이”라는 답인데, 그 질문은 (A) 끝 4번에서 나와요. 질문보다 답이 먼저 나오면 안 돼요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">(A) – (C) – (B)</span><span class=\"why\">주어진 글의 변화 없는 사람들 바로 뒤에 (A) They train for marathons(그들은 마라톤 훈련을 한다)가 오면 같은 사람이 갑자기 변화하는 셈이라 어긋나요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">(C) – (A) – (B)</span><span class=\"why\">주어진 글 바로 뒤에 (C) It’s their perspective(그것은 관점이다)가 오면 It(그것)이 가리킬 “차이” 질문이 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">(C) – (B) – (A)</span><span class=\"why\">(C)가 맨 앞이면 It(그것)이 가리킬 대상이 없고, (B)의 But(그러나)도 주어진 글의 겉모습 변화와 떨어져요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><span class=\"ordc\">정답 순서 주어진 글</span><div class=\"rc\"><div class=\"e\">Some people make</div><div class=\"k\">몇몇 사람들은 한다</div></div><div class=\"rc\"><div class=\"e\">few intentional changes</div><div class=\"k\">의도적인 변화를 거의</div></div><div class=\"rc\"><div class=\"e\">in life.</div><div class=\"k\">삶에서</div></div><div class=\"rnat\">몇몇 사람들은 삶에서 의도적인 변화를 거의 하지 않는다.</div><div class=\"rst\">우리 반에는 생활을 거의 안 바꾸는 친구들이 있어요. = 주어진 글 1번, 일부러 바꾸는 게 거의 없는 사람들 이야기예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><span class=\"ordc\">정답 순서 주어진 글</span><div class=\"rc\"><div class=\"e\">Sure,</div><div class=\"k\">물론</div></div><div class=\"rc\"><div class=\"e\">over time</div><div class=\"k\">시간이 지나면서</div></div><div class=\"rc\"><div class=\"e\">they may get fatter, gather lines, and go gray.</div><div class=\"k\">그들(= 몇몇 사람들)은 살이 찌고, 주름살이 생기고, 머리가 희끗희끗해질지도 모른다</div></div><div class=\"rnat\">물론, 시간이 지나면서 그들은 살이 찌고, 주름살이 생기고, 머리가 희끗희끗해질지도 모른다.</div><div class=\"rst\">물론 키는 크고 얼굴도 조금씩 변해요. 지문 2번처럼 시간이 지나면 겉모습은 저절로 달라지죠.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">3번 · 단서</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">They</span> train for marathons,</div><div class=\"k\"><span class=\"cw\">그들은</span> 마라톤을 위해 훈련하고</div></div><div class=\"rc\"><div class=\"e\">quit smoking, switch fields,</div><div class=\"k\">담배를 끊고, 분야를 바꾸고</div></div><div class=\"rc\"><div class=\"e\">write plays, take up the guitar,</div><div class=\"k\">희곡을 쓰고, 기타를 배우고</div></div><div class=\"rc\"><div class=\"e\">or learn to tango</div><div class=\"k\">또는 탱고를 배운다</div></div><div class=\"rc\"><div class=\"e\">even if they never danced before in their lives.</div><div class=\"k\">비록 그들이 그들의 삶에서 이전에 결코 춤을 춰 본 적이 없었을지라도</div></div><div class=\"rnat\">(A) 그들은 마라톤을 위해 훈련하고, 담배를 끊고, 분야를 바꾸고, 희곡을 쓰고, 기타를 배우고, 또는 비록 그들이 그들의 삶에서 이전에 결코 춤을 춰 본 적이 없었을지라도 탱고를 배운다.</div><div class=\"rst\"><b>그 친구들은</b>(They) 마라톤 연습을 하고, 기타를 배우고, 춤을 처음 배우기도 해요. 지문 3번이 앞의 다른 친구들 예시예요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">4번 · 단서</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">What is the difference</div><div class=\"k\">차이는 무엇일까</div></div><div class=\"rc ckc\"><div class=\"e\">between <span class=\"cw\">these two groups of people</span>?</div><div class=\"k\"><span class=\"cw\">이러한 두 집단의 사람들 사이의</span></div></div><div class=\"rnat\">(A) 이러한 두 집단의 사람들 사이의 차이는 무엇일까?</div><div class=\"rst\">그럼 이 <b>두 무리</b>의 차이는 뭘까요? 지문 4번이 질문을 던져요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">5번 · 단서</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">But</span> they wear their hair the same way,</div><div class=\"k\"><span class=\"cw\">그러나</span> 그들은(= (1)의 몇몇 사람들) 똑같은 방식의 머리를 하고</div></div><div class=\"rc\"><div class=\"e\">buy the same brand of shoes,</div><div class=\"k\">똑같은 브랜드의 신발을 사고</div></div><div class=\"rc\"><div class=\"e\">eat the same breakfast,</div><div class=\"k\">똑같은 아침을 먹으며</div></div><div class=\"rc\"><div class=\"e\">and stick to routines</div><div class=\"k\">판에 박힌 일상을 고수한다</div></div><div class=\"rc\"><div class=\"e\">for no reason other than</div><div class=\"k\">~ 이외의 다른 이유 없이</div></div><div class=\"rc\"><div class=\"e\">the ease of a comfortable, predictable life.</div><div class=\"k\">편안하고 예측 가능한 삶의 용이함</div></div><div class=\"rnat\">(B) 그러나 그들은 편안하고 예측 가능한 삶의 용이함이라는 이유만으로 똑같은 방식의 머리를 하고, 똑같은 브랜드의 신발을 사고, 똑같은 아침을 먹으며 판에 박힌 일상을 고수한다.</div><div class=\"rst\"><b>그러나</b>(But) 매일 같은 머리, 같은 운동화, 같은 아침 메뉴예요. 편해서 그대로라는 게 지문 5번이에요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">6번 · 단서</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">Yet as both research and real life show,</div><div class=\"k\">하지만 연구와 실제 삶이 둘 다 보여 주듯이</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">many others</span> do make important changes.</div><div class=\"k\"><span class=\"cw\">많은 다른 사람들은</span> 실제로 중요한 변화를 한다</div></div><div class=\"rnat\">(B) 하지만 연구와 실제 삶이 둘 다 보여 주듯이, 많은 다른 사람들은 실제로 중요한 변화를 한다.</div><div class=\"rst\"><b>하지만</b>(Yet) 반대로 진짜 크게 바꾸는 <b>다른 친구들</b>(many others)도 있어요. 지문 6번이 새 무리를 꺼내요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">It</span>’s their perspective.</div><div class=\"k\"><span class=\"cw\">그것(= 두 집단의 차이)은</span> 그들의 관점이다</div></div><div class=\"rnat\">(C) 그것은 그들의 관점이다.</div><div class=\"rst\"><b>그건</b>(It) 바로 생각하는 방식, 관점이에요. 지문 7번이 4번 질문에 답해요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">People who change</div><div class=\"k\">변화하는 사람들은</div></div><div class=\"rc\"><div class=\"e\">do not question</div><div class=\"k\">질문하지 않는다</div></div><div class=\"rc\"><div class=\"e\">whether change is possible</div><div class=\"k\">변화가 가능할지</div></div><div class=\"rc\"><div class=\"e\">or look for reasons</div><div class=\"k\">또는 이유들을 찾지 않는다</div></div><div class=\"rc\"><div class=\"e\">they cannot change.</div><div class=\"k\">그들이 변화할 수 없는</div></div><div class=\"rnat\">(C) 변화하는 사람들은 변화가 가능할지 질문하거나 그들이 변화할 수 없는 이유들을 찾지 않는다.</div><div class=\"rst\">바꾸는 친구는 “내가 될까?”, “왜 못 하지?” 하고 따지지 않아요. = 지문 8번, 안 될 이유를 찾지 않는다는 말이에요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">They simply decide on a change they want</div><div class=\"k\">그들은(= 변화하는 사람들) 그저 그들이 원하는 변화를 결정하고</div></div><div class=\"rc\"><div class=\"e\">and do what is necessary</div><div class=\"k\">필요한 것을 한다</div></div><div class=\"rc\"><div class=\"e\">to accomplish it.</div><div class=\"k\">그것(= 원하는 변화)을 성취하는 데</div></div><div class=\"rnat\">(C) 그들은 그저 그들이 원하는 변화를 결정하고 그것(변화)을 성취하는 데 필요한 것을 한다.</div><div class=\"rst\">“기타 배울래!” 하고 정하면 바로 필요한 연습을 해요. 지문 9번처럼 원하는 변화를 정하고 해낼 일을 해요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">Changing,</div><div class=\"k\">변화하는 것은</div></div><div class=\"rc\"><div class=\"e\">which always stems from a firm decision,</div><div class=\"k\">항상 확고한 결심에서 생겨나는</div></div><div class=\"rc\"><div class=\"e\">becomes job number one.</div><div class=\"k\">최우선의 일이 된다</div></div><div class=\"rnat\">(C) 항상 확고한 결심에서 생겨나는 변화는, 최우선의 일이 된다.</div><div class=\"rst\">굳게 마음먹었으니 바꾸는 게 1순위 할 일이 돼요. 지문 10번, 변화는 확고한 결심에서 나온다는 결론이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"intentional\" data-m=\"의도적인\"><b>intentional</b>의도적인</button><button type=\"button\" class=\"wdb\" data-w=\"stick to\" data-m=\"~을 고수하다\"><b>stick to</b>~을 고수하다</button><button type=\"button\" class=\"wdb\" data-w=\"routine\" data-m=\"판에 박힌 일상\"><b>routine</b>판에 박힌 일상</button><button type=\"button\" class=\"wdb\" data-w=\"take up\" data-m=\"(취미 등을) 시작하다\"><b>take up</b>(취미 등을) 시작하다</button><button type=\"button\" class=\"wdb\" data-w=\"perspective\" data-m=\"관점, 시각\"><b>perspective</b>관점, 시각</button><button type=\"button\" class=\"wdb\" data-w=\"firm\" data-m=\"확고한, 굳은\"><b>firm</b>확고한, 굳은</button></div>", "10": "<p class=\"mtr\">마더텅 정답률 <b>55%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">요약문은 지문 핵심을 <b>말만 바꿔 옮긴 것</b>이에요. (A)는 망가니즈를 <b>깊은 곳 → 얕은 곳</b>으로 옮긴 5번에서, (B)는 이웃 식물을 <b>poison</b>(중독시키다)한다는 7·9번에서 찾으세요.</p><div class=\"ck-step key\"><span class=\"lab\">5번 문장 · (A) 단서</span><div class=\"en\">First, it redistributes manganese from deeper soil layers <mark>to shallow soil layers</mark> …</div><p class=\"ko\">첫째로, 그것은 망가니즈를 깊은 토양층으로부터 <mark>얕은 토양층으로</mark> 재분배한다</p></div><div class=\"ck-via\"><i>▼</i><span>잎에 모은 망가니즈가 위쪽 흙에 또 쌓여요</span></div><div class=\"ck-step\"><span class=\"lab\">7번 문장 · 떨어진 잎까지</span><div class=\"en\">When the leaves drop and decay, their concentrated manganese deposits <mark>further poison the soil</mark> around the plant.</div><p class=\"ko\">잎이 떨어지고 부패할 때, 그것의 농축된 망가니즈 축적물은 그 식물 주변의 <mark>토양을 더욱 오염시킨다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>Essentially(본질적으로)로 결과를 한 줄로 정리해요</span></div><div class=\"ck-step key\"><span class=\"lab\">9번 문장 · (B) 단서</span><div class=\"en\">Essentially, the common blackberry eliminates competition <mark>by poisoning its neighbors</mark> with heavy metals.</div><p class=\"ko\">본질적으로, common blackberry는 중금속으로 <mark>그것의 이웃을 중독시켜</mark> 경쟁자를 제거한다.</p></div><div class=\"ck-via\"><i>▼</i><span>얕은 곳으로 옮김 = 위쪽 흙의 양 (A) 증가, 이웃을 중독시킴 = (B) 치명적</span></div><div class=\"ck-step key\"><span class=\"lab\">요약문 (10번) · 짝 맞추기</span><div class=\"en\">The common blackberry has an ability to <mark>increase</mark> the amount of manganese in the surrounding upper soil, which makes the nearby soil quite <mark>deadly</mark> for other plants.</div><p class=\"ko\">common blackberry는 주변의 위쪽 토양의 망가니즈 양을 (A) <mark>증가시키는</mark> 능력이 있는데, 그것은 근처의 토양이 다른 식물에게 상당히 (B) <mark>치명적이게</mark> 만든다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">increase 증가시키다 … deadly 치명적인<small>5번 얕은 곳으로 옮기기 → increase(증가시키다), 9번 이웃을 중독시키기 → deadly(치명적인)예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">increase 증가시키다 … advantageous 이로운</span><span class=\"why\">(A)는 맞지만 (B)가 틀려요. 4번 to its advantage(자기에게 유리하게)는 블랙베리 자신에게 좋다는 말이고, 다른 식물에게는 8번처럼 very bad news(매우 나쁜 소식)예요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">indicate 나타내다 … nutritious 영양가 있는</span><span class=\"why\">둘 다 틀려요. 블랙베리는 망가니즈를 옮겨 양을 늘리지 표시하지 않고, 3번에서 망가니즈는 harmful(해로운) 물질이라 영양가와 반대예요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">reduce 줄이다 … dry 건조한</span><span class=\"why\">둘 다 틀려요. 5번은 망가니즈를 얕은 층으로 옮겨 위쪽 흙에 더 많아지게 하고, 흙이 마른다는 말은 지문에 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">reduce 줄이다 … warm 따뜻한</span><span class=\"why\">둘 다 틀려요. 위쪽 흙의 망가니즈는 5·7번에서 늘어나고, 흙의 온도 이야기는 지문에 없어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">The common blackberry (Rubus allegheniensis)</div><div class=\"k\">common blackberry(Rubus allegheniensis)는</div></div><div class=\"rc\"><div class=\"e\">has an amazing ability</div><div class=\"k\">놀라운 능력이 있다</div></div><div class=\"rc\"><div class=\"e\">to move manganese</div><div class=\"k\">망가니즈를 옮기는</div></div><div class=\"rc\"><div class=\"e\">from one layer of soil to another</div><div class=\"k\">토양의 한 층에서 다른 층으로</div></div><div class=\"rc\"><div class=\"e\">using its roots.</div><div class=\"k\">뿌리를 이용하여</div></div><div class=\"rnat\">common blackberry(Rubus allegheniensis)는 뿌리를 이용하여 토양의 한 층에서 다른 층으로 망가니즈를 옮기는 놀라운 능력이 있다.</div><div class=\"rst\">학교 화단에 블랙베리 덤불이 있어요. 이 식물은 뿌리로 흙 속 금속(망가니즈)을 이 층에서 저 층으로 옮겨요. = 지문 1번이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">This may seem like a funny talent</div><div class=\"k\">이것(= 망가니즈를 옮기는 능력)은 기이한 재능처럼 보일 수도 있지만</div></div><div class=\"rc\"><div class=\"e\">for a plant to have,</div><div class=\"k\">식물이 가지기에는</div></div><div class=\"rc\"><div class=\"e\">but it all becomes clear</div><div class=\"k\">그러나 전부 명확해진다</div></div><div class=\"rc\"><div class=\"e\">when you realize the effect</div><div class=\"k\">당신이 영향을 깨닫고 나면</div></div><div class=\"rc\"><div class=\"e\">it has on nearby plants.</div><div class=\"k\">그것이 근처의 식물에 미치는</div></div><div class=\"rnat\">이것은 식물이 가지기에는 기이한 재능처럼 보일 수도 있지만, 그것이 근처의 식물에 미치는 영향을 깨닫고 나면 전부 명확해진다.</div><div class=\"rst\">식물이 그런 재주가 왜 필요할까 싶지만, 옆 꽃들이 어떻게 되는지 보면 이유가 보여요. 지문 2번이 궁금증을 던져요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc\"><div class=\"e\">Manganese can be very harmful to plants,</div><div class=\"k\">망가니즈는 식물에 매우 해로울 수 있으며</div></div><div class=\"rc\"><div class=\"e\">especially at high concentrations.</div><div class=\"k\">특히 고농도일 때 그렇다</div></div><div class=\"rnat\">망가니즈는 식물에 매우 해로울 수 있으며, 특히 고농도일 때 그렇다.</div><div class=\"rst\">망가니즈는 식물에게 독이에요. 특히 많이 모이면 더 <b>해로워요</b>(harmful). = 지문 3번이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Common blackberry is unaffected</div><div class=\"k\">common blackberry는 영향을 받지 않으며</div></div><div class=\"rc\"><div class=\"e\">by damaging effects of this metal</div><div class=\"k\">이 금속 원소의 해로운 효과에</div></div><div class=\"rc\"><div class=\"e\">and has evolved two different ways</div><div class=\"k\">두 가지 다른 방법을 발달시켰다</div></div><div class=\"rc\"><div class=\"e\">of using manganese to its advantage.</div><div class=\"k\">망가니즈를 자신에게 유리하게 사용하는</div></div><div class=\"rnat\">common blackberry는 이 금속 원소의 해로운 효과에 영향을 받지 않으며, 망가니즈를 자신에게 유리하게 사용하는 두 가지 다른 방법을 발달시켰다.</div><div class=\"rst\">그런데 블랙베리는 이 독에 끄떡없고, 오히려 자기에게 유리하게 쓰는 방법이 두 가지 있어요. 지문 4번이에요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">First, it redistributes manganese</div><div class=\"k\">첫째로, 그것은 망가니즈를 재분배한다</div></div><div class=\"rc\"><div class=\"e\">from deeper soil layers</div><div class=\"k\">깊은 토양층으로부터</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">to shallow soil layers</span></div><div class=\"k\"><span class=\"cw\">얕은 토양층으로</span></div></div><div class=\"rc\"><div class=\"e\">using its roots as a small pipe.</div><div class=\"k\">뿌리를 작은 관으로 사용하여</div></div><div class=\"rnat\">첫째로, 그것은 뿌리를 작은 관으로 사용하여 망가니즈를 깊은 토양층으로부터 얕은 토양층으로 재분배한다.</div><div class=\"rst\">첫째, 뿌리를 빨대처럼 써서 깊은 흙의 망가니즈를 <b>얕은 흙으로</b> 끌어올려요. 그래서 위쪽 흙에 독이 <b>늘어나요</b>(A).</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Second, it absorbs manganese as it grows,</div><div class=\"k\">둘째로, 그것은 성장하면서 망가니즈를 흡수하여</div></div><div class=\"rc\"><div class=\"e\">concentrating the metal</div><div class=\"k\">그 금속 원소를 농축한다</div></div><div class=\"rc\"><div class=\"e\">in its leaves.</div><div class=\"k\">잎에</div></div><div class=\"rnat\">둘째로, 그것은 성장하면서 망가니즈를 흡수하여 그 금속 원소를 잎에 농축한다.</div><div class=\"rst\">둘째, 자라면서 망가니즈를 빨아들여 잎에 꽉꽉 모아 둬요. = 지문 6번이에요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">When the leaves drop and decay,</div><div class=\"k\">잎이 떨어지고 부패할 때</div></div><div class=\"rc\"><div class=\"e\">their concentrated manganese deposits</div><div class=\"k\">그것의(= 잎들의) 농축된 망가니즈 축적물은</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">further poison the soil</span></div><div class=\"k\"><span class=\"cw\">토양을 더욱 오염시킨다</span></div></div><div class=\"rc\"><div class=\"e\">around the plant.</div><div class=\"k\">그 식물 주변의</div></div><div class=\"rnat\">잎이 떨어지고 부패할 때, 그것의 농축된 망가니즈 축적물은 그 식물 주변의 토양을 독성 물질로 더욱 오염시킨다.</div><div class=\"rst\">가을에 그 잎이 떨어져 썩으면 화단 흙에 독이 또 쌓여요. 지문 7번, 주변 흙을 <b>더 오염시킨다</b>는 말이에요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">For plants that are not immune</div><div class=\"k\">면역이 없는 식물에게</div></div><div class=\"rc\"><div class=\"e\">to the toxic effects of manganese,</div><div class=\"k\">망가니즈의 독성 작용에</div></div><div class=\"rc\"><div class=\"e\">this is very bad news.</div><div class=\"k\">이것(= 주변 토양이 오염되는 일)은 매우 나쁜 소식이다</div></div><div class=\"rnat\">망가니즈의 독성 작용에 면역이 없는 식물에게 이것은 매우 나쁜 소식이다.</div><div class=\"rst\">독에 약한 옆 꽃들에겐 정말 나쁜 소식이에요. = 지문 8번이에요.</div></div><div class=\"rds key\" data-ord=\"9\"><span class=\"rn\">9번 · 단서</span><div class=\"rc\"><div class=\"e\">Essentially,</div><div class=\"k\">본질적으로</div></div><div class=\"rc\"><div class=\"e\">the common blackberry eliminates competition</div><div class=\"k\">common blackberry는 경쟁자를 제거한다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">by poisoning its neighbors</span></div><div class=\"k\"><span class=\"cw\">그것의 이웃을 중독시켜</span></div></div><div class=\"rc\"><div class=\"e\">with heavy metals.</div><div class=\"k\">중금속으로</div></div><div class=\"rnat\">본질적으로, common blackberry는 중금속으로 그것의 이웃을 중독시켜 경쟁자를 제거한다.</div><div class=\"rst\">결국 블랙베리는 옆 꽃들을 <b>중독시켜</b> 경쟁자를 없애요. 그래서 흙은 다른 식물에게 <b>치명적</b>(B)이에요.</div></div><div class=\"rds key\" data-ord=\"10\"><span class=\"rn\">10번 · 단서</span><div class=\"rc\"><div class=\"e\">The common blackberry has an ability to</div><div class=\"k\">common blackberry는 능력이 있다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">increase the amount of manganese</span></div><div class=\"k\"><span class=\"cw\">망가니즈 양을 증가시키는</span> ※ 문제지엔 빈칸 (A)로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">in the surrounding upper soil,</div><div class=\"k\">주변의 위쪽 토양의</div></div><div class=\"rc\"><div class=\"e\">which makes the nearby soil</div><div class=\"k\">그것은 근처의 토양을 만든다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">quite deadly for other plants</span>.</div><div class=\"k\"><span class=\"cw\">다른 식물에게 상당히 치명적이게</span> ※ 문제지엔 빈칸 (B)로 되어 있음</div></div><div class=\"rnat\">common blackberry는 주변의 위쪽 토양의 망가니즈 양을 (A)증가시키는 능력이 있는데, 그것은 근처의 토양이 다른 식물에게 상당히 (B)치명적이게 만든다.</div><div class=\"rst\">정리하면, 위쪽 흙의 망가니즈를 <b>늘려</b>(increase) 옆 식물에게 <b>치명적인</b>(deadly) 흙을 만든다는 요약이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"redistribute\" data-m=\"재분배하다\"><b>redistribute</b>재분배하다</button><button type=\"button\" class=\"wdb\" data-w=\"concentrate\" data-m=\"농축시키다, 집중시키다\"><b>concentrate</b>농축시키다, 집중시키다</button><button type=\"button\" class=\"wdb\" data-w=\"decay\" data-m=\"썩다, 부패하다\"><b>decay</b>썩다, 부패하다</button><button type=\"button\" class=\"wdb\" data-w=\"poison\" data-m=\"오염시키다, 중독시키다\"><b>poison</b>오염시키다, 중독시키다</button><button type=\"button\" class=\"wdb\" data-w=\"immune\" data-m=\"면역이 있는\"><b>immune</b>면역이 있는</button><button type=\"button\" class=\"wdb\" data-w=\"eliminate\" data-m=\"제거하다\"><b>eliminate</b>제거하다</button></div>", "11": "<p class=\"mtr\">마더텅 정답률 <b>60%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">제목은 <b>화제 문장</b>과 <b>질문에 대한 답</b>을 묶어서 찾으세요. 6번에서 “나이 들수록 시간이 빨리 간다”가 화제로 정해지고, 7번 <b>But why</b>(하지만 왜) 뒤로 그 이유가 이어져요.</p><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 화제 정리</span><div class=\"en\">… the sentiment behind these phrases is the same: <mark>time feels like it moves faster</mark> <mark>as we get older</mark>.</div><p class=\"ko\">이러한 표현들 뒤에 있는 의미는 매한가지다. <mark>우리가 나이가 들수록</mark> <mark>시간이 더 빨리 가는 것처럼 느껴진다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>화제를 정한 뒤 why(왜)로 이유 설명이 시작돼요</span></div><div class=\"ck-step\"><span class=\"lab\">7번 문장 · 이유를 묻는 신호</span><div class=\"en\"><mark>But why</mark> does this happen?</div><p class=\"ko\"><mark>하지만 왜</mark> 이런 일이 일어날까.</p></div><div class=\"ck-via\"><i>▼</i><span>In essence(본질적으로)로 이유를 한 줄로 정리해요</span></div><div class=\"ck-step key\"><span class=\"lab\">9번 문장 · 결정적 답</span><div class=\"en\">In essence, the more <mark>new information</mark> we take in, <mark>the slower time feels</mark>.</div><p class=\"ko\">본질적으로, 우리가 더 많은 <mark>새로운 정보</mark>를 받아들일수록, <mark>시간은 더 천천히 간다고 느껴진다</mark>.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>10~11번</em>아이들은 새 정보가 많아 시간이 느림</span><span><em>13~14번</em>아이에겐 모든 게 낯설고 경험이 적음</span><span><em>16번</em>세상이 익숙해지면(어른) 시간이 빨라짐</span></div><div class=\"ck-eq\">⇒ 공통점 = 나이 들수록 새로운 게 줄어 시간이 빨라지는 이유</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">Why Time Moves Faster as We Get Older 나이가 들수록 왜 시간이 더 빨리 가는가<small>6번의 화제(나이 들수록 빨라짐)와 7번 why(왜)의 답을 둘 다 담았어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">New Approach for Anti-aging(노화 방지를 위한 새로운 접근법)</span><span class=\"why\">[지문에 없음] 6번 get older(나이가 들다)만 보고 끌리는 함정이에요. 늙지 않는 방법은 한 줄도 없고, 글은 시간 느낌의 이유를 설명해요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">Time Can Solve Every Concern(시간이 모든 걱정을 해결할 수 있다)</span><span class=\"why\">[지문에 없음] time(시간)이 반복되지만, 시간이 걱정을 해결한다는 말은 없어요. 글은 시간이 빠르게 느껴지는 이유예요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">Time Management with Smart Devices(스마트 기기를 이용한 시간 관리)</span><span class=\"why\">[지문에 없음] 스마트 기기나 시간 관리 방법은 지문 어디에도 나오지 않아요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">Reasonable Science behind Time Travel(시간 여행 뒤에 숨은 타당한 과학)</span><span class=\"why\">[지문에 없음] 1번 reasonable(타당한)과 time(시간)만 따온 함정이에요. 시간 여행 이야기는 없어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">It’s reasonable to assume</div><div class=\"k\">생각하는 것은 타당하다</div></div><div class=\"rc\"><div class=\"e\">that every adult alive today</div><div class=\"k\">오늘날 살아 있는 모든 어른들이</div></div><div class=\"rc\"><div class=\"e\">has, at some point in their life,</div><div class=\"k\">그들의 삶의 어느 시점에</div></div><div class=\"rc\"><div class=\"e\">expressed or heard from someone else</div><div class=\"k\">표현하거나 다른 사람으로부터 들어 보았을 것이라고</div></div><div class=\"rc\"><div class=\"e\">a variation of the following:</div><div class=\"k\">다음의 다양함을(다음 문장을 다양한 형태로)</div></div><div class=\"rc\"><div class=\"e\">“Where did all the time go?”</div><div class=\"k\">“그 모든 시간이 어디로 간 거지?”</div></div><div class=\"rnat\">오늘날 살아 있는 모든 어른들이 그들의 삶의 어느 시점에 다음의 다양함을(다음 문장을 다양한 형태로) 표현하거나 다른 사람으로부터 들어 보았을 것이라고 생각하는 것은 타당하다. \"그 모든 시간이 어디로 간 거지?\"</div><div class=\"rst\">설날에 친척 어른들이 모이면 꼭 “시간이 다 어디 갔지?” 하는 말이 나와요. = 지문 1번, 어른이라면 누구나 해 봤을 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">“I can’t believe</div><div class=\"k\">“나는 믿을 수 없어</div></div><div class=\"rc\"><div class=\"e\">it’s the New Year.</div><div class=\"k\">(벌써) 새해라는 것을</div></div><div class=\"rnat\">\"나는 (벌써) 새해라는 것을 믿을 수 없어.</div><div class=\"rst\">한 어른은 “벌써 새해라니 믿을 수가 없네” 하고 놀라요. 지문 2번의 말이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Time flies!”</div><div class=\"k\">시간은 빨리 가!”</div></div><div class=\"rnat\">시간은 빨리 가!\"</div><div class=\"rst\">다른 어른도 “시간 진짜 빨리 가(Time flies)!” 하고 맞장구쳐요. = 지문 3번이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">“Enjoy it.</div><div class=\"k\">“즐겨.</div></div><div class=\"rnat\">\"즐겨.</div><div class=\"rst\">또 다른 어른은 사촌에게 “지금을 즐겨” 하고 말해요. 지문 4번의 말이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">One day you’ll wake up</div><div class=\"k\">어느 날 네가 정신을 차리면</div></div><div class=\"rc\"><div class=\"e\">and you’ll be 50.”</div><div class=\"k\">너는 50살이 되어 있을 거야.”</div></div><div class=\"rnat\">어느 날 네가 정신을 차리면, 너는 50살이 되어 있을 거야.\"</div><div class=\"rst\">“눈 떠 보면 너도 50살일 거야.” 지문 5번도 시간이 쏜살같다는 같은 뜻이에요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">While different on the surface,</div><div class=\"k\">겉으로는 다르지만</div></div><div class=\"rc\"><div class=\"e\">the sentiment behind these phrases is the same:</div><div class=\"k\">이러한 표현들(= (1)~(5)의 말들) 뒤에 (숨어) 있는 의미는 매한가지다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">time feels like it moves faster</span></div><div class=\"k\"><span class=\"cw\">시간이 더 빨리 가는 것처럼 느껴진다</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">as we get older</span>.</div><div class=\"k\"><span class=\"cw\">우리가 나이가 들수록</span></div></div><div class=\"rnat\">겉으로는 다르지만, 이러한 표현들 뒤에 (숨어) 있는 의미는 매한가지다. 우리가 나이가 들수록 시간이 더 빨리 가는 것처럼 느껴진다.</div><div class=\"rst\">말은 달라도 뜻은 하나예요. <b>나이가 들수록 시간이 빨리 간다</b>. 지문 6번이 글의 화제를 정해요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">But why does this happen?</span></div><div class=\"k\"><span class=\"cw\">하지만 왜 이런 일</span>(= 나이가 들수록 시간이 빨리 가는 것처럼 느껴지는 일)이 일어날까</div></div><div class=\"rnat\">하지만 왜 이런 일이 일어날까.</div><div class=\"rst\"><b>그런데 왜</b>(But why) 그럴까요? 지문 7번이 이유를 묻고, 글은 이제 그 답을 찾아가요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">According to psychologist Robert Ornstein,</div><div class=\"k\">심리학자인 Robert Ornstein에 따르면</div></div><div class=\"rc\"><div class=\"e\">the speed of time and our perception of it</div><div class=\"k\">시간의 속도와 그것(= 시간)에 대한 우리의 인지는</div></div><div class=\"rc\"><div class=\"e\">is heavily influenced</div><div class=\"k\">크게 영향을 받는다</div></div><div class=\"rc\"><div class=\"e\">by how much new information is available</div><div class=\"k\">새로운 정보가 얼마나 많이 있는가에</div></div><div class=\"rc\"><div class=\"e\">for our minds to absorb and process.</div><div class=\"k\">우리의 마음이 흡수하고 처리할</div></div><div class=\"rnat\">심리학자인 Robert Ornstein에 따르면, 시간의 속도와 그것에 대한 우리의 인지는 우리의 마음이 흡수하고 처리할 새로운 정보가 얼마나 많이 있는가에 크게 영향을 받는다(받는다고 한다).</div><div class=\"rst\">한 심리학자는 시간 느낌이 <b>새로운 정보</b>가 얼마나 많은지에 크게 달렸대요. = 지문 8번이에요.</div></div><div class=\"rds key\" data-ord=\"9\"><span class=\"rn\">9번 · 단서</span><div class=\"rc\"><div class=\"e\">In essence,</div><div class=\"k\">본질적으로</div></div><div class=\"rc\"><div class=\"e\">the more new information we take in,</div><div class=\"k\">우리가 더 많은 새로운 정보를 받아들일수록</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">the slower time feels</span>.</div><div class=\"k\"><span class=\"cw\">시간은 더 천천히 간다고 느껴진다</span></div></div><div class=\"rnat\">본질적으로, 우리가 더 많은 새로운 정보를 받아들일수록, 시간은 더 천천히 간다고 느껴진다는 것이다.</div><div class=\"rst\">새로운 걸 많이 받아들일수록 시간은 <b>더 천천히</b> 가요. 지문 9번이 그 이론을 한 줄로 정리해요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">This theory could explain in part</div><div class=\"k\">이 이론(= (8)(9)의 이론)은 부분적으로 설명할 수 있다</div></div><div class=\"rc\"><div class=\"e\">why time feels slower</div><div class=\"k\">왜 시간이 더 천천히 간다고 느껴지는지를</div></div><div class=\"rc\"><div class=\"e\">for children.</div><div class=\"k\">아이들에게는</div></div><div class=\"rnat\">이 이론은 아이들에게는 왜 시간이 더 천천히 간다고 느껴지는지를 부분적으로 설명할 수 있다.</div><div class=\"rst\">그래서 어린 사촌에게는 하루가 그렇게 길어요. 지문 10번, 이 이론이 아이들의 느린 시간을 설명해요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">Assigned the enormous task</div><div class=\"k\">엄청난 과제가 주어져서</div></div><div class=\"rc\"><div class=\"e\">of absorbing and processing</div><div class=\"k\">흡수하고 처리하는</div></div><div class=\"rc\"><div class=\"e\">all this new perceptual and sensory information</div><div class=\"k\">이 모든 새로운 인지적이고 감각적인(느낄 수 있는) 정보를</div></div><div class=\"rc\"><div class=\"e\">around them,</div><div class=\"k\">그들 주변에 있는</div></div><div class=\"rc\"><div class=\"e\">their brains are continuously alert and attentive.</div><div class=\"k\">그들(아이들)의 뇌는 계속해서 경계하고 주의를 기울이는 상태가 된다</div></div><div class=\"rnat\">그들 주변에 있는 이 모든 새로운 인지적이고 감각적인(느낄 수 있는) 정보를 흡수하고 처리하는 엄청난 과제가 주어져서, 그들(아이들)의 뇌는 계속해서 경계하고 주의를 기울이는 상태가 된다.</div><div class=\"rst\">어린 사촌은 처음 보는 것투성이라 머릿속이 하루 종일 바빠요. = 지문 11번, 아이의 뇌는 늘 깨어서 주의를 기울여요.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><div class=\"rc\"><div class=\"e\">Why?</div><div class=\"k\">왜 그럴까</div></div><div class=\"rnat\">왜 그럴까.</div><div class=\"rst\">왜 그렇게 바쁠까요? 지문 12번이 한 번 더 이유를 물어요.</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">13번</span><div class=\"rc\"><div class=\"e\">Because everything is unfamiliar.</div><div class=\"k\">모든 것이 낯설기 때문이다 ※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rnat\">모든 것이 낯설기 때문이다.</div><div class=\"rst\">어린 사촌에게는 <b>모든 게 낯설기</b>(unfamiliar) 때문이에요. 지문 13번이 그 이유를 답해요.</div></div><div class=\"rds\" data-ord=\"14\"><span class=\"rn\">14번</span><div class=\"rc\"><div class=\"e\">Consider the mind of a child:</div><div class=\"k\">아이의 마음을 생각해 보라</div></div><div class=\"rc\"><div class=\"e\">having experienced so little,</div><div class=\"k\">경험한 것이 거의 없어서</div></div><div class=\"rc\"><div class=\"e\">the world is a mysterious and fascinating place.</div><div class=\"k\">세상은 신비하고 흥미로운 장소이다</div></div><div class=\"rnat\">아이의 마음을 생각해 보라. 경험한 것이 거의 없어서, 세상은 신비하고 흥미로운 장소이다.</div><div class=\"rst\">겪어 본 게 별로 없으니 놀이터 개미 한 마리도 신기해요. 지문 14번, 아이에게 세상은 신비한 곳이에요.</div></div><div class=\"rds\" data-ord=\"15\"><span class=\"rn\">15번</span><div class=\"rc\"><div class=\"e\">Adults and children may live in the same world,</div><div class=\"k\">어른들과 아이들은 똑같은 세상에 살지도 모르지만</div></div><div class=\"rc\"><div class=\"e\">but reality for a child is vastly different</div><div class=\"k\">아이에게 현실은 크게 다르다</div></div><div class=\"rc\"><div class=\"e\">— full of wonders and curiosities</div><div class=\"k\">경이로움과 호기심으로 가득 차 있다</div></div><div class=\"rc\"><div class=\"e\">and miraculous little events</div><div class=\"k\">그리고 기적 같은 작은 일들로</div></div><div class=\"rc\"><div class=\"e\">that most adults ignore.</div><div class=\"k\">대부분의 어른들은 무시하는</div></div><div class=\"rnat\">어른들과 아이들은 똑같은 세상에 살지도 모르지만, 아이에게 현실은 크게 다르다. (아이들의 세상은) 대부분의 어른들은 무시하는 경이로움과 호기심 그리고 기적 같은 작은 일들로 가득 차 있다.</div><div class=\"rst\">같은 세상에 살아도 어른들이 그냥 지나치는 작은 일이 어린 사촌에겐 놀라움이에요. = 지문 15번이에요.</div></div><div class=\"rds\" data-ord=\"16\"><span class=\"rn\">16번</span><div class=\"rc\"><div class=\"e\">Perhaps this is why</div><div class=\"k\">아마도 이것이 ~하는 이유이다</div></div><div class=\"rc\"><div class=\"e\">we think so fondly</div><div class=\"k\">우리가 그토록 애정을 듬뿍 담아 생각하는</div></div><div class=\"rc\"><div class=\"e\">about the joy of childhood,</div><div class=\"k\">어린 시절의 즐거움에 대해</div></div><div class=\"rc\"><div class=\"e\">that freedom of mind and body</div><div class=\"k\">즉 몸과 마음의 자유에 대해</div></div><div class=\"rc\"><div class=\"e\">before the world becomes familiar and predictable.</div><div class=\"k\">세상이 친숙하고 예측 가능해지기 전의</div></div><div class=\"rnat\">아마도 이것이 우리가 어린 시절의 즐거움, 즉 세상이 친숙하고 예측 가능하기 전의 몸과 마음의 자유에 대해 그토록 애정을 듬뿍 담아 생각하는 이유이다.</div><div class=\"rst\">그래서 어른들은 세상이 <b>익숙해지기</b> 전의 어린 시절을 그리워해요. 지문 16번이 이렇게 글을 닫아요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"assume\" data-m=\"생각하다, 추측하다\"><b>assume</b>생각하다, 추측하다</button><button type=\"button\" class=\"wdb\" data-w=\"sentiment\" data-m=\"(언어 등에 담긴) 의미, 취지, 감정\"><b>sentiment</b>(언어 등에 담긴) 의미, 취지, 감정</button><button type=\"button\" class=\"wdb\" data-w=\"psychologist\" data-m=\"심리학자\"><b>psychologist</b>심리학자</button><button type=\"button\" class=\"wdb\" data-w=\"perception\" data-m=\"인지, 지각\"><b>perception</b>인지, 지각</button><button type=\"button\" class=\"wdb\" data-w=\"absorb\" data-m=\"흡수하다, 받아들이다\"><b>absorb</b>흡수하다, 받아들이다</button><button type=\"button\" class=\"wdb\" data-w=\"process\" data-m=\"처리하다\"><b>process</b>처리하다</button></div>", "12": "<p class=\"mtr\">마더텅 정답률 <b>45%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸은 12번 <b>Why</b>(왜 그럴까)?에 대한 답이에요. 바로 뒤 14번 <b>having experienced so little</b>(경험한 것이 거의 없어서)을 한 단어로 바꾸면 돼요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (13번)</span><div class=\"en\">Because everything is <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span>.</span></div><p class=\"ko\">모든 것이 ( ? ) 때문이다</p></div><div class=\"ck-via\"><i>▼</i><span>12번 Why(왜)가 묻는 것 = 아이의 뇌가 늘 바쁜 이유</span></div><div class=\"ck-step\"><span class=\"lab\">11번 문장 · 빈칸 앞 상황</span><div class=\"en\">Assigned the enormous task of absorbing and processing all this <mark>new</mark> perceptual and sensory information around them, their brains are <mark>continuously alert and attentive</mark>.</div><p class=\"ko\">이 모든 <mark>새로운</mark> 인지적이고 감각적인 정보를 흡수하고 처리하는 엄청난 과제가 주어져서, 그들의 뇌는 <mark>계속해서 경계하고 주의를 기울이는</mark> 상태가 된다.</p></div><div class=\"ck-via\"><i>▼</i><span>빈칸 바로 뒤에서 “경험이 적다”로 풀어 줘요</span></div><div class=\"ck-step key\"><span class=\"lab\">14번 문장 · 결정적 단서</span><div class=\"en\">Consider the mind of a child: <mark>having experienced so little</mark>, the world is a <mark>mysterious</mark> and fascinating place.</div><p class=\"ko\">아이의 마음을 생각해 보라. <mark>경험한 것이 거의 없어서</mark>, 세상은 <mark>신비하고</mark> 흥미로운 장소이다.</p></div><div class=\"ck-via\"><i>▼</i><span>어른의 세상은 familiar(친숙한) → 아이의 세상은 그 반대</span></div><div class=\"ck-step\"><span class=\"lab\">16번 문장 · 반대편 확인</span><div class=\"en\">… before the world becomes <mark>familiar</mark> and predictable.</div><p class=\"ko\">세상이 <mark>친숙하고</mark> 예측 가능해지기 전의</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">unfamiliar 낯선<small>경험이 거의 없으니(14번) 모든 게 낯설고, 16번 familiar(친숙한)의 반대예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">predetermined 미리 정해진</span><span class=\"why\">16번 predictable(예측 가능한)과 비슷해 끌리지만, 그건 세상이 익숙해진 어른 쪽 이야기예요. 아이에겐 14번처럼 세상이 mysterious(신비한) 곳이에요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">organized 정리된</span><span class=\"why\">11번에서 아이의 뇌는 새 정보를 처리하느라 늘 바빠요. 이미 정리돼 있다면 그렇게 애쓸 필요가 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">forgotten 잊힌</span><span class=\"why\">14번은 아이가 경험한 것이 거의 없다고 했어요. 겪은 적이 없으니 잊을 것도 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">meaningless 의미 없는</span><span class=\"why\">14·15번에서 아이에게 세상은 fascinating(흥미로운) 곳이고 wonders(경이로움)로 가득해요. 의미 없음과 반대예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">It’s reasonable to assume</div><div class=\"k\">생각하는 것은 타당하다</div></div><div class=\"rc\"><div class=\"e\">that every adult alive today</div><div class=\"k\">오늘날 살아 있는 모든 어른들이</div></div><div class=\"rc\"><div class=\"e\">has, at some point in their life,</div><div class=\"k\">그들의 삶의 어느 시점에</div></div><div class=\"rc\"><div class=\"e\">expressed or heard from someone else</div><div class=\"k\">표현하거나 다른 사람으로부터 들어 보았을 것이라고</div></div><div class=\"rc\"><div class=\"e\">a variation of the following:</div><div class=\"k\">다음의 다양함을(다음 문장을 다양한 형태로)</div></div><div class=\"rc\"><div class=\"e\">“Where did all the time go?”</div><div class=\"k\">“그 모든 시간이 어디로 간 거지?”</div></div><div class=\"rnat\">오늘날 살아 있는 모든 어른들이 그들의 삶의 어느 시점에 다음의 다양함을(다음 문장을 다양한 형태로) 표현하거나 다른 사람으로부터 들어 보았을 것이라고 생각하는 것은 타당하다. \"그 모든 시간이 어디로 간 거지?\"</div><div class=\"rst\">설날에 친척 어른들이 모이면 꼭 “시간이 다 어디 갔지?” 하는 말이 나와요. = 지문 1번, 어른이라면 누구나 해 봤을 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">“I can’t believe</div><div class=\"k\">“나는 믿을 수 없어</div></div><div class=\"rc\"><div class=\"e\">it’s the New Year.</div><div class=\"k\">(벌써) 새해라는 것을</div></div><div class=\"rnat\">\"나는 (벌써) 새해라는 것을 믿을 수 없어.</div><div class=\"rst\">한 어른은 “벌써 새해라니 믿을 수가 없네” 하고 놀라요. 지문 2번의 말이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Time flies!”</div><div class=\"k\">시간은 빨리 가!”</div></div><div class=\"rnat\">시간은 빨리 가!\"</div><div class=\"rst\">다른 어른도 “시간 진짜 빨리 가(Time flies)!” 하고 맞장구쳐요. = 지문 3번이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">“Enjoy it.</div><div class=\"k\">“즐겨.</div></div><div class=\"rnat\">\"즐겨.</div><div class=\"rst\">그러고는 사촌에게 “지금을 즐겨” 하고 말해요. 지문 4번의 말이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">One day you’ll wake up</div><div class=\"k\">어느 날 네가 정신을 차리면</div></div><div class=\"rc\"><div class=\"e\">and you’ll be 50.”</div><div class=\"k\">너는 50살이 되어 있을 거야.”</div></div><div class=\"rnat\">어느 날 네가 정신을 차리면, 너는 50살이 되어 있을 거야.\"</div><div class=\"rst\">“눈 떠 보면 너도 50살일 거야.” 지문 5번도 시간이 쏜살같다는 같은 뜻이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">While different on the surface,</div><div class=\"k\">겉으로는 다르지만</div></div><div class=\"rc\"><div class=\"e\">the sentiment behind these phrases is the same:</div><div class=\"k\">이러한 표현들(= (1)~(5)의 말들) 뒤에 (숨어) 있는 의미는 매한가지다</div></div><div class=\"rc\"><div class=\"e\">time feels like it moves faster</div><div class=\"k\">시간이 더 빨리 가는 것처럼 느껴진다</div></div><div class=\"rc\"><div class=\"e\">as we get older.</div><div class=\"k\">우리가 나이가 들수록</div></div><div class=\"rnat\">겉으로는 다르지만, 이러한 표현들 뒤에 (숨어) 있는 의미는 매한가지다. 우리가 나이가 들수록 시간이 더 빨리 가는 것처럼 느껴진다.</div><div class=\"rst\">말은 달라도 뜻은 하나예요. <b>나이가 들수록 시간이 빨리 간다</b>. 지문 6번이 글의 화제를 정해요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">But why does this happen?</div><div class=\"k\">하지만 왜 이런 일(= 나이가 들수록 시간이 빨리 가는 것처럼 느껴지는 일)이 일어날까</div></div><div class=\"rnat\">하지만 왜 이런 일이 일어날까.</div><div class=\"rst\"><b>그런데 왜</b>(But why) 그럴까요? 지문 7번이 이유를 묻고, 글은 이제 그 답을 찾아가요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">According to psychologist Robert Ornstein,</div><div class=\"k\">심리학자인 Robert Ornstein에 따르면</div></div><div class=\"rc\"><div class=\"e\">the speed of time and our perception of it</div><div class=\"k\">시간의 속도와 그것(= 시간)에 대한 우리의 인지는</div></div><div class=\"rc\"><div class=\"e\">is heavily influenced</div><div class=\"k\">크게 영향을 받는다</div></div><div class=\"rc\"><div class=\"e\">by how much new information is available</div><div class=\"k\">새로운 정보가 얼마나 많이 있는가에</div></div><div class=\"rc\"><div class=\"e\">for our minds to absorb and process.</div><div class=\"k\">우리의 마음이 흡수하고 처리할</div></div><div class=\"rnat\">심리학자인 Robert Ornstein에 따르면, 시간의 속도와 그것에 대한 우리의 인지는 우리의 마음이 흡수하고 처리할 새로운 정보가 얼마나 많이 있는가에 크게 영향을 받는다(받는다고 한다).</div><div class=\"rst\">한 심리학자는 시간 느낌이 <b>새로운 정보</b>가 얼마나 많은지에 크게 달렸대요. = 지문 8번이에요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">In essence,</div><div class=\"k\">본질적으로</div></div><div class=\"rc\"><div class=\"e\">the more new information we take in,</div><div class=\"k\">우리가 더 많은 새로운 정보를 받아들일수록</div></div><div class=\"rc\"><div class=\"e\">the slower time feels.</div><div class=\"k\">시간은 더 천천히 간다고 느껴진다</div></div><div class=\"rnat\">본질적으로, 우리가 더 많은 새로운 정보를 받아들일수록, 시간은 더 천천히 간다고 느껴진다는 것이다.</div><div class=\"rst\">새로운 걸 많이 받아들일수록 시간은 <b>더 천천히</b> 가요. 지문 9번이 그 이론을 한 줄로 정리해요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">This theory could explain in part</div><div class=\"k\">이 이론(= (8)(9)의 이론)은 부분적으로 설명할 수 있다</div></div><div class=\"rc\"><div class=\"e\">why time feels slower</div><div class=\"k\">왜 시간이 더 천천히 간다고 느껴지는지를</div></div><div class=\"rc\"><div class=\"e\">for children.</div><div class=\"k\">아이들에게는</div></div><div class=\"rnat\">이 이론은 아이들에게는 왜 시간이 더 천천히 간다고 느껴지는지를 부분적으로 설명할 수 있다.</div><div class=\"rst\">그래서 초등학생 동생에게는 하루가 그렇게 길어요. 지문 10번, 이 이론이 아이들의 느린 시간을 설명해요.</div></div><div class=\"rds key\" data-ord=\"11\"><span class=\"rn\">11번 · 단서</span><div class=\"rc\"><div class=\"e\">Assigned the enormous task</div><div class=\"k\">엄청난 과제가 주어져서</div></div><div class=\"rc\"><div class=\"e\">of absorbing and processing</div><div class=\"k\">흡수하고 처리하는</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">all this new perceptual and sensory information</span></div><div class=\"k\"><span class=\"cw\">이 모든 새로운 인지적이고 감각적인(느낄 수 있는) 정보를</span></div></div><div class=\"rc\"><div class=\"e\">around them,</div><div class=\"k\">그들 주변에 있는</div></div><div class=\"rc\"><div class=\"e\">their brains are continuously alert and attentive.</div><div class=\"k\">그들(아이들)의 뇌는 계속해서 경계하고 주의를 기울이는 상태가 된다</div></div><div class=\"rnat\">그들 주변에 있는 이 모든 새로운 인지적이고 감각적인(느낄 수 있는) 정보를 흡수하고 처리하는 엄청난 과제가 주어져서, 그들(아이들)의 뇌는 계속해서 경계하고 주의를 기울이는 상태가 된다.</div><div class=\"rst\">동생은 처음 보는 것투성이라 머릿속이 하루 종일 바빠요. = 지문 11번, 아이의 뇌는 늘 깨어서 주의를 기울여요.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><div class=\"rc\"><div class=\"e\">Why?</div><div class=\"k\">왜 그럴까</div></div><div class=\"rnat\">왜 그럴까.</div><div class=\"rst\">왜 그렇게 바쁠까요? 지문 12번이 한 번 더 이유를 물어요.</div></div><div class=\"rds key\" data-ord=\"13\"><span class=\"rn\">13번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">Because everything is <span class=\"cw\">unfamiliar</span>.</div><div class=\"k\"><span class=\"cw\">모든 것이 낯설기 때문이다</span> ※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rnat\">모든 것이 낯설기 때문이다.</div><div class=\"rst\">동생에게는 <b>모든 게 낯설기</b>(unfamiliar) 때문이에요. 지문 13번, 빈칸 자리의 답이에요.</div></div><div class=\"rds key\" data-ord=\"14\"><span class=\"rn\">14번 · 단서</span><div class=\"rc\"><div class=\"e\">Consider the mind of a child:</div><div class=\"k\">아이의 마음을 생각해 보라</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">having experienced so little</span>,</div><div class=\"k\"><span class=\"cw\">경험한 것이 거의 없어서</span></div></div><div class=\"rc\"><div class=\"e\">the world is a mysterious and fascinating place.</div><div class=\"k\">세상은 신비하고 흥미로운 장소이다</div></div><div class=\"rnat\">아이의 마음을 생각해 보라. 경험한 것이 거의 없어서, 세상은 신비하고 흥미로운 장소이다.</div><div class=\"rst\">겪어 본 게 별로 없으니 놀이터 개미 한 마리도 신기해요. 지문 14번, 아이에게 세상은 신비한 곳이에요.</div></div><div class=\"rds\" data-ord=\"15\"><span class=\"rn\">15번</span><div class=\"rc\"><div class=\"e\">Adults and children may live in the same world,</div><div class=\"k\">어른들과 아이들은 똑같은 세상에 살지도 모르지만</div></div><div class=\"rc\"><div class=\"e\">but reality for a child is vastly different</div><div class=\"k\">아이에게 현실은 크게 다르다</div></div><div class=\"rc\"><div class=\"e\">— full of wonders and curiosities</div><div class=\"k\">경이로움과 호기심으로 가득 차 있다</div></div><div class=\"rc\"><div class=\"e\">and miraculous little events</div><div class=\"k\">그리고 기적 같은 작은 일들로</div></div><div class=\"rc\"><div class=\"e\">that most adults ignore.</div><div class=\"k\">대부분의 어른들은 무시하는</div></div><div class=\"rnat\">어른들과 아이들은 똑같은 세상에 살지도 모르지만, 아이에게 현실은 크게 다르다. (아이들의 세상은) 대부분의 어른들은 무시하는 경이로움과 호기심 그리고 기적 같은 작은 일들로 가득 차 있다.</div><div class=\"rst\">같은 집에 살아도 어른들이 그냥 지나치는 작은 일이 동생에겐 놀라움이에요. = 지문 15번이에요.</div></div><div class=\"rds\" data-ord=\"16\"><span class=\"rn\">16번</span><div class=\"rc\"><div class=\"e\">Perhaps this is why</div><div class=\"k\">아마도 이것이 ~하는 이유이다</div></div><div class=\"rc\"><div class=\"e\">we think so fondly</div><div class=\"k\">우리가 그토록 애정을 듬뿍 담아 생각하는</div></div><div class=\"rc\"><div class=\"e\">about the joy of childhood,</div><div class=\"k\">어린 시절의 즐거움에 대해</div></div><div class=\"rc\"><div class=\"e\">that freedom of mind and body</div><div class=\"k\">즉 몸과 마음의 자유에 대해</div></div><div class=\"rc ckc\"><div class=\"e\">before the world becomes <span class=\"cw\">familiar</span> and predictable.</div><div class=\"k\">세상이 <span class=\"cw\">친숙하고</span> 예측 가능해지기 전의</div></div><div class=\"rnat\">아마도 이것이 우리가 어린 시절의 즐거움, 즉 세상이 친숙하고 예측 가능하기 전의 몸과 마음의 자유에 대해 그토록 애정을 듬뿍 담아 생각하는 이유이다.</div><div class=\"rst\">그래서 어른들은 세상이 <b>익숙해지기</b> 전의 어린 시절을 그리워해요. 지문 16번이 이렇게 글을 닫아요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"enormous\" data-m=\"엄청난, 거대한\"><b>enormous</b>엄청난, 거대한</button><button type=\"button\" class=\"wdb\" data-w=\"perceptual\" data-m=\"인지적인, 지각의\"><b>perceptual</b>인지적인, 지각의</button><button type=\"button\" class=\"wdb\" data-w=\"sensory\" data-m=\"감각적인, 느낄 수 있는\"><b>sensory</b>감각적인, 느낄 수 있는</button><button type=\"button\" class=\"wdb\" data-w=\"alert\" data-m=\"경계하는, 정신이 초롱초롱한\"><b>alert</b>경계하는, 정신이 초롱초롱한</button><button type=\"button\" class=\"wdb\" data-w=\"attentive\" data-m=\"주의를 기울이는\"><b>attentive</b>주의를 기울이는</button><button type=\"button\" class=\"wdb\" data-w=\"fascinating\" data-m=\"흥미로운, 매력적인\"><b>fascinating</b>흥미로운, 매력적인</button></div>"};

function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(S.sub&&!S.mmS){S.mmS=1;S.mmP=1;save();WN.hw(lv,day,S.sub.s+'/'+N+(S.mmD?' ✓':''));}else if(!S.sub&&!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}

  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
</body>
</html>
