<title>고1 미니모의고사 11회 01–06번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:84px}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}

.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}

.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}

.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.done .opt{pointer-events:none}
.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}
.hcard .chip{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--sub)}

details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}

.th ol{list-style:none;margin:0;padding:0;counter-reset:n}

.th li:first-child{border-top:0}

.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.th .sub{margin:3px 0 0;color:#444;font-size:14.5px;line-height:1.7}
.sc .lay.sum{border-left:4px solid #2e7d32;background:#f1f8f1}
/* ---- 새 직독직해·해설 화면 ---- */

.sc-h .at{font-size:13px;color:var(--sub)}

.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}

.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}

.trs{list-style:none;margin:0;padding:0;background:var(--soft);border-radius:10px;padding:8px 12px}

details.sub2{margin:12px 0 0}

function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){

function advance(){

편리한 시간인</div></div><div class=\"rc\"><div class=\"e\">to visit.</div><div class=\"k\">방문하기에.</div></div><div class=\"rnat\">이것은 저녁이 방문하기에 유일하게 편리한 시간인 사람들에게 도서관 서비스를 이용할 수 있게 하려는 것이었습니다.</div><div class=\"rst\">학원 끝나고 저녁에만 올 수 있는 친구들을 위해서였어요. 지문도 저녁밖에 시간이 없는 사람들을 위해서였다고 해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">However,</div><div class=\"k\">그러나,</div></div><div class=\"rc\"><div class=\"e\">visitor numbers have not shown</div><div class=\"k\">방문객 수는 보이지 않았고</div></div><div class=\"rc\"><div class=\"e\">a strong demand</div><div class=\"k\">활발한 수요를</div></div><div class=\"rc\"><div class=\"e\">for the later hours,</div><div class=\"k\">그 늦은 시간에 대한,</div></div><div class=\"rc\"><div class=\"e\">and library officials determined</div><div class=\"k\">도서관 공무원들은 결정했다</div></div><div class=\"rc\"><div class=\"e\">that staff time would be more effectively utilized</div><div class=\"k\">근무 시간이 더 효과적으로 활용될 것이라고</div></div><div class=\"rc\"><div class=\"e\">by adjusting operating hours.</div><div class=\"k\">운영 시간을 조정함으로써.</div></div><div class=\"rnat\">그러나, 방문객 수는 그 늦은 시간에 활발한 수요를 보이지 않았고, 도서관 공무원들은 운영 시간을 조정하여 근무 시간을 더 효과적으로 활용하기로 결정했습니다.</div><div class=\"rst\"><b>그런데</b>(However) 막상 저녁엔 손님이 별로 없었어요. 지문도 늦은 시간 수요가 적어서 운영 시간을 조정하기로 했대요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">So I have to inform you</span></div><div class=\"k\"><span class=\"cw\">그래서 나는 여러분에게 알려야 한다</span></div></div><div class=\"rc\"><div class=\"e\">that hours of operation at Green County Library</div><div class=\"k\">Green County Library의 운영 시간이</div></div><div class=\"rc\"><div class=\"e\">will change</div><div class=\"k\">바뀐다는 것을</div></div><div class=\"rc\"><div class=\"e\">starting October 8, 2015.</div><div class=\"k\">2015년 10월 8일부터.</div></div><div class=\"rnat\">그래서 저는 여러분들께 2015년 10월 8일부로 Green County Library의 운영 시간이 바뀐다는 것을 알려드리게 되었습니다.</div><div class=\"rst\"><b>그래서</b>(So) 방송으로 “운영 시간이 바뀝니다!” 하고 알려요. 지문의 <b>알려야 한다</b>(inform)가 바로 이 글의 목적이에요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">Operating hours on Thursdays</div><div class=\"k\">목요일 운영 시간은</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">will return to normal</span>,</div><div class=\"k\"><span class=\"cw\">정상으로 돌아갈 것이다</span>,</div></div><div class=\"rc\"><div class=\"e\">from 9 a.m. to 6 p.m.</div><div class=\"k\">오전 9시부터 오후 6시까지.</div></div><div class=\"rnat\">목요일 운영 시간은 정상(적인 운영 시간인) 오전 9시부터 오후 6시까지로 돌아갈 것입니다.</div><div class=\"rst\">목요일도 다른 날처럼 원래 시간에 닫아요. 지문도 목요일이 <b>정상</b>(normal)인 오전 9시~오후 6시로 돌아간다고 해요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">All normal library services</div><div class=\"k\">모든 정상적인 도서관 서비스는</div></div><div class=\"rc\"><div class=\"e\">will still be available</div><div class=\"k\">여전히 이용할 수 있을 것이다</div></div><div class=\"rc\"><div class=\"e\">during those hours.</div><div class=\"k\">그 시간(= 오전 9시~오후 6시) 동안에.</div></div><div class=\"rnat\">모든 정상적인 도서관 서비스는 이 시간 동안 여전히 이용할 수 있을 것입니다.</div><div class=\"rst\">“열려 있는 시간엔 다 똑같이 이용할 수 있어요.” 지문도 그 시간 동안 모든 서비스는 그대로라고 안심시켜요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Additionally,</div><div class=\"k\">또한,</div></div><div class=\"rc\"><div class=\"e\">the shift</div><div class=\"k\">그 변화(= 운영 시간의 변화)는</div></div><div class=\"rc\"><div class=\"e\">will allow Green County Library</div><div class=\"k\">Green County Library가 ~하도록 할 것이다</div></div><div class=\"rc\"><div class=\"e\">to improve and increase services</div><div class=\"k\">서비스를 개선하고 증가시키도록</div></div><div class=\"rc\"><div class=\"e\">to the community.</div><div class=\"k\">지역사회에 대한.</div></div><div class=\"rnat\">또한, 그 변화는 Green County Library가 지역사회에 대한 서비스를 개선하고 증가시키도록 할 것입니다.</div><div class=\"rst\">남는 힘으로 매점을 더 좋게 꾸밀 수 있어요. 지문도 이 변화로 지역사회 서비스가 더 좋아진다고 마무리해요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"stay open\" data-m=\"계속 문을 열다\"><b>stay open</b>계속 문을 열다</button><button type=\"button\" class=\"wdb\" data-w=\"convenient\" data-m=\"편리한\"><b>convenient</b>편리한</button><button type=\"button\" class=\"wdb\" data-w=\"demand\" data-m=\"수요\"><b>demand</b>수요</button><button type=\"button\" class=\"wdb\" data-w=\"utilize\" data-m=\"활용하다\"><b>utilize</b>활용하다</button><button type=\"button\" class=\"wdb\" data-w=\"adjust\" data-m=\"조정하다\"><b>adjust</b>조정하다</button><button type=\"button\" class=\"wdb\" data-w=\"inform\" data-m=\"알리다\"><b>inform</b>알리다</button></div>", "02": "<p class=\"mtr\">마더텅 정답률 <b>90%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">안내문 불일치는 <b>선택지 순서 = 안내문 순서</b>예요. 하나씩 대조하되, <b>누가(어른/18세 이하)</b>·<b>얼마(반값/무료)</b>처럼 대상과 금액이 바뀌어 섞인 곳을 노리세요.</p><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>①</em>6번 휴관일</span><span><em>②</em>8번 입장권 있을 때 주차 요금</span><span><em>③</em>14번 성인 단체 요금</span><span><em>④</em>16번 금요일 밤 입장료</span><span><em>⑤</em>17번 매달 첫째 일요일</span></div><div class=\"ck-eq\">⇒ 선택지 다섯 개가 안내문 순서대로 한 줄씩 걸려 있어요</div></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step key\"><span class=\"lab\">④ 차례 · 16번 문장 (결정적 단서)</span><div class=\"en\">Admission during Friday Nights, 5 p.m. – 9 p.m. every Friday, is <mark>half-off for adults</mark>, <mark>free for ages 18 and under</mark>.</div><p class=\"ko\">매주 금요일 오후 5시 – 오후 9시, Friday Nights(금요일 밤) 동안의 입장료는, <mark>어른은 반값이고</mark>, <mark>18세 이하일 경우에는 무료이다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>반값(half-off)은 어른 몫이에요. 선택지는 반값을 18세 이하에게 붙여서 대상이 뒤바뀌었어요</span></div><div class=\"ck-step\"><span class=\"lab\">④ 선택지와 맞대 보기</span><div class=\"en\">… is half-off for adults, free for ages 18 and under.</div><p class=\"ko\">… 어른은 반값이고, 18세 이하일 경우에는 무료이다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">금요일 오후 5시 이후 18세 이하의 입장료는 반값이다.<small>16번에서 18세 이하는 무료(free)예요. 반값(half-off)은 어른이에요.</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">10인 이상의 성인 단체일 경우 1인당 입장료가 12달러이다.</span><span class=\"why\">11번 일반 요금 15달러와 헷갈리기 쉽지만, 14번 Adult groups of ten or more(10인 이상의 성인 단체)는 1인당 12달러예요. 일치해요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">월요일과 화요일은 휴관일이다.</span><span class=\"why\">6번 Closed Monday and Tuesday(월요일과 화요일 휴관)와 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">입장권이 있으면 주차 요금은 시간당 1달러이다.</span><span class=\"why\">8번 with an admission ticket(입장권이 있다면) 시간당 1달러와 같아요. 2.50달러는 9번, 입장권이 없을 때예요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">매달 첫째 일요일은 입장료가 무료이다.</span><span class=\"why\">17번 the first Sunday of every month(매달 첫째 일요일)에 free(무료)라고 했어요. 일치해요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Oakland Museum of California</div><div class=\"k\">캘리포니아 오클랜드 박물관</div></div><div class=\"rnat\">캘리포니아 오클랜드 박물관</div><div class=\"rst\">주말에 가족이랑 박물관 나들이를 가려고 안내문을 펼쳤어요. 지문 1번은 캘리포니아 오클랜드 박물관 안내예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Time:</div><div class=\"k\">시간:</div></div><div class=\"rnat\">시간:</div><div class=\"rst\">“몇 시에 가야 하지?” 지문 2번은 여는 시간이 시작되는 작은 제목이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Wednesday – Thursday,</div><div class=\"k\">수요일 – 목요일,</div></div><div class=\"rc\"><div class=\"e\">11 a.m. – 5 p.m.</div><div class=\"k\">오전 11시 – 오후 5시</div></div><div class=\"rnat\">• 수요일 – 목요일, 오전 11시 – 오후 5시</div><div class=\"rst\">수요일·목요일은 오전 11시부터 오후 5시까지 열어요. = 지문 3번</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Friday,</div><div class=\"k\">금요일,</div></div><div class=\"rc\"><div class=\"e\">11 a.m. – 9 p.m.</div><div class=\"k\">오전 11시 – 오후 9시</div></div><div class=\"rnat\">• 금요일, 오전 11시 – 오후 9시</div><div class=\"rst\">금요일은 오후 9시까지, 저녁에도 갈 수 있어요. 학원 끝나고도 가능! = 지문 4번</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Saturday – Sunday,</div><div class=\"k\">토요일 – 일요일,</div></div><div class=\"rc\"><div class=\"e\">11 a.m. – 5 p.m.</div><div class=\"k\">오전 11시 – 오후 5시</div></div><div class=\"rnat\">• 토요일 – 일요일, 오전 11시 – 오후 5시</div><div class=\"rst\">토요일·일요일은 다시 오전 11시부터 오후 5시까지예요. = 지문 5번</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Closed Monday and Tuesday</div><div class=\"k\">월요일과 화요일 휴관</div></div><div class=\"rnat\">• 월요일과 화요일 휴관</div><div class=\"rst\">월요일·화요일엔 가면 문이 닫혀 있어요. = 지문 6번 → ① 일치</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Parking:</div><div class=\"k\">주차:</div></div><div class=\"rnat\">주차:</div><div class=\"rst\">아빠가 “차는 어디 대지?” 하세요. 지문 7번은 주차 안내 작은 제목이에요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">The parking fee is just $1/hour</div><div class=\"k\">주차 요금은 시간당 단 1달러이다</div></div><div class=\"rc\"><div class=\"e\">with an admission ticket.</div><div class=\"k\">입장권이 있다면.</div></div><div class=\"rnat\">• 입장권이 있다면, 주차 요금은 시간당 단 1달러입니다.</div><div class=\"rst\">입장권을 사면 주차비가 시간당 1달러로 싸져요. = 지문 8번 → ② 일치</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">The parking fee without an admission ticket</div><div class=\"k\">입장권이 없다면 주차 요금은</div></div><div class=\"rc\"><div class=\"e\">is $2.50/hour.</div><div class=\"k\">시간당 2.50달러이다.</div></div><div class=\"rnat\">• 입장권이 없다면, 주차 요금은 시간당 2.50달러입니다.</div><div class=\"rst\">입장권 없이 주차만 하면 시간당 2.50달러예요. = 지문 9번, ②와 헷갈리지 않게!</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">Admission rates:</div><div class=\"k\">입장료:</div></div><div class=\"rnat\">입장료:</div><div class=\"rst\">이제 표 값을 볼 차례예요. 지문 10번은 입장료 작은 제목이에요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">$15 general</div><div class=\"k\">일반(인) 15달러</div></div><div class=\"rnat\">• 일반(인) 15달러</div><div class=\"rst\">엄마·아빠 같은 일반 어른은 15달러예요. = 지문 11번</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><div class=\"rc\"><div class=\"e\">$10 students with current ID</div><div class=\"k\">현재의 신분증(학생증)이 있는 학생과</div></div><div class=\"rc\"><div class=\"e\">and seniors (ages 65+)</div><div class=\"k\">(65세 이상) 노인은 10달러</div></div><div class=\"rnat\">• 현재의 신분증(학생증)이 있는 학생과 (65세 이상) 노인 10달러</div><div class=\"rst\">학생증 있는 형과 65세 이상 할머니는 10달러예요. = 지문 12번</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">13번</span><div class=\"rc\"><div class=\"e\">Free for children ages 8 and under</div><div class=\"k\">8세 이하의 어린이는 무료</div></div><div class=\"rnat\">• 8세 이하의 어린이 무료</div><div class=\"rst\">8살 막내 동생은 공짜예요. = 지문 13번</div></div><div class=\"rds\" data-ord=\"14\"><span class=\"rn\">14번</span><div class=\"rc\"><div class=\"e\">Adult groups of ten or more</div><div class=\"k\">10인 이상의 성인 단체는</div></div><div class=\"rc\"><div class=\"e\">are $12 per person.</div><div class=\"k\">한 명당 12달러이다.</div></div><div class=\"rnat\">• 10인 이상의 성인 단체는 한 명당 12달러입니다.</div><div class=\"rst\">친척까지 어른 10명 이상이 같이 가면 한 명당 12달러예요. = 지문 14번 → ③ 일치</div></div><div class=\"rds\" data-ord=\"15\"><span class=\"rn\">15번</span><div class=\"rc\"><div class=\"e\">Other:</div><div class=\"k\">기타:</div></div><div class=\"rnat\">기타:</div><div class=\"rst\">“더 싸게 가는 방법은 없나?” 지문 15번은 기타 안내 작은 제목이에요.</div></div><div class=\"rds key\" data-ord=\"16\"><span class=\"rn\">16번 · 단서</span><div class=\"rc\"><div class=\"e\">Admission during Friday Nights,</div><div class=\"k\">Friday Nights(금요일 밤) 동안의 입장료는,</div></div><div class=\"rc\"><div class=\"e\">5 p.m. – 9 p.m. every Friday,</div><div class=\"k\">매주 금요일 오후 5시 – 오후 9시,</div></div><div class=\"rc ckc\"><div class=\"e\">is <span class=\"cw\">half-off for adults</span>,</div><div class=\"k\"><span class=\"cw\">어른은 반값이고</span>,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">free for ages 18 and under</span>.</div><div class=\"k\"><span class=\"cw\">18세 이하일 경우에는 무료이다</span>.</div></div><div class=\"rnat\">• 매주 금요일 오후 5시 – 오후 9시 'Friday Nights(금요일 밤)' 동안의 입장료는 어른은 반값, 18세 이하일 경우에는 무료입니다.</div><div class=\"rst\">금요일 밤 5~9시엔 어른은 <b>반값</b>(half-off), 18세 이하인 나는 <b>무료</b>(free)예요! = 지문 16번 → ④가 틀린 곳</div></div><div class=\"rds\" data-ord=\"17\"><span class=\"rn\">17번</span><div class=\"rc\"><div class=\"e\">Admission is free</div><div class=\"k\">입장료가 무료이다</div></div><div class=\"rc\"><div class=\"e\">the first Sunday of every month.</div><div class=\"k\">매달의 첫째 일요일에는.</div></div><div class=\"rnat\">• 매달의 첫째 일요일은 입장료가 무료입니다.</div><div class=\"rst\">매달 첫째 일요일엔 온 가족이 공짜로 들어가요. = 지문 17번 → ⑤ 일치</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"admission\" data-m=\"입장, 입장료\"><b>admission</b>입장, 입장료</button><button type=\"button\" class=\"wdb\" data-w=\"fee\" data-m=\"요금\"><b>fee</b>요금</button><button type=\"button\" class=\"wdb\" data-w=\"rate\" data-m=\"요금\"><b>rate</b>요금</button><button type=\"button\" class=\"wdb\" data-w=\"current\" data-m=\"현재의\"><b>current</b>현재의</button><button type=\"button\" class=\"wdb\" data-w=\"senior\" data-m=\"고령자, 어르신\"><b>senior</b>고령자, 어르신</button><button type=\"button\" class=\"wdb\" data-w=\"half-off\" data-m=\"반값\"><b>half-off</b>반값</button></div>", "03": "<p class=\"mtr\">마더텅 정답률 <b>80%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">제목은 <b>However(하지만)</b>로 상식을 뒤집는 문장이 핵심이에요. 6번에서 뇌가 모양·색깔·위치·움직임을 <b>각각 따로</b> 본다고 하고, 7번 <b>Consequently(따라서)</b>가 그 결과를 보여 줘요.</p><div class=\"ck-step\"><span class=\"lab\">5번 문장 · 깨질 상식</span><div class=\"en\">It is natural to assume that anyone who sees an object <mark>sees everything about it</mark> …</div><p class=\"ko\">어떤 물체를 보는 사람은 누구든 <mark>그것에 관한 모든 것을 보고 있다고</mark> 추정하는 것은 당연하다 …</p></div><div class=\"ck-via\"><i>▼</i><span>However(하지만)로 5번 상식을 뒤집어요. 진짜 주장이 여기 나와요</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 결정적 단서</span><div class=\"en\"><mark>However</mark>, <mark>one part of your brain sees its shape, another sees color</mark>, another detects location, and another perceives movement.</div><p class=\"ko\"><mark>하지만</mark>, <mark>여러분의 뇌의 한 부분은 모양을 보고, 다른 한 부분은 색깔을 보며</mark>, 또 다른 부분은 위치를 감지하고, 또 다른 한 부분은 움직임을 인식한다.</p></div><div class=\"ck-via\"><i>▼</i><span>Consequently(따라서) — 따로 맡으니 한 곳만 다쳐도 일부만 안 보여요</span></div><div class=\"ck-step\"><span class=\"lab\">7번 문장 · 따로라서 생기는 일</span><div class=\"en\"><mark>Consequently</mark>, after localized brain damage, it is possible to see certain aspects of an object and not others.</div><p class=\"ko\"><mark>따라서</mark>, 국부적 뇌 손상 후에, 어떤 물체의 특정한 측면은 보면서 다른 측면은 보지 못하는 것이 가능하다.</p></div><div class=\"ck-via\"><i>▼</i><span>위치나 움직임만 못 보는 사람 = 각 부분이 독립적이라는 증거</span></div><div class=\"ck-step\"><span class=\"lab\">9번 문장 · 예시로 확인</span><div class=\"en\">… people who see an object without seeing where it is, or see it without seeing whether it is moving.</div><p class=\"ko\">… 어떤 물체가 어디에 있는지 보지 못하면서 그것을 보거나, 또는 그것이 움직이고 있는지 보지 못하면서 그것을 보는 사람들.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">Separate and Independent(분리되고 독립적인): Brain Cells' Visual Perceptions(뇌세포의 시각적 인식)<small>6번의 “각각 따로”가 Separate(분리된), 7·9번의 “일부만 안 보임”이 Independent(독립적인)예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">Blind Spots(맹점): What Is Still Unknown About the Brain(뇌에 대해 아직 알려지지 않은 것)</span><span class=\"why\">[지문에 없음] 9번의 “놀랍다”만 보고 고르기 쉬워요. 하지만 지문은 모르는 것이 아니라 뇌가 따로 본다는 밝혀진 사실을 설명해요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">Visual Systems Never Betray Our Trust(시각 시스템은 결코 우리의 믿음을 저버리지 않는다)!</span><span class=\"why\">[반대] 7번은 뇌 손상 뒤 물체의 일부만 보일 수 있다고 해요. 시각이 늘 믿을 만하다는 말과 반대예요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">Secret Missions of Color-Sensitive Brain Cells(색에 민감한 뇌세포의 비밀 임무)</span><span class=\"why\">[범위 좁음] 색깔은 6번의 네 가지(모양·색깔·위치·움직임) 중 하나일 뿐이에요. 비밀 임무 이야기도 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">Why Brain Cells Exemplify Nature's Recovery Process(뇌세포가 자연의 회복 과정의 예가 되는 이유)</span><span class=\"why\">[지문에 없음] 7번에 뇌 손상은 나오지만 회복(recovery)되는 과정은 한 번도 안 나와요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Different parts of the brain’s visual system</div><div class=\"k\">뇌 시각 시스템의 다양한 부분들은</div></div><div class=\"rc\"><div class=\"e\">get information</div><div class=\"k\">정보를 얻는다</div></div><div class=\"rc\"><div class=\"e\">on a need-to-know basis.</div><div class=\"k\">꼭 필요한 때 꼭 필요한 것만 알려주는 방식으로.</div></div><div class=\"rnat\">뇌 시각 시스템의 다양한 부분들은 꼭 필요한 때 꼭 필요한 것만 알려주는 방식으로 정보를 얻는다.</div><div class=\"rst\">축구 중계팀을 떠올려 봐요. 팀원마다 꼭 필요한 것만 전달받아요. = 지문 1번, 뇌의 시각 부분들도 필요한 정보만 받아요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Cells that help your hand muscles</div><div class=\"k\">여러분의 손 근육을 돕는 세포들은</div></div><div class=\"rc\"><div class=\"e\">reach out to an object</div><div class=\"k\">어떤 물체에 닿을 수 있도록</div></div><div class=\"rc\"><div class=\"e\">need to know the size and location of the object,</div><div class=\"k\">그 물체의 크기와 위치를 알아야 할 필요가 있지만,</div></div><div class=\"rc\"><div class=\"e\">but they don’t need to know about color.</div><div class=\"k\">그것들(= 손 근육을 돕는 세포들)은 색깔에 대해 알 필요는 없다.</div></div><div class=\"rnat\">여러분의 손 근육이 어떤 물체에 닿을 수 있도록 돕는 세포들은 그 물체의 크기와 위치를 알아야 할 필요가 있지만, 색깔에 대해 알 필요는 없다.</div><div class=\"rst\">공을 잡는 골키퍼 담당은 공의 크기와 위치만 알면 되고, 공 색깔은 몰라도 돼요. = 지문 2번의 손 근육 돕는 세포예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">They need to know a little about shape,</div><div class=\"k\">그것들(= 손 근육을 돕는 세포들)은 모양에 대해 약간 알아야 할 필요가 있지만,</div></div><div class=\"rc\"><div class=\"e\">but not in great detail.</div><div class=\"k\">매우 자세하게는 아니다.</div></div><div class=\"rnat\">세포들은 모양에 대해 약간 알아야 할 필요가 있지만, 매우 자세하게는 아니다.</div><div class=\"rst\">공 모양도 둥근지 정도만 알면 되지, 무늬까지 자세히 알 필요는 없어요. = 지문 3번이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Cells that help you recognize people’s faces</div><div class=\"k\">여러분이 사람들의 얼굴을 인식하도록 돕는 세포들은</div></div><div class=\"rc\"><div class=\"e\">need to be extremely sensitive to details of shape,</div><div class=\"k\">모양의 세부 사항에 극도로 예민해야 할 필요가 있지만,</div></div><div class=\"rc\"><div class=\"e\">but they can pay less attention to location.</div><div class=\"k\">그것들(= 얼굴을 인식하도록 돕는 세포들)은 위치에는 주의를 덜 기울일 수 있다.</div></div><div class=\"rnat\">여러분이 사람들의 얼굴을 인식하도록 돕는 세포들은 모양의 세부 사항에 극도로 예민해야 할 필요가 있지만, 위치에는 주의를 덜 기울일 수 있다.</div><div class=\"rst\">선수 얼굴 알아보는 담당은 얼굴 생김새는 꼼꼼히 봐야 하지만, 어디 서 있는지는 덜 신경 써도 돼요. = 지문 4번이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">It is natural</div><div class=\"k\">~하는 것은 당연하다(가주어: 진짜 주어는 to assume 이하)</div></div><div class=\"rc\"><div class=\"e\">to assume</div><div class=\"k\">추정하는 것은</div></div><div class=\"rc\"><div class=\"e\">that anyone who sees an object</div><div class=\"k\">어떤 물체를 보는 사람은 누구든</div></div><div class=\"rc\"><div class=\"e\">sees everything about it</div><div class=\"k\">그것(= 물체)에 관한 모든 것을 보고 있다고</div></div><div class=\"rc\"><div class=\"e\">— the shape, color, location, and movement.</div><div class=\"k\">— 모양, 색깔, 위치, 그리고 움직임 등.</div></div><div class=\"rnat\">어떤 물체를 보는 사람은 누구든 모양, 색깔, 위치, 그리고 움직임 등 그것에 관한 모든 것을 보고 있다고 추정하는 것은 당연하다.</div><div class=\"rst\">보통은 “경기를 보면 공 색·위치·움직임을 한 번에 다 보지” 하고 생각해요. 지문 5번도 그게 당연한 생각이라고 해요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">However</span>,</div><div class=\"k\"><span class=\"cw\">하지만</span>,</div></div><div class=\"rc\"><div class=\"e\">one part of your brain sees its shape,</div><div class=\"k\">여러분의 뇌의 한 부분은 그것(= 물체)의 모양을 보고,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">another sees color</span>,</div><div class=\"k\"><span class=\"cw\">다른 한 부분은 색깔을 보며</span>,</div></div><div class=\"rc\"><div class=\"e\">another detects location,</div><div class=\"k\">또 다른 부분은 위치를 감지하고,</div></div><div class=\"rc\"><div class=\"e\">and another perceives movement.</div><div class=\"k\">또 다른 한 부분은 움직임을 인식한다.</div></div><div class=\"rnat\">하지만 여러분의 뇌의 한 부분은 그것의 모양을 보고, 다른 한 부분은 색깔을 보며, 또 다른 부분은 위치를 감지하고, 또 다른 한 부분은 움직임을 인식한다.</div><div class=\"rst\"><b>하지만</b>(However) 사실은 모양 담당, 색깔 담당, 위치 담당, 움직임 담당이 <b>따로따로</b> 있어요. = 지문 6번, 글의 핵심이에요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Consequently</span>,</div><div class=\"k\"><span class=\"cw\">따라서</span>,</div></div><div class=\"rc\"><div class=\"e\">after localized brain damage,</div><div class=\"k\">국부적 뇌 손상 후에,</div></div><div class=\"rc\"><div class=\"e\">it is possible</div><div class=\"k\">~하는 것이 가능하다(가주어)</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">to see certain aspects of an object</span></div><div class=\"k\"><span class=\"cw\">어떤 물체의 특정한 측면은 보면서</span></div></div><div class=\"rc\"><div class=\"e\">and not others.</div><div class=\"k\">다른 측면은 보지 못하는.</div></div><div class=\"rnat\">따라서 국부적 뇌 손상 후에, 어떤 물체의 특정한 측면은 보면서 다른 측면은 보지 못하는 것이 가능하다.</div><div class=\"rst\"><b>그래서</b>(Consequently) 위치 담당이 결석하면 공은 보이는데 어디 있는지 몰라요. 지문 7번도 뇌 한 곳이 다치면 일부만 안 보인다고 해요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">Centuries ago,</div><div class=\"k\">수 세기 전,</div></div><div class=\"rc\"><div class=\"e\">people found it difficult</div><div class=\"k\">사람들은 ~하기가 어렵다고 생각했다(가목적어)</div></div><div class=\"rc\"><div class=\"e\">to imagine how someone could see an object</div><div class=\"k\">어떻게 누군가가 어떤 물체를 볼 수 있는지 상상하기가</div></div><div class=\"rc\"><div class=\"e\">without seeing what color it is.</div><div class=\"k\">그것(= 물체)의 색깔이 무엇인지 못 보면서.</div></div><div class=\"rnat\">수 세기 전, 사람들은 어떻게 누군가가 어떤 물체의 색깔이 무엇인지 못 보면서 그 물체를 볼 수 있는지 상상하기가 어렵다고 생각했다.</div><div class=\"rst\">옛날 사람들은 “색은 못 보는데 물건은 보인다고?” 하며 상상도 못 했대요. = 지문 8번이에요.</div></div><div class=\"rds key\" data-ord=\"9\"><span class=\"rn\">9번 · 단서</span><div class=\"rc\"><div class=\"e\">Even today,</div><div class=\"k\">심지어 오늘날에도,</div></div><div class=\"rc\"><div class=\"e\">you might find it surprising</div><div class=\"k\">여러분은 놀랍다고 생각할지도 모른다(가목적어)</div></div><div class=\"rc\"><div class=\"e\">to learn about people</div><div class=\"k\">사람들에 대해 알게 되면</div></div><div class=\"rc\"><div class=\"e\">who see an object without seeing where it is,</div><div class=\"k\">어떤 물체가 어디에 있는지 보지 못하면서 그것(= 물체)을 보거나,</div></div><div class=\"rc\"><div class=\"e\">or see it without seeing whether it is moving.</div><div class=\"k\">또는 그것(= 물체)이 움직이고 있는지 보지 못하면서 그것(= 물체)을 보는.</div></div><div class=\"rnat\">심지어 오늘날에도, 여러분은 어떤 물체가 어디에 있는지 보지 못하면서 그것을 보거나, 또는 그것이 움직이고 있는지 보지 못하면서 그것을 보는 사람들에 대해 알게 되면 놀랍다고 생각할지도 모른다.</div><div class=\"rst\">지금도 공은 보이는데 어디 있는지, 움직이는지 모르는 사람 얘기는 놀라워요. = 지문 9번, 그래서 제목은 “분리되고 독립적인 시각 인식”이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"on a need-to-know basis\" data-m=\"꼭 필요한 것만 알려 주는 방식으로\"><b>on a need-to-know basis</b>꼭 필요한 것만 알려 주는 방식으로</button><button type=\"button\" class=\"wdb\" data-w=\"detect\" data-m=\"감지하다\"><b>detect</b>감지하다</button><button type=\"button\" class=\"wdb\" data-w=\"perceive\" data-m=\"인식하다, 지각하다\"><b>perceive</b>인식하다, 지각하다</button><button type=\"button\" class=\"wdb\" data-w=\"localized\" data-m=\"국부적인\"><b>localized</b>국부적인</button><button type=\"button\" class=\"wdb\" data-w=\"aspect\" data-m=\"측면\"><b>aspect</b>측면</button><button type=\"button\" class=\"wdb\" data-w=\"assume\" data-m=\"추정하다, 당연히 여기다\"><b>assume</b>추정하다, 당연히 여기다</button></div>", "04": "<p class=\"mtr\">마더텅 정답률 <b>75%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">요지는 빵 냄새 <b>예시</b>(1~3번)가 아니라, <b>The exact same concept(정확히 같은 개념)</b>로 행복에 옮겨 간 뒤 <b>however(하지만)</b>가 붙은 7번에 있어요. 8번 속담이 한 번 더 못 박아요.</p><div class=\"ck-step\"><span class=\"lab\">2번 문장 · 예시(익숙해지면 사라짐)</span><div class=\"en\">However, stay in the room for a few minutes, and <mark>the smell will seem to disappear</mark>.</div><p class=\"ko\">하지만, 몇 분 동안 방에 머무르면, <mark>그 냄새가 사라지는 것 같을 것이다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>빵 냄새 이야기가 “같은 개념”으로 삶과 행복에 연결돼요</span></div><div class=\"ck-step\"><span class=\"lab\">4번 문장 · 예시 → 행복으로</span><div class=\"en\"><mark>The exact same concept</mark> applies to many areas of our lives, including happiness.</div><p class=\"ko\"><mark>정확히 같은 개념이</mark> 행복을 포함하여, 우리 삶의 많은 분야에 적용된다.</p></div><div class=\"ck-via\"><i>▼</i><span>however(하지만)로 꺾이며, 소중한 것도 빵 냄새처럼 잊힌다고 해요</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 문장 · 결정적 요지</span><div class=\"en\">As time passes, however, <mark>they get used to what they have</mark> and, just like the smell of fresh bread, these wonderful assets disappear from their consciousness.</div><p class=\"ko\">하지만 시간이 지나면서, <mark>그들은 그들이 가지고 있는 것에 익숙해지고</mark>, 마치 갓 만든 빵 냄새처럼, 이런 훌륭하고 소중한 것은 그들의 의식에서 사라진다.</p></div><div class=\"ck-via\"><i>▼</i><span>우물이 말라야 물이 아쉽다 = 잃어야 소중함을 안다</span></div><div class=\"ck-step\"><span class=\"lab\">8번 문장 · 속담으로 확인</span><div class=\"en\">As the old proverb goes, <mark>you never miss the water</mark> till the well runs dry.</div><p class=\"ko\">옛 속담대로, 우물이 말라 버릴 때까지는 <mark>당신은 물을 결코 아쉬워하지 않는다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">익숙함이 소중한 것의 가치를 잊게 한다.<small>7번의 get used to(익숙해지다) + disappear from their consciousness(의식에서 사라지다)를 그대로 옮겼어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">작은 행복이 모여서 큰 행복이 된다.</span><span class=\"why\">[지문에 없음] 6번에 건강·음식 같은 행복거리가 여러 개 나오지만, 모여서 커진다는 말은 없어요. 7번은 오히려 그것들이 잊힌다고 해요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">새로움을 추구하는 삶이 가치 있다.</span><span class=\"why\">[지문에 없음] 3번에서 방을 나갔다 오라는 건 냄새를 다시 느끼는 방법일 뿐, 새로운 것을 찾으라는 주장이 아니에요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">즐거움은 어느 정도의 고통을 수반한다.</span><span class=\"why\">[지문에 없음] 고통 이야기는 한 번도 안 나와요. 1번의 빵 냄새는 pleasant(기분 좋은) 냄새예요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">결과보다 과정에 집중하는 삶이 행복하다.</span><span class=\"why\">[지문에 없음] 결과·과정을 비교하는 문장이 없어요. 글은 가진 것에 익숙해져 잊는다는 이야기(7번)예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">If you walk into a room</div><div class=\"k\">만약 당신이 방으로 걸어 들어간다면</div></div><div class=\"rc\"><div class=\"e\">that smells of freshly baked bread,</div><div class=\"k\">갓 구운 빵 냄새가 나는,</div></div><div class=\"rc\"><div class=\"e\">you quickly detect</div><div class=\"k\">당신은 빨리 알아챈다</div></div><div class=\"rc\"><div class=\"e\">the rather pleasant smell.</div><div class=\"k\">꽤 기분 좋은 냄새를.</div></div><div class=\"rnat\">만약 당신이 갓 구운 빵 냄새가 나는 방으로 걸어 들어간다면, 당신은 꽤 기분 좋은 냄새를 빨리 알아챈다.</div><div class=\"rst\">학교 끝나고 집에 오니 부엌에서 빵을 굽고 있어요. 현관에서 바로 “와, 빵 냄새!” 해요. = 지문 1번</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">However,</div><div class=\"k\">하지만,</div></div><div class=\"rc\"><div class=\"e\">stay in the room for a few minutes,</div><div class=\"k\">몇 분 동안 방에 머무르면,</div></div><div class=\"rc\"><div class=\"e\">and the smell will seem to disappear.</div><div class=\"k\">그 냄새가 사라지는 것 같을 것이다.</div></div><div class=\"rnat\">하지만, 몇 분 동안 방에 머무르면, 그 냄새가 사라지는 것 같을 것이다.</div><div class=\"rst\"><b>그런데</b>(However) 거실에 몇 분 앉아 있으면 냄새가 안 나는 것 같아요. = 지문 2번, 익숙해지면 사라져요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">In fact,</div><div class=\"k\">사실,</div></div><div class=\"rc\"><div class=\"e\">the only way to reawaken it</div><div class=\"k\">그것(= 갓 구운 빵 냄새)을 다시 불러일으키는 유일한 방법은</div></div><div class=\"rc\"><div class=\"e\">is to walk out of the room</div><div class=\"k\">방에서 걸어 나갔다가</div></div><div class=\"rc\"><div class=\"e\">and come back in again.</div><div class=\"k\">다시 (방) 안으로 돌아오는 것이다.</div></div><div class=\"rnat\">사실, 그것(갓 구운 빵 냄새)을 다시 불러일으키는 유일한 방법은 방에서 걸어 나갔다가 다시 (방) 안으로 돌아오는 것이다.</div><div class=\"rst\">다시 맡으려면 밖에 나갔다 들어와야 해요. 지문 3번도 그게 유일한 방법이라고 해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">The exact same concept</span></div><div class=\"k\"><span class=\"cw\">정확히 같은 개념이</span></div></div><div class=\"rc\"><div class=\"e\">applies to many areas of our lives,</div><div class=\"k\">우리 삶의 많은 분야에 적용된다,</div></div><div class=\"rc\"><div class=\"e\">including happiness.</div><div class=\"k\">행복을 포함하여.</div></div><div class=\"rnat\">정확히 같은 개념이 행복을 포함하여, 우리 삶의 많은 분야에 적용된다.</div><div class=\"rst\">이건 냄새만의 얘기가 아니에요. 지문 4번은 <b>똑같은 일</b>(The exact same concept)이 행복에도 일어난다고 해요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Everyone has something</div><div class=\"k\">모든 사람에게는 무언가가 있다</div></div><div class=\"rc\"><div class=\"e\">to be happy about.</div><div class=\"k\">행복해 하는.</div></div><div class=\"rnat\">모든 사람에게는 행복해 하는 무언가가 있다.</div><div class=\"rst\">우리에게도 행복해할 거리는 다 있어요. = 지문 5번</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Perhaps</div><div class=\"k\">아마도</div></div><div class=\"rc\"><div class=\"e\">they have a loving partner,</div><div class=\"k\">그들(= 모든 사람들)에게는 사랑하는 동반자,</div></div><div class=\"rc\"><div class=\"e\">good health,</div><div class=\"k\">건강,</div></div><div class=\"rc\"><div class=\"e\">a satisfying job,</div><div class=\"k\">만족스러운 직업,</div></div><div class=\"rc\"><div class=\"e\">a roof over their heads,</div><div class=\"k\">주거지,</div></div><div class=\"rc\"><div class=\"e\">or enough food to eat.</div><div class=\"k\">또는 먹을 충분한 음식이 있을 것이다.</div></div><div class=\"rnat\">아마도 그들에게는 사랑하는 동반자, 건강, 만족스러운 직업, 주거지 또는 먹을 충분한 음식이 있을 것이다.</div><div class=\"rst\">늘 챙겨 주는 가족, 건강한 몸, 따뜻한 집, 매일 먹는 밥처럼요. 지문 6번의 동반자·건강·집·음식이에요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">As time passes, however,</div><div class=\"k\">하지만 시간이 지나면서,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">they get used to what they have</span></div><div class=\"k\"><span class=\"cw\">그들은 그들이 가지고 있는 것에 익숙해지고</span>,</div></div><div class=\"rc\"><div class=\"e\">and, just like the smell of fresh bread,</div><div class=\"k\">마치 갓 만든 빵 냄새처럼,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">these wonderful assets disappear</span></div><div class=\"k\"><span class=\"cw\">이런 훌륭하고 소중한 것(= 동반자, 건강, 직업 등)은 사라진다</span></div></div><div class=\"rc\"><div class=\"e\">from their consciousness.</div><div class=\"k\">그들의 의식에서.</div></div><div class=\"rnat\">하지만 시간이 지나면서, 그들은 그들이 가지고 있는 것에 익숙해지고, 마치 갓 만든 빵 냄새처럼, 이런 훌륭하고, 소중한 것은 그들의 의식에서 사라진다.</div><div class=\"rst\"><b>하지만 매일 있으니까 익숙해져서</b>(get used to) 고마운 줄 몰라요. 지문 7번이 요지예요. 빵 냄새처럼 소중한 것이 머릿속에서 사라져요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc\"><div class=\"e\">As the old proverb goes,</div><div class=\"k\">옛 속담대로,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">you never miss the water</span></div><div class=\"k\"><span class=\"cw\">당신은 물을 결코 아쉬워하지 않는다</span></div></div><div class=\"rc\"><div class=\"e\">till the well runs dry.</div><div class=\"k\">우물이 말라 버릴 때까지는.</div></div><div class=\"rnat\">옛 속담대로, 우물이 말라 버리고 나서야 당신은 비로소 물을 아쉬워한다(물의 가치를 다시 알게 된다).</div><div class=\"rst\">정수기 물이 끊겨야 물이 아쉬운 것처럼요. 지문 8번 속담도 잃고 나서야 소중함을 안다는 말이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"detect\" data-m=\"알아채다, 감지하다\"><b>detect</b>알아채다, 감지하다</button><button type=\"button\" class=\"wdb\" data-w=\"reawaken\" data-m=\"다시 불러일으키다\"><b>reawaken</b>다시 불러일으키다</button><button type=\"button\" class=\"wdb\" data-w=\"concept\" data-m=\"개념\"><b>concept</b>개념</button><button type=\"button\" class=\"wdb\" data-w=\"asset\" data-m=\"소중한 것, 자산\"><b>asset</b>소중한 것, 자산</button><button type=\"button\" class=\"wdb\" data-w=\"consciousness\" data-m=\"의식, 자각\"><b>consciousness</b>의식, 자각</button><button type=\"button\" class=\"wdb\" data-w=\"proverb\" data-m=\"속담\"><b>proverb</b>속담</button></div>", "05": "<p class=\"mtr\">마더텅 정답률 <b>35%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">재귀대명사(-self(자신), -selves(자신들))는 <b>같은 동사의 주어와 목적어가 같은 대상</b>일 때만 써요. 밑줄 앞 동사 collect(수거하다)를 <b>누가</b> 하는지부터 확인하세요.</p><div class=\"ck-step\"><span class=\"lab\">문제지 ③번 자리 (3번)</span><div class=\"en\">… small enough to pass through the nets typically used to collect <u>③ themselves</u>.</div><p class=\"ko\">( ? )을 수거하기 위해 일반적으로 사용되는 그물망을 통과할 만큼 충분히 작으면</p></div><div class=\"ck-via\"><i>▼</i><span>수거되는 대상은 문장의 주어 These microplastics(이 미세 플라스틱)예요</span></div><div class=\"ck-step\"><span class=\"lab\">3번 문장 · 수거되는 것</span><div class=\"en\"><mark>These microplastics</mark> are very difficult to measure once they are small enough to pass through the nets …</div><p class=\"ko\"><mark>이 미세 플라스틱은</mark> 일단 그것들이 그물망을 통과할 만큼 충분히 작으면 측정하기가 매우 어렵다 …</p></div><div class=\"ck-via\"><i>▼</i><span>그물을 써서 collect(수거하다)하는 건 사람이지 미세 플라스틱이 아니에요 → 주어 ≠ 목적어 → them(그것들을)</span></div><div class=\"ck-step key\"><span class=\"lab\">3번 문장 · 결정적 단서</span><div class=\"en\">… the nets typically used <mark>to collect them</mark>.</div><p class=\"ko\">… <mark>그것들(= 미세 플라스틱)을 수거하기 위해</mark> 일반적으로 사용되는 그물망.</p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">재귀대명사 themselves(그것들 자신을)와 목적격 대명사 them(그것들을) 구별</p><p class=\"gr\">같은 동사의 주어와 목적어가 같은 대상이면 재귀대명사(-self(자신), -selves(자신들)), 다른 대상이면 목적격 대명사(him(그를), them(그것들을) 등)를 써요. 문장 전체 주어가 아니라 그 동사를 '하는 사람'을 기준으로 봐요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>Tom looked at himself in the mirror.</div><div class=\"ko\">톰은 거울 속 자기 자신을 보았다. (보는 사람 = 보이는 사람이라 himself가 맞아요)</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>The kids made cookies and gave them to Mom.</div><div class=\"ko\">아이들은 쿠키를 만들어서 엄마에게 그것들을 드렸다. (주는 사람은 아이들, 주는 것은 쿠키라 them이 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>The kids made cookies and gave themselves to Mom.</div><div class=\"ko\">아이들이 '자기 자신'을 엄마에게 준 말이 되어 틀려요.</div></div><p class=\"gb\">지문 3번도 collect(수거하다)하는 것은 그물을 쓰는 사람이고, 수거되는 것은 미세 플라스틱이에요. 둘이 다르니 themselves(그것들 자신을)가 아니라 them(그것들을)이에요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">themselves → them (그것들을)<small>collect(수거하다)하는 사람과 수거되는 미세 플라스틱이 다르니 them(그것들을)이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">which 그리고 이것은</span><span class=\"why\">1번은 쉼표(,) 바로 뒤에 ① 자리가 오고, 앞 내용(느리게 분해되고 물에 뜸) 전체를 받아서 allows(~하게 한다)의 주어가 돼요. 쉼표 뒤에서 앞 내용을 받는 관계대명사는 which(그리고 이것은)예요. that(그것)은 쉼표 뒤에 못 써요.</span><div class=\"gm wx\"><p class=\"gt\">계속적 용법 관계대명사: 쉼표(,) + which(그리고 이것은) — 앞 문장 전체도 받을 수 있음</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>He missed the bus, which made him late.</div><div class=\"ko\">그는 버스를 놓쳤고, 그게 그를 늦게 만들었다. (쉼표 뒤 which가 '버스를 놓친 일'을 받아서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>He missed the bus, that made him late.</div><div class=\"ko\">쉼표 뒤에 that(그것)을 써서 틀려요.</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>He missed the bus, what made him late.</div><div class=\"ko\">what(~하는 것)은 앞에 받을 말이 있으면 못 써서 틀려요.</div></div><p class=\"gb\">지문 1번도 쉼표 뒤에서 '느리게 분해되고 물에 뜨는 것'을 받아 which allows it(이는 그것을 ~하게 한다)가 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">forming 형성하면서</span><span class=\"why\">2번은 Most plastics break down(대부분의 플라스틱은 분해된다)으로 문장이 이미 끝나고, 쉼표 뒤에 덧붙는 분사구문 자리예요. 플라스틱이 미세 플라스틱을 직접 '만드는' 쪽이고 뒤에 목적어 microplastics(미세 플라스틱)가 있으니 능동 forming(형성하면서)이 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">분사구문: 주어가 직접 하면 -ing(~하면서), 당하면 p.p.(~된 채)</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>She walked home, singing a song.</div><div class=\"ko\">그녀는 노래를 부르면서 집에 걸어갔다. (그녀가 직접 노래하니 singing 부르면서가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>She walked home, sung a song.</div><div class=\"ko\">그녀가 노래를 '불리는' 게 아닌데 수동 sung(불린)을 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>The ice melted, making a puddle.</div><div class=\"ko\">얼음이 녹아서 웅덩이를 만들었다. (얼음이 웅덩이를 만드니 making 만들면서가 맞아요)</div></div><p class=\"gb\">지문 2번도 플라스틱이 미세 플라스틱을 만들어 내니 forming microplastics(미세 플라스틱을 형성하면서)가 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">are ~이다</span><span class=\"why\">4번의 주어는 Their impacts(그것들의 영향)이고, on the marine environment and food webs(해양 환경과 먹이 그물에 미치는)는 꾸며 주는 말이에요. 진짜 주어 impacts(영향들)가 복수라서 are(~이다)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">주어-동사 수 일치: 꾸며 주는 말(전치사구)을 걷어 내고 진짜 주어를 찾기</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>The books on the desk are mine.</div><div class=\"ko\">책상 위의 책들은 내 것이다. (진짜 주어 books 책들이 복수라 are가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>The books on the desk is mine.</div><div class=\"ko\">desk(책상)에 끌려 is를 써서 틀려요. 주어는 books(책들)예요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>The color of the shoes is blue.</div><div class=\"ko\">그 신발의 색깔은 파랗다. (진짜 주어 color 색깔이 단수라 is가 맞아요)</div></div><p class=\"gb\">지문 4번도 food webs(먹이 그물)가 아니라 Their impacts(그것들의 영향)가 주어라서 복수 동사 are(~이다)가 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">relatively 비교적</span><span class=\"why\">7번의 ⑤ 자리 바로 뒤는 형용사 small(적은)이고, 그 뒤가 명사 amount(양)예요. 형용사 small(적은)을 꾸며 주는 자리라 부사 relatively(비교적)가 맞아요. 형용사 relative(상대적인)는 형용사를 꾸밀 수 없어요.</span><div class=\"gm wx\"><p class=\"gt\">형용사를 꾸미는 건 부사: 부사 + 형용사 + 명사</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>It was a really hot day.</div><div class=\"ko\">정말 더운 날이었다. (부사 really 정말이 형용사 hot 더운을 꾸며서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>It was a real hot day.</div><div class=\"ko\">형용사 real(진짜의)이 형용사 hot(더운)을 꾸미려 해서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>He solved a fairly easy problem.</div><div class=\"ko\">그는 꽤 쉬운 문제를 풀었다. (부사 fairly 꽤가 형용사 easy 쉬운을 꾸며서 맞아요)</div></div><p class=\"gb\">지문 7번도 relatively(비교적)가 small(적은)을 꾸며 '비교적 적은 양'이 되니 부사가 맞아요.</p></div></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Plastic is extremely slow to degrade</div><div class=\"k\">플라스틱은 매우 느리게 분해되고</div></div><div class=\"rc\"><div class=\"e\">and tends to float,</div><div class=\"k\">물에 떠다니는 경향이 있는데,</div></div><div class=\"rc\"><div class=\"e\">which allows it to travel</div><div class=\"k\">이는(= 느리게 분해되고 물에 뜨는 경향) 그것(= 플라스틱)을 돌아다니게 한다</div></div><div class=\"rc\"><div class=\"e\">in ocean currents</div><div class=\"k\">해류를 따라</div></div><div class=\"rc\"><div class=\"e\">for thousands of miles.</div><div class=\"k\">수천 마일을.</div></div><div class=\"rnat\">플라스틱은 매우 느리게 분해되고 물에 떠다니는 경향이 있는데, 이는 그것(플라스틱)을 해류를 따라 수천 마일을 돌아다니게 한다.</div><div class=\"rst\">플라스틱은 아주 천천히 썩고 물에 둥둥 떠요. 그래서 바닷물을 타고 아주 멀리 가요. 쉼표 뒤 which(이는)가 앞 내용 전체를 받아요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Most plastics break down</div><div class=\"k\">대부분의 플라스틱은 분해된다</div></div><div class=\"rc\"><div class=\"e\">into smaller and smaller pieces</div><div class=\"k\">점점 더 작은 조각들로</div></div><div class=\"rc\"><div class=\"e\">when exposed to ultraviolet (UV) light,</div><div class=\"k\">자외선에 노출될 때,</div></div><div class=\"rc\"><div class=\"e\">forming microplastics.</div><div class=\"k\">미세 플라스틱을 형성하면서.</div></div><div class=\"rnat\">대부분의 플라스틱은 자외선에 노출될 때 미세 플라스틱을 형성하면서, 점점 더 작은 조각들로 분해된다.</div><div class=\"rst\">햇빛(자외선)을 받으면 점점 잘게 부서져 <b>미세 플라스틱</b>이 돼요. 플라스틱이 직접 만드니 forming(형성하면서)이에요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">These microplastics</span> are very difficult to measure</div><div class=\"k\"><span class=\"cw\">이 미세 플라스틱은</span> 측정하기가 매우 어렵다</div></div><div class=\"rc\"><div class=\"e\">once they are small enough</div><div class=\"k\">일단 그것들(= 미세 플라스틱)이 충분히 작으면</div></div><div class=\"rc\"><div class=\"e\">to pass through the nets</div><div class=\"k\">그물망을 통과할 만큼</div></div><div class=\"rc ckc\"><div class=\"e\">typically used <span class=\"cw\">to collect them</span>.</div><div class=\"k\"><span class=\"cw\">그것들(= 미세 플라스틱)을 수거하기 위해</span> 일반적으로 사용되는. ※ 문제지엔 themselves 로 되어 있음</div></div><div class=\"rnat\">이 미세 플라스틱은 일단 그것들을 수거하기 위해 일반적으로 사용되는 그물망을 통과할 만큼 그것들이 충분히 작으면 측정하기가 매우 어렵다.</div><div class=\"rst\">너무 작아지면 그물코 사이로 빠져나가서 양을 재기 힘들어요. 그물로 <b>그것들을</b> 줍는 건 사람이라 them(그것들을)이 맞아요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Their impacts</div><div class=\"k\">그것들(= 미세 플라스틱)의 영향은</div></div><div class=\"rc\"><div class=\"e\">on the marine environment and food webs</div><div class=\"k\">해양 환경과 먹이 그물에 미치는</div></div><div class=\"rc\"><div class=\"e\">are still poorly understood.</div><div class=\"k\">아직도 제대로 이해되지 않고 있다.</div></div><div class=\"rnat\">해양 환경과 먹이 그물에 미치는 그것들의 영향은 아직도 제대로 이해되지 않고 있다.</div><div class=\"rst\">이 조각들이 바다와 먹이 그물에 어떤 영향을 주는지는 아직 잘 몰라요. 주어가 impacts(영향들)라 are(~이다)예요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">These tiny particles are known</div><div class=\"k\">이 작은 조각들(= 미세 플라스틱)은 알려져 있다</div></div><div class=\"rc\"><div class=\"e\">to be eaten by various animals</div><div class=\"k\">다양한 동물에게 먹혀</div></div><div class=\"rc\"><div class=\"e\">and to get into the food chain.</div><div class=\"k\">먹이 사슬 속으로 들어가는 것으로.</div></div><div class=\"rnat\">이 작은 조각들은 다양한 동물에게 먹혀 먹이 사슬 속으로 들어가는 것으로 알려져 있다.</div><div class=\"rst\">여러 동물이 이 조각을 먹고, 그게 먹이 사슬로 들어간다고 알려져 있어요. 결국 우리 밥상까지 올 수 있어요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Because most of the plastic particles in the ocean are so small,</div><div class=\"k\">바다 속에 있는 대부분의 플라스틱 조각들은 매우 작기 때문에,</div></div><div class=\"rc\"><div class=\"e\">there is no practical way</div><div class=\"k\">실질적인 방법은 없다</div></div><div class=\"rc\"><div class=\"e\">to clean up the ocean.</div><div class=\"k\">바다를 청소할.</div></div><div class=\"rnat\">바다 속에 있는 대부분의 플라스틱 조각들은 매우 작기 때문에, 바다를 청소할 실질적인 방법은 없다.</div><div class=\"rst\">조각이 너무 작아서 바다를 청소할 실제 방법이 없어요. 그물로는 못 건지니까요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">One would have to filter</div><div class=\"k\">사람은(누군가는) 여과해야 할 것이다</div></div><div class=\"rc\"><div class=\"e\">enormous amounts of water</div><div class=\"k\">엄청난 양의 물을</div></div><div class=\"rc\"><div class=\"e\">to collect a relatively small amount of plastic.</div><div class=\"k\">비교적 적은 양의 플라스틱을 수거하기 위해.</div></div><div class=\"rnat\">사람은(누군가는) 비교적 적은 양의 플라스틱을 수거하기 위해 엄청난 양의 물을 여과해야 할 것이다.</div><div class=\"rst\">조금 건지려 해도 엄청난 양의 물을 걸러야 해요. relatively(비교적)가 small(적은)을 꾸며요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"degrade\" data-m=\"분해되다\"><b>degrade</b>분해되다</button><button type=\"button\" class=\"wdb\" data-w=\"float\" data-m=\"뜨다\"><b>float</b>뜨다</button><button type=\"button\" class=\"wdb\" data-w=\"break down\" data-m=\"분해되다\"><b>break down</b>분해되다</button><button type=\"button\" class=\"wdb\" data-w=\"marine\" data-m=\"해양의\"><b>marine</b>해양의</button><button type=\"button\" class=\"wdb\" data-w=\"particle\" data-m=\"조각, 입자\"><b>particle</b>조각, 입자</button><button type=\"button\" class=\"wdb\" data-w=\"filter\" data-m=\"여과하다, 걸러내다\"><b>filter</b>여과하다, 걸러내다</button></div>", "06": "<p class=\"mtr\">마더텅 정답률 <b>65%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">4번에서 결과가 <b>빨리 안 나와서</b> 예전 습관으로 <b>되돌아간다</b>고 했어요. 그러니 느린 변화는 나쁜 습관 버리기를 <b>어렵게</b> 만드는 쪽이에요. 이 방향과 어긋나는 낱말을 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">4번 · 글의 방향</span><div class=\"en\">We make a few changes, but the results <mark>never seem to come quickly</mark> and so we <mark>slide back into our previous routines</mark>.</div><p class=\"ko\">우리는 약간의 변화들을 만들지만, 그 결과들은 <mark>결코 빨리 나타나지 않는 것 같고</mark> 그래서 우리는 <mark>우리의 이전의 일상으로 다시 빠져든다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>결과가 느려서 되돌아간다면, 습관 버리기는 쉬울까요? 방향이 거꾸로예요</span></div><div class=\"ck-step key\"><span class=\"lab\">문제지 ③번 자리 (5번)</span><div class=\"en\">The slow pace of transformation also makes it <u>③ easy</u> to break a bad habit.</div><p class=\"ko\">변화의 느린 속도는 또한 나쁜 습관을 버리는 것을 ( 쉽게? ) 만든다 → 어렵게(difficult)가 맞아요</p></div><div class=\"ck-via\"><i>▼</i><span>몸에 안 좋은 식사 한 번엔 저울이 거의 안 움직여서, 한 번의 결정은 무시하기 쉬워요</span></div><div class=\"ck-step\"><span class=\"lab\">6~7번 · 나쁜 쪽도 똑같이 느림</span><div class=\"en\">A single decision <mark>is easy to ignore</mark>.</div><p class=\"ko\">단 하나의 결정은 <mark>무시해버리기 쉽다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>But(하지만) 무시하고 반복하면 나쁜 결과가 쌓여요 → 나쁜 습관은 버리기 어려워요</span></div><div class=\"ck-step\"><span class=\"lab\">8번 · 결과로 확인</span><div class=\"en\">But when we repeat small errors, day after day, … our small choices add up to bad results.</div><p class=\"ko\">하지만 우리가 작은 오류들을 날마다 반복할 때, … 우리의 작은 선택들이 쌓여 나쁜 결과들이 되어버린다.</p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">easy(쉬운) ↔ difficult(어려운)</p><p class=\"gr\">앞 문장이 “결과가 느려서 포기하고 되돌아간다”처럼 막히는 방향이면 결과도 difficult(어려운)여야 해요. 원인과 결과의 방향이 같아야 해요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>The plant grows slowly, so it is difficult to see the change.</div><div class=\"ko\">식물이 천천히 자라서 변화를 알아보기 어려워요. (느림 → 어려움)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>The plant grows slowly, so it is easy to see the change.</div><div class=\"ko\">천천히 자라는데 변화가 잘 보인다? 방향이 거꾸로라 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>The rule is simple, so it is easy to follow.</div><div class=\"ko\">규칙이 간단해서 따르기 쉬워요. (간단함 → 쉬움)</div></div><p class=\"gb\">지문 4번에서 결과가 빨리 안 나와 slide back(다시 빠져든다)하니, 5번의 느린 속도는 습관 버리기를 easy(쉽게)가 아니라 difficult(어렵게) 만들어요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">easy → difficult (어렵게)<small>결과가 느려서 예전 일상으로 돌아가니(4번), 나쁜 습관을 버리기는 어려워요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">quickly 빨리</span><span class=\"why\">4번은 never(결코 ~않는)와 함께 쓰여 “결과가 결코 빨리 안 나온다”는 뜻이에요. 그래서 예전 일상으로 돌아간다(slide back)와 이어지니 quickly(빨리)가 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">matter 중요하다</span><span class=\"why\">1번은 작은 변화를 무시하는 이유예요. 지금은 별로 중요해 보이지 않아서(don’t seem to matter 중요해 보이지 않다) 무시하니 matter(중요하다)가 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">repeat 반복하다</span><span class=\"why\">8번은 day after day(날마다), again and again(여러 차례 계속)과 함께 나와요. 작은 오류를 날마다 되풀이하는 거라 repeat(반복하다)가 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">problem 문제</span><span class=\"why\">8번에서 작은 선택이 쌓여 bad results(나쁜 결과)가 된다고 했어요. 그러니 9번도 실수가 결국 problem(문제)으로 이어진다가 맞아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">We often ignore small changes</div><div class=\"k\">우리는 흔히 작은 변화들을 무시한다</div></div><div class=\"rc\"><div class=\"e\">because they don’t seem to matter very much</div><div class=\"k\">그것들(= 작은 변화들)이 그다지 중요해 보이지 않기 때문에</div></div><div class=\"rc\"><div class=\"e\">in the moment.</div><div class=\"k\">지금은.</div></div><div class=\"rnat\">우리는 흔히 작은 변화들을 무시하는데 그것들이 지금은 그다지 중요해 보이지 않기 때문이다.</div><div class=\"rst\">매일 게임 시간을 10분 줄이는 건 지금 당장은 별거 아닌 것 같아서 그냥 넘겨요. 지문 1번도 작은 변화는 <b>중요해 보이지 않아</b>(matter) 무시한다고 해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">If you save a little money now,</div><div class=\"k\">여러분이 지금 약간의 돈을 모으더라도,</div></div><div class=\"rc\"><div class=\"e\">you’re still not a millionaire.</div><div class=\"k\">여러분은 아직 백만장자가 아니다.</div></div><div class=\"rnat\">여러분이 지금 약간의 돈을 모으더라도, 여러분은 아직 백만장자가 아니다.</div><div class=\"rst\">용돈을 조금 모아도 당장 부자가 되진 않아요. = 지문 2번의 “아직 백만장자가 아니다”예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">If you study Spanish for an hour tonight,</div><div class=\"k\">여러분이 오늘 밤 한 시간 동안 스페인어를 공부하더라도,</div></div><div class=\"rc\"><div class=\"e\">you still haven’t learned the language.</div><div class=\"k\">여러분은 아직 그 언어를 다 배운 것이 아니다.</div></div><div class=\"rnat\">여러분이 오늘 밤 한 시간 동안 스페인어를 공부하더라도, 여러분은 아직 그 언어를 다 배운 것이 아니다.</div><div class=\"rst\">오늘 밤 영어 단어 한 시간 외워도 영어가 술술 되진 않아요. 지문 3번의 스페인어 공부도 똑같아요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">We make a few changes,</div><div class=\"k\">우리는 약간의 변화들을 만들지만,</div></div><div class=\"rc ckc\"><div class=\"e\">but the results <span class=\"cw\">never seem to come quickly</span></div><div class=\"k\">그 결과들은 <span class=\"cw\">결코 빨리 나타나지 않는 것 같고</span></div></div><div class=\"rc ckc\"><div class=\"e\">and so we <span class=\"cw\">slide back into our previous routines</span>.</div><div class=\"k\">그래서 우리는 <span class=\"cw\">우리의 이전의 일상으로 다시 빠져든다</span>.</div></div><div class=\"rnat\">우리는 약간의 변화들을 만들지만, 그 결과들은 결코 빨리 나타나지 않는 것 같고 그래서 우리는 우리의 이전의 일상으로 다시 빠져든다.</div><div class=\"rst\">그래서 “효과도 없네” 하고 다시 게임을 오래 해요. 지문 4번도 결과가 <b>빨리</b>(quickly) 안 나와서 예전 일상으로 돌아간대요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">The slow pace of transformation</span></div><div class=\"k\"><span class=\"cw\">변화의 느린 속도는</span></div></div><div class=\"rc\"><div class=\"e\">also makes it difficult</div><div class=\"k\">또한 ~하는 것을 어렵게 만든다(가목적어) ※ 문제지엔 easy(쉽게)로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">to break a bad habit.</div><div class=\"k\">나쁜 습관을 버리는.</div></div><div class=\"rnat\">변화의 느린 속도는 또한 나쁜 습관을 버리는 것을 쉽게(→ 어렵게) 만든다.</div><div class=\"rst\">이렇게 변화가 느리니까 나쁜 습관을 끊기도 <b>어려워요</b>(difficult). 그래서 지문 5번의 easy(쉽게)가 틀린 낱말이에요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">If you eat an unhealthy meal today,</div><div class=\"k\">여러분이 오늘 몸에 좋지 않은 식사를 하더라도,</div></div><div class=\"rc\"><div class=\"e\">the scale doesn’t move much.</div><div class=\"k\">저울의 눈금은 많이 움직이지 않는다.</div></div><div class=\"rnat\">여러분이 오늘 몸에 좋지 않은 식사를 하더라도, 저울의 눈금은 많이 움직이지 않는다.</div><div class=\"rst\">오늘 라면을 먹고 체중계에 올라도 숫자가 거의 그대로예요. 지문 6번도 저울이 별로 안 움직인대요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">A single decision</div><div class=\"k\">단 하나의 결정은</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">is easy to ignore</span>.</div><div class=\"k\"><span class=\"cw\">무시해버리기 쉽다</span>.</div></div><div class=\"rnat\">단 하나의 결정은 무시해버리기 쉽다.</div><div class=\"rst\">그러니 “한 번쯤이야” 하고 넘기기 쉬워요. 지문 7번도 결정 하나는 무시하기 쉽다고 해요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div   h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
  mmInit();
}
/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
