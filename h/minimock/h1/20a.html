<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});

 or not those things are the same as your own</b>은 '~이든 아니든'이라는 양보 부사절이다. 빼도 문장이 완결되므로 부사절이다. and로 앞의 despite구와 병렬이다.", "sub": ["those things = a person's opinions, background 등", "the same as your own = 당신 자신의 것과 같은 (own 뒤에는 opinions 등이 생략)"]}], "sum": "관용, 상대의 특성이 나와 같든 다르든 모두에게 똑같은 배려"}, {"i": "06", "q": "04", "s": "7", "title": "명령문 병렬 + decide to V + stop -ing + 관계대명사 what", "eng": "Decide today / to end all the excuses<sup>1</sup>, / and stop lying to<sup>2</sup> yourself / about what is going on<sup>3</sup>.", "notes": [["1", "excuse", "변명"], ["2", "lie to", "~에게 거짓말하다"], ["3", "go on", "일어나다, 진행되다"]], "lit": "오늘 결심하라 / 모든 변명을 끝내기로 / 그리고 자신에게 거짓말하는 것을 멈춰라 / 무슨 일이 벌어지고 있는지에 대해", "nat": "오늘 모든 변명을 끝내기로 결심하고, 지금 무슨 일이 일어나고 있는지에 대해 자신을 속이는 일을 그만두라.", "ana": "<b>Decide ~ and stop ~</b>은 and로 병렬된 두 개의 명령문이다. <b>stop v-ing</b>는 '~하는 것을 멈추다'이고, <b>what</b>은 선행사를 포함한 관계대명사로 전치사 about의 목적어절을 이끈다.", "pe": "Decide \u0001today\u0002 / to end all the excuses<sup>1</sup>, / and stop lying \u0001to<sup>2</sup> yourself\u0002 / \u0001about what is going on<sup>3</sup>\u0002.", "pk": "\u0001오늘\u0002 결심하라 / 모든 변명을 끝내기로 / 그리고 \u0001자신에게\u0002 거짓말하는 것을 멈춰라 / \u0001무슨 일이 벌어지고 있는지에 대해\u0002", "core": "모든 변명을 끝내기로 결심하고, 거짓말하는 것을 멈춰라.", "tags": ["<b>3형식</b> 명령문 Decide + 목적어 to end ~. today = 부사: Decide를 꾸밈", "목적어 to end all the excuses (to부정사). decide to V = V하기로 결심하다", "and stop lying: <b>3형식</b> 목적어 lying(동명사). to yourself = 거의 필수에 가까운 부사구(lie to가 대상을 거의 요구): lying을 꾸밈 [기준: 모양 규칙]", "about what ~ = 전치사구(부사구): lying을 꾸밈. what절은 about의 목적어(명사절)"], "steps": [{"t": "이 문장은 <b>명령문 두 개가 and로 병렬</b>된 3형식 문장이다. 명령문이라 주어 you가 생략되어 있다."}, {"t": "뼈대부터 찾는다.", "sub": ["V1: Decide (결심하다)", "O1: to end all the excuses (모든 변명을 끝내기로, end 끝내다, excuse 변명)", "V2: stop (멈추다)", "O2: lying (거짓말하는 것을, 동명사)", "뼈대 = <b>Decide to end all the excuses, and stop lying</b>", "today (오늘)는 Decide를 꾸미는 부사"]}, {"t": "<b>decide to V</b>는 'V하기로 결심하다'이고, <b>stop V-ing</b>는 'V하는 것을 멈추다'이다. stop to V (멈춰 서서 V하다)와 뜻이 다르다."}, {"t": "<b>to yourself</b>는 lying 뒤에 붙어 '자신에게'를 나타낸다. 기준: lie to ~ (~에게 거짓말하다)의 전치사구는 거의 필수에 가까운 부사구이지만 수식어로 본다."}, {"t": "<b>about what is going on</b>은 lying을 꾸미는 전치사구이다. what is going on은 about의 목적어가 되는 <b>명사절</b>(일어나고 있는 일)이다.", "sub": ["go on (일어나다, 진행되다)"]}], "sum": "오늘 변명을 끝내기로 결심, 상황에 대한 자기기만 중단"}, {"i": "07", "q": "05", "s": "3", "title": "When절 + S+V(1형식) + even if 양보절", "eng": "When they speak, / others listen / even if the area of their skill has nothing to do with<sup>1</sup> the advice<sup>2</sup> they give.", "notes": [["1", "have nothing to do with", "~와 아무 관련이 없다"], ["2", "advice", "조언"]], "lit": "그들이 말할 때 / 다른 사람들은 귀를 기울인다 / 비록 그들의 전문 분야가 그들이 하는 조언과 아무런 관련이 없더라도", "nat": "그들이 말하면 사람들은 귀를 기울인다. 그들의 전문 분야가 그들이 건네는 조언과 전혀 상관이 없더라도 말이다.", "ana": "<b>even if</b>는 양보를 나타내는 접속사이고, <b>have nothing to do with</b>는 '~와 아무 관련이 없다'는 관용 표현이다. the advice 뒤에는 목적격 관계대명사가 생략되어 they give가 advice를 수식한다.", "pe": "\u0001When they speak\u0002, / others listen / \u0001even if the area of their skill has nothing to do with<sup>1</sup> the advice<sup>2</sup> they give\u0002.", "pk": "\u0001그들이 말할 때\u0002 / 다른 사람들은 귀를 기울인다 / \u0001비록 그들의 전문 분야가 그들이 하는 조언과 아무런 관련이 없더라도\u0002", "core": "다른 사람들은 귀를 기울인다.", "tags": ["When ~ = 접속사절(부사절, 시간): listen을 꾸밈", "<b>1형식</b> 주어 others + 동사 listen", "even if ~ = 접속사절(부사절, 양보): listen을 꾸밈. 안의 they give는 advice를 꾸미는 관계절(that 생략)"], "steps": [{"t": "이 문장은 <b>When절 + S+V(1형식) + even if절</b>이다. 앞뒤로 부사절이 붙어 길어 보일 뿐 뼈대는 짧다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: others (다른 사람들)", "V: listen (귀를 기울이다)", "뼈대 = <b>others listen</b>"]}, {"t": "<b>When they speak</b>는 '그들이 말할 때'라는 시간 부사절이다. they는 이 문장 안에서 가리키는 대상이 확인되지 않아 그대로 둔다.", "sub": ["speak (말하다)"]}, {"t": "<b>even if the area of their skill has nothing to do with the advice</b>는 '비록 ~일지라도'라는 양보 부사절이다.", "sub": ["S: the area of their skill (그들의 전문 분야, area 분야, skill 기술)", "V: has nothing to do with ~ (~와 아무 관련이 없다, 한 덩어리 표현)", "advice (조언)"]}, {"t": "<b>they give</b>는 advice를 꾸미는 관계절이다. 목적격 관계대명사(that)가 <b>생략</b>되었다.", "sub": ["give (주다, 건네다)"]}], "sum": "그들이 말하면, 전문 분야와 상관없는 조언이어도 귀 기울임"}, {"i": "08", "q": "06", "s": "2", "title": "S+V+O ,and S+V+O + 과거분사구 후치수식", "eng": "For example, / doctors put in a positive mood<sup>1</sup> before making a diagnosis<sup>2</sup> / show almost three times more intelligence and creativity than doctors in a neutral<sup>3</sup> state, / and they make accurate<sup>4</sup> diagnoses 19 percent faster.", "notes": [["1", "put in a positive mood", "긍정적인 기분이 되게 하다"], ["2", "diagnosis", "진단"], ["3", "neutral", "중립적인"], ["4", "accurate", "정확한"]], "lit": "예를 들어 / 진단을 내리기 전에 긍정적인 기분이 되게 한 의사들은 / 중립적인 상태의 의사들보다 거의 세 배 더 많은 지적 능력과 창의력을 보여 준다 / 그리고 그들은 정확한 진단을 19퍼센트 더 빠르게 내린다", "nat": "예를 들어, 진단을 내리기 전에 긍정적인 기분이 되도록 만들어진 의사들은 중립적인 상태의 의사들보다 거의 세 배 더 높은 지적 능력과 창의력을 보이며, 정확한 진단도 19퍼센트 더 빠르게 내린다.", "ana": "<b>put in a positive mood</b>는 doctors를 뒤에서 수식하는 과거분사구이고, 문장의 진짜 동사는 <b>show</b>이다. 주어부가 길어 동사를 놓치기 쉬운 문장이다.", "pe": "\u0001For example\u0002, / doctors \u0001put in a positive mood<sup>1</sup> before making a diagnosis<sup>2</sup>\u0002 / show \u0001almost three times\u0002 more intelligence and creativity \u0001than doctors in a neutral<sup>3</sup> state\u0002, / and they make \u0001accurate<sup>4</sup>\u0002 diagnoses \u000119 percent faster\u0002.", "pk": "\u0001예를 들어\u0002 / \u0001진단을 내리기 전에 긍정적인 기분이 되게 한\u0002 의사들은 / \u0001중립적인 상태의 의사들보다\u0002 \u0001거의 세 배\u0002 더 많은 지적 능력과 창의력을 보여 준다 / 그리고 그들은 \u0001정확한\u0002 진단을 \u000119퍼센트 더 빠르게\u0002 내린다", "core": "의사들은 더 많은 지적 능력과 창의력을 보여 주고, 그들은 진단을 내린다.", "tags": ["For example = 부사구(삽입): 문장 전체를 꾸밈", "주어 doctors. put in ~ = 과거분사구(형용사적): doctors를 뒤에서 꾸밈. 진짜 동사는 다음 덩어리의 show", "<b>3형식</b> 동사 show + 목적어 more intelligence and creativity. almost three times = 부사구: more를 꾸밈. than ~ = 비교 접속사구(부사적): more를 꾸밈", "<b>3형식</b> 주어 they + 동사 make + 목적어 diagnoses. accurate = 형용사: diagnoses를 꾸밈. 19 percent faster = 부사구: make를 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식) 두 절이 and로 이어진</b> 문장이다. 첫 주어 doctors 뒤에 긴 const CMAP={"01-2": [["026", "동명사"], ["017", "there is / are"]], "01-5": [["086", "관계부사"], ["026", "동명사"]], "02-6": [["034-H1", "배수 비교"], ["034", "비교급"]], "03-4": [["096", "It ~ that 강조"], ["078", "관계대명사"]], "03-7": [["094", "간접의문문"], ["026", "동명사"]], "04-7": [["085", "관계대명사 what"], ["078", "관계대명사"]], "05-3": [["043", "이유 · 양보 접속사"], ["041", "시간 접속사"]], "06-2": [["068", "현재분사 · 과거분사"]]};
function scHtml(c){
  const esc=String;
  const E=chunkSplit(c.pe||c.eng),K=chunkSplit(c.pk||c.lit);
  const cc=(CMAP[c.q+'-'+c.s]||[]);
  const back=encodeURIComponent(location.origin+location.pathname);
  let x='<div class="sc open"><div class="sc-h"><span class="no2">'+esc(c.q)+'</span><span class="at">'+esc(c.q)+'번 문제 · '+esc(c.s)+'번 문장</span></div><div class="sc-b">';
  if(cc.length){x+='<div class="cks">'+cc.map(k=>'<a class="cchip" href="https://nolbada.github.io/via-mid/m/grammarcock/?c='+k[0]+'&back='+back+'">개념톡 · '+k[1]+' →</a>').join('')+'</div>';}
  for(let j=0;j<E.length;j++)x+='<div class="ch open"><div class="ce">'+mdWrap(E[j])+'</div><div class="ck">'+mdWrap(K[j]||'')+'</div></div>';
  x+='<div class="fin n1"><b>자연스러운 해석</b>'+esc(c.nat)+'</div>';
  const sm=c.sum||c.core;
  if(sm)x+='<div class="fin n2"><b>한 줄 정리</b>'+esc(sm)+'</div>';
  x+='</div></div>';
  return x;
}

    if(c[p])tw('오답노트장에 담았어요');

function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();

  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}

/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}

});
