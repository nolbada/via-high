<title>고1 미니모의고사 4회 01–06번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:84px}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}
.ko{color:var(--sub);font-size:14px;margin-left:6px}
.cell.bad{background:var(--badbg);border-color:var(--bad)}
.cell.bad .tag{background:var(--bad)}
.locked .cell{pointer-events:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.done .opt{pointer-events:none}
.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}
.hcard .chip{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--sub)}
.hcard .chip.ok{background:var(--goodbg);color:var(--good)}
.hcard .chip.warn{background:var(--badbg);color:var(--bad)}
.hcard[disabled]{opacity:.55}
details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.th .hd{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:6px}
.th ol{list-style:none;margin:0;padding:0;counter-reset:n}
.th li{counter-increment:n;position:relative;padding:7px 0 7px 30px;font-size:15px;line-height:1.7;border-top:1px dashed #cfdcf0}
.th li:first-child{border-top:0}
.th li:before{content:counter(n);position:absolute;left:0;top:9px;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;text-align:center;line-height:21px}
.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.th .sub{margin:3px 0 0;color:#444;font-size:14.5px;line-height:1.7}
.sc .lay.sum{border-left:4px solid #2e7d32;background:#f1f8f1}
/* ---- 새 직독직해·해설 화면 ---- */
.sc{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden;background:var(--bg)}
.sc-h{padding:11px 14px 10px;background:#eef2f8;border-bottom:1px solid var(--line)}
.sc-h .no2{display:inline-block;min-width:26px;height:26px;line-height:26px;border-radius:13px;background:var(--accent);color:#fff;font-weight:800;font-size:13px;text-align:center;padding:0 7px;margin-right:8px}
.sc-h .at{font-size:13px;color:var(--sub)}
.sc-h .tt{display:block;margin-top:7px;font-size:15.5px;font-weight:800;color:var(--accent);line-height:1.45}
.sc-b{padding:10px 12px 12px}
.sc .ch{margin-bottom:6px}
.sc .ce{font-size:17px}
.sc .ce sup,.nt sup{font-size:10px;font-weight:800;color:#b8651f;margin-left:1px}
.nts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.nt{font-size:13.5px;line-height:1.5;background:#fbf6ee;border:1px solid #f0e2cd;border-radius:8px;padding:5px 9px;color:#4a3a22}
.nt b{color:#33260f}
.sc .lay{border-radius:10px}
.sc .lay.nat{border-left:4px solid var(--accent);background:#f7f9fc}
.sc .lay.ana{background:#fff8e6;border-color:#f0dcc0;color:#4d3b05}
.sc .lay.ana b,.why2 b,.opx b,.evx b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.sc .lb{margin-bottom:4px}
.qc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}
.qchip small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-bottom:1px}
.qchip.o{border-color:var(--good);background:var(--goodbg)}
.qchip.x{border-color:var(--bad);background:var(--badbg)}
.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.trs{list-style:none;margin:0;padding:0;background:var(--soft);border-radius:10px;padding:8px 12px}
.trs li{font-size:15px;line-height:1.75;padding:2px 0}
.trs .n{display:inline-block;min-width:20px;font-size:12px;color:var(--sub);font-weight:700}
.evx{background:var(--goodbg);border:1px solid #bfe0cd;border-radius:10px;padding:10px 12px}
.evx .en{background:#fff;border:1px solid #d5eadc;font-size:15.5px;margin:0 0 8px}
.evx p{margin:6px 0;font-size:15.5px;line-height:1.75}

.opx{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px;background:var(--bg)}
.opx.a{border-color:var(--good);background:var(--goodbg)}
.opx .ot{font-size:15.5px;font-weight:700;line-height:1.55}
.opx .mk{display:inline-block;min-width:22px;font-weight:800;color:var(--sub);margin-right:4px}
.opx.a .mk{color:var(--good)}
.opx .bd{display:inline-block;font-size:11.5px;font-weight:800;color:#fff;border-radius:4px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.opx .bd.g{background:var(--good)}
.opx .bd.t{background:#b4472f}
.opx p{margin:5px 0 0;font-size:14.5px;line-height:1.7;color:#333}
.opx .xm{color:var(--bad);font-weight:800;margin-right:3px}
.wds{display:flex;flex-wrap:wrap;gap:6px}
.wds span{font-size:14px;background:var(--soft);border-radius:8px;padding:5px 9px;line-height:1.45}
.wds b{margin-right:5px}
.toq{display:block;width:100%;margin-top:14px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}
details.sub2{margin:12px 0 0}
details.sub2>summary{list-style:none;cursor:pointer;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px;padding:6px 0}
details.sub2>summary::-webkit-details-marker{display:none}
details.sub2>summary:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
details.sub2>summary:after{content:"+";margin-left:auto;font-size:18px;color:var(--sub)}
details.sub2[open]>summary:after{content:"\2212"}

.cr{color:#A3102E;font-weight:700}
.sc .lay.core{border-left:4px solid #2e7d32;background:#f1f8f1}
.ct{display:none;margin:7px 0 2px;padding:6px 9px;border-left:3px solid #d9a21b;background:#fff8e6;border-radius:6px;font-size:13.5px;line-height:1.55;color:#4d3b05}

.sc .ch{background:#fafbfe;border:1px solid #e8ecf5;border-bottom:1px solid #e8ecf5;padding:10px 12px}
.sc .ce{font-size:18px;line-height:1.5;font-weight:800;color:#c62828}

.cks{margin:0 0 6px}.cchip{display:inline-block;font-size:12.5px;font-weight:700;color:#1f6f5f;background:#e5f4f0;border:1px solid #bfe3da;border-radius:999px;padding:4px 10px;text-decoration:none;margin:2px 4px 2px 0}

.sc .sc-b{background:#fff}

.sc .fin.n2{background:#fff8e1;border-color:#f0e2b0;border-left-color:#d9a21b}.sc .fin.n2 b{color:#8a6d00}


.rst{margin-top:8px;background:#fff8e1;border:1px solid #efe3b8;border-left:4px solid #d9a21b;border-radius:8px;padding:8px 10px;font-size:15px;line-height:1.7;word-break:keep-all}
.rst:before{content:"결국 이 얘기  ";font-size:11.5px;font-weight:800;color:#8a6d00}

  }

    if(!busy){var Q=jq(QK).map(function(b){return b.filter(function(it){var m=String(it.w||'').toLowerCase().trim()===k&&it.src===src;if(m)hit=true;return!m})}).filter(function(b){return b.length});if(hit){s(QK,JSON.stringify(Q));return Promise.resolve({ok:true,removed:true})}}

 꾸밈", "<b>가주어 it</b> + 동사 might seem + 보어 surprising(SVC)", "<b>진주어 that절</b>(통째로 뼈대). 주어 something. as mundane as ~ = 원급 형용사구: something을 뒤에서 꾸밈", "절의 동사 was + 보어 force. driving = 형용사: force 꾸밈. for an advance = 전치사구(형용사구): force 꾸밈", "as ~ as written language = 원급 형용사구: advance를 뒤에서 꾸밈"], "steps": [{"t": "이 문장은 <b>가주어 it + S+V+C(2형식)</b>이다. 진짜 주어가 that절로 통째로 뒤에 가 있어서 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: it (가주어. 진짜 주어는 뒤의 that절)", "V: might seem (seem ~처럼 보이다. might는 '~일지도 모른다')", "C: surprising (놀라운)", "뼈대 = <b>it might seem surprising</b>"]}, {"t": "<b>In retrospect</b>는 '돌이켜 보면'이라는 전치사구(부사구)로, 문장 전체를 꾸민다 (retrospect 회고)."}, {"t": "<b>that something ~ written language</b>가 진짜 주어인 that절이다 (~라는 것이).", "sub": ["절 안의 S: something (무언가)", "V: was (be ~이었다)", "C: the driving force (원동력)"]}, {"t": "something 뒤의 <b>as mundane as the desire to count sheep</b>는 원급 비교로 something을 뒤에서 꾸민다.", "sub": ["mundane 평범한, desire 욕구, count 세다, sheep 양", "as ~ as ... = ...만큼 ~한"]}, {"t": "force 뒤의 <b>for an advance</b>는 force를 꾸미는 전치사구이고, 그 뒤 <b>as fundamental as written language</b>도 원급 비교로 advance를 뒤에서 꾸민다.", "sub": ["advance 발전, fundamental 근본적인, written language 문자 언어", "함정: as ~ as가 두 번 나오지만 서로 다른 명사(something, advance)를 꾸민다."]}], "sum": "양을 세려는 평범한 욕구가 문자 언어만큼 근본적인 발전의 원동력이었다는 것, 놀라워 보일 수도"}, {"i": "05", "q": "03", "s": "7", "title": "가정법 과거 If it weren't for ~", "eng": "If it weren't for<sup>1</sup> the commercial<sup>2</sup> enterprises<sup>3</sup> / that produced those records<sup>4</sup>, / we would know far, far less / about the cultures that they came from.", "notes": [["1", "if it weren't for", "~이 없다면"], ["2", "commercial", "상업의"], ["3", "enterprise", "기업, 사업체"], ["4", "record", "기록"]], "lit": "만약 상업적 기업들이 없다면 / 그 기록들을 만들어 낸 / 우리는 훨씬 훨씬 더 적게 알 것이다 / 그것들이 나온 문화에 대해", "nat": "그 기록을 남긴 상업적 사업체들이 없었다면, 우리는 그 기록이 나온 문화에 대해 훨씬 더 모르고 있었을 것이다.", "ana": "<b>If it weren't for A</b>는 'A가 없다면'이라는 <b>가정법 과거</b>의 고정 표현입니다(= Without A / But for A). 주절에 반드시 <b>would + 동사원형</b>이 따라옵니다. 사실이 아닌 가정이므로 <b>현재 사실은 정반대</b>라는 것까지 읽어야 요지가 잡힙니다. <b>far, far less</b>의 far는 비교급을 강조하는 부사로 '훨씬'입니다. 맨 뒤 <b>that they came from</b>은 the cultures를 꾸미는 관계사절이고 from의 목적어 자리가 비어 있습니다.", "pe": "\u0001If it weren't for<sup>1</sup> the commercial<sup>2</sup> enterprises<sup>3</sup>\u0002 / \u0001that produced those records<sup>4</sup>\u0002, / we would know \u0001far, far\u0002 less / \u0001about the cultures that they came from\u0002.", "pk": "\u0001만약 상업적 기업들이 없다면\u0002 / \u0001그 기록들을 만들어 낸\u0002 / 우리는 \u0001훨씬 훨씬\u0002 더 적게 알 것이다 / \u0001그것들이 나온 문화에 대해\u0002", "core": "우리는 더 적게 알 것이다.", "tags": ["If절 = 부사절(<b>가정법 과거</b>, If it weren't for ~ = ~이 없다면): 주절을 꾸밈", "that절 = 관계절(형용사절): enterprises를 꾸밈 (If절에 속함)", "주어 we + 동사 <b>would know</b> + 목적어 less. far, far = 부사: less를 강조", "about ~ = 전치사구(부사구): know를 꾸밈. 거의 필수에 가까운 부사구(know about)[천일문S 표기 A] [기준: 모양 규칙]. that they came from은 cultures를 꾸미는 관계절"], "steps": [{"t": "이 문장은 <b>가정법 과거 If절 + S+V+O(3형식)</b>이다. 앞의 If절과 관계절 때문에 길어 보인다."}, {"t": "뼈대(주절)부터 찾는다.", "sub": ["S: we (우리)", "V: would know (know 알다. would + 동사원형 = 가정법 과거의 주절 형태)", "O: less (더 적게. 정도를 나타내는 명사처럼 쓰임)", "뼈대 = <b>we would know less</b>"]}, {"t": "맨 앞 <b>If it weren't for the commercial enterprises</b>는 '~이 없다면'이라는 <b>가정법 과거</b> 조건절이다.", "sub": ["commercial 상업적인, enterprise 기업", "was 대신 weren't를 쓰는 것이 가정법 과거의 모양"]}, {"t": "<b>that produced those records</b>는 관계절(형용사절)이다. enterprises를 꾸민다 (produce 생산하다의 과거형 produced, record 기록)."}, {"t": "주절의 <b>far, far</b>는 less를 강조하는 부사이다 (훨씬 훨씬)."}, {"t": "<b>about the cultures that they came from</b>은 know를 꾸미는 전치사구이고, 그 안의 that절은 cultures를 꾸미는 관계절이다 (come from ~에서 나오다).", "sub": ["they = those records (그 기록들)", "판정 기준: know about은 거의 필수에 가까운 부사구로 보되 뼈대에는 넣지 않음"]}], "sum": "상업적 기업이 없다면 그 문화에 대해 훨씬 덜 알 것"}, {"i": "06", "q": "04", "s": "1", "title": "S+V+C + 관계절 병렬", "eng": "The reduction<sup>1</sup> of minerals in our food / is the result of using pesticides<sup>2</sup> and fertilizers<sup>3</sup> / that kill off<sup>4</sup> beneficial bacteria, earthworms, and bugs in the soil / that create many of the essential nutrients in the first place / and prevent the uptake<sup>5</sup> of nutrients into the plant.", "notes": [["1", "reduction", "감소"], ["2", "pesticide", "살충제"], ["3", "fertilizer", "비료"], ["4", "kill off", "죽여 없애다"], ["5", "uptake", "흡수, 섭취"]], "lit": "우리 음식 속 무기질의 감소는 / 살충제와 비료를 사용한 결과이다 / 토양 속의 이로운 박테리아, 지렁이, 벌레를 죽여 없애는 / 애초에 많은 필수 영양소를 만들어 내는 / 그리고 영양소가 식물로 흡수되는 것을 막는", "nat": "음식 속 무기질이 줄어든 것은, 애초에 필수 영양소를 만들어 내는 토양 속 이로운 박테리아·지렁이·벌레를 죽이고 식물로의 영양소 흡수를 막는 살충제와 비료를 써 온 결과다.", "ana": "주어는 <b>The reduction</b>, 동사는 <b>is</b>입니다. of minerals in our food가 길어 보여도 전부 주어를 꾸미는 말입니다. <b>that이 두 번</b> 나오는데 <b>첫 번째 that</b>은 pesticides and fertilizers를, <b>두 번째 that</b>은 bacteria, earthworms, and bugs를 받습니다 — 어느 명사를 받는지 화살표로 표시하며 읽어야 뜻이 정반대로 뒤집히지 않습니다. 맨 뒤 <b>prevent</b>는 kill off와 병렬로 첫 번째 that에 걸립니다.", "pe": "The reduction<sup>1</sup> \u0001of minerals in our food\u0002 / is the result \u0001of using pesticides<sup>2</sup> and fertilizers<sup>3</sup>\u0002 / \u0001that kill off<sup>4</sup> beneficial bacteria, earthworms, and bugs in the soil\u0002 / \u0001that create many of the essential nutrients in the first place\u0002 / and \u0001prevent the uptake<sup>5</sup> of nutrients into the plant\u0002.", "pk": "\u0001우리 음식 속 무기질의\u0002 감소는 / \u0001살충제와 비료를 사용한\u0002 결과이다 / \u0001토양 속의 이로운 박테리아, 지렁이, 벌레를 죽여 없애는\u0002 / \u0001애초에 많은 필수 영양소를 만들어 내는\u0002 / 그리고 \u0001영양소가 식물로 흡수되는 것을 막는\u0002", "core": "무기질의 감소는 결과이다.", "tags": ["주어 The reduction. of minerals in our food = 전치사구(형용사구): reduction을 꾸밈", "동사 is + 보어 the result. of using ~ = 전치사구(형용사구): result를 꾸밈", "첫째 that절 = 관계절(형용사절): pesticides and fertilizers를 꾸밈. <b>kill off</b> = 타동사 + 부사 불변화사, off는 동사의 일부", "둘째 that절 = 관계절(형용사절): bacteria, earthworms, and bugs를 꾸밈", "and prevent = kill off와 <b>병렬</b>(첫째 that절의 동사). 관계절: pesticides and fertilizers를 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식)</b>인데 뒤에 that절이 겹겹이 붙어 아주 길어 보인다. 뼈대는 짧다." pe": "This forced<sup>1</sup> business to develop \u0001closer\u0002 relations \u0001with buyers and clients<sup>2</sup>\u0002, / \u0001which in turn<sup>3</sup> made business realize\u0002 / \u0001that it was not enough\u0002 / \u0001to produce a quality product at a reasonable price<sup>4</sup>\u0002.", "pk": "이것이 기업으로 하여금 \u0001구매자와 고객과\u0002 \u0001더 가까운\u0002 관계를 발전시키도록 만들었다 / \u0001그리고 그것이 결국 기업이 깨닫게 했다\u0002 / \u0001충분하지 않다는 것을\u0002 / \u0001합리적인 가격에 질 좋은 제품을 생산하는 것이\u0002", "core": "이것이 기업으로 하여금 관계를 발전시키도록 만들었다.", "tags": ["<b>force + O + to부정사</b>(5형식): business(O) to develop relations(C). closer = 형용사, with buyers and clients = 전치사구: 모두 relations를 꾸밈", "<b>계속적 which</b> = 관계절(형용사절): 앞 절 전체를 꾸밈. make + O + 원형(사역)", "that절 = realize의 목적어절 (위 관계절에 속함). it은 가주어", "to produce ~ = <b>진주어</b> to부정사 (위 관계절에 속함)"], "steps": [{"t": "이 문장은 <b>S+force+O+to부정사(5형식)</b>이고, 뒤에 <b>계속적 which절</b>이 이어진다. 두 덩어리로 나누어 읽으면 된다."}, {"t": "앞 덩어리의 뼈대부터 찾는다.", "sub": ["S: This (이것)", "V: forced (force 강요하다, ~하게 만들다의 과거형)", "O: business (기업)", "C: to develop closer relations (더 가까운 관계를 발전시키도록)", "뼈대 = <b>This forced business to develop ~</b>"]}, {"t": "<b>closer relations with buyers and clients</b>에서 closer는 relations를 꾸미는 형용사, with 이하는 전치사구이다 (buyer 구매자, client 고객, close 가까운)."}, {"t": "콤마 뒤 <b>which ~</b>는 계속적 용법의 관계절이다. which는 앞 절 전체(이것이 기업을 ~하게 만든 일)를 가리킨다.", "sub": ["V: made (make ~하게 만들다의 과거형) / O: business / C: realize (깨닫다, 동사원형)", "made business realize = 5형식(사역)", "in turn = 결국, 차례로"]}, {"t": "<b>that it was not enough</b>는 realize의 목적어인 that절이다 (~라는 것을).", "sub": ["it은 가주어, 진주어는 <b>to produce a quality product at a reasonable price</b> (합리적인 가격에 질 좋은 제품을 생산하는 것)", "quality 질 좋은, reasonable 합리적인, enough 충분한"]}, {"t": "함정: to develop과 to produce는 둘 다 to부정사지만 역할이 다르다. 앞은 목적격보어, 뒤는 진주어이다."}], "sum": "이것이 기업을 고객과 가까워지게 했고, 결국 좋은 제품만으론 부족함을 깨닫게 함"}, {"i": "08", "q": "06", "s": "4", "title": "S+V+C + 동격 명사구", "eng": "Sometimes, / the wall's attraction<sup>1</sup> is simply appealing to<sup>2</sup> the senses<sup>3</sup>, / a wall decoration<sup>4</sup> that catches the eye / or a sound that catches the ear.", "notes": [["1", "attraction", "매력, 끌어당기는 것"], ["2", "appeal to", "~에 호소하다"], ["3", "senses", "감각"], ["4", "decoration", "장식"]], "lit": "때때로 / 그 벽의 매력은 단순히 감각에 호소하는 것이다 / 즉 눈길을 끄는 벽 장식 / 혹은 귀를 사로잡는 소리", "nat": "때로는 그 벽의 매력이 그저 감각을 자극하는 데 있다 — 눈길을 끄는 벽 장식이나 귀를 붙드는 소리 같은 것 말이다.", "ana": "콤마 뒤의 <b>a wall decoration ~ or a sound ~</b>는 새 문장이 아니라 앞의 <b>appealing to the senses</b>를 구체적으로 바꿔 말한 <b>동격</b> 명사구입니다. 동사를 찾으려 하면 헤맵니다 — 이 문장의 동사는 <b>is</b> 하나뿐입니다. 뒤따르는 <b>that catches</b> 두 개는 각각 decoration과 sound를 꾸미는 <b>관계대명사절</b>로 서로 병렬입니다. <b>appeal to</b>는 '~에 호소하다, ~의 마음을 끌다'입니다.", "pe": "\u0001Sometimes\u0002, / the wall's attraction<sup>1</sup> is \u0001simply\u0002 appealing \u0001to<sup>2</sup> the senses<sup>3</sup>\u0002, / \u0001a wall decoration<sup>4</sup> that catches the eye\u0002 / or \u0001a sound that catches the ear\u0002.", "pk": "\u0001때때로\u0002 / 그 벽의 매력은 \u0001단순히\u0002 \u0001감각에\u0002 호소하는 것이다 / \u0001즉 눈길을 끄는 벽 장식\u0002 / 혹은 \u0001귀를 사로잡는 소리\u0002", "core": "그 벽의 매력은 호소하는 것이다.", "tags": ["Sometimes = 부사: 문장 전체를 꾸밈", "주어 attraction + 동사 is + 보어 appealing. simply = 부사. to the senses = 전치사구(부사구): appealing 꾸밈. 거의 필수에 가까운 부사구[천일문S 표기 A] [기준: 모양 규칙]", "<b>동격</b> 명사구: 앞 appealing to the senses를 구체적으로 설명. that catches the eye는 decoration을 꾸미는 관계절", "or 뒤 <b>동격 병렬</b>: a sound ~. that catches the ear는 sound를 꾸미는 관계절"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식)</b>이다. 뒤에 풀이가 덧붙어 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: the wall's attraction (그 벽의 매력)", "V: is (be ~이다)", "C: appealing (매력적인, 호소하는. appeal 호소하다에서 온 분사형 형용사)", "뼈대 = <b>the wall's attraction is appealing</b>", "판정 기준: be + 분사형 형용사 = 2형식으로 봄"]}, {"t": "앞의 <b>Sometimes</b>(때때로)는 문장 전체를 꾸미는 부사이다. simply(단순히)도 부사이다."}, {"t": "<b>to the senses</b>는 appealing을 꾸미는 전치사구이다 (appeal to ~에 호소하다, sense 감각)."}, {"t": "콤마 뒤 <b>a wall decoration that catches the eye</b>는 앞 내용을 구체적으로 풀어 주는 동격 명사구이다.", "sub": ["that catches the eye = decoration을 꾸미는 관계절 (눈길을 끌다)", "decoration 장식, catch 잡다"]}, {"t": "<b>or a sound that catches the ear</b>는 or로 이어진 두 번째 동격이다. that catches the ear는 sound를 꾸미는 관계절이다 (귀를 사로잡다).", "sub": ["함정: catches는 동사지만 주절의 동사가 아니라 관계절의 동사이다."]}], "sum": "벽의 매력, 눈길을 끄는 장식이나 귀를 잡는 소리로 감각에 호소"}], "qs": [{"q": "01", "type": "필자 주장", "src": "2014년 6월 19번", "ans": "⑤", "tr": [["1", "자신에게 높은 기대를 거는 사람이 낮은 목표를 세우는 사람보다 협상에서 더 많이 얻어 내기는 하지만, 정작 결과에는 거의 늘 덜 만족한다."], ["2", "왜 그럴까?"], ["3", "협상이 끝나면 최종 결과를 처음 기대와 견주어 보고, 거래에서 못 얻은 쪽에 눈길을 두며, 결국 실패했다고 느끼기 때문이다."], ["4", "이 문제를 풀려면 협상이 끝난 뒤 초점을 바꾸는 법을 익혀야 한다."], ["5", "결과를 더 긍정적인 방식으로 바라보아야 한다."], ["6", "이렇게 초점을 조금만 옮기면, 협상에서 얻어 낸 모든 것이 눈에 들어오고 자신이 한 일에 만족하게 된다."]], "evh": "4 · 5 · 6번 문장", "ev": [{"en": true, "h": "To solve this problem, they need to learn how to change their focus after the negotiation is complete. / They must view their results in a more positive manner."}, {"en": false, "h": "주장 유형의 답은 <b>need to · must · should</b> 같은 <b>당위 표현</b>에 있습니다. 4번의 <b>need to learn how to change their focus</b>와 5번의 <b>must view ~ in a more positive manner</b>가 필자가 시키는 일이고, 6번은 그렇게 했을 때의 결과입니다. 1~3번은 '왜 그래야 하는지'를 설명하는 <b>배경</b>이므로 거기서 답을 고르면 안 됩니다."}], "opts": [{"n": "①", "t": "협상 중에는 상대를 존중하라.", "a": false, "x": true, "trap": false, "e": "상대를 대하는 태도(respect)에 관한 말은 지문에 없습니다. 지문의 초점은 <b>협상이 끝난 뒤 자기 결과를 보는 눈</b>입니다."}, {"n": "②", "t": "협상 전에 준비를 철저히 하라.", "a": false, "x": true, "trap": false, "e": "<b>협상 전</b>이 아니라 <b>after the negotiation is complete</b>, 즉 끝난 뒤의 이야기입니다. 시점이 정반대입니다."}, {"n": "③", "t": "가능한 한 높은 협상 목표를 설정하라.", "a": false, "x": true, "trap": true, "e": "1번에 high expectations가 나와서 눈에 걸립니다. 그러나 지문은 높은 기대를 세우라고 <b>권하는 것이 아니라</b>, 그 사람들이 오히려 덜 만족한다는 <b>문제 상황</b>으로 꺼낸 것입니다."}, {"n": "④", "t": "협상 시 가능한 모든 대안을 고려하라.", "a": false, "x": true, "trap": false, "e": "대안(alternative)이나 선택지를 따져 보라는 내용은 한 줄도 없습니다."}, {"n": "⑤", "t": "협상 후에는 결과를 의미있게 수용하라.", "a": true, "x": false, "trap": false, "e": "4·5번의 change their focus, view their results in a more positive manner가 그대로 이 말입니다."}], "w": [["negotiation", "협상"], ["expectation", "기대, 예상"], ["tend to", "~하는 경향이 있다"], ["be satisfied with", "~에 만족하다"], ["compare A to B", "A를 B와 비교하다"], ["initial", "처음의, 최초의"], ["outcome", "결과"], ["adjustment", "조정, 수정"], ["recognize", "인지하다, 알아보다"], ["manner", "방식, 태도"]]}, {"q": "02", "type": "글의 주제", "src": "2020년 9월 23번", "ans": "②", "tr": [["1", "인간뿐 아니라 동물도 놀이 활동을 한다."], ["2", "동물에게 놀이는 오랫동안, 앞으로의 생존에 필요한 기술과 행동을 배우고 연습하는 방법으로 여겨져 왔다."], ["3", "아이들에게도 놀이는 발달 과정에서 중요한 기능을 한다."], ["4", "유아기의 가장 이른 시작부터, 놀이는 아이가 세상과 그 안에서의 자기 자리를 알아 가는 통로다."], ["5", "아이의 놀이는 신체 능력을 기르는 훈련장 역할을 한다 — 걷기, 달리기, 점프처럼 일상생활에 꼭 필요한 기술 말이다."], ["6", "놀이는 또한 아이들이 사회적 행동을 시험해 보고 익히게 하며, 어른이 되어 중요해질 가치관과 성격 특성을 얻게 해 준다."], ["7", "예를 들어 아이들은 경쟁하고 협력하는 법, 이끌고 따르는 법, 결정을 내리는 법 등을 배운다."]], "evh": "3 · 5 · 6번 문장", "ev": [{"en": true, "h": "In children, too, play has important functions during development. / Children's play serves as a training ground for developing physical abilities ... / Play also allows children to ... acquire values and personality traits ..."}, {"en": false, "h": "주제 유형은 <b>글 전체를 덮는 범위</b>를 골라야 합니다. 2번(동물)은 <b>도입</b>이고, 3번의 <b>In children, too</b>에서 초점이 아이로 옮겨 갑니다. 그 뒤 5번은 <b>신체</b> 발달, 6·7번은 <b>사회성·성격</b> 발달로 예를 나눠 듭니다. 즉 이 글은 <b>아이의 발달에서 놀이가 하는 역할</b>을 여러 갈래로 보여 주는 글입니다."}], "opts": [{"n": "①", "t": "necessity of trying out creative ideas", "a": false, "x": true, "trap": false, "e": "6번에 try out이 나오지만 시도하는 대상은 <b>사회적 행동</b>이지 창의적 아이디어가 아닙니다. creative라는 말 자체가 지문에 없습니다."}, {"n": "②", "t": "roles of play in children's development", "a": true, "x": false, "trap": false, "e": "3번의 important functions during development를 그대로 받은 표현이고, 5·6·7번이 그 역할을 나눠 설명합니다."}, {"n": "③", "t": "contrasts between human and animal play", "a": false, "x": true, "trap": true, "e": "1·2번에 동물이 나오지만 인간과 <b>대조</b>하지 않습니다. 오히려 <b>too</b>(~도 역시)로 <b>같은 점</b>을 이어 갑니다."}, {"n": "④", "t": "effects of children's physical abilities on play", "a": false, "x": true, "trap": false, "e": "방향이 거꾸로입니다. 지문은 <b>놀이가 신체 능력을 기른다</b>고 했지, 신체 능력이 놀이에 미치는 영향을 말하지 않았습니다."}, {"n": "⑤", "t": "children's needs at various developmental stages", "a": false, "x": true, "trap": false, "e": "발달 <b>단계별 요구</b>를 나눠 설명한 부분이 없습니다. 지문은 단계가 아니라 <b>영역</b>(신체·사회성)으로 나눕니다."}], "w": [["engage in", "~에 참여하다"], ["survival", "생존"], ["function", "기능"], ["infancy", "유아기, 초창기"], ["serve as", "~의 역할을 하다"], ["training ground", "훈련장, 연습의 장"], ["try out", "시도해 보다"], ["acquire", "습득하다, 얻다"], ["personality trait", "성격 특성"], ["adulthood", "성인기"]]}, {"q": "03", "type": "글의 요지", "src": "2020학년도 수능 22번", "ans": "①", "tr": [["1", "돌이켜 보면, 양을 세려는 욕구처럼 사소한 것이 문자 언어만큼 근본적인 발전의 원동력이었다는 사실이 놀랍게 느껴질 수 있다."], ["2", "하지만 기록을 남기려는 욕구는 늘 경제 활동을 따라다녔다. 누가 무엇을 갖고 있는지 분명히 파악하지 못하면 거래 자체가 성립하지 않기 때문이다."], ["3", "그래서 초기 인류의 문자는 사고파는 일이 지배한다 — 내기, 청구서, 계약서의 모음인 것이다."], ["4", "예언자(prophets)의 글을 갖기 훨씬 전에 우리에게는 이익(profits)의 글이 있었다."], ["5", "실제로 많은 문명은 우리가 흔히 문화사와 연결 짓는 위대한 문학 작품을 기록하고 남기는 단계까지 가 보지도 못했다."], ["6", "그 옛 사회들에서 살아남은 것은 대부분 영수증 더미다."], ["7", "그 기록을 남긴 상업적 사업체들이 없었다면, 우리는 그 기록이 나온 문화에 대해 훨씬 더 모르고 있었을 것이다."]], "evh": "2 · 3번 문장", "ev": [{"en": true, "h": "But the desire for written records has always accompanied economic activity ... / As such, early human writing is dominated by wheeling and dealing."}, {"en": false, "h": "요지 유형은 <b>But / As such</b> 같은 연결어 뒤를 봅니다. 1번은 '놀랍게 보인다'는 <b>미끼</b>이고, 2번의 <b>But</b>에서 필자의 말이 시작됩니다. 핵심은 <b>기록하려는 욕구 = 경제 활동에서 나왔다</b>이고, 3번의 <b>early human writing is dominated by wheeling and dealing</b>이 그것을 못 박습니다. 6·7번의 영수증 더미는 같은 말의 반복입니다."}], "opts": [{"n": "①", "t": "고대 사회에서 경제 활동은 문자 기록의 원동력이었다.", "a": true, "x": false, "trap": false, "e": "2번의 desire for written records has always accompanied economic activity, 3번의 dominated by wheeling and dealing과 정확히 일치합니다."}, {"n": "②", "t": "고전 문학을 통해 당대의 경제 활동을 파악할 수 있다.", "a": false, "x": true, "trap": true, "e": "5번은 많은 문명이 문학 작품을 <b>남기지도 못했다</b>고 말합니다. 문학으로 경제를 파악한다는 말은 지문과 function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){

  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;

  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;

function advance(){
