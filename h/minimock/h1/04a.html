var EXP={"01": "<p class=\"mtr\">마더텅 정답률 <b>70%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">주장은 <b>To solve this problem</b>(이 문제를 해결하기 위해) 뒤의 <b>need to</b>(~할 필요가 있다)·<b>must</b>(~해야 한다)에 있어요. 1~3번은 왜 그래야 하는지 보여 주는 배경이에요.</p><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 문제 제기</span><div class=\"en\">… they are almost always less satisfied with their results.</div><p class=\"ko\">그들은 (= 높은 기대를 건 사람들) 자신의 결과에 거의 항상 덜 만족한다.</p></div><div class=\"ck-via\"><i>▼</i><span>왜 그럴까(Why)? 다음에 이유가 나와요</span></div><div class=\"ck-step\"><span class=\"lab\">3번 문장 · 문제의 원인</span><div class=\"en\">… they compare their final outcome to their initial expectations and focus on what they didn't get from the deal</div><p class=\"ko\">그들은 최종 결과를 처음의 기대와 비교하고, 거래에서 자신들이 얻지 못한 것에 초점을 맞춘다.</p></div><div class=\"ck-via\"><i>▼</i><span>this problem(이 문제)으로 앞을 받고 해결책을 내놓아요</span></div><div class=\"ck-step\"><span class=\"lab\">4번 문장 · 결론 신호</span><div class=\"en\">To solve this problem, they <mark>need to</mark> learn how to change their focus after the negotiation is complete.</div><p class=\"ko\">이 문제를 해결하기 위해, 그들은 협상이 끝난 후에 초점을 바꾸는 방법을 <mark>배울 필요가 있다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>must(~해야 한다)로 무엇을 할지 딱 못 박아요</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 문장 · 결정적 단서</span><div class=\"en\">They <mark>must</mark> view their results in a more positive manner.</div><p class=\"ko\">그들은 더 긍정적인 방식으로 자신의 결과를 <mark>바라봐야 한다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">협상 후에는 결과를 의미있게 수용하라.<small>4번 after the negotiation(협상이 끝난 후에) + 5번 more positive manner(더 긍정적인 방식)를 옮긴 말이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">가능한 한 높은 협상 목표를 설정하라.</span><span class=\"why\">[반대] 1번에 high expectations(높은 기대)가 나오지만, 그 때문에 덜 만족한다는 문제를 말하려는 거예요. 높게 잡으라는 게 필자의 말이 아니에요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">협상 중에는 상대를 존중하라.</span><span class=\"why\">[지문에 없음] 협상 상대를 존중하라는 말은 한 번도 안 나와요. 지문은 협상이 끝난 뒤 내 결과를 보는 눈을 말해요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">협상 전에 준비를 철저히 하라.</span><span class=\"why\">[지문에 없음] 협상 '전' 준비 이야기는 없어요. 4번은 after the negotiation is complete(협상이 끝난 후에)라고 시점을 분명히 했어요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">협상 시 가능한 모든 대안을 고려하라.</span><span class=\"why\">[지문에 없음] 대안을 고르는 이야기는 없어요. 6번 everything they were able to get(얻을 수 있었던 모든 것)은 이미 얻은 결과를 알아보라는 뜻이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Even though people who set high expectations for themselves</div><div class=\"k\">비록 스스로에게 높은 기대를 거는 사람들이</div></div><div class=\"rc\"><div class=\"e\">tend to achieve more in a negotiation</div><div class=\"k\">협상에서 더 많은 것을 얻는 경향이 있을지라도</div></div><div class=\"rc\"><div class=\"e\">than those who set low goals,</div><div class=\"k\">낮은 목표를 세우는 사람들보다,</div></div><div class=\"rc\"><div class=\"e\">they are almost always less satisfied with their results.</div><div class=\"k\">그들은 (= 높은 기대를 건 사람들) 자신의 결과에 거의 항상 덜 만족한다.</div></div><div class=\"rnat\">스스로 높은 기대를 설정한 사람들이 낮은 목표를 설정한 사람들보다 협상에서 더 많은 것을 얻는 경향이 있을지라도, 그들은 거의 항상 자신들의 결과에 덜 만족한다.</div><div class=\"rst\">시험 목표를 100점으로 잡은 친구는 90점을 받아도 시무룩해요. = 지문 1번, 기대가 높은 사람이 더 얻어도 <b>덜 만족한다</b>는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Why?</div><div class=\"k\">왜 그럴까?</div></div><div class=\"rnat\">왜 그런가?</div><div class=\"rst\">90점이나 받았는데 왜 시무룩할까요? 지문도 여기서 “왜 그럴까?” 하고 물어요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Because when the negotiation is over,</div><div class=\"k\">왜냐하면 협상이 끝났을 때,</div></div><div class=\"rc\"><div class=\"e\">they compare their final outcome to their initial expectations</div><div class=\"k\">그들은 (= 높은 기대를 건 사람들) 최종 결과를 처음의 기대와 비교하고</div></div><div class=\"rc\"><div class=\"e\">and focus on what they didn't get from the deal</div><div class=\"k\">거래에서 자신들이 얻지 못한 것에 초점을 맞추며</div></div><div class=\"rc\"><div class=\"e\">and feel like they failed.</div><div class=\"k\">실패한 것처럼 느끼기 때문이다.</div></div><div class=\"rnat\">왜냐하면 협상이 끝났을 때, 그들은 최종 결과를 그들의 처음의 기대와 비교하고 그들이 거래에서 얻지 못한 것에 초점을 맞추어 그들이 실패한 것처럼 느끼기 때문이다.</div><div class=\"rst\">100점과 비교하며 틀린 문제만 세니까요. = 지문 3번, 처음 기대와 비교해 <b>얻지 못한 것</b>에만 초점을 맞춘다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">To solve this problem,</div><div class=\"k\">이 문제를(this problem = 결과에 덜 만족하는 문제) 해결하기 위해,</div></div><div class=\"rc ckc\"><div class=\"e\">they <span class=\"cw\">need to learn</span></div><div class=\"k\">그들은 <span class=\"cw\">배울 필요가 있다</span></div></div><div class=\"rc\"><div class=\"e\">how to change their focus</div><div class=\"k\">초점을 바꾸는 방법을</div></div><div class=\"rc\"><div class=\"e\">after the negotiation is complete.</div><div class=\"k\">협상이 끝난 후에.</div></div><div class=\"rnat\">이 문제를 해결하기 위해, 그들은 협상이 끝난 후에 그들의 초점을 바꾸는 방법을 배울 필요가 있다.</div><div class=\"rst\">그러니 시험이 끝나면 보는 눈을 바꿔야 해요. 지문 4번도 협상 후 <b>초점을 바꾸는 법</b>을 배울 필요가 있다고 해요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">They <span class=\"cw\">must view their results</span></div><div class=\"k\">그들은 자신의 결과를 <span class=\"cw\">바라봐야 한다</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">in a more positive manner</span>.</div><div class=\"k\"><span class=\"cw\">더 긍정적인 방식으로</span>.</div></div><div class=\"rnat\">그들은 더 긍정적인 방식으로 자신들의 결과를 바라봐야 한다.</div><div class=\"rst\">“90점이면 정말 잘했다!” 하고 좋게 보는 거예요. 지문 5번이 필자의 주장, 결과를 <b>더 긍정적으로</b> 봐야 한다예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">With this simple adjustment of focus</div><div class=\"k\">이러한 초점의 단순한 조정으로,</div></div><div class=\"rc\"><div class=\"e\">they will recognize everything</div><div class=\"k\">그들은 모든 것을 알아보게 될 것이다</div></div><div class=\"rc\"><div class=\"e\">they were able to get in the negotiation</div><div class=\"k\">그들이 협상에서 얻을 수 있었던</div></div><div class=\"rc\"><div class=\"e\">and feel pleased with their work.</div><div class=\"k\">그리고 자신이 한 일에 기쁨을 느낄 것이다.</div></div><div class=\"rnat\">이러한 초점의 단순한 조정으로 그들은 그들이 협상에서 얻을 수 있었던 모든 것들을 인지하고, 그들이 한 일에 기쁨을 느낄 것이다.</div><div class=\"rst\">그러면 맞힌 문제들이 눈에 들어오고 뿌듯해져요. 지문 6번도 얻은 모든 것을 알아보고 기뻐할 거라고 끝맺어요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"negotiation\" data-m=\"협상\"><b>negotiation</b>협상</button><button type=\"button\" class=\"wdb\" data-w=\"expectation\" data-m=\"기대, 예상\"><b>expectation</b>기대, 예상</button><button type=\"button\" class=\"wdb\" data-w=\"initial\" data-m=\"처음의, 최초의\"><b>initial</b>처음의, 최초의</button><button type=\"button\" class=\"wdb\" data-w=\"outcome\" data-m=\"결과\"><b>outcome</b>결과</button><button type=\"button\" class=\"wdb\" data-w=\"adjustment\" data-m=\"조정, 수정\"><b>adjustment</b>조정, 수정</button><button type=\"button\" class=\"wdb\" data-w=\"manner\" data-m=\"방식, 태도\"><b>manner</b>방식, 태도</button></div>", "02": "<p class=\"mtr\">마더텅 정답률 <b>65%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">1~2번 동물 이야기는 도입이에요. 3번의 <b>too</b>(~도)에서 초점이 아이들(children)로 옮겨 가고, 그 뒤 예시들을 <b>한 번에 덮는 말</b>이 주제예요.</p><div class=\"ck-step\"><span class=\"lab\">2번 문장 · 도입(동물)</span><div class=\"en\">In animals, play has long been seen as a way of learning and practicing skills and behaviors …</div><p class=\"ko\">동물에게 놀이는 오랫동안 기술과 행동을 배우고 연습하는 방식으로 여겨져 왔다</p></div><div class=\"ck-via\"><i>▼</i><span>too(~도)로 동물에서 아이로 무대를 옮겨요</span></div><div class=\"ck-step key\"><span class=\"lab\">3번 문장 · 결정적 주제문</span><div class=\"en\"><mark>In children, too,</mark> play has <mark>important functions</mark> during development.</div><p class=\"ko\"><mark>아이들에게 있어서도,</mark> 놀이는 발달하는 동안 <mark>중요한 기능을 가진다</mark>.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>4번</em>세상과 그 속의 내 자리를 배움</span><span><em>5번</em>걷기·달리기·점프 같은 신체 능력의 훈련장</span><span><em>6~7번</em>사회적 행동·가치관·성격 특성 익히기</span></div><div class=\"ck-eq\">⇒ 세 갈래의 공통점 = 놀이가 아이의 발달에서 하는 여러 역할</div></div><div class=\"ck-via\"><i>▼</i><span>also(또한)로 신체 다음 역할을 덧붙여요</span></div><div class=\"ck-step\"><span class=\"lab\">6번 문장 · 역할 하나 더</span><div class=\"en\"><mark>Play also allows children</mark> to try out and learn social behaviors …</div><p class=\"ko\"><mark>놀이는 또한 아이들이 ~하는 것을 가능하게 한다</mark>: 사회적 행동을 시도해 보고 배우는 것</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">roles of play in children's development 아이들의 발달에서 놀이의 역할<small>3번 important functions(중요한 기능) during development(발달하는 동안)를 그대로 옮겼어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">effects of children's physical abilities on play 아이들의 신체 능력이 놀이에 미치는 영향</span><span class=\"why\">[반대] 5번 physical abilities(신체 능력)는 여러 역할 중 하나예요. 게다가 지문은 놀이가 신체 능력을 키운다는 것이지, 신체 능력이 놀이에 영향을 준다는 게 아니에요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">necessity of trying out creative ideas 창의적 아이디어를 시도해 보는 것의 필요성</span><span class=\"why\">[지문에 없음] 6번 try out(시도해 보다)의 대상은 social behaviors(사회적 행동)예요. 창의적 아이디어 이야기는 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">contrasts between human and animal play 인간과 동물 놀이의 차이</span><span class=\"why\">[지문에 없음] 1번은 Animals as well as humans(인간뿐만 아니라 동물도)로 둘 다 논다고 했을 뿐, 차이를 비교하지 않아요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">children's needs at various developmental stages 다양한 발달 단계에서 아이들의 요구</span><span class=\"why\">[지문에 없음] 단계별로 아이가 무엇을 원하는지는 안 나와요. 지문의 주인공은 아이의 요구가 아니라 놀이의 역할이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Animals as well as humans</div><div class=\"k\">인간뿐만 아니라 동물도</div></div><div class=\"rc\"><div class=\"e\">engage in play activities.</div><div class=\"k\">놀이 활동에 참여한다.</div></div><div class=\"rnat\">인간뿐만 아니라 동물도 놀이 활동에 참여한다.</div><div class=\"rst\">우리 집 강아지도, 유치원생 동생도 하루 종일 놀아요. = 지문 1번, 사람뿐 아니라 동물도 놀이를 한다는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">In animals,</div><div class=\"k\">동물에게 있어,</div></div><div class=\"rc\"><div class=\"e\">play has long been seen</div><div class=\"k\">놀이는 오랫동안 여겨져 왔다</div></div><div class=\"rc\"><div class=\"e\">as a way of learning and practicing</div><div class=\"k\">배우고 연습하는 방식으로</div></div><div class=\"rc\"><div class=\"e\">skills and behaviors</div><div class=\"k\">기술과 행동을</div></div><div class=\"rc\"><div class=\"e\">that are necessary for future survival.</div><div class=\"k\">미래의 생존에 필요한.</div></div><div class=\"rnat\">동물에게 있어, 놀이는 오랫동안 미래의 생존에 필요한 기술과 행동을 학습하고 연습하는 방식으로 여겨져 왔다.</div><div class=\"rst\">강아지는 공을 물고 뛰며 사냥 연습을 해요. 지문 2번도 동물의 놀이는 살아남는 기술을 연습하는 방법이라고 해요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">In children, too,</span></div><div class=\"k\"><span class=\"cw\">아이들에게 있어서도,</span></div></div><div class=\"rc ckc\"><div class=\"e\">play has <span class=\"cw\">important functions</span></div><div class=\"k\">놀이는 <span class=\"cw\">중요한 기능을 가진다</span></div></div><div class=\"rc\"><div class=\"e\">during development.</div><div class=\"k\">발달하는 동안.</div></div><div class=\"rnat\">아이들에게 있어서도, 놀이는 발달하는 동안 중요한 기능을 가진다.</div><div class=\"rst\">그럼 동생은요? 동생에게도 놀이는 <b>중요한 일</b>을 해요. = 지문 3번, 아이들에게도 놀이는 발달에 <b>중요한 기능</b>이 있다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">From its earliest beginnings in infancy,</div><div class=\"k\">그것(its = 놀이)의 유아기의 가장 초기 시작부터,</div></div><div class=\"rc\"><div class=\"e\">play is a way</div><div class=\"k\">놀이는 방식이다</div></div><div class=\"rc\"><div class=\"e\">in which children learn about the world</div><div class=\"k\">그 방식을 통해 (which = a way) 아이들이 세상에 대해 배우는</div></div><div class=\"rc\"><div class=\"e\">and their place in it.</div><div class=\"k\">그리고 그(it = 세상) 안에서의 자신의 위치에 대해.</div></div><div class=\"rnat\">유아기의 가장 초기부터, 놀이는 아이들이 세상과 그 안에서의 자신의 위치에 대해 배우는 방식이다.</div><div class=\"rst\">동생은 소꿉놀이로 집과 가족, 그 속의 자기 자리를 배워요. 지문 4번, 놀이로 세상과 자기 위치를 배운다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">Children's play serves as a <span class=\"cw\">training ground</span></div><div class=\"k\">아이들의 놀이는 <span class=\"cw\">훈련장의 역할을 한다</span></div></div><div class=\"rc\"><div class=\"e\">for developing physical abilities</div><div class=\"k\">신체 능력을 발달시키기 위한</div></div><div class=\"rc\"><div class=\"e\">— skills like walking, running, and jumping</div><div class=\"k\">— 걷기, 달리기, 점프하기와 같은 기술들,</div></div><div class=\"rc\"><div class=\"e\">that are necessary for everyday living.</div><div class=\"k\">일상생활에 필요한.</div></div><div class=\"rnat\">아이들의 놀이는 신체 능력, 즉 일상생활에 필요한 걷기, 달리기, 점프하기와 같은 기술들을 발달시키기 위한 훈련장의 역할을 한다.</div><div class=\"rst\">놀이터에서 뛰고 점프하며 다리 힘도 길러요. 지문 5번, 놀이는 신체 능력을 키우는 <b>훈련장</b>(training ground)이에요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Play also allows children</span></div><div class=\"k\"><span class=\"cw\">놀이는 또한 아이들이 ~하는 것을 가능하게 한다</span></div></div><div class=\"rc\"><div class=\"e\">to try out and learn social behaviors</div><div class=\"k\">사회적 행동을 시도해 보고 배우는 것</div></div><div class=\"rc\"><div class=\"e\">and to acquire values and personality traits</div><div class=\"k\">그리고 가치관과 성격 특성을 습득하는 것</div></div><div class=\"rc\"><div class=\"e\">that will be important in adulthood.</div><div class=\"k\">성인기에 중요해질.</div></div><div class=\"rnat\">놀이는 또한 아이들이 사회적 행동을 시도하고 학습하는 것과 성인기에 중요할 가치와 성격 특성을 습득하는 것을 가능하게 한다.</div><div class=\"rst\">친구와 장난감을 나누며 양보도 배워요. 지문 6번, 놀이는 <b>또한</b>(also) 사회적 행동과 성격을 익히게 해요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">For example, they learn</div><div class=\"k\">예를 들어, 그들은 (they = 아이들) 배운다</div></div><div class=\"rc\"><div class=\"e\">how to compete and cooperate with others,</div><div class=\"k\">다른 사람들과 경쟁하고 협력하는 방법을,</div></div><div class=\"rc\"><div class=\"e\">how to lead and follow, how to make decisions,</div><div class=\"k\">이끌고 따르는 방법, 결정을 내리는 방법을,</div></div><div class=\"rc\"><div class=\"e\">and so on.</div><div class=\"k\">등등.</div></div><div class=\"rnat\">예를 들어, 그들은 다른 사람들과 경쟁하고 협력하는 방법, (다른 사람들을) 이끌고 따르는 방법, 결정하는 방법 등을 학습한다.</div><div class=\"rst\">술래잡기에서 이기고, 편먹고, 대장 하고, 정하는 법까지요. 지문 7번의 경쟁·협력·이끌기·결정하기 예시예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"engage in\" data-m=\"~에 참여하다\"><b>engage in</b>~에 참여하다</button><button type=\"button\" class=\"wdb\" data-w=\"function\" data-m=\"기능\"><b>function</b>기능</button><button type=\"button\" class=\"wdb\" data-w=\"infancy\" data-m=\"유아기, 초창기\"><b>infancy</b>유아기, 초창기</button><button type=\"button\" class=\"wdb\" data-w=\"serve as\" data-m=\"~의 역할을 하다\"><b>serve as</b>~의 역할을 하다</button><button type=\"button\" class=\"wdb\" data-w=\"acquire\" data-m=\"습득하다, 얻다\"><b>acquire</b>습득하다, 얻다</button><button type=\"button\" class=\"wdb\" data-w=\"personality trait\" data-m=\"성격 특성\"><b>personality trait</b>성격 특성</button></div>", "03": "<p class=\"mtr\">마더텅 정답률 <b>30%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">1번은 “놀랍다”는 미끼이고, 요지는 2번 <b>But</b>(그러나) 뒤에 있어요. 이어지는 <b>As such</b>(이와 같이)와 영수증 이야기는 모두 <b>기록 = 경제 활동에서 나왔다</b>를 되풀이해요.</p><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 미끼</span><div class=\"en\">… it might seem surprising that something as mundane as the desire to count sheep was the driving force for an advance as fundamental as written language.</div><p class=\"ko\">양을 세려는 욕구처럼 평범한 무언가가 문자 언어만큼 근본적인 진보의 원동력이었다는 것이 놀라워 보일 수도 있다</p></div><div class=\"ck-via\"><i>▼</i><span>But(그러나)으로 필자의 진짜 말이 시작돼요</span></div><div class=\"ck-step key\"><span class=\"lab\">2번 문장 · 결정적 요지</span><div class=\"en\"><mark>But</mark> the desire for written records has always <mark>accompanied economic activity</mark>,</div><p class=\"ko\"><mark>그러나</mark> 문자 기록에 대한 욕구는 늘 <mark>경제 활동에 수반되어 왔다</mark>,</p></div><div class=\"ck-via\"><i>▼</i><span>As such(이와 같이)로 2번을 받아 못 박아요</span></div><div class=\"ck-step\"><span class=\"lab\">3번 문장 · 같은 말 확인</span><div class=\"en\"><mark>As such,</mark> early human writing is dominated by wheeling and dealing:</div><p class=\"ko\"><mark>이와 같이,</mark> 초기 인류의 기록은 (경제적) 목적을 위해서는 수단을 가리지 않는 것에 지배된다</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>4번</em>예언자의 글보다 이익의 글이 훨씬 먼저</span><span><em>6번</em>고대 사회에서 남은 건 대개 영수증 더미</span><span><em>7번</em>기록을 만든 영리 기업이 없었다면 문화를 훨씬 덜 알 것</span></div><div class=\"ck-eq\">⇒ 세 문장의 공통점 = 고대의 문자 기록은 장사·거래 때문에 생겼다 (2번과 같은 말)</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">고대 사회에서 경제 활동은 문자 기록의 원동력이었다.<small>1번 driving force(원동력) + 2번 accompanied economic activity(경제 활동에 수반되었다)를 합친 말이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">모든 문명이 위대한 작가를 배출한 것은 아니다.</span><span class=\"why\">[범위 좁음] 5번 내용과 비슷하지만, 그건 문학보다 영수증이 남았다는 걸 보여 주는 곁가지예요. 글 전체가 말하는 기록과 경제의 관계가 빠졌어요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">고전 문학을 통해 당대의 경제 활동을 파악할 수 있다.</span><span class=\"why\">[반대] 5번은 많은 문명이 great literary works(위대한 문학 작품)를 남기는 단계에 이르지 못했다고 해요. 경제를 알려 주는 건 문학이 아니라 6번의 receipts(영수증)예요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">경제 발전의 정도가 문명의 발달 수준을 결정한다.</span><span class=\"why\">[범위 넓음] 지문은 경제가 문자 기록을 낳았다는 것만 말해요. 문명 수준을 경제가 정한다는 비교는 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">종교의 역사는 상업의 역사보다 먼저 시작되었다.</span><span class=\"why\">[반대] 4번 Long before(훨씬 이전에) the prophets(예언자들), we had the profits(이익)라고 했어요. 장사 기록이 종교보다 먼저예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">In retrospect,</div><div class=\"k\">돌이켜 보면,</div></div><div class=\"rc\"><div class=\"e\">it might seem surprising</div><div class=\"k\">놀라워 보일 수도 있다 (it은 가주어, 진주어는 뒤의 that 이하)</div></div><div class=\"rc\"><div class=\"e\">that something as mundane as the desire to count sheep</div><div class=\"k\">양을 세려는 욕구처럼 평범한 무언가가</div></div><div class=\"rc\"><div class=\"e\">was the driving force</div><div class=\"k\">원동력이었다는 것이</div></div><div class=\"rc\"><div class=\"e\">for an advance as fundamental as written language.</div><div class=\"k\">문자 언어만큼 근본적인 진보의.</div></div><div class=\"rnat\">돌이켜 생각해 보면, 양의 수를 세려는 욕구처럼 일상적인 무언가가 문자 언어만큼 중요한 진보의 원동력이었다는 것은 놀라워 보일 수도 있다.</div><div class=\"rst\">우리 반 첫 공책이 일기가 아니라 '빌려준 돈 장부'였다면 놀랍죠? = 지문 1번, 양 세기 같은 평범한 일이 <b>문자의 원동력</b>이었다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">2번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">But</span> the desire for written records</div><div class=\"k\"><span class=\"cw\">그러나</span> 문자 기록에 대한 욕구는</div></div><div class=\"rc ckc\"><div class=\"e\">has always <span class=\"cw\">accompanied economic activity</span>,</div><div class=\"k\">늘 <span class=\"cw\">경제 활동에 수반되어 왔다</span>,</div></div><div class=\"rc\"><div class=\"e\">since transactions are meaningless</div><div class=\"k\">왜냐하면 거래는 무의미하기 때문이다</div></div><div class=\"rc\"><div class=\"e\">unless you can clearly keep track of</div><div class=\"k\">당신이 분명히 기록해 둘 수 없다면</div></div><div class=\"rc\"><div class=\"e\">who owns what.</div><div class=\"k\">누가 무엇을 소유하는지를.</div></div><div class=\"rnat\">그러나 문자 기록에 대한 욕구는 항상 경제적인 활동에 수반되어 왔는데, 만약 당신이 누가 무엇을 소유하는지를 명확하게 기록하지 않는다면 거래는 무의미하기 때문이다.</div><div class=\"rst\"><b>그런데</b>(But) 누가 누구한테 얼마 빌렸는지 안 적으면 거래가 엉망이 돼요. 지문 2번, 기록 욕구는 늘 <b>경제 활동</b>과 함께였다는 요지예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">As such,</span></div><div class=\"k\"><span class=\"cw\">이와 같이,</span></div></div><div class=\"rc\"><div class=\"e\">early human writing is dominated by</div><div class=\"k\">초기 인류의 기록은 ~에 지배된다</div></div><div class=\"rc\"><div class=\"e\">wheeling and dealing:</div><div class=\"k\">(경제적) 목적을 위해서는 수단을 가리지 않는 것에</div></div><div class=\"rc\"><div class=\"e\">a collection of bets, bills, and contracts.</div><div class=\"k\">(예를 들면) 내기에 건 돈, 청구서, 그리고 계약서의 모음.</div></div><div class=\"rnat\">이와 같이, 초기 인류의 기록은 (경제적) 목적을 위해서는 수단을 가리지 않는 것에 의해 지배된다. (예를 들면) 내기에 건 돈, 청구서, 그리고 계약서의 모음.</div><div class=\"rst\"><b>이와 같이</b>(As such) 그 공책 첫 장은 빌린 돈, 내기, 약속으로 가득해요. 지문 3번, 초기 기록은 거래 이야기로 채워져 있다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">Long before we had the writings of the prophets,</div><div class=\"k\">우리가 예언자들의 글을 갖기 훨씬 이전에,</div></div><div class=\"rc\"><div class=\"e\">we had the writings of the profits.</div><div class=\"k\">우리에게는 이익의 글이 있었다.</div></div><div class=\"rnat\">우리가 예언자들에 대한 기록을 가지기 훨씬 이전에, 우리는 이익에 대한 기록을 가지고 있었다.</div><div class=\"rst\">반 친구들의 멋진 시보다 '떡볶이값 장부'가 훨씬 먼저 생겼어요. 지문 4번, 예언자의 글보다 <b>이익의 글</b>이 먼저였다는 말이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">In fact, many civilizations</div><div class=\"k\">사실, 많은 문명들은</div></div><div class=\"rc\"><div class=\"e\">never got to the stage</div><div class=\"k\">단계에 이르지 못했다</div></div><div class=\"rc\"><div class=\"e\">of recording and leaving behind</div><div class=\"k\">기록하고 후대에 남기는</div></div><div class=\"rc\"><div class=\"e\">the kinds of great literary works</div><div class=\"k\">그런 종류의 위대한 문학 작품들을</div></div><div class=\"rc\"><div class=\"e\">that we often associate with the history of culture.</div><div class=\"k\">우리가 흔히 문화의 역사와 결부시키는.</div></div><div class=\"rnat\">사실, 많은 문명들이 우리가 종종 문화사와 결부시키는 (그러한) 종류의 위대한 문학 작품들을 기록하고 (후대에) 남기는 단계에 도달하지 못했다.</div><div class=\"rst\">사실 많은 반은 멋진 학급 문집을 끝내 못 만들어요. 지문 5번, 많은 문명이 위대한 문학을 남기지 못했다는 말이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">What survives these ancient societies</div><div class=\"k\">이 고대 사회들에서 살아남은 것은</div></div><div class=\"rc\"><div class=\"e\">is, for the most part,</div><div class=\"k\">대개</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">a pile of receipts</span>.</div><div class=\"k\"><span class=\"cw\">한 무더기의 영수증이다</span>.</div></div><div class=\"rnat\">이 고대 사회들에서 살아남은 것은 대개 한 무더기의 영수증이다.</div><div class=\"rst\">졸업 후 남은 건 대부분 장부 쪽지들이에요. 지문 6번, 고대 사회에서 남은 건 대개 <b>영수증 더미</b>라는 말이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">If it weren't for the commercial enterprises</div><div class=\"k\">영리적 기업들이 없었다면</div></div><div class=\"rc\"><div class=\"e\">that produced those records,</div><div class=\"k\">그러한 기록을 만든</div></div><div class=\"rc\"><div class=\"e\">we would know far, far less</div><div class=\"k\">우리는 훨씬, 훨씬 더 적게 알고 있을 것이다</div></div><div class=\"rc\"><div class=\"e\">about the cultures that they came from.</div><div class=\"k\">그것들(they = 기록들)이 생겨난 문화에 대해.</div></div><div class=\"rnat\">그러한 기록을 만든 영리적 기업들이 없었다면, 우리는 그것들(기록들)이 생겨난 문화에 대해 훨씬, 훨씬 더 적게 알고 있을 것이다.</div><div class=\"rst\">그 장부가 없었다면 그 반이 어땠는지 거의 몰랐을 거예요. 지문 7번, 기록을 만든 영리 기업 덕분에 그 문화를 안다는 말이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"mundane\" data-m=\"세속의, 평범한\"><b>mundane</b>세속의, 평범한</button><button type=\"button\" class=\"wdb\" data-w=\"driving force\" data-m=\"원동력\"><b>driving force</b>원동력</button><button type=\"button\" class=\"wdb\" data-w=\"accompany\" data-m=\"동반하다, 수반하다\"><b>accompany</b>동반하다, 수반하다</button><button type=\"button\" class=\"wdb\" data-w=\"transaction\" data-m=\"거래\"><b>transaction</b>거래</button><button type=\"button\" class=\"wdb\" data-w=\"keep track of\" data-m=\"~을 파악하다, 기록해 두다\"><b>keep track of</b>~을 파악하다, 기록해 두다</button><button type=\"button\" class=\"wdb\" data-w=\"a pile of\" data-m=\"한 무더기의\"><b>a pile of</b>한 무더기의</button></div>", "04": "<p class=\"mtr\">마더텅 정답률 <b>45%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">어법은 <b>절마다 본동사가 하나씩 있는지</b>부터 세세요. 주어 뒤에 분사(~하는)만 있고 진짜 동사가 없으면 그 자리가 틀린 곳이에요.</p><div class=\"ck-step\"><span class=\"lab\">문제지 ④번 자리 (5번)</span><div class=\"en\"><u>Lower magnesium levels in soil also ④ occurring</u> with acidic soils and around 70% of the farmland on earth is now acidic.</div><p class=\"ko\">토양 속 더 낮은 마그네슘 수치는 산성 토양에서도 ( 나타나는? ) — 주어는 있는데 동사가 없어요</p></div><div class=\"ck-via\"><i>▼</i><span>and(그리고) 뒤 절에는 주어 70% of the farmland(농지의 70%)와 동사 is(~이다)가 다 있어요</span></div><div class=\"ck-step\"><span class=\"lab\">같은 문장 뒤쪽과 비교</span><div class=\"en\">and around 70% of the farmland on earth <mark>is</mark> now acidic.</div><p class=\"ko\">그리고 지구상 농지의 약 70%가 현재 산성<mark>이다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>앞 절도 주어 levels(수치들) 뒤에 본동사가 필요해요 → occur(나타나다)</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 문장 · 결정적 단서</span><div class=\"en\"><mark>Lower magnesium levels</mark> in soil also <mark>occur</mark> with acidic soils</div><p class=\"ko\"><mark>토양 속 더 낮은 마그네슘 수치는</mark> 산성 토양에서도 <mark>나타난다</mark></p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">본동사 자리 ↔ 분사(~하는) 자리</p><p class=\"gr\">한 절에는 주어와 짝을 이루는 본동사가 꼭 하나 있어야 해요. 분사(~하는)는 혼자서는 본동사가 될 수 없어서, 동사 자리가 비어 있으면 분사가 아니라 동사(occur 나타나다)를 써야 해요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>Many students play soccer after school.</div><div class=\"ko\">많은 학생들이 방과 후에 축구를 한다. (주어 Many students + 본동사 play라 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>Many students playing soccer after school.</div><div class=\"ko\">주어만 있고 본동사 없이 playing만 있어서 문장이 안 돼요. 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>Students playing soccer look happy.</div><div class=\"ko\">축구하는 학생들은 행복해 보인다. (playing은 꾸며 주는 말이고 본동사 look이 따로 있어서 맞아요)</div></div><p class=\"gb\">지문 5번 앞 절도 주어 Lower magnesium levels(더 낮은 마그네슘 수치)만 있고 본동사가 없어요. 그래서 occurring(나타나는)이 아니라 occur(나타나다)여야 해요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">occurring → occur (나타난다)<small>주어 levels(수치들)를 받을 본동사 자리라서 분사 occurring(나타나는)이 아니라 occur(나타나다)여야 해요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">so are the plants 식물도 마찬가지다</span><span class=\"why\">7번 앞 절은 our soil is less healthy(우리 토양은 덜 건강하다)예요. '~도 그렇다'는 so(그렇게) + 동사 + 주어로 순서를 뒤집고, 앞의 is(~이다)를 받되 주어 the plants(식물들)가 복수라서 are(~이다)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">so(그렇게) + 동사 + 주어 = ~도 그렇다 (도치)</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I am hungry, and so is my brother.</div><div class=\"ko\">나는 배고프고, 내 남동생도 그렇다. (앞이 am이고 주어 my brother가 단수라 is가 맞아요)</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>I am hungry, and so are my friends.</div><div class=\"ko\">나는 배고프고, 내 친구들도 그렇다. (주어 my friends가 복수라 are가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I am hungry, and so is my friends.</div><div class=\"ko\">주어 my friends(내 친구들)가 복수인데 is를 써서 틀려요. so 뒤 동사는 뒤에 오는 주어에 맞춰요.</div></div><p class=\"gb\">지문 7번도 앞 절 is(~이다)를 받아 so(그렇게) 뒤에 동사 are(~이다), 그 다음 복수 주어 the plants(식물들)가 와서 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">that kill off 죽여 없애는</span><span class=\"why\">1번 that(그것들은)은 앞의 pesticides and fertilizers(살충제와 비료)를 받는 주격 관계대명사예요. 선행사가 복수라서 뒤 동사도 복수형 kill off(죽여 없애다)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">주격 관계대명사 that(그것들은) + 동사: 동사 수는 선행사에 맞춤</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I have friends that live near the school.</div><div class=\"ko\">나는 학교 근처에 사는 친구들이 있다. (선행사 friends가 복수라 live가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I have friends that lives near the school.</div><div class=\"ko\">선행사 friends(친구들)가 복수인데 lives를 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>I have a friend that lives near the school.</div><div class=\"ko\">나는 학교 근처에 사는 친구가 한 명 있다. (선행사 a friend가 단수라 lives가 맞아요)</div></div><p class=\"gb\">지문 1번도 that(그것들은) 앞 선행사가 pesticides and fertilizers(살충제와 비료)로 복수라 kill off(죽여 없애다)가 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">has led to 초래했다</span><span class=\"why\">2번 주어는 Fertilizing crops(농작물에 비료를 주는 것)라는 동명사 주어예요. 동명사 주어는 단수 취급이라 복수형 have(~했다)가 아니라 has led to(초래했다)가 맞아요. 바로 앞 potassium(칼륨)에 속지 마세요.</span><div class=\"gm wx\"><p class=\"gt\">동명사 주어(~하는 것)는 단수 취급</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>Playing games is fun.</div><div class=\"ko\">게임하는 것은 재미있다. (동명사 주어 Playing games는 단수라 is가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>Playing games are fun.</div><div class=\"ko\">games(게임들)가 복수처럼 보여도 주어는 '하는 것' 하나라서 are는 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>Reading books has helped me a lot.</div><div class=\"ko\">책을 읽는 것은 나에게 많은 도움이 되었다. (동명사 주어라 has가 맞아요)</div></div><p class=\"gb\">지문 2번도 Fertilizing crops with nitrogen and potassium(농작물에 질소와 칼륨을 비료로 주는 것)이 한 덩어리 주어라 has led to(초래했다)가 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">due to potassium being ~ 칼륨이 ~인 것 때문에</span><span class=\"why\">4번 due to(~ 때문에)는 전치사라 뒤에 명사나 동명사가 와야 해요. being(~인 것)은 동명사이고, 앞의 potassium(칼륨)은 being(~인 것)의 의미상 주어라서 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">전치사(due to ~ 때문에) + 의미상 주어 + 동명사</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>The game was canceled due to the rain.</div><div class=\"ko\">경기는 비 때문에 취소되었다. (due to 뒤에 명사 the rain이 와서 맞아요)</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>We were late due to the bus being slow.</div><div class=\"ko\">우리는 버스가 느렸기 때문에 늦었다. (the bus가 being의 의미상 주어인 동명사 구조라 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>We were late due to the bus was slow.</div><div class=\"ko\">전치사 due to 뒤에 주어+동사(the bus was)를 바로 써서 틀려요.</div></div><p class=\"gb\">지문 4번도 due to(~ 때문에) 뒤에 potassium(칼륨) + being(~인 것)이 와서 '칼륨이 차단제인 것 때문에'로 맞아요.</p></div></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">The reduction of minerals in our food</div><div class=\"k\">우리 음식 속 무기질의 감소는</div></div><div class=\"rc\"><div class=\"e\">is the result of using pesticides and fertilizers</div><div class=\"k\">살충제와 비료를 사용한 결과이다</div></div><div class=\"rc\"><div class=\"e\">that kill off beneficial bacteria, earthworms, and bugs in the soil</div><div class=\"k\">그것들은 (that = 살충제와 비료) 토양 속 유익한 박테리아, 지렁이, 벌레를 죽여 없애는</div></div><div class=\"rc\"><div class=\"e\">that create many of the essential nutrients in the first place</div><div class=\"k\">그것들이 (that = 박테리아·지렁이·벌레) 애초에 많은 필수 영양소를 만들어 내는</div></div><div class=\"rc\"><div class=\"e\">and prevent the uptake of nutrients into the plant.</div><div class=\"k\">그리고 (살충제와 비료는) 식물 속으로 영양소가 흡수되는 것을 막는.</div></div><div class=\"rnat\">우리 음식 속 무기질의 감소는 애초에 많은 필수 영양소를 만들어 내는 토양 속 유익한 박테리아와 지렁이와 벌레를 죽여 없애고 식물 속으로 영양소가 흡수되는 것을 막는 살충제와 비료를 사용한 결과이다.</div><div class=\"rst\">음식 속 무기질이 줄어든 건 살충제와 비료 탓이에요. 그것들이 흙 속 이로운 벌레를 죽여요. (복수 선행사라 kill off(죽여 없애다))</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Fertilizing crops with nitrogen and potassium</div><div class=\"k\">농작물에 질소와 칼륨을 비료로 주는 것은</div></div><div class=\"rc\"><div class=\"e\">has led to declines</div><div class=\"k\">감소를 초래했다</div></div><div class=\"rc\"><div class=\"e\">in magnesium, zinc, iron and iodine.</div><div class=\"k\">마그네슘, 아연, 철 그리고 아이오딘의.</div></div><div class=\"rnat\">농작물에 질소와 칼륨을 비료로 주는 것은 마그네슘, 아연, 철 그리고 아이오딘의 감소를 초래했다.</div><div class=\"rst\">질소·칼륨 비료를 주는 것이 마그네슘·철 같은 영양소를 줄였어요. 주어는 동명사 한 덩어리라 <b>has</b> led to(초래했다)예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">For example, there has been</div><div class=\"k\">예를 들어, ~이 있었다</div></div><div class=\"rc\"><div class=\"e\">on average about a 30% decline</div><div class=\"k\">평균 약 30%의 감소가</div></div><div class=\"rc\"><div class=\"e\">in the magnesium content of wheat.</div><div class=\"k\">밀의 마그네슘 함량에서.</div></div><div class=\"rnat\">예컨대, 밀의 마그네슘 함량에서 평균적으로 대략 30%의 감소가 있었다.</div><div class=\"rst\">예를 들어 밀 속 마그네슘이 평균 약 30% 줄었어요. 2번 말을 숫자로 보여 주는 문장이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">This is partly due to</div><div class=\"k\">이것은 (This = 밀의 마그네슘 감소) 부분적으로 ~ 때문이다</div></div><div class=\"rc\"><div class=\"e\">potassium being a blocker</div><div class=\"k\">칼륨이 차단제인 것</div></div><div class=\"rc\"><div class=\"e\">against magnesium absorption by plants.</div><div class=\"k\">식물의 마그네슘 흡수에 대한.</div></div><div class=\"rnat\">이는 부분적으로 칼륨이 식물의 마그네슘 흡수에 차단제가 된다는 점 때문이다.</div><div class=\"rst\">이건 칼륨이 마그네슘 흡수를 막기 때문이기도 해요. 전치사 due to(~ 때문에) 뒤라 동명사 being(~인 것)이에요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Lower magnesium levels</span> in soil</div><div class=\"k\"><span class=\"cw\">토양 속 더 낮은 마그네슘 수치는</span></div></div><div class=\"rc ckc\"><div class=\"e\">also <span class=\"cw\">occur with acidic soils</span></div><div class=\"k\"><span class=\"cw\">산성 토양에서도 나타난다</span> ※ 문제지엔 occurring으로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">and around 70% of the farmland on earth</div><div class=\"k\">그리고 지구상 농지의 약 70%가</div></div><div class=\"rc\"><div class=\"e\">is now acidic.</div><div class=\"k\">현재 산성이다.</div></div><div class=\"rnat\">토양의 더 낮은 마그네슘 수치는 산성 토양에서도 나타나고, 현재 지구상 농지의 대략 70%가 산성이다.</div><div class=\"rst\">산성 흙에서도 마그네슘이 낮게 <b>나타나요</b>(occur). 주어 뒤 본동사 자리라서 occurring(나타나는)은 틀린 말이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Thus, the overall characteristics of soil</div><div class=\"k\">그러므로, 토양의 전반적 특성이</div></div><div class=\"rc\"><div class=\"e\">determine the accumulation of minerals</div><div class=\"k\">무기질의 축적을 결정짓는다</div></div><div class=\"rc\"><div class=\"e\">in plants.</div><div class=\"k\">식물 속.</div></div><div class=\"rnat\">그러므로, 토양의 전반적 특성은 식물 속 무기질의 축적을 결정짓는다.</div><div class=\"rst\">그러니 흙의 상태가 식물 속 무기질 양을 정해요. Thus(그러므로)로 앞 내용을 정리하는 문장이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Indeed, nowadays our soil is less healthy</div><div class=\"k\">실제로, 오늘날 우리 토양은 덜 건강하다</div></div><div class=\"rc\"><div class=\"e\">and so are the plants</div><div class=\"k\">그리고 식물도 마찬가지다</div></div><div class=\"rc\"><div class=\"e\">grown on it.</div><div class=\"k\">그 위(it = 토양)에서 길러진.</div></div><div class=\"rnat\">실제로, 오늘날 우리 토양은 덜 건강하며 그 위에서 길러진 식물 또한 그렇다(덜 건강하다).</div><div class=\"rst\">요즘 흙은 덜 건강하고, 거기서 자란 식물도 <b>마찬가지예요</b>. so(그렇게) + are(~이다) + the plants(식물들) 도치 구조예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"pesticide\" data-m=\"살충제\"><b>pesticide</b>살충제</button><button type=\"button\" class=\"wdb\" data-w=\"fertilizer\" data-m=\"비료\"><b>fertilizer</b>비료</button><button type=\"button\" class=\"wdb\" data-w=\"kill off\" data-m=\"죽여 없애다\"><b>kill off</b>죽여 없애다</button><button type=\"button\" class=\"wdb\" data-w=\"uptake\" data-m=\"흡수, 섭취\"><b>uptake</b>흡수, 섭취</button><button type=\"button\" class=\"wdb\" data-w=\"absorption\" data-m=\"흡수\"><b>absorption</b>흡수</button><button type=\"button\" class=\"wdb\" data-w=\"acidic\" data-m=\"산성의\"><b>acidic</b>산성의</button></div>", "05": "<p class=\"mtr\">마더텅 정답률 <b>35%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">글의 방향은 <b>만들면 팔린다 → 고객이 원하는 걸 만들어야 한다</b>로 뒤집혀요. 2번 <b>not enough</b>(충분하지 않다)가 옛 생각을 밀어내는 신호이니, 이 흐름과 거꾸로 옛 생각을 밀어주는 낱말을 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">2번 · 방향 전환</span><div class=\"en\">… made business realize that it was <mark>not enough</mark> to produce a quality product at a reasonable price.</div><p class=\"ko\">적당한 가격에 질 좋은 제품을 만드는 것만으로는 <mark>충분하지 않다는 것을</mark> 기업이 깨닫게 했다.</p></div><div class=\"ck-via\"><i>▼</i><span>그럼 무엇이 더 필요한지 바로 이어서 말해요</span></div><div class=\"ck-step\"><span class=\"lab\">3번 · 새 방향</span><div class=\"en\">In fact, it was equally essential to deliver products that <mark>customers actually wanted</mark>.</div><p class=\"ko\">사실, <mark>고객이 실제로 원하는</mark> 제품을 내놓는 것이 똑같이 아주 중요했다.</p></div><div class=\"ck-via\"><i>▼</i><span>고객 중심 혁명이 '만들면 팔린다'는 옛 시각을 강화했다? 방향이 거꾸로예요</span></div><div class=\"ck-step\"><span class=\"lab\">문제지 ④번 자리 (5번)</span><div class=\"en\">The modernization of society led to a marketing revolution that <u>④ strengthened</u> the view that production would create its own demand.</div><p class=\"ko\">사회의 현대화는 생산이 그 자체의 수요를 창출할 것이라는 시각을 ( 강화했다? ) 마케팅 혁명을 낳았다 → '파괴했다'가 맞아요.</p></div><div class=\"ck-via\"><i>▼</i><span>원래 문장은 옛 시각을 무너뜨렸다는 말이에요</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 · 결정적 단서</span><div class=\"en\">a marketing revolution that <mark>destroyed the view</mark> that production would create its own demand.</div><p class=\"ko\">그 혁명은 생산이 그 자체의 수요를 창출할 것이라는 <mark>그 시각을 파괴했다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>옛 시각이 무너진 자리에 고객이 들어와요</span></div><div class=\"ck-step\"><span class=\"lab\">6번 · 결과로 확인</span><div class=\"en\">Customers, and the desire to meet their diverse and often complex needs, <mark>became the focus of business</mark>.</div><p class=\"ko\">고객, 그리고 그들의 다양하고도 흔히 복잡한 요구에 맞추려는 욕망이 <mark>기업의 중점이 되었다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">strengthened(강화했다) ↔ destroyed(파괴했다)</p><p class=\"gr\">새 생각이 등장하면 옛 생각은 약해지거나 무너져요. 고객 중심이라는 새 방향이면, 옛 시각에는 strengthened(강화했다)가 아니라 destroyed(파괴했다)·weakened(약화시켰다)가 와야 해요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>The new phone destroyed the idea that phones are only for calls.</div><div class=\"ko\">새 휴대폰은 '휴대폰은 통화용일 뿐'이라는 생각을 무너뜨렸다. (새 것 → 옛 생각 무너짐)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>The new phone strengthened the idea that phones are only for calls.</div><div class=\"ko\">온갖 기능을 가진 새 휴대폰이 '통화용일 뿐'이라는 생각을 강화했다? 방향이 거꾸로라 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>Online classes weakened the view that we can only learn at school.</div><div class=\"ko\">온라인 수업은 '학교에서만 배울 수 있다'는 시각을 약화시켰다. (새 방식 → 옛 시각 약해짐)</div></div><p class=\"gb\">지문 5번의 마케팅 혁명은 고객 중심이라는 새 방향이에요. 그래서 '생산이 알아서 수요를 만든다'는 옛 시각을 strengthened(강화했다)가 아니라 destroyed(파괴했다)여야 해요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">strengthened → destroyed (파괴했다)<small>고객 중심 혁명은 '생산이 알아서 수요를 만든다'는 옛 시각을 무너뜨려야 6번과 이어져요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">this was no longer possible 이것은 더 이상 가능하지 않았다</span><span class=\"why\">4번 앞부분은 1908년 Henry Ford(헨리 포드)가 검은색 한 가지로만 만든 예예요. 고객이 원하는 걸 만들어야 하는 현대 사회에서는 한 색만 만드는 게 통하지 않으니 no longer possible(더 이상 가능하지 않은)이 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">closer relations with buyers and clients 구매자 및 고객과 더 가까운 관계</span><span class=\"why\">1번에서 사회가 더 경쟁적이고 넓게 퍼졌으니 기업은 손님을 붙잡아야 해요. 그래서 고객과 closer(더 가까운) 관계를 발전시켰다가 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">it was equally essential 똑같이 아주 중요했다</span><span class=\"why\">2번이 질 좋은 제품만으로는 not enough(충분하지 않다)라고 했어요. 그러니 고객이 원하는 제품을 내놓는 것도 equally essential(똑같이 아주 중요한)이 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">the desire to meet their diverse ~ needs 다양한 요구에 맞추려는 욕망</span><span class=\"why\">6번은 고객이 기업의 중점이 되었다는 결론이에요. 고객의 다양한 요구를 맞추려는 desire(욕망)가 함께 중점이 되었다는 건 글의 방향과 딱 맞아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">The major philosophical shift</div><div class=\"k\">중대한 철학적 변화가</div></div><div class=\"rc\"><div class=\"e\">in the idea of selling</div><div class=\"k\">판매라는 개념에서</div></div><div class=\"rc\"><div class=\"e\">came when industrial societies became</div><div class=\"k\">산업 사회가 ~하게 되었을 때 찾아왔다</div></div><div class=\"rc\"><div class=\"e\">more affluent, more competitive,</div><div class=\"k\">더 부유해지고, 더 경쟁적이 되고,</div></div><div class=\"rc\"><div class=\"e\">and more geographically spread out</div><div class=\"k\">지리적으로 더 널리 퍼지게 되었을 때</div></div><div class=\"rc\"><div class=\"e\">during the 1940s and 1950s.</div><div class=\"k\">1940년대와 1950년대 동안.</div></div><div class=\"rnat\">1940년대와 1950년대 동안 산업 사회가 더 부유해지고, 더 경쟁적이 되고, 지리적으로 더 확산되면서, 판매 개념에서의 중대한 철학적 변화가 생겼다.</div><div class=\"rst\">판매에 대한 생각이 크게 바뀐 건 1940~50년대예요. 사회가 더 부유하고, 경쟁적이고, 넓게 퍼졌을 때예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">This forced business</div><div class=\"k\">이것은 (This = 앞 문장의 사회 변화) 기업이 ~하도록 만들었다</div></div><div class=\"rc\"><div class=\"e\">to develop closer relations with buyers and clients,</div><div class=\"k\">구매자 및 고객과 더 가까운 관계를 발전시키도록,</div></div><div class=\"rc\"><div class=\"e\">which in turn made business realize</div><div class=\"k\">그것은 (which = 앞 내용 전체) 결과적으로 기업이 깨닫게 했다</div></div><div class=\"rc ckc\"><div class=\"e\">that it was <span class=\"cw\">not enough</span></div><div class=\"k\"><span class=\"cw\">~가 충분하지 않다는 것을</span></div></div><div class=\"rc\"><div class=\"e\">to produce a quality product at a reasonable price.</div><div class=\"k\">적당한 가격에 질 좋은 제품을 만드는 것이.</div></div><div class=\"rnat\">이것은 기업이 구매자 및 고객과 더 가까운 관계를 발전시킬 수밖에 없게 만들었고, 결과적으로 이는 기업이 적당한 가격에 질 좋은 제품을 만들어내는 것으로는 충분치 않다는 점을 깨닫게 했다.</div><div class=\"rst\">그래서 기업은 손님과 <b>가까워져야</b> 했고, 좋은 물건을 싸게 만드는 것만으론 <b>부족하다</b>(not enough)는 걸 알았어요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">In fact, it was equally essential</div><div class=\"k\">사실, 똑같이 아주 중요했다 (it = 가주어)</div></div><div class=\"rc\"><div class=\"e\">to deliver products</div><div class=\"k\">제품을 내놓는 것이</div></div><div class=\"rc ckc\"><div class=\"e\">that <span class=\"cw\">customers actually wanted</span>.</div><div class=\"k\"><span class=\"cw\">고객이 실제로 원하는</span>.</div></div><div class=\"rnat\">사실, 고객이 실질적으로 원하는 제품을 내놓는 것이 마찬가지로 아주 중요했다.</div><div class=\"rst\">손님이 <b>실제로 원하는</b> 물건을 내놓는 것도 똑같이 중요했어요. 2번이 말한 '부족한 부분'이 바로 이거예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Henry Ford produced his best-selling T-model Ford</div><div class=\"k\">Henry Ford는 가장 많이 팔린 자사의 T-모델 Ford를 생산했다</div></div><div class=\"rc\"><div class=\"e\">in one color only (black) in 1908,</div><div class=\"k\">1908년에 딱 한 가지 색(검은색)으로만,</div></div><div class=\"rc\"><div class=\"e\">but in modern societies</div><div class=\"k\">하지만 현대 사회에서는</div></div><div class=\"rc\"><div class=\"e\">this was no longer possible.</div><div class=\"k\">이것은(this = 한 가지 색으로만 생산하는 것) 더 이상 가능하지 않았다.</div></div><div class=\"rnat\">1908년에 Henry Ford는 가장 많이 팔린 자사의 T-모델 Ford를 딱 한 가지 색(검은색)으로만 생산했지만, 현대 사회에서는 이것이 더 이상 가능하지 않았다.</div><div class=\"rst\">1908년 Henry Ford(헨리 포드)는 차를 검은색 하나로만 만들었어요. 하지만 현대 사회에선 그게 <b>더 이상 안 통했어요</b>.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">The modernization of society</div><div class=\"k\">사회의 현대화는</div></div><div class=\"rc\"><div class=\"e\">led to a marketing revolution</div><div class=\"k\">마케팅 혁명을 낳았다</div></div><div class=\"rc ckc\"><div class=\"e\">that <span class=\"cw\">destroyed the view</span></div><div class=\"k\">그 혁명은 (that = 마케팅 혁명) <span class=\"cw\">그 시각을 파괴했다</span> ※ 문제지엔 strengthened로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">that production would create its own demand.</div><div class=\"k\">생산이 그 자체의 수요를 창출할 것이라는.</div></div><div class=\"rnat\">사회의 현대화는 생산이 그 자체의 수요를 창출할 것이라는 시각을 파괴한(문제지엔 '강화한'으로 되어 있음) 마케팅 혁명을 낳았다.</div><div class=\"rst\">사회가 현대화되며 마케팅 혁명이 왔고, '만들면 팔린다'는 옛 생각을 <b>무너뜨렸어요</b>(destroyed). 그래서 strengthened(강화했다)는 틀려요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Customers, and the desire</div><div class=\"k\">고객, 그리고 ~하려는 욕망이</div></div><div class=\"rc\"><div class=\"e\">to meet their diverse and often complex needs,</div><div class=\"k\">그들의 (their = 고객들의) 다양하고도 흔히 복잡한 요구에 맞추려는,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">became the focus of business</span>.</div><div class=\"k\"><span class=\"cw\">기업의 중점이 되었다</span>.</div></div><div class=\"rnat\">고객, 그리고 그들의 다양하고도 흔히 복잡한 요구에 맞추려는 욕망이 기업의 중점이 되었다.</div><div class=\"rst\">이제 손님과 그 다양한 요구가 기업의 <b>중심</b>이 되었어요. 5번에서 옛 생각이 무너진 결과예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"shift\" data-m=\"전환, 변화\"><b>shift</b>전환, 변화</button><button type=\"button\" class=\"wdb\" data-w=\"affluent\" data-m=\"부유한\"><b>affluent</b>부유한</button><button type=\"button\" class=\"wdb\" data-w=\"in turn\" data-m=\"결국, 차례로\"><b>in turn</b>결국, 차례로</button><button type=\"button\" class=\"wdb\" data-w=\"deliver\" data-m=\"제공하다, 전달하다\"><b>deliver</b>제공하다, 전달하다</button><button type=\"button\" class=\"wdb\" data-w=\"modernization\" data-m=\"현대화\"><b>modernization</b>현대화</button><button type=\"button\" class=\"wdb\" data-w=\"demand\" data-m=\"수요\"><b>demand</b>수요</button><button type=\"button\" class=\"wdb\" data-w=\"diverse\" data-m=\"다양한\"><b>diverse</b>다양한</button></div>", "06": "<p class=\"mtr\">마더텅 정답률 <b>45%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸 바로 뒤 <b>This is a good thing</b>(이것은 좋은 일이다)의 This(이것)가 빈칸을 받아요. 그 이유가 <b>distance traveled</b>(이동한 거리)이니, 손님이 <b>많이 걷게 되는 말</b>을 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (2번)</span><div class=\"en\">Merchandisers often use the back wall as a magnet, because it means that <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span>.</span></div><p class=\"ko\">판매업자들은 뒷벽을 자석으로 쓴다, 왜냐하면 그것이 ( ? )를 의미하기 때문이다</p></div><div class=\"ck-via\"><i>▼</i><span>This(이것)가 빈칸 내용을 받고, 왜 좋은지 이유를 대요</span></div><div class=\"ck-step key\"><span class=\"lab\">3번 문장 · 결정적 단서</span><div class=\"en\">This is a good thing because <mark>distance traveled</mark> <mark>relates more directly to sales</mark> per entering customer …</div><p class=\"ko\">이것은 좋은 일이다. 왜냐하면 <mark>이동한 거리가</mark> 입장한 고객 한 명당 <mark>판매량과 더 직접적으로 관련이 있기</mark> 때문이다</p></div><div class=\"ck-via\"><i>▼</i><span>뒷벽에 무엇을 두는지 실제 예를 보여 줘요</span></div><div class=\"ck-step\"><span class=\"lab\">6번 문장 · 예시로 확인</span><div class=\"en\">In supermarkets, <mark>the dairy is often at the back</mark>, because people frequently come just for milk.</div><p class=\"ko\">슈퍼마켓에서, 사람들이 자주 우유만 사러 오기 때문에 <mark>유제품(코너)은 종종 뒤쪽에 있다</mark>.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>4번</em>눈길·귀를 끄는 벽 장식과 소리</span><span><em>6번</em>슈퍼마켓 유제품 코너는 맨 뒤</span><span><em>7번</em>비디오 대여점 신작도 맨 뒤</span></div><div class=\"ck-eq\">⇒ 세 예시의 공통점 = 손님을 뒤쪽까지 끌어당겨 매장을 다 지나가게 하기</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">people have to walk through the whole store 사람들이 매장 전체를 지나서 걸어 다녀야 한다<small>3번 distance traveled(이동한 거리)가 매출과 이어지니, 매장 전체를 걷게 해야 해요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">the store provides customers with cultural events 매장이 고객에게 문화 행사를 제공한다</span><span class=\"why\">4번 벽 장식과 소리는 감각을 끄는 attraction(매력)일 뿐, 문화 행사가 아니에요. 3번의 이유인 distance traveled(이동한 거리)와도 이어지지 않아요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">the store looks larger than it is 매장이 실제보다 더 커 보인다</span><span class=\"why\">매장이 커 보인다는 말은 지문에 없어요. 3번은 보이는 크기가 아니라 손님이 실제로 걸은 거리를 말해요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">more products can be stored there 거기에 더 많은 상품을 보관할 수 있다</span><span class=\"why\">뒷벽을 창고로 쓴다는 얘기는 없어요. 6번 우유도 보관하려는 게 아니라 손님을 뒤까지 오게 하려고 둔 거예요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">people don't need to spend too much time in the store 사람들이 매장에서 너무 많은 시간을 쓸 필요가 없다</span><span class=\"why\">정반대예요. 3번은 이동한 거리가 길수록 매출과 이어진다고 했으니, 매장은 손님을 더 오래 더 많이 걷게 하고 싶어 해요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Within a store,</div><div class=\"k\">상점 안에서,</div></div><div class=\"rc\"><div class=\"e\">the wall marks the back of the store,</div><div class=\"k\">벽은 상점의 뒤쪽을 나타내지만,</div></div><div class=\"rc\"><div class=\"e\">but not the end of the marketing.</div><div class=\"k\">마케팅의 끝을 나타내는 것은 아니다.</div></div><div class=\"rnat\">상점 안에서 벽은 상점의 뒤쪽을 나타내지만, 마케팅의 끝을 나타내는 것은 아니다.</div><div class=\"rst\">동네 편의점 맨 안쪽 벽은 가게의 끝이지만 장사의 끝은 아니에요. = 지문 1번, 벽은 상점 뒤쪽이지 마케팅의 끝이 아니라는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Merchandisers often use the back wall</div><div class=\"k\">상품 판매업자들은 종종 뒷벽을 사용한다</div></div><div class=\"rc\"><div class=\"e\">as a magnet,</div><div class=\"k\">마음을 끄는 자석으로,</div></div><div class=\"rc\"><div class=\"e\">because it means that</div><div class=\"k\">왜냐하면 그것이 (it = 뒷벽을 자석으로 쓰는 것) ~을 의미하기 때문이다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">people have to walk through the whole store</span>.</div><div class=\"k\"><span class=\"cw\">사람들이 매장 전체를 지나서 걸어 다녀야 한다는 것</span>. ※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rnat\">상품 판매업자들은 종종 뒷벽을 (사람의) 마음을 끄는 것으로 사용하는데, 이것은 사람들이 매장 전체를 지나서 걸어 다녀야 한다는 것을 의미하기 때문이다.</div><div class=\"rst\">편의점 주인은 뒷벽을 <b>자석</b>처럼 써요. 손님이 가게를 <b>끝까지 다 걸어가게</b> 되니까요. = 지문 2번의 빈칸이에요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc\"><div class=\"e\">This is a good thing</div><div class=\"k\">이것은 (This = 사람들이 매장 전체를 걷게 되는 것) 좋은 일이다</div></div><div class=\"rc ckc\"><div class=\"e\">because <span class=\"cw\">distance traveled</span></div><div class=\"k\">왜냐하면 <span class=\"cw\">이동한 거리가</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">relates more directly to sales</span></div><div class=\"k\"><span class=\"cw\">판매량과 더 직접적으로 관련이 있기</span></div></div><div class=\"rc\"><div class=\"e\">per entering customer</div><div class=\"k\">입장한 고객 한 명당</div></div><div class=\"rc\"><div class=\"e\">than any other measurable consumer variable.</div><div class=\"k\">측정 가능한 다른 어떤 고객 변수보다도.</div></div><div class=\"rnat\">이것은 좋은 일인데, 이동 거리가 다른 어떤 측정 가능한 고객 변수보다 입장한 고객당 판매량과 더 직접적으로 관련이 있기 때문이다.</div><div class=\"rst\">이건 좋은 일이에요. 손님이 <b>많이 걸을수록</b> 과자 하나라도 더 사거든요. = 지문 3번, <b>이동한 거리</b>가 판매와 직결된다예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Sometimes, the wall's attraction</div><div class=\"k\">때로는, 벽의 매력은</div></div><div class=\"rc\"><div class=\"e\">is simply appealing to the senses,</div><div class=\"k\">단순히 감각에 호소하는 것이다,</div></div><div class=\"rc\"><div class=\"e\">a wall decoration that catches the eye</div><div class=\"k\">시선을 사로잡는 벽 장식물</div></div><div class=\"rc\"><div class=\"e\">or a sound that catches the ear.</div><div class=\"k\">또는 귀를 사로잡는 소리.</div></div><div class=\"rnat\">때로는 벽이 사람의 마음을 끌어당기는 것(벽의 매력)은 단순히 감각에 호소하는 것, 즉 시선을 사로잡는 벽 장식물 또는 귀를 사로잡는 소리이다.</div><div class=\"rst\">뒷벽에 반짝이는 포스터나 신나는 음악을 두기도 해요. 지문 4번, 벽의 매력은 눈과 귀를 끄는 것일 때도 있다예요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Sometimes the attraction</div><div class=\"k\">때로는 그 매력은</div></div><div class=\"rc\"><div class=\"e\">is specific goods.</div><div class=\"k\">특정 상품이다.</div></div><div class=\"rnat\">때로는 사람을 끌어당기는 것은 특정 상품이다.</div><div class=\"rst\">또 어떤 때는 특정 물건 자체가 손님을 끌어요. 지문 5번, 그 매력이 특정 상품일 때도 있다는 말이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">In supermarkets,</div><div class=\"k\">슈퍼마켓에서,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">the dairy is often at the back</span>,</div><div class=\"k\"><span class=\"cw\">유제품(코너)은 종종 뒤쪽에 있다,</span></div></div><div class=\"rc\"><div class=\"e\">because people frequently come just for milk.</div><div class=\"k\">사람들이 자주 우유만 사러 오기 때문이다.</div></div><div class=\"rnat\">슈퍼마켓에서 유제품은 종종 뒤쪽에 있는데, 사람들이 자주 우유만을 가지러(사러) 오기 때문이다.</div><div class=\"rst\">우유만 사러 온 나도 <b>맨 뒤 우유 냉장고</b>까지 가며 과자 코너를 지나요. = 지문 6번, 슈퍼마켓 유제품이 뒤에 있는 이유예요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">At video rental shops,</div><div class=\"k\">비디오 대여점에서는,</div></div><div class=\"rc\"><div class=\"e\">it's the new releases.</div><div class=\"k\">그것은 (it = 뒤쪽에 있는 상품) 새로 개봉한 영화이다.</div></div><div class=\"rnat\">비디오 대여점에서는, 그것(뒤쪽에 있는 것)이 새로 개봉한 영화이다.</div><div class=\"rst\">우리 편의점이라면 새로 나온 과자를 맨 뒤에 두는 셈이에요. = 지문 7번, 비디오 대여점은 신작 영화를 뒤에 둬요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"merchandisers\" data-m=\"상품 판매업자들 (merchandiser)\"><b>merchandisers</b>상품 판매업자들 (merchandiser)</button><button type=\"button\" class=\"wdb\" data-w=\"magnet\" data-m=\"자석\"><b>magnet</b>자석</button><button type=\"button\" class=\"wdb\" data-w=\"distance traveled\" data-m=\"이동한 거리\"><b>distance traveled</b>이동한 거리</button><button type=\"button\" class=\"wdb\" data-w=\"measurable\" data-m=\"측정 가능한\"><b>measurable</b>측정 가능한</button><button type=\"button\" class=\"wdb\" data-w=\"variable\" data-m=\"변수\"><b>variable</b>변수</button><button type=\"button\" class=\"wdb\" data-w=\"appealing to\" data-m=\"~에 호소하는 것 (appeal to)\"><b>appealing to</b>~에 호소하는 것 (appeal to)</button><button type=\"button\" class=\"wdb\" data-w=\"dairy\" data-m=\"유제품 코너\"><b>dairy</b>유제품 코너</button></div>"};
document.addEventListener('click',function(e){
 var b=e.target.closest('.stbtn');
 if(b){var box=b.closest('.rdb'),on=!box.classList.contains('story');box.classList.toggle('story',on);
  var L=[].slice.call(box.querySelectorAll('.rds'));L.forEach(function(x){x.classList.remove('lastv');x.style.order='';});
  if(on){L.sort(function(a,c){return (+a.dataset.ord)-(+c.dataset.ord);});L.forEach(function(x,i){x.style.order=i+1;});L[L.length-1].classList.add('lastv');}
  b.textContent=on?'문장별로 보기':'이야기로 이어 읽기';return;}
 var w=e.target.closest('.wdb');
 if(w){var on2=!w.classList.contains('on');w.classList.toggle('on',on2);
  try{if(window.WN){if(on2)WN.add([{w:w.dataset.w,m:w.dataset.m,src:'미니모고',how:'별표',ask:true}]);else if(WN.del)WN.del(w.dataset.w,'미니모고');}}catch(err){}
  var t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s';document.body.appendChild(t);}
  t.textContent=on2?'오답노트장에 담았어요':'오답노트장에서 뺐어요';t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(function(){t.style.opacity='0'},1600);}
});

/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  if(EXP[cq.q]){h+=EXP[cq.q]+'<button class="toq" data-i="'+i+'">빠른 정답으로</button>';return h+'</div></details>';}
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
  mmInit();
}
/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
