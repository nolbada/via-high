<title>고1 미니모의고사 15회 01–06번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:0}
#app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
#app>.wrap{width:100%}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}
.ko{color:var(--sub);font-size:14px;margin-left:6px}
.cell.bad{background:var(--badbg);border-color:var(--bad)}
.cell.bad .tag{background:var(--bad)}
.locked .cell{pointer-events:none}
.bar{position:sticky;margin-top:auto;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.done .opt{pointer-events:none}
.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}
.hcard .chip{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--sub)}
.hcard .chip.ok{background:var(--goodbg);color:var(--good)}
.hcard .chip.warn{background:var(--badbg);color:var(--bad)}
.hcard[disabled]{opacity:.55}
details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.th .hd{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:6px}
.th ol{list-style:none;margin:0;padding:0;counter-reset:n}
.th li{counter-increment:n;position:relative;padding:7px 0 7px 30px;font-size:15px;line-height:1.7;border-top:1px dashed #cfdcf0}
.th li:first-child{border-top:0}
.th li:before{content:counter(n);position:absolute;left:0;top:9px;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;text-align:center;line-height:21px}
.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.th .sub{margin:3px 0 0;color:#444;font-size:14.5px;line-height:1.7}
.sc .lay.sum{border-left:4px solid #2e7d32;background:#f1f8f1}
/* ---- 새 직독직해·해설 화면 ---- */
.sc{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden;background:var(--bg)}
.sc-h{padding:11px 14px 10px;background:#eef2f8;border-bottom:1px solid var(--line)}
.sc-h .no2{display:inline-block;min-width:26px;height:26px;line-height:26px;border-radius:13px;background:var(--accent);color:#fff;font-weight:800;font-size:13px;text-align:center;padding:0 7px;margin-right:8px}
.sc-h .at{font-size:13px;color:var(--sub)}
.sc-h .tt{display:block;margin-top:7px;font-size:15.5px;font-weight:800;color:var(--accent);line-height:1.45}

.sc .ch{margin-bottom:6px}
.sc .ce{font-size:17px}

.nt{font-size:13.5px;line-height:1.5;background:#fbf6ee;border:1px solid #f0e2cd;border-radius:8px;padding:5px 9px;color:#4a3a22}

.sc .lay{border-radius:10px}

.sc .lb{margin-bottom:4px}
.qc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}
.qchip small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-bottom:1px}
.qchip.o{border-color:var(--good);background:var(--goodbg)}
.qchip.x{border-color:var(--bad);background:var(--badbg)}
.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.trs{list-style:none;margin:0;padding:0;background:var(--soft);border-radius:10px;padding:8px 12px}

.wds{display:flex;flex-wrap:wrap;gap:6px}

.wds b{margin-right:5px}
.toq{display:block;width:100%;margin-top:14px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}
details.sub2{margin:12px 0 0}
details.sub2>summary{list-style:none;cursor:pointer;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px;padding:6px 0}

.cr{color:#A3102E;font-weight:700}
.sc .lay.core{border-left:4px solid #2e7d32;background:#f1f8f1}

.rst{margin-top:8px;background:#fff8e1;border:1px solid #efe3b8;border-left:4px solid #d9a21b;border-radius:8px;padding:8px 10px;font-size:15px;line-height:1.7;word-break:keep-all}

function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}

을 축하하려고</span><span class=\"why\">[지문에 없음] 3번의 상(awards)은 새 코치가 예전에 받은 것이에요. 학교 수영부가 입상했다는 말은 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">수영의 건강상 이점을 홍보하려고</span><span class=\"why\">[범위 좁음] 6번의 health benefits(건강상의 이점)는 새 코치가 바라는 점을 소개하는 한 부분이에요. 편지 전체가 수영을 홍보하는 글은 아니에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Dear Parents,</div><div class=\"k\">학부모님들께,</div></div><div class=\"rnat\">학부모님들께,</div><div class=\"rst\">학교에서 집으로 온 가정통신문을 떠올려 봐요. 지문도 “학부모님들께”로 시작하는 교장 선생님의 편지예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">As you know,</div><div class=\"k\">아시는 바와 같이,</div></div><div class=\"rc\"><div class=\"e\">Sandy Brown, our after-school swimming coach for six years,</div><div class=\"k\">6년간 저희 방과 후 (학교) 수영 코치였던 Sandy Brown이,</div></div><div class=\"rc\"><div class=\"e\">retired from coaching last month.</div><div class=\"k\">지난달 코치직에서 은퇴했습니다.</div></div><div class=\"rnat\">아시는 바와 같이, 6년간 저희 방과 후 (학교) 수영 코치였던 Sandy Brown이 지난달 코치직에서 은퇴했습니다.</div><div class=\"rst\">“6년 동안 수영을 가르치던 쌤이 지난달 그만두셨어요.” 지문 2번도 코치 샌디 브라운(Sandy Brown)이 <b>은퇴했다</b>는 배경 소식이에요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">So</span>, Virginia Smith,</div><div class=\"k\"><span class=\"cw\">그래서</span> Virginia Smith가,</div></div><div class=\"rc\"><div class=\"e\">who swam for Bredard Community College</div><div class=\"k\">Bredard Community College에서 수영 (선수 생활)을 하며</div></div><div class=\"rc\"><div class=\"e\">and has won several awards in national competitions,</div><div class=\"k\">전국 대회에서 여러 가지 상을 받았던,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">has been named the school’s new swimming coach</span>.</div><div class=\"k\"><span class=\"cw\">학교의 새 수영 코치로 임명되었습니다</span>.</div></div><div class=\"rnat\">그래서 Bredard Community College에서 수영 (선수 생활)을 하며 전국 대회에서 여러 가지 상을 받았던 Virginia Smith가 학교의 새 수영 코치로 임명되었습니다.</div><div class=\"rst\"><b>그래서</b>(So) “새 수영 쌤이 오세요!”가 통신문의 진짜 용건이에요. 지문 3번, 대회 수상 경력의 버지니아 스미스(Virginia Smith)가 <b>새 코치로 임명</b>됐어요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">This is her first job as a coach,</div><div class=\"k\">이번이 코치로서 그녀의 첫 직장이고,</div></div><div class=\"rc\"><div class=\"e\">and she is going to start working from next week.</div><div class=\"k\">그녀는 다음 주부터 근무하기 시작할 예정입니다.</div></div><div class=\"rnat\">이번이 코치로서 그녀의 첫 직장이고, 그녀는 다음 주부터 근무하기 시작할 예정입니다.</div><div class=\"rst\">“코치로는 처음이고, 다음 주부터 오세요.” 지문 4번도 새 코치의 첫 직장과 시작 날짜를 알려 줘요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">She will teach her class in the afternoons,</div><div class=\"k\">그녀는 오후에 그녀의 강좌를 가르칠 예정이며,</div></div><div class=\"rc\"><div class=\"e\">and continue with our summer program.</div><div class=\"k\">저희 여름 프로그램도 계속할 예정입니다.</div></div><div class=\"rnat\">그녀는 오후에 그녀의 강좌를 가르칠 예정이며, 여름 프로그램도 계속할 예정입니다.</div><div class=\"rst\">“오후 수업도, 여름 수영 교실도 이 쌤이 맡아요.” 지문 5번처럼 새 코치가 할 일을 소개해요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">By promoting the health benefits of swimming,</div><div class=\"k\">수영의 건강상의 이점들을 증진시킴으로써,</div></div><div class=\"rc\"><div class=\"e\">she hopes that more students will get healthy</div><div class=\"k\">그녀는 더 많은 학생들이 건강해지기를 기대하고 있습니다</div></div><div class=\"rc\"><div class=\"e\">through her instruction.</div><div class=\"k\">그녀의 지도를 통해.</div></div><div class=\"rnat\">그녀는 수영의 건강상의 이점들을 증진시킴으로써 더 많은 학생들이 그녀의 지도를 통해 건강해지기를 기대하고 있습니다.</div><div class=\"rst\">“수영으로 학생들이 더 건강해지길 바라신대요.” 지문 6번도 새 코치의 바람을 덧붙이며 소개를 마무리해요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Sincerely, Fred Wilson</div><div class=\"k\">진심을 담아, Fred Wilson (드림)</div></div><div class=\"rnat\">진심을 담아, Fred Wilson (드림)</div><div class=\"rst\">통신문 끝에 보내는 사람 이름이 있듯, 지문도 프레드 윌슨(Fred Wilson)의 이름으로 끝나요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">Principal, Riverband High School</div><div class=\"k\">Riverband 고등학교 교장</div></div><div class=\"rnat\">Riverband 고등학교 교장</div><div class=\"rst\">이름 밑에 직책도 적혀 있어요. 지문의 보낸 사람은 리버밴드(Riverband) 고등학교 교장 선생님이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"after-school\" data-m=\"방과 후의\"><b>after-school</b>방과 후의</button><button type=\"button\" class=\"wdb\" data-w=\"retire\" data-m=\"은퇴하다\"><b>retire</b>은퇴하다</button><button type=\"button\" class=\"wdb\" data-w=\"award\" data-m=\"상\"><b>award</b>상</button><button type=\"button\" class=\"wdb\" data-w=\"national competition\" data-m=\"전국 대회\"><b>national competition</b>전국 대회</button><button type=\"button\" class=\"wdb\" data-w=\"health benefit\" data-m=\"건강상의 이점\"><b>health benefit</b>건강상의 이점</button><button type=\"button\" class=\"wdb\" data-w=\"instruction\" data-m=\"지도, 교육\"><b>instruction</b>지도, 교육</button></div>", "02": "<p class=\"mtr\">마더텅 정답률 <b>85%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">불일치 문제는 선택지를 <b>지문 순서대로</b> 하나씩 대조하세요. 연도가 두 개 나오는 문장은 <b>각 숫자가 무슨 일의 연도인지</b> 꼭 짝지어 보세요.</p><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>① ↔ 1번</em>a German flutist and composer(독일의 플루트 연주자이자 작곡가) → 같음</span><span><em>② ↔ 2번</em>orphaned(고아가 된) 후 롬베르크(Romberg)가 took care of him(그를 돌보았다) → 같음</span><span><em>③ ↔ 3번</em>15세에(At the age of 15) played in a military band(군악대에서 연주했다) → 같음</span><span><em>⑤ ↔ 6번</em>with his son(아들과 함께) in the major cities of Europe(유럽의 주요 도시들에서) → 같음</span></div><div class=\"ck-eq\">⇒ 네 개는 지문과 그대로 같아요. 남은 ④를 5번과 대조해요</div></div><div class=\"ck-via\"><i>▼</i><span>④의 ‘일원이 되었다’를 5번에서 찾아요</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 문장 앞부분 · 일원이 된 해</span><div class=\"en\"><mark>In 1794</mark>, he became a member of the “Chamber Orchestra of Oldenburg,”</div><p class=\"ko\"><mark>1794년에</mark>, 그는 ‘Chamber Orchestra of Oldenburg’의 일원이 되었고,</p></div><div class=\"ck-via\"><i>▼</i><span>1811년은 일원이 된 해가 아니라 오케스트라가 없어진 해예요</span></div><div class=\"ck-step\"><span class=\"lab\">5번 문장 뒷부분 · 1811년은 무슨 해?</span><div class=\"en\">… until the orchestra <mark>was abolished in 1811</mark>.</div><p class=\"ko\">… 그 오케스트라가 <mark>1811년에 폐지될</mark> 때까지.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">1811년에 Chamber Orchestra of Oldenburg의 일원이 되었다.<small>5번: 일원이 된 건 1794년, 1811년은 악단이 폐지된 해예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">고아가 된 후 Anton Romberg의 보살핌을 받았다.</span><span class=\"why\">2번 뒤쪽 but(하지만) 플루트에 더 관심이 있었다는 말 때문에 틀린 줄 알기 쉬워요. 그래도 롬베르크(Romberg)가 took care of him(그를 돌보았다)은 그대로라서 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">독일의 플루트 연주자이자 작곡가였다.</span><span class=\"why\">1번 a German flutist and composer(독일의 플루트 연주자이자 작곡가)와 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">15세에 군악대에서 연주했다.</span><span class=\"why\">3번 15세에(At the age of 15) … played in a military band(군악대에서 연주했다)와 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">아들과 함께 유럽의 주요 도시에서 공연했다.</span><span class=\"why\">6번 performing together with his son(아들과 함께 공연하면서) in the major cities of Europe(유럽의 주요 도시들에서)과 같아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Kaspar Fürstenau was</div><div class=\"k\">Kaspar Fürstenau는 ~였다</div></div><div class=\"rc\"><div class=\"e\">a German flutist and composer.</div><div class=\"k\">독일의 플루트 연주자이자 작곡가.</div></div><div class=\"rnat\">Kaspar Fürstenau는 독일의 플루트 연주자이자 작곡가였다.</div><div class=\"rst\">음악 시간에 음악가 소개 카드를 만든다고 해 봐요. 첫 칸: 독일의 플루트 연주자이자 작곡가. 지문 1번 = 선택지 ①이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">After he was orphaned,</div><div class=\"k\">그가 고아가 된 후에,</div></div><div class=\"rc\"><div class=\"e\">Anton Romberg took care of him</div><div class=\"k\">Anton Romberg가 그를 돌보았고</div></div><div class=\"rc\"><div class=\"e\">and taught him to play the bassoon,</div><div class=\"k\">그에게 바순을 연주하는 것을 가르쳤지만,</div></div><div class=\"rc\"><div class=\"e\">but Fürstenau was more interested in the flute.</div><div class=\"k\">Fürstenau는 플루트에 더 관심이 있었다.</div></div><div class=\"rnat\">그가 고아가 된 후에, Anton Romberg가 그를 돌보았고 그에게 바순을 연주하는 것을 가르쳤지만, Fürstenau는 플루트에 더 관심이 있었다.</div><div class=\"rst\">둘째 칸: 부모님을 잃고 롬베르크(Romberg)가 돌봐 줌. 바순을 배웠지만 플루트가 더 좋았음. 지문 2번 = 선택지 ②예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">At the age of 15,</div><div class=\"k\">15세에,</div></div><div class=\"rc\"><div class=\"e\">he was already a skilled flutist</div><div class=\"k\">그는 이미 능숙한 플루트 연주자였고</div></div><div class=\"rc\"><div class=\"e\">and played in a military band.</div><div class=\"k\">군악대에서 (플루트를) 연주했다.</div></div><div class=\"rnat\">15세에, 그는 이미 능숙한 플루트 연주자였고 군악대에서 (플루트를) 연주했다.</div><div class=\"rst\">셋째 칸: 중학생 나이인 15세에 이미 플루트를 잘 불어 군악대에서 연주함. 지문 3번 = 선택지 ③이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">In 1793–94,</div><div class=\"k\">1793-94년에,</div></div><div class=\"rc\"><div class=\"e\">Fürstenau made his first concert tour in Germany.</div><div class=\"k\">Fürstenau는 독일에서 그의 첫 번째 순회공연을 하였다.</div></div><div class=\"rnat\">1793-94년에, Fürstenau는 독일에서 그의 첫 번째 순회공연을 하였다.</div><div class=\"rst\">넷째 칸: 1793~94년, 독일에서 첫 순회공연. 지문 4번 순서 그대로 적어요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">In 1794</span>,</div><div class=\"k\"><span class=\"cw\">1794년에</span>,</div></div><div class=\"rc\"><div class=\"e\">he became a member of the “Chamber Orchestra of Oldenburg,”</div><div class=\"k\">그는 ‘Chamber Orchestra of Oldenburg’의 일원이 되었고,</div></div><div class=\"rc\"><div class=\"e\">where he played</div><div class=\"k\">그곳에서 그는 (플루트를) 연주했다</div></div><div class=\"rc ckc\"><div class=\"e\">until the orchestra was <span class=\"cw\">abolished in 1811</span>.</div><div class=\"k\">그 오케스트라가 <span class=\"cw\">1811년에 폐지될</span>(없어질) 때까지.</div></div><div class=\"rnat\">1794년에, 그는 'Chamber Orchestra of Oldenburg'의 일원이 되었고, 그곳에서 그는 1811년에 그 오케스트라가 폐지될(없어질) 때까지 (플루트를) 연주했다.</div><div class=\"rst\">다섯째 칸이 핵심! 오케스트라에 들어간 건 <b>1794년</b>, 1811년은 <b>오케스트라가 없어진 해</b>예요. 그래서 지문 5번과 ④가 어긋나요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Kaspar Fürstenau continued his career as a flutist</div><div class=\"k\">Kaspar Fürstenau는 플루트 연주자로서 그의 경력을 이어갔다</div></div><div class=\"rc\"><div class=\"e\">performing together with his son Anton Fürstenau</div><div class=\"k\">그의 아들 Anton Fürstenau와 함께 공연하면서</div></div><div class=\"rc\"><div class=\"e\">in the major cities of Europe.</div><div class=\"k\">유럽의 주요 도시들에서.</div></div><div class=\"rnat\">Kaspar Fürstenau는 유럽의 주요 도시들에서 그의 아들 Anton Fürstenau와 함께 공연하면서 플루트 연주자로서 그의 경력을 이어갔다.</div><div class=\"rst\">마지막 칸: 그 뒤로도 아들과 함께 유럽 큰 도시들을 돌며 공연함. 지문 6번 = 선택지 ⑤예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"flutist\" data-m=\"플루트 연주자\"><b>flutist</b>플루트 연주자</button><button type=\"button\" class=\"wdb\" data-w=\"composer\" data-m=\"작곡가\"><b>composer</b>작곡가</button><button type=\"button\" class=\"wdb\" data-w=\"orphan\" data-m=\"고아로 만들다 (be orphaned 고아가 되다)\"><b>orphan</b>고아로 만들다 (be orphaned 고아가 되다)</button><button type=\"button\" class=\"wdb\" data-w=\"skilled\" data-m=\"능숙한\"><b>skilled</b>능숙한</button><button type=\"button\" class=\"wdb\" data-w=\"military band\" data-m=\"군악대\"><b>military band</b>군악대</button><button type=\"button\" class=\"wdb\" data-w=\"abolish\" data-m=\"폐지하다\"><b>abolish</b>폐지하다</button></div>", "03": "<p class=\"mtr\">마더텅 정답률 <b>85%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">이야기형 제목은 <b>But(그러나)</b> 뒤의 <b>깨달음</b>이 결론이에요. 6번에서 꺾이고, 8~9번의 <b>No one person</b>(누구 한 사람도 ~않다)과 <b>Many people</b>(많은 사람들)을 함께 담은 제목을 고르세요.</p><div class=\"ck-step\"><span class=\"lab\">2~3번 · 처음 생각</span><div class=\"en\">“Wow, he <mark>must have been a real genius</mark> to figure out the engine, …</div><p class=\"ko\">“와, 그는 <mark>진정한 천재였나 봐요</mark> …</p></div><div class=\"ck-via\"><i>▼</i><span>타이어·바퀴를 만든 다른 사람들이 떠오르며 생각이 꺾여요</span></div><div class=\"ck-step\"><span class=\"lab\">6번 문장 · 방향 전환</span><div class=\"en\"><mark>But then he experienced a moment of realization</mark>.</div><p class=\"ko\"><mark>그러나 그때 그는 깨달음의 순간을 경험했다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>깨달음의 내용: 한 사람이 다 만든 게 아니에요</span></div><div class=\"ck-step key\"><span class=\"lab\">8번 문장 · 결정적 결론</span><div class=\"en\"><mark>No one person invented</mark> all of the components of the automobile.</div><p class=\"ko\"><mark>누구 한 사람도</mark> 자동차의 부품들을 모두 <mark>발명하지는 않았단다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>한 사람이 아니라면 누구? 많은 사람들이에요</span></div><div class=\"ck-step key\"><span class=\"lab\">9번 문장 · 결론 완성</span><div class=\"en\"><mark>Many people</mark> made significant discoveries that led to the invention of the automobile.”</div><p class=\"ko\"><mark>많은 사람들이</mark> 자동차의 발명을 이끈 중요한 발견을 해낸 거란다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">하나의 위대한 발명(One Great Invention), 많은 발명가들(Many Inventors)<small>자동차(하나의 발명)를 9번의 Many people(많은 사람들)이 함께 만들었어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">Curiosity(호기심): A Key to Success(성공의 열쇠)</span><span class=\"why\">[지문에 없음] 1번에서 아들이 질문을 하지만, 호기심이 성공을 가져온다는 말은 없어요. 결론은 8~9번의 여러 발명가 이야기예요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">The Trap of Group Thinking(집단 사고의 함정)</span><span class=\"why\">[지문에 없음] 집단 사고의 문제점은 나오지 않아요. 9번은 많은 사람들이 함께 발명을 이끌었다는 긍정적인 말이에요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">Always Think About What's Next(항상 다음을 생각하라)</span><span class=\"why\">[지문에 없음] 앞으로 무엇을 할지에 대한 말은 없어요. 지문은 과거에 자동차가 어떻게 발명됐는지를 말해요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">더 많은 성공(More Successes), 더 많은 좋은 생각(More Good Ideas)</span><span class=\"why\">[지문에 없음] 9번은 많은 발견이 하나의 발명으로 이어졌다는 말이지, 성공을 많이 할수록 생각이 늘어난다는 말이 아니에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Consider an innocent question</div><div class=\"k\">순진한 질문을 고려해 보자</div></div><div class=\"rc\"><div class=\"e\">asked years ago by a son to his father:</div><div class=\"k\">몇 년 전 한 아들이 그의 아빠에게 물어본:</div></div><div class=\"rc\"><div class=\"e\">“Who invented the automobile?”</div><div class=\"k\">“누가 자동차를 발명했어요?”</div></div><div class=\"rnat\">몇 년 전 한 아들이 그의 아빠에게 물어본 순진한 질문을 고려해 보자. \"누가 자동차를 발명했어요?\"</div><div class=\"rst\">조별 과제로 만든 로봇을 본 다른 반 친구가 물어요. “이거 누가 만들었어?” 지문 1번도 아들이 “누가 자동차를 발명했어요?” 하고 묻는 장면이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Trying to be instructive,</div><div class=\"k\">교육적이기 위해,</div></div><div class=\"rc\"><div class=\"e\">the father told his son</div><div class=\"k\">아빠는 그의 아들에게 말했다</div></div><div class=\"rc\"><div class=\"e\">that in about 1886 Karl Benz invented the automobile.</div><div class=\"k\">약 1886년에 Karl Benz(카를 벤츠, 독일의 기계공학자)가 자동차를 발명했다고.</div></div><div class=\"rnat\">교육적이기 위해, 아빠는 그의 아들에게 약 1886년에 Karl Benz(카를 벤츠, 독일의 기계공학자)가 자동차를 발명했다고 말했다.</div><div class=\"rst\">나는 “조장 민수가 만들었어” 하고 한 사람 이름만 대요. 지문 2번에서 아빠가 칼 벤츠(Karl Benz) 한 사람을 답한 것과 같아요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">“Wow, he must have been a real genius</div><div class=\"k\">“와, 그는 진정한 천재였나 봐요</div></div><div class=\"rc\"><div class=\"e\">to figure out the engine, the brakes, the spark plugs, the wheels,</div><div class=\"k\">엔진, 브레이크, 점화 플러그, 바퀴를 알아내다니,</div></div><div class=\"rc\"><div class=\"e\">and how everything worked together!”</div><div class=\"k\">그리고 모든 것들이 어떻게 함께 작동하는지를!”</div></div><div class=\"rnat\">\"와, 엔진, 브레이크, 점화 플러그, 바퀴, 그리고 모든 것들이 어떻게 함께 작동하는지를 알아내다니 그는 진정한 천재였나 봐요!\"</div><div class=\"rst\">친구는 “와, 모터랑 바퀴까지 다 만들다니 민수 천재다!” 해요. 지문 3번도 엔진·브레이크·바퀴를 다 알아낸 <b>천재</b>라고 감탄해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">“Well, someone else invented the tires;</div><div class=\"k\">“음, 다른 누군가가 타이어를 발명했단다;</div></div><div class=\"rc\"><div class=\"e\">I think it was Firestone.</div><div class=\"k\">내 생각에 그것은 Firestone이야.</div></div><div class=\"rnat\">\"음, 다른 누군가가 타이어를 발명했단다. 내 생각에 그것은 Firestone(파이어스톤)이야.</div><div class=\"rst\">내가 “음, 바퀴는 지우가 만들었어” 하고 말을 고쳐요. 지문 4번도 타이어는 다른 사람인 파이어스톤(Firestone)이 만들었다고 해요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">And then there was even the person</div><div class=\"k\">그리고 그 다음에는 심지어 그 사람도 있었단다</div></div><div class=\"rc\"><div class=\"e\">who invented the wheel….”</div><div class=\"k\">바퀴를 발명한.”</div></div><div class=\"rnat\">그리고 그 다음에는 바퀴를 발명한 사람도 있었단다.\"</div><div class=\"rst\">“모터 조립은 또 다른 친구가 했고…” 하고 이름이 계속 늘어요. 지문 5번도 바퀴를 발명한 사람까지 나와요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc ckc\"><div class=\"e\">But then he experienced <span class=\"cw\">a moment of realization</span>.</div><div class=\"k\">그러나 그때 그는 <span class=\"cw\">깨달음의 순간을</span> 경험했다.</div></div><div class=\"rnat\">그러나 그때 그는 깨달음의 순간을 경험했다.</div><div class=\"rst\"><b>그러다</b>(But) 내가 퍼뜩 깨달아요. 지문 6번이 이 글의 방향이 꺾이는 <b>깨달음의 순간</b>이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">“I think I may have misled you.</div><div class=\"k\">“내가 너를 오해하게 했을지도 모르겠구나.</div></div><div class=\"rnat\">\"내가 너를 오해하게 했을지도 모르겠구나.</div><div class=\"rst\">“내가 잘못 알려 줬네.” 지문 7번도 아빠가 아들을 오해하게 했을지 모른다고 해요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">No one person invented</span></div><div class=\"k\"><span class=\"cw\">누구 한 사람도 발명하지는 않았단다</span></div></div><div class=\"rc\"><div class=\"e\">all of the components of the automobile.</div><div class=\"k\">자동차의 부품들을 모두.</div></div><div class=\"rnat\">누구 한 사람도 자동차의 부품들을 모두 발명하지는 않았단다.</div><div class=\"rst\">“로봇을 <b>혼자 다 만든 사람은 없어</b>.” 지문 8번, 자동차 부품을 한 사람이 모두 발명하지 않았다는 결론이에요.</div></div><div class=\"rds key\" data-ord=\"9\"><span class=\"rn\">9번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Many people</span> made significant discoveries</div><div class=\"k\"><span class=\"cw\">많은 사람들이</span> 중요한 발견을 해낸 거란다</div></div><div class=\"rc\"><div class=\"e\">that led to the invention of the automobile.”</div><div class=\"k\">자동차의 발명을 이끈.”</div></div><div class=\"rnat\">많은 사람들이 자동차의 발명을 이끈 중요한 발견을 해낸 거란다.\"</div><div class=\"rst\">“<b>여러 친구</b>가 조금씩 만들어 하나의 로봇이 된 거야.” 지문 9번처럼 많은 사람들이 하나의 발명을 이끌었으니 제목은 ⑤예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"innocent\" data-m=\"순진한\"><b>innocent</b>순진한</button><button type=\"button\" class=\"wdb\" data-w=\"instructive\" data-m=\"교육적인\"><b>instructive</b>교육적인</button><button type=\"button\" class=\"wdb\" data-w=\"figure out\" data-m=\"알아내다\"><b>figure out</b>알아내다</button><button type=\"button\" class=\"wdb\" data-w=\"realization\" data-m=\"깨달음\"><b>realization</b>깨달음</button><button type=\"button\" class=\"wdb\" data-w=\"mislead\" data-m=\"오해하게 하다\"><b>mislead</b>오해하게 하다</button><button type=\"button\" class=\"wdb\" data-w=\"component\" data-m=\"부품, 요소\"><b>component</b>부품, 요소</button><button type=\"button\" class=\"wdb\" data-w=\"significant\" data-m=\"중요한\"><b>significant</b>중요한</button></div>", "04": "<p class=\"mtr\">마더텅 정답률 <b>70%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">주제는 <b>In contrast(그에 반해서)</b>로 두 방법을 비교한 뒤, <b>The study indicates</b>(이 연구는 보여 준다)로 나오는 결과 문장에 있어요. 1~2번의 <b>story</b>(이야기)와 7번 결과를 묶으세요.</p><div class=\"ck-step\"><span class=\"lab\">2번 문장 · 화제 제시</span><div class=\"en\">Students remember historical facts when they are <mark>tied to a story</mark>.</div><p class=\"ko\">학생들은 역사적인 사실이 <mark>이야기와 연결되어 있을 때</mark> 그것들을 기억한다.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>4~5번</em>스토리텔러가 극적으로 들려주기 → 토의 → 더 읽기</span><span><em>6번</em>In contrast(그에 반해서) 다른 반은 전통적인 조사/보고 방식</span></div><div class=\"ck-eq\">⇒ 역사 수업을 두 방식으로 나누어 비교하는 실험이에요</div></div><div class=\"ck-via\"><i>▼</i><span>비교 실험의 결과: 이야기 방식이 이겼어요</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 문장 · 결정적 결론</span><div class=\"en\">The study indicates that <mark>the material presented by the storytellers</mark> has <mark>much more interest and personal impact</mark> than that gained via the traditional method.</div><p class=\"ko\">이 연구는 <mark>스토리텔러들에 의해 제시된 자료가</mark> 전통적인 방법을 통해 얻어진 것(= 자료)보다 <mark>훨씬 더 많은 흥미와 개인적인 영향을 가진다는 것을</mark> 보여 준다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">benefits of storytelling in teaching history 역사를 가르칠 때 스토리텔링의 이점<small>7번의 much more interest(훨씬 더 많은 흥미) = 이점(benefits)이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">advantages of traditional teaching methods(전통적인 교수법의 장점)</span><span class=\"why\">[반대] 6번의 traditional(전통적인) 단어만 따온 함정이에요. 7번에서 이기는 쪽은 스토리텔러 방식이고, 전통 방식은 비교에서 진 쪽이에요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">why students should learn history(학생들이 역사를 배워야 하는 이유)</span><span class=\"why\">[범위 넓음] 지문은 역사를 배워야 하는 이유가 아니라 역사를 “어떻게” 가르치면 좋은지를 말해요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">essential elements of historical dramas(역사극의 필수 요소)</span><span class=\"why\">[지문에 없음] 4번 dramatic context(극적인 맥락)는 수업 방식일 뿐, 역사극에 꼭 필요한 요소를 설명한 문장은 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">importance of having balanced views on history(역사에 대해 균형 잡힌 관점을 갖는 것의 중요성)</span><span class=\"why\">[지문에 없음] 관점이 한쪽으로 치우쳤다는 말은 없어요. 7번은 흥미와 개인적인 영향을 비교할 뿐이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Storyteller Syd Lieberman suggests</div><div class=\"k\">스토리텔러 Syd Lieberman은 말한다</div></div><div class=\"rc\"><div class=\"e\">that it is the story in history</div><div class=\"k\">역사 속 이야기라고</div></div><div class=\"rc\"><div class=\"e\">that provides the nail to hang facts on.</div><div class=\"k\">사실을 걸어두기 위한 못을 제공하는 것은.</div></div><div class=\"rnat\">스토리텔러 Syd Lieberman은 사실을 걸어두기 위한 못을 제공하는 것(사실을 기억하도록 고정시키는 역할을 하는 것)은 역사 속 이야기라고 말한다.</div><div class=\"rst\">역사 시간에 연도만 외우면 금방 까먹지만, 이야기는 잘 남아요. = 지문 1번, <b>이야기</b>가 사실을 걸어 두는 못이 된다는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Students remember historical facts</div><div class=\"k\">학생들은 역사적인 사실을 기억한다</div></div><div class=\"rc ckc\"><div class=\"e\">when they are <span class=\"cw\">tied to a story</span>.</div><div class=\"k\">그것들이 <span class=\"cw\">이야기와 연결되어 있을 때</span>.</div></div><div class=\"rnat\">학생들은 역사적인 사실이 이야기와 연결되어 있을 때 그것을 기억한다.</div><div class=\"rst\">세종대왕 이야기를 들으면 그때 있었던 일도 같이 기억나요. 지문 2번처럼 사실이 <b>이야기와 연결</b>되면 기억해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">According to a report,</div><div class=\"k\">한 보고서에 따르면,</div></div><div class=\"rc\"><div class=\"e\">a high school in Boulder, Colorado,</div><div class=\"k\">콜로라도주의 Boulder에 있는 한 고등학교는</div></div><div class=\"rc\"><div class=\"e\">is currently experimenting with a study of presentation of historical material.</div><div class=\"k\">현재 역사적 자료 제시에 관한 연구를 실험하고 있다.</div></div><div class=\"rnat\">한 보고서에 따르면, 콜로라도주의 Boulder에 있는 한 고등학교는 현재 역사적 자료 제시에 관한 연구를 실험하고 있다.</div><div class=\"rst\">그래서 한 고등학교가 역사 수업을 두 반으로 나눠 실험을 해 봤어요. = 지문 3번, 역사 자료를 보여 주는 방법을 연구하는 학교예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Storytellers present material in dramatic context to the students,</div><div class=\"k\">스토리텔러들은 학생들에게 극적인 맥락에서 자료를 제시하고,</div></div><div class=\"rc\"><div class=\"e\">and group discussion follows.</div><div class=\"k\">집단 토의가 뒤를 잇는다.</div></div><div class=\"rnat\">스토리텔러들은 학생들에게 극적인 맥락에서 자료를 제시하고 집단 토의가 뒤를 잇는다.</div><div class=\"rst\">1반은 이야기꾼 쌤이 드라마처럼 들려주고 그다음 다 같이 토론해요. 지문 4번의 스토리텔러 방식이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Students are encouraged to read further.</div><div class=\"k\">학생들은 (자료를) 더 많이 읽도록 장려된다.</div></div><div class=\"rnat\">학생들은 (자료를) 더 많이 읽도록 장려된다.</div><div class=\"rst\">1반 학생들은 끝나고 관련 책을 더 찾아 읽어요. 지문 5번도 학생들이 더 읽도록 장려된다고 해요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">In contrast</span>,</div><div class=\"k\"><span class=\"cw\">그에 반해서</span>,</div></div><div class=\"rc\"><div class=\"e\">another group of students is involved</div><div class=\"k\">다른 집단의 학생들은 참여한다</div></div><div class=\"rc\"><div class=\"e\">in traditional research/report techniques.</div><div class=\"k\">전통적인 조사/보고 기법에.</div></div><div class=\"rnat\">그에 반해서, 다른 집단의 학생들은 전통적인 조사/보고 기법에 참여한다.</div><div class=\"rst\"><b>그에 반해서</b>(In contrast) 2반은 교과서로 조사해 보고서를 써요. 지문 6번의 전통적인 방법이에요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">The study indicates that</div><div class=\"k\">이 연구는 ~을 보여 준다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">the material presented by the storytellers</span></div><div class=\"k\"><span class=\"cw\">스토리텔러들에 의해 제시된 자료가</span></div></div><div class=\"rc ckc\"><div class=\"e\">has <span class=\"cw\">much more interest and personal impact</span></div><div class=\"k\"><span class=\"cw\">훨씬 더 많은 흥미와 개인적인 영향을 가진다는 것을</span></div></div><div class=\"rc\"><div class=\"e\">than that gained via the traditional method.</div><div class=\"k\">전통적인 방법을 통해 얻어진 것(= 자료)보다.</div></div><div class=\"rnat\">이 연구는 스토리텔러들에 의해 제시된 자료가 전통적인 방법을 통해 얻어진 것(자료)보다 훨씬 더 많은 흥미와 개인적인 영향을 가진다는 것을 보여 준다.</div><div class=\"rst\">결과는 1반이 <b>훨씬 더 재미있고 마음에 남았어요</b>. 지문 7번이 결론이라서, 주제는 역사 수업에서 스토리텔링의 이점이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"tied to\" data-m=\"~와 연결된 (tie A to B: A를 B와 연결하다)\"><b>tied to</b>~와 연결된 (tie A to B: A를 B와 연결하다)</button><button type=\"button\" class=\"wdb\" data-w=\"presentation\" data-m=\"제시, 발표\"><b>presentation</b>제시, 발표</button><button type=\"button\" class=\"wdb\" data-w=\"dramatic context\" data-m=\"극적인 맥락\"><b>dramatic context</b>극적인 맥락</button><button type=\"button\" class=\"wdb\" data-w=\"encourage\" data-m=\"장려하다\"><b>encourage</b>장려하다</button><button type=\"button\" class=\"wdb\" data-w=\"in contrast\" data-m=\"그에 반해서, 대조적으로\"><b>in contrast</b>그에 반해서, 대조적으로</button><button type=\"button\" class=\"wdb\" data-w=\"indicate\" data-m=\"보여 주다, 나타내다\"><b>indicate</b>보여 주다, 나타내다</button><button type=\"button\" class=\"wdb\" data-w=\"personal impact\" data-m=\"개인적인 영향\"><b>personal impact</b>개인적인 영향</button></div>", "05": "<p class=\"mtr\">마더텅 정답률 <b>60%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">밑줄이 <b>주어 바로 뒤</b>에 있으면 먼저 <b>문장의 동사가 있는지</b>부터 보세요. 동사가 하나도 없는데 -ing(분사)만 있으면 문장이 끝나지 않아요.</p><div class=\"ck-step\"><span class=\"lab\">문제지 ④번 자리 (6번)</span><div class=\"en\">People in today’s fast-paced society <u>④ engaging</u> in this either for necessity or for entertainment.</div><p class=\"ko\">오늘날의 빠르게 진행되는 사회 속의 사람들은 이것에 ( ? ) 필요에 의해서든 즐거움을 위해서든 — 문장 전체에 동사가 없어요</p></div><div class=\"ck-via\"><i>▼</i><span>in today’s fast-paced society(오늘날의 빠르게 진행되는 사회 속의)는 People(사람들)을 꾸미는 말이에요</span></div><div class=\"ck-step\"><span class=\"lab\">6번 문장 · 주어 찾기</span><div class=\"en\"><mark>People in today’s fast-paced society</mark></div><p class=\"ko\"><mark>오늘날의 빠르게 진행되는 사회 속의 사람들은</mark></p></div><div class=\"ck-via\"><i>▼</i><span>주어 뒤에 동사 자리가 비었어요 → -ing(분사)가 아니라 동사 engage(참여하다)</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 결정적 단서</span><div class=\"en\">… <mark>engage in this</mark> either for necessity or for entertainment.</div><p class=\"ko\">필요에 의해서든 즐거움을 위해서든 <mark>이것에 참여하고 있다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">문장의 동사 자리: 동사 ↔ -ing(분사)</p><p class=\"gr\">영어 문장에는 주어 뒤에 꼭 동사가 하나 있어야 해요. -ing(~하는/~하면서)는 혼자서 동사 노릇을 못 하니, 동사가 없는 자리에는 진짜 동사를 써야 해요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>Students in my class play soccer after school.</div><div class=\"ko\">우리 반 학생들은 방과 후에 축구를 한다. (주어 뒤에 동사 play 하다가 있어서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>Students in my class playing soccer after school.</div><div class=\"ko\">playing(축구하는)만 있고 진짜 동사가 없어서 문장이 끝나지 않아 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>Students playing soccer are my friends.</div><div class=\"ko\">축구하는 학생들은 내 친구들이다. (playing은 꾸미는 말이고 동사 are ~이다가 따로 있어서 맞아요)</div></div><p class=\"gb\">지문 6번도 주어 People in today’s fast-paced society(오늘날의 빠르게 진행되는 사회 속의 사람들) 뒤에 다른 동사가 없어요. 그래서 engaging(참여하는)이 아니라 동사 engage(참여하다)여야 해요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">engaging → engage (참여하다)<small>주어 People(사람들) 뒤에 동사가 없으니 -ing(분사)가 아닌 동사 engage(참여하다)가 와야 해요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">were ~였다</span><span class=\"why\">4번 주어는 Most of the foods foraged before(예전에 찾아다닌 대부분의 식량들)예요. foraged before(예전에 찾아다닌)가 끼어 있어 헷갈리지만, Most of(~의 대부분) 뒤 foods(식량들)가 복수라서 복수 동사 were(~였다)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">Most of(~의 대부분) + 명사: 동사의 수는 of(~의) 뒤 명사에 맞춰요</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>Most of the cookies were eaten.</div><div class=\"ko\">쿠키 대부분이 먹혔다. (cookies 쿠키들 = 복수라서 were가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>Most of the cookies was eaten.</div><div class=\"ko\">of 뒤 cookies(쿠키들)가 복수인데 단수 was를 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>Most of the cake was eaten.</div><div class=\"ko\">케이크 대부분이 먹혔다. (cake 케이크 = 한 덩어리라서 was가 맞아요)</div></div><p class=\"gb\">지문 4번도 Most of(~의 대부분) 뒤 foods(식량들)가 복수라서 were(~였다)가 그대로 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">that ~하는</span><span class=\"why\">2번은 This is a method(이것은 방법이다) 바로 뒤예요. ① 다음에 주어 없이 동사 has been used(사용되어 왔다)가 오니, a method(방법)를 꾸미는 주격 관계대명사 that(~하는)이 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">주격 관계대명사 that(~하는): 명사 + that(~하는) + 동사</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I have a bike that runs fast.</div><div class=\"ko\">나는 빨리 달리는 자전거가 있다. (that 뒤에 바로 동사 runs 달린다가 와서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I have a bike what runs fast.</div><div class=\"ko\">앞에 꾸밀 명사 bike(자전거)가 있는데 what(~하는 것)을 써서 틀려요.</div></div><p class=\"gb\">지문 2번도 a method(방법) 뒤에 동사 has been used(사용되어 왔다)가 바로 오니 that(~하는)이 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">be found 발견되다</span><span class=\"why\">3번은 where food could possibly(식량이 아마 ~할 수 있는 곳) 뒤예요. 조동사 could(~할 수 있다) 뒤라 동사원형 be(~이다)가 오고, 식량은 스스로 찾는 게 아니라 '발견되는' 쪽이라 수동 be found(발견되다)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">조동사(could ~할 수 있다) + be(~되다) + p.p.(과거분사): 수동태</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>The key could be found under the bed.</div><div class=\"ko\">열쇠는 침대 밑에서 발견될 수 있었다. (열쇠는 '발견되는' 쪽이라 be found가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>The key could find under the bed.</div><div class=\"ko\">열쇠가 스스로 무언가를 찾는 게 아닌데 능동 find(찾다)를 써서 틀려요.</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>The key could is found under the bed.</div><div class=\"ko\">could(~할 수 있다) 뒤에는 동사원형이 와야 하는데 is를 써서 틀려요.</div></div><p class=\"gb\">지문 3번도 food(식량)가 '발견되는' 쪽이고 could(~할 수 있다) 뒤라서 be found(발견되다)가 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">beneficial 유익한</span><span class=\"why\">8번은 find it(그것이 ~라고 생각한다) 뒤 보어 자리예요. quite a fulfilling task(꽤 성취감을 주는 일)와 and(그리고)로 나란히 이어져 it(그것)이 '어떻다고' 말해 주니 형용사 beneficial(유익한)이 맞아요. 부사 beneficially(유익하게)는 못 와요.</span><div class=\"gm wx\"><p class=\"gt\">find(~라고 생각하다) + 목적어 + 형용사(목적격 보어)</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I find the book interesting.</div><div class=\"ko\">나는 그 책이 재미있다고 생각한다. (interesting 재미있는 = 형용사가 책의 상태를 말해서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I find the book interestingly.</div><div class=\"ko\">interestingly(재미있게)는 부사라 '책이 어떻다'를 말할 수 없어서 틀려요.</div></div><p class=\"gb\">지문 8번도 find it(그것이 ~라고 생각한다) 뒤에서 it(그것)이 '유익하다'고 말하니 형용사 beneficial(유익한)이 맞아요.</p></div></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Foraging is a means</div><div class=\"k\">식량을 찾아다니는 것은 수단이다</div></div><div class=\"rc\"><div class=\"e\">of searching for wild food resources.</div><div class=\"k\">야생의 식량 자원을 찾는.</div></div><div class=\"rnat\">식량을 찾아다니는 것은 야생의 식량 자원을 찾는 수단이다.</div><div class=\"rst\">식량을 찾아다니는 것(foraging)은 산과 들에서 먹을거리를 찾는 방법이에요. 지문 1번이 이 글의 화제를 알려 줘요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">This is a method</div><div class=\"k\">이것은 방법이다</div></div><div class=\"rc\"><div class=\"e\">① that has been used for a long time</div><div class=\"k\">[오랫동안 사용되어 온](= a method)</div></div><div class=\"rc\"><div class=\"e\">and is possibly the longest method of food searching,</div><div class=\"k\">그리고 아마도 가장 오래된 식량 탐색 방법일 것이다,</div></div><div class=\"rc\"><div class=\"e\">tracing back to thousands of years ago.</div><div class=\"k\">수천 년 전으로 거슬러 올라가는.</div></div><div class=\"rnat\">이것은 오랫동안 사용되어 온 방법이고 수천 년 전으로 거슬러 올라가는, 아마도 가장 오래된 식량 탐색 방법일 것이다.</div><div class=\"rst\">이건 아주 오래전부터 써 온 방법이에요. 앞의 a method(방법)를 꾸미는 말이라 <b>that</b>(~하는) + 동사가 와요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">In the past,</div><div class=\"k\">과거에는,</div></div><div class=\"rc\"><div class=\"e\">people commonly foraged for food</div><div class=\"k\">사람들이 보통 식량을 찾아다녔다</div></div><div class=\"rc\"><div class=\"e\">in forests, riversides, caves,</div><div class=\"k\">숲, 강가, 동굴,</div></div><div class=\"rc\"><div class=\"e\">and virtually any place</div><div class=\"k\">그리고 거의 모든 곳에서</div></div><div class=\"rc\"><div class=\"e\">where food could possibly ② be found.</div><div class=\"k\">[식량이 발견될 수 있는](= any place)</div></div><div class=\"rnat\">과거에는 사람들이 보통 숲, 강가, 동굴, 그리고 식량이 발견될 수 있는 거의 모든 곳에서 식량을 찾아다녔다.</div><div class=\"rst\">옛날 사람들은 숲·강가·동굴처럼 먹을 게 <b>발견될 수 있는</b> 곳이면 어디든 찾아갔어요. 식량은 '발견되는' 쪽이라 be found(발견되다)예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Most of the foods foraged before</div><div class=\"k\">예전에 찾아다닌(찾아다니며 얻은) 대부분의 식량들은</div></div><div class=\"rc\"><div class=\"e\">③ were root crops, weeds, shrubs, and many more.</div><div class=\"k\">뿌리작물, 잡초, 관목, 그리고 그 밖의 더 많은 것들이었다.</div></div><div class=\"rnat\">예전에 찾아다닌(찾아다니며 얻은) 대부분의 식량들은 뿌리작물, 잡초, 관목, 그리고 그 밖의 더 많은 것들이었다.</div><div class=\"rst\">그렇게 얻은 식량 <b>대부분은</b> 뿌리작물·잡초·관목 같은 것이었어요. foods(식량들)가 복수라 were(~였다)예요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Now, foraging has become</div><div class=\"k\">이제는 식량을 찾아다니는 것이 되었다</div></div><div class=\"rc\"><div class=\"e\">a rising trend.</div><div class=\"k\">증가하는 추세가.</div></div><div class=\"rnat\">이제는 식량을 찾아다니는 것이 증가하는 추세가 되었다.</div><div class=\"rst\">그런데 이제는 이렇게 먹을거리를 찾아다니는 게 점점 유행이 되고 있어요. = 지문 5번의 증가하는 추세(a rising trend)예요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">People in today’s fast-paced society</span></div><div class=\"k\"><span class=\"cw\">오늘날의 빠르게 진행되는 사회 속의 사람들은</span></div></div><div class=\"rc ckc\"><div class=\"e\">④ <span class=\"cw\">engage in this</span></div><div class=\"k\"><span class=\"cw\">이것에 참여하고 있다</span> ※ 문제지엔 engaging으로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">either for necessity or for entertainment.</div><div class=\"k\">필요에 의해서든 즐거움을 위해서든.</div></div><div class=\"rnat\">오늘날의 빠르게 진행되는 사회 속의 사람들은 필요에 의해서든 즐거움을 위해서든 이것에 참여하고 있다.</div><div class=\"rst\">바쁜 요즘 사람들도 필요해서든 재미로든 <b>이걸 해요</b>. 주어 People(사람들) 뒤에 동사가 없으니 engage(참여하다)여야 해요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Whatever purpose it may be,</div><div class=\"k\">그것이 어떤 목적이든,</div></div><div class=\"rc\"><div class=\"e\">people are now slowly but surely</div><div class=\"k\">사람들은 이제 느리지만 확실하게</div></div><div class=\"rc\"><div class=\"e\">getting acquainted with foraging.</div><div class=\"k\">식량을 찾아다니는 것에 친숙해지고 있다.</div></div><div class=\"rnat\">그것이 어떤 목적이든, 사람들은 이제 식량을 찾아다니는 것에 느리지만 확실하게 친숙해지고 있다.</div><div class=\"rst\">목적이 뭐든, 사람들은 천천히 하지만 확실히 이 활동에 익숙해지고 있어요. = 지문 7번, 식량 찾기에 친숙해진다는 말이에요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">More and more people find it</div><div class=\"k\">점점 더 많은 사람들이 그것이 ~라고 생각한다</div></div><div class=\"rc\"><div class=\"e\">quite a fulfilling task</div><div class=\"k\">꽤 성취감을 주는 일이고</div></div><div class=\"rc\"><div class=\"e\">and very ⑤ beneficial.</div><div class=\"k\">매우 유익한 것</div></div><div class=\"rnat\">점점 더 많은 사람들이 그것이 꽤 성취감을 주는 일이고 매우 유익한 것이라고 생각한다.</div><div class=\"rst\">점점 더 많은 사람들이 이 일을 뿌듯하고 <b>유익하다</b>고 생각해요. find it(그것이 ~라고 생각한다) 뒤라 형용사 beneficial(유익한)이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"means\" data-m=\"수단\"><b>means</b>수단</button><button type=\"button\" class=\"wdb\" data-w=\"trace back to\" data-m=\"~까지 거슬러 올라가다\"><b>trace back to</b>~까지 거슬러 올라가다</button><button type=\"button\" class=\"wdb\" data-w=\"virtually\" data-m=\"거의, 사실상\"><b>virtually</b>거의, 사실상</button><button type=\"button\" class=\"wdb\" data-w=\"fast-paced\" data-m=\"빠르게 돌아가는\"><b>fast-paced</b>빠르게 돌아가는</button><button type=\"button\" class=\"wdb\" data-w=\"engage in\" data-m=\"~에 참여하다\"><b>engage in</b>~에 참여하다</button><button type=\"button\" class=\"wdb\" data-w=\"get acquainted with\" data-m=\"~에 친숙해지다\"><b>get acquainted with</b>~에 친숙해지다</button><button type=\"button\" class=\"wdb\" data-w=\"beneficial\" data-m=\"유익한\"><b>beneficial</b>유익한</button></div>", "06": "<p class=\"mtr\">마더텅 정답률 <b>45%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">글 전체 방향은 <b>정직은 좋고, 거짓말은 나쁘다</b>예요. 7·9번에서 거짓말은 <b>곤경</b>과 <b>해악</b>이라고 했으니, 거짓말이 사람들을 ‘위로한다’는 낱말은 방향이 거꾸로예요.</p><div class=\"ck-step\"><span class=\"lab\">7번 · 거짓말의 결과</span><div class=\"en\">People who lie <mark>get into trouble</mark> when someone threatens to … uncover their lie.</div><p class=\"ko\">누군가가 그들의 거짓말을 폭로하겠다고 위협할 때, 거짓말을 하는 사람은 <mark>곤경에 처하게 된다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>거짓말은 관계를 망치는 독이라고 한 번 더 못 박아요</span></div><div class=\"ck-step\"><span class=\"lab\">9번 · 거짓말 = 해악</span><div class=\"en\">Your relationships will also be free from <mark>the poison of lies and secrets</mark>.</div><p class=\"ko\">여러분의 관계에는 또한 <mark>거짓과 비밀이라는 해악이</mark> 없을 것이다.</p></div><div class=\"ck-via\"><i>▼</i><span>진실이 아파도 정직하라 → 그럼 선의의 거짓말은 더 아프게 한다는 흐름</span></div><div class=\"ck-step key\"><span class=\"lab\">10번 · 결정적 단서</span><div class=\"en\">Don’t be afraid to be honest with your friends, <mark>no matter how painful the truth is</mark>.</div><p class=\"ko\">친구들에게 정직하게 대하는 것을 두려워하지 말라, <mark>진실이 아무리 고통스럽더라도</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>선의의 거짓말이 진실보다 훨씬 더 위로가 된다? 방향이 거꾸로예요</span></div><div class=\"ck-step\"><span class=\"lab\">문제지 ⑤번 자리 (11번)</span><div class=\"en\">In the long term, lies with good intentions <u>⑤ comfort</u> people much more than telling the truth.</div><p class=\"ko\">장기적으로, 선의의 거짓말은 진실을 말하는 것보다 사람들에게 훨씬 더 ( 위안을 준다? ) → 상처를 준다가 맞아요</p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">comfort(위안을 주다) ↔ hurt(상처를 주다)</p><p class=\"gr\">앞에서 거짓말을 trouble(곤경)·poison(해악)처럼 나쁜 쪽으로 말했다면, 결론의 거짓말도 나쁜 결과인 hurt(상처를 주다)여야 해요. 원인과 결과의 방향이 같아야 해요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>Lies always make trouble, so they hurt my friends.</div><div class=\"ko\">거짓말은 늘 문제를 일으켜서 내 친구들에게 상처를 줘요. (나쁜 원인 → 나쁜 결과)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>Lies always make trouble, so they comfort my friends.</div><div class=\"ko\">거짓말이 문제를 일으키는데 친구들을 위로한다? 방향이 거꾸로라 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>Kind words comfort my sad friend.</div><div class=\"ko\">따뜻한 말은 슬픈 친구를 위로해요. (좋은 원인 → 좋은 결과)</div></div><p class=\"gb\">지문 10번에서 진실이 아파도 정직하라고 했으니, 11번의 선의의 거짓말은 comfort(위안을 주다)가 아니라 hurt(상처를 주다)여야 해요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">comfort → hurt (상처를 주다)<small>7·9번에서 거짓말은 곤경·해악이니, 선의의 거짓말도 결국 사람들에게 상처를 줘요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">uncover 폭로하다</span><span class=\"why\">거짓말이 밝혀질까 봐 곤경에 처하는 거예요. hide(숨기다)였다면 곤란할 일이 없으니, 7번의 get into trouble(곤경에 처하다)과 맞는 건 uncover(폭로하다)예요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">truthful 진실한</span><span class=\"why\">1번에서 정직(Honesty)이 관계의 기본이라고 했고, 2번은 그 정직을 being open(솔직하게 말하는 것)으로 쓰라고 해요. 같은 방향이라 truthful(진실한)이 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">develop 쌓다</span><span class=\"why\">4번 never lie(절대 거짓말하지 마라)를 따르면 항상 진실을 말한다는 평판이 생겨요. 5번 뒤쪽의 trust(신뢰)와 이어지니 develop(쌓다)이 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">avoid 피하다</span><span class=\"why\">8번은 자신에게 진실하게 사는 좋은 쪽 이야기예요. 7번의 trouble(곤경)을 겪지 않는다는 흐름이라 골칫거리를 avoid(피하다)가 맞아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Honesty is a fundamental part</div><div class=\"k\">정직은 기본적인 부분이다</div></div><div class=\"rc\"><div class=\"e\">of every strong relationship.</div><div class=\"k\">모든 굳건한 관계의.</div></div><div class=\"rnat\">정직은 모든 굳건한 관계의 기본적인 부분이다.</div><div class=\"rst\"><b>정직</b>(Honesty)은 친구 사이를 튼튼하게 하는 기본이에요. 지문 1번이 이 글의 방향을 정해 줘요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Use it to your advantage</div><div class=\"k\">그것을 여러분에게 유리하게 사용하라</div></div><div class=\"rc\"><div class=\"e\">by being open with what you feel</div><div class=\"k\">여러분(자신)이 느끼는 것에 대해 솔직하게 말하고</div></div><div class=\"rc\"><div class=\"e\">and giving a ① truthful opinion when asked.</div><div class=\"k\">질문을 받았을 때 진실한 의견을 줌으로써.</div></div><div class=\"rnat\">여러분(자신)이 느끼는 것에 대해 솔직하게 말하고 질문을 받았을 때 진실한 의견을 줌으로써 그것을 여러분에게 유리하게 사용하라.</div><div class=\"rst\">친구가 “내 그림 어때?” 물으면 느낀 대로 <b>진실한</b>(truthful) 의견을 말해요. 지문 2번처럼 정직을 내 편으로 쓰는 방법이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">This approach can help you</div><div class=\"k\">이 접근법은 여러분이 ~하도록 도와줄 수 있다</div></div><div class=\"rc\"><div class=\"e\">escape uncomfortable social situations</div><div class=\"k\">불편한 사회적 상황을 피하고</div></div><div class=\"rc\"><div class=\"e\">and make friends with honest people.</div><div class=\"k\">정직한 사람들과 친구가 될 수 있도록.</div></div><div class=\"rnat\">이 접근법은 여러분이 불편한 사회적 상황을 피하고 정직한 사람들과 친구가 될 수 있도록 도와줄 수 있다.</div><div class=\"rst\">그러면 어색한 자리도 피하고, 나처럼 정직한 친구들을 사귈 수 있어요. = 지문 3번이 말하는 정직의 좋은 점이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Follow this simple policy in life —</div><div class=\"k\">삶에서 이러한 간단한 방침을 따르라 —</div></div><div class=\"rc\"><div class=\"e\">never lie.</div><div class=\"k\">절대로 거짓말을 하지 말라.</div></div><div class=\"rnat\">삶에서 이러한 간단한 방침을 따르라. 절대로 거짓말을 하지 말라.</div><div class=\"rst\">규칙은 하나예요. <b>절대 거짓말하지 않기</b>(never lie). 지문 4번의 간단한 방침이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">When you ② develop a reputation</div><div class=\"k\">(여러분이) 평판을 쌓을 때</div></div><div class=\"rc\"><div class=\"e\">for always telling the truth,</div><div class=\"k\">항상 진실만을 말한다는,</div></div><div class=\"rc\"><div class=\"e\">you will enjoy strong relationships based on trust.</div><div class=\"k\">여러분은 신뢰를 바탕으로 한 굳건한 관계를 누릴 것이다.</div></div><div class=\"rnat\">(여러분이) 항상 진실만을 말한다는 평판을 쌓을 때, 여러분은 신뢰를 바탕으로 한 굳건한 관계를 누릴 것이다.</div><div class=\"rst\">“쟤는 늘 진짜만 말해”라는 평판을 <b>쌓으면</b>(develop) 친구들이 나를 믿어 줘요. 지문 5번의 신뢰를 바탕으로 한 관계예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">It will also be more difficult</div><div class=\"k\">또한 더 어려워질 것이다</div></div><div class=\"rc\"><div class=\"e\">to manipulate you.</div><div class=\"k\">여러분을 조종하는 것도.</div></div><div class=\"rnat\">여러분을 조종하는 것도 또한 더 어려워질 것이다.</div><div class=\"rst\">그러면 누가 나를 속여서 마음대로 움직이기도 어려워져요. = 지문 6번, 나를 조종하기 더 어려워진다는 말이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">People who lie</div><div class=\"k\">거짓말을 하는 사람은</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">get into trouble</span></div><div class=\"k\"><span class=\"cw\">곤경에 처하게 된다</span></div></div><div class=\"rc\"><div class=\"e\">when someone threatens to ③ uncover their lie.</div><div class=\"k\">그들의 거짓말을 폭로하겠다고 누군가가 위협할 때.</div></div><div class=\"rnat\">거짓말을 하는 사람은 그들의 거짓말을 폭로하겠다고 누군가가 위협할 때 곤경에 처하게 된다.</div><div class=\"rst\">거짓말한 친구는 누가 “다 <b>폭로할</b>(uncover) 거야!” 하면 <b>곤경에 처해요</b>. 지문 7번, 거짓말은 나쁜 쪽이에요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">By living true to yourself,</div><div class=\"k\">자신에게 진실하게 삶으로써,</div></div><div class=\"rc\"><div class=\"e\">you’ll ④ avoid a lot of headaches.</div><div class=\"k\">여러분은 많은 골칫거리를 피할 것이다.</div></div><div class=\"rnat\">자신에게 진실하게 삶으로써, 여러분은 많은 골칫거리를 피할 것이다.</div><div class=\"rst\">나에게 솔직하게 살면 이런 골칫거리를 <b>피할</b>(avoid) 수 있어요. 지문 8번도 정직의 좋은 결과예요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">Your relationships will also be free from</div><div class=\"k\">여러분의 관계에는 또한 ~이 없을 것이다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">the poison of lies and secrets</span>.</div><div class=\"k\"><span class=\"cw\">거짓과 비밀이라는 해악이</span>.</div></div><div class=\"rnat\">또한 여러분의 관계에는 거짓과 비밀이라는 해악이 없을 것이다.</div><div class=\"rst\">친구 사이에 거짓과 비밀이라는 <b>독</b>이 없어져요. 지문 9번처럼 거짓말은 관계를 망치는 해악이에요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">Don’t be afraid to be honest with your friends,</div><div class=\"k\">친구들에게 정직하게 대하는 것을 두려워하지 말라,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">no matter how painful the truth is</span>.</div><div class=\"k\"><span class=\"cw\">진실이 아무리 고통스럽더라도</span>.</div></div><div class=\"rnat\">진실이 아무리 고통스럽더라도, 친구들에게 정직하게 대하는 것을 두려워하지 말라.</div><div class=\"rst\">진실이 아무리 아파도 친구에게 정직하게 말하는 걸 두려워하지 마세요. = 지문 10번이 글의 결론으로 가는 다리예요.</div></div><div class=\"rds key\" data-ord=\"11\"><span class=\"rn\">11번 · 단서</span><div class=\"rc\"><div class=\"e\">In the long term,</div><div class=\"k\">장기적인 관점에서,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">lies with good intentions</span></div><div class=\"k\"><span class=\"cw\">좋은 의도로 한 (선의의) 거짓말은</span></div></div><div class=\"rc ckc\"><div class=\"e\">⑤ <span class=\"cw\">hurt</span> people much more than telling the truth.</div><div class=\"k\">진실을 말하는 것보다 사람들에게 훨씬 더 <span class=\"cw\">상처를 준다</span>. ※ 문제지엔 comfort(위안을 준다)로 되어 있음</div></div><div class=\"rnat\">장기적인 관점에서, 좋은 의도로 한 (선의의) 거짓말은 진실을 말하는 것보다 사람들에게 훨씬 더 위안을 준다(→ 상처를 준다).</div><div class=\"rst\">길게 보면 착한 마음으로 한 거짓말도 진실보다 친구에게 훨씬 더 <b>상처를 줘요</b>(hurt). 그래서 문제지의 comfort(위안을 주다)는 틀려요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"fundamental\" data-m=\"근본적인, 기본적인\"><b>fundamental</b>근본적인, 기본적인</button><button type=\"button\" class=\"wdb\" data-w=\"to your advantage\" data-m=\"여러분에게 유리하게\"><b>to your advantage</b>여러분에게 유리하게</button><button type=\"button\" class=\"wdb\" data-w=\"reputation\" data-m=\"평판, 명성\"><b>reputation</b>평판, 명성</button><button type=\"button\" class=\"wdb\" data-w=\"manipulate\" data-m=\"조종하다\"><b>manipulate</b>조종하다</button><button type=\"button\" class=\"wdb\" data-w=\"uncover\" data-m=\"폭로하다, 밝히다\"><b>uncover</b>폭로하다, 밝히다</button><button type=\"button\" class=\"wdb\" data-w=\"headache\" data-m=\"골칫거리\"><b>headache</b>골칫거리</button><button type=\"button\" class=\"wdb\" data-w=\"in the long term\" data-m=\"장기적으로\"><b>in the long term</b>장기적으로</button></div>"};
document.addEventListener('click',function(e){
 var b=e.target.closest('.stbtn');
 if(b){var box=b.closest('.rdb'),on=!box.classList.contains('story');box.classList.toggle('story',on);
  var L=[].slice.call(box.querySelectorAll('.rds'));L.forEach(function(x){x.classList.remove('lastv');x.style.order='';});
  if(on){L.sort(function(a,c){return (+a.dataset.ord)-(+c.dataset.ord);});L.forEach(function(x,i){x.style.order=i+1;});L[L.length-1].classList.add('lastv');}
  b.textContent=on?'문장별로 보기':'이야기로 이어 읽기';return;}
 var w=e.target.closest('.wdb');
 if(w){var on2=!w.classList.contains('on');w.classList.toggle('on',on2);
  try{if(window.WN){if(on2)WN.add([{w:w.dataset.w,m:w.dataset.m,src:'미니모고',how:'별표',ask:true}]);else if(WN.del)WN.del(w.dataset.w,'미니모고');}}catch(err){}
  var t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s';document.body.appendChild(t);}
  t.textContent=on2?'오답노트장에 담았어요':'오답노트장에서 뺐어요';t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(function(){t.style.opacity='0'},1600);}
});

/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  if(EXP[cq.q]){h+=EXP[cq.q]+'<button class="toq" data-i="'+i+'">빠른 정답으로</button>';return h+'</div></details>';}
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
  mmInit();
}
/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(S.sub&&!S.mmS){S.mmS=1;S.mmP=1;save();WN.hw(lv,day,S.sub.s+'/'+N+(S.mmD?' ✓':''));}else if(!S.sub&&!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
