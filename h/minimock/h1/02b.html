공한다.</span><span class=\"why\">10번에 나온 청소 모드는 자동 모드, 지정 장소 모드, 수동 모드 세 가지뿐이에요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">전원을 끄면 현재 시각이 리셋된다.</span><span class=\"why\">11번은 except for the current time(현재 시각을 제외하고) 모든 설정이 초기화된다고 했어요. 시각은 그대로예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Robotic Vacuum Cleaner</div><div class=\"k\">로봇 진공청소기</div></div><div class=\"rnat\">로봇 진공청소기</div><div class=\"rst\">우리 집에 로봇 청소기가 새로 왔어요! 상자를 열자 설명서가 나와요. = 지문 1번 제목, 로봇 진공청소기예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">– User Manual –</div><div class=\"k\">– 사용자 설명서 –</div></div><div class=\"rnat\">– 사용자 설명서 –</div><div class=\"rst\">“설명서부터 읽어 봐야지.” 하고 첫 장을 펴요. = 지문 2번, 사용자 설명서라는 표시예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">■ Charging the Battery</div><div class=\"k\">■ 배터리 충전하기</div></div><div class=\"rnat\">■ 배터리 충전하기</div><div class=\"rst\">제일 먼저 할 일은 충전이에요. 지문 3번은 배터리 충전 방법이 시작된다는 작은 제목이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc ckc\"><div class=\"e\">It takes <span class=\"cw\">90 minutes</span></div><div class=\"k\"><span class=\"cw\">90분</span>이 걸린다</div></div><div class=\"rc\"><div class=\"e\">for the battery</div><div class=\"k\">배터리가</div></div><div class=\"rc\"><div class=\"e\">to be fully charged.</div><div class=\"k\">완전히 충전되는 데.</div></div><div class=\"rnat\">· 배터리를 완전히 충전하는 데 90분이 소요됩니다.</div><div class=\"rst\">꽂아 두고 한참 기다려야 해요. 다 차는 데 <b>90분</b>이 걸린대요. = 지문 4번 → ①의 40분과 달라요</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">The robotic vacuum can operate</div><div class=\"k\">로봇 청소기는 작동할 수 있다</div></div><div class=\"rc\"><div class=\"e\">for 40 minutes</div><div class=\"k\">40분간</div></div><div class=\"rc\"><div class=\"e\">when fully charged.</div><div class=\"k\">완전히 충전되었을 때.</div></div><div class=\"rnat\">· 로봇 진공청소기는 완전히 충전되었을 때 40분간 작동할 수 있습니다.</div><div class=\"rst\">다 차면 <b>40분</b> 동안 청소해요. = 지문 5번. 40분은 충전 시간이 아니라 일하는 시간이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">While the robotic vacuum is charging,</div><div class=\"k\">로봇 청소기가 충전되는 동안,</div></div><div class=\"rc\"><div class=\"e\">the battery indicator light</div><div class=\"k\">배터리 표시등이</div></div><div class=\"rc\"><div class=\"e\">blinks red.</div><div class=\"k\">빨간색으로 깜박인다.</div></div><div class=\"rnat\">· 로봇 진공청소기가 충전되는 동안, 배터리 표시등이 빨간색으로 깜박입니다.</div><div class=\"rst\">충전하는 동안 불빛이 <b>빨간색으로 깜박</b>여요. = 지문 6번, 아직 덜 찼다는 신호예요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">When fully charged,</div><div class=\"k\">완전히 충전되면,</div></div><div class=\"rc\"><div class=\"e\">the battery indicator light</div><div class=\"k\">배터리 표시등이</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">turns blue</span>.</div><div class=\"k\"><span class=\"cw\">파란색으로 변한다</span>.</div></div><div class=\"rnat\">· 완전히 충전되면, 배터리 표시등이 파란색으로 변합니다.</div><div class=\"rst\">다 차면 불빛이 <b>파란색</b>으로 바뀌어요. = 지문 7번 → ②의 빨간색과 달라요</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">■ Operating the Vacuum</div><div class=\"k\">■ 진공청소기 작동하기</div></div><div class=\"rnat\">■ 진공청소기 작동하기</div><div class=\"rst\">이제 청소를 시켜 볼 차례예요. 지문 8번은 작동 방법이 시작된다는 작은 제목이에요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">Press the power button</div><div class=\"k\">전원 버튼을 눌러라</div></div><div class=\"rc\"><div class=\"e\">to turn on the vacuum.</div><div class=\"k\">진공청소기를 켜기 위해.</div></div><div class=\"rnat\">· 진공청소기를 켜려면 전원 버튼을 누르세요.</div><div class=\"rst\">전원 버튼을 꾹 누르면 켜져요. = 지문 9번, 켜는 방법이에요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">The following cleaning modes are provided:</div><div class=\"k\">다음의 청소 모드가 제공된다:</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Auto Mode, Spot Mode, and Manual Mode</span>.</div><div class=\"k\"><span class=\"cw\">자동 모드, 지정 장소 모드, 수동 모드</span>.</div></div><div class=\"rnat\">· 다음의 청소 모드를 제공합니다: 자동 모드, 지정 장소 모드, 수동 모드.</div><div class=\"rst\">청소 방식은 자동, 한 곳만, 내가 조종하기 <b>세 가지</b>예요. = 지문 10번 → ③의 네 가지와 달라요</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">Turning off the vacuum</div><div class=\"k\">진공청소기를 끄는 것은</div></div><div class=\"rc\"><div class=\"e\">will reset all settings</div><div class=\"k\">모든 설정을 초기화할 것이다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">except for the current time</span>.</div><div class=\"k\"><span class=\"cw\">현재 시각을 제외하고</span>.</div></div><div class=\"rnat\">· 진공청소기를 끄면 현재 시각을 제외한 모든 설정이 초기화됩니다.</div><div class=\"rst\">끄면 설정이 다 지워져요. 그런데 <b>시각만은 빼고</b>요. = 지문 11번 → ④와 달라요</div></div><div class=\"rds key\" data-ord=\"12\"><span class=\"rn\">12번 · 단서</span><div class=\"rc\"><div class=\"e\">The time can be set</div><div class=\"k\">시각은 설정될 수 있다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">only with the remote control</span>.</div><div class=\"k\"><span class=\"cw\">오직 리모컨으로만</span>.</div></div><div class=\"rnat\">· 시각은 오직 리모컨으로만 설정할 수 있습니다.</div><div class=\"rst\">시각은 <b>리모컨으로만</b> 맞출 수 있어요. 리모컨부터 챙겨요! = 지문 12번 → ⑤와 일치</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"fully charged\" data-m=\"완전히 충전된\"><b>fully charged</b>완전히 충전된</button><button type=\"button\" class=\"wdb\" data-w=\"operate\" data-m=\"작동하다\"><b>operate</b>작동하다</button><button type=\"button\" class=\"wdb\" data-w=\"battery indicator light\" data-m=\"배터리 표시등\"><b>battery indicator light</b>배터리 표시등</button><button type=\"button\" class=\"wdb\" data-w=\"blink\" data-m=\"깜박이다\"><b>blink</b>깜박이다</button><button type=\"button\" class=\"wdb\" data-w=\"reset\" data-m=\"초기화하다\"><b>reset</b>초기화하다</button><button type=\"button\" class=\"wdb\" data-w=\"except for\" data-m=\"~을 제외하고\"><b>except for</b>~을 제외하고</button><button type=\"button\" class=\"wdb\" data-w=\"remote control\" data-m=\"리모컨\"><b>remote control</b>리모컨</button></div>", "08": "<p class=\"mtr\">마더텅 정답률 <b>60%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">삽입은 주어진 문장의 <b>연결 신호</b>를 잡는 문제. However(하지만)로 <b>신남 → 사라짐</b>이 뒤집히고, 바로 뒤에는 That is because(그것은 ~ 때문이다)가 그 이유를 받아야 해요.</p><div class=\"ck-step\"><span class=\"lab\">주어진 문장 · 연결 신호</span><div class=\"en\"><mark>However</mark>, when you start putting the plan into practice … the happiness, excitement, and a lot of fuel <mark>suddenly disappear</mark>.</div><p class=\"ko\"><mark>하지만</mark> 계획을 실행에 옮기기 시작할 때 … 행복감, 즐거움, 많은 에너지원이 <mark>갑자기 사라진다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>However(하지만)가 뒤집을 “신남”이 여기서 절정</span></div><div class=\"ck-step\"><span class=\"lab\">3번 · 앞 문장 (② 바로 앞)</span><div class=\"en\">In this stage, we can even imagine ourselves victoriously dancing on the top of that mountain, feeling successful and <mark>ultimately happy</mark>.</div><p class=\"ko\">이 단계에서는 성공했다고 느끼고 <mark>궁극적으로 행복하다고</mark> 느끼면서 산 정상에서 춤추는 모습을 상상할 수 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>That(그것) = 주어진 문장의 “신남이 갑자기 사라짐”</span></div><div class=\"ck-step key\"><span class=\"lab\">4번 · 뒤 문장 (② 바로 뒤)</span><div class=\"en\"><mark>That is because</mark> the road to your goal, the implementation of the plan is not as appealing as the plan.</div><p class=\"ko\"><mark>그것은</mark> 목표로 가는 길, 즉 계획의 이행이 계획만큼 매력적이지 않기 <mark>때문이다</mark>.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>3번</em>산 정상에서 춤추는 상상 = 신남</span><span><em>주어진 문장</em>실행하자 신남이 갑자기 사라짐</span><span><em>4번</em>그 이유: 실행은 계획만큼 매력 없음</span></div><div class=\"ck-eq\">⇒ 신남 → 사라짐 → 이유, 세 고리가 다 맞는 자리 = ②</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">3번 문장과 4번 문장 사이<small>4번 That(그것)이 받을 “신남이 사라짐”이 바로 앞에 생겨요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">4번 문장과 5번 문장 사이</span><span class=\"why\">5번 lose motivation(동기를 잃다)과 어울려 보이지만, 그러면 4번 That(그것)이 받을 대상이 앞에 없어요. 이유가 결과보다 먼저 나오는 꼴이에요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">2번 문장과 3번 문장 사이</span><span class=\"why\">여기 넣으면 “신남이 사라졌다” 뒤에 3번 In this stage(이 단계에서)의 춤추는 상상이 나와 앞뒤가 뒤집혀요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">5번 문장과 6번 문장 사이</span><span class=\"why\">5·6번은 “길이 밋밋하다”는 설명이 이어지는 중이에요. However(하지만)로 뒤집을 신남이 바로 앞에 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">6번 문장과 7번 문장 사이</span><span class=\"why\">7번에 이미 however(하지만)로 “돌아보면 의미 있었다”는 반전이 있어요. 4번 That(그것)이 가리킬 것도 여전히 없어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds key\" data-ord=\"1\"><span class=\"rn\">1번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">〈주어진 문장〉 <span class=\"cw\">However</span>,</div><div class=\"k\">〈주어진 문장〉 <span class=\"cw\">하지만</span>,</div></div><div class=\"rc\"><div class=\"e\">when you start putting the plan into practice</div><div class=\"k\">당신이 그 계획을 실행에 옮기기 시작할 때</div></div><div class=\"rc\"><div class=\"e\">to achieve your goal,</div><div class=\"k\">목표를 이루기 위해,</div></div><div class=\"rc\"><div class=\"e\">the happiness, excitement, and a lot of fuel</div><div class=\"k\">행복감, 즐거움, 그리고 많은 에너지원(연료)이</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">suddenly disappear</span>.</div><div class=\"k\"><span class=\"cw\">갑자기 사라진다</span>.</div></div><div class=\"rnat\">〈주어진 문장〉 하지만 목표를 이루기 위해 계획을 실행하기 시작할 때, 그 행복감, 즐거움, 그리고 많은 에너지원(연료)이 갑자기 사라진다.</div><div class=\"rst\">〈주어진 문장〉 <b>하지만</b>(However) 막상 계획대로 공부를 시작하면, 신나던 마음과 힘이 <b>갑자기 사라져요</b>. = 지문의 행복·연료가 사라짐.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">When we set a plan,</div><div class=\"k\">우리가 계획을 세울 때,</div></div><div class=\"rc\"><div class=\"e\">we are very excited about it.</div><div class=\"k\">우리는 그것에 대해 매우 들뜬다.</div></div><div class=\"rnat\">우리가 계획을 세울 때, 우리는 그것에 대해 매우 들뜬다.</div><div class=\"rst\">방학 첫날 공부 계획표를 짤 때는 엄청 설레요. 지문도 계획을 세울 때 우리는 매우 들뜬다고 해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">In this stage,</div><div class=\"k\">이 단계에서는,</div></div><div class=\"rc\"><div class=\"e\">we can even imagine ourselves</div><div class=\"k\">우리는 심지어 우리 자신을 상상할 수 있다</div></div><div class=\"rc\"><div class=\"e\">victoriously dancing on the top of that mountain,</div><div class=\"k\">저 산 정상에서 의기양양하게 춤추는 모습을,</div></div><div class=\"rc ckc\"><div class=\"e\">feeling successful and <span class=\"cw\">ultimately happy</span>.</div><div class=\"k\">성공했다고 느끼고 <span class=\"cw\">궁극적으로 행복하다고</span> 느끼면서.</div></div><div class=\"rnat\">( ① ) 이 단계에서는 심지어 저 산 정상에서 의기양양하게 춤추며 성공했다고, 궁극적으로 행복하다고 느끼는 자신의 모습까지 상상해 볼 수 있다.</div><div class=\"rst\">계획표만 봐도 성적이 쑥 올라 신나서 춤추는 내 모습이 그려져요. = 지문의 산 정상에서 춤추는 상상이에요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">That is because</span></div><div class=\"k\"><span class=\"cw\">그것은 ~ 때문이다</span></div></div><div class=\"rc\"><div class=\"e\">the road to your goal,</div><div class=\"k\">당신의 목표로 가는 길,</div></div><div class=\"rc\"><div class=\"e\">the implementation of the plan</div><div class=\"k\">즉 계획의 이행이</div></div><div class=\"rc\"><div class=\"e\">is not as appealing as the plan.</div><div class=\"k\">계획만큼 매력적이지 않기 때문이다.</div></div><div class=\"rnat\">( ② ) 그것은 당신의 목표로 향하는 길, 즉 계획의 이행이 그 계획만큼 매력적이지 않기 때문이다.</div><div class=\"rst\"><b>그건</b>(That is because) 매일 문제집 푸는 일이 계획표 짤 때만큼 재미있지 않기 때문이에요. = 실행이 계획만큼 매력적이지 않다는 지문의 말.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">You can easily lose motivation</div><div class=\"k\">당신은 쉽게 동기를 잃을 수 있다</div></div><div class=\"rc\"><div class=\"e\">when you face</div><div class=\"k\">당신이 마주할 때</div></div><div class=\"rc\"><div class=\"e\">the plain reality</div><div class=\"k\">명백한(꾸밈없는) 현실을</div></div><div class=\"rc\"><div class=\"e\">of the road to success.</div><div class=\"k\">성공으로 가는 길의.</div></div><div class=\"rnat\">( ③ ) 성공으로 가는 길의 명백한(꾸밈없는) 현실에 직면하면, 당신은 쉽게 동기를 잃을 수 있다.</div><div class=\"rst\">매일 똑같은 문제집 앞에 앉으면 하기 싫어져요. 지문도 꾸밈없는 현실을 만나면 동기를 잃기 쉽다고 해요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">The road is paved with grey stones</div><div class=\"k\">그 길은 회색 돌로 포장되어 있다</div></div><div class=\"rc\"><div class=\"e\">and offers less intense emotions</div><div class=\"k\">그래서 덜 강렬한 감정을 준다</div></div><div class=\"rc\"><div class=\"e\">than those imagined at the beginning.</div><div class=\"k\">처음에 상상했던 것(= 감정)보다.</div></div><div class=\"rnat\">( ④ ) 그 길은 회색 돌로 포장되어 있어서(단조로워서), 처음에 상상했던 것보다 덜 강렬한 감정을 준다.</div><div class=\"rst\">매일 공부는 회색 돌길처럼 밋밋해서, 처음 상상한 신남보다 훨씬 덜 짜릿해요. = 지문의 회색 돌로 포장된 길.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">When you reach the end</div><div class=\"k\">끝에 도달해서</div></div><div class=\"rc\"><div class=\"e\">and look back at the road,</div><div class=\"k\">그 길을 되돌아보면,</div></div><div class=\"rc\"><div class=\"e\">however,</div><div class=\"k\">하지만,</div></div><div class=\"rc\"><div class=\"e\">you'll realize</div><div class=\"k\">당신은 깨닫게 될 것이다</div></div><div class=\"rc\"><div class=\"e\">how much more valuable, colorful, and meaningful it was</div><div class=\"k\">그것(= 그 길)이 얼마나 더 가치 있고, 다채롭고, 의미 있었는지</div></div><div class=\"rc\"><div class=\"e\">than you anticipated it to be in the moment.</div><div class=\"k\">그 순간에 그럴 것이라고 예상했던 것보다.</div></div><div class=\"rnat\">( ⑤ ) 하지만 끝에 도달해서 그 길을 되돌아보면, 당신은 그 길이 그 순간에 그럴 것이라고 예상했던 것보다 얼마나 더 가치 있고, 다채롭고, 의미 있었는지 깨닫게 될 것이다.</div><div class=\"rst\"><b>하지만</b>(however) 방학이 끝나고 돌아보면, 그 밋밋한 하루하루가 훨씬 값지고 의미 있었다는 걸 알게 돼요. = 지문의 마지막 반전.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"victoriously\" data-m=\"승리에 차서, 의기양양하게\"><b>victoriously</b>승리에 차서, 의기양양하게</button><button type=\"button\" class=\"wdb\" data-w=\"implementation\" data-m=\"실행, 이행\"><b>implementation</b>실행, 이행</button><button type=\"button\" class=\"wdb\" data-w=\"appealing\" data-m=\"매력적인\"><b>appealing</b>매력적인</button><button type=\"button\" class=\"wdb\" data-w=\"plain\" data-m=\"있는 그대로의, 밋밋한\"><b>plain</b>있는 그대로의, 밋밋한</button><button type=\"button\" class=\"wdb\" data-w=\"intense\" data-m=\"강렬한\"><b>intense</b>강렬한</button><button type=\"button\" class=\"wdb\" data-w=\"anticipate\" data-m=\"예상하다\"><b>anticipate</b>예상하다</button></div>", "09": "<p class=\"mtr\">마더텅 정답률 <b>65%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">요약문은 지문 핵심 문장을 <b>말만 바꿔 옮긴 것</b>이에요. 요약문의 <b>Although</b>(비록 ~일지라도) 대조 구조와 똑같이 생긴 지문 문장을 찾아 (A)(B)를 한 칸씩 짝지으세요.</p><div class=\"ck-step key\"><span class=\"lab\">3번 문장 · 결정적 단서</span><div class=\"en\">Even though one-and-a-half-year-olds <mark>will support each other</mark> in difficult situations, they are <mark>not willing to share</mark> their own toys with others.</div><p class=\"ko\">1년 6개월 된 아기들이 어려운 상황에서는 <mark>서로를 도와줄 것이지만</mark>, 장난감은 <mark>기꺼이 공유하려 하진 않는다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>공유를 꺼리는 모습을 더 세게 보여 줌(even 심지어)</span></div><div class=\"ck-step\"><span class=\"lab\">4번 문장 · 덧붙이는 장면</span><div class=\"en\">The little ones even <mark>defend</mark> their possessions with screams and, if necessary, blows.</div><p class=\"ko\">그 어린 아이들은 비명과 주먹질로 소유물을 심지어 <mark>지킨다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>Even though(비록 ~지만) = Although(비록 ~일지라도), support(돕다) = (A), not willing to share(공유하기를 꺼리다) = (B)</span></div><div class=\"ck-step key\"><span class=\"lab\">요약문 (7번) · 짝 맞추기</span><div class=\"en\">Although very young children will <mark>(A) help</mark> each other in difficult situations, they are unwilling to <mark>(B) share</mark> their possessions.</div><p class=\"ko\">아주 어린 아이들은 어려운 상황에서 서로를 (A) <mark>도와줄지라도</mark>, 소유물을 (B) <mark>공유하기를 꺼린다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">help 도와줄 … share 공유하는<small>3번의 support(돕다) → help(돕다), share(공유하다) → share(공유하다) 그대로예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">ignore 무시할 … defend 지키는</span><span class=\"why\">defend(지키다)가 4번에 나와서 끌려요. 하지만 아기들은 소유물을 지키는 쪽이라 “지키기를 꺼린다”는 반대예요. (A) ignore(무시하다)도 3번 support(돕다)와 반대예요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">ignore 무시할 … share 공유하는</span><span class=\"why\">(B)는 맞지만 (A)가 틀려요. 3번에서 어려울 땐 서로 support(돕다)한다고 했지 ignore(무시하다)한다고 하지 않았어요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">help 도와줄 … hide 숨기는</span><span class=\"why\">(A)는 맞지만 (B)가 틀려요. 지문 어디에도 장난감을 숨긴다는 말은 없고, 3번은 share(공유하다)를 꺼린다고 했어요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">understand 이해할 … hide 숨기는</span><span class=\"why\">둘 다 틀려요. 3번은 서로 support(돕다)한다고 했지 이해한다고 하지 않았고, 숨긴다는 말도 없어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Children are much more resistant</div><div class=\"k\">아이들은 훨씬 더 저항한다(꺼린다)</div></div><div class=\"rc\"><div class=\"e\">to giving something</div><div class=\"k\">무언가를 주는 것에</div></div><div class=\"rc\"><div class=\"e\">to someone else</div><div class=\"k\">다른 누군가에게</div></div><div class=\"rc\"><div class=\"e\">than to helping them.</div><div class=\"k\">그들(= 다른 누군가)을 돕는 것보다.</div></div><div class=\"rnat\">아이들은 다른 누군가를 도와주는 것보다 다른 누군가에게 무언가를 주는 것에 훨씬 더 저항한다.</div><div class=\"rst\">두 살 쌍둥이 동생들을 보면 신기해요. 서로 도와주는 건 잘하는데, 뭘 <b>주는 건</b> 훨씬 싫어해요. 지문 첫 문장이 바로 이 얘기예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">One can observe</div><div class=\"k\">누구든 관찰할 수 있다</div></div><div class=\"rc\"><div class=\"e\">this difference</div><div class=\"k\">이러한 차이를 (= 돕기보다 주기를 더 꺼리는 차이)</div></div><div class=\"rc\"><div class=\"e\">clearly</div><div class=\"k\">확실히</div></div><div class=\"rc\"><div class=\"e\">in very young children.</div><div class=\"k\">아주 어린 아이들에게서.</div></div><div class=\"rnat\">누구든지 아주 어린 아이들에게서 이러한 차이를 확실히 관찰할 수 있다.</div><div class=\"rst\">이 차이는 아주 어린 아이일수록 눈에 확 보여요. 그래서 지문은 아기들을 예로 들어요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc\"><div class=\"e\">Even though</div><div class=\"k\">비록 ~일지라도</div></div><div class=\"rc\"><div class=\"e\">one-and-a-half-year-olds</div><div class=\"k\">1년 6개월 된 아기들이</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">will support each other</span></div><div class=\"k\"><span class=\"cw\">서로를 도와줄 것이지만</span></div></div><div class=\"rc\"><div class=\"e\">in difficult situations,</div><div class=\"k\">어려운 상황에서는,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">they are not willing to share</span></div><div class=\"k\"><span class=\"cw\">그들은 기꺼이 공유하려 하진 않는다</span></div></div><div class=\"rc\"><div class=\"e\">their own toys</div><div class=\"k\">그들 자신의 장난감을</div></div><div class=\"rc\"><div class=\"e\">with others.</div><div class=\"k\">다른 사람들(아기들)과.</div></div><div class=\"rnat\">1년 6개월 된 아기들은 어려운 상황에서는 서로를 도와주려 할 것이지만, 자신의 장난감을 다른 사람(아기)들과 기꺼이 공유하려 하진 않는다.</div><div class=\"rst\">한 동생이 넘어지면 다른 동생이 일으켜 줘요(<b>support</b> 돕다). 그런데 자기 장난감은 절대 안 빌려줘요(<b>not willing to share</b> 공유하기를 꺼리다).</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">The little ones</div><div class=\"k\">그 어린 아이들은 (= 1년 6개월 된 아기들)</div></div><div class=\"rc\"><div class=\"e\">even defend</div><div class=\"k\">심지어 지킨다</div></div><div class=\"rc\"><div class=\"e\">their possessions</div><div class=\"k\">그들의 소유물을 (= 아기들 자신의)</div></div><div class=\"rc\"><div class=\"e\">with screams</div><div class=\"k\">비명을 지르며</div></div><div class=\"rc\"><div class=\"e\">and, if necessary, blows.</div><div class=\"k\">그리고 필요하면 주먹질로.</div></div><div class=\"rnat\">심지어 그 어린(1년 6개월 된) 아기들은 소리를 지르고 필요한 경우 주먹을 날리며 자신의 소유물을 지킨다.</div><div class=\"rst\">장난감 자동차를 뺏으려 하면 소리 지르고 주먹까지 휘둘러요. 지문 말처럼 자기 물건을 <b>지키는</b> 거예요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">This</div><div class=\"k\">이것은 (= 아기들이 소리 지르고 주먹질하며 소유물을 지키는 일)</div></div><div class=\"rc\"><div class=\"e\">is the daily experience</div><div class=\"k\">일상적인 경험이다</div></div><div class=\"rc\"><div class=\"e\">of parents</div><div class=\"k\">부모들의</div></div><div class=\"rc\"><div class=\"e\">troubled by constant quarreling</div><div class=\"k\">끊임없는 싸움 때문에 힘들어하는</div></div><div class=\"rc\"><div class=\"e\">between toddlers.</div><div class=\"k\">걸음마 아기들 사이의.</div></div><div class=\"rnat\">이것은 아기들 사이의 끊임없는 싸움에 의해 문제를 겪는 부모들의 일상적인 경험이다.</div><div class=\"rst\">엄마는 매일 이 싸움을 말리느라 지쳐요. 지문은 이게 부모들의 일상이라고 말해요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">There was no word</div><div class=\"k\">어떤 말도 없었다</div></div><div class=\"rc\"><div class=\"e\">I heard more frequently</div><div class=\"k\">내가 더 자주 들었던</div></div><div class=\"rc\"><div class=\"e\">than “Mine!”</div><div class=\"k\">“내 거야!”보다</div></div><div class=\"rc\"><div class=\"e\">from my daughters</div><div class=\"k\">내 딸들에게서</div></div><div class=\"rc\"><div class=\"e\">when they</div><div class=\"k\">그들(= 내 딸들)이</div></div><div class=\"rc\"><div class=\"e\">were still in diapers.</div><div class=\"k\">아직 기저귀를 차고 있을 때.</div></div><div class=\"rnat\">내가 내 딸들에게서 그들이 아직 기저귀를 차고 있을 때 \"내 거야!\"라는 말보다 더 자주 들었던 말은 없었다.</div><div class=\"rst\">동생들이 제일 많이 하는 말은 “내 거야!”예요. 지문 속 글쓴이도 기저귀 찬 딸들에게서 이 말을 제일 많이 들었대요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">〈요약문〉 Although very young children</div><div class=\"k\">〈요약문〉 비록 아주 어린 아이들이</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">will (A) help each other</span></div><div class=\"k\"><span class=\"cw\">서로를 (A) 도와줄지라도</span> ※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">in difficult situations,</div><div class=\"k\">어려운 상황에서는,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">they are unwilling to (B) share</span></div><div class=\"k\"><span class=\"cw\">그들은 (B) 공유하기를 꺼린다</span> ※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">their possessions.</div><div class=\"k\">그들의 소유물을 (= 아이들 자신의).</div></div><div class=\"rnat\">〈요약문〉 아주 어린 아이들은 어려운 상황에서는 서로를 (A)&lt;b&gt;도와줄지라도&lt;/b&gt;, 자신의 소유물을 (B)&lt;b&gt;공유하는&lt;/b&gt; 것은 꺼린다.</div><div class=\"rst\">정리하면, 어려울 땐 서로 <b>도와주지만</b>(help) 내 물건은 <b>나누기 싫어해요</b>(share). 3번 문장을 그대로 옮긴 요약이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"resistant\" data-m=\"꺼리는, 저항하는\"><b>resistant</b>꺼리는, 저항하는</button><button type=\"button\" class=\"wdb\" data-w=\"support\" data-m=\"돕다, 지지하다\"><b>support</b>돕다, 지지하다</button><button type=\"button\" class=\"wdb\" data-w=\"unwilling\" data-m=\"꺼리는, 내키지 않는\"><b>unwilling</b>꺼리는, 내키지 않는</button><button type=\"button\" class=\"wdb\" data-w=\"defend\" data-m=\"지키다, 방어하다\"><b>defend</b>지키다, 방어하다</button><button type=\"button\" class=\"wdb\" data-w=\"possession\" data-m=\"소유물\"><b>possession</b>소유물</button><button type=\"button\" class=\"wdb\" data-w=\"toddler\" data-m=\"걸음마 아기\"><b>toddler</b>걸음마 아기</button></div>", "10": "<p class=\"mtr\">마더텅 정답률 <b>85%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">이야기 순서는 <b>사건의 시간 고리</b>를 잡으세요. 교실 도착 → 놀림·깜짝 시험 → <b>답안지 제출</b> → <b>At last</b>(마침내) 애나 답안 읽기 순으로 이어 붙이면 돼요.</p><div class=\"ck-step\"><span class=\"lab\">(A) 끝</span><div class=\"en\">She also <mark>made it to her classroom</mark> after asking fellow students for directions.</div><p class=\"ko\">그녀도 동료 학생들에게 길을 물어본 후에 <mark>교실에 도착했다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>교실에 막 들어온 애나를 반 아이들이 ‘보자마자’ 놀려요</span></div><div class=\"ck-step key\"><span class=\"lab\">(D) · 첫 번째 고리</span><div class=\"en\"><mark>Upon seeing Anna's simple clothing</mark> … some students in the classroom started making fun of her.</div><p class=\"ko\"><mark>Anna의 소박한 옷차림을 보자마자</mark> … 교실의 몇몇 학생들은 그녀를 놀리기 시작했다.</p></div><div class=\"ck-via\"><i>▼</i><span>(D)에서 시험 답을 쓰기 시작했으니, 다음은 답안지를 낸 장면</span></div><div class=\"ck-step key\"><span class=\"lab\">(D) 끝 → (B) · 두 번째 고리</span><div class=\"en\"><mark>When everyone except Anna had submitted their answer papers</mark>, Ms. Taylor told … her, “Dear, write down what you know.</div><p class=\"ko\"><mark>Anna를 제외한 모두가 답안지를 제출했을 때</mark>, Taylor 선생님은 그녀에게 말했다, “얘야, 네가 아는 것을 쓰렴.</p></div><div class=\"ck-via\"><i>▼</i><span>(B)에서 다른 학생 답을 다 읽었으니, ‘마침내’ 마지막으로 낸 애나 답안 차례</span></div><div class=\"ck-step key\"><span class=\"lab\">(B) 끝 → (C) · 세 번째 고리</span><div class=\"en\"><mark>At last</mark> Ms. Taylor picked up Anna's answer paper and started reading.</div><p class=\"ko\"><mark>마침내</mark> Taylor 선생님은 Anna의 답안지를 집어 들었고 읽기 시작했다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">(D) – (B) – (C)<small>도착 → 놀림·시험 → 제출 → 마침내 애나 답안, 시간 고리가 모두 맞아요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">(D) – (C) – (B)</span><span class=\"why\">(C)에서 애나 답안지를 읽는데, 애나가 답안지를 내는 장면은 (B)의 handed her answer paper(답안지를 건넸다)예요. 내기도 전에 읽을 수 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">(B) – (D) – (C)</span><span class=\"why\">(B)는 답안지를 제출하는 장면인데, 깜짝 시험은 (D)에서야 시작돼요. 시험 전에 답안지를 낼 수 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">(C) – (B) – (D)</span><span class=\"why\">(A) 끝에 교실에 막 도착했는데 바로 At last(마침내) 애나 답안을 읽어요. 시험도 아직 안 봤어요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">(C) – (D) – (B)</span><span class=\"why\">(C)의 At last(마침내)는 다른 답을 다 읽은 뒤에 와요. 시험이 시작되는 (D)보다 앞일 수 없어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">(A)-1 Anna, a 9-year-old girl,</div><div class=\"k\">9살 소녀인 Anna는,</div></div><div class=\"rc\"><div class=\"e\">finished attending elementary school</div><div class=\"k\">초등학교를 다니는 것을 마쳤다</div></div><div class=\"rc\"><div class=\"e\">till 4th grade</div><div class=\"k\">4학년까지</div></div><div class=\"rc\"><div class=\"e\">at a small village.</div><div class=\"k\">작은 마을에서.</div></div><div class=\"rnat\">(A)-1 9살 소녀인 Anna는 작은 마을에서 4학년까지 초등학교를 다니는 것을 마쳤다.</div><div class=\"rst\">우리 반에 시골에서 전학생이 온다고 상상해 봐요. 지문 1번, 9살 Anna(애나)는 작은 마을에서 4학년까지 다녔어요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">(A)-2 For the 5th grade,</div><div class=\"k\">5학년이 되면서,</div></div><div class=\"rc\"><div class=\"e\">she transferred to a school</div><div class=\"k\">그녀는 학교로 전학을 갔다</div></div><div class=\"rc\"><div class=\"e\">in a city.</div><div class=\"k\">도시에 있는.</div></div><div class=\"rnat\">(A)-2 5학년을 위해, 그녀는 도시에 있는 학교로 전학을 갔다.</div><div class=\"rst\">5학년이 되면서 Anna(애나)는 도시 학교로 <b>전학</b>을 왔어요. = 지문 2번</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">(A)-3 It was the first day of her school</div><div class=\"k\">그녀의 학교에서의 첫날이었고</div></div><div class=\"rc\"><div class=\"e\">and (a) she</div><div class=\"k\">그리고 (a) 그녀는 (= Anna)</div></div><div class=\"rc\"><div class=\"e\">went to her new school by bus.</div><div class=\"k\">버스를 타고 새 학교에 갔다.</div></div><div class=\"rnat\">(A)-3 그녀의 학교에서의 첫 날이었고 (a)그녀(Anna)는 버스를 타고 새로운 학교로 갔다.</div><div class=\"rst\">첫날, 버스를 타고 낯선 새 학교에 와요. 얼마나 떨렸을까요? = 지문 3번</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">(A)-4 All students</div><div class=\"k\">모든 학생들이</div></div><div class=\"rc\"><div class=\"e\">started going to their classes.</div><div class=\"k\">각자의 교실로 가기 시작했다.</div></div><div class=\"rnat\">(A)-4 모든 학생들이 그들의 교실로 가기 시작했다.</div><div class=\"rst\">종이 치자 다들 자기 교실로 우르르 가요. = 지문 4번</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc ckc\"><div class=\"e\">(A)-5 She also <span class=\"cw\">made it to her classroom</span></div><div class=\"k\">그녀 (= Anna)도 <span class=\"cw\">교실에 도착했다</span></div></div><div class=\"rc\"><div class=\"e\">after asking fellow students</div><div class=\"k\">동료 학생들에게 물어본 후에</div></div><div class=\"rc\"><div class=\"e\">for directions.</div><div class=\"k\">길을(방향을).</div></div><div class=\"rnat\">(A)-5 동료 학생들에게 방향을 물어본 후에 그녀도 교실에 도착했다.</div><div class=\"rst\">Anna(애나)는 길을 물어물어 <b>겨우 교실에 도착</b>해요. = 지문 5번, 여기서 (A)가 끝나요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc ckc\"><div class=\"e\">(D)-1 <span class=\"cw\">Upon seeing Anna's simple clothing</span></div><div class=\"k\"><span class=\"cw\">Anna의 소박한 옷차림을 보자마자</span></div></div><div class=\"rc\"><div class=\"e\">and knowing (d) she</div><div class=\"k\">그리고 (d) 그녀가 (= Anna)</div></div><div class=\"rc\"><div class=\"e\">was from a small village,</div><div class=\"k\">작은 마을 출신이라는 것을 알고,</div></div><div class=\"rc\"><div class=\"e\">some students in the classroom</div><div class=\"k\">교실의 몇몇 학생들은</div></div><div class=\"rc\"><div class=\"e\">started making fun of her.</div><div class=\"k\">그녀 (= Anna)를 놀리기 시작했다.</div></div><div class=\"rnat\">(D)-1 Anna의 소박한 옷차림을 보고 (d)그녀(Anna)가 작은 마을 출신이라는 것을 알자마자, 교실의 몇몇 학생들은 그녀를 놀리기 시작했다.</div><div class=\"rst\">그런데 교실에 들어서자마자 옷차림을 <b>보고</b> 몇몇 아이들이 놀려요. = 지문 6번, (D)가 바로 이어져요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">(D)-2 Ms. Taylor,</div><div class=\"k\">Taylor 선생님이,</div></div><div class=\"rc\"><div class=\"e\">Anna's new homeroom teacher,</div><div class=\"k\">Anna의 새 담임교사인,</div></div><div class=\"rc\"><div class=\"e\">soon arrived</div><div class=\"k\">곧 도착했고</div></div><div class=\"rc\"><div class=\"e\">and introduced (e) her</div><div class=\"k\">그리고 (e) 그녀를 (= Anna) 소개했다</div></div><div class=\"rc\"><div class=\"e\">to the class</div><div class=\"k\">학급에</div></div><div class=\"rc\"><div class=\"e\">and said that she</div><div class=\"k\">그리고 말했다 그녀가 (= Anna)</div></div><div class=\"rc\"><div class=\"e\">would be studying with them.</div><div class=\"k\">그들과 함께 공부할 것이라고.</div></div><div class=\"rnat\">(D)-2 Anna의 새 담임교사인 Taylor 선생님이 곧 도착했고, (e)그녀(Anna)를 학급에 소개하며 그녀가 그들과 함께 공부할 것이라고 말했다.</div><div class=\"rst\">곧 담임 Taylor(테일러) 선생님이 와서 새 친구라고 소개해 줘요. = 지문 7번</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">(D)-3 Then the teacher</div><div class=\"k\">그러고 나서 선생님은 (= Taylor 선생님)</div></div><div class=\"rc\"><div class=\"e\">told the students</div><div class=\"k\">학생들에게 말했다</div></div><div class=\"rc\"><div class=\"e\">to be ready</div><div class=\"k\">준비하라고</div></div><div class=\"rc\"><div class=\"e\">for the surprise test now!</div><div class=\"k\">지금 바로 깜짝 시험을!</div></div><div class=\"rnat\">(D)-3 그러고 나서 선생님은 학생들에게 이제 깜짝 시험을 준비하라고 말했다!</div><div class=\"rst\">그러더니 “지금 <b>깜짝 시험</b> 볼 거예요!” 하세요. = 지문 8번</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">(D)-4 She</div><div class=\"k\">그녀는 (= Taylor 선생님)</div></div><div class=\"rc\"><div class=\"e\">told everyone</div><div class=\"k\">모두에게 말했다</div></div><div class=\"rc\"><div class=\"e\">to write down</div><div class=\"k\">적으라고</div></div><div class=\"rc\"><div class=\"e\">the Seven Wonders of the world.</div><div class=\"k\">세계의 7대 불가사의를.</div></div><div class=\"rnat\">(D)-4 그녀는 모든 학생들에게 세계의 7대 불가사의를 쓰라고 말했다.</div><div class=\"rst\">문제는 하나, 세계 7대 불가사의를 쓰는 거예요. = 지문 9번</div></div><div class=\"rds key\" data-ord=\"10\"><span class=\"rn\">10번 · 단서</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc ckc\"><div class=\"e\">(D)-5 <span class=\"cw\">Everyone started writing the answer</span></div><div class=\"k\"><span class=\"cw\">모두가 답을 쓰기 시작했다</span></div></div><div class=\"rc\"><div class=\"e\">to the unexpected test</div><div class=\"k\">예상하지 못한 시험에 대한</div></div><div class=\"rc\"><div class=\"e\">quickly.</div><div class=\"k\">빠르게.</div></div><div class=\"rnat\">(D)-5 예상하지 못한 시험에 모든 학생들은 빠르게 답을 쓰기 시작했다.</div><div class=\"rst\">다들 예상 못 한 시험인데도 후다닥 <b>답을 쓰기 시작</b>해요. = 지문 10번, 이제 제출 장면이 와야 해요.</div></div><div class=\"rds key\" data-ord=\"11\"><span class=\"rn\">11번 · 단서</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc ckc\"><div class=\"e\">(B)-1 <span class=\"cw\">When everyone except Anna</span></div><div class=\"k\"><span class=\"cw\">Anna를 제외한 모두가</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">had submitted their answer papers</span>,</div><div class=\"k\"><span class=\"cw\">답안지를 제출했을 때</span>,</div></div><div class=\"rc\"><div class=\"e\">Ms. Taylor told (b) her,</div><div class=\"k\">Taylor 선생님은 (b) 그녀(= Anna)에게 말했다,</div></div><div class=\"rc\"><div class=\"e\">“Dear, write down what you know.</div><div class=\"k\">“얘야, 네가 아는 것을 쓰렴.</div></div><div class=\"rnat\">(B)-1 Anna를 제외한 모든 학생들이 답안지를 제출했을 때, Taylor 선생님은 (b)그녀(Anna)에게 “얘야, 네가 아는 것을 쓰렴.</div><div class=\"rst\">Anna(애나)만 빼고 모두 <b>답안지를 냈어요</b>. 선생님이 “아는 걸 쓰렴.” 하세요. = 지문 11번, (B)의 시작</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">(B)-2 It's fine.”</div><div class=\"k\">괜찮단다.”</div></div><div class=\"rnat\">(B)-2 괜찮단다.”라고 말했다.</div><div class=\"rst\">“괜찮단다.” 선생님이 다정하게 기다려 줘요. = 지문 12번</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">13번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">(B)-3 Anna said,</div><div class=\"k\">Anna는 말했다,</div></div><div class=\"rc\"><div class=\"e\">“I was thinking</div><div class=\"k\">“저는 생각하고 있었어요</div></div><div class=\"rc\"><div class=\"e\">that there are so many things.</div><div class=\"k\">너무 많은 것들이 있다고.</div></div><div class=\"rnat\">(B)-3 Anna는 “저는 너무 많은 것들이 있다고 생각하고 있었어요.</div><div class=\"rst\">Anna(애나)는 “쓸 게 너무 많다고 생각했어요.” 하고 말해요. = 지문 13번</div></div><div class=\"rds\" data-ord=\"14\"><span class=\"rn\">14번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">(B)-4 I don't know</div><div class=\"k\">저는 모르겠어요</div></div><div class=\"rc\"><div class=\"e\">which seven I can pick to write.”</div><div class=\"k\">어떤 일곱 가지를 골라서 써야 할지.”</div></div><div class=\"rnat\">(B)-4 어떤 일곱 가지를 골라서 써야 할지 모르겠어요.”라고 말했다.</div><div class=\"rst\">“어떤 일곱 개를 골라야 할지 모르겠어요.” = 지문 14번, 그래서 늦어진 거예요.</div></div><div class=\"rds\" data-ord=\"15\"><span class=\"rn\">15번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">(B)-5 Eventually,</div><div class=\"k\">마침내,</div></div><div class=\"rc\"><div class=\"e\">she</div><div class=\"k\">그녀는 (= Anna)</div></div><div class=\"rc\"><div class=\"e\">handed her answer paper</div><div class=\"k\">그녀의 답안지를 건넸다</div></div><div class=\"rc\"><div class=\"e\">to Ms. Taylor.</div><div class=\"k\">Taylor 선생님께.</div></div><div class=\"rnat\">(B)-5 마침내, 그녀는 Taylor 선생님께 그녀의 답안지를 제출했다.</div><div class=\"rst\"><b>마침내</b> Anna(애나)도 답안지를 선생님께 내요. = 지문 15번, 이제 모든 답안지가 모였어요.</div></div><div class=\"rds\" data-ord=\"16\"><span class=\"rn\">16번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">(B)-6 The teacher started reading</div><div class=\"k\">선생님은 읽기 시작했다</div></div><div class=\"rc\"><div class=\"e\">her students' answers aloud</div><div class=\"k\">그녀의 학생들의 답을 소리 내어</div></div><div class=\"rc\"><div class=\"e\">and the majority had answered them correctly</div><div class=\"k\">그리고 대부분은 올바르게 답했다</div></div><div class=\"rc\"><div class=\"e\">such as The Great Wall of China, Colosseum, Stonehenge, etc.</div><div class=\"k\">중국의 만리장성, 콜로세움, 스톤헨지 등과 같이.</div></div><div class=\"rnat\">(B)-6 선생님은 그녀의 학생들의 답을 소리 내어 읽기 시작했고 대부분은 중국의 만리장성, 콜로세움, 스톤헨지 등과 같이 올바르게 답했다.</div><div class=\"rst\">선생님이 답을 소리 내어 읽어요. 대부분 만리장성, 콜로세움처럼 정답이었어요. = 지문 16번</div></div><div class=\"rds\" data-ord=\"17\"><span class=\"rn\">17번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc ckc\"><div class=\"e\">(C)-1 <span class=\"cw\">At last</span></div><div class=\"k\"><span class=\"cw\">마침내</span></div></div><div class=\"rc\"><div class=\"e\">Ms. Taylor picked up Anna's answer paper</div><div class=\"k\">Taylor 선생님은 Anna의 답안지를 집어 들었고</div></div><div class=\"rc\"><div class=\"e\">and started reading.</div><div class=\"k\">읽기 시작했다.</div></div><div class=\"rnat\">(C)-1 마침내, Taylor 선생님은 Anna의 답안지를 집어 들었고 읽기 시작했다.</div><div class=\"rst\"><b>마지막으로</b>(At last) Anna(애나)의 답안지를 집어 들어요. = 지문 17번, 맨 나중에 낸 답안이라 맨 끝에 읽어요.</div></div><div class=\"rds\" data-ord=\"18\"><span class=\"rn\">18번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">(C)-2 “The Seven Wonders are —</div><div class=\"k\">“7대 불가사의는 —</div></div><div class=\"rc\"><div class=\"e\">To be able to See, To be able to Hear, To be able to Feel,</div><div class=\"k\">볼 수 있다는 것, 들을 수 있다는 것, 느낄 수 있다는 것,</div></div><div class=\"rc\"><div class=\"e\">To Laugh, To Think, To be Kind, To Love!”</div><div class=\"k\">웃는 것, 생각하는 것, 친절한 것, 사랑하는 것입니다!”</div></div><div class=\"rnat\">(C)-2 “7대 불가사의는 볼 수 있다는 것, 들을 수 있다는 것, 느낄 수 있다는 것, 웃는 것, 생각하는 것, 친절한 것, 사랑하는 것입니다!”</div><div class=\"rst\">답은 “보고, 듣고, 느끼고, 웃고, 생각하고, 친절하고, 사랑하는 것!” = 지문 18번</div></div><div class=\"rds\" data-ord=\"19\"><span class=\"rn\">19번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">(C)-3 After reading Anna's answer,</div><div class=\"k\">Anna의 답을 읽고 나서,</div></div><div class=\"rc\"><div class=\"e\">(c) she</div><div class=\"k\">(c) 그녀 (= Ms. Taylor)</div></div><div class=\"rc\"><div class=\"e\">was touched</div><div class=\"k\">감동받았고</div></div><div class=\"rc\"><div class=\"e\">and all her students</div><div class=\"k\">그리고 그녀의 모든 학생들도</div></div><div class=\"rc\"><div class=\"e\">were also deeply moved.</div><div class=\"k\">또한 매우 감동받았다.</div></div><div class=\"rnat\">(C)-3 Anna의 답을 읽고 나서, (c)그녀(Ms. Taylor)는 감동받았고 그녀의 모든 학생들도 매우 감동받았다.</div><div class=\"rst\">선생님도 반 아이들도 모두 <b>깊이 감동</b>받아요. = 지문 19번</div></div><div class=\"rds\" data-ord=\"20\"><span class=\"rn\">20번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">(C)-4 Today,</div><div class=\"k\">오늘,</div></div><div class=\"rc\"><div class=\"e\">a girl from a small village</div><div class=\"k\">작은 마을에서 온 한 소녀가</div></div><div class=\"rc\"><div class=\"e\">reminded them</div><div class=\"k\">그들에게 (= 선생님과 학생들) 상기시켜 주었다</div></div><div class=\"rc\"><div class=\"e\">about the precious gifts,</div><div class=\"k\">소중한 선물들에 대해,</div></div><div class=\"rc\"><div class=\"e\">truly a wonder,</div><div class=\"k\">진짜 불가사의인,</div></div><div class=\"rc\"><div class=\"e\">which</div><div class=\"k\">그것들 (= 소중한 선물들)은</div></div><div class=\"rc\"><div class=\"e\">they already knew but easily forgot.</div><div class=\"k\">그들이 이미 알고 있었지만 쉽게 잊어버렸던.</div></div><div class=\"rnat\">(C)-4 오늘, 작은 마을에서 온 한 소녀가 그들에게 진짜 불가사의인, 그들이 이미 알고 있었지만 쉽게 잊어버렸던 소중한 선물에 대해 상기시켜 주었다.</div><div class=\"rst\">놀림받던 시골 아이가, 늘 갖고 있어서 잊고 지낸 <b>소중한 선물</b>을 깨우쳐 줬어요. = 지문 20번</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"transfer\" data-m=\"전학하다\"><b>transfer</b>전학하다</button><button type=\"button\" class=\"wdb\" data-w=\"make it to\" data-m=\"~에 (겨우) 도착하다\"><b>make it to</b>~에 (겨우) 도착하다</button><button type=\"button\" class=\"wdb\" data-w=\"make fun of\" data-m=\"~을 놀리다\"><b>make fun of</b>~을 놀리다</button><button type=\"button\" class=\"wdb\" data-w=\"surprise test\" data-m=\"깜짝 시험\"><b>surprise test</b>깜짝 시험</button><button type=\"button\" class=\"wdb\" data-w=\"submit\" data-m=\"제출하다\"><b>submit</b>제출하다</button><button type=\"button\" class=\"wdb\" data-w=\"at last\" data-m=\"마침내\"><b>at last</b>마침내</button><button type=\"button\" class=\"wdb\" data-w=\"precious\" data-m=\"소중한\"><b>precious</b>소중한</button></div>", "11": "<p class=\"mtr\">마더텅 정답률 <b>80%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">지칭 문제는 대명사마다 <b>그 문장 안의 단서</b>로 누구인지 확인하세요. (c) 문장의 <b>all her students</b>(그녀의 모든 학생들)처럼 학생을 거느린 사람은 선생님뿐이에요.</p><div class=\"ck-step\"><span class=\"lab\">(a) · 3번 문장</span><div class=\"en\">It was the first day of her school and <mark>(a) she</mark> went to her new school by bus.</div><p class=\"ko\">학교 첫날이었고 <mark>(a) 그녀는</mark> 버스를 타고 새 학교에 갔다. → 전학 온 애나</p></div><div class=\"ck-via\"><i>▼</i><span>작은 마을 출신 = 1번에서 시골 학교에 다닌 애나</span></div><div class=\"ck-step\"><span class=\"lab\">(d) · 6번 문장</span><div class=\"en\">Upon seeing Anna's simple clothing and knowing <mark>(d) she</mark> was from a small village, …</div><p class=\"ko\">애나의 소박한 옷을 보고 <mark>(d) 그녀가</mark> 작은 마을 출신임을 알자 … → 애나</p></div><div class=\"ck-via\"><i>▼</i><span>담임이 반에 소개하는 사람 = 새로 온 전학생</span></div><div class=\"ck-step\"><span class=\"lab\">(e) · 7번 문장</span><div class=\"en\">Ms. Taylor, Anna's new homeroom teacher, soon arrived and introduced <mark>(e) her</mark> to the class …</div><p class=\"ko\">새 담임 테일러 선생님이 와서 <mark>(e) 그녀를</mark> 학급에 소개했다 … → 애나</p></div><div class=\"ck-via\"><i>▼</i><span>애나만 빼고 다 냈으니, 선생님이 말을 건 상대 = 애나</span></div><div class=\"ck-step\"><span class=\"lab\">(b) · 11번 문장</span><div class=\"en\">When everyone except Anna had submitted their answer papers, Ms. Taylor told <mark>(b) her</mark>, …</div><p class=\"ko\">애나를 제외한 모두가 답안지를 냈을 때, 선생님은 <mark>(b) 그녀</mark>에게 말했다 … → 애나</p></div><div class=\"ck-via\"><i>▼</i><span>답을 읽은 사람 + 학생들을 거느린 사람 = 선생님</span></div><div class=\"ck-step key\"><span class=\"lab\">(c) · 19번 문장 · 결정적 단서</span><div class=\"en\"><mark>After reading Anna's answer</mark>, <mark>(c) she</mark> was touched and <mark>all her students</mark> were also deeply moved.</div><p class=\"ko\"><mark>Anna의 답을 읽고 나서</mark>, <mark>(c) 그녀</mark>는 감동받았고 <mark>그녀의 모든 학생들도</mark> 매우 감동받았다. → 테일러 선생님</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">(c) she 그녀 = 테일러 선생님<small>애나의 답을 읽은 사람이고, 학생들을 거느린 사람이라 선생님이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">(e) her 그녀를 = 애나</span><span class=\"why\">7번 문장 주어가 테일러 선생님이라 선생님으로 착각하기 쉬워요. 하지만 담임이 반에 소개하는 사람은 새로 온 애나예요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">(a) she 그녀 = 애나</span><span class=\"why\">3번은 전학 첫날 버스를 타고 새 학교에 간 사람이에요. 2번에서 전학 간 애나 얘기가 그대로 이어져요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">(b) her 그녀에게 = 애나</span><span class=\"why\">11번에서 애나만 빼고 다 답안지를 냈어요. 선생님이 “아는 것을 쓰렴” 하고 말한 상대는 아직 못 낸 애나고, 13번에서 애나가 대답해요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">(d) she 그녀가 = 애나</span><span class=\"why\">6번의 소박한 옷차림, 작은 마을 출신은 1번에서 시골 학교를 다닌 애나를 가리켜요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">(A)-1 Anna, a 9-year-old girl,</div><div class=\"k\">9살 소녀인 Anna는,</div></div><div class=\"rc\"><div class=\"e\">finished attending elementary school</div><div class=\"k\">초등학교를 다니는 것을 마쳤다</div></div><div class=\"rc\"><div class=\"e\">till 4th grade</div><div class=\"k\">4학년까지</div></div><div class=\"rc\"><div class=\"e\">at a small village.</div><div class=\"k\">작은 마을에서.</div></div><div class=\"rnat\">(A)-1 9살 소녀인 Anna는 작은 마을에서 4학년까지 초등학교를 다니는 것을 마쳤다.</div><div class=\"rst\">애나는 작은 시골 마을 학교에서 4학년까지 다닌 9살 여자아이예요. 이 이야기의 주인공이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">(A)-2 For the 5th grade,</div><div class=\"k\">5학년이 되면서,</div></div><div class=\"rc\"><div class=\"e\">she transferred to a school</div><div class=\"k\">그녀는 학교로 전학을 갔다</div></div><div class=\"rc\"><div class=\"e\">in a city.</div><div class=\"k\">도시에 있는.</div></div><div class=\"rnat\">(A)-2 5학년을 위해, 그녀는 도시에 있는 학교로 전학을 갔다.</div><div class=\"rst\">5학년이 되면서 애나는 도시에 있는 학교로 전학을 가요. 지문 속 '그녀'는 여기서부터 애나예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">(A)-3 It was the first day of her school</div><div class=\"k\">그녀의 학교에서의 첫날이었고</div></div><div class=\"rc\"><div class=\"e\">and (a) she</div><div class=\"k\">그리고 (a) 그녀는 (= Anna)</div></div><div class=\"rc\"><div class=\"e\">went to her new school by bus.</div><div class=\"k\">버스를 타고 새 학교에 갔다.</div></div><div class=\"rnat\">(A)-3 그녀의 학교에서의 첫 날이었고 (a)그녀(Anna)는 버스를 타고 새로운 학교로 갔다.</div><div class=\"rst\">전학 첫날, 애나는 혼자 버스를 타고 새 학교에 가요. 그래서 <b>(a) 그녀 = 애나</b>예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">(A)-4 All students</div><div class=\"k\">모든 학생들이</div></div><div class=\"rc\"><div class=\"e\">started going to their classes.</div><div class=\"k\">각자의 교실로 가기 시작했다.</div></div><div class=\"rnat\">(A)-4 모든 학생들이 그들의 교실로 가기 시작했다.</div><div class=\"rst\">종이 울리자 학생들이 우르르 자기 반으로 들어가요. 지문도 모든 학생이 교실로 가기 시작했다고 말해요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">(A)-5 She also made it to her classroom</div><div class=\"k\">그녀 (= Anna)도 교실에 도착했다</div></div><div class=\"rc\"><div class=\"e\">after asking fellow students</div><div class=\"k\">동료 학생들에게 물어본 후에</div></div><div class=\"rc\"><div class=\"e\">for directions.</div><div class=\"k\">길을(방향을).</div></div><div class=\"rnat\">(A)-5 동료 학생들에게 방향을 물어본 후에 그녀도 교실에 도착했다.</div><div class=\"rst\">길을 모르는 애나는 친구들에게 물어물어 겨우 교실을 찾아가요. 지문의 '그녀도 교실에 도착했다'예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">(D)-1 Upon seeing Anna's simple clothing</div><div class=\"k\">Anna의 소박한 옷차림을 보자마자</div></div><div class=\"rc\"><div class=\"e\">and knowing (d) she</div><div class=\"k\">그리고 (d) 그녀가 (= Anna)</div></div><div class=\"rc\"><div class=\"e\">was from a small village,</div><div class=\"k\">작은 마을 출신이라는 것을 알고,</div></div><div class=\"rc\"><div class=\"e\">some students in the classroom</div><div class=\"k\">교실의 몇몇 학생들은</div></div><div class=\"rc\"><div class=\"e\">started making fun of her.</div><div class=\"k\">그녀 (= Anna)를 놀리기 시작했다.</div></div><div class=\"rnat\">(D)-1 Anna의 소박한 옷차림을 보고 (d)그녀(Anna)가 작은 마을 출신이라는 것을 알자마자, 교실의 몇몇 학생들은 그녀를 놀리기 시작했다.</div><div class=\"rst\">몇몇 아이들이 애나의 수수한 옷을 보고 시골에서 왔다고 놀려요. 시골 출신은 1번의 애나라서 <b>(d) 그녀 = 애나</b>예요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">(D)-2 Ms. Taylor,</div><div class=\"k\">Taylor 선생님이,</div></div><div class=\"rc\"><div class=\"e\">Anna's new homeroom teacher,</div><div class=\"k\">Anna의 새 담임교사인,</div></div><div class=\"rc\"><div class=\"e\">soon arrived</div><div class=\"k\">곧 도착했고</div></div><div class=\"rc\"><div class=\"e\">and introduced (e) her</div><div class=\"k\">그리고 (e) 그녀를 (= Anna) 소개했다</div></div><div class=\"rc\"><div class=\"e\">to the class</div><div class=\"k\">학급에</div></div><div class=\"rc\"><div class=\"e\">and said that she</div><div class=\"k\">그리고 말했다 그녀가 (= Anna)</div></div><div class=\"rc\"><div class=\"e\">would be studying with them.</div><div class=\"k\">그들과 함께 공부할 것이라고.</div></div><div class=\"rnat\">(D)-2 Anna의 새 담임교사인 Taylor 선생님이 곧 도착했고, (e)그녀(Anna)를 학급에 소개하며 그녀가 그들과 함께 공부할 것이라고 말했다.</div><div class=\"rst\">담임 테일러 쌤이 들어와 새 친구를 반에 소개해요. 소개받는 사람은 전학생이니 <b>(e) 그녀 = 애나</b>예요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">(D)-3 Then the teacher</div><div class=\"k\">그러고 나서 선생님은 (= Taylor 선생님)</div></div><div class=\"rc\"><div class=\"e\">told the students</div><div class=\"k\">학생들에게 말했다</div></div><div class=\"rc\"><div class=\"e\">to be ready</div><div class=\"k\">준비하라고</div></div><div class=\"rc\"><div class=\"e\">for the surprise test now!</div><div class=\"k\">지금 바로 깜짝 시험을!</div></div><div class=\"rnat\">(D)-3 그러고 나서 선생님은 학생들에게 이제 깜짝 시험을 준비하라고 말했다!</div><div class=\"rst\">그러더니 쌤이 갑자기 “지금 깜짝 시험 볼 거예요!” 해요. 지문의 '선생님'은 테일러 쌤이에요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">(D)-4 She</div><div class=\"k\">그녀는 (= Taylor 선생님)</div></div><div class=\"rc\"><div class=\"e\">told everyone</div><div class=\"k\">모두에게 말했다</div></div><div class=\"rc\"><div class=\"e\">to write down</div><div class=\"k\">적으라고</div></div><div class=\"rc\"><div class=\"e\">the Seven Wonders of the world.</div><div class=\"k\">세계의 7대 불가사의를.</div></div><div class=\"rnat\">(D)-4 그녀는 모든 학생들에게 세계의 7대 불가사의를 쓰라고 말했다.</div><div class=\"rst\">문제는 “세계 7대 불가사의를 쓰세요.” 이 문장의 '그녀'는 시험을 내는 테일러 쌤이에요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">(D)-5 Everyone started writing the answer</div><div class=\"k\">모두가 답을 쓰기 시작했다</div></div><div class=\"rc\"><div class=\"e\">to the unexpected test</div><div class=\"k\">예상하지 못한 시험에 대한</div></div><div class=\"rc\"><div class=\"e\">quickly.</div><div class=\"k\">빠르게.</div></div><div class=\"rnat\">(D)-5 예상하지 못한 시험에 모든 학생들은 빠르게 답을 쓰기 시작했다.</div><div class=\"rst\">갑작스러운 시험인데도 아이들은 술술 빨리 써 내려가요. 지문도 모두가 빠르게 답을 쓰기 시작했다고 해요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">(B)-1 When everyone except Anna</div><div class=\"k\">Anna를 제외한 모두가</div></div><div class=\"rc\"><div class=\"e\">had submitted their answer papers,</div><div class=\"k\">답안지를 제출했을 때,</div></div><div class=\"rc\"><div class=\"e\">Ms. Taylor told (b) her,</div><div class=\"k\">Taylor 선생님은 (b) 그녀(= Anna)에게 말했다,</div></div><div class=\"rc\"><div class=\"e\">“Dear, write down what you know.</div><div class=\"k\">“얘야, 네가 아는 것을 쓰렴.</div></div><div class=\"rnat\">(B)-1 Anna를 제외한 모든 학생들이 답안지를 제출했을 때, Taylor 선생님은 (b)그녀(Anna)에게 “얘야, 네가 아는 것을 쓰렴.</div><div class=\"rst\">다들 냈는데 애나만 못 냈어요. 쌤이 “아는 것을 쓰렴” 하고 말을 건 상대는 애나라서 <b>(b) 그녀 = 애나</b>예요.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><div class=\"rc\"><div class=\"e\">(B)-2 It's fine.”</div><div class=\"k\">괜찮단다.”</div></div><div class=\"rnat\">(B)-2 괜찮단다.”라고 말했다.</div><div class=\"rst\">쌤이 “괜찮단다.” 하고 다독여요. 아직 답을 못 낸 애나를 안심시키는 말이에요.</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">13번</span><div class=\"rc\"><div class=\"e\">(B)-3 Anna said,</div><div class=\"k\">Anna는 말했다,</div></div><div class=\"rc\"><div class=\"e\">“I was thinking</div><div class=\"k\">“저는 생각하고 있었어요</div></div><div class=\"rc\"><div class=\"e\">that there are so many things.</div><div class=\"k\">너무 많은 것들이 있다고.</div></div><div class=\"rnat\">(B)-3 Anna는 “저는 너무 많은 것들이 있다고 생각하고 있었어요.</div><div class=\"rst\">애나가 “쓸 게 너무 많다고 생각하고 있었어요.” 하고 대답해요. 말하는 사람이 애나라서 앞의 (b)가 애나임이 확인돼요.</div></div><div class=\"rds\" data-ord=\"14\"><span class=\"rn\">14번</span><div class=\"rc\"><div class=\"e\">(B)-4 I don't know</div><div class=\"k\">저는 모르겠어요</div></div><div class=\"rc\"><div class=\"e\">which seven I can pick to write.”</div><div class=\"k\">어떤 일곱 가지를 골라서 써야 할지.”</div></div><div class=\"rnat\">(B)-4 어떤 일곱 가지를 골라서 써야 할지 모르겠어요.”라고 말했다.</div><div class=\"rst\">“그중 어떤 일곱 개를 골라야 할지 모르겠어요.” 지문 속 애나가 답을 늦게 낸 이유예요.</div></div><div class=\"rds\" data-ord=\"15\"><span class=\"rn\">15번</span><div class=\"rc\"><div class=\"e\">(B)-5 Eventually,</div><div class=\"k\">마침내,</div></div><div class=\"rc\"><div class=\"e\">she</div><div class=\"k\">그녀는 (= Anna)</div></div><div class=\"rc\"><div class=\"e\">handed her answer paper</div><div class=\"k\">그녀의 답안지를 건넸다</div></div><div class=\"rc\"><div class=\"e\">to Ms. Taylor.</div><div class=\"k\">Taylor 선생님께.</div></div><div class=\"rnat\">(B)-5 마침내, 그녀는 Taylor 선생님께 그녀의 답안지를 제출했다.</div><div class=\"rst\">마침내 애나가 테일러 쌤께 답안지를 내요. 이 문장의 '그녀'도 답안지를 낸 애나예요.</div></div><div class=\"rds\" data-ord=\"16\"><span class=\"rn\">16번</span><div class=\"rc\"><div class=\"e\">(B)-6 The teacher started reading</div><div class=\"k\">선생님은 읽기 시작했다</div></div><div class=\"rc\"><div class=\"e\">her students' answers aloud</div><div class=\"k\">그녀의 학생들의 답을 소리 내어</div></div><div class=\"rc\"><div class=\"e\">and the majority had answered them correctly</div><div class=\"k\">그리고 대부분은 올바르게 답했다</div></div><div class=\"rc\"><div class=\"e\">such as The Great Wall of China, Colosseum, Stonehenge, etc.</div><div class=\"k\">중국의 만리장성, 콜로세움, 스톤헨지 등과 같이.</div></div><div class=\"rnat\">(B)-6 선생님은 그녀의 학생들의 답을 소리 내어 읽기 시작했고 대부분은 중국의 만리장성, 콜로세움, 스톤헨지 등과 같이 올바르게 답했다.</div><div class=\"rst\">쌤이 반 아이들 답을 소리 내어 읽는데, 대부분 만리장성·콜로세움 같은 정답을 썼어요. 지문 그대로예요.</div></div><div class=\"rds\" data-ord=\"17\"><span class=\"rn\">17번</span><div class=\"rc\"><div class=\"e\">(C)-1 At last</div><div class=\"k\">마침내</div></div><div class=\"rc\"><div class=\"e\">Ms. Taylor picked up Anna's answer paper</div><div class=\"k\">Taylor 선생님은 Anna의 답안지를 집어 들었고</div></div><div class=\"rc\"><div class=\"e\">and started reading.</div><div class=\"k\">읽기 시작했다.</div></div><div class=\"rnat\">(C)-1 마침내, Taylor 선생님은 Anna의 답안지를 집어 들었고 읽기 시작했다.</div><div class=\"rst\">드디어 쌤이 애나의 답안지를 집어 들고 읽어요. 지문에서 <b>읽는 사람 = 쌤</b>, 쓴 사람 = 애나예요.</div></div><div class=\"rds\" data-ord=\"18\"><span class=\"rn\">18번</span><div class=\"rc\"><div class=\"e\">(C)-2 “The Seven Wonders are —</div><div class=\"k\">“7대 불가사의는 —</div></div><div class=\"rc\"><div class=\"e\">To be able to See, To be able to Hear, To be able to Feel,</div><div class=\"k\">볼 수 있다는 것, 들을 수 있다는 것, 느낄 수 있다는 것,</div></div><div class=\"rc\"><div class=\"e\">To Laugh, To Think, To be Kind, To Love!”</div><div class=\"k\">웃는 것, 생각하는 것, 친절한 것, 사랑하는 것입니다!”</div></div><div class=\"rnat\">(C)-2 “7대 불가사의는 볼 수 있다는 것, 들을 수 있다는 것, 느낄 수 있다는 것, 웃는 것, 생각하는 것, 친절한 것, 사랑하는 것입니다!”</div><div class=\"rst\">애나의 답은 “보고, 듣고, 느끼고, 웃고, 생각하고, 친절하고, 사랑하는 것”이에요. 지문 속 애나만의 7대 불가사의예요.</div></div><div class=\"rds key\" data-ord=\"19\"><span class=\"rn\">19번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">(C)-3 <span class=\"cw\">After reading Anna's answer,</span></div><div class=\"k\"><span class=\"cw\">Anna의 답을 읽고 나서,</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">(c) she</span></div><div class=\"k\"><span class=\"cw\">(c) 그녀 (= Ms. Taylor)</span></div></div><div class=\"rc\"><div class=\"e\">was touched</div><div class=\"k\">감동받았고</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">and all her students</span></div><div class=\"k\"><span class=\"cw\">그리고 그녀의 모든 학생들도</span></div></div><div class=\"rc\"><div class=\"e\">were also deeply moved.</div><div class=\"k\">또한 매우 감동받았다.</div></div><div class=\"rnat\">(C)-3 Anna의 답을 읽고 나서, (c)그녀(Ms. Taylor)는 감동받았고 그녀의 모든 학생들도 매우 감동받았다.</div><div class=\"rst\">답을 읽고 감동한 건 읽은 쌤이고, 반 아이들도 감동해요. <b>all her students</b>(그녀의 모든 학생들)가 있으니 <b>(c) 그녀 = 쌤</b>!</div></div><div class=\"rds\" data-ord=\"20\"><span class=\"rn\">20번</span><div class=\"rc\"><div class=\"e\">(C)-4 Today,</div><div class=\"k\">오늘,</div></div><div class=\"rc\"><div class=\"e\">a girl from a small village</div><div class=\"k\">작은 마을에서 온 한 소녀가</div></div><div class=\"rc\"><div class=\"e\">reminded them</div><div class=\"k\">그들에게 (= 선생님과 학생들) 상기시켜 주었다</div></div><div class=\"rc\"><div class=\"e\">about the precious gifts,</div><div class=\"k\">소중한 선물들에 대해,</div></div><div class=\"rc\"><div class=\"e\">truly a wonder,</div><div class=\"k\">진짜 불가사의인,</div></div><div class=\"rc\"><div class=\"e\">which</div><div class=\"k\">그것들 (= 소중한 선물들)은</div></div><div class=\"rc\"><div class=\"e\">they already knew but easily forgot.</div><div class=\"k\">그들이 이미 알고 있었지만 쉽게 잊어버렸던.</div></div><div class=\"rnat\">(C)-4 오늘, 작은 마을에서 온 한 소녀가 그들에게 진짜 불가사의인, 그들이 이미 알고 있었지만 쉽게 잊어버렸던 소중한 선물에 대해 상기시켜 주었다.</div><div class=\"rst\">시골에서 온 한 소녀가 쌤과 친구들에게, 이미 알지만 잊고 지낸 소중한 선물을 일깨워 줘요. 지문의 마지막 메시지예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"touched\" data-m=\"감동받은\"><b>touched</b>감동받은</button><button type=\"button\" class=\"wdb\" data-w=\"deeply moved\" data-m=\"깊이 감동받은\"><b>deeply moved</b>깊이 감동받은</button><button type=\"button\" class=\"wdb\" data-w=\"introduce\" data-m=\"소개하다\"><b>introduce</b>소개하다</button><button type=\"button\" class=\"wdb\" data-w=\"clothing\" data-m=\"옷차림\"><b>clothing</b>옷차림</button><button type=\"button\" class=\"wdb\" data-w=\"eventually\" data-m=\"마침내, 결국\"><b>eventually</b>마침내, 결국</button><button type=\"button\" class=\"wdb\" data-w=\"precious\" data-m=\"소중한\"><b>precious</b>소중한</button></div>", "12": "<p class=\"mtr\">마더텅 정답률 <b>85%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">불일치 문제는 선택지를 <b>지문 순서대로</b> 하나씩 대조하세요. 특히 <b>감정 단어</b>는 지문과 정반대로 바꿔 내기 쉬우니, 실망인지 감동인지 끝까지 확인해요.</p><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>① ↔ 2번</em>transferred to a school in a city(도시 학교로 전학 갔다) → 같음</span><span><em>⑤ ↔ 8·10번</em>surprise test(깜짝 시험), unexpected test(예상하지 못한 시험) → 같음</span><span><em>② ↔ 11·15번</em>애나만 빼고 다 낸 뒤 Eventually(마침내) 냄 → 같음</span><span><em>③ ↔ 16번</em>reading her students' answers aloud(학생들의 답을 소리 내어 읽기) → 같음</span></div><div class=\"ck-eq\">⇒ 네 개는 지문과 그대로 같아요. 남은 ④를 (C)의 19번과 대조해요</div></div><div class=\"ck-via\"><i>▼</i><span>④의 ‘실망했다’를 애나 답을 읽은 뒤 장면에서 찾아요</span></div><div class=\"ck-step key\"><span class=\"lab\">19번 문장 · 결정적 단서</span><div class=\"en\">After reading Anna's answer, … she <mark>was touched</mark> and all her students <mark>were also deeply moved</mark>.</div><p class=\"ko\">Anna의 답을 읽고 나서, 그녀는 <mark>감동받았고</mark> 그녀의 모든 학생들도 <mark>또한 매우 감동받았다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>실망이 아니라, 잊고 있던 소중한 것을 깨우쳐 줬다는 마무리예요</span></div><div class=\"ck-step\"><span class=\"lab\">20번 문장 · 감정 확인</span><div class=\"en\">… a girl from a small village reminded them about the <mark>precious gifts</mark> …</div><p class=\"ko\">… 작은 마을에서 온 한 소녀가 그들에게 <mark>소중한 선물들</mark>에 대해 상기시켜 주었다 …</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">모든 학생들은 Anna가 쓴 답을 듣고 실망했다.<small>19번은 deeply moved(매우 감동받았다)예요. 실망과 정반대 감정이에요.</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">Anna는 학급에서 가장 늦게 답안지를 제출했다.</span><span class=\"why\">‘가장 늦게’라는 말이 지문에 없어 보여 의심되지만, 11번 everyone except Anna(애나를 제외한 모두)가 먼저 냈고 15번에서 애나가 냈으니 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">Anna는 도시에 있는 학교로 전학을 했다.</span><span class=\"why\">2번 transferred to a school in a city(도시에 있는 학교로 전학 갔다)와 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">선생님은 학생들이 쓴 답안지를 읽어 주었다.</span><span class=\"why\">16번 started reading her students' answers aloud(학생들의 답을 소리 내어 읽기 시작했다)와 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">학생들은 예상하지 못했던 시험을 치르게 되었다.</span><span class=\"why\">8번 surprise test(깜짝 시험), 10번 unexpected test(예상하지 못한 시험)와 같아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">(A)-1 Anna, a 9-year-old girl,</div><div class=\"k\">9살 소녀인 Anna는,</div></div><div class=\"rc\"><div class=\"e\">finished attending elementary school</div><div class=\"k\">초등학교를 다니는 것을 마쳤다</div></div><div class=\"rc\"><div class=\"e\">till 4th grade</div><div class=\"k\">4학년까지</div></div><div class=\"rc\"><div class=\"e\">at a small village.</div><div class=\"k\">작은 마을에서.</div></div><div class=\"rnat\">(A)-1 9살 소녀인 Anna는 작은 마을에서 4학년까지 초등학교를 다니는 것을 마쳤다.</div><div class=\"rst\">우리 반에 시골에서 전학생이 온다고 상상해 봐요. 지문 1번, 9살 Anna(애나)는 작은 마을에서 4학년까지 다녔어요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">(A)-2 For the 5th grade,</div><div class=\"k\">5학년이 되면서,</div></div><div class=\"rc\"><div class=\"e\">she transferred to a school</div><div class=\"k\">그녀는 학교로 전학을 갔다</div></div><div class=\"rc\"><div class=\"e\">in a city.</div><div class=\"k\">도시에 있는.</div></div><div class=\"rnat\">(A)-2 5학년을 위해, 그녀는 도시에 있는 학교로 전학을 갔다.</div><div class=\"rst\">5학년이 되면서 Anna(애나)는 <b>도시 학교로 전학</b>을 왔어요. = 지문 2번 → ① 일치</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">(A)-3 It was the first day of her school</div><div class=\"k\">그녀의 학교에서의 첫날이었고</div></div><div class=\"rc\"><div class=\"e\">and (a) she</div><div class=\"k\">그리고 (a) 그녀는 (= Anna)</div></div><div class=\"rc\"><div class=\"e\">went to her new school by bus.</div><div class=\"k\">버스를 타고 새 학교에 갔다.</div></div><div class=\"rnat\">(A)-3 그녀의 학교에서의 첫 날이었고 (a)그녀(Anna)는 버스를 타고 새로운 학교로 갔다.</div><div class=\"rst\">첫날, 혼자 버스를 타고 낯선 학교에 와요. 얼마나 떨렸을까요? = 지문 3번</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">(A)-4 All students</div><div class=\"k\">모든 학생들이</div></div><div class=\"rc\"><div class=\"e\">started going to their classes.</div><div class=\"k\">각자의 교실로 가기 시작했다.</div></div><div class=\"rnat\">(A)-4 모든 학생들이 그들의 교실로 가기 시작했다.</div><div class=\"rst\">종이 치자 다들 자기 교실로 우르르 가요. = 지문 4번</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">(A)-5 She also made it to her classroom</div><div class=\"k\">그녀 (= Anna)도 교실에 도착했다</div></div><div class=\"rc\"><div class=\"e\">after asking fellow students</div><div class=\"k\">동료 학생들에게 물어본 후에</div></div><div class=\"rc\"><div class=\"e\">for directions.</div><div class=\"k\">길을(방향을).</div></div><div class=\"rnat\">(A)-5 동료 학생들에게 방향을 물어본 후에 그녀도 교실에 도착했다.</div><div class=\"rst\">Anna(애나)는 길을 물어물어 겨우 교실에 도착해요. = 지문 5번</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">(D)-1 Upon seeing Anna's simple clothing</div><div class=\"k\">Anna의 소박한 옷차림을 보자마자</div></div><div class=\"rc\"><div class=\"e\">and knowing (d) she</div><div class=\"k\">그리고 (d) 그녀가 (= Anna)</div></div><div class=\"rc\"><div class=\"e\">was from a small village,</div><div class=\"k\">작은 마을 출신이라는 것을 알고,</div></div><div class=\"rc\"><div class=\"e\">some students in the classroom</div><div class=\"k\">교실의 몇몇 학생들은</div></div><div class=\"rc\"><div class=\"e\">started making fun of her.</div><div class=\"k\">그녀 (= Anna)를 놀리기 시작했다.</div></div><div class=\"rnat\">(D)-1 Anna의 소박한 옷차림을 보고 (d)그녀(Anna)가 작은 마을 출신이라는 것을 알자마자, 교실의 몇몇 학생들은 그녀를 놀리기 시작했다.</div><div class=\"rst\">그런데 교실에 들어서자마자 옷차림을 보고 몇몇 아이들이 놀려요. = 지문 6번</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">(D)-2 Ms. Taylor,</div><div class=\"k\">Taylor 선생님이,</div></div><div class=\"rc\"><div class=\"e\">Anna's new homeroom teacher,</div><div class=\"k\">Anna의 새 담임교사인,</div></div><div class=\"rc\"><div class=\"e\">soon arrived</div><div class=\"k\">곧 도착했고</div></div><div class=\"rc\"><div class=\"e\">and introduced (e) her</div><div class=\"k\">그리고 (e) 그녀를 (= Anna) 소개했다</div></div><div class=\"rc\"><div class=\"e\">to the class</div><div class=\"k\">학급에</div></div><div class=\"rc\"><div class=\"e\">and said that she</div><div class=\"k\">그리고 말했다 그녀가 (= Anna)</div></div><div class=\"rc\"><div class=\"e\">would be studying with them.</div><div class=\"k\">그들과 함께 공부할 것이라고.</div></div><div class=\"rnat\">(D)-2 Anna의 새 담임교사인 Taylor 선생님이 곧 도착했고, (e)그녀(Anna)를 학급에 소개하며 그녀가 그들과 함께 공부할 것이라고 말했다.</div><div class=\"rst\">곧 담임 Taylor(테일러) 선생님이 와서 새 친구라고 소개해 줘요. = 지문 7번</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">(D)-3 Then the teacher</div><div class=\"k\">그러고 나서 선생님은 (= Taylor 선생님)</div></div><div class=\"rc\"><div class=\"e\">told the students</div><div class=\"k\">학생들에게 말했다</div></div><div class=\"rc\"><div class=\"e\">to be ready</div><div class=\"k\">준비하라고</div></div><div class=\"rc\"><div class=\"e\">for the surprise test now!</div><div class=\"k\">지금 바로 깜짝 시험을!</div></div><div class=\"rnat\">(D)-3 그러고 나서 선생님은 학생들에게 이제 깜짝 시험을 준비하라고 말했다!</div><div class=\"rst\">그러더니 “지금 <b>깜짝 시험</b> 볼 거예요!” 하세요. = 지문 8번 → ⑤ 일치</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">(D)-4 She</div><div class=\"k\">그녀는 (= Taylor 선생님)</div></div><div class=\"rc\"><div class=\"e\">told everyone</div><div class=\"k\">모두에게 말했다</div></div><div class=\"rc\"><div class=\"e\">to write down</div><div class=\"k\">적으라고</div></div><div class=\"rc\"><div class=\"e\">the Seven Wonders of the world.</div><div class=\"k\">세계의 7대 불가사의를.</div></div><div class=\"rnat\">(D)-4 그녀는 모든 학생들에게 세계의 7대 불가사의를 쓰라고 말했다.</div><div class=\"rst\">문제는 하나, 세계 7대 불가사의를 쓰는 거예요. = 지문 9번</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">(D)-5 Everyone started writing the answer</div><div class=\"k\">모두가 답을 쓰기 시작했다</div></div><div class=\"rc\"><div class=\"e\">to the unexpected test</div><div class=\"k\">예상하지 못한 시험에 대한</div></div><div class=\"rc\"><div class=\"e\">quickly.</div><div class=\"k\">빠르게.</div></div><div class=\"rnat\">(D)-5 예상하지 못한 시험에 모든 학생들은 빠르게 답을 쓰기 시작했다.</div><div class=\"rst\">다들 <b>예상 못 한 시험</b>인데도 후다닥 답을 쓰기 시작해요. = 지문 10번 → ⑤ 일치</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">(B)-1 When everyone except Anna</div><div class=\"k\">Anna를 제외한 모두가</div></div><div class=\"rc\"><div class=\"e\">had submitted their answer papers,</div><div class=\"k\">답안지를 제출했을 때,</div></div><div class=\"rc\"><div class=\"e\">Ms. Taylor told (b) her,</div><div class=\"k\">Taylor 선생님은 (b) 그녀(= Anna)에게 말했다,</div></div><div class=\"rc\"><div class=\"e\">“Dear, write down what you know.</div><div class=\"k\">“얘야, 네가 아는 것을 쓰렴.</div></div><div class=\"rnat\">(B)-1 Anna를 제외한 모든 학생들이 답안지를 제출했을 때, Taylor 선생님은 (b)그녀(Anna)에게 “얘야, 네가 아는 것을 쓰렴.</div><div class=\"rst\">Anna(애나)<b>만 빼고</b> 모두 답안지를 냈어요. 선생님이 “아는 걸 쓰렴.” 하세요. = 지문 11번 → ② 근거</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><div class=\"rc\"><div class=\"e\">(B)-2 It's fine.”</div><div class=\"k\">괜찮단다.”</div></div><div class=\"rnat\">(B)-2 괜찮단다.”라고 말했다.</div><div class=\"rst\">“괜찮단다.” 선생님이 다정하게 기다려 줘요. = 지문 12번</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">13번</span><div class=\"rc\"><div class=\"e\">(B)-3 Anna said,</div><div class=\"k\">Anna는 말했다,</div></div><div class=\"rc\"><div class=\"e\">“I was thinking</div><div class=\"k\">“저는 생각하고 있었어요</div></div><div class=\"rc\"><div class=\"e\">that there are so many things.</div><div class=\"k\">너무 많은 것들이 있다고.</div></div><div class=\"rnat\">(B)-3 Anna는 “저는 너무 많은 것들이 있다고 생각하고 있었어요.</div><div class=\"rst\">Anna(애나)는 “쓸 게 너무 많다고 생각했어요.” 하고 말해요. = 지문 13번</div></div><div class=\"rds\" data-ord=\"14\"><span class=\"rn\">14번</span><div class=\"rc\"><div class=\"e\">(B)-4 I don't know</div><div class=\"k\">저는 모르겠어요</div></div><div class=\"rc\"><div class=\"e\">which seven I can pick to write.”</div><div class=\"k\">어떤 일곱 가지를 골라서 써야 할지.”</div></div><div class=\"rnat\">(B)-4 어떤 일곱 가지를 골라서 써야 할지 모르겠어요.”라고 말했다.</div><div class=\"rst\">“어떤 일곱 개를 골라야 할지 모르겠어요.” = 지문 14번, 그래서 늦어진 거예요.</div></div><div class=\"rds\" data-ord=\"15\"><span class=\"rn\">15번</span><div class=\"rc\"><div class=\"e\">(B)-5 Eventually,</div><div class=\"k\">마침내,</div></div><div class=\"rc\"><div class=\"e\">she</div><div class=\"k\">그녀는 (= Anna)</div></div><div class=\"rc\"><div class=\"e\">handed her answer paper</div><div class=\"k\">그녀의 답안지를 건넸다</div></div><div class=\"rc\"><div class=\"e\">to Ms. Taylor.</div><div class=\"k\">Taylor 선생님께.</div></div><div class=\"rnat\">(B)-5 마침내, 그녀는 Taylor 선생님께 그녀의 답안지를 제출했다.</div><div class=\"rst\"><b>마침내</b> Anna(애나)도 답안지를 내요. 반에서 맨 마지막이에요. = 지문 15번 → ② 일치</div></div><div class=\"rds\" data-ord=\"16\"><span class=\"rn\">16번</span><div class=\"rc\"><div class=\"e\">(B)-6 The teacher started reading</div><div class=\"k\">선생님은 읽기 시작했다</div></div><div class=\"rc\"><div class=\"e\">her students' answers aloud</div><div class=\"k\">그녀의 학생들의 답을 소리 내어</div></div><div class=\"rc\"><div class=\"e\">and the majority had answered them correctly</div><div class=\"k\">그리고 대부분은 올바르게 답했다</div></div><div class=\"rc\"><div class=\"e\">such as The Great Wall of China, Colosseum, Stonehenge, etc.</div><div class=\"k\">중국의 만리장성, 콜로세움, 스톤헨지 등과 같이.</div></div><div class=\"rnat\">(B)-6 선생님은 그녀의 학생들의 답을 소리 내어 읽기 시작했고 대부분은 중국의 만리장성, 콜로세움, 스톤헨지 등과 같이 올바르게 답했다.</div><div class=\"rst\">선생님이 답을 <b>소리 내어 읽어</b> 줘요. 대부분 만리장성, 콜로세움처럼 정답이었어요. = 지문 16번 → ③ 일치</div></div><div class=\"rds\" data-ord=\"17\"><span class=\"rn\">17번</span><div class=\"rc\"><div class=\"e\">(C)-1 At last</div><div class=\"k\">마침내</div></div><div class=\"rc\"><div class=\"e\">Ms. Taylor picked up Anna's answer paper</div><div class=\"k\">Taylor 선생님은 Anna의 답안지를 집어 들었고</div></div><div class=\"rc\"><div class=\"e\">and started reading.</div><div class=\"k\">읽기 시작했다.</div></div><div class=\"rnat\">(C)-1 마침내, Taylor 선생님은 Anna의 답안지를 집어 들었고 읽기 시작했다.</div><div class=\"rst\">마지막으로 Anna(애나)의 답안지를 집어 들어요. = 지문 17번</div></div><div class=\"rds\" data-ord=\"18\"><span class=\"rn\">18번</span><div class=\"rc\"><div class=\"e\">(C)-2 “The Seven Wonders are —</div><div class=\"k\">“7대 불가사의는 —</div></div><div class=\"rc\"><div class=\"e\">To be able to See, To be able to Hear, To be able to Feel,</div><div class=\"k\">볼 수 있다는 것, 들을 수 있다는 것, 느낄 수 있다는 것,</div></div><div class=\"rc\"><div class=\"e\">To Laugh, To Think, To be Kind, To Love!”</div><div class=\"k\">웃는 것, 생각하는 것, 친절한 것, 사랑하는 것입니다!”</div></div><div class=\"rnat\">(C)-2 “7대 불가사의는 볼 수 있다는 것, 들을 수 있다는 것, 느낄 수 있다는 것, 웃는 것, 생각하는 것, 친절한 것, 사랑하는 것입니다!”</div><div class=\"rst\">답은 “보고, 듣고, 느끼고, 웃고, 생각하고, 친절하고, 사랑하는 것!” = 지문 18번</div></div><div class=\"rds key\" data-ord=\"19\"><span class=\"rn\">19번 · 단서</span><div class=\"rc\"><div class=\"e\">(C)-3 After reading Anna's answer,</div><div class=\"k\">Anna의 답을 읽고 나서,</div></div><div class=\"rc\"><div class=\"e\">(c) she</div><div class=\"k\">(c) 그녀 (= Ms. Taylor)</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">was touched</span></div><div class=\"k\"><span class=\"cw\">감동받았고</span></div></div><div class=\"rc\"><div class=\"e\">and all her students</div><div class=\"k\">그리고 그녀의 모든 학생들도</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">were also deeply moved</span>.</div><div class=\"k\"><span class=\"cw\">또한 매우 감동받았다</span>.</div></div><div class=\"rnat\">(C)-3 Anna의 답을 읽고 나서, (c)그녀(Ms. Taylor)는 감동받았고 그녀의 모든 학생들도 매우 감동받았다.</div><div class=\"rst\">선생님도 반 아이들도 실망은커녕 <b>깊이 감동</b>받아요. = 지문 19번 → ④의 ‘실망’과 정반대</div></div><div class=\"rds\" data-ord=\"20\"><span class=\"rn\">20번</span><div class=\"rc\"><div class=\"e\">(C)-4 Today,</div><div class=\"k\">오늘,</div></div><div class=\"rc\"><div class=\"e\">a girl from a small village</div><div class=\"k\">작은 마을에서 온 한 소녀가</div></div><div class=\"rc\"><div class=\"e\">reminded them</div><div class=\"k\">그들에게 (= 선생님과 학생들) 상기시켜 주었다</div></div><div class=\"rc\"><div class=\"e\">about the precious gifts,</div><div class=\"k\">소중한 선물들에 대해,</div></div><div class=\"rc\"><div class=\"e\">truly a wonder,</div><div class=\"k\">진짜 불가사의인,</div></div><div class=\"rc\"><div class=\"e\">which</div><div class=\"k\">그것들 (= 소중한 선물들)은</div></div><div class=\"rc\"><div class=\"e\">they already knew but easily forgot.</div><div class=\"k\">그들이 이미 알고 있었지만 쉽게 잊어버렸던.</div></div><div class=\"rnat\">(C)-4 오늘, 작은 마을에서 온 한 소녀가 그들에게 진짜 불가사의인, 그들이 이미 알고 있었지만 쉽게 잊어버렸던 소중한 선물에 대해 상기시켜 주었다.</div><div class=\"rst\">놀림받던 시골 아이가, 늘 갖고 있어서 잊고 지낸 <b>소중한 선물</b>을 깨우쳐 줬어요. = 지문 20번</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"transfer\" data-m=\"전학하다\"><b>transfer</b>전학하다</button><button type=\"button\" class=\"wdb\" data-w=\"submit\" data-m=\"제출하다\"><b>submit</b>제출하다</button><button type=\"button\" class=\"wdb\" data-w=\"unexpected\" data-m=\"예상치 못한\"><b>unexpected</b>예상치 못한</button><button type=\"button\" class=\"wdb\" data-w=\"deeply moved\" data-m=\"깊이 감동받은\"><b>deeply moved</b>깊이 감동받은</button><button type=\"button\" class=\"wdb\" data-w=\"remind\" data-m=\"상기시키다, 깨우쳐 주다\"><b>remind</b>상기시키다, 깨우쳐 주다</button><button type=\"button\" class=\"wdb\" data-w=\"precious\" data-m=\"소중한\"><b>precious</b>소중한</button></div>"};
