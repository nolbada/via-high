var EXP={"01": "<p class=\"mtr\">마더텅 정답률 <b>85%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">목적 문제는 <b>However(하지만)</b> 뒤에 진짜 용건이 나와요. 2번의 “기사가 옳았다”는 인정은 쿠션이고, 3번의 <b>far from the truth(사실과 거리가 멀다)</b>와 8번의 <b>contrary to(~와는 반대로)</b>가 이의 제기라는 목적을 보여 줘요.</p><div class=\"ck-step\"><span class=\"lab\">2번 문장 · 먼저 인정하는 쿠션</span><div class=\"en\">Your recent article on air pollution, … was essentially correct.</div><p class=\"ko\">귀사의 공기 오염에 관한 최근 기사는, … 본질적으로 옳았습니다.</p></div><div class=\"ck-via\"><i>▼</i><span>However(하지만)로 방향이 꺾이며 기사가 준 인상을 반박해요</span></div><div class=\"ck-step key\"><span class=\"lab\">3번 문장 · 결정적 단서</span><div class=\"en\"><mark>However</mark>, it may have given the impression that Fresno is unlivable, which is <mark>far from the truth</mark>.</div><p class=\"ko\"><mark>하지만</mark> 그것은 프레즈노가 (사람이) 살 수 없는 곳이라는 인상을 주었을 것 같은데, 이는 <mark>사실과 거리가 멉니다</mark>.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>4번</em>50만 명의 시민이 살아 숨 쉬는 도시</span><span><em>5번</em>우리 모두가 고통받고 있지는 않음</span><span><em>6번</em>은퇴 나이가 지났어도 매일 자전거를 타도 탈이 없음</span><span><em>7번</em>국립공원·산악 호수·바다가 가까움</span></div><div class=\"ck-eq\">⇒ 4~7번의 공통점 = “살 수 없는 곳”이 아니라는 반박 근거</div></div><div class=\"ck-via\"><i>▼</i><span>So(따라서)로 반박 근거를 묶어 기사의 인상과 반대라고 못 박아요</span></div><div class=\"ck-step key\"><span class=\"lab\">8번 문장 · 이의 제기로 마무리</span><div class=\"en\">So <mark>contrary to the impression left by some writers</mark>, we Fresnans are <mark>not all suffering</mark> in some hell hole.</div><p class=\"ko\">따라서 <mark>몇몇 필자들이 남긴 인상과는 반대로</mark>, 우리 프레즈노 주민들이 지옥 구덩이에서 <mark>모두 고통받고 있는 것은 아닙니다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">잡지에 실린 기사 내용에 이의를 제기하려고<small>3번에서 기사가 준 인상이 사실과 거리가 멀다고 하고, 8번에서 그 인상과 반대라고 반박해요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">도시 공기 오염의 심각성을 알리려고</span><span class=\"why\">[반대] 공기 오염(air pollution)이 2번에 나오지만, 글쓴이는 오히려 5번·8번에서 “우리 모두가 고통받는 건 아니다”라며 심각하다는 인상을 반박해요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">최신호 잡지의 내용을 소개하려고</span><span class=\"why\">[범위 좁음] 2번에서 최근 기사를 꺼내긴 하지만 소개가 목적이 아니에요. 3번 However(하지만) 뒤에서 그 기사의 인상을 반박하는 게 진짜 용건이에요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">국립공원의 관리 소홀을 지적하려고</span><span class=\"why\">[지문에 없음] 7번의 국립공원은 프레즈노에서 가까워 살기 좋다는 자랑이에요. 관리가 소홀하다는 말은 한 번도 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">정기구독자를 위한 할인 혜택을 요구하려고</span><span class=\"why\">[지문에 없음] 1번의 subscriber(구독자) 15년은 자기소개일 뿐이에요. 할인을 요구하는 문장은 없어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">I have been a subscriber</div><div class=\"k\">나는 정기구독자였습니다</div></div><div class=\"rc\"><div class=\"e\">to your magazine</div><div class=\"k\">귀사의 잡지의</div></div><div class=\"rc\"><div class=\"e\">for about 15 years.</div><div class=\"k\">약 15년 동안.</div></div><div class=\"rnat\">나는 약 15년 동안 귀사의 잡지의 정기구독자였습니다.</div><div class=\"rst\">학교 신문을 오래 꼬박꼬박 봐 온 학생이 신문부에 편지를 써요. = 지문 1번, 글쓴이도 15년 동안 잡지를 구독해 왔다고 소개해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Your recent article on air pollution,</div><div class=\"k\">귀사의 공기 오염에 관한 최근 기사는,</div></div><div class=\"rc\"><div class=\"e\">which mentioned Fresno</div><div class=\"k\">프레즈노를 언급했던</div></div><div class=\"rc\"><div class=\"e\">in the San Joaquin Valley of California,</div><div class=\"k\">캘리포니아의 산 호아킨 밸리에 있는,</div></div><div class=\"rc\"><div class=\"e\">was essentially correct.</div><div class=\"k\">본질적으로 옳았습니다.</div></div><div class=\"rnat\">캘리포니아의 산 호아킨 밸리에 있는 프레즈노를 언급했던, 귀사의 공기 오염에 관한 최근 기사는 본질적으로 옳았습니다.</div><div class=\"rst\">“지난번 우리 반 기사, 대체로 맞는 말이었어요.” 먼저 인정해요. = 지문 2번, 공기 오염 기사가 <b>본질적으로 옳았다</b>고 해요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">However</span>,</div><div class=\"k\"><span class=\"cw\">하지만</span></div></div><div class=\"rc\"><div class=\"e\">it may have given the impression</div><div class=\"k\">그것은 인상을 주었을 것 같은데,</div></div><div class=\"rc\"><div class=\"e\">that Fresno is unlivable,</div><div class=\"k\">프레즈노가 (사람이) 살 수 없는 곳이라는,</div></div><div class=\"rc ckc\"><div class=\"e\">which is <span class=\"cw\">far from the truth</span>.</div><div class=\"k\">이는 <span class=\"cw\">사실과 거리가 멉니다</span>.</div></div><div class=\"rnat\">하지만 그것은 프레즈노가 (사람이) 살 수 없는 곳이라는 인상을 주었을 것 같은데, 이는 사실과 거리가 멉니다.</div><div class=\"rst\"><b>하지만</b>(However) 그 기사만 보면 우리 반이 엉망인 반 같대요. = 지문 3번, 살 수 없는 곳이라는 인상은 <b>사실과 거리가 멀다</b>는 용건이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">The city is home to 500,000 living, breathing citizens,</div><div class=\"k\">그 도시는 50만 명의 살아 숨 쉬는 시민들의 집이며,</div></div><div class=\"rc\"><div class=\"e\">and the county</div><div class=\"k\">그리고 카운티에는</div></div><div class=\"rc\"><div class=\"e\">some 900,000 souls.</div><div class=\"k\">약 90만 명의 사람들이 있습니다.</div></div><div class=\"rnat\">그 도시는 50만 명의 살아 숨 쉬는 시민들의 집이며, 카운티에는 약 90만 명의 사람들이 있습니다(약 90만 명이 살아갑니다).</div><div class=\"rst\">“우리 반엔 잘 지내는 친구들이 아주 많아요.” = 지문 4번, 그 도시엔 50만 명의 시민이 살아 숨 쉰다는 반박 근거예요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">We are not all suffering.</div><div class=\"k\">우리 모두가 (공기 오염으로) 고통을 겪고 있지는 않습니다.</div></div><div class=\"rnat\">우리 모두가 (공기 오염으로) 고통을 겪고 있지는 않습니다.</div><div class=\"rst\">“우리 모두가 힘들어하는 건 아니에요.” = 지문 5번, 모두가 공기 오염으로 고통받고 있지는 않다는 말이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">I ride my bike nearly every day</div><div class=\"k\">나는 거의 매일 자전거를 탑니다</div></div><div class=\"rc\"><div class=\"e\">and have yet to suffer any ill effects</div><div class=\"k\">그리고 아직까지 어떠한 안 좋은 영향도 겪고 있지 않습니다</div></div><div class=\"rc\"><div class=\"e\">despite being well beyond retirement age.</div><div class=\"k\">은퇴 연령이 훨씬 지났음에도.</div></div><div class=\"rnat\">나는 은퇴 연령이 훨씬 지났음에도 거의 매일 자전거를 타며, 아직까지 어떠한 안 좋은 영향도 겪고 있지 않습니다.</div><div class=\"rst\">“나도 매일 운동장을 뛰는데 아무렇지 않아요.” = 지문 6번, 은퇴 나이가 지난 글쓴이도 거의 매일 자전거를 타도 탈이 없대요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">We are close to Yosemite and Sequoia national parks,</div><div class=\"k\">우리는 요세미티 국립공원과 세쿼이아 국립공원,</div></div><div class=\"rc\"><div class=\"e\">a number of mountain lakes and rivers,</div><div class=\"k\">수많은 산악 호수와 강에 가까우며,</div></div><div class=\"rc\"><div class=\"e\">and the Pacific Ocean is easily accessible.</div><div class=\"k\">태평양에 쉽게 접근할 수 있습니다.</div></div><div class=\"rnat\">우리는 요세미티 국립공원과 세쿼이아 국립공원, 수많은 산악 호수와 강에 가까우며, 태평양에 쉽게 접근할 수 있습니다.</div><div class=\"rst\">“우리 반 바로 옆엔 도서관과 운동장도 있어요.” = 지문 7번, 국립공원·호수·바다가 가깝다는 자랑도 반박 근거예요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">So <span class=\"cw\">contrary to the impression left by some writers</span>,</div><div class=\"k\">따라서 <span class=\"cw\">몇몇 필자들이 남긴 인상과는 반대로</span>,</div></div><div class=\"rc ckc\"><div class=\"e\">we Fresnans are <span class=\"cw\">not all suffering</span></div><div class=\"k\">우리 Fresnans(프레즈노 주민들)이 <span class=\"cw\">모두 고통받고 있는 것은 아닙니다</span></div></div><div class=\"rc\"><div class=\"e\">in some hell hole.</div><div class=\"k\">지옥 구덩이에서.</div></div><div class=\"rnat\">따라서 몇몇 필자들에 의해 남겨진 인상과는 반대로, 우리 프레즈노 주민들이 모두 지옥 구덩이에서 고통받고 있는 것은 아닙니다.</div><div class=\"rst\"><b>그래서</b>(So) “기사의 인상과 달리 우리 반은 엉망이 아니에요”로 끝내요. = 지문 8번, 필자들이 남긴 인상과 <b>반대로</b>(contrary to)라는 이의 제기예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"subscriber\" data-m=\"구독자\"><b>subscriber</b>구독자</button><button type=\"button\" class=\"wdb\" data-w=\"essentially\" data-m=\"본질적으로\"><b>essentially</b>본질적으로</button><button type=\"button\" class=\"wdb\" data-w=\"impression\" data-m=\"인상\"><b>impression</b>인상</button><button type=\"button\" class=\"wdb\" data-w=\"unlivable\" data-m=\"살기 힘든, 살 수 없는\"><b>unlivable</b>살기 힘든, 살 수 없는</button><button type=\"button\" class=\"wdb\" data-w=\"far from\" data-m=\"결코 ~이 아닌, ~와 거리가 먼\"><b>far from</b>결코 ~이 아닌, ~와 거리가 먼</button><button type=\"button\" class=\"wdb\" data-w=\"contrary to\" data-m=\"~와는 반대로\"><b>contrary to</b>~와는 반대로</button></div>", "02": "<p class=\"mtr\">마더텅 정답률 <b>75%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">주제는 <b>But(그러나)</b> 뒤에 있어요. 1번의 “재생 에너지는 좋다”를 2번이 뒤집고, 4~6번이 <b>impact on the environment(환경에 미치는 영향)</b>를 하나씩 보여 주는 <b>사례</b>예요.</p><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 일반적인 생각</span><div class=\"en\">The use of renewable sources of energy … has increasingly been encouraged as a way to harmonize … with environmental protection objectives.</div><p class=\"ko\">재생 가능한 에너지 자원의 사용은 … 환경 보호의 목적과 조화시키기 위한 방법으로 점점 더 장려되어 왔다.</p></div><div class=\"ck-via\"><i>▼</i><span>But(그러나)으로 방향이 꺾여 “좋은 점” 대신 “따르는 결과”를 말해요</span></div><div class=\"ck-step key\"><span class=\"lab\">2번 문장 · 결정적 주제</span><div class=\"en\"><mark>But</mark> the use of renewable sources also comes with <mark>its own consequences</mark>, which require consideration.</div><p class=\"ko\"><mark>그러나</mark> 재생 가능한 자원의 사용은 또한 <mark>저마다의 결과를</mark> 수반하는데, 이것은 고려를 필요로 한다.</p></div><div class=\"ck-via\"><i>▼</i><span>2번의 consequences(결과)가 무엇인지 환경 영향으로 콕 집어요</span></div><div class=\"ck-step\"><span class=\"lab\">4번 문장 · 결과 = 환경 영향</span><div class=\"en\">Additionally, solar, wind, geothermal and biomass renewable sources <mark>also have their own impact on the environment</mark>.</div><p class=\"ko\">게다가, 태양열, 풍력, 지열, 그리고 바이오매스와 같은 재생 가능한 자원들은 <mark>또한 저마다 환경에 영향을 미친다</mark>.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>5번</em>수력 발전 댐 → 물속 생태계 영향 + 온실가스 배출원</span><span><em>6번</em>풍력·태양열·바이오매스 → 시각 공해·토지 점유·새 개체 수 피해</span></div><div class=\"ck-eq\">⇒ 두 사례의 공통점 = 재생 에너지도 환경에 부작용이 있다 (2·4번과 같은 말)</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">environmental side effects of using renewable energy sources 재생 가능한 에너지원 사용의 환경적 부작용<small>2번의 consequences(결과)와 4번의 impact on the environment(환경에 미치는 영향)를 합친 말이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">negative impacts of the use of traditional energy sources 전통적 에너지원 사용의 부정적 영향</span><span class=\"why\">[지문에 없음] 6번의 negative(부정적인) impacts(영향)를 그대로 따온 함정이에요. 지문은 traditional(전통적인) 에너지가 아니라 renewable(재생 가능한) 에너지의 부작용을 말해요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">practical methods to meet increasing demand for electricity 늘어나는 전력 수요를 충족하는 실용적 방법</span><span class=\"why\">[지문에 없음] 1번에 전력 공급 확보가 나오지만 배경일 뿐이에요. 수요를 채우는 방법은 한 번도 안 나와요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">numerous ways to obtain renewable sources of energy 재생 가능한 에너지원을 얻는 수많은 방법</span><span class=\"why\">[지문에 없음] 3·4번에서 수력·태양열·풍력 같은 종류를 늘어놓는 건 부작용을 말하려는 준비예요. 얻는 방법을 설명하는 글이 아니에요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">effective procedures to reduce greenhouse emissions 온실가스 배출을 줄이는 효과적인 절차</span><span class=\"why\">[반대] 5번의 greenhouse emissions(온실가스 배출)는 줄이는 방법이 아니라, 댐이 오히려 배출원이라는 부작용 사례예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">The use of renewable sources of energy</div><div class=\"k\">재생 가능한 에너지 자원의 사용은</div></div><div class=\"rc\"><div class=\"e\">to produce electricity</div><div class=\"k\">전력을 생산하기 위한</div></div><div class=\"rc\"><div class=\"e\">has increasingly been encouraged</div><div class=\"k\">점점 더 장려되어 왔다</div></div><div class=\"rc\"><div class=\"e\">as a way to harmonize</div><div class=\"k\">조화시키기 위한 방법으로</div></div><div class=\"rc\"><div class=\"e\">the need to secure electricity supply</div><div class=\"k\">전력 공급을 확보할 필요성을</div></div><div class=\"rc\"><div class=\"e\">with environmental protection objectives.</div><div class=\"k\">환경 보호의 목적과.</div></div><div class=\"rnat\">전기를 생산하기 위해 재생 가능한 에너지원을 사용하는 것은 전력 공급을 확보해야 할 필요성과 환경 보호라는 목표를 조화시키는 방법으로 점점 더 장려되어 왔다.</div><div class=\"rst\">학교에서 플라스틱 대신 종이 빨대·에코백 같은 친환경 물건을 쓰자고 해요. = 지문 1번, 재생 에너지도 환경 보호 방법으로 장려돼 왔어요.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">2번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">But</span> the use of renewable sources</div><div class=\"k\"><span class=\"cw\">그러나</span> 재생 가능한 자원의 사용은</div></div><div class=\"rc ckc\"><div class=\"e\">also comes with <span class=\"cw\">its own consequences</span>,</div><div class=\"k\">또한 <span class=\"cw\">저마다의 결과를</span> 수반하는데,</div></div><div class=\"rc\"><div class=\"e\">which require consideration.</div><div class=\"k\">이것은 고려를 필요로 한다.</div></div><div class=\"rnat\">하지만 재생 가능한 에너지원의 사용에도 나름의 결과가 따르며, 이는 고려가 필요하다.</div><div class=\"rst\"><b>그런데</b>(But) 친환경 물건도 대가가 따르니 따져 봐야 해요. = 지문 2번 주제, 재생 에너지에도 <b>저마다의 결과</b>가 따른다는 말이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Renewable sources of energy include</div><div class=\"k\">재생 가능한 에너지 자원은 포함한다</div></div><div class=\"rc\"><div class=\"e\">a variety of sources</div><div class=\"k\">다양한 자원을</div></div><div class=\"rc\"><div class=\"e\">such as hydropower and ocean-based technologies.</div><div class=\"k\">수력 발전과 해양 기반 기술처럼.</div></div><div class=\"rnat\">재생 가능한 에너지원에는 수력 발전과 해양 기반 기술처럼 다양한 자원이 포함된다.</div><div class=\"rst\">친환경 물건엔 종이 빨대, 대나무 칫솔 등 종류가 많아요. = 지문 3번, 재생 에너지에도 수력 발전·해양 기술 등 여러 종류가 있어요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">Additionally,</div><div class=\"k\">게다가,</div></div><div class=\"rc\"><div class=\"e\">solar, wind, geothermal and biomass renewable sources</div><div class=\"k\">태양열, 풍력, 지열, 그리고 바이오매스(에너지로 사용 가능한 생물체)와 같은 재생 가능한 자원들은</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">also have their own impact on the environment</span>.</div><div class=\"k\"><span class=\"cw\">또한 저마다 환경에 영향을 미친다</span>.</div></div><div class=\"rnat\">게다가 태양열, 풍력, 지열, 바이오매스 같은 재생 가능한 에너지원들도 저마다 환경에 영향을 미친다.</div><div class=\"rst\"><b>게다가</b>(Additionally) 그 물건들도 하나하나 환경에 흔적을 남겨요. = 지문 4번, 태양열·풍력 등도 <b>저마다 환경에 영향을 미친다</b>는 말이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Hydropower dams, for example,</div><div class=\"k\">예를 들어, 수력 발전 댐은</div></div><div class=\"rc\"><div class=\"e\">have an impact on aquatic ecosystems</div><div class=\"k\">물속 생태계에 영향을 미치며,</div></div><div class=\"rc\"><div class=\"e\">and, more recently,</div><div class=\"k\">그리고 더 최근에는</div></div><div class=\"rc\"><div class=\"e\">have been identified as significant sources of greenhouse emissions.</div><div class=\"k\">온실가스 배출의 중요한 원인으로 확인되었다.</div></div><div class=\"rnat\">예를 들어, 수력 발전 댐은 수중 생태계에 영향을 미치며, 최근에는 온실가스의 주요 배출원으로도 확인되었다.</div><div class=\"rst\">예를 들어 종이 빨대를 만들려면 나무를 베야 해요. = 지문 5번, 수력 발전 댐이 물속 생태계를 바꾸고 온실가스도 내뿜는 사례예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Wind, solar, and biomass also cause</div><div class=\"k\">풍력, 태양열, 그리고 바이오매스는 또한 야기한다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">negative environmental impacts</span>,</div><div class=\"k\"><span class=\"cw\">부정적인 환경적 영향을</span>,</div></div><div class=\"rc\"><div class=\"e\">such as visual pollution, intensive land occupation and negative effects on bird populations.</div><div class=\"k\">시각 공해, 집약적인 토지 점유, 그리고 조류 개체 수에 미치는 부정적인 영향과 같은.</div></div><div class=\"rnat\">풍력, 태양열, 바이오매스 역시 시각 공해, 집약적인 토지 점유, 조류 개체 수에 미치는 부정적인 영향과 같은 부정적인 환경적 영향을 일으킨다.</div><div class=\"rst\">에코백도 너무 많이 만들면 오히려 자원이 낭비돼요. = 지문 6번, 풍력·태양열도 경치를 해치고 땅을 차지하고 새들에게 해를 줘요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"renewable\" data-m=\"재생 가능한\"><b>renewable</b>재생 가능한</button><button type=\"button\" class=\"wdb\" data-w=\"harmonize\" data-m=\"조화시키다\"><b>harmonize</b>조화시키다</button><button type=\"button\" class=\"wdb\" data-w=\"consequence\" data-m=\"결과\"><b>consequence</b>결과</button><button type=\"button\" class=\"wdb\" data-w=\"hydropower\" data-m=\"수력 발전\"><b>hydropower</b>수력 발전</button><button type=\"button\" class=\"wdb\" data-w=\"aquatic ecosystem\" data-m=\"수중 생태계\"><b>aquatic ecosystem</b>수중 생태계</button><button type=\"button\" class=\"wdb\" data-w=\"greenhouse emission\" data-m=\"온실가스 배출\"><b>greenhouse emission</b>온실가스 배출</button></div>", "03": "<p class=\"mtr\">마더텅 정답률 <b>80%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">제목은 <b>첫 문장의 문제 제기</b>와 <b>마지막 결론 문장</b>을 묶어서 찾으세요. 1번 과잉보호가 <b>natural consequences(자연적 결과)</b>를 막는다 → 6번 그 자연적 결과가 아이를 어른으로 <b>준비시킨다</b>로 닫혀요.</p><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 문제 제기</span><div class=\"en\">Overprotective parents <mark>spare kids from all natural consequences</mark>.</div><p class=\"ko\">과잉보호하는 부모들은 <mark>아이들이 모든 자연적 결과를 겪지 않게 한다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>Unfortunately(불행하게도) 뒤로, 결과를 못 겪은 아이가 무엇을 잃는지 나와요</span></div><div class=\"ck-step\"><span class=\"lab\">3번 문장 · 그래서 생기는 손해</span><div class=\"en\"><mark>They never learn</mark> how to bounce back from failure or how to recover from mistakes because their parents prevented them from making poor choices.</div><p class=\"ko\">부모가 안 좋은 선택을 하지 못하게 막았기 때문에, 실패를 딛고 일어서는 방법이나 실수로부터 회복하는 방법을 <mark>그들(= 아이들)은 결코 배우지 못한다</mark>.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>4번</em>“추우니까 입자”가 아니라 “엄마가 시키니까 입자”로 배움</span><span><em>5번</em>현실의 결과를 겪을 기회가 없으면 규칙의 이유를 모름</span></div><div class=\"ck-eq\">⇒ 4·5번의 공통점 = 직접 겪어 봐야 진짜 배운다</div></div><div class=\"ck-via\"><i>▼</i><span>앞의 손해를 뒤집어, 자연적 결과가 주는 좋은 점으로 글을 닫아요</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 결정적 결론</span><div class=\"en\"><mark>Natural consequences prepare children for adulthood</mark> by helping them think about the potential consequences of their choices.</div><p class=\"ko\"><mark>자연적 결과는 아이들을 성인기에 준비시킨다</mark>. 아이들이 자기 선택의 잠재적인 결과에 대해 생각하도록 도움으로써.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">Let Natural Consequences Teach Kids 자연적 결과가 아이들을 가르치게 하라<small>1번의 natural consequences(자연적 결과)를 막지 말고, 6번처럼 그것이 아이를 준비시키게 두라는 말이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">The Benefits of Overprotective Parenting 과잉보호 육아의 이점</span><span class=\"why\">[반대] 1번의 Overprotective(과잉보호하는)를 그대로 가져온 함정이에요. 2번 Unfortunately(불행하게도)부터 과잉보호의 손해만 말하니 이점이 아니라 정반대예요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">Dark Sides of the Virtual World 가상 세계의 어두운 면</span><span class=\"why\">[지문에 없음] 가상 세계 얘기는 없어요. 5번은 오히려 real-world(현실 세계의) 결과를 겪어야 한다고 해요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">The More Choices(선택이 많을수록), the More Mistakes(실수도 많다)</span><span class=\"why\">[반대] 3번은 안 좋은 선택을 막으면 실수에서 회복하는 법을 못 배운다고 해요. 선택과 실수를 줄이자는 글이 아니에요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">Listen to Kids to Improve Relationships 관계를 개선하려면 아이 말을 들어라</span><span class=\"why\">[지문에 없음] 아이 말을 들어 주거나 관계를 좋게 하자는 문장은 없어요. 글은 처음부터 끝까지 자연적 결과 이야기예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds key\" data-ord=\"1\"><span class=\"rn\">1번 · 단서</span><div class=\"rc\"><div class=\"e\">Overprotective parents</div><div class=\"k\">과잉보호하는 부모들은</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">spare kids from all natural consequences</span>.</div><div class=\"k\"><span class=\"cw\">아이들이 모든 자연적 결과를 겪지 않게 한다</span>.</div></div><div class=\"rnat\">과잉보호하는 부모들은 아이들이 모든 자연적 결과를 겪지 않게 한다.</div><div class=\"rst\">엄마가 아침마다 내 겉옷과 준비물을 다 챙겨 줘서, 나는 한 번도 추워 본 적이 없어요. = 지문 1번, 과잉보호 부모는 아이가 <b>자연적 결과</b>를 못 겪게 해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Unfortunately,</div><div class=\"k\">불행하게도,</div></div><div class=\"rc\"><div class=\"e\">their kids often lack</div><div class=\"k\">그들(= 부모들)의 아이들은 종종 ~이 없다</div></div><div class=\"rc\"><div class=\"e\">a clear understanding</div><div class=\"k\">명확한 이해가</div></div><div class=\"rc\"><div class=\"e\">of the reasons behind their parents’ rules.</div><div class=\"k\">부모의 규칙 이면의 이유에 대한.</div></div><div class=\"rnat\">불행하게도, 그들(부모들)의 아이들은 종종 부모의 규칙 이면의 이유에 대한 명확한 이해가 없다.</div><div class=\"rst\"><b>불행하게도</b>(Unfortunately) 나는 엄마가 왜 “겉옷 입어!” 하는지 잘 몰라요. = 지문 2번, 아이는 부모 규칙의 이유를 이해하지 못해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">They never learn</span></div><div class=\"k\"><span class=\"cw\">그들(= 아이들)은 결코 배우지 못한다</span></div></div><div class=\"rc\"><div class=\"e\">how to bounce back from failure</div><div class=\"k\">실패를 딛고 일어서는 방법을</div></div><div class=\"rc\"><div class=\"e\">or how to recover from mistakes</div><div class=\"k\">혹은 실수로부터 회복하는 방법을</div></div><div class=\"rc\"><div class=\"e\">because their parents prevented them</div><div class=\"k\">그들의 부모가 그들(= 아이들)을 막았기 때문에</div></div><div class=\"rc\"><div class=\"e\">from making poor choices.</div><div class=\"k\">안 좋은 선택을 하는 것으로부터.</div></div><div class=\"rnat\">부모들이 그들(아이들)이 안 좋은 선택을 하지 못하게(않게) 했기 때문에, 그들(아이들)은 결코 실패를 딛고 일어서거나 실수로부터 회복하는 방법을 배우지 못한다.</div><div class=\"rst\">준비물을 빠뜨려 혼나 본 적이 없으니 실수를 어떻게 수습하는지도 몰라요. = 지문 3번, 아이는 실패에서 일어서는 법을 <b>결코 배우지 못해요</b>.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Rather than learning,</div><div class=\"k\">배우기보다는,</div></div><div class=\"rc\"><div class=\"e\">“I should wear a jacket</div><div class=\"k\">“나는 재킷을 입어야겠다</div></div><div class=\"rc\"><div class=\"e\">because it’s cold outside,”</div><div class=\"k\">밖이 춥기 때문에,”</div></div><div class=\"rc\"><div class=\"e\">a child may conclude,</div><div class=\"k\">아이는 결론을 내릴지도 모른다,</div></div><div class=\"rc\"><div class=\"e\">“I have to wear a jacket</div><div class=\"k\">“나는 재킷을 입어야 한다</div></div><div class=\"rc\"><div class=\"e\">because my mom makes me.”</div><div class=\"k\">엄마가 나에게 (재킷을 입으라고) 시키기 때문에.”</div></div><div class=\"rnat\">아이는 \"밖에 날씨가 추우니까 재킷을 입어야지\"라고 배우기보다는, \"엄마가 나에게 (재킷을 입으라고) 시키니까 재킷을 입어야지\"라고 결론을 내릴지도 모른다.</div><div class=\"rst\">그래서 나는 “추우니까”가 아니라 “엄마가 시키니까” 겉옷을 입어요. = 지문 4번의 재킷 예시 그대로예요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Without an opportunity</div><div class=\"k\">기회가 없다면</div></div><div class=\"rc\"><div class=\"e\">to experience real-world consequences,</div><div class=\"k\">현실 세계의(실제 사회에서 얻는) 결과를 경험할,</div></div><div class=\"rc\"><div class=\"e\">kids don’t always understand</div><div class=\"k\">아이들은 항상 이해하는 것은 아니다</div></div><div class=\"rc\"><div class=\"e\">why their parents make certain rules.</div><div class=\"k\">그들의 부모가 왜 특정한 규칙들을 만드는지.</div></div><div class=\"rnat\">현실 세계의(실제 사회에서 얻는) 결과를 경험할 기회가 없으면, 아이들은 그들의 부모가 왜 특정한 규칙들을 만드는지 항상 이해하는 것은 아니다.</div><div class=\"rst\">직접 추워 보는 경험이 없으니 규칙의 이유를 모르는 거예요. = 지문 5번, 현실의 결과를 겪을 기회가 없으면 규칙을 이해 못 해요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Natural consequences prepare children for adulthood</span></div><div class=\"k\"><span class=\"cw\">자연적 결과는 아이들을 성인기에 준비시킨다</span></div></div><div class=\"rc\"><div class=\"e\">by helping them</div><div class=\"k\">그들을 도움으로써</div></div><div class=\"rc\"><div class=\"e\">think about the potential consequences of their choices.</div><div class=\"k\">그들의 선택의 잠재적인 결과에 대해 생각하도록.</div></div><div class=\"rnat\">자연적 결과는 아이들의 선택의 잠재적인 결과에 대해 생각하도록 도움으로써 그들을 성인기에 준비시킨다(아이들이 성인기에 대비할 수 있도록 해준다).</div><div class=\"rst\">한 번 덜덜 떨어 보면 다음엔 알아서 겉옷을 챙겨요. = 지문 6번 결론, <b>자연적 결과</b>가 아이를 어른으로 준비시킨다는 말이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"overprotective\" data-m=\"과잉보호하는\"><b>overprotective</b>과잉보호하는</button><button type=\"button\" class=\"wdb\" data-w=\"natural consequences\" data-m=\"자연적 결과\"><b>natural consequences</b>자연적 결과</button><button type=\"button\" class=\"wdb\" data-w=\"bounce back\" data-m=\"회복하다, 다시 일어서다\"><b>bounce back</b>회복하다, 다시 일어서다</button><button type=\"button\" class=\"wdb\" data-w=\"recover\" data-m=\"회복하다\"><b>recover</b>회복하다</button><button type=\"button\" class=\"wdb\" data-w=\"conclude\" data-m=\"결론짓다\"><b>conclude</b>결론짓다</button><button type=\"button\" class=\"wdb\" data-w=\"adulthood\" data-m=\"성인기\"><b>adulthood</b>성인기</button></div>", "04": "<p class=\"mtr\">마더텅 정답률 <b>75%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">요지는 <b>질문으로 경험을 떠올리게 한 뒤</b> 마지막에 <b>일반화하는 문장</b>에 있어요. 1~4번은 “네 경험을 떠올려 봐”이고, 5번 <b>others(다른 사람들)</b>로 넓혀 6번 <b>a normal human desire(일반적인 인간의 욕구)</b>로 못 박아요.</p><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 경험 떠올리기</span><div class=\"en\">Think about times in your life when you have been singled out by somebody who <mark>made you feel special</mark>.</div><p class=\"ko\">당신을 <mark>특별하다고 느끼도록</mark> 만들어 준 누군가에게 선택받았던 인생의 때를 생각해 보라.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>2번</em>칭찬·뜻밖의 선물·손편지</span><span><em>3·4번</em>그 사람에게 고마운 마음 → 좋은 말을 다 쓰고 싶음</span></div><div class=\"ck-eq\">⇒ 1~4번 = “특별 대우를 받으면 기분 좋았지?”라는 내 경험</div></div><div class=\"ck-via\"><i>▼</i><span>내 경험(you)을 others(다른 사람들)로 넓혀요</span></div><div class=\"ck-step\"><span class=\"lab\">5번 문장 · 나에서 남으로 넓히기</span><div class=\"en\"><mark>Probably others want to feel</mark> the same way you feel.</div><p class=\"ko\"><mark>아마도 다른 사람들도</mark> 당신이 느낀 것과 똑같이 <mark>느끼기를 원할 것이다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>모든 사람으로 일반화하며 “인간의 욕구”라고 못 박아요</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 결정적 요지</span><div class=\"en\"><mark>People want to feel special</mark>; it’s <mark>a normal human desire</mark>, and I have never met a person who doesn’t appreciate this kind of attention.</div><p class=\"ko\"><mark>사람들은 특별하다고 느끼고 싶어 한다</mark>. 그것은 <mark>일반적인 인간의 욕구이고</mark>, 나는 이러한 종류의 관심에 감사하지 않는 사람을 만나 본 적이 없다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">특별한 대우를 받고자 하는 것은 인간의 욕구이다.<small>6번의 feel special(특별하다고 느끼다) + a normal human desire(일반적인 인간의 욕구)를 그대로 옮겼어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">행동에 대해 구체적으로 칭찬하는 것이 중요하다.</span><span class=\"why\">[범위 좁음] 2번의 praised(칭찬했다)는 선물·편지와 함께 나온 예시 하나일 뿐이에요. 구체적으로 칭찬하라는 방법 이야기도 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">긍정적인 말은 성공을 위한 기본 요소이다.</span><span class=\"why\">[지문에 없음] 4번의 positive adjectives(긍정적인 형용사)는 고마움을 표현하는 말일 뿐이에요. 성공 이야기는 한 번도 안 나와요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">남에 대한 지나친 관심은 인간관계를 해칠 수 있다.</span><span class=\"why\">[반대] 6번에서 이런 attention(관심)에 감사하지 않는 사람을 만난 적이 없다고 했어요. 관심이 해롭다는 건 정반대예요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">상대방의 입장에서 보면 객관적으로 상황을 이해할 수 있다.</span><span class=\"why\">[지문에 없음] 5번은 남도 나와 같은 기분을 원한다는 말이지, 객관적으로 상황을 이해하자는 말이 아니에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Think about times in your life</div><div class=\"k\">당신의 인생에서의 때를 생각해 보라</div></div><div class=\"rc\"><div class=\"e\">when you have been singled out by somebody</div><div class=\"k\">당신이 누군가에 의해 선택받았던</div></div><div class=\"rc ckc\"><div class=\"e\">who <span class=\"cw\">made you feel special</span>.</div><div class=\"k\">(그 누군가는) <span class=\"cw\">당신을 특별하다고 느끼도록 만들어 주었다</span>.</div></div><div class=\"rnat\">당신의 인생에서, 당신을 특별하다고 느끼도록 만들어 준 누군가에 의해 당신이 선택받았던 시간(때)을 생각해 보라.</div><div class=\"rst\">내 생일에 친구가 나만을 위해 뭔가 해 줘서 특별해진 기분이 든 날을 떠올려 봐요. = 지문 1번, 누군가 나를 <b>특별하다고 느끼게</b> 해 준 때예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Maybe this person praised you,</div><div class=\"k\">아마도 이 사람은 당신을 칭찬했을 것이다,</div></div><div class=\"rc\"><div class=\"e\">gave you an unexpected gift,</div><div class=\"k\">당신에게 예상치 못한 선물을 주었을 것이다,</div></div><div class=\"rc\"><div class=\"e\">or took the time to write you a letter.</div><div class=\"k\">혹은 당신에게 편지를 쓰기 위한 시간을 냈을 것이다.</div></div><div class=\"rnat\">아마도 이 사람은 당신을 칭찬했거나, 예상치 못한 선물을 주었거나, 또는 당신에게 편지를 쓰기 위한 시간을 냈을 것이다.</div><div class=\"rst\">친구가 칭찬해 주거나, 뜻밖의 선물을 주거나, 손편지를 써 줬을 거예요. = 지문 2번의 세 가지 예시예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">How did you feel</div><div class=\"k\">당신은 어떻게 느꼈는가</div></div><div class=\"rc\"><div class=\"e\">toward this person?</div><div class=\"k\">이 사람에 대해?</div></div><div class=\"rnat\">당신은 이 사람에 대해 어떻게 느꼈는가?</div><div class=\"rst\">그때 그 친구가 어떻게 느껴졌나요? = 지문 3번, 그 사람에 대한 내 마음을 묻는 질문이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">You may use</div><div class=\"k\">당신은 사용할 것이다</div></div><div class=\"rc\"><div class=\"e\">any of a whole range of positive adjectives</div><div class=\"k\">모든 긍정적인 형용사들 중 무엇이든</div></div><div class=\"rc\"><div class=\"e\">to thank him or her.</div><div class=\"k\">그 또는 그녀에게 감사하기 위해.</div></div><div class=\"rnat\">당신은 그 또는 그녀에게 감사하기 위해 모든 긍정적인 형용사들을 (무엇이든) 사용할 것이다.</div><div class=\"rst\">“최고야! 고마워!” 좋은 말을 다 쓰고 싶었을 거예요. = 지문 4번, 고마워서 긍정적인 형용사를 모두 쓴다는 말이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Probably others want to feel</span></div><div class=\"k\"><span class=\"cw\">아마도 다른 사람들은 느끼기를 원할 것이다</span></div></div><div class=\"rc\"><div class=\"e\">the same way you feel.</div><div class=\"k\">당신이 느낀 똑같은 방식으로.</div></div><div class=\"rnat\">아마도, 다른 사람들은 당신이 느낀 똑같은 방식으로 느끼기를 원할 것이다.</div><div class=\"rst\">우리 반 다른 친구들도 나처럼 그런 기분을 원할 거예요. = 지문 5번, <b>다른 사람들</b>(others)도 똑같이 느끼고 싶어 해요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">People want to feel special</span>;</div><div class=\"k\"><span class=\"cw\">사람들은 특별하다고 느끼고 싶어 한다</span>.</div></div><div class=\"rc ckc\"><div class=\"e\">it’s <span class=\"cw\">a normal human desire</span>,</div><div class=\"k\">그것은 <span class=\"cw\">일반적인 인간의 욕구이고</span>,</div></div><div class=\"rc\"><div class=\"e\">and I have never met a person</div><div class=\"k\">나는 사람을 만나 본 적이 없다</div></div><div class=\"rc\"><div class=\"e\">who doesn’t appreciate this kind of attention.</div><div class=\"k\">이러한 종류의 관심에 감사하지 않는.</div></div><div class=\"rnat\">사람들은 특별하다고 느끼고 싶어 한다. 그것은 일반적인 인간의 욕구이고, 나는 이러한 종류의 관심에 감사하지 않는 사람을 만나 본 적이 없다.</div><div class=\"rst\">결국 누구나 특별한 대우를 받고 싶어 해요. = 지문 6번 요지, 그건 <b>일반적인 인간의 욕구</b>이고 이런 관심을 싫어하는 사람은 없어요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"single out\" data-m=\"선택하다, 지목하다\"><b>single out</b>선택하다, 지목하다</button><button type=\"button\" class=\"wdb\" data-w=\"praise\" data-m=\"칭찬하다\"><b>praise</b>칭찬하다</button><button type=\"button\" class=\"wdb\" data-w=\"unexpected\" data-m=\"예상치 못한\"><b>unexpected</b>예상치 못한</button><button type=\"button\" class=\"wdb\" data-w=\"positive adjective\" data-m=\"긍정적인 형용사\"><b>positive adjective</b>긍정적인 형용사</button><button type=\"button\" class=\"wdb\" data-w=\"appreciate\" data-m=\"반기다, 고맙게 여기다\"><b>appreciate</b>반기다, 고맙게 여기다</button><button type=\"button\" class=\"wdb\" data-w=\"attention\" data-m=\"관심\"><b>attention</b>관심</button></div>", "05": "<p class=\"mtr\">마더텅 정답률 <b>60%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">동사 밑줄은 <b>진짜 주어를 찾아 수를 맞추는</b> 문제예요. 4번은 <b>of how we interacted(우리가 소통했던 방식에 대한)</b>를 괄호로 묶으면 주어 <b>Memories(기억들)</b>가 복수라서 seem(~처럼 보이다)이어야 해요.</p><div class=\"ck-step\"><span class=\"lab\">문제지 ③번 자리 (4번)</span><div class=\"en\">Memories of how we interacted <u>③ seems</u> funny to me today.</div><p class=\"ko\">우리가 소통했던 방식에 대한 기억들이 ( ? ) 우습게 — 동사 바로 앞 how we interacted에 속지 말 것</p></div><div class=\"ck-via\"><i>▼</i><span>of(~에 대한)부터 interacted(소통했다)까지는 주어를 꾸며 주는 말이에요</span></div><div class=\"ck-step\"><span class=\"lab\">꾸며 주는 말 걷어 내기</span><div class=\"en\">Memories <mark>of how we interacted</mark></div><p class=\"ko\"><mark>우리가 소통했던 방식에 대한</mark> 기억들이</p></div><div class=\"ck-via\"><i>▼</i><span>진짜 주어 Memories(기억들)가 -s로 끝나는 복수 → 동사는 seem(~처럼 보이다)</span></div><div class=\"ck-step key\"><span class=\"lab\">4번 문장 · 결정적 단서</span><div class=\"en\"><mark>Memories</mark> of how we interacted <mark>seem funny</mark> to me today.</div><p class=\"ko\">우리가 소통했던 방식에 대한 <mark>기억들이</mark> 현재 나에게는 <mark>우습게 보인다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">주어와 동사의 수 일치 (꾸며 주는 말 뒤의 진짜 주어 찾기)</p><p class=\"gr\">주어 뒤에 of(~의, ~에 대한) 같은 꾸며 주는 말이 길게 붙어도, 동사는 맨 앞의 진짜 주어에 수를 맞춰요. 진짜 주어가 복수면 동사에 -s를 붙이지 않아요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>The books on the desk are mine.</div><div class=\"ko\">책상 위의 책들은 내 것이다. (진짜 주어 books 책들이 복수라서 are가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>The books on the desk is mine.</div><div class=\"ko\">동사 바로 앞 desk(책상)에 맞춰 is를 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>The color of the flowers is red.</div><div class=\"ko\">그 꽃들의 색깔은 빨간색이다. (진짜 주어 color 색깔이 단수라서 is가 맞아요)</div></div><p class=\"gb\">지문 4번도 진짜 주어는 복수 Memories(기억들)이고 of how we interacted(우리가 소통했던 방식에 대한)는 꾸며 주는 말이라, seems(보인다, 단수형)가 아니라 seem(~처럼 보이다)이에요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">seems → seem (~처럼 보이다)<small>주어가 복수 Memories(기억들)라서 -s 없는 seem(~처럼 보이다)이 맞아요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">dealing 다루는</span><span class=\"why\">3번은 He was a responsible man(그는 책임감 있는 사람이었다)으로 문장이 이미 끝났어요. 그 뒤 dealing with an irresponsible kid(무책임한 아이를 다루는)는 man(사람)을 뒤에서 꾸며 주는 말이고, 그 사람이 직접 '다루는' 쪽이라 능동 -ing(~하는)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">명사 뒤 현재분사 -ing(~하는): 능동으로 뒤에서 꾸밈</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>The boy sitting there is my brother.</div><div class=\"ko\">저기 앉아 있는 소년은 내 동생이다. (소년이 직접 앉아 있으니 sitting 앉아 있는이 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>The boy sits there is my brother.</div><div class=\"ko\">동사 is(이다)가 이미 있는데 sits(앉다)를 또 써서 동사가 두 개라 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>She is a teacher helping kids.</div><div class=\"ko\">그녀는 아이들을 돕는 선생님이다. (선생님이 직접 도우니 helping 돕는이 맞아요)</div></div><p class=\"gb\">지문 3번도 동사 was(~이었다)가 이미 있고, man(사람)이 직접 아이를 다루니 dealing(다루는)이 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">which 그런데 그것을</span><span class=\"why\">2번은 chores like mowing the lawn and cutting the hedges(잔디 깎기와 울타리 덤불 자르기 같은 허드렛일) 뒤에 쉼표 + ① 자리가 와요. 뒤의 I hated(내가 싫어했다)에 목적어가 빠져 있고, 앞의 사물 chores(허드렛일)를 받으니 which(그것을)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">관계대명사 which(그것을): 앞의 사물을 받고, 뒤 절에 빈자리(목적어)가 있음</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I got a new bike, which I love.</div><div class=\"ko\">나는 새 자전거를 샀는데, 나는 그것을 아주 좋아한다. (love 뒤 목적어가 비어서 which가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I got a new bike, which I love it.</div><div class=\"ko\">which(그것을)가 이미 목적어 역할을 하는데 it(그것)을 또 써서 틀려요.</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I got a new bike, who I love.</div><div class=\"ko\">bike(자전거)는 사람이 아닌데 who(사람)를 써서 틀려요.</div></div><p class=\"gb\">지문 2번도 hated(싫어했다) 뒤 목적어가 비었고 앞이 사물 chores(허드렛일)라서 which(그것을)가 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">to do 하기로</span><span class=\"why\">5번은 I decided(나는 결심했다) 바로 뒤예요. decide(결심하다)는 앞으로 '할 일'을 정하는 동사라 뒤에 to(~하기로) + 동사원형이 와요. 그래서 to do just the front yard(앞뜰만 하기로)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">decide(결심하다) + to(~하기로) + 동사원형</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I decided to study harder.</div><div class=\"ko\">나는 더 열심히 공부하기로 결심했다. (decided 뒤에 to study 공부하기로가 와서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I decided studying harder.</div><div class=\"ko\">decide(결심하다) 뒤에 -ing인 studying(공부하는 것)을 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>She decided to go home early.</div><div class=\"ko\">그녀는 일찍 집에 가기로 했다. (decided 뒤에 to go 가기로가 와서 맞아요)</div></div><p class=\"gb\">지문 5번도 decided(결심했다) 뒤라서 to do(하기로)가 딱 맞아요. 뒤의 postpone doing(하는 것을 미루다)은 postpone(미루다)이 -ing(~하는 것)를 받는 동사라 다른 규칙이에요.</p></div></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">that 그래서</span><span class=\"why\">6번은 That took so long(그 일은 너무 오래 걸렸다) 뒤에 ⑤ 자리가 와요. 앞에 so(너무)가 있고 뒤에 the front yard was too high(앞뜰이 너무 길었다)라는 완전한 결과 문장이 오니 so(너무) ~ that(그래서) 구조의 that(그래서)이 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">so(너무) + 형용사·부사 + that(그래서) + 완전한 절</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>It was so hot that we went swimming.</div><div class=\"ko\">너무 더워서 우리는 수영하러 갔다. (so hot 다음에 결과 문장이 와서 that이 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>It was so hot what we went swimming.</div><div class=\"ko\">결과를 잇는 자리인데 what(~하는 것)을 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>He ran so fast that he won.</div><div class=\"ko\">그는 너무 빨리 달려서 이겼다. (so fast 다음 결과 문장 he won이 완전해서 that이 맞아요)</div></div><p class=\"gb\">지문 6번도 so long(너무 오래) 뒤에 결과인 완전한 문장이 오니 that(그래서)이 맞아요.</p></div></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">My dad worked very late hours as a musician</div><div class=\"k\">나의 아버지는 음악가로 매우 늦은 시간까지 일하셨고</div></div><div class=\"rc\"><div class=\"e\">— until about three in the morning —</div><div class=\"k\">— 대략 새벽 3시까지 —</div></div><div class=\"rc\"><div class=\"e\">so he</div><div class=\"k\">그래서 그(= 아버지)는</div></div><div class=\"rc\"><div class=\"e\">slept late on weekends.</div><div class=\"k\">주말마다 늦잠을 잤다.</div></div><div class=\"rnat\">나의 아버지는 음악가로 매우 늦은 시간까지, 대략 새벽 3시까지 일하셨고, 그래서 그(아버지)는 주말마다 늦잠을 잤다.</div><div class=\"rst\">아빠는 음악가라 새벽 3시쯤까지 일해서 주말엔 늦잠을 주무셨어요. 지문 1번은 so(그래서)가 원인과 결과를 이어 줘요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">As a result,</div><div class=\"k\">그 결과,</div></div><div class=\"rc\"><div class=\"e\">we didn’t have much of a relationship</div><div class=\"k\">우리는 많은 관계를 가지지 못했다</div></div><div class=\"rc\"><div class=\"e\">when I was young</div><div class=\"k\">내가 어렸을 때</div></div><div class=\"rc\"><div class=\"e\">other than him constantly nagging me</div><div class=\"k\">그(= 아버지)가 끊임없이 나에게 잔소리한 것을 제외하고는</div></div><div class=\"rc\"><div class=\"e\">to take care of chores</div><div class=\"k\">허드렛일을 돌보라고</div></div><div class=\"rc\"><div class=\"e\">like mowing the lawn and cutting the hedges,</div><div class=\"k\">잔디 깎기와 울타리 덤불 자르기처럼,</div></div><div class=\"rc\"><div class=\"e\">which I hated.</div><div class=\"k\">내가 싫어했던(= 허드렛일).</div></div><div class=\"rnat\">그 결과, 잔디 깎기와 울타리 덤불 자르기처럼 내가 싫어했던 허드렛일을 돌보라고 끊임없이 그가 나에게 잔소리한 것을 제외하고는 내가 어렸을 때 우리는 많은 관계를 가지지 못했다.</div><div class=\"rst\">그래서 아빠와는 잔디 깎기 같은 싫은 집안일 잔소리 말고는 함께한 게 별로 없어요. 그 집안일을 받는 말이 <b>which</b>(그것을)예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">He was a responsible man</div><div class=\"k\">그는 책임감 있는 사람이었다</div></div><div class=\"rc\"><div class=\"e\">dealing with an irresponsible kid.</div><div class=\"k\">무책임한 아이를 다루는.</div></div><div class=\"rnat\">그는 무책임한 아이를 다루는 책임감 있는 사람이었다.</div><div class=\"rst\">아빠는 책임감 있는 사람이었고, 나는 무책임한 아이였어요. 아빠가 나를 '다루는' 쪽이라 <b>dealing</b>(다루는)이에요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Memories</span> of how we interacted</div><div class=\"k\">우리가 소통했던 방식에 대한 <span class=\"cw\">기억들이</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">seem funny</span> to me today.</div><div class=\"k\">현재 나에게는 <span class=\"cw\">우습게 보인다</span>. ※ 문제지엔 seems로 되어 있음</div></div><div class=\"rnat\">우리가 소통했던 방식에 대한 기억들이 현재 나에게는 우스워 보인다.</div><div class=\"rst\">지금 생각하면 그때 아빠와 지낸 기억들이 우스워요. 주어가 <b>기억들</b>(Memories)이라 복수이니 동사는 <b>seem</b>(~처럼 보이다)이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">For example,</div><div class=\"k\">예를 들어,</div></div><div class=\"rc\"><div class=\"e\">one time he told me to cut the grass</div><div class=\"k\">한번은 그가 나에게 잔디를 깎으라고 말했고</div></div><div class=\"rc\"><div class=\"e\">and I decided to do just the front yard</div><div class=\"k\">나는 앞뜰만 하기로 결심했으나</div></div><div class=\"rc\"><div class=\"e\">and postpone doing the back,</div><div class=\"k\">뒤뜰을 하는 것은 미루기로,</div></div><div class=\"rc\"><div class=\"e\">but then it rained for a couple days</div><div class=\"k\">그러고 나서 며칠 동안 비가 내렸고</div></div><div class=\"rc\"><div class=\"e\">and the backyard grass became so high</div><div class=\"k\">뒤뜰의 잔디가 너무 길어서(길게 자라서)</div></div><div class=\"rc\"><div class=\"e\">I had to cut it with a sickle.</div><div class=\"k\">나는 그것을 낫으로 베어내야만 했다.</div></div><div class=\"rnat\">예를 들어, 한번은 그가 나에게 잔디를 깎으라고 말했고 나는 앞뜰만 하고 뒤뜰을 하는 것은 미루기로 결심했으나, 그러고 나서 며칠 동안 비가 내렸고 뒤뜰의 잔디가 너무 길어서(길게 자라서) 나는 그것을 낫으로 베어내야만 했다.</div><div class=\"rst\">잔디를 깎으라는 말에 앞뜰만 하고 뒤뜰은 미뤘더니, 비가 와서 풀이 자라 낫으로 베야 했어요. decided(결심했다) 뒤라 <b>to do</b>(하기로)예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">That took so long that</div><div class=\"k\">그 일(= 뒤뜰의 잔디를 낫으로 베는 일)은 너무 오래 걸려서</div></div><div class=\"rc\"><div class=\"e\">by the time I was finished,</div><div class=\"k\">내가 끝냈을 때쯤에는</div></div><div class=\"rc\"><div class=\"e\">the front yard was too high to mow,</div><div class=\"k\">앞뜰은 (잔디가) 너무 길어서 깎을 수 없었고,</div></div><div class=\"rc\"><div class=\"e\">and so on.</div><div class=\"k\">그런 일이 계속되었다.</div></div><div class=\"rnat\">그 일(뒤뜰의 잔디를 낫으로 베는 일)은 너무 오래 걸려서 내가 끝냈을 때쯤에는 앞뜰은 (잔디가) 너무 길어서 깎을 수 없었고, 그런 일이 계속되었다.</div><div class=\"rst\">그 일이 너무 오래 걸려서 끝나고 보니 앞뜰 풀이 또 자라 있었어요. so(너무) ~ <b>that</b>(그래서)으로 결과를 이어요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"chore\" data-m=\"허드렛일, 집안일\"><b>chore</b>허드렛일, 집안일</button><button type=\"button\" class=\"wdb\" data-w=\"nag\" data-m=\"잔소리하다\"><b>nag</b>잔소리하다</button><button type=\"button\" class=\"wdb\" data-w=\"deal with\" data-m=\"다루다\"><b>deal with</b>다루다</button><button type=\"button\" class=\"wdb\" data-w=\"irresponsible\" data-m=\"무책임한\"><b>irresponsible</b>무책임한</button><button type=\"button\" class=\"wdb\" data-w=\"interact\" data-m=\"소통하다\"><b>interact</b>소통하다</button><button type=\"button\" class=\"wdb\" data-w=\"postpone\" data-m=\"미루다, 연기하다\"><b>postpone</b>미루다, 연기하다</button></div>", "06": "<p class=\"mtr\">마더텅 정답률 <b>55%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">밑줄은 <b>비유</b>예요. sacred cow(신성한 소)는 진짜 소가 아니라 <b>this(이것)</b>가 가리키는 <b>바로 앞 8·9번의 믿음</b>이에요. 그 믿음을 12번이 <b>false assumption(잘못된 전제)</b>이라고 풀어 줘요.</p><div class=\"ck-step\"><span class=\"lab\">밑줄 문장 (10번)</span><div class=\"en\">What would happen if you do challenge <mark>this sacred cow</mark>?</div><p class=\"ko\">만약 여러분이 정말로 <mark>이 신성한 소</mark>에 맞선다면 무슨 일이 일어날까?</p></div><div class=\"ck-via\"><i>▼</i><span>this(이것)가 가리키는 믿음을 앞에서 찾기 = “올바른 방법은 더 어려운 방법”</span></div><div class=\"ck-step key\"><span class=\"lab\">8번 문장 · sacred cow의 정체</span><div class=\"en\">It’s like we all automatically accept that the “right” way is, inevitably, <mark>the harder one</mark>.</div><p class=\"ko\">이는 마치 '올바른' 방법은 반드시 <mark>더 어려운 것(방법)</mark>이라는 것을 우리 모두가 자동적으로 받아들이는 것과 같다.</p></div><div class=\"ck-via\"><i>▼</i><span>아무도 의심하지 않는 믿음이라서 sacred(신성한)라고 불러요</span></div><div class=\"ck-step\"><span class=\"lab\">9번 문장 · 왜 “신성한” 소인가</span><div class=\"en\">In my experience this is <mark>hardly ever questioned</mark>.</div><p class=\"ko\">나의 경험상 이것은 <mark>거의 한 번도 의문이 제기되지 않는다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그 믿음을 false(잘못된)라고 부르며, 맞선다 = 의심한다는 뜻을 굳혀 줘요</span></div><div class=\"ck-step key\"><span class=\"lab\">12번 문장 · 결정적 단서</span><div class=\"en\">What if the biggest thing keeping us from doing what matters is <mark>the false assumption</mark> that <mark>it has to take huge effort</mark>?</div><p class=\"ko\">만약 우리가 중요한 일을 하지 못하게 하는 가장 큰 것이, 그 일은 <mark>엄청난 노력을 필요로 한다는</mark> <mark>잘못된 전제</mark>라면 어떨까?</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">doubt the solid belief that only hard work is worthy 오직 힘든 일만 가치 있다는 확고한 믿음을 의심하다<small>sacred cow(신성한 소) = 8번의 “어려운 길만 옳다”는 믿음, challenge(맞서다) = 그 믿음을 의심하는 것이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">break the superstition that holy animals bring good luck 신성한 동물이 행운을 가져온다는 미신을 깨다</span><span class=\"why\">sacred cow(신성한 소)를 글자 그대로 진짜 동물로 읽은 함정이에요. 지문 어디에도 동물이나 행운 얘기는 없고, 8번의 “어려운 길만 옳다”는 믿음을 빗댄 말이에요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">resist the tendency to avoid any hardship 어떤 고난도 피하려는 경향에 저항하다</span><span class=\"why\">고난을 피하지 말라는 건 “힘들게 해야 옳다”는 쪽이라 글과 정반대예요. 11번은 중요한 일도 easy(쉬운) 것이 될 수 있다고 해요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">escape from the pressure of using formal language 격식 있는 언어를 써야 하는 압박에서 벗어나다</span><span class=\"why\">1번의 language(언어)만 따온 오답이에요. 3~7번의 표현들은 격식 문제가 아니라 “노력해야 가치 있다”는 생각을 드러내는 예시예요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">abandon the old notion that money always comes first 돈이 항상 우선이라는 오래된 생각을 버리다</span><span class=\"why\">6번의 easy money(쉬운 돈)는 여러 표현 예시 중 하나예요. 돈이 우선이라는 생각은 지문에 없어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Our language helps</div><div class=\"k\">우리의 언어는 돕는다</div></div><div class=\"rc\"><div class=\"e\">to reveal our deeper assumptions.</div><div class=\"k\">우리의 더 깊은 전제를 드러내는 것을.</div></div><div class=\"rnat\">우리의 언어는 우리의 더 깊은 전제를 드러내는 것을 돕는다.</div><div class=\"rst\">우리가 쓰는 말버릇을 보면 속마음이 드러나요. = 지문 1번, 언어가 우리의 더 깊은 <b>전제</b>(assumption)를 드러낸다는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Think of</div><div class=\"k\">생각해 보라</div></div><div class=\"rc\"><div class=\"e\">these revealing phrases:</div><div class=\"k\">다음과 같은 (이것을) 잘 드러내는 문구들을:</div></div><div class=\"rnat\">다음과 같은 (이것을) 잘 드러내는 문구들을 생각해 보라.</div><div class=\"rst\">시험 공부할 때 우리가 자주 하는 말들을 떠올려 봐요. = 지문 2번, 그런 생각을 드러내는 문구들을 생각해 보라고 해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">When we accomplish something important,</div><div class=\"k\">우리가 중요한 무언가를 성취할 때,</div></div><div class=\"rc\"><div class=\"e\">we say it took “blood, sweat, and tears.”</div><div class=\"k\">우리는 그것이 '피, 땀, 그리고 눈물'을 필요로 했다고 말한다.</div></div><div class=\"rnat\">우리가 중요한 무언가를 성취할 때, 우리는 그것이 '피, 땀, 그리고 눈물'을 필요로 했다고 말한다.</div><div class=\"rst\">100점을 받으면 “밤새 피땀 흘려 얻었어”라고 해요. = 지문 3번, 중요한 걸 이루면 “피, 땀, 그리고 눈물”이 들었다고 말해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">We say</div><div class=\"k\">우리는 말한다</div></div><div class=\"rc\"><div class=\"e\">important achievements are “hard-earned.”</div><div class=\"k\">중요한 성과는 '힘들게 얻은' 것이라고.</div></div><div class=\"rnat\">우리는 중요한 성과는 '힘들게 얻은' 것이라고 말한다.</div><div class=\"rst\">좋은 성적은 늘 “힘들게 얻은 것”이라고 자랑해요. = 지문 4번, 중요한 성과는 힘들게 얻은 것이라고 말해요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">We recommend a “hard day’s work”</div><div class=\"k\">우리는 '힘든 하루 동안의 일'이라는 말을 권한다</div></div><div class=\"rc\"><div class=\"e\">when “day’s work” would be enough.</div><div class=\"k\">'하루 동안의 일'이라는 말로도 충분할 때.</div></div><div class=\"rnat\">우리는 '하루 동안의 일'이라는 말로도 충분할 때 '힘든 하루 동안의 일'이라는 말을 권한다.</div><div class=\"rst\">그냥 “공부했어”면 될 걸 “엄청 힘들게 공부했어”라고 해야 뿌듯해요. = 지문 5번, 하루의 일 앞에 굳이 “힘든”을 붙여요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">When we talk of “easy money,”</div><div class=\"k\">우리가 '쉬운 돈'이라는 말을 할 때,</div></div><div class=\"rc\"><div class=\"e\">we are implying</div><div class=\"k\">우리는 넌지시 드러내고 있다</div></div><div class=\"rc\"><div class=\"e\">it was obtained through illegal or questionable means.</div><div class=\"k\">그것이 불법적이거나 의심스러운 수단을 통해 얻어졌다는 것을.</div></div><div class=\"rnat\">우리가 '쉬운 돈'이라는 말을 할 때, 우리는 그것이 불법적이거나 의심스러운 수단을 통해 얻어졌다는 것을 넌지시 드러내고 있다.</div><div class=\"rst\">쉽게 점수를 올린 친구에겐 “뭔가 꼼수 쓴 거 아냐?” 해요. = 지문 6번, “쉬운 돈”은 의심스러운 방법으로 얻었다는 뜻이 돼요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">We use the phrase “That’s easy for you to say”</div><div class=\"k\">우리는 '말은 쉽지'라는 문구를 사용한다</div></div><div class=\"rc\"><div class=\"e\">as a criticism,</div><div class=\"k\">비판으로,</div></div><div class=\"rc\"><div class=\"e\">usually when we are seeking to invalidate someone’s opinion.</div><div class=\"k\">보통 누군가의 의견이 틀렸음을 입증하려 할 때.</div></div><div class=\"rnat\">우리가 보통 누군가의 의견이 틀렸음을 입증하려 할 때, 우리는 '말은 쉽지'라는 문구를 비판으로 사용한다.</div><div class=\"rst\">“넌 머리가 좋으니까 말은 쉽지!” 하며 친구 말을 무시해요. = 지문 7번, “말은 쉽지”를 남의 의견을 깎는 비판으로 써요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">It’s like</div><div class=\"k\">이는 마치 ~와 같다</div></div><div class=\"rc\"><div class=\"e\">we all automatically accept</div><div class=\"k\">우리 모두가 자동적으로 받아들이는 것과</div></div><div class=\"rc ckc\"><div class=\"e\">that the “right” way is, inevitably, <span class=\"cw\">the harder one</span>.</div><div class=\"k\">'올바른' 방법은 반드시 <span class=\"cw\">더 어려운 것(방법)</span>이라는 것을.</div></div><div class=\"rnat\">이는 마치 우리 모두가 '올바른' 방법은 반드시 더 어려운 것(방법)이라는 것을 자동적으로 받아들이는 것과 같다.</div><div class=\"rst\">마치 “힘들게 해야만 옳은 공부”라고 다들 당연히 믿는 것 같아요. = 지문 8번, 올바른 방법은 반드시 <b>더 어려운 것</b>이라고 받아들여요.</div></div><div class=\"rds key\" data-ord=\"9\"><span class=\"rn\">9번 · 단서</span><div class=\"rc\"><div class=\"e\">In my experience</div><div class=\"k\">나의 경험상</div></div><div class=\"rc ckc\"><div class=\"e\">this is <span class=\"cw\">hardly ever questioned</span>.</div><div class=\"k\">이것은 <span class=\"cw\">거의 한 번도 의문이 제기되지 않는다</span>.</div></div><div class=\"rnat\">나의 경험상 이것은 거의 한 번도 의문이 제기되지 않는다.</div><div class=\"rst\">이 믿음은 아무도 의심하지 않아요. = 지문 9번, 거의 한 번도 <b>의문이 제기되지 않는</b> 믿음이라 “신성한 소”라 불러요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">What would happen</div><div class=\"k\">무슨 일이 일어날까?</div></div><div class=\"rc ckc\"><div class=\"e\">if you do challenge <span class=\"cw\">this sacred cow</span>?</div><div class=\"k\">만약 여러분이 정말로 <span class=\"cw\">이 신성한 소</span>(= 오직 어려운 일만이 가치 있다는 확고한 믿음)에 맞선다면</div></div><div class=\"rnat\">만약 여러분이 정말로 이 신성한 소에 맞선다(오직 어려운 일만이 가치 있다는 확고한 믿음을 의심한다)면 무슨 일이 일어날까?</div><div class=\"rst\"><b>만약 “꼭 힘들어야 하나?” 하고 이 믿음을 의심한다면요?</b> 밑줄 “신성한 소에 맞선다” = 힘든 일만 가치 있다는 믿음을 의심한다(③)예요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">We don’t even pause</div><div class=\"k\">우리는 잠시 멈추지도 않는다</div></div><div class=\"rc\"><div class=\"e\">to consider</div><div class=\"k\">생각해 보려고</div></div><div class=\"rc\"><div class=\"e\">that something important and valuable could be made easy.</div><div class=\"k\">중요하고 가치 있는 무언가가 쉬운 것으로 만들어질 수 있다고.</div></div><div class=\"rnat\">우리는 중요하고 가치 있는 무언가가 쉬운 것으로 만들어질 수 있다고 잠시 멈춰 생각해 보지도 않는다.</div><div class=\"rst\">우리는 중요한 공부도 쉽게 할 수 있다는 생각을 잠깐도 안 해요. = 지문 11번, 가치 있는 일도 쉬워질 수 있다고 생각해 보지도 않아요.</div></div><div class=\"rds key\" data-ord=\"12\"><span class=\"rn\">12번 · 단서</span><div class=\"rc\"><div class=\"e\">What if</div><div class=\"k\">만약 ~라면 어떨까?</div></div><div class=\"rc\"><div class=\"e\">the biggest thing keeping us from doing what matters</div><div class=\"k\">우리가 중요한 일을 하지 못하게 하는 가장 큰 것이</div></div><div class=\"rc ckc\"><div class=\"e\">is <span class=\"cw\">the false assumption</span></div><div class=\"k\"><span class=\"cw\">잘못된 전제라면</span></div></div><div class=\"rc ckc\"><div class=\"e\">that <span class=\"cw\">it has to take huge effort</span>?</div><div class=\"k\">그것(= 중요한 일)은 <span class=\"cw\">엄청난 노력을 필요로 한다는</span>.</div></div><div class=\"rnat\">만약 우리가 중요한 일을 하지 못하게 하는 가장 큰 것이 그것(중요한 일)은 엄청난 노력을 필요로 한다는 잘못된 전제라면 어떨까?</div><div class=\"rst\">“무조건 엄청 힘들어야 해”라는 생각이 오히려 공부 시작을 막을지도 몰라요. = 지문 12번, 그게 바로 <b>잘못된 전제</b>라는 말이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"assumption\" data-m=\"전제, 가정\"><b>assumption</b>전제, 가정</button><button type=\"button\" class=\"wdb\" data-w=\"hard-earned\" data-m=\"힘들게 얻은\"><b>hard-earned</b>힘들게 얻은</button><button type=\"button\" class=\"wdb\" data-w=\"inevitably\" data-m=\"필연적으로, 반드시\"><b>inevitably</b>필연적으로, 반드시</button><button type=\"button\" class=\"wdb\" data-w=\"invalidate\" data-m=\"틀렸음을 입증하다, 무효화하다\"><b>invalidate</b>틀렸음을 입증하다, 무효화하다</button><button type=\"button\" class=\"wdb\" data-w=\"sacred cow\" data-m=\"신성시되는 통념\"><b>sacred cow</b>신성시되는 통념</button><button type=\"button\" class=\"wdb\" data-w=\"false assumption\" data-m=\"잘못된 전제\"><b>false assumption</b>잘못된 전제</button></div>"};

function qHtml(i,a){

  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  if(EXP[cq.q]){h+=EXP[cq.q]+'<button class="toq" data-i="'+i+'">빠른 정답으로</button>';return h+'</div></details>';}
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';

    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}

}

/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(S.sub&&!S.mmS){S.mmS=1;S.mmP=1;save();WN.hw(lv,day,S.sub.s+'/'+N+(S.mmD?' ✓':''));}else if(!S.sub&&!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}

  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
</body>
</html>
