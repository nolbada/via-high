<title>고1 미니모의고사 17회 01–06번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:0}
#app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
#app>.wrap{width:100%}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}
.ko{color:var(--sub);font-size:14px;margin-left:6px}
.cell.bad{background:var(--badbg);border-color:var(--bad)}
.cell.bad .tag{background:var(--bad)}
.locked .cell{pointer-events:none}
.bar{position:sticky;margin-top:auto;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.done .opt{pointer-events:none}
.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}
.hcard .chip{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--sub)}
.hcard .chip.ok{background:var(--goodbg);color:var(--good)}
.hcard .chip.warn{background:var(--badbg);color:var(--bad)}
.hcard[disabled]{opacity:.55}
details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.th .hd{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:6px}
.th ol{list-style:none;margin:0;padding:0;counter-reset:n}
.th li{counter-increment:n;position:relative;padding:7px 0 7px 30px;font-size:15px;line-height:1.7;border-top:1px dashed #cfdcf0}
.th li:first-child{border-top:0}
.th li:before{content:counter(n);position:absolute;left:0;top:9px;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;text-align:center;line-height:21px}
.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.th .sub{margin:3px 0 0;color:#444;font-size:14.5px;line-height:1.7}
.sc .lay.sum{border-left:4px solid #2e7d32;background:#f1f8f1}
/* ---- 새 직독직해·해설 화면 ---- */
.sc{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden;background:var(--bg)}
.sc-h{padding:11px 14px 10px;background:#eef2f8;border-bottom:1px solid var(--line)}
.sc-h .no2{display:inline-block;min-width:26px;height:26px;line-height:26px;border-radius:13px;background:var(--accent);color:#fff;font-weight:800;font-size:13px;text-align:center;padding:0 7px;margin-right:8px}
.sc-h .at{font-size:13px;color:var(--sub)}
.sc-h .tt{display:block;margin-top:7px;font-size:15.5px;font-weight:800;color:var(--accent);line-height:1.45}
.sc-b{padding:10px 12px 12px}
.sc .ch{margin-bottom:6px}
.sc .ce{font-size:17px}
.sc .ce sup,.nt sup{font-size:10px;font-weight:800;color:#b8651f;margin-left:1px}
.nts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.nt{font-size:13.5px;line-height:1.5;background:#fbf6ee;border:1px solid #f0e2cd;border-radius:8px;padding:5px 9px;color:#4a3a22}

.sc .lay{border-radius:10px}
.sc .lay.nat{border-left:4px solid var(--accent);background:#f7f9fc}

.sc .lb{margin-bottom:4px}
.qc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}
.qchip small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-bottom:1px}
.qchip.o{border-color:var(--good);background:var(--goodbg)}
.qchip.x{border-color:var(--bad);background:var(--badbg)}
.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.trs{list-style:none;margin:0;padding:0;background:var(--soft);border-radius:10px;padding:8px 12px}

.trs .n{display:inline-block;min-width:20px;font-size:12px;color:var(--sub);font-weight:700}
.evx{background:var(--goodbg);border:1px solid #bfe0cd;border-radius:10px;padding:10px 12px}

.opx{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px;background:var(--bg)}

.opx .bd.t{background:#b4472f}

.wds{display:flex;flex-wrap:wrap;gap:6px}

.wds b{margin-right:5px}
.toq{display:block;width:100%;margin-top:14px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}
details.sub2{margin:12px 0 0}
details.sub2>summary{list-style:none;cursor:pointer;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px;padding:6px 0}
details.sub2>summary::-webkit-details-marker{display:none}

.cr{color:#A3102E;font-weight:700}
.sc .lay.core{border-left:4px solid #2e7d32;background:#f1f8f1}
.ct{display:none;margin:7px 0 2px;padding:6px 9px;border-left:3px solid #d9a21b;background:#fff8e6;border-radius:6px;font-size:13.5px;line-height:1.55;color:#4d3b05}

.cks{margin:0 0 6px}.cchip{display:inline-block;font-size:12.5px;font-weight:700;color:#1f6f5f;background:#e5f4f0;border:1px solid #bfe3da;border-radius:999px;padding:4px 10px;text-decoration:none;margin:2px 4px 2px 0}

.rst{margin-top:8px;background:#fff8e1;border:1px solid #efe3b8;border-left:4px solid #d9a21b;border-radius:8px;padding:8px 10px;font-size:15px;line-height:1.7;word-break:keep-all}

}]}, {"no": "05", "typ": "어법", "src": "2018년 9월 28번", "evn": [4], "ev_en": "Memories of how we interacted seems funny to me today.", "ev_ko": [[4, "우리가 소통했던 방식에 대한 기억들이 현재 나에게는 우스워 보인다."]], "why": ["핵심 주어는 <b>Memories<\/b>(복수 명사)입니다", "of how we interacted는 Memories를 꾸며 주는 <b>수식어구<\/b>입니다", "주어가 복수이므로 동사도 복수형을 써야 합니다", "따라서 <b>seems → seem<\/b>으로 고쳐야 합니다."], "ch": [{"n": "①", "t": "which", "g": "관계대명사(~인 것)", "ok": false, "e": ["which 뒤에 동사 hated의 <b>목적어가 없는<\/b> 불완전한 문장이 이어집니다", "앞의 선행사 chores를 설명하며 목적어 역할을 하는 <b>목적격 관계대명사<\/b> which는 적절합니다", "관계대명사 앞에 콤마(,)가 있는 계속적 용법이므로 that은 쓸 수 없습니다."]}, {"n": "②", "t": "dealing", "g": "다루는 (현재분사)", "ok": false, "e": ["수식을 받는 명사와 분사의 관계가 능동이면 <b>현재분사<\/b>, 수동이면 과거분사를 씁니다", "man이 kid를 '다루는' 주체이므로 현재분사 dealing이 적절합니다."]}, {"n": "③", "t": "seems", "g": "보인다 (3인칭 단수 동사)", "ok": true, "e": ["핵심 주어 Memories가 복수 명사이므로 동사도 복수형 <b>seem<\/b>이어야 합니다."]}, {"n": "④", "t": "to do", "g": "하기로 (to부정사)", "ok": false, "e": ["decide는 <b>to부정사를 목적어로 취하는 동사<\/b>입니다", "따라서 to do는 어법에 맞습니다."]}, {"n": "⑤", "t": "that", "g": "너무 ~해서 …하다 (접속사)", "ok": false, "e": ["'너무 ~해서 …하다'는 뜻의 <b>so + 형용사/부사 + that + S + V<\/b> 구문입니다", "결과를 나타내는 부사절을 이끄는 접속사 that은 올바르게 쓰였습니다."]}], "tr": ["나의 아버지는 음악가로 매우 늦은 시간까지, 대략 새벽 3시까지 일하셨고, 그래서 그(아버지)는 주말마다 늦잠을 잤다.", "그 결과, 잔디 깎기와 울타리 덤불 자르기처럼 내가 싫어했던 허드렛일을 돌보라고 끊임없이 그가 나에게 잔소리한 것을 제외하고는 내가 어렸을 때 우리는 많은 관계를 가지지 못했다.", "그는 무책임한 아이를 다루는 책임감 있는 사람이었다.", "우리가 소통했던 방식에 대한 기억들이 현재 나에게는 우스워 보인다.", "예를 들어, 한번은 그가 나에게 잔디를 깎으라고 말했고 나는 앞뜰만 하고 뒤뜰을 하는 것은 미루기로 결심했으나, 그러고 나서 며칠 동안 비가 내렸고 뒤뜰의 잔디가 너무 길어서(길게 자라서) 나는 그것을 낫으로 베어내야만 했다.", "그 일(뒤뜰의 잔디를 낫으로 베는 일)은 너무 오래 걸려서 내가 끝냈을 때쯤에는 앞뜰은 (잔디가) 너무 길어서 깎을 수 없었고, 그런 일이 계속되었다."], "ps": [{"n": 1, "ch": [{"e": "My dad <b>worked<\/b> very late hours as a musician", "k": "나의 아버지는 음악가로 매우 늦은 시간까지 <b>일하셨고<\/b>"}, {"e": "— until about three in the morning —", "k": "— 대략 새벽 3시까지 —"}, {"e": "so he", "k": "그래서 그<span class=\"r\">(= 아버지)<\/span>는"}, {"e": "slept late on weekends.", "k": "주말마다 늦잠을 잤다."}], "easy": "아버지는 음악가로 새벽 3시쯤까지 일해서 주말마다 늦잠을 잤어요.", "gist": "이야기의 배경이다. 아버지의 직업과 생활 패턴을 말한다."}, {"n": 2, "ch": [{"e": "<b>As a result<\/b>,", "k": "<b>그 결과<\/b>,"}, {"e": "we didn’t have much of a relationship", "k": "우리는 많은 관계를 가지지 못했다"}, {"e": "when I was young", "k": "내가 어렸을 때"}, {"e": "<b>other than<\/b> him constantly nagging me", "k": "그<span class=\"r\">(= 아버지)<\/span>가 끊임없이 나에게 잔소리한 것을 <b>제외하고는<\/b>"}, {"e": "to take care of chores", "k": "허드렛일을 돌보라고"}, {"e": "like mowing the lawn and cutting the hedges,", "k": "잔디 깎기와 울타리 덤불 자르기처럼,"}, {"e": "which I hated.", "k": "내가 싫어했던<span class=\"r\">(= 허드렛일)<\/span>."}], "easy": "어릴 때 우리 사이에는 별다른 관계가 없었고, 아버지가 내가 싫어하던 집안일을 하라고 잔소리한 것이 거의 전부였어요.", "gist": "아버지가 늦게 일하는 생활의 결과를 말한다. 어린 시절 아버지와의 관계는 잔소리가 대부분이었다.", "link": "그 결과, 잔디 깎기와 울타리 덤불 자르기처럼 내가 싫어했던 허드렛일을 돌보라고 끊임없이 그가 나에게 잔소리한 것을 제외하고는, 내가 어렸을 때 우리는 많은 관계를 가지지 못했다."}, {"n": 3, "ch": [{"e": "He was a <b>responsible<\/b> man", "k": "그는 <b>책임감 있는<\/b> 사람이었다"}, {"e": "<b>dealing with<\/b> an irresponsible kid.", "k": "무책임한 아이를 <b>다루는<\/b>."}], "easy": "아버지는 책임감 있는 사람이었고, 상대는 무책임한 아이였다는 말이에요.", "gist": "아버지는 책임감 있는 사람, 글쓴이는 무책임한 아이로 대비해서 보여 준다."}, {"n": 4, "ch": [{"e": "Memories of how we interacted", "k": "우리가 소통했던 방식에 대한 기억들이"}, {"e": "<b>seem<\/b> funny to me today.", "k": "현재 나에게는 <b>우습게 보인다<\/b>. <span class=\"r\">※ 문제지엔 seems로 되어 있음<\/span>"}], "easy": "그때 우리가 어떻게 지냈는지에 대한 기억이 지금 나에게는 웃기게 느껴진다는 말이에요.", "gist": "지금 돌아보면 우습게 보인다고 하며, 곧이어 나올 예를 이끄는 문장이다."}, {"n": 5, "ch": [{"e": "<b>For example<\/b>,", "k": "<b>예를 들어<\/b>,"}, {"e": "one time he told me to cut the grass", "k": "한번은 그가 나에게 잔디를 깎으라고 말했고"}, {"e": "and I decided to do just the front yard", "k": "나는 앞뜰만 하기로 결심했으나"}, {"e": "and <b>postpone<\/b> doing the back,", "k": "뒤뜰을 하는 것은 <b>미루기로<\/b>,"}, {"e": "but then it rained for a couple days", "k": "그러고 나서 며칠 동안 비가 내렸고"}, {"e": "and the backyard grass became <b>so high<\/b>", "k": "뒤뜰의 잔디가 <b>너무 길어서<\/b>(길게 자라서)"}, {"e": "I had to cut it with a sickle.", "k": "나는 그것을 낫으로 , "praise", "칭찬하다"], ["2", "unexpected gift", "예상치 못한 선물"], ["3", "take the time", "시간을 내다"]], "lit": "아마도 이 사람은 당신을 칭찬했거나 / 예상치 못한 선물을 주었거나 / 시간을 내어 당신에게 편지를 써 주었을 것이다", "nat": "아마도 그 사람은 당신을 칭찬했거나, 예상치 못한 선물을 주었거나, 시간을 내어 당신에게 편지를 써 주었을 것이다.", "ana": "동사 <b>praised, gave, took</b> 세 개가 콤마와 or로 <b>병렬</b> 연결된 구조이다.", "pe": "\u0001Maybe\u0002 this person praised<sup>1</sup> you, / gave you an \u0001unexpected\u0002 gift<sup>2</sup>, / or took the time<sup>3</sup> \u0001to write you a letter\u0002.", "pk": "\u0001아마도\u0002 이 사람은 당신을 칭찬했거나 / \u0001예상치 못한\u0002 선물을 주었거나 / 시간을 내어 \u0001당신에게 편지를 써\u0002 주었을 것이다", "core": "이 사람은 당신을 칭찬했거나, 선물을 주었거나, 시간을 냈을 것이다.", "tags": ["(Maybe) = 부사: 문장 전체를 꾸밈. 주어 this person, 동사 <b>praised</b>, 목적어 you (SVO)", "동사 <b>gave</b>, 간접목적어 you, 직접목적어 gift (SVOO). (unexpected) = 형용사: gift를 꾸밈", "<b>or</b>로 이어진 세 번째 동사 <b>took</b>, 목적어 the time. (to write ~) = to부정사(형용사적): the time을 꾸밈. take the time = 시간을 내다"], "steps": [{"t": "이 문장은 <b>같은 주어에 동사 3개가 병렬</b>된 문장이다. 동사마다 문형이 다르다."}, {"t": "공통 주어와 동사 3개를 찾는다.", "sub": ["S: this person (이 사람. 앞 문장의 somebody를 가리킨다)", "V1: praised (praise 칭찬하다의 과거형) + O: you (너를) → 3형식", "V2: gave (give 주다의 과거형) + IO: you + DO: an unexpected gift (예상치 못한 선물) → 4형식", "V3: took (take 들이다, 내다의 과거형) + O: the time (시간) → 3형식", "Maybe (아마)는 문장 전체를 꾸미는 부사"]}, {"t": "V3의 <b>to write you a letter</b>는 <b>to부정사(형용사적 용법)</b>로 the time을 꾸민다. '편지를 쓸 시간'.", "sub": ["write IO: you + DO: a letter (편지) → 4형식", "take the time to V = 시간을 내어 ~하다"]}, {"t": "함정: 콤마로 끊겨 있지만 새 문장이 아니라 praised, gave, took가 <b>or로 연결된 병렬</b>이다."}], "sum": "그 사람은 칭찬, 뜻밖의 선물, 편지 중 하나를 해 줬을 것"}, {"i": "07", "q": "05", "s": "2", "title": "S+V+O + other than 동명사 + 계속적 관계절", "eng": "As a result, we didn’t have much of a relationship when I was young / other than him constantly nagging<sup>1</sup> me to take care of chores<sup>2</sup> like mowing the lawn<sup>3</sup> and cutting the hedges<sup>4</sup>, / which I hated.", "notes": [["1", "nag", "잔소리하다"], ["2", "chore", "집안일"], ["3", "mow the lawn", "잔디를 깎다"], ["4", "cut the hedge", "산울타리를 다듬다"]], "lit": "그 결과, 내가 어렸을 때 우리는 별다른 관계를 가지지 못했다 / 그가 끊임없이 나에게 잔디를 깎고 산울타리를 다듬는 것과 같은 집안일을 하라고 잔소리하는 것 외에는 / 그리고 그것을 나는 싫어했다", "nat": "그 결과, 내가 어렸을 때 우리는 그가 잔디를 깎고 산울타리를 다듬는 것 같은 집안일을 하라고 끊임없이 잔소리하는 것 외에는 별다른 관계를 가지지 못했는데, 그것을 나는 싫어했다.", "ana": "<b>other than</b> 뒤에는 동명사의 의미상 주어 him이 오는 동명사구가 쓰였고, 마지막 <b>which</b>는 앞 절 전체를 선행사로 받는 계속적 용법이다.", "pe": "\u0001As a result\u0002, we didn’t have much of a relationship \u0001when I was young\u0002 / \u0001other than him constantly nagging<sup>1</sup> me to take care of chores<sup>2</sup> like mowing the lawn<sup>3</sup> and cutting the hedges<sup>4</sup>\u0002, / \u0001which I hated\u0002.", "pk": "\u0001그 결과\u0002, \u0001내가 어렸을 때\u0002 우리는 별다른 관계를 가지지 못했다 / \u0001그가 끊임없이 나에게 잔디를 깎고 산울타리를 다듬는 것과 같은 집안일을 하라고 잔소리하는 것 외에는\u0002 / \u0001그리고 그것을 나는 싫어했다\u0002", "core": "우리는 별다른 관계를 가지지 못했다.", "tags": ["(As a result) = 전치사구(부사구): 문장 전체를 꾸밈. 주어 we, 동사 <b>didn't have</b>, 목적어 much of a relationship (SVO). (when절) = 부사절(때): didn't have를 꾸밈", "(other than ~) = 전치사구(부사구): ~ 외에는, didn't have를 꾸밈. 안의 him은 nagging의 <b>의미상 주어</b>. nag + 목적어 + to부정사 (~하라고 잔소리하다)", "(which절) = 계속적 관계절(형용사절): 앞 내용 전체를 받음. 앞에서 뒤로 \"~했는데, 그것을\""], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b> 뒤에 <b>other than + 동명사</b>와 <b>계속적 관계절</b>이 이어져 길어졌다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: we (우리)", "V: didn't have (have 가지다의 과거 부정)", "O: much of a relationship (별다른 관계)", "As a result (그 결과)는 문장 전체를 꾸미는 부사구", "뼈대 = <b>we didn't have much of a relationship</b>"]}, {"t": "<b>when I was young</b>은 <b>부사절(때)</b>이다. S: I, V: was, C: young (어린)"}, {"t": "<b>other than him constantly nagging me ~</b>는 '~ 외에는'이라는 전치사구(부사구)이다.", "sub": ["other than 뒤 nagging은 <b>동명사</b>, him은 nagging의 의미상 주어 (nag 잔소리하다). constantly (끊임없이)는 nagging을 꾸미는 부사", "<b>nag A to V</b> = A에게 ~하라고 잔소리하다 → nag me to take care of chores (나에게 집안일을 처리하라고)", "chores like mowing the lawn and cutting the hedges: like 뒤 동명사 두 개가 병렬 (잔디를 깎는 것, 산울타리를 다듬는 것)"]}, {"t": "<b>which I hated</b>는 <b>계속적 관계절</b>이다. which는 앞 내용을 받는다. '~했는데, 그것을 싫어했다'.", "sub": ["S: I, V: hated (hate 싫어하다의 과거형), O: which", "which는 앞에서 말한 '그가 잔소리하는 것'을 받는 것으로 본다."]}], "sum": "어릴 때 잔디·울타리 집안일 잔소리 말고는 별 관계가 없었음"}, {"i": "08", "q": "06", "s": "6", "title": "S+V+O + as 전치사구 + 때의 부사절", "eng": "We use the phrase “That’s easy for you to say” as a criticism<sup>1</sup>, / usually when we are seeking to<sup>2</sup> invalidate<sup>3</sup> someone’s opinion.", "notes": [["1", "criticism", "비판"], ["2", "seek to", "~하려 하다"], ["3", "invalidate", "무효화하다, 무시하다"]], "lit": "우리는 '그렇게 말하기는 쉽지'라는 표현을 비판으로 사용한다 / 보통 우리가 누군가의 의견을 무효화하려 할 때", "nat": "우리는 '네가 그렇게 말하기는 쉽지'라는 표현을, 보통 누군가의 의견을 무시하려 할 때, 비판으로 사용한다.", "ana": "'That's easy for you to say'는 <b>가주어 없이 관용적으로 굳어진 to부정사 구문</b>이며, seeking to invalidate는 '~하려 시도하다'라는 뜻의 진행형이다.", "pe": "We use the phrase \u0001“That’s easy for you to say”\u0002 \u0001as a criticism<sup>1</sup>\u0002, / \u0001usually when we are seeking to<sup>2</sup> invalidate<sup>3</sup> someone’s opinion\u0002.", "pk": "우리는 \u0001'그렇게 말하기는 쉽지'라는\u0002 표현을 \u0001비판으로\u0002 사용한다 / \u0001보통 우리가 누군가의 의견을 무효화하려 할 때\u0002", "core": "우리는 표현을 사용한다.", "tags": ["주어 We, 동사 <b>use</b>, 목적어 the phrase. (“That’s ~ say”) = 동격 어구: phrase 설명. (as a criticism) = 부사구: 거의 필수에 가까운 부사구 [기준: 모양 규칙]", "(usually when절) = 부사절(때): use를 꾸밈. seek to V = ~하려 하다"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이고 목적어가 <b>따옴표 표현</b>이라 길어 보인다. 뒤에 부사절도 붙는다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: We (우리)", "V: use (사용하다)", "O: the phrase \"That's easy for you to say\" (그렇게 말하기는 쉽지라는 표현)", "뼈대 = <b>We use the phrase</b>"]}, {"t": "<b>as a criticism</b> (비판으로)은 <b>use A as B</b> (A를 B로 사용하다)의 as 전치사구이다. 기준: 3형식 + as 전치사구.", "sub": ["따옴표 안은 phrase를 설명한다. S: That, V: 's(is), C: easy (쉬운)", "<b>for you to say</b>는 to부정사(부사적 용법)로 형용사 easy를 꾸미며, for you가 의미상 주어이다. '네가 말하기에 쉽다'."]}, {"t": "<b>usually when we are seeking to invalidate someone's opinion</b>은 <b>부사절(때)</b>이다. 빼도 앞 문장이 완결되므로 부사절이다.", "sub": ["S: we, V: are seeking (seek ~하려 하다의 진행형)", "to invalidate (무효화하다) someone's opinion (누군가의 의견)은 seeking의 목적어 역할을 하는 to부정사"]}], "sum": "'말은 쉽지'는 상대 의견을 무시하려 할 때 쓰는 비판"}], "qs": [{"q": "01", "type": "목적", "src": "2014년 9월 18번", "ans": "⑤", "tr": [["1", "저는 귀사의 잡지를 약 15년간 구독해 왔습니다."], ["2", "캘리포니아 산 호아킨 밸리에 있는 프레즈노를 언급한 대기 오염에 관한 귀사의 최근 기사는 대체로 정확했습니다."], ["3", "하지만 그 기사는 프레즈노가 살기 힘든 곳이라는 인상을 주었을 수도 있는데, 이는 사실과는 거리가 멉니다."], ["4", "이 도시에는 50만 명의 살아 숨 쉬는 시민들이 있고, 그 카운티에는 90만 명 정도가 살고 있습니다."], ["5", "우리 모두가 고통받고 있는 것은 아닙니다."], ["6", "저는 거의 매일 자전거를 타는데, 은퇴 연령을 훌쩍 넘긴 나이임에도 어떤 나쁜 영향도 아직 겪은 적이 없습니다."], ["7", "우리는 요세미티와 세쿼이아 국립공원, 여러 산속 호수와 강에 가까이 있고, 태평양에도 쉽게 갈 수 있습니다."], ["8", "그러므로 일부 필자들이 남긴 인상과는 반대로, 우리 프레즈노 주민들 모두가 어떤 끔찍한 곳에서 고통받고 있는 것은 아닙니다."]], "evh": "2·3번 문장", "ev": [{"en": true, "h": "Your recent article on air pollution ~ was essentially correct. However, it may have given the impression that Fresno is unlivable, which is far from the truth."}, {"en": false, "h": "기사가 대체로 정확했다고 인정하면서도 프레즈노가 살기 힘든 곳이라는 잘못된 인상을 주었다고 지적하는 2~3번 문장을 통해, 글쓴이가 기사 내용에 대해 이의를 제기하고 있음을 알 수 있다."}], "opts": [{"n": "①", "t": "최신호 잡지의 내용을 소개하려고", "a": false, "x": true, "trap": false, "e": "이는 새 잡지를 소개하는 글이 아니라 이미 실린 기사에 대한 반박이다."}, {"n": "②", "t": "국립공원의 관리 소홀을 지적하려고", "a": false, "x": true, "trap": false, "e": "국립공원은 프레즈노가 가깝다는 긍정적인 예시로 언급될 뿐, 관리 소홀에 대한 지적은 없다."}, {"n": "③", "t": "도시 공기 오염의 심각성을 알리려고", "a": false, "x": true, "trap": true, "e": "글쓴이는 오히려 공기 오염 기사가 준 인상이 과장되었다고 반박하고 있다."}, {"n": "④", "t": "정기구독자를 위한 할인 혜택을 요구하려고", "a": false, "x": true, "trap": false, "e": "할인이나 혜택에 관한 언급은 전혀 없다."}, {"n": "⑤", "t": "잡지에 실린 기사 내용에 이의를 제기하려고", "a": true, "x": false, "trap": false, "e": "기사가 준 '살기 힘든 곳'이라는 인상이 사실과 다르다고 반박하는 전체 흐름과 정확히 일치한다."}], "w": [["subscriber", "구독자"], ["essentially", "본질적으로"], ["impression", "인상"], ["unlivable", "살기 힘든"], ["far from", "결코 ~이 아닌"], ["be home to", "~의 본거지이다"], ["ill effect", "나쁜 영향"], ["retirement age", "은퇴 연령"], ["accessible", "접근하기 쉬운"], ["contrary to", "~와는 반대로"], ["hell hole", "끔찍한 곳"]]}, {"q": "02", "type": "주제", "src": "2020년 11월 23번", "ans": "①", "tr": [["1", "전기를 생산하기 위해 재생 가능한 에너지원을 사용하는 것은 전력 공급을 확보해야 할 필요성과 환경 보호라는 목표를 조화시키는 방법으로 점점 더 장려되어 왔다."], ["2", "하지만 재생 가능한 에너지원의 사용에도 나름의 결과가 따르며, 이는 고려가 필요하다."], ["3", "재생 가능한 에너지원에는 수력 발전과 해양 기반 기술처럼 다양한 자원이 포함된다."], ["4", "게다가 태양열, 풍력, 지열, 바이오매스 같은 재생 가능한 에너지원들도 저마다 환경에 영향을 미친다."], ["5", "예를 들어, 수력 발전 댐은 수중 생태계에 영향을 미치며, 최근에는 온실가스의 주요 배출원으로도 확인되었다."], ["6", "풍력, 태양열, 바이오매스 역시 시각 공해, 집약적인 토지 점유, 조류 개체 수에 미치는 부정적인 영향과 같은 부정적인 환경적 영향을 일으킨다."]], "evh": "2·4번 문장", "ev": [{"en": true, "h": "But the use of renewable sources also comes with its own consequences, which require consideration. / Additionally, solar, wind, geothermal and biomass renewable sources also have their own impact on the environment."}, {"en": false, "h": "재생 에너지 사용에도 환경적 대가가 따른다는 2번 문장과, 이어지는 태양광·풍력 등 구체적 재생에너지원의 환경 영향 설명(4~6번)을 종합하면 주제는 '재생에너지 사용의 환경적 부작용'이다."}], "opts": [{"n": "①", "t": "environmental side effects of using renewable energy sources", "a": true, "x": false, "trap": false, "e": "재생에너지 사용이 낳는 환경적 부작용을 구체적 사례로 설명하는 전체 흐름과 정확히 일치한다."}, {"n": "②", "t": "practical methods to meet increasing demand for electricity", "a": false, "x": true, "trap": false, "e": "전력 수요 증가 대응 방법에 관한 내용은 없다."}, {"n": "③", "t": "negative impacts of the use of traditional energy sources", "a": false, "x": true, "trap": true, "e": "전통 에너지원이 아니라 재생 에너지원의 영향을 다룬다."}, {"n": "④", "t": "numerous ways to obtain renewable sources of energy", "a": false, "x": true, "trap": false, "e": "에너지를 얻는 방법이 아니라 그 영향을 다룬다."}, {"n": "⑤", "t": "effective procedures to reduce greenhouse emissions", "a": false, "x": true, "trap": false, "e": "온실가스 감축 절차에 관한 내용은 없다."}], "w": [["renewable", "재생 가능한"], ["harmonize", "조화시키다"], ["secure", "확보하다"], ["objective", "목표"], ["consequence", "결과"], ["hydropower", "수력 발전"], ["aquatic ecosystem", "수중 생태계"], ["identify", "확인하다"], ["significant", "상당한"], ["greenhouse emission", "온실가스 배출"], ["visual pollution", "시각 공해"], ["intensive", "집약적인"], ["land occupation", "토지 점유"], ["bird population", "조류 개체 수"]]}, {"q": "03", "type": "제목", "src": "2017년 9월 23번", "ans": "②", "tr": [["1", "과잉보호하는 부모는 아이들이 모든 자연적 결과를 겪지 않도록 막는다."], ["2", "안타깝게도, 그런 부모의 아이들은 부모가 정한 규칙 이면의 이유를 명확히 이해하지 못하는 경우가 많다."], ["3", "그들은 부모가 자신이 잘못된 선택을 하지 못하도록 막았기 때문에, 실패에서 회복하는 법이나 실수에서 벗어나는 법을 결코 배우지 못한다."], ["4", "'밖이 추우니까 재킷을 입어야겠다'라고 스스로 배우는 대신, 아이는 '엄마가 시키니까 재킷을 입어야 한다'라고 결론지을 수도 있다."], ["5", "현실 세계의 결과를 경험할 기회가 없다면, 아이들은 부모가 특정 규칙을 만드는 이유를 항상 이해하지는 못한다."], ["6", "자연적 결과는 아이들이 자신의 선택이 가져올 잠재적 결과를 생각하도록 도와줌으로써 그들을 성인기에 대비시킨다."]], "evh": "3·6번 문장", "ev": [{"en": true, "h": "They never learn how to bounce back from failure ~ because their parents prevented them from making poor choices. / Natural consequences prepare children for adulthood by helping them think about the potential consequences of their choices."}, {"en": false, "h": "자연적 결과를 겪지 못한 아이들이 회복력을 배우지 못한다는 3번과, 자연적 결과가 아이들을 성인기에 대비시킨다는 6번을 종합하면 제목은 '자연적 결과가 아이를 가르치게 하라'이다."}], "opts": [{"n": "①", "t": "Dark Sides of the Virtual World", "a": false, "x": true, "trap": false, "e": "가상 세계에 관한 언급은 전혀 없다."}, {"n": "②", "t": "Let Natural Consequences Teach Kids", "a": true, "x": false, "trap": false, "e": "자연적 결과를 통한 학습의 중요성을 강조하는 전체 내용과 정확히 일치한다."}, {"n": "③", "t": "The More Choices, the More Mistakes", "a": false, "x": true, "trap": false, "e": "선택의 개수와 실수의 상관관계는 본문 내용이 아니다."}, {"n": "④", "t": "Listen to Kids to Improve Relationships", "a": false, "x": true, "trap": true, "e": "아이의 말을 경청하는 것에 관한 내용이 아니다."}, {"n": "⑤", "t": "The Benefits of Overprotective Parenting", "a": false, "x": true, "trap": false, "e": "본문은 오히려 과잉보호의 부정적 결과를 다루므로 정반대다."}], "w": [["overprotective", "과잉보호하는"], ["spare A from B", "A가 B를 겪지 않게 하다"], ["natural consequence", "자연적 결과"], ["lack", "부족하다"], ["bounce back", "회복하다"], ["recover", "회복하다"], ["prevent A from B", "A가 B하지 못하게 막다"], ["poor choice", "잘못된 선택"], ["conclude", "결론짓다"], ["real-world", "현실 세계의"], ["prepare
