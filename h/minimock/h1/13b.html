<title>고1 미니모의고사 13회 07–12번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:0}
#app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
#app>.wrap{width:100%}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}
.ko{color:var(--sub);font-size:14px;margin-left:6px}
.cell.bad{background:var(--badbg);border-color:var(--bad)}
.cell.bad .tag{background:var(--bad)}
.locked .cell{pointer-events:none}
.bar{position:sticky;margin-top:auto;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.done .opt{pointer-events:none}
.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}
.hcard .chip{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--sub)}
.hcard .chip.ok{background:var(--goodbg);color:var(--good)}
.hcard .chip.warn{background:var(--badbg);color:var(--bad)}
.hcard[disabled]{opacity:.55}
details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.th .hd{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:6px}
.th ol{list-style:none;margin:0;padding:0;counter-reset:n}
.th li{counter-increment:n;position:relative;padding:7px 0 7px 30px;font-size:15px;line-height:1.7;border-top:1px dashed #cfdcf0}
.th li:first-child{border-top:0}
.th li:before{content:counter(n);position:absolute;left:0;top:9px;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;text-align:center;line-height:21px}
.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.th .sub{margin:3px 0 0;color:#444;font-size:14.5px;line-height:1.7}
.sc .lay.sum{border-left:4px solid #2e7d32;background:#f1f8f1}
/* ---- 새 직독직해·해설 화면 ---- */
.sc{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden;background:var(--bg)}
.sc-h{padding:11px 14px 10px;background:#eef2f8;border-bottom:1px solid var(--line)}
.sc-h .no2{display:inline-block;min-width:26px;height:26px;line-height:26px;border-radius:13px;background:var(--accent);color:#fff;font-weight:800;font-size:13px;text-align:center;padding:0 7px;margin-right:8px}
.sc-h .at{font-size:13px;color:var(--sub)}
.sc-h .tt{display:block;margin-top:7px;font-size:15.5px;font-weight:800;color:var(--accent);line-height:1.45}
.sc-b{padding:10px 12px 12px}
.sc .ch{margin-bottom:6px}
.sc .ce{font-size:17px}
.sc .ce sup,.nt sup{font-size:10px;font-weight:800;color:#b8651f;margin-left:1px}
.nts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.nt{font-size:13.5px;line-height:1.5;background:#fbf6ee;border:1px solid #f0e2cd;border-radius:8px;padding:5px 9px;color:#4a3a22}
.nt b{color:#33260f}
.sc .lay{border-radius:10px}
.sc .lay.nat{border-left:4px solid var(--accent);background:#f7f9fc}
.sc .lay.ana{background:#fff8e6;border-color:#f0dcc0;color:#4d3b05}
.sc .lay.ana b,.why2 b,.opx b,.evx b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.sc .lb{margin-bottom:4px}
.qc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}
.qchip small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-bottom:1px}
.qchip.o{border-color:var(--good);background:var(--goodbg)}
.qchip.x{border-color:var(--bad);background:var(--badbg)}
.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.trs{list-style:none;margin:0;padding:0;background:var(--soft);border-radius:10px;padding:8px 12px}
.trs li{font-size:15px;line-height:1.75;padding:2px 0}
.trs .n{display:inline-block;min-width:20px;font-size:12px;color:var(--sub);font-weight:700}
.evx{background:var(--goodbg);border:1px solid #bfe0cd;border-radius:10px;padding:10px 12px}

.opx{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px;background:var(--bg)}
.opx.a{border-color:var(--good);background:var(--goodbg)}
.opx .ot{font-size:15.5px;font-weight:700;line-height:1.55}
.opx .mk{display:inline-block;min-width:22px;font-weight:800;color:var(--sub);margin-right:4px}
.opx.a .mk{color:var(--good)}

.opx .bd.g{background:var(--good)}
.opx .bd.t{background:#b4472f}
.opx p{margin:5px 0 0;font-size:14.5px;line-height:1.7;color:#333}
.opx .xm{color:var(--bad);font-weight:800;margin-right:3px}
.wds{display:flex;flex-wrap:wrap;gap:6px}
.wds span{font-size:14px;background:var(--soft);border-radius:8px;padding:5px 9px;line-height:1.45}
.wds b{margin-right:5px}
.toq{display:block;width:100%;margin-top:14px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}
details.sub2{margin:12px 0 0}
details.sub2>summary{list-style:none;cursor:pointer;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px;padding:6px 0}
details.sub2>summary::-webkit-details-marker{display:none}
details.sub2>summary:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
details.sub2>summary:after{content:"+";margin-left:auto;font-size:18px;color:var(--sub)}

.cr{color:#A3102E;font-weight:700}
.sc .lay.core{border-left:4px solid #2e7d32;background:#f1f8f1}
.ct{display:none;margin:7px 0 2px;padding:6px 9px;border-left:3px solid #d9a21b;background:#fff8e6;border-radius:6px;font-size:13.5px;line-height:1.55;color:#4d3b05}

.cks{margin:0 0 6px}.cchip{display:inline-block;font-size:12.5px;font-weight:700;color:#1f6f5f;background:#e5f4f0;border:1px solid #bfe3da;border-radius:999px;padding:4px 10px;text-decoration:none;margin:2px 4px 2px 0}

.rst{margin-top:8px;background:#fff8e1;border:1px solid #efe3b8;border-left:4px solid #d9a21b;border-radius:8px;padding:8px 10px;font-size:15px;line-height:1.7;word-break:keep-all}

    if(parts.length)out.push({i:i,w:w,parts:parts});
  });
  return out;
}

function dwItem(q,k){const L=DW[q]||[];for(let i=0;i<L.length;i++)if(L[i][0]===k)return L[i];return null;}
function dwMark(head,on){document.querySelectorAll('.dw').forEach(function(x){const p=x.closest('[data-q]');const y=p&&dwItem(p.dataset.q,x.dataset.k);if(y&&(y[2]||y[0])===head)x.classList.toggle('on',on);});}
function dwWrap(){
  S.dw=S.dw||{};
  const roots=[];
  document.querySelectorAll('.sc[data-q]').forEach(function(sc){roots.push([sc.dataset.q,sc.querySelectorAll('.ce')]);});
  document.querySelectorAll('details.qd[data-q]').forEach(function(d){roots.push([d.dataset.q,d.querySelectorAll('.e,.en')]);});
  roots.forEach(function(r){
    const q=r[0],L=DW[q]||[];if(!L.length)return;
    const re=new RegExp("(^|[^A-Za-z])("+L.map(function(x){return x[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/'/g,"['\u2019]")}).join('|')+")(?![A-Za-z])",'gi');
    r[1].forEach(function(el){
      const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),nodes=[];let n;while((n=w.nextNode()))nodes.push(n);
      nodes.forEach(function(nd){
        if(nd.parentNode.closest('.dw'))return;
        const s=nd.nodeValue;re.lastIndex=0;let m,last=0,frag=null;
        while((m=re.exec(s))){
          const st=m.index+m[1].length,surf=m[2],key=surf.toLowerCase().replace(/\u2019/g,"'");
          const it=dwItem(q,key);if(!it)continue;
          if(!frag)frag=document.createDocumentFragment();
          if(st>last)frag.appendChild(document.createTextNode(s.slice(last,st)));
          const sp=document.createElement('span');sp.className='dw'+(S.dw[it[2]||it[0]]?' on':'');sp.dataset.k=key;sp.textContent=surf;frag.appendChild(sp);
          last=st+surf.length;
        }
        if(frag){if(last<s.length)frag.appendChild(document.createTextNode(s.slice(last)));nd.parentNode.replaceChild(frag,nd);}
      });
    });
  });
}

skyrocket</div><div class=\"k\">그의(= 사업가) 판매 실적이 급등할 수 있고</div></div><div class=\"rc\"><div class=\"e\">and his numbers can get even better.</div><div class=\"k\">그의 숫자들(수익)이 훨씬 더 나아질 수 있다</div></div><div class=\"rnat\">혹은 또 다른 시나리오에서는, 그의 판매 실적이 급등하고 그의 숫자들(수익)이 훨씬 더 나아질 수 있다.</div><div class=\"rst\">아니면 반대로 대회에서 골을 많이 넣어 대표로 뽑혀 길이 확 넓어질 수도 있어요. = 지문 5번, 판매가 급등하는 경우예요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">In any event,</div><div class=\"k\">어떤 상황에서든</div></div><div class=\"rc\"><div class=\"e\">he will be foolish</div><div class=\"k\">어리석은 일이 될 것이다 (그가 ~하는 것은)</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">to stick to his old vision</span></div><div class=\"k\"><span class=\"cw\">그의 오래된(기존의) 비전을 고수하는</span></div></div><div class=\"rc\"><div class=\"e\">in the face of new data.</div><div class=\"k\">새로운 데이터에 직면했을 때</div></div><div class=\"rnat\">어떤 상황에서든, 그가 새로운 데이터에 직면했을 때 그의 오래된(기존의) 비전을 고수하는 것은 어리석은 일이 될 것이다.</div><div class=\"rst\"><b>어느 쪽이든</b>(In any event) 바뀐 상황에서 옛 계획만 붙잡는 건 어리석어요. 지문 6번이 바로 이 말이에요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">There is nothing wrong</div><div class=\"k\">아무런 문제가 없다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">in modifying your vision</span></div><div class=\"k\"><span class=\"cw\">당신의 비전을 수정하는 것에는</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">or even abandoning it</span>,</div><div class=\"k\"><span class=\"cw\">또는 심지어 그것을 버리는 것에는</span></div></div><div class=\"rc\"><div class=\"e\">as necessary.</div><div class=\"k\">필요에 따라</div></div><div class=\"rnat\">필요에 따라, 당신의 비전을 수정하거나 심지어 그것을 버리는 것에는 아무런 문제가 없다.</div><div class=\"rst\">필요하면 꿈을 <b>고치거나</b>(modify 수정하다) 아예 바꿔도 전혀 문제없어요. = 지문 7번, 그게 빈칸의 답이에요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"unpredictable\" data-m=\"예측할 수 없는\"><b>unpredictable</b>예측할 수 없는</button><button type=\"button\" class=\"wdb\" data-w=\"forecast\" data-m=\"예측, 전망\"><b>forecast</b>예측, 전망</button><button type=\"button\" class=\"wdb\" data-w=\"recession\" data-m=\"경기 침체\"><b>recession</b>경기 침체</button><button type=\"button\" class=\"wdb\" data-w=\"foresee\" data-m=\"예견하다\"><b>foresee</b>예견하다</button><button type=\"button\" class=\"wdb\" data-w=\"in the face of\" data-m=\"~에 직면하여\"><b>in the face of</b>~에 직면하여</button><button type=\"button\" class=\"wdb\" data-w=\"modify\" data-m=\"수정하다\"><b>modify</b>수정하다</button></div>", "08": "<p class=\"mtr\">마더텅 정답률 <b>65%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸은 “~할 때까지 <b>기다리지 마라</b>”의 그 시점이에요. 바로 뒤 <b>6번</b>이 “<b>이미 배고플 때</b> 시작하면 굶주린다”로 이유를 대 주니, 그 시점을 그대로 받으세요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (4번)</span><div class=\"en\">Try not to wait until <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span>.</span></div><p class=\"ko\">( ? )할 때까지 기다리지 않으려고 노력해 봐라</p></div><div class=\"ck-via\"><i>▼</i><span>왜 기다리면 안 되는지: 준비가 오래 걸려요</span></div><div class=\"ck-step\"><span class=\"lab\">5번 문장 · 이유의 바탕</span><div class=\"en\">When you have a newborn baby, preparing food will probably <mark>take longer</mark> than usual.</div><p class=\"ko\">신생아가 있을 때, 음식을 준비하는 것은 아마 평소보다 <mark>시간이 더 걸릴 것이다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>기다리면 안 되는 바로 그 시점 = 이미 배고플 때</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 결정적 단서</span><div class=\"en\">If you start <mark>when you are already hungry</mark>, you will be absolutely starving before the food is ready.</div><p class=\"ko\">만일 당신이 <mark>이미 배고플 때</mark> 시작한다면, 음식이 준비되기 전에 틀림없이 굶주릴 것이다.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>7번</em>굶주리고 지치면 건강하게 먹기 어려움</span><span><em>8·9번</em>패스트푸드·과자로 손이 감, 매일은 안 됨</span></div><div class=\"ck-eq\">⇒ 배고파질 때까지 기다린 결과 = 나쁜 식사</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">you are really hungry to think about eating 먹을 생각이 들 만큼 정말 배고파지다<small>6번 already hungry(이미 배고픈)를 그대로 받아요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">your baby cries to be fed at night 아기가 밤에 먹을 것을 달라고 울다</span><span class=\"why\">1번·5번에 newborn baby(신생아)가 나와서 끌리지만, 6번이 말하는 시점은 아기가 아니라 내가 배고플 때예요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">you find a new recipe for your meal 식사를 위한 새 요리법을 찾다</span><span class=\"why\">새 요리법 이야기는 지문에 없어요. 3번의 trick(요령)은 요리법이 아니라 언제 준비를 시작하느냐예요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">your kids finish all the food on their plates 아이들이 접시의 음식을 다 먹다</span><span class=\"why\">아이들이 다 먹을 때까지 기다린다는 말은 없어요. 6~8번은 내가 굶주려서 나쁜 음식을 먹게 되는 이야기예요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">you feel like taking a nap after a heavy meal 배불리 먹고 낮잠 자고 싶다</span><span class=\"why\">배부른 뒤가 아니라 배고픈 상태가 문제예요. 6번은 음식이 준비되기 전에 굶주린다고 했어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">It is not always easy</div><div class=\"k\">~하는 것은 항상 쉬운 것은 아니다</div></div><div class=\"rc\"><div class=\"e\">to eat well</div><div class=\"k\">잘 먹는 것이</div></div><div class=\"rc\"><div class=\"e\">when you have a newborn baby.</div><div class=\"k\">신생아가 있을 때(신생아를 기를 때)</div></div><div class=\"rnat\">당신이 신생아가 있을 때(신생아를 기를 때) 잘 먹는 것이 항상 쉬운 것은 아니다.</div><div class=\"rst\">학원 끝나고 시험공부까지 하는 시험 기간엔 밥을 잘 챙겨 먹기가 쉽지 않아요. = 지문 1번, 갓난아기를 키울 때 잘 먹기 어렵다는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">It can seem like</div><div class=\"k\">~처럼 보일 수 있다</div></div><div class=\"rc\"><div class=\"e\">you do not have time</div><div class=\"k\">당신은 시간이 없는 것</div></div><div class=\"rc\"><div class=\"e\">to prepare tasty nutritious meals</div><div class=\"k\">맛있고 영양가가 높은 식사를 준비할</div></div><div class=\"rc\"><div class=\"e\">or even to eat them.</div><div class=\"k\">혹은 심지어 그것들(= 식사들)을 먹을</div></div><div class=\"rnat\">당신은 맛있고 영양가가 높은 식사를 준비할 시간 혹은 심지어 그것들을 먹을 시간이 없는 것처럼 보일 수 있다.</div><div class=\"rst\">맛있고 건강한 밥을 차릴 시간도, 먹을 시간도 없는 것 같아요. 지문 2번도 그렇게 느껴질 수 있다고 해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">You will need to learn</div><div class=\"k\">당신은 배울 필요가 있을 것이다</div></div><div class=\"rc\"><div class=\"e\">the following trick.</div><div class=\"k\">다음의 요령을</div></div><div class=\"rnat\">당신은 다음의 요령을 배울 필요가 있다.</div><div class=\"rst\">그래서 지문은 <b>다음 요령</b>(trick)을 배우라고 해요. 바로 뒤에 그 요령이 나와요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">Try not to wait until</div><div class=\"k\">~할 때까지 기다리지 않으려고 노력해 봐라</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">you are really hungry</span></div><div class=\"k\"><span class=\"cw\">당신이 정말 배고플</span></div></div><div class=\"rc\"><div class=\"e\">to think about eating.</div><div class=\"k\">먹을 생각이 들 정도로 ※ 문제지엔 빈칸으로 되어 있음 (정답: you are really hungry to think about eating)</div></div><div class=\"rnat\">당신이 (빈칸) 때까지 기다리지 않으려고 노력해 봐라.</div><div class=\"rst\">요령은 이거예요. <b>배가 정말 고파질 때까지</b> 기다렸다가 먹을 생각을 하지 마세요. = 빈칸 자리예요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">When you have a newborn baby,</div><div class=\"k\">신생아가 있을 때(신생아를 기를 때)</div></div><div class=\"rc\"><div class=\"e\">preparing food</div><div class=\"k\">음식을 준비하 >마더텅 정답률 <b>50%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">삽입은 주어진 문장의 <b>연결 신호</b>를 잡는 문제. <b>Yet</b>(그러나)으로 “도서관이 시끄러워졌다”를 뒤집고, 바로 뒤 7번의 <b>this need</b>(이러한 요구)가 “조용함을 원하는 마음”을 받아야 해요.</p><div class=\"ck-step\"><span class=\"lab\">주어진 문장 · 연결 신호</span><div class=\"en\"><mark>Yet</mark> libraries must still provide quietness for study and reading, because many of our students want <mark>a quiet study environment</mark>.</div><p class=\"ko\"><mark>그러나</mark> 많은 우리 학생들이 <mark>조용한 공부 환경을</mark> 원하기 때문에, 도서관은 여전히 공부와 독서를 위해 조용함을 제공해야 한다.</p></div><div class=\"ck-via\"><i>▼</i><span>Yet(그러나)이 뒤집을 “더 이상 조용하지 않다”가 여기서 결론으로 나와요</span></div><div class=\"ck-step\"><span class=\"lab\">6번 · 앞 문장 (⑤ 바로 앞)</span><div class=\"en\">So, the modern school library is <mark>no longer the quiet zone</mark> it once was.</div><p class=\"ko\">그래서 현대의 학교 도서관은 한때 그랬던 것과 달리 <mark>더 이상 조용한 구역이 아니다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>this need(이러한 요구) = 주어진 문장의 “조용한 공부 환경을 원함”</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 · 뒤 문장 (⑤ 바로 뒤)</span><div class=\"en\">Considering <mark>this need</mark> for library surroundings, it is important to design spaces where unwanted noise can be eliminated …</div><p class=\"ko\">도서관 환경에 대한 <mark>이러한 요구를</mark> 고려해 볼 때, 원치 않는 소음이 제거될 수 있는 공간을 만드는 것이 중요하다 …</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>6번</em>도서관은 더 이상 조용하지 않음</span><span><em>주어진 문장</em>그래도 학생들은 조용함을 원함</span><span><em>7번</em>이 요구를 위해 소음 없는 공간 설계</span></div><div class=\"ck-eq\">⇒ 시끄러움 → 그래도 조용함 필요 → 그 요구를 위한 설계, 세 고리가 다 맞는 자리 = ⑤</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">6번 문장과 7번 문장 사이<small>7번 this need(이러한 요구)가 받을 “조용함을 원함”이 바로 앞에 생겨요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">5번 문장과 6번 문장 사이</span><span class=\"why\">5번 사람 소음 증가 뒤에 Yet(그러나)이 와도 말은 되어 보여요. 하지만 그러면 6번 So(그래서)가 “조용함이 필요하다”의 결과가 되어 어색하고, 7번 this need(이러한 요구)와도 떨어져요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">2번 문장과 3번 문장 사이</span><span class=\"why\">2번은 이제 막 소리 문제가 복잡해졌다고 꺼낸 참이에요. 무엇이 시끄러워졌는지 나오기도 전이라 Yet(그러나)으로 뒤집을 내용이 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">3번 문장과 4번 문장 사이</span><span class=\"why\">3번 Years ago(수년 전)에서 4번 Today(오늘날에는)로 이어지는 과거·현재 비교가 끊겨요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">4번 문장과 5번 문장 사이</span><span class=\"why\">4번 기계 소음 다음 5번은 also(또한)로 사람 소음을 더하는 중이에요. 소음 목록 한가운데에 끼어들면 also(또한)가 이어 붙을 곳을 잃어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds key\" data-ord=\"1\"><span class=\"rn\">1번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Yet</span> libraries must still provide quietness</div><div class=\"k\"><span class=\"cw\">그러나</span> 도서관은 여전히 조용함을 제공해야 한다</div></div><div class=\"rc\"><div class=\"e\">for study and reading,</div><div class=\"k\">공부와 독서를 위해</div></div><div class=\"rc\"><div class=\"e\">because many of our students want</div><div class=\"k\">많은 우리 학생들이 원하기 때문에</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">a quiet study environment</span>.</div><div class=\"k\"><span class=\"cw\">조용한 공부 환경을</span></div></div><div class=\"rnat\">그러나 많은 우리 학생들이 조용한 공부 환경을 원하기 때문에, 도서관은 여전히 공부와 독서를 위해 조용함을 제공해야 한다.</div><div class=\"rst\">〈주어진 문장〉 <b>그래도</b>(Yet) 우리 반 친구들은 조용히 공부할 곳을 원해요. = 지문의 학생들이 조용한 공부 환경을 원한다는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Acoustic concerns</div><div class=\"k\">소리 문제는</div></div><div class=\"rc\"><div class=\"e\">in school libraries</div><div class=\"k\">학교 도서관에서의</div></div><div class=\"rc\"><div class=\"e\">are much more important and complex today</div><div class=\"k\">오늘날 훨씬 더 중요하고 복잡하다</div></div><div class=\"rc\"><div class=\"e\">than they were in the past.</div><div class=\"k\">과거에 그랬던(중요하고 복잡했던) 것보다</div></div><div class=\"rnat\">학교 도서관에서의 소리 문제는 과거에 그랬던(중요하고 복잡했던) 것보다 오늘날 훨씬 더 중요하고 복잡하다.</div><div class=\"rst\">요즘 학교 도서관은 예전보다 소리 문제가 훨씬 중요하고 복잡해졌어요. = 지문 2번의 첫 화제예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Years ago,</div><div class=\"k\">수년 전</div></div><div class=\"rc\"><div class=\"e\">before electronic resources were such a vital part of the library environment,</div><div class=\"k\">전자 자원이 도서관 환경의 너무나도 중요한 일부분이 되기 전에는</div></div><div class=\"rc\"><div class=\"e\">we had only to deal with</div><div class=\"k\">우리는 처리하기만 하면 되었다</div></div><div class=\"rc\"><div class=\"e\">noise produced by people.</div><div class=\"k\">사람들이 만들어내는 소음을</div></div><div class=\"rnat\">수년 전, 전자 자원이 도서관 환경의 너무나도 중요한 일부분이 되기 전에는 우리는 사람들이 만들어내는 소음을 처리하기만 하면 되었다.</div><div class=\"rst\">예전엔 도서관에서 친구들 소곤대는 소리만 신경 쓰면 됐어요. 지문 3번도 사람 소음만 처리하면 됐다고 해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Today,</div><div class=\"k\">오늘날에는</div></div><div class=\"rc\"><div class=\"e\">the widespread use</div><div class=\"k\">광범위한 사용이</div></div><div class=\"rc\"><div class=\"e\">of computers, printers, and other equipment</div><div class=\"k\">컴퓨터, 프린터, 그리고 다른 장비들의</div></div><div class=\"rc\"><div class=\"e\">has added machine noise.</div><div class=\"k\">기계소음을 더했다</div></div><div class=\"rnat\">오늘날에는 컴퓨터, 프린터, 그리고 다른 장비들의 광범위한 사용이 기계소음을 더했다.</div><div class=\"rst\"><b>오늘날에는</b>(Today) 컴퓨터 팬 소리, 프린터 드르륵 소리까지 더해졌어요. = 지문 4번의 기계 소음이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">People noise has also increased,</div><div class=\"k\">사람들의 소음 또한 증가해 왔다</div></div><div class=\"rc\"><div class=\"e\">because group work and instruction</div><div class=\"k\">집단 활동과 (교사의) 설명이</div></div><div class=\"rc\"><div class=\"e\">are essential parts of the learning process.</div><div class=\"k\">학습 과정에 필수적인 부분이기 때문에</div></div><div class=\"rnat\">집단 활동과 (교사의) 설명이 학습 과정에 필수적인 부분이기 때문에 사람들의 소음 또한 증가해 왔다.</div><div class=\"rst\">모둠 활동, 선생님 설명 때문에 사람 소리도 <b>또한</b>(also) 늘었어요. 지문 5번이 말한 사람 소음 증가예요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">So,</div><div class=\"k\">그래서</div></div><div class=\"rc\"><div class=\"e\">the modern school library</div><div class=\"k\">현대의 학교 도서관은</div></div><div class=\"rc ckc\"><div class=\"e\">is <span class=\"cw\">no longer the quiet zone</span></div><div class=\"k\"><span class=\"cw\">더 이상 조용한 구역이 아니다</span></div></div><div class=\"rc\"><div class=\"e\">it once was.</div><div class=\"k\">한때 그랬던(예전처럼)</div></div><div class=\"rnat\">그래서 현대의 학교 도서관은 더 이상 한때 그랬던(예전처럼) 조용한 구역이 아니다.</div><div class=\"rst\"><b>그래서</b>(So) 도서관은 이제 예전처럼 조용한 곳이 아니에요. 바로 이 뒤가 주어진 문장 자리예요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">Considering <span class=\"cw\">this need</span> for library surroundings,</div><div class=\"k\">도서관 환경에 대한 <span class=\"cw\">이러한 요구를</span> 고려해 볼 때</div></div><div class=\"rc\"><div class=\"e\">it is important to design spaces</div><div class=\"k\">공간을 만드는 것이 중요하다</div></div><div class=\"rc\"><div class=\"e\">where unwanted noise can be eliminated</div><div class=\"k\">(그 공간에서) 원치 않는 소음이 제거될 수 있는</div></div><div class=\"rc\"><div class=\"e\">or at least kept to a minimum.</div><div class=\"k\">또는 적어도 (그 소음이) 최소한으로 유지될 수 있는</div></div><div class=\"rnat\">도서관 환경에 대한 이러한 요구를 고려해 볼 때, 원치 않는 소음이 제거되거나 또는 적어도 (그 소음이) 최소한으로 유지될 수 있는 공간을 만드는 것이 중요하다.</div><div class=\"rst\"><b>이런 바람</b>(this need)을 생각하면, 시끄러운 소리를 없애거나 줄이는 공간을 만들어야 해요. = 지문의 "ck-step key\"><span class=\"lab\">13·14번 · 결정적 결론</span><div class=\"en\"><mark>The principles of gradual exposure</mark> are still very (e) useful.</div><p class=\"ko\"><mark>점진적인 노출의 원칙들은</mark> 여전히 매우 (e) 유용하다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">Overcoming Social Anxiety Is Difficult(사교 불안 극복은 어렵다); Try Gradually(점진적으로 시도하라)!<small>3번의 “더 까다롭다”와 13번의 “점진적 노출은 유용하다”를 둘 다 담았어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">Relaxation May Lead to Getting Over Social Fears(긴장 풀기가 사교적 두려움 극복으로 이어질 수 있다)</span><span class=\"why\">[지문에 없음] Getting Over Social Fears(사교적 두려움 극복)는 맞아 보이지만, 방법은 relaxation(긴장 풀기)이 아니라 13번의 gradual exposure(점진적 노출)예요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">How to Improve Your Self-Esteem(자존감을 높이는 방법)</span><span class=\"why\">[범위 좁음] 7번에 self-esteem(자존감)이 한 번 나올 뿐이에요. 글은 자존감 높이기가 아니라 사교 불안을 마주하는 방법이에요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">Socializing with Someone You Fear(두려운 사람과 어울리기): Good or Bad(좋은가 나쁜가)?</span><span class=\"why\">[지문에 없음] 특정한 무서운 사람과 어울리는 게 좋은지 묻는 글이 아니에요. 두려운 건 사람 자체가 아니라 사교 상황이에요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">Are Social Exposures Related with Fear of Heights(사교적 노출은 고소공포증과 관련 있는가)?</span><span class=\"why\">[지문에 없음] 1~2번 발코니 이야기는 비교용 예시예요. 사교적 노출과 고소공포증이 관련 있는지 따지는 문장은 없어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">If you were afraid of standing on balconies,</div><div class=\"k\">만약 당신이 발코니 위에 서 있는 것을 두려워 한다면</div></div><div class=\"rc\"><div class=\"e\">you would start on some lower floors</div><div class=\"k\">당신은 더 낮은 층에서 시작해서</div></div><div class=\"rc\"><div class=\"e\">and slowly work your way up to higher ones.</div><div class=\"k\">천천히 더 높은 층으로 올라갈 것이다</div></div><div class=\"rnat\">만약 당신이 발코니 위에 서 있는 것을 두려워 한다면, 당신은 더 낮은 층에서 시작해서 천천히 더 높은 층으로 올라갈 것이다.</div><div class=\"rst\">높은 정글짐이 무서우면 낮은 칸부터 한 칸씩 천천히 올라가면 돼요. = 지문 1번, 낮은 층부터 높은 층으로 올라간다는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">It would be easy</div><div class=\"k\">쉬울 것이다</div></div><div class=\"rc\"><div class=\"e\">to face a fear</div><div class=\"k\">두려움을 직면하는 것은</div></div><div class=\"rc\"><div class=\"e\">of standing on high balconies</div><div class=\"k\">높은 발코니 위에 서 있는</div></div><div class=\"rc\"><div class=\"e\">in a way that’s totally controlled.</div><div class=\"k\">완전히 통제된 방식으로</div></div><div class=\"rnat\">완전히 통제된 방식으로 높은 발코니 위에 서 있는 두려움을 직면하는 것은 쉬울 것이다.</div><div class=\"rst\">정글짐은 내가 원하는 만큼만 딱딱 조절하며 오를 수 있어서 쉬워요. 지문 2번도 통제된 방식이라 쉽다고 해요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc\"><div class=\"e\">Socializing is</div><div class=\"k\">사람을 사귀는 것은</div></div><div class=\"rc ckc\"><div class=\"e\">(a) <span class=\"cw\">trickier</span>.</div><div class=\"k\"><span class=\"cw\">(a) 더 까다롭다</span></div></div><div class=\"rnat\">사람을 사귀는 것은 (a) 더 까다롭다.</div><div class=\"rst\">그런데 새 학기 반 친구 사귀기는 <b>더 까다로워요</b>(trickier). = 지문 3번, 여기서 글의 주인공이 사람 사귀기로 정해져요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">People aren’t like</div><div class=\"k\">사람은 ~와 같지 않다</div></div><div class=\"rc\"><div class=\"e\">inanimate features of a building</div><div class=\"k\">건물의 무생물적 특성</div></div><div class=\"rc\"><div class=\"e\">that you just have to be around</div><div class=\"k\">당신이 그저 주변에 있어야 하는</div></div><div class=\"rc\"><div class=\"e\">to get used to.</div><div class=\"k\">익숙해지기 위해</div></div><div class=\"rnat\">사람은 당신이 익숙해지기 위해 주변에 있어야 하는(주변에 있어서 익숙해지는) 건물의 무생물적 특성과 같지 않다.</div><div class=\"rst\">친구는 정글짐처럼 그냥 옆에 있다고 익숙해지는 물건이 아니에요. = 지문 4번, 사람은 건물의 무생물과 다르다는 말이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">You have to interact with them,</div><div class=\"k\">당신은 그들(= 사람들)과 상호 작용을 해야 하며</div></div><div class=\"rc\"><div class=\"e\">and their responses can be unpredictable.</div><div class=\"k\">그들의 반응은 예측이 불가능할 수 있다</div></div><div class=\"rnat\">당신은 그들과 상호 작용을 해야 하며, 그들의 반응은 예측이 불가능할 수 있다.</div><div class=\"rst\">말을 걸어야 하고, 친구가 어떻게 반응할지 <b>예측할 수 없어요</b>(unpredictable). 지문 5번 그대로예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Your feelings toward them</div><div class=\"k\">그들(= 사람들)을 향한 당신의 느낌도</div></div><div class=\"rc\"><div class=\"e\">are more complex too.</div><div class=\"k\">역시 더 복잡하다</div></div><div class=\"rnat\">그들을 향한 당신의 느낌도 역시 더 복잡하다.</div><div class=\"rst\">친구에게 드는 마음도 좋기도 하고 어색하기도 해서 더 복잡해요. = 지문 6번이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Most people’s self-esteem</div><div class=\"k\">대부분의 사람들의 자존감은</div></div><div class=\"rc\"><div class=\"e\">isn’t going to be affected that much</div><div class=\"k\">그렇게 많이 영향을 받지 않을 것이지만</div></div><div class=\"rc\"><div class=\"e\">if they don’t like balconies,</div><div class=\"k\">그들이 발코니를 좋아하지 않더라도</div></div><div class=\"rc\"><div class=\"e\">but your confidence can (b) suffer</div><div class=\"k\">당신의 자신감은 (b) 상처입을 수 있다</div></div><div class=\"rc\"><div class=\"e\">if you can’t socialize effectively.</div><div class=\"k\">당신이 효과적으로 사람을 사귈 수 없다면</div></div><div class=\"rnat\">대부분의 사람들의 자존감은 그들이 발코니를 좋아하지 않더라도 그렇게 많이 영향을 받지 않을 것이지만, 당신이 효과적으로 사람을 사귈 수 없다면 당신의 자신감은 (b) 상처입을 수 있다.</div><div class=\"rst\">정글짐을 못 올라도 기죽진 않지만, 친구를 못 사귀면 자신감이 <b>상처 입어요</b>(suffer). = 지문 7번의 비교예요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc ckc\"><div class=\"e\">It’s also <span class=\"cw\">harder</span></div><div class=\"k\"><span class=\"cw\">또한 더 어렵다</span></div></div><div class=\"rc\"><div class=\"e\">to design a tidy way</div><div class=\"k\">깔끔한 방법을 설계하는 것은</div></div><div class=\"rc\"><div class=\"e\">to gradually face many social fears.</div><div class=\"k\">많은 사교적 두려움을 점차적으로 직면할</div></div><div class=\"rnat\">많은 사교적 두려움을 점차적으로 직면할 깔끔한 방법을 설계하는 것은 또한 더 어렵다.</div><div class=\"rst\">“오늘은 인사, 내일은 같이 급식” 하고 깔끔한 계획을 짜기도 <b>더 어려워요</b>(harder). 지문 8번이에요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">The social situations</div><div class=\"k\">사교적 상황들이</div></div><div class=\"rc\"><div class=\"e\">you need to expose yourself to</div><div class=\"k\">당신이 스스로 드러낼 필요가 있는</div></div><div class=\"rc\"><div class=\"e\">may not be (c) available</div><div class=\"k\">(c) 이용 가능하지 않을 수도 있고</div></div><div class=\"rc\"><div class=\"e\">when you want them,</div><div class=\"k\">당신이 원할 때</div></div><div class=\"rc\"><div class=\"e\">or they may not go well enough</div><div class=\"k\">또는 그것들(= 사교적 상황들)은 충분히 잘 진행되지 않을지도 모른다</div></div><div class=\"rc\"><div class=\"e\">for you to sense</div><div class=\"k\">당신이 느낄 만큼</div></div><div class=\"rc\"><div class=\"e\">that things are under control.</div><div class=\"k\">상황이 통제 가능하다고</div></div><div class=\"rnat\">당신이 스스로 드러낼 필요가 있는 사교적 상황들이 당신이 원할 때 (c) 이용 가능하지 않을 수도 있고, 또는 그것들은 당신이 상황이 통제 가능하다고 느낄 만큼 충분히 잘 진행되지 않을지도 모른다.</div><div class=\"rst\">말 걸 기회가 원할 때 <b>없을 수도</b>(not available) 있고, 대화가 잘 안 풀릴 수도 있어요. = 지문 9번이에요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">The progression from one step to the next</div><div class=\"k\">한 단계에서 다음 단계로의 진행은</div></div><div class=\"rc\"><div class=\"e\">may not be clear,</div><div class=\"k\">분명하지 않을 수 있으며</div></div><div class=\"rc\"><div class=\"e\">creating unavoidable large (d) increases</div><div class=\"k\">불가피한 큰 (d) 증가를 야기할 수 있다 ※ 문제지엔 decreases(감소)로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">in difficulty</div><div class=\"k\">어려움의</div></div><div class=\"rc\"><div class=\"e\">from one to the next.</div><div class=\"k\">한 단계에서 다음 단계로 (진행할 때)</div></div><div class=\"rnat\">한 단계에서 다음 단계로의 진행은 분명하지 않을 수 있으며, 한 단계에서 다음 단계로 (진행할 때) 어려움의 불가피한 큰 (d) 감소(→ 증가)를 야기할 수 있다.</div><div class=\"rst\">다음 단계가 분명하지 않아서, 갑자기 확 어려워지는 순간이 생겨요(increases 증가). = 지문 10번, 어려움이 크게 늘어난다는 말이에요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">People around you</div><div class=\"k\">당신 주변의 사람들은</div></div><div class=\"rc\"><div class=\"e\">aren’t robots</div><div class=\"k\">로봇들이 아니다</div></div><div class=\"rc\"><div class=\"e\">that you can endlessly experiment with</div><div class=\"k\">당신이 끊임없이 실험해 볼 수 있는</div></div><div class=\"rc\"><div class=\"e\">for your own purposes.</div><div class=\"k\">당신 자신의 목적을 위해서</div></div><div class=\"rnat\">당신 주변의 사람들은 당신 자신의 목적을 위해서 당신이 끊임없이 실험해 볼 수 있는 로봇들이 아니다.</div><div class=\"rst\">친구는 내 연습을 위해 계속 실험해 볼 수 있는 로봇이 아니에요. = 지문 11번이에요.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><div class=\"rc\"><div class=\"e\">This is not to say</div><div class=\"k\">이것은 말하는 것이 아니다</div></div><div class=\"rc\"><div class=\"e\">that facing your fears</div><div class=\"k\">당신의 두려움들을 직면하는 것이</div></div><div class=\"rc\"><div class=\"e\">is pointless</div><div class=\"k\">무의미하다는 것을</div></div><div class=\"rc\"><div class=\"e\">when socializing.</div><div class=\"k\">사람을 사귈 때</div></div><div class=\"rnat\">이것은 사람을 사귈 때 당신의 두려움들을 직면하는 것이 무의미하다는 것을 말하는 것이 아니다.</div><div class=\"rst\"><b>그렇다고</b>(This is not to say) 친구 사귀기의 두려움에 맞서는 게 소용없다는 말은 아니에요. 지문이 여기서 방향을 틀어요.</div></div><div class=\"rds key\" data-ord=\"13\"><span class=\"rn\">13번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">The principles of gradual exposure</span></div><div class=\"k\"><span class=\"cw\">점진적인 노출의 원칙들은</span></div></div><div class=\"rc ckc\"><div class=\"e\">are still very (e) <span class=\"cw\">useful</span>.</div><div class=\"k\">여전히 매우 <span class=\"cw\">(e) 유용하다</span></div></div><div class=\"rnat\">점진적인 노출의 원칙들은 여전히 매우 (e) 유용하다.</div><div class=\"rst\"><b>조금씩 부딪혀 보는 방법</b>(gradual exposure 점진적 노출)은 여전히 아주 <b>쓸모 있어요</b>(useful). 이게 지문의 결론이에요.</div></div><div class=\"rds key\" data-ord=\"14\"><span class=\"rn\">14번 · 단서</span><div class=\"rc\"><div class=\"e\">The process of applying them</div><div class=\"k\">그것들(= 점진적 노출의 원칙들)을 적용하는 과정이</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">is just messier</span>,</div><div class=\"k\"><span class=\"cw\">단지 더 복잡하고</span></div></div><div class=\"rc\"><div class=\"e\">and knowing that before you start</div><div class=\"k\">당신이 시작하기 전에 그것을 아는 것은</div></div><div class=\"rc\"><div class=\"e\">is helpful.</div><div class=\"k\">도움이 된다</div></div><div class=\"rnat\">그것들을 적용하는 과정이 단지 더 복잡하고, 당신이 시작하기 전에 그것을 아는 것은 도움이 된다.</div><div class=\"rst\">다만 정글짐보다 과정이 <b>더 복잡할</b>(messier) 뿐이고, 시작 전에 그걸 알아 두면 도움이 돼요. = 지문의 마지막 말이에요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"socialize\" data-m=\"사람들과 어울리다, 사귀다\"><b>socialize</b>사람들과 어울리다, 사귀다</button><button type=\"button\" class=\"wdb\" data-w=\"inanimate\" data-m=\"무생물의\"><b>inanimate</b>무생물의</button><button type=\"button\" class=\"wdb\" data-w=\"self-esteem\" data-m=\"자존감\"><b>self-esteem</b>자존감</button><button type=\"button\" class=\"wdb\" data-w=\"gradually\" data-m=\"점진적으로, 서서히\"><b>gradually</b>점진적으로, 서서히</button><button type=\"button\" class=\"wdb\" data-w=\"progression\" data-m=\"진행\"><b>progression</b>진행</button><button type=\"button\" class=\"wdb\" data-w=\"principle\" data-m=\"원칙\"><b>principle</b>원칙</button></div>", "12": "<p class=\"mtr\">마더텅 정답률 <b>60%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">이 글은 처음부터 끝까지 “사람 사귀기는 <b>더 어렵다</b>”는 한 방향이에요. 10번의 <b>may not be clear</b>(분명하지 않을 수 있다)가 어려움을 키우는 쪽인데, 문제지 낱말이 <b>줄어드는 쪽</b>이면 그게 답이에요.</p><div class=\"ck-step\"><span class=\"lab\">3번 · 글의 방향</span><div class=\"en\">Socializing is (a) <mark>trickier</mark>.</div><p class=\"ko\">사람을 사귀는 것은 <mark>(a) 더 까다롭다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>also(또한)로 “어렵다”를 하나 더 보태요</span></div><div class=\"ck-step\"><span class=\"lab\">8번 · 같은 방향 확인</span><div class=\"en\">It’s also <mark>harder</mark> to design a tidy way to gradually face many social fears.</div><p class=\"ko\">많은 사교적 두려움을 점차적으로 직면할 깔끔한 방법을 설계하는 것은 <mark>또한 더 어렵다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>단계가 불분명하면 어려움이 어떻게 될까요?</span></div><div class=\"ck-step key\"><span class=\"lab\">10번 앞부분 · 결정적 단서</span><div class=\"en\">The progression from one step to the next <mark>may not be clear</mark>,</div><p class=\"ko\">한 단계에서 다음 단계로의 진행은 <mark>분명하지 않을 수 있으며</mark></p></div><div class=\"ck-via\"><i>▼</i><span>불분명한 단계 → 어려움이 줄어든다? 방향이 거꾸로예요</span></div><div class=\"ck-step\"><span class=\"lab\">문제지 ④번 자리 (10번)</span><div class=\"en\">creating unavoidable large <u>(d) decreases</u> in difficulty from one to the next.</div><p class=\"ko\">한 단계에서 다음 단계로 갈 때 어려움에 불가피하게 큰 ( 감소? )를 낳을 수 있다 → 증가(increases)가 맞아요</p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">increases(증가) ↔ decreases(감소)</p><p class=\"gr\">원인이 not clear(분명하지 않은)·harder(더 어려운)처럼 어렵게 만드는 쪽이면, 결과도 어려움이 increases(증가하다) 쪽이어야 해요. 원인과 결과의 방향을 맞추세요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>The next level is not clear, so the game gets harder.</div><div class=\"ko\">다음 단계가 분명하지 않아서 게임이 더 어려워져요. (불분명 → 어려움 증가)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>The next level is not clear, so the game gets easier.</div><div class=\"ko\">단계가 불분명한데 더 쉬워진다? 방향이 거꾸로라 틀려요.</div></div><div class=\"ge\"><div cla \" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">You have to interact with them,</div><div class=\"k\">당신은 그들(= 사람들)과 상호 작용을 해야 하며</div></div><div class=\"rc\"><div class=\"e\">and their responses can be unpredictable.</div><div class=\"k\">그들의 반응은 예측이 불가능할 수 있다</div></div><div class=\"rnat\">당신은 그들과 상호 작용을 해야 하며, 그들의 반응은 예측이 불가능할 수 있다.</div><div class=\"rst\">말을 걸어야 하고, 친구가 어떻게 반응할지 <b>예측할 수 없어요</b>(unpredictable). 지문 5번 그대로예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Your feelings toward them</div><div class=\"k\">그들(= 사람들)을 향한 당신의 느낌도</div></div><div class=\"rc\"><div class=\"e\">are more complex too.</div><div class=\"k\">역시 더 복잡하다</div></div><div class=\"rnat\">그들을 향한 당신의 느낌도 역시 더 복잡하다.</div><div class=\"rst\">친구에게 드는 마음도 좋기도 하고 어색하기도 해서 더 복잡해요. = 지문 6번이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Most people’s self-esteem</div><div class=\"k\">대부분의 사람들의 자존감은</div></div><div class=\"rc\"><div class=\"e\">isn’t going to be affected that much</div><div class=\"k\">그렇게 많이 영향을 받지 않을 것이지만</div></div><div class=\"rc\"><div class=\"e\">if they don’t like balconies,</div><div class=\"k\">그들이 발코니를 좋아하지 않더라도</div></div><div class=\"rc\"><div class=\"e\">but your confidence can (b) suffer</div><div class=\"k\">당신의 자신감은 (b) 상처입을 수 있다</div></div><div class=\"rc\"><div class=\"e\">if you can’t socialize effectively.</div><div class=\"k\">당신이 효과적으로 사람을 사귈 수 없다면</div></div><div class=\"rnat\">대부분의 사람들의 자존감은 그들이 발코니를 좋아하지 않더라도 그렇게 많이 영향을 받지 않을 것이지만, 당신이 효과적으로 사람을 사귈 수 없다면 당신의 자신감은 (b) 상처입을 수 있다.</div><div class=\"rst\">정글짐을 못 올라도 기죽진 않지만, 친구를 못 사귀면 자신감이 <b>상처 입어요</b>(suffer). = 지문 7번의 비교예요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc ckc\"><div class=\"e\">It’s also <span class=\"cw\">harder</span></div><div class=\"k\"><span class=\"cw\">또한 더 어렵다</span></div></div><div > 야기할 수 있다 ※ 문제지엔 decreases(감소)로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">in difficulty</div><div class=\"k\">어려움의</div></div><div class=\"rc\"><div class=\"e\">from one to the next.</div><div class=\"k\">한 단계에서 다음 단계로 (진행할 때)</div></div><div class=\"rnat\">한 단계에서 다음 단계로의 진행은 분명하지 않을 수 있으며, 한 단계에서 다음 단계로 (진행할 때) 어려움의 불가피한 큰 (d) 감소(→ 증가)를 야기할 수 있다.</div><div class=\"rst\">다음 단계가 분명하지 않으면 어려움이 갑자기 확 <b>늘어나요</b>(increases 증가). 그래서 문제지의 decreases(감소)는 방향이 거꾸로예요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">People around you</div><div class=\"k\">당신 주변의 사람들은</div></div><div class=\"rc\"><div class=\"e\">aren’t robots</div><div class=\"k\">로봇들이 아니다</div></div><div class=\"rc\"><div class=\"e\">that you can endlessly experiment with</div><div class=\"k\">당신이 끊임없이 실험해 볼 수 있는</div></div><div class=\"rc\"><div class=\"e\">for your own purposes.</div><div class=\"k\">당신 자신의 목적을 위해서</div></div><div class=\"rnat\">당신 주변의 사람들은 당신 자신의 목적을 위해서 당신이 끊임없이 실험해 볼 수 있는 로봇들이 아니다.</div><div class=\"rst\">친구는 내 연습을 위해 계속 실험해 볼 수 있는 로봇이 아니에요. = 지문 11번이에요.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><div class=\"rc\"><div class=\"e\">This is not to say</div><div class=\"k\">이것은 말하는 것이 아니다</div></div><div class=\"rc\"><div class=\"e\">that facing your fears</div><div class=\"k\">당신의 두려움들을 직면하는 것이</div></div><div class=\"rc\"><div class=\"e\">is pointless</div><div class=\"k\">무의미하다는 것을</div></div><div class=\"rc\"><div class=\"e\">when socializing.</div><div class=\"k\">사람을 사귈 때</div></div><div class=\"rnat\">이것은 사람을 사귈 때 당신의 두려움들을 직면하는 것이 무의미하다는 것을 말하는 것이 아니다.</div><div class=\"rst\"><b>그렇다고</b>(This is not to say) 친구 사귀기의 두려움에 맞서는 게 소용없다는 말은 아니에요. 지문이 여기서 방향을 틀어요.</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">13번</span><div class=\"rc\"><div class=\"e\">The principles of gradual exposure</div><div class=\"k\">점진적인 노출의 원칙들은</div></div><div class=\"rc\"><div class=\"e\">are still very (e) useful.</div><div class=\"k\">여전히 매우 (e) 유용하다</div></div><div class=\"rnat\">점진적인 노출의 원칙들은 여전히 매우 (e) 유용하다.</div><div class=\"rst\"><b>조금씩 부딪혀 보는 방법</b>(gradual exposure 점진적 노출)은 여전히 아주 <b>쓸모 있어요</b>(useful). 이게 지문의 결론이에요.</div></div><div class=\"rds\" data-ord=\"14\"><span class=\"rn\">14번</span><div class=\"rc\"><div class=\"e\">The process of applying them</div><div class=\"k\">그것들(= 점진적 노출의 원칙들)을 적용하는 과정이</div></div><div class=\"rc\"><div class=\"e\">is just messier,</div><div class=\"k\">단지 더 복잡하고</div></div><div class=\"rc\"><div class=\"e\">and knowing that before you start</div><div class=\"k\">당신이 시작하기 전에 그것을 아는 것은</div></div><div class=\"rc\"><div class=\"e\">is helpful.</div><div class=\"k\">도움이 된다</div></div><div class=\"rnat\">그것들을 적용하는 과정이 단지 더 복잡하고, 당신이 시작하기 전에 그것을 아는 것은 도움이 된다.</div><div class=\"rst\">다만 정글짐보다 과정이 <b>더 복잡할</b>(messier) 뿐이고, 시작 전에 그걸 알아 두면 도움이 돼요. = 지문의 마지막 말이에요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"socialize\" data-m=\"사람들과 어울리다, 사귀다\"><b>socialize</b>사람들과 어울리다, 사귀다</button><button type=\"button\" class=\"wdb\" data-w=\"available\" data-m=\"이용 가능한\"><b>available</b>이용 가능한</button><button type=\"button\" class=\"wdb\" data-w=\"under control\" data-m=\"통제되는\"><b>under control</b>통제되는</button><button type=\"button\" class=\"wdb\" data-w=\"progression\" data-m=\"진행\"><b>progression</b>진행</button><button type=\"button\" class=\"wdb\" data-w=\"unavoidable\" data-m=\"피할 수 없는\"><b>unavoidable</b>피할 수 없는</button><button type=\"button\" class=\"wdb\" data-w=\"pointless\" data-m=\"무의미한\"><b>pointless</b>무의미한</button></div>"};

/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" data-q="'+d.no+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  if(EXP[cq.q]){h+=EXP[cq.q]+'<button class="toq" data-i="'+i+'">빠른 정답으로</button>';return h+'</div></details>';}
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);

/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(S.sub&&!S.mmS){S.mmS=1;S.mmP=1;save();WN.hw(lv,day,S.sub.s+'/'+N+(S.mmD?' ✓':''));}else if(!S.sub&&!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}

document.addEventListener('click',e=>{

  }
  const al=e.target.closest('.tbtn');

    body.querySelectorAll('.s,.sc').forEach(s=>{

      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
