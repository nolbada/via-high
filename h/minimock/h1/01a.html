<title>고1 미니모의고사 1회 01–06번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:84px}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}
.ko{color:var(--sub);font-size:14px;margin-left:6px}
.cell.bad{background:var(--badbg);border-color:var(--bad)}
.cell.bad .tag{background:var(--bad)}
.locked .cell{pointer-events:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.done .opt{pointer-events:none}
.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}
.hcard .chip{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--sub)}
.hcard .chip.ok{background:var(--goodbg);color:var(--good)}
.hcard .chip.warn{background:var(--badbg);color:var(--bad)}
.hcard[disabled]{opacity:.55}
details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.th .hd{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:6px}
.th ol{list-style:none;margin:0;padding:0;counter-reset:n}
.th li{counter-increment:n;position:relative;padding:7px 0 7px 30px;font-size:15px;line-height:1.7;border-top:1px dashed #cfdcf0}
.th li:first-child{border-top:0}
.th li:before{content:counter(n);position:absolute;left:0;top:9px;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;text-align:center;line-height:21px}
.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.th .sub{margin:3px 0 0;color:#444;font-size:14.5px;line-height:1.7}
.sc .lay.sum{border-left:4px solid #2e7d32;background:#f1f8f1}
/* ---- 새 직독직해·해설 화면 ---- */
.sc{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden;background:var(--bg)}
.sc-h{padding:11px 14px 10px;background:#eef2f8;border-bottom:1px solid var(--line)}
.sc-h .no2{display:inline-block;min-width:26px;height:26px;line-height:26px;border-radius:13px;background:var(--accent);color:#fff;font-weight:800;font-size:13px;text-align:center;padding:0 7px;margin-right:8px}
.sc-h .at{font-size:13px;color:var(--sub)}
.sc-h .tt{display:block;margin-top:7px;font-size:15.5px;font-weight:800;color:var(--accent);line-height:1.45}
.sc-b{padding:10px 12px 12px}
.sc .ch{margin-bottom:6px}
.sc .ce{font-size:17px}
.sc .ce sup,.nt sup{font-size:10px;font-weight:800;color:#b8651f;margin-left:1px}
.nts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.nt{font-size:13.5px;line-height:1.5;background:#fbf6ee;border:1px solid #f0e2cd;border-radius:8px;padding:5px 9px;color:#4a3a22}
.nt b{color:#33260f}
.sc .lay{border-radius:10px}
.sc .lay.nat{border-left:4px solid var(--accent);background:#f7f9fc}

.sc .lay.ana b,.why2 b,.opx b,.evx b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.sc .lb{margin-bottom:4px}
.qc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}
.qchip small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-bottom:1px}
.qchip.o{border-color:var(--good);background:var(--goodbg)}
.qchip.x{border-color:var(--bad);background:var(--badbg)}
.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.trs{list-style:none;margin:0;padding:0;background:var(--soft);border-radius:10px;padding:8px 12px}
.trs li{font-size:15px;line-height:1.75;padding:2px 0}
.trs .n{display:inline-block;min-width:20px;font-size:12px;color:var(--sub);font-weight:700}
.evx{background:var(--goodbg);border:1px solid #bfe0cd;border-radius:10px;padding:10px 12px}

.opx{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px;background:var(--bg)}

.opx .ot{font-size:15.5px;font-weight:700;line-height:1.55}
.opx .mk{display:inline-block;min-width:22px;font-weight:800;color:var(--sub);margin-right:4px}

.opx .bd.t{background:#b4472f}

.opx .xm{color:var(--bad);font-weight:800;margin-right:3px}
.wds{display:flex;flex-wrap:wrap;gap:6px}
.wds span{font-size:14px;background:var(--soft);border-radius:8px;padding:5px 9px;line-height:1.45}
.wds b{margin-right:5px}
.toq{display:block;width:100%;margin-top:14px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}
details.sub2{margin:12px 0 0}
details.sub2>summary{list-style:none;cursor:pointer;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px;padding:6px 0}
details.sub2>summary::-webkit-details-marker{display:none}
details.sub2>summary:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
details.sub2>summary:after{content:"+";margin-left:auto;font-size:18px;color:var(--sub)}
details.sub2[open]>summary:after{content:"\2212"}

.cr{color:#A3102E;font-weight:700}
.sc .lay.core{border-left:4px solid #2e7d32;background:#f1f8f1}
.ct{display:none;margin:7px 0 2px;padding:6px 9px;border-left:3px solid #d9a21b;background:#fff8e6;border-radius:6px;font-size:13.5px;line-height:1.55;color:#4d3b05}

.sc .ch{background:#fafbfe;border:1px solid #e8ecf5;border-bottom:1px solid #e8ecf5;padding:10px 12px}

.cks{margin:0 0 6px}.cchip{display:inline-block;font-size:12.5px;font-weight:700;color:#1f6f5f;background:#e5f4f0;border:1px solid #bfe3da;border-radius:999px;padding:4px 10px;text-decoration:none;margin:2px 4px 2px 0}

.rst{margin-top:8px;background:#fff8e1;border:1px solid #efe3b8;border-left:4px solid #d9a21b;border-radius:8px;padding:8px 10px;font-size:15px;line-height:1.7;word-break:keep-all}

        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);

var EXP={"01": "<p class=\"mtr\">마더텅 정답률 <b>85%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">목적 문제는 <b>However(하지만)</b> 뒤에 진짜 용건이 나와요. 앞의 감사 인사는 쿠션이고, <b>must(~해야만 한다)</b>가 붙은 문장이 편지의 목적이에요.</p><div class=\"ck-step\"><span class=\"lab\">2번 문장 · 앞부분은 감사 인사</span><div class=\"en\">It brings me great satisfaction … and I'm honored that the board has seen fit <mark>to recommend me for vice president</mark>.</div><p class=\"ko\">이사로 일하는 것이 제게 큰 보람을 줍니다 … 이사회가 <mark>저를 부회장으로 추천하는 것을</mark> 적절하다고 보아 주셔서 영광입니다.</p></div><div class=\"ck-via\"><i>▼</i><span>However(하지만)로 방향이 꺾이고, must(~해야만 한다)로 용건이 나와요</span></div><div class=\"ck-step key\"><span class=\"lab\">3번 문장 · 결정적 단서</span><div class=\"en\"><mark>However</mark>, because my work schedule has become so unpredictable, <mark>I must decline the recommendation</mark>.</div><p class=\"ko\"><mark>하지만</mark>, 제 업무 일정이 너무 예측하기 어려워졌기 때문에, <mark>저는 그 추천을 거절해야만 합니다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>거절한 뒤, 부회장 대신 무엇을 할지 덧붙여요</span></div><div class=\"ck-step\"><span class=\"lab\">5번 문장 · 거절 확인</span><div class=\"en\">For the time being, then, I look forward to carrying on <mark>as a regular board member</mark>.</div><p class=\"ko\">그러니 당분간은, 저는 <mark>평이사로서</mark> 계속하기를 기대합니다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">부회장으로 추천받은 것을 거절하려고<small>2번의 추천(recommend)을 3번에서 거절(decline)해요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">불규칙한 업무 일정 개선을 요구하려고</span><span class=\"why\">[지문에 없음] 3번의 일정 얘기는 because(~때문에) 뒤에 나온 거절 이유일 뿐이에요. 일정을 바꿔 달라는 말은 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">공연 취소에 대한 불만을 제기하려고</span><span class=\"why\">[지문에 없음] 공연이나 취소 이야기가 한 번도 안 나와요. 오히려 2번에서 영광이라며 감사해요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">음악 예술 센터 개관을 축하하려고</span><span class=\"why\">[지문에 없음] 2번은 센터 이사로 일하는 보람을 말할 뿐, 센터가 새로 문을 연다는 말은 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">이사회 위원 선출 방식 변경을 촉구하려고</span><span class=\"why\">[지문에 없음] 뽑는 방식을 바꾸자는 말은 없어요. 2번에서 추천해 준 것을 오히려 영광이라고 해요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Dear Mr. Denning,</div><div class=\"k\">친애하는 Denning 씨께,</div></div><div class=\"rnat\">Denning 씨께,</div><div class=\"rst\">동아리 선배에게 보내는 메시지를 떠올려 봐요. 지문도 데닝(Denning) 씨에게 쓰는 편지로 시작해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">It brings me great satisfaction</div><div class=\"k\">제게 큰 보람을 줍니다 (It은 가주어, 진주어는 뒤의 to serve ~ 이하)</div></div><div class=\"rc\"><div class=\"e\">to serve as a board member</div><div class=\"k\">이사로서 일하는 것이</div></div><div class=\"rc\"><div class=\"e\">of the Redstone Music and Arts Center,</div><div class=\"k\">Redstone 음악예술센터의,</div></div><div class=\"rc\"><div class=\"e\">and I'm honored</div><div class=\"k\">그리고 저는 영광으로 생각합니다</div></div><div class=\"rc\"><div class=\"e\">that the board has seen fit</div><div class=\"k\">이사회가 적절하다고 보아 주셨다는 점이</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">to recommend me for vice president</span>.</div><div class=\"k\"><span class=\"cw\">저를 부회장으로 추천하는 것을</span></div></div><div class=\"rnat\">Redstone 음악예술센터의 이사로 일하게 되어 저는 큰 보람을 느끼고 있고, 이사회가 저를 부회장으로 추천해 주신 것도 영광입니다.</div><div class=\"rst\">“밴드부 활동이 정말 즐겁고, 저를 부부장으로 추천해 주셔서 영광이에요.” 지문도 먼저 이사 일의 보람과 <b>부회장 추천</b>에 감사해요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">However</span>,</div><div class=\"k\"><span class=\"cw\">하지만</span>,</div></div><div class=\"rc\"><div class=\"e\">because my work schedule has become so unpredictable,</div><div class=\"k\">제 업무 일정이 너무 예측하기 어려워졌기 때문에,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">I must decline the recommendation</span>.</div><div class=\"k\"><span class=\"cw\">저는 그 추천을 거절해야만 합니다</span>.</div></div><div class=\"rnat\">하지만 제 업무 일정이 너무 예측하기 어려워져서, 저는 그 추천을 거절해야만 합니다.</div><div class=\"rst\"><b>하지만</b>(However) 학원 시간표가 자꾸 바뀌어서 “부부장은 못 맡겠어요” 해요. 지문의 <b>거절해야만 한다</b>(must decline)가 바로 편지의 목적이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">I simply don't feel</div><div class=\"k\">저는 도저히 ~라고 느껴지지 않습니다</div></div><div class=\"rc\"><div class=\"e\">I can give the time and energy</div><div class=\"k\">제가 시간과 에너지를 드릴 수 있다고</div></div><div class=\"rc\"><div class=\"e\">that the Music and Arts Center deserves</div><div class=\"k\">음악예술센터가 마땅히 받을 만한 (= 그 시간과 에너지)</div></div><div class=\"rc\"><div class=\"e\">from its vice president.</div><div class=\"k\">그 센터의 부회장으로부터</div></div><div class=\"rnat\">음악예술센터가 부회장에게 당연히 기대할 만한 시간과 에너지를 제가 드릴 수 있다고 도저히 생각되지 않습니다.</div><div class=\"rst\">부부장이면 연습도 챙기고 모임에도 꼭 나가야 하는데, 그럴 시간이 없어요. 지문도 부회장에게 맞는 시간과 에너지를 못 드린다고 해요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">For the time being, then,</div><div class=\"k\">그러니 당분간은,</div></div><div class=\"rc\"><div class=\"e\">I look forward to carrying on</div><div class=\"k\">저는 계속하기를 기대합니다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">as a regular board member</span>.</div><div class=\"k\"><span class=\"cw\">평이사로서</span>.</div></div><div class=\"rnat\">그러니 당분간은 평이사로 계속 일하고 싶습니다.</div><div class=\"rst\">“대신 지금처럼 그냥 부원으로는 계속 열심히 할게요.” 지문도 당분간 <b>평이사로</b> 계속하겠다고 해요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Please pass along my regrets</div><div class=\"k\">제 아쉬운 마음(정중한 거절)을 전해 주세요</div></div><div class=\"rc\"><div class=\"e\">to the rest of the board.</div><div class=\"k\">이사회의 다른 분들께.</div></div><div class=\"rnat\">이사회의 다른 분들께도 제 아쉬운 마음(정중한 거절의 뜻)을 전해 주시기 바랍니다.</div><div class=\"rst\">“다른 선배들께도 죄송하다고 전해 주세요.” 지문도 이사회 분들께 아쉬운 마음을 전해 달라며 거절을 마무리해요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Sincerely, Jason Becker</div><div class=\"k\">진심을 담아, Jason Becker 드림</div></div><div class=\"rnat\">Jason Becker 드림</div><div class=\"rst\">메시지 끝에 내 이름을 쓰듯, 지문도 보낸 사람 제이슨 베커(Jason Becker)의 이름으로 끝나요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"satisfaction\" data-m=\"만족, 보람\"><b>satisfaction</b>만족, 보람</button><button type=\"button\" class=\"wdb\" data-w=\"recommend\" data-m=\"추천하다\"><b>recommend</b>추천하다</button><button type=\"button\" class=\"wdb\" data-w=\"unpredictable\" data-m=\"예측할 수 없는\"><b>unpredictable</b>예측할 수 없는</button><button type=\"button\" class=\"wdb\" data-w=\"decline\" data-m=\"거절하다\"><b>decline</b>거절하다</button><button type=\"button\" class=\"wdb\" data-w=\"deserve\" data-m=\"~을 받을 만하다\"><b>deserve</b>~을 받을 만하다</button><button type=\"button\" class=\"wdb\" data-w=\"for the time being\" data-m=\"당분간\"><b>for the time being</b>당분간</button></div>", "02": "<p class=\"mtr\">마더텅 정답률 <b>85%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">불일치 문제는 선택지를 <b>지문 순서대로</b> 하나씩 대조하세요. 선택지의 <b>‘자기 자녀’</b>처럼 누구의 것인지 슬쩍 바꾼 말이 지문의 <b>부정어</b>와 부딪히는지 확인해요.</p><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>① ↔ 2번</em>traveled throughout Europe(유럽 전역을 여행했다) → 같음</span><span><em>② ↔ 3번</em>did not approve(찬성하지 않았다) → 같음</span><span><em>③ ↔ 5번</em>meet him in Paris(파리에서 그를 만났다) → 같음</span><span><em>⑤ ↔ 7번</em>at the age of seventy(일흔 살에) 시력을 잃음 → 같음</span></div><div class=\"ck-eq\">⇒ 네 개는 지문과 그대로 같아요. 남은 ④를 6번과 대조해요</div></div><div class=\"ck-via\"><i>▼</i><span>④의 ‘자기 자녀’를 6번에서 찾아요</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 앞부분 · 결정적 단서</span><div class=\"en\">Though she <mark>never had children of her own</mark>, she loved children …</div><p class=\"ko\">비록 그녀는 <mark>자기 자녀가 한 명도 없었지만</mark>, 그녀는 아이들을 사랑했고 …</p></div><div class=\"ck-via\"><i>▼</i><span>자기 자녀가 없었으니, 그린 건 다른 집 아이들이에요</span></div><div class=\"ck-step\"><span class=\"lab\">6번 문장 뒷부분 · 누구를 그렸나</span><div class=\"en\">… and painted portraits of <mark>the children of her friends and family</mark>.</div><p class=\"ko\">… <mark>그녀의 친구들과 가족의 아이들의</mark> 초상화를 그렸다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">자기 자녀의 초상화를 그렸다.<small>6번: 자기 자녀는 없었고, 친구·가족의 아이들을 그렸어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">화가가 되는 것을 가족이 찬성하지 않았다.</span><span class=\"why\">3번 did not approve(찬성하지 않았다)의 부정어 not(않았다)을 보고 틀린 줄 알기 쉽지만, 선택지도 ‘찬성하지 않았다’라서 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">유년 시절에 유럽 전역을 여행했다.</span><span class=\"why\">2번 traveled throughout Europe(유럽 전역을 여행했다) in her childhood(어린 시절에)와 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">Edgar Degas를 파리에서 만났다.</span><span class=\"why\">5번 was able to meet him in Paris(파리에서 그를 만날 수 있었다)와 같아요. him(그) = 드가(Degas)예요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">70세에 시력을 잃었다.</span><span class=\"why\">7번 lost her sight at the age of seventy(일흔 살에 시력을 잃었다)와 같아요. seventy(일흔) = 70이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Mary Cassatt was born in Pennsylvania,</div><div class=\"k\">Mary Cassatt은 펜실베이니아에서 태어났다,</div></div><div class=\"rc\"><div class=\"e\">the fourth of five children</div><div class=\"k\">다섯 아이 중 넷째로,</div></div><div class=\"rc\"><div class=\"e\">born in her well-to-do family.</div><div class=\"k\">그녀의 부유한 집안에서 태어난</div></div><div class=\"rnat\">Mary Cassatt은 펜실베이니아에서, 부유한 집안의 다섯 아이 중 넷째로 태어났다.</div><div class=\"rst\">미술 수행평가로 화가 소개 카드를 만든다고 해 봐요. 첫 칸: 펜실베이니아의 부유한 집, 다섯 남매 중 넷째. 지문 1번 그대로예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Mary Cassatt and her family</div><div class=\"k\">Mary Cassatt과 그녀의 가족은</div></div><div class=\"rc\"><div class=\"e\">traveled throughout Europe</div><div class=\"k\">유럽 전역을 여행했다</div></div><div class=\"rc\"><div class=\"e\">in her childhood.</div><div class=\"k\">그녀의 어린 시절에.</div></div><div class=\"rnat\">Cassatt과 그녀의 가족은 그녀가 어릴 때 유럽 곳곳을 여행했다.</div><div class=\"rst\">둘째 칸: 어릴 때 가족과 유럽 곳곳을 여행함. 지문 2번의 <b>유럽 전역 여행</b>이고, 선택지 ①과 같아요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Her family did not approve</div><div class=\"k\">그녀의 가족은 찬성하지 않았다</div></div><div class=\"rc\"><div class=\"e\">when she decided to become an artist,</div><div class=\"k\">그녀가 화가가 되기로 결심했을 때,</div></div><div class=\"rc\"><div class=\"e\">but her desire was so strong,</div><div class=\"k\">하지만 그녀의 열망이 너무 강해서,</div></div><div class=\"rc\"><div class=\"e\">she bravely took the steps</div><div class=\"k\">그녀는 용감하게 걸음을 내디뎠다</div></div><div class=\"rc\"><div class=\"e\">to make art her career.</div><div class=\"k\">미술을 자신의 직업으로 삼기 위한</div></div><div class=\"rnat\">그녀가 화가가 되겠다고 했을 때 가족은 찬성하지 않았지만, 열망이 워낙 강해서 그녀는 용감하게 미술을 직업으로 삼는 길을 밟아 나갔다.</div><div class=\"rst\">셋째 칸: 가족은 반대했지만, 꿈이 강해서 용감하게 화가의 길로 감. 지문 3번 <b>찬성하지 않았다</b> = 선택지 ②예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">She studied first in Philadelphia</div><div class=\"k\">그녀는 (= Cassatt) 먼저 필라델피아에서 공부했다</div></div><div class=\"rc\"><div class=\"e\">and then went to Paris</div><div class=\"k\">그러고 나서 파리로 갔다</div></div><div class=\"rc\"><div class=\"e\">to study painting.</div><div class=\"k\">회화를 공부하려고.</div></div><div class=\"rnat\">그녀는 먼저 필라델피아에서 공부했고, 그다음 그림을 배우러 파리로 갔다.</div><div class=\"rst\">넷째 칸: 필라델피아에서 먼저 배우고, 그림을 공부하러 파리로 감. 지문 4번 순서 그대로 적어요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">She admired the work of Edgar Degas</div><div class=\"k\">그녀는 Edgar Degas의 작품을 흠모했다</div></div><div class=\"rc\"><div class=\"e\">and was able to meet him in Paris,</div><div class=\"k\">그리고 파리에서 그를 (= Edgar Degas) 만날 수 있었다,</div></div><div class=\"rc\"><div class=\"e\">which was a great inspiration.</div><div class=\"k\">그리고 그것은(= 파리에서 Degas를 만날 수 있었던 일) 큰 영감이 되었다</div></div><div class=\"rnat\">그녀는 Edgar Degas의 작품을 흠모했고 파리에서 그를 만날 수 있었는데, 그것은 큰 영감이 되었다.</div><div class=\"rst\">다섯째 칸: 파리에서 좋아하던 화가 드가(Degas)를 직접 만나 큰 영감을 얻음. 지문 5번 = 선택지 ③이에요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">Though she <span class=\"cw\">never had children of her own</span>,</div><div class=\"k\">비록 그녀는 <span class=\"cw\">자기 자녀가 한 명도 없었지만</span>,</div></div><div class=\"rc\"><div class=\"e\">she loved children</div><div class=\"k\">그녀는 아이들을 사랑했고</div></div><div class=\"rc\"><div class=\"e\">and painted portraits</div><div class=\"k\">초상화를 그렸다</div></div><div class=\"rc ckc\"><div class=\"e\">of <span class=\"cw\">the children of her friends and family</span>.</div><div class=\"k\"><span class=\"cw\">그녀의 친구들과 가족의 아이들의</span>.</div></div><div class=\"rnat\">비록 자기 자녀는 없었지만, 그녀는 아이들을 사랑했고 친구와 친척의 아이들의 초상화를 그렸다.</div><div class=\"rst\">여섯째 칸이 핵심! <b>자기 아이는 없었고</b>, 친구·친척의 아이들을 그렸어요. 그래서 지문 6번과 ④ “자기 자녀”가 어긋나요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Cassatt lost her sight</div><div class=\"k\">Cassatt은 시력을 잃었다</div></div><div class=\"rc\"><div class=\"e\">at the age of seventy,</div><div class=\"k\">일흔 살에,</div></div><div class=\"rc\"><div class=\"e\">and, sadly,</div><div class=\"k\">그리고 슬프게도,</div></div><div class=\"rc\"><div class=\"e\">was not able to paint</div><div class=\"k\">그림을 그릴 수 없었다</div></div><div class=\"rc\"><div class=\"e\">during the later years of her life.</div><div class=\"k\">그녀의 삶의 말년 동안.</div></div><div class=\"rnat\">Cassatt은 일흔에 시력을 잃었고, 안타깝게도 말년에는 그림을 그릴 수 없었다.</div><div class=\"rst\">마지막 칸: 일흔 살에 시력을 잃어 말년엔 그림을 못 그림. 지문 7번 <b>일흔 살</b> = 선택지 ⑤의 70세예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"well-to-do\" data-m=\"부유한\"><b>well-to-do</b>부유한</button><button type=\"button\" class=\"wdb\" data-w=\"approve\" data-m=\"찬성하다, 승인하다\"><b>approve</b>찬성하다, 승인하다</button><button type=\"button\" class=\"wdb\" data-w=\"admire\" data-m=\"흠모하다, 존경하다\"><b>admire</b>흠모하다, 존경하다</button><button type=\"button\" class=\"wdb\" data-w=\"inspiration\" data-m=\"영감\"><b>inspiration</b>영감</button><button type=\"button\" class=\"wdb\" data-w=\"portrait\" data-m=\"초상화\"><b>portrait</b>초상화</button><button type=\"button\" class=\"wdb\" data-w=\"sight\" data-m=\"시력\"><b>sight</b>시력</button></div>", "03": "<p class=\"mtr\">마더텅 정답률 <b>75%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">제목은 <b>주인공이 좁혀지는 문장</b>과 <b>마지막 결론 문장</b>을 묶어서 찾으세요. 3번에서 씹기의 주인공이 <b>mammals</b>(포유류)로 좁혀지고, 6번에서 “어디서든 살 수 있다”로 닫혀요.</p><div class=\"ck-step\"><span class=\"lab\">2번 문장 · 화제 정리</span><div class=\"en\"><mark>In other words</mark>, it means the extraction of more fuel and raw materials from a mouthful of food.</div><p class=\"ko\"><mark>다시 말해</mark>, 씹기는 한 입의 음식에서 더 많은 연료와 원료를 뽑아낸다는 뜻이다.</p></div><div class=\"ck-via\"><i>▼</i><span>씹어서 얻은 연료가 “누구에게” 특히 중요한지 대상이 정해져요</span></div><div class=\"ck-step key\"><span class=\"lab\">3번 문장 · 주인공이 좁혀짐</span><div class=\"en\">This is especially important <mark>for mammals</mark> because they heat their bodies from within.</div><p class=\"ko\">포유류는 몸을 내부에서부터 데우기 때문에, 이것은 특히 <mark>포유류에게</mark> 중요하다.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>4번</em>밤에도, 추운 곳에서도 움직일 에너지</span><span><em>5번</em>멀리 다니기·포식자 피하기·먹이 잡기·새끼 기르기</span></div><div class=\"ck-eq\">⇒ 4·5번의 공통점 = 포유류가 살아남는 데 필요한 힘</div></div><div class=\"ck-via\"><i>▼</i><span>앞의 생존 활동을 “다양한 서식지에서 살 수 있다”로 한 번에 묶어요</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 결정적 결론</span><div class=\"en\"><mark>Mammals are able to live</mark> in an incredible variety of habitats, … in no small measure <mark>because of their teeth</mark>.</div><p class=\"ko\">포유류는 적지 않은 부분 <mark>이빨 덕분에</mark> 믿을 수 없을 만큼 다양한 서식지에서 <mark>살 수 있다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">How Chewing Helps Mammals Survive 씹기가 포유류의 생존을 돕는 방법<small>3번의 주인공(포유류)과 6번의 결론(어디서든 살아남음)을 둘 다 담았어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">Boost Your Energy by Chewing More(더 씹어서 에너지를 높여라)!</span><span class=\"why\">[범위 좁음] 4번의 energy(에너지)만 따온 함정이에요. 글은 사람에게 더 씹으라는 조언이 아니라 포유류가 살아남는 이야기예요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">Chewing(씹기): A Way to Ease Indigestion(소화불량을 덜어 주는 방법)</span><span class=\"why\">[지문에 없음] 1번에서 소화를 돕는다는 말은 있지만 소화불량을 고친다는 말은 없어요. 글은 3번부터 포유류 생존으로 넘어가요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">Different Types and Functions of Teeth(이빨의 다양한 종류와 기능)</span><span class=\"why\">[지문에 없음] 6번에 teeth(이빨)가 나오지만, 이빨의 종류를 나누어 설명한 문장은 하나도 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">A Harsh Climate Makes Mammals Stronger(혹독한 기후가 포유류를 더 강하게 만든다)</span><span class=\"why\">[반대] 4번은 씹기 덕분에 추운 기후에서도 살 수 있다는 말이에요. 추위가 포유류를 강하게 만든다는 게 아니라 원인과 결과가 뒤집혔어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Chewing leads to smaller particles</div><div class=\"k\">씹기는 더 작은 조각으로 이어진다</div></div><div class=\"rc\"><div class=\"e\">for swallowing,</div><div class=\"k\">삼키기 위한,</div></div><div class=\"rc\"><div class=\"e\">and more exposed surface area</div><div class=\"k\">그리고 더 많이 드러난 표면적으로도</div></div><div class=\"rc\"><div class=\"e\">for digestive enzymes to act on.</div><div class=\"k\">소화 효소가 작용할</div></div><div class=\"rnat\">씹기는 삼키기 좋은 더 작은 조각을 만들고, 소화 효소가 작용할 표면을 더 많이 드러낸다.</div><div class=\"rst\">급식 밥을 꼭꼭 씹으면 잘게 부서져서 삼키기 쉽고 소화도 잘 돼요. = 지문 1번, 씹기는 음식을 작게 만들어 소화를 돕는다는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">In other words</span>,</div><div class=\"k\"><span class=\"cw\">다시 말해</span>,</div></div><div class=\"rc\"><div class=\"e\">it means</div><div class=\"k\">그것은(= 씹기) ~을 의미한다</div></div><div class=\"rc\"><div class=\"e\">the extraction of more fuel and raw materials</div><div class=\"k\">더 많은 연료와 원료를 뽑아내는 것을</div></div><div class=\"rc\"><div class=\"e\">from a mouthful of food.</div><div class=\"k\">한 입의 음식으로부터.</div></div><div class=\"rnat\">다시 말해 씹기는 한 입의 음식에서 더 많은 연료와 원료를 뽑아낸다는 뜻이다.</div><div class=\"rst\"><b>다시 말해</b>(In other words) 같은 한 숟가락에서 몸이 쓸 연료를 더 많이 뽑아낸다는 거예요. 지문 2번이 1번을 한 줄로 정리했어요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc\"><div class=\"e\">This is especially important</div><div class=\"k\">이것은 (= 앞 문장의 내용) 특히 중요하다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">for mammals</span></div><div class=\"k\"><span class=\"cw\">포유류에게</span></div></div><div class=\"rc\"><div class=\"e\">because they heat their bodies from within.</div><div class=\"k\">그들이 (= 포유류) 자신의 몸을 내부에서부터 데우기 때문에.</div></div><div class=\"rnat\">이것은 특히 포유류에게 중요한데, 포유류는 몸 안에서 스스로 체온을 만들어 내기 때문이다.</div><div class=\"rst\">우리 몸은 겨울에도 스스로 따뜻하죠. = 지문 3번, 몸 안에서 열을 만드는 <b>포유류</b>(mammals)에게 그 연료가 특히 중요하다는 말이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Chewing gives mammals the energy</div><div class=\"k\">씹기는 포유류에게 에너지를 준다</div></div><div class=\"rc\"><div class=\"e\">needed to be active</div><div class=\"k\">활동적이 되는 데 필요한</div></div><div class=\"rc\"><div class=\"e\">not only during the day</div><div class=\"k\">낮 동안뿐 아니라</div></div><div class=\"rc\"><div class=\"e\">but also the cool night,</div><div class=\"k\">서늘한 밤에도,</div></div><div class=\"rc\"><div class=\"e\">and to live in colder climates</div><div class=\"k\">그리고 더 추운 기후에서 살기 위한</div></div><div class=\"rc\"><div class=\"e\">or places with changing temperatures.</div><div class=\"k\">또는 기온이 변하는 곳에서.</div></div><div class=\"rnat\">씹기는 포유류에게 낮뿐 아니라 서늘한 밤에도 활동할 에너지를, 그리고 더 추운 기후나 기온이 변하는 곳에서 살아갈 에너지를 준다.</div><div class=\"rst\">그래서 점심을 잘 씹어 먹은 날은 해가 진 추운 저녁 학원길에도 힘이 나요. = 지문 4번, 씹기가 밤과 추운 곳에서도 움직일 에너지를 준다는 말이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">It allows them</div><div class=\"k\">그것은 (= 씹기) 그들이 (= 포유류) ~하게 해 준다</div></div><div class=\"rc\"><div class=\"e\">to sustain higher levels of activity</div><div class=\"k\">더 높은 수준의 활동을 유지하게</div></div><div class=\"rc\"><div class=\"e\">and travel speeds</div><div class=\"k\">그리고 이동 속도를,</div></div><div class=\"rc\"><div class=\"e\">to cover larger distances,</div><div class=\"k\">더 먼 거리를 다니고,</div></div><div class=\"rc\"><div class=\"e\">avoid predators,</div><div class=\"k\">포식자를 피하고,</div></div><div class=\"rc\"><div class=\"e\">capture prey,</div><div class=\"k\">먹이를 잡고,</div></div><div class=\"rc\"><div class=\"e\">and make and care for their young.</div><div class=\"k\">그리고 그들(= 포유류)의 새끼를 낳아 돌보기 위해</div></div><div class=\"rnat\">씹기 덕분에 포유류는 더 높은 활동량과 이동 속도를 유지해 더 먼 거리를 다니고, 포식자를 피하고, 먹이를 잡고, 새끼를 낳아 기를 수 있다.</div><div class=\"rst\">체육 시간에 멀리 달리고, 피구공을 피하고, 공을 잡는 힘도 거기서 나와요. 지문 5번의 포식자 피하기·먹이 잡기·새끼 기르기가 다 살아남는 일이에요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Mammals are able to live</span></div><div class=\"k\"><span class=\"cw\">포유류는 살 수 있다</span></div></div><div class=\"rc\"><div class=\"e\">in an incredible variety of habitats,</div><div class=\"k\">믿을 수 없을 만큼 다양한 서식지에서,</div></div><div class=\"rc\"><div class=\"e\">from Arctic tundra to Antarctic pack ice,</div><div class=\"k\">북극의 툰드라에서 남극의 총빙(바다 위에 모여 언 얼음 덩어리)까지,</div></div><div class=\"rc\"><div class=\"e\">deep open waters to high-altitude mountaintops,</div><div class=\"k\">깊은 바다에서 고도가 높은 산꼭대기까지,</div></div><div class=\"rc\"><div class=\"e\">and rainforests to deserts,</div><div class=\"k\">그리고 열대우림에서 사막까지,</div></div><div class=\"rc ckc\"><div class=\"e\">in no small measure <span class=\"cw\">because of their teeth</span>.</div><div class=\"k\">적지 않은 부분은 그들(= 포유류)의 <span class=\"cw\">이빨 덕분에</span></div></div><div class=\"rnat\">포유류가 북극 툰드라부터 남극 유빙까지, 깊은 바다부터 고산 정상까지, 열대우림부터 사막까지 놀랍도록 다양한 서식지에서 살 수 있는 것은 적지 않은 부분 그들의 이빨 덕분이다.</div><div class=\"rst\"><b>결국 씹는 이빨 덕분에</b> 포유류는 북극부터 사막까지 어디서든 살아요. 지문 6번이 결론이라서, 제목은 “씹기가 포유류의 생존을 돕는 방법”이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"mammal\" data-m=\"포유류\"><b>mammal</b>포유류</button><button type=\"button\" class=\"wdb\" data-w=\"extraction\" data-m=\"추출, 뽑아냄\"><b>extraction</b>추출, 뽑아냄</button><button type=\"button\" class=\"wdb\" data-w=\"sustain\" data-m=\"유지하다\"><b>sustain</b>유지하다</button><button type=\"button\" class=\"wdb\" data-w=\"predator\" data-m=\"포식자\"><b>predator</b>포식자</button><button type=\"button\" class=\"wdb\" data-w=\"habitat\" data-m=\"서식지\"><b>habitat</b>서식지</button><button type=\"button\" class=\"wdb\" data-w=\"in no small measure\" data-m=\"적지 않은 부분, 상당 부분\"><b>in no small measure</b>적지 않은 부분, 상당 부분</button></div>", "04": "<p class=\"mtr\">마더텅 정답률 <b>80%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">요지는 <b>but</b>(하지만) 뒤에 숨어 있어요. 1번의 “<b>정반대</b>”가 무엇인지 바로 풀어 주는 2번이 요지이고, 3~6번은 전부 그 <b>사례</b>예요.</p><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 결론 신호</span><div class=\"en\">The old saying is that “knowledge is power,” <mark>but</mark> when it comes to scary, threatening news, research suggests <mark>the exact opposite</mark>.</div><p class=\"ko\">‘아는 것이 힘이다’라는 옛말이 있다, <mark>하지만</mark> 무섭고 위협적인 뉴스에 관해서라면, 연구는 <mark>정반대</mark>를 시사한다.</p></div><div class=\"ck-via\"><i>▼</i><span>“정반대”가 무엇인지 바로 풀어 준 문장이에요</span></div><div class=\"ck-step key\"><span class=\"lab\">2번 문장 · 결정적 요지</span><div class=\"en\"><mark>Frightening news</mark> can actually rob people of their inner sense of control, making them <mark>less likely</mark> to take care of themselves and other people.</div><p class=\"ko\"><mark>겁을 주는 뉴스는</mark> 사람들에게서 내적인 통제감을 빼앗아, 자기 자신과 남을 돌볼 <mark>가능성을 더 낮게</mark> 만든다.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>3번</em>건강 뉴스가 비관적이면 → 병 예방 조치를 덜 함</span><span><em>4번</em>암 증가 경고 기사 → 검진받는 사람이 줄어듦</span><span><em>6번</em>온통 우울한 환경 뉴스 → 작은 실천에 흥미를 잃음</span></div><div class=\"ck-eq\">⇒ 세 사례의 공통점 = 겁주는 뉴스 → 사람들이 덜 대처함 (2번과 같은 말)</div></div><div class=\"ck-via\"><i>▼</i><span>this(이것)가 2번 요지를 다시 가리키며 기후변화로 넓혀요</span></div><div class=\"ck-step\"><span class=\"lab\">5번 문장 · 요지 다시 확인</span><div class=\"en\"><mark>This is also true</mark> for issues such as climate change.</div><p class=\"ko\">이것은 기후변화 같은 문제에도 <mark>또한 사실이다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">두려움을 주는 뉴스는 사람들이 문제에 덜 대처하게 할 수 있다.<small>2번의 Frightening news(겁을 주는 뉴스) + less likely(가능성이 더 낮은)를 그대로 옮겼어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">지속적인 환경 문제 보도가 사람들의 인식 변화를 가져온다.</span><span class=\"why\">[반대] 5~6번에 기후변화가 나오지만, 온통 우울한 보도는 사람들을 less interested(흥미를 덜 갖는) 상태로 만든다고 했어요. 변화를 가져온다는 건 정반대예요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">정보를 전달하는 시기에 따라 뉴스의 영향력이 달라질 수 있다.</span><span class=\"why\">[지문에 없음] 지문은 뉴스를 “언제” 전하느냐가 아니라 “얼마나 겁주게” 전하느냐를 말해요. 시기 이야기는 한 번도 안 나와요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">정보 제공의 지연은 정확한 문제 인식에 방해가 될 수 있다.</span><span class=\"why\">[지문에 없음] 정보가 늦게 오는 문제는 없어요. 4번 암 기사도 늦어서가 아니라 너무 무서워서(terrified 몹시 두려워하는) 검진을 피한 거예요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">출처가 불분명한 건강 정보는 사람들에게 유익하지 않다.</span><span class=\"why\">[지문에 없음] 3~4번 건강 뉴스는 사례일 뿐이고, 출처가 불분명하다는 말도 없어요. 문제는 출처가 아니라 겁주는 방식이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">The old saying is that “knowledge is power,”</div><div class=\"k\">오래된 속담은 ‘아는 것이 힘이다’라는 것이다,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">but</span> when it comes to scary, threatening news,</div><div class=\"k\"><span class=\"cw\">하지만</span> 무섭고 위협적인 뉴스에 관해서라면,</div></div><div class=\"rc ckc\"><div class=\"e\">research suggests <span class=\"cw\">the exact opposite</span>.</div><div class=\"k\">연구는 <span class=\"cw\">정반대를</span> 시사한다.</div></div><div class=\"rnat\">“아는 것이 힘이다”라는 옛말이 있지만, 무섭고 위협적인 뉴스에 관해서는 연구가 정반대를 시사한다.</div><div class=\"rst\">“많이 알면 힘이 된다”고 하죠. 그런데 시험 전에 쌤이 무서운 말만 하면 오히려 반대가 돼요. = 지문 1번, 겁주는 뉴스는 <b>정반대</b>라는 말이에요.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">2번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Frightening news</span> can actually rob people</div><div class=\"k\"><span class=\"cw\">겁을 주는 뉴스는</span> 실제로 사람들에게서 빼앗을 수 있다</div></div><div class=\"rc\"><div class=\"e\">of their inner sense of control,</div><div class=\"k\">그들의 내적인 통제감을,</div></div><div class=\"rc ckc\"><div class=\"e\">making them <span class=\"cw\">less likely</span></div><div class=\"k\">그들이 (= 사람들) ~할 <span class=\"cw\">가능성을 더 낮게</span> 만들면서</div></div><div class=\"rc\"><div class=\"e\">to take care of themselves and other people.</div><div class=\"k\">자기 자신과 다른 사람들을 돌볼.</div></div><div class=\"rnat\">겁을 주는 뉴스는 실제로 사람들에게서 내적 통제감을 빼앗아, 자기 자신과 남을 돌볼 가능성을 낮춘다.</div><div class=\"rst\">“이번에 망하면 끝이야!”만 들으면 “난 어차피 안 돼” 하고 손을 놔요. 지문 2번이 요지예요. <b>겁을 주는 뉴스</b>는 나와 남을 챙길 힘을 빼앗아요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Public health research shows</div><div class=\"k\">공중보건 연구는 보여 준다</div></div><div class=\"rc\"><div class=\"e\">that when the news presents health-related information</div><div class=\"k\">뉴스가 건강과 관련된 정보를 제시할 때</div></div><div class=\"rc\"><div class=\"e\">in a pessimistic way,</div><div class=\"k\">비관적인 방식으로,</div></div><div class=\"rc\"><div class=\"e\">people are actually less likely</div><div class=\"k\">사람들은 실제로 ~할 가능성이 더 낮다</div></div><div class=\"rc\"><div class=\"e\">to take steps to protect themselves from illness</div><div class=\"k\">질병으로부터 자신을 보호하려는 조치를 취할</div></div><div class=\"rc\"><div class=\"e\">as a result.</div><div class=\"k\">그 결과로.</div></div><div class=\"rnat\">공중보건 연구에 따르면, 뉴스가 건강 정보를 비관적으로 전달할 때 사람들은 오히려 질병으로부터 자신을 지키는 조치를 덜 취한다.</div><div class=\"rst\">그래서 쌤이 비관적으로 말할수록 반 아이들은 예습을 더 안 해요. = 지문 3번, 건강 뉴스를 비관적으로 전하면 사람들이 병 예방을 덜 한다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">A news article</div><div class=\"k\">한 뉴스 기사는</div></div><div class=\"rc\"><div class=\"e\">that's intended to warn people</div><div class=\"k\">사람들에게 경고하려는 의도인 (= 뉴스 기사)</div></div><div class=\"rc\"><div class=\"e\">about increasing cancer rates,</div><div class=\"k\">증가하는 암 발병률에 대해,</div></div><div class=\"rc\"><div class=\"e\">for example,</div><div class=\"k\">예를 들어,</div></div><div class=\"rc\"><div class=\"e\">can result in fewer people</div><div class=\"k\">더 적은 사람들이 ~하는 결과를 낳을 수 있다</div></div><div class=\"rc\"><div class=\"e\">choosing to get screened for the disease</div><div class=\"k\">그 병의 검진을 받기로 선택하는</div></div><div class=\"rc\"><div class=\"e\">because they're so terrified</div><div class=\"k\">그들이 (= 사람들) 너무 두려워하기 때문에</div></div><div class=\"rc\"><div class=\"e\">of what they might find.</div><div class=\"k\">자신이 (= 사람들) 무엇을 발견할지도 모르는 것을.</div></div><div class=\"rnat\">예를 들어 암 발병률 증가를 경고하려는 기사는, 무엇을 발견하게 될지 너무 두려운 나머지 오히려 검진을 받는 사람을 줄이는 결과를 낳을 수 있다.</div><div class=\"rst\">예를 들어 “점수 엄청 떨어졌어” 소리에 겁이 나서 채점 결과를 아예 안 보는 친구도 생겨요. = 지문 4번, 암이 무서워 검진을 피하는 사람들이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">This is also true</span></div><div class=\"k\">이것은 (= 앞에서 말한 내용, 겁주는 뉴스가 사람들의 대처를 줄이는 것) <span class=\"cw\">또한 사실이다</span></div></div><div class=\"rc\"><div class=\"e\">for issues such as climate change.</div><div class=\"k\">기후변화 같은 문제에도.</div></div><div class=\"rnat\">이는 기후변화 같은 문제에서도 마찬가지다.</div><div class=\"rst\"><b>이것</b>(This)은 다른 문제에서도 똑같아요. 지문 5번은 기후변화 같은 문제에도 같은 일이 생긴다고 말해요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">When a news story is all doom and gloom,</div><div class=\"k\">뉴스가 온통 파멸과 우울뿐일 때,</div></div><div class=\"rc\"><div class=\"e\">people feel depressed</div><div class=\"k\">사람들은 우울해지고</div></div><div class=\"rc\"><div class=\"e\">and become less interested</div><div class=\"k\">흥미를 덜 갖게 된다</div></div><div class=\"rc\"><div class=\"e\">in taking small, personal steps</div><div class=\"k\">작고 개인적인 조치를 취하는 것에</div></div><div class=\"rc\"><div class=\"e\">to fight ecological collapse.</div><div class=\"k\">생태계 붕괴와 싸우기 위한.</div></div><div class=\"rnat\">뉴스가 온통 파멸과 우울뿐일 때, 사람들은 무기력해지고 생태계 붕괴에 맞서는 작은 개인적 실천에도 흥미를 잃는다.</div><div class=\"rst\">“지구는 이제 끝났어”만 들으면 교실 불 끄기 같은 작은 실천도 하기 싫어져요. 지문 6번처럼, 겁주는 뉴스는 결국 사람들을 덜 움직이게 해요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"sense of control\" data-m=\"통제감\"><b>sense of control</b>통제감</button><button type=\"button\" class=\"wdb\" data-w=\"pessimistic\" data-m=\"비관적인\"><b>pessimistic</b>비관적인</button><button type=\"button\" class=\"wdb\" data-w=\"take steps\" data-m=\"조치를 취하다\"><b>take steps</b>조치를 취하다</button><button type=\"button\" class=\"wdb\" data-w=\"get screened\" data-m=\"검진을 받다\"><b>get screened</b>검진을 받다</button><button type=\"button\" class=\"wdb\" data-w=\"terrified\" data-m=\"몹시 두려워하는\"><b>terrified</b>몹시 두려워하는</button><button type=\"button\" class=\"wdb\" data-w=\"doom and gloom\" data-m=\"파멸과 우울\"><b>doom and gloom</b>파멸과 우울</button></div>", "05": "<p class=\"mtr\">마더텅 정답률 <b>40%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">밑줄 바로 <b>뒤 절에 빠진 자리가 있는지</b>부터 보세요. 빠진 자리가 있으면 <b>what</b>(~하는 것), 다 갖춰져 있으면 <b>that</b>(~라는 것)이에요.</p><div class=\"ck-step\"><span class=\"lab\">문제지 ③번 자리 (3번)</span><div class=\"en\">… not only in the way that it was made but also in <u>③ that</u> was shown.</div><p class=\"ko\">보여진 ( ? )에서도 — 앞은 전치사 in, 뒤는 바로 동사 was shown</p></div><div class=\"ck-via\"><i>▼</i><span>앞쪽 that(관계부사 대신 쓰인 “~하는”) 뒤에는 주어 it(그것)이 있어서 완전해요</span></div><div class=\"ck-step\"><span class=\"lab\">같은 문장 앞쪽과 비교</span><div class=\"en\">not only in the way that <mark>it was made</mark></div><p class=\"ko\">그것이 (= 이 새로운 그림 방식) <mark>만들어진</mark> 방식에서뿐 아니라</p></div><div class=\"ck-via\"><i>▼</i><span>뒤쪽은 주어 없이 동사부터 나와요 → 불완전 → what(~하는 것)</span></div><div class=\"ck-step key\"><span class=\"lab\">3번 문장 · 결정적 단서</span><div class=\"en\">but also <mark>in what</mark> <mark>was shown</mark>.</div><p class=\"ko\"><mark>보여진</mark> 것에서도</p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">관계대명사 what(~하는 것)과 접속사 that(~라는 것) 구별</p><p class=\"gr\">what(~하는 것) 뒤에는 주어나 목적어가 빠진 불완전한 절이 와요. that(~라는 것) 뒤에는 다 갖춰진 완전한 절이 오고, 전치사 바로 뒤에는 that(~라는 것)절을 못 써요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I like what you made.</div><div class=\"ko\">나는 네가 만든 것이 좋아. (made 뒤 목적어가 비었으니 what)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I like that you made.</div><div class=\"ko\">목적어가 빈 절인데 that을 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>I know that you are kind.</div><div class=\"ko\">나는 네가 친절하다는 것을 알아. (you are kind가 완전하니 that)</div></div><p class=\"gb\">지문 3번도 in(~에서) 뒤에 바로 was shown(보여졌다)이 와요. 주어가 빠진 불완전한 절이고 전치사 뒤라서 that(~라는 것)이 아니라 what(~하는 것)이에요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">that → what (~하는 것)<small>in(~에서) 뒤인데 was shown(보여졌다) 앞 주어가 비었으니 what(~하는 것)이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">appropriate 적절한</span><span class=\"why\">7번은 Never before(이전에는 결코 ~않았다)로 시작해 순서가 뒤바뀐 문장이에요. 원래 순서로 돌리면 these subjects had been considered(이런 소재들이 여겨졌다) + ⑤ 자리라서, ⑤는 소재가 '어떻다고' 여겨졌는지 말하는 보어 자리예요. 그래서 형용사 appropriate(적절한)가 맞고, 부사 appropriately(적절하게)는 못 와요.</span><div class=\"gm wx\"><p class=\"gt\">보어 자리 형용사: be considered(여겨지다) + 형용사(~하다고)</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>The test was considered easy.</div><div class=\"ko\">그 시험은 쉽다고 여겨졌다. (easy 쉬운 = 형용사가 시험의 상태를 말해 줘서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>The test was considered easily.</div><div class=\"ko\">easily(쉽게)는 부사라 '시험이 어떻다'를 말할 수 없어서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>We consider him kind.</div><div class=\"ko\">우리는 그가 친절하다고 여긴다. (kind 친절한 = 형용사가 그의 성격을 설명해서 맞아요)</div></div><p class=\"gb\">지문 7번도 these subjects(이런 소재들)가 '적절하다고' 여겨진 것이라 형용사 appropriate(적절한)가 그대로 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">to work 노력하라고</span><span class=\"why\">1번은 which does not ask the viewer(보는 사람에게 요구하지 않는) 바로 뒤예요. ask(요구하다) + 사람 the viewer(보는 사람) 다음에는 '무엇을 하라고' 요구하는지가 오므로 to work(노력하라고)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">ask(요구하다) + 사람 + to(~하라고) + 동사원형</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>Mom asked me to clean my room.</div><div class=\"ko\">엄마는 나에게 방을 청소하라고 하셨다. (asked me 다음에 to clean 청소하라고가 와서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>Mom asked me clean my room.</div><div class=\"ko\">me(나에게) 뒤에 to 없이 clean(청소하다)을 바로 써서 틀려요.</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>Mom asked me cleaning my room.</div><div class=\"ko\">cleaning(청소하는 것)처럼 -ing를 써도 ask(요구하다) 뒤에서는 틀려요.</div></div><p class=\"gb\">지문 1번도 ask the viewer(보는 사람에게 요구하다) 다음이라 to work(노력하라고)가 딱 맞는 자리예요.</p></div></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">appealing 눈길을 끄는</span><span class=\"why\">2번은 with its summer scenes and bright colours(여름 풍경과 밝은 색채가) 뒤에 ② 자리가 와요. with(~한 채로) + 명사 + 분사 구조이고, 밝은 색채가 눈길을 '끄는' 쪽이라 능동 appealing(눈길을 끄는)이 맞아요. 뒤의 to the eye(눈에)도 색채가 눈에 직접 끌림을 준다는 단서예요.</span><div class=\"gm wx\"><p class=\"gt\">with(~한 채로) + 명사 + -ing(능동: ~하는) / p.p.(수동: ~된)</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>He sat with his dog sleeping.</div><div class=\"ko\">그는 개가 자고 있는 채로 앉아 있었다. (개가 직접 자니까 능동 sleeping(자는)이 맞아요)</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>He left with the door locked.</div><div class=\"ko\">그는 문이 잠긴 채로 떠났다. (문은 스스로 잠그지 않고 '잠겨지니까' 수동 locked(잠긴)가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>He left with the door locking.</div><div class=\"ko\">문이 스스로 잠그는 게 아닌데 능동 locking(잠그는)을 써서 틀려요.</div></div><p class=\"gb\">지문 2번도 bright colours(밝은 색채)가 직접 눈길을 끄니 능동 appealing(눈길을 끄는)이 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">such 그렇게</span><span class=\"why\">4번은 They had never seen(그들은 본 적이 없었다) 뒤 목적어 자리예요. ④ 다음에 'informal' paintings(격식 없는 그림)처럼 형용사 + 명사가 오므로 such(그렇게)가 맞아요. so(매우)는 뒤에 명사 없이 형용사만 올 때 써요.</span><div class=\"gm wx\"><p class=\"gt\">such(그렇게) + 형용사 + 명사 / so(매우) + 형용사</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>It was such a fun game.</div><div class=\"ko\">그건 정말 재미있는 게임이었다. (fun game 재미있는 게임 = 형용사+명사라서 such가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>It was so a fun game.</div><div class=\"ko\">뒤에 명사 game(게임)이 있는데 so(매우)를 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>The game was so fun.</div><div class=\"ko\">그 게임은 아주 재미있었다. (뒤에 명사 없이 형용사 fun 재미있는 만 있어서 so가 맞아요)</div></div><p class=\"gb\">지문 4번도 such(그렇게) 뒤에 'informal' paintings(격식 없는 그림), 즉 형용사 + 명사가 와서 such(그렇게)가 맞아요.</p></div></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Impressionist paintings are probably most popular;</div><div class=\"k\">인상주의 그림은 아마 가장 인기가 많을 것이다;</div></div><div class=\"rc\"><div class=\"e\">it is an easily understood art</div><div class=\"k\">그것은 (= 인상주의 그림) 쉽게 이해되는 미술이다</div></div><div class=\"rc\"><div class=\"e\">which does not ask the viewer</div><div class=\"k\">그것은 (= 쉽게 이해되는 미술) 보는 사람에게 요구하지 않는</div></div><div class=\"rc\"><div class=\"e\">to work hard</div><div class=\"k\">열심히 노력하라고</div></div><div class=\"rc\"><div class=\"e\">to understand the imagery.</div><div class=\"k\">그 이미지를 이해하기 위해.</div></div><div class=\"rnat\">인상주의 그림은 아마 가장 인기가 많을 것이다. 인상주의는 보는 사람에게 그 이미지를 이해하려고 애쓰라고 요구하지 않는, 쉽게 이해되는 미술이다.</div><div class=\"rst\">인상주의 그림은 쉬워서 인기가 많아요. 보는 사람에게 애써 이해하라고 하지 않거든요. (ask A to do = A에게 ~하라고 요구하다)</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Impressionism is ‘comfortable’ to look at,</div><div class=\"k\">인상주의는 보기에 ‘편안하다’,</div></div><div class=\"rc\"><div class=\"e\">with its summer scenes and bright colours</div><div class=\"k\">인상주의의 여름 풍경과 밝은 색채가</div></div><div class=\"rc\"><div class=\"e\">appealing to the eye.</div><div class=\"k\">눈길을 끄는 채로.</div></div><div class=\"rnat\">인상주의는 여름 풍경과 눈길을 끄는 밝은 색채 덕분에 보기에 ‘편안하다’.</div><div class=\"rst\">여름 풍경과 밝은 색 덕분에 보기 편안해요. 색이 눈길을 끄는 쪽이라 <b>appealing</b>(눈길을 끄는)이에요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc\"><div class=\"e\">It is important to remember, however,</div><div class=\"k\">그러나 기억하는 것이 중요하다 (It은 가주어, 진주어는 to remember 이하),</div></div><div class=\"rc\"><div class=\"e\">that this new way of painting</div><div class=\"k\">이 새로운 그림 방식이</div></div><div class=\"rc\"><div class=\"e\">was challenging to its public</div><div class=\"k\">그것(= 이 새로운 그림 방식)의 대중에게 도전적이었다는 것을</div></div><div class=\"rc\"><div class=\"e\">not only in the way that it was made</div><div class=\"k\">그것이 (= 이 새로운 그림 방식) 만들어진 방식에서뿐 아니라</div></div><div class=\"rc ckc\"><div class=\"e\">but also <span class=\"cw\">in what</span> <span class=\"cw\">was shown</span>.</div><div class=\"k\"><span class=\"cw\">보여진</span> <span class=\"cw\">것에서도</span> (※ 문제지 ③번 자리 — 문제지에는 that으로 되어 있으나 what이 맞는 표현)</div></div><div class=\"rnat\">하지만 기억해야 할 점은, 이 새로운 그림 방식은 그것이 만들어진 방식뿐 아니라 보이는 것(무엇이 그려졌는가)에서도 당대 대중에게 도전적이었다는 점이다.</div><div class=\"rst\"><b>하지만</b>(however) 그때 사람들에게는 낯선 그림이었어요. 그리는 방식도, <b>그려진 것</b>(what was shown 보여진 것)도요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">They had never seen</div><div class=\"k\">그들은 (= 당대 대중) 본 적이 없었다</div></div><div class=\"rc\"><div class=\"e\">such ‘informal’ paintings</div><div class=\"k\">그렇게 ‘격식 없는’ 그림을</div></div><div class=\"rc\"><div class=\"e\">before.</div><div class=\"k\">전에는.</div></div><div class=\"rnat\">사람들은 그토록 ‘격식 없는’ 그림을 전에 본 적이 없었다.</div><div class=\"rst\">사람들은 그렇게 격식 없는 그림을 처음 봤어요. 지문은 such(그렇게) + 형용사 + 명사로 그 놀라움을 말해요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">The edge of the canvas</div><div class=\"k\">캔버스의 가장자리는</div></div><div class=\"rc\"><div class=\"e\">cut off the scene</div><div class=\"k\">그 장면을 잘라 냈다</div></div><div class=\"rc\"><div class=\"e\">in an arbitrary way,</div><div class=\"k\">임의적인 방식으로,</div></div><div class=\"rc\"><div class=\"e\">as if snapped with a camera.</div><div class=\"k\">마치 카메라로 찍힌 것처럼.</div></div><div class=\"rnat\">캔버스의 가장자리는 마치 카메라로 찍은 듯 임의로 장면을 잘라 냈다.</div><div class=\"rst\">그림 가장자리가 카메라로 찍은 듯 장면을 마음대로 잘라 냈어요. 이게 3번에서 말한 낯선 '방식'이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">The subject matter included</div><div class=\"k\">그 소재는 포함했다</div></div><div class=\"rc\"><div class=\"e\">modernization of the landscape;</div><div class=\"k\">풍경의 근대화를;</div></div><div class=\"rc\"><div class=\"e\">railways and factories.</div><div class=\"k\">철도와 공장을.</div></div><div class=\"rnat\">소재에는 풍경의 근대화, 즉 철도와 공장이 포함되었다.</div><div class=\"rst\">그려진 것도 새로웠어요. 철도와 공장 같은 바뀐 풍경이에요. = 3번의 what was shown(보여진 것)이 바로 이거예요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Never before</div><div class=\"k\">이전에는 결코 ~않았다</div></div><div class=\"rc\"><div class=\"e\">had these subjects been considered</div><div class=\"k\">이런 소재들이 (= 철도·공장 같은 근대화된 풍경) 여겨진 적이 (없었다)</div></div><div class=\"rc\"><div class=\"e\">appropriate for artists.</div><div class=\"k\">화가에게 적절하다고.</div></div><div class=\"rnat\">이전에는 이런 소재가 화가에게 적절하다고 여겨진 적이 결코 없었다.</div><div class=\"rst\">이런 소재는 전에는 화가가 그릴 만하다고 여겨진 적이 없어요. Never before(이전에는 결코 ~않았다)로 시작해 순서가 뒤바뀐 문장이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"imagery\" data-m=\"이미지, 형상\"><b>imagery</b>이미지, 형상</button><button type=\"button\" class=\"wdb\" data-w=\"appealing\" data-m=\"매력적인, 눈길을 끄는\"><b>appealing</b>매력적인, 눈길을 끄는</button><button type=\"button\" class=\"wdb\" data-w=\"challenging\" data-m=\"도전적인, 만만찮은\"><b>challenging</b>도전적인, 만만찮은</button><button type=\"button\" class=\"wdb\" data-w=\"arbitrary\" data-m=\"임의적인, 제멋대로인\"><b>arbitrary</b>임의적인, 제멋대로인</button><button type=\"button\" class=\"wdb\" data-w=\"subject matter\" data-m=\"소재, 주제\"><b>subject matter</b>소재, 주제</button><button type=\"button\" class=\"wdb\" data-w=\"appropriate\" data-m=\"적절한\"><b>appropriate</b>적절한</button></div>", "06": "<p class=\"mtr\">마더텅 정답률 <b>50%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">6번 <b>opposite</b>(반대의)에서 줄기 → 뿌리로 방향이 뒤집혀요. 뿌리에서는 옥신이 성장을 <b>막는 쪽</b>이니, 그 방향과 어긋나는 낱말을 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">6번 · 방향 전환</span><div class=\"en\">Auxins have the <mark>opposite effect</mark> on the roots of plants.</div><p class=\"ko\">옥신은 식물의 뿌리에는 <mark>정반대의 효과</mark>를 가진다.</p></div><div class=\"ck-via\"><i>▼</i><span>반대 효과 = 줄기의 촉진이 아니라 제한</span></div><div class=\"ck-step\"><span class=\"lab\">7번 · 뿌리의 방향</span><div class=\"en\">Auxins in the tips of roots tend to <mark>limit growth</mark>.</div><p class=\"ko\">뿌리 끝의 옥신은 <mark>성장을 제한하는</mark> 경향이 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>제한이 어디서 일어나는지: 바로 아래쪽</span></div><div class=\"ck-step key\"><span class=\"lab\">8번 · 결정적 단서</span><div class=\"en\">the auxins will accumulate on the lower side and <mark>interfere with</mark> its development.</div><p class=\"ko\">옥신은 아래쪽에 쌓여 그것(= 뿌리)의 발달을 <mark>방해할</mark> 것이다.</p></div><div class=\"ck-via\"><i>▼</i><span>방해받는 아래쪽이 더 빨리? 방향이 거꾸로예요</span></div><div class=\"ck-step\"><span class=\"lab\">문제지 ④번 자리 (9번)</span><div class=\"en\">Therefore, the lower side of the root will grow <u>④ faster</u> than the upper side.</div><p class=\"ko\">그러므로 뿌리의 아래쪽은 위쪽보다 ( 더 빨리? ) 자랄 것이다 → 더 느리게가 맞아요</p></div><div class=\"ck-via\"><i>▼</i><span>아래쪽이 느려야 뿌리가 아래로 휘어요</span></div><div class=\"ck-step\"><span class=\"lab\">10번 · 결과로 확인</span><div class=\"en\">This will, in turn, cause the root to <mark>bend downwards</mark>,</div><p class=\"ko\">이것은 결과적으로, 뿌리가 <mark>아래쪽으로 휘게</mark> 만들 것이다,</p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">faster(더 빨리) ↔ slower(더 느리게)</p><p class=\"gr\">원인이 stimulate(촉진하다)면 결과는 faster(더 빨리), limit(제한하다)·interfere with(방해하다)면 slower(더 느리게)예요. 원인과 결과의 방향이 같아야 해요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>My bike has a flat tire, so I ride slower.</div><div class=\"ko\">자전거 바퀴에 바람이 빠져서 나는 더 느리게 타요. (방해 → 느리게)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>My bike has a flat tire, so I ride faster.</div><div class=\"ko\">바람 빠진 바퀴인데 더 빨리 탄다? 방향이 거꾸로라 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>Sunlight helps the plant grow faster.</div><div class=\"ko\">햇빛은 식물이 더 빨리 자라게 도와요. (도움 → 빨리)</div></div><p class=\"gb\">지문 8번에서 옥신이 아래쪽 발달을 interfere with(방해하다)했으니, 9번은 faster(더 빨리)가 아니라 slower(더 느리게)여야 해요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">faster → slower (더 느리게)<small>방해받는 아래쪽은 더 느리게 자라야 10번처럼 아래로 휘어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">downwards 아래쪽으로</span><span class=\"why\">아래쪽이 느리게 자라면 위쪽이 더 자라서 뿌리가 아래로 휘어요. 줄기도 느린 쪽(빛 쪽)으로 휘었으니 같은 원리라 downwards(아래쪽으로)가 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">stimulate 촉진하다</span><span class=\"why\">3번은 줄기 이야기예요. 2번에서 옥신이 그늘 쪽에 쌓이고 4번에서 그늘 쪽이 더 빨리 자라니 stimulate(촉진하다)가 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">towards ~을 향해</span><span class=\"why\">4번처럼 그늘 쪽이 더 빨리 자라면 줄기는 반대편인 빛 쪽으로 휘어요. 그래서 towards the light(빛을 향해)가 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">opposite 반대의</span><span class=\"why\">3번 줄기는 stimulate(촉진하다), 7번 뿌리는 limit(제한하다)라서 효과가 정말 반대예요. opposite(반대의)가 맞아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Plant growth is controlled</div><div class=\"k\">식물의 성장은 조절된다</div></div><div class=\"rc\"><div class=\"e\">by a group of hormones</div><div class=\"k\">한 무리의 호르몬에 의해</div></div><div class=\"rc\"><div class=\"e\">called auxins</div><div class=\"k\">옥신이라고 불리는</div></div><div class=\"rc\"><div class=\"e\">found at the tips of stems and roots of plants.</div><div class=\"k\">식물의 줄기와 뿌리 끝에서 발견되는.</div></div><div class=\"rnat\">식물의 성장은 줄기와 뿌리 끝에서 발견되는 옥신이라는 호르몬 무리에 의해 조절된다.</div><div class=\"rst\">식물이 자라는 걸 조절하는 건 옥신이라는 호르몬이에요. 지문은 이게 줄기 끝과 뿌리 끝에 있다고 해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Auxins produced at the tips of stems</div><div class=\"k\">줄기 끝에서 만들어진 옥신은</div></div><div class=\"rc\"><div class=\"e\">tend to accumulate</div><div class=\"k\">쌓이는 경향이 있다</div></div><div class=\"rc\"><div class=\"e\">on the side of the stem</div><div class=\"k\">줄기의 쪽에</div></div><div class=\"rc\"><div class=\"e\">that is in the shade.</div><div class=\"k\">그늘에 있는 (= 줄기의 쪽)</div></div><div class=\"rnat\">줄기 끝에서 만들어진 옥신은 그늘진 쪽 줄기에 쌓이는 경향이 있다.</div><div class=\"rst\">창가 화분을 떠올려 보세요. 줄기 끝의 옥신은 햇빛 반대편, <b>그늘진 쪽</b>에 모여요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Accordingly,</div><div class=\"k\">그에 따라,</div></div><div class=\"rc\"><div class=\"e\">the auxins stimulate growth</div><div class=\"k\">옥신은 성장을 촉진한다</div></div><div class=\"rc\"><div class=\"e\">on the shaded side of the plant.</div><div class=\"k\">식물의 그늘진 쪽에서.</div></div><div class=\"rnat\">그에 따라 옥신은 식물의 그늘진 쪽 성장을 촉진한다.</div><div class=\"rst\">그래서 옥신이 그늘 쪽 성장을 <b>촉진해요</b>(stimulate 촉진하다). 줄기에서 옥신은 '자라라' 신호예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Therefore,</div><div class=\"k\">그러므로,</div></div><div class=\"rc\"><div class=\"e\">the shaded side grows faster</div><div class=\"k\">그늘진 쪽이 더 빨리 자란다</div></div><div class=\"rc\"><div class=\"e\">than the side facing the sunlight.</div><div class=\"k\">햇빛을 마주한 쪽보다.</div></div><div class=\"rnat\">그래서 그늘진 쪽이 햇빛을 마주한 쪽보다 더 빨리 자란다.</div><div class=\"rst\">그 결과 그늘 쪽이 햇빛 쪽보다 <b>더 빨리</b> 자라요. 화분 한쪽만 키가 크는 셈이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">This phenomenon causes the stem to bend</div><div class=\"k\">이 현상은 (= 그늘 쪽이 더 빨리 자라는 것) 줄기가 휘게 만든다</div></div><div class=\"rc\"><div class=\"e\">and appear to be growing</div><div class=\"k\">그리고 자라고 있는 것처럼 보이게</div></div><div class=\"rc\"><div class=\"e\">towards the light.</div><div class=\"k\">빛을 향해.</div></div><div class=\"rnat\">이 현상 때문에 줄기가 휘어져 빛을 향해 자라는 것처럼 보인다.</div><div class=\"rst\">그래서 줄기가 휘어 <b>빛을 향해</b>(towards the light) 자라는 것처럼 보여요. 창가 쪽으로 기우는 화분이 이거예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc ckc\"><div class=\"e\">Auxins have the <span class=\"cw\">opposite effect</span></div><div class=\"k\">옥신은 <span class=\"cw\">정반대의 효과</span>를 가진다</div></div><div class=\"rc\"><div class=\"e\">on the roots of plants.</div><div class=\"k\">식물의 뿌리에는.</div></div><div class=\"rnat\">옥신은 뿌리에는 반대 효과를 낸다.</div><div class=\"rst\"><b>그런데 뿌리에서는 정반대</b>(opposite 반대의)예요. 여기서 글의 방향이 뒤집혀요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">Auxins in the tips of roots</div><div class=\"k\">뿌리 끝의 옥신은</div></div><div class=\"rc ckc\"><div class=\"e\">tend to <span class=\"cw\">limit growth</span>.</div><div class=\"k\"><span class=\"cw\">성장을 제한하는</span> 경향이 있다.</div></div><div class=\"rnat\">뿌리 끝의 옥신은 성장을 억제하는 경향이 있다.</div><div class=\"rst\">화분 흙 속 뿌리 끝의 옥신은 성장을 <b>막아요</b>(limit 제한하다). 줄기와 반대로 '천천히' 신호예요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc\"><div class=\"e\">If a root is horizontal in the soil,</div><div class=\"k\">만약 뿌리가 흙 속에서 수평이라면,</div></div><div class=\"rc\"><div class=\"e\">the auxins will accumulate</div><div class=\"k\">옥신은 쌓일 것이다</div></div><div class=\"rc\"><div class=\"e\">on the lower side</div><div class=\"k\">아래쪽에</div></div><div class=\"rc ckc\"><div class=\"e\">and <span class=\"cw\">interfere with</span> its development.</div><div class=\"k\">그리고 그것의 (= 뿌리의) 발달을 <span class=\"cw\">방해할</span> 것이다.</div></div><div class=\"rnat\">뿌리가 흙 속에서 수평으로 놓이면 옥신은 아래쪽에 쌓여 그 발달을 방해한다.</div><div class=\"rst\">뿌리가 흙 속에 옆으로 누우면 옥신이 <b>아래쪽</b>에 쌓여 그쪽 성장을 <b>방해해요</b>(interfere with 방해하다).</div></div><div class=\"rds key\" data-ord=\"9\"><span class=\"rn\">9번 · 단서</span><div class=\"rc\"><div class=\"e\">Therefore,</div><div class=\"k\">그러므로,</div></div><div class=\"rc\"><div class=\"e\">the lower side of the root</div><div class=\"k\">뿌리의 아래쪽은</div></div><div class=\"rc ckc\"><div class=\"e\">will grow <span class=\"cw\">slower</span></div><div class=\"k\"><span class=\"cw\">더 느리게 자랄 것이다</span> (※ 문제지 ④번 자리 — 문제지에는 faster로 되어 있으나 slower가 맞는 표현)</div></div><div class=\"rc\"><div class=\"e\">than the upper side.</div><div class=\"k\">위쪽보다.</div></div><div class=\"rnat\">그러므로 뿌리의 아래쪽은 위쪽보다 더 느리게(slower) 자란다.</div><div class=\"rst\">방해받은 아래쪽은 위쪽보다 <b>더 느리게</b>(slower) 자라요. 그래서 문제지의 faster(더 빨리)는 틀린 말이에요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">This will, in turn,</div><div class=\"k\">이것은 (= 뿌리 아래쪽이 위쪽보다 느리게 자라는 것) 결과적으로,</div></div><div class=\"rc ckc\"><div class=\"e\">cause the root to <span class=\"cw\">bend downwards</span>,</div><div class=\"k\">뿌리가 <span class=\"cw\">아래쪽으로 휘게</span> 만들 것이다,</div></div><div class=\"rc\"><div class=\"e\">with the tip of the root growing</div><div class=\"k\">뿌리 끝이 자라면서</div></div><div class=\"rc\"><div class=\"e\">in that direction.</div><div class=\"k\">그 방향으로 (= 아래쪽)</div></div><div class=\"rnat\">이것이 결과적으로 뿌리를 아래쪽으로 휘게 만들고, 뿌리 끝은 그 방향으로 자란다.</div><div class=\"rst\">위쪽이 더 자라니 뿌리는 <b>아래로 휘어요</b>(downwards 아래쪽으로). 화분 뿌리가 흙 속으로 파고드는 이유예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"accumulate\" data-m=\"축적되다, 쌓이다\"><b>accumulate</b>축적되다, 쌓이다</button><button type=\"button\" class=\"wdb\" data-w=\"shade\" data-m=\"그늘\"><b>shade</b>그늘</button><button type=\"button\" class=\"wdb\" data-w=\"stimulate\" data-m=\"촉진하다, 자극하다\"><b>stimulate</b>촉진하다, 자극하다</button><button type=\"button\" class=\"wdb\" data-w=\"phenomenon\" data-m=\"현상\"><b>phenomenon</b>현상</button><button type=\"button\" class=\"wdb\" data-w=\"horizontal\" data-m=\"수평의\"><b>horizontal</b>수평의</button><button type=\"button\" class=\"wdb\" data-w=\"interfere with\" data-m=\"~을 방해하다\"><b>interfere with</b>~을 방해하다</button></div>"};
document.addEventListener('click',function(e){
 var b=e.target.closest('.stbtn');
 if(b){var box=b.closest('.rdb'),on=!box.classList.contains('story');box.classList.toggle('story',on);
  var L=[].slice.call(box.querySelectorAll('.rds'));L.forEach(function(x){x.classList.remove('lastv');x.style.order='';});
  if(on){L.sort(function(a,c){return (+a.dataset.ord)-(+c.dataset.ord);});L.forEach(function(x,i){x.style.order=i+1;});L[L.length-1].classList.add('lastv');}
  b.textContent=on?'문장별로 보기':'이야기로 이어 읽기';return;}
 var w=e.target.closest('.wdb');
 if(w){var on2=!w.classList.contains('on');w.classList.toggle('on',on2);
  try{if(window.WN){if(on2)WN.add([{w:w.dataset.w,m:w.dataset.m,src:'미니모고',how:'별표',ask:true}]);else if(WN.del)WN.del(w.dataset.w,'미니모고');}}catch(err){}
  var t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s';document.body.appendChild(t);}
  t.textContent=on2?'오답노트장에 담았어요':'오답노트장에서 뺐어요';t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(function(){t.style.opacity='0'},1600);}
});

/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  if(EXP[cq.q]){h+=EXP[cq.q]+'<button class="toq" data-i="'+i+'">빠른 정답으로</button>';return h+'</div></details>';}
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
  mmInit();
}
/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
