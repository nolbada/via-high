<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:0}
#app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
#app>.wrap{width:100%}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}

.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}

.bar{position:sticky;margin-top:auto;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}

.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}

.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}

.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}

.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}

details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}

.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}

/* ---- 새 직독직해·해설 화면 ---- */

.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}

 ~ 앞", "g": "(3)과 (4) 사이 · 현대 인지 과학은 ~ 앞", "ok": false, "e": ["② 앞의 (3)은 분석 철학이 언어를 기본이라고 가정한다는 내용이다", "'언어는 근본적이지 않다'는 내용은 (4)~(6)에 나오는데 ②보다 뒤에 있다", "그래서 Nevertheless로 시작하는 (1)이 올 자리가 아니다."]}, {"n": "③", "t": "Countless species ~ 앞", "g": "(4)와 (5) 사이 · 수많은 종의 동물들이 ~ 앞", "ok": false, "e": ["(4)~(6)은 모두 언어가 근본적이지 않다는 내용이다", "③에 (1)을 넣으면 (4)와 (5) 사이에 (1)이 끼어들어 이 흐름이 끊긴다."]}, {"n": "④", "t": "There is no reason ~ 앞", "g": "(5)와 (6) 사이 · 가정할 이유는 없다 ~ 앞", "ok": false, "e": ["(1)은 언어가 인간의 삶에 중요하고 서로 협력하는 우리의 능력에 크게 기여한다는 내용이다", "④에 두면 바로 뒤에 (6)이 이어진다", "(6)은 언어가 정신 작용의 기본이라고 가정할 이유가 없다는 내용이라 (1)과 자연스럽게 이어지지 못한다."]}, {"n": "⑤", "t": "Our species homo sapiens ~ 앞", "g": "(6)과 (7) 사이 · 우리 종족 호모 사피엔스는 ~ 앞", "ok": true, "e": ["(6)이 '언어가 정신 작용의 기본이라고 가정할 이유가 없다'고 말한 다음, (1)이 '그럼에도 불구하고 언어는 매우 중요하다'고 받는다", "뒤의 (7)은 호모 사피엔스의 성공이 언어에 의존했다는 내용이라 (1)과 이어진다."]}], "tr": ["[주어진 문장] 그럼에도 불구하고, 언어는 인간의 삶에서 매우 중요하며 세계를 다루는 데 있어서 서로 협력하는 우리의 능력에 상당히 기여한다.", "우리는 사고를 이해하기 위해 언어를 사용해야 하는가 아니면 언어를 이해하기 위해 사고를 사용해야 하는가?", "분석 철학은 언어가 기본이고 적절한 언어 사용이 제대로 인식된다면 그 사고가 이치에 맞을 것이라고 역사적으로 가정한다.", "그러나 현대 인지 과학은 언어가 인간에게 매우 중요한 사고의 한 측면일 뿐 모든 종류의 사고에 근본적이지는 않다고 당연히 판단한다.", "수많은 종의 동물들이 인간의 사고 속에 대체로 보존된 두뇌의 메커니즘을 통해 언어를 사용하지 않고 세계를 항해하고, 문제를 해결하고, 학습해낸다.", "언어가 정신 작용의 기본이라고 가정할 이유는 없다.", "우리 종족, ‘호모 사피엔스’는 놀랄 만큼 성공을 거두어 왔는데, 이것은 처음에는 협력적인 문제 해결에 효과적인 기여 요소로서, 그리고 훨씬 나중에는 글로 쓰인 기록을 통한 집단 기억으로서의 언어에 부분적으로 의존했다."], "ps": [{"n": 1, "ch": [{"e": "<b>Nevertheless<\/b>,", "k": "<b>그럼에도 불구하고<\/b>,"}, {"e": "language is <b>enormously important<\/b> in human life", "k": "언어는 인간의 삶에서 <b>매우 중요하며<\/b>"}, {"e": "and <b>contributes largely<\/b> to our ability", "k": "우리의 능력에 <b>상당히 기여한다<\/b>"}, {"e": "to cooperate with each other", "k": "서로 협력하는"}, {"e": "in <b>dealing with<\/b> the world.", "k": "세계를 <b>다루는<\/b> 데 있어서."}], "easy": "그래도 언어는 인간의 삶에서 아주 중요하고, 세계를 다룰 때 서로 협력하는 우리의 능력에 크게 기여한다는 말이에요.", "gist": "[주어진 문장] Nevertheless로 시작하므로, 앞에서 '언어는 근본적이지 않다'는 내용이 나온 뒤에 이어져야 한다."}, {"n": 2, "ch": [{"e": "Should we use language to understand mind", "k": "우리는 사고를 이해하기 위해 언어를 사용해야 하는가"}, {"e": "or mind to understand language?", "k": "아니면 언어를 이해하기 위해 사고를 사용해야 하는가?"}], "easy": "언어로 사고를 이해해야 하는지, 사고로 언어를 이해해야 하는지 묻는 질문이에요.", "gist": "글의 첫 질문 — 언어와 사고의 관계를 묻는 것으로 글을 연다."}, {"n": 3, "ch": [{"e": "<b>Analytic philosophy<\/b> historically <b>assumes<\/b>", "k": "<b>분석 철학<\/b>은 역사적으로 <b>가정한다<\/b>"}, {"e": "that language is basic", "k": "언어가 기본이고"}, {"e": "and that mind would <b>make sense<\/b>", "k": "그 사고가 <b>이치에 맞을<\/b> 것이라고"}, {"e": "if proper use of language was <b>appreciated<\/b>.", "k": "적절한 언어 사용이 제대로 <b>인식된다면<\/b>."}], "easy": "분석 철학은 예전부터 언어가 기본이고, 언어를 제대로 쓰면 사고도 이치에 맞을 것이라고 보았어요.", "gist": "한 가지 입장 — 분석 철학은 언어가 기본이라고 본다."}, {"n": 4, "ch": [{"e": "Modern cognitive science, <b>however<\/b>,", "k": "<b>그러나<\/b> 현대 인지 과학은,"}, {"e": "<b>rightly judges<\/b> that language is just one aspect of mind", "k": "언어가 사고의 한 측면일 뿐이라고 <b>당연히 판단한다<\/b>"}, {"e": "of great importance in human beings", "k": "인간에게 매우 중요한"}, {"e": "but <b>not fundamental<\/b> to all kinds of thinking.", "k": "하지만 모든 종류의 사고에 <b>근본적이지는 않다<\/b>고."}], "easy": "하지만 현대 인지 과학은, 언어가 인간에게 아주 중요한 사고의 한 부분일 뿐 모든 사고의 바탕은 아니라고 봐요.", "gist": "반대 입장 — however로 방향이 바뀌며, 언어는 사고의 한 측면일 뿐 근본적이지 않다고 말한다."}, {"n": 5, "ch": [{"e": "<b>Countless<\/b> species of animals", "k": "<b>수많은<\/b> 종의 동물들이"}, {"e": "manage to <b>navigate<\/b> the world, solve problems, and learn", "k": "세계를 <b>항해하고<\/b>, 문제를 해결하고, 학습<b>해낸다<\/b>"}, {"e": "without using language,", "k": "언어를 사용하지 않고,"}, {"e": "through brain <b>mechanisms<\/b>", "k": "두뇌의 <b>메커니즘<\/b>을 통해"}, {"e": "that are <b>largely preserved<\/b> in the minds of humans.", "k": "인간의 사고 속에 <b>대체로 보존된<\/b>."}], "easy": "수많은 동물이 언어 없이도 세상을 헤쳐 나가고, 문제를 풀고, 배워요. 그 바탕이 되는 두뇌 장치는 인간의 사고 속에도 대체로 남아 있어요.", "gist": "(4)에 이어지는 내용 — 동물은 언어 없이도 문제를 풀고 학습한다."}, {"n": 6, "ch": [{"e": "<b>There is no reason<\/b> to assume", "k": "가정할 <b>이유는 없다<\/b>"}, {"e": "that language is <b>fundamental<\/b> to mental operations." y make (make 하다, 내리다. may 할 수도 있다)", "O: some foolish spending choices (몇 가지 어리석은 소비 선택)", "뼈대 = <b>You may make some foolish spending choices</b>"]}, {"t": "<b>but if you do</b>는 부사절(조건)이다. 여기서 <b>do는 대동사</b>이다.", "sub": ["you do = you make foolish spending choices (어리석은 소비 선택을 한다면)"]}, {"t": "두 번째 절은 S+V+C(2형식)이다.", "sub": ["S: the decision (그 결정). to do so는 decision을 꾸미는 to부정사 (do so = 그렇게 하다)", "V: is, C: your own (네 것. your own = your own decision)"]}, {"t": "세 번째 절은 <b>and hopefully you will learn from your mistakes</b>이다. S+V(1형식)이다. hopefully(바라건대)는 문장 전체를 꾸미고, from your mistakes(네 실수에서)는 learn을 꾸민다. (mistake 실수)"}], "sum": "어리석은 소비를 할 수 있으나 그 결정은 본인 것이며 실수에서 배우면 됨"}, {"i": "05", "q": "04", "s": "4", "title": "명령문 + explain to A that절 + 관계절 생략", "eng": "Explain to your parents / that money is something you will have to deal with<sup>1</sup> / for the rest of<sup>2</sup> your life.", "notes": [["1", "deal with", "~을 다루다"], ["2", "for the rest of", "~의 남은 기간 동안"]], "lit": "너의 부모님께 설명해라 / 돈은 네가 다루어야만 할 어떤 것이라고 / 네 남은 인생 동안", "nat": "돈은 평생 다뤄야 하는 것이라고 부모님께 설명해 드려라.", "ana": "<b>explain</b>은 사람을 바로 목적어로 쓰지 않고 <b>explain to + 사람 + that절</b> 형태를 쓴다. 그래서 to your parents가 먼저 나오고 진짜 목적어인 that절이 뒤에 붙는다. that절 안의 <b>something (that) you will have to deal with</b>는 목적격 관계대명사가 생략된 구조로, deal with의 목적어가 something이다.", "pe": "Explain \u0001to your parents\u0002 / that money is something \u0001you will have to deal with<sup>1</sup>\u0002 / \u0001for the rest of<sup>2</sup> your life\u0002.", "pk": "\u0001너의 부모님께\u0002 설명해라 / 돈은 \u0001네가 다루어야만 할\u0002 어떤 것이라고 / \u0001네 남은 인생 동안\u0002", "core": "돈이 네가 평생 다루어야 할 것이라고 설명해라.", "tags": ["명령문 Explain, 목적어 that절. (to your parents) = 전치사구(부사구): Explain 꾸밈, 거의 필수에 가까운 부사구 [기준: 모양 규칙]", "목적어 that절(명사절). 주어 money, 동사 is, 보어 something. (you will have to deal with) = 관계절(형용사절, that 생략): something 꾸밈", "(for the rest of your life) = 전치사구(부사구): have to deal with 꾸밈. that절 안쪽 수식어"], "steps": [{"t": "이 문장은 <b>명령문 + that절 목적어</b>이다. 안쪽 that절에 생략된 관계절이 있어 길어 보인다."}, {"t": "뼈대부터 찾는다. 명령문이라 주어(You)는 생략되어 있다.", "sub": ["V: Explain (explain 설명하다)", "O: that절 (돈이 무엇이라는 내용)", "뼈대 = <b>Explain that money is something ~</b>", "to your parents = 부모님께 (explain to A 구조의 전치사구)"]}, {"t": "that절의 뼈대는 S+V+C(2형식)이다.", "sub": ["S: money (돈)", "V: is (be동사)", "C: something (어떤 것)", "that절 뼈대 = <b>money is something</b>"]}, {"t": "<b>you will have to deal with</b>는 something을 꾸미는 관계절이다. 목적격 관계대명사 that이 생략되어 있다.", "sub": ["something (that) you will have to deal with = 네가 다루어야만 할 것", "will have to V = V해야 할 것이다 (한 덩어리). deal with 다루다"]}, {"t": "끝의 <b>for the rest of your life</b>는 전치사구(부사구)이다. '네 남은 인생 동안'이라는 뜻이다. (rest 나머지)"}], "sum": "돈은 평생 다뤄야 할 것이라고 부모님께 설명하기"}, {"i": "06", "q": "05", "s": "3", "title": "S+V+O(that절 병렬) + if 조건절 + 수동태", "eng": "Analytic<sup>1</sup> philosophy historically assumes<sup>2</sup> / that language is basic / and that mind would make sense<sup>3</sup> / if proper use of language was appreciated<sup>4</sup>.", "notes": [["1", "analytic", "분석의"], ["2", "assume", "가정하다"], ["3", "make sense", "이치에 맞다"], ["4", "appreciate", "(제대로) 인식하다"]], "lit": "분석 철학은 역사적으로 가정한다 / 언어가 기본이라고 / 그리고 정신이 이치에 맞을 것이라고 / 만약 언어의 적절한 사용이 제대로 인식된다면", "nat": "분석 철학은 역사적으로 언어가 기본이며, 언어를 제대로 쓰는 법이 제대로 인식되기만 하면 정신도 이해될 것이라고 가정해 왔다.", "ana": "동사 <b>assumes</b> 뒤에 <b>that절이 두 개</b> 나란히 붙어 있는 병렬이다. 두 번째 that을 빠뜨리고 읽으면 뒷부분이 앞 that절 안에 들어간 것처럼 보여 뜻이 어긋난다. 마지막 <b>if</b>절은 두 번째 that절에만 걸리는 조건절이고, would가 쓰인 이유도 이 조건 때문이다.", "pe": "\u0001Analytic<sup>1</sup>\u0002 philosophy \u0001historically\u0002 assumes<sup>2</sup> / that language is basic / and that mind would make sense<sup>3</sup> / \u0001if proper use of language was appreciated<sup>4</sup>\u0002.", "pk": "\u0001분석\u0002 철학은 \u0001역사적으로\u0002 가정한다 / 언어가 기본이라고 / 그리고 정신이 이치에 맞을 것이라고 / \u0001만약 언어의 적절한 사용이 제대로 인식된다면\u0002", "core": "철학은 언어가 기본이며 정신이 이치에 맞을 것이라고 가정한다.", "tags": ["주어 philosophy, 동사 assumes. (Analytic) = 형용사: philosophy 꾸밈. (historically) = 부사: assumes 꾸밈", "목적어 that절 ①(명사절): language is basic", "목적어 that절 ②(명사절): and로 ①과 병렬. 주어 mind, 동사 would make sense", "(if절) = 부사절(조건): would make sense를 꾸밈. ②번 that절 안쪽 수식어"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이다. 목적어가 that절 두 개로 이어져 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: Analytic philosophy (분석 철학)", "V: assumes (assume 가정하다)", "O: that절 두 개 (that language is basic / that mind would make sense ~)", "뼈대 = <b>Analytic philosophy assumes that ~ and that ~</b>"]}, {"t": "historically는 assumes를 꾸미는 부사이다. (역사적으로)"}, {"t": "첫 번째 that절은 S+V+C(2형식)이다.", "sub": ["language is basic = 언어가 기본이다 (language 언어, basic 기본적인)"]}, {"t": "두 번째 that절은 <b>mind would make sense</b>이다. S+V(1형식)이다. 뒤에 if절이 붙는다.", "sub": ["make sense = 이치에 맞다, 이해되다 (mind 정신)", "<b>if proper use of language was appreciated</b> = 언어의 적절한 사용이 제대로 인식된다면 (조건절, 수동태. appreciate 제대로 인식하다, proper 적절한)", "would와 짝인 if절이라 가정법 과거 모양이다. 원칙은 were지만 was도 쓴다."]}, {"t": "함정: and 뒤의 that을 새 문장으로 읽지 않는다. assumes에 이어진 두 번째 목적어이다."}], "sum": "분석 철학, 언어가 기본이고 언어 사용을 제대로 알면 정신도 이해된다고 가정"}, {"i": "07", "q": "05", "s": "5", "title": "S+V+O(to부정사 병렬) + 전치사구 + 관계절", "eng": "Countless<sup>1</sup> species<sup>2</sup> of animals manage to navigate<sup>3</sup> the world, solve problems, and learn / without using language, / through brain mechanisms<sup>4</sup> that are largely preserved<sup>5</sup> in the minds of humans.", "notes": [["1", "countless", "수많은"], ["2", "species", "종"], ["3", "navigate", "헤쳐 나가다, 길을 찾다"], ["4", "mechanism", "메커니즘"], ["5", "preserve", "보존하다"]], "lit": "수많은 종의 동물이 세상을 헤쳐 나가고, 문제를 해결하고, 학습해낸다 / 언어를 사용하지 않고 / 인간의 정신 속에 대체로 보존되어 있는 뇌 메커니즘을 통해", "nat": "수많은 동물 종이 언어 없이도, 인간의 정신에도 거의 그대로 남아 있는 뇌 메커니즘을 통해 세상을 헤쳐 나가고 문제를 풀고 학습해낸다.", "ana": "<b>manage to</b> 뒤에 동사원형 <b>navigate · solve · learn</b> 세 개가 병렬로 걸려 있다. to는 맨 앞에 한 번만 나오므로 solve와 learn을 다른 문장의 동사로 착각하면 안 된다. 마지막의 <b>that</b>은 brain mechanisms를 받는 주격 관계대명사이고, 그 안의 동사가 are preserved인 수동태이다.", "pe": "\u0001Countless<sup>1</sup>\u0002 species<sup>2</sup> \u0001of animals\u0002 manage to navigate<sup>3</sup> the world, solve problems, and learn / \u0001without using language\u0002, / \u0001through brain mechanisms<sup>4</sup> that are largely preserved<sup>5</sup> in the minds of humans\u0002.", "pk": "\u0001수많은\u0002 종의 동물이 세상을 헤쳐 나가고, 문제를 해결하고, 학습해낸다 / \u0001언어를 사용하지 않고\u0002 / \u0001인간의 정신 속에 대체로 보존되어 있는 뇌 메커니즘을 통해\u0002", "core": "종이 세상을 헤쳐 나가고 문제를 해결하고 학습해낸다.", "tags": ["<b>3형식</b> 주어 species + 동사 manage + 목적어 to navigate / solve / learn(to부정사 3개 병렬). Countless = 형용사: species 꾸밈. of animals = 전치사구(형용사구): species 꾸밈", "without using language = 전치사구(부사구): manage를 꾸밈", "through ~ = 전치사구(부사구, 수단): manage를 꾸밈. that are largely preserved ~는 mechanisms를 꾸미는 관계절"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이다. 목적어 to부정사가 세 개 병렬이고 뒤에 전치사구가 이어져 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: Countless species of animals (수많은 동물 종)", "V: manage (manage 해내다)", "O: to navigate the world, (to) solve problems, and (to) learn (세상을 헤쳐 나가고, 문제를 풀고, 학습하는 것)", "뼈대 = <b>Countless species of animals manage to navigate, solve, and learn</b>"]}, {"t": "세 to부정사의 뜻은 다음과 같다. navigate는 '헤쳐 나가다, 길을 찾다', solve는 '해결하다', learn은 '배우다'이다. (species 종)"}, {"t": "<b>without using language</b>는 전치사 without+동명사 using이다. manage를 꾸미는 부사구이다. '언어를 사용하지 않고'라는 뜻이다."}, {"t": "<b>through brain mechanisms that are largely preserved in the minds of humans</b>는 수단을 나타내는 전치사구(부사구)이다. 안의 that절은 mechanisms를 꾸미는 관계절이다.", "sub": ["brain mechanisms = 뇌 메커니즘", "are largely preserved = 대체로 보존되어 있다 (preserve 보존하다의 수동태)", "in the minds of humans = 인간의 정신 속에"]}], "sum": "수많은 동물 종, 언어 없이도 인간과 공통된 뇌 메커니즘으로 세상 탐색·문제 해결·학습"}, {"i": "08", "q": "06", "s": "4", "title": "S+V+C(2형식) + but if절 + S+V+O(3형식) + 병렬 because절", "eng": "For example, reading more is a good habit<sup>1</sup>, / but if you're only doing it / because you feel like that's what you're supposed to<sup>2</sup> do, / not because you actually want to learn more, / you're going to have a hard time<sup>3</sup> reaching the goal.", "notes": [["1", "habit", "습관"], ["2", "be supposed to", "~해야 한다"], ["3", "have a hard time", "어려움을 겪다"]], "lit": "예를 들어, 더 많이 읽는 것은 좋은 습관이다 / 하지만 만약 네가 그것을 단지 하고 있는 것이라면 / 그것이 네가 해야 하는 일이라고 느끼기 때문에 / 네가 실제로 더 배우고 싶기 때문이 아니라 / 너는 그 목표에 도달하는 데 어려움을 겪을 것이다", "nat": "예를 들어 책을 더 읽는 건 좋은 습관이지만, 정말로 더 배우고 싶어서가 아니라 그냥 해야 할 일 같아서 읽는 것이라면 그 목표에 도달하기 어려울 것이다.", "ana": "<b>because A, not because B</b> 구조인데 한국어와 순서가 반대다. 영어는 '~때문에, ~때문이 아니라'로 붙였지만 우리말로는 '~때문이 아니라 ~때문에'로 뒤집어 읽어야 자연스럽다. 문장 맨 앞의 <b>reading more</b>는 동명사 주어라 단수 취급해 is를 쓴다. 마지막의 <b>have a hard time v-ing</b>는 '~하는 데 어려움을 겪다'라는 관용 표현으로 뒤에 반드시 동명사가 온다.", "pe": "\u0001For example\u0002, reading more is a \u0001good\u0002 habit<sup>1</sup>, / but \u0001if you're only doing it\u0002 / \u0001because you feel like that's what you're supposed to<sup>2</sup> do\u0002, / \u0001not because you actually want to learn more\u0002, / you're going to have a hard time<sup>3</sup> \u0001reaching the goal\u0002.", "pk": "\u0001예를 들어\u0002, 더 많이 읽는 것은 \u0001좋은\u0002 습관이다 / 하지만 \u0001만약 네가 그것을 단지 하고 있는 것이라면\u0002 / \u0001그것이 네가 해야 하는 일이라고 느끼기 때문에\u0002 / \u0001네가 실제로 더 배우고 싶기 때문이 아니라\u0002 / 너는 \u0001그 목표에 도달하는 데\u0002 어려움을 겪을 것이다", "core": "더 많이 읽는 것은 습관이지만, 너는 어려움을 겪을 것이다.", "tags": ["For example = 부사구(삽입): 문장 전체를 꾸밈. <b>2형식</b> 주어 reading more + 동사 is + 보어 a habit. good = 형용사: habit 꾸밈", "but if ~ = 접속사절(부사절, 조건): 주절을 꾸밈. 동사는 are only doing", "because ~ = 접속사절(부사절, 이유): if절 안쪽, doing을 꾸밈", "not because ~ = 부정 대비 접속사절(부사절): 앞 because절과 대비됨", "<b>3형식</b> 주어 you + 동사 're going to have + 목적어 a hard time. reaching ~ = 분사구(have a hard time v-ing 관용): have a hard time 꾸밈"], "steps": [{"t": "이 문장은 <b>두 절이 but으로 이어진 문장</b>이다. 두 번째 절 앞의 if절 안에 because절이 두 개 겹쳐서 길어 보인다."}, {"t": "첫 번째 절의 뼈대부터 찾는다.", "sub": ["S: reading more (더 많이 읽는 것. 동명사구)", "V: is (be동사)", "C: a good habit (좋은 습관)", "뼈대 = <b>reading more is a good habit</b>"]}, {"t": "두 번째 절의 진짜 뼈대는 맨 끝에 있다.", "sub": ["S: you (너)", "V: 're going to have (have 겪다. be going to = ~할 것이다)", "O: a hard time (힘든 시간)", "have a hard time -ing = ~하는 데 어려움을 겪다. reaching the goal = 목표에 도달하는 것", "뼈대 = <b>you're going to have a hard time reaching the goal</b>"]}, {"t": "그 앞 <b>but if you're only doing it ~</b>는 if절이다. 부사절(조건)이다. it은 reading(읽기)을 가리킨다.", "sub": ["you're only doing it = 너는 그저 그것(독서)을 하고 있다", "only 단지"]}, {"t": "<b>because you feel like that's what you're supposed to do</b>는 이유를 말하는 because절이다.", "sub": ["feel like ~ = ~라는 기분이 들다", "that's what you're supposed to do = 그것이 네가 해야 하는 일이다 (what절 명사절. be supposed to V = V해야 한다)"]}, {"t": "<b>not because you actually want to learn more</b>는 앞 because절과 대비되는 절이다. '실제로 더 배우고 싶어서가 아니라'라는 뜻이다. (actually 실제로)"}], "sum": "독서는 좋은 습관이나, 배우고 싶어서가 아니라 의무감으로 하면 목표 달성이 어려움"}], "qs": [{"q": "01", "type": "필자 주장", "src": "2015년 11월 20번", "ans": "⑤", "tr": [["1", "오늘날 생활 방식의 빠른 속도는 우리가 한 가지 일 위에 또 다른 일을 쌓아 올리게 만든다."], ["2", "하지만 다중 작업이 시간을 조금도 절약해 주지 않는다는 것을 알아야 한다."], ["3", "아주 흔히, 일반적인 통념과는 반대로 다중 작업은 오히려 당신의 속도를 늦출 뿐이다."], ["4", "그것이 무엇이든 상관없이, 지금 이 순간 하고 있는 일에 온전히 집중을 쏟아라."], ["5", "빨래를 하는 동안에는 그냥 빨래만 하라. 세탁기에 물이 차오르는 소리를 듣고, 손에 잡히는 옷감의 감촉을 느껴라."], ["6", "전화기를 귀에 붙이고 할 때보다 시간이 조금이라도 더 드는 것도 아니다."], ["7", "똑같은 것이 당신의 일에도 적용된다."], ["8", "한 번에 한 가지 일에만 집중하라. 그러면 각각의 일을 더 잘, 그리고 아마 더 빨리 해낼 것이다."]], "evh": "8번 문장", "ev": [{"en": true, "h": "Focus on one task at a time, and you'll accomplish each task better, and probably faster."}, {"en": false, "h": "주장 문항의 답은 거의 언제나 <b>명령문</b>에 있다. 이 글에는 명령문이 여러 번 나오는데(Give your whole focus ~, just do the laundry, Focus on one task ~), 전부 '한 번에 하나만'이라는 같은 말을 하고 있다. 특히 마지막 문장의 <b>one task at a time</b>이 글 전체를 한 줄로 압축한 표현이다."}], "opts": [{"n": "①", "t": "업무 중에는 휴대전화 사용을 자제하라.", "a": false, "x": true, "trap": false, "e": "phone은 '전화하면서 빨래해도 시간은 똑같다'는 비유로 한 번 나올 뿐, 휴대전화 사용을 자제하라는 말은 없다."}, {"n": "②", "t": "틈틈이 비는 시간을 생산적으로 활용하라.", "a": false, "x": true, "trap": false, "e": "틈새 시간(spare time)을 활용하라는 내용은 글에 전혀 없다. 오히려 여러 일을 겹쳐 하지 말라는 반대 방향이다."}, {"n": "③", "t": "직장일로 인해 집안일을 소홀히 하지 마라.", "a": false, "x": true, "trap": true, "e": "laundry(빨래)와 work(일)가 둘 다 나오지만, 둘의 우선순위를 따지는 글이 아니라 '무엇을 하든 하나씩 하라'는 글이다."}, {"n": "④", "t": "자신이 하는 일에 대해 확고한 신념을 지녀라.", "a": false, "x": true, "trap": false, "e": "신념(conviction)이나 확신에 관한 언급이 없다. focus는 '신념'이 아니라 '집중'이다."}, {"n": "⑤", "t": "무슨 일이든 한 번에 한 가지 일에만 집중하라.", "a": true, "x": false, "trap": false, "e": "Give your whole focus to what you're doing at the moment와 Focus on one task at a time이 그대로 겹치는 유일한 선택지이다."}], "w": [["pace", "속도"], ["pile", "쌓아두다"], ["multitasking", "다중 작업"], ["contrary to", "~와는 반대로"], ["popular belief", "일반적인 통념"], ["take up", "(시간을) 차지하다"], ["apply to", "~에 적용되다"], ["at a time", "한 번에"], ["accomplish", "해내다, 성취하다"]]}, {"q": "02", "type": "도표 불일치", "src": "2020학년도 수능 25번", "ans": "④", "tr": [["1", "위 도표는 1997년과 2017년의 세계 인구 전기 이용 기회를 보여 준다."], ["2", "① 2017년에 전기를 이용할 수 있었던 전 세계 인구 비율은 1997년의 그것보다 11퍼센트포인트 높았다."], ["3", "② 1997년과 2017년 두 해 모두, 시골 인구의 80퍼센트 미만이 전기를 이용할 수 있었던 반면 도시 인구는 90퍼센트가 넘게 전기를 이용할 수 있었다."], ["4", "③ 1997년에는 시골 인구의 36퍼센트가 전기를 이용할 수 없었던 반면, 도시 인구는 5퍼센트가 전기를 이용할 수 없었다."], ["5", "④ 2017년에 전기를 이용할 수 없었던 시골 인구의 비율은 1997년의 그것보다 20퍼센트포인트 낮았다."], ["6", "⑤ 전기를 이용할 수 없었던 도시 인구의 비율은 1997년 5퍼센트에서 2017년 3퍼센트로 감소하였다."]], "evh": "5번 문장", "ev": [{"en": true, "h": "The percentage of the rural population without electricity access in 2017 was 20 percentage points lower than that in 1997."}, {"en": false, "h": "도표에서 전기를 <b>이용할 수 없었던</b> 시골 인구는 1997년 36%, 2017년 21%이다. 36 − 21 = <b>15퍼센트포인트</b>이므로 20퍼센트포인트라는 진술은 틀렸다. 도표 문항에서 <b>percentage points 차이</b>가 나오면 반드시 두 수치를 직접 빼서 확인해야 한다."}], "opts": [{"n": "①", "t": "2017년 전체 인구의 전기 이용 비율이 1997년보다 11퍼센트포인트 높았다.", "a": false, "x": true, "trap": false, "e": "total 막대에서 1997년 78%, 2017년 89%이므로 차이가 정확히 11퍼센트포인트이다."}, {"n": "②", "t": "두 해 모두 시골은 80% 미만, 도시는 90% 초과였다.", "a": false, "x": true, "trap": false, "e": "rural은 64%(1997)·79%(2017)로 모두 80% 미만이고, urban은 95%·97%로 모두 90%를 넘는다."}, {"n": "③", "t": "1997년 시골 36%, 도시 5%가 전기를 이용할 수 없었다.", "a": false, "x": true, "trap": false, "e": "
