 time)고 해요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">업무 중에는 휴대전화 사용을 자제하라.</span><span class=\"why\">[범위 좁음] 7번 phone(전화)은 빨래 예시 속 한 장면일 뿐이에요. 필자는 휴대전화만이 아니라 무슨 일이든 한 가지에 집중하라고 해요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">직장일로 인해 집안일을 소홀히 하지 마라.</span><span class=\"why\">[지문에 없음] 8번 work(일)는 빨래에서 한 말이 일에도 적용된다는 뜻이에요. 직장일과 집안일 중 무엇을 챙기라는 비교는 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">자신이 하는 일에 대해 확고한 신념을 지녀라.</span><span class=\"why\">[지문에 없음] 신념을 가지라는 문장은 없어요. 4번 Give your whole focus(온전히 집중하라)는 믿음이 아니라 주의를 한곳에 모으라는 말이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">The fast pace of today’s lifestyle</div><div class=\"k\">오늘날 생활 방식의 빠른 속도는</div></div><div class=\"rc\"><div class=\"e\">has us piling one thing on top of another.</div><div class=\"k\">우리가 한 가지의 것을 또 다른 것 위에 쌓아두게 한다.</div></div><div class=\"rnat\">오늘날 생활 방식의 빠른 속도는 우리가 한 가지의 것을 또 다른 것 위에 쌓아두게 한다.</div><div class=\"rst\">요즘 나는 숙제하면서 음악 듣고 단톡방 답장까지 한꺼번에 해요. = 지문의 빠른 생활 속도가 일을 겹겹이 쌓게 만든다는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">But you should know</span></div><div class=\"k\"><span class=\"cw\">하지만 당신은 알아야 한다</span></div></div><div class=\"rc\"><div class=\"e\">that multitasking doesn’t save any time.</div><div class=\"k\">다중 작업이 시간을 조금도 절약해 주지 못한다는 것을.</div></div><div class=\"rnat\">하지만 당신은 다중 작업이 시간을 조금도 절약해 주지 못한다는 것을 알아야 한다.</div><div class=\"rst\"><b>하지만</b>(But) 이렇게 한꺼번에 하는 <b>다중 작업</b>(multitasking)은 시간을 하나도 아껴 주지 않아요. 지문 2번에서 방향이 바뀌어요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Very often,</div><div class=\"k\">매우 자주,</div></div><div class=\"rc\"><div class=\"e\">multitasking only slows you down,</div><div class=\"k\">다중 작업은 당신의 속도를 늦출 뿐이다,</div></div><div class=\"rc\"><div class=\"e\">contrary to popular belief.</div><div class=\"k\">일반적인 생각과는 반대로.</div></div><div class=\"rnat\">매우 자주, 일반적인 생각과는 반대로, 다중 작업은 당신의 속도를 늦출 뿐이다.</div><div class=\"rst\">오히려 숙제가 더 늦게 끝나요. 지문도 사람들 생각과 반대로 다중 작업은 속도를 늦출 뿐이라고 해요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Give your whole focus</span></div><div class=\"k\"><span class=\"cw\">온전히 집중하라</span></div></div><div class=\"rc\"><div class=\"e\">to what you’re doing at the moment</div><div class=\"k\">당신이 그 순간에 하고 있는 것에</div></div><div class=\"rc\"><div class=\"e\">no matter what it is.</div><div class=\"k\">그것이 무엇이든.</div></div><div class=\"rnat\">그것이 무엇이든 당신이 그 순간에 하고 있는 것에 온전히 집중하라.</div><div class=\"rst\">그러니 지금 하는 일에 <b>온전히 집중하세요</b>(Give your whole focus). 무엇을 하든요. 지문의 첫 명령문이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">While doing the laundry,</div><div class=\"k\">세탁을 하는 동안에는,</div></div><div class=\"rc\"><div class=\"e\">just do the laundry:</div><div class=\"k\">그냥 세탁만 하라.</div></div><div class=\"rnat\">세탁을 하는 동안에는 그냥 세탁만 하라.</div><div class=\"rst\">집에서 빨래를 맡았다면, 그 시간엔 빨래만 해요. = 지문의 ‘세탁하는 동안엔 그냥 세탁만 하라’예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Listen to the sound of the water</div><div class=\"k\">물의 소리를 들어 보라</div></div><div class=\"rc\"><div class=\"e\">as it fills the washing machine</div><div class=\"k\">그것(= 물)이 세탁기를 채울 때에는</div></div><div class=\"rc\"><div class=\"e\">and feel the clothes in your hand.</div><div class=\"k\">그리고 손에 (있는) 세탁물을 느껴 보라.</div></div><div class=\"rnat\">그것(물)이 세탁기를 채울 때에는 물의 소리를 듣고 손에 (있는) 세탁물을 느껴보라.</div><div class=\"rst\">세탁기에 물 차는 소리를 듣고, 손에 닿는 옷감을 느껴 봐요. 지문은 그 일 하나에 푹 빠져 보라고 해요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">It doesn’t take up any more time</div><div class=\"k\">그것은 시간을 조금도 더 많이 차지하지 않는다</div></div><div class=\"rc\"><div class=\"e\">than it would</div><div class=\"k\">그럴(차지할) 것보다</div></div><div class=\"rc\"><div class=\"e\">when done with your phone pressed to your ear.</div><div class=\"k\">당신의 귀에 전화가 대어진 채로(전화를 받으면서) 행해질 때.</div></div><div class=\"rnat\">그것은 당신의 귀에 전화가 대어진 채로(전화를 받으면서) 행해질 때 그럴(차지할) 것보다 시간을 조금도 더 많이 차지하지 않는다.</div><div class=\"rst\">통화하면서 빨래할 때보다 시간이 더 걸리지도 않아요. 지문 7번이 시간이 조금도 더 들지 않는다고 말해요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">The same</div><div class=\"k\">똑같은 것이</div></div><div class=\"rc\"><div class=\"e\">applies to your work.</div><div class=\"k\">당신의 일에(도) 적용된다.</div></div><div class=\"rnat\">똑같은 것이 당신의 일에(도) 적용된다.</div><div class=\"rst\">숙제도 똑같아요. 지문은 빨래에서 한 말이 일(work)에도 그대로 적용된다고 해요.</div></div><div class=\"rds key\" data-ord=\"9\"><span class=\"rn\">9번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Focus on one task at a time</span>,</div><div class=\"k\"><span class=\"cw\">한 번에 한 가지 일에만 집중하라</span>,</div></div><div class=\"rc\"><div class=\"e\">and you’ll accomplish each task</div><div class=\"k\">그러면 당신은 각각의 일을 해낼 수 있을 것이다</div></div><div class=\"rc\"><div class=\"e\">better, and probably faster.</div><div class=\"k\">더 잘, 그리고 아마도 더 빨리.</div></div><div class=\"rnat\">한 번에 한 가지 일에만 집중하라, 그러면 각각의 일을 더 잘, 그리고 아마도 더 빨리 해낼 수 있을 것이다.</div><div class=\"rst\"><b>한 번에 한 가지만</b>(one task at a time) 하면 숙제를 더 잘, 아마 더 빨리 끝내요. 이게 필자의 주장이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"pace\" data-m=\"속도\"><b>pace</b>속도</button><button type=\"button\" class=\"wdb\" data-w=\"multitasking\" data-m=\"다중 작업\"><b>multitasking</b>다중 작업</button><button type=\"button\" class=\"wdb\" data-w=\"contrary to\" data-m=\"~와는 반대로\"><b>contrary to</b>~와는 반대로</button><button type=\"button\" class=\"wdb\" data-w=\"take up\" data-m=\"(시간을) 차지하다\"><b>take up</b>(시간을) 차지하다</button><button type=\"button\" class=\"wdb\" data-w=\"at a time\" data-m=\"한 번에\"><b>at a time</b>한 번에</button><button type=\"button\" class=\"wdb\" data-w=\"accomplish\" data-m=\"해내다, 성취하다\"><b>accomplish</b>해내다, 성취하다</button></div>", "02": "<p class=\"mtr\">마더텅 정답률 <b>95%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">도표 불일치는 선지마다 <b>숫자</b>를 도표와 직접 대조하세요. 퍼센트포인트 차이가 나오면 두 해의 수치를 <b>직접 빼 보는 것</b>이 핵심이에요.</p><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>①</em>2번: 전체 이용 비율 11퍼센트포인트 높아짐 → 도표와 같음</span><span><em>②</em>3번: 두 해 모두 시골 80% 미만, 도시 90% 초과 → 도표와 같음</span><span><em>③</em>4번: 1997년 시골 36%, 도시 5%가 전기 못 씀 → 도표와 같음</span><span><em>⑤</em>6번: 도시 미이용 5%에서 3%로 감소 → 도표와 같음</span></div><div class=\"ck-eq\">⇒ 네 개는 도표와 같아요 → 남은 ④의 숫자를 직접 빼 보기</div></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><span class=\"lab\">4번 · 시골의 출발점</span><div class=\"en\">In 1997, <mark>36%</mark> of the rural population did not have electricity access</div><p class=\"ko\">1997년에는, 시골 인구의 <mark>36퍼센트가</mark> 전기를 이용할 수 없었다</p></div><div class=\"ck-via\"><i>▼</i><span>도표의 2017년 시골 미이용 21%와 빼 보면 36 − 21 = 15예요</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 · 결정적 단서</span><div class=\"en\">The percentage of the rural population without electricity access in 2017 was <mark>20 percentage points lower</mark> than that in 1997.</div><p class=\"ko\">2017년 전기를 이용할 수 없었던 시골 인구의 비율은 1997년의 그것(= 비율)보다 <mark>20퍼센트포인트(→ 15퍼센트포인트) 더 낮았다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">2017년 전기 미이용 시골 인구 비율이 1997년보다 20퍼센트포인트 낮았다.<small>도표는 36%에서 21%로, 15퍼센트포인트만 낮아졌어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">1997년 시골 36%, 도시 5%가 전기를 이용할 수 없었다.</span><span class=\"why\">4번과 같아요. did not have(가지지 못했다)라서 ‘전기 없는 쪽’ 숫자예요. 이용하는 비율로 착각하면 틀린 줄 알지만 도표와 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">2017년 전체 인구의 전기 이용 비율이 1997년보다 11퍼센트포인트 높았다.</span><span class=\"why\">2번과 같아요. 전체 인구의 전기 이용 비율이 11 percentage points higher(11퍼센트포인트 더 높은)예요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">두 해 모두 시골은 80% 미만, 도시는 90% 초과였다.</span><span class=\"why\">3번과 같아요. 1997년과 2017년 모두 시골은 80%가 안 되고 도시는 90%가 넘어서 도표와 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">전기 미이용 도시 인구 비율이 5%에서 3%로 감소했다.</span><span class=\"why\">6번과 같아요. 도시의 전기 미이용 비율은 5%에서 3%로 decreased(감소했다)예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">The above graph shows</div><div class=\"k\">위의 도표는 보여준다</div></div><div class=\"rc\"><div class=\"e\">the world population access to electricity</div><div class=\"k\">세계 인구의 전기 이용 기회를</div></div><div class=\"rc\"><div class=\"e\">in 1997 and in 2017.</div><div class=\"k\">1997년과 2017년의.</div></div><div class=\"rnat\">위의 도표는 1997년과 2017년 세계 인구의 전기 이용 기회를 보여준다.</div><div class=\"rst\">시골 마을과 도시 동네에서 전기를 쓰는 집이 얼마나 되는지 1997년과 2017년을 비교한 그래프예요. = 지문의 세계 인구 전기 이용 도표예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">The percentage of the total world population</div><div class=\"k\">전 세계 인구의 비율은</div></div><div class=\"rc\"><div class=\"e\">with electricity access in 2017</div><div class=\"k\">2017년에 전기를 이용할 수 있었던</div></div><div class=\"rc\"><div class=\"e\">was 11 percentage points higher</div><div class=\"k\">11퍼센트포인트 더 높았다</div></div><div class=\"rc\"><div class=\"e\">than that in 1997.</div><div class=\"k\">1997년의 그것(= 비율)보다.</div></div><div class=\"rnat\">① 2017년 전기를 이용할 수 있었던 전 세계 인구 비율은 1997년의 그것(비율)보다 11퍼센트포인트 높았다.</div><div class=\"rst\">20년 사이 전기를 쓰는 사람이 전체로 11퍼센트포인트 늘었어요. = 지문 2번이라 선지 ①은 도표와 같아요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Both in 1997 and in 2017,</div><div class=\"k\">1997년과 2017년 모두에서,</div></div><div class=\"rc\"><div class=\"e\">less than 80% of the rural population</div><div class=\"k\">시골 인구의 80퍼센트 미만이</div></div><div class=\"rc\"><div class=\"e\">had access to electricity</div><div class=\"k\">전기를 이용할 수 있었던</div></div><div class=\"rc\"><div class=\"e\">while over 90% of the urban population</div><div class=\"k\">반면 90퍼센트가 넘는 도시 인구가</div></div><div class=\"rc\"><div class=\"e\">had access to electricity.</div><div class=\"k\">전기를 이용할 수 있었다.</div></div><div class=\"rnat\">② 1997년과 2017년 모두에서, 시골 인구의 80퍼센트 미만이 전기를 이용할 수 있었던 반면, 90퍼센트가 넘는 도시 인구가 전기를 이용할 수 있었다.</div><div class=\"rst\">두 해 모두 시골은 80%가 안 되고, 도시는 90%가 넘게 전기를 써요. = 지문 3번이라 선지 ②도 맞아요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">In 1997,</div><div class=\"k\">1997년에는,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">36%</span> of the rural population</div><div class=\"k\"><span class=\"cw\">시골 인구의 36퍼센트가</span></div></div><div class=\"rc\"><div class=\"e\">did not have electricity access</div><div class=\"k\">전기를 이용할 수 없었던</div></div><div class=\"rc\"><div class=\"e\">while 5% of the urban population</div><div class=\"k\">반면 도시 인구의 5퍼센트가</div></div><div class=\"rc\"><div class=\"e\">did not have access to electricity.</div><div class=\"k\">전기를 이용할 수 없었다.</div></div><div class=\"rnat\">③ 1997년에는, 시골 인구의 36퍼센트가 전기를 이용할 수 없었던 반면, 도시 인구의 5퍼센트가 전기를 이용할 수 없었다.</div><div class=\"rst\">1997년엔 시골 사람 36%, 도시 사람 5%가 전기를 못 썼어요. = 지문의 <b>did not have</b>(가지지 못했다)라 선지 ③도 맞아요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">The percentage of the rural population</div><div class=\"k\">시골 인구의 비율은</div></div><div class=\"rc\"><div class=\"e\">without electricity access in 2017</div><div class=\"k\">2017년 전기를 이용할 수 없었던</div></div><div class=\"rc ckc\"><div class=\"e\">was <span class=\"cw\">20 percentage points lower</span></div><div class=\"k\"><span class=\"cw\">20퍼센트포인트(→ 15퍼센트포인트) 더 낮았다</span></div></div><div class=\"rc\"><div class=\"e\">than that in 1997.</div><div class=\"k\">1997년의 그것(= 비율)보다.</div></div><div class=\"rnat\">④ 2017년 전기를 이용할 수 없었던 시골 인구의 비율은 1997년의 그것(비율)보다 20퍼센트포인트(→ 15퍼센트포인트) 더 낮았다.</div><div class=\"rst\">2017년 시골에서 전기를 못 쓰는 사람은 21%라, 36에서 빼면 15예요. 그런데 지문은 <b>20퍼센트포인트</b>라고 해서 정답이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">The percentage of the urban population</div><div class=\"k\">도시 인구의 비율은</div></div><div class=\"rc\"><div class=\"e\">without electricity access</div><div class=\"k\">전기를 이용할 수 없었던</div></div><div class=\"rc\"><div class=\"e\">decreased from 5% in 1997 to 3% in 2017.</div><div class=\"k\">1997년 5퍼센트에서 2017년 3퍼센트로 감소하였다.</div></div><div class=\"rnat\">⑤ 전기를 이용할 수 없었던 도시 인구의 비율은 1997년 5퍼센트에서 2017년 3퍼센트로 감소하였다.</div><div class=\"rst\">도시에서 전기를 못 쓰는 사람은 5%에서 3%로 줄었어요. = 지문의 <b>decreased</b>(감소했다)라 선지 ⑤는 맞아요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"access\" data-m=\"이용 기회, 접근\"><b>access</b>이용 기회, 접근</button><button type=\"button\" class=\"wdb\" data-w=\"electricity\" data-m=\"전기\"><b>electricity</b>전기</button><button type=\"button\" class=\"wdb\" data-w=\"rural\" data-m=\"시골의\"><b>rural</b>시골의</button><button type=\"button\" class=\"wdb\" data-w=\"urban\" data-m=\"도시의\"><b>urban</b>도시의</button><button type=\"button\" class=\"wdb\" data-w=\"percentage point\" data-m=\"퍼센트포인트\"><b>percentage point</b>퍼센트포인트</button><button type=\"button\" class=\"wdb\" data-w=\"decrease\" data-m=\"감소하다\"><b>decrease</b>감소하다</button></div>", "03": "<p class=\"mtr\">마더텅 정답률 <b>85%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">제목은 글 전체에 깔린 <b>비유</b>를 잡는 문제예요. epidemic(전염병)·virus(바이러스)·contagious(전염성의)가 계속 반복되고, 7번 <b>in essence</b>(본질적으로)가 “학습 전염병”으로 정리해요.</p><div class=\"ck-step\"><span class=\"lab\">3번 문장 · 비유의 정체</span><div class=\"en\">Her agent of infection was television and the “virus” she wanted to spread <mark>was literacy</mark>.</div><p class=\"ko\">그녀의 전염병의 병원체는 텔레비전이었고, 그녀가 퍼뜨리길 원했던 ‘바이러스’는 <mark>읽고 쓰는 능력이었다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>바이러스처럼 퍼지게 하려는 목적 = 교육</span></div><div class=\"ck-step\"><span class=\"lab\">4번 문장 · 반복되는 비유어</span><div class=\"en\">in hopes that it would become <mark>contagious</mark> enough to improve education.</div><p class=\"ko\">교육을 향상시킬 만큼 충분히 <mark>전염이 될</mark> 것이라는 희망에서.</p></div><div class=\"ck-via\"><i>▼</i><span>in essence(본질적으로)로 비유를 한 줄로 묶어요</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 문장 · 결정적 결론</span><div class=\"en\">What she wanted to do, <mark>in essence</mark>, was <mark>create a learning epidemic</mark> to fight the wide-spread epidemics of poverty and illiteracy.</div><p class=\"ko\">그녀가 하길 원했던 것은, <mark>본질적으로</mark>, 가난과 문맹이라는 널리 퍼진 전염병과 싸우기 위해 <mark>학습 전염병을 만드는 것이었다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>7번의 학습 전염병에 붙인 이름이 제목 앞부분이 돼요</span></div><div class=\"ck-step\"><span class=\"lab\">8번 문장 · 그 전염병의 이름</span><div class=\"en\">She called her idea Sesame Street.</div><p class=\"ko\">그녀는 그녀의 아이디어를 Sesame Street(세서미 스트리트, 미국의 유아용 TV 프로그램)라고 불렀다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">Sesame Street(세서미 스트리트): Educational Virus(교육 바이러스)<small>8번의 이름 세서미 스트리트(Sesame Street)와 7번의 결론 학습 전염병(learning epidemic)을 둘 다 담았어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">What Makes Sesame Street Harmful(무엇이 세서미 스트리트를 해롭게 만드는가)?</span><span class=\"why\">[반대] virus(바이러스)·epidemic(전염병)이란 말에 끌린 함정이에요. 3번에서 퍼뜨린 바이러스는 literacy(읽고 쓰는 능력)라서 해로운 게 아니라 좋은 전염이에요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">Are Children Sick of Sesame Street(아이들은 세서미 스트리트에 질렸을까)?</span><span class=\"why\">[지문에 없음] 아이들이 싫증 냈다는 문장은 없어요. 5번은 오히려 아이들과 부모에게 배움을 퍼뜨리는 게 목표였다고 해요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">Too Much TV Time Equals Less Education(TV를 너무 많이 보면 교육이 줄어든다)</span><span class=\"why\">[반대] 4번은 텔레비전 쇼가 to improve education(교육을 향상시킬) 만큼 퍼지길 바랐다고 해요. 텔레비전이 교육을 줄인다는 건 정반대예요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">Don't Turn on TV Too Early in the Morning(아침 너무 일찍 텔레비전을 켜지 마라)!</span><span class=\"why\">[지문에 없음] 방송 시간대 이야기는 없어요. 4번은 한 시간짜리를 일주일에 5일 방영한다는 것뿐이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">In the late 1960s,</div><div class=\"k\">1960년대 말에,</div></div><div class=\"rc\"><div class=\"e\">a television producer, Joan Cooney,</div><div class=\"k\">텔레비전 프로듀서인 Joan Cooney는</div></div><div class=\"rc\"><div class=\"e\">started an epidemic.</div><div class=\"k\">전염병을 시작되게 했다(퍼뜨리기 시작했다).</div></div><div class=\"rnat\">1960년대 말에, 텔레비전 프로듀서인 Joan Cooney는 전염병을 시작되게 했다(퍼뜨리기 시작했다).</div><div class=\"rst\">1960년대 말, 한 텔레비전 프로듀서가 ‘전염병’을 퍼뜨렸대요. 우리 반에 감기가 돌듯이요. = 지문 1번의 epidemic(전염병)이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">She targeted children</div><div class=\"k\">그녀는 아이들을 목표로 삼았다</div></div><div class=\"rc\"><div class=\"e\">between three and five.</div><div class=\"k\">3세에서 5세 사이의.</div></div><div class=\"rnat\">그녀는 3세에서 5세 사이의 아이들을 목표로 삼았다.</div><div class=\"rst\">그 병이 노린 건 3~5살 아이들, 내 동생 또래예요. 지문 2번은 목표가 바로 그 아이들이라고 해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Her agent of infection was television</div><div class=\"k\">그녀의 전염병의 병원체는(전염병의 경로는) 텔레비전이었고</div></div><div class=\"rc\"><div class=\"e\">and the “virus” she wanted to spread</div><div class=\"k\">그녀가 퍼뜨리길 원했던 ‘바이러스’는</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">was literacy</span>.</div><div class=\"k\"><span class=\"cw\">읽고 쓰는 능력이었다</span>.</div></div><div class=\"rnat\">그녀의 전염병의 병원체는(전염병의 경로는) 텔레비전이었고 그녀가 퍼뜨리길 원했던 ‘바이러스’는 읽고 쓰는 능력이었다.</div><div class=\"rst\">옮기는 통로는 텔레비전, 퍼뜨린 <b>바이러스</b>(virus)는 <b>읽고 쓰는 능력</b>(literacy)이에요. 감기가 아니라 ‘글 읽기’가 옮는 거예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">The show would be an hour long</div><div class=\"k\">그 쇼는 한 시간 가량이 될 것이었고</div></div><div class=\"rc\"><div class=\"e\">and run 5 days a week</div><div class=\"k\">일주일에 5일 방영될 것이었다</div></div><div class=\"rc ckc\"><div class=\"e\">in hopes that it would become <span class=\"cw\">contagious</span> enough</div><div class=\"k\">그것이 충분히 <span class=\"cw\">전염이 될</span> 것이라는 희망에서</div></div><div class=\"rc\"><div class=\"e\">to improve education.</div><div class=\"k\">교육을 향상시킬 만큼.</div></div><div class=\"rnat\">그 쇼는 그것이 교육을 향상시킬 만큼 충분히 전염이 될 것이라는 희망에서 한 시간 가량으로 일주일에 5일 방영할 것이었다(예정이었다).</div><div class=\"rst\">한 시간짜리 쇼를 주 5일 틀어서, 교육이 좋아질 만큼 <b>잘 옮게</b>(contagious 전염성의) 하려 했어요. = 지문 4번이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Her aim was to spread positive learning values</div><div class=\"k\">그녀의 목표는 긍정적인 학습 가치를 퍼뜨리는 것이었다</div></div><div class=\"rc\"><div class=\"e\">to all children</div><div class=\"k\">모든 아이들에게</div></div><div class=\"rc\"><div class=\"e\">and even their parents.</div><div class=\"k\">그리고 그들의 부모들에게도.</div></div><div class=\"rnat\">그녀의 목표는 긍정적인 학습 가치를 모든 아이들과 그들의 부모들에게도 퍼뜨리는 것이었다.</div><div class=\"rst\">동생이 텔레비전에서 배운 노래를 집에서 가족에게도 옮기듯, 아이와 부모 모두에게 좋은 배움을 퍼뜨리려 했어요. = 지문 5번의 목표예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">She also intended for it</div><div class=\"k\">그녀는 또한 그것이 ~하는 것을 의도했다</div></div><div class=\"rc\"><div class=\"e\">to give advantages</div><div class=\"k\">이점을 주는 것을</div></div><div class=\"rc\"><div class=\"e\">to children with fewer opportunities</div><div class=\"k\">기회가 거의 없는(불우한 환경의) 아이들에게</div></div><div class=\"rc\"><div class=\"e\">once they began elementary school.</div><div class=\"k\">그들이 초등학교를 다니기 시작할 때.</div></div><div class=\"rnat\">그녀는 또한 그것이 기회가 거의 없는(불우한 환경의) 아이들에게 그들이 초등학교를 다니기 시작할 때 이점을 주는 것을 의도했다(주고자 했다).</div><div class=\"rst\">형편이 어려운 아이도 초등학교에 들어갈 때 앞서 출발하게 돕고 싶었어요. = 지문 6번의 이점(advantages)이에요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">What she wanted to do,</div><div class=\"k\">그녀가 하길 원했던 것은,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">in essence</span>,</div><div class=\"k\"><span class=\"cw\">본질적으로</span>,</div></div><div class=\"rc ckc\"><div class=\"e\">was <span class=\"cw\">create a learning epidemic</span></div><div class=\"k\"><span class=\"cw\">학습 전염병을 만드는 것이었다</span></div></div><div class=\"rc\"><div class=\"e\">to fight the wide-spread epidemics of poverty and illiteracy.</div><div class=\"k\">가난과 문맹이라는 널리 퍼진 전염병과 싸우기 위해.</div></div><div class=\"rnat\">그녀가 본질적으로 하길 원했던 것은 가난과 문맹이라는 널리 퍼진 전염병과 싸우기 위해 학습 전염병을 만드는 것이었다.</div><div class=\"rst\"><b>결국</b>(in essence 본질적으로) 가난과 문맹이라는 나쁜 전염병과 싸우려고 <b>학습 전염병</b>을 만든 거예요. 지문의 결론이에요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">She called her idea</div><div class=\"k\">그녀는 그녀의 아이디어를 불렀다</div></div><div class=\"rc\"><div class=\"e\">Sesame Street.</div><div class=\"k\">Sesame Street(세서미 스트리트, 미국의 유아용 TV 프로그램)라고.</div></div><div class=\"rnat\">그녀는 그녀의 아이디어를 Sesame Street(세서미 스트리트, 미국의 유아용 TV 프로그램)라 불렀다.</div><div class=\"rst\">그 좋은 전염병의 이름이 세서미 스트리트(Sesame Street)예요. 그래서 제목은 ‘세서미 스트리트: 교육 바이러스’예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"epidemic\" data-m=\"전염병, 유행병\"><b>epidemic</b>전염병, 유행병</button><button type=\"button\" class=\"wdb\" data-w=\"agent\" data-m=\"병원체, 매개체\"><b>agent</b>병원체, 매개체</button><button type=\"button\" class=\"wdb\" data-w=\"literacy\" data-m=\"읽고 쓰는 능력\"><b>literacy</b>읽고 쓰는 능력</button><button type=\"button\" class=\"wdb\" data-w=\"contagious\" data-m=\"전염성의\"><b>contagious</b>전염성의</button><button type=\"button\" class=\"wdb\" data-w=\"in essence\" data-m=\"본질적으로\"><b>in essence</b>본질적으로</button><button type=\"button\" class=\"wdb\" data-w=\"illiteracy\" data-m=\"문맹\"><b>illiteracy</b>문맹</button></div>", "04": "<p class=\"mtr\">마더텅 정답률 <b>60%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">밑줄 뒤 <b>절이 완전한지</b>부터 보세요. 주어·목적어가 빠졌으면 <b>what</b>(~하는 것), 다 있으면 <b>that</b>(~라는 것)이에요. It is better(더 낫다) 뒤 진짜 주어 자리도 똑같아요.</p><div class=\"ck-step\"><span class=\"lab\">문제지 ③번 자리 (5번)</span><div class=\"en\">It is better <u>③ what</u> you make your mistakes early on rather than later in life.</div><p class=\"ko\">( ? ) 여러분이 이른 시기에 실수를 하는 것이 더 낫다 — 앞은 It is better, 뒤는 주어+동사+목적어</p></div><div class=\"ck-via\"><i>▼</i><span>It(그것)은 뜻 없는 가짜 주어라, 진짜 주어 절이 뒤에 와야 해요</span></div><div class=\"ck-step\"><span class=\"lab\">5번 앞쪽 · 가주어</span><div class=\"en\"><mark>It is better</mark></div><p class=\"ko\"><mark>더 낫다</mark></p></div><div class=\"ck-via\"><i>▼</i><span>you(주어)·make(동사)·your mistakes(목적어)가 다 있어요 → 완전한 절 → that(~라는 것)</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 뒤쪽 · 결정적 단서</span><div class=\"en\">that <mark>you make your mistakes</mark> early on rather than later in life.</div><p class=\"ko\">인생에서 나중보다는 오히려 <mark>여러분이 이른 시기에 실수를 하는 것이</mark> (더 낫다).</p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">관계대명사 what(~하는 것)과 접속사 that(~라는 것) 구별 — 가주어 It(그것) 뒤 진짜 주어</p><p class=\"gr\">what(~하는 것) 뒤에는 주어나 목적어가 빠진 불완전한 절이 와요. 주어·동사·목적어가 다 있는 완전한 절이 It is(~이다) 뒤 진짜 주어가 되면 that(~라는 것)을 써요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>It is true that he is kind.</div><div class=\"ko\">그가 친절하다는 것은 사실이다. (he is kind가 완전한 절이라 that이 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>It is true what he is kind.</div><div class=\"ko\">뒤 절에 빠진 자리가 없는데 what을 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>What he said is true.</div><div class=\"ko\">그가 말한 것은 사실이다. (said 뒤 목적어가 비어서 what이 맞아요)</div></div><p class=\"gb\">지문 5번도 you make your mistakes(여러분이 실수를 하다)가 주어·동사·목적어를 다 갖춘 완전한 절이에요. 그래서 가주어 It(그것)의 진짜 주어를 이끄는 that(~라는 것)이 맞아요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">what → that (~라는 것)<small>뒤 절 you make your mistakes(여러분이 실수를 하다)가 완전하니 that(~라는 것)이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">occurs 일어나다</span><span class=\"why\">3번 주어는 Much of learning(배움의 많은 부분)이에요. learning(배움)은 셀 수 없는 명사라 단수 취급하니 occurs(일어난다)가 맞고, occur(일어나다)는 목적어 없는 자동사라 수동태로 바꾸지 않아요.</span><div class=\"gm wx\"><p class=\"gt\">수 일치: Much of(~의 많은 부분) + 셀 수 없는 명사 → 단수 동사</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>Much of the water is dirty.</div><div class=\"ko\">그 물의 많은 부분이 더럽다. (water 물은 셀 수 없어서 단수 is가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>Much of the water are dirty.</div><div class=\"ko\">셀 수 없는 water(물)인데 복수 are를 써서 틀려요.</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>An accident was occurred yesterday.</div><div class=\"ko\">occur(일어나다)는 '~되다'로 바꿀 수 없는 동사라 was occurred는 틀려요. (An accident occurred yesterday. 가 맞아요)</div></div><p class=\"gb\">지문 3번도 Much of learning(배움의 많은 부분)이 단수라서 occurs(일어난다)가 딱 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">do 그렇게 하다</span><span class=\"why\">2번은 You may make some foolish spending choices(어리석은 소비 선택을 할지도 모른다) 뒤에 if you do(만약 그렇게 한다면)가 와요. 앞 동사구를 되풀이하지 않으려고 대신 받는 대동사 do(하다)라서 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">대동사 do(하다): 앞에 나온 일반동사(구)를 대신 받음</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I like pizza, and my sister does too.</div><div class=\"ko\">나는 피자를 좋아하고 언니도 그래. (does가 likes pizza를 대신해서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I like pizza, and my sister is too.</div><div class=\"ko\">like(좋아하다)는 일반동사라 be동사 is로 받으면 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>Did you finish your homework? Yes, I did.</div><div class=\"ko\">숙제 다 했니? 응, 했어. (did가 finished my homework를 대신해서 맞아요)</div></div><p class=\"gb\">지문 2번도 make some foolish spending choices(어리석은 소비 선택을 하다)를 do(하다) 하나로 받아서 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">to manage 관리하는 (방법)</span><span class=\"why\">6번은 you need to know(알 필요가 있다) 뒤 목적어 자리예요. how(어떻게) 뒤에 동사원형을 붙인 how to manage(관리하는 방법)가 무엇을 알아야 하는지를 한 덩어리로 말해 줘서 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">의문사 + 부정사: how to(~하는 방법) + 동사원형</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I know how to swim.</div><div class=\"ko\">나는 수영하는 방법을 안다. (how 뒤에 to swim이 와서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I know how swimming.</div><div class=\"ko\">how(어떻게) 뒤에 to 없이 swimming(수영하는 것)을 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>Tell me how to get there.</div><div class=\"ko\">거기 가는 방법을 알려 줘. (how to get 가는 방법이 맞아요)</div></div><p class=\"gb\">지문 6번도 know(알다) 뒤에 how to manage your money(돈을 관리하는 방법)가 와서 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">is taught 가르쳐지다</span><span class=\"why\">7번 주어 Not everything(모든 것이 다 ~은 아니다)은 가르치는 쪽이 아니라 가르침을 받는 쪽이라 수동태(~되다)가 맞아요. everything(모든 것)은 단수라 are(이다)가 아니라 is(이다)예요.</span><div class=\"gm wx\"><p class=\"gt\">수동태(~되다): 주어가 동작을 받는 쪽이면 is(이다) + 과거분사, everything(모든 것)은 단수</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>English is taught at school.</div><div class=\"ko\">영어는 학교에서 가르쳐진다. (영어는 가르침을 받는 쪽이라 is taught가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>English teaches at school.</div><div class=\"ko\">영어가 직접 가르치는 게 아니라서 능동 teaches는 틀려요.</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>Everything are ready.</div><div class=\"ko\">everything(모든 것)은 단수라 are가 아니라 is를 써야 해서 틀려요.</div></div><p class=\"gb\">지문 7번도 everything(모든 것)이 학교에서 가르쳐지는 쪽이라 is taught(가르쳐진다)가 맞아요.</p></div></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Your parents may be afraid</div><div class=\"k\">여러분의 부모는 걱정할지도 모른다</div></div><div class=\"rc\"><div class=\"e\">that you will not spend your allowance wisely.</div><div class=\"k\">여러분이 용돈을 현명하게 쓰지 않을 것을.</div></div><div class=\"rnat\">여러분의 부모는 여러분이 용돈을 현명하게 쓰지 않을 것을 걱정할지도 모른다.</div><div class=\"rst\">부모님은 내가 용돈을 현명하게 못 쓸까 봐 걱정하실 수 있어요. that(~라는 것) 뒤에 주어·동사가 다 있는 완전한 절이 와요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">You may make some foolish spending choices,</div><div class=\"k\">여러분이 돈을 쓰는 데 몇 가지 어리석은 선택을 할 수도 있지만,</div></div><div class=\"rc\"><div class=\"e\">but if you do,</div><div class=\"k\">만약 여러분이 그렇게 한다면(= make ~ choices),</div></div><div class=\"rc\"><div class=\"e\">the decision to do so is your own</div><div class=\"k\">그렇게 하는 결정은 여러분 자신의 결정이고</div></div><div class=\"rc\"><div class=\"e\">and hopefully you will learn from your mistakes.</div><div class=\"k\">잘 된다면 여러분은 자신의 실수로부터 배울 것이다.</div></div><div class=\"rnat\">여러분이 돈을 쓰는 데 몇 가지 어리석은 선택을 할 수도 있지만, 만약 여러분이 그렇게 한다면, 그 결정은 여러분 자신의 결정이고 잘 된다면 여러분은 자신의 실수로부터 배울 것이다.</div><div class=\"rst\">어리석게 쓸 수도 있지만, 그렇게 하면 그건 내 결정이고 실수에서 배워요. do(하다)가 앞의 make(하다) 부분을 대신 받아요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Much of learning occurs</div><div class=\"k\">배움의 많은 부분은 일어난다</div></div><div class=\"rc\"><div class=\"e\">through trial and error.</div><div class=\"k\">시행착오를 통해서.</div></div><div class=\"rnat\">배움의 많은 부분은 시행착오를 통해서 일어난다.</div><div class=\"rst\">배움의 많은 부분은 시행착오로 일어나요. 주어 Much of learning(배움의 많은 부분)이 단수라 occurs(일어난다)예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Explain to your parents</div><div class=\"k\">여러분의 부모에게 설명하라</div></div><div class=\"rc\"><div class=\"e\">that money is something you will have to deal with</div><div class=\"k\">돈은 여러분이 다루어야 할 것이라는 사실을</div></div><div class=\"rc\"><div class=\"e\">for the rest of your life.</div><div class=\"k\">평생 동안.</div></div><div class=\"rnat\">돈은 여러분이 평생 동안 다루어야 할 것이라는 사실을 여러분의 부모에게 설명하라.</div><div class=\"rst\">돈은 평생 다룰 것이라고 부모님께 설명해 보래요. 명령문 Explain(설명하라)으로 시작하는 문장이에요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">It is better</span></div><div class=\"k\"><span class=\"cw\">더 낫다</span></div></div><div class=\"rc ckc\"><div class=\"e\">that <span class=\"cw\">you make your mistakes</span> early on</div><div class=\"k\"><span class=\"cw\">여러분이 이른 시기에 실수를 하는 것이</span> ※ 문제지엔 what으로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">rather than later in life.</div><div class=\"k\">인생에서 나중보다 오히려.</div></div><div class=\"rnat\">인생에서 나중보다 오히려 이른 시기에 실수를 하는 것이 더 낫다.</div><div class=\"rst\"><b>실수는 나중보다 일찍 하는 게 더 나아요.</b> 뒤 절이 완전해서 what(~하는 것)이 아니라 that(~라는 것)이 진짜 주어를 이끌어요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Explain that you will have a family someday</div><div class=\"k\">여러분이 언젠가는 가정을 갖게 될 것이라고 설명하라</div></div><div class=\"rc\"><div class=\"e\">and you need to know</div><div class=\"k\">그리고 알 필요가 있다고</div></div><div class=\"rc\"><div class=\"e\">how to manage your money.</div><div class=\"k\">자신의 돈을 관리하는 방법을.</div></div><div class=\"rnat\">여러분이 언젠가는 가정을 갖게 될 것이고 자신의 돈을 관리하는 방법을 알 필요가 있다는 것을 설명하라.</div><div class=\"rst\">언젠가 가정을 꾸리면 돈 관리하는 법을 알아야 한다고 설명하래요. how to manage(관리하는 방법)가 know(알다)의 목적어예요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Not everything is taught</div><div class=\"k\">모든 것이 다 가르쳐지는 것은 아니다</div></div><div class=\"rc\"><div class=\"e\">at school!</div><div class=\"k\">학교에서!</div></div><div class=\"rnat\">모든 것이 다 학교에서 가르쳐지는 것은 아니다!</div><div class=\"rst\">모든 걸 학교에서 다 가르쳐 주지는 않아요! everything(모든 것)이 가르침을 받는 쪽이라 is taught(가르쳐진다)예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"allowance\" data-m=\"용돈\"><b>allowance</b>용돈</button><button type=\"button\" class=\"wdb\" data-w=\"trial and error\" data-m=\"시행착오\"><b>trial and error</b>시행착오</button><button type=\"button\" class=\"wdb\" data-w=\"occur\" data-m=\"일어나다, 발생하다\"><b>occur</b>일어나다, 발생하다</button><button type=\"button\" class=\"wdb\" data-w=\"deal with\" data-m=\"~을 다루다\"><b>deal with</b>~을 다루다</button><button type=\"button\" class=\"wdb\" data-w=\"early on\" data-m=\"이른 시기에\"><b>early on</b>이른 시기에</button><button type=\"button\" class=\"wdb\" data-w=\"manage\" data-m=\"관리하다\"><b>manage</b>관리하다</button></div>", "05": "<p class=\"mtr\">마더텅 정답률 <b>50%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">삽입은 주어진 문장의 <b>연결 신호</b>를 잡는 문제예요. <b>Nevertheless</b>(그럼에도 불구하고)는 앞에서 언어를 <b>낮추고</b>, 뒤에서 다시 <b>높이는</b> 자리에 들어가요.</p><div class=\"ck-step\"><span class=\"lab\">주어진 문장 · 연결 신호</span><div class=\"en\"><mark>Nevertheless</mark>, language is <mark>enormously important</mark> in human life and contributes largely to our ability to cooperate with each other …</div><p class=\"ko\"><mark>그럼에도 불구하고</mark>, 언어는 인간의 삶에서 <mark>매우 중요하며</mark> 서로 협력하는 우리의 능력에 상당히 기여한다 …</p></div><div class=\"ck-via\"><i>▼</i><span>Nevertheless(그럼에도 불구하고)가 뒤집을 “언어는 기본이 아니다”가 여기서 마무리돼요</span></div><div class=\"ck-step\"><span class=\"lab\">6번 · 앞 문장 (⑤ 바로 앞)</span><div class=\"en\"><mark>There is no reason</mark> to assume that language is fundamental to mental operations.</div><p class=\"ko\">언어가 정신 작용의 기본이라고 <mark>가정할 이유는 없다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>사람이 성공한 이유가 주어진 문장의 ‘협력하는 능력’을 그대로 이어받아요</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 · 뒤 문장 (⑤ 바로 뒤)</span><div class=\"en\">Our species homo sapiens has been astonishingly successful, which depended in part on language, first as an effective contributor to <mark>collaborative problem solving</mark> …</div><p class=\"ko\">우리 종족, ‘호모 사피엔스’는 놀랄 만큼 성공을 거두어 왔는데, … 처음에는 <mark>협력적인 문제 해결</mark>에 효과적인 기여 요소로서</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>4~6번</em>언어는 사고의 한 부분일 뿐, 기본이 아님</span><span><em>주어진 문장</em>그럼에도 언어는 매우 중요, 협력에 기여</span><span><em>7번</em>호모 사피엔스의 성공은 협력을 돕는 언어 덕분이기도 함</span></div><div class=\"ck-eq\">⇒ 낮춤 → 그럼에도 높임 → 협력의 예, 세 고리가 다 맞는 자리 = ⑤</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">6번 문장과 7번 문장 사이<small>6번에서 언어를 낮춘 바로 뒤라 Nevertheless(그럼에도 불구하고)가 뒤집을 수 있어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">5번 문장과 6번 문장 사이</span><span class=\"why\">5번 동물 이야기 뒤라 Nevertheless(그럼에도 불구하고)가 어울려 보여요. 하지만 언어를 높인 바로 뒤에 6번이 다시 기본이 아니라고 낮춰서 흐름이 또 꺾이고, 7번의 협력과도 떨어져요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">2번 문장과 3번 문장 사이</span><span class=\"why\">2번은 언어와 사고 중 무엇으로 무엇을 이해할지 묻는 질문일 뿐이에요. 언어를 낮춘 말이 아직 없어서 Nevertheless(그럼에도 불구하고)가 뒤집을 대상이 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">3번 문장과 4번 문장 사이</span><span class=\"why\">3번 분석 철학은 language is basic(언어가 기본이다)이라고 언어를 높여요. 높인 말 뒤에 ‘그럼에도 중요하다’는 어색하고, 4번 however(그러나)와도 부딪혀요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">4번 문장과 5번 문장 사이</span><span class=\"why\">4번이 언어를 낮추긴 하지만, 5번 Countless species(수많은 종)의 동물 예시가 4번을 바로 뒷받침해야 해요. 여기서 끊으면 예시가 엉뚱한 곳에 떨어져요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds key\" data-ord=\"1\"><span class=\"rn\">1번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Nevertheless</span>,</div><div class=\"k\"><span class=\"cw\">그럼에도 불구하고</span>,</div></div><div class=\"rc ckc\"><div class=\"e\">language is <span class=\"cw\">enormously important</span> in human life</div><div class=\"k\">언어는 인간의 삶에서 <span class=\"cw\">매우 중요하며</span></div></div><div class=\"rc\"><div class=\"e\">and contributes largely to our ability</div><div class=\"k\">우리의 능력에 상당히 기여한다</div></div><div class=\"rc\"><div class=\"e\">to cooperate with each other</div><div class=\"k\">서로 협력하는</div></div><div class=\"rc\"><div class=\"e\">in dealing with the world.</div><div class=\"k\">세계를 다루는 데 있어서.</div></div><div class=\"rnat\">[주어진 문장] 그럼에도 불구하고, 언어는 인간의 삶에서 매우 중요하며 세계를 다루는 데 있어서 서로 협력하는 우리의 능력에 상당히 기여한다.</div><div class=\"rst\">〈주어진 문장〉 <b>그럼에도 불구하고</b>(Nevertheless) 말은 정말 중요해요. 모둠 과제할 때 서로 말로 협력하게 해 주거든요. = 지문의 협력하는 능력이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Should we use language to understand mind</div><div class=\"k\">우리는 사고를 이해하기 위해 언어를 사용해야 하는가</div></div><div class=\"rc\"><div class=\"e\">or mind to understand language?</div><div class=\"k\">아니면 언어를 이해하기 위해 사고를 사용해야 하는가?</div></div><div class=\"rnat\">우리는 사고를 이해하기 위해 언어를 사용해야 하는가 아니면 언어를 이해하기 위해 사고를 사용해야 하는가?</div><div class=\"rst\">생각을 알려면 말을 봐야 할까, 말을 알려면 생각을 봐야 할까? 지문 2번은 이 질문으로 시작해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Analytic philosophy historically assumes</div><div class=\"k\">분석 철학은 역사적으로 가정한다</div></div><div class=\"rc\"><div class=\"e\">that language is basic</div><div class=\"k\">언어가 기본이고</div></div><div class=\"rc\"><div class=\"e\">and that mind would make sense</div><div class=\"k\">그 사고가 이치에 맞을 것이라고</div></div><div class=\"rc\"><div class=\"e\">if proper use of language was appreciated.</div><div class=\"k\">적절한 언어 사용이 제대로 인식된다면.</div></div><div class=\"rnat\">분석 철학은 언어가 기본이고 적절한 언어 사용이 제대로 인식된다면 그 사고가 이치에 맞을 것이라고 역사적으로 가정한다.</div><div class=\"rst\">어떤 학자들은 말이 먼저고, 말을 제대로 쓰면 생각도 이해된다고 믿어 왔어요. = 지문의 분석 철학이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Modern cognitive science, however,</div><div class=\"k\">그러나 현대 인지 과학은,</div></div><div class=\"rc\"><div class=\"e\">rightly judges that language is just one aspect of mind</div><div class=\"k\">언어가 사고의 한 측면일 뿐이라고 당연히 판단한다</div></div><div class=\"rc\"><div class=\"e\">of great importance in human beings</div><div class=\"k\">인간에게 매우 중요한</div></div><div class=\"rc\"><div class=\"e\">but not fundamental to all kinds of thinking.</div><div class=\"k\">하지만 모든 종류의 사고에 근본적이지는 않다고.</div></div><div class=\"rnat\">그러나 현대 인지 과학은 언어가 인간에게 매우 중요한 사고의 한 측면일 뿐 모든 종류의 사고에 근본적이지는 않다고 당연히 판단한다.</div><div class=\"rst\"><b>그러나</b>(however) 요즘 과학은 말이 생각의 한 부분일 뿐, 모든 생각의 바탕은 아니래요. 여기서 말의 자리가 낮아져요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Countless species of animals</div><div class=\"k\">수많은 종의 동물들이</div></div><div class=\"rc\"><div class=\"e\">manage to navigate the world, solve problems, and learn</div><div class=\"k\">세계를 항해하고, 문제를 해결하고, 학습해낸다</div></div><div class=\"rc\"><div class=\"e\">without using language,</div><div class=\"k\">언어를 사용하지 않고,</div></div><div class=\"rc\"><div class=\"e\">through brain mechanisms</div><div class=\"k\">두뇌의 메커니즘을 통해</div></div><div class=\"rc\"><div class=\"e\">that are largely preserved in the minds of humans.</div><div class=\"k\">인간의 사고 속에 대체로 보존된.</div></div><div class=\"rnat\">수많은 종의 동물들이 인간의 사고 속에 대체로 보존된 두뇌의 메커니즘을 통해 언어를 사용하지 않고 세계를 항해하고, 문제를 해결하고, 학습해낸다.</div><div class=\"rst\">우리 집 강아지도 말 없이 길을 찾고 문제를 풀고 배워요. = 지문의 수많은 동물들이에요. 그 뇌 구조는 우리 안에도 남아 있어요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">There is no reason</span> to assume</div><div class=\"k\"><span class=\"cw\">가정할 이유는 없다</span></div></div><div class=\"rc\"><div class=\"e\">that language is fundamental to mental operations.</div><div class=\"k\">언어가 정신 작용의 기본이라고.</div></div><div class=\"rnat\">언어가 정신 작용의 기본이라고 가정할 이유는 없다.</div><div class=\"rst\">그러니 말이 생각의 바탕이라고 볼 이유는 없어요. 말을 <b>낮추는</b> 흐름이 여기서 끝나고, 바로 뒤가 주어진 문장 자리예요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">Our species homo sapiens has been astonishingly successful,</div><div class=\"k\">우리 종족, ‘호모 사피엔스’는 놀랄 만큼 성공을 거두어 왔는데,</div></div><div class=\"rc\"><div class=\"e\">which depended in part on language,</div><div class=\"k\">이것은 언어에 부분적으로 의존했다,</div></div><div class=\"rc ckc\"><div class=\"e\">first as an effective contributor to <span class=\"cw\">collaborative problem solving</span></div><div class=\"k\">처음에는 <span class=\"cw\">협력적인 문제 해결</span>에 효과적인 기여 요소로서,</div></div><div class=\"rc\"><div class=\"e\">and much later, as collective memory through written records.</div><div class=\"k\">그리고 훨씬 나중에는 글로 쓰인 기록을 통한 집단 기억으로서.</div></div><div class=\"rnat\">우리 종족, ‘호모 사피엔스’는 놀랄 만큼 성공을 거두어 왔는데, 이것은 처음에는 협력적인 문제 해결에 효과적인 기여 요소로서, 그리고 훨씬 나중에는 글로 쓰인 기록을 통한 집단 기억으로서의 언어에 부분적으로 의존했다.</div><div class=\"rst\">그래도 사람이 크게 성공한 건 말 덕분이기도 해요. 처음엔 <b>함께 문제 풀기</b>, 나중엔 글로 남긴 기록이요. = 주어진 문장의 협력이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"nevertheless\" data-m=\"그럼에도 불구하고\"><b>nevertheless</b>그럼에도 불구하고</button><button type=\"button\" class=\"wdb\" data-w=\"enormously\" data-m=\"매우, 엄청나게\"><b>enormously</b>매우, 엄청나게</button><button type=\"button\" class=\"wdb\" data-w=\"cooperate with\" data-m=\"~와 협력하다\"><b>cooperate with</b>~와 협력하다</button><button type=\"button\" class=\"wdb\" data-w=\"cognitive\" data-m=\"인지의\"><b>cognitive</b>인지의</button><button type=\"button\" class=\"wdb\" data-w=\"fundamental\" data-m=\"근본적인\"><b>fundamental</b>근본적인</button><button type=\"button\" class=\"wdb\" data-w=\"collaborative\" data-m=\"협력적인\"><b>collaborative</b>협력적인</button></div>", "06": "<p class=\"mtr\">마더텅 정답률 <b>70%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸 앞 <b>Instead</b>(대신에)는 앞에서 부정한 것의 <b>반대</b>를 불러요. 부정한 것은 ‘해야 하는 것’, 그 반대는 2번·7번에 되풀이되는 <b>what matters</b>(중요한 것)예요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (5번)</span><div class=\"en\"><mark>Instead</mark>, make goals based on <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span>.</span></div><p class=\"ko\"><mark>대신에</mark>, ( ? )에 기초하여 목표를 세워라</p></div><div class=\"ck-via\"><i>▼</i><span>Instead(대신에)는 앞에서 부정한 것의 반대를 불러요</span></div><div class=\"ck-step\"><span class=\"lab\">2번 문장 · Instead가 뒤집는 것</span><div class=\"en\">We set resolutions based on what we’re supposed to do, or what others think we’re supposed to do, rather than <mark>what really matters to us</mark>.</div><p class=\"ko\">우리는 <mark>우리에게 실제로 중요한 것</mark>보다는 우리가 해야 하는 것, 또는 다른 사람들이 우리가 해야 한다고 생각하는 것에 기초하여 결심을 한다.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>3번</em>남의 기준으로 세운 목표 → 고수가 거의 불가능</span><span><em>4번</em>‘해야 해서’ 하는 책 읽기 → 목표 도달이 어려움</span></div><div class=\"ck-eq\">⇒ 남이 정한 ‘해야 할 것’은 실패 → 빈칸은 그 반대인 ‘나에게 중요한 것’</div></div><div class=\"ck-via\"><i>▼</i><span>글의 요점(The idea)이 빈칸을 다시 한번 말해 줘요</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 문장 · 결정적 단서</span><div class=\"en\">The idea is to first consider <mark>what matters to you</mark>, then figure out what you need to do to get there.</div><p class=\"ko\">(이 글의) 요점은 <mark>당신에게 중요한 것</mark>을 먼저 고려하고, 그러고 나서 당신이 무엇을 해야 하는지를 파악하라는 것이다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">your own values 당신 자신의 가치관<small>2번 what really matters to us(우리에게 실제로 중요한 것)와 7번 what matters to you(당신에게 중요한 것)를 한 말로 받아요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">your moral duty 당신의 도덕적 의무</span><span class=\"why\">‘해야 할 것’이라 그럴듯하지만, 2번 what we’re supposed to do(우리가 해야 하는 것)가 바로 필자가 부정한 쪽이에요. 의무는 Instead(대신에)의 반대편이에요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">parental guidance 부모의 지도</span><span class=\"why\">2번 what others think(다른 사람들이 생각하는 것)에 들어가는 쪽이에요. 남이 정해 주는 기준이라 필자가 부정한 것과 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">a strict deadline 엄격한 마감 기한</span><span class=\"why\">마감 기한 이야기는 지문에 하나도 없어요. 지문은 ‘언제까지’가 아니라 7번처럼 ‘나에게 무엇이 중요한지’를 말해요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">job market trends 취업 시장 동향</span><span class=\"why\">취업 시장은 지문에 나오지 않아요. 바깥의 흐름을 따르는 것도 남의 기준이라 7번 what matters to you(당신에게 중요한 것)와 어긋나요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">It’s hard enough to stick with goals you want to accomplish,</div><div class=\"k\">당신이 성취하길 원하는 목표를 고수하는 것은 무척 어렵지만,</div></div><div class=\"rc\"><div class=\"e\">but sometimes we make goals</div><div class=\"k\">때때로 우리는 목표를 세운다</div></div><div class=\"rc\"><div class=\"e\">we’re not even thrilled about</div><div class=\"k\">우리가 심지어 신나하지도 않는</div></div><div class=\"rc\"><div class=\"e\">in the first place.</div><div class=\"k\">애초에.</div></div><div class=\"rnat\">당신이 성취하길 원하는 목표를 고수하는 것은 무척 어렵지만, 때때로 우리는 애초에 우리가 심지어 신나하지도 않는 목표를 세운다.</div><div class=\"rst\">하고 싶은 목표도 지키기 힘든데, 가끔은 별로 신나지도 않는 방학 목표를 세워요. = 지문 1번, 애초에 설레지 않는 목표예요.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">2번 · 단서</span><div class=\"rc\"><div class=\"e\">We set resolutions</div><div class=\"k\">우리는 결심을 한다</div></div><div class=\"rc\"><div class=\"e\">based on what we’re supposed to do,</div><div class=\"k\">우리가 해야 하는 것에 기초하여,</div></div><div class=\"rc\"><div class=\"e\">or what others think we’re supposed to do,</div><div class=\"k\">또는 다른 사람들이 우리가 해야 한다고 생각하는 것에,</div></div><div class=\"rc ckc\"><div class=\"e\">rather than <span class=\"cw\">what really matters to us</span>.</div><div class=\"k\"><span class=\"cw\">우리에게 실제로 중요한 것보다는</span>.</div></div><div class=\"rnat\">우리는 우리에게 실제로 중요한 것보다는 우리가 해야 하는 것, 또는 다른 사람들이 우리가 해야 한다고 생각하는 것에 기초하여 결심을 한다.</div><div class=\"rst\">방학 결심을 ‘해야 하니까’, ‘어른들이 하라니까’로 정해요. 지문 2번은 <b>정말 중요한 것</b>(what really matters to us)보다 그걸 따른대요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">This makes it nearly impossible</div><div class=\"k\">이것은 거의 불가능하게 만든다</div></div><div class=\"rc\"><div class=\"e\">to stick to the goal.</div><div class=\"k\">그 목표를 고수하는 것을.</div></div><div class=\"rnat\">이것은 그 목표를 고수하는 것을 거의 불가능하게 만든다.</div><div class=\"rst\">그러니 그 결심은 며칠 못 가요. 지문도 이게 목표를 지키는 걸 거의 불가능하게 만든다고 해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">For example, reading more is a good habit,</div><div class=\"k\">예를 들어, 책을 더 많이 읽는 것은 좋은 습관이지만,</div></div><div class=\"rc\"><div class=\"e\">but if you’re only doing it</div><div class=\"k\">만약 당신이 단지 그것을 하고 있다면</div></div><div class=\"rc\"><div class=\"e\">because you feel like that’s what you’re supposed to do,</div><div class=\"k\">그것이 당신이 해야 하는 것이라고 느끼기 때문에,</div></div><div class=\"rc\"><div class=\"e\">not because you actually want to learn more,</div><div class=\"k\">실제로 더 많이 배우기를 원하기 때문이 아니라,</div></div><div class=\"rc\"><div class=\"e\">you’re going to have a hard time reaching the goal.</div><div class=\"k\">당신은 목표에 도달하는 데 어려움을 겪을 것이다.</div></div><div class=\"rnat\">예를 들어, 책을 더 많이 읽는 것은 좋은 습관이지만, 만약 당신이 실제로 더 많이 배우기를 원하기 때문이 아니라, 그것이 당신이 해야 하는 것이라고 느끼기 때문에 단지 그것을 하고 있다면, 당신은 목표에 도달하는 데 어려움을 겪을 것이다.</div><div class=\"rst\">책 많이 읽기는 좋은 습관이지만, 궁금해서가 아니라 ‘해야 해서’ 읽으면 끝까지 못 가요. = 지문 4번의 예시예요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Instead</span>, make goals</div><div class=\"k\"><span class=\"cw\">대신에</span>, 목표를 세워라</div></div><div class=\"rc ckc\"><div class=\"e\">based on <span class=\"cw\">your own values</span>.</div><div class=\"k\"><span class=\"cw\">당신 자신의 가치관에 기초하여</span>. ※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rnat\">대신에, 당신 자신의 가치관에 기초하여 목표를 세워라.</div><div class=\"rst\"><b>대신에</b>(Instead) 내가 소중하게 여기는 것, 즉 <b>나 자신의 가치관</b>으로 목표를 세워요. 그래서 빈칸은 your own values(당신 자신의 가치관)예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Now, this isn’t to say</div><div class=\"k\">자, 이것은 말하는 것이 아니다</div></div><div class=\"rc\"><div class=\"e\">you should read less.</div><div class=\"k\">당신이 책을 덜 읽어야 한다고.</div></div><div class=\"rnat\">자, 이것은 당신이 책을 덜 읽어야 한다고 말하는 것이 아니다.</div><div class=\"rst\">그렇다고 책을 덜 읽으라는 말은 아니에요. 지문 6번이 이런 오해를 막아 줘요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">The idea is</div><div class=\"k\">(이 글의) 요점은</div></div><div class=\"rc ckc\"><div class=\"e\">to first consider <span class=\"cw\">what matters to you</span>,</div><div class=\"k\"><span class=\"cw\">당신에게 중요한 것을 먼저 고려하고</span>,</div></div><div class=\"rc\"><div class=\"e\">then figure out what you need to do</div><div class=\"k\">그러고 나서 당신이 무엇을 해야 하는지를 파악하라는 것이다,</div></div><div class=\"rc\"><div class=\"e\">to get there.</div><div class=\"k\">거기(= 목표)에 도달하기 위해.</div></div><div class=\"rnat\">(이 글의) 요점은 당신에게 중요한 것을 먼저 고려하고, 그러고 나서 거기(목표)에 도달하기 위해 당신이 무엇을 해야 하는지를 파악하라는 것이다.</div><div class=\"rst\">요점은 먼저 <b>나에게 중요한 것</b>(what matters to you)을 생각하고, 거기 가려면 뭘 할지 정하라는 거예요. 5번 빈칸을 다시 말한 문장이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"stick with\" data-m=\"~을 고수하다\"><b>stick with</b>~을 고수하다</button><button type=\"button\" class=\"wdb\" data-w=\"thrilled\" data-m=\"신이 난\"><b>thrilled</b>신이 난</button><button type=\"button\" class=\"wdb\" data-w=\"in the first place\" data-m=\"애초에\"><b>in the first place</b>애초에</button><button type=\"button\" class=\"wdb\" data-w=\"resolution\" data-m=\"결심, 다짐\"><b>resolution</b>결심, 다짐</button><button type=\"button\" class=\"wdb\" data-w=\"matter\" data-m=\"중요하다\"><b>matter</b>중요하다</button><button type=\"button\" class=\"wdb\" data-w=\"figure out\" data-m=\"~을 파악하다\"><b>figure out</b>~을 파악하다</button></div>"};
document.addEventListener('click',function(e){
 var b=e.target.closest('.stbtn');
 if(b){var box=b.closest('.rdb'),on=!box.classList.contains('story');box.classList.toggle('story',on);
  var L=[].slice.call(box.querySelectorAll('.rds'));L.forEach(function(x){x.classList.remove('lastv');x.style.order='';});
  if(on){L.sort(function(a,c){return (+a.dataset.ord)-(+c.dataset.ord);});L.forEach(function(x,i){x.style.order=i+1;});L[L.length-1].classList.add('lastv');}
  b.textContent=on?'문장별로 보기':'이야기로 이어 읽기';return;}
 var w=e.target.closest('.wdb');
 if(w){var on2=!w.classList.contains('on');w.classList.toggle('on',on2);
  try{if(window.WN){if(on2)WN.add([{w:w.dataset.w,m:w.dataset.m,src:'미니모고',how:'별표',ask:true}]);else if(WN.del)WN.del(w.dataset.w,'미니모고');}}catch(err){}
  var t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s';document.body.appendChild(t);}
  t.textContent=on2?'오답노트장에 담았어요':'오답노트장에서 뺐어요';t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(function(){t.style.opacity='0'},1600);}
});

/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  if(EXP[cq.q]){h+=EXP[cq.q]+'<button class="toq" data-i="'+i+'">빠른 정답으로</button>';return h+'</div></details>';}
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
  mmInit();
}
/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(S.sub&&!S.mmS){S.mmS=1;S.mmP=1;save();WN.hw(lv,day,S.sub.s+'/'+N+(S.mmD?' ✓':''));}else if(!S.sub&&!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
