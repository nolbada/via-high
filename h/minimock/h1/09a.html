=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">The opening celebration will be from 9 a.m. to 9 p.m.</div><div class=\"k\">개업 축하 행사는 오전 9시부터 오후 9시까지일 것이며</div></div><div class=\"rc\"><div class=\"e\">— a full 12 hours of fun!</div><div class=\"k\">— 무려 12시간 동안의 즐거움입니다!</div></div><div class=\"rnat\">개업 축하 행사는 오전 9시부터 오후 9시까지일 것이며, 무려 12시간 동안 즐거움이 있을 것입니다!</div><div class=\"rst\">“아침 9시부터 밤 9시까지 12시간 내내 행사가 있어요.” 지문 5번은 초대한 개업 축하 행사의 시간을 알려 줘요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">We would love to show you all</div><div class=\"k\">저희는 여러분께 모든 것을 보여드리고 싶고</div></div><div class=\"rc\"><div class=\"e\">the Raleigh store has to offer</div><div class=\"k\">Raleigh 매장이 제공할 수 있는</div></div><div class=\"rc ckc\"><div class=\"e\">and <span class=\"cw\">hope to see you there</span> on the 15th!</div><div class=\"k\">15일에 여러분을 그곳(= Raleigh 매장)에서 <span class=\"cw\">뵙기를 바랍니다</span>!</div></div><div class=\"rnat\">저희는 여러분께 Raleigh 매장이 제공할 수 있는 모든 것을 보여드리고 싶고, 15일에 여러분을 그곳에서 뵙기를 바랍니다!</div><div class=\"rst\">“새 가게 구경시켜 줄게요, 15일에 봐요!” 지문 6번도 <b>15일에 그곳에서 뵙기를</b> 바란다며 초대를 한 번 더 해요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Sincerely, Donna Deacon</div><div class=\"k\">진심을 담아, Donna Deacon 드림</div></div><div class=\"rnat\">진심을 담아, Donna Deacon 드림</div><div class=\"rst\">문자 끝에 사장님 이름이 붙듯, 지문도 보낸 사람 도나 디콘(Donna Deacon)의 이름으로 끝나요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"stationery\" data-m=\"문구류\"><b>stationery</b>문구류</button><button type=\"button\" class=\"wdb\" data-w=\"industry standard\" data-m=\"업계 표준\"><b>industry standard</b>업계 표준</button><button type=\"button\" class=\"wdb\" data-w=\"branch\" data-m=\"지점\"><b>branch</b>지점</button><button type=\"button\" class=\"wdb\" data-w=\"inviting\" data-m=\"매력적인\"><b>inviting</b>매력적인</button><button type=\"button\" class=\"wdb\" data-w=\"thrilled\" data-m=\"신이 난, 아주 기쁜\"><b>thrilled</b>신이 난, 아주 기쁜</button><button type=\"button\" class=\"wdb\" data-w=\"Grand Opening\" data-m=\"개점 행사, 개업식\"><b>Grand Opening</b>개점 행사, 개업식</button></div>", "02": "<p class=\"mtr\">마더텅 정답률 <b>65%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">밑줄 rise to the bait(미끼를 물다)는 <b>비유</b>예요. 미끼가 뭔지는 <b>3·4번</b>(일부러 화나게 하는 말), 그걸 물면 어떻게 되는지는 <b>5번</b>(침착함을 잃다)에서 찾아 속뜻으로 바꾸세요.</p><div class=\"ck-step\"><span class=\"lab\">밑줄 문장 (8번)</span><div class=\"en\">Indeed, any attentive listener will admire the fact that you didn’t “<mark>rise to the bait</mark>.”</div><p class=\"ko\">확실히, 주의를 기울이는 청자라면 누구든 당신이 ‘<mark>미끼를 물지(평정을 잃지)</mark>’ 않았다는 사실에 감탄할 것이다.</p></div><div class=\"ck-via\"><i>▼</i><span>bait(미끼) = 상대가 던지는 ‘나를 화나게 하려는’ 말</span></div><div class=\"ck-step key\"><span class=\"lab\">3번 문장 · 미끼의 정체</span><div class=\"en\">The point to remember is that sometimes in arguments the other person is trying <mark>to get you to be angry</mark>.</div><p class=\"ko\">기억해야 할 점은 때때로 논쟁에서 상대방이 <mark>당신을 화나게 하려고</mark> 노력하고 있다는 것이다.</p></div><div class=\"ck-via\"><i>▼</i><span>미끼를 문다 = 상대 뜻대로 침착함을 잃고 화를 내는 것</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 문장 · 미끼를 물면</span><div class=\"en\">They know that if they get you <mark>to lose your cool</mark> you’ll say something that sounds foolish; … it will be impossible for you to win the argument.</div><p class=\"ko\">그들이 <mark>당신의 침착함을 잃게</mark> 만들면 당신이 어리석게 들리는 말을 할 것이고, … 당신이 논쟁에서 이기는 것은 불가능해진다는 것을 그들은 안다.</p></div><div class=\"ck-via\"><i>▼</i><span>밑줄 앞 didn't(~하지 않았다)의 모습 = 침착하게 대답하기</span></div><div class=\"ck-step\"><span class=\"lab\">7번 문장 · 미끼를 안 문 행동</span><div class=\"en\">A remark may be made to cause your anger, but <mark>responding with a cool answer</mark> that focuses on the issue raised is likely to be most effective.</div><p class=\"ko\">당신의 화를 돋우기 위해 발언이 나올 수도 있지만, 제기된 쟁점에 초점을 맞춘 <mark>침착한 대답으로 대응하는 것이</mark> 가장 효과적일 것이다.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>bait</em>3·4번, 일부러 화나게 하려고 던진 말</span><span><em>rise to</em>덥석 물다 = 버럭 화를 내며 넘어가다</span><span><em>didn't</em>그러지 않았다 = 7번처럼 침착하게 대답했다</span></div><div class=\"ck-eq\">⇒ rise to the bait(미끼를 물다) = lose your temper(화를 내다) → ③</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">lose your temper 화를 내다, 평정심을 잃다<small>미끼(bait)를 문다는 건 5번처럼 상대 뜻대로 침착함을 잃는 것이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">stay calm 침착함을 유지하다</span><span class=\"why\">밑줄 앞의 didn't(~하지 않았다)까지 합쳐 읽으면 생기는 함정이에요. 칭찬받는 행동이 침착함이라서 고르기 쉽지만, 밑줄 rise to the bait(미끼를 물다)만 보면 화를 내는 쪽이에요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">blame yourself 자신을 탓하다</span><span class=\"why\">자기 자신을 탓하는 장면은 지문에 없어요. 미끼는 3·4번처럼 상대가 나를 화나게 하려고 던진 말이라 자책과는 상관없어요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">listen to the audience 청중의 말을 듣다</span><span class=\"why\">8번 attentive listener(주의를 기울이는 청자)를 보고 고르기 쉬워요. 하지만 청자는 감탄하는 사람일 뿐, 미끼를 무는 행동과는 관계없어요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">apologize for your behavior 자신의 행동을 사과하다</span><span class=\"why\">사과하는 이야기는 지문에 없어요. 5번은 미끼를 물면 화가 나서 논쟁에서 진다고 할 뿐이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">We all know</div><div class=\"k\">우리 모두는 안다</div></div><div class=\"rc\"><div class=\"e\">that tempers are one of the first things lost</div><div class=\"k\">평정이 가장 먼저 잃게 되는 것 중 하나라는 점을</div></div><div class=\"rc\"><div class=\"e\">in many arguments.</div><div class=\"k\">많은 논쟁에서.</div></div><div class=\"rnat\">우리 모두는 많은 논쟁에서 평정심이 가장 먼저 사라지는 것 중 하나라는 사실을 알고 있다.</div><div class=\"rst\">친구랑 말다툼하면 제일 먼저 날아가는 게 침착함이죠. = 지문 1번, 논쟁에서 <b>평정</b>(temper)을 가장 먼저 잃는다는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">It’s easy to say</div><div class=\"k\">말하기는 쉽다</div></div><div class=\"rc\"><div class=\"e\">one should keep cool,</div><div class=\"k\">침착함을 유지해야 한다고,</div></div><div class=\"rc\"><div class=\"e\">but how do you do it?</div><div class=\"k\">하지만 어떻게 그것(= 침착함을 유지하는 것)을 하는가?</div></div><div class=\"rnat\">침착함을 유지해야 한다고 말하기는 쉽지만, 대체 어떻게 그렇게 할 수 있을까?</div><div class=\"rst\">“화내지 마” 말하긴 쉬워도 막상 어떻게 참죠? 지문 2번도 침착하라(keep cool)는 말은 쉽지만 방법이 문제라고 해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">The point to remember is</div><div class=\"k\">기억해야 할 점은</div></div><div class=\"rc\"><div class=\"e\">that sometimes in arguments</div><div class=\"k\">때때로 논쟁에서</div></div><div class=\"rc ckc\"><div class=\"e\">the other person is trying <span class=\"cw\">to get you to be angry</span>.</div><div class=\"k\">상대방이 <span class=\"cw\">당신을 화나게 하려고</span> 노력하고 있다는 것이다.</div></div><div class=\"rnat\">기억해야 할 점은, 때때로 논쟁에서 상대방이 당신을 화나게 만들려고 애쓰고 있다는 것이다.</div><div class=\"rst\">기억할 점! 친구가 나를 <b>일부러 화나게 하려고</b> 할 때가 있어요. 지문 3번이 바로 이 말이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">They may be saying things</div><div class=\"k\">그들(= 논쟁 상대방)은 무언가를 말하고 있을지도 모른다</div></div><div class=\"rc\"><div class=\"e\">that are intentionally designed to annoy you.</div><div class=\"k\">당신을 짜증나게 하려고 의도적으로 계획된.</div></div><div class=\"rnat\">그들은 일부러 당신을 짜증나게 하려고 고안된 말을 하고 있는 것일 수도 있다.</div><div class=\"rst\">“너 그것도 못 해?”처럼 약 올리려고 고른 말이에요. = 지문 4번, 짜증 나게 하려고 <b>의도적으로</b>(intentionally) 만든 말이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">They know that</div><div class=\"k\">그들(= 논쟁 상대방)은 안다</div></div><div class=\"rc ckc\"><div class=\"e\">if they get you <span class=\"cw\">to lose your cool</span></div><div class=\"k\">그들이 <span class=\"cw\">당신의 침착함을 잃게</span> 만들면</div></div><div class=\"rc\"><div class=\"e\">you’ll say something that sounds foolish;</div><div class=\"k\">당신이 어리석게 들리는 무언가를 말할 것이며;</div></div><div class=\"rc\"><div class=\"e\">you’ll simply get angry</div><div class=\"k\">당신은 그저 화가 날 것이고</div></div><div class=\"rc\"><div class=\"e\">and then it will be impossible for you to win the argument.</div><div class=\"k\">그렇게 되면 당신이 논쟁에서 이기는 것은 불가능해질 것이라는 것을.</div></div><div class=\"rnat\">그들은 자신들이 당신을 침착함을 잃게 만들면 당신이 어리석게 들리는 말을 하게 될 것이고, 당신은 그저 화만 내다가 결국 논쟁에서 이길 수 없게 되리라는 것을 알고 있다.</div><div class=\"rst\">내가 버럭하면 엉뚱한 말이 튀어나와 결국 말싸움에서 져요. 지문 5번처럼 <b>침착함을 잃으면</b>(lose your cool) 이길 수 없어요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">So don’t fall for it.</div><div class=\"k\">그러므로 그것(= 상대가 화를 돋우려는 시도)에 속지 마라.</div></div><div class=\"rnat\">그러니 거기에 넘어가지 마라.</div><div class=\"rst\">그러니 그 작전에 속지 마요. 지문 6번의 don't fall for it(그것에 속지 마라)이 이 말이에요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">A remark may be made</div><div class=\"k\">발언이 이루어질 수도 있지만</div></div><div class=\"rc\"><div class=\"e\">to cause your anger,</div><div class=\"k\">당신의 화를 돋우기 위해,</div></div><div class=\"rc ckc\"><div class=\"e\">but <span class=\"cw\">responding with a cool answer</span></div><div class=\"k\"><span class=\"cw\">침착한 대답으로 대응하는 것이</span></div></div><div class=\"rc\"><div class=\"e\">that focuses on the issue raised</div><div class=\"k\">제기된 쟁점에 초점을 맞춘</div></div><div class=\"rc\"><div class=\"e\">is likely to be most effective.</div><div class=\"k\">가장 효과적일 것이다.</div></div><div class=\"rnat\">당신을 화나게 하려고 어떤 발언이 나올 수도 있지만, 제기된 쟁점에 초점을 맞춘 침착한 대답으로 대응하는 것이 가장 효과적일 가능성이 크다.</div><div class=\"rst\">약 올리는 말에도 차분하게 “그래서 숙제는 어떻게 할까?” 하고 원래 문제로 돌아가요. = 지문 7번, <b>침착한 대답</b>이 가장 효과적이에요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc\"><div class=\"e\">Indeed,</div><div class=\"k\">확실히,</div></div><div class=\"rc\"><div class=\"e\">any attentive listener will admire the fact</div><div class=\"k\">주의를 기울이는 청자라면 누구든 그 사실에 감탄할 것이다</div></div><div class=\"rc ckc\"><div class=\"e\">that you didn’t “<span class=\"cw\">rise to the bait</span>.”</div><div class=\"k\">당신이 ‘<span class=\"cw\">미끼를 물지(평정을 잃지)</span>’ 않았다는.</div></div><div class=\"rnat\">실제로 주의 깊은 청자라면 누구나 당신이 '미끼를 물지' 않았다는 사실에 감탄할 것이다.</div><div class=\"rst\">옆에서 보던 친구들은 “쟤 안 넘어갔네” 하고 감탄해요. <b>미끼를 문다</b>(rise to the bait) = 화를 낸다라서 밑줄은 ③이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"temper\" data-m=\"평정심, 화\"><b>temper</b>평정심, 화</button><button type=\"button\" class=\"wdb\" data-w=\"keep cool\" data-m=\"침착함을 유지하다\"><b>keep cool</b>침착함을 유지하다</button><button type=\"button\" class=\"wdb\" data-w=\"intentionally\" data-m=\"의도적으로, 일부러\"><b>intentionally</b>의도적으로, 일부러</button><button type=\"button\" class=\"wdb\" data-w=\"fall for\" data-m=\"~에 속다\"><b>fall for</b>~에 속다</button><button type=\"button\" class=\"wdb\" data-w=\"remark\" data-m=\"발언\"><b>remark</b>발언</button><button type=\"button\" class=\"wdb\" data-w=\"rise to the bait\" data-m=\"미끼를 물다\"><b>rise to the bait</b>미끼를 물다</button></div>", "03": "<p class=\"mtr\">마더텅 정답률 <b>75%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">제목은 <b>but</b>(하지만)으로 뒤집는 2번과, 그걸 우리 모두로 넓히는 <b>Indeed</b>(사실)의 3번을 묶으세요. 5번 <b>no less marvelous</b>(못지않게 경이로운)가 결론을 못 박아요.</p><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 화제 소개</span><div class=\"en\">You might have heard of such stories of <mark>expert intuition</mark>: …</div><p class=\"ko\">여러분은 <mark>전문가의 직관</mark>에 관한 이런 이야기들을 들어봤을지도 모른다: …</p></div><div class=\"ck-via\"><i>▼</i><span>체스 달인·의사 이야기를 ‘마법’이라 여기는 생각을 but(하지만)으로 뒤집어요</span></div><div class=\"ck-step\"><span class=\"lab\">2번 문장 · 뒤집기</span><div class=\"en\">Expert intuition strikes us as magical, <mark>but it is not</mark>.</div><p class=\"ko\">전문가의 직관은 우리에게 마법과 같은 인상을 주지만, <mark>그렇지 않다(= 마법이 아니다)</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>마법이 아니라면? 우리 각자도 매일 한다고 범위를 넓혀요</span></div><div class=\"ck-step key\"><span class=\"lab\">3번 문장 · 결정적 단서</span><div class=\"en\">Indeed, <mark>each of us</mark> performs feats of intuitive expertise <mark>many times each day</mark>.</div><p class=\"ko\">사실, <mark>우리 각자는</mark> <mark>매일 여러 번</mark> 직관적인 전문 지식의 위업을 이룬다.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>4번</em>전화 첫 마디만 듣고 상대가 화난 걸 알아챔</span><span><em>4번</em>방에 들어서며 내 얘기 중이었음을 눈치챔</span></div><div class=\"ck-eq\">⇒ 평범한 우리가 매일 하는 직관 = 3번의 증거</div></div><div class=\"ck-via\"><i>▼</i><span>일상 직관도 전문가 못지않고, 더 흔할 뿐이라고 닫아요</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 문장 · 결론</span><div class=\"en\">Our everyday intuitive abilities are <mark>no less marvelous than</mark> the striking insights of an experienced chess master or physician — <mark>only more common</mark>.</div><p class=\"ko\">우리의 일상의 직관적 능력은 경험 많은 체스 달인이나 의사의 인상적인 통찰력 <mark>못지않게 경이롭다</mark> — <mark>단지 더 흔할 뿐이다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">Intuitive Expertise(직관적 전문성): Not Only for Experts(전문가만을 위한 것이 아님)<small>3번 each of us(우리 각자)와 5번 only more common(단지 더 흔할 뿐)을 한 줄로 담았어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">Intuition(직관): A Magician's Basic Qualification(마술사의 기본 자격)</span><span class=\"why\">[반대] 2번 magical(마법 같은)만 따온 함정이에요. 글은 바로 but it is not(하지만 그렇지 않다)으로 ‘마법이 아니다’라고 뒤집어요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">Don't Make a Phone Call in Anger(화난 채로 전화하지 마라)!</span><span class=\"why\">[범위 좁음] 4번 telephone call(전화 통화)은 일상 직관의 예시일 뿐이에요. 전화 예절을 조언하는 글이 아니에요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">Collect More Evidence(증거를 더 모아라), Be More Intelligent(더 똑똑해져라)</span><span class=\"why\">[지문에 없음] 증거를 모으라는 말은 한 번도 안 나와요. 1번 의사도 환자를 단 한 번 흘끗 보고(a single glance) 진단해요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">Intuition Will Never Beat Experience(직관은 결코 경험을 이길 수 없다)</span><span class=\"why\">[반대] 5번은 일상 직관이 경험 많은 달인의 통찰 못지않다(no less marvelous)고 해요. 직관을 깎아내리는 글이 아니에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">You might have heard of such stories of expert intuition:</div><div class=\"k\">여러분은 전문가의 직관에 관한 이런 이야기들을 들어봤을지도 모른다:</div></div><div class=\"rc\"><div class=\"e\">the chess master who walks past a street game</div><div class=\"k\">길거리 게임을 지나치는 체스 달인</div></div><div class=\"rc\"><div class=\"e\">and announces “White mates in three” without stopping,</div><div class=\"k\">그리고 멈추지도 않고 “흰색 말로 세 수 안에 체크메이트”라고 알려주는,</div></div><div class=\"rc\"><div class=\"e\">or the physician who makes a complex diagnosis</div><div class=\"k\">혹은 복잡한 진단을 내리는 의사</div></div><div class=\"rc\"><div class=\"e\">after a single glance at a patient.</div><div class=\"k\">환자를 단 한 번 흘끗 본 후에.</div></div><div class=\"rnat\">여러분은 전문가의 직관에 관한 이런 이야기들을 들어봤을지도 모른다: 길거리 체스 게임을 멈추지도 않고 지나치면서 '흰색 말로 세 수 안에 체크메이트'라고 선언하는 체스 달인, 혹은 환자를 한 번 흘끗 보고 복잡한 진단을 내리는 의사 이야기 말이다.</div><div class=\"rst\">축구부 주장은 경기를 한 번 보고도 “쟤 다음에 왼쪽으로 찬다” 하고 맞혀요. = 지문 1번의 체스 달인·의사 같은 <b>전문가의 직관</b>이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Expert intuition strikes us as magical,</div><div class=\"k\">전문가의 직관은 우리에게 마법과 같은 인상을 주지만,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">but it is not</span>.</div><div class=\"k\"><span class=\"cw\">그렇지 않다(= 마법이 아니다)</span>.</div></div><div class=\"rnat\">전문가의 직관은 우리에게 마법처럼 느껴지지만, 사실 그렇지 않다.</div><div class=\"rst\">친구들은 “마법 같아!” 하죠. 하지만 지문 2번은 <b>그렇지 않다</b>(but it is not), 마법이 아니라고 해요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc\"><div class=\"e\">Indeed,</div><div class=\"k\">사실,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">each of us</span> performs feats of intuitive expertise</div><div class=\"k\"><span class=\"cw\">우리 각자는</span> 직관적인 전문 지식의 위업을 이룬다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">many times each day</span>.</div><div class=\"k\"><span class=\"cw\">매일 여러 번</span>.</div></div><div class=\"rnat\">실제로 우리 각자는 매일 여러 차례 직관적인 전문성을 발휘한다.</div><div class=\"rst\"><b>사실</b>(Indeed) 우리도 하루에 몇 번씩 그런 직관을 써요. 지문 3번처럼 <b>우리 각자</b>가 매일 해내요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Most of us are pitch-perfect</div><div class=\"k\">우리 대부분은 정확하며</div></div><div class=\"rc\"><div class=\"e\">in detecting anger</div><div class=\"k\">분노를 감지하는 데</div></div><div class=\"rc\"><div class=\"e\">in the first word of a telephone call</div><div class=\"k\">전화 통화의 첫 마디에서</div></div><div class=\"rc\"><div class=\"e\">and recognize</div><div class=\"k\">(우리는) 알아차린다</div></div><div class=\"rc\"><div class=\"e\">as we enter a room</div><div class=\"k\">방에 들어갈 때</div></div><div class=\"rc\"><div class=\"e\">that we were the subject of the conversation.</div><div class=\"k\">우리가 대화의 주제였다는 것을.</div></div><div class=\"rnat\">우리 대부분은 전화 통화의 첫마디만 듣고도 상대가 화가 났는지 정확히 감지하며, 방에 들어서는 순간 우리가 방금 그 대화의 화제였다는 것을 알아차린다.</div><div class=\"rst\">친구가 전화로 “여보세요” 한마디만 해도 화난 걸 알고, 교실에 들어서면 내 얘기 중이었던 걸 눈치채요. = 지문 4번이에요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">Our everyday intuitive abilities</div><div class=\"k\">우리의 일상의 직관적 능력은</div></div><div class=\"rc ckc\"><div class=\"e\">are <span class=\"cw\">no less marvelous than</span></div><div class=\"k\"><span class=\"cw\">~보다 덜 경이롭지 않다(못지않게 경이롭다)</span></div></div><div class=\"rc\"><div class=\"e\">the striking insights of an experienced chess master or physician</div><div class=\"k\">경험 많은 체스 달인이나 의사의 인상적인 통찰력</div></div><div class=\"rc ckc\"><div class=\"e\">— <span class=\"cw\">only more common</span>.</div><div class=\"k\">— <span class=\"cw\">단지 더 흔할 뿐이다</span>.</div></div><div class=\"rnat\">우리의 일상적인 직관 능력은 노련한 체스 달인이나 의사의 인상적인 통찰력에 결코 뒤지지 않는다 — 다만 더 흔할 뿐이다.</div><div class=\"rst\">결국 내 눈치도 주장의 직관 <b>못지않게 놀라워요</b>(no less marvelous). <b>더 흔할 뿐</b>이죠. 그래서 지문 5번의 결론은 “전문가만의 것이 아닌 직관”이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"expert intuition\" data-m=\"전문가의 직관\"><b>expert intuition</b>전문가의 직관</button><button type=\"button\" class=\"wdb\" data-w=\"physician\" data-m=\"의사\"><b>physician</b>의사</button><button type=\"button\" class=\"wdb\" data-w=\"feat\" data-m=\"위업, 놀라운 솜씨\"><b>feat</b>위업, 놀라운 솜씨</button><button type=\"button\" class=\"wdb\" data-w=\"detect\" data-m=\"감지하다\"><b>detect</b>감지하다</button><button type=\"button\" class=\"wdb\" data-w=\"marvelous\" data-m=\"경이로운\"><b>marvelous</b>경이로운</button><button type=\"button\" class=\"wdb\" data-w=\"striking\" data-m=\"인상적인\"><b>striking</b>인상적인</button></div>", "04": "<p class=\"mtr\">마더텅 정답률 <b>75%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">요지는 <b>That's why</b>(그래서 ~이다) 뒤에 나와요. 1~4번이 문제(경쟁자가 없는 듯 광고 → 실패)와 원인을 말하고, 5번이 해결책, 6번은 그 <b>예시</b>예요.</p><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 문제 제기</span><div class=\"en\">Too many companies advertise their new products <mark>as if their competitors did not exist</mark>.</div><p class=\"ko\">너무나 많은 회사들이 <mark>마치 그들의 경쟁자들이 존재하지 않는 것처럼</mark> 그들의 신제품을 광고한다.</p></div><div class=\"ck-via\"><i>▼</i><span>왜 메시지가 안 먹힐까? 이전 것과 대비하지 않아서예요</span></div><div class=\"ck-step\"><span class=\"lab\">3번 문장 · 실패의 원인</span><div class=\"en\">Introducing a new product category is difficult, especially if the new category <mark>is not contrasted against the old one</mark>.</div><p class=\"ko\">새로운 제품 종류를 소개하는 것은 어렵다, 특히 새로운 카테고리가 <mark>이전의 것과 대비되지 않는다면</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>That's why(그래서)로 앞의 문제를 풀 해결책을 내놓아요</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 문장 · 결정적 해결책</span><div class=\"en\"><mark>That’s why</mark> if you have a truly new product, it’s often better to say <mark>what the product is not</mark>, rather than what it is.</div><p class=\"ko\"><mark>그래서</mark> 정말로 새로운 제품을 가지고 있다면, 그것이 무엇인지보다는 <mark>그 제품이 무엇이 아닌지를</mark> 말하는 게 보통 더 낫다.</p></div><div class=\"ck-via\"><i>▼</i><span>For example(예를 들어)로 해결책을 실제 이름에 적용해요</span></div><div class=\"ck-step\"><span class=\"lab\">6번 문장 · 예시</span><div class=\"en\">For example, the first automobile was called a <mark>“horseless” carriage</mark>, … against the existing mode of transportation.</div><p class=\"ko\">예를 들어, 최초의 자동차는 <mark>‘말이 필요 없는’ 수레</mark>라고 불렸는데, 이 이름은 대중이 기존의 교통수단 방식과 비교해서 그 개념을 이해하게 해 주었다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">기존 제품과의 대비가 신제품 광고에 효과적이다.<small>3번 contrasted(대비되는)와 5번 what the product is not(그 제품이 무엇이 아닌지)을 그대로 옮겼어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">제품에 대한 올바른 정보 제공이 소비자의 신뢰를 높인다.</span><span class=\"why\">[지문에 없음] 5번 ‘무엇이 아닌지 말하라’를 정보 제공으로 착각하기 쉬워요. 핵심은 정확한 정보가 아니라 기존 것과의 대비이고, 신뢰 이야기는 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">과도한 광고 경쟁이 제품의 가격을 상승시킨다.</span><span class=\"why\">[지문에 없음] 1번에 competitors(경쟁자들)가 나오지만, 광고 경쟁 때문에 가격이 오른다는 말은 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">신제품 개발을 위해 정확한 수요 예측이 필요하다.</span><span class=\"why\">[지문에 없음] 지문은 이미 있는 신제품을 어떻게 광고할지를 말해요. 수요를 예측하라는 말은 한 번도 안 나와요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">수익 향상을 위해 새로운 고객 관리 방식이 요구된다.</span><span class=\"why\">[지문에 없음] 고객 관리나 수익 얘기는 없어요. 4번 Consumers(소비자들)는 새것이 옛것과 관련 있어야 관심을 둔다는 말뿐이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Too many companies advertise their new products</div><div class=\"k\">너무나 많은 회사들이 그들의 신제품을 광고한다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">as if their competitors did not exist</span>.</div><div class=\"k\"><span class=\"cw\">마치 그들의 경쟁자들이 존재하지 않는 것처럼</span>.</div></div><div class=\"rnat\">너무 많은 회사들이 마치 경쟁사가 존재하지 않는 것처럼 신제품을 광고한다.</div><div class=\"rst\">축제 부스에서 처음 보는 간식을 팔면서, 옆 반 떡볶이는 없는 척 홍보해요. = 지문 1번, <b>경쟁자가 없는 것처럼</b> 광고한다는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">They advertise their products in a vacuum</div><div class=\"k\">그들(= 너무나 많은 회사들)은 자신의 제품을 고립 상태에서 광고하고</div></div><div class=\"rc\"><div class=\"e\">and are disappointed</div><div class=\"k\">실망한다</div></div><div class=\"rc\"><div class=\"e\">when their messages fail to get through.</div><div class=\"k\">그들의 메시지가 전달되는 데 실패했을 때.</div></div><div class=\"rnat\">그들은 자기 제품을 고립 상태에서 광고하고, 메시지가 전달되지 않으면 실망한다.</div><div class=\"rst\">“새 간식 있어요!”만 외치니 아무도 안 와서 실망해요. 지문 2번처럼 메시지가 전달되지 못한 거예요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc\"><div class=\"e\">Introducing a new product category is difficult,</div><div class=\"k\">새로운 제품 종류를 소개하는 것은 어렵다,</div></div><div class=\"rc\"><div class=\"e\">especially if the new category</div><div class=\"k\">특히 새로운 카테고리가</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">is not contrasted against the old one</span>.</div><div class=\"k\"><span class=\"cw\">이전의 것과 대비되지 않는다면</span>.</div></div><div class=\"rnat\">새로운 제품군을 소개하는 일은 어렵다, 특히 그 새 범주가 기존의 것과 대비되지 않는다면 더욱 그렇다.</div><div class=\"rst\">처음 보는 간식은 원래 소개하기 어려워요. 특히 다들 아는 간식과 <b>비교해 주지 않으면</b>요. = 지문 3번이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Consumers do not usually pay attention</div><div class=\"k\">소비자들은 일반적으로 관심을 갖지 않는다</div></div><div class=\"rc\"><div class=\"e\">to what’s new and different</div><div class=\"k\">새롭고 다른 것에 대해</div></div><div class=\"rc\"><div class=\"e\">unless it’s related to the old.</div><div class=\"k\">그것(= 새롭고 다른 것)이 이전의 것과 관련 있지 않는 한.</div></div><div class=\"rnat\">소비자는 보통 기존의 것과 관련이 있지 않으면 무엇이 새롭고 다른지에 관심을 두지 않는다.</div><div class=\"rst\">친구들은 아는 것과 이어져야 새것에 눈길을 줘요. 지문 4번, 소비자는 옛것과 관련 없으면 새것에 관심이 없대요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">That’s why</span></div><div class=\"k\"><span class=\"cw\">그것이 ~한 이유이다</span></div></div><div class=\"rc\"><div class=\"e\">if you have a truly new product,</div><div class=\"k\">당신이 정말로 새로운 제품을 가지고 있다면,</div></div><div class=\"rc\"><div class=\"e\">it’s often better to say</div><div class=\"k\">말하는 게 보통 더 낫다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">what the product is not</span>,</div><div class=\"k\"><span class=\"cw\">그 제품이 무엇이 아닌지를</span>,</div></div><div class=\"rc\"><div class=\"e\">rather than what it is.</div><div class=\"k\">그것이 무엇인지보다는.</div></div><div class=\"rnat\">그래서 정말로 새로운 제품을 가지고 있다면, 그 제품이 무엇인지보다는 무엇이 아닌지를 말하는 편이 흔히 더 낫다.</div><div class=\"rst\"><b>그래서</b>(That's why) “안 매운 떡볶이예요!”처럼 무엇이 <b>아닌지</b>를 말하는 게 나아요. 지문 5번이 요지예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">For example,</div><div class=\"k\">예를 들어,</div></div><div class=\"rc ckc\"><div class=\"e\">the first automobile was called a <span class=\"cw\">“horseless” carriage</span>,</div><div class=\"k\">최초의 자동차는 <span class=\"cw\">‘말이 필요 없는’ 수레</span>라고 불렸는데,</div></div><div class=\"rc\"><div class=\"e\">a name which allowed the public</div><div class=\"k\">이 이름은(= ‘말이 필요 없는 수레’) 대중들이 ~하게 해 주었다</div></div><div class=\"rc\"><div class=\"e\">to understand the concept</div><div class=\"k\">그 개념을 이해할 수 있게</div></div><div class=\"rc\"><div class=\"e\">against the existing mode of transportation.</div><div class=\"k\">기존의 교통수단 방식과 비교해서.</div></div><div class=\"rnat\">예를 들어, 최초의 자동차는 '말이 필요 없는' 수레라고 불렸는데, 이는 대중이 기존의 이동 수단과 대비해서 그 개념을 이해하도록 해 주었다.</div><div class=\"rst\">옛날 자동차도 “말 없는 마차”라고 불려서 사람들이 바로 알아들었어요. 지문 6번이 5번의 예시예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"competitor\" data-m=\"경쟁자\"><b>competitor</b>경쟁자</button><button type=\"button\" class=\"wdb\" data-w=\"vacuum\" data-m=\"진공 상태, 고립 상태\"><b>vacuum</b>진공 상태, 고립 상태</button><button type=\"button\" class=\"wdb\" data-w=\"contrast\" data-m=\"대비하다\"><b>contrast</b>대비하다</button><button type=\"button\" class=\"wdb\" data-w=\"category\" data-m=\"종류, 범주\"><b>category</b>종류, 범주</button><button type=\"button\" class=\"wdb\" data-w=\"existing\" data-m=\"기존의\"><b>existing</b>기존의</button><button type=\"button\" class=\"wdb\" data-w=\"mode of transportation\" data-m=\"교통수단\"><b>mode of transportation</b>교통수단</button></div>", "05": "<p class=\"mtr\">마더텅 정답률 <b>50%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">긴 주어가 나오면 <b>주어가 어디서 끝나는지</b> 끊고, 그 뒤에 <b>본동사</b>가 있는지 보세요. 동명사 주어 뒤인데 동사가 없으면 being(~인 것)이 아니라 <b>is</b>(~이다)예요.</p><div class=\"ck-step\"><span class=\"lab\">문제지 ④번 자리 (5번)</span><div class=\"en\">Thinking of himself as a boy who is smart and knows how to do things <u>④ being</u> likely to make him endure longer …</div><p class=\"ko\">자기 자신을 똑똑한 소년이라고 여기는 것은 ( ? ) 그가 더 오래 지속하게 할 가능성이 — 본동사가 안 보여요</p></div><div class=\"ck-via\"><i>▼</i><span>맨 앞 Thinking(여기는 것)부터 things(일)까지가 한 덩어리 주어예요</span></div><div class=\"ck-step\"><span class=\"lab\">주어 찾기</span><div class=\"en\"><mark>Thinking of himself as a boy</mark> who is smart and knows how to do things</div><p class=\"ko\"><mark>자기 자신을</mark> 똑똑하고 일을 어떻게 할지 아는 <mark>소년이라고 여기는 것은</mark></p></div><div class=\"ck-via\"><i>▼</i><span>주어 다음엔 본동사가 와야 해요. being(~인 것)은 동사가 아니니 is(~이다)로!</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 문장 · 결정적 단서</span><div class=\"en\"><mark>is likely to make him</mark> endure longer in problem-solving efforts</div><p class=\"ko\">그가 문제 해결 노력을 더 오래 지속하게 <mark>할 가능성이 크다</mark></p></div><div class=\"ck-via\"><i>▼</i><span>6번은 똑같은 동명사 주어인데 본동사 will make(만들 것이다)가 제대로 있어요</span></div><div class=\"ck-step\"><span class=\"lab\">6번 문장 · 같은 구조 비교</span><div class=\"en\">Similarly, thinking of himself as the kind of boy who is a good helper <mark>will make him</mark> more likely to volunteer to help …</div><p class=\"ko\">마찬가지로, 자기 자신을 잘 도와주는 부류의 소년이라고 생각하는 것은 그가 돕겠다고 자원할 가능성이 더 커지게 <mark>만든다</mark></p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">동명사 주어(~하는 것) 뒤의 본동사</p><p class=\"gr\">동명사 주어(~하는 것) 뒤에는 꼭 본동사가 있어야 해요. being(~인 것)은 동사 역할을 못 하고, 동명사 주어는 하나로 보니 is(~이다)를 써요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>Playing games is fun.</div><div class=\"ko\">게임하는 것은 재미있다. (주어 Playing games 게임하는 것 뒤에 본동사 is가 있어서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>Playing games being fun.</div><div class=\"ko\">being(~인 것)은 동사가 아니라 문장에 본동사가 없어서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>Reading books makes me happy.</div><div class=\"ko\">책을 읽는 것은 나를 행복하게 한다. (본동사 makes 만든다가 있어서 맞아요)</div></div><p class=\"gb\">지문 5번도 주어 Thinking of himself as a boy(자신을 소년으로 여기는 것)가 관계절(who is smart and knows how to do things 똑똑하고 일을 할 줄 아는)까지 이어진 뒤 본동사 자리예요. 그래서 being(~인 것)이 아니라 is(~이다)예요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">being → is ~이다<small>동명사 주어(Thinking of himself 자신을 여기는 것) 뒤에 본동사가 없으니 is(~이다)로 고쳐요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">them 그들에게</span><span class=\"why\">2번 what their parents tell them(부모가 그들에게 하는 말)에서 them(그들에게)은 tell(말하다)의 대상이에요. 말하는 사람(their parents 부모)과 듣는 사람이 달라서 themselves(그들 자신)가 아니라 them(그들에게)이 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">목적격 대명사: tell(말하다) + 사람(them 그들에게)</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>My parents tell me stories.</div><div class=\"ko\">부모님은 나에게 이야기를 해 주신다. (tell 다음 사람 자리에 목적격 me 나에게가 와서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>Kids believe what their parents tell they.</div><div class=\"ko\">tell(말하다) 뒤 대상 자리에 주격 they(그들은)를 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>Kids believe what their parents tell them.</div><div class=\"ko\">아이들은 부모가 그들에게 하는 말을 믿는다. (them 그들에게 = 아이들이라 맞아요)</div></div><p class=\"gb\">지문 2번도 parents(부모)가 Preschoolers(미취학 아동)에게 말하는 것이라 목적격 them(그들에게)이 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">analytically 분석적으로</span><span class=\"why\">3번 to reason analytically(분석적으로 추론하다)에서 analytically(분석적으로)는 동사 reason(추론하다)을 꾸며요. 동사를 꾸미는 자리라 형용사 analytical(분석적인)이 아니라 부사가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">부사: 동사 reason(추론하다)을 꾸미는 자리에는 analytically(분석적으로)</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>She speaks quietly.</div><div class=\"ko\">그녀는 조용히 말한다. (동사 speaks 말하다를 꾸미니 부사 quietly 조용히가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>She speaks quiet.</div><div class=\"ko\">quiet(조용한)는 형용사라 동사 speaks(말하다)를 꾸밀 수 없어서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>He thinks carefully.</div><div class=\"ko\">그는 신중하게 생각한다. (동사 thinks 생각하다를 부사 carefully 신중하게가 꾸며서 맞아요)</div></div><p class=\"gb\">지문 3번도 reason(추론하다)을 어떻게 하는지 말해 주니 부사 analytically(분석적으로)가 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">that ~라는 것</span><span class=\"why\">4번 hears from his mother(어머니로부터 듣다) 뒤의 he is smart(그가 똑똑하다)는 주어·동사가 다 갖춰진 완전한 절이에요. 그래서 들은 내용을 이끄는 접속사 that(~라는 것)이 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">접속사 that(~라는 것) + 완전한 절</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I heard that he is kind.</div><div class=\"ko\">나는 그가 친절하다는 것을 들었다. (he is kind 그가 친절하다가 완전한 절이라 that이 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I heard what he is kind.</div><div class=\"ko\">he is kind(그가 친절하다)는 빠진 자리가 없는데 what(~하는 것)을 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>I like what he made.</div><div class=\"ko\">나는 그가 만든 것이 좋다. (made 만들었다 뒤 목적어가 비어서 이때는 what이 맞아요)</div></div><p class=\"gb\">지문 4번도 he is smart and a good helper(그가 똑똑하고 잘 도와준다)가 완전한 절이라 that(~라는 것)이 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">to help 돕겠다고</span><span class=\"why\">6번 volunteer to help(돕겠다고 자원하다)에서 volunteer(자원하다)는 뒤에 to(~하겠다고) + 동사원형을 써요. 그래서 to help(돕겠다고)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">volunteer(자원하다) + to(~하겠다고) + 동사원형</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I volunteered to clean the room.</div><div class=\"ko\">나는 방을 청소하겠다고 자원했다. (volunteered 다음 to clean 청소하겠다고가 와서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I volunteered cleaning the room.</div><div class=\"ko\">volunteer(자원하다) 뒤에 cleaning(청소하는 것)을 써서 틀려요.</div></div><p class=\"gb\">지문 6번도 likely to volunteer(자원할 가능성이 있는) 뒤에 to help(돕겠다고)가 이어져서 맞아요.</p></div></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Although praise is one of the most powerful tools</div><div class=\"k\">칭찬은 가장 강력한 도구 중 하나이지만</div></div><div class=\"rc\"><div class=\"e\">available for improving young children’s behavior,</div><div class=\"k\">어린 아이들의 행동을 개선하기 위해 이용할 수 있는,</div></div><div class=\"rc\"><div class=\"e\">it is equally powerful</div><div class=\"k\">그것(= 칭찬)은 마찬가지로 강력하다</div></div><div class=\"rc\"><div class=\"e\">for improving your child’s self-esteem.</div><div class=\"k\">아이의 자존감 향상에도.</div></div><div class=\"rnat\">칭찬은 어린아이의 행동을 개선하는 데 이용할 수 있는 가장 강력한 도구 중 하나이지만, 자녀의 자존감을 높이는 데에도 마찬가지로 강력하다.</div><div class=\"rst\">칭찬은 아이의 행동을 고치는 데도, <b>자존감</b>(self-esteem)을 키우는 데도 똑같이 힘이 세요. 이 글의 화제는 칭찬의 힘이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Preschoolers believe</div><div class=\"k\">미취학 아동은 믿는다</div></div><div class=\"rc\"><div class=\"e\">what their parents tell them</div><div class=\"k\">자기 부모가 그들(= 미취학 아동)에게 하는 말을</div></div><div class=\"rc\"><div class=\"e\">in a very profound way.</div><div class=\"k\">매우 깊게.</div></div><div class=\"rnat\">미취학 아동은 부모가 그들에게 하는 말을 아주 깊이 믿는다.</div><div class=\"rst\">어린아이는 부모가 해 주는 말을 아주 깊이 믿어요. 부모가 아이들에게 말하니 목적격 <b>them</b>(그들에게)이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">They do not yet have the cognitive sophistication</div><div class=\"k\">그들(= 미취학 아동)은 인지적 정교함을 아직 지니고 있지 않다</div></div><div class=\"rc\"><div class=\"e\">to reason analytically</div><div class=\"k\">분석적으로 추론하고</div></div><div class=\"rc\"><div class=\"e\">and reject false information.</div><div class=\"k\">틀린 정보를 거부할.</div></div><div class=\"rnat\">그들은 아직 분석적으로 추론하고 잘못된 정보를 거부할 만큼의 인지적 정교함을 갖추고 있지 않다.</div><div class=\"rst\">아직 따져 보고 틀린 말을 걸러 낼 힘이 없거든요. 동사 reason(추론하다)을 꾸미니 부사 <b>analytically</b>(분석적으로)예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">If a preschool boy consistently hears from his mother</div><div class=\"k\">만약 미취학 소년이 자기 어머니로부터 계속 듣는다면</div></div><div class=\"rc\"><div class=\"e\">that he is smart and a good helper,</div><div class=\"k\">그가 똑똑하고 잘 도와준다는 말을,</div></div><div class=\"rc\"><div class=\"e\">he is likely to incorporate that information</div><div class=\"k\">그는 그 정보를 통합시킬 가능성이 크다</div></div><div class=\"rc\"><div class=\"e\">into his self-image.</div><div class=\"k\">자신의 자아상에.</div></div><div class=\"rnat\">만약 미취학 남자아이가 엄마로부터 자신이 똑똑하고 남을 잘 돕는 아이라는 말을 계속 듣는다면, 그는 그 정보를 자신의 자아상에 통합시킬 가능성이 크다.</div><div class=\"rst\">엄마에게 “너 똑똑하고 잘 돕는구나”를 계속 들으면 그걸 자기 모습으로 받아들여요. 완전한 절 앞이라 <b>that</b>(~라는 것)이에요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Thinking of himself as a boy</span></div><div class=\"k\"><span class=\"cw\">자기 자신을 소년이라고 여기는 것은</span></div></div><div class=\"rc\"><div class=\"e\">who is smart and knows how to do things</div><div class=\"k\">똑똑하고 일을 어떻게 할지 아는</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">is likely to make him</span> endure longer</div><div class=\"k\">그가 더 오래 지속하게 <span class=\"cw\">할 가능성이 크다</span> ※ 문제지엔 being으로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">in problem-solving efforts</div><div class=\"k\">문제 해결 노력을</div></div><div class=\"rc\"><div class=\"e\">and increase his confidence</div><div class=\"k\">그리고 그의 자신감을 높일</div></div><div class=\"rc\"><div class=\"e\">in trying new and difficult tasks.</div><div class=\"k\">새롭고 어려운 일을 시도할 때.</div></div><div class=\"rnat\">자신을 똑똑하고 일을 어떻게 해낼지 아는 아이라고 여기는 것은, 그가 문제 해결 노력을 더 오래 지속하게 하고 새롭고 어려운 일에 도전할 때 자신감을 높여 줄 가능성이 크다.</div><div class=\"rst\"><b>‘나는 똑똑한 아이’라고 여기는 것</b>은 어려운 문제도 오래 붙잡게 해요. 동명사 주어 뒤 본동사 자리라 <b>is</b>(~이다)예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Similarly,</div><div class=\"k\">마찬가지로,</div></div><div class=\"rc\"><div class=\"e\">thinking of himself as the kind of boy</div><div class=\"k\">자기 자신을 그런 부류의 소년이라고 생각하는 것은</div></div><div class=\"rc\"><div class=\"e\">who is a good helper</div><div class=\"k\">잘 도와주는</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">will make him</span> more likely to volunteer to help</div><div class=\"k\">그가 돕겠다고 자원할 가능성이 더 커지게 <span class=\"cw\">만든다</span></div></div><div class=\"rc\"><div class=\"e\">with tasks at home and at preschool.</div><div class=\"k\">집과 유치원에서 일을.</div></div><div class=\"rnat\">마찬가지로, 자신을 남을 잘 돕는 아이라고 여기는 것은 그가 집과 유치원에서 일을 돕겠다고 자원할 가능성을 더 크게 만든다.</div><div class=\"rst\">마찬가지로 ‘나는 잘 돕는 아이’라고 여기면 집안일도 먼저 돕겠다고 나서요. volunteer(자원하다) 뒤라 <b>to help</b>(돕겠다고)예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"praise\" data-m=\"칭찬\"><b>praise</b>칭찬</button><button type=\"button\" class=\"wdb\" data-w=\"self-esteem\" data-m=\"자존감\"><b>self-esteem</b>자존감</button><button type=\"button\" class=\"wdb\" data-w=\"cognitive sophistication\" data-m=\"인지적 정교함\"><b>cognitive sophistication</b>인지적 정교함</button><button type=\"button\" class=\"wdb\" data-w=\"incorporate\" data-m=\"통합시키다, 받아들이다\"><b>incorporate</b>통합시키다, 받아들이다</button><button type=\"button\" class=\"wdb\" data-w=\"self-image\" data-m=\"자아상\"><b>self-image</b>자아상</button><button type=\"button\" class=\"wdb\" data-w=\"endure\" data-m=\"지속하다, 견디다\"><b>endure</b>지속하다, 견디다</button></div>", "06": "<p class=\"mtr\">마더텅 정답률 <b>65%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">주제는 <b>좋은 면 → 나쁜 면</b>이 두 번 반복되는 구조를 잡으세요. 2번 <b>up to a certain degree</b>(어느 정도까지만)와 6번 <b>On the other hand</b>(반면에)가 방향을 꺾는 신호예요.</p><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 좋은 면 ①</span><div class=\"en\">The interaction of workers from different cultural backgrounds with the host population <mark>might increase productivity</mark> due to positive externalities like knowledge spillovers.</div><p class=\"ko\">다른 문화적 배경을 가진 노동자들과 현지 주민의 상호 작용은 지식 파급과 같은 긍정적인 외부 효과로 인해 <mark>생산성을 증가시킬 수 있다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>1번의 장점에 바로 한계를 달아요</span></div><div class=\"ck-step\"><span class=\"lab\">2번 문장 · 첫 번째 꺾기</span><div class=\"en\">This is <mark>only an advantage</mark> <mark>up to a certain degree</mark>.</div><p class=\"ko\">이것은 <mark>어느 정도까지만</mark> <mark>오직 이점이다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>배경이 너무 다양하면 1번과 정반대로 생산성이 떨어져요</span></div><div class=\"ck-step key\"><span class=\"lab\">3번 문장 · 나쁜 면 ①</span><div class=\"en\">When the variety of backgrounds is too large, fractionalization may cause excessive transaction costs for communication, which <mark>may lower productivity</mark>.</div><p class=\"ko\">배경의 다양성이 너무 클 때, 분열은 의사소통에 대한 과도한 거래 비용을 초래할 수 있는데, 이것은 <mark>생산성을 저하시킬 수 있다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>4번에서 화제를 삶의 질로 넓힌 뒤, 다시 좋은 면부터 말해요</span></div><div class=\"ck-step\"><span class=\"lab\">5번 문장 · 좋은 면 ②</span><div class=\"en\">A tolerant native population <mark>may value</mark> a multicultural city or region because of an increase in the range of available goods and services.</div><p class=\"ko\">관대한 원주민은 이용 가능한 재화와 서비스의 범위가 늘어나기 때문에 다문화 도시나 지역을 <mark>가치 있게 여길 수도 있다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>On the other hand(반면에)로 다시 나쁜 면이 나와요</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 나쁜 면 ②</span><div class=\"en\"><mark>On the other hand</mark>, diversity could be perceived as <mark>an unattractive feature</mark> …</div><p class=\"ko\"><mark>반면에</mark>, 다양성은 <mark>매력적이지 않은 특징</mark>으로 인식될 수 있다 …</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>1번 ↔ 3번</em>생산성이 오름 ↔ 생산성이 떨어짐</span><span><em>5번 ↔ 6·7번</em>다문화를 반김 ↔ 정체성 왜곡·차별</span></div><div class=\"ck-eq\">⇒ 다양성의 좋은 면과 나쁜 면이 맞서요 = contrastive aspects(대조적인 측면들) → ②</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">contrastive aspects of cultural diversity 문화적 다양성의 대조적인 측면들<small>1·3번(생산성)과 5·6번(삶의 질) 모두에서 좋은 면과 나쁜 면이 맞서요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">factors of productivity differences across countries 국가 간 생산성 차이의 요인</span><span class=\"why\">[범위 좁음] 1·3번 productivity(생산성)만 따온 함정이에요. 4번부터 삶의 질 이야기로 넓어지고, 나라끼리 생산성을 비교하는 내용도 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">roles of culture in ethnic groups 민족 집단 내 문화의 역할</span><span class=\"why\">[지문에 없음] 7번에 ethnic groups(민족 집단)가 나오지만 차별받는 대상일 뿐이에요. 그 집단 안에서 문화가 하는 역할은 말하지 않아요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">negative perspectives of national identity 국가 정체성에 대한 부정적 관점</span><span class=\"why\">[범위 좁음] 6번 national identity(국가 정체성)는 나쁜 면 쪽의 한 부분이에요. 게다가 정체성을 부정적으로 보는 게 아니라, 다양성이 정체성을 왜곡한다고 느끼는 거예요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">policies to protect minorities and prevent discrimination 소수자를 보호하고 차별을 막는 정책</span><span class=\"why\">[지문에 없음] 7번에 discriminate(차별하다)가 나오지만, 차별을 막는 정책은 한 번도 안 나와요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds key\" data-ord=\"1\"><span class=\"rn\">1번 · 단서</span><div class=\"rc\"><div class=\"e\">The interaction of workers from different cultural backgrounds</div><div class=\"k\">다른 문화적 배경으로부터의 노동자들의 상호 작용은</div></div><div class=\"rc\"><div class=\"e\">with the host population</div><div class=\"k\">현지 주민과의</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">might increase productivity</span></div><div class=\"k\"><span class=\"cw\">생산성을 증가시킬 수 있다</span></div></div><div class=\"rc\"><div class=\"e\">due to positive externalities like knowledge spillovers.</div><div class=\"k\">지식 파급과 같은 긍정적인 외부 효과로 인해.</div></div><div class=\"rnat\">다른 문화적 배경을 가진 노동자들이 현지 주민과 상호작용하는 것은 지식 파급 효과와 같은 긍정적인 외부 효과 덕분에 생산성을 높일 수도 있다.</div><div class=\"rst\">여러 나라에서 온 친구들이 한 반에서 아는 걸 나누면 모둠 과제가 더 잘돼요. = 지문 1번, <b>생산성이 증가</b>할 수 있다는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc ckc\"><div class=\"e\">This is <span class=\"cw\">only an advantage</span></div><div class=\"k\">이것(= 생산성 증가)은 <span class=\"cw\">오직 이점이다</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">up to a certain degree</span>.</div><div class=\"k\"><span class=\"cw\">어느 정도까지만</span>.</div></div><div class=\"rnat\">하지만 이것은 오직 어느 정도까지만 이점이 된다.</div><div class=\"rst\">하지만 그건 <b>어느 정도까지만</b>(up to a certain degree) 좋은 점이에요. 지문 2번이 장점에 한계를 달아요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc\"><div class=\"e\">When the variety of backgrounds is too large,</div><div class=\"k\">배경의 다양성이 너무 클 때,</div></div><div class=\"rc\"><div class=\"e\">fractionalization may cause</div><div class=\"k\">분열은 초래할 수 있는데</div></div><div class=\"rc\"><div class=\"e\">excessive transaction costs for communication,</div><div class=\"k\">의사소통에 대한 과도한 거래 비용을,</div></div><div class=\"rc ckc\"><div class=\"e\">which <span class=\"cw\">may lower productivity</span>.</div><div class=\"k\">이것(= 과도한 거래 비용을 초래하는 것)은 <span class=\"cw\">생산성을 저하시킬 수 있다</span>.</div></div><div class=\"rnat\">배경의 다양성이 너무 크면, 분열이 의사소통에 과도한 거래 비용을 초래할 수 있고, 이는 생산성을 낮출 수 있다.</div><div class=\"rst\">모둠원 말이 다 달라 통역만 하다 시간이 가면 과제가 오히려 늦어져요. = 지문 3번, <b>생산성을 떨어뜨릴</b> 수 있다는 말이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Diversity not only impacts the labour market,</div><div class=\"k\">다양성은 노동 시장에 영향을 줄 뿐만 아니라,</div></div><div class=\"rc\"><div class=\"e\">but may also affect the quality of life in a location.</div><div class=\"k\">한 지역의 삶의 질에도 영향을 미칠 수 있다.</div></div><div class=\"rnat\">다양성은 노동 시장에만 영향을 미치는 것이 아니라 한 지역의 삶의 질에도 영향을 미칠 수 있다.</div><div class=\"rst\">다양함은 공부뿐 아니라 반 생활 전체에도 영향을 줘요. 지문 4번도 노동 시장을 넘어 <b>삶의 질</b>로 이야기를 넓혀요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc ckc\"><div class=\"e\">A tolerant native population <span class=\"cw\">may value</span></div><div class=\"k\">관대한 원주민은 <span class=\"cw\">가치 있게 여길 수도 있다</span></div></div><div class=\"rc\"><div class=\"e\">a multicultural city or region</div><div class=\"k\">다문화 도시나 지역을</div></div><div class=\"rc\"><div class=\"e\">because of an increase in the range</div><div class=\"k\">범위의 증가로 인해</div></div><div class=\"rc\"><div class=\"e\">of available goods and services.</div><div class=\"k\">이용 가능한 재화와 서비스의.</div></div><div class=\"rnat\">관대한 원주민 집단은 이용 가능한 재화와 서비스의 범위가 늘어난다는 이유로 다문화 도시나 지역을 가치 있게 여길 수도 있다.</div><div class=\"rst\">마음이 열린 친구들은 급식에 여러 나라 음식이 나와서 좋아해요. = 지문 5번, 누릴 것이 늘어 다문화 지역을 반긴다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">On the other hand</span>,</div><div class=\"k\"><span class=\"cw\">반면에</span>,</div></div><div class=\"rc ckc\"><div class=\"e\">diversity could be perceived as <span class=\"cw\">an unattractive feature</span></div><div class=\"k\">다양성은 <span class=\"cw\">매력적이지 않은 특징</span>으로 인식될 수 있다</div></div><div class=\"rc\"><div class=\"e\">if natives perceive it</div><div class=\"k\">만약 원주민들이 그것(= 다양성)을 인식한다면</div></div><div class=\"rc\"><div class=\"e\">as a distortion of what they consider</div><div class=\"k\">그들이 여기는 것에 대한 왜곡으로</div></div><div class=\"rc\"><div class=\"e\">to be their national identity.</div><div class=\"k\">자신들의 국가 정체성이라고.</div></div><div class=\"rnat\">반면, 원주민들이 다양성을 자신들이 여기는 국가 정체성의 왜곡으로 인식한다면, 다양성은 매력적이지 않은 특징으로 인식될 수도 있다.</div><div class=\"rst\"><b>반면에</b>(On the other hand) “우리 반 분위기가 변했어” 하고 싫어하는 친구도 있어요. 지문 6번, 국가 정체성이 왜곡된다고 느끼는 경우예요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">They might even discriminate against other ethnic groups</div><div class=\"k\">그들(= 원주민들)은 심지어 다른 민족 집단을 차별할 수도 있고</div></div><div class=\"rc\"><div class=\"e\">and they might fear</div><div class=\"k\">두려워할 수도 있다</div></div><div class=\"rc\"><div class=\"e\">that social conflicts between different foreign nationalities</div><div class=\"k\">서로 다른 외국 국적들 간의 사회적 갈등이</div></div><div class=\"rc\"><div class=\"e\">are imported into their own neighbourhood.</div><div class=\"k\">그들 자신의 지역으로 유입되는 것을.</div></div><div class=\"rnat\">그들은 심지어 다른 민족 집단을 차별할 수도 있고, 서로 다른 외국 국적 사이의 사회적 갈등이 자신들의 지역으로 유입되는 것을 두려워할 수도 있다.</div><div class=\"rst\">그런 친구는 전학생을 따돌리거나 다툼이 생길까 걱정해요. 지문 7번까지 좋은 면과 나쁜 면이 맞서서 주제는 ②예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"productivity\" data-m=\"생산성\"><b>productivity</b>생산성</button><button type=\"button\" class=\"wdb\" data-w=\"externalities\" data-m=\"외부 효과들\"><b>externalities</b>외부 효과들</button><button type=\"button\" class=\"wdb\" data-w=\"fractionalization\" data-m=\"분열\"><b>fractionalization</b>분열</button><button type=\"button\" class=\"wdb\" data-w=\"diversity\" data-m=\"다양성\"><b>diversity</b>다양성</button><button type=\"button\" class=\"wdb\" data-w=\"tolerant\" data-m=\"관대한\"><b>tolerant</b>관대한</button><button type=\"button\" class=\"wdb\" data-w=\"distortion\" data-m=\"왜곡\"><b>distortion</b>왜곡</button></div>"};
document.addEventListener('click',function(e){
 var b=e.target.closest('.stbtn');
 if(b){var box=b.closest('.rdb'),on=!box.classList.contains('story');box.classList.toggle('story',on);
  var L=[].slice.call(box.querySelectorAll('.rds'));L.forEach(function(x){x.classList.remove('lastv');x.style.order='';});
  if(on){L.sort(function(a,c){return (+a.dataset.ord)-(+c.dataset.ord);});L.forEach(function(x,i){x.style.order=i+1;});L[L.length-1].classList.add('lastv');}
  b.textContent=on?'문장별로 보기':'이야기로 이어 읽기';return;}
 var w=e.target.closest('.wdb');
 if(w){var on2=!w.classList.contains('on');w.classList.toggle('on',on2);
  try{if(window.WN){if(on2)WN.add([{w:w.dataset.w,m:w.dataset.m,src:'미니모고',how:'별표',ask:true}]);else if(WN.del)WN.del(w.dataset.w,'미니모고');}}catch(err){}
  var t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s';document.body.appendChild(t);}
  t.textContent=on2?'오답노트장에 담았어요':'오답노트장에서 뺐어요';t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(function(){t.style.opacity='0'},1600);}
});

/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  if(EXP[cq.q]){h+=EXP[cq.q]+'<button class="toq" data-i="'+i+'">빠른 정답으로</button>';return h+'</div></details>';}
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
  mmInit();
}
/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(S.sub&&!S.mmS){S.mmS=1;S.mmP=1;save();WN.hw(lv,day,S.sub.s+'/'+N+(S.mmD?' ✓':''));}else if(!S.sub&&!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
