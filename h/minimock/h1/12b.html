<title>고1 미니모의고사 12회 07–12번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:84px}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}
.ko{color:var(--sub);font-size:14px;margin-left:6px}
.cell.bad{background:var(--badbg);border-color:var(--bad)}
.cell.bad .tag{background:var(--bad)}
.locked .cell{pointer-events:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.done .opt{pointer-events:none}
.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}
.hcard .chip{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--sub)}
.hcard .chip.ok{background:var(--goodbg);color:var(--good)}
.hcard .chip.warn{background:var(--badbg);color:var(--bad)}
.hcard[disabled]{opacity:.55}
details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.th .hd{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:6px}
.th ol{list-style:none;margin:0;padding:0;counter-reset:n}
.th li{counter-increment:n;position:relative;padding:7px 0 7px 30px;font-size:15px;line-height:1.7;border-top:1px dashed #cfdcf0}
.th li:first-child{border-top:0}
.th li:before{content:counter(n);position:absolute;left:0;top:9px;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;text-align:center;line-height:21px}
.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.th .sub{margin:3px 0 0;color:#444;font-size:14.5px;line-height:1.7}
.sc .lay.sum{border-left:4px solid #2e7d32;background:#f1f8f1}
/* ---- 새 직독직해·해설 화면 ---- */
.sc{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden;background:var(--bg)}
.sc-h{padding:11px 14px 10px;background:#eef2f8;border-bottom:1px solid var(--line)}
.sc-h .no2{display:inline-block;min-width:26px;height:26px;line-height:26px;border-radius:13px;background:var(--accent);color:#fff;font-weight:800;font-size:13px;text-align:center;padding:0 7px;margin-right:8px}
.sc-h .at{font-size:13px;color:var(--sub)}
.sc-h .tt{display:block;margin-top:7px;font-size:15.5px;font-weight:800;color:var(--accent);line-height:1.45}
.sc-b{padding:10px 12px 12px}
.sc .ch{margin-bottom:6px}
.sc .ce{font-size:17px}
.sc .ce sup,.nt sup{font-size:10px;font-weight:800;color:#b8651f;margin-left:1px}
.nts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.nt{font-size:13.5px;line-height:1.5;background:#fbf6ee;border:1px solid #f0e2cd;border-radius:8px;padding:5px 9px;color:#4a3a22}
.nt b{color:#33260f}
.sc .lay{border-radius:10px}
.sc .lay.nat{border-left:4px solid var(--accent);background:#f7f9fc}
.sc .lay.ana{background:#fff8e6;border-color:#f0dcc0;color:#4d3b05}
.sc .lay.ana b,.why2 b,.opx b,.evx b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.sc .lb{margin-bottom:4px}
.qc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}
.qchip small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-bottom:1px}
.qchip.o{border-color:var(--good);background:var(--goodbg)}
.qchip.x{border-color:var(--bad);background:var(--badbg)}
.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.trs{list-style:none;margin:0;padding:0;background:var(--soft);border-radius:10px;padding:8px 12px}
.trs li{font-size:15px;line-height:1.75;padding:2px 0}
.trs .n{display:inline-block;min-width:20px;font-size:12px;color:var(--sub);font-weight:700}
.evx{background:var(--goodbg);border:1px solid #bfe0cd;border-radius:10px;padding:10px 12px}

.opx{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px;background:var(--bg)}
.opx.a{border-color:var(--good);background:var(--goodbg)}
.opx .ot{font-size:15.5px;font-weight:700;line-height:1.55}
.opx .mk{display:inline-block;min-width:22px;font-weight:800;color:var(--sub);margin-right:4px}
.opx.a .mk{color:var(--good)}
.opx .bd{display:inline-block;font-size:11.5px;font-weight:800;color:#fff;border-radius:4px;padding:1px 7px;margin-left:6px;vertical-align:1px}

.opx .bd.t{background:#b4472f}
.opx p{margin:5px 0 0;font-size:14.5px;line-height:1.7;color:#333}
.opx .xm{color:var(--bad);font-weight:800;margin-right:3px}
.wds{display:flex;flex-wrap:wrap;gap:6px}
.wds span{font-size:14px;background:var(--soft);border-radius:8px;padding:5px 9px;line-height:1.45}
.wds b{margin-right:5px}
.toq{display:block;width:100%;margin-top:14px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}
details.sub2{margin:12px 0 0}
details.sub2>summary{list-style:none;cursor:pointer;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px;padding:6px 0}
details.sub2>summary::-webkit-details-marker{display:none}
details.sub2>summary:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
details.sub2>summary:after{content:"+";margin-left:auto;font-size:18px;color:var(--sub)}
details.sub2[open]>summary:after{content:"\2212"}

.cr{color:#A3102E;font-weight:700}
.sc .lay.core{border-left:4px solid #2e7d32;background:#f1f8f1}
.ct{display:none;margin:7px 0 2px;padding:6px 9px;border-left:3px solid #d9a21b;background:#fff8e6;border-radius:6px;font-size:13.5px;line-height:1.55;color:#4d3b05}

.sc .ch{background:#fafbfe;border:1px solid #e8ecf5;border-bottom:1px solid #e8ecf5;padding:10px 12px}

.cks{margin:0 0 6px}.cchip{display:inline-block;font-size:12.5px;font-weight:700;color:#1f6f5f;background:#e5f4f0;border:1px solid #bfe3da;border-radius:999px;padding:4px 10px;text-decoration:none;margin:2px 4px 2px 0}

.sc .sc-b{background:#fff}

.sc .fin.n2{background:#fff8e1;border-color:#f0e2b0;border-left-color:#d9a21b}.sc .fin.n2 b{color:#8a6d00}


.rst{margin-top:8px;background:#fff8e1;border:1px solid #efe3b8;border-left:4px solid #d9a21b;border-radius:8px;padding:8px 10px;font-size:15px;line-height:1.7;word-break:keep-all}

(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:Canvas;color:CanvasText;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';
    document.body.appendChild(d);
    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');
    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';
      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();
  }
  function DEL(w,src){var k=String(w||'').toLowerCase().trim(),hit=false;
    if(!busy){var Q=jq(QK).map(function(b){return b.filter(function(it){var m=String(it.w||'').toLowerCase().trim()===k&&it.src===src;if(m)hit=true;return!m})}).filter(function(b){return b.length});if(hit){s(QK,JSON.stringify(Q));return Promise.resolve({ok:true,removed:true})}}
    var n=name();if(!n)return Promise.resolve(null);
    function go(){return post({act:'del',name:n,pin:PIN,w:w,src:src})}
    return flush().then(go).then(function(r){if(r&&r.ok&&r.removed===false&&r.reason==='none')return new Promise(function(z){setTimeout(z,3000)}).then(go);return r}).catch(function(){return null})}
  W.WN={add:function(items){
    if(!items||!items.length)return Promise.resolve(false);
    var Q=jq(QK);Q.push(items);s(QK,JSON.stringify(Q));return flush();
  },hw:function(level,day,score){
    var H=jq(HK);H.push({level:level,day:day,score:score});s(HK,JSON.stringify(H));return flush();
  },del:DEL,gate:gate,flush:flush,name:name};
  flush();
})(window);

if(!WN.name())WN.gate(function(){location.reload()});
</script>

var ANS=dec(ENC).split(";").map(function(x){return x.split("|").map(function(c){return CIRC.indexOf(c)+1;});});

function ansText(i){return ANS[i].map(function(n){return CIRC[n-1];}).join(", ");}

function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function shuffle(arr,seed){const a=arr.slice();let s=hash(seed)||1;for(let i=a.length-1;i>0;i--){s=Math.imul(s^(s>>>15),2246822519)>>>0;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}

이 더 크기 때문이다."], ["5", "이 단순한 깨달음은 실제 생활에서의 친구들뿐만 아니라 소셜 미디어 웹사이트의 팔로워들에게도 관련이 있다."], ["6", "예를 들어, 트위터에서 그것은 팔로워 역설이라고 불릴 수 있는 것을 초래한다: 대부분의 사람들이 그들의 팔로워보다 팔로워 수가 더 적다."], ["7", "당신이 더 인기 있어지겠다고 다짐하기 전에, 대부분의 사람들이 비슷하고, 인구 밀도가 낮은 배에 타고 있다는 것을 기억하라."]], "evh": "3·5번 문장", "ev": [{"en": true, "h": "At work or school, we are all more likely to become friends with someone who has a lot of friends than we are to befriend someone with few friends. / In Twitter, for example, it gives rise to what might be called the follower paradox: most people have fewer followers than their followers do."}, {"en": false, "h": "친구가 많은 사람과 친구가 될 가능성이 높다는 3번의 '단순한 깨달음(this simple realization)'이 실제 친구뿐 아니라 소셜 미디어 팔로워에게도 적용된다는 주어진 문장이 들어간 뒤, 이를 구체적인 트위터 예시(5번)로 이어가는 것이 자연스러우므로 ④에 들어가야 한다."}], "opts": [{"n": "①", "t": "①", "a": false, "x": true, "trap": false, "e": "이 위치 앞에는 아직 '단순한 깨달음' 자체가 제시되지 않았으므로, 주어진 문장의 'This simple realization'이 가리킬 대상이 없다."}, {"n": "②", "t": "②", "a": false, "x": true, "trap": false, "e": "마찬가지로 '깨달음'의 구체적 내용(친구가 많은 사람과 친구가 되기 쉬움)이 아직 나오지 않았다."}, {"n": "③", "t": "③", "a": false, "x": true, "trap": true, "e": "이 위치 다음 문장이 이미 '깨달음'의 이유를 설명하고 있으므로, 주어진 문장이 여기 들어가면 흐름이 끊긴다."}, {"n": "④", "t": "④", "a": true, "x": false, "trap": false, "e": "바로 앞 문장(친구가 많은 사람과 친구가 될 가능성)이 '단순한 깨달음'의 내용이고, 이 문장이 그것을 소셜 미디어로 확장한 뒤, 바로 뒤 문장이 트위터의 구체적 예시로 이어지는 것이 가장 자연스럽다."}, {"n": "⑤", "t": "⑤", "a": false, "x": true, "trap": false, "e": "이 위치 앞에는 이미 트위터 예시가 나온 뒤이므로, 그 뒤에 '이 깨달음이 소셜 미디어에도 관련 있다'는 문장이 오면 순서가 뒤바뀐다."}], "w": [["realization", "깨달음"], ["follower", "팔로워"], ["suppose", "생각하다, 추측하다"], ["befriend", "~와 친구가 되다"], ["give rise to", "~을 낳다, 초래하다"], ["paradox", "역설"], ["resolve to", "~하기로 다짐하다"], ["sparsely populated", "인구밀도가 낮은"]]}, {"q": "09", "type": "무관 문장", "src": "2021년 6월 35번", "ans": "④", "tr": [["1", "건강과 질병의 확산은 우리가 어떻게 사는지, 그리고 우리의 도시들이 어떻게 운영되는지와 아주 밀접하게 연관되어 있다."], ["2", "좋은 소식은 도시들이 놀라울 정도로 회복력이 있다는 것이다."], ["3", "많은 도시들이 과거에 전염병을 경험했고, 살아남았을 뿐만 아니라 발전하기도 했다."], ["4", "①19세기와 20세기 초반은 유럽 도시들에서 콜레라, 장티푸스, 독감의 파괴적인 발생을 목격했다."], ["5", "②영국의 Jon Snow와 독일의 Rudolf Virchow 같은 의사들은 열악한 주거 환경, 과밀 거주, 위생, 그리고 질병 사이의 연관성을 발견했다."], ["6", "③이러한 연관성에 대한 인식은 전염병의 확산을 막기 위한 도시의 재계획과 재건으로 이어졌다."], ["7", "④재건 노력에도 불구하고, 도시들은 많은 지역에서 쇠퇴했으며 많은 사람들이 떠나기 시작했다."], ["8", "⑤19세기 중반, 오늘날까지도 기여하고 있는 런던의 선구적인 하수 처리 시스템은 콜레라의 확산을 막기 위한 깨끗한 물의 중요성을 이해한 것의 결과로 지어졌다."]], "evh": "1·2·3번 문장", "ev": [{"en": true, "h": "Health and the spread of disease are very closely linked to how we live and how our cities operate. / The good news is that cities are incredibly resilient. / Many cities have experienced epidemics in the past and have not only survived, but advanced."}, {"en": false, "h": "이 글은 도시가 전염병을 극복하고 오히려 발전해 왔다는 긍정적인 흐름(1~3번)으로 이어지는데, ④번은 '도시가 쇠퇴하고 사람들이 떠났다'는 정반대의 내용이므로 전체 흐름과 관계가 없다."}], "opts": [{"n": "①", "t": "①", "a": false, "x": true, "trap": false, "e": "도시들이 극복해 온 과거의 전염병 사례(콜레라, 장티푸스, 독감)를 제시하며 글의 흐름과 일치한다."}, {"n": "②", "t": "②", "a": false, "x": true, "trap": false, "e": "질병과 주거 환경의 연관성을 발견한 의사들의 사례로, 글의 흐름과 자연스럽게 이어진다."}, {"n": "③", "t": "③", "a": false, "x": true, "trap": false, "e": "이러한 연관성에 대한 인식이 도시 재정비로 이어졌다는 내용으로 흐름과 일치한다."}, {"n": "④", "t": "④", "a": true, "x": false, "trap": false, "e": "이 글은 도시가 전염병을 극복하고 발전해 왔다는 내용인데, ④번은 도시가 '쇠퇴했다'는 반대되는 내용이므로 전체 흐름과 관계가 없다."}, {"n": "⑤", "t": "⑤", "a": false, "x": true, "trap": true, "e": "③번에서 언급된 도시 재정비의 구체적 성공 사례(런던의 하수 시스템)로 자연스럽게 이어진다."}], "w": [["spread", "확산, 전파"], ["resilient", "회복력 있는"], ["epidemic", "전염병"], ["destructive", "파괴적인"], ["outbreak", "발생, 창궐"], ["overcrowding", "과밀 거주"], ["sanitation", "공중위생"], ["reconstruction", "재건, 복원"], ["decline", "쇠퇴하다"], ["pioneering", "선구적인"], ["sewer system", "하수 처리 시스템"]]}, {"q": "10", "type": "순서", "src": "2019년 11월 43번", "ans": "⑤", "tr": [["1", "오래 전, 한 작은 마을에 사는 농부에게는 사냥꾼인 이웃이 있었다."], ["2", "그 사냥꾼은 사납고 제대로 훈련되지 않은 사냥개 몇 마리를 기르고 있었다."], ["3", "그 개들은 자주 울타리를 뛰어넘어 농부의 새끼 양들을 뒤쫓았다."], ["4", "농부는 이웃에게 그의 개들을 잘 관리해 달라고 부탁했지만, 그의 말은 무시되었다."], ["5", "어느 날 개들이 울타 function sHtmlP(s){

  const lays=[];
  if(s.link)lays.push(['이어 읽으면',s.link]);

  if(s.gist)lays.push(['결국 이 얘기',s.gist]);

var EXP={"07": "<p class=\"mtr\">마더텅 정답률 <b>50%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸은 실험의 <b>결론 문장</b>이에요. 유전자가 못난 쥐가 <b>좋은 우리</b>에서 자라 똑똑한 쥐만큼 해냈다는 결과, 그리고 <b>nurture</b>(양육·환경)의 승리라는 말을 그대로 받는 어구를 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (8번)</span><div class=\"en\">Genes are turned on or off <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span>.</span></div><p class=\"ko\">유전자는 ( ? ) 작동하거나 멈춘다</p></div><div class=\"ck-via\"><i>▼</i><span>두 쥐 집단의 차이 = 자란 우리(환경)</span></div><div class=\"ck-step\"><span class=\"lab\">5번 문장 · 실험 조건</span><div class=\"en\">… while the inferior mice were raised <mark>in large cages with toys and exercise wheels</mark> and with lots of social interaction.</div><p class=\"ko\">반면에 열등한 쥐들은 <mark>장난감과 운동용 쳇바퀴가 있고</mark> 사회적 상호작용이 많은 큰 우리에서 길러졌다.</p></div><div class=\"ck-via\"><i>▼</i><span>환경 좋은 쪽이 유전자 좋은 쪽을 따라잡음</span></div><div class=\"ck-step\"><span class=\"lab\">6번 문장 · 실험 결과</span><div class=\"en\">… they were able to perform <mark>just as well as their genetic superiors</mark>.</div><p class=\"ko\">그들(= 열등한 쥐들)은 <mark>그들의 유전적인 우월군들만큼 잘</mark> 수행할 수 있었다.</p></div><div class=\"ck-via\"><i>▼</i><span>결과를 한 줄로 정리: 천성보다 환경이 이겼다</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 문장 · 결정적 단서</span><div class=\"en\">This was a real triumph <mark>for nurture over nature</mark>.</div><p class=\"ko\">이것은 <mark>천성(선천적 성질)에 대한 양육(후천적 환경)의</mark> 진정한 승리였다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">based on what is around you 여러분 주변에 있는 것에 따라<small>nurture(환경)의 승리 = 유전자도 주변 환경에 따라 켜지고 꺼져요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">depending on genetic superiority 유전적 우월성에 따라</span><span class=\"why\">6번에서 유전적으로 열등한 쥐도 우월한 쥐만큼 해냈어요. 유전이 결정한다는 말은 7번 nurture over nature(천성보다 양육)와 정반대예요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">by themselves for survival 생존을 위해 스스로</span><span class=\"why\">유전자가 혼자 알아서 움직인다면 5번의 우리(환경) 차이가 결과를 바꿀 수 없어요. 지문은 바깥 환경이 바꿨다고 해요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">free from social interaction 사회적 상호작용과 상관없이</span><span class=\"why\">5번에서 열등한 쥐들은 lots of social interaction(많은 사회적 상호작용) 속에서 자라 따라잡았어요. 상호작용이 오히려 도움이 된 거예요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">so as to keep ourselves entertained 우리 자신을 즐겁게 하려고</span><span class=\"why\">toys(장난감)가 나오지만 즐거움이 목적이라는 말은 지문에 없어요. 장난감은 환경의 일부일 뿐이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">In a study at Princeton University in 1992,</div><div class=\"k\">1992년 프린스턴 대학의 한 연구에서</div></div><div class=\"rc\"><div class=\"e\">research scientists looked at</div><div class=\"k\">연구 과학자들은 관찰했다</div></div><div class=\"rc\"><div class=\"e\">two different groups of mice.</div><div class=\"k\">두 개의 다른 쥐 집단을</div></div><div class=\"rnat\">1992년 프린스턴 대학의 한 연구에서, 연구 과학자들은 두 개의 다른 쥐 집단을 관찰했다.</div><div class=\"rst\">같은 반 친구 두 모둠을 비교하는 실험을 한다고 해 봐요. 지문도 프린스턴 대학 과학자들이 두 쥐 집단을 관찰했다고 해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">One group was made</div><div class=\"k\">한 집단은 만들어졌다</div></div><div class=\"rc\"><div class=\"e\">intellectually superior</div><div class=\"k\">지적으로 우월하게</div></div><div class=\"rc\"><div class=\"e\">by modifying the gene</div><div class=\"k\">유전자를 변형함으로써</div></div><div class=\"rc\"><div class=\"e\">for the glutamate receptor.</div><div class=\"k\">글루타민산염 수용체에 대한</div></div><div class=\"rnat\">한 집단은 글루타민산염 수용체에 대한 유전자를 변형함으로써 지적으로 우월하게 만들어졌다.</div><div class=\"rst\">한 모둠은 타고나길 머리가 좋은 친구들이에요. = 지문의 유전자를 바꿔 지적으로 우월하게 만든 쥐들이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Glutamate is a brain chemical</div><div class=\"k\">글루타민산염은 뇌 화학 물질이다</div></div><div class=\"rc\"><div class=\"e\">that is necessary in learning.</div><div class=\"k\">학습에 필수적인</div></div><div class=\"rnat\">글루타민산염은 학습에 필수적인 뇌 화학 물질이다.</div><div class=\"rst\">그 비결은 공부할 때 꼭 필요한 뇌 속 물질이에요. 지문은 이걸 글루타민산염이라고 불러요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">The other group</div><div class=\"k\">다른 집단은</div></div><div class=\"rc\"><div class=\"e\">was genetically manipulated</div><div class=\"k\">유전적으로 조작되었는데</div></div><div class=\"rc\"><div class=\"e\">to be intellectually inferior,</div><div class=\"k\">지적으로 열등하도록</div></div><div class=\"rc\"><div class=\"e\">also done by modifying the gene</div><div class=\"k\">역시 유전자를 변형함으로써 행해졌다</div></div><div class=\"rc\"><div class=\"e\">for the glutamate receptor.</div><div class=\"k\">글루타민산염 수용체에 대한</div></div><div class=\"rnat\">다른 집단도 지적으로 열등하도록 유전적으로 조작되었는데, 역시 글루타민산염 수용체에 대한 유전자를 변형함으로써 행해졌다.</div><div class=\"rst\">다른 모둠은 반대로 타고나길 머리가 덜 좋은 친구들이에요. = 지문의 유전적으로 지적으로 열등하게 조작된 쥐들이에요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">The smart mice were then raised</div><div class=\"k\">그 후 똑똑한 쥐들은 길러졌고</div></div><div class=\"rc\"><div class=\"e\">in standard cages,</div><div class=\"k\">표준 우리에서</div></div><div class=\"rc\"><div class=\"e\">while the inferior mice were raised</div><div class=\"k\">반면에 열등한 쥐들은 길러졌다</div></div><div class=\"rc\"><div class=\"e\">in large cages</div><div class=\"k\">큰 우리에서</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">with toys and exercise wheels</span></div><div class=\"k\"><span class=\"cw\">장난감과 운동용 쳇바퀴가 있고</span></div></div><div class=\"rc\"><div class=\"e\">and with lots of social interaction.</div><div class=\"k\">사회적 상호작용이 많은</div></div><div class=\"rnat\">그 후 똑똑한 쥐들은 표준 우리에서 길러졌고, 반면에 열등한 쥐들은 장난감과 운동용 쳇바퀴가 있고 사회적 상호작용이 많은 큰 우리에서 길러졌다.</div><div class=\"rst\">그런데 머리 좋은 모둠은 텅 빈 교실에, 덜 좋은 모둠은 <b>장난감·운동기구·친구가 가득한</b> 넓은 교실에서 지냈어요. = 지문의 큰 우리 이야기예요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">At the end of the study,</div><div class=\"k\">연구가 끝날 무렵</div></div><div class=\"rc\"><div class=\"e\">although the intellectually inferior mice</div><div class=\"k\">비록 지적 능력이 떨어지는 쥐들이</div></div><div class=\"rc\"><div class=\"e\">were genetically handicapped,</div><div class=\"k\">유전적으로 장애가 있었지만</div></div><div class=\"rc\"><div class=\"e\">they were able to perform</div><div class=\"k\">그들(= 열등한 쥐들)은 수행할 수 있었다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">just as well as their genetic superiors.</span></div><div class=\"k\"><span class=\"cw\">그들의 유전적인 우월군들만큼 잘</span></div></div><div class=\"rnat\">연구가 끝날 무렵, 비록 지적 능력이 떨어지는 쥐들이 유전적으로 장애가 있었지만, 그들은 그들의 유전적인 우월군들만큼 잘 수행할 수 있었다.</div><div class=\"rst\">학기 말 시험에서 덜 좋은 모둠이 <b>똑똑한 모둠만큼</b> 잘 봤어요. 지문도 열등한 쥐들이 우월한 쥐들만큼 잘 해냈다고 해요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">This was a real triumph</div><div class=\"k\">이것(= 열등한 쥐들이 우월한 쥐들만큼 잘 수행한 것)은 진정한 승리였다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">for nurture over nature.</span></div><div class=\"k\"><span class=\"cw\">천성(선천적 성질)에 대한 양육(후천적 환경)의</span></div></div><div class=\"rnat\">이것은 천성(선천적 성질)에 대한 양육(후천적 환경)의 진정한 승리였다.</div><div class=\"rst\">타고난 머리보다 <b>자란 환경</b>이 이긴 거예요. 그래서 지문은 이걸 nurture(양육) over nature(천성)의 승리라고 불러요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">Genes are turned on or off</div><div class=\"k\">유전자는 작동하거나 멈춘다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">based on what is around you.</span></div><div class=\"k\"><span class=\"cw\">여러분 주변에 있는 것에 따라</span> ※ 문제지엔 빈칸으로 되어 있음 (정답: ③ based on what is around you)</div></div><div class=\"rnat\">유전자는 여러분 주변에 있는 것에 따라 작동하거나 멈춘다.</div><div class=\"rst\">결국 머리를 켜고 끄는 스위치는 <b>내 주변에 뭐가 있느냐</b>에 달렸어요. 그래서 빈칸은 based on what is around you(주변에 있는 것에 따라)예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"intellectually superior\" data-m=\"지적으로 우월한\"><b>intellectually superior</b>지적으로 우월한</button><button type=\"button\" class=\"wdb\" data-w=\"modify\" data-m=\"변형하다, 수정하다\"><b>modify</b>변형하다, 수정하다</button><button type=\"button\" class=\"wdb\" data-w=\"genetically manipulate\" data-m=\"유전적으로 조작하다\"><b>genetically manipulate</b>유전적으로 조작하다</button><button type=\"button\" class=\"wdb\" data-w=\"handicapped\" data-m=\"장애가 있는\"><b>handicapped</b>장애가 있는</button><button type=\"button\" class=\"wdb\" data-w=\"triumph\" data-m=\"승리, 업적\"><b>triumph</b>승리, 업적</button><button type=\"button\" class=\"wdb\" data-w=\"nurture\" data-m=\"양육\"><b>nurture</b>양육</button></div>", "08": "<p class=\"mtr\">마더텅 정답률 <b>70%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">삽입은 주어진 문장의 <b>연결 신호</b>를 잡는 문제예요. This simple realization(이 단순한 깨달음)이 가리킬 <b>깨달음</b>이 바로 앞에 있고, 바로 뒤에는 <b>소셜 미디어</b>(social media) 예시가 이어지는 자리를 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">주어진 문장 · 연결 신호</span><div class=\"en\"><mark>This simple realization</mark> is relevant not only to friends in real life, but also to followers <mark>on social media websites</mark>.</div><p class=\"ko\"><mark>이 단순한 깨달음은</mark> 실제 생활에서의 친구들과뿐만 아니라 <mark>소셜 미디어 웹사이트의</mark> 팔로워들과도 관련이 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>This simple realization(이 단순한 깨달음) = 인기 있는 사람의 친구가 될 가능성이 더 높다는 것</span></div><div class=\"ck-step\"><span class=\"lab\">5번 · 앞 문장 (④ 바로 앞)</span><div class=\"en\">… rather it’s more probable that we will be among a popular person’s friends <mark>simply because he or she has a large number of them</mark>.</div><p class=\"ko\">오히려 <mark>단순히 그나 그녀(= 인기 있는 사람)에게 상당히 많은 그들(= 친구들)이 있기 때문에</mark> 우리가 인기 있는 사람의 친구들 중 한 사람이 될 가능성이 더 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>주어진 문장의 social media(소셜 미디어)를 트위터 예시로 받음</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 · 뒤 문장 (④ 바로 뒤)</span><div class=\"en\"><mark>In Twitter, for example,</mark> <mark>it</mark> gives rise to what might be called the follower paradox …</div><p class=\"ko\"><mark>예를 들어, 트위터에서</mark> <mark>그것(= 앞에서 말한 깨달음)은</mark> 팔로워 역설이라고 불릴 수 있는 것을 초래한다 …</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>4·5번</em>친구 많은 사람과 친구 될 확률이 높음 = 깨달음</span><span><em>주어진 문장</em>이 깨달음은 소셜 미디어에도 통함</span><span><em>6번</em>예를 들어 트위터: 팔로워 역설</span></div><div class=\"ck-eq\">⇒ 깨달음 → 소셜 미디어로 확장 → 트위터 예시, 세 고리가 다 맞는 자리 = ④</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">5번 문장과 6번 문장 사이<small>6번 Twitter(트위터) 예시가 받을 social media(소셜 미디어)가 바로 앞에 생겨요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">4번 문장과 5번 문장 사이</span><span class=\"why\">4번에서 깨달음이 나와 들어갈 것 같지만, 5번 It’s not that(~라는 것이 아니라)은 4번 설명을 바로 이어서 덧붙이는 말이라 끊으면 안 돼요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">2번 문장과 3번 문장 사이</span><span class=\"why\">2번은 아직 질문만 던진 상태라 This simple realization(이 단순한 깨달음)이 가리킬 깨달음이 없어요. 3번 this(이것)도 2번 질문을 받아야 해요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">3번 문장과 4번 문장 사이</span><span class=\"why\">3번은 “아마 사실일 것”이라고만 했지 이유는 아직 안 나왔어요. 깨달음의 내용은 4번부터 나와요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">6번 문장과 7번 문장 사이</span><span class=\"why\">⑤에 넣으면 6번 트위터 예시가 먼저 나오고 그 뒤에 소셜 미디어 얘기가 와서 순서가 뒤집혀요. 6번 for example(예를 들어)이 받을 소셜 미디어 얘기가 앞에 없게 돼요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds key\" data-ord=\"1\"><span class=\"rn\">1번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">This simple realization</span></div><div class=\"k\"><span class=\"cw\">이 단순한 깨달음은</span></div></div><div class=\"rc\"><div class=\"e\">is relevant</div><div class=\"k\">관련이 있다</div></div><div class=\"rc\"><div class=\"e\">not only to friends in real life,</div><div class=\"k\">실제 생활에서의 친구들과뿐만 아니라</div></div><div class=\"rc\"><div class=\"e\">but also to followers</div><div class=\"k\">팔로워들과도</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">on social media websites.</span></div><div class=\"k\"><span class=\"cw\">소셜 미디어 웹사이트의</span></div></div><div class=\"rnat\">(주어진 문장) 이 단순한 깨달음은 실제 생활에서의 친구들뿐만 아니라 소셜 미디어 웹사이트의 팔로워들과도 관련이 있다.</div><div class=\"rst\">〈주어진 문장〉 <b>이 단순한 깨달음</b>은 반 친구뿐 아니라 <b>소셜 미디어 팔로워</b>에게도 똑같이 통해요. = 지문의 소셜 미디어 웹사이트 이야기.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Are your friends more popular</div><div class=\"k\">당신의 친구들이 더 인기 있는가</div></div><div class=\"rc\"><div class=\"e\">than you are?</div><div class=\"k\">당신이 인기 있는 것보다</div></div><div class=\"rnat\">당신의 친구들이 당신이 그러한(인기 있는) 것보다 더 인기 있는가?</div><div class=\"rst\">“우리 반 친구들은 다 나보다 인기 많은 것 같아.” 이런 생각 해 본 적 있죠? 지문도 똑같이 물어요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">There doesn’t seem to be</div><div class=\"k\">~이 있는 것처럼 보이지 않지만</div></div><div class=\"rc\"><div class=\"e\">any obvious reason</div><div class=\"k\">아무 분명한 근거도</div></div><div class=\"rc\"><div class=\"e\">to suppose this is true,</div><div class=\"k\">이것(= 친구들이 나보다 더 인기 있다는 것)이 사실이라고 생각할</div></div><div class=\"rc\"><div class=\"e\">but it probably is.</div><div class=\"k\">그것은 아마도 그렇다(사실이다)</div></div><div class=\"rnat\">이것이 사실이라고 생각할 아무 분명한 근거도 없는 것처럼 보이지만, 그것은 아마도 그렇다(사실이다).</div><div class=\"rst\">딱히 그럴 이유는 없어 보이는데, 실제로는 아마 맞는 말이에요. 지문도 이것이 아마 사실이라고 해요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">At work or school,</div><div class=\"k\">직장이나 학교에서</div></div><div class=\"rc\"><div class=\"e\">we are all more likely to become friends</div><div class=\"k\">우리는 모두 친구가 될 가능성이 더 높다</div></div><div class=\"rc\"><div class=\"e\">with someone who has a lot of friends</div><div class=\"k\">친구가 많이 있는 사람과</div></div><div class=\"rc\"><div class=\"e\">than we are to befriend</div><div class=\"k\">~와 친구가 되기보다</div></div><div class=\"rc\"><div class=\"e\">someone with few friends.</div><div class=\"k\">친구가 거의 없는 사람과</div></div><div class=\"rnat\">직장이나 학교에서, 우리는 모두 친구가 거의 없는 사람과 친구가 되기보다 친구가 많이 있는 사람과 친구가 될 가능성이 더 높다.</div><div class=\"rst\">학교에서 우리는 친구 없는 애보다 <b>친구가 많은 애</b>와 친구가 되기 쉬워요. 지문의 핵심 깨달음이 여기서 나와요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">It’s not that</div><div class=\"k\">~라는 것이 아니라</div></div><div class=\"rc\"><div class=\"e\">we avoid co-workers and classmates</div><div class=\"k\">우리가 동료와 학급 친구를 피하는 것</div></div><div class=\"rc\"><div class=\"e\">with few friends;</div><div class=\"k\">친구가 거의 없는</div></div><div class=\"rc\"><div class=\"e\">rather it’s more probable</div><div class=\"k\">오히려 ~할 가능성이 더 있다</div></div><div class=\"rc\"><div class=\"e\">that we will be among a popular person’s friends</div><div class=\"k\">우리가 인기 있는 사람의 친구들 중 한 사람이 될</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">simply because he or she has a large number of them.</span></div><div class=\"k\"><span class=\"cw\">단순히 그나 그녀(= 인기 있는 사람)에게 상당히 많은 그들(= 친구들)이 있기 때문에</span></div></div><div class=\"rnat\">우리가 친구가 거의 없는 동료나 학급 친구를 피하는 것이 아니라, 오히려 단순히 그나 그녀에게 상당히 많은 그들(친구들)이 있기 때문에 우리가 인기 있는 사람의 친구들 중 한 사람이 될 가능성이 더 있다.</div><div class=\"rst\">친구 적은 애를 일부러 피하는 게 아니에요. 인기 많은 애는 친구가 워낙 많으니 나도 그중 하나일 확률이 높을 뿐이에요. = 지문 5번.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">In Twitter, for example,</span></div><div class=\"k\"><span class=\"cw\">예를 들어, 트위터에서</span></div></div><div class=\"rc\"><div class=\"e\">it gives rise to</div><div class=\"k\">그것(= 앞에서 말한 깨달음)은 초래한다</div></div><div class=\"rc\"><div class=\"e\">what might be called the follower paradox:</div><div class=\"k\">팔로워 역설이라고 불릴 수 있는 것을</div></div><div class=\"rc\"><div class=\"e\">most people have fewer followers</div><div class=\"k\">대부분의 사람들이 더 적은 팔로워를 갖는다</div></div><div class=\"rc\"><div class=\"e\">than their followers do.</div><div class=\"k\">그들의 팔로워들이 가진 것보다</div></div><div class=\"rnat\">예를 들어, 트위터에서 그것은 팔로워 역설이라고 불릴 수 있는 것을 초래한다. (즉) 대부분의 사람들이 그들의 팔로워들이 가진 것보다 더 적은 팔로워를 갖는다.</div><div class=\"rst\"><b>예를 들어</b>(for example) 트위터에서도, 내 팔로워들은 대부분 나보다 팔로워가 많아요. = 지문의 팔로워 역설이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Before you resolve to become more popular,</div><div class=\"k\">당신이 더 인기 있어지겠다고 다짐하기 전에</div></div><div class=\"rc\"><div class=\"e\">remember</div><div class=\"k\">기억하라</div></div><div class=\"rc\"><div class=\"e\">that most people are in similar,</div><div class=\"k\">대부분의 사람들이 비슷하고</div></div><div class=\"rc\"><div class=\"e\">sparsely populated boats.</div><div class=\"k\">인구 밀도가 낮은 배에 있다는 것을</div></div><div class=\"rnat\">당신이 더 인기 있어지겠다고 다짐하기 전에, 대부분의 사람들이 비슷하고, 인구 밀도가 낮은 배에 있다는 것을 기억하라.</div><div class=\"rst\">그러니 “나도 인기 많아져야지!” 다짐하기 전에, 다들 비슷하게 친구 적은 배에 타고 있다는 걸 기억하래요. 지문의 마무리예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"realization\" data-m=\"깨달음\"><b>realization</b>깨달음</button><button type=\"button\" class=\"wdb\" data-w=\"suppose\" data-m=\"생각하다, 추측하다\"><b>suppose</b>생각하다, 추측하다</button><button type=\"button\" class=\"wdb\" data-w=\"befriend\" data-m=\"~와 친구가 되다\"><b>befriend</b>~와 친구가 되다</button><button type=\"button\" class=\"wdb\" data-w=\"resolve to\" data-m=\"~하기로 다짐하다\"><b>resolve to</b>~하기로 다짐하다</button><button type=\"button\" class=\"wdb\" data-w=\"paradox\" data-m=\"역설\"><b>paradox</b>역설</button><button type=\"button\" class=\"wdb\" data-w=\"sparsely populated\" data-m=\"인구밀도가 낮은\"><b>sparsely populated</b>인구밀도가 낮은</button></div>", "09": "<p class=\"mtr\">마더텅 정답률 <b>60%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">무관한 문장은 <b>글 전체 화제</b>를 먼저 잡고 하나씩 대 보는 문제예요. 이 글의 화제는 <b>도시는 전염병을 이겨 내고 발전한다</b>(resilient 회복력 있는)예요. 재건 이야기 사이에서 혼자 <b>쇠퇴</b>로 방향을 트는 문장을 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">2·3번 · 글의 화제</span><div class=\"en\">Many cities have experienced epidemics in the past and have <mark>not only survived, but advanced</mark>.</div><p class=\"ko\">많은 도시들이 과거에 전염병을 경험했고, <mark>생존했을 뿐만 아니라</mark> <mark>발전하기도 했다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>this connection(이러한 연관성) = ②에서 의사들이 찾은 환경과 질병의 연관성</span></div><div class=\"ck-step\"><span class=\"lab\">②(5번) → ③(6번) · 흐름 이어 가기</span><div class=\"en\">A recognition of this connection led to <mark>the replanning and rebuilding of cities</mark> to stop the spread of epidemics.</div><p class=\"ko\">이러한 연관성의 인지는 전염병의 확산을 막기 위해 <mark>도시를 재계획하고 재건축하는 것으로 이어졌다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>“이겨 내고 발전했다”는 화제와 반대로 쇠퇴 이야기</span></div><div class=\"ck-step key\"><span class=\"lab\">④(7번) · 이탈 지점</span><div class=\"en\">In spite of reconstruction efforts, <mark>cities declined in many areas</mark> and many people started to leave.</div><p class=\"ko\">재건 노력에도 불구하고, <mark>도시들은 많은 지역에서 쇠퇴했으며</mark> 많은 사람들이 떠나기 시작했다.</p></div><div class=\"ck-via\"><i>▼</i><span>④를 빼면 ③의 재건 → ⑤의 런던 하수도(재건의 성공 예)로 바로 이어짐</span></div><div class=\"ck-step\"><span class=\"lab\">⑤(8번) · 다시 제자리</span><div class=\"en\">… London’s pioneering sewer system, which still serves it today, was built …</div><p class=\"ko\">오늘날까지도 그곳(= 런던)에서 쓰이는 런던의 선구적인 하수 처리 시스템이 … 지어졌다</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">재건 노력에도 도시가 쇠퇴하고 사람들이 떠났다<small>“도시는 이겨 내고 발전한다”는 화제와 정반대라 흐름에서 튀어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">연관성을 알게 되어 도시를 재계획·재건축했다</span><span class=\"why\">this connection(이러한 연관성)이 ②의 연관성을 그대로 받고, 도시가 전염병을 이겨 내려고 다시 지어졌다는 화제를 이어 가요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">19세기~20세기 초 유럽 도시의 콜레라·장티푸스·독감 발병</span><span class=\"why\">3번 “과거에 전염병을 겪었다”의 실제 예예요. 도시가 겪은 전염병을 구체적으로 보여 줘요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">의사들이 열악한 주거 환경과 질병의 연관성을 확인했다</span><span class=\"why\">1번 “건강은 우리가 사는 방식·도시 운영과 연결된다”를 의사들이 실제로 찾아낸 이야기예요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">깨끗한 물의 중요성을 알고 런던 하수 처리 시스템을 지었다</span><span class=\"why\">③의 재건이 성공한 구체적 예예요. still serves it today(오늘날까지도 쓰인다)는 3번 advanced(발전했다)와 이어져요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Health and the spread of disease</div><div class=\"k\">건강과 질병의 확산은</div></div><div class=\"rc\"><div class=\"e\">are very closely linked</div><div class=\"k\">아주 긴밀하게 연결되어 있다</div></div><div class=\"rc\"><div class=\"e\">to how we live</div><div class=\"k\">우리가 어떻게 사는지</div></div><div class=\"rc\"><div class=\"e\">and how our cities operate.</div><div class=\"k\">그리고 우리의 도시들이 어떻게 운영되는지와</div></div><div class=\"rnat\">건강과 질병의 확산은 우리가 어떻게 사는지, 그리고 우리의 도시들이 어떻게 운영되는지와 아주 긴밀하게 연결되어 있다.</div><div class=\"rst\">우리 학교에 감기가 도는지는 교실이 얼마나 붐비고 깨끗한지와 딱 붙어 있어요. 지문도 건강과 질병 확산이 <b>사는 방식·도시 운영</b>과 연결된다고 해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">The good news is</div><div class=\"k\">좋은 소식은 ~이다</div></div><div class=\"rc\"><div class=\"e\">that cities are incredibly resilient.</div><div class=\"k\">도시들이 놀라울 정도로 회복력이 있다는 것</div></div><div class=\"rnat\">좋은 소식은 도시들이 놀라울 정도로 회복력이 있다는 것이다.</div><div class=\"rst\">좋은 소식! 학교는 금방 다시 일어서요. 지문도 도시가 <b>놀라울 정도로 회복력이 있다</b>(resilient)고 해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Many cities have experienced epidemics</div><div class=\"k\">많은 도시들이 전염병을 경험했고</div></div><div class=\"rc\"><div class=\"e\">in the past</div><div class=\"k\">과거에</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">and have not only survived,</span></div><div class=\"k\"><span class=\"cw\">생존했을 뿐만 아니라</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">but advanced.</span></div><div class=\"k\"><span class=\"cw\">발전하기도 했다</span></div></div><div class=\"rnat\">많은 도시들이 과거에 전염병을 경험했고, 생존했을 뿐만 아니라 발전하기도 했다.</div><div class=\"rst\">독감이 크게 돈 학교들도 그냥 버틴 게 아니라 더 좋아졌어요. 지문의 <b>생존했을 뿐만 아니라 발전했다</b>예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">The nineteenth and early-twentieth centuries</div><div class=\"k\">19세기와 20세기 초반은</div></div><div class=\"rc\"><div class=\"e\">saw destructive outbreaks</div><div class=\"k\">파괴적인 발병을 목격했다</div></div><div class=\"rc\"><div class=\"e\">of cholera, typhoid, and influenza</div><div class=\"k\">콜레라, 장티푸스, 독감의</div></div><div class=\"rc\"><div class=\"e\">in European cities.</div><div class=\"k\">유럽 도시들에서</div></div><div class=\"rnat\">①19세기와 20세기 초반은 유럽 도시들에서 콜레라, 장티푸스, 독감의 파괴적인 발병을 목격했다(발병이 목격되었다).</div><div class=\"rst\">① 옛날 학교들에도 무서운 전염병이 돌았어요. 지문은 유럽 도시의 콜레라·장티푸스·독감 발병을 예로 들어요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Doctors such as Jon Snow, from England,</div><div class=\"k\">영국의 Jon Snow 같은 의사들은</div></div><div class=\"rc\"><div class=\"e\">and Rudolf Virchow, of Germany,</div><div class=\"k\">그리고 독일의 Rudolf Virchow 같은</div></div><div class=\"rc\"><div class=\"e\">saw the connection</div><div class=\"k\">연관성을 확인했다</div></div><div class=\"rc\"><div class=\"e\">between poor living conditions,</div><div class=\"k\">열악한 주거 환경,</div></div><div class=\"rc\"><div class=\"e\">overcrowding, sanitation, and disease.</div><div class=\"k\">과밀 거주, 위생, 그리고 질병 사이의</div></div><div class=\"rnat\">②영국의 Jon Snow와 독일의 Rudolf Virchow 같은 의사들은 열악한 주거 환경, 과밀 거주, 위생과 질병 사이의 연관성을 확인했다.</div><div class=\"rst\">② 보건 선생님들이 “교실이 좁고 더러우면 병이 퍼져요!” 하고 연결고리를 찾아냈어요. = 지문의 의사들이 찾은 연관성이에요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">A recognition of this connection</div><div class=\"k\">이러한 연관성의 인지는</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">led to the replanning and rebuilding of cities</span></div><div class=\"k\"><span class=\"cw\">도시를 재계획하고 재건축하는 것으로 이어졌다</span></div></div><div class=\"rc\"><div class=\"e\">to stop the spread of epidemics.</div><div class=\"k\">전염병의 확산을 막기 위해</div></div><div class=\"rnat\">③이러한 연관성의 인지는 전염병의 확산을 막기 위해 도시를 재계획하고 재건축하는 것으로 이어졌다.</div><div class=\"rst\">③ 그래서 교실을 넓히고 새로 고쳐 지었어요. 지문도 이 연관성을 알게 되어 도시를 <b>다시 계획하고 다시 지었다</b>고 해요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">In spite of reconstruction efforts,</div><div class=\"k\">재건 노력에도 불구하고</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">cities declined in many areas</span></div><div class=\"k\"><span class=\"cw\">도시들은 많은 지역에서 쇠퇴했으며</span></div></div><div class=\"rc\"><div class=\"e\">and many people started to leave.</div><div class=\"k\">많은 사람들이 떠나기 시작했다</div></div><div class=\"rnat\">④재건 노력에도 불구하고, 도시들은 많은 지역에서 쇠퇴했으며 많은 사람들이 떠나기 시작했다.</div><div class=\"rst\">④ 갑자기 “고쳐 지어도 학교가 망하고 학생들이 떠났다”는 얘기예요. 지문의 화제인 <b>이겨 내고 발전함</b>과 반대라서 튀어요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc\"><div class=\"e\">In the mid-nineteenth century,</div><div class=\"k\">19세기 중반</div></div><div class=\"rc\"><div class=\"e\">London’s pioneering sewer system,</div><div class=\"k\">런던의 선구적인 하수 처리 시스템은</div></div><div class=\"rc\"><div class=\"e\">which still serves it today,</div><div class=\"k\">오늘날까지도 그곳(= 런던)에 기여하는(쓰이는)</div></div><div class=\"rc\"><div class=\"e\">was built</div><div class=\"k\">지어졌다</div></div><div class=\"rc\"><div class=\"e\">as a result of understanding</div><div class=\"k\">이해한 것의 결과로</div></div><div class=\"rc\"><div class=\"e\">the importance of clean water</div><div class=\"k\">깨끗한 물의 중요성을</div></div><div class=\"rc\"><div class=\"e\">in stopping the spread of cholera.</div><div class=\"k\">콜레라의 확산을 막기 위한</div></div><div class=\"rnat\">⑤19세기 중반, 오늘날까지도 기여하는(쓰이는) 런던의 선구적인 하수 처리 시스템은 콜레라의 확산을 막기 위한 깨끗한 물의 중요성을 이해한 것의 결과로 지어졌다.</div><div class=\"rst\">⑤ 깨끗한 물이 중요하다는 걸 알고 만든 하수도를 지금도 잘 쓰고 있어요. = 지문의 런던 하수 처리 시스템, 재건이 성공한 예예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"resilient\" data-m=\"회복력 있는\"><b>resilient</b>회복력 있는</button><button type=\"button\" class=\"wdb\" data-w=\"epidemic\" data-m=\"전염병\"><b>epidemic</b>전염병</button><button type=\"button\" class=\"wdb\" data-w=\"outbreak\" data-m=\"발생, 창궐\"><b>outbreak</b>발생, 창궐</button><button type=\"button\" class=\"wdb\" data-w=\"sanitation\" data-m=\"공중위생\"><b>sanitation</b>공중위생</button><button type=\"button\" class=\"wdb\" data-w=\"decline\" data-m=\"쇠퇴하다\"><b>decline</b>쇠퇴하다</button><button type=\"button\" class=\"wdb\" data-w=\"sewer system\" data-m=\"하수 처리 시스템\"><b>sewer system</b>하수 처리 시스템</button></div>", "10": "<p class=\"mtr\">마더텅 정답률 <b>70%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">이야기 순서는 <b>사건의 원인 → 결과</b> 고리를 찾는 문제예요. 양이 다침 → <b>by this point</b>(이쯤에서) 참다못해 재판관 찾기 → 재판관의 <b>해결책</b> 실행 → 그 <b>결과</b>로 우정, 순서로 이어 붙이세요.</p><div class=\"ck-step\"><span class=\"lab\">(A) 주어진 글 끝</span><div class=\"en\">One day when the dogs jumped the fence, they attacked and <mark>severely injured</mark> several of the lambs.</div><p class=\"ko\">개들이 울타리를 넘어왔던 어느 날, 그것들은 양 여러 마리를 공격했고 <mark>심하게 다치게 했다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>this point(이 시점) = 양들이 심하게 다친 바로 그때</span></div><div class=\"ck-step key\"><span class=\"lab\">(D) · 첫 번째 고리</span><div class=\"en\">The farmer had had enough <mark>by this point</mark>.</div><p class=\"ko\">농부는 <mark>이쯤에서</mark> 진절머리가 났다.</p></div><div class=\"ck-via\"><i>▼</i><span>(D) 끝에서 농부가 “친구가 좋다”고 답함 → 재판관이 All right(좋습니다)으로 받음</span></div><div class=\"ck-step key\"><span class=\"lab\">(C) · 두 번째 고리</span><div class=\"en\"><mark>“All right,</mark> <mark>I will offer you a solution</mark> that keeps your lambs safe …</div><p class=\"ko\"><mark>“좋습니다,</mark> <mark>제가 당신에게 해결책을 제안하겠습니다</mark> …</p></div><div class=\"ck-via\"><i>▼</i><span>playmates(놀이 친구들) = (C) 끝에서 아이들이 받아서 같이 놀기 시작한 양들</span></div><div class=\"ck-step key\"><span class=\"lab\">(B) · 세 번째 고리</span><div class=\"en\"><mark>To protect his sons’ newly acquired playmates</mark>, the hunter built a strong doghouse for his dogs.</div><p class=\"ko\"><mark>아들들의 새로 얻은 친구들(= 선물받은 양들)을 보호하기 위해서</mark>, 사냥꾼은 그의 개들을 위해 튼튼한 개집을 지었다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">(D) – (C) – (B)<small>참다못해 상담 → 해결책 실행 → 결과로 우정, 세 고리가 모두 맞아요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">(D) – (B) – (C)</span><span class=\"why\">(D) 뒤에 바로 (B)가 오면 newly acquired playmates(새로 얻은 놀이 친구들)가 가리킬 양 선물이 아직 없어요. 선물은 (C)에서 나와요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">(B) – (D) – (C)</span><span class=\"why\">양이 막 다친 (A) 뒤에 갑자기 아들들의 놀이 친구를 지키는 (B)가 나와요. 선물한 양이 아직 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">(C) – (B) – (D)</span><span class=\"why\">(C)의 All right(좋습니다)은 재판관의 대답인데, (A) 뒤에는 아직 재판관이 등장하지 않았어요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">(C) – (D) – (B)</span><span class=\"why\">(C)의 judge’s solution(재판관의 해결책)이 재판관을 만나러 가는 (D)보다 먼저 나와요. 상담이 늘 해결책보다 먼저예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">A long time ago,</div><div class=\"k\">먼 옛날</div></div><div class=\"rc\"><div class=\"e\">a farmer in a small town</div><div class=\"k\">한 작은 마을에 사는 농부(에게)는</div></div><div class=\"rc\"><div class=\"e\">had a neighbor</div><div class=\"k\">이웃이 있었다</div></div><div class=\"rc\"><div class=\"e\">who was a hunter.</div><div class=\"k\">사냥꾼인</div></div><div class=\"rnat\">(A)(1) 먼 옛날, 한 작은 마을에 사는 농부(에게)는 사냥꾼인 이웃이 있었다.</div><div class=\"rst\">옛날 작은 마을에 농부가 살았는데, 옆집 이웃은 사냥꾼이었어요. 지문 속 두 주인공이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">The hunter owned</div><div class=\"k\">그 사냥꾼은 가지고 있었다</div></div><div class=\"rc\"><div class=\"e\">a few fierce and poorly-trained</div><div class=\"k\">사납고 제대로 훈련받지 않은 몇 마리의</div></div><div class=\"rc\"><div class=\"e\">hunting dogs.</div><div class=\"k\">사냥개를</div></div><div class=\"rnat\">(A)(2) 사냥꾼은 사납고 제대로 훈련받지 않은 사냥개 몇 마리를 가지고 있었다.</div><div class=\"rst\">사냥꾼네 사냥개들은 사납고 훈련도 제대로 안 돼 있었어요. 지문의 말썽꾼 개들이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">They jumped the fence frequently</div><div class=\"k\">그것들(= 사냥개들)은 자주 울타리를 넘어다녔고</div></div><div class=\"rc\"><div class=\"e\">and chased the farmer’s lambs.</div><div class=\"k\">농부의 양들을 뒤쫓았다</div></div><div class=\"rnat\">(A)(3) 그것들은 자주 울타리를 넘어다녔고 농부의 양들을 뒤쫓았다.</div><div class=\"rst\">개들이 자꾸 울타리를 넘어와 농부네 양들을 쫓아다녔어요. 지문 그대로예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">The farmer asked his neighbor</div><div class=\"k\">농부는 그의 이웃에게 요구했다</div></div><div class=\"rc\"><div class=\"e\">to keep (a) his dogs in check,</div><div class=\"k\">(a)그(= 사냥꾼)의 개들을 잘 관리할 것을</div></div><div class=\"rc\"><div class=\"e\">but his words fell on deaf ears.</div><div class=\"k\">하지만 그의 말(= 농부의 말)은 무시되었다</div></div><div class=\"rnat\">(A)(4) 농부는 그의 이웃에게 (a)그(hunter)의 개들을 잘 관리할 것을 요구했지만, 그의 말은 무시되었다.</div><div class=\"rst\">농부가 “개 좀 잘 관리해 줘요” 부탁했지만, 사냥꾼은 못 들은 척했어요. = 지문의 그의 말이 무시되었다.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">One day when the dogs jumped the fence,</div><div class=\"k\">개들이 울타리를 넘어왔던 어느 날</div></div><div class=\"rc\"><div class=\"e\">they attacked</div><div class=\"k\">그것들은 공격했고</div></div><div class=\"rc\"><div class=\"e\">and severely injured</div><div class=\"k\">심하게 다치게 했다</div></div><div class=\"rc\"><div class=\"e\">several of the lambs.</div><div class=\"k\">양 여러 마리를</div></div><div class=\"rnat\">(A)(5) 개들이 울타리를 넘어왔던 어느 날, 그것들은 양 여러 마리를 공격했고 심하게 다치게 했다.</div><div class=\"rst\">어느 날 결국 개들이 넘어와 양 여러 마리를 <b>심하게 다치게</b> 했어요. 지문에서 사건이 터지는 순간이에요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">The farmer had had enough</div><div class=\"k\">농부는 진절머리가 났다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">by this point.</span></div><div class=\"k\"><span class=\"cw\">이쯤에서</span></div></div><div class=\"rnat\">(D)(1) 농부는 이쯤에서 진절머리가 났다.</div><div class=\"rst\"><b>이쯤에서</b>(by this point) 농부는 더는 못 참게 됐어요. 바로 앞 양이 다친 일 때문이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">He went to the nearest city</div><div class=\"k\">그(= 농부)는 가장 가까운 도시로 갔다</div></div><div class=\"rc\"><div class=\"e\">to consult a judge.</div><div class=\"k\">재판관에게 조언을 구하기 위해</div></div><div class=\"rnat\">(D)(2) 그는 재판관에게 조언을 구하기 위해 가장 가까운 도시로 갔다.</div><div class=\"rst\">그래서 도시에 가서 재판관에게 조언을 구했어요. 지문의 consult(조언을 구하다)예요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">After listening carefully to his story,</div><div class=\"k\">그의 이야기(= 농부의 이야기)를 주의 깊게 들은 후</div></div><div class=\"rc\"><div class=\"e\">the judge said,</div><div class=\"k\">재판관이 말했다</div></div><div class=\"rc\"><div class=\"e\">“I could punish the hunter</div><div class=\"k\">“저는 사냥꾼을 처벌하고</div></div><div class=\"rc\"><div class=\"e\">and instruct (e) him</div><div class=\"k\">(e)그(= 사냥꾼)에게 지시할 수 있습니다</div></div><div class=\"rc\"><div class=\"e\">to keep his dogs chained or lock them up.</div><div class=\"k\">그의 개들을 묶어 두거나 가두라고</div></div><div class=\"rnat\">(D)(3) 그의 이야기를 주의 깊게 들은 후 재판관이 말했다. “저는 사냥꾼을 처벌하고 (e)그(hunter)에게 그의 개들을 묶어 두거나 가둘 것을 지시할 수 있습니다.</div><div class=\"rst\">재판관은 “사냥꾼을 벌주고 개를 묶어 두라고 시킬 수 있어요.” 했어요. 지문 속 첫 번째 방법이에요.</div></div>
