iv><div class=\"rc\"><div class=\"e\">and will also turn your neighbor into a good friend.”</div><div class=\"k\">또한 당신의 이웃을 좋은 친구로 바꿔 줄</div></div><div class=\"rnat\">(C)(1) “좋습니다, 제가 당신에게 당신의 양들을 안전하게 보호하고 당신의 이웃을 좋은 친구로 바꿀 수 있는 해결책을 제안하겠습니다.”</div><div class=\"rst\">“<b>좋습니다</b>(All right), 양도 지키고 이웃도 친구로 만드는 <b>해결책</b>을 알려 드릴게요.” 농부의 대답을 받는 지문 속 재판관의 말이에요.</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">13번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">Having heard the judge’s solution,</div><div class=\"k\">재판관의 해결책을 듣고 나서</div></div><div class=\"rc\"><div class=\"e\">the farmer agreed.</div><div class=\"k\">농부는 동의했다</div></div><div class=\"rnat\">(C)(2) 재판관의 해결책을 듣고 나서, 농부는 동의했다.</div><div class=\"rst\">재판관의 해결책을 듣고 농부는 그렇게 하겠다고 했어요. 지문의 agreed(동의했다)예요.</div></div><div class=\"rds\" data-ord=\"14\"><span class=\"rn\">14번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">As soon as the farmer reached home,</div><div class=\"k\">농부가 집에 돌아오자마자</div></div><div class=\"rc\"><div class=\"e\">he immediately put the judge’s suggestions to the test.</div><div class=\"k\">그(= 농부)는 즉시 재판관의 제안을 시험해 보았다</div></div><div class=\"rnat\">(C)(3) 농부가 집에 돌아오자마자, 그는 즉시 재판관의 제안을 시험해 보았다.</div><div class=\"rst\">집에 오자마자 농부는 바로 재판관의 제안대로 해 봤어요. 지문 그대로예요.</div></div><div class=\"rds\" data-ord=\"15\"><span class=\"rn\">15번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">(d) He selected three of the cutest lambs</div><div class=\"k\">(d)그(= 농부)는 가장 귀여운 양들 중 세 마리를 골랐다</div></div><div class=\"rc\"><div class=\"e\">from his farm.</div><div class=\"k\">그의 농장에서</div></div><div class=\"rnat\">(C)(4) (d)그(farmer)는 그의 농장에서 가장 귀여운 양들 중 세 마리를 골랐다.</div><div class=\"rst\">농부는 자기 농장에서 제일 귀여운 양 세 마리를 골랐어요. 지문의 (d)는 고른 사람, 농부예요.</div></div><div class=\"rds\" data-ord=\"16\"><span class=\"rn\">16번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">He then presented them</div><div class=\"k\">그리고 그는 그것들(= 양 세 마리)을 선물했다</div></div><div class=\"rc\"><div class=\"e\">to his neighbor’s three small sons.</div><div class=\"k\">이웃의 어린 세 아들들에게</div></div><div class=\"rnat\">(C)(5) 그리고 그는 그것들(양 세 마리)을 이웃의 어린 세 아들들에게 선물했다.</div><div class=\"rst\">그 양들을 옆집 사냥꾼의 어린 세 아들에게 선물했어요. = 지문의 presented(선물했다).</div></div><div class=\"rds\" data-ord=\"17\"><span class=\"rn\">17번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">The children accepted with joy</div><div class=\"k\">아이들은 기쁘게 받아들였고</div></div><div class=\"rc\"><div class=\"e\">and began to play with them.</div><div class=\"k\">그것들(= 양들)과 놀기 시작했다</div></div><div class=\"rnat\">(C)(6) 아이들은 (양들을) 기쁘게 받아들였고 그것들과 놀기 시작했다.</div><div class=\"rst\">아이들은 신나서 양과 놀기 시작했어요. 이 양들이 다음 단락의 새 <b>놀이 친구</b>가 돼요.</div></div><div class=\"rds key\" data-ord=\"18\"><span class=\"rn\">18번 · 단서</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">To protect his sons’ newly acquired playmates,</span></div><div class=\"k\"><span class=\"cw\">아들들의 새로 얻은 친구들(= 선물받은 양들)을 보호하기 위해서</span></div></div><div class=\"rc\"><div class=\"e\">the hunter built a strong doghouse</div><div class=\"k\">사냥꾼은 튼튼한 개집을 지었다</div></div><div class=\"rc\"><div class=\"e\">for his dogs.</div><div class=\"k\">그의 개들을 위해</div></div><div class=\"rnat\">(B)(1) 아들들의 새로 얻은 친구들을 보호하기 위해서, 사냥꾼은 그의 개들을 위해 튼튼한 개집을 지었다.</div><div class=\"rst\">아들들의 <b>새 놀이 친구</b>(playmates)인 양을 지키려고, 사냥꾼이 개집을 튼튼하게 지었어요. 지문에서 해결책이 통한 결과예요.</div></div><div class=\"rds\" data-ord=\"19\"><span class=\"rn\">19번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">The dogs never bothered</div><div class=\"k\">개들은 괴롭히지 않았다</div></div><div class=\"rc\"><div class=\"e\">the farmer’s lambs again.</div><div class=\"k\">다시는 농부의 양들을</div></div><div class=\"rnat\">(B)(2) 개들은 다시는 농부의 양들을 괴롭히지 않았다.</div><div class=\"rst\">그 뒤로 개들은 다시는 농부네 양을 괴롭히지 않았어요. 지문 그대로예요.</div></div><div class=\"rds\" data-ord=\"20\"><span class=\"rn\">20번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">Out of gratitude</div><div class=\"k\">감사하는 마음에서</div></div><div class=\"rc\"><div class=\"e\">for the farmer’s generosity</div><div class=\"k\">농부의 관대함에 대한</div></div><div class=\"rc\"><div class=\"e\">toward (b) his children,</div><div class=\"k\">(b)그(= 사냥꾼)의 아이들을 향한</div></div><div class=\"rc\"><div class=\"e\">the hunter often invited the farmer</div><div class=\"k\">사냥꾼은 종종 농부를 초대했다</div></div><div class=\"rc\"><div class=\"e\">for feasts.</div><div class=\"k\">만찬에</div></div><div class=\"rnat\">(B)(3) (b)그(hunter)의 아이들을 향한 농부의 관대함에 감사하는 마음에서, 사냥꾼은 종종 농부를 만찬에 초대했다.</div><div class=\"rst\">아이들에게 잘해 준 농부가 고마워서, 사냥꾼은 농부를 자주 잔치에 불렀어요. 지문의 feasts(만찬)예요.</div></div><div class=\"rds\" data-ord=\"21\"><span class=\"rn\">21번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">In turn,</div><div class=\"k\">그 보답으로</div></div><div class=\"rc\"><div class=\"e\">the farmer offered him</div><div class=\"k\">농부는 그(= 사냥꾼)에게 제공했다</div></div><div class=\"rc\"><div class=\"e\">lamb meat and cheese he had made.</div><div class=\"k\">양고기와 그(= 농부)가 만든 치즈를</div></div><div class=\"rnat\">(B)(4) 그 보답으로 농부는 그에게 양고기와 그가 만든 치즈를 제공했다.</div><div class=\"rst\">그 보답으로 농부가 사냥꾼에게 양고기와 직접 만든 치즈를 줬어요. 지문에서 <b>준 사람은 농부</b>예요.</div></div><div class=\"rds\" data-ord=\"22\"><span class=\"rn\">22번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">The farmer quickly developed</div><div class=\"k\">농부는 빠르게 발전시켰다</div></div><div class=\"rc\"><div class=\"e\">a strong friendship</div><div class=\"k\">끈끈한 우정을</div></div><div class=\"rc\"><div class=\"e\">with (c) him.</div><div class=\"k\">(c)그(= 사냥꾼)와</div></div><div class=\"rnat\">(B)(5) 농부는 (c)그(hunter)와 끈끈한 우정을 빠르게 발전시켰다.</div><div class=\"rst\">이렇게 농부는 사냥꾼과 금세 끈끈한 친구가 됐어요. 재판관 말대로 적 대신 친구를 얻은 지문의 결말이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"fierce\" data-m=\"사나운\"><b>fierce</b>사나운</button><button type=\"button\" class=\"wdb\" data-w=\"severely\" data-m=\"심하게\"><b>severely</b>심하게</button><button type=\"button\" class=\"wdb\" data-w=\"fall on deaf ears\" data-m=\"무시되다, 귀담아듣지 않다\"><b>fall on deaf ears</b>무시되다, 귀담아듣지 않다</button><button type=\"button\" class=\"wdb\" data-w=\"have had enough\" data-m=\"더는 못 참다, 진절머리가 나다\"><b>have had enough</b>더는 못 참다, 진절머리가 나다</button><button type=\"button\" class=\"wdb\" data-w=\"consult\" data-m=\"상담하다, 조언을 구하다\"><b>consult</b>상담하다, 조언을 구하다</button><button type=\"button\" class=\"wdb\" data-w=\"acquire\" data-m=\"얻다\"><b>acquire</b>얻다</button></div>", "11": "<p class=\"mtr\">마더텅 정답률 <b>60%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">지칭 문제는 대명사마다 <b>그 문장 안의 단서</b>로 누구인지 확인하세요. 개 주인·아이들의 아빠는 <b>사냥꾼</b>, 자기 <b>농장</b>에서 양을 고르는 사람은 <b>농부</b>예요.</p><div class=\"ck-step\"><span class=\"lab\">(a) · 4번 문장</span><div class=\"en\">The farmer asked his neighbor <mark>to keep (a) his dogs in check</mark>, …</div><p class=\"ko\">농부는 그의 이웃에게 <mark>(a)그(= 사냥꾼)의 개들을 잘 관리할 것을</mark> 요구했다 … → 사냥꾼</p></div><div class=\"ck-via\"><i>▼</i><span>개를 묶어 두라는 지시를 받는 사람 = 개 주인</span></div><div class=\"ck-step\"><span class=\"lab\">(e) · 8번 문장</span><div class=\"en\">“I could punish the hunter <mark>and instruct (e) him</mark> to keep his dogs chained or lock them up.</div><p class=\"ko\">“저는 사냥꾼을 처벌하고 그의 개들을 묶어 두거나 가두라고 <mark>(e)그(= 사냥꾼)에게 지시할 수 있습니다</mark> → 사냥꾼</p></div><div class=\"ck-via\"><i>▼</i><span>재판관의 제안을 집에 와서 실행한 사람(14번) + 자기 농장 = 농부</span></div><div class=\"ck-step key\"><span class=\"lab\">(d) · 15번 문장 · 결정적 단서</span><div class=\"en\"><mark>(d) He selected three of the cutest lambs</mark> <mark>from his farm</mark>.</div><p class=\"ko\"><mark>(d)그(= 농부)는</mark> <mark>그의 농장에서</mark> 가장 귀여운 양들 중 세 마리를 골랐다. → 농부</p></div><div class=\"ck-via\"><i>▼</i><span>양을 선물받은 아이들(16번) = 사냥꾼의 세 아들</span></div><div class=\"ck-step\"><span class=\"lab\">(b) · 20번 문장</span><div class=\"en\">Out of gratitude for the farmer’s generosity <mark>toward (b) his children</mark>, the hunter often invited the farmer for feasts.</div><p class=\"ko\"><mark>(b)그(= 사냥꾼)의 아이들을 향한</mark> 농부의 관대함에 감사하는 마음에서, 사냥꾼은 종종 농부를 만찬에 초대했다. → 사냥꾼</p></div><div class=\"ck-via\"><i>▼</i><span>농부(주어)가 우정을 쌓은 상대 = 사냥꾼</span></div><div class=\"ck-step\"><span class=\"lab\">(c) · 22번 문장</span><div class=\"en\">The farmer quickly developed a strong friendship <mark>with (c) him</mark>.</div><p class=\"ko\">농부는 <mark>(c)그(= 사냥꾼)와</mark> 끈끈한 우정을 빠르게 발전시켰다. → 사냥꾼</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">(d) He 그 = 농부<small>나머지 넷은 모두 사냥꾼, (d)만 양을 골라 선물한 농부예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">(b) his 그의 = 사냥꾼</span><span class=\"why\">문장에 the farmer’s generosity(농부의 관대함)가 먼저 나와 농부로 착각하기 쉬워요. 하지만 16번에서 양을 받은 건 사냥꾼의 세 아들이에요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">(a) his 그의 = 사냥꾼</span><span class=\"why\">4번에서 농부가 이웃에게 “개를 관리해 달라”고 해요. 개 주인은 2번에서 사냥개를 가진 사냥꾼이에요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">(c) him 그 = 사냥꾼</span><span class=\"why\">22번 주어가 The farmer(농부)라서, 함께 우정을 쌓은 상대 him(그)은 사냥꾼이에요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">(e) him 그 = 사냥꾼</span><span class=\"why\">8번 바로 앞에 punish the hunter(사냥꾼을 처벌하다)가 있고, 개를 묶어 두라는 지시를 받는 사람도 개 주인 사냥꾼이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">A long time ago,</div><div class=\"k\">먼 옛날</div></div><div class=\"rc\"><div class=\"e\">a farmer in a small town</div><div class=\"k\">한 작은 마을에 사는 농부(에게)는</div></div><div class=\"rc\"><div class=\"e\">had a neighbor</div><div class=\"k\">이웃이 있었다</div></div><div class=\"rc\"><div class=\"e\">who was a hunter.</div><div class=\"k\">사냥꾼인</div></div><div class=\"rnat\">(A)(1) 먼 옛날, 한 작은 마을에 사는 농부(에게)는 사냥꾼인 이웃이 있었다.</div><div class=\"rst\">옛날 작은 마을에 농부가 살았는데, 옆집 이웃은 사냥꾼이었어요. 지문 속 두 주인공이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">The hunter owned</div><div class=\"k\">그 사냥꾼은 가지고 있었다</div></div><div class=\"rc\"><div class=\"e\">a few fierce and poorly-trained</div><div class=\"k\">사납고 제대로 훈련받지 않은 몇 마리의</div></div><div class=\"rc\"><div class=\"e\">hunting dogs.</div><div class=\"k\">사냥개를</div></div><div class=\"rnat\">(A)(2) 사냥꾼은 사납고 제대로 훈련받지 않은 사냥개 몇 마리를 가지고 있었다.</div><div class=\"rst\">사냥꾼네 사냥개들은 사납고 훈련도 제대로 안 돼 있었어요. 지문의 말썽꾼 개들이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">They jumped the fence frequently</div><div class=\"k\">그것들(= 사냥개들)은 자주 울타리를 넘어다녔고</div></div><div class=\"rc\"><div class=\"e\">and chased the farmer’s lambs.</div><div class=\"k\">농부의 양들을 뒤쫓았다</div></div><div class=\"rnat\">(A)(3) 그것들은 자주 울타리를 넘어다녔고 농부의 양들을 뒤쫓았다.</div><div class=\"rst\">개들이 자꾸 울타리를 넘어와 농부네 양들을 쫓아다녔어요. 지문 그대로예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">The farmer asked his neighbor</div><div class=\"k\">농부는 그의 이웃에게 요구했다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">to keep (a) his dogs in check,</span></div><div class=\"k\"><span class=\"cw\">(a)그(= 사냥꾼)의 개들을 잘 관리할 것을</span></div></div><div class=\"rc\"><div class=\"e\">but his words fell on deaf ears.</div><div class=\"k\">하지만 그의 말(= 농부의 말)은 무시되었다</div></div><div class=\"rnat\">(A)(4) 농부는 그의 이웃에게 (a)그(hunter)의 개들을 잘 관리할 것을 요구했지만, 그의 말은 무시되었다.</div><div class=\"rst\">농부가 “개 좀 잘 관리해 줘요” 부탁했어요. 개 주인은 사냥꾼이니 <b>(a) 그 = 사냥꾼</b>이에요. 하지만 지문에서 그 말은 무시돼요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">One day when the dogs jumped the fence,</div><div class=\"k\">개들이 울타리를 넘어왔던 어느 날</div></div><div class=\"rc\"><div class=\"e\">they attacked</div><div class=\"k\">그것들은 공격했고</div></div><div class=\"rc\"><div class=\"e\">and severely injured</div><div class=\"k\">심하게 다치게 했다</div></div><div class=\"rc\"><div class=\"e\">several of the lambs.</div><div class=\"k\">양 여러 마리를</div></div><div class=\"rnat\">(A)(5) 개들이 울타리를 넘어왔던 어느 날, 그것들은 양 여러 마리를 공격했고 심하게 다치게 했다.</div><div class=\"rst\">어느 날 결국 개들이 넘어와 양 여러 마리를 심하게 다치게 했어요. 지문에서 사건이 터지는 순간이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">The farmer had had enough</div><div class=\"k\">농부는 진절머리가 났다</div></div><div class=\"rc\"><div class=\"e\">by this point.</div><div class=\"k\">이쯤에서</div></div><div class=\"rnat\">(D)(1) 농부는 이쯤에서 진절머리가 났다.</div><div class=\"rst\">이쯤에서 농부는 더는 못 참게 됐어요. 지문의 had had enough(진절머리가 났다)예요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">He went to the nearest city</div><div class=\"k\">그(= 농부)는 가장 가까운 도시로 갔다</div></div><div class=\"rc\"><div class=\"e\">to consult a judge.</div><div class=\"k\">재판관에게 조언을 구하기 위해</div></div><div class=\"rnat\">(D)(2) 그는 재판관에게 조언을 구하기 위해 가장 가까운 도시로 갔다.</div><div class=\"rst\">그래서 도시에 가서 재판관에게 조언을 구했어요. 지문의 consult(조언을 구하다)예요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">After listening carefully to his story,</div><div class=\"k\">그의 이야기(= 농부의 이야기)를 주의 깊게 들은 후</div></div><div class=\"rc\"><div class=\"e\">the judge said,</div><div class=\"k\">재판관이 말했다</div></div><div class=\"rc\"><div class=\"e\">“I could punish the hunter</div><div class=\"k\">“저는 사냥꾼을 처벌하고</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">and instruct (e) him</span></div><div class=\"k\"><span class=\"cw\">(e)그(= 사냥꾼)에게 지시할 수 있습니다</span></div></div><div class=\"rc\"><div class=\"e\">to keep his dogs chained or lock them up.</div><div class=\"k\">그의 개들을 묶어 두거나 가두라고</div></div><div class=\"rnat\">(D)(3) 그의 이야기를 주의 깊게 들은 후 재판관이 말했다. “저는 사냥꾼을 처벌하고 (e)그(hunter)에게 그의 개들을 묶어 두거나 가둘 것을 지시할 수 있습니다.</div><div class=\"rst\">재판관이 “사냥꾼을 벌주고 개를 묶어 두라고 시킬 수 있어요.” 해요. 시킴을 받는 건 개 주인이라 <b>(e) 그 = 사냥꾼</b>이에요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">But you would lose a friend</div><div class=\"k\">하지만 당신은 친구를 잃고</div></div><div class=\"rc\"><div class=\"e\">and gain an enemy.</div><div class=\"k\">적을 얻을 수도 있습니다</div></div><div class=\"rnat\">(D)(4) 하지만 당신은 친구를 잃고 적을 얻을 수도 있습니다.</div><div class=\"rst\">“하지만 그러면 친구를 잃고 적이 생길 거예요.” 지문의 lose(잃다)·gain(얻다)이에요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">Which would you rather have</div><div class=\"k\">당신은 어느 쪽을 더 두고 싶습니까</div></div><div class=\"rc\"><div class=\"e\">for a neighbor,</div><div class=\"k\">이웃으로</div></div><div class=\"rc\"><div class=\"e\">a friend or an enemy?”</div><div class=\"k\">친구 혹은 적 (중에서)</div></div><div class=\"rnat\">(D)(5) 당신은 친구 혹은 적 (중에서) 어느 쪽을 이웃으로 둘 것입니까?”</div><div class=\"rst\">“이웃으로 친구가 좋아요, 적이 좋아요?” 재판관이 지문에서 이렇게 물어요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">The farmer replied</div><div class=\"k\">농부는 대답했다</div></div><div class=\"rc\"><div class=\"e\">that he preferred a friend.</div><div class=\"k\">그(= 농부)는 (이웃이) 친구인 편을 선호한다고</div></div><div class=\"rnat\">(D)(6) 농부는 (이웃이) 친구인 편을 선호한다고 대답했다.</div><div class=\"rst\">농부는 “친구가 좋아요.”라고 대답했어요. 지문에서 이 대답을 12번 재판관의 해결책이 이어받아요.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><div class=\"rc\"><div class=\"e\">“All right,</div><div class=\"k\">“좋습니다,</div></div><div class=\"rc\"><div class=\"e\">I will offer you a solution</div><div class=\"k\">제가 당신에게 해결책을 제안하겠습니다</div></div><div class=\"rc\"><div class=\"e\">that keeps your lambs safe</div><div class=\"k\">당신의 양들을 안전하게 지키고</div></div><div class=\"rc\"><div class=\"e\">and will also turn your neighbor into a good friend.”</div><div class=\"k\">또한 당신의 이웃을 좋은 친구로 바꿔 줄</div></div><div class=\"rnat\">(C)(1) “좋습니다, 제가 당신에게 당신의 양들을 안전하게 보호하고 당신의 이웃을 좋은 친구로 바꿀 수 있는 해결책을 제안하겠습니다.”</div><div class=\"rst\">“좋습니다, 양도 지키고 이웃도 친구로 만드는 해결책을 알려 드릴게요.” 지문 속 재판관의 말이에요.</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">13번</span><div class=\"rc\"><div class=\"e\">Having heard the judge’s solution,</div><div class=\"k\">재판관의 해결책을 듣고 나서</div></div><div class=\"rc\"><div class=\"e\">the farmer agreed.</div><div class=\"k\">농부는 동의했다</div></div><div class=\"rnat\">(C)(2) 재판관의 해결책을 듣고 나서, 농부는 동의했다.</div><div class=\"rst\">재판관의 해결책을 듣고 농부는 그렇게 하겠다고 했어요. 지문의 agreed(동의했다)예요.</div></div><div class=\"rds\" data-ord=\"14\"><span class=\"rn\">14번</span><div class=\"rc\"><div class=\"e\">As soon as the farmer reached home,</div><div class=\"k\">농부가 집에 돌아오자마자</div></div><div class=\"rc\"><div class=\"e\">he immediately put the judge’s suggestions to the test.</div><div class=\"k\">그(= 농부)는 즉시 재판관의 제안을 시험해 보았다</div></div><div class=\"rnat\">(C)(3) 농부가 집에 돌아오자마자, 그는 즉시 재판관의 제안을 시험해 보았다.</div><div class=\"rst\">집에 오자마자 농부는 바로 재판관의 제안대로 해 봤어요. 지문 그대로예요.</div></div><div class=\"rds key\" data-ord=\"15\"><span class=\"rn\">15번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">(d) He selected three of the cutest lambs</span></div><div class=\"k\"><span class=\"cw\">(d)그(= 농부)는 가장 귀여운 양들 중 세 마리를 골랐다</span></div></div><div class=\"rc\"><div class=\"e\">from his farm.</div><div class=\"k\">그의 농장에서</div></div><div class=\"rnat\">(C)(4) (d)그(farmer)는 그의 농장에서 가장 귀여운 양들 중 세 마리를 골랐다.</div><div class=\"rst\">집에 온 농부가 자기 농장에서 제일 귀여운 양 세 마리를 골라요. 해결책을 실행하는 사람이라 <b>(d) 그 = 농부</b>예요!</div></div><div class=\"rds\" data-ord=\"16\"><span class=\"rn\">16번</span><div class=\"rc\"><div class=\"e\">He then presented them</div><div class=\"k\">그리고 그는 그것들(= 양 세 마리)을 선물했다</div></div><div class=\"rc\"><div class=\"e\">to his neighbor’s three small sons.</div><div class=\"k\">이웃의 어린 세 아들들에게</div></div><div class=\"rnat\">(C)(5) 그리고 그는 그것들(양 세 마리)을 이웃의 어린 세 아들들에게 선물했다.</div><div class=\"rst\">그 양들을 옆집 사냥꾼의 어린 세 아들에게 선물했어요. = 지문의 presented(선물했다).</div></div><div class=\"rds\" data-ord=\"17\"><span class=\"rn\">17번</span><div class=\"rc\"><div class=\"e\">The children accepted with joy</div><div class=\"k\">아이들은 기쁘게 받아들였고</div></div><div class=\"rc\"><div class=\"e\">and began to play with them.</div><div class=\"k\">그것들(= 양들)과 놀기 시작했다</div></div><div class=\"rnat\">(C)(6) 아이들은 (양들을) 기쁘게 받아들였고 그것들과 놀기 시작했다.</div><div class=\"rst\">아이들은 신나서 양과 놀기 시작했어요. 지문의 them(그것들)은 선물받은 양들이에요.</div></div><div class=\"rds\" data-ord=\"18\"><span class=\"rn\">18번</span><div class=\"rc\"><div class=\"e\">To protect his sons’ newly acquired playmates,</div><div class=\"k\">아들들의 새로 얻은 친구들(= 선물받은 양들)을 보호하기 위해서</div></div><div class=\"rc\"><div class=\"e\">the hunter built a strong doghouse</div><div class=\"k\">사냥꾼은 튼튼한 개집을 지었다</div></div><div class=\"rc\"><div class=\"e\">for his dogs.</div><div class=\"k\">그의 개들을 위해</div></div><div class=\"rnat\">(B)(1) 아들들의 새로 얻은 친구들을 보호하기 위해서, 사냥꾼은 그의 개들을 위해 튼튼한 개집을 지었다.</div><div class=\"rst\">아들들의 새 놀이 친구인 양을 지키려고, 사냥꾼이 개집을 튼튼하게 지었어요. 지문에서 해결책이 통한 결과예요.</div></div><div class=\"rds\" data-ord=\"19\"><span class=\"rn\">19번</span><div class=\"rc\"><div class=\"e\">The dogs never bothered</div><div class=\"k\">개들은 괴롭히지 않았다</div></div><div class=\"rc\"><div class=\"e\">the farmer’s lambs again.</div><div class=\"k\">다시는 농부의 양들을</div></div><div class=\"rnat\">(B)(2) 개들은 다시는 농부의 양들을 괴롭히지 않았다.</div><div class=\"rst\">그 뒤로 개들은 다시는 농부네 양을 괴롭히지 않았어요. 지문 그대로예요.</div></div><div class=\"rds\" data-ord=\"20\"><span class=\"rn\">20번</span><div class=\"rc\"><div class=\"e\">Out of gratitude</div><div class=\"k\">감사하는 마음에서</div></div><div class=\"rc\"><div class=\"e\">for the farmer’s generosity</div><div class=\"k\">농부의 관대함에 대한</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">toward (b) his children,</span></div><div class=\"k\"><span class=\"cw\">(b)그(= 사냥꾼)의 아이들을 향한</span></div></div><div class=\"rc\"><div class=\"e\">the hunter often invited the farmer</div><div class=\"k\">사냥꾼은 종종 농부를 초대했다</div></div><div class=\"rc\"><div class=\"e\">for feasts.</div><div class=\"k\">만찬에</div></div><div class=\"rnat\">(B)(3) (b)그(hunter)의 아이들을 향한 농부의 관대함에 감사하는 마음에서, 사냥꾼은 종종 농부를 만찬에 초대했다.</div><div class=\"rst\">양을 받은 건 사냥꾼의 아들들이니, <b>(b) 그의 아이들 = 사냥꾼의 아이들</b>이에요. 고마운 사냥꾼이 지문에서 농부를 잔치에 불러요.</div></div><div class=\"rds\" data-ord=\"21\"><span class=\"rn\">21번</span><div class=\"rc\"><div class=\"e\">In turn,</div><div class=\"k\">그 보답으로</div></div><div class=\"rc\"><div class=\"e\">the farmer offered him</div><div class=\"k\">농부는 그(= 사냥꾼)에게 제공했다</div></div><div class=\"rc\"><div class=\"e\">lamb meat and cheese he had made.</div><div class=\"k\">양고기와 그(= 농부)가 만든 치즈를</div></div><div class=\"rnat\">(B)(4) 그 보답으로 농부는 그에게 양고기와 그가 만든 치즈를 제공했다.</div><div class=\"rst\">그 보답으로 농부가 사냥꾼에게 양고기와 직접 만든 치즈를 줬어요. 지문에서 <b>준 사람은 농부</b>예요.</div></div><div class=\"rds\" data-ord=\"22\"><span class=\"rn\">22번</span><div class=\"rc\"><div class=\"e\">The farmer quickly developed</div><div class=\"k\">농부는 빠르게 발전시켰다</div></div><div class=\"rc\"><div class=\"e\">a strong friendship</div><div class=\"k\">끈끈한 우정을</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">with (c) him.</span></div><div class=\"k\"><span class=\"cw\">(c)그(= 사냥꾼)와</span></div></div><div class=\"rnat\">(B)(5) 농부는 (c)그(hunter)와 끈끈한 우정을 빠르게 발전시켰다.</div><div class=\"rst\">농부는 <b>(c) 그(사냥꾼)</b>와 금세 끈끈한 친구가 됐어요. 재판관 말대로 적 대신 친구를 얻은 지문의 결말이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"neighbor\" data-m=\"이웃\"><b>neighbor</b>이웃</button><button type=\"button\" class=\"wdb\" data-w=\"consult\" data-m=\"상담하다, 조언을 구하다\"><b>consult</b>상담하다, 조언을 구하다</button><button type=\"button\" class=\"wdb\" data-w=\"instruct\" data-m=\"지시하다\"><b>instruct</b>지시하다</button><button type=\"button\" class=\"wdb\" data-w=\"generosity\" data-m=\"관대함\"><b>generosity</b>관대함</button><button type=\"button\" class=\"wdb\" data-w=\"gratitude\" data-m=\"감사\"><b>gratitude</b>감사</button><button type=\"button\" class=\"wdb\" data-w=\"feast\" data-m=\"잔치, 만찬\"><b>feast</b>잔치, 만찬</button></div>", "12": "<p class=\"mtr\">마더텅 정답률 <b>60%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">불일치 문제는 선택지를 <b>지문 순서대로</b> 하나씩 대조하세요. 선택지 ②처럼 <b>주고받는 방향</b>(누가 누구에게)을 슬쩍 뒤집은 말이 없는지 주어를 꼭 확인해요.</p><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>① ↔ 5번</em>attacked and severely injured(공격해서 심하게 다치게 했다) → 같음</span><span><em>⑤ ↔ 7번</em>went to the nearest city(가장 가까운 도시로 갔다) → 같음</span><span><em>③ ↔ 13번</em>the farmer agreed(농부는 동의했다) → 같음</span><span><em>④ ↔ 16번</em>neighbor’s three small sons(이웃의 어린 세 아들) → 같음</span></div><div class=\"ck-eq\">⇒ 네 개는 지문과 그대로 같아요. 남은 ②를 21번과 대조해요</div></div><div class=\"ck-via\"><i>▼</i><span>②의 ‘사냥꾼에게 받았다’를 21번에서 찾아요</span></div><div class=\"ck-step key\"><span class=\"lab\">21번 문장 · 결정적 단서</span><div class=\"en\">In turn, <mark>the farmer offered him</mark> <mark>lamb meat and cheese he had made</mark>.</div><p class=\"ko\">그 보답으로 <mark>농부는 그(= 사냥꾼)에게</mark> <mark>양고기와 그(= 농부)가 만든 치즈를</mark> <mark>제공했다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>사냥꾼이 농부에게 해 준 건 음식이 아니라 잔치 초대예요</span></div><div class=\"ck-step\"><span class=\"lab\">20번 문장 · 사냥꾼이 준 것</span><div class=\"en\">… the hunter often invited the farmer for feasts.</div><p class=\"ko\">… 사냥꾼은 종종 농부를 만찬에 초대했다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">사냥꾼에게 양고기와 치즈를 받았다.<small>21번: 농부가 사냥꾼에게 양고기와 치즈를 준 거예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">세 명의 아들을 둔 이웃이 있었다.</span><span class=\"why\">15번 three of the cutest lambs(가장 귀여운 양 세 마리)의 three(셋)와 헷갈리기 쉽지만, 16번 neighbor’s three small sons(이웃의 어린 세 아들)와 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">그의 양이 사냥개의 공격을 받았다.</span><span class=\"why\">5번 they attacked and severely injured several of the lambs(그것들이 양 여러 마리를 공격해 심하게 다치게 했다)와 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">재판관의 해결책에 동의했다.</span><span class=\"why\">13번 the farmer agreed(농부는 동의했다)와 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">도시로 조언을 구하러 갔다.</span><span class=\"why\">7번 He went to the nearest city to consult a judge(재판관에게 조언을 구하러 가장 가까운 도시로 갔다)와 같아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">A long time ago,</div><div class=\"k\">먼 옛날</div></div><div class=\"rc\"><div class=\"e\">a farmer in a small town</div><div class=\"k\">한 작은 마을에 사는 농부(에게)는</div></div><div class=\"rc\"><div class=\"e\">had a neighbor</div><div class=\"k\">이웃이 있었다</div></div><div class=\"rc\"><div class=\"e\">who was a hunter.</div><div class=\"k\">사냥꾼인</div></div><div class=\"rnat\">(A)(1) 먼 옛날, 한 작은 마을에 사는 농부(에게)는 사냥꾼인 이웃이 있었다.</div><div class=\"rst\">옛날 작은 마을에 농부가 살았는데, 옆집 이웃은 사냥꾼이었어요. 지문 속 두 주인공이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">The hunter owned</div><div class=\"k\">그 사냥꾼은 가지고 있었다</div></div><div class=\"rc\"><div class=\"e\">a few fierce and poorly-trained</div><div class=\"k\">사납고 제대로 훈련받지 않은 몇 마리의</div></div><div class=\"rc\"><div class=\"e\">hunting dogs.</div><div class=\"k\">사냥개를</div></div><div class=\"rnat\">(A)(2) 사냥꾼은 사납고 제대로 훈련받지 않은 사냥개 몇 마리를 가지고 있었다.</div><div class=\"rst\">사냥꾼네 사냥개들은 사납고 훈련도 제대로 안 돼 있었어요. 지문의 말썽꾼 개들이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">They jumped the fence frequently</div><div class=\"k\">그것들(= 사냥개들)은 자주 울타리를 넘어다녔고</div></div><div class=\"rc\"><div class=\"e\">and chased the farmer’s lambs.</div><div class=\"k\">농부의 양들을 뒤쫓았다</div></div><div class=\"rnat\">(A)(3) 그것들은 자주 울타리를 넘어다녔고 농부의 양들을 뒤쫓았다.</div><div class=\"rst\">개들이 자꾸 울타리를 넘어와 농부네 양들을 쫓아다녔어요. 지문 그대로예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">The farmer asked his neighbor</div><div class=\"k\">농부는 그의 이웃에게 요구했다</div></div><div class=\"rc\"><div class=\"e\">to keep (a) his dogs in check,</div><div class=\"k\">(a)그(= 사냥꾼)의 개들을 잘 관리할 것을</div></div><div class=\"rc\"><div class=\"e\">but his words fell on deaf ears.</div><div class=\"k\">하지만 그의 말(= 농부의 말)은 무시되었다</div></div><div class=\"rnat\">(A)(4) 농부는 그의 이웃에게 (a)그(hunter)의 개들을 잘 관리할 것을 요구했지만, 그의 말은 무시되었다.</div><div class=\"rst\">농부가 “개 좀 잘 관리해 줘요” 부탁했지만, 사냥꾼은 못 들은 척했어요. = 지문의 그의 말이 무시되었다.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">One day when the dogs jumped the fence,</div><div class=\"k\">개들이 울타리를 넘어왔던 어느 날</div></div><div class=\"rc\"><div class=\"e\">they attacked</div><div class=\"k\">그것들은 공격했고</div></div><div class=\"rc\"><div class=\"e\">and severely injured</div><div class=\"k\">심하게 다치게 했다</div></div><div class=\"rc\"><div class=\"e\">several of the lambs.</div><div class=\"k\">양 여러 마리를</div></div><div class=\"rnat\">(A)(5) 개들이 울타리를 넘어왔던 어느 날, 그것들은 양 여러 마리를 공격했고 심하게 다치게 했다.</div><div class=\"rst\">어느 날 결국 개들이 넘어와 양 여러 마리를 공격해 심하게 다치게 했어요. 지문 5번 = 선택지 ①이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">The farmer had had enough</div><div class=\"k\">농부는 진절머리가 났다</div></div><div class=\"rc\"><div class=\"e\">by this point.</div><div class=\"k\">이쯤에서</div></div><div class=\"rnat\">(D)(1) 농부는 이쯤에서 진절머리가 났다.</div><div class=\"rst\">이쯤에서 농부는 더는 못 참게 됐어요. 지문의 had had enough(진절머리가 났다)예요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">He went to the nearest city</div><div class=\"k\">그(= 농부)는 가장 가까운 도시로 갔다</div></div><div class=\"rc\"><div class=\"e\">to consult a judge.</div><div class=\"k\">재판관에게 조언을 구하기 위해</div></div><div class=\"rnat\">(D)(2) 그는 재판관에게 조언을 구하기 위해 가장 가까운 도시로 갔다.</div><div class=\"rst\">그래서 가장 가까운 <b>도시</b>에 가서 재판관에게 조언을 구했어요. 지문 7번 = 선택지 ⑤예요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">After listening carefully to his story,</div><div class=\"k\">그의 이야기(= 농부의 이야기)를 주의 깊게 들은 후</div></div><div class=\"rc\"><div class=\"e\">the judge said,</div><div class=\"k\">재판관이 말했다</div></div><div class=\"rc\"><div class=\"e\">“I could punish the hunter</div><div class=\"k\">“저는 사냥꾼을 처벌하고</div></div><div class=\"rc\"><div class=\"e\">and instruct (e) him</div><div class=\"k\">(e)그(= 사냥꾼)에게 지시할 수 있습니다</div></div><div class=\"rc\"><div class=\"e\">to keep his dogs chained or lock them up.</div><div class=\"k\">그의 개들을 묶어 두거나 가두라고</div></div><div class=\"rnat\">(D)(3) 그의 이야기를 주의 깊게 들은 후 재판관이 말했다. “저는 사냥꾼을 처벌하고 (e)그(hunter)에게 그의 개들을 묶어 두거나 가둘 것을 지시할 수 있습니다.</div><div class=\"rst\">재판관은 “사냥꾼을 벌주고 개를 묶어 두라고 시킬 수 있어요.” 했어요. 지문 속 첫 번째 방법이에요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">But you would lose a friend</div><div class=\"k\">하지만 당신은 친구를 잃고</div></div><div class=\"rc\"><div class=\"e\">and gain an enemy.</div><div class=\"k\">적을 얻을 수도 있습니다</div></div><div class=\"rnat\">(D)(4) 하지만 당신은 친구를 잃고 적을 얻을 수도 있습니다.</div><div class=\"rst\">“하지만 그러면 친구를 잃고 적이 생길 거예요.” 지문의 lose(잃다)·gain(얻다)이에요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">Which would you rather have</div><div class=\"k\">당신은 어느 쪽을 더 두고 싶습니까</div></div><div class=\"rc\"><div class=\"e\">for a neighbor,</div><div class=\"k\">이웃으로</div></div><div class=\"rc\"><div class=\"e\">a friend or an enemy?”</div><div class=\"k\">친구 혹은 적 (중에서)</div></div><div class=\"rnat\">(D)(5) 당신은 친구 혹은 적 (중에서) 어느 쪽을 이웃으로 둘 것입니까?”</div><div class=\"rst\">“이웃으로 친구가 좋아요, 적이 좋아요?” 재판관이 지문에서 이렇게 물어요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">The farmer replied</div><div class=\"k\">농부는 대답했다</div></div><div class=\"rc\"><div class=\"e\">that he preferred a friend.</div><div class=\"k\">그(= 농부)는 (이웃이) 친구인 편을 선호한다고</div></div><div class=\"rnat\">(D)(6) 농부는 (이웃이) 친구인 편을 선호한다고 대답했다.</div><div class=\"rst\">농부는 “친구가 좋아요.”라고 대답했어요. 이 대답을 다음 단락이 받아요.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><div class=\"rc\"><div class=\"e\">“All right,</div><div class=\"k\">“좋습니다,</div></div><div class=\"rc\"><div class=\"e\">I will offer you a solution</div><div class=\"k\">제가 당신에게 해결책을 제안하겠습니다</div></div><div class=\"rc\"><div class=\"e\">that keeps your lambs safe</div><div class=\"k\">당신의 양들을 안전하게 지키고</div></div><div class=\"rc\"><div class=\"e\">and will also turn your neighbor into a good friend.”</div><div class=\"k\">또한 당신의 이웃을 좋은 친구로 바꿔 줄</div></div><div class=\"rnat\">(C)(1) “좋습니다, 제가 당신에게 당신의 양들을 안전하게 보호하고 당신의 이웃을 좋은 친구로 바꿀 수 있는 해결책을 제안하겠습니다.”</div><div class=\"rst\">“좋습니다, 양도 지키고 이웃도 친구로 만드는 해결책을 알려 드릴게요.” 지문 속 재판관의 말이에요.</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">13번</span><div class=\"rc\"><div class=\"e\">Having heard the judge’s solution,</div><div class=\"k\">재판관의 해결책을 듣고 나서</div></div><div class=\"rc\"><div class=\"e\">the farmer agreed.</div><div class=\"k\">농부는 동의했다</div></div><div class=\"rnat\">(C)(2) 재판관의 해결책을 듣고 나서, 농부는 동의했다.</div><div class=\"rst\">재판관의 해결책을 듣고 농부는 그렇게 하겠다고 <b>동의</b>했어요. 지문 13번 = 선택지 ③이에요.</div></div><div class=\"rds\" data-ord=\"14\"><span class=\"rn\">14번</span><div class=\"rc\"><div class=\"e\">As soon as the farmer reached home,</div><div class=\"k\">농부가 집에 돌아오자마자</div></div><div class=\"rc\"><div class=\"e\">he immediately put the judge’s suggestions to the test.</div><div class=\"k\">그(= 농부)는 즉시 재판관의 제안을 시험해 보았다</div></div><div class=\"rnat\">(C)(3) 농부가 집에 돌아오자마자, 그는 즉시 재판관의 제안을 시험해 보았다.</div><div class=\"rst\">집에 오자마자 농부는 바로 재판관의 제안대로 해 봤어요. 지문 그대로예요.</div></div><div class=\"rds\" data-ord=\"15\"><span class=\"rn\">15번</span><div class=\"rc\"><div class=\"e\">(d) He selected three of the cutest lambs</div><div class=\"k\">(d)그(= 농부)는 가장 귀여운 양들 중 세 마리를 골랐다</div></div><div class=\"rc\"><div class=\"e\">from his farm.</div><div class=\"k\">그의 농장에서</div></div><div class=\"rnat\">(C)(4) (d)그(farmer)는 그의 농장에서 가장 귀여운 양들 중 세 마리를 골랐다.</div><div class=\"rst\">농부는 자기 농장에서 제일 귀여운 양 세 마리를 골랐어요. 지문의 (d)는 고른 사람, 농부예요.</div></div><div class=\"rds\" data-ord=\"16\"><span class=\"rn\">16번</span><div class=\"rc\"><div class=\"e\">He then presented them</div><div class=\"k\">그리고 그는 그것들(= 양 세 마리)을 선물했다</div></div><div class=\"rc\"><div class=\"e\">to his neighbor’s three small sons.</div><div class=\"k\">이웃의 어린 세 아들들에게</div></div><div class=\"rnat\">(C)(5) 그리고 그는 그것들(양 세 마리)을 이웃의 어린 세 아들들에게 선물했다.</div><div class=\"rst\">그 양들을 옆집 사냥꾼의 <b>어린 세 아들</b>에게 선물했어요. 이웃에게 아들이 셋이니 지문 16번 = 선택지 ④예요.</div></div><div class=\"rds\" data-ord=\"17\"><span class=\"rn\">17번</span><div class=\"rc\"><div class=\"e\">The children accepted with joy</div><div class=\"k\">아이들은 기쁘게 받아들였고</div></div><div class=\"rc\"><div class=\"e\">and began to play with them.</div><div class=\"k\">그것들(= 양들)과 놀기 시작했다</div></div><div class=\"rnat\">(C)(6) 아이들은 (양들을) 기쁘게 받아들였고 그것들과 놀기 시작했다.</div><div class=\"rst\">아이들은 신나서 양과 놀기 시작했어요. 지문 속 선물이 성공한 장면이에요.</div></div><div class=\"rds\" data-ord=\"18\"><span class=\"rn\">18번</span><div class=\"rc\"><div class=\"e\">To protect his sons’ newly acquired playmates,</div><div class=\"k\">아들들의 새로 얻은 친구들(= 선물받은 양들)을 보호하기 위해서</div></div><div class=\"rc\"><div class=\"e\">the hunter built a strong doghouse</div><div class=\"k\">사냥꾼은 튼튼한 개집을 지었다</div></div><div class=\"rc\"><div class=\"e\">for his dogs.</div><div class=\"k\">그의 개들을 위해</div></div><div class=\"rnat\">(B)(1) 아들들의 새로 얻은 친구들을 보호하기 위해서, 사냥꾼은 그의 개들을 위해 튼튼한 개집을 지었다.</div><div class=\"rst\">아들들의 새 놀이 친구인 양을 지키려고, 사냥꾼이 개집을 튼튼하게 지었어요. 지문에서 해결책이 통한 결과예요.</div></div><div class=\"rds\" data-ord=\"19\"><span class=\"rn\">19번</span><div class=\"rc\"><div class=\"e\">The dogs never bothered</div><div class=\"k\">개들은 괴롭히지 않았다</div></div><div class=\"rc\"><div class=\"e\">the farmer’s lambs again.</div><div class=\"k\">다시는 농부의 양들을</div></div><div class=\"rnat\">(B)(2) 개들은 다시는 농부의 양들을 괴롭히지 않았다.</div><div class=\"rst\">그 뒤로 개들은 다시는 농부네 양을 괴롭히지 않았어요. 지문 그대로예요.</div></div><div class=\"rds\" data-ord=\"20\"><span class=\"rn\">20번</span><div class=\"rc\"><div class=\"e\">Out of gratitude</div><div class=\"k\">감사하는 마음에서</div></div><div class=\"rc\"><div class=\"e\">for the farmer’s generosity</div><div class=\"k\">농부의 관대함에 대한</div></div><div class=\"rc\"><div class=\"e\">toward (b) his children,</div><div class=\"k\">(b)그(= 사냥꾼)의 아이들을 향한</div></div><div class=\"rc\"><div class=\"e\">the hunter often invited the farmer</div><div class=\"k\">사냥꾼은 종종 농부를 초대했다</div></div><div class=\"rc\"><div class=\"e\">for feasts.</div><div class=\"k\">만찬에</div></div><div class=\"rnat\">(B)(3) (b)그(hunter)의 아이들을 향한 농부의 관대함에 감사하는 마음에서, 사냥꾼은 종종 농부를 만찬에 초대했다.</div><div class=\"rst\">아이들에게 잘해 준 농부가 고마워서, 사냥꾼은 농부를 자주 잔치에 불렀어요. 지문의 feasts(만찬)예요.</div></div><div class=\"rds key\" data-ord=\"21\"><span class=\"rn\">21번 · 단서</span><div class=\"rc\"><div class=\"e\">In turn,</div><div class=\"k\">그 보답으로</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">the farmer offered him</span></div><div class=\"k\"><span class=\"cw\">농부는 그(= 사냥꾼)에게 제공했다</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">lamb meat and cheese he had made.</span></div><div class=\"k\"><span class=\"cw\">양고기와 그(= 농부)가 만든 치즈를</span></div></div><div class=\"rnat\">(B)(4) 그 보답으로 농부는 그에게 양고기와 그가 만든 치즈를 제공했다.</div><div class=\"rst\">그 보답으로 <b>농부가</b> 사냥꾼에게 양고기와 직접 만든 치즈를 <b>줬어요</b>. 그래서 “받았다”는 선택지 ②는 지문 21번과 거꾸로예요.</div></div><div class=\"rds\" data-ord=\"22\"><span class=\"rn\">22번</span><div class=\"rc\"><div class=\"e\">The farmer quickly developed</div><div class=\"k\">농부는 빠르게 발전시켰다</div></div><div class=\"rc\"><div class=\"e\">a strong friendship</div><div class=\"k\">끈끈한 우정을</div></div><div class=\"rc\"><div class=\"e\">with (c) him.</div><div class=\"k\">(c)그(= 사냥꾼)와</div></div><div class=\"rnat\">(B)(5) 농부는 (c)그(hunter)와 끈끈한 우정을 빠르게 발전시켰다.</div><div class=\"rst\">이렇게 농부는 사냥꾼과 금세 끈끈한 친구가 됐어요. 재판관 말대로 적 대신 친구를 얻은 지문의 결말이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"fierce\" data-m=\"사나운\"><b>fierce</b>사나운</button><button type=\"button\" class=\"wdb\" data-w=\"severely\" data-m=\"심하게\"><b>severely</b>심하게</button><button type=\"button\" class=\"wdb\" data-w=\"consult\" data-m=\"상담하다, 조언을 구하다\"><b>consult</b>상담하다, 조언을 구하다</button><button type=\"button\" class=\"wdb\" data-w=\"generosity\" data-m=\"관대함\"><b>generosity</b>관대함</button><button type=\"button\" class=\"wdb\" data-w=\"gratitude\" data-m=\"감사\"><b>gratitude</b>감사</button><button type=\"button\" class=\"wdb\" data-w=\"in turn\" data-m=\"그 보답으로\"><b>in turn</b>그 보답으로</button></div>"};

  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  if(EXP[cq.q]){h+=EXP[cq.q]+'<button class="toq" data-i="'+i+'">빠른 정답으로</button>';return h+'</div></details>';}
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
  mmInit();
}
/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(S.sub&&!S.mmS){S.mmS=1;S.mmP=1;save();WN.hw(lv,day,S.sub.s+'/'+N+(S.mmD?' ✓':''));}else if(!S.sub&&!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
