<title>고1 미니모의고사 8회 01–06번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:0}
#app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
#app>.wrap{width:100%}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}
.ko{color:var(--sub);font-size:14px;margin-left:6px}
.cell.bad{background:var(--badbg);border-color:var(--bad)}
.cell.bad .tag{background:var(--bad)}
.locked .cell{pointer-events:none}
.bar{position:sticky;margin-top:auto;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.done .opt{pointer-events:none}
.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}
.hcard .chip{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--sub)}
.hcard .chip.ok{background:var(--goodbg);color:var(--good)}
.hcard .chip.warn{background:var(--badbg);color:var(--bad)}
.hcard[disabled]{opacity:.55}
details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.th .hd{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:6px}
.th ol{list-style:none;margin:0;padding:0;counter-reset:n}
.th li{counter-increment:n;position:relative;padding:7px 0 7px 30px;font-size:15px;line-height:1.7;border-top:1px dashed #cfdcf0}
.th li:first-child{border-top:0}
.th li:before{content:counter(n);position:absolute;left:0;top:9px;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;text-align:center;line-height:21px}
.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.th .sub{margin:3px 0 0;color:#444;font-size:14.5px;line-height:1.7}
.sc .lay.sum{border-left:4px solid #2e7d32;background:#f1f8f1}
/* ---- 새 직독직해·해설 화면 ---- */
.sc{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden;background:var(--bg)}
.sc-h{padding:11px 14px 10px;background:#eef2f8;border-bottom:1px solid var(--line)}
.sc-h .no2{display:inline-block;min-width:26px;height:26px;line-height:26px;border-radius:13px;background:var(--accent);color:#fff;font-weight:800;font-size:13px;text-align:center;padding:0 7px;margin-right:8px}
.sc-h .at{font-size:13px;color:var(--sub)}
.sc-h .tt{display:block;margin-top:7px;font-size:15.5px;font-weight:800;color:var(--accent);line-height:1.45}
.sc-b{padding:10px 12px 12px}
.sc .ch{margin-bottom:6px}
.sc .ce{font-size:17px}
.sc .ce sup,.nt sup{font-size:10px;font-weight:800;color:#b8651f;margin-left:1px}
.nts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.nt{font-size:13.5px;line-height:1.5;background:#fbf6ee;border:1px solid #f0e2cd;border-radius:8px;padding:5px 9px;color:#4a3a22}
.nt b{color:#33260f}
.sc .lay{border-radius:10px}
.sc .lay.nat{border-left:4px solid var(--accent);background:#f7f9fc}
.sc .lay.ana{background:#fff8e6;border-color:#f0dcc0;color:#4d3b05}
.sc .lay.ana b,.why2 b,.opx b,.evx b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.sc .lb{margin-bottom:4px}
.qc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}
.qchip small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-bottom:1px}
.qchip.o{border-color:var(--good);background:var(--goodbg)}
.qchip.x{border-color:var(--bad);background:var(--badbg)}
.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.trs{list-style:none;margin:0;padding:0;background:var(--soft);border-radius:10px;padding:8px 12px}
.trs li{font-size:15px;line-height:1.75;padding:2px 0}
.trs .n{display:inline-block;min-width:20px;font-size:12px;color:var(--sub);font-weight:700}
.evx{background:var(--goodbg);border:1px solid #bfe0cd;border-radius:10px;padding:10px 12px}

.opx{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px;background:var(--bg)}
.opx.a{border-color:var(--good);background:var(--goodbg)}
.opx .ot{font-size:15.5px;font-weight:700;line-height:1.55}
.opx .mk{display:inline-block;min-width:22px;font-weight:800;color:var(--sub);margin-right:4px}
.opx.a .mk{color:var(--good)}
.opx .bd{display:inline-block;font-size:11.5px;font-weight:800;color:#fff;border-radius:4px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.opx .bd.g{background:var(--good)}
.opx .bd.t{background:#b4472f}

.opx .xm{color:var(--bad);font-weight:800;margin-right:3px}
.wds{display:flex;flex-wrap:wrap;gap:6px}
.wds span{font-size:14px;background:var(--soft);border-radius:8px;padding:5px 9px;line-height:1.45}
.wds b{margin-right:5px}
.toq{display:block;width:100%;margin-top:14px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}
details.sub2{margin:12px 0 0}
details.sub2>summary{list-style:none;cursor:pointer;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px;padding:6px 0}
details.sub2>summary::-webkit-details-marker{display:none}
details.sub2>summary:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
details.sub2>summary:after{content:"+";margin-left:auto;font-size:18px;color:var(--sub)}
details.sub2[open]>summary:after{content:"\2212"}

.cr{color:#A3102E;font-weight:700}
.sc .lay.core{border-left:4px solid #2e7d32;background:#f1f8f1}
.ct{display:none;margin:7px 0 2px;padding:6px 9px;border-left:3px solid #d9a21b;background:#fff8e6;border-radius:6px;font-size:13.5px;line-height:1.55;color:#4d3b05}

.sc .ch{background:#fafbfe;border:1px solid #e8ecf5;border-bottom:1px solid #e8ecf5;padding:10px 12px}

.cks{margin:0 0 6px}.cchip{display:inline-block;font-size:12.5px;font-weight:700;color:#1f6f5f;background:#e5f4f0;border:1px solid #bfe3da;border-radius:999px;padding:4px 10px;text-decoration:none;margin:2px 4px 2px 0}

.sc .sc-b{background:#fff}

.sc .fin.n2{background:#fff8e1;border-color:#f0e2b0;border-left-color:#d9a21b}.sc .fin.n2 b{color:#8a6d00}


.rst{margin-top:8px;background:#fff8e1;border:1px solid #efe3b8;border-left:4px solid #d9a21b;border-radius:8px;padding:8px 10px;font-size:15px;line-height:1.7;word-break:keep-all}

var D=[{"no": "01", "typ": "주장", "src": "2015년 3월 19번", "evn": [3, 5, 6], "ev_en": "So this year, for our birthdays, let's tell our friends and family to donate money to a charity instead of buying us presents. / However, remember that we can live without new toys or games more easily than someone can live without food, clothing, or shelter. / So, we should tell our friends and family that, for our birthdays this year, we want to give to others.", "ev_ko": [[3, "그러니 올해는 우리 생일을 맞아, 우리에게 선물을 사 주는 대신 친구와 가족에게 자선단체에 돈을 기부하자고 말해 보자."], [5, "그러나 우리가 새 장난감이나 게임 없이 사는 것이, 누군가가 음식이나 옷, 살 곳 없이 사는 것보다 더 쉽다는 것을 기억하자."], [6, "그러니 우리는 친구와 가족에게, 올해 생일에는 다른 사람들에게 주고 싶다고 말해야 한다."]], "why": ["필자는 3번에서 선물 대신 <b>자선단체에 돈을 기부하자<\/b>고 제안합니다", "5번은 우리가 선물 없이 사는 것이 누군가가 의식주 없이 사는 것보다 <b>더 쉽다<\/b>는 이유를 댑니다", "6번은 <b>우리는 다른 사람들에게 주고 싶다<\/b>고 말하자며 결론을 맺습니다", "즉 '<b>생일 선물에 드는 비용으로 어려운 사람을 돕자<\/b>'는 주장입니다."], "ch": [{"n": "①", "t": "생일 파티를 간소하게 하자.", "g": "", "ok": false, "e": ["파티 규모나 형식을 줄이자는 말은 어디에도 없습니다", "이 글은 <b>선물<\/b>에 관한 이야기이지 파티 자체에 관한 이야기가 아닙니다."]}, {"n": "②", "t": "부모님께 감사하는 마음을 갖자.", "g": "", "ok": false, "e": ["부모님께 대한 감사(gratitude)는 언급되지 않습니다", "글의 대상은 <b>어려운 처지의 사람들<\/b>이지 부모님이 아닙니다."]}, {"n": "③", "t": "사용하지 않는 물건을 자선단체에 기부하자.", "g": "", "ok": false, "e": ["기부 대상은 <b>물건이 아니라 돈<\/b>입니다(donate money to a charity)", "또 '사용하지 않는 물건'에 대한 말은 지문에 없습니다."]}, {"n": "④", "t": "값비싼 선물보다는 정성이 담긴 편지를 쓰자.", "g": "", "ok": false, "e": ["편지(letter)에 관한 언급은 전혀 없습니다", "이 글의 대안은 편지가 아니라 <b>기부<\/b>입니다."]}, {"n": "⑤", "t": "생일 선물에 드는 비용으로 어려운 사람을 돕자.", "g": "", "ok": true, "e": ["3번의 <b>donate money instead of buying us presents<\/b>와 6번의 <b>we want to give to others<\/b>가 그대로 '<b>선물 비용으로 어려운 사람을 돕자<\/b>'는 주장입니다."]}], "tr": ["어떤 사람들은 우리보다 돈이 더 절실히 필요하다.", "예를 들어 어떤 사람들은 자연재해나 전쟁 때문에 집을 잃었고, 어떤 사람들은 먹을 것이나 입을 것이 충분하지 않다.", "그러니 올해는 우리 생일을 맞아, 우리에게 선물을 사 주는 대신 친구와 가족에게 자선단체에 돈을 기부하자고 말해 보자.", "몇몇 아이들은 생일 선물을 포기하고 싶어 하지 않을 수도 있다는 것을 알고, 나도 이해한다.", "그러나 우리가 새 장난감이나 게임 없이 사는 것이, 누군가가 음식이나 옷, 살 곳 없이 사는 것보다 function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function shuffle(arr,seed){const a=arr.slice();let s=hash(seed)||1;for(let i=a.length-1;i>0;i--){s=Math.imul(s^(s>>>15),2246822519)>>>0;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
const WS=WORDS.sets[0];

function hdr(){
  const on=id=>(view===id)?'on':'';
  const tabs=[['word','1','유반의어','답 맞춰보기'],['dk','2','직독직해','해석 맞춰보기'],['submit','3','답안지','정답 입력'],['exp','4','해설',S.sub?'정답·근거':'제출하면 열림']];
  return `<header><div class="wrap"><div class="row1"><h1>${esc(TITLE)}</h1><span><button class="link gohome" data-v="home">메뉴</button><a class="link" href="index.html">목록</a></span></div><div class="tabs">`+
    tabs.map(t=>`<button class="tab ${on(t[0])}" data-v="${t[0]}" ${(t[0]==='exp'&&!S.sub)?'disabled':''}><span class="t1"><span class="n">${t[1]}</span>${t[2]}</span><span class="t2">${t[3]}</span></button>`).join('')+
    `</div></div></header>`;
}
function noteList(){
  const out=[],ck=S.checks[WS.id]||{};
  WS.words.forEach((w,i)=>{
    const c=ck[i];if(!c)return;
    const parts=['m','s','a'].filter(p=>c[p]&&(p==='m'||w[p]));
    if(parts.length)out.push({i:i,w:w,parts:parts});
  });
  return out;
}
function render(){
  if(view==='home')renderHome();
  else if(view==='dk')renderDk();
  else if(view==='word')renderWord();
  else if(view==='note')renderNote();
  else if(view==='quiz')renderQuiz();
  else if(view==='result')renderResult();
  else if(view==='submit')renderSubmit();
  else if(view==='exp')renderExp();
  window.scrollTo(0,0);
}

that gigantic pile of stones<sup>3</sup> / that constitutes<sup>4</sup> the war memorial<sup>5</sup> in Leipzig, / for instance.", "notes": [["1", "no bigger than", "~보다 크지 않은"], ["2", "monumental", "기념비적인"], ["3", "pile of stones", "돌무더기"], ["4", "constitute", "이루다, 구성하다"], ["5", "war memorial", "전쟁 기념비"]], "lit": "이집트의 어떤 조각상은 / 사람 손보다 크지 않은 / 더 기념비적이다 / 저 거대한 돌무더기보다 / 라이프치히의 전쟁 기념비를 이루는 / 예를 들어", "nat": "예를 들어 사람 손보다 크지 않은 이집트 조각상 하나가, 라이프치히의 전쟁 기념비를 이루는 저 거대한 돌무더기보다 더 기념비적이다.", "ana": "<b>no bigger than</b>은 '~보다 크지 않은'이라는 <b>비교급 부정</b>으로 주어 sculpture를 꾸밉니다. 문장의 진짜 동사는 <b>is more monumental than</b>이며, than 뒤의 <b>that gigantic pile of stones</b>가 비교 대상입니다. 그 뒤의 <b>that</b>은 pile of stones를 받는 <b>주격 관계대명사</b>이고, 선행사가 단수 <b>pile</b>이므로 동사도 <b>constitutes</b>로 단수 일치합니다.", "pe": "An \u0001Egyptian\u0002 sculpture / \u0001no bigger than<sup>1</sup> a person's hand\u0002 / is more monumental<sup>2</sup> / \u0001than that gigantic pile of stones<sup>3</sup>\u0002 / \u0001that constitutes<sup>4</sup> the war memorial<sup>5</sup> in Leipzig\u0002, / \u0001for instance\u0002.", "pk": "\u0001이집트의\u0002 어떤 조각상은 / \u0001사람 손보다 크지 않은\u0002 / 더 기념비적이다 / \u0001저 거대한 돌무더기보다\u0002 / \u0001라이프치히의 전쟁 기념비를 이루는\u0002 / \u0001예를 들어\u0002", "core": "조각상은 더 기념비적이다.", "tags": ["주어. Egyptian = 형용사: sculpture를 꾸밈", "no bigger than ~ = 형용사구: sculpture를 꾸밈 (비교급 부정)", "동사 + 보어: is more monumental", "than ~ = 비교 부사구: more monumental을 꾸밈", "that constitutes ~ = 관계절(형용사절): pile of stones를 꾸밈, 단수 pile이라 constitutes", "for instance = 부사구: 문장 전체를 꾸밈"], "steps": [{"t": "이 문장은 <b>S + V + C(2형식) + 비교 than구</b>이다. 주어 뒤 수식과 than 뒤 관계절 때문에 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: An Egyptian sculpture (이집트의 조각상 하나)", "V: is (be ~이다)", "C: more monumental (더 기념비적인)", "뼈대 = <b>An Egyptian sculpture is more monumental</b>"]}, {"t": "<b>no bigger than a person's hand</b>는 sculpture 뒤에서 꾸미는 <b>형용사구</b>이다. 동사가 아니다.", "sub": ["no bigger than ~ = ~보다 크지 않은, 즉 ~만큼 작은", "a person's hand (사람의 손)"]}, {"t": "<b>than that gigantic pile of stones</b>는 비교 대상이다. than (~보다) 뒤의 pile이 중심이다.", "sub": ["gigantic (거대한), pile of stones (돌무더기), that은 '저'라는 뜻의 지시 형용사"]}, {"t": "<b>that constitutes the war memorial in Leipzig</b>는 pile을 꾸미는 <b>관계절</b>이다. pile이 단수라서 constitutes (constitute 이루다의 3인칭 단수형)이다.", "sub": ["war memorial (전쟁 기념비), in Leipzig (라이프치히에 있는)"]}, {"t": "<b>for instance</b>(예를 들어)는 문장 전체를 꾸미는 부사구이다. 문장 끝에 있어도 뼈대와 상관없다."}], "sum": "손바닥만 한 이집트 조각상이, 거대한 돌무더기 기념비보다 더 기념비적"}, {"i": "06", "q": "04", "s": "8", "title": "S+V+C + 관계절 + such ~ that 구문 + 양보절", "eng": "This inner weight<sup>1</sup> is the quality / which Egyptian art possesses<sup>2</sup> / to such a degree<sup>3</sup> / that everything in it seems to be made of primeval<sup>4</sup> stone, / like a mountain range, / even if it is only a few inches across or carved<sup>5</sup> in wood.", "notes": [["1", "inner weight", "내적 무게(감)"], ["2", "possess", "지니다, 소유하다"], ["3", "to such a degree that", "~할 정도로"], ["4", "primeval", "원시 시대의"], ["5", "carved in wood", "나무에 조각된"]], "lit": "이 내적 무게는 그 특성이다 / 이집트 예술이 지니고 있는 / 그런 정도로 / 그 안의 모든 것이 원시 시대의 돌로 만들어진 것처럼 보일 / 산맥처럼 / 그것이 겨우 폭 몇 인치이거나 나무에 조각된 것일지라도", "nat": "이 내적 무게는 이집트 예술이 지닌 특성인데, 그 정도가 어찌나 강한지 폭이 몇 인치밖에 안 되거나 나무에 조각된 것이라도 그 안의 모든 것이 마치 산맥처럼 원시 시대의 돌로 만들어진 듯 보일 정도이다.", "ana": "<b>which</b>는 <b>the quality</b>를 받는 <b>목적격 관계대명사</b>이고, Egyptian art possesses의 목적어 자리가 비어 있는 것이 그 증거입니다. <b>to such a degree that ~</b>는 '~할 정도로'라는 <b>such ~ that 구문</b>으로, that절 안의 <b>seems to be made of</b>는 '~로 만들어진 것처럼 보인다'입니다. 맨 뒤 <b>even if</b>는 '설령 ~일지라도'라는 <b>양보의 접속사</b>이며, <b>it is ~ across or (is) carved in wood</b>에서 carved 앞에 is가 생략된 <b>병렬</b> 구조입니다.", "pe": "This \u0001inner\u0002 weight<sup>1</sup> is the quality / \u0001which Egyptian art possesses<sup>2</sup>\u0002 / \u0001to such a degree<sup>3</sup>\u0002 / \u0001that everything in it seems to be made of primeval<sup>4</sup> stone\u0002, / \u0001like a mountain range\u0002, / \u0001even if it is only a few inches across or carved<sup>5</sup> in wood\u0002.", "pk": "이 \u0001내적\u0002 무게는 그 특성이다 / \u0001이집트 예술이 지니고 있는\u0002 / \u0001그런 정도로\u0002 / \u0001그 안의 모든 것이 원시 시대의 돌로 만들어진 것처럼 보일\u0002 / \u0001산맥처럼\u0002 / \u0001그것이 겨우 폭 몇 인치이거나 나무에 조각된 것일지라도\u0002", "core": "이 무게는 그 특성이다.", "tags": ["주어 + 동사 + 보어. inner = 형용사: weight를 꾸밈", "which ~ = 관계절(형용사절, 목적격): the quality를 꾸밈. possesses의 목적어 자리가 빔", "to such a degree = 전치사구(부사구): possesses를 꾸밈, <b>such ~ that</b> 구문의 앞부분", "that ~ = 부사절(정도): to such a degree를 꾸밈. seems to be made of = '~로 만들어진 듯 보임'", "like a mountain range = 전치사구(부사구): 앞 that절의 seems를 꾸밈", "even if ~ = 양보 부사절: 앞 절을 꾸밈. it is ~ or (is) carved에서 is 생략 병렬"], "steps": [{"t": "이 문장은 <b>S + V + C(2형식)</b> 뒤에 관계절, 정도의 that절, 양보절이 겹겹이 붙은 문장이다. 수식이 많아 길어 보일 뿐 뼈대는 짧다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: This inner weight (이 내적 무게)", "V: is (be ~이다)", "C: the quality (특성, 성질)", "뼈대 = <b>This inner weight is the quality</b>"]}, {"t": "<b>which Egyptian art possesses</b>는 quality를 꾸미는 <b>관계절</b>이다. possess (지니다)의 목적어 자리가 which로 빠져 있다. <b>to such a degree</b>(그런 정도로)는 possesses를 꾸미는 부사구이고, 뒤의 that절과 짝이다."}, {"t": "<b>that everything in it seems to be made of primeval stone, like a mountain range</b>는 '그 정도가 어떠냐면'을 설명하는 <b>such ~ that 부사절</b>이다.", "sub": ["S: everything in it (그 안의 모든 것)", "V: seems (seem ~처럼 보이다)", "C: to be made of primeval stone (원시 시대의 돌로 만들어진 것처럼, to부정사 보어) — 기준: seem + to부정사는 2형식", "primeval stone (원시 시대의 돌), like a mountain range (산맥처럼)"]}, {"t": "<b>even if it is only a few inches across or carved in wood</b>는 <b>양보</b>('~일지라도') 부사절이다. it is only a few inches across와 (it is) carved in wood가 or로 병렬되고, 두 번째 is는 생략되었다.", "sub": ["across (폭이 ~인), carved = carve (조각하다)의 과거분사, 수동", "only a few inches (겨우 몇 인치)"]}], "sum": "이집트 예술의 내적 무게, 작거나 나무 조각이라도 산맥 같은 돌처럼 보일 정도"}, {"i": "07", "q": "05", "s": "A-2", "title": "복합관계대명사 whoever 두 절(세미콜론)", "eng": "Whoever<sup>1</sup> has an abundance of<sup>2</sup> sugar / hands some over; / whoever is running short<sup>3</sup> / gets help.", "notes": [["1", "whoever", "~하는 사람은 누구든"], ["2", "abundance", "풍부함"], ["3", "run short", "부족해지다"], ["4", "hand over", "건네주다"]], "lit": "설탕이 풍부한 사람은 누구든 / 좀 건네준다 / 부족한 사람은 누구든 / 도움을 받는다", "nat": "설탕이 넉넉한 나무는 누구든 남는 것을 건네주고, 부족한 나무는 누구든 도움을 받는다.", "ana": "<b>Whoever</b>는 '~하는 사람은 누구든'이라는 <b>복합관계대명사</b>로, 그 자체가 <b>명사절의 주어</b> 역할을 합니다. <b>Whoever has an abundance of sugar</b>가 첫 절의 주어이고, <b>whoever is running short</b>가 두 번째 절의 주어로 <b>병렬</b>을 이룹니다. 세미콜론(;)은 두 개의 독립된 절을 콤마 없이 이어 주는 부호로, and 정도의 의미로 읽으면 자연스럽습니다.", "pe": "Whoever<sup>1</sup> has an abundance of<sup>2</sup> sugar / hands some over; / whoever is running short<sup>3</sup> / gets help.", "pk": "설탕이 풍부한 사람은 누구든 / 좀 건네준다 / 부족한 사람은 누구든 / 도움을 받는다", "core": "설탕이 많은 사람은 누구든 좀 건네주고, 부족한 사람은 도움을 받는다.", "tags": ["<b>Whoever</b>절 = 주어(명사절): '~하는 사람은 누구든'", "동사 <b>hands over</b>(타동사 + 부사 불변화사, over는 V의 일부) + 목적어 some. 세미콜론 뒤로 병렬 절", "두 번째 <b>whoever</b>절 = 주어(명사절). is running short", "동사 + 목적어: gets help"], "steps": [{"t": "이 문장은 <b>세미콜론(;)으로 이어진 S+V+O 두 절</b>이다. 두 절 모두 주어가 whoever절(명사절)이라 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["첫째 절 S: Whoever has an abundance of sugar (설탕이 풍부한 사람은 누구든)", "V: hands over (hand over 건네주다, 3인칭 단수형)", "O: some (일부, 설탕 일부)", "둘째 절 S: whoever is running short (부족한 사람은 누구든)", "V: gets (get 받다)", "O: help (도움)", "뼈대 = <b>Whoever ... hands some over; whoever ... gets help</b>"]}, {"t": "<b>Whoever has an abundance of sugar</b>에서 whoever는 '~하는 사람은 누구든'이라는 뜻이고 절 전체가 주어이다. 절 안의 동사 has (가지다)는 whoever의 동사이다.", "sub": ["abundance (풍부함), an abundance of sugar = 풍부한 설탕"]}, {"t": "함정: 첫째 절의 진짜 동사는 has가 아니라 <b>hands</b>이다. <b>hand over</b>(건네주다)는 한 덩어리 동사인데, 대명사 목적어 some이 가운데 끼어 hands some over로 갈라졌다."}, {"t": "<b>whoever is running short</b>도 주어 역할의 명사절이다. run short (부족해지다)의 진행형이다. 둘째 절의 동사는 gets이다."}], "sum": "설탕이 넉넉한 쪽은 나눠 주고, 부족한 쪽은 도움 받음"}, {"i": "08", "q": "06", "s": "4", "title": "S+V+O — S+V(수동태, had to)", "eng": "The second had no deadlines<sup>1</sup> — / all three papers just had to be submitted<sup>2</sup> / by the last day of class<sup>3</sup>.", "notes": [["1", "deadline", "마감 기한"], ["2", "submit", "제출하다"], ["3", "the last day of class", "수업 마지막 날"]], "lit": "두 번째 학급은 마감 기한이 없었다 / 세 편의 보고서 모두 그저 제출되어야 했다 / 수업 마지막 날까지", "nat": "두 번째 학급에는 마감 기한이 아예 없었고, 세 편의 보고서 모두 그저 수업 마지막 날까지만 제출하면 되었다.", "ana": "대시(—) 뒤는 앞 문장 <b>The second had no deadlines</b>를 구체적으로 풀어 주는 <b>삽입·부연</b> 문장입니다. <b>had to be submitted</b>는 <b>had to + 수동태(be + p.p.)</b>로 '제출되어야 했다'이며, submit(제출하다)이 아니라 <b>제출당하는(수동)</b> 쪽으로 읽어야 합니다. <b>by the last day of class</b>는 '~까지는'이라는 <b>기한</b>을 나타내는 전치사구입니다.", "pe": "The second had no deadlines<sup>1</sup> — / all three papers \u0001just\u0002 had to be submitted<sup>2</sup> / \u0001by the last day of class<sup>3</sup>\u0002.", "pk": "두 번째 학급은 마감 기한이 없었다 / 세 편의 보고서 모두 \u0001그저\u0002 제출되어야 했다 / \u0001수업 마지막 날까지\u0002", "core": "두 번째는 마감이 없었고, 세 보고서는 제출되어야 했다.", "tags": ["주어 + 동사 + 목적어", "대시 뒤 부연 절. just = 부사: had to be submitted를 꾸밈. <b>had to + 수동태</b>", "by ~ = 전치사구(부사구, 기한): be submitted를 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b> 뒤에 대시(—)로 <b>S+V(수동태)</b>가 이어진 두 절이다. 대시 뒤는 앞말을 풀어 주는 부연이다."}, {"t": "뼈대부터 찾는다.", "sub": ["첫째 절 S: The second (두 번째)", "V: had (have 가지다의 과거형)", "O: no deadlines (마감 기한 없음, deadline 마감 기한)", "둘째 절 S: all three papers (세 편의 보고서 모두, paper 보고서)", "V: had to be submitted (had to ~해야 했다 + submit 제출하다의 수동, 제출되어야 했다)", "뼈대 = <b>The second had no deadlines — all three papers had to be submitted</b>", "기준: had to + 동사 = 동사 덩어리, 수동태 주절 = 1형식"]}, {"t": "<b>just</b>(그저)는 had to be submitted를 꾸미는 부사이다."}, {"t": "<b>by the last day of class</b>는 be submitted를 꾸미는 전치사구(부사구)이다. by는 '~까지'로 기한을 나타낸다.", "sub": ["the last day of class (수업 마지막 날)"]}, {"t": "함정: 첫째 절의 had는 '가지다'라는 본동사이고, 둘째 절의 had to는 '~해야 했다'라는 동사 덩어리이다. 모양은 같아도 역할이 다르다."}], "sum": "마감은 없고, 세 보고서는 수업 마지막 날까지만 제출"}], "qs": [{"q": "01", "type": "주장", "src": "2015년 3월 19번", "ans": "⑤", "tr": [["1", "어떤 사람들은 우리보다 돈이 더 절실히 필요하다."], ["2", "예를 들어 어떤 사람들은 자연재해나 전쟁 때문에 집을 잃었고, 어떤 사람들은 먹을 것이나 입을 것이 충분하지 않다."], ["3", "그러니 올해는 우리 생일을 맞아, 우리에게 선물을 사 주는 대신 친구와 가족에게 자선단체에 돈을 기부하자고 말해 보자."], ["4", "몇몇 아이들은 생일 선물을 포기하고 싶어 하지 않을 수도 있다는 것을 알고, 나도 이해한다."], ["5", "하지만 우리가 새 장난감이나 게임 없이 사는 것이, 누군가가 음식이나 옷, 살 곳 없이 사는 것보다 훨씬 쉽다는 사실을 기억하자."], ["6", "그러니 우리는 친구와 가족에게, 올해 생일에는 다른 사람들에게 주고 싶다고 말해야 한다."]], "evh": "3 · 5 · 6번 문장", "ev": [{"en": true, "h": "let's tell our friends and family to donate money to a charity instead of buying us presents / we can live without new toys or games more easily than someone can live without food, clothing, or shelter / we should tell our friends and family that ~ we want to give to others"}, {"en": false, "h": "주장 문제는 <b>제안형 문장</b>과 <b>마지막 결론 문장</b>을 함께 봐야 합니다. 3번의 <b>let's tell ~ to donate money to a charity instead of buying us presents</b>가 첫 제안이고, 5번이 '<b>우리가 없이 사는 것이 훨씬 쉽다</b>'는 근거를 대며, 6번이 <b>we should tell ~ we want to give to others</b>로 결론을 다시 못 박습니다. 즉 이 글의 핵심은 '<b>생일 선물 비용을 남을 돕는 데 쓰자</b>'는 것입니다."}], "opts": [{"n": "①", "t": "생일 파티를 간소하게 하자.", "a": false, "x": true, "trap": false, "e": "파티 규모나 형식을 줄이자는 말은 어디에도 없습니다. 이 글은 <b>선물</b>에 관한 이야기이지 파티 자체에 관한 이야기가 아닙니다."}, {"n": "②", "t": "부모님께 감사하는 마음을 갖자.", "a": false, "x": true, "trap": false, "e": "부모님께 대한 감사(gratitude)는 언급되지 않습니다. 글의 대상은 <b>어려운 처지의 사람들</b>이지 부모님이 아닙니다."}, {"n": "③", "t": "사용하지 않는 물건을 자선단체에 기부하자.", "a": false, "x": true, "trap": true, "e": "기부 대상은 <b>물건이 아니라 돈</b>입니다(donate money to a charity). '자선단체'라는 단어만 보고 고르면 걸리기 쉽습니다."}, {"n": "④", "t": "값비싼 선물보다는 정성이 담긴 편지를 쓰자.", "a": false, "x": true, "trap": false, "e": "편지(letter)에 관한 언급은 전혀 없습니다. 이 글의 대안은 편지가 아니라 <b>기부</b>입니다."}, {"n": "⑤", "t": "생일 선물에 드는 비용으로 어려운 사람을 돕자.", "a": true, "x": false, "trap": false, "e": "3번의 <b>donate money instead of buying us presents</b>와 6번의 <b>we want to give to others</b>가 그대로 '<b>선물 비용으로 어려운 사람을 돕자</b>'는 주장입니다."}], "w": [["donate", "기부하다"], ["charity", "자선단체"], ["instead of", "~ 대신에"], ["give up", "포기하다"], ["natural disaster", "자연재해"], ["shelter", "주거지, 살 곳"], ["live without", "~ 없이 살다"], ["more easily", "더 쉽게"], ["clothing", "옷, 의류"], ["present", "선물"]]}, {"q": "02", "type": "제목", "src": "2021년 11월 24번", "ans": "②", "tr": [["1", "현대에 들어 사회는 더 역동적으로 변했다."], ["2", "사회적 유동성이 늘어났고, 사람들은 이를테면 직업, 결혼, 종교와 관련해 더 높은 수준의 선택권을 행사하기 시작했다."], ["3", "이는 사회 안의 전통적인 역할에 도전 과제를 안겼다."], ["4", "대안이 현실이 될 수 있게 되면서, 자신이 타고난 역할에 매여야 한다는 인식은 예전만큼 뚜렷하지 않게 되었다."], ["5", "삶의 선택을 더 많이 통제하는 일은 가능해졌을 뿐 아니라 사람들이 바라는 일이 되었다."], ["6", "그러자 정체성이 하나의 문제가 되었다."], ["7", "그것은 더 이상 태어날 때부터 거의 다 갖춰진 것이 아니라, 찾아내야 할 무언가가 되었다."], ["8", "사회가 규정해 온 전통적인 역할 정체성은 사람들에게 씌워진 가면처럼 보이기 시작했고, 그 사람들의 진짜 자아는 그 밑 어딘가에서 찾아야 하는 것이 되었다."]], "evh": "6 · 7 · 8번 문장", "ev": [{"en": true, "h": "Identity then became a problem. / It was no longer almost ready-made at birth but something to be discovered. / Traditional role identities ~ began to appear as masks imposed on people whose real self was to be found somewhere underneath."}, {"en": false, "h": "제목 문제는 <b>글의 결론이 향하는 지점</b>을 찾아야 합니다. 6번에서 '<b>정체성이 문제가 되었다</b>'고 화제를 던지고, 7번이 '<b>더 이상 타고나는 것이 아니라 찾아내야 하는 것</b>'이라 못 박으며, 8번이 전통적 역할을 <b>가면</b>에, 진짜 자아를 그 <b>밑에서 찾아야 할 것</b>에 비유합니다. 세 문장을 합치면 '<b>현대 사회가 우리로 하여금 정체성을 발견하게 만든다</b>'는 흐름이 완성됩니다."}], "opts": [{"n": "①", "t": "What Makes Our Modern Society So Competitive?", "a": false, "x": true, "trap": false, "e": "'무엇이 우리 사회를 이토록 경쟁적으로 만드는가'입니다. 경쟁(competition)이라는 단어나 개념은 본문에 없습니다."}, {"n": "②", "t": "How Modern Society Drives Us to Discover Our Identities", "a": true, "x": false, "trap": false, "e": "7번의 <b>something to be discovered</b>와 8번의 <b>real self was to be found</b>가 그대로 '<b>정체성을 발견하도록 이끈다</b>'는 제목과 연결됩니다."}, {"n": "③", "t": "Social Masks: A Means to Build Trustworthy Relationships", "a": false, "x": true, "trap": true, "e": "'가면'이라는 단어(mask)는 나오지만, 그것이 <b>신뢰할 수 있는 관계를 쌓는 수단</b>이라는 내용은 없습니다. 가면은 오히려 <b>진짜 자아를 가리는 것</b>으로 쓰였습니다."}, {"n": "④", "t": "The More Social Roles We Have, the Less Choice We Have", "a": false, "x": true, "trap": false, "e": "본문은 오히려 선택권이 <b>늘어났다(increasing control, higher degree of choice)</b>고 말합니다. '선택이 줄어든다'는 정반대의 내용입니다."}, {"n": "⑤", "t": "Increasing Social Mobility Leads Us to a More Equal Society", "a": false, "x": true, "trap": false, "e": "사회적 유동성 증가는 2번에 나오지만, 그것이 <b>더 평등한 사회로 이어진다</b>는 내용은 전혀 없습니다. equal이라는 개념 자체가 본문에 없습니다."}], "w": [["dynamic", "역동적인"], ["social mobility", "사회적 유동성"], ["traditional", "전통적인"], ["commit to", "~에 전념하다, 헌신하다"], ["alternative", "대안"], ["identity", "정체성"], ["ready-made", "이미 만들어진, 기성의"], ["prescribe", "규정하다"], ["impose A on B", "A를 B에게 부과하다, 씌우다"], ["real self", "진짜 자아"]]}, {"q": "03", "type": "요지", "src": "2016년 6월 21번", "ans": "①", "tr": [["1", "표정에 관한 흥미로운 연구가 최근 미국심리학회에 의해 발표되었다."], ["2", "중국인 열다섯 명과 스코틀랜드인 열다섯 명이 이 연구에 참여했다."], ["3", "참가자들은 컴퓨터 화면 속에서 무작위로 바뀌는, 감정이 드러나지 않는 얼굴을 보고 그 표정을 행복, 슬픔, 놀람, 두려움, 화남으로 분류했다."], ["4", "이 반응 덕분에 연구자들은 참가자들이 각 감정과 연관 짓는, 표정을 드러내는 얼굴 특징을 밝혀낼 수 있었다."], ["5", "연구 결과, 중국인 참가자들은 표정을 읽을 때 눈에 더 많이 의존한 반면, 스코틀랜드인 참가자들은 눈썹과 입에 의존했다."], ["6", "서로 다른 문화권의 사람들은 행복, 슬픔, 화남의 표정을 서로 다른 방식으로 인식한다."], ["7", "즉, 표정은 '감정의 보편적인 언어'가 아니다."]], "evh": "5 · 6 · 7번 문장", "ev": [{"en": true, "h": "the Chinese participants relied more on the eyes to tell facial expressions, while the Scottish participants relied on the eyebrows and mouth. / People from different cultures perceive ~ facial expressions in different ways. / facial expressions are not the universal language of emotions"}, {"en": false, "h": "요지 문제는 <b>연구 결과 문장</b>과 <b>결론 문장</b>을 이어서 읽어야 합니다. 5번이 중국인과 스코틀랜드인이 <b>표정을 읽는 방식 자체가 다르다</b>는 실험 결과를 보여주고, 6·7번이 이를 '<b>문화마다 표정을 인식하는 방식이 다르다</b>', '<b>보편적 언어가 아니다</b>'로 일반화합니다. 결국 이 글의 요지는 <b>표정 인식이 문화에 따라 다르다</b>는 것입니다."}], "opts": [{"n": "①", "t": "문화에 따라 표정을 인식하는 방식이 다르다.", "a": true, "x": false, "trap": false, "e": "6번의 <b>People from different cultures perceive ~ in different ways</b>와 7번의 <b>not the universal language</b>가 그대로 이 요지입니다."}, {"n": "②", "t": "동서양을 막론하고 선호하는 표정이 있다.", "a": false, "x": true, "trap": false, "e": "'선호하는 표정'이라는 개념 자체가 본문에 없습니다. 본문은 <b>인식(pe
