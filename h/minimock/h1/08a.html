var EXP={"01": "<p class=\"mtr\">마더텅 정답률 <b>85%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">주장은 <b>제안·결론 신호</b>인 let’s(~하자)·should(~해야 한다)가 있는 문장에 있어요. 3번 제안과 6번 결론이 같은 말, 즉 선물 대신 <b>donate</b>(기부하다)·<b>give to others</b>(남에게 주다)를 하니 그걸 잡으세요.</p><div class=\"ck-step\"><span class=\"lab\">1~2번 · 문제 상황</span><div class=\"en\">Some people <mark>need money</mark> more than we do.</div><p class=\"ko\">어떤 사람들은 우리보다 더 <mark>돈을 필요로 한다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>So(그러니)로 앞의 문제 상황에서 제안으로 넘어가요</span></div><div class=\"ck-step key\"><span class=\"lab\">3번 문장 · 첫 제안</span><div class=\"en\">So this year, for our birthdays, <mark>let’s tell</mark> our friends and family to donate money to a charity <mark>instead of buying us presents</mark>.</div><p class=\"ko\">그러니 올해는 우리 생일에, <mark>우리에게 선물을 사 주는 대신</mark> 자선단체에 돈을 기부하라고 친구들과 가족에게 <mark>말하자</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>4번 “선물 포기하기 싫을 수도 있다”를 However(하지만)로 되받아요</span></div><div class=\"ck-step\"><span class=\"lab\">5번 문장 · 반대 마음에 답하기</span><div class=\"en\"><mark>However</mark>, remember that we can live without new toys or games more easily than someone can live without food, clothing, or shelter.</div><p class=\"ko\"><mark>하지만</mark>, 누군가가 음식, 옷, 혹은 주거지 없이 사는 것보다 우리가 새 장난감이나 게임 없이 더 쉽게 살 수 있다는 것을 기억하라.</p></div><div class=\"ck-via\"><i>▼</i><span>So(그러므로) + should(~해야 한다)로 주장을 다시 못 박아요</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 결정적 결론</span><div class=\"en\">So, we <mark>should</mark> tell our friends and family that, for our birthdays this year, we want to <mark>give to others</mark>.</div><p class=\"ko\">그러므로, 올해 우리 생일에는 <mark>다른 사람들에게 주고 싶다고</mark> 우리는 친구들과 가족에게 <mark>말해야 한다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">생일 선물에 드는 비용으로 어려운 사람을 돕자.<small>3번 instead of buying us presents(선물 대신)와 6번 give to others(남에게 주다)를 합친 말이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">사용하지 않는 물건을 자선단체에 기부하자.</span><span class=\"why\">[지문에 없음] 3번의 charity(자선단체)만 따온 함정이에요. 기부하는 건 안 쓰는 물건이 아니라 선물 살 돈(donate money 돈을 기부하다)이에요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">생일 파티를 간소하게 하자.</span><span class=\"why\">[지문에 없음] 파티 이야기는 한 번도 안 나와요. 지문이 바꾸자는 건 파티가 아니라 presents(선물)예요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">부모님께 감사하는 마음을 갖자.</span><span class=\"why\">[지문에 없음] 3·6번의 family(가족)는 감사할 대상이 아니라 “기부해 달라”고 말할 상대예요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">값비싼 선물보다는 정성이 담긴 편지를 쓰자.</span><span class=\"why\">[지문에 없음] 편지는 안 나와요. 선물 대신 하자는 건 자선단체 기부(donate money to a charity)예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Some people need money</div><div class=\"k\">어떤 사람들은 돈을 필요로 한다</div></div><div class=\"rc\"><div class=\"e\">more than we do.</div><div class=\"k\">우리가 그러는(= 돈을 필요로 하는) 것보다 더.</div></div><div class=\"rnat\">어떤 사람들은 우리보다 돈이 더 절실히 필요하다.</div><div class=\"rst\">우리 반 친구들보다 훨씬 더 돈이 급한 친구들이 세상에 있어요. = 지문 1번, 어떤 사람들은 우리보다 돈이 더 필요하다는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">For example,</div><div class=\"k\">예를 들어,</div></div><div class=\"rc\"><div class=\"e\">some people have lost their homes</div><div class=\"k\">어떤 사람들은 집을 잃었다</div></div><div class=\"rc\"><div class=\"e\">due to natural disasters or war,</div><div class=\"k\">자연재해나 전쟁 때문에,</div></div><div class=\"rc\"><div class=\"e\">while others don’t have enough food or clothing.</div><div class=\"k\">한편 다른 사람들은 충분한 음식이나 옷을 가지고 있지 않다.</div></div><div class=\"rnat\">예를 들어 어떤 사람들은 자연재해나 전쟁 때문에 집을 잃었고, 어떤 사람들은 먹을 것이나 입을 것이 충분하지 않다.</div><div class=\"rst\">예를 들면 지진이나 전쟁으로 집을 잃었거나, 밥과 옷이 모자란 친구들이에요. 지문 2번이 그 예를 들어 줘요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc\"><div class=\"e\">So this year,</div><div class=\"k\">그러니 올해는,</div></div><div class=\"rc\"><div class=\"e\">for our birthdays,</div><div class=\"k\">우리 생일에,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">let’s tell</span> our friends and family</div><div class=\"k\">우리의 친구들과 가족에게 <span class=\"cw\">말하자</span></div></div><div class=\"rc\"><div class=\"e\">to donate money to a charity</div><div class=\"k\">자선단체에 돈을 기부하라고</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">instead of buying us presents</span>.</div><div class=\"k\"><span class=\"cw\">우리에게 선물을 사 주는 대신</span>.</div></div><div class=\"rnat\">그러니 올해는 우리 생일을 맞아, 우리에게 선물을 사 주는 대신 친구와 가족에게 자선단체에 돈을 기부하자고 말해 보자.</div><div class=\"rst\"><b>그러니 올해 내 생일엔</b> 친구들과 가족에게 “선물 대신 그 돈을 자선단체에 보내 줘” 하고 말해 봐요. 지문 3번의 첫 제안(let’s ~하자)이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">I know</div><div class=\"k\">나는 안다</div></div><div class=\"rc\"><div class=\"e\">that some kids might not want</div><div class=\"k\">어떤 아이들은 원하지 않을지도 모른다는 것을</div></div><div class=\"rc\"><div class=\"e\">to give up their birthday presents,</div><div class=\"k\">자신들의 생일 선물을 포기하는 것을,</div></div><div class=\"rc\"><div class=\"e\">and I understand.</div><div class=\"k\">그리고 (나는) 이해한다.</div></div><div class=\"rnat\">몇몇 아이들은 생일 선물을 포기하고 싶어 하지 않을 수도 있다는 것을 알고, 나도 이해한다.</div><div class=\"rst\">“그래도 새 게임은 받고 싶은데…” 하는 마음, 필자도 알고 이해해요. 지문 4번은 반대 마음을 먼저 인정해 줘요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">However</span>,</div><div class=\"k\"><span class=\"cw\">하지만</span>,</div></div><div class=\"rc\"><div class=\"e\">remember that we can live without new toys or games</div><div class=\"k\">우리가 새 장난감이나 게임 없이 살 수 있다는 것을 기억하라</div></div><div class=\"rc\"><div class=\"e\">more easily than someone can live without food, clothing, or shelter.</div><div class=\"k\">누군가가 음식, 옷, 혹은 주거지 없이 사는 것보다 더 쉽게.</div></div><div class=\"rnat\">그러나 우리가 새 장난감이나 게임 없이 사는 것이, 누군가가 음식이나 옷, 살 곳 없이 사는 것보다 더 쉽다는 것을 기억하자.</div><div class=\"rst\"><b>하지만</b>(However) 새 게임 없이 사는 건 밥·옷·집 없이 사는 것보다 훨씬 쉬워요. 지문 5번이 그 이유를 대 줘요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">So,</div><div class=\"k\">그러므로,</div></div><div class=\"rc ckc\"><div class=\"e\">we <span class=\"cw\">should</span> tell our friends and family</div><div class=\"k\">우리는 친구들과 가족에게 <span class=\"cw\">말해야 한다</span></div></div><div class=\"rc\"><div class=\"e\">that, for our birthdays this year,</div><div class=\"k\">올해 우리 생일에,</div></div><div class=\"rc ckc\"><div class=\"e\">we want to <span class=\"cw\">give to others</span>.</div><div class=\"k\">우리는 <span class=\"cw\">다른 사람들에게 주고 싶다고</span>.</div></div><div class=\"rnat\">그러니 우리는 친구와 가족에게, 올해 생일에는 다른 사람들에게 주고 싶다고 말해야 한다.</div><div class=\"rst\"><b>그러니까</b> 이번 생일엔 “나는 다른 사람에게 주고 싶어” 하고 말해야 해요. 지문 6번이 should(~해야 한다)로 주장을 못 박아요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"donate\" data-m=\"기부하다\"><b>donate</b>기부하다</button><button type=\"button\" class=\"wdb\" data-w=\"charity\" data-m=\"자선단체\"><b>charity</b>자선단체</button><button type=\"button\" class=\"wdb\" data-w=\"instead of\" data-m=\"~ 대신에\"><b>instead of</b>~ 대신에</button><button type=\"button\" class=\"wdb\" data-w=\"give up\" data-m=\"포기하다\"><b>give up</b>포기하다</button><button type=\"button\" class=\"wdb\" data-w=\"natural disaster\" data-m=\"자연재해\"><b>natural disaster</b>자연재해</button><button type=\"button\" class=\"wdb\" data-w=\"shelter\" data-m=\"주거지, 살 곳\"><b>shelter</b>주거지, 살 곳</button></div>", "02": "<p class=\"mtr\">마더텅 정답률 <b>60%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">제목은 <b>원인 → 결과</b>를 묶어서 찾는 문제예요. 2번 선택권이 커진 사회(원인)가 6~7번에서 <b>identity</b>(정체성)를 <b>to be discovered</b>(발견되어야 할) 것으로 만들어요(결과).</p><div class=\"ck-step\"><span class=\"lab\">1~2번 문장 · 원인</span><div class=\"en\">Social mobility increased, and people began to exercise <mark>a higher degree of choice</mark> …</div><p class=\"ko\">사회적 유동성이 증가했고, 사람들은 <mark>더 높은 정도의 선택권을</mark> 행사하기 시작했다 …</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>3번</em>전통적인 역할이 흔들림</span><span><em>4번</em>타고난 역할에 얽매일 필요가 덜 분명해짐</span><span><em>5번</em>내 삶을 내가 고르는 게 바람직해짐</span></div><div class=\"ck-eq\">⇒ 3~5번의 공통점 = 정해진 역할 대신 내가 고르는 삶</div></div><div class=\"ck-via\"><i>▼</i><span>then(그러자)으로 선택권이 커진 결과를 말해요</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 화제 등장</span><div class=\"en\"><mark>Identity then became a problem.</mark></div><p class=\"ko\">그러자 <mark>정체성이 문제가 되었다.</mark></p></div><div class=\"ck-via\"><i>▼</i><span>어떤 문제인지 풀어 줘요: 타고나는 게 아니라 찾아야 하는 것</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 문장 · 결정적 결론</span><div class=\"en\">It was no longer almost ready-made at birth but <mark>something to be discovered</mark>.</div><p class=\"ko\">그것(= 정체성)은 더 이상 태어날 때 거의 다 만들어진 것이 아니라 <mark>발견되어야 할 무언가가 되었다.</mark></p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">How Modern Society Drives Us to Discover Our Identities 현대 사회는 어떻게 우리가 정체성을 발견하도록 이끄는가<small>1번 modern(현대)과 7번 to be discovered(발견되어야 할)·6번 Identity(정체성)를 모두 담았어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">Increasing Social Mobility Leads Us to a More Equal Society(늘어나는 사회적 유동성은 더 평등한 사회로 이끈다)</span><span class=\"why\">[지문에 없음] 2번의 Social mobility increased(사회적 유동성이 증가했다)만 따온 함정이에요. 유동성이 이끈 결과는 평등이 아니라 6번 정체성 문제예요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">What Makes Our Modern Society So Competitive(무엇이 현대 사회를 그토록 경쟁적으로 만드는가)?</span><span class=\"why\">[지문에 없음] 1번 dynamic(역동적인)은 경쟁적이라는 뜻이 아니에요. 경쟁 이야기는 한 문장도 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">Social Masks(사회적 가면): A Means to Build Trustworthy Relationships(믿을 만한 관계를 쌓는 수단)</span><span class=\"why\">[반대] 8번의 masks(가면)는 진짜 자아를 가리는 것, 즉 벗겨 내야 할 것이에요. 관계를 쌓는 좋은 수단이라는 말은 거꾸로예요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">The More Social Roles We Have(사회적 역할이 많을수록), the Less Choice We Have(선택권은 더 적어진다)</span><span class=\"why\">[반대] 2번은 a higher degree of choice(더 높은 정도의 선택권), 즉 선택권이 늘었다고 해요. 줄어든다는 건 정반대예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">In modern times,</div><div class=\"k\">현대에는,</div></div><div class=\"rc\"><div class=\"e\">society became more dynamic.</div><div class=\"k\">사회가 더욱 역동적이 되었다.</div></div><div class=\"rnat\">현대에 들어 사회는 더 역동적으로 변했다.</div><div class=\"rst\">옛날 우리 동네 빵집 아이는 당연히 빵집을 물려받았어요. 그런데 요즘은 세상이 훨씬 빨리 바뀌어요. = 지문 1번, 현대 사회가 더 역동적이 되었다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">2번 · 단서</span><div class=\"rc\"><div class=\"e\">Social mobility increased,</div><div class=\"k\">사회적 유동성이 증가했고,</div></div><div class=\"rc ckc\"><div class=\"e\">and people began to exercise <span class=\"cw\">a higher degree of choice</span></div><div class=\"k\">사람들은 <span class=\"cw\">더 높은 정도의 선택권을</span> 행사하기 시작했다</div></div><div class=\"rc\"><div class=\"e\">regarding, for instance,</div><div class=\"k\">(~와) 관련하여, 예를 들어,</div></div><div class=\"rc\"><div class=\"e\">their profession, their marriage, or their religion.</div><div class=\"k\">자신의 직업, 결혼, 혹은 종교와.</div></div><div class=\"rnat\">사회적 유동성이 늘어났고, 사람들은 이를테면 직업, 결혼, 종교와 관련해 더 높은 수준의 선택권을 행사하기 시작했다.</div><div class=\"rst\">이제 빵집 아이도 직업·결혼·종교를 스스로 고를 수 있어요. 지문 2번, <b>선택권</b>(choice)이 훨씬 커진 거예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">This</div><div class=\"k\">이것(= 사회적 유동성이 늘고 선택권이 커진 일)은</div></div><div class=\"rc\"><div class=\"e\">posed a challenge</div><div class=\"k\">도전 과제를 안겼다</div></div><div class=\"rc\"><div class=\"e\">to traditional roles in society.</div><div class=\"k\">사회의 전통적인 역할에.</div></div><div class=\"rnat\">이는 사회 안의 전통적인 역할에 도전 과제를 안겼다.</div><div class=\"rst\"><b>이것</b>(This) 때문에 “빵집 아이는 빵집”이라는 옛 공식이 흔들려요. 지문 3번, 전통적인 역할에 도전이 생겼다는 말이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">It was less evident</div><div class=\"k\">덜 분명해졌다(= It은 가주어, 내용은 아래 that절)</div></div><div class=\"rc\"><div class=\"e\">that one needed to commit</div><div class=\"k\">사람이 전념할 필요가 있다는 것이</div></div><div class=\"rc\"><div class=\"e\">to the roles one was born into</div><div class=\"k\">자신이 타고난 역할에</div></div><div class=\"rc\"><div class=\"e\">when alternatives could be realized.</div><div class=\"k\">대안이 실현될 수 있을 때.</div></div><div class=\"rnat\">대안이 현실이 될 수 있게 되면서, 자신이 타고난 역할에 매여야 한다는 인식은 예전만큼 뚜렷하지 않게 되었다.</div><div class=\"rst\">축구 선수가 될 길도 열려 있으니, 꼭 빵집을 이어야 한다는 생각이 흐려져요. = 지문 4번, 대안이 있으니 타고난 역할에 얽매일 이유가 덜 분명해졌어요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Increasing control over one’s life choices</div><div class=\"k\">자신의 삶의 선택에 대한 통제를 늘리는 것이</div></div><div class=\"rc\"><div class=\"e\">became not only possible but desired.</div><div class=\"k\">가능해졌을 뿐만 아니라 바람직하게 되었다.</div></div><div class=\"rnat\">삶의 선택을 더 많이 통제하는 일은 가능해졌을 뿐 아니라 사람들이 바라는 일이 되었다.</div><div class=\"rst\">내 길을 내가 고르는 게 가능할 뿐 아니라 다들 바라는 일이 됐어요. 지문 5번이 바로 그 말이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Identity then became a problem.</span></div><div class=\"k\">그러자 <span class=\"cw\">정체성이 문제가 되었다.</span></div></div><div class=\"rnat\">그러자 정체성이 하나의 문제가 되었다.</div><div class=\"rst\"><b>그러자</b>(then) 고민이 생겨요. “그럼 진짜 나는 누구지?” = 지문 6번, <b>정체성</b>(Identity)이 문제가 되었다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">It was no longer almost ready-made at birth</div><div class=\"k\">그것(= 정체성)은 더 이상 태어날 때 거의 다 만들어진 것이 아니라</div></div><div class=\"rc ckc\"><div class=\"e\">but <span class=\"cw\">something to be discovered.</span></div><div class=\"k\"><span class=\"cw\">발견되어야 할 무언가가 되었다.</span></div></div><div class=\"rnat\">그것은 더 이상 태어날 때부터 거의 다 갖춰진 것이 아니라, 찾아내야 할 무언가가 되었다.</div><div class=\"rst\">‘나’는 태어날 때 다 정해져 오는 게 아니라 <b>스스로 찾아내야 하는 것</b>이 됐어요. 지문 7번이 결론이라서, 제목은 “현대 사회가 정체성을 발견하게 이끄는 방법”이에요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">Traditional role identities</div><div class=\"k\">전통적인 역할 정체성은</div></div><div class=\"rc\"><div class=\"e\">prescribed by society</div><div class=\"k\">사회에 의해 규정된</div></div><div class=\"rc\"><div class=\"e\">began to appear as masks</div><div class=\"k\">가면처럼 보이기 시작했다</div></div><div class=\"rc\"><div class=\"e\">imposed on people</div><div class=\"k\">사람들에게 씌워진(부여된)</div></div><div class=\"rc\"><div class=\"e\">whose real self was to be found somewhere underneath.</div><div class=\"k\">그 사람들의 진짜 자아는 아래 어딘가에서 발견되어야 했다.</div></div><div class=\"rnat\">사회가 규정해 온 전통적인 역할 정체성은 사람들에게 씌워진 가면처럼 보이기 시작했고, 그 사람들의 진짜 자아는 그 밑 어딘가에서 찾아야 하는 것이 되었다.</div><div class=\"rst\">“빵집 아이”라는 이름표는 가면처럼 느껴지고, 진짜 나는 그 밑에 숨어 있어요. 지문 8번이 전통적 역할을 가면(masks)에 비유해요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"social mobility\" data-m=\"사회적 유동성\"><b>social mobility</b>사회적 유동성</button><button type=\"button\" class=\"wdb\" data-w=\"commit to\" data-m=\"~에 전념하다, 헌신하다\"><b>commit to</b>~에 전념하다, 헌신하다</button><button type=\"button\" class=\"wdb\" data-w=\"alternative\" data-m=\"대안\"><b>alternative</b>대안</button><button type=\"button\" class=\"wdb\" data-w=\"ready-made\" data-m=\"이미 만들어진, 기성의\"><b>ready-made</b>이미 만들어진, 기성의</button><button type=\"button\" class=\"wdb\" data-w=\"prescribe\" data-m=\"규정하다\"><b>prescribe</b>규정하다</button><button type=\"button\" class=\"wdb\" data-w=\"impose\" data-m=\"(억지로) 부과하다, 씌우다\"><b>impose</b>(억지로) 부과하다, 씌우다</button></div>", "03": "<p class=\"mtr\">마더텅 정답률 <b>85%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">실험 글의 요지는 <b>연구 결과</b>를 <b>일반화한 문장</b>에 있어요. 5번 결과(눈 대 눈썹·입)를 6번이 <b>different cultures</b>(서로 다른 문화)·<b>different ways</b>(서로 다른 방식)로 묶고, 7번 <b>That is</b>(즉)가 못 박아요.</p><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>2번</em>중국인 15명 + 스코틀랜드인 15명 참여</span><span><em>3번</em>화면 속 얼굴의 표정을 행복·슬픔·놀람·두려움·화남으로 분류</span><span><em>4번</em>어떤 얼굴 부위로 감정을 읽는지 밝혀냄</span></div><div class=\"ck-eq\">⇒ 실험의 질문 = 사람들은 얼굴의 어디를 보고 표정을 읽을까?</div></div><div class=\"ck-via\"><i>▼</i><span>while(반면)로 두 나라 사람을 맞대 보여 줘요</span></div><div class=\"ck-step\"><span class=\"lab\">5번 문장 · 연구 결과</span><div class=\"en\">… the Chinese participants <mark>relied more on the eyes</mark> to tell facial expressions, <mark>while</mark> the Scottish participants relied on the eyebrows and mouth.</div><p class=\"ko\">중국인 참가자들은 표정을 구별하기 위해 <mark>눈에 더 의존했다</mark>, <mark>반면</mark> 스코틀랜드인 참가자들은 눈썹과 입에 의존했다 …</p></div><div class=\"ck-via\"><i>▼</i><span>두 나라의 결과를 ‘문화’라는 말로 넓혀 일반화해요</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 결정적 요지</span><div class=\"en\"><mark>People from different cultures</mark> perceive happy, sad, or angry facial expressions <mark>in different ways.</mark></div><p class=\"ko\"><mark>서로 다른 문화의 사람들은</mark> 행복한, 슬픈, 또는 화난 표정을 <mark>서로 다른 방식으로</mark> 인식한다.</p></div><div class=\"ck-via\"><i>▼</i><span>That is(즉)로 6번을 다시 말해요</span></div><div class=\"ck-step\"><span class=\"lab\">7번 문장 · 한 번 더 확인</span><div class=\"en\"><mark>That is,</mark> facial expressions are not the “universal language of emotions.”</div><p class=\"ko\"><mark>즉,</mark> 표정은 “감정의 보편적인 언어”가 아니다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">문화에 따라 표정을 인식하는 방식이 다르다.<small>6번 different cultures(서로 다른 문화)·perceive(인식하다)·different ways(서로 다른 방식)를 그대로 옮겼어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">사람마다 고유한 감정 표현 방식이 있다.</span><span class=\"why\">[지문에 없음] 차이는 ‘사람마다’가 아니라 6번의 cultures(문화)마다예요. 또 지문은 표정을 짓는(표현) 게 아니라 읽는(perceive 인식하다) 이야기예요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">동서양을 막론하고 선호하는 표정이 있다.</span><span class=\"why\">[반대] 7번은 표정이 universal(보편적인) 언어가 아니라고 해요. 어디서나 통하는 공통점이 있다는 건 거꾸로예요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">노력을 통해 좋은 인상을 줄 수 있다.</span><span class=\"why\">[지문에 없음] 좋은 인상을 주려는 노력은 한 번도 안 나와요. 지문은 표정을 읽는 방식의 차이만 말해요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">지나친 감정 표현은 오해를 불러일으킬 수 있다.</span><span class=\"why\">[지문에 없음] 지나친 감정 표현이나 오해 이야기는 한 줄도 없어요. 지문은 표정을 읽는 방식이 문화마다 다르다는 것만 말해요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">An interesting study</div><div class=\"k\">흥미로운 연구가</div></div><div class=\"rc\"><div class=\"e\">about facial expressions</div><div class=\"k\">표정에 관한</div></div><div class=\"rc\"><div class=\"e\">was recently published</div><div class=\"k\">최근 발표되었다</div></div><div class=\"rc\"><div class=\"e\">by the American Psychological Association.</div><div class=\"k\">미국심리학회에 의해.</div></div><div class=\"rnat\">표정에 관한 흥미로운 연구가 최근 미국심리학회에 의해 발표되었다.</div><div class=\"rst\">학교 국제교류 날, 얼굴 표정에 관한 재미있는 실험 이야기를 들었어요. = 지문 1번, 미국심리학회가 발표한 표정 연구예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Fifteen Chinese people and fifteen Scottish people</div><div class=\"k\">열다섯 명의 중국인과 열다섯 명의 스코틀랜드인이</div></div><div class=\"rc\"><div class=\"e\">took part in the study.</div><div class=\"k\">그 연구에 참여했다.</div></div><div class=\"rnat\">중국인 열다섯 명과 스코틀랜드인 열다섯 명이 이 연구에 참여했다.</div><div class=\"rst\">중국 친구 15명과 스코틀랜드 친구 15명이 함께 ‘표정 맞히기 게임’에 참가해요. 지문 2번의 참가자들이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">They viewed emotion-neutral faces</div><div class=\"k\">그들(= 참가자들)은 감정 중립적인 얼굴들을 보았다</div></div><div class=\"rc\"><div class=\"e\">that were randomly changed on a computer screen</div><div class=\"k\">컴퓨터 화면에서 무작위로 바뀌는</div></div><div class=\"rc\"><div class=\"e\">and then categorized the facial expressions</div><div class=\"k\">그러고 나서 표정들을 분류했다</div></div><div class=\"rc\"><div class=\"e\">as happy, sad, surprised, fearful, or angry.</div><div class=\"k\">행복한, 슬픈, 놀란, 두려운, 또는 화난 (표정)으로.</div></div><div class=\"rnat\">그들은 컴퓨터 화면에서 무작위로 바뀌는 감정 중립적인 얼굴들을 보았고, 그러고 나서 표정들을 행복한, 슬픈, 놀란, 두려운, 또는 화난 (표정)으로 분류했다.</div><div class=\"rst\">화면 속 무표정한 얼굴이 조금씩 바뀌면, 친구들이 “행복!”, “화남!” 하고 골라요. = 지문 3번, 표정을 다섯 감정으로 분류한 거예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">The responses allowed researchers</div><div class=\"k\">그 반응들(= 참가자들의 분류 반응)은 연구자들이 ~하게 해 주었다</div></div><div class=\"rc\"><div class=\"e\">to identify the expressive facial features</div><div class=\"k\">표정을 드러내는 얼굴 특징들을 밝혀내도록</div></div><div class=\"rc\"><div class=\"e\">that participants associated with each emotion.</div><div class=\"k\">참가자들이 각각의 감정과 연관 지었던 (특징들을).</div></div><div class=\"rnat\">이 반응 덕분에 연구자들은 참가자들이 각 감정과 연관 짓는, 표정을 드러내는 얼굴 특징을 밝혀낼 수 있었다.</div><div class=\"rst\">선생님은 친구들이 얼굴의 어느 부분을 보고 골랐는지 알아내요. 지문 4번, 감정과 연결된 얼굴 특징을 밝혀냈다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">The study found</div><div class=\"k\">그 연구는 밝혀냈다</div></div><div class=\"rc ckc\"><div class=\"e\">that the Chinese participants <span class=\"cw\">relied more on the eyes</span></div><div class=\"k\">중국인 참가자들은 <span class=\"cw\">눈에 더 의존했다는 것을</span></div></div><div class=\"rc\"><div class=\"e\">to tell facial expressions,</div><div class=\"k\">표정을 구별하기 위해,</div></div><div class=\"rc\"><div class=\"e\">while the Scottish participants relied on the eyebrows and mouth.</div><div class=\"k\">반면 스코틀랜드인 참가자들은 눈썹과 입에 의존했다는 것을.</div></div><div class=\"rnat\">연구 결과, 중국인 참가자들은 표정을 읽을 때 눈에 더 많이 의존한 반면, 스코틀랜드인 참가자들은 눈썹과 입에 의존했다.</div><div class=\"rst\">중국 친구들은 <b>눈</b>을 더 보고, <b>반면</b>(while) 스코틀랜드 친구들은 눈썹과 입을 봤어요. 지문 5번의 연구 결과예요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">People from different cultures</span></div><div class=\"k\"><span class=\"cw\">서로 다른 문화의 사람들은</span></div></div><div class=\"rc\"><div class=\"e\">perceive happy, sad, or angry facial expressions</div><div class=\"k\">행복한, 슬픈, 또는 화난 표정을 인식한다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">in different ways.</span></div><div class=\"k\"><span class=\"cw\">서로 다른 방식으로.</span></div></div><div class=\"rnat\">서로 다른 문화권의 사람들은 행복, 슬픔, 화남의 표정을 서로 다른 방식으로 인식한다.</div><div class=\"rst\">그러니까 <b>사는 문화가 다르면</b> 같은 웃는 얼굴도 <b>다른 방식으로</b> 읽어요. 지문 6번이 요지예요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">That is,</span></div><div class=\"k\"><span class=\"cw\">즉,</span></div></div><div class=\"rc\"><div class=\"e\">facial expressions are not the “universal language of emotions.”</div><div class=\"k\">표정은 “감정의 보편적인 언어”가 아니다.</div></div><div class=\"rnat\">즉, 표정은 '감정의 보편적인 언어'가 아니다.</div><div class=\"rst\"><b>즉</b>(That is) 표정은 “어디서나 똑같이 통하는 말”이 아니에요. 지문 7번이 요지를 한 번 더 못 박아요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"facial expression\" data-m=\"표정\"><b>facial expression</b>표정</button><button type=\"button\" class=\"wdb\" data-w=\"emotion-neutral\" data-m=\"감정이 드러나지 않은, 감정 중립적인\"><b>emotion-neutral</b>감정이 드러나지 않은, 감정 중립적인</button><button type=\"button\" class=\"wdb\" data-w=\"categorize\" data-m=\"분류하다\"><b>categorize</b>분류하다</button><button type=\"button\" class=\"wdb\" data-w=\"rely on\" data-m=\"~에 의존하다\"><b>rely on</b>~에 의존하다</button><button type=\"button\" class=\"wdb\" data-w=\"perceive\" data-m=\"인식하다\"><b>perceive</b>인식하다</button><button type=\"button\" class=\"wdb\" data-w=\"universal\" data-m=\"보편적인\"><b>universal</b>보편적인</button></div>", "04": "<p class=\"mtr\">마더텅 정답률 <b>30%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">밑줄이 <b>앞 동사를 대신하는 말</b>(대동사)이면, <b>앞 동사의 모양</b>부터 보세요. 앞이 수동태 <b>been achieved</b>(달성되었다)이니 대신하는 말도 be(~이다) 동사 <b>was</b>(~되었다)예요.</p><div class=\"ck-step\"><span class=\"lab\">문제지 ②번 자리 (2번)</span><div class=\"en\">… has the quality of monumentality been achieved as fully as it <u>② did</u> in Egypt.</div><p class=\"ko\">기념비성이 달성된 적은 없다, 그것이 이집트에서 ( ? )던 것만큼 완전하게</p></div><div class=\"ck-via\"><i>▼</i><span>as fully as(~만큼 완전하게)는 비교라서, 뒤의 동사는 앞 동사를 대신해요</span></div><div class=\"ck-step\"><span class=\"lab\">같은 문장 앞쪽 · 대신할 동사 찾기</span><div class=\"en\">Never before and never since has the quality of monumentality <mark>been achieved</mark> …</div><p class=\"ko\">이전에도 이후에도 결코 기념비성이라는 특성이 <mark>달성된 적은</mark> …</p></div><div class=\"ck-via\"><i>▼</i><span>앞이 be(~이다) 동사 + p.p.(수동) → 대신하는 말도 was(~되었다)</span></div><div class=\"ck-step key\"><span class=\"lab\">2번 문장 · 결정적 단서</span><div class=\"en\">as fully as it <mark>was</mark> in Egypt.</div><p class=\"ko\">그것(= 기념비성이라는 특성)이 이집트에서 <mark>(달성)되었던 것만큼</mark> 완전하게.</p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">대동사 do(did)와 be(was) 구별</p><p class=\"gr\">같은 동사를 또 쓰지 않으려고 대신 쓰는 말이 대동사예요. 앞 동사가 일반동사면 do(하다)·did(했다), 앞이 be(~이다) 동사나 수동태면 was(~이었다, ~되었다) 같은 be(~이다) 동사로 받아요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>She runs faster than I do.</div><div class=\"ko\">그녀는 나보다 더 빨리 달린다. (runs 달리다 = 일반동사라서 do로 받아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>The window was cleaned better than the door did.</div><div class=\"ko\">앞이 was cleaned(청소되었다), 즉 수동태인데 did로 받아서 틀려요. was가 맞아요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>The window was cleaned better than the door was.</div><div class=\"ko\">창문은 문보다 더 잘 청소되었다. (수동태를 was로 받아서 맞아요)</div></div><p class=\"gb\">지문 2번도 앞이 has been achieved(달성되었다), 즉 수동태예요. 그래서 as fully as it(그것이 ~만큼 완전하게) 뒤에는 did(했다)가 아니라 was(~되었다)가 와야 해요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">did → was (달성되었다)<small>앞 동사가 been achieved(달성되었다), 즉 수동태라서 did(했다)가 아니라 was(~되었다)예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">that ~하는(관계대명사)</span><span class=\"why\">6번은 that gigantic pile of stones(저 거대한 돌무더기) 뒤에 ④ that(~하는)이 오고, 그다음 바로 동사 constitutes(이루다)가 와요. 주어가 빠진 자리를 채우는 주격 관계대명사라 맞고, 선행사 pile(무더기)이 단수라 constitutes(이루다)에 -s가 붙은 것도 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">주격 관계대명사 that(~하는) + 동사 (선행사 수에 동사를 맞춤)</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I have a dog that runs fast.</div><div class=\"ko\">나는 빨리 달리는 개가 있다. (that 뒤에 주어 없이 runs 달리다가 와서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I have a dog that run fast.</div><div class=\"ko\">선행사 a dog(개 한 마리)는 단수인데 run에 -s가 없어서 틀려요.</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I have a dog that it runs fast.</div><div class=\"ko\">that이 이미 주어 역할인데 it(그것)을 또 써서 틀려요.</div></div><p class=\"gb\">지문 6번도 that(~하는) 뒤에 주어 없이 constitutes(이루다)가 오고, 선행사 pile(무더기)이 단수라 그대로 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">expressing 표현하는 것</span><span class=\"why\">1번은 comes very close to(~에 아주 가까이 다가가다) 바로 뒤예요. 여기서 to(~에)는 전치사라 뒤에 동사원형이 아니라 -ing(동명사)가 와야 해서 expressing(표현하는 것)이 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">전치사 to(~에) + 동명사 (come close to -ing = ~하는 데 가까워지다)</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I look forward to meeting you.</div><div class=\"ko\">나는 너를 만나기를 고대한다. (look forward to의 to는 전치사라 meeting이 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I look forward to meet you.</div><div class=\"ko\">전치사 to 뒤에 동사원형 meet(만나다)을 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>He came close to winning the race.</div><div class=\"ko\">그는 경주에서 거의 이길 뻔했다. (come close to 뒤 winning 이기는 것이 맞아요)</div></div><p class=\"gb\">지문 1번도 comes very close to(~에 아주 가깝다) 뒤라서 expressing(표현하는 것)이 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">those 그것들</span><span class=\"why\">4번 Many modern structures exceed those of Egypt(많은 현대 구조물이 이집트의 그것들을 능가한다)에서 ③은 앞의 structures(구조물들)를 다시 가리켜요. 복수 명사라 that(그것)이 아니라 those(그것들)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">명사 반복을 피하는 that(그것, 단수) / those(그것들, 복수)</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>My shoes are bigger than those of my sister.</div><div class=\"ko\">내 신발은 언니의 그것(신발)보다 크다. (shoes 신발이 복수라 those가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>My shoes are bigger than that of my sister.</div><div class=\"ko\">복수 shoes(신발)를 단수 that으로 받아서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>My bag is heavier than that of my sister.</div><div class=\"ko\">내 가방은 언니의 그것(가방)보다 무겁다. (bag 가방이 단수라 that이 맞아요)</div></div><p class=\"gb\">지문 4번도 받는 말이 복수 structures(구조물들)라서 those(그것들)가 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">carved 새겨진</span><span class=\"why\">8번 even if it is only a few inches across or carved in wood(비록 몇 인치 폭이거나 나무에 새겨져 있을지라도)에서 ⑤는 or(또는) 앞의 is(~이다)와 이어져 수동태가 돼요. 작품은 스스로 새기지 않고 ‘새겨지니까’ 수동 carved(새겨진)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">수동태 be(~이다) 동사 + p.p. (접속사 or(또는) 뒤에서 be(~이다) 동사가 생략됨)</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>The box is small or made of paper.</div><div class=\"ko\">그 상자는 작거나 종이로 만들어져 있다. (is가 made 만들어진 앞에도 이어져서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>The box is small or making of paper.</div><div class=\"ko\">상자가 스스로 만드는 게 아니라 만들어지는 건데 -ing를 써서 틀려요.</div></div><p class=\"gb\">지문 8번도 it is(그것이 ~이다) … or carved in wood(또는 나무에 새겨진)로 작품이 ‘새겨지는’ 쪽이라 carved(새겨진)가 맞아요.</p></div></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">“Monumental” is a word</div><div class=\"k\">“기념비적”이라는 말은 단어이다</div></div><div class=\"rc\"><div class=\"e\">that comes very close to expressing</div><div class=\"k\">그것(= 단어)이 표현하는 데 아주 가까이 다가가는</div></div><div class=\"rc\"><div class=\"e\">the basic characteristic of Egyptian art.</div><div class=\"k\">이집트 예술의 기본적인 특징을.</div></div><div class=\"rnat\">\"기념비적\"이라는 단어는 이집트 예술의 기본적인 특징을 표현하는 데 아주 가까운 단어이다.</div><div class=\"rst\">이집트 예술을 한 단어로 하면 “기념비적”이에요. come close to(~에 가까워지다) 뒤라서 expressing(표현하는 것)이 왔어요.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">2번 · 단서</span><div class=\"rc\"><div class=\"e\">Never before and never since</div><div class=\"k\">이전에도 이후에도 결코 (~한 적이 없다)</div></div><div class=\"rc ckc\"><div class=\"e\">has the quality of monumentality <span class=\"cw\">been achieved</span></div><div class=\"k\">기념비성이라는 특성이 <span class=\"cw\">달성된 적은</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">as fully as it was</span> in Egypt.</div><div class=\"k\">그것(= 기념비성이라는 특성)이 이집트에서 <span class=\"cw\">(달성)되었던 것만큼</span> 완전하게. ※ 문제지엔 did로 되어 있음</div></div><div class=\"rnat\">이집트에서만큼 기념비성이 완전하게 성취된 적은 이전에도 이후에도 없었다.</div><div class=\"rst\">이집트만큼 기념비성이 완전히 <b>달성된</b> 곳은 없었어요. 앞이 has been achieved(달성되었다)라서 대신하는 말도 <b>was</b>(~되었다)예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">The reason for this</div><div class=\"k\">이것(= 이집트에서 기념비성이 가장 완전히 달성된 것)에 대한 이유는</div></div><div class=\"rc\"><div class=\"e\">is not the external size and massiveness of their works,</div><div class=\"k\">그들 작품의 외적인 크기와 거대함이 아니다,</div></div><div class=\"rc\"><div class=\"e\">although the Egyptians admittedly achieved some amazing things</div><div class=\"k\">비록 이집트인들이 인정하건대 몇 가지 놀라운 것들을 이루었을지라도</div></div><div class=\"rc\"><div class=\"e\">in this respect.</div><div class=\"k\">이 점(= 외적인 크기와 거대함)에서.</div></div><div class=\"rnat\">그 이유는 그들 작품의 외적인 크기와 거대함 때문이 아니다, 물론 이 점에서 이집트인들이 놀라운 것들을 이루긴 했지만.</div><div class=\"rst\">그 이유는 작품이 커서가 아니에요. 물론 이집트인이 크기에서도 놀라운 걸 이루긴 했어요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Many modern structures</div><div class=\"k\">많은 현대의 구조물들은</div></div><div class=\"rc\"><div class=\"e\">exceed those of Egypt</div><div class=\"k\">이집트의 그것들(= those = 구조물들)을 능가한다</div></div><div class=\"rc\"><div class=\"e\">in terms of purely physical size.</div><div class=\"k\">순전히 물리적인 크기의 면에서는.</div></div><div class=\"rnat\">많은 현대의 구조물이 순전히 물리적 크기 면에서는 이집트의 것들을 능가한다.</div><div class=\"rst\">크기만 보면 요즘 건물이 이집트 것보다 더 커요. those(그것들)는 앞의 structures(구조물들)를 받아요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">But massiveness</div><div class=\"k\">그러나 거대함은</div></div><div class=\"rc\"><div class=\"e\">has nothing to do with monumentality.</div><div class=\"k\">기념비성과 아무 관련이 없다.</div></div><div class=\"rnat\">하지만 거대함은 기념비성과는 아무 상관이 없다.</div><div class=\"rst\">하지만 거대함은 기념비성과 아무 관련이 없어요. 글의 방향이 크기에서 다른 쪽으로 바뀌는 곳이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">An Egyptian sculpture</div><div class=\"k\">이집트의 조각상 하나가</div></div><div class=\"rc\"><div class=\"e\">no bigger than a person’s hand</div><div class=\"k\">사람의 손보다 크지 않은</div></div><div class=\"rc\"><div class=\"e\">is more monumental than that gigantic pile of stones</div><div class=\"k\">저 거대한 돌무더기보다 더 기념비적이다</div></div><div class=\"rc\"><div class=\"e\">that constitutes the war memorial in Leipzig,</div><div class=\"k\">그것(= 돌무더기)은 Leipzig(독일 동부의 도시)의 전쟁 기념비를 이룬다,</div></div><div class=\"rc\"><div class=\"e\">for instance.</div><div class=\"k\">예를 들어.</div></div><div class=\"rnat\">예를 들어 사람 손보다 크지 않은 이집트 조각상 하나가, 라이프치히의 전쟁 기념비를 이루는 저 거대한 돌무더기보다 더 기념비적이다.</div><div class=\"rst\">손바닥만 한 이집트 조각이 커다란 돌무더기 기념비보다 더 기념비적이에요. that(~하는) 뒤에 바로 constitutes(이루다)가 오는 관계대명사예요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Monumentality is not a matter of external weight,</div><div class=\"k\">기념비성은 외적 무게의 문제가 아니라,</div></div><div class=\"rc\"><div class=\"e\">but of “inner weight.”</div><div class=\"k\">“내적 무게”의 문제이다.</div></div><div class=\"rnat\">기념비성은 외적인 무게의 문제가 아니라 '내적 무게'의 문제이다.</div><div class=\"rst\">기념비성은 겉의 무게가 아니라 ‘속의 무게’ 문제예요. not A but B(A가 아니라 B) 구조예요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">This inner weight is the quality</div><div class=\"k\">이 내적 무게는 특성이다</div></div><div class=\"rc\"><div class=\"e\">which Egyptian art possesses</div><div class=\"k\">이집트 예술이 지니고 있는</div></div><div class=\"rc\"><div class=\"e\">to such a degree</div><div class=\"k\">그 정도로 강하게</div></div><div class=\"rc\"><div class=\"e\">that everything in it seems to be made of primeval stone,</div><div class=\"k\">그 안(= 이집트 예술)의 모든 것이 원시 시대의 돌로 만들어진 것처럼 보일 만큼,</div></div><div class=\"rc\"><div class=\"e\">like a mountain range,</div><div class=\"k\">마치 산맥처럼,</div></div><div class=\"rc\"><div class=\"e\">even if it is only a few inches across or carved in wood.</div><div class=\"k\">비록 그것(= 이집트 예술)이 몇 인치의 폭에 불과하거나 나무에 새겨져 있을지라도.</div></div><div class=\"rnat\">이 내적 무게는 이집트 예술이 지닌 특성인데, 그 정도가 어찌나 강한지 폭이 몇 인치밖에 안 되거나 나무에 조각된 것이라도 그 안의 모든 것이 마치 산맥처럼 원시 시대의 돌로 만들어진 듯 보일 정도이다.</div><div class=\"rst\">이 속의 무게 덕분에 작거나 나무에 새겨진 작품도 산맥처럼 묵직해 보여요. carved(새겨진)는 앞의 is(~이다)와 이어진 수동이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"monumental\" data-m=\"기념비적인\"><b>monumental</b>기념비적인</button><button type=\"button\" class=\"wdb\" data-w=\"massiveness\" data-m=\"거대함\"><b>massiveness</b>거대함</button><button type=\"button\" class=\"wdb\" data-w=\"exceed\" data-m=\"능가하다, 뛰어넘다\"><b>exceed</b>능가하다, 뛰어넘다</button><button type=\"button\" class=\"wdb\" data-w=\"has nothing to do with\" data-m=\"~와 아무 관련이 없다\"><b>has nothing to do with</b>~와 아무 관련이 없다</button><button type=\"button\" class=\"wdb\" data-w=\"constitute\" data-m=\"이루다, 구성하다\"><b>constitute</b>이루다, 구성하다</button><button type=\"button\" class=\"wdb\" data-w=\"possess\" data-m=\"지니다, 소유하다\"><b>possess</b>지니다, 소유하다</button></div>", "05": "<p class=\"mtr\">마더텅 정답률 <b>60%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">순서 문제는 <b>고리</b>를 찾는 문제예요. 연결어 <b>Accordingly</b>(그에 따라) → 반전 <b>However</b>(그러나) → 지시어 <b>This</b>(이것) 순으로 이어 붙이세요.</p><div class=\"ck-step\"><span class=\"lab\">주어진 글 · 출발점</span><div class=\"en\">Each beech tree grows in a particular location and soil conditions can <mark>vary greatly</mark> in just a few yards.</div><p class=\"ko\">각각의 너도밤나무는 고유한 장소에서 자라고, 단 몇 야드 안에서도 토양의 조건은 <mark>크게 달라질 수 있다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>Accordingly(그에 따라) = 토양이 다르니 그 결과로</span></div><div class=\"ck-step key\"><span class=\"lab\">(C) · 첫 번째 고리</span><div class=\"en\">(C) <mark>Accordingly,</mark> each tree grows more quickly or more slowly … every tree to be photosynthesizing <mark>at a different rate</mark>.</div><p class=\"ko\">(C) <mark>그에 따라,</mark> 각 나무는 더 빨리 혹은 더 느리게 자란다 … 모든 나무가 <mark>서로 다른 속도로</mark> 광합성을 하고 있을 것이라고.</p></div><div class=\"ck-via\"><i>▼</i><span>However(그러나)로 (C)의 “속도가 다를 것” 예상을 뒤집어요</span></div><div class=\"ck-step key\"><span class=\"lab\">(B) · 두 번째 고리</span><div class=\"en\">(B) <mark>However,</mark> the rate is <mark>the same</mark>.</div><p class=\"ko\">(B) <mark>그러나,</mark> 그 속도(= 광합성 속도)는 <mark>똑같다.</mark></p></div><div class=\"ck-via\"><i>▼</i><span>왜 같은지 이유가 나와요: 당을 나눠 줘서</span></div><div class=\"ck-step\"><span class=\"lab\">(B) 끝 · 다음 고리의 재료</span><div class=\"en\">… the trees equalize this difference between them <mark>by transferring sugar</mark>.</div><p class=\"ko\">나무들은 <mark>당을 전달함으로써</mark> 그들 사이의 이 차이(= 당 양의 차이)를 균등하게 한다.</p></div><div class=\"ck-via\"><i>▼</i><span>This(이것) = 바로 앞 (B)의 “당 전달하기”</span></div><div class=\"ck-step key\"><span class=\"lab\">(A) · 세 번째 고리</span><div class=\"en\">(A) <mark>This</mark> is taking place underground through the roots.</div><p class=\"ko\">(A) <mark>이것</mark>(= 나무들이 당을 전달해 차이를 균등하게 하는 일)은 뿌리들을 통해 지하에서 일어나고 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">(C) – (B) – (A)<small>그에 따라 → 그러나 → 이것, 세 고리가 모두 맞아요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">(C) – (A) – (B)</span><span class=\"why\">(C) 다음 (A)의 This(이것)가 가리킬 “당 전달”이 (C)에 없어요. (C)는 속도가 다를 거라는 예상뿐이라 (B) However(그러나)로 먼저 뒤집어야 해요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">(A) – (C) – (B)</span><span class=\"why\">주어진 글은 토양 이야기로 끝나서, (A)의 This(이것)가 가리킬 “당 전달”이 앞에 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">(B) – (A) – (C)</span><span class=\"why\">(B)의 the rate(그 속도)가 무슨 속도인지 주어진 글에 없어요. 광합성 속도는 (C)에서 처음 나와요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">(B) – (C) – (A)</span><span class=\"why\">(B) However(그러나)가 뒤집을 예상이 아직 없어요. “속도가 다를 것” 예상인 (C)가 반드시 (B)보다 앞이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><span class=\"ordc\">정답 순서 주어진 글</span><div class=\"rc\"><div class=\"e\">Each beech tree grows in a particular location</div><div class=\"k\">각각의 너도밤나무는 고유한 장소에서 자란다</div></div><div class=\"rc ckc\"><div class=\"e\">and soil conditions can <span class=\"cw\">vary greatly</span></div><div class=\"k\">그리고 토양의 조건은 <span class=\"cw\">크게 달라질 수 있다</span></div></div><div class=\"rc\"><div class=\"e\">in just a few yards.</div><div class=\"k\">단 몇 야드 안에서도.</div></div><div class=\"rnat\">너도밤나무 한 그루 한 그루는 특정한 장소에서 자라고, 토양 조건은 불과 몇 야드 안에서도 크게 달라질 수 있다.</div><div class=\"rst\">우리 반 친구들은 사는 동네가 다 달라요. 바로 옆 동네여도 형편이 크게 달라요. = 지문 1번, 몇 야드만 떨어져도 토양 조건이 크게 다르다는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><span class=\"ordc\">정답 순서 주어진 글</span><div class=\"rc\"><div class=\"e\">The soil can have</div><div class=\"k\">토양은 가질 수 있다</div></div><div class=\"rc\"><div class=\"e\">a great deal of water</div><div class=\"k\">다량의 물을</div></div><div class=\"rc\"><div class=\"e\">or almost no water.</div><div class=\"k\">혹은 거의 물이 없는 상태를.</div></div><div class=\"rnat\">토양은 물을 많이 머금을 수도, 거의 머금지 못할 수도 있다.</div><div class=\"rst\">어떤 친구는 집에 간식이 넘치고, 어떤 친구는 거의 없어요. 지문 2번처럼 토양에도 물이 많거나 거의 없어요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><span class=\"ordc\">정답 순서 주어진 글</span><div class=\"rc\"><div class=\"e\">It can be full of nutrients or not.</div><div class=\"k\">그것(= 토양)은 영양분이 가득할 수도, 아닐 수도 있다.</div></div><div class=\"rnat\">영양분으로 가득할 수도, 그렇지 않을 수도 있다.</div><div class=\"rst\">용돈이 넉넉한 친구도, 빠듯한 친구도 있어요. = 지문 3번, 토양에 영양분이 가득할 수도 아닐 수도 있다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">10번 · 단서</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc ckc\"><div class=\"e\">(C) <span class=\"cw\">Accordingly,</span></div><div class=\"k\">(C) <span class=\"cw\">그에 따라,</span></div></div><div class=\"rc\"><div class=\"e\">each tree grows more quickly or more slowly</div><div class=\"k\">각 나무는 더 빨리 혹은 더 느리게 자란다</div></div><div class=\"rc\"><div class=\"e\">and produces more or less sugar,</div><div class=\"k\">그리고 더 많거나 더 적은 당을 만든다,</div></div><div class=\"rc\"><div class=\"e\">and thus you would expect</div><div class=\"k\">그래서 여러분은 기대할 것이다</div></div><div class=\"rc ckc\"><div class=\"e\">every tree to be photosynthesizing <span class=\"cw\">at a different rate</span>.</div><div class=\"k\">모든 나무가 <span class=\"cw\">서로 다른 속도로</span> 광합성을 하고 있을 것이라고.</div></div><div class=\"rnat\">그에 따라 나무마다 더 빨리 자라거나 더 느리게 자라며 당을 더 많이 만들거나 더 적게 만들 것이고, 그래서 모든 나무가 서로 다른 속도로 광합성을 하리라 예상할 수 있다.</div><div class=\"rst\"><b>그에 따라</b>(Accordingly) 친구마다 간식 먹는 양이 다를 거라고 생각하겠죠? = 지문 (C), 나무마다 광합성 속도가 다를 거라는 예상이에요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">7번 · 단서</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc ckc\"><div class=\"e\">(B) <span class=\"cw\">However,</span></div><div class=\"k\">(B) <span class=\"cw\">그러나,</span></div></div><div class=\"rc ckc\"><div class=\"e\">the rate is <span class=\"cw\">the same</span>.</div><div class=\"k\">그 속도(= 광합성 속도)는 <span class=\"cw\">똑같다</span>.</div></div><div class=\"rnat\">그러나 그 속도는 똑같다.</div><div class=\"rst\"><b>그러나</b>(However) 실제로는 모두 똑같이 먹어요. 지문 (B)가 앞의 예상을 뒤집어요. 광합성 속도는 똑같다고요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">8번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">Whether they are thick or thin,</div><div class=\"k\">그것들(= 나무들)이 굵든 가늘든,</div></div><div class=\"rc\"><div class=\"e\">all the trees of the same species</div><div class=\"k\">같은 종의 모든 나무들은</div></div><div class=\"rc\"><div class=\"e\">are using light to produce the same amount of sugar per leaf.</div><div class=\"k\">잎 하나당 같은 양의 당을 만들기 위해 빛을 사용하고 있다.</div></div><div class=\"rnat\">굵든 가늘든, 같은 종의 나무들은 모두 빛을 이용해서 잎 하나당 같은 양의 당을 만들어 낸다.</div><div class=\"rst\">덩치가 크든 작든 다들 한 사람당 같은 양을 먹어요. = 지문 8번, 굵든 가늘든 잎 하나당 같은 양의 당을 만든다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">9번 · 단서</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">Some trees have plenty of sugar and some have less,</div><div class=\"k\">어떤 나무들은 충분한 당을 지니고 어떤 나무들은 더 적게 지니지만,</div></div><div class=\"rc\"><div class=\"e\">but the trees equalize this difference between them</div><div class=\"k\">나무들은 그들 사이의 이 차이(= 당 양의 차이)를 균등하게 한다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">by transferring sugar</span>.</div><div class=\"k\"><span class=\"cw\">당을 전달함으로써</span>.</div></div><div class=\"rnat\">어떤 나무는 당이 넉넉하고 어떤 나무는 부족하지만, 나무들은 당을 서로 옮겨 줌으로써 이 차이를 없앤다.</div><div class=\"rst\">많은 친구가 적은 친구에게 <b>나눠 줘서</b> 차이를 없애기 때문이에요. 지문 9번, 당을 전달해 차이를 고르게 한다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">4번 · 단서</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc ckc\"><div class=\"e\">(A) <span class=\"cw\">This</span> is taking place underground</div><div class=\"k\">(A) <span class=\"cw\">이것</span>(= 나무들이 당을 전달해 차이를 균등하게 하는 일)은 지하에서 일어나고 있다</div></div><div class=\"rc\"><div class=\"e\">through the roots.</div><div class=\"k\">뿌리들을 통해.</div></div><div class=\"rnat\">이 일은 뿌리를 통해 땅속에서 일어난다.</div><div class=\"rst\"><b>이것</b>(This), 즉 나눠 주기는 책상 밑에서 몰래 이뤄져요. = 지문 (A), 당 전달은 땅속 뿌리를 통해 일어나요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">5번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">Whoever has an abundance of sugar hands some over;</div><div class=\"k\">당이 풍부한 나무는 누구든 일부를 건네준다;</div></div><div class=\"rc\"><div class=\"e\">whoever is running short gets help.</div><div class=\"k\">부족해지는 나무는 누구든 도움을 받는다.</div></div><div class=\"rnat\">당이 넉넉한 나무는 누구든 남는 것을 건네주고, 부족한 나무는 누구든 도움을 받는다.</div><div class=\"rst\">많이 가진 친구는 건네주고, 모자란 친구는 받아요. 지문 5번이 누가 주고 누가 받는지 말해 줘요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">6번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">Their network</div><div class=\"k\">그들의(= 나무들의) 연결망은</div></div><div class=\"rc\"><div class=\"e\">acts as a system</div><div class=\"k\">하나의 체계로서 작동한다</div></div><div class=\"rc\"><div class=\"e\">to make sure that no trees fall too far behind.</div><div class=\"k\">어떤 나무도 너무 뒤처지지 않도록 하기 위한.</div></div><div class=\"rnat\">그들의 연결망은 어떤 나무도 너무 뒤처지지 않도록 하는 하나의 체계처럼 작동한다.</div><div class=\"rst\">그래서 우리 반은 아무도 너무 뒤처지지 않게 하는 한 팀처럼 움직여요. = 지문 6번, 나무들의 연결망이 하나의 체계로 작동한다는 말이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"vary greatly\" data-m=\"크게 다르다\"><b>vary greatly</b>크게 다르다</button><button type=\"button\" class=\"wdb\" data-w=\"nutrient\" data-m=\"영양분\"><b>nutrient</b>영양분</button><button type=\"button\" class=\"wdb\" data-w=\"accordingly\" data-m=\"그에 따라\"><b>accordingly</b>그에 따라</button><button type=\"button\" class=\"wdb\" data-w=\"equalize\" data-m=\"균등하게 하다, 고르게 만들다\"><b>equalize</b>균등하게 하다, 고르게 만들다</button><button type=\"button\" class=\"wdb\" data-w=\"transferring\" data-m=\"옮기는 것, 전달하는 것 (transfer 옮기다)\"><b>transferring</b>옮기는 것, 전달하는 것 (transfer 옮기다)</button><button type=\"button\" class=\"wdb\" data-w=\"fall too far behind\" data-m=\"너무 뒤처지다 (fall behind 뒤처지다)\"><b>fall too far behind</b>너무 뒤처지다 (fall behind 뒤처지다)</button></div>", "06": "<p class=\"mtr\">마더텅 정답률 <b>65%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">실험 글의 빈칸은 <b>결론 문장</b>(Ariely concludes 결론짓는다)에 있어요. 바로 앞 <b>실험 결과</b>에서 1등 반(마감일이 정해진 반)의 공통점을 한 마디로 묶으세요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (7번)</span><div class=\"en\">Ariely concludes that <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span></span> … improves self-control and performance.</div><p class=\"ko\">( ? )이 자기 통제와 성과를 향상시킨다고 결론짓는다</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>3번</em>첫째 반: 마감일 세 개를 스스로 정함</span><span><em>4번</em>둘째 반: 마감일 없음, 마지막 날까지만 내면 됨</span><span><em>5번</em>셋째 반: 교수가 정한 마감일 세 개</span></div><div class=\"ck-eq\">⇒ 세 반의 차이 = 마감일로 얼마나 묶여 있는가 (묶임: 셋째 > 첫째 > 둘째)</div></div><div class=\"ck-via\"><i>▼</i><span>많이 묶인 반일수록 성적이 좋았다는 실험 결과예요</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 결정적 단서</span><div class=\"en\">… students <mark>with set deadlines</mark> received <mark>the best grades</mark>, the students with <mark>no deadlines</mark> had the worst …</div><p class=\"ko\">그는 <mark>정해진 마감일이 있던</mark> 학생들이 <mark>최고의 성적을</mark> 받았고, <mark>마감일이 없던</mark> 학생들은 최하의 성적을 받았으며 …</p></div><div class=\"ck-via\"><i>▼</i><span>마감일로 묶는 것 = 마음대로 미룰 자유를 줄이는 것</span></div><div class=\"ck-step\"><span class=\"lab\">7번 문장 · 빈칸 채우기</span><div class=\"en\">… — whether by the professor or by students who recognize their own tendencies to delay things — improves self-control and performance.</div><p class=\"ko\">— 교수에 의해서든, 일을 미루는 자신의 경향을 인식한 학생들에 의해서든 — 자기 통제와 성과를 향상시킨다고.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">restricting freedom 자유를 제한하는 것<small>set deadlines(정해진 마감일)로 미룰 자유를 묶은 반이 1등이었어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">removing obstacles 장애물을 없애는 것</span><span class=\"why\">마감일을 다 없애 준 반은 4번 no deadlines(마감일이 없음) 반인데, 6번에서 성적이 the worst(최하)였어요. 정반대예요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">offering rewards 보상을 제공하는 것</span><span class=\"why\">세 반 어디에도 상을 준다는 말이 없어요. 반마다 다른 건 마감일뿐이에요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">increasing assignments 과제를 늘리는 것</span><span class=\"why\">2번에서 모든 반에 똑같이 three reports(세 편의 보고서)를 냈어요. 과제 양은 그대로예요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">encouraging competition 경쟁을 장려하는 것</span><span class=\"why\">반끼리 겨루게 한 장면이 없어요. 성적 차이는 경쟁이 아니라 마감일 차이에서 나왔어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">To demonstrate</div><div class=\"k\">보여 주기 위해</div></div><div class=\"rc\"><div class=\"e\">how best to defeat the habit of delaying,</div><div class=\"k\">미루는 습관을 가장 잘 물리치는 방법을,</div></div><div class=\"rc\"><div class=\"e\">Dan Ariely, a professor of psychology and behavioral economics,</div><div class=\"k\">심리학과 행동경제학 교수인 Dan Ariely는,</div></div><div class=\"rc\"><div class=\"e\">performed an experiment</div><div class=\"k\">실험을 수행했다</div></div><div class=\"rc\"><div class=\"e\">on students in three of his classes at MIT.</div><div class=\"k\">MIT에 있는 자신의 세 학급의 학생들을 대상으로.</div></div><div class=\"rnat\">미루는 습관을 물리치는 가장 좋은 방법을 보여 주기 위해, 심리학과 행동경제학 교수인 Dan Ariely는 MIT의 세 학급 학생들을 대상으로 실험을 했다.</div><div class=\"rst\">학원 쌤이 “숙제 미루는 버릇을 어떻게 고칠까?” 궁금해서 세 반으로 실험을 해요. = 지문 1번, 한 심리학 교수가 대학의 세 학급으로 한 실험이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">He assigned all classes</div><div class=\"k\">그는 모든 학급에 부여했다</div></div><div class=\"rc\"><div class=\"e\">three reports</div><div class=\"k\">세 편의 보고서를</div></div><div class=\"rc\"><div class=\"e\">over the course of the semester.</div><div class=\"k\">학기 동안.</div></div><div class=\"rnat\">그는 모든 학급에 학기 동안 세 편의 보고서를 부과했다.</div><div class=\"rst\">세 반 모두 한 학기 동안 독후감 세 편을 똑같이 내야 해요. 지문 2번, 모든 반에 보고서 세 편을 줬다는 말이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">The first class had to choose</div><div class=\"k\">첫 번째 학급은 골라야 했다</div></div><div class=\"rc\"><div class=\"e\">three due dates for themselves,</div><div class=\"k\">스스로를 위한 세 개의 마감일을,</div></div><div class=\"rc\"><div class=\"e\">up to and including the last day of class.</div><div class=\"k\">수업 마지막 날까지 포함하여.</div></div><div class=\"rnat\">첫 번째 학급은 수업 마지막 날까지를 포함해서 스스로 세 개의 마감일을 정해야 했다.</div><div class=\"rst\">첫째 반은 “언제 낼지 너희가 정해” 하고 마감일 세 개를 스스로 골라요. = 지문 3번이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">The second</div><div class=\"k\">두 번째(= 두 번째 학급)는</div></div><div class=\"rc\"><div class=\"e\">had no deadlines —</div><div class=\"k\">마감일이 없었다 —</div></div><div class=\"rc\"><div class=\"e\">all three papers just had to be submitted</div><div class=\"k\">세 편의 과제물 모두 제출되기만 하면 되었다</div></div><div class=\"rc\"><div class=\"e\">by the last day of class.</div><div class=\"k\">수업 마지막 날까지.</div></div><div class=\"rnat\">두 번째 학급에는 마감 기한이 아예 없었고, 세 편의 보고서 모두 그저 수업 마지막 날까지만 제출하면 되었다.</div><div class=\"rst\">둘째 반은 마감일이 아예 없어요. 학기 마지막 날까지만 내면 끝이에요. = 지문 4번, 마감일이 없는 반이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">In his third class,</div><div class=\"k\">그의 세 번째 학급에서는,</div></div><div class=\"rc\"><div class=\"e\">he gave students three set deadlines</div><div class=\"k\">그는 학생들에게 세 개의 정해진 마감일을 주었다</div></div><div class=\"rc\"><div class=\"e\">over the course of the semester.</div><div class=\"k\">학기 동안.</div></div><div class=\"rnat\">세 번째 학급에서는 그가 학기 동안 세 개의 정해진 마감일을 학생들에게 주었다.</div><div class=\"rst\">셋째 반은 쌤이 “이날, 이날, 이날까지!” 하고 날짜를 딱 정해 줘요. 지문 5번, 정해진 마감일 세 개예요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">At the end of the semester,</div><div class=\"k\">학기 말에,</div></div><div class=\"rc ckc\"><div class=\"e\">he found that students <span class=\"cw\">with set deadlines</span> received <span class=\"cw\">the best grades</span>,</div><div class=\"k\">그는 <span class=\"cw\">정해진 마감일이 있던</span> 학생들이 <span class=\"cw\">최고의 성적을</span> 받았고,</div></div><div class=\"rc ckc\"><div class=\"e\">the students with <span class=\"cw\">no deadlines</span> had the worst,</div><div class=\"k\"><span class=\"cw\">마감일이 없던</span> 학생들은 최하의 성적을 받았으며,</div></div><div class=\"rc\"><div class=\"e\">and those who could choose their own deadlines</div><div class=\"k\">자신의 마감일을 고를 수 있었던 학생들(= 첫 번째 학급 학생들)은</div></div><div class=\"rc\"><div class=\"e\">fell somewhere in the middle.</div><div class=\"k\">그 중간 어딘가에 위치한다는 것을 알아냈다.</div></div><div class=\"rnat\">학기 말에 그는 정해진 마감일이 있던 학생들이 가장 좋은 성적을 받았고, 마감일이 없던 학생들이 가장 나쁜 성적을 받았으며, 스스로 마감일을 고를 수 있었던 학생들은 그 중간 어딘가에 있다는 것을 발견했다.</div><div class=\"rst\">결과는? <b>날짜가 정해진 반이 1등</b>, 마감일 없는 반이 꼴찌, 스스로 정한 반은 중간이에요. 지문 6번이 결정적 단서예요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Ariely concludes</div><div class=\"k\">Ariely는 결론짓는다</div></div><div class=\"rc ckc\"><div class=\"e\">that <span class=\"cw\">restricting freedom</span></div><div class=\"k\"><span class=\"cw\">자유를 제한하는 것이</span> ※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">— whether by the professor or by students who recognize their own tendencies to delay things —</div><div class=\"k\">— 교수에 의해서든, 일을 미루는 자신의 경향을 인식한 학생들에 의해서든 —</div></div><div class=\"rc\"><div class=\"e\">improves self-control and performance.</div><div class=\"k\">자기 통제와 성과를 향상시킨다고.</div></div><div class=\"rnat\">Ariely는 교수에 의해서든, 자신이 일을 미루는 경향을 알아차린 학생들 스스로에 의해서든, 자유를 제한하는 것이 자기통제력과 성과를 향상시킨다고 결론짓는다.</div><div class=\"rst\">그래서 쌤은 결론 내려요. 마음대로 미룰 수 있는 <b>자유를 묶어 두면</b> 더 잘한다고요. 빈칸은 restricting freedom(자유를 제한하는 것)이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"demonstrate\" data-m=\"보여주다, 입증하다\"><b>demonstrate</b>보여주다, 입증하다</button><button type=\"button\" class=\"wdb\" data-w=\"assigned\" data-m=\"부과했다 (assign 부과하다, 할당하다)\"><b>assigned</b>부과했다 (assign 부과하다, 할당하다)</button><button type=\"button\" class=\"wdb\" data-w=\"due date\" data-m=\"마감일\"><b>due date</b>마감일</button><button type=\"button\" class=\"wdb\" data-w=\"submitted\" data-m=\"제출된 (submit 제출하다)\"><b>submitted</b>제출된 (submit 제출하다)</button><button type=\"button\" class=\"wdb\" data-w=\"restricting\" data-m=\"제한하는 것 (restrict 제한하다)\"><b>restricting</b>제한하는 것 (restrict 제한하다)</button><button type=\"button\" class=\"wdb\" data-w=\"self-control\" data-m=\"자기통제(력)\"><b>self-control</b>자기통제(력)</button></div>"};

      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
