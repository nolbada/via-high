/div><div class=\"rst\">작년 1등이던 2반이 올해는 2등이에요. = 지문의 남아시아가 2016년 1위, 2017년 <b>the second highest</b>(2위)예요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">Though the number of jobs in North America</div><div class=\"k\">비록 북아메리카의 일자리 수는</div></div><div class=\"rc\"><div class=\"e\">directly created by travel and tourism</div><div class=\"k\">여행 및 관광업에 의해 직접적으로 창출된</div></div><div class=\"rc\"><div class=\"e\">was lower in 2017 than in 2016,</div><div class=\"k\">2016년보다 2017년에 더 적었지만</div></div><div class=\"rc ckc\"><div class=\"e\">it <span class=\"cw\">still</span> <span class=\"cw\">exceeded 10 million</span> in 2017.</div><div class=\"k\">그것(= 북아메리카의 일자리 수)은 <span class=\"cw\">그래도</span> 2017년에 <span class=\"cw\">1천만 개를 넘었다</span> (→ 실제로는 2017년에 1천만 개에 미치지 못했다)</div></div><div class=\"rnat\">④ 비록 여행 및 관광업에 의해 직접적으로 창출된 북아메리카의 일자리의 수는 2016년보다 2017년에 더 적었지만, 그래도 2017년에 1천만 개를 넘었다(→ 2017년에는 1천만 개에 미치지 못했다).</div><div class=\"rst\">3반은 1,009개에서 994개로 줄어 1천 개를 못 넘었는데 ‘넘었다’고 했어요. = 지문의 <b>exceeded</b>(넘었다) 10 million(1천만)이 틀려요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">In 2017,</div><div class=\"k\">2017년에</div></div><div class=\"rc\"><div class=\"e\">travel and tourism directly contributed</div><div class=\"k\">여행과 관광업은 직접적으로 기여했다</div></div><div class=\"rc\"><div class=\"e\">5.71 million jobs in Latin America,</div><div class=\"k\">라틴아메리카에 571만 개의 일자리에</div></div><div class=\"rc\"><div class=\"e\">which was over six times more</div><div class=\"k\">이것(= 571만 개)은 여섯 배 넘게 더 많았다</div></div><div class=\"rc\"><div class=\"e\">than those of Oceania in 2017.</div><div class=\"k\">2017년 오세아니아의 것(= 일자리 수)보다</div></div><div class=\"rnat\">⑤ 2017년에, 여행과 관광업은 라틴아메리카에 571만 개의 일자리(창출)에 직접적으로 기여했는데, 이는 2017년 오세아니아의 것보다 여섯 배 넘게 더 많았다.</div><div class=\"rst\">4반 571개는 5반의 여섯 배가 넘어요. = 지문의 라틴아메리카 571만 개가 오세아니아보다 <b>six times</b>(여섯 배) 넘게 많다는 말이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"directly\" data-m=\"직접적으로\"><b>directly</b>직접적으로</button><button type=\"button\" class=\"wdb\" data-w=\"region\" data-m=\"지역\"><b>region</b>지역</button><button type=\"button\" class=\"wdb\" data-w=\"generate\" data-m=\"만들어 내다, 발생시키다\"><b>generate</b>만들어 내다, 발생시키다</button><button type=\"button\" class=\"wdb\" data-w=\"contribute\" data-m=\"기여하다\"><b>contribute</b>기여하다</button><button type=\"button\" class=\"wdb\" data-w=\"rank\" data-m=\"순위에 오르다\"><b>rank</b>순위에 오르다</button><button type=\"button\" class=\"wdb\" data-w=\"exceed\" data-m=\"넘다, 초과하다\"><b>exceed</b>넘다, 초과하다</button></div>", "08": "<p class=\"mtr\">마더텅 정답률 <b>65%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">불일치 문제는 선택지를 <b>지문 순서대로</b> 대조하세요. 특히 <b>rarely</b>(거의 ~않는) 같은 <b>빈도 부정어</b>는 뜻을 정반대로 뒤집으니 꼭 표시해요.</p><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>① ↔ 1번</em>‘living stones’(살아있는 돌)라고 불림 → 같음</span><span><em>② ↔ 2번</em>native to the deserts of South Africa(남아프리카 사막이 원산지) → 같음</span><span><em>④ ↔ 6번</em>no true stem(실제 줄기는 없음), much of the plant is underground(대부분 땅속) → 같음</span><span><em>⑤ ↔ 7번</em>the effect of conserving moisture(수분 보존 효과) → 같음</span></div><div class=\"ck-eq\">⇒ 네 개는 지문과 그대로 같아요. 남은 ③을 4번과 대조해요</div></div><div class=\"ck-via\"><i>▼</i><span>③의 ‘1인치 이상 자란다’를 4번에서 찾아요</span></div><div class=\"ck-step key\"><span class=\"lab\">4번 문장 · 결정적 단서</span><div class=\"en\">Lithops are small plants, <mark>rarely</mark> getting <mark>more than an inch</mark> above the soil surface …</div><p class=\"ko\">Lithops는 작은 식물이다, <mark>1인치 이상 거의 자라지 않으면서</mark> 토양 표면 위로 …</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">토양의 표면 위로 대개 1인치 이상 자란다.<small>4번: rarely(거의 ~않는) 때문에 1인치 넘게 자라는 일은 드물어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">줄기가 없으며 땅속에 대부분 묻혀 있다.</span><span class=\"why\">6번 no true stem(실제 줄기는 없음)의 no(없음)를 보고 틀렸다고 착각하기 쉽지만, 선택지도 ‘줄기가 없다’라서 같아요. much of the plant is underground(대부분이 땅속에 있다)도 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">살아있는 돌로 불리는 식물이다.</span><span class=\"why\">1번에서 ‘living stones’(살아있는 돌)라고 흔히 불린다고 했어요. 바위 같은 겉모양 때문이라 선택지와 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">원산지는 남아프리카 사막 지역이다.</span><span class=\"why\">2번 native to the deserts of South Africa(남아프리카 사막이 원산지)와 같아요. 원예 용품점에서 판다는 말은 원산지와 별개예요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">겉모양은 수분 보존 효과를 갖고 있다.</span><span class=\"why\">7번 has the effect of conserving moisture(수분을 보존하는 효과를 가진다)와 같아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Lithops are plants</div><div class=\"k\">Lithops는 식물이다</div></div><div class=\"rc\"><div class=\"e\">that are often called ‘living stones’</div><div class=\"k\">흔히 ‘살아있는 돌’로 불리는</div></div><div class=\"rc\"><div class=\"e\">on account of</div><div class=\"k\">~ 때문에</div></div><div class=\"rc\"><div class=\"e\">their unique rock-like appearance.</div><div class=\"k\">그것들의 독특한 바위 같은 겉모양</div></div><div class=\"rnat\">Lithops는 독특한 바위 같은 겉모양 때문에 흔히 ‘살아있는 돌’로 불리는 식물이다.</div><div class=\"rst\">과학 시간에 화분 하나를 관찰 카드로 정리해요. 첫 칸: 돌처럼 생겨서 ‘살아있는 돌’이라 불림. 지문 1번 = 선택지 ①이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">They are native to</div><div class=\"k\">그것들(= Lithops)은 ~이 원산지이다</div></div><div class=\"rc\"><div class=\"e\">the deserts of South Africa</div><div class=\"k\">남아프리카 사막의</div></div><div class=\"rc\"><div class=\"e\">but commonly sold</div><div class=\"k\">하지만 흔히 팔린다</div></div><div class=\"rc\"><div class=\"e\">in garden centers and nurseries.</div><div class=\"k\">원예 용품점과 묘목장에서</div></div><div class=\"rnat\">그것들의 원산지는 남아프리카 사막이지만, 원예 용품점과 묘목장에서 흔히 팔린다.</div><div class=\"rst\">둘째 칸: 고향은 남아프리카 사막인데, 동네 꽃집에서도 흔히 팔아요. 지문 2번 = 선택지 ②예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Lithops grow well</div><div class=\"k\">Lithops는 잘 자란다</div></div><div class=\"rc\"><div class=\"e\">in compacted, sandy soil</div><div class=\"k\">빽빽한 모래 토양에서</div></div><div class=\"rc\"><div class=\"e\">with little water</div><div class=\"k\">물이 거의 없는</div></div><div class=\"rc\"><div class=\"e\">and extreme hot temperatures.</div><div class=\"k\">그리고 극도로 높은 온도(에서)</div></div><div class=\"rnat\">Lithops는 물이 거의 없는 빽빽한 모래 토양과 극도의 높은 온도에서 잘 자란다.</div><div class=\"rst\">셋째 칸: 물이 거의 없고 아주 뜨거운 모래땅에서 잘 자라요. 지문 3번 그대로 적어요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">Lithops are small plants,</div><div class=\"k\">Lithops는 작은 식물이다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">rarely</span> getting <span class=\"cw\">more than an inch</span></div><div class=\"k\"><span class=\"cw\">1인치 이상</span> <span class=\"cw\">거의 자라지 않으면서</span></div></div><div class=\"rc\"><div class=\"e\">above the soil surface</div><div class=\"k\">토양 표면 위로</div></div><div class=\"rc\"><div class=\"e\">and usually with only two leaves.</div><div class=\"k\">보통 단 두 개의 잎들을 가지고 있다</div></div><div class=\"rnat\">Lithops는 작은 식물이고, 토양 표면 위로 1인치 이상 거의 자라지 않으면서 보통 단 두 개의 잎들을 가지고 있다.</div><div class=\"rst\">넷째 칸이 핵심! 키가 작아서 흙 위로 1인치 넘게 <b>거의 안</b> 자라요. 지문 4번 <b>rarely</b>(거의 ~않는) 때문에 ③ ‘대개 1인치 이상’과 어긋나요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">The thick leaves resemble</div><div class=\"k\">두꺼운 잎은 닮았다</div></div><div class=\"rc\"><div class=\"e\">the cleft in an animal’s foot</div><div class=\"k\">동물의 발의 갈라진 틈과</div></div><div class=\"rc\"><div class=\"e\">or just a pair of grayish brown stones</div><div class=\"k\">혹은 딱 한 쌍의 회갈색 돌과</div></div><div class=\"rc\"><div class=\"e\">gathered together.</div><div class=\"k\">함께 모여 있는 (돌)</div></div><div class=\"rnat\">두꺼운 잎은 동물의 발의 갈라진 틈이나 함께 모여 있는 딱 한 쌍의 회갈색 돌과 닮았다.</div><div class=\"rst\">다섯째 칸: 두꺼운 잎 두 장이 동물 발굽 틈이나 회갈색 돌 두 개처럼 생겼어요. 지문 5번의 생김새 설명이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">The plants have</div><div class=\"k\">그 식물은 가지고 있다</div></div><div class=\"rc\"><div class=\"e\">no true stem</div><div class=\"k\">실제 줄기는 없고</div></div><div class=\"rc\"><div class=\"e\">and much of the plant is underground.</div><div class=\"k\">그 식물의 대부분이 땅속에 있다</div></div><div class=\"rnat\">그 식물은 실제 줄기는 없고 그 식물의 대부분이 땅속에 있다.</div><div class=\"rst\">여섯째 칸: 진짜 줄기는 없고 몸 대부분이 흙 속에 숨어 있어요. 지문 6번 = 선택지 ④예요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Their appearance</div><div class=\"k\">그것들(= Lithops)의 겉모양은</div></div><div class=\"rc\"><div class=\"e\">has the effect of conserving moisture.</div><div class=\"k\">수분을 보존하는 효과를 가지고 있다</div></div><div class=\"rnat\">그것들의 겉모양은 수분을 보존하는 효과를 가지고 있다.</div><div class=\"rst\">마지막 칸: 이 돌 같은 모양 덕분에 물기를 아껴 둘 수 있어요. 지문 7번 <b>수분 보존</b> = 선택지 ⑤예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"on account of\" data-m=\"~ 때문에\"><b>on account of</b>~ 때문에</button><button type=\"button\" class=\"wdb\" data-w=\"native\" data-m=\"원산의, 토종의\"><b>native</b>원산의, 토종의</button><button type=\"button\" class=\"wdb\" data-w=\"compacted\" data-m=\"빽빽한, 꽉 찬\"><b>compacted</b>빽빽한, 꽉 찬</button><button type=\"button\" class=\"wdb\" data-w=\"resemble\" data-m=\"닮다\"><b>resemble</b>닮다</button><button type=\"button\" class=\"wdb\" data-w=\"stem\" data-m=\"줄기\"><b>stem</b>줄기</button><button type=\"button\" class=\"wdb\" data-w=\"conserve\" data-m=\"보존하다\"><b>conserve</b>보존하다</button></div>", "09": "<p class=\"mtr\">마더텅 정답률 <b>70%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">무관한 문장은 <b>첫 문장의 화제</b>를 잡고 하나씩 대 보는 문제예요. 이 글의 화제는 <b>두뇌 유출</b>(brain drain 우수 인재가 나라를 떠나는 것)이에요. brain(두뇌)이라는 단어만 같고 화제가 다른 문장을 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">1번 · 글 전체 화제</span><div class=\"en\">Globalization has resulted in <mark>a global brain drain</mark>, which refers to the situation in which countries lose their best educated workers.</div><p class=\"ko\">세계화는 <mark>세계적인 두뇌 유출을</mark> 초래해 왔는데, 그것은 국가가 최고로 잘 교육받은 일꾼들을 잃는 상황을 일컫는다.</p></div><div class=\"ck-via\"><i>▼</i><span>2번 아랍 연맹 보고서에 이어 Another study(또 다른 연구)로 예를 하나 더</span></div><div class=\"ck-step\"><span class=\"lab\">①(2번)·②(3번) · 화제의 예</span><div class=\"en\">Another study suggested that vast numbers of developing countries’ doctors <mark>were working abroad</mark> …</div><p class=\"ko\">또 다른 연구는 엄청난 수의 개발도상국 의사들이 <mark>해외에서 일하고 있다는 것을</mark> 시사했다 …</p></div><div class=\"ck-via\"><i>▼</i><span>의사들이 ‘나라를 떠난다’에서 갑자기 ‘병 연구’ 얘기로 바뀜</span></div><div class=\"ck-step key\"><span class=\"lab\">③(4번) · 이탈 지점</span><div class=\"en\">Many doctors have searched for the causes of <mark>a rare brain disease</mark>.</div><p class=\"ko\">많은 의사들이 <mark>희귀 두뇌 질환의</mark> 원인을 찾아왔다.</p></div><div class=\"ck-via\"><i>▼</i><span>③을 빼면 ②의 해외 의사 → ④의 두뇌 유출 걱정으로 바로 이어짐</span></div><div class=\"ck-step\"><span class=\"lab\">④(5번) · 다시 제자리</span><div class=\"en\"><mark>The brain drain</mark> has even worried some wealthy countries.</div><p class=\"ko\"><mark>두뇌 유출은</mark> 심지어 몇몇 부유한 국가들도 걱정하게 만들었다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">많은 의사들이 희귀 두뇌 질환의 원인을 찾아왔다<small>두뇌 유출이 아니라 병 연구 이야기라 흐름에서 튀어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">개발도상국 의사들이 대거 해외에서 일한다</span><span class=\"why\">의사(doctors)가 나와서 ③과 같은 얘기처럼 보이지만, working abroad(해외에서 일하는)로 의사가 나라를 떠나는 두뇌 유출의 예예요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">매년 약 10만 명의 과학자·의사·기술자가 중동·북아프리카를 떠난다</span><span class=\"why\">1번 화제인 두뇌 유출의 첫 번째 예예요. leaving countries(나라를 떠나는)와 never returning(결코 돌아오지 않는)이 그대로 화제와 이어져요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">두뇌 유출은 부유한 나라들도 걱정하게 만들었다</span><span class=\"why\">The brain drain(두뇌 유출)을 주어로 다시 말하며, 가난한 나라뿐 아니라 부자 나라 쪽으로 화제를 넓혀요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">뉴질랜드는 해외 전문직을 다시 불러들이는 프로그램을 시작했다</span><span class=\"why\">for instance(예를 들어)로 ④의 ‘부유한 나라도 걱정한다’의 실제 예를 들어요. 해외 인재를 back home(고국으로) 데려오려는 거예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Globalization has resulted in</div><div class=\"k\">세계화는 초래해 왔다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">a global brain drain</span>,</div><div class=\"k\"><span class=\"cw\">세계적인 두뇌 유출을</span></div></div><div class=\"rc\"><div class=\"e\">which refers to the situation</div><div class=\"k\">그것(= 두뇌 유출)은 상황을 일컫는다</div></div><div class=\"rc\"><div class=\"e\">in which countries lose</div><div class=\"k\">국가가 잃는</div></div><div class=\"rc\"><div class=\"e\">their best educated workers.</div><div class=\"k\">그들의 최고로 잘 교육받은 일꾼들을</div></div><div class=\"rnat\">세계화는 세계적인 두뇌 유출을 초래해 왔는데, 그것은 국가가 그들의 최고로 잘 교육받은 일꾼들을 잃는 상황을 일컫는다.</div><div class=\"rst\">우리 학교 축구부 에이스들이 하나둘 다른 학교로 전학 가 버려요. 지문은 이렇게 나라가 최고 인재를 잃는 걸 <b>두뇌 유출</b>(brain drain)이라고 해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">A report released</div><div class=\"k\">발표된 보고서는</div></div><div class=\"rc\"><div class=\"e\">by the Arab League in 2009</div><div class=\"k\">2009년 아랍 연맹에 의해</div></div><div class=\"rc\"><div class=\"e\">found that roughly 100,000 scientists, doctors, and engineers</div><div class=\"k\">대략 100,000명의 과학자, 의사, 그리고 기술자들이 ~라는 것을 발견했다</div></div><div class=\"rc\"><div class=\"e\">were leaving countries</div><div class=\"k\">국가를 떠나고 있다</div></div><div class=\"rc\"><div class=\"e\">in the Middle East and North Africa every year,</div><div class=\"k\">중동과 북아프리카에 있는 (국가를) 매년</div></div><div class=\"rc\"><div class=\"e\">with most of the scientists and doctors never returning.</div><div class=\"k\">대부분의 과학자들과 의사들은 결코 돌아오지 않으면서</div></div><div class=\"rnat\">① 2009년 아랍 연맹에 의해 발표된 보고서는 대략 100,000명의 과학자, 의사, 그리고 기술자들이 매년 중동과 북아프리카 국가를 떠나고 있으며, 대부분의 과학자들과 의사들은 결코 돌아오지 않는다는 것을 발견했다.</div><div class=\"rst\">① 해마다 약 10만 명이 떠나고, 대부분 안 돌아와요. = 지문의 중동·북아프리카 과학자·의사·기술자들이 <b>나라를 떠난다</b>예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Another study suggested</div><div class=\"k\">또 다른 연구는 시사했다</div></div><div class=\"rc\"><div class=\"e\">that vast numbers of developing countries’ doctors</div><div class=\"k\">엄청난 수의 개발도상국 의사들이</div></div><div class=\"rc\"><div class=\"e\">were working abroad,</div><div class=\"k\">해외에서 일하고 있다는 것을</div></div><div class=\"rc\"><div class=\"e\">including 41% from Jamaica and 30% from Ghana.</div><div class=\"k\">자메이카에서 41퍼센트와 가나에서 30퍼센트를 포함하여</div></div><div class=\"rnat\">② 또 다른 연구는 자메이카(서인도 제도의 독립국)에서의 41퍼센트와 가나(아프리카 서부의 공화국)에서의 30퍼센트를 포함하여, 엄청난 수의 개발도상국 의사들이 해외에서 일하고 있다는 것을 시사했다.</div><div class=\"rst\">② 다른 조사에서도 자메이카 의사 41%, 가나 의사 30%가 해외에서 일한대요. 에이스가 다른 학교에서 뛰는 것처럼요. = 지문의 <b>해외 근무</b>예요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">Many doctors have searched for</div><div class=\"k\">많은 의사들이 찾아왔다</div></div><div class=\"rc ckc\"><div class=\"e\">the causes of <span class=\"cw\">a rare brain disease</span>.</div><div class=\"k\"><span class=\"cw\">희귀 두뇌 질환의</span> 원인을</div></div><div class=\"rnat\">③ 많은 의사들이 희귀 두뇌 질환의 원인을 찾아왔다.</div><div class=\"rst\">③ 갑자기 “의사들이 희귀한 뇌 질환 원인을 찾았다”는 얘기가 나와요. 떠나는 얘기가 아니라 <b>병 연구</b>라 지문 흐름에서 튀어요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">The brain drain</span></div><div class=\"k\"><span class=\"cw\">두뇌 유출은</span></div></div><div class=\"rc\"><div class=\"e\">has even worried</div><div class=\"k\">심지어 걱정하게 만들었다</div></div><div class=\"rc\"><div class=\"e\">some wealthy countries.</div><div class=\"k\">몇몇 부유한 국가들도</div></div><div class=\"rnat\">④ 두뇌 유출은 심지어 몇몇 부유한 국가들도 걱정하게 만들었다.</div><div class=\"rst\">④ 다시 두뇌 유출 얘기예요. 이젠 잘사는 학교도 에이스가 빠질까 걱정해요. = 지문의 <b>부유한 나라도 걱정</b>이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">The government of New Zealand,</div><div class=\"k\">뉴질랜드 정부는</div></div><div class=\"rc\"><div class=\"e\">for instance,</div><div class=\"k\">예를 들어</div></div><div class=\"rc\"><div class=\"e\">launched a program in 2006</div><div class=\"k\">2006년에 프로그램을 시작했다</div></div><div class=\"rc\"><div class=\"e\">to try to attract its professionals</div><div class=\"k\">자국의 전문직 종사자들을 끌어들이려는</div></div><div class=\"rc\"><div class=\"e\">living abroad back home.</div><div class=\"k\">해외에 거주하는 (이들을) 다시 고국으로</div></div><div class=\"rnat\">⑤ 예를 들어, 뉴질랜드 정부는 해외에 거주하는 전문직 종사자들을 다시 고국으로 끌어들이려는 프로그램을 2006년에 시작했다.</div><div class=\"rst\">⑤ 그래서 한 학교는 떠난 에이스를 다시 데려오는 작전을 세웠어요. = 지문의 뉴질랜드가 2006년 해외 전문가를 불러들이는 프로그램이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"result in\" data-m=\"~을 초래하다\"><b>result in</b>~을 초래하다</button><button type=\"button\" class=\"wdb\" data-w=\"refer to\" data-m=\"~을 일컫다\"><b>refer to</b>~을 일컫다</button><button type=\"button\" class=\"wdb\" data-w=\"roughly\" data-m=\"대략\"><b>roughly</b>대략</button><button type=\"button\" class=\"wdb\" data-w=\"vast\" data-m=\"엄청난, 막대한\"><b>vast</b>엄청난, 막대한</button><button type=\"button\" class=\"wdb\" data-w=\"abroad\" data-m=\"해외에서, 해외로\"><b>abroad</b>해외에서, 해외로</button><button type=\"button\" class=\"wdb\" data-w=\"attract\" data-m=\"끌어들이다\"><b>attract</b>끌어들이다</button></div>", "10": "<p class=\"mtr\">마더텅 정답률 <b>60%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">이야기 순서 문제는 <b>사건의 원인 → 결과</b>와 <b>지시어 that(그것)</b>을 고리로 이어요. 소녀들 등장 → 초대와 망신 → 창피함 → 학교 없음 → 그것을 바꾼 사람 순서예요.</p><div class=\"ck-step\"><span class=\"lab\">(A) 끝 · 5번</span><div class=\"en\"><mark>Two white girls</mark> about her age sat among a lot of dolls.</div><p class=\"ko\">그녀의 나이쯤 되는 <mark>2명의 백인 소녀가</mark> 수많은 인형들 사이에 앉아 있었다.</p></div><div class=\"ck-via\"><i>▼</i><span>one of them(그들 중 한 명) = (A)의 두 백인 소녀</span></div><div class=\"ck-step key\"><span class=\"lab\">(C) · 첫 번째 고리 · 6번</span><div class=\"en\">“Hello, Mary! Do you want to come in?” <mark>one of them</mark> called out.</div><p class=\"ko\">“안녕, Mary! 들어오고 싶니?”라고 <mark>그들(= 두 백인 소녀) 중 한 명이</mark> 외쳤다.</p></div><div class=\"ck-via\"><i>▼</i><span>(C) 끝에서 “넌 읽을 줄 모르잖아”라는 망신 → 그 결과 창피함</span></div><div class=\"ck-step key\"><span class=\"lab\">(B) · 두 번째 고리 · 14번</span><div class=\"en\"><mark>Feeling shameful</mark>, Mary handed the doll back to the white child …</div><p class=\"ko\"><mark>창피해 하면서</mark> Mary는 인형을 백인 아이에게 돌려주었고 …</p></div><div class=\"ck-via\"><i>▼</i><span>집에 돌아와 학교에 가고 싶다고 했지만 거절</span></div><div class=\"ck-step\"><span class=\"lab\">(B) 끝 · 17번</span><div class=\"en\">… he told her calmly, “<mark>There isn’t any school</mark>.”</div><p class=\"ko\">… 그는 그녀에게 조용히 “<mark>학교가 없단다</mark>.”라고 말했다</p></div><div class=\"ck-via\"><i>▼</i><span>that(그것) = (B) 끝의 “학교가 없다”는 상황</span></div><div class=\"ck-step key\"><span class=\"lab\">(D) · 세 번째 고리 · 18번</span><div class=\"en\">One day, however, a black woman in city clothes <mark>changed that</mark>.</div><p class=\"ko\">하지만 어느 날 도시의 옷을 입은 한 흑인 여성이 <mark>그것을 바꾸었다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">(C) – (B) – (D)<small>두 소녀 → 초대·망신 → 창피함·학교 없음 → 그것을 바꿈, 세 고리가 다 맞아요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">(C) – (D) – (B)</span><span class=\"why\">(C) 끝은 책을 빼앗긴 망신 장면이라 (D)의 that(그것)이 가리킬 “학교가 없다”는 말이 아직 안 나왔어요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">(B) – (D) – (C)</span><span class=\"why\">(A) 바로 뒤에 Feeling shameful(창피해 하면서)이 오면, 왜 창피한지 원인(책 빼앗긴 일)이 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">(D) – (B) – (C)</span><span class=\"why\">(A)는 놀이집 장면에서 끝나는데 changed that(그것을 바꾸었다)의 that(그것)이 가리킬 대상이 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">(D) – (C) – (B)</span><span class=\"why\">(D)가 먼저 오면 that(그것)이 가리킬 “학교가 없다”가 없고, (A)의 두 소녀와 (C)의 one of them(그들 중 한 명)도 끊겨요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">When Patsy McLeod took freshly washed clothes</div><div class=\"k\">Patsy McLeod가 갓 세탁한 옷을 가져갔을 때</div></div><div class=\"rc\"><div class=\"e\">to her former master Ben Wilson’s house,</div><div class=\"k\">그녀(= Patsy)의 이전 주인인 Ben Wilson의 집에</div></div><div class=\"rc\"><div class=\"e\">her nine-year-old daughter Mary went along.</div><div class=\"k\">그녀(= Patsy)의 9살 난 딸 Mary가 따라갔다</div></div><div class=\"rnat\">(A)(1) Patsy McLeod가 갓 세탁한 옷을 그녀의 이전 주인인 Ben Wilson의 집에 가져갔을 때 그녀의 9살 난 딸 Mary가 따라갔다.</div><div class=\"rst\">엄마가 빨래를 갖다주러 예전 주인의 큰 집에 갈 때, 아홉 살 메리도 따라가요. = 지문의 첫 장면이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">When they arrived at the big house,</div><div class=\"k\">그들(= Patsy와 Mary)이 그 큰 집에 도착했을 때</div></div><div class=\"rc\"><div class=\"e\">the McLeods walked to the rear entrance</div><div class=\"k\">McLeods는 뒤쪽 출입구로 걸어갔다</div></div><div class=\"rc\"><div class=\"e\">used for blacks.</div><div class=\"k\">흑인들을 위해 사용되는(흑인들이 이용하는)</div></div><div class=\"rnat\">(A)(2) 그들이 그 큰 집에 도착했을 때 McLeods는 흑인들을 위해 사용되는(흑인들이 이용하는) 뒤쪽 출입구로 걸어갔다.</div><div class=\"rst\">큰 집에 도착하자 둘은 앞문이 아니라 흑인용 <b>뒷문</b>으로 가요. = 지문의 뒤쪽 출입구예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">In 1884 there was sharp segregation</div><div class=\"k\">1884년에 뚜렷한(심한) 분리정책이 있었다</div></div><div class=\"rc\"><div class=\"e\">between the races</div><div class=\"k\">인종 간의</div></div><div class=\"rc\"><div class=\"e\">in Mayesville, South Carolina.</div><div class=\"k\">South Carolina주의 Mayesville에서는</div></div><div class=\"rnat\">(A)(3) 1884년에, South Carolina(사우스캐롤라이나)주의 Mayesville(메이스빌)에서는 뚜렷한(심한) 인종 간 분리정책이 있었다.</div><div class=\"rst\">그 시절 그 동네는 피부색에 따라 사람을 갈라놓는 규칙이 심했어요. = 지문의 1884년 인종 <b>분리정책</b>이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">While (a) her mother went inside the house,</div><div class=\"k\">(a)그녀(Mary)의 엄마가 집 안에 들어가 있는 동안</div></div><div class=\"rc\"><div class=\"e\">Mary wandered over</div><div class=\"k\">Mary는 돌아다녔고(걸어갔고)</div></div><div class=\"rc\"><div class=\"e\">to a children’s playhouse</div><div class=\"k\">아이들의 장난감 집 쪽으로</div></div><div class=\"rc\"><div class=\"e\">and looked inside.</div><div class=\"k\">안을 살펴보았다</div></div><div class=\"rnat\">(A)(4) (a)그녀(Mary)의 엄마가 집 안에 들어가 있는 동안 Mary는 아이들의 장난감 집 쪽으로 돌아다녔고(걸어갔고) 안을 살펴보았다.</div><div class=\"rst\">엄마가 집 안에 들어간 사이, 메리는 아이들 장난감 집을 기웃거려요. 여기서 그녀의(her) 엄마 = 메리의 엄마예요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Two white girls</span> about her age</div><div class=\"k\">그녀(= Mary)의 나이쯤 되는 <span class=\"cw\">2명의 백인 소녀가</span></div></div><div class=\"rc\"><div class=\"e\">sat among a lot of dolls.</div><div class=\"k\">수많은 인형들 사이에 앉아 있었다</div></div><div class=\"rnat\">(A)(5) 대략 그녀의 나이인(또래인) 2명의 백인 소녀가 수많은 인형들 사이에 앉아 있었다.</div><div class=\"rst\">안에는 메리 또래 <b>백인 소녀 두 명</b>이 인형들 사이에 앉아 있어요. 이 두 소녀가 다음 장면 (C)로 이어지는 고리예요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">“Hello, Mary! Do you want to come in?”</div><div class=\"k\">“안녕, Mary! 들어오고 싶니?”라고</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">one of them</span> called out.</div><div class=\"k\"><span class=\"cw\">그들(= 두 백인 소녀) 중 한 명이</span> 외쳤다</div></div><div class=\"rnat\">(C)(1) “안녕, Mary! 들어오고 싶니?”라고 그들 중 한 명이 외쳤다.</div><div class=\"rst\">그중 <b>한 명</b>이 “메리, 들어올래?” 하고 불러요. = 지문의 그들 중 한 명, 곧 (A)의 두 소녀 중 하나예요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">Mary happily went into the playhouse.</div><div class=\"k\">Mary는 기쁘게 장난감 집 안으로 들어갔다</div></div><div class=\"rnat\">(C)(2) Mary는 기쁘게 장난감 집 안으로 들어갔다.</div><div class=\"rst\">친구 집 놀이방에 초대받은 것처럼 메리는 신나서 들어가요. = 지문의 기쁘게 들어갔다예요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">The white child handed a doll</div><div class=\"k\">백인 아이는 인형을 건네주었다</div></div><div class=\"rc\"><div class=\"e\">to the black girl,</div><div class=\"k\">흑인 소녀에게</div></div><div class=\"rc\"><div class=\"e\">saying “You can watch the baby</div><div class=\"k\">“너는 아이를 봐도 돼”라고 말하며</div></div><div class=\"rc\"><div class=\"e\">while I have tea with my friend.”</div><div class=\"k\">내가 친구와 차를 마시는 동안</div></div><div class=\"rnat\">(C)(3) 백인 아이는 “내가 친구와 차를 마시는 동안 너는 아이를 봐도 돼.”라고 말하며 흑인 소녀에게 인형을 건네주었다.</div><div class=\"rst\">백인 아이는 “나 친구랑 차 마시는 동안 너는 아기 봐” 하며 인형을 건네요. = 지문의 인형을 건넨 장면이에요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">While Mary walked the doll around the room,</div><div class=\"k\">Mary가 방에서 그 인형을 산책시키는 동안</div></div><div class=\"rc\"><div class=\"e\">her eyes fell upon a book;</div><div class=\"k\">그녀(= Mary)의 시선이 한 책에 쏠렸고</div></div><div class=\"rc\"><div class=\"e\">(d) she picked it up in awe.</div><div class=\"k\">(d)그녀(Mary)는 경외감으로(경외감을 느끼며) 그것(= 책)을 집어 들었다</div></div><div class=\"rnat\">(C)(4) Mary가 방에서 그 인형을 산책시키는 동안 그녀의 시선이 한 책에 쏠렸고 (d)그녀(Mary)는 경외감으로(경외감을 느끼며) 그것을 집어 들었다.</div><div class=\"rst\">인형을 안고 걷다가 메리 눈에 책 한 권이 들어와요. 귀한 보물을 보듯 조심스레 집어 들어요. = 지문의 경외감이에요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">Her parents had a Bible in their cabin,</div><div class=\"k\">그녀(= Mary)의 부모님은 오두막에 성경을 가지고 있었지만</div></div><div class=\"rc\"><div class=\"e\">but no one could read it.</div><div class=\"k\">아무도 그것(= 성경)을 읽을 수 없었다</div></div><div class=\"rnat\">(C)(5) 그녀의 부모님은 오두막에 성경을 가지고 있었지만 아무도 그것을 읽을 수 없었다.</div><div class=\"rst\">메리네 오두막에도 성경책이 있었지만 집에서 아무도 못 읽었어요. 그래서 책이 더 신기했던 거예요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">Unexpectedly</div><div class=\"k\">갑자기</div></div><div class=\"rc\"><div class=\"e\">the white girl grabbed the book.</div><div class=\"k\">백인 소녀가 그 책을 잡아챘다</div></div><div class=\"rnat\">(C)(6) 갑자기 백인 소녀가 그 책을 잡아챘다.</div><div class=\"rst\">갑자기 백인 소녀가 책을 확 낚아채요. = 지문의 예상 못 한 순간이에요.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">“Put that down!”</div><div class=\"k\">“그것을 내려놔!”</div></div><div class=\"rc\"><div class=\"e\">she yelled.</div><div class=\"k\">라며 그녀(= 백인 소녀)가 소리쳤다</div></div><div class=\"rnat\">(C)(7) “그것을 내려놔!”라며 그녀가 소리쳤다.</div><div class=\"rst\">“그거 내려놔!” 하고 소리를 질러요. = 지문의 고함이에요.</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">13번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">“You don’t know how to read.”</div><div class=\"k\">“너는 읽는 법을 모르잖아.”</div></div><div class=\"rnat\">(C)(8) “너는 읽는 법을 모르잖아.”</div><div class=\"rst\">“넌 읽을 줄도 모르잖아.” 반 친구들 앞에서 놀림받은 것처럼 아픈 말이에요. 이 일이 (B)의 창피함으로 이어져요.</div></div><div class=\"rds key\" data-ord=\"14\"><span class=\"rn\">14번 · 단서</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Feeling shameful</span>,</div><div class=\"k\"><span class=\"cw\">창피해 하면서</span></div></div><div class=\"rc\"><div class=\"e\">Mary handed the doll back to the white child</div><div class=\"k\">Mary는 인형을 백인 아이에게 돌려주었고</div></div><div class=\"rc\"><div class=\"e\">and rejoined her mother.</div><div class=\"k\">그녀(= Mary)의 엄마와 재회했다</div></div><div class=\"rnat\">(B)(1) 창피해 하면서, Mary는 인형을 백인 아이에게 돌려주었고 그녀의 엄마와 재회했다.</div><div class=\"rst\"><b>창피해진</b> 메리는 인형을 돌려주고 엄마에게 돌아가요. 이 창피함이 (C)에서 망신당한 결과라 (C) 다음이 (B)예요.</div></div><div class=\"rds\" data-ord=\"15\"><span class=\"rn\">15번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">On the walk back to their farm,</div><div class=\"k\">그들의 농장으로 걸어 돌아가는 길에</div></div><div class=\"rc\"><div class=\"e\">(b) she wondered</div><div class=\"k\">(b)그녀(Mary)는 궁금했다</div></div><div class=\"rc\"><div class=\"e\">why white people had all kinds of nice things</div><div class=\"k\">왜 백인들은 모든 종류의 좋은 것들을 가지고 있는지</div></div><div class=\"rc\"><div class=\"e\">and why, above all,</div><div class=\"k\">그리고 무엇보다도 왜</div></div><div class=\"rc\"><div class=\"e\">they could read while black people couldn’t.</div><div class=\"k\">흑인들은 읽을 수 없는데 반해 그들(= 백인)은 읽을 수 있는지</div></div><div class=\"rnat\">(B)(2) 그들의 농장으로 걸어 돌아가는 길에 (b)그녀(Mary)는 왜 백인들은 모든 종류의 좋은 것들을 가지고 있는지 그리고 무엇보다도, 흑인들은 읽을 수 없는데 반해 왜 그들(백인)은 읽을 수 있는지 궁금했다.</div><div class=\"rst\">집에 걸어가며 메리는 궁금해요. “왜 무엇보다 우리만 글을 못 읽지?” = 지문의 그녀(she)도 메리예요.</div></div><div class=\"rds\" data-ord=\"16\"><span class=\"rn\">16번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">(c) She decided</div><div class=\"k\">(c)그녀(Mary)는 결심했다</div></div><div class=\"rc\"><div class=\"e\">to learn to read.</div><div class=\"k\">읽는 것을 배우기로</div></div><div class=\"rnat\">(B)(3) (c)그녀(Mary)는 읽는 것을 배우기로 결심했다.</div><div class=\"rst\">그래서 메리는 꼭 <b>글 읽는 법을 배우기로</b> 마음먹어요. = 지문의 결심이에요.</div></div><div class=\"rds key\" data-ord=\"17\"><span class=\"rn\">17번 · 단서</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">At home the little girl asked her father</div><div class=\"k\">집에서 작은 소녀(= Mary)는 그녀의 아빠에게 부탁했고</div></div><div class=\"rc\"><div class=\"e\">to let her go to school,</div><div class=\"k\">그녀(= Mary)가 학교에 가게 해달라고</div></div><div class=\"rc\"><div class=\"e\">but he told her calmly,</div><div class=\"k\">하지만 그(= 아빠)는 그녀(= Mary)에게 조용히 말했다</div></div><div class=\"rc ckc\"><div class=\"e\">“<span class=\"cw\">There isn’t any school</span>.”</div><div class=\"k\">“<span class=\"cw\">학교가 없단다</span>.”라고</div></div><div class=\"rnat\">(B)(4) 집에서 작은 소녀는 아빠에게 학교에 가게 해달라고 부탁했지만, 그는 그녀에게 “학교가 없단다.”라고 조용히 말했다.</div><div class=\"rst\">집에서 아빠에게 학교 보내 달라고 하지만, 아빠는 조용히 “<b>학교가 없단다</b>” 해요. 이 말이 (D)의 that(그것)이 돼요.</div></div><div class=\"rds key\" data-ord=\"18\"><span class=\"rn\">18번 · 단서</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">One day, however,</div><div class=\"k\">하지만 어느 날</div></div><div class=\"rc\"><div class=\"e\">a black woman in city clothes</div><div class=\"k\">도시의 옷을 입은 한 흑인 여성이</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">changed that</span>.</div><div class=\"k\"><span class=\"cw\">그것을 바꾸었다</span></div></div><div class=\"rnat\">(D)(1) 하지만 어느 날 도시의 옷을 입은 한 흑인 여성이 그것을 바꾸었다.</div><div class=\"rst\"><b>그런데</b> 어느 날, 도시 옷차림의 한 흑인 여성이 <b>그것을 바꿔요</b>. that(그것) = 학교가 없다는 상황이에요.</div></div><div class=\"rds\" data-ord=\"19\"><span class=\"rn\">19번</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">Emma Wilson came to the McLeod cabin,</div><div class=\"k\">Emma Wilson은 McLeod의 오두막에 와서</div></div><div class=\"rc\"><div class=\"e\">explaining that (e) she would open a new school</div><div class=\"k\">(e)그녀(Wilson)가 새로운 학교를 열 것이라고 설명했다</div></div><div class=\"rc\"><div class=\"e\">in Mayesville for black children.</div><div class=\"k\">Mayesville에 흑인 아이들을 위한</div></div><div class=\"rnat\">(D)(2) Emma Wilson은 McLeod의 오두막에 와서 (e)그녀(Wilson)가 Mayesville(메이스빌)에 흑인 아이들을 위한 새로운 학교를 열 것이라고 설명했다.</div><div class=\"rst\">윌슨 선생님이 메리네 오두막에 와서 흑인 아이들을 위한 새 학교를 열겠다고 설명해요. 여기서 그녀 = 윌슨 선생님이에요.</div></div><div class=\"rds\" data-ord=\"20\"><span class=\"rn\">20번</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">“The school will begin</div><div class=\"k\">“학교는 시작될 것입니다”</div></div><div class=\"rc\"><div class=\"e\">after the cotton-picking season,”</div><div class=\"k\">목화 수확 시기 이후에</div></div><div class=\"rc\"><div class=\"e\">she said.</div><div class=\"k\">라고 그녀(= Emma Wilson)는 말했다</div></div><div class=\"rnat\">(D)(3) 그녀는 “학교는 목화 수확 시기 이후에 시작될 것입니다.”라고 말했다.</div><div class=\"rst\">“목화 따는 철이 끝나면 학교를 시작할 거예요.” 지문에서 윌슨 선생님이 학교 시작 시기를 알려 줘요.</div></div><div class=\"rds\" data-ord=\"21\"><span class=\"rn\">21번</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">Mary’s parents nodded in agreement.</div><div class=\"k\">Mary의 부모님은 동의하며 고개를 끄덕였다</div></div><div class=\"rnat\">(D)(4) Mary의 부모님은 동의하며 고개를 끄덕였다.</div><div class=\"rst\">메리의 부모님은 <b>찬성한다는 듯</b> 고개를 끄덕여요. = 지문의 동의하며 끄덕였다예요. 반대한 게 아니에요.</div></div><div class=\"rds\" data-ord=\"22\"><span class=\"rn\">22번</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">Mrs. McLeod also nodded</div><div class=\"k\">McLeod 부인도 고개를 끄덕였다</div></div><div class=\"rc\"><div class=\"e\">toward her daughter.</div><div class=\"k\">그녀(= McLeod 부인)의 딸을 향해</div></div><div class=\"rnat\">(D)(5) McLeod 부인도 그녀의 딸을 향해 고개를 끄덕였다.</div><div class=\"rst\">엄마도 딸 메리를 향해 “가도 된단다” 하듯 고개를 끄덕여요.</div></div><div class=\"rds\" data-ord=\"23\"><span class=\"rn\">23번</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">Young Mary was very excited.</div><div class=\"k\">어린 Mary는 매우 신이 났다</div></div><div class=\"rnat\">(D)(6) 어린 Mary는 매우 신이 났다.</div><div class=\"rst\">어린 메리는 너무 신이 나요. 지문도 그렇게 바라던 학교가 생겨서 매우 신났다고 해요.</div></div><div class=\"rds\" data-ord=\"24\"><span class=\"rn\">24번</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">“I’m gonna read?</div><div class=\"k\">“제가 읽게 될 거라고요?</div></div><div class=\"rc\"><div class=\"e\">Miss Wilson?”</div><div class=\"k\">Wilson 선생님?”</div></div><div class=\"rnat\">(D)(7) “제가 읽게 될 거라고요? Wilson 선생님?”</div><div class=\"rst\">“제가 글을 읽게 되는 거예요, 선생님?” 하고 묻는 메리. 16번의 결심이 이뤄지는 순간이에요.</div></div><div class=\"rds\" data-ord=\"25\"><span class=\"rn\">25번</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">She smiled at Mary.</div><div class=\"k\">그녀(= Wilson)는 Mary를 보고 미소 지었다</div></div><div class=\"rnat\">(D)(8) 그녀는 Mary를 보고 미소 지었다.</div><div class=\"rst\">윌슨 선생님은 메리를 보며 미소 지어요. = 지문의 마지막 장면, 그렇다는 대답이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"segregation\" data-m=\"분리, 차별 정책\"><b>segregation</b>분리, 차별 정책</button><button type=\"button\" class=\"wdb\" data-w=\"rear entrance\" data-m=\"뒤쪽 출입구\"><b>rear entrance</b>뒤쪽 출입구</button><button type=\"button\" class=\"wdb\" data-w=\"playhouse\" data-m=\"(아이들의) 놀이집\"><b>playhouse</b>(아이들의) 놀이집</button><button type=\"button\" class=\"wdb\" data-w=\"in awe\" data-m=\"경외감을 느끼며\"><b>in awe</b>경외감을 느끼며</button><button type=\"button\" class=\"wdb\" data-w=\"shameful\" data-m=\"창피한, 부끄러운\"><b>shameful</b>창피한, 부끄러운</button><button type=\"button\" class=\"wdb\" data-w=\"cabin\" data-m=\"오두막\"><b>cabin</b>오두막</button></div>", "11": "<p class=\"mtr\">마더텅 정답률 <b>65%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">지칭 문제는 (a)~(e) 앞에 <b>새로 등장한 인물</b>이 있는지부터 보세요. (e) 바로 앞에 <b>Emma Wilson</b>(엠마 윌슨)이 주어로 나오고, 학교를 여는 건 어린 메리가 할 수 없는 일이에요.</p><div class=\"ck-step\"><span class=\"lab\">(a) · 4번 문장</span><div class=\"en\">While <mark>(a) her mother</mark> went inside the house, Mary wandered over to a children’s playhouse …</div><p class=\"ko\"><mark>(a)그녀(Mary)의 엄마가</mark> 집 안에 들어가 있는 동안 Mary는 장난감 집 쪽으로 걸어갔고 … → 메리</p></div><div class=\"ck-via\"><i>▼</i><span>인형을 데리고 걷다 책을 집어 든 사람 = 놀이집에 들어온 메리</span></div><div class=\"ck-step\"><span class=\"lab\">(d) · 9번 문장</span><div class=\"en\">While Mary walked the doll around the room, her eyes fell upon a book; <mark>(d) she</mark> picked it up in awe.</div><p class=\"ko\">Mary가 인형을 산책시키는 동안 그녀의 시선이 책에 쏠렸고 <mark>(d)그녀(Mary)는</mark> 경외감을 느끼며 그것을 집어 들었다. → 메리</p></div><div class=\"ck-via\"><i>▼</i><span>14번에서 엄마와 다시 만난 메리가 농장으로 돌아가는 길</span></div><div class=\"ck-step\"><span class=\"lab\">(b) · 15번 문장</span><div class=\"en\">On the walk back to their farm, <mark>(b) she</mark> wondered why white people had all kinds of nice things …</div><p class=\"ko\">그들의 농장으로 걸어 돌아가는 길에 <mark>(b)그녀(Mary)는</mark> 왜 백인들은 좋은 것들을 가지고 있는지 궁금했다 … → 메리</p></div><div class=\"ck-via\"><i>▼</i><span>글을 못 읽어 망신당한 사람이 읽기를 배우기로 결심</span></div><div class=\"ck-step\"><span class=\"lab\">(c) · 16번 문장</span><div class=\"en\"><mark>(c) She decided</mark> to learn to read.</div><p class=\"ko\"><mark>(c)그녀(Mary)는</mark> 읽는 것을 배우기로 결심했다. → 메리</p></div><div class=\"ck-via\"><i>▼</i><span>새 인물 등장 + 학교를 여는 사람 = 어른인 윌슨 선생님</span></div><div class=\"ck-step key\"><span class=\"lab\">(e) · 19번 문장 · 결정적 단서</span><div class=\"en\"><mark>Emma Wilson</mark> came to the McLeod cabin, explaining that <mark>(e) she would open a new school</mark> in Mayesville for black children.</div><p class=\"ko\"><mark>Emma Wilson은</mark> 오두막에 와서 <mark>(e)그녀(Wilson)가</mark> 흑인 아이들을 위한 새로운 학교를 열 것이라고 설명했다 → 엠마 윌슨</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">(e) she 그녀 = 엠마 윌슨<small>19번에 새로 나온 엠마 윌슨이 학교를 열겠다고 설명하는 사람이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">(a) her 그녀의 = 메리</span><span class=\"why\">her mother(그녀의 엄마)라서 엄마를 가리킨다고 착각하기 쉬워요. 하지만 her(그녀의)는 “누구의 엄마인지”를 말해요. 1번에서 엄마를 따라간 딸 메리예요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">(b) she 그녀 = 메리</span><span class=\"why\">14번에서 엄마에게 돌아간 메리가 농장으로 걸어가며 “왜 우리는 못 읽지?” 하고 궁금해해요. 망신당한 메리의 생각이에요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">(c) She 그녀 = 메리</span><span class=\"why\">15번에서 글 읽기를 궁금해한 메리가 이어서 learn to read(읽는 것을 배우기)로 결심해요. 17번에서도 the little girl(작은 소녀)이 학교 보내 달라고 해요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">(d) she 그녀 = 메리</span><span class=\"why\">9번 앞부분 주어가 Mary(메리)이고, 인형을 데리고 다니다 책을 집어 든 사람도 같은 메리예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">When Patsy McLeod took freshly washed clothes</div><div class=\"k\">Patsy McLeod가 갓 세탁한 옷을 가져갔을 때</div></div><div class=\"rc\"><div class=\"e\">to her former master Ben Wilson’s house,</div><div class=\"k\">그녀(= Patsy)의 이전 주인인 Ben Wilson의 집에</div></div><div class=\"rc\"><div class=\"e\">her nine-year-old daughter Mary went along.</div><div class=\"k\">그녀(= Patsy)의 9살 난 딸 Mary가 따라갔다</div></div><div class=\"rnat\">(A)(1) Patsy McLeod가 갓 세탁한 옷을 그녀의 이전 주인인 Ben Wilson의 집에 가져갔을 때 그녀의 9살 난 딸 Mary가 따라갔다.</div><div class=\"rst\">엄마 심부름을 따라 예전에 엄마가 일하던 큰 집에 가는 아홉 살 메리를 떠올려요. = 지문의 빨래를 갖다주러 따라간 장면이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">When they arrived at the big house,</div><div class=\"k\">그들(= Patsy와 Mary)이 그 큰 집에 도착했을 때</div></div><div class=\"rc\"><div class=\"e\">the McLeods walked to the rear entrance</div><div class=\"k\">McLeods는 뒤쪽 출입구로 걸어갔다</div></div><div class=\"rc\"><div class=\"e\">used for blacks.</div><div class=\"k\">흑인들을 위해 사용되는(흑인들이 이용하는)</div></div><div class=\"rnat\">(A)(2) 그들이 그 큰 집에 도착했을 때 McLeods는 흑인들을 위해 사용되는(흑인들이 이용하는) 뒤쪽 출입구로 걸어갔다.</div><div class=\"rst\">큰 집에 도착하자 둘은 앞문이 아니라 흑인용 <b>뒷문</b>으로 가요. = 지문의 뒤쪽 출입구예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">In 1884 there was sharp segregation</div><div class=\"k\">1884년에 뚜렷한(심한) 분리정책이 있었다</div></div><div class=\"rc\"><div class=\"e\">between the races</div><div class=\"k\">인종 간의</div></div><div class=\"rc\"><div class=\"e\">in Mayesville, South Carolina.</div><div class=\"k\">South Carolina주의 Mayesville에서는</div></div><div class=\"rnat\">(A)(3) 1884년에, South Carolina(사우스캐롤라이나)주의 Mayesville(메이스빌)에서는 뚜렷한(심한) 인종 간 분리정책이 있었다.</div><div class=\"rst\">그 시절 그 동네는 피부색에 따라 사람을 갈라놓는 규칙이 심했어요. = 지문의 1884년 인종 <b>분리정책</b>이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc ckc\"><div class=\"e\">While <span class=\"cw\">(a) her mother</span> went inside the house,</div><div class=\"k\"><span class=\"cw\">(a)그녀(Mary)의 엄마가</span> 집 안에 들어가 있는 동안</div></div><div class=\"rc\"><div class=\"e\">Mary wandered over</div><div class=\"k\">Mary는 돌아다녔고(걸어갔고)</div></div><div class=\"rc\"><div class=\"e\">to a children’s playhouse</div><div class=\"k\">아이들의 장난감 집 쪽으로</div></div><div class=\"rc\"><div class=\"e\">and looked inside.</div><div class=\"k\">안을 살펴보았다</div></div><div class=\"rnat\">(A)(4) (a)그녀(Mary)의 엄마가 집 안에 들어가 있는 동안 Mary는 아이들의 장난감 집 쪽으로 돌아다녔고(걸어갔고) 안을 살펴보았다.</div><div class=\"rst\">엄마가 집 안에 들어간 사이, 메리는 아이들 장난감 집을 기웃거려요. 여기서 그녀의(her) 엄마 = 메리의 엄마예요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Two white girls about her age</div><div class=\"k\">그녀(= Mary)의 나이쯤 되는 2명의 백인 소녀가</div></div><div class=\"rc\"><div class=\"e\">sat among a lot of dolls.</div><div class=\"k\">수많은 인형들 사이에 앉아 있었다</div></div><div class=\"rnat\">(A)(5) 대략 그녀의 나이인(또래인) 2명의 백인 소녀가 수많은 인형들 사이에 앉아 있었다.</div><div class=\"rst\">안에는 메리 또래 <b>백인 소녀 두 명</b>이 인형들 사이에 앉아 있어요. = 지문의 그녀(her) 나이쯤 되는 두 소녀, 곧 메리 또래예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">“Hello, Mary! Do you want to come in?”</div><div class=\"k\">“안녕, Mary! 들어오고 싶니?”라고</div></div><div class=\"rc\"><div class=\"e\">one of them called out.</div><div class=\"k\">그들(= 두 백인 소녀) 중 한 명이 외쳤다</div></div><div class=\"rnat\">(C)(1) “안녕, Mary! 들어오고 싶니?”라고 그들 중 한 명이 외쳤다.</div><div class=\"rst\">그중 <b>한 명</b>이 “메리, 들어올래?” 하고 불러요. = 지문의 그들 중 한 명, 곧 5번의 두 백인 소녀 중 하나예요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Mary happily went into the playhouse.</div><div class=\"k\">Mary는 기쁘게 장난감 집 안으로 들어갔다</div></div><div class=\"rnat\">(C)(2) Mary는 기쁘게 장난감 집 안으로 들어갔다.</div><div class=\"rst\">친구 집 놀이방에 초대받은 것처럼 메리는 신나서 들어가요. = 지문의 기쁘게 들어갔다예요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">The white child handed a doll</div><div class=\"k\">백인 아이는 인형을 건네주었다</div></div><div class=\"rc\"><div class=\"e\">to the black girl,</div><div class=\"k\">흑인 소녀에게</div></div><div class=\"rc\"><div class=\"e\">saying “You can watch the baby</div><div class=\"k\">“너는 아이를 봐도 돼”라고 말하며</div></div><div class=\"rc\"><div class=\"e\">while I have tea with my friend.”</div><div class=\"k\">내가 친구와 차를 마시는 동안</div></div><div class=\"rnat\">(C)(3) 백인 아이는 “내가 친구와 차를 마시는 동안 너는 아이를 봐도 돼.”라고 말하며 흑인 소녀에게 인형을 건네주었다.</div><div class=\"rst\">백인 아이는 “나 친구랑 차 마시는 동안 너는 아기 봐” 하며 인형을 건네요. 메리는 놀이에서도 돌보는 역할만 맡아요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">While Mary walked the doll around the room,</div><div class=\"k\">Mary가 방에서 그 인형을 산책시키는 동안</div></div><div class=\"rc\"><div class=\"e\">her eyes fell upon a book;</div><div class=\"k\">그녀(= Mary)의 시선이 한 책에 쏠렸고</div></div><div class=\"rc\"><div class=\"e\">(d) she picked it up in awe.</div><div class=\"k\">(d)그녀(Mary)는 경외감으로(경외감을 느끼며) 그것(= 책)을 집어 들었다</div></div><div class=\"rnat\">(C)(4) Mary가 방에서 그 인형을 산책시키는 동안 그녀의 시선이 한 책에 쏠렸고 (d)그녀(Mary)는 경외감으로(경외감을 느끼며) 그것을 집어 들었다.</div><div class=\"rst\">인형을 안고 걷다가 메리 눈에 책 한 권이 들어와요. 귀한 보물을 보듯 조심스레 집어 들어요. = 지문의 경외감이에요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">Her parents had a Bible in their cabin,</div><div class=\"k\">그녀(= Mary)의 부모님은 오두막에 성경을 가지고 있었지만</div></div><div class=\"rc\"><div class=\"e\">but no one could read it.</div><div class=\"k\">아무도 그것(= 성경)을 읽을 수 없었다</div></div><div class=\"rnat\">(C)(5) 그녀의 부모님은 오두막에 성경을 가지고 있었지만 아무도 그것을 읽을 수 없었다.</div><div class=\"rst\">메리네 오두막에도 성경책이 있었지만 집에서 아무도 못 읽었어요. 그래서 책이 더 신기했던 거예요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">Unexpectedly</div><div class=\"k\">갑자기</div></div><div class=\"rc\"><div class=\"e\">the white girl grabbed the book.</div><div class=\"k\">백인 소녀가 그 책을 잡아챘다</div></div><div class=\"rnat\">(C)(6) 갑자기 백인 소녀가 그 책을 잡아챘다.</div><div class=\"rst\">갑자기 백인 소녀가 책을 확 낚아채요. = 지문의 예상 못 한 순간이에요.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><div class=\"rc\"><div class=\"e\">“Put that down!”</div><div class=\"k\">“그것을 내려놔!”</div></div><div class=\"rc\"><div class=\"e\">she yelled.</div><div class=\"k\">라며 그녀(= 백인 소녀)가 소리쳤다</div></div><div class=\"rnat\">(C)(7) “그것을 내려놔!”라며 그녀가 소리쳤다.</div><div class=\"rst\">“그거 내려놔!” 하고 소리를 질러요. = 지문의 고함이에요.</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">13번</span><div class=\"rc\"><div class=\"e\">“You don’t know how to read.”</div><div class=\"k\">“너는 읽는 법을 모르잖아.”</div></div><div class=\"rnat\">(C)(8) “너는 읽는 법을 모르잖아.”</div><div class=\"rst\">“넌 읽을 줄도 모르잖아.” 반 친구들 앞에서 놀림받은 것처럼 아픈 말이에요. = 지문 속 백인 소녀의 말이에요.</div></div><div class=\"rds\" data-ord=\"14\"><span class=\"rn\">14번</span><div class=\"rc\"><div class=\"e\">Feeling shameful,</div><div class=\"k\">창피해 하면서</div></div><div class=\"rc\"><div class=\"e\">Mary handed the doll back to the white child</div><div class=\"k\">Mary는 인형을 백인 아이에게 돌려주었고</div></div><div class=\"rc\"><div class=\"e\">and rejoined her mother.</div><div class=\"k\">그녀(= Mary)의 엄마와 재회했다</div></div><div class=\"rnat\">(B)(1) 창피해 하면서, Mary는 인형을 백인 아이에게 돌려주었고 그녀의 엄마와 재회했다.</div><div class=\"rst\"><b>창피해진</b> 메리는 인형을 돌려주고 엄마에게 돌아가요. = 지문의 창피해하며 엄마와 다시 만났다예요.</div></div><div class=\"rds\" data-ord=\"15\"><span class=\"rn\">15번</span><div class=\"rc\"><div class=\"e\">On the walk back to their farm,</div><div class=\"k\">그들의 농장으로 걸어 돌아가는 길에</div></div><div class=\"rc\"><div class=\"e\">(b) she wondered</div><div class=\"k\">(b)그녀(Mary)는 궁금했다</div></div><div class=\"rc\"><div class=\"e\">why white people had all kinds of nice things</div><div class=\"k\">왜 백인들은 모든 종류의 좋은 것들을 가지고 있는지</div></div><div class=\"rc\"><div class=\"e\">and why, above all,</div><div class=\"k\">그리고 무엇보다도 왜</div></div><div class=\"rc\"><div class=\"e\">they could read while black people couldn’t.</div><div class=\"k\">흑인들은 읽을 수 없는데 반해 그들(= 백인)은 읽을 수 있는지</div></div><div class=\"rnat\">(B)(2) 그들의 농장으로 걸어 돌아가는 길에 (b)그녀(Mary)는 왜 백인들은 모든 종류의 좋은 것들을 가지고 있는지 그리고 무엇보다도, 흑인들은 읽을 수 없는데 반해 왜 그들(백인)은 읽을 수 있는지 궁금했다.</div><div class=\"rst\">집에 걸어가며 메리는 생각해요. “왜 백인들은 좋은 걸 다 갖고, 무엇보다 왜 우리만 글을 못 읽지?”</div></div><div class=\"rds\" data-ord=\"16\"><span class=\"rn\">16번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">(c) She</span> decided</div><div class=\"k\"><span class=\"cw\">(c)그녀(Mary)는 결심했다</span></div></div><div class=\"rc\"><div class=\"e\">to learn to read.</div><div class=\"k\">읽는 것을 배우기로</div></div><div class=\"rnat\">(B)(3) (c)그녀(Mary)는 읽는 것을 배우기로 결심했다.</div><div class=\"rst\">그래서 메리는 꼭 <b>글 읽는 법을 배우기로</b> 마음먹어요. = 지문의 결심이에요.</div></div><div class=\"rds\" data-ord=\"17\"><span class=\"rn\">17번</span><div class=\"rc\"><div class=\"e\">At home the little girl asked her father</div><div class=\"k\">집에서 작은 소녀(= Mary)는 그녀의 아빠에게 부탁했고</div></div><div class=\"rc\"><div class=\"e\">to let her go to school,</div><div class=\"k\">그녀(= Mary)가 학교에 가게 해달라고</div></div><div class=\"rc\"><div class=\"e\">but he told her calmly,</div><div class=\"k\">하지만 그(= 아빠)는 그녀(= Mary)에게 조용히 말했다</div></div><div class=\"rc\"><div class=\"e\">“There isn’t any school.”</div><div class=\"k\">“학교가 없단다.”라고</div></div><div class=\"rnat\">(B)(4) 집에서 작은 소녀는 아빠에게 학교에 가게 해달라고 부탁했지만, 그는 그녀에게 “학교가 없단다.”라고 조용히 말했다.</div><div class=\"rst\">집에서 아빠에게 학교 보내 달라고 하지만, 아빠는 조용히 “<b>학교가 없단다</b>” 해요. 이 말이 18번의 that(그것)이 돼요.</div></div><div class=\"rds\" data-ord=\"18\"><span class=\"rn\">18번</span><div class=\"rc\"><div class=\"e\">One day, however,</div><div class=\"k\">하지만 어느 날</div></div><div class=\"rc\"><div class=\"e\">a black woman in city clothes</div><div class=\"k\">도시의 옷을 입은 한 흑인 여성이</div></div><div class=\"rc\"><div class=\"e\">changed that.</div><div class=\"k\">그것을 바꾸었다</div></div><div class=\"rnat\">(D)(1) 하지만 어느 날 도시의 옷을 입은 한 흑인 여성이 그것을 바꾸었다.</div><div class=\"rst\"><b>그런데</b> 어느 날, 도시 옷차림의 한 흑인 여성이 <b>그것을 바꿔요</b>. that(그것) = 학교가 없다는 상황이에요.</div></div><div class=\"rds key\" data-ord=\"19\"><span class=\"rn\">19번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Emma Wilson</span> came to the McLeod cabin,</div><div class=\"k\"><span class=\"cw\">Emma Wilson은</span> McLeod의 오두막에 와서</div></div><div class=\"rc ckc\"><div class=\"e\">explaining that <span class=\"cw\">(e) she would open a new school</span></div><div class=\"k\"><span class=\"cw\">(e)그녀(Wilson)가 새로운 학교를 열 것이라고 설명했다</span></div></div><div class=\"rc\"><div class=\"e\">in Mayesville for black children.</div><div class=\"k\">Mayesville에 흑인 아이들을 위한</div></div><div class=\"rnat\">(D)(2) Emma Wilson은 McLeod의 오두막에 와서 (e)그녀(Wilson)가 Mayesville(메이스빌)에 흑인 아이들을 위한 새로운 학교를 열 것이라고 설명했다.</div><div class=\"rst\">윌슨 선생님이 메리네 오두막에 와서 흑인 아이들을 위한 새 학교를 열겠다고 설명해요. 여기서 그녀 = 윌슨 선생님이에요.</div></div><div class=\"rds\" data-ord=\"20\"><span class=\"rn\">20번</span><div class=\"rc\"><div class=\"e\">“The school will begin</div><div class=\"k\">“학교는 시작될 것입니다”</div></div><div class=\"rc\"><div class=\"e\">after the cotton-picking season,”</div><div class=\"k\">목화 수확 시기 이후에</div></div><div class=\"rc\"><div class=\"e\">she said.</div><div class=\"k\">라고 그녀(= Emma Wilson)는 말했다</div></div><div class=\"rnat\">(D)(3) 그녀는 “학교는 목화 수확 시기 이후에 시작될 것입니다.”라고 말했다.</div><div class=\"rst\">“목화 따는 철이 끝나면 학교를 시작할 거예요.” 하고 윌슨 선생님이 말해요.</div></div><div class=\"rds\" data-ord=\"21\"><span class=\"rn\">21번</span><div class=\"rc\"><div class=\"e\">Mary’s parents nodded in agreement.</div><div class=\"k\">Mary의 부모님은 동의하며 고개를 끄덕였다</div></div><div class=\"rnat\">(D)(4) Mary의 부모님은 동의하며 고개를 끄덕였다.</div><div class=\"rst\">메리의 부모님은 <b>찬성한다는 듯</b> 고개를 끄덕여요. = 지문의 동의하며 끄덕였다예요. 반대한 게 아니에요.</div></div><div class=\"rds\" data-ord=\"22\"><span class=\"rn\">22번</span><div class=\"rc\"><div class=\"e\">Mrs. McLeod also nodded</div><div class=\"k\">McLeod 부인도 고개를 끄덕였다</div></div><div class=\"rc\"><div class=\"e\">toward her daughter.</div><div class=\"k\">그녀(= McLeod 부인)의 딸을 향해</div></div><div class=\"rnat\">(D)(5) McLeod 부인도 그녀의 딸을 향해 고개를 끄덕였다.</div><div class=\"rst\">엄마도 딸 메리를 향해 “가도 된단다” 하듯 고개를 끄덕여요.</div></div><div class=\"rds\" data-ord=\"23\"><span class=\"rn\">23번</span><div class=\"rc\"><div class=\"e\">Young Mary was very excited.</div><div class=\"k\">어린 Mary는 매우 신이 났다</div></div><div class=\"rnat\">(D)(6) 어린 Mary는 매우 신이 났다.</div><div class=\"rst\">어린 메리는 너무 신이 나요. 그렇게 바라던 학교가 생긴 거예요.</div></div><div class=\"rds\" data-ord=\"24\"><span class=\"rn\">24번</span><div class=\"rc\"><div class=\"e\">“I’m gonna read?</div><div class=\"k\">“제가 읽게 될 거라고요?</div></div><div class=\"rc\"><div class=\"e\">Miss Wilson?”</div><div class=\"k\">Wilson 선생님?”</div></div><div class=\"rnat\">(D)(7) “제가 읽게 될 거라고요? Wilson 선생님?”</div><div class=\"rst\">“제가 글을 읽게 되는 거예요, 선생님?” 하고 묻는 메리. 16번의 결심이 이뤄지는 순간이에요.</div></div><div class=\"rds\" data-ord=\"25\"><span class=\"rn\">25번</span><div class=\"rc\"><div class=\"e\">She smiled at Mary.</div><div class=\"k\">그녀(= Wilson)는 Mary를 보고 미소 지었다</div></div><div class=\"rnat\">(D)(8) 그녀는 Mary를 보고 미소 지었다.</div><div class=\"rst\">윌슨 선생님은 메리를 보며 미소 지어요. = 지문의 마지막 장면, 그렇다는 대답이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"go along\" data-m=\"따라가다\"><b>go along</b>따라가다</button><button type=\"button\" class=\"wdb\" data-w=\"wander over to\" data-m=\"~쪽으로 걸어가다\"><b>wander over to</b>~쪽으로 걸어가다</button><button type=\"button\" class=\"wdb\" data-w=\"in awe\" data-m=\"경외감을 느끼며\"><b>in awe</b>경외감을 느끼며</button><button type=\"button\" class=\"wdb\" data-w=\"wonder\" data-m=\"궁금해하다\"><b>wonder</b>궁금해하다</button><button type=\"button\" class=\"wdb\" data-w=\"decide to\" data-m=\"~하기로 결심하다\"><b>decide to</b>~하기로 결심하다</button><button type=\"button\" class=\"wdb\" data-w=\"explain\" data-m=\"설명하다\"><b>explain</b>설명하다</button></div>", "12": "<p class=\"mtr\">마더텅 정답률 <b>60%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">장문 불일치는 선택지가 <b>이야기 순서대로</b> 나와요. 문단을 따라가며 대조하고, ⑤처럼 <b>찬성/반대</b>를 뒤집은 동사에 주의하세요.</p><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>① ↔ 1번</em>her nine-year-old daughter Mary went along(9살 딸 메리가 따라갔다) → 같음</span><span><em>② ↔ 5번</em>Two white girls(백인 소녀 둘)가 a lot of dolls(수많은 인형들) 사이에 앉아 있었다 → 같음</span><span><em>③ ↔ 17번</em>asked her father to let her go to school(학교에 가게 해 달라고 아빠에게 부탁했다) → 같음</span><span><em>④ ↔ 12번</em>Put that down(그거 내려놔)이라고 yelled(소리쳤다) → 같음</span></div><div class=\"ck-eq\">⇒ 네 개는 지문과 같아요. 남은 ⑤를 21번과 대조해요</div></div><div class=\"ck-via\"><i>▼</i><span>⑤의 ‘엠마 윌슨이 열 학교’를 찾아요</span></div><div class=\"ck-step\"><span class=\"lab\">19번 · 학교 제안</span><div class=\"en\">Emma Wilson came to the McLeod cabin, explaining that (e) she would <mark>open a new school</mark> in Mayesville for black children.</div><p class=\"ko\">Emma Wilson은 오두막에 와서 그녀가 흑인 아이들을 위한 <mark>새로운 학교를 열 것이라고</mark> 설명했다.</p></div><div class=\"ck-via\"><i>▼</i><span>그 제안에 부모님의 반응은?</span></div><div class=\"ck-step key\"><span class=\"lab\">21번 · 결정적 단서</span><div class=\"en\">Mary’s parents <mark>nodded in agreement</mark>.</div><p class=\"ko\">Mary의 부모님은 <mark>동의하며 고개를 끄덕였다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">Emma Wilson이 열 학교에 가는 것을 부모님이 반대했다.<small>21번: 부모님은 nodded in agreement(동의하며 고개를 끄덕였다), 반대가 아니라 찬성이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">아버지에게 학교에 다니게 해달라고 요청했다.</span><span class=\"why\">17번에서 아빠가 “학교가 없단다”라고 거절해서 틀렸다고 착각하기 쉬워요. 하지만 선택지는 ‘요청했다’까지만 말하니 asked her father(아빠에게 부탁했다)와 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">어머니를 따라 Ben Wilson의 집에 갔다.</span><span class=\"why\">1번에서 엄마가 이전 주인 Ben Wilson(벤 윌슨)의 집에 옷을 가져갈 때 went along(따라갔다)이라고 했어요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">많은 인형 사이에 앉아 있는 백인 소녀 두 명을 봤다.</span><span class=\"why\">4·5번에서 놀이집 안을 들여다보니 Two white girls(2명의 백인 소녀)가 a lot of dolls(수많은 인형들) 사이에 앉아 있었어요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">책을 내려놓으라는 고함 소리를 들었다.</span><span class=\"why\">11·12번에서 백인 소녀가 책을 잡아채며 Put that down(그것을 내려놔)이라고 yelled(소리쳤다) 했어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">When Patsy McLeod took freshly washed clothes</div><div class=\"k\">Patsy McLeod가 갓 세탁한 옷을 가져갔을 때</div></div><div class=\"rc\"><div class=\"e\">to her former master Ben Wilson’s house,</div><div class=\"k\">그녀(= Patsy)의 이전 주인인 Ben Wilson의 집에</div></div><div class=\"rc\"><div class=\"e\">her nine-year-old daughter Mary went along.</div><div class=\"k\">그녀(= Patsy)의 9살 난 딸 Mary가 따라갔다</div></div><div class=\"rnat\">(A)(1) Patsy McLeod가 갓 세탁한 옷을 그녀의 이전 주인인 Ben Wilson의 집에 가져갔을 때 그녀의 9살 난 딸 Mary가 따라갔다.</div><div class=\"rst\">엄마 심부름을 따라 예전에 엄마가 일하던 큰 집에 가는 아홉 살 메리를 떠올려요. = 지문의 빨래를 갖다주러 따라간 장면이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">When they arrived at the big house,</div><div class=\"k\">그들(= Patsy와 Mary)이 그 큰 집에 도착했을 때</div></div><div class=\"rc\"><div class=\"e\">the McLeods walked to the rear entrance</div><div class=\"k\">McLeods는 뒤쪽 출입구로 걸어갔다</div></div><div class=\"rc\"><div class=\"e\">used for blacks.</div><div class=\"k\">흑인들을 위해 사용되는(흑인들이 이용하는)</div></div><div class=\"rnat\">(A)(2) 그들이 그 큰 집에 도착했을 때 McLeods는 흑인들을 위해 사용되는(흑인들이 이용하는) 뒤쪽 출입구로 걸어갔다.</div><div class=\"rst\">큰 집에 도착하자 둘은 앞문이 아니라 흑인용 <b>뒷문</b>으로 가요. = 지문의 뒤쪽 출입구예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">In 1884 there was sharp segregation</div><div class=\"k\">1884년에 뚜렷한(심한) 분리정책이 있었다</div></div><div class=\"rc\"><div class=\"e\">between the races</div><div class=\"k\">인종 간의</div></div><div class=\"rc\"><div class=\"e\">in Mayesville, South Carolina.</div><div class=\"k\">South Carolina주의 Mayesville에서는</div></div><div class=\"rnat\">(A)(3) 1884년에, South Carolina(사우스캐롤라이나)주의 Mayesville(메이스빌)에서는 뚜렷한(심한) 인종 간 분리정책이 있었다.</div><div class=\"rst\">그 시절 그 동네는 피부색에 따라 사람을 갈라놓는 규칙이 심했어요. = 지문의 1884년 인종 <b>분리정책</b>이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">While (a) her mother went inside the house,</div><div class=\"k\">(a)그녀(Mary)의 엄마가 집 안에 들어가 있는 동안</div></div><div class=\"rc\"><div class=\"e\">Mary wandered over</div><div class=\"k\">Mary는 돌아다녔고(걸어갔고)</div></div><div class=\"rc\"><div class=\"e\">to a children’s playhouse</div><div class=\"k\">아이들의 장난감 집 쪽으로</div></div><div class=\"rc\"><div class=\"e\">and looked inside.</div><div class=\"k\">안을 살펴보았다</div></div><div class=\"rnat\">(A)(4) (a)그녀(Mary)의 엄마가 집 안에 들어가 있는 동안 Mary는 아이들의 장난감 집 쪽으로 돌아다녔고(걸어갔고) 안을 살펴보았다.</div><div class=\"rst\">엄마가 집 안에 들어간 사이, 메리는 아이들 장난감 집을 기웃거려요. 여기서 그녀의(her) 엄마 = 메리의 엄마예요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Two white girls about her age</div><div class=\"k\">그녀(= Mary)의 나이쯤 되는 2명의 백인 소녀가</div></div><div class=\"rc\"><div class=\"e\">sat among a lot of dolls.</div><div class=\"k\">수많은 인형들 사이에 앉아 있었다</div></div><div class=\"rnat\">(A)(5) 대략 그녀의 나이인(또래인) 2명의 백인 소녀가 수많은 인형들 사이에 앉아 있었다.</div><div class=\"rst\">안에는 메리 또래 <b>백인 소녀 두 명</b>이 인형들 사이에 앉아 있어요. = 지문 5번, 선택지 ②와 같은 장면이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">“Hello, Mary! Do you want to come in?”</div><div class=\"k\">“안녕, Mary! 들어오고 싶니?”라고</div></div><div class=\"rc\"><div class=\"e\">one of them called out.</div><div class=\"k\">그들(= 두 백인 소녀) 중 한 명이 외쳤다</div></div><div class=\"rnat\">(C)(1) “안녕, Mary! 들어오고 싶니?”라고 그들 중 한 명이 외쳤다.</div><div class=\"rst\">그중 <b>한 명</b>이 “메리, 들어올래?” 하고 불러요. = 지문의 그들 중 한 명, 곧 5번의 두 소녀 중 하나예요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Mary happily went into the playhouse.</div><div class=\"k\">Mary는 기쁘게 장난감 집 안으로 들어갔다</div></div><div class=\"rnat\">(C)(2) Mary는 기쁘게 장난감 집 안으로 들어갔다.</div><div class=\"rst\">친구 집 놀이방에 초대받은 것처럼 메리는 신나서 들어가요. = 지문의 기쁘게 들어갔다예요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">The white child handed a doll</div><div class=\"k\">백인 아이는 인형을 건네주었다</div></div><div class=\"rc\"><div class=\"e\">to the black girl,</div><div class=\"k\">흑인 소녀에게</div></div><div class=\"rc\"><div class=\"e\">saying “You can watch the baby</div><div class=\"k\">“너는 아이를 봐도 돼”라고 말하며</div></div><div class=\"rc\"><div class=\"e\">while I have tea with my friend.”</div><div class=\"k\">내가 친구와 차를 마시는 동안</div></div><div class=\"rnat\">(C)(3) 백인 아이는 “내가 친구와 차를 마시는 동안 너는 아이를 봐도 돼.”라고 말하며 흑인 소녀에게 인형을 건네주었다.</div><div class=\"rst\">백인 아이는 “나 친구랑 차 마시는 동안 너는 아기 봐” 하며 인형을 건네요. 메리는 놀이에서도 돌보는 역할만 맡아요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">While Mary walked the doll around the room,</div><div class=\"k\">Mary가 방에서 그 인형을 산책시키는 동안</div></div><div class=\"rc\"><div class=\"e\">her eyes fell upon a book;</div><div class=\"k\">그녀(= Mary)의 시선이 한 책에 쏠렸고</div></div><div class=\"rc\"><div class=\"e\">(d) she picked it up in awe.</div><div class=\"k\">(d)그녀(Mary)는 경외감으로(경외감을 느끼며) 그것(= 책)을 집어 들었다</div></div><div class=\"rnat\">(C)(4) Mary가 방에서 그 인형을 산책시키는 동안 그녀의 시선이 한 책에 쏠렸고 (d)그녀(Mary)는 경외감으로(경외감을 느끼며) 그것을 집어 들었다.</div><div class=\"rst\">인형을 안고 걷다가 메리 눈에 책 한 권이 들어와요. 귀한 보물을 보듯 조심스레 집어 들어요. = 지문의 경외감이에요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">Her parents had a Bible in their cabin,</div><div class=\"k\">그녀(= Mary)의 부모님은 오두막에 성경을 가지고 있었지만</div></div><div class=\"rc\"><div class=\"e\">but no one could read it.</div><div class=\"k\">아무도 그것(= 성경)을 읽을 수 없었다</div></div><div class=\"rnat\">(C)(5) 그녀의 부모님은 오두막에 성경을 가지고 있었지만 아무도 그것을 읽을 수 없었다.</div><div class=\"rst\">메리네 오두막에도 성경책이 있었지만 집에서 아무도 못 읽었어요. 그래서 책이 더 신기했던 거예요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">Unexpectedly</div><div class=\"k\">갑자기</div></div><div class=\"rc\"><div class=\"e\">the white girl grabbed the book.</div><div class=\"k\">백인 소녀가 그 책을 잡아챘다</div></div><div class=\"rnat\">(C)(6) 갑자기 백인 소녀가 그 책을 잡아챘다.</div><div class=\"rst\">갑자기 백인 소녀가 책을 확 낚아채요. = 지문의 예상 못 한 순간이에요.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><div class=\"rc\"><div class=\"e\">“Put that down!”</div><div class=\"k\">“그것을 내려놔!”</div></div><div class=\"rc\"><div class=\"e\">she yelled.</div><div class=\"k\">라며 그녀(= 백인 소녀)가 소리쳤다</div></div><div class=\"rnat\">(C)(7) “그것을 내려놔!”라며 그녀가 소리쳤다.</div><div class=\"rst\">“그거 내려놔!” 하고 소리를 질러요. = 지문의 고함이에요.</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">13번</span><div class=\"rc\"><div class=\"e\">“You don’t know how to read.”</div><div class=\"k\">“너는 읽는 법을 모르잖아.”</div></div><div class=\"rnat\">(C)(8) “너는 읽는 법을 모르잖아.”</div><div class=\"rst\">“넌 읽을 줄도 모르잖아.” 친구들 앞에서 놀림받은 것처럼 아픈 말이에요. = 지문 13번, 이 말이 다음 줄의 창피함으로 이어져요.</div></div><div class=\"rds\" data-ord=\"14\"><span class=\"rn\">14번</span><div class=\"rc\"><div class=\"e\">Feeling shameful,</div><div class=\"k\">창피해 하면서</div></div><div class=\"rc\"><div class=\"e\">Mary handed the doll back to the white child</div><div class=\"k\">Mary는 인형을 백인 아이에게 돌려주었고</div></div><div class=\"rc\"><div class=\"e\">and rejoined her mother.</div><div class=\"k\">그녀(= Mary)의 엄마와 재회했다</div></div><div class=\"rnat\">(B)(1) 창피해 하면서, Mary는 인형을 백인 아이에게 돌려주었고 그녀의 엄마와 재회했다.</div><div class=\"rst\"><b>창피해진</b> 메리는 인형을 돌려주고 엄마에게 돌아가요. = 지문 14번, 책을 빼앗기고 망신당한 결과예요.</div></div><div class=\"rds\" data-ord=\"15\"><span class=\"rn\">15번</span><div class=\"rc\"><div class=\"e\">On the walk back to their farm,</div><div class=\"k\">그들의 농장으로 걸어 돌아가는 길에</div></div><div class=\"rc\"><div class=\"e\">(b) she wondered</div><div class=\"k\">(b)그녀(Mary)는 궁금했다</div></div><div class=\"rc\"><div class=\"e\">why white people had all kinds of nice things</div><div class=\"k\">왜 백인들은 모든 종류의 좋은 것들을 가지고 있는지</div></div><div class=\"rc\"><div class=\"e\">and why, above all,</div><div class=\"k\">그리고 무엇보다도 왜</div></div><div class=\"rc\"><div class=\"e\">they could read while black people couldn’t.</div><div class=\"k\">흑인들은 읽을 수 없는데 반해 그들(= 백인)은 읽을 수 있는지</div></div><div class=\"rnat\">(B)(2) 그들의 농장으로 걸어 돌아가는 길에 (b)그녀(Mary)는 왜 백인들은 모든 종류의 좋은 것들을 가지고 있는지 그리고 무엇보다도, 흑인들은 읽을 수 없는데 반해 왜 그들(백인)은 읽을 수 있는지 궁금했다.</div><div class=\"rst\">집에 걸어가며 메리는 생각해요. “왜 백인들은 좋은 걸 다 갖고, 무엇보다 왜 우리만 글을 못 읽지?”</div></div><div class=\"rds\" data-ord=\"16\"><span class=\"rn\">16번</span><div class=\"rc\"><div class=\"e\">(c) She decided</div><div class=\"k\">(c)그녀(Mary)는 결심했다</div></div><div class=\"rc\"><div class=\"e\">to learn to read.</div><div class=\"k\">읽는 것을 배우기로</div></div><div class=\"rnat\">(B)(3) (c)그녀(Mary)는 읽는 것을 배우기로 결심했다.</div><div class=\"rst\">그래서 메리는 꼭 <b>글 읽는 법을 배우기로</b> 마음먹어요. = 지문의 결심이에요.</div></div><div class=\"rds\" data-ord=\"17\"><span class=\"rn\">17번</span><div class=\"rc\"><div class=\"e\">At home the little girl asked her father</div><div class=\"k\">집에서 작은 소녀(= Mary)는 그녀의 아빠에게 부탁했고</div></div><div class=\"rc\"><div class=\"e\">to let her go to school,</div><div class=\"k\">그녀(= Mary)가 학교에 가게 해달라고</div></div><div class=\"rc\"><div class=\"e\">but he told her calmly,</div><div class=\"k\">하지만 그(= 아빠)는 그녀(= Mary)에게 조용히 말했다</div></div><div class=\"rc\"><div class=\"e\">“There isn’t any school.”</div><div class=\"k\">“학교가 없단다.”라고</div></div><div class=\"rnat\">(B)(4) 집에서 작은 소녀는 아빠에게 학교에 가게 해달라고 부탁했지만, 그는 그녀에게 “학교가 없단다.”라고 조용히 말했다.</div><div class=\"rst\">집에서 아빠에게 학교 보내 달라고 하지만, 아빠는 조용히 “<b>학교가 없단다</b>” 해요. 이 말이 18번의 that(그것)이 돼요.</div></div><div class=\"rds\" data-ord=\"18\"><span class=\"rn\">18번</span><div class=\"rc\"><div class=\"e\">One day, however,</div><div class=\"k\">하지만 어느 날</div></div><div class=\"rc\"><div class=\"e\">a black woman in city clothes</div><div class=\"k\">도시의 옷을 입은 한 흑인 여성이</div></div><div class=\"rc\"><div class=\"e\">changed that.</div><div class=\"k\">그것을 바꾸었다</div></div><div class=\"rnat\">(D)(1) 하지만 어느 날 도시의 옷을 입은 한 흑인 여성이 그것을 바꾸었다.</div><div class=\"rst\"><b>그런데</b> 어느 날, 도시 옷차림의 한 흑인 여성이 <b>그것을 바꿔요</b>. that(그것) = 학교가 없다는 상황이에요.</div></div><div class=\"rds\" data-ord=\"19\"><span class=\"rn\">19번</span><div class=\"rc\"><div class=\"e\">Emma Wilson came to the McLeod cabin,</div><div class=\"k\">Emma Wilson은 McLeod의 오두막에 와서</div></div><div class=\"rc ckc\"><div class=\"e\">explaining that (e) she would <span class=\"cw\">open a new school</span></div><div class=\"k\">(e)그녀(Wilson)가 <span class=\"cw\">새로운 학교를 열 것이라고</span> 설명했다</div></div><div class=\"rc\"><div class=\"e\">in Mayesville for black children.</div><div class=\"k\">Mayesville에 흑인 아이들을 위한</div></div><div class=\"rnat\">(D)(2) Emma Wilson은 McLeod의 오두막에 와서 (e)그녀(Wilson)가 Mayesville(메이스빌)에 흑인 아이들을 위한 새로운 학교를 열 것이라고 설명했다.</div><div class=\"rst\">윌슨 선생님이 메리네 오두막에 와서 흑인 아이들을 위한 새 학교를 열겠다고 설명해요. 여기서 그녀 = 윌슨 선생님이에요.</div></div><div class=\"rds\" data-ord=\"20\"><span class=\"rn\">20번</span><div class=\"rc\"><div class=\"e\">“ pan class=\"rn\">25번</span><div class=\"rc\"><div class=\"e\">She smiled at Mary.</div><div class=\"k\">그녀(= Wilson)는 Mary를 보고 미소 지었다</div></div><div class=\"rnat\">(D)(8) 그녀는 Mary를 보고 미소 지었다.</div><div class=\"rst\">윌슨 선생님은 메리를 보며 미소 지어요. = 지문의 마지막 장면, 그렇다는 대답이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"go along\" data-m=\"따라가다\"><b>go along</b>따라가다</button><button type=\"button\" class=\"wdb\" data-w=\"rear entrance\" data-m=\"뒤쪽 출입구\"><b>rear entrance</b>뒤쪽 출입구</button><button type=\"button\" class=\"wdb\" data-w=\"sharp\" data-m=\"뚜렷한, 심한\"><b>sharp</b>뚜렷한, 심한</button><button type=\"button\" class=\"wdb\" data-w=\"yell\" data-m=\"소리치다\"><b>yell</b>소리치다</button><button type=\"button\" class=\"wdb\" data-w=\"nod in agreement\" data-m=\"동의하며 고개를 끄덕이다\"><b>nod in agreement</b>동의하며 고개를 끄덕이다</button><button type=\"button\" class=\"wdb\" data-w=\"cotton-picking season\" data-m=\"목화 수확철\"><b>cotton-picking season</b>목화 수확철</button></div>"};

  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
  mmInit();
}
/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(S.sub&&!S.mmS){S.mmS=1;S.mmP=1;save();WN.hw(lv,day,S.sub.s+'/'+N+(S.mmD?' ✓':''));}else if(!S.sub&&!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
