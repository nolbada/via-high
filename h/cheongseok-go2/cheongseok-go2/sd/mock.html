들에게 점점 더 중요한 윤리적 고려 사항이 되어 왔다."}, {"en": "As global awareness of social, environmental, and sustainability issues grows, many content creators are being called upon to consider the broader impact of their work.", "ko": "사회·환경·지속 가능성 문제에 대한 전 세계적인 인식이 커지면서, 많은 콘텐츠 제작자들은 자기 작업이 미치는 더 폭넓은 영향을 고려하라는 요구를 받고 있다."}, {"en": "This includes addressing topics such as climate change, social justice, and ethical consumerism in their content.", "ko": "이것은 자신의 콘텐츠에서 기후 변화, 사회 정의, 윤리적 소비주의 같은 주제를 다루는 것을 포함한다."}, {"en": "Content creators have a platform that can influence their audience’s attitudes and behaviors, and they have a responsibility to use that platform for positive change.", "ko": "콘텐츠 제작자들은 청중의 태도와 행동에 영향을 줄 수 있는 플랫폼을 가지고 있으며, 그 플랫폼을 긍정적인 변화를 위해 사용할 책임이 있다."}, {"en": "For example, promoting environmentally sustainable products or supporting causes related to equality and justice can help raise awareness and drive meaningful social impact.", "ko": "예를 들어, 환경적으로 지속 가능한 제품을 홍보하거나 평등과 정의에 관련된 대의를 지지하는 것은 인식을 높이고 의미 있는 사회적 영향을 이끌어 내는 데 도움이 될 수 있다."}, {"en": "Ethical content creators not only focus on promoting their products or services but also consider the values and causes they support, ensuring that their content aligns with their social and environmental principles.", "ko": "윤리적인 콘텐츠 제작자들은 자신의 제품이나 서비스를 홍보하는 데만 초점을 맞추지 않고 자신이 지지하는 가치와 대의도 고려하여, 자신의 콘텐츠가 사회적·환경적 원칙과 일치하도록 한다."}], "chunks": [[0, 1], [2, 2], [3, 4], [5, 5]], "ex": [{"head": "Social and environmental responsibility has", "clue": ["Social and environmental responsibility", "increasingly important"], "core": "사회·환경적 책임이 제작자에게 점점 더 중요해짐", "why": "글의 출발: 콘텐츠 제작자의 '사회·환경적 책임'이라는 주제"}, {"head": "As global awareness of social,", "clue": ["As global awareness", "grows", "the broader impact of their work"], "core": "세계적 관심이 커지면서 제작자도 작품의 영향을 생각하라는 요구를 받음", "why": "As ~ grows(~이 커지면서) = 앞 문장 increasingly(점점 더)의 이유"}, {"head": "This includes addressing topics such", "clue": ["This includes", "climate change, social justice, and ethical consumerism"], "core": "기후 변화·사회 정의·윤리적 소비 같은 주제를 다루는 일 포함", "why": "This(이것) = 바로 앞 '작품의 더 폭넓은 영향을 고려하는 일' → 그 내용을 구체적 주제로 풀어 줌"}, {"head": "Content creators have a platform", "clue": ["a platform", "use that platform for positive change"], "core": "제작자의 플랫폼은 청중을 움직이니 좋은 변화에 쓸 책임", "why": "다룰 주제(앞 문장) 다음 → 왜 그래야 하는지: 청중에게 영향을 주는 플랫폼이 있음"}, {"head": "For example, promoting environmentally sustainable", "clue": ["For example", "promoting environmentally sustainable products"], "core": "예: 친환경 제품 홍보, 평등·정의 지지 → 인식 높이고 사회적 영향", "why": "For example(예를 들어) → 바로 앞 '긍정적인 변화(positive change)'의 구체적 예"}, {"head": "Ethical content creators not only", "clue": ["not only focus on promoting their products", "but also consider the values"], "core": "윤리적 제작자는 제품 홍보만이 아니라 가치·원칙까지 맞춤", "why": "앞 예의 promoting(홍보)을 받아 '홍보만 하지 않고 가치도' → 글 전체 결론"}], "postit": "사회·환경적 책임 중요 → 인식 커지며 영향 고려 요구 → 다룰 주제 → 플랫폼의 책임 → 예: 친환경 홍보 → 결론: 홍보만 말고 가치와 일치", "cex": [{"core": "콘텐츠 제작자에게 커지는 사회·환경적 책임", "why": "글의 출발: 제작자의 사회·환경적 책임 주제 → As ~ grows(~이 커지면서)로 이유 제시"}, {"core": "기후 변화·사회 정의·윤리적 소비 같은 주제 다루기", "why": "This(이것) = 앞의 '작품의 더 폭넓은 영향 고려' → 구체적 주제로 풀어 줌"}, {"core": "청중을 움직이는 플랫폼을 좋은 변화에 쓸 책임", "why": "다룰 주제 다음 → have a platform(플랫폼이 있음)으로 이유, For example(예를 들어)로 친환경 홍보"}, {"core": "윤리적 제작자: 홍보만 X, 가치·원칙까지 맞춤", "why": "앞 예의 promoting(홍보)을 받아 not only ~ but also(~뿐 아니라 ~도) → 글 전체 결론"}]}, {"id": "mock_2610_g2-23", "label": "26년 10월 23번 문어 다리의 신경과 빨판", "sents": [{"en": "Research on cephalopod neurobiology suggests that an octopus possesses roughly five hundred million neurons.", "ko": "두족류 신경 생물학 연구는 문어가 약 5억 개의 뉴런을 가지고 있다는 것을 시사한다."}, {"en": "What makes this system unusual is where many of those neurons are located.", "ko": "이 체계를 특이하게 만드는 것은 그 뉴런들 중 다수가 어디에 있느냐이다."}, {"en": "More than half are distributed throughout the arms rather than concentrated entirely in the central brain.", "ko": "절반 이상이 중앙의 뇌에 전부 모여 있지 않고 다리 전체에 걸쳐 퍼져 있다."}, {"en": "Each arm contains networks of nerve cells capable of controlling complex movements and responding to sensory input locally.", "ko": "각 다리에는 복잡한 움직임을 통제하고 감각 입력에 그 자리에서 반응할 수 있는 신경 세포 네트워크가 있다."}, {"en": "This means that many actions do not require detailed instructions from the brain itself.", "ko": "이것은 많은 행동이 뇌 자체로부터 상세한 지시를 받을 필요가 없다는 뜻이다."}, {"en": "Instead, the arms function as highly capable extensions of the nervous system that interact with the environment directly.", "ko": "대신, 다리들은 환경과 직접 상호 작용하는 매우 유능한 신경계의 연장선으로 작동한다."}, {"en": "The suckers lining each arm play an important role in this process.", "ko": "각 다리를 따라 늘어선 빨판들은 이 과정에서 중요한 역할을 한다."}, {"en": "These structures provide strong grip but also detect chemical signals on surfaces they contact.", "ko": "이 구조들은 강하게 붙잡는 힘을 제공할 뿐 아니라, 접촉하는 표면의 화학적 신호도 감지한다."}, {"en": "Marine biologists studying octopus behavior have shown that this allows the animal to gather chemical information through touch.", "ko": "문어의 행동을 연구하는 해양 생물학자들은 이것 덕분에 문어가 접촉을 통해 화학 정보를 모을 수 있다는 것을 보여 주었다."}, {"en": "In practical terms, an octopus can effectively taste what it touches.", "ko": "실질적으로 말해, 문어는 사실상 자기가 만지는 것을 맛볼 수 있다."}], "chunks": [[0, 1], [2, 3], [4, 5], [6, 8], [9, 9]], "ex": [{"head": "Research on cephalopod neurobiology suggests", "clue": ["five hundred million neurons"], "core": "문어의 뉴런은 약 5억 개", "why": "글의 출발: 문어의 뉴런(신경 세포) 수"}, {"head": "What makes this system unusual", "clue": ["this system", "where many of those neurons are located"], "core": "특이한 점은 그 뉴런들이 '어디에' 있느냐", "why": "this system·those neurons(그 뉴런들) = 앞 문장의 5억 개 뉴런"}, {"head": "More than half are distributed", "clue": ["More than half", "throughout the arms"], "core": "절반 넘게가 뇌가 아니라 다리에 퍼져 있음", "why": "앞 문장의 질문 '어디에 있나?'에 대한 답 → 바로 다음"}, {"head": "Each arm contains networks of", "clue": ["Each arm", "locally"], "core": "다리마다 움직임을 스스로 조절하는 신경망", "why": "the arms(다리들) 얘기를 이어 '다리 하나하나'로 자세히"}, {"head": "This means that many actions", "clue": ["This means", "do not require detailed instructions from the brain"], "core": "그래서 많은 행동이 뇌의 지시 없이 이루어짐", "why": "This(이것) = 다리마다 신경망이 있다는 앞 문장 → 그 결과"}, {"head": "Instead, the arms function as", "clue": ["Instead", "interact with the environment directly"], "core": "대신 다리가 환경과 직접 주고받는 신경계의 연장선", "why": "Instead(대신에) → 앞의 '뇌 지시가 필요 없음' 대신 다리가 직접 함"}, {"head": "The suckers lining each arm", "clue": ["The suckers", "in this process"], "core": "다리의 빨판이 이 과정에서 중요한 역할", "why": "this process(이 과정) = 다리가 환경과 직접 상호 작용하는 과정 → 앞 문장 다음"}, {"head": "These structures provide strong grip", "clue": ["These structures", "detect chemical signals"], "core": "빨판은 꽉 잡기도 하고 화학 신호도 감지", "why": "These structures(이 구조들) = 바로 앞 빨판(suckers)"}, {"head": "Marine biologists studying octopus behavior", "clue": ["this allows", "through touch"], "core": "이 덕분에 만지면서 화학 정보를 모음", "why": "this(이것) = 빨판이 화학 신호를 감지하는 일 → 앞 문장 다음"}, {"head": "In practical terms, an octopus", "clue": ["In practical terms", "taste what it touches"], "core": "결국 문어는 만지는 것을 맛봄", "why": "In practical terms(실질적으로 말해) → '만져서 화학 정보 수집'을 '맛본다'로 쉽게 정리"}], "postit": "뉴런 5억 개 → 어디 있나? → 절반 넘게 다리 → 뇌 지시 없이 다리가 직접 → 빨판이 이 과정에서 → 화학 신호 감지 → 만지면 맛봄", "cex": [{"core": "문어 뉴런 5억 개, 특이한 건 그 위치", "why": "글의 출발: 문어 뉴런 수 → those neurons(그 뉴런들)로 '어디에 있나?' 질문 예고"}, {"core": "뉴런 절반 이상이 다리에, 다리마다 신경망", "why": "앞의 '어디에 있나?'에 대한 답 → throughout the arms(다리 전체에) 퍼져 있음"}, {"core": "뇌 지시 없이 다리가 환경과 직접 상호 작용", "why": "This(이것) = 다리마다 신경망이 있다는 앞 내용 → Instead(대신)로 다리가 직접 함"}, {"core": "빨판은 꽉 잡고 화학 신호도 감지", "why": "this process(이 과정) = 다리가 환경과 직접 상호 작용하는 과정 → The suckers(빨판)의 역할"}, {"core": "결국 문어는 만지는 것을 맛봄", "why": "In practical terms(실질적으로 말해) → '만져서 화학 정보 수집'을 '맛본다'로 쉽게 정리"}]}, {"id": "mock_2610_g2-24", "label": "26년 10월 24번 아리스토텔레스 사상의 시대적 한계", "sents": [{"en": "Consistent though he may be, some of Aristotle’s ideas meet us today as strange.", "ko": "비록 아리스토텔레스가 일관적이라 해도, 그의 생각 중 일부는 오늘날 우리에게 낯설게 다가온다."}, {"en": "He had no difficulty justifying slavery, for example, and in his era, philosophers enjoyed positions of high privilege and influence.", "ko": "예를 들어, 그는 노예 제도를 정당화하는 데 아무런 어려움이 없었고, 그의 시대에 철학자들은 높은 특권과 영향력이 있는 지위를 누렸다."}, {"en": "Because of their practice of contemplation for the highest human good, philosophers were considered worthy to have all the best things in life.", "ko": "인간의 최고선에 대해 사유하는 일을 한다는 이유로, 철학자들은 삶의 모든 좋은 것을 가질 자격이 있다고 여겨졌다."}, {"en": "Somehow that assertion seems oddly self-serving.", "ko": "어쩐지 그 주장은 이상하게도 자기 잇속만 차리는 것처럼 보인다."}, {"en": "It serves us to remember that every great thinker is of her own time and speaks to a particular audience, and certainly Aristotle is no exception.", "ko": "모든 위대한 사상가는 자기 시대에 속해 있고 특정한 청중에게 말한다는 것을 기억해 두는 것이 우리에게 도움이 되며, 아리스토텔레스도 분명 예외가 아니다."}, {"en": "Human flourishing as he understood it probably would not be nearly as inclusive as we would want it to be today.", "ko": "그가 이해한 인간 번영은 아마 오늘날 우리가 원하는 만큼 포용적이지는 않을 것이다."}, {"en": "How he understood right and good is best taken to be an indicator of how the privileged elite of ancient Greek society tended to understand right and good.", "ko": "그가 옳음과 선을 어떻게 이해했는지는 고대 그리스 사회의 특권 엘리트층이 옳음과 선을 어떻게 이해하는 경향이 있었는지를 보여 주는 지표로 보는 것이 가장 좋다."}, {"en": "As a result, for all it does well, it is also deeply flawed.", "ko": "그 결과, 그것은 잘하는 점이 많음에도 불구하고 심각한 결함도 있다."}], "chunks": [[0, 0], [1, 1], [2, 3], [4, 6], [7, 7]], "ex": [{"head": "Consistent though he may be,", "clue": ["some of Aristotle’s ideas", "strange"], "core": "아리스토텔레스의 일부 생각은 오늘날 낯섦", "why": "글의 출발: 아리스토텔레스 생각 중 '낯선' 것이 있다는 주제"}, {"head": "He had no difficulty justifying", "clue": ["for example", "justifying slavery", "philosophers enjoyed positions of high privilege"], "core": "예: 노예제 정당화, 철학자들의 높은 특권", "why": "for example(예를 들어) → 앞 문장의 '낯선 생각'의 예 → 바로 다음"}, {"head": "Because of their practice of", "clue": ["their practice of contemplation", "considered worthy"], "core": "최고선을 사유한다는 이유로 철학자는 최고의 것을 누릴 자격", "why": "their(그들의) = 앞 문장의 philosophers → 특권을 누린 이유를 설명"}, {"head": "Somehow that assertion seems oddly", "clue": ["that assertion", "self-serving"], "core": "그 주장은 묘하게 자기 잇속 챙기기로 보임", "why": "that assertion(그 주장) = 바로 앞 '철학자는 최고의 것을 누릴 자격' → 앞 문장 없이는 불가"}, {"head": "It serves us to remember", "clue": ["every great thinker is of her own time", "no exception"], "core": "위대한 사상가도 자기 시대 사람, 아리스토텔레스도 예외 아님", "why": "자기 잇속 같은 주장(앞) → 그런 주장이 나온 배경: every great thinker is of her own time(위대한 사상가도 자기 시대 사람)"}, {"head": "Human flourishing as he understood", "clue": ["as he understood it", "not be nearly as inclusive"], "core": "그가 생각한 인간 번영은 오늘날만큼 포용적이지 않음", "why": "'시대의 한계' 원칙(앞) → 아리스토텔레스의 생각에 적용"}, {"head": "How he understood right and", "clue": ["the privileged elite", "right and good"], "core": "그의 옳음·선 = 고대 그리스 특권층의 시각", "why": "앞의 '포용적이지 않음'을 '특권층의 시각'으로 구체화"}, {"head": "As a result, for all", "clue": ["As a result", "deeply flawed"], "core": "그래서 장점에도 불구하고 큰 결점이 있음", "why": "As a result(그 결과) → 특권층의 시각이라는 앞 문장의 결론, it = 그의 옳음·선 이해"}], "postit": "낯선 생각 → 예: 노예제·철학자 특권 → 자격 있다는 주장 → 자기 잇속 → 사상가도 시대의 사람 → 특권층 시각 → 결함", "cex": [{"core": "아리스토텔레스 생각 일부는 오늘날 낯섦", "why": "글의 출발: Consistent though he may be(일관적일지 몰라도) 낯선 생각이 있다는 주제"}, {"core": "예: 노예제 정당화, 철학자의 높은 특권", "why": "for example(예를 들어) → 앞의 '낯선 생각'의 구체적 예"}, {"core": "철학자 특권의 근거는 자기 잇속 챙기기로 보임", "why": "their(그들의) = 앞의 philosophers(철학자들) → 특권 이유 뒤 that assertion(그 주장) 비판"}, {"core": "위대한 사상가도 시대의 한계: 특권층의 시각", "why": "자기 잇속 같은 주장의 배경 → every great thinker is of her own time(사상가도 자기 시대 사람)"}, {"core": "그래서 장점에도 깊은 결점이 있음", "why": "As a result(그 결과) → '특권층의 시각'이라는 앞 내용의 결론으로 마무리"}]}, {"id": "mock_2610_g2-29", "label": "26년 10월 29번 생존이라는 허들 경주", "sents": [{"en": "You might think of survival as a race in which a hurdle has to be jumped every year.", "ko": "여러분은 생존을 매년 허들 하나를 뛰어넘어야 하는 경주라고 생각할 수도 있다."}, {"en": "The early hurdles were once very high, and many people fell before clearing the first few.", "ko": "초기의 허들은 한때 매우 높았고, 많은 사람들이 처음 몇 개를 넘기도 전에 넘어졌다."}, {"en": "Demographically, humankind was living close to a state of nature, and nature is extremely wasteful of life.", "ko": "인구 통계학적으로 인류는 자연 상태에 가깝게 살았는데, 자연은 생명을 극도로 낭비한다."}, {"en": "From only a very small number of figs will even one of many seeds become a fig tree.", "ko": "극소수의 무화과에서만 많은 씨앗 중 단 하나라도 무화과나무가 된다."}, {"en": "Almost a quarter of baboons born in the wild die before they are a year old, which is fairly typical for primates.", "ko": "야생에서 태어난 개코원숭이의 거의 4분의 1이 한 살이 되기 전에 죽는데, 이것은 영장류에게 꽤 전형적인 일이다."}, {"en": "Infant mortality rates for humans in pre-modern agricultural societies were similar to, and sometimes higher than, those of apes.", "ko": "전근대 농업 사회에서 인간의 유아 사망률은 유인원의 유아 사망률과 비슷했고, 때로는 더 높았다."}, {"en": "Things were little better for our hunter-gatherer ancestors, a quarter of whom failed to reach their first birthday, while another quarter didn’t live long enough to reproduce just about everywhere until the nineteenth century.", "ko": "우리의 수렵 채집 조상들도 사정이 별로 나을 게 없었는데, 그들 중 4분의 1은 첫 생일을 맞지 못했고, 19세기까지 거의 모든 곳에서 또 다른 4분의 1은 자손을 낳을 만큼 오래 살지 못했다."}, {"en": "Had it been otherwise, the huge recent growth in human population would have occurred much earlier.", "ko": "만약 그렇지 않았다면, 최근의 엄청난 인구 증가는 훨씬 더 일찍 일어났을 것이다."}], "chunks": [[0, 1], [2, 4], [5, 5], [6, 7]], "ex": [{"head": "You might think of survival", "clue": ["a race", "a hurdle"], "core": "생존 = 매년 허들을 넘는 경주", "why": "글의 출발: 생존을 '허들 경주'에 빗댐"}, {"head": "The early hurdles were once", "clue": ["The early hurdles", "many people fell"], "core": "옛날엔 초반 허들이 높아 많은 사람이 넘어짐", "why": "The early hurdles(초반 허들) = 앞 문장의 a hurdle을 이어받음"}, {"head": "Demographically, humankind was living close", "clue": ["close to a state of nature", "nature is extremely wasteful of life"], "core": "인류는 자연 상태에 가까웠고, 자연은 생명을 엄청 낭비함", "why": "'많이 넘어짐(죽음)'의 이유 → 자연이 생명을 낭비하기 때문"}, {"head": "From only a very small", "clue": ["figs", "one of many seeds"], "core": "무화과 씨앗은 극히 일부만 나무가 됨", "why": "앞의 '생명 낭비'의 식물 예"}, {"head": "Almost a quarter of baboons", "clue": ["baboons", "typical for primates"], "core": "야생 개코원숭이 4분의 1이 한 살 전에 죽음 (영장류는 다 비슷)", "why": "식물 예 다음 동물 예, primates(영장류)로 사람 얘기를 준비"}, {"head": "Infant mortality rates for humans", "clue": ["humans", "similar to", "those of apes"], "core": "옛 농경 사회 아기 사망률도 유인원과 비슷하거나 더 높음", "why": "those of apes(유인원의 것) = 앞의 영장류 사망률 → 영장류 다음에 사람과 비교"}, {"head": "Things were little better for", "clue": ["little better", "our hunter-gatherer ancestors"], "core": "수렵 채집 조상도 4분의 1은 첫 생일 전에 죽는 등 나을 게 없음", "why": "little better(별로 나을 게 없는) → 앞의 '농경 사회도 높은 사망률'과 비교"}, {"head": "Had it been otherwise, the", "clue": ["Had it been otherwise", "much earlier"], "core": "아니었다면 인구 급증이 훨씬 일찍 일어났을 것", "why": "Had it been otherwise(그렇지 않았다면) = 높은 사망률이 아니었다면 → 맨 끝 결론"}], "postit": "생존 = 허들 경주 → 초반 허들 높음 → 자연은 생명 낭비 → 무화과·개코원숭이 → 사람 아기도 비슷 → 수렵 채집인도 → 아니었으면 인구 급증 더 일찍", "cex": [{"core": "생존 = 매년 허들 경주, 옛날엔 초반에 많이 넘어짐", "why": "글의 출발: 생존을 허들 경주에 빗댐 → The early hurdles(초반 허들)로 높았던 옛날"}, {"core": "자연은 생명을 낭비함: 무화과·개코원숭이 예", "why": "'많이 넘어짐(죽음)'의 이유 → nature is wasteful(자연은 낭비적), 식물·동물 예로 영장류까지"}, {"core": "옛 농경 사회 아기 사망률도 유인원 수준", "why": "those of apes(유인원의 것) = 앞의 영장류 사망률 → 영장류 다음 사람과 비교"}, {"core": "수렵 채집 조상도 비슷, 아니었다면 인구 급증이 더 일찍", "why": "little better(별로 나을 게 없는) → 농경 사회와 비교, Had it been otherwise(그렇지 않았다면)로 결론"}]}, {"id": "mock_2610_g2-30", "label": "26년 10월 30번 말보다 믿는 비언어 신호", "sents": [{"en": "A study by Eva McMahan, professor of speech communication, confirmed the dominance of nonverbal signals.", "ko": "발화 의사소통 교수인 Eva McMahan의 한 연구는 비언어적 신호가 우세하다는 것을 확인했다."}, {"en": "The phenomenon, however, was especially pronounced when adults found themselves in situations with conflicting messages (i.e., situations in which the contents of the verbal and nonverbal messages differ).", "ko": "그러나 그 현상은 성인들이 모순된 메시지가 있는 상황, 즉 언어적 메시지와 비언어적 메시지의 내용이 서로 다른 상황에 놓였을 때 특히 두드러졌다."}, {"en": "Attempts to manipulate another person verbally are therefore likely to fail if the accompanying nonverbal communication does not match the spoken message.", "ko": "그러므로 함께 나타나는 비언어적 의사소통이 말로 한 메시지와 맞지 않으면, 다른 사람을 말로 조종하려는 시도는 실패하기 쉽다."}, {"en": "This is because people trust nonverbal messages more than verbal ones.", "ko": "이것은 사람들이 언어적 메시지보다 비언어적 메시지를 더 믿기 때문이다."}, {"en": "When somebody tells you that they enjoy spending time with you, but you notice how they are looking away and are forcing a smile, you are probably less inclined to believe their words.", "ko": "누군가가 여러분과 시간을 보내는 것이 즐겁다고 말하지만 그 사람이 눈길을 돌리고 억지웃음을 짓는 것을 알아차리면, 여러분은 아마 그 말을 덜 믿게 될 것이다."}, {"en": "The same is probably true when you are back at the office after a sickness and your colleague tells you with a displeased expression that they were happy to take over your workload.", "ko": "여러분이 병을 앓고 나서 회사에 돌아왔는데 동료가 언짢은 표정으로 여러분의 일을 기꺼이 맡았다고 말할 때도 아마 마찬가지일 것이다."}, {"en": "You might not believe that they enjoyed replacing you while you were gone.", "ko": "여러분은 아마 여러분이 없는 동안 그들이 여러분을 대신하는 것을 즐겼다는 말을 믿지 않을 것이다."}], "chunks": [[0, 0], [1, 3], [4, 4], [5, 6]], "ex": [{"head": "A study by Eva McMahan,", "clue": ["confirmed", "the dominance of nonverbal signals"], "core": "연구로 확인: 비언어 신호가 더 강함", "why": "글의 출발: 비언어 신호(nonverbal signals)가 우세하다는 연구 결과"}, {"head": "The phenomenon, however, was especially", "clue": ["The phenomenon", "however", "conflicting messages"], "core": "특히 말과 몸짓이 서로 다를 때 뚜렷함", "why": "The phenomenon(그 현상) = 앞 문장의 '비언어 신호의 우세' → 바로 다음"}, {"head": "Attempts to manipulate another person", "clue": ["therefore", "does not match the spoken message"], "core": "그래서 몸짓이 말과 안 맞으면 말로 조종하기는 실패", "why": "therefore(그러므로) → 앞의 '말과 몸짓이 다를 때'를 받아 결과 제시"}, {"head": "This is because people trust", "clue": ["This is because", "nonverbal messages more than verbal ones"], "core": "사람들은 말보다 비언어 메시지를 더 믿기 때문", "why": "This is because(이건 ~ 때문) = 앞 문장 '실패하기 쉽다'의 이유"}, {"head": "When somebody tells you that", "clue": ["looking away", "forcing a smile", "less inclined to believe their words"], "core": "즐겁다면서 눈을 피하고 억지웃음 → 그 말을 덜 믿음", "why": "앞의 '비언어를 더 믿는다'는 일반 원리의 첫 번째 생활 예"}, {"head": "The same is probably true", "clue": ["The same is probably true", "a displeased expression"], "core": "언짢은 얼굴로 일 맡아서 좋았다는 동료도 마찬가지", "why": "The same(같은 일) = 앞 예의 '말과 표정이 달라 못 믿는' 상황 → 두 번째 예"}, {"head": "You might not believe that", "clue": ["they enjoyed replacing you"], "core": "나를 대신해서 즐거웠다는 말을 안 믿음", "why": "they·replacing you(너를 대신함) = 앞 문장의 동료가 네 일을 맡은 것"}], "postit": "비언어 신호 우세 → 말과 몸짓이 다를 때 뚜렷 → 말로 조종 실패 → 비언어를 더 믿음 → 예: 억지웃음 → 같은 예: 언짢은 동료", "cex": [{"core": "연구로 확인된 비언어 신호의 우세", "why": "글의 출발: 비언어 신호(nonverbal signals)가 우세하다는 연구 결과"}, {"core": "말·몸짓이 다르면 비언어를 더 믿어 말로 조종 실패", "why": "The phenomenon(그 현상) = 앞의 '비언어 신호의 우세' → however(그러나)로 특히 뚜렷한 경우"}, {"core": "즐겁다면서 눈 피하고 억지웃음 → 말을 덜 믿음", "why": "앞의 '비언어를 더 믿는다'는 원리의 첫 번째 생활 예 → When somebody tells you(누군가 말할 때)"}, {"core": "언짢은 얼굴로 일 맡아 좋았다는 동료도 못 믿음", "why": "The same(같은 일) = 앞 예의 '말과 표정이 달라 못 믿는' 상황 → 두 번째 예로 마무리"}]}, {"id": "mock_2610_g2-31", "label": "26년 10월 31번 행동의 자동화와 기본 설정", "sents": [{"en": "A person who lives eighty years lives some twenty-nine thousand days, and the overwhelming majority of the behaviour packed into them runs on settings laid down, most of them, decades earlier and rarely inspected since.", "ko": "80년을 사는 사람은 약 2만 9천 일을 살고, 그 날들에 빽빽이 들어 있는 행동의 압도적 다수는 대부분 수십 년 전에 정해진 뒤 거의 점검되지 않은 설정에 따라 움직인다."}, {"en": "This need not be a hopeless thought.", "ko": "이것이 꼭 절망적인 생각일 필요는 없다."}, {"en": "In one light it is a triumph of engineering.", "ko": "어떤 관점에서 보면 그것은 설계의 승리이다."}, {"en": "If you had to consciously decide every footstep and every fork-grip and every word, you would never make it out of bed; the deliberate mind is far too slow and too costly to run a whole life in real time, and any creature that tried would be outcompeted by a creature that didn’t.", "ko": "만약 여러분이 발걸음 하나, 포크 쥐는 동작 하나, 말 한마디까지 모두 의식적으로 결정해야 한다면 침대에서 결코 나오지 못할 것이다. 신중한 사고는 삶 전체를 실시간으로 운영하기에는 너무 느리고 대가가 크며, 그렇게 하려는 생명체는 그러지 않는 생명체에게 경쟁에서 질 것이기 때문이다."}, {"en": "The automation is precisely what frees the captain to come up on deck for the few problems that actually require him.", "ko": "자동화는 바로 선장이 자신을 정말로 필요로 하는 몇 안 되는 문제를 위해 갑판 위로 올라올 수 있게 풀어 주는 것이다."}, {"en": "The default is not a flaw in the human design.", "ko": "기본 설정은 인간 설계의 결함이 아니다."}, {"en": "It is arguably the central feature, the thing that makes a complex life affordable at all.", "ko": "그것은 거의 틀림없이 핵심적인 특징, 즉 복잡한 삶을 조금이라도 감당할 수 있게 해 주는 것이다."}], "chunks": [[0, 0], [1, 2], [3, 5], [6, 6]], "ex": [{"head": "A person who lives eighty", "clue": ["settings laid down", "decades earlier"], "core": "평생 행동 대부분이 수십 년 전 정해진 설정대로 움직임", "why": "글의 출발: 우리 행동은 대부분 오래된 '설정(settings)'대로 돌아감"}, {"head": "This need not be a", "clue": ["This", "a hopeless thought"], "core": "그게 꼭 절망적인 생각일 필요는 없음", "why": "This(이것) = 앞 문장의 '행동이 옛 설정대로 돌아간다'는 생각 → 바로 다음"}, {"head": "In one light it is", "clue": ["In one light", "a triumph of engineering"], "core": "어떻게 보면 설계(공학)의 승리", "why": "절망할 필요 없음(앞) → 한 걸음 더 나가 '오히려 승리'로 뒤집음"}, {"head": "If you had to consciously", "clue": ["consciously decide", "never make it out of bed", "too slow and too costly"], "core": "하나하나 의식해서 정하면 침대 밖으로도 못 나옴", "why": "왜 '승리'인지 이유: 의식적인 사고는 너무 느리고 비쌈"}, {"head": "The automation is precisely what", "clue": ["The automation", "frees the captain"], "core": "자동화 덕에 선장(의식)은 꼭 필요한 문제에만 나섬", "why": "The automation(그 자동화) = 의식하지 않고 돌아가는 설정 → 의식이 느리다는 앞 문장과 대비"}, {"head": "The default is not a", "clue": ["The default", "not a flaw"], "core": "기본 설정은 인간 설계의 결함이 아님", "why": "The default(기본 설정) = 앞의 자동화·설정 → 장점을 말한 뒤 '결함 아님'으로 정리"}, {"head": "It is arguably the central", "clue": ["It", "the central feature"], "core": "오히려 복잡한 삶을 가능하게 하는 핵심 기능", "why": "not a flaw → It is the central feature (결함 아님 → 핵심 기능), It = 기본 설정"}], "postit": "행동 대부분 = 옛 설정 → 절망할 필요 없음 → 설계의 승리 → 의식은 느림 → 자동화가 선장을 풀어 줌 → 결함 아님 → 핵심 기능", "cex": [{"core": "평생 행동 대부분이 오래전 정해진 설정대로 돌아감", "why": "글의 출발: 우리 행동은 대부분 오래된 settings(설정)대로 움직인다는 사실"}, {"core": "절망적 생각 아님, 오히려 공학의 승리", "why": "This(이것) = 앞의 '옛 설정대로 돌아감' → In one light(한편으로 보면) 승리로 뒤집음"}, {"core": "의식은 너무 느려서 자동화가 필요, 기본 설정은 결함 아님", "why": "왜 승리인지 이유 → If you had to(만약 ~해야 한다면) 가정, The automation(자동화)으로 장점"}, {"core": "기본 설정은 복잡한 삶을 가능케 하는 핵심 기능", "why": "앞의 not a flaw(결함 아님) → It(그것) = 기본 설정, the central feature(핵심 기능)로 마무리"}]}, {"id": "mock_2610_g2-32", "label": "26년 10월 32번 대중문화와 법원의 역할", "sents": [{"en": "If we understand mass culture as a weakening factor of the cultural ties that unite people to their traditions, mass culture weakens the intermediary institutions in society (e.g. the family or the school), diminishing their role and overlapping these institutions.", "ko": "대중문화를 사람들을 전통에 묶어 주는 문화적 유대를 약하게 만드는 요인으로 이해한다면, 대중문화는 사회 속 매개 제도(예: 가족이나 학교)를 약화시켜 그 역할을 줄이고 이 제도들과 겹친다."}, {"en": "For example, courts are traditional social institutions and important for the normal and harmonious functioning of collective life.", "ko": "예를 들어, 법원은 전통적인 사회 제도이며 공동생활이 정상적이고 조화롭게 돌아가는 데 중요하다."}, {"en": "However, when people turn to social networks to put pressure on judicial decisions in certain mediated and politicized processes, this practice is popularized and becomes a habitual form of culture, which is harmful.", "ko": "그러나 어떤 조정되고 정치화된 과정에서 사람들이 사법적 판결에 압력을 가하려고 소셜 네트워크에 의지하면, 이러한 관행이 대중화되어 습관적인 문화의 한 형태가 되는데, 이는 해롭다."}, {"en": "Justice must not be done in the public square, which today is converted into a virtual dimension, the social networks.", "ko": "재판은 대중 광장에서 이루어져서는 안 되는데, 오늘날 그 광장은 가상의 차원, 즉 소셜 네트워크로 바뀌어 있다."}, {"en": "In a democratic state of law, the appropriate place to judge and make justice is the court and in a way that is immune to popular pressure.", "ko": "민주적인 법치 국가에서 재판하고 정의를 실현하기에 알맞은 곳은 법원이며, 그것도 대중의 압력에 흔들리지 않는 방식이어야 한다."}], "chunks": [[0, 0], [1, 1], [2, 2], [3, 4]], "ex": [{"head": "If we understand mass culture", "clue": ["mass culture", "the intermediary institutions"], "core": "대중문화는 가족·학교 같은 매개 제도를 약하게 만듦", "why": "글의 출발: 대중문화가 전통 '제도(institutions)'를 약화시킨다는 주장"}, {"head": "For example, is rigid outlook"], "core": "가소성이 옛날의 경직된 관점에 반박 → 발달은 평생 계속", "why": "this rigid outlook(이 경직된 사고방식) = 바로 앞 '아동기 발달·노년기 쇠퇴' 관점 → 반드시 옛날 관점 다음"}, {"head": "Although the extent of change", "clue": ["every phase of life"], "core": "변화 정도는 달라도 모든 시기에 변화 가능", "why": "앞의 '전 생애(entire lifespan)'를 every phase of life(삶의 모든 단계)로 다시 정리하는 마무리"}], "postit": "발달 = 변하는 과정 → 핵심은 가소성(뜻·능동적 주체) → 옛날엔 아동기만 발달 → 가소성이 반박: 모든 시기에 변화", "cex": [{"core": "발달 = 고정된 단계 X, 계속 변하는 유연한 과정", "why": "글의 출발: 요즘 보는 발달의 새 관점(rather than a fixed sequence, 고정된 순서가 아니라)"}, {"core": "관점의 핵심 가소성: 평생 성장하는 능동적 주체", "why": "this perspective(이 관점) = 앞의 '발달은 변하는 과정' → 그 핵심 개념 plasticity(가소성) 소개"}, {"core": "예전 관점: 아동기 발달, 성인기 안정, 노년기 쇠퇴", "why": "In earlier views(이전 관점에서는) → 가소성 관점과 대비되는 옛날 생각 등장"}, {"core": "가소성의 반박: 발달은 삶의 모든 단계에서 계속", "why": "this rigid outlook(이 경직된 관점) = 앞의 '아동기 발달·노년기 쇠퇴' → challenges(반박함)로 마무리"}]}, {"id": "mock_2610_g2-34", "label": "26년 10월 34번 상호 연결성과 새로운 취약성", "sents": [{"en": "Social media has altered business, politics, and friendships, making going viral a household term.", "ko": "소셜 미디어는 비즈니스, 정치, 친구 관계를 바꾸어 놓았고, '입소문이 나다(going viral)'를 일상적인 용어로 만들었다."}, {"en": "The global financial industry links every bank and countless households in every country, making us vulnerable to human error taking place on the other side of the world.", "ko": "세계 금융 산업은 모든 나라의 모든 은행과 수많은 가정을 연결하여, 우리를 세계 반대편에서 일어나는 인간의 실수에 취약하게 만든다."}, {"en": "As Columbia University strategy professor Rita McGrath explains, years ago most of our institutions were separate and thereby buffered from the effects of errors outside their walls.", "ko": "Columbia University 전략학 교수 Rita McGrath가 설명하듯이, 수년 전에는 우리 기관들 대부분이 분리되어 있었고, 그 덕분에 자신의 울타리 밖에서 일어난 오류의 영향으로부터 보호되었다."}, {"en": "That is no longer the case.", "ko": "이제는 더 이상 그렇지 않다."}, {"en": "The digitization of massive amounts of information has continued to grow enormously as the cost of computing power has decreased.", "ko": "컴퓨팅 능력의 비용이 줄어들면서 방대한 양의 정보의 디지털화는 계속해서 엄청나게 늘어났다."}, {"en": "The development of smart systems that communicate autonomously gave rise to an infinite variety of potential breakdowns.", "ko": "자율적으로 소통하는 스마트 시스템의 발달은 무한히 다양한 잠재적 고장을 낳았다."}, {"en": "This interdependence is a breeding ground for complex failure.", "ko": "이러한 상호 의존성은 복합적인 실패의 온상이다."}, {"en": "As Rita puts it, when “things that used to be kept separate bump up against each other, it becomes far more difficult to predict what’s going to happen next.”", "ko": "Rita가 말하듯이, '분리되어 있던 것들이 서로 부딪치게 되면, 다음에 무슨 일이 일어날지 예측하기가 훨씬 더 어려워진다.'"}, {"en": "Information technology creates new vulnerabilities because interconnectedness instantly spreads the impact of small failures.", "ko": "정보 기술은 새로운 취약성을 만들어 내는데, 상호 연결성이 작은 실패의 영향을 즉시 퍼뜨리기 때문이다."}], "chunks": [[0, 1], [2, 3], [4, 5], [6, 8]], "ex": [{"head": "Social media has altered business,", "clue": ["going viral"], "core": "소셜 미디어가 세상을 바꿈 → '입소문(viral)'이 일상어", "why": "글의 출발: 지금 세상이 얼마나 서로 연결됐는지 예시 1(소셜 미디어)"}, {"head": "The global financial industry links", "clue": ["links every bank", "vulnerable"], "core": "금융망이 전 세계를 연결 → 지구 반대편 실수에도 취약", "why": "연결 예시 2(금융망) → 연결 때문에 vulnerable(취약한)이라는 문제 제기"}, {"head": "As Columbia University strategy professor", "clue": ["years ago", "separate", "buffered"], "core": "예전: 기관들이 따로 떨어져 바깥 오류로부터 보호됨", "why": "years ago(수년 전) → 지금(연결된 세상)과 대비되는 과거. errors outside their walls(울타리 밖 오류) = 앞 문장의 지구 반대편 실수. 교수 이름 Rita McGrath가 여기서 처음 소개"}, {"head": "That is no longer the", "clue": ["That", "no longer"], "core": "하지만 이제는 그렇지 않음", "why": "That(그것) = 바로 앞 '기관들이 분리되어 보호받던 상황' → no longer(더 이상 ~ 아님)로 과거 부정"}, {"head": "The digitization of massive amounts", "clue": ["has continued to grow"], "core": "정보 디지털화가 엄청나게 늘어남", "why": "왜 '더 이상 그렇지 않은지' 이유 1: 디지털화가 계속 늘어남(현재완료 has continued)"}, {"head": "The development of smart systems", "clue": ["communicate autonomously", "breakdowns"], "core": "스스로 소통하는 스마트 시스템 → 고장 가능성 무한대", "why": "이유 2: 스마트 시스템끼리 서로 소통 → 서로 얽히는 상태 완성"}, {"head": "This tive way is with usability testing.", "ko": "엄청나게 효과적인 한 가지 방법은 사용성 테스트를 활용하는 것이다."}, {"en": "The goal of this method is to uncover problems in a design, discover existing opportunities, and learn more about the behaviors and preferences of users by asking participants to engage in realistic activities.", "ko": "이 방법의 목표는 참가자에게 실제와 같은 활동을 하도록 요청하여, 디자인의 문제를 밝혀내고, 이미 있는 기회를 발견하며, 사용자의 행동과 선호에 대해 더 많이 알아내는 것이다."}, {"en": "This technique is effective for understanding how well a design will perform once it is in the hands of real users.", "ko": "이 기법은 디자인이 실제 사용자의 손에 들어갔을 때 얼마나 잘 작동할지 이해하는 데 효과적이다."}, {"en": "Designers can use this method to improve their work through subsequent revisions based on the findings from representative users.", "ko": "디자이너는 대표 사용자에게서 얻은 결과를 바탕으로 이후 수정을 거쳐 자신의 작업을 개선하는 데 이 방법을 사용할 수 있다."}], "chunks": [[0, 0], [1, 1], [2, 3], [4, 5], [6, 7]], "ex": [{"head": "A simple truth that designers", "clue": ["we are not the user"], "core": "디자이너가 받아들일 진리: 우리는 사용자가 아님", "why": "글의 출발: '디자이너 ≠ 사용자'라는 단순한 진리"}, {"head": "We’re much too close to", "clue": ["much too close", "to objectively see it"], "core": "만든 것에 너무 가까워 객관적으로 못 봄", "why": "왜 사용자가 아닌지 이유 → We(우리) = 앞 문장의 we(디자이너). too ~ to(너무 ~해서 …못함)"}, {"head": "The best user interfaces are", "clue": ["real users"], "core": "최고의 화면 = 실제 사용자 관찰로 만들어진 것", "why": "우리(디자이너)는 객관적으로 못 봄 → 그러니 real users(실제 사용자)를 관찰해야 함으로 연결"}, {"head": "So how can designers shape", "clue": ["So how"], "core": "그럼 디자이너는 어떻게 더 효과적으로?", "why": "So(그렇다면) → 앞 원칙을 실제로 어떻게 할지 질문 던짐"}, {"head": "An incredibly effective way is", "clue": ["An incredibly effective way", "usability testing"], "core": "답: 사용성 테스트", "why": "질문(how ~?)에 대한 답 → way(방법) = 질문의 how에 대응. 질문 바로 다음"}, {"head": "The goal of this method", "clue": ["this method"], "core": "목표: 실제 같은 활동으로 문제·기회·선호 발견", "why": "this method(이 방법) = 바로 앞 사용성 테스트 → 방법 소개 다음에 목표 설명"}, {"head": "This technique is effective for", "clue": ["This technique", "real users"], "core": "실제 사용자 손에서 얼 .", "ko": "이렇게 서로 다른 해석의 결과로, 사람은 서로 다른 감정을 느낄 수 있다."}, {"en": "The first construal may bring intense sadness and anger.", "ko": "첫 번째 해석은 강렬한 슬픔과 분노를 가져올 수 있다."}, {"en": "The second construal might also bring sadness and anger but perhaps at lower levels.", "ko": "두 번째 해석 역시 슬픔과 분노를 가져올 수 있지만, 아마도 더 낮은 강도일 것이다."}, {"en": "Crucially, it might also bring some positive emotions, such as hope, strength, or gratitude.", "ko": "결정적으로, 그것은 희망, 강인함, 감사 같은 긍정적인 감정도 가져올 수 있다."}, {"en": "This example illustrates how reappraisal might powerfully transform short-term emotional responses.", "ko": "이 예시는 재평가가 단기적인 감정 반응을 어떻게 강력하게 바꿀 수 있는지 보여 준다."}, {"en": "When repeated over time, these short-term emotional consequences of reappraisal might accumulate to shape people’s psychological health.", "ko": "오랜 시간 반복되면, 재평가가 낳은 이러한 단기적인 감정의 결과가 쌓여 사람들의 심리적 건강을 형성할 수 있다."}, {"en": "Thereby, reappraisal might be a key to resilience.", "ko": "그렇게 함으로써, 재평가는 회복 탄력성의 열쇠가 될 수 있다."}], "chunks": [[0, 0], [1, 2], [3, 4], [5, 8], [9, 11]], "ex": [{"head": "Reappraisal—changing the way one thinks", "clue": ["Reappraisal", "at their root"], "core": "재평가 = 생각하는 방식 바꾸기 → 감정을 뿌리부터 조절", "why": "글의 출발: 재평가(reappraisal)의 뜻과 효과 소개"}, {"head": "Take, for example, someone who", "clue": ["for example", "a divorce"], "core": "예시: 이혼을 겪는 사람", "why": "for example(예를 들어) → 앞의 재평가를 설명할 사례(이혼) 꺼냄"}, {"head": "This is often an adverse", "clue": ["This", "and yet", "in different ways"], "core": "이혼은 부정적 사건이지만 다르게 해석 가능", "why": "This(이것) = 바로 앞의 a divorce(이혼) → 사례 소개 바로 다음"}, {"head": "One might view it as", "clue": ["One might view it"], "core": "해석 1: 가족에게 평생 남을 큰 상실", "why": "it(그것) = 이혼. 앞의 in different ways(다른 방식들)의 첫 번째 방식 제시"}, {"head": "Alternatively, one might see it", "clue": ["Alternatively"], "core": "해석 2: 아프지만 장기적으로 좋은 결과로 이어질 일", "why": "Alternatively(이와 달리) → 첫 번째 해석과 다른 두 번째 해석"}, {"head": "As a result of these", "clue": ["these different construals"], "core": "해석이 다르면 느끼는 감정도 다름", "why": "these different construals(이 서로 다른 해석들) = 앞의 해석 1·2 → 두 해석이 다 나온 뒤에만 가능"}, {"head": "The first construal may bring", "clue": ["The first construal"], "core": "해석 1 → 강한 슬픔·분노", "why": "The first construal(첫 번째 해석) = 앞의 '평생 남을 상실' → 해석별 감정 시작"}, {"head": "The second construal might also", "clue": ["The second construal", "also", "at lower levels"], "core": "해석 2 → 슬픔·분노도 있지만 더 약하게", "why": "first 다음 second(두 번째) → 순서 고정. also(역시) = 첫 번째처럼 슬픔·분노는 있음"}, {"head": "Crucially, it might also bring", "clue": ["Crucially", "it", "positive emotions"], "core": "결정적으로 해석 2는 희망·감사 같은 긍정 감정도 가져옴", "why": "it(그것) = 두 번째 해석 → Crucially(결정적으로)로 두 번째 해석의 강점 추가"}, {"head": "This example illustrates how reappraisal", "clue": ["This example", "short-term"], "core": "이 예시 = 재평가가 단기 감정 반응을 바꿈", "why": "This example(이 예시) = 지금까지의 이혼 사례 → 사례가 끝난 뒤 정리"}, {"head": "When repeated over time, these", "clue": ["When repeated over time", "these short-term emotional consequences"], "core": "오래 반복되면 쌓여서 심리적 건강 형성", "why": "these short-term(이 단기적인) = 바로 앞 단기 감정 반응 → 장기로 확장"}, {"head": "Thereby, reappraisal might be a", "clue": ["Thereby", "resilience"], "core": "결론: 재평가 = 회복 탄력성의 열쇠", "why": "Thereby(그렇게 함으로써) = 앞의 '쌓여서 건강 형성'의 결과 → 마지막 결론"}], "postit": "재평가 = 생각 바꾸기 → 예: 이혼 → 해석 1(상실)·해석 2(성장) → 다른 감정 → 이 예시 정리 → 쌓이면 건강 → 회복 탄력성", "cex": [{"core": "재평가 = 생각을 바꿔 감정을 뿌리부터 조절", "why": "글의 출발: reappraisal(재평가)의 뜻과 효과 소개"}, {"core": "예시: 부정적이지만 다르게 해석 가능한 이혼", "why": "Take, for example(예를 들어 보자) → 재평가 설명용 사례, This(이것) = 이혼"}, {"core": "해석 1 큰 상실 vs 해석 2 장기적으로 좋은 결과", "why": "it(그것) = 이혼 → 앞의 in different ways(다른 방식들)를 One might·Alternatively로 두 가지 제시"}, {"core": "해석이 다르면 감정도 다름: 해석 2엔 긍정 감정도", "why": "these different construals(이 서로 다른 해석들) = 앞의 두 해석 → The first·The second로 감정 비교"}, {"core": "반복된 재평가가 쌓여 회복 탄력성의 열쇠", "why": "This example(이 예시) = 이혼 사례 전체 → When repeated over time(오래 반복되면) 장기로 확장해 결론"}]}, {"id": "mock_2610_g2-38", "label": "26년 10월 38번 수질과 용도별 안전 기준", "sents": [{"en": "When we say that water is “clean,” we don’t just mean that it looks like a glass of water.", "ko": "우리가 물이 '깨끗하다'고 말할 때, 그것이 마실 물 한 잔처럼 보인다는 것만을 뜻하는 것은 아니다."}, {"en": "Water quality is about following a certain set of criteria, or “benchmarks.”", "ko": "수질은 특정한 기준의 집합, 즉 '지표'를 따르는 것에 관한 것이다."}, {"en": "These guidelines inform us exactly how much physical, chemical, or biological stuff can be in the water.", "ko": "이러한 지침은 정확히 얼마만큼의 물리적, 화학적, 생물학적 물질이 물속에 있어도 되는지를 알려 준다."}, {"en": "These rules ensure the water is safe for anything we want to do with it, whether that’s drinking it at home, watering crops on a farm, or running it through a huge industrial boiler.", "ko": "이러한 규칙은 우리가 물로 하려는 일이 집에서 마시는 것이든, 농장에서 작물에 물을 주는 것이든, 거대한 산업용 보일러에 흘려보내는 것이든, 그 물이 그 일에 안전하도록 보장한다."}, {"en": "We can’t utilize the same “one size fits all” rule for everyone because we use water for so many diverse things.", "ko": "우리는 물을 아주 다양한 일에 사용하기 때문에 모두에게 똑같은 '일률적인' 규칙을 쓸 수 없다."}, {"en": "For instance, the water that cools down a huge power plant generator doesn’t need to be as clean as the water you drink from the kitchen tap.", "ko": "예를 들어, 거대한 발전소의 발전기를 식히는 물은 여러분이 주방 수도꼭지에서 받아 마시는 물만큼 깨끗할 필요는 없다."}, {"en": "This is why groups set different “safety limits” for the water dependent on how it will be utilized.", "ko": "이것이 바로 여러 집단이 물이 어떻게 쓰일지에 따라 서로 다른 '안전 허용치'를 정하는 이유이다."}], "chunks": [[0, 0], [1, 2], [3, 4], [5, 6]], "ex": [{"head": "When we say that water", "clue": ["“clean,”", "don’t just mean"], "core": "'깨끗한 물' = 보기에 맑은 물만 뜻하는 것 X", "why": "글의 출발: '깨끗하다'는 말의 흔한 오해 깨기"}, {"head": "Water quality is about following", "clue": ["criteria", "“benchmarks.”"], "core": "수질 = 정해진 기준(criteria)을 따르는 것", "why": "겉모습 X → 그럼 진짜 뜻은? 기준을 따르는 것으로 바로 답함"}, {"head": "These guidelines inform us exactly", "clue": ["These guidelines"], "core": "기준 = 물속에 있어도 되는 물질의 양을 알려 줌", "why": "These guidelines(이 지침들) = 앞의 criteria·benchmarks(기준) → 기준 소개 바로 다음"}, {"head": "These rules ensure the water", "clue": ["These rules", "drinking", "watering crops", "industrial boiler"], "core": "이 규칙 = 마실 물·농업용·공업용 모두 안전 보장", "why": "These rules(이 규칙들) = 같은 기준을 또 다른 말로 받음 → 쓰임새 3가지(식수·농사·보일러) 등장"}, {"head": "We can’t utilize the same", "clue": ["“one size fits all”", "so many diverse things"], "core": "쓰임이 다양해서 똑같은 규칙 하나로는 안 됨", "why": "앞에서 나열한 다양한 쓰임 → so many diverse things(아주 다양한 일)로 받아 '일률적 규칙 불가'"}, {"head": "For instance, the water that", "clue": ["For instance", "doesn’t need to be as clean"], "core": "예: 발전기 냉각수는 식수만큼 깨끗할 필요 X", "why": "For instance(예를 들어) → '똑같은 규칙 불가'의 구체적 예시. 냉각수 vs 수돗물"}, {"head": "This is why groups set", "clue": ["This is why", "different “safety limits”"], "core": "결론: 쓰임에 따라 안전 허용치를 다르게 정함", "why": "This is why(이것이 ~한 이유) = 앞의 예시를 받아 결론. different(다른) = same(똑같은)과 대조"}], "postit": "깨끗함 ≠ 겉모습 → 기준 따르기 → 기준 = 물질 양·모든 용도 안전 → 용도 다양 → 일률 규칙 X → 예: 냉각수 → 용도별 허용치", "cex": [{"core": "깨끗한 물 = 겉보기 맑은 물만이 아님", "why": "글의 출발: we don't just mean(~만 뜻하는 것 아님)으로 '깨끗하다'의 흔한 오해 깨기"}, {"core": "수질 = 물속 물질 허용량을 정한 기준 따르기", "why": "겉모습 X → 그럼 진짜 뜻은? criteria(기준), These guidelines(이 지침들)로 받아 설명"}, {"core": "쓰임이 다양해 규칙 하나로는 안 됨", "why": "These rules(이 규칙들) = 앞의 기준 → 식수·농사·보일러 쓰임 나열, one size fits all(일률적) 불가"}, {"core": "예: 냉각수 vs 수돗물 → 쓰임별 다른 안전 허용치", "why": "For instance(예를 들어) → 일률적 규칙 불가의 예시, This is why(이것이 ~한 이유)로 결론"}]}, {"id": "mock_2610_g2-39", "label": "26년 10월 39번 사회사학자의 사료 읽기", "sents": [{"en": "Like all historians, social historians draw from a variety of primary sources.", "ko": "모든 역사학자와 마찬가지로, 사회사학자도 다양한 1차 자료를 활용한다."}, {"en": "Social history often emphasizes ordinary people rather than elites.", "ko": "사회사는 흔히 엘리트보다 평범한 사람들을 강조한다."}, {"en": "Yet, in most places and times, nonelites lacked access to education and, thus, did not produce substantial amounts of documentation.", "ko": "하지만 대부분의 지역과 시대에서 엘리트가 아닌 사람들은 교육을 받을 기회가 부족했고, 그래서 많은 양의 문서 기록을 남기지 못했다."}, {"en": "Even when they did produce documentation, these materials rarely ended up in archives where they could be preserved and made available to researchers.", "ko": "그들이 문서 기록을 남겼을 때조차, 이러한 자료들은 보존되어 연구자들이 이용할 수 있게 되는 기록 보관소에 거의 들어가지 못했다."}, {"en": "Because of such biases in the historical record, social historians have to be very creative in their work.", "ko": "역사 기록의 이러한 편향 때문에, 사회사학자는 자신의 작업에서 매우 창의적이어야 한다."}, {"en": "Like other historians, social historians analyze textual sources produced by government officials, employers, and other elites.", "ko": "다른 역사학자들처럼 사회사학자도 정부 관료, 고용주, 그 밖의 엘리트들이 만든 문서 자료를 분석한다."}, {"en": "Yet rather than simply take such sources at face value, they read them “against the grain”.", "ko": "하지만 그들은 그러한 자료를 단순히 액면 그대로 받아들이기보다는 '일반적인 방식과 다르게' 읽는다."}, {"en": "So, for example, a social historian will read legal documents not only for the “facts” provided by slaveowners; she will also examine the silences, interruptions, rumors, and other details that offer hints about the enslaved peoples’ attitudes and actions.", "ko": "그래서 예를 들어, 사회사학자는 법률 문서를 노예 소유주가 제공한 '사실'만을 얻으려고 읽는 것이 아니라, 노예가 된 사람들의 태도와 행동에 대한 힌트를 주는 침묵, 중단, 소문, 그 밖의 세부 사항도 살펴볼 것이다."}], "chunks": [[0, 0], [1, 1], [2, 3], [4, 5], [6, 7]], "ex": [{"head": "Like all historians, social historians", "clue": ["social historians", "primary sources"], "core": "사회사학자도 여러 1차 자료를 씀", "why": "글의 출발: 사회사학자(social historians) 소개"}, {"head": "Social history often emphasizes ordinary", "clue": ["ordinary people rather than elites"], "core": "사회사 = 엘리트보다 평범한 사람 중심", "why": "사회사학자 → 그들의 분야(social history)의 특징으로 이어짐"}, {"head": "Yet, in most places and", "clue": ["Yet", "nonelites"], "core": "하지만 평범한 사람들은 교육 못 받아 기록이 적음", "why": "Yet(하지만) → 평범한 사람 연구의 문제. nonelites(비엘리트) = 앞의 ordinary people"}, {"head": "Even when they did produce", "clue": ["Even when", "these materials"], "core": "기록을 남겨도 보관소에 거의 안 감", "why": "they(그들) = 엘리트가 아닌 사람들. Even when(~할 때조차) → 앞의 '기록 적음'에 문제를 하나 더"}, {"head": "Because of such biases in", "clue": ["such biases"], "core": "이런 기록의 편향 때문에 창의적이어야 함", "why": "such biases(그러한 편향) = 앞의 '평범한 사람 기록은 적고 안 남음' → 문제 두 개 다음에 와야 함"}, {"head": "Like other historians, social historians", "clue": ["produced by government officials, employers, and other elites"], "core": "그래서 결국 엘리트가 만든 문서를 분석함", "why": "창의적이어야 하는 상황 → 남아 있는 건 엘리트 문서뿐 → 그것을 분석"}, {"head": "Yet rather than simply take", "clue": ["Yet", "such sources", "“against the grain”"], "core": "하지만 액면 그대로 X, 거슬러 읽음", "why": "such sources(그러한 자료) = 바로 앞 엘리트가 만든 문서 → Yet(하지만)으로 읽는 방식 반전"}, {"head": "So, for example, a social", "clue": ["for example", "not only", "she will also examine"], "core": "예: 법률 문서의 '사실' + 침묵·소문에서 노예들의 단서 찾기", "why": "for example(예를 들어) → '거슬러 읽기'의 구체적 예시. not only A; also B(A뿐 아니라 B도)"}], "postit": "사회사 = 평범한 사람 → 기록 적음·보관 X → 편향 → 엘리트 문서 분석 → 거슬러 읽기 → 예: 법률 문서의 침묵·소문", "cex": [{"core": "사회사학자도 다양한 1차 자료 활용", "why": "글의 출발: social historians(사회사학자)와 그들이 쓰는 primary sources(1차 자료) 소개"}, {"core": "사회사는 엘리트보다 평범한 사람 중심", "why": "사회사학자 → 그들의 분야 social history(사회사)의 특징으로 이어짐"}, {"core": "평범한 사람들은 기록이 적고 보관도 안 됨", "why": "Yet(하지만) → 평범한 사람 연구의 문제, nonelites(비엘리트) = 앞의 ordinary people"}, {"core": "기록 편향 때문에 엘리트 문서를 창의적으로 분석", "why": "such biases(그러한 편향) = 앞의 '기록이 적고 안 남음' → 남은 엘리트 문서를 분석"}, {"core": "엘리트 문서를 거슬러 읽어 노예들의 단서 찾기", "why": "such sources(그러한 자료) = 앞의 엘리트 문서 → Yet(하지만) against the grain(거슬러) 읽기"}]}, {"id": "mock_2610_g2-40", "label": "26년 10월 40번 돌고래의 병렬 처리 청각 피질", "sents": [{"en": "Dolphins’ brains have evolved specialized areas dedicated to echolocation, allowing them to process acoustic information more quickly and with less energy.", "ko": "돌고래의 뇌는 반향 정위에 쓰이는 특화된 구역을 진화시켰고, 이것은 그들이 음향 정보를 더 빠르고 더 적은 에너지로 처리할 수 있게 해 준다."}, {"en": "One key adaptation is the structure of the dolphin’s auditory pathway.", "ko": "한 가지 핵심적인 적응은 돌고래의 청각 경로의 구조이다."}, {"en": "The signals from the ears are rapidly transmitted to the auditory cortex, the brain region responsible for processing sound.", "ko": "귀에서 온 신호는 소리 처리를 담당하는 뇌 영역인 청각 피질로 빠르게 전달된다."}, {"en": "However, unlike many other mammals, dolphins have a highly specialized auditory cortex with distinct areas dedicated to processing different aspects of echolocation signals.", "ko": "그러나 다른 많은 포유류와 달리, 돌고래는 반향 정위 신호의 서로 다른 측면을 처리하는 개별 구역을 가진 고도로 특화된 청각 피질을 가지고 있다."}, {"en": "Some areas may be responsible for analyzing the timing of echoes, while others focus on the frequency content or the intensity of the sound.", "ko": "어떤 구역은 반사음의 타이밍 분석을 담당하고, 다른 구역은 소리의 주파수 성분이나 강도에 집중한다."}, {"en": "This specialization allows the dolphin’s brain to process echo information in parallel, rather than sequentially.", "ko": "이러한 특화 덕분에 돌고래의 뇌는 반사음 정보를 순차적으로가 아니라 병렬로 처리할 수 있다."}, {"en": "Imagine a factory assembly line, where different workers are responsible for different tasks.", "ko": "서로 다른 노동자들이 서로 다른 일을 맡는 공장 조립 라인을 떠올려 보라."}, {"en": "By dividing the work among specialized areas, the brain can process information much faster and more efficiently.", "ko": "특화된 구역들에 일을 나누어 줌으로써, 뇌는 정보를 훨씬 더 빠르고 효율적으로 처리할 수 있다."}, {"en": "This parallel processing reduces the cognitive load associated with echolocation, allowing dolphins to react quickly to changes in their environment.", "ko": "이러한 병렬 처리는 반향 정위에 따르는 인지 부담을 줄여 주어, 돌고래가 환경의 변화에 빠르게 반응할 수 있게 해 준다."}], "chunks": [[0, 0], [1, 2], [3, 4], [5, 5], [6, 8]], "ex": [{"head": "Dolphins’ brains have evolved specialized", "clue": ["specialized areas", "echolocation"], "core": "돌고래 뇌 = 반향 정위 전용 구역 → 더 빠르게·덜 힘들게", "why": "글의 출발: 돌고래 뇌의 특화된 구역(specialized areas)"}, {"head": "One key adaptation is the", "clue": ["One key adaptation"], "core": "핵심 적응 하나 = 청각 경로의 구조", "why": "One key adaptation(한 가지 핵심 적응) → 앞의 반향 정위용으로 진화한 뇌의 구체적 예 하나를 꺼냄"}, {"head": "The signals from the ears", "clue": ["the auditory cortex"], "core": "귀의 신호 → 소리 처리하는 청각 피질로 전달", "why": "청각 경로(pathway)를 따라 신호가 가는 곳 설명 → 청각 피질(auditory cortex) 처음 등장"}, {"head": "However, unlike many other mammals,", "clue": ["However, unlike many other mammals", "distinct areas"], "core": "그러나 돌고래 청각 피질은 여러 구역으로 나뉨", "why": "However(그러나) → 앞의 일반적인 청각 피질과 달리 돌고래만의 특별한 점. 피질이 앞에서 소개된 뒤라야 가능"}, {"head": "Some areas may be responsible", "clue": ["Some areas", "while others"], "core": "구역별 분담: 타이밍 담당 / 주파수·강도 담당", "why": "Some areas(어떤 구역들) = 앞의 distinct areas(개별 구역) → 구역마다 맡은 일 설명"}, {"head": "This specialization allows the dolphin’s", "clue": ["This specialization", "in parallel"], "core": "이 특화 덕에 병렬 처리(순차 X)", "why": "This specialization(이 특화) = 앞의 '구역별 일 나누기' → 그 결과 parallel(병렬) 처리"}, {"head": "Imagine a factory assembly line,", "clue": ["Imagine", "different workers", "different tasks"], "core": "비유: 공장 조립 라인(노동자마다 다른 일)", "why": "병렬 처리를 쉽게 보여 주는 비유 → 구역 = 노동자, 반향 정보 처리 = 일"}, {"head": "By dividing the work among", "clue": ["By dividing the work"], "core": "일을 나누니 훨씬 빠르고 효율적", "why": "dividing the work(일 나누기) = 앞의 조립 라인 비유를 뇌에 다시 적용"}, {"head": "This parallel processing reduces the", "clue": ["This parallel processing", "cognitive load"], "core": "결과: 인지 부담↓ → 환경 변화에 빠르게 반응", "why": "This parallel processing(이 병렬 처리) = 앞의 in parallel 내용 → 병렬 얘기가 나온 뒤 마지막 결과"}], "postit": "반향 정위 전용 구역 → 청각 경로·피질 → 그러나 피질이 구역별로 나뉨 → 병렬 처리 → 조립 라인 비유 → 인지 부담↓", "cex": [{"core": "돌고래 뇌의 반향 정위 전용 구역", "why": "글의 출발: 돌고래 뇌가 echolocation(반향 정위)을 위해 진화시킨 특화 구역"}, {"core": "핵심 적응: 귀 신호를 청각 피질로 보내는 경로", "why": "One key adaptation(한 가지 핵심 적응) → 앞의 특화된 뇌의 구체적 예, auditory cortex(청각 피질) 등장"}, {"core": "돌고래 청각 피질은 구역별로 일을 나눠 맡음", "why": "However(그러나) + unlike many other mammals(다른 포유류와 달리) → 돌고래 피질만의 특별한 점"}, {"core": "구역 특화 덕에 순차 아닌 병렬 처리", "why": "This specialization(이 특화) = 앞의 '구역별 일 나누기' → 그 결과 in parallel(병렬로)"}, {"core": "조립 라인 비유: 일을 나눠 빠르고 부담 적게", "why": "병렬 처리를 Imagine(상상해 보라)으로 비유 → This parallel processing(이 병렬 처리)로 결과 마무리"}]}, {"id": "mock_2610_g2-41", "label": "26년 10월 41~42번 무료함은 자기 성찰의 기회", "sents": [{"en": "It is crucial to recognize that boredom can give rise to harmful emotions such as depression, despair, and irritation if not adequately addressed.", "ko": "무료함이 적절히 다뤄지지 않으면 우울, 절망, 짜증 같은 해로운 감정을 일으킬 수 있다는 것을 인식하는 것이 중요하다."}, {"en": "When we believe that the only way to be happy is by searching for fun activities, then we become dependent on those activities, and negative thoughts and emotions arise.", "ko": "행복해지는 유일한 방법이 재미있는 활동을 찾는 것이라고 믿으면, 우리는 그 활동에 의존하게 되고 부정적인 생각과 감정이 생긴다."}, {"en": "It is suggested that ‘Idle time is the devil’s workshop’ implies that those with too much time on their hands may fill that time with troubling thoughts and behavior.", "ko": "'아무것도 안 하는 시간은 악마의 작업장'이라는 말은 손에 시간이 너무 많은 사람들이 그 시간을 문제를 일으키는 생각과 행동으로 채울 수 있다는 것을 암시한다고 한다."}, {"en": "The balance is to not see it as idle time, wasted time, or boredom but rather as a perfect time for self-improvement, self-identification, and positive reflection time.", "ko": "균형점은 그것을 아무것도 안 하는 시간, 낭비된 시간, 또는 무료함으로 보지 않고, 오히려 자기 개선, 자기 발견, 긍정적인 성찰을 위한 완벽한 시간으로 보는 것이다."}, {"en": "Reflecting, just how lucky are we to be bored?", "ko": "곰곰이 생각해 보면, 우리가 무료할 수 있다는 것은 얼마나 운이 좋은 일인가?"}, {"en": "Boredom doesn’t exist in the presence of danger, as it is only an indulgence pastime in a safe zone.", "ko": "무료함은 위험이 있는 곳에서는 존재하지 않는데, 그것은 안전지대에서만 누리는 탐닉의 오락이기 때문이다."}, {"en": "Boredom can be perceived as a luxury that typically manifests in safe and inactive situations, providing an occasion to appreciate and comprehend the environment.", "ko": "무료함은 보통 안전하고 할 일 없는 상황에서 나타나는 사치로 여겨질 수 있으며, 주변 환경을 인식하고 이해할 기회를 준다."}, {"en": "In hazardous circumstances, the luxury of boredom is unavailable.", "ko": "위험한 상황에서는 무료함이라는 사치를 누릴 수 없다."}, {"en": "Thus, it is paramount to utilize idle moments for profound self-reflection.", "ko": "따라서 아무것도 안 하는 순간을 깊은 자기 성찰에 활용하는 것이 가장 중요하다."}, {"en": "It represents an occasion to listen, observe, and appreciate before expressing.", "ko": "그것은 표현하기 전에 듣고, 관찰하고, 인식할 기회를 의미한다."}, {"en": "Rather than viewing boredom as unproductive, it should be regarded as an opportunity for personal development and constructive contemplation.", "ko": "무료함을 비생산적인 것으로 보기보다는, 개인적 성장과 건설적인 사색의 기회로 여겨야 한다."}], "chunks": [[0, 1], [2, 3], [4, 7], [8, 10]], "ex": [{"head": "It is crucial to recognize", "clue": ["boredom", "harmful emotions"], "core": "무료함을 방치하면 우울·절망·짜증 같은 해로운 감정", "why": "글의 출발: 무료함(boredom)의 위험부터 경고"}, {"head": "When we believe that the", "clue": ["fun activities", "dependent"], "core": "재미만 쫓으면 그 활동에 의존 → 부정적 감정", "why": "무료함을 재미로만 해결하려 하면? → 또 다른 문제(의존)로 이어짐"}, {"head": "It is suggested that ‘Idle", "clue": ["‘Idle time is the devil’s workshop’", "too much time"], "core": "'한가한 시간은 악마의 작업장' → 남는 시간에 나쁜 생각", "why": "부정적 생각 얘기 이어서 → 속담으로 '남는 시간의 위험' 한 번 더. idle(한가한)"}, {"head": "The balance is to not", "clue": ["The balance", "not see it as idle time", "but rather"], "core": "해결: 남는 시간 = 낭비 X, 자기 개선·성찰의 시간", "why": "it(그것) = 앞 문장의 남는 시간. idle time을 그대로 다시 받음 → not A but B(A가 아니라 B)로 관점 전환"}, {"head": "Reflecting, just how lucky are", "clue": ["how lucky", "to be bored"], "core": "생각해 보면 무료할 수 있다는 건 행운", "why": "관점 전환 다음 → '무료함 = 행운'이라는 새 주장 던지는 질문(둘째 문단 시작)"}, {"head": "Boredom doesn’t exist in the", "clue": ["in the presence of danger", "in a safe zone"], "core": "무료함은 위험한 곳엔 없고 안전지대에만 있음", "why": "왜 행운인지 이유: 안전할 때만 무료할 수 있음"}, {"head": "Boredom can be perceived as", "clue": ["a luxury", "safe and inactive situations"], "core": "무료함 = 안전할 때만 누리는 사치(luxury)", "why": "안전지대 얘기 이어서 → 무료함을 luxury(사치)라는 말로 처음 표현"}, {"head": "In hazardous circumstances, the luxury", "clue": ["In hazardous circumstances", "the luxury of boredom"], "core": "위험한 상황에선 그 사치를 못 누림", "why": "the luxury(그 사치) = 바로 앞에서 처음 나온 a luxury → 반드시 그 다음"}, {"head": "Thus, it is paramount to", "clue": ["Thus", "idle moments"], "core": "그러니 한가한 순간을 깊은 자기 성찰에 써야 함", "why": "Thus(따라서) → 무료함 = 귀한 사치 → 그러니 잘 써야 한다는 결론. paramount(가장 중요한)"}, {"head": "It represents an occasion to", "clue": ["It", "an occasion"], "core": "그 순간 = 말하기 전에 듣고·보고·이해할 기회", "why": "It(그것) = 앞의 '한가한 순간을 성찰에 쓰는 것' → 그것이 주는 기회 설명"}, {"head": "Rather than viewing boredom as", "clue": ["Rather than", "unproductive", "an opportunity"], "core": "결론: 무료함 = 비생산 X, 성장
