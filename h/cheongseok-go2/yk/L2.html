</style></head><body class="notranslate"><div class="wrap" id="app"></div><script id="data" type="application/json">{"title": "유의어 꽉잡기", "sub": "영어II 2과 · 24단어", "key": "cheongseok-go2:yk:L2", "sec": 0, "pass": [{"label": "2과 ① 과학은 모두의 것과 은하 분류", "sents": [{"en": "When we think about science, we might consider it as a domain reserved exclusively for scientists in long, white lab coats who spend their days conducting experiments and analyzing data.", "ko": "과학에 대해 생각할 때, 우리는 과학을 실험하고 데이터를 분석하며 나날을 보내는, 길고 흰 실험실 가운을 입은 과학자들만의 영역이라고 여길지도 모른다."}, {"en": "They seem to have very little in common with ordinary people like us.", "ko": "그들은 우리와 같은 평범한 사람들과 공통점이 거의 없는 것 같이 보인다."}, {"en": "However, this perception is far from the truth.", "ko": "그러나 이러한 인식은 사실과 거리가 멀다."}, {"en": "In reality, science belongs to everyone, and we all have the ability to play a role in the advancement of science.", "ko": "사실 과학은 모두의 것이며, 우리는 모두 과학의 발전에 한몫할 수 있는 능력이 있다."}, {"en": "There have been numerous citizen science projects in which ordinary people have made contributions to remarkable scientific accomplishments.", "ko": "평범한 사람들이 놀라운 과학적 업적에 기여한 수많은 시민 과학 프로젝트들이 있었다."}, {"en": "Let’s take a look at two of them.", "ko": "그중 두 가지를 살펴보자."}, {"en": "Kevin Schawinski was a young astronomy researcher studying black holes and the evolution of galaxies at the University of Oxford.", "ko": "Kevin Schawinski는 옥스퍼드 대학에서 블랙홀과 은하의 진화를 연구하는 젊은 천문학 연구원이었다."}, {"en": "This might sound exciting, but his job there was dull and time-consuming.", "ko": "이것이 흥미롭게 들릴지도 모르지만, 그곳에서 그의 일은 따분하고 시간이 많이 걸리는 일이었다."}, {"en": "He had to classify around one million images of galaxies according to their shape.", "ko": "그는 약 백만 장의 은하 이미지를 모양에 따라 분류해야 했다."}, {"en": "Since they all looked similar but were actually shaped slightly differently, the best way to do this was to sort them while looking at each one individually.", "ko": "은하들은 모두 비슷해 보이지만 사실 모양이 조금씩 달랐기 때문에, 이 일을 해내는 가장 좋은 방법은 하나하나 직접 보면서 분류하는 것이었다."}, {"en": "Of course, this would require a tremendous amount of time.", "ko": "물론, 이것은 엄청난 시간이 필요할 것이었다."}]}, {"label": "2과 ② Galaxy Zoo의 탄생", "sents": [{"en": "It took Schawinski a whole week to classify just 50,000 galaxies.", "ko": "Schawinski가 고작 5만 개의 은하를 분류하는 데 꼬박 일주일이 걸렸다."}, {"en": "He thought, “But what about the remaining 950,000?”", "ko": "그는 ‘하지만 남아 있는 95만 개는 어쩌지?’라고 생각했다."}, {"en": "One evening after work, Schawinski met a friend named Chris Lintott and complained about the situation.", "ko": "어느 날 퇴근 후 저녁, Schawinski는 Chris Lintott이라는 이름의 친구를 만나서 그 상황에 대해 불평했다."}, {"en": "Lintott suggested that he turn to the Internet to ask other people for help.", "ko": "Lintott은 인터넷의 힘을 빌려 다른 사람들에게 도움을 청해 보라고 제안했다."}, {"en": "Eventually, the two men ended up launching a crowdsourced online project known as Galaxy Zoo.", "ko": "결국, 그 두 남자는 Galaxy Zoo라고 알려진 대중을 참여시키는(= 크라우드소싱) 온라인 프로젝트를 시작하게 되었다."}, {"en": "The website was kept as simple as possible, with a very basic design and an easy-to-use interface.", "ko": "그 웹사이트는 매우 기본적인 디자인과 사용하기 쉬운 인터페이스로 최대한 단순하게 유지되었다."}, {"en": "This allowed those who wanted to participate to get started quickly.", "ko": "이것은 참여하기를 원하는 사람들이 빠르게 시작할 수 있게 했다."}, {"en": "New visitors were greeted with a brief tutorial that explained the project.", "ko": "새로 온 방문자들은 먼저 프로젝트를 설명하는 간단한 사용 안내를 받았다."}, {"en": "Then they were shown an image of a galaxy and asked to click buttons that described its features.", "ko": "그런 다음 그들에게 은하 이미지 한 장이 보여졌고, 그 은하의 특징을 설명하는 버튼을 클릭하라는 요청을 받았다."}, {"en": "Is the galaxy smooth and rounded? Is its shape an oval or a spiral?", "ko": "은하가 매끄럽고 둥근가? 그것의 모양은 타원형인가 아니면 나선형인가?"}, {"en": "After completion of the tutorial and a little bit of practice, the participants were able to classify galaxies effectively.", "ko": "사용 안내를 마치고 약간 연습한 뒤, 참가자들은 은하를 효과적으로 분류할 수 있었다."}]}, {"label": "2과 ③ 참여자들의 힘과 Zooniverse", "sents": [{"en": "It was online media that helped spread the word about Galaxy Zoo, bringing more and more participants to the website.", "ko": "Galaxy Zoo에 대한 소문을 퍼뜨리는 데 도움을 준 것은 바로 온라인 미디어였고, 그 웹사이트에 점점 더 많은 참여자를 불러 모았다."}, {"en": "Shortly after the website was launched, nearly 70,000 classifications were being made per hour.", "ko": "웹사이트가 개설된 지 얼마 지나지 않아, 시간당 약 7만 건의 분류가 이루어지고 있었다."}, {"en": "In a year and a half, more than 80,000 individuals participated, and they made more than 75 million classifications.", "ko": "일 년 반 만에, 8만 명 이상의 개인이 참여하였고, 그들은 7천5백만 건 이상의 분류를 해냈다."}, {"en": "If it had not been for those participants, Schawinski couldn’t have classified that many images.", "ko": "그 참여자들이 없었다면, Schawinski는 그렇게 많은 이미지를 분류할 수 없었을 것이다."}, {"en": "In fact, it would have taken him decades on his own.", "ko": "사실, 그 혼자서는 수십 년이 걸렸을 것이다."}, {"en": "More than 15 years have passed since the project first began in 2007.", "ko": "그 프로젝트가 2007년에 처음 시작된 이래로 15년 이상이 지났다."}, {"en": "Galaxy Zoo has now grown into Zooniverse, which is one of the most popular platforms on the Internet for ordinary people who want to participate in science projects.", "ko": "Galaxy Zoo는 이제 Zooniverse로 성장했는데, 이것은 과학 프로젝트에 참여하고 싶어 하는 일반인들을 위한 인터넷에서 가장 인기 있는 플랫폼 중 하나이다."}, {"en": "It is more active than ever before, with about 2 million registered users worldwide.", "ko": "그것은 전 세계 약 200만 명의 등록 사용자와 함께 그 어느 때보다 활발하다."}, {"en": "It now offers a wide range of projects in astronomy, biology, physics, and more.", "ko": "현재 그것은 천문학, 생물학, 물리학 등에서 광범위한 프로젝트들을 제공하고 있다."}, {"en": "If you want to get involved, you should definitely check it out!", "ko": "참여하고 싶다면 꼭 한번 확인해 보라!"}]}, {"label": "2과 ④ 오로라 추적자와 Steve", "sents": [{"en": "In Alberta, Canada, there were some “aurora chasers” who formed an informal group online.", "ko": "캐나다 앨버타주에는 온라인상에서 비공식 단체를 결성한 ‘오로라 추적자들’이 있었다."}, {"en": "They would leave their homes at night and try to get exceptional photographs of auroras.", "ko": "그들은 밤에 집을 나서 특별한 오로라 사진을 찍으려고 하곤 했다."}, {"en": "Then they would share them with the rest of the group.", "ko": "그런 다음 그들은 단체의 나머지 사람들과 그것들을 공유하곤 했다."}, {"en": "In the summer of 2014, the group members began to notice something strange appearing in the night sky.", "ko": "2014년 여름, 그 단체 구성원들은 밤하늘에 이상한 무언가가 나타나는 것을 알아채기 시작했다."}, {"en": "There were unusual ribbons of green and purple light, some of which seemed to stretch for thousands of kilometers.", "ko": "녹색과 보라색의 특이한 빛의 띠가 있었는데, 그중 일부는 수천 킬로미터에 걸쳐 뻗어 있는 것처럼 보였다."}, {"en": "Sometimes they lasted for just a few minutes, while other times they remained in the sky for a whole hour.", "ko": "그것들은 어떤 때에는 단 몇 분간 지속되었지만, 다른 때에는 한 시간 내내 하늘에 머무르기도 했다."}, {"en": "They were similar in appearance to auroras, yet they possessed some notably different features.", "ko": "그것들은 오로라와 생김새가 비슷했지만, 몇 가지 현저하게 다른 특징들을 지니고 있었다."}, {"en": "Unsure of what they were, the group decided to name the phenomenon “Steve,” based on a scene from an animated movie where some characters give that name to an unfamiliar object.", "ko": "그것들이 무엇인지 확신하지 못한 그 단체는 등장인물들이 낯선 물체에 Steve라는 이름을 붙이는 한 애니메이션 영화의 장면을 바탕으로 이 현상을 ‘Steve’라고 이름 짓기로 결정했다."}]}, {"label": "2과 ⑤ 전문가와 NASA 프로젝트", "sents": [{"en": "After photographing Steve for several years and discussing what it might be, the group members decided to get help from experts.", "ko": "몇 년 동안 Steve의 사진을 찍고 그것이 무엇일지에 대해 논의한 후에, 그 단체 구성원들은 전문가들로부터 도움을 받기로 결정했다."}, {"en": "They showed their photos of Steve to a professor of astronomy at a local university and a scientist at NASA.", "ko": "그들은 Steve의 사진들을 지역 대학의 천문학 교수와 NASA의 과학자에게 보여주었다."}, {"en": "Surprisingly, neither of them had any idea what Steve was.", "ko": "놀랍게도, 둘 중 누구도 Steve가 무엇인지 전혀 알지 못했다."}, {"en": "They confirmed that it was not an aurora, but it did not resemble anything they had seen before.", "ko": "그들은 그것이 오로라가 아니라는 것은 확인했지만, 그것은 그들이 이전에 보았던 어느 것과도 비슷하지 않았다."}, {"en": "They realized that the group had discovered a new type of phenomenon that had never been properly studied.", "ko": "그들은 그 단체가 제대로 연구된 적이 없는 새로운 유형의 현상을 발견했다는 것을 깨달았다."}, {"en": "In order to learn more about it, NASA funded a citizen science project involving the public.", "ko": "이에 대해 더 자세히 알아보기 위해, NASA는 대중이 참여하는 시민 과학 프로젝트에 자금을 제공했다."}, {"en": "The project asked ordinary people to gather photos of Steve and send them to NASA.", "ko": "그 프로젝트는 일반인들에게 Steve의 사진을 모아서 NASA에 보내달라고 요청했다."}, {"en": "It is still in progress today.", "ko": "그것은 오늘날에도 여전히 진행 중이다."}]}, {"label": "2과 ⑥ STEVE와 누구나 시민 과학자", "sents": [{"en": "In honor of the aurora chasers who first discovered the phenomenon, the name “Steve” has been kept.", "ko": "이 현상을 처음 발견한 오로라 추적자들에게 경의를 표하여 ‘Steve’라는 이름은 유지되었다."}, {"en": "However, it is now written in all capital letters and stands for “Strong Thermal Emission Velocity Enhancement.”", "ko": "그러나, 그것은 이제 모두 대문자로 쓰이며, ‘속도 증가에 따른 강한 열 방출(Strong Thermal Emission Velocity Enhancement)’을 의미한다."}, {"en": "Experts have acknowledged that it is the dedicated members of the aurora chasers group that deserve the credit for discovering STEVE.", "ko": "전문가들은 STEVE를 발견한 공로를 인정받아야 할 사람들은 바로 오로라 추적자 단체의 헌신적인 구성원들임을 인정했다."}, {"en": "If it had not been for them, it might have remained unnoticed forever.", "ko": "만약 그들이 아니었다면, 그것은 영원히 알려지지 못한 상태로 남았을지도 모른다."}, {"en": "There are many interesting theories about STEVE, but none of them have been proven for certain.", "ko": "STEVE에 대한 흥미로운 이론들은 많지만, 그들 중 어느 것도 확실하게 증명된 것은 없다."}, {"en": "Scientists and citizens continue to collaborate to solve this mystery, and they are learning more and more about STEVE every day.", "ko": "과학자들과 시민들은 이 수수께끼를 풀기 위해 계속 협력하며, 매일 STEVE에 대해 점점 더 많은 것을 알아가고 있다."}, {"en": "Most of the individuals involved in these two projects are not professional scientists.", "ko": "이 두 프로젝트에 참여한 대부분의 개인들은 전문 과학자가 아니다."}, {"en": "Instead, they are citizen scientists—ordinary people who desire to help advance science in areas that they are interested in.", "ko": "대신, 그들은 시민 과학자들인데, 그들은 자신이 관심 있는 분야에서 과학의 발전을 돕고자 하는 평범한 사람들이다."}, {"en": "Even though citizen scientists may not have science degrees or long, white lab coats, they are still capable of making valuable contributions to science.", "ko": "시민 과학자들에게 과학 학위나 길고 흰 가운은 없을 수 있지만, 그들은 여전히 과학에 귀중한 기여를 할 수 있다."}, {"en": "You can become one as well if you have curiosity and an interest in taking part in scientific research.", "ko": "호기심과 과학 연구에 참여하는 것에 대한 관심이 있다면 당신도 시민 과학자가 될 수 있다."}, {"en": "The next great scientific achievement could be made by citizen scientists volunteering their time for the purpose of better understanding the world.", "ko": "다음 위대한 과학적 업적은 세상을 더 잘 이해하기 위한 목적으로 자신의 시간을 자발적으로 제공하는 시민 과학자들에 의해 이루어질 수도 있다."}]}], "items": [{"id": "g2L2-01", "p": 0, "s": 0, "w": "consider", "h": "consider", "pos": "동", "m": "(~을 …으로) 여기다", "form": "", "syn": [["regard", "여기다"], ["view", "보다, 여기다"]], "ant": [], "trap": [["ponder", "곰곰이 생각하다", "consider의 다른 뜻 '숙고하다'와 비슷한 말"]], "dis": [["predict", "예측하다"], ["collect", "모으다"]], "other": [["곰곰이 생각하다, 숙고하다", "I will consider your idea.", "네 생각을 곰곰이 생각해 볼게."]], "tip": "consider A as B(A를 B로 여기다) = regard A as B = view A as B", "story": "과학을 흰 가운 입은 과학자들만의 영역으로 여기는 얘기에서 나온 단어"}, {"id": "g2L2-02", "p": 0, "s": 0, "w": "conducting", "h": "conduct", "pos": "동", "m": "(실험·조사를) 하다, 실시하다", "form": "동사 conduct의 -ing형 (spend + 시간 + -ing)", "syn": [["carry out", "수행하다"], ["perform", "수행하다"]], "ant": [], "trap": [["behave", "처신하다, 행동하다", "conduct의 다른 뜻 '(자신을) 처신하다'와 비슷한 말"]], "dis": [["invent", "발명하다"], ["avoid", "피하다"]], "other": [["지휘하다", "She conducts the school orchestra.", "그녀는 학교 오케스트라를 지휘한다."], ["처신하다 (conduct oneself)", "He conducted himself well.", "그는 처신을 잘했다."]], "tip": "conduct an experiment = carry out an experiment, conductor(지휘자)의 conduct와 구별", "story": "실험하고 데이터 분석하며 하루를 보내는 과학자 모습에서 나온 단어"}, {"id": "g2L2-03", "p": 0, "s": 3, "w": "advancement", "h": "advancement", "pos": "명", "m": "발전, 진보", "form": "", "syn": [["progress", "진보, 발전"], ["development", "발전"]], "ant": [["decline", "쇠퇴"]], "trap": [], "dis": [["payment", "지불"], ["shortage", "부족"]], "other": [["승진, 출세", "She worked hard for advancement in her company.", "그녀는 회사에서 승진하려고 열심히 일했다."]], "tip": "the advancement of science = the progress of science, 회사 얘기면 '승진'", "story": "과학은 모두의 것이고 누구나 과학 발전에 한몫할 수 있다는 얘기에서 나온 단어"}, {"id": "g2L2-04", "p": 0, "s": 4, "w": "remarkable", "h": "remarkable", "pos": "형", "m": "놀라운, 주목할 만한", "form": "", "syn": [["outstanding", "뛰어난"], ["impressive", "인상적인"]], "ant": [["ordinary", "평범한"]], "trap": [], "dis": [["available", "이용할 수 있는"], ["nervous", "긴장한"]], "other": [], "tip": "remarkable(놀라운) ↔ ordinary(평범한), 같은 문장에 ordinary people도 등장", "story": "평범한 사람들이 놀라운 과학 업적에 기여한 시민 과학 얘기에서 나온 단어"}, {"id": "g2L2-05", "p": 0, "s": 7, "w": "dull", "h": "dull", "pos": "형", "m": "지루한, 따분한", "form": "", "syn": [["boring", "지루한"], ["tedious", "지루한, 싫증나는"]], "ant": [["exciting", "신나는"]], "trap": [["blunt", "무딘", "dull의 다른 뜻 '(칼날이) 무딘'과 비슷한 말"]], "dis": [["generous", "너그러운"]], "other": [["(칼날이) 무딘, 잘 안 드는", "This knife is dull.", "이 칼은 잘 안 든다."], ["(색·날씨가) 흐릿한", "It was a dull, gray day.", "흐리고 우중충한 날이었다."]], "tip": "exciting(신나는)과 짝을 이루는 dull은 '지루한', 칼 얘기면 '무딘'", "story": "신나 보이는 천문학 연구가 사실은 지루하고 시간만 드는 일이었다는 얘기에서 나온 단어"}, {"id": "g2L2-06", "p": 0, "s": 10, "w": "tremendous", "h": "tremendous", "pos": "형", "m": "엄청난", "form": "", "syn": [["enormous", "거대한, 막대한"], ["huge", "엄청난"], ["immense", "엄청난, 막대한"]], "ant": [["tiny", "아주 작은"]], "trap": [], "dis": [["gentle", "온화한"]], "other": [], "tip": "a tremendous amount of time = a huge amount of time", "story": "은하 사진 100만 장을 하나하나 분류하려면 엄청난 시간이 든다는 얘기에서 나온 단어"}, {"id": "g2L2-07", "p": 1, "s": 3, "w": "turn to", "h": "turn to", "pos": "동", "m": "(도움을 얻으려고) ~에 의지하다", "form": "", "syn": [["rely on", "의지하다"], ["depend on", "의존하다"]], "ant": [], "trap": [["change into", "~으로 변하다", "turn to의 다른 뜻 '~으로 변하다'와 비슷한 말"]], "dis": [["look after", "돌보다"], ["give up", "포기하다"]], "other": [["~으로 변하다", "The water turned to ice.", "물이 얼음으로 변했다."]], "tip": "turn to A for help = rely on A for help, '변하다'는 turn into와 같은 뜻", "story": "친구 Lintott이 인터넷의 도움을 받아 보라고 제안하는 얘기에서 나온 단어"}, {"id": var D=JSON.parse(document.getElementById('data').textContent),IT=D.items,KEY='yk:'+D.key;
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function sget(k,d){try{var v=localStorage.getItem(KEY+':'+k);return v?JSON.parse(v):d}catch(e){return d}}
function sset(k,v){try{localStorage.setItem(KEY+':'+k,JSON.stringify(v))}catch(e){}}
function sdel(k){try{localStorage.removeItem(KEY+':'+k)}catch(e){}}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}

function under(en,w){var i=en.indexOf(w);if(i<0){var re=new RegExp('\\b'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i'),m=re.exec(en);if(!m)return esc(en);i=m.index;w=m[0]}var pre=en.slice(0,i).replace(/(^|\s)(a|an|A|An)\s$/,function(m,a,b){return a+(b[0]=='A'?'A(n)':'a(n)')+' '});return esc(pre)+'<u>'+esc(w)+'</u>'+esc(en.slice(i+w.length))}

function mk(idx){return {k:idx,o:shuf(optsOf(IT[idx]).map(function(x,i){return i})),sel:{},rev:false}}
function isOK(q){var it=IT[q.k],o=optsOf(it);for(var i=0;i<o.length;i++){var s=!!q.sel[i];if(s!==(o[i].g=='syn'))return false}return true}

function save(){if(S.mode=='prac'&&!S.only)sset('prac',S);if(S.mode=='real')sset('real',S);if(S.mode=='exam')sset('exam',S)}
function anySel(q){for(var k in q.sel)if(q.sel[k])return true;return false}
function topBar(t){var n=S.q.length;return '<div class="top"><b>'+t+'</b><span>'+(S.i+1)+' / '+n+'</span><button class="hb" onclick="home()">처음으로</button></div><div class="bar"><i style="width:'+(S.i/n*100)+'%"></i></div>'}
function rPrac(){var q=S.q[S.i],last=S.i>=S.q.length-1,h=topBar(S.only?'틀린 것 다시':'관계 지도 연습');
 if(!q.rev){h+=qCard(q,true)+'<button class="go" '+(anySel(q)?'':'disabled')+' onclick="chk()">확인</button>'}
 else{var ok=isOK(q);h+='<div class="band '+(ok?'ok':'ng')+'">'+(ok?'정답':'오답')+'</div>'+qCard(q,false)+mapCard(q)+'<button class="go" onclick="nxt()">'+(last?'결과 보기':'다음 문제')+'</button>'}
 h+='<button class="go sec" onclick="home()">목록으로</button>';
 $('app').innerHTML=h;window.scrollTo(0,0);if(q.rev)setTimeout(drawAll,30)}
function chk(){var q=S.q[S.i];q.rev=true;var ok=isOK(q);if(S.only){if(ok){q.ok=1}setWrong(q.k,!ok)}else setWrong(q.k,!ok);save();rPrac()}
function nxt(){if(S.i>=S.q.length-1){var ok=S.q.filter(isOK).length,n=S.q.length;if(!S.only)sdel('prac');$('app').innerHTML='<div class="band '+(ok==n?'ok':'ng')+'">'+n+'개 중 '+ok+'개 정답<small>틀린 단어는 "틀린 것만 다시"에 모여 있어요</small></div><button class="go" onclick="home()">목록으로</button>';return}S.i++;save();rPrac()}
/* 관계 지도 */
function chip(x,cls,tag,tc,extra){return '<button class="mw '+cls+'" onclick="speak(\''+x.w.replace(/'/g,"\\'")+'\')"><span class="e" lang="en" translate="no">'+esc(x.w)+'</span>'+(tag?'<i class="'+tc+'">'+tag+'</i>':'')+'<span class="k">'+esc(x.m)+'</span>'+(extra||'')+'</button>'}
function mapCard(q){var it=IT[q.k],o=optsOf(it),st=function(i){var x=o[i],s=!!q.sel[i];if(x.g=='syn')return s?['맞힘','g']:['놓침','b'];return s?['잘못 고름','b']:['',''];};
 var L='',R='',T='',X='';
 o.forEach(function(x,i){var t=st(i),miss=(x.g=='syn'&&!q.sel[i])?' miss':'';
  if(x.g=='syn')L+=chip(x,'l'+miss,t[0],t[1]);
  else if(x.g=='ant')R+=chip(x,'r',t[0]||'반대',t[0]?t[1]:'b');
  else if(x.g=='trap')T+=chip(x,'t',t[0]||'함정',t[0]?t[1]:'m','<span class="tr">'+esc(x.r||'')+'</span>');
  else X+=chip(x,'d',t[0],t[1]);});
 var h='<div class="card"><div class="map"><svg></svg><div class="mc"><b lang="en" translate="no">'+esc(it.h)+'</b><em>본문 뜻: '+esc(it.m)+'</em></div>';
 h+='<div class="cols"><div class="col"><h4>바꿔 쓸 수 있음</h4>'+L+'</div><div class="col"><h4>반대 뜻</h4>'+(R||'<div class="small">없음</div>')+'</div></div></div>';
 if(T||X)h+='<div class="lower">'+(T?'<h4>다른 뜻 함정</h4>'+T:'')+(X?'<h4>관계없음</h4>'+X:'')+'</div>';
 if(it.form)h+='<div class="small" style="margin-top:8px">'+esc(it.w)+' = '+esc(it.form)+'</div>';
 if(it.other&&it.other.length){h+='<div class="oth"><b>'+esc(it.h)+'의 다른 뜻</b>';it.other.forEach(function(x){h+='<div><b style="display:inline;color:#1f2430;font-size:.92rem">'+esc(x[0])+'</b> <span class="ex" lang="en" translate="no">'+esc(x[1])+'</span><div class="ex">'+esc(x[2])+'</div></div>'});h+='</div>'}
 if(it.tip)h+='<div class="tip">'+esc(it.tip)+'</div>';
 if(it.story)h+='<div class="post"><small>본문 기억</small>'+esc(it.story)+'</div>';
 return h+'</div>'}
function drawAll(){[].forEach.call(document.querySelectorAll('.map'),function(map){var svg=map.querySelector('svg'),mc=map.querySelector('.mc'),m=map.getBoundingClientRect();if(!m.width)return;svg.setAttribute('width',m.width);svg.setAttribute('height',m.height);var c=mc.getBoundingClientRect(),sx=c.left-m.left+c.width/2,sy=c.bottom-m.top-2,h='';
 [].forEach.call(map.querySelectorAll('.mw.l,.mw.r'),function(b){var r=b.getBoundingClientRect(),L=b.classList.contains('l'),ex=(L?r.right:r.left)-m.left,ey=r.top-m.top+r.height/2;h+='<path class="'+(L?'ls':'ra')+(b.classList.contains('miss')?' miss':'')+'" d="M'+sx+' '+sy+' Q'+sx+' '+ey+' '+ex+' '+ey+'"/>'});svg.innerHTML=h})}
window.addEventListener('resize',function(){setTimeout(drawAll,50)});
/* 실전 예행연습 / 시험 공통 */
function startReal(){var px=sget('real',null);if(px&&!px.done){S=px}else{S={mode:'real',i:0,q:shuf(IT.map(function(x,i){return i})).map(mk)}}rReal()}
var TM=null;
function startExam(){var ex=sget('exam',null);if(ex&&ex.done){S=ex;showRes();return}if(ex){S=ex}else{var ks=shuf(IT.map(function(x,i){return i})).slice(0,25);S={mode:'exam',i:0,q:ks.map(mk),end:Date.now()+ks.length*20000};save()}rReal();clearInterval(TM);TM=setInterval(tick,500)}
function tick(){if(!S||S.mode!='exam'){clearInterval(TM);return}var r=Math.max(0,Math.round((S.end-Date.now())/1000));var e=$('tm');if(e)e.textContent=Math.floor(r/60)+':'+('0'+r%60).slice(-2);if(r<=0){clearInterval(TM);fin()}}
function rReal(){var q=S.q[S.i],last=S.i>=S.q.length-1,h=topBar(S.mode=='exam'?'시험 <span class="timer" id="tm"></span>':'실전 예행연습');
 h+=qCard(q,true);
 h+='<div style="display:flex;gap:8px">'+(S.i>0?'<button class="go sec" style="flex:1" onclick="mv(-1)">이전</button>':'')+'<button class="go" style="flex:2" onclick="'+(last?'fin()':'mv(1)')+'">'+(last?'제출':'다음')+'</button></div>';
 if(S.mode!='exam')h+='<button class="go sec" onclick="home()">목록으로</button>';
 $('app').innerHTML=h;window.scrollTo(0,0);if(S.mode=='exam')tick()}
function mv(d){S.i+=d;save();rReal()}
function fin(){clearInterval(TM);S.q.forEach(function(q){q.rev=true;setWrong(q.k,!isOK(q))});S.done=1;S.score=S.q.filter(isOK).length;if(S.mode=='real')sdel('real');else save();showRes()}
function showRes(){var n=S.q.length,ok=S.score,bad=S.q.filter(function(q){return !isOK(q)});
 var h='<div class="top"><b>'+(S.mode=='exam'?'시험 결과':'실전 예행연습 결과')+'</b><button class="hb" style="margin-left:auto" onclick="home()">처음으로</button></div>';
 h+='<div class="band '+(ok==n?'ok':'ng')+'">'+n+'개 중 '+ok+'개 정답</div>';
 if(bad.length){h+='<div class="small" style="margin:4px 2px 8px">틀린 단어</div>';bad.forEach(function(q){h+=qCard(q,false)+mapCard(q)})}
 if(bad.length&&S.mode=='real')h+='<button class="go" onclick="startPrac(1)">틀린 것만 다시</button>';
 h+='<button class="go sec" onclick="home()">목록으로</button>';$('app').innerHTML=h;window.scrollTo(0,0);setTimeout(drawAll,30)}
home();
</script></body></html>
