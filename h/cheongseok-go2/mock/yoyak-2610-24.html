<script>
var DATA={"meta": {"sch": "jusung-go2", "src": "common/sx-data-2610g2.js", "dir": "mock", "pidx": 3, "lesson": "26년 10월 24번", "title": "", "label": "", "page": "yoyak-2610-24"}, "scenes": [{"tag": "본문 1~2번", "ns": [1, 2], "line": "아리스토텔레스의 일부 생각은 오늘날 [[strange|낯설다]]. 노예 제도를 [[justifying|정당화하는]] 데도 어려움이 없었고, 철학자들은 [[high|높은]] 특권의 지위를 [[enjoyed|누렸다]].", "en": ["Consistent though he may be, some of Aristotle's ideas meet us today as strange.", "He had no difficulty justifying slavery, for example, and in his era, philosophers enjoyed positions of high privilege and influence."], "kos": ["비록 아리스토텔레스가 일관적일지라도, 그의 생각들 중 일부는 오늘날 우리에게 낯설게 다가온다.", "예를 들어, 그는 노예 제도를 정당화하는 데 아무런 어려움이 없었고, 그의 시대에 철학자들은 높은 특권과 영향력이 있는 지위를 누렸다."]}, {"tag": "본문 3~4번", "ns": [3, 4], "line": "철학자들은 최고선을 사유한다는 이유로 최고의 것을 가질 [[worthy|자격이 있다고]] 여겨졌다. 그런데 그 주장은 이상하게 잇속 차리기처럼 [[seems|보인다]].", "en": ["Because of their practice of contemplation for the highest human good, philosophers were considered worthy to have all the best things in life.", "Somehow that assertion seems oddly self-serving."], "kos": ["그들의 인간의 최고선에 대한 사유의 실천 때문에, 철학자들은 삶에서 모든 최고의 것들을 가질 만하다고 여겨졌다.", "왠지 그 주장은 이상하게도 자기 잇속만 차리는 것처럼 보인다."]}, {"tag": "본문 5번", "ns": [5], "line": "위대한 사상가도 자기 시대에 속하고 특정한 청중에게 말한다. 아리스토텔레스도 예외가 아니다.", "en": ["It serves us to remember that every great thinker is of her own time and speaks to a particular audience, and certainly Aristotle is no exception."], "kos": ["그것은 ‘우리’가 모든 위대한 사상가는 그들 자신만의 시대에 속해 있고 특정한 청중들에게 말한다는 것을 기억하는 데 도움이 되며, 확실히 아리스토텔레스도 예외는 아니다."]}, {"tag": "본문 6~7번", "ns": [6, 7], "line": "그가 이해한 인간 번영은 오늘날 원하는 만큼 [[inclusive|포용적]]이지 않다. 그의 옳음과 선은 특권 엘리트의 이해를 보여 주는 지표다.", "en": ["Human flourishing as he understood it probably would not be nearly as inclusive as we would want it to be today.", "How he understood right and good is best taken to be an indicator of how the privileged elite of ancient Greek society tended to understand right and good."], "kos": ["그가 이해했던 대로의 인간 번영은 아마도 결코 오늘날 우리가 그것이 그러하기를 원하는 만큼 포용적이지는 않을 것이다.", "그가 옳음과 선을 어떻게 이해했는가는 고대 그리스 사회의 특권 엘리트 계층이 옳음과 선을 어떻게 이해하는 경향이 있었는가에 대한 척도로 가장 잘 여겨진다."]}, {"tag": "본문 8번", "ns": [8], "line": "그 결과 장점이 있어도 [[deeply|심하게]] [[flawed|결함이 있다]].", "en": ["As a result, for all it does well, it is also deeply flawed."], "kos": ["그 결과, 그것의 장점에도 불구하고, 그것은 또한 심각하게 결함이 있다."]}], "story": [{"a": "strange", "form": "strange", "n": 1, "sq": 1, "sum": "ideas seem [[odd]] to us today", "hook": "아리스토텔레스의 생각이 오늘날 낯설다는 문장의 strange(낯선) → 요약문에서는 odd(이상한)로 바꿨어요.", "b": "odd", "k": "낯선 → 이상한", "en": "Consistent though he may be, some of Aristotle's ideas meet us today as strange.", "ko": "비록 아리스토텔레스가 일관적일지라도, 그의 생각들 중 일부는 오늘날 우리에게 낯설게 다가온다."}, {"a": "justify", "form": "justifying", "n": 2, "sq": 1, "sum": "he easily [[defended]] slavery", "hook": "노예 제도를 정당화하는 데 어려움이 없었다는 문장의 justify(정당화하다) → 요약문에서는 defend(옹호하다)로 바꿨어요.", "b": "defend", "k": "정당화하다 → 옹호하다", "en": "He had no difficulty justifying slavery, for example, and in his era, philosophers enjoyed positions of high privilege and influence.", "ko": "예를 들어, 그는 노예 제도를 정당화하는 데 아무런 어려움이 없었고, 그의 시대에 철학자들은 높은 특권과 영향력이 있는 지위를 누렸다."}, {"a": "high", "form": "high", "n": 2, "sq": 1, "sum": "positions of [[great]] privilege", "hook": "철학자들이 높은 특권을 누렸다는 문장의 high(높은) → 요약문에서는 great(큰)로 바꿨어요.", "b": "great", "k": "높은 → 큰", "en": "He had no difficulty justifying slavery, for example, and in his era, philosophers enjoyed positions of high privilege and influence.", "ko": "예를 들어, 그는 노예 제도를 정당화하는 데 아무런 어려움이 없었고, 그의 시대에 철학자들은 높은 특권과 영향력이 있는 지위를 누렸다."}, {"a": "enjoy", "form": "enjoyed", "n": 2, "sq": 1, "sum": "philosophers of his time [[had]] positions", "hook": "철학자들이 높은 지위를 누렸다는 문장의 enjoy(누리다) → 요약문에서는 have(가지다)로 바꿨어요.", "b": "have", "k": "누리다 → 가지다", "en": "He had no difficulty justifying slavery, for example, and in his era, philosophers enjoyed positions of high privilege and influence.", "ko": "예를 들어, 그는 노예 제도를 정당화하는 데 아무런 어려움이 없었고, 그의 시대에 철학자들은 높은 특권과 영향력이 있는 지위를 누렸다."}, {"a": "worthy", "form": "worthy", "n": 3, "sq": 2, "sum": "thought [[deserving]] of having", "hook": "철학자들이 최고의 것을 가질 만하다고 여겨졌다는 문장의 worthy(자격이 있는) → 요약문에서는 deserving(받을 만한)으로 바꿨어요.", "b": "deserving", "k": "자격이 있는 → 받을 만한", "en": "Because of their practice of contemplation for the highest human good, philosophers were considered worthy to have all the best things in life.", "ko": "그들의 인간의 최고선에 대한 사유의 실천 때문에, 철학자들은 삶에서 모든 최고의 것들을 가질 만하다고 여겨졌다."}, {"a": "seem", "form": "seems", "n": 4, "sq": 2, "sum": "this claim [[looks]] selfish", "hook": "그 주장이 잇속 차리기처럼 보인다는 문장의 seem(~처럼 보이다) → 요약문에서는 look(~처럼 보이다)으로 바꿨어요.", "b": "look", "k": "보이다 → 보이다", "en": "Somehow that assertion seems oddly self-serving.", "ko": "왠지 그 주장은 이상하게도 자기 잇속만 차리는 것처럼 보인다."}, {"a": "inclusive", "form": "inclusive", "n": 6, "sq": 3, "sum": "less [[open]] than ours", "hook": "오늘날만큼 포용적이지 않다는 문장의 inclusive(포용적인) → 요약문에서는 open(열려 있는)으로 바꿨어요.", "b": "open", "k": "포용적인 → 열려 있는", "en": "Human flourishing as he understood it probably would not be nearly as inclusive as we would want it to be today.", "ko": "그가 이해했던 대로의 인간 번영은 아마도 결코 오늘날 우리가 그것이 그러하기를 원하는 만큼 포용적이지는 않을 것이다."}, {"a": "deeply", "form": "deeply", "n": 8, "sq": 3, "sum": "it is [[seriously]] faulty", "hook": "결과적으로 심하게 결함이 있다는 문장의 deeply(심하게) → 요약문에서는 seriously(심각하게)로 바꿨어요.", "b": "seriously", "k": "심하게 → 심각하게", "en": "As a result, for all it does well, it is also deeply flawed.", "ko": "그 결과, 그것의 장점에도 불구하고, 그것은 또한 심각하게 결함이 있다."}, {"a": "flawed", "form": "flawed", "n": 8, "sq": 3, "sum": "seriously [[faulty]]", "hook": "결함이 있다는 문장의 flawed(결함이 있는) → 요약문에서는 faulty(결함이 있는)로 바꿨어요.", "b": "faulty", "k": "결함이 있는 → 결함이 있는", "en": "As a result, for all it does well, it is also deeply flawed.", "ko": "그 결과, 그것의 장점에도 불구하고, 그것은 또한 심각하게 결함이 있다."}], "passage": [{"n": 1, "en": "Consistent though he may be, some of Aristotle's ideas meet us today as strange.", "ko": "비록 아리스토텔레스가 일관적일지라도, 그의 생각들 중 일부는 오늘날 우리에게 낯설게 다가온다."}, {"n": 2, "en": "He had no difficulty justifying slavery, for example, and in his era, philosophers enjoyed positions of high privilege and influence.", "ko": "예를 들어, 그는 노예 제도를 정당화하는 데 아무런 어려움이 없었고, 그의 시대에 철학자들은 높은 특권과 영향력이 있는 지위를 누렸다."}, {"n": 3, "en": "Because of their practice of contemplation for the highest human good, philosophers were considered worthy to have all the best things in life.", "ko": "그들의 인간의 최고선에 대한 사유의 실천 때문에, 철학자들은 삶에서 모든 최고의 것들을 가질 만하다고 여겨졌다."}, {"n": 4, "en": "Somehow that assertion seems oddly self-serving.", "ko": "왠지 그 주장은 이상하게도 자기 잇속만 차리는 것처럼 보인다."}, {"n": 5, "en": "It serves us to remember that every great thinker is of her own time and speaks to a particular audience, and certainly Aristotle is no exception.", "ko": "그것은 ‘우리’가 모든 위대한 사상가는 그들 자신만의 시대에 속해 있고 특정한 청중들에게 말한다는 것을 기억하는 데 도움이 되며, 확실히 아리스토텔레스도 예외는 아니다."}, {"n": 6, "en": "Human flourishing as he understood it probably would not be nearly as inclusive as we would want it to be today.", "ko": "그가 이해했던 대로의 인간 번영은 아마도 결코 오늘날 우리가 그것이 그러하기를 원하는 만큼 포용적이지는 않을 것이다."}, {"n": 7, "en": "How he understood right and good is best taken to be an indicator of how the privileged elite of ancient Greek society tended to understand right and good.", "ko": "그가 옳음과 선을 어떻게 이해했는가는 고대 그리스 사회의 특권 엘리트 계층이 옳음과 선을 어떻게 이해하는 경향이 있었는가에 대한 척도로 가장 잘 여겨진다."}, {"n": 8, "en": "As a result, for all it does well, it is also deeply flawed.", "ko": "그 결과, 그것의 장점에도 불구하고, 그것은 또한 심각하게 결함이 있다."}], "questions": [{"id": 1, "summary": "Some of Aristotle's ideas seem (A) to us today; for example, he easily (B) slavery, and philosophers of his time had positions of great privilege.", "ko": "아리스토텔레스의 생각 일부는 오늘날 우리에게 <b>(A) 이상하게</b> 보인다. 예를 들어 그는 노예 제도를 쉽게 <b>(B) 옹호했고</b>, 그 시대의 철학자들은 큰 특권이 있는 지위를 가졌다.", "opts": [["odd", "opposed"], ["familiar", "defended"], ["familiar", "opposed"], ["boring", "ignored"], ["odd", "defended"]], "optko": ["이상한 – 반대했다", "익숙한 – 옹호했다", "익숙한 – 반대했다", "지루한 – 무시했다", "이상한 – 옹호했다"], "ans": 4, "wrong": ["opposed(반대했다)가 틀려요. 아리스토텔레스는 노예 제도를 정당화하는 데 아무런 어려움이 deeply:{bj:'그것은 또한 <b>심각하게</b>(deeply) 결함이 있다',s:[['profoundly','깊이'],['extremely','극도로'],['severely','심하게']],a:[['slightly','약간']],t:'seriously',tr:'deeply는 깊이 뜻이 먼저, 여기서는 정도가 심하게'}
};
function relBox(s){
  var r=REL[String(s.a).toLowerCase()];if(!r)return '';
  var it=[{t:s.b,k:String(s.k).split(' → ')[1]||'',c:'k'}];
  r.s.forEach(function(x){it.push({t:x[0],k:x[1],c:'s'})});
  r.a.forEach(function(x){it.push({t:x[0],k:x[1],c:'a'})});
  var P={1:[[50,80]],2:[[26,78],[74,78]],3:[[16,70],[50,86],[84,70]],4:[[14,62],[36,86],[64,86],[86,62]],5:[[12,56],[28,86],[50,92],[72,86],[88,56]]}[it.length],svg='',nd='';
  it.forEach(function(x,j){
    svg+='<line x1="50%" y1="26%" x2="'+P[j][0]+'%" y2="'+(P[j][1]-7)+'%" stroke="'+(x.c=='a'?'#c0392b':'#2f5d50')+'" stroke-width="2"/>';
    nd+='<div class="rn '+x.c+'" style="left:'+P[j][0]+'%;top:'+P[j][1]+'%">'+esc(x.t)+(x.k?'<small>'+esc(x.k)+'</small>':'')+'</div>';
  });
  var left=String(s.k).split(' → ')[0];
  var h='<div class="relx"><div class="rmap"><svg>'+svg+'</svg><div class="rn c" style="left:50%;top:26%">'+esc(s.a)+'<small>'+esc(left)+'</small></div>'+nd+'</div>'
   +'<div class="rleg"><span><i style="border-color:#2f5d50"></i>바꿔 쓸 수 있는 말</span>'+(r.a.length?'<span><i style="border-color:#c0392b"></i>반대말</span>':'')+'</div>'
   +'<div class="pit"><div><em>본문</em>'+r.bj+'</div><div><em>요약문</em><b>'+esc(s.b)+'</b>('+esc(String(s.k).split(' → ')[1]||'')+')로 바뀜</div>'+(r.tr?'<div class="tp"><em>함정</em>'+esc(r.tr)+'</div>':'')+'</div></div>';
  return h;
}
function vSw(){
  var L=swList(),sc={};
  (DATA.scenes||[]).forEach(function(c){(c.line.match(/\[\[\w+\|/g)||[]).forEach(function(m){sc[m.slice(2,-1).toLowerCase()]=c})});
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">바꿔 말하기 '+L.length+'개</span></div>';
  h+='<p class="hint">왼쪽 단어가 요약문에서 어떤 말로 바뀔까요? <b>소리 내어 말해 본 뒤</b> 확인을 눌러요.</p>';
  h+='<div class="tabs"><button data-a="rvall" data-v="open">모두 열기</button><button data-a="rvall" data-v="hide">모두 가리기</button><button data-a="staronly" class="'+(swStarOnly?'on':'')+'">별표만 '+Object.keys(STAR).length+'</button></div><div class="card">';
  if(swStarOnly)L=L.filter(function(s){return STAR[s.id]});
  if(!L.length)h+='<div class="empty">별표 친 단어가 없어요. 안 외워지는 단어에 별표를 눌러 두세요.</div>';
  L.forEach(function(s){
    var o=swOpen[s.id],c=sc[s.form.toLowerCase()],on=swD['s'+s.id],fl=wrongOf(s.id);
    h+='<div class="swr"><div class="swq"><span class="qn">'+s.sq+'번</span><span class="sa">'+words(s.a)+(fl?'<small class="flag">'+fl+'번 틀림</small>':'')+'</span><span class="sb">'+(o?'<em>'+words(s.b)+'</em>'+esc(s.k):'→ ?')+'</span>'+sayBtn(s.a,'듣기')+(o?sayBtn(s.b,'정답 듣기'):'')+'<button data-a="rv" data-v="'+esc(s.id)+'">'+(o?'가리기':'확인')+'</button><button data-a="star" data-v="'+esc(s.id)+'" class="stb'+(STAR[s.id]?' on':'')+'">별표</button></div>';
    if(o)h+=relBox(s);else if(REL[String(s.a).toLowerCase()]){var rr=REL[String(s.a).toLowerCase()];h+='<div class="hch">유 '+(1+rr.s.length)+(rr.a.length?' · 반 '+rr.a.length:'')+'</div>'}
    if(c&&!REL[String(s.a).toLowerCase()])h+='<button class="acc2" data-a="dt" data-v="s'+esc(s.id)+'">'+esc(c.tag)+' 줄거리<span>'+(on?'접기':'펼치기')+'</span></button>'+(on?'<div class="story">'+sceneLine(c.line,s.form)+'</div>':'');
    h+='</div>';
  });
  return h+'</div><p class="sumline">시험에서는 본문 단어가 뜻이 같은 다른 단어로 바뀌어 나와요.</p><button class="btn sec" data-a="home">목록으로</button>';
}
/* 자동 새로고침(기록 연동)이 일어나도 보던 문제로 되돌린다 */
try{var sv=JSON.parse(sessionStorage.getItem('vhyv')||'null');if(sv&&sv.p===location.pathname&&Date.now()-sv.t<600000&&sv.v&&sv.v!=='home'){view=sv.v;cur=sv.c||0;try{history.pushState({v:view},'');histPushed=true}catch(e){}}}catch(e){}
render();srvLoad();window.addEventListener('pageshow',srvLoad);
</script>
