<script>
var DATA={"meta": {"sch": "jusung-go2", "src": "common/sx-data-2610g2.js", "dir": "mock", "pidx": 11, "lesson": "26년 10월 36번", "title": "", "label": "", "page": "yoyak-2610-36"}, "scenes": [{"tag": "본문 1번", "ns": [1], "line": "더 효과적인 제품을 만들려면 디자이너가 [[embrace|수용해야]] 할 진리가 있다. 우리는 사용자가 아니다.", "en": ["A simple truth that designers must embrace in order to create more effective products and experiences is the fact that we are not the user."], "kos": ["디자이너들이 더 효과적인 제품과 경험을 만들어 내기 위해 수용해야만 하는 단순한 진리는 우리가 ‘사용자가 아니라’는 사실이다."]}, {"tag": "본문 2번", "ns": [2], "line": "우리는 만든 것에 너무 가까워서 그것을 [[objectively|객관적으로]] 볼 수 없다.", "en": ["We're much too close to what we build to objectively see it and understand how users will interact with it."], "kos": ["우리는 우리가 만드는 것에 너무 가까워서 그것을 객관적으로 보고 사용자들이 그것과 어떻게 상호 작용할지 이해할 수 없다."]}, {"tag": "본문 3번", "ns": [3], "line": "가장 좋은 인터페이스는 실제 사용자에 대한 [[observations|관찰]]로 [[shaped|만들어진다]].", "en": ["The best user interfaces are those that have been shaped by observations of real users and their interactions with them."], "kos": ["가장 좋은 사용자 인터페이스들은 실제 사용자들과 그들의 그것들과의 상호 작용에 대한 관찰 결과들에 의해 만들어져 온 것들이다."]}, {"tag": "본문 4~5번", "ns": [4, 5], "line": "그럼 어떻게 해야 할까? [[incredibly|엄청나게]] [[effective|효과적인]] 방법은 사용성 테스트다.", "en": ["So how can designers shape their work to be more effective?", "An incredibly effective way is with usability testing."], "kos": ["그러면 디자이너들은 어떻게 자신의 작업이 더 효과적일 수 있도록 만들 수 있을까?", "한 가지 엄청나게 효과적인 방법은 사용성 테스트를 가지고 하는 것이다."]}, {"tag": "본문 6번", "ns": [6], "line": "참가자에게 실제적인 [[activities|활동]]을 시켜 문제를 [[uncover|밝혀내고]], 사용자의 [[behaviors|행동]]과 [[preferences|선호]]를 배운다.", "en": ["The goal of this method is to uncover problems in a design, discover existing opportunities, and learn more about the behaviors and preferences of users by asking participants to engage in realistic activities."], "kos": ["이 방법의 목표는 참가자들이 실제적인 활동들에 참여하도록 요청함으로써 디자인상의 문제들을 밝혀 내고, 현재 있는 가능성들을 발견하고, 사용자들의 행동들과 선호하는 것들에 대해 더 많이 학습하는 것이다."]}, {"tag": "본문 7번", "ns": [7], "line": "디자인이 실제 사용자의 손에서 얼마나 잘 [[perform|작동할지]] 알 수 있다.", "en": ["This technique is effective for understanding how well a design will perform once it is in the hands of real users."], "kos": ["이 기술은 디자인이 실제 사용자들의 손 안에 있을 때 얼마나 그것이 잘 작동할 것인지를 이해하는 데 효과적이다."]}, {"tag": "본문 8번", "ns": [8], "line": "[[representative|대표적인]] 사용자에게서 얻은 결과로 [[subsequent|차후의]] [[revisions|수정]]을 거쳐 작업을 [[improve|개선한다]].", "en": ["Designers can use this method to improve their work through subsequent revisions based on the findings from representative users."], "kos": ["디자이너들은 대표적인 사용자들로부터 발견한 것들에 기반한 차후의 수정들을 통해 그들의 작업물을 개선하기 위해 이 방법을 사용할 수 있다."]}], "story": [{"a": "embrace", "form": "embrace", "n": 1, "sq": 1, "sum": "Designers must [[accept]] that", "hook": "디자이너가 수용해야 할 단순한 진리라는 문장의 embrace(수용하다) → 요약문에서는 accept(받아들이다)로 바꿨어요.", "b": "accept", "k": "수용하다 → 받아들이다", "en": "A simple truth that designers must embrace in order to create more effective products and experiences is the fact that we are not the user.", "ko": "디자이너들이 더 효과적인 제품과 경험을 만들어 내기 위해 수용해야만 하는 단순한 진리는 우리가 ‘사용자가 아니라’는 사실이다."}, {"a": "objectively", "form": "objectively", "n": 2, "sq": 1, "sum": "to judge it [[impartially]]", "hook": "너무 가까워서 객관적으로 볼 수 없다는 문장의 objectively(객관적으로) → 요약문에서는 impartially(치우침 없이)로 바꿨어요.", "b": "impartially", "k": "객관적으로 → 치우침 없이", "en": "We're much too close to what we build to objectively see it and understand how users will interact with it.", "ko": "우리는 우리가 만드는 것에 너무 가까워서 그것을 객관적으로 보고 사용자들이 그것과 어떻게 상호 작용할지 이해할 수 없다."}, {"a": "shape", "form": "shaped", "n": 3, "sq": 2, "sum": "interfaces are [[formed]] by watching", "hook": "좋은 인터페이스는 관찰로 만들어진다는 문장의 shape(만들다) → 요약문에서는 form(형성하다)으로 바꿨어요.", "b": "form", "k": "만들다 → 형성하다", "en": "The best user interfaces are those that have been shaped by observations of real users and their interactions with them.", "ko": "가장 좋은 사용자 인터페이스들은 실제 사용자들과 그들의 그것들과의 상호 작용에 대한 관찰 결과들에 의해 만들어져 온 것들이다."}, {"a": "observation", "form": "observations", "n": 3, "sq": 2, "sum": "by [[watching]] real users", "hook": "실제 사용자에 대한 관찰이라는 문장의 observation(관찰) → 요약문에서는 watch(지켜보다)로 바꿨어요.", "b": "watch", "k": "관찰 → 지켜보다", "en": "The best user interfaces are those that have been shaped by observations of real users and their interactions with them.", "ko": "가장 좋은 사용자 인터페이스들은 실제 사용자들과 그들의 그것들과의 상호 작용에 대한 관찰 결과들에 의해 만들어져 온 것들이다."}, {"a": "incredibly", "form": "incredibly", "n": 5, "sq": 2, "sum": "an [[extremely]] useful way", "hook": "엄청나게 효과적인 방법이라는 문장의 incredibly(엄청나게) → 요약문에서는 extremely(매우)로 바꿨어요.", "b": "extremely", "k": "엄청나게 → 매우", "en": "An incredibly effective way is with usability testing.", "ko": "한 가지 엄청나게 효과적인 방법은 사용성 테스트를 가지고 하는 것이다."}, {"a": "effective", "form": "effective", "n": 5, "sq": 2, "sum": "an extremely [[useful]] way", "hook": "사용성 테스트가 효과적인 방법이라는 문장의 effective(효과적인) → 요약문에서는 useful(유용한)로 바꿨어요.", "b": "useful", "k": "효과적인 → 유용한", "en": "An incredibly effective way is with usability testing.", "ko": "한 가지 엄청나게 효과적인 방법은 사용성 테스트를 가지고 하는 것이다."}, {"a": "uncover", "form": "uncover", "n": 6, "sq": 3, "sum": "to [[find]] problems in a design", "hook": "디자인의 문제를 밝혀낸다는 문장의 uncover(밝혀내다) → 요약문에서는 find(찾아내다)로 바꿨어요.", "b": "find", "k": "밝혀내다 → 찾아내다", "en": "The goal of this method is to uncover problems in a design, discover existing opportunities, and learn more about the behaviors and preferences of users by asking participants to engage in realistic activities.", "ko": "이 방법의 목표는 참가자들이 실제적인 활동들에 참여하도록 요청함으로써 디자인상의 문제들을 밝혀 내고, 현재 있는 가능성들을 발견하고, 사용자들의 행동들과 선호하는 것들에 대해 더 많이 학습하는 것이다."}, {"a": "behavior", "form": "behaviors", "n": 6, "sq": 3, "sum": "learn about users' [[actions]]", "hook": "사용자의 행동을 배운다는 문장의 behavior(행동) → 요약문에서는 action(행동)으로 바꿨어요.", "b": "action", "k": "행동 → 행동", "en": "The goal of this method is to uncover problems in a design, discover existing opportunities, and learn more about the behaviors and preferences of users by asking participants to engage in realistic activities.", "ko": "이 방법의 목표는 참가자들이 실제적인 활동들에 참여하도록 요청함으로써 디자인상의 문제들을 밝혀 내고, 현재 있는 가능성들을 발견하고, 사용자들의 행동들과 선호하는 것들에 대해 더 많이 학습하는 것이다."}, {"a": "preference", "form": "preferences", "n": 6, "sq": 3, "sum": "actions and [[likes]]", "hook": "사용자가 선호하는 것을 배운다는 문장의 preference(선호) → 요약문에서는 like(좋아하는 것)로 바꿨어요.", "b": "like", "k": "선호 → 좋아하는 것", "en": "The goal of this method is to uncover problems in a design, discover existing opportunities, and learn more about the behaviors and preferences of users by asking participants to engage in realistic activities.", "ko": "이 방법의 목표는 참가자들이 실제적인 활동들에 참여하도록 요청함으로써 디자인상의 문제들을 밝혀 내고, 현재 있는 가능성들을 발견하고, 사용자들의 행동들과 선호하는 것들에 대해 더 많이 학습하는 것이다."}, {"a": "activity", "form": "activities", "n": 6, "sq": 3, "sum": "to do realistic [[tasks]]", "hook": "참가자에게 실제적인 활동을 시킨다는 문장의 activity(활동) → 요약문에서는 task(과제)로 바꿨어요.", "b": "task", "k": "활동 → 과제", "en": "The goal of this method is to uncover problems in a design, discover existing opportunities, and learn more about the behaviors and preferences of users by asking participants to engage in realistic activities.", "ko": "이 방법의 목표는 참가자들이 실제적인 활동들에 참여하도록 요청함으로써 디자인상의 문제들을 밝혀 내고, 현재 있는 가능성들을 발견하고, 사용자들의 행동들과 선호하는 것들에 대해 더 많이 학습하는 것이다."}, {"a": "perform", "form": "perform", "n": 7, "sq": 3, "sum": "how well a design will [[work]]", "hook": "디자인이 얼마나 잘 작동할지라는 문장의 perform(작동하다) → 요약문에서는 work(작동하다)로 바꿨어요.", "b": "work", "k": "작동하다 → 작동하다", "en": "This technique is effective for understanding how well a design will perform once it is in the hands of real users.", "ko": "이 기술은 디자인이 실제 사용자들의 손 안에 있을 때 얼마나 그것이 잘 작동할 것인지를 이해하는 데 효과적이다."}, {"a": "improve", "form": "improve", "n": 8, "sq": 4, "sum": "to [[enhance]] their work", "hook": "이 방법으로 작업을 개선한다는 문장의 improve(개선하다) → 요약문에서는 enhance(향상시키다)로 바꿨어요.", "b": "enhance", "k": "개선하다 → 향상시키다", "en": "Designers can use this method to improve their work through subsequent revisions based on the findings from representative users.", "ko": "디자이너들은 대표적인 사용자들로부터 발견한 것들에 기반한 차후의 수정들을 통해 그들의 작업물을 개선하기 위해 이 방법을 사용할 수 있다."}, {"a": "subsequent", "form": "subsequent", "n": 8, "sq": 4, "sum": "through [[later]] changes", "hook": "차후의 수정들을 통해라는 문장의 subsequent(차후의) → 요약문에서는 later(이후의)로 바꿨어요.", "b": "later", "k": "차후의 → 이후의", "en": "Designers can use this method to improve their work through subsequent revisions based on the findings from representative users.", "ko": "디자이너들은 대표적인 사용자들로부터 발견한 것들에 기반한 차후의 수정들을 통해 그들의 작업물을 개선하기 위해 이 방법을 사용할 수 있다."}, {"a": "revision", "form": "revisions", "n": 8, "sq": 4, "sum": "through later [[changes]]", "hook": "수정들을 통해 작업을 고친다는 문장의 revision(수정) → 요약문에서는 change(변화)로 바꿨어요.", "b": "change", "k": "수정 → 변화", "en": "Designers can use this method to improve their work through subsequent revisions based on the findings from representative users.", "ko": "디자이너들은 대표적인 사용자들로부터 발견한 것들에 기반한 차후의 수정들을 통해 그들의 작업물을 개선하기 위해 이 방법을 사용할 수 있다."}, {"a": "representative", "form": "representative", "n": 8, "sq": 4, "sum": "learn from [[typical]] users", "hook": "대표적인 사용자에게서 얻은 결과라는 문장의 representative(대표적인) → 요약문에서는 typical(전형적인)로 바꿨어요.", "b": "typical", "k": "대표적인 → 전형적인", "en": "Designers can use this method to improve their work through subsequent revisions based on the findings from representative users.", "ko": "디자이너들은 대표적인 사용자들로부터 발견한 것들에 기반한 차후의 수정들을 통해 그들의 작업물을 개선하기 위해 이 방법을 사용할 수 있다."}], "passage": [{"n": 1, "en": "A simple truth that designers must embrace in order to create more effective products and experiences is the fact that we are not the user.", "ko": "디자이너들이 더 효과적인 제품과 경험을 만들어 내기 위해 수용해야만 하는 단순한 진리는 우리가 ‘사용자가 아니라’는 사실이다."}, {"n": 2, "en": "We're much too close to what we build to objectively see it and understand how users will interact with it.", "ko": "우리는 우리가 만드는 것에 너무 가까워서 그것을 객관적으로 보고 사용자들이 그것과 어떻게 상호 작용할지 이해할 수 없다."}, {"n": 3, "en": "The best user interfaces are those that have been shaped by observations of real users and their interactions with them.", "ko": "가장 좋은 사용자 인터페이스들은 실제 사용자들과 그들의 그것들과의 상호 작용에 대한 관찰 결과들에 의해 만들어져 온 것들이다."}, {"n": 4, "en": "So how can designers shape their work to be more effective?", "ko": "그러면 디자이너들은 어떻게 자신의 작업이 더 효과적일 수 있도록 만들 수 있을까?"}, {"n": 5, "en": "An incredibly effective way is with usability testing.", "ko": "한 가지 엄청나게 효과적인 방법은 사용성 테스트를 가지고 하는 것이다."}, {"n": 6, "en": "The goal of this method is to uncover problems in a design, discover existing opportunities, and learn more about the behaviors and preferences of users by asking participants to engage in realistic activities.", "ko": "이 방법의 목표는 참가자들이 실제적인 활동들에 참여하도록 요청함으로써 디자인상의 문제들을 밝혀 내고, 현재 있는 가능성들을 발견하고, 사용자들의 행동들과 선호하는 것들에 대해 더 많이 학습하는 것이다."}, {"n": 7, "en": "This technique is effective for understanding how well a design will perform once it is in the hands of real users.", "ko": "이 기술은 디자인이 실제 사용자들의 손 안에 있을 때 얼마나 그것이 잘 작동할 것인지를 이해하는 데 효과적이다."}, {"n": 8, "en": "Designers can use this method to improve their work through subsequent revisions based on the findings from representative users.", "ko": "디자이너들은 대표적인 사용자들로부터 발견한 것들에 기반한 차후의 수정들을 통해 그들의 작업물을 개선하기 위해 이 방법을 사용할 수 있다."}], "questions": [{"id": 1, "summary": "Designers must accept that they and their users are (A), since designers are too close to their work to judge it (B).", "ko": "디자이너는 자신과 사용자가 <b>(A) 다르다</b>는 것을 받아들여야 하는데, 디자이너는 자기 작업에 너무 가까워서 그것을 <b>(B) 치우침 없이</b> 판단할 수 없기 때문이다.", "opts": [["different", "unfairly"], ["different", "impartially"], ["alike", "impartially"], ["alike", "unfairly"], ["identical", "quickly"]], "optko": ["다른 – 불공정하게", "다른 – 치우침 없이", "비슷한 – 치우침 없이", "비슷한 – 불공정하게", "똑같은 – 빨리"], "ans": 1, "wrong": ["unfairly(불공정하게)가 틀려요. 너무 가까워서 할 수 없는 건 객관적으로(objectively), 곧 치우침 없이(impartially) 보는 일이에요.", null, "alike(비슷한)가 틀려요. 본문은 '우리(디자이너)는 사용자가 아니다'라고 해요. 디자이너와 사용자는 다른 사람이에요.", "둘 다 틀려요. 디자이너와 사용자는 비슷한 게 아니라 다르고, 너무 가까워서 못 하는 건 불공정한 판단이 아니라 객관적인 판단이에요.", "둘 다 틀려요. 디자이너와 사용자는 똑같은(identical) 게 아니라 다르고, 본문은 빨리(quickly) 판단하는 게 아니라 객관적으로 보는 걸 말해요."], "evid": [{"n": 1, "hl": ["A simple truth that designers must embrace", "we are not the user"]}, {"n": 2, "hl": ["much too close to what we build to objectively see it"]}], "swaps": [["embrace", "accept", "수용하다 → 받아들이다"], ["objectively", "impartially", "객관적으로 → 치우침 없이"], ["we are not the user", "different", "우리는 사용자가 아니다 → 다르다"]], "swapnote": "embrace(수용하다)는 accept(받아들이다)로, objectively(객관적으로)는 impartially(치우침 없이)로 바뀌었어요. 우리는 사용자가 아니다 = 디자이너와 사용자는 다르다(different)로 읽어요.", "use": [{"w": "different", "ex": "My brother and I are very different.", "ko": "형과 나는 매우 다르다.", "wk": "다른", "hk": "다르다"}, {"w": "impartially", "ex": "A judge must decide impartially.", "ko": "판사는 치우침 없이 판결해야 한다.", "wk": "치우침 없이, 공정하게", "hk": "치우침 없이"}], "flow": "본문 1번에서 디자이너가 받아들여야 할 단순한 진리는 우리가 사용자가 아니라는 사실이라고 하고, 2번에서 그 이유로 우리는 만든 것에 너무 가까워서 객관적으로 볼 수 없다고 설명해요.", "jd": [["Designers must accept", "디자이너는 받아들여야 한다"], ["that they and their users are [[different]],", "자신과 사용자가 [[다르다]]는 것을,"], ["since designers are too close to their work", "디자이너는 자기 작업에 너무 가깝기 때문이다"], ["to judge it [[impartially]].", "그것을 [[치우침 없이]] 판단하기에는."]], "fc": [["본문 1번", "우리는 사용자가 아니다", "디자이너가 {{embrace|수용해야}} 할 단순한 {{truth|진리}}는 우리가 사용자가 아니라는 사실이에요."], ["본문 2번", "너무 가까워서 객관적으로 못 본다", "만든 것에 너무 가까워서 {{objectively|객관적으로}} 볼 수 없어요."], ["정답 포인트", "{{embrace|수용하다}} = {{accept|받아들이다}}, {{objectively|객관적으로}} = {{impartially|치우침 없이}}", "사용자가 아니다 = 사용자와 다르다로 읽어요."]], "evid_full": [{"en": "A simple truth that designers must embrace in order to create more effective products and experiences is the fact that we are not the user.", "ko": "디자이너들이 더 효과적인 제품과 경험을 만들어 내기 위해 수용해야만 하는 단순한 진리는 우리가 ‘사용자가 아니라’는 사실이다.", "hl": ["A simple truth that designers must embrace", "we are not the user"], "hlko": ["수용해야만 하는 단순한 진리", "우리가 ‘사용자가 아니라’는 사실"], "n": 1}, {"en": "We're much too close to what we build to objectively see it and understand how users will interact with it.", "ko": "우리는 우리가 만드는 것에 너무 가까워서 그것을 객관적으로 보고 사용자들이 그것과 어떻게 상호 작용할지 이해할 수 없다.", "hl": ["much too close to what we build to objectively see it"], "hlko": ["우리가 만드는 것에 너무 가까워서 그것을 객관적으로 보고"], "n": 2}]}, {"id": 2, "summary": "The best user interfaces are (A) by watching real users, and usability testing is an extremely (B) way to make designs better.", "ko": "가장 좋은 사용자 인터페이스는 실제 사용자를 지켜보는 것으로 <b>(A) 만들어지고</b>, 사용성 테스트는 디자인을 더 좋게 만드는 매우 <b>(B) 유용한</b> 방법이다.", "opts": [["formed", "useless"], ["hidden", "useful"], ["formed", "useful"], ["hidden", "useless"], ["ruined", "costly"]], "optko": ["만들어지다 – 쓸모없는", "숨겨지다 – 유용한", "만들어지다 – 유용한", "숨겨지다 – 쓸모없는", "망쳐지다 – 비용이 많이 드는"], "ans": 2, "wrong": ["useless(쓸모없는)가 틀려요. 본문은 사용성 테스트가 엄청나게 효과적인(effective) 방법이라고 해요.", "hidden(숨겨지다)이 틀려요. 가장 좋은 인터페이스는 실제 사용자 관찰로 만들어져요(shaped). 숨겨지는 게 아니에요.", null, "둘 다 틀려요. 좋은 인터페이스는 관찰로 숨겨지는 게 아니라 만들어지고, 사용성 테스트는 쓸모없는 게 아니라 효과적인 방법이에요.", "둘 다 틀려요. 좋은 인터페이스는 관찰로 망쳐지는(ruin) 게 아니라 만들어지고, 비용이 많이 든다(costly)는 말은 본문에 없어요. 본문은 효과적인 방법이라고 해요."], "evid": [{"n": 3, "hl": ["shaped by observations of real users"]}, {"n": 5, "hl": ["An incredibly effective way is with usability testing"]}], "swaps": [["shape", "form", "만들다 → 형성하다"], ["observation", "watch", "관찰 → 지켜보다"], ["incredibly", "extremely", "엄청나게 → 매우"], ["effective", "useful", "효과적인 → 유용한"]], "swapnote": "shape(만들다)는 form(형성하다)으로, observation(관찰)은 watch(지켜보다)로, incredibly(엄청나게)는 extremely(매우)로, effective(효과적인)는 useful(유용한)로 바뀌었어요.", "use": [{"w": "form", "ex": "Good habits are formed by practice.", "ko": "좋은 습관은 연습으로 만들어진다.", "wk": "만들다, 형성하다", "hk": "만들어진다"}, {"w": "useful", "ex": "This map is very useful.", "ko": "이 지도는 매우 유용하다.", "wk": "유용한", "hk": "유용하다"}], "flow": "본문 3번에서 가장 좋은 인터페이스는 실제 사용자를 관찰해서 만들어진다고 하고, 4번에서 그럼 어떻게 하면 되냐고 묻고, 5번에서 엄청나게 효과적인 방법이 사용성 테스트라고 답해요.", "jd": [["The best user interfaces are [[formed]]", "가장 좋은 사용자 인터페이스는 [[만들어진다]]"], ["by watching real users,", "실제 사용자를 지켜보는 것으로,"], ["and usability testing is an extremely [[useful]] way", "그리고 사용성 테스트는 매우 [[유용한]] 방법이다"], ["to make designs better.", "디자인을 더 좋게 만드는."]], "fc": [["본문 3번", "좋은 인터페이스는 관찰로 만들어진다", "가장 좋은 {{interface|인터페이스}}는 실제 사용자에 대한 {{observation|관찰}}로 {{shaped|만들어져요}}."], ["본문 4~5번", "그 방법은 사용성 테스트", "{{incredibly|엄청나게}} {{effective|효과적인}} 방법은 {{usability|사용성}} 테스트예요."], ["정답 포인트", "{{shape|만들다}} = {{form|형성하다}}, {{effective|효과적인}} = {{useful|유용한}}", "같은 뜻의 다른 단어예요."]], "evid_full": [{"en": "The best user interfaces are those that have been shaped by observations of real users and their interactions with them.", "ko": "가장 좋은 사용자 인터페이스들은 실제 사용자들과 그들의 그것들과의 상호 작용에 대한 관찰 결과들에 의해 만들어져 온 것들이다.", "hl": ["shaped by observations of real users"], "hlko": ["실제 사용자들과 그들의 그것들과의 상호 작용에 대한 관찰 결과들에 의해 만들어져 온"], "n": 3}, {"en": "An incredibly effective way is with usability testing.", "ko": "한 가지 엄청나게 효과적인 방법은 사용성 테스트를 가지고 하는 것이다.", "hl": ["An incredibly effective way is with usability testing"], "hlko": ["한 가지 엄청나게 효과적인 방법은 사용성 테스트를 가지고 하는 것이다"], "n": 5}]}, {"id": 3, "summary": "Usability testing asks participants to do realistic tasks to (A) problems in a design and learn about users' actions and likes, and it shows how well a design will (B) in the hands of real users.", "ko": "사용성 테스트는 참가자에게 실제적인 과제를 하게 해서 디자인의 문제를 <b>(A) 찾아내고</b> 사용자의 행동과 좋아하는 것을 알아내며, 디자인이 실제 사용자의 손에서 얼마나 잘 <b>(B) 작동할지</b> 보여 준다.", "opts": [["find", "sell"], ["ignore", "work"], ["ignore", "sell"], ["create", "shrink"], ["find", "work"]], "optko": ["찾아내다 – 팔리다", "무시하다 – 작동하다", "무시하다 – 팔리다", "만들어 내다 – 줄어들다", "찾아내다 – 작동하다"], "ans": 4, "wrong": ["sell(팔리다)이 틀려요. 본문은 디자인이 실제 사용자의 손에서 얼마나 잘 작동할지(perform)를 이해하는 데 효과적이라고 해요. 판매 이야기는 없어요.", "ignore(무시하다)가 틀려요. 이 방법의 목표는 디자인의 문제를 밝혀내는(uncover) 거예요. 문제를 무시하는 게 아니에요.", "둘 다 틀려요. 문제를 무시하는 게 아니라 밝혀내고, 얼마나 잘 팔릴지가 아니라 얼마나 잘 작동할지를 알아봐요.", "둘 다 틀려요. 문제를 만들어 내는(create) 게 아니라 밝혀내고, 디자인이 줄어드는(shrink) 이야기는 없어요. 얼마나 잘 작동할지를 알아봐요.", null], "evid": [{"n": 6, "hl": ["to uncover problems in a design", "the behaviors and preferences of users", "by asking participants to engage in realistic activities"]}, {"n": 7, "hl": ["how well a design will perform once it is in the hands of real users"]}], "swaps": [["uncover", "find", "밝혀내다 → 찾아내다"], ["behavior", "action", "행동 → 행동"], ["preference", "like", "선호 → 좋아하는 것"], ["activity", "task", "활동 → 과제"], ["perform", "work", "작동하다 → 작동하다"]], "swapnote": "uncover(밝혀내다)는 find(찾아내다)로, behavior(행동)는 action(행동)으로, preference(선호)는 like(좋아하는 것)로, activity(활동)는 task(과제)로, perform(작동하다)은 work(작동하다)로 바뀌었어요.", "use": [{"w": "find", "ex": "Can you find the mistakes in this letter?", "ko": "이 편지에서 실수를 찾아낼 수 있니?", "wk": "찾아내다", "hk": "찾아낼"}, {"w": "work", "ex": "This old phone still works well.", "ko": "이 오래된 전화기는 아직도 잘 작동한다.", "wk": "작동하다", "hk": "작동한다"}], "flow": "본문 6번에서 사용성 테스트는 참가자에게 실제적인 활동을 시켜 문제를 밝혀내고 사용자의 행동과 선호를 배우는 게 목표라고 하고, 7번에서 실제 사용자 손에서 디자인이 얼마나 잘 작동할지 이해하는 데 효과적이라고 이어요.", "jd": [["Usability testing asks participants to do realistic tasks", "사용성 테스트는 참가자에게 실제적인 과제를 하라고 요청한다"], ["to [[find]] problems in a design", "디자인의 문제를 [[찾아내고]]"], ["and learn about users' actions and likes,", "사용자의 행동과 좋아하는 것을 알아내기 위해,"], ["and it shows", "그리고 그것은 보여 준다"], ["how well a design will [[work]]", "디자인이 얼마나 잘 [[작동할지]]"], ["in the hands of real users.", "실제 사용자의 손에서."]], "fc": [["본문 6번", "문제를 밝혀내고 사용자를 배운다", "{{realistic|실제적인}} 활동으로 문제를 {{uncover|밝혀내고}} 사용자의 {{behavior|행동}}과 {{preference|선호}}를 배워요."], ["본문 7번", "실제 사용자 손에서 얼마나 잘 작동할지", "디자인이 실제 사용자 손에서 얼마나 잘 {{perform|작동할지}} 알 수 있어요."], ["정답 포인트", "{{uncover|밝혀내다}} = {{find|찾아내다}}, {{perform|작동하다}} = {{work|작동하다}}", "같은 뜻의 다른 단어예요."]], "evid_full": [{"en": "The goal of this method is to uncover problems in a design, discover existing opportunities, and learn more about the behaviors and preferences of users by asking participants to engage in realistic activities.", "ko": "이 방법의 목표는 참가자들이 실제적인 활동들에 참여하도록 요청함으로써 디자인상의 문제들을 밝혀 내고, 현재 있는 가능성들을 발견하고, 사용자들의 행동들과 선호하는 것들에 대해 더 많이 학습하는 것이다.", "hl": ["to uncover problems in a design", "the behaviors and preferences of users", "by asking participants to engage in realistic activities"], "hlko": ["디자인상의 문제들을 밝혀 내고", "사용자들의 행동들과 선호하는 것들", "참가자들이 실제적인 활동들에 참여하도록 요청함으로써"], "n": 6}, {"en": "This technique is effective for function words(t){

   +'<div class="rleg"><span><i style="border-color:#2f5d50"></i>바꿔 쓸 수 있는 말</span>'+(r.a.length?'<span><i style="border-color:#c0392b"></i>반대말</span>':'')+'</div>'
   +'<div class="pit"><div><em>본문</em>'+r.bj+'</div><div><em>요약문</em><b>'+esc(s.b)+'</b>('+esc(String(s.k).split(' → ')[1]||'')+')로 바뀜</div>'+(r.tr?'<div class="tp"><em>함정</em>'+esc(r.tr)+'</div>':'')+'</div></div>';
  return h;
}
function vSw(){
  var L=swList(),sc={};
  (DATA.scenes||[]).forEach(function(c){(c.line.match(/\[\[\w+\|/g)||[]).forEach(function(m){sc[m.slice(2,-1).toLowerCase()]=c})});
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">바꿔 말하기 '+L.length+'개</span></div>';
  h+='<p class="hint">왼쪽 단어가 요약문에서 어떤 말로 바뀔까요? <b>소리 내어 말해 본 뒤</b> 확인을 눌러요.</p>';
  h+='<div class="tabs"><button data-a="rvall" data-v="open">모두 열기</button><button data-a="rvall" data-v="hide">모두 가리기</button><button data-a="staronly" class="'+(swStarOnly?'on':'')+'">별표만 '+Object.keys(STAR).length+'</button></div><div class="card">';
  if(swStarOnly)L=L.filter(function(s){return STAR[s.id]});
  if(!L.length)h+='<div class="empty">별표 친 단어가 없어요. 안 외워지는 단어에 별표를 눌러 두세요.</div>';
  L.forEach(function(s){
    var o=swOpen[s.id],c=sc[s.form.toLowerCase()],on=swD['s'+s.id],fl=wrongOf(s.id);
    h+='<div class="swr"><div class="swq"><span class="qn">'+s.sq+'번</span><span class="sa">'+words(s.a)+(fl?'<small class="flag">'+fl+'번 틀림</small>':'')+'</span><span class="sb">'+(o?'<em>'+words(s.b)+'</em>'+esc(s.k):'→ ?')+'</span>'+sayBtn(s.a,'듣기')+(o?sayBtn(s.b,'정답 듣기'):'')+'<button data-a="rv" data-v="'+esc(s.id)+'">'+(o?'가리기':'확인')+'</button><button data-a="star" data-v="'+esc(s.id)+'" class="stb'+(STAR[s.id]?' on':'')+'">별표</button></div>';
    if(o)h+=relBox(s);else if(REL[String(s.a).toLowerCase()]){var rr=REL[String(s.a).toLowerCase()];h+='<div class="hch">유 '+(1+rr.s.length)+(rr.a.length?' · 반 '+rr.a.length:'')+'</div>'}
    if(c&&!REL[String(s.a).toLowerCase()])h+='<button class="acc2" data-a="dt" data-v="s'+esc(s.id)+'">'+esc(c.tag)+' 줄거리<span>'+(on?'접기':'펼치기')+'</span></button>'+(on?'<div class="story">'+sceneLine(c.line,s.form)+'</div>':'');
    h+='</div>';
  });
  return h+'</div><p class="sumline">시험에서는 본문 단어가 뜻이 같은 다른 단어로 바뀌어 나와요.</p><button class="btn sec" data-a="home">목록으로</button>';
}
/* 자동 새로고침(기록 연동)이 일어나도 보던 문제로 되돌린다 */
try{var sv=JSON.parse(sessionStorage.getItem('vhyv')||'null');if(sv&&sv.p===location.pathname&&Date.now()-sv.t<600000&&sv.v&&sv.v!=='home'){view=sv.v;cur=sv.c||0;try{history.pushState({v:view},'');histPushed=true}catch(e){}}}catch(e){}
render();srvLoad();window.addEventListener('pageshow',srvLoad);
</script>
