var DATA={"meta": {"sch": "jusung-go2", "src": "common/sx-data-2610g2.js", "dir": "mock", "pidx": 16, "lesson": "26년 10월 41번", "title": "", "label": "", "page": "yoyak-2610-41"}, "scenes": [{"tag": "본문 1~2번", "ns": [1, 2], "line": "무료함을 [[adequately|적절하게]] [[addressed|다루지]] 않으면 해로운 감정이 생기고, 재미에만 [[dependent|의존하게]] 된다.", "en": ["It is crucial to recognize that boredom can give rise to harmful emotions such as depression, despair, and irritation if not adequately addressed.", "When we believe that the only way to be happy is by searching for fun activities, then we become dependent on those activities, and negative thoughts and emotions arise."], "kos": ["무료함이 적절하게 다뤄지지 않는다면 우울, 낙담, 그리고 짜증과 같은 해로운 감정들을 발생시킬 수 있다는 것을 인식하는 것은 중요하다.", "우리가 행복해지는 유일한 방법이 재미있는 활동들을 찾는 것에 의해서만이라고 믿으면, 그때 우리는 그러한 활동들에 의존하게 되고, 부정적인 생각들과 감정들이 생긴다."]}, {"tag": "본문 3~4번", "ns": [3, 4], "line": "시간이 많으면 [[troubling|문제를 일으키는]] 생각으로 채울 수 있으니, 자기 [[improvement|개선]]의 시간으로 보자.", "en": ["It is suggested that ‘Idle time is the devil’s workshop’ implies that those with too much time on their hands may fill that time with troubling thoughts and behavior.", "The balance is to not see it as idle time, wasted time, or boredom but rather as a perfect time for self-improvement, self-identification, and positive reflection time."], "kos": ["‘아무것도 안 하는 시간은 악마의 작업장이다’라는 것은 자신의 손에 너무 많은 시간을 가진 사람들이 그 시간을 문제를 일으키는 생각들과 행동으로 채울 수 있다는 것을 암시한다고 일컬어진다.", "균형점은 그것을 아무것도 안 하는 시간, 낭비된 시간, 또는 무료함으로 보는 것이 아니라, 오히려 자기 개선, 자기 발견, 그리고 긍정적인 성찰 시간을 위한 완벽한 시간으로 보는 것이다."]}, {"tag": "본문 5~6번", "ns": [5, 6], "line": "무료할 수 있다는 건 안전하다는 뜻이라 행운이다.", "en": ["Reflecting, just how lucky are we to be bored?", "Boredom doesn’t exist in the presence of danger, as it is only an indulgence pastime in a safe zone."], "kos": ["곰곰이 생각해 보면 우리가 무료할 수 있어서 정말 얼마나 행운인가?", "무료함은 위험이 존재하는 곳에서는 존재하지 않는데, 왜냐하면 그것이 단지 안전지대 안에서의 탐닉 활동이기 때문이다."]}, {"tag": "본문 7~8번", "ns": [7, 8], "line": "무료함은 안전할 때 누리는 [[luxury|사치]]이고, 위험한 상황에서는 누릴 수 없다.", "en": ["Boredom can be perceived as a luxury that typically manifests in safe and inactive situations, providing an occasion to appreciate and comprehend the environment.", "In hazardous circumstances, the luxury of boredom is unavailable."], "kos": ["무료함은 안전하고 할 일이 없는 상황들에서 전형적으로 나타나는 사치로 인식될 수 있으며, 환경을 인식하고 이해할 기회를 제공한다.", "위험한 상황들에서, 무료함이라는 사치는 손에 넣을 수 없다."]}, {"tag": "본문 9~11번", "ns": [9, 10, 11], "line": "그러니 한가한 순간을 성찰에 쓰고, 개인적 [[development|발달]]의 기회로 여겨야 한다.", "en": ["Thus, it is paramount to utilize idle moments for profound self-reflection.", "It represents an occasion to listen, observe, and appreciate before expressing.", "Rather than viewing boredom as unproductive, it should be regarded as an opportunity for personal development and constructive contemplation."], "kos": ["따라서, 심오한 자기 성찰을 위해 아무것도 안 하는 순간들을 활용하는 것은 가장 중요하다.", "그것은 표현하기 전에 경청하고, 관찰하고, 그리고 인식할 기회를 의미한다.", "무료함을 비생산적이라고 여기기보다, 그것은 개인적 발달과 건설적인 사유를 위한 기회로 여겨져야 한다."]}], "story": [{"a": "adequately", "form": "adequately", "n": 1, "sq": 1, "sum": "is not [[properly]] handled", "hook": "적절하게 다뤄지지 않으면이라는 문장의 adequately(적절하게) → 요약문에서는 properly(제대로)로 바꿨어요.", "b": "properly", "k": "적절하게 → 제대로", "en": "It is crucial to recognize that boredom can give rise to harmful emotions such as depression, despair, and irritation if not adequately addressed.", "ko": "무료함이 적절하게 다뤄지지 않는다면 우울, 낙담, 그리고 짜증과 같은 해로운 감정들을 발생시킬 수 있다는 것을 인식하는 것은 중요하다."}, {"a": "address", "form": "addressed", "n": 1, "sq": 1, "sum": "not properly [[handled]]", "hook": "다뤄지지 않으면이라는 문장의 addressed(다뤄진) → 요약문에서는 handled(처리된)로 바꿨어요.", "b": "handle", "k": "다루다 → 다루다", "en": "It is crucial to recognize that boredom can give rise to harmful emotions such as depression, despair, and irritation if not adequately addressed.", "ko": "무료함이 적절하게 다뤄지지 않는다면 우울, 낙담, 그리고 짜증과 같은 해로운 감정들을 발생시킬 수 있다는 것을 인식하는 것은 중요하다."}, {"a": "dependent", "form": "dependent", "n": 2, "sq": 1, "sum": "become [[reliant]] on them", "hook": "그 활동에 의존하게 된다는 문장의 dependent(의존하는) → 요약문에서는 reliant(의존하는)로 바꿨어요.", "b": "reliant", "k": "의존하는 → 의존하는", "en": "When we believe that the only way to be happy is by searching for fun activities, then we become dependent on those activities, and negative thoughts and emotions arise.", "ko": "우리가 행복해지는 유일한 방법이 재미있는 활동들을 찾는 것에 의해서만이라고 믿으면, 그때 우리는 그러한 활동들에 의존하게 되고, 부정적인 생각들과 감정들이 생긴다."}, {"a": "troubling", "form": "troubling", "n": 3, "sq": 2, "sum": "fill it with [[worrying]] thoughts", "hook": "문제를 일으키는 생각과 행동으로 채운다는 문장의 troubling(문제를 일으키는) → 요약문에서는 worrying(걱정스러운)으로 바꿨어요.", "b": "worrying", "k": "문제를 일으키는 → 걱정스러운", "en": "It is suggested that ‘Idle time is the devil’s workshop’ implies that those with too much time on their hands may fill that time with troubling thoughts and behavior.", "ko": "‘아무것도 안 하는 시간은 악마의 작업장이다’라는 것은 자신의 손에 너무 많은 시간을 가진 사람들이 그 시간을 문제를 일으키는 생각들과 행동으로 채울 수 있다는 것을 암시한다고 일컬어진다."}, {"a": "improvement", "form": "improvement", "n": 4, "sq": 2, "sum": "self-[[growth]]", "hook": "자기 개선의 완벽한 시간이라는 문장의 improvement(개선) → 요약문에서는 growth(성장)로 바꿨어요.", "b": "growth", "k": "개선 → 성장", "en": "The balance is to not see it as idle time, wasted time, or boredom but rather as a perfect time for self-improvement, self-identification, and positive reflection time.", "ko": "균형점은 그것을 아무것도 안 하는 시간, 낭비된 시간, 또는 무료함으로 보는 것이 아니라, 오히려 자기 개선, 자기 발견, 그리고 긍정적인 성찰 시간을 위한 완벽한 시간으로 보는 것이다."}, {"a": "luxury", "form": "luxury", "n": 7, "sq": 3, "sum": "Boredom is a [[privilege]]", "hook": "안전한 상황에서 나타나는 사치라는 문장의 luxury(사치) → 요약문에서는 privilege(특권)로 바꿨어요.", "b": "privilege", "k": "사치 → 특권", "en": "Boredom can be perceived as a luxury that typically manifests in safe and inactive situations, providing an occasion to appreciate and comprehend the environment.", "ko": "무료함은 안전하고 할 일이 없는 상황들에서 전형적으로 나타나는 사치로 인식될 수 있으며, 환경을 인식하고 이해할 기회를 제공한다."}, {"a": "development", "form": "development", "n": 11, "sq": 3, "sum": "personal [[progress]]", "hook": "개인적 발달의 기회라는 문장의 development(발달) → 요약문에서는 progress(발전)로 바꿨어요.", "b": "progress", "k": "발달 → 발전", "en": "Rather than viewing boredom as unproductive, it should be regarded as an opportunity for personal development and constructive contemplation.", "ko": "무료함을 비생산적이라고 여기기보다, 그것은 개인적 발달과 건설적인 사유를 위한 기회로 여겨져야 한다."}], "passage": [{"n": 1, "en": "It is crucial to recognize that boredom can give rise to harmful emotions such as depression, despair, and irritation if not adequately addressed.", "ko": "무료함이 적절하게 다뤄지지 않는다면 우울, 낙담, 그리고 짜증과 같은 해로운 감정들을 발생시킬 수 있다는 것을 인식하는 것은 중요하다."}, {"n": 2, "en": "When we believe that the only way to be happy is by searching for fun activities, then we become dependent on those activities, and negative thoughts and emotions arise.", "ko": "우리가 행복해지는 유일한 방법이 재미있는 활동들을 찾는 것에 의해서만이라고 믿으면, 그때 우리는 그러한 활동들에 의존하게 되고, 부정적인 생각들과 감정들이 생긴다."}, {"n": 3, "en": "It is suggested that ‘Idle time is the devil’s workshop’ implies that those with too much time on their hands may fill that time with troubling thoughts and behavior.", "ko": "‘아무것도 안 하는 시간은 악마의 작업장이다’라는 것은 자신의 손에 너무 많은 시간을 가진 사람들이 그 시간을 문제를 일으키는 생각들과 행동으로 채울 수 있다는 것을 암시한다고 일컬어진다."}, {"n": 4, "en": "The balance is to not see it as idle time, wasted time, or boredom but rather as a perfect time for self-improvement, self-identification, and positive reflection time.", "ko": "균형점은 그것을 아무것도 안 하는 시간, 낭비된 시간, 또는 무료함으로 보는 것이 아니라, 오히려 자기 개선, 자기 발견, 그리고 긍정적인 성찰 시간을 위한 완벽한 시간으로 보는 것이다."}, {"n": 5, "en": "Reflecting, just how lucky are we to be bored?", "ko": "곰곰이 생각해 보면 우리가 무료할 수 있어서 정말 얼마나 행운인가?"}, {"n": 6, "en": "Boredom doesn’t exist in the presence of danger, as it is only an indulgence pastime in a safe zone.", "ko": "무료함은 위험이 존재하는 곳에서는 존재하지 않는데, 왜냐하면 그것이 단지 안전지대 안에서의 탐닉 활동이기 때문이다."}, {"n": 7, "en": "Boredom can be perceived as a luxury that typically manifests in safe and inactive situations, providing an occasion to appreciate and comprehend the environment.", "ko": "무료함은 안전하고 할 일이 없는 상황들에서 전형적으로 나타나는 사치로 인식될 수 있으며, 환경을 인식하고 이해할 기회를 제공한다."}, {"n": 8, "en": "In hazardous circumstances, the luxury of boredom is unavailable.", "ko": "위험한 상황들에서, 무료함이라는 사치는 손에 넣을 수 없다."}, {"n": 9, "en": "Thus, it is paramount to utilize idle moments for profound self-reflection.", "ko": "따라서, 심오한 자기 성찰을 위해 아무것도 안 하는 순간들을 활용하는 것은 가장 중요하다."}, {"n": 10, "en": "It represents an occasion to listen, observe, and appreciate before expressing.", "ko": "그것은 표현하기 전에 경청하고, 관찰하고, 그리고 인식할 기회를 의미한다."}, {"n": 11, "en": "Rather than viewing boredom as unproductive, it should be regarded as an opportunity for personal development and constructive contemplation.", "ko": "무료함을 비생산적이라고 여기기보다, 그것은 개인적 발달과 건설적인 사유를 위한 기회로 여겨져야 한다."}], "questions": [{"id": 1, "summary": "Boredom can cause harmful emotions if it is not (A) handled, and people who think fun activities are the only way to be happy become (B) on them.", "ko": "무료함이 <b>(A) 제대로</b> 다뤄지지 않으면 해로운 감정을 일으킬 수 있고, 재미있는 활동이 행복해지는 유일한 길이라고 생각하는 사람은 그것들에 <b>(B) 의존하게</b> 된다.", "opts": [["properly", "free"], ["badly", "reliant"], ["properly", "reliant"], ["badly", "free"], ["quickly", "tired"]], "optko": ["제대로 – 자유로운", "형편없이 – 의존하는", "제대로 – 의존하는", "형편없이 – 자유로운", "빠르게 – 피곤한"], "ans": 2, "wrong": ["free(자유로운)가 틀려요. 본문은 재미있는 활동만이 행복의 길이라 믿으면 그 활동들에 의존하게 된다(dependent)고 해요.", "badly(형편없이)가 틀려요. '형편없이 다뤄지지 않으면'은 본문과 달라요. 본문은 적절하게 다뤄지지 않으면(not adequately addressed) 해로운 감정이 생긴다고 해요.", null, "둘 다 틀려요. 무료함은 적절히 다뤄져야 하고, 재미에 의존하게 되는 것이지 자유로워지는 게 아니에요.", "둘 다 틀려요. 빠르게(quickly)나 피곤한(tired)을 말하는 글이 아니에요. 핵심은 적절한 대처와 활동에 대한 의존이에요."], "evid": [{"n": 1, "hl": ["if not adequately addressed"]}, {"n": 2, "hl": ["we become dependent on those activities"]}], "swaps": [["adequately", "properly", "적절하게 → 제대로"], ["address", "handle", "다루다 → 다루다"], ["dependent", "reliant", "의존하는 → 의존하는"]], "swapnote": "adequately(적절하게)는 properly(제대로)로, address(다루다)는 handle(다루다)로, dependent(의존하는)는 reliant(의존하는)로 바뀌었어요. 어려운 단어가 쉬운 단어로 바뀐 거예요.", "use": [{"w": "properly", "ex": "Please wash your hands properly.", "ko": "손을 제대로 씻어 주세요.", "wk": "제대로, 적절하게", "hk": "제대로"}, {"w": "reliant", "ex": "Kids are reliant on their parents.", "ko": "아이들은 부모에게 의존한다.", "wk": "의존하는", "hk": "의존한다"}], "flow": "본문 1번에서 무료함이 적절히 다뤄지지 않으면 우울, 낙담, 짜증 같은 해로운 감정이 생긴다고 하고, 2번에서 재미있는 활동만이 행복의 길이라 믿으면 그 활동에 의존하게 된다고 해요.", "jd": [["Boredom can cause harmful emotions", "무료함은 해로운 감정을 일으킬 수 있다"], ["if it is not [[properly]] handled,", "그것이 [[제대로]] 다뤄지지 않으면,"], ["and people who think fun activities are the only way to be happy", "그리고 재미있는 활동이 행복해지는 유일한 길이라고 생각하는 사람은"], ["become [[reliant]] on them.", "그것들에 [[의존하게]] 된다."]], "fc": [["본문 1번", "적절히 다루지 않으면", "무료함을 {{adequately|적절하게}} 다루지 않으면 {{harmful|해로운}} 감정이 생겨요."], ["본문 2번", "재미에만 의존하게 된다", "재미있는 활동만 찾으면 그 활동에 {{dependent|의존하는}} 상태가 돼요."], ["정답 포인트", "{{adequately|적절하게}} = {{properly|제대로}}, {{dependent|의존하는}} = {{reliant|의존하는}}", "본문 단어가 쉬운 말로 바뀌어 나와요."]], "evid_full": [{"en": "It is crucial to recognize that boredom can give rise to harmful emotions such as depression, despair, and irritation if not adequately addressed.", "ko": "무료함이 적절하게 다뤄지지 않는다면 우울, 낙담, 그리고 짜증과 같은 해로운 감정들을 발생시킬 수 있다는 것을 인식하는 것은 중요하다.", "hl": ["if not adequately addressed"], "hlko": ["적절하게 다뤄지지 않는다면"], "n": 1}, {"en": "When we believe that the only way to be happy is by searching for fun activities, then we become dependent on those activities, and negative thoughts and emotions arise.", "ko": "우리가 행복해지는 유일한 방법이 재미있는 활동들을 찾는 것에 의해서만이라고 믿으면, 그때 우리는 그러한 활동들에 의존하게 되고, 부정적인 생각들과 감정들이 생긴다.", "hl": ["we become dependent on those activities"], "hlko": ["우리는 그러한 활동들에 의존하게 되고"], "n": 2}]}, {"id": 2, "summary": "People with too much free time may fill it with (A) thoughts, so we should see boredom as a good chance for self-(B).", "ko": "시간이 너무 많은 사람은 그 시간을 <b>(A) 걱정스러운</b> 생각으로 채울 수 있으므로, 무료함을 자기 <b>(B) 성장</b>의 좋은 기회로 보아야 한다.", "opts": [["worrying", "loss"], ["pleasant", "growth"], ["pleasant", "loss"], ["funny", "waste"], ["worrying", "growth"]], "optko": ["걱정스러운 – 손실", "즐거운 – 성장", "즐거운 – 손실", "웃긴 – 낭비", "걱정스러운 – 성장"], "ans": 4, "wrong": ["loss(손실)가 틀려요. 본문은 아무것도 안 하는 시간을 자기 개선(self-improvement)의 완벽한 시간으로 보라고 해요.", "pleasant(즐거운)가 틀려요. 시간이 많은 사람은 문제를 일으키는(troubling) 생각과 행동으로 시간을 채울 수 있다고 해요.", "둘 다 틀려요. 생각은 즐거운 게 아니라 문제를 일으키는 것이고, 시간은 손실이 아니라 자기 개선의 기회예요.", "둘 다 틀려요. 웃긴(funny) 생각도 아니고, 시간을 낭비(waste)로 보지 말라는 게 본문의 요지예요.", null], "evid": [{"n": 3, "hl": ["fill that time with troubling thoughts and behavior"]}, {"n": 4, "hl": ["a perfect time for self-improvement"]}], "swaps": [["troubling", "worrying", "문제를 일으키는 → 걱정스러운"], ["improvement", "growth", "개선 → 성장"]], "swapnote": "troubling(문제를 일으키는)은 worrying(걱정스러운)으로, improvement(개선)는 growth(성장)로 바뀌었어요. 자기 개선 = 자기 성장으로 읽어요.", "use": [{"w": "worrying", "ex": "That is a worrying sign.", "ko": "그것은 걱정스러운 신호다.", "wk": "걱정스러운", "hk": "걱정스러운"}, {"w": "growth", "ex": "Plants need sun for growth.", "ko": "식물은 성장을 위해 햇빛이 필요하다.", "wk": "성장", "hk": "성장"}], "flow": "본문 3번에서 시간이 너무 많은 사람은 그 시간을 문제를 일으키는 생각과 행동으로 채울 수 있다고 하고, 4번에서 균형점은 그 시간을 낭비로 보지 않고 자기 개선과 긍정적 성찰의 시간으로 보는 것이라고 해요.", "jd": [["People with too much free time", "시간이 너무 많은 사람은"], ["may fill it with [[worrying]] thoughts,", "그 시간을 [[걱정스러운]] 생각으로 채울 수 있으므로,"], ["so we should see boredom", "우리는 무료함을 보아야 한다"], ["as a good chance for self-[[growth]].", "자기 [[성장]]의 좋은 기회로."]], "fc": [["본문 3번", "시간이 많으면 나쁜 생각", "{{idle|아무것도 안 하는}} 시간은 {{troubling|문제를 일으키는}} 생각으로 채워질 수 있어요."], ["본문 4번", "균형점은 자기 개선의 시간", "무료함을 {{improvement|개선}}과 성찰의 시간으로 봐요."], ["정답 포인트", "{{troubling|문제를 일으키는}} = {{worrying|걱정스러운}}, {{improvement|개선}} = {{growth|성장}}", "같은 뜻의 다른 단어예요."]], "evid_full": [{"en": "It is suggested that ‘Idle time is the devil’s workshop’ implies that those with too much time on their hands may fill that time with troubling thoughts and behavior.", "ko": "‘아무것도 안 하는 시간은 악마의 작업장이다’라는 것은 자신의 손에 너무 많은 시간을 가진 사람들이 그 시간을 문제를 일으키는 생각들과 행동으로 채울 수 있다는 것을 암시한다고 일컬어진다.", "hl": ["fill that time with troubling thoughts and behavior"], "hlko": ["그 시간을 문제를 일으키는 생각들과 행동으로 채울 수 있다"], "n": 3}, {"en": "The balance is to not see it as idle time, wasted time, or boredom but rather as a perfect time for self-improvement, self-identification, and positive reflection time.", "ko": "균형점은 그것을 아무것도 안 하는 시간, 낭비된 시간, 또는 무료함으로 보는 것이 아니라, 오히려 자기 개선, 자기 발견, 그리고 긍정적인 성찰 시간을 위한 완벽한 시간으로 보는 것이다.", "hl": ["a perfect time for self-improvement"], "hlko": ["자기 개선, 자기 발견, 그리고 긍정적인 성찰 시간을 위한 완벽한 시간"], "n": 4}]}, {"id": 3, "summary": "Boredom is a (A) that appears in safe situations, so we should regard it as an opportunity for personal (B).", "ko": "무료함은 안전한 상황에서 나타나는 <b>(A) 특권</b>이므로, 우리는 그것을 개인적 <b>(B) 발전</b>의 기회로 여겨야 한다.", "opts": [["privilege", "progress"], ["privilege", "damage"], ["burden", "progress"], ["burden", "damage"], ["danger", "delay"]], "optko": ["특권 – 발전", "특권 – 피해", "부담 – 발전", "부담 – 피해", "위험 – 지연"], "ans": 0, "wrong": [null, "damage(피해)가 틀려요. 본문은 무료함을 개인적 발달(personal development)의 기회로 여겨야 한다고 해요.", "burden(부담)이 틀려요. 본문은 무료함을 안전한 상황에서만 누리는 사치(luxury)라고 해요.", "둘 다 틀려요. 무료함은 부담이 아니라 사치이고, 피해가 아니라 발달의 기회예요.", "둘 다 틀려요. 위험한 상황에서는 무료함이라는 사치가 없다고 했으니 무료함은 위험(danger)이 아니에요. 지연(delay)도 본문에 없어요."], "evid": [{"n": 7, "hl": ["luxury that typically manifests in safe and inactive situations"]}, {"n": 11, "hl": ["an opportunity for personal development"]}], "swaps": [["luxury", "privilege", "사치 → 특권"], ["development", "progress", "발달 → 발전"]], "swapnote": "luxury(사치)는 privilege(특권)로, development(발달)는 progress(발전)로 바뀌었어요. 안전할 때만 누리는 사치 = 안전할 때 누리는 특권으로 읽어요.", "use": [{"w": "privilege", "ex": "Voting is a privilege.", "ko": "투표는 특권이다.", "wk": "특권", "hk": "특권"}, {"w": "progress", "ex": "She made great progress.", "ko": "그녀는 크게 발전했다.", "wk": "발전, 진전", "hk": "발전했다"}], "flow": "본문 6~8번에서 무료함은 안전한 상황에서만 나타나는 사치이고 위험한 상황에서는 누릴 수 없다고 하고, 11번에서 무료함을 비생산적으로 보지 말고 개인적 발달과 건설적 사유의 기회로 여기라고 정리해요.", "jd": [["Boredom is a [[privilege]]", "무료함은 [[특권]]이다"], ["that appears in safe situations,", "안전한 상황에서 나타나는,"], ["so we should regard it", "그래서 우리는 그것을 여겨야 한다"], ["as an opportunity for personal [[progress]].", "개인적 [[발전]]의 기회로."]], "fc": [["본문 7~8번", "안전할 때만 누리는 사치", "무료함은 안전한 상황의 }
function vQ(){
  var q=Qs[cur],a=PR.a[q.id],done=a!==undefined;curQ=q.id;
  var h='<div class="top"><button class="back" data-a="home">목록</button><button class="back" data-a="sw">바꿔 말하기</button><span class="cnt">'+(cur+1)+' / '+Qs.length+'</span></div>';
  if(!done)h+='<p class="hint">문장의 밑줄 단어를 누르면 뜻이 나와요. 보기를 누르면 답을 골라요.</p>';
  h+='<div class="card sum">'+sumHtml(q,done)+'</div><div class="opts">';
  q.opts.forEach(function(o,i){
    var cls='opt'+(done?' lock':'');
    if(done){if(i===q.ans)cls+=' right';else if(i===a)cls+=' mine'}
    h+='<div class="'+cls+'"'+(done?'':' data-a="pick" data-v="'+i+'"')+'><span class="num">'+CN[i]+'</span><span class="ot">'+(done?words(o[0]):esc(o[0]))+'<span class="dash">–</span>'+(done?words(o[1]):esc(o[1]))+'</span>'+(done&&i===q.ans?'<span class="st">정답</span>':(done&&i===a?'<span class="st">내 답</span>':''))+'</div>';
  });
  h+='</div>';
  if(done){
    var ok=a===q.ans;
    h+='<div id="exp"><div class="card"><div class="row"><span class="badge">'+(cur+1)+'번</span><span class="chip">정답 '+CN[q.ans]+'</span><span class="msg '+(ok?'o':'x')+'">'+(ok?'맞았어요':'내 답 '+CN[a])+'</span></div>';
    h+='</div><div class="card"><p class="lb">직독직해 (끊어서 앞에서부터 이해해요)</p>'+jdHtml(q)+'<details><summary>자연스러운 해석 보기</summary><div class="ko">'+q.ko.replace(/\((A|B)\)\s*/g,'')+'</div></details></div>';
    h+='<div class="card"><p class="lb">보기 뜻</p><ul class="opl">';
    q.opts.forEach(function(o,i){h+='<li class="'+(i===q.ans?'a':'')+'">'+CN[i]+' '+(i===q.ans?'<mark>'+words(o[0])+' – '+words(o[1])+'</mark>':words(o[0])+' – '+words(o[1]))+'<span class="k">'+(i===q.ans?'<mark>'+esc(q.optko[i])+'</mark>  ← 정답':esc(q.optko[i]))+'</span></li>'});
    h+='</ul></div>';
    h+='<div class="card"><p class="lb">정답의 근거 · 본문 '+q.evid_full.map(function(e){return e.n+'번'}).join(', ')+'</p>';
    q.evid_full.forEach(function(e){h+='<div class="ev"><div class="en">'+rich(e.en,e.hl)+'</div><div class="kk">'+richKo(e.ko,e.hlko)+'</div></div>'});
    h+='</div>';
    h+='<div class="card"><p class="lb">이 단어, 이렇게 바뀌었어요</p>';
    q.swaps.forEach(function(s){h+='<div class="swap"><span class="a">'+words(s[0])+'</span><span class="arr">→</span><span class="b">'+words(s[1])+'</span><span class="ds">'+esc(s[2])+(/\s/.test(s[0])||/\s/.test(s[1])?'':' '+sayBtn(s[0],'듣기')+' '+sayBtn(s[1],'듣기'))+'</span></div>'});
    h+='<div class="note">'+esc(q.swapnote)+'</div></div>';
    h+='<div class="card"><p class="lb">쓰임 익히기</p><div class="use">';
    q.use.forEach(function(u){h+='<div class="u"><div class="uw">'+esc(u.w)+'<small class="uwk">('+esc(u.wk)+')</small></div><div class="ue">'+useEx(u)+'</div><div class="uk">'+esc(u.ko).replace(esc(u.hk),'<mark>'+esc(u.hk)+'</mark>')+'</div></div>'});
    h+='</div></div>';
    h+='<div class="card"><p class="lb">기억할 흐름</p><div class="fc">'+q.fc.map(function(c,i){return (i?'<div class="ar">▼</div>':'')+'<div class="c'+(i===q.fc.length-1?' last':'')+'"><span class="tg">'+esc(c[0])+'</span><div class="hd">'+mk(c[1])+'</div><div class="sb2">'+mk(c[2])+'</div></div>'}).join('')+'</div></div>';
    h+='<div class="card"><details><summary>다른 보기는 왜 아닐까요</summary><ul style="padding:0;margin:6px 0 0">';
    q.wrong.forEach(function(w,i){if(w)h+='<li><b>'+CN[i]+'</b> '+hlp(w)+'</li>'});
    h+='</ul></details></div>';
    h+='<button class="btn pri" data-a="next">'+(cur<Qs.length-1?'다음 문제':'결과 보기')+'</button></div>';
  }
  return h;
}
function vRes(){
  var h='<div class="top"><button class="back" data-a="home">목록</button><button class="back" data-a="sw">바꿔 말하기</button></div><h1>'+Qs.length+'문제 중 '+okCount()+'문제 맞았어요</h1>';
  h+='<div class="nums">';
  Qs.forEach(function(q,i){var a=PR.a[q.id];h+='<button class="nb '+(a===undefined?'':(a===q.ans?'o':'x'))+'" data-a="q" data-v="'+i+'">'+(i+1)+'</button>'});
  h+='</div><p class="sub">단어노트에 '+nNotes()+'개가 쌓였어요.</p>';
  h+='<button class="btn pri" data-a="notes">단어노트 보기</button><button class="btn sec" data-a="reset">문제 다시 풀기</button><button class="btn sec" data-a="home">목록으로</button>';
  return h;
}
function sortedNotes(){return Object.keys(NOTES).map(function(k){return NOTES[k]}).sort(function(a,b){return b.t-a.t})}
function vNotes(){
  var L=sortedNotes();
  var h='<div class="top"><button class="back" data-a="home">목록</button><button class="back" data-a="sw">바꿔 말하기</button><span class="cnt">단어노트 '+L.length+'개</span></div>';
  if(!L.length)return h+'<div class="empty">밑줄 단어를 누르면 여기에 쌓여요.</div>';
  h+='<div class="card"><ul class="wl">';
  L.forEach(function(n){h+='<li><span class="lw">'+esc(n.l)+'</span><span class="lm">'+esc(n.k)+'</span>'+(n.c>1?'<span class="lc">'+n.c+'번</span>':'')+'<button class="rmw" data-a="rmnote" data-v="'+esc(n.l.toLowerCase())+'">빼기</button></li>'});
  return h+'</ul></div>';
}
function sk(id){return id.indexOf('sw:')===0?id.slice(3):id}
function wrongOf(id){var r=SRV[sk(id).toLowerCase()];return r&&r.c>0?r.c:0}
function flagList(){return Object.keys(SRV).map(function(k){return SRV[k]}).filter(function(r){return r.c>0}).sort(function(a,b){return b.c-a.c})}
function nFlag(){return flagList().length}
function srvLoad(){
  try{WN.list().then(function(r){
    if(!r||!r.ok||!r.items)return;SRV={};
    r.items.forEach(function(i){if(String(i.src||'').indexOf(SRC)>=0)SRV[String(i.w).toLowerCase()]={w:i.w,m:i.m,c:i.c||0}});
    if(view==='home'||view==='chk'||view==='sw')render();
  })}catch(e){}
}
function vChk(){
  var L=flagList();
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">선생님 확인 단어 '+L.length+'개</span></div>';
  if(!L.length)return h+'<div class="empty">틀린 단어가 없어요.</div>';
  h+='<p class="hint">선생님이 물어봤을 때 틀린 단어예요. 먼저 뜻을 떠올려 보고 확인해 보세요. 오답노트(H로드맵)에도 같이 있어요.</p><div class="card">';
  L.forEach(function(r){
    var id=r.w.toLowerCase(),o=swOpen['c'+id];
    h+='<div class="swr"><div class="swq"><span class="sa">'+esc(r.w)+'</span><span class="sb">'+(o?'<em>'+esc(r.m)+'</em>':'뜻은?')+'</span><small class="flag">'+r.c+'번 틀림</small><button data-a="rv" data-v="c'+esc(id)+'">'+(o?'가리기':'확인')+'</button></div></div>';
  });
  return h+'</div><a class="btn sec" style="display:block;text-align:center;text-decoration:none" href="https://nolbada.github.io/via/wn/">H로드맵 오답노트 열기</a>';
}
function sceneLine(t,cur){return esc(t).replace(/\[\[(\w+)\|([^\]]+)\]\]/g,function(m,w,k){return '<b class="wc'+(w.toLowerCase()===String(cur).toLowerCase()?' me':'')+'">'+w+'</b>('+k+')'})}
function vSw(){
  var L=swList(),sc={};
  (DATA.scenes||[]).forEach(function(c){(c.line.match(/\[\[\w+\|/g)||[]).forEach(function(m){sc[m.slice(2,-1).toLowerCase()]=c})});
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">바꿔 말하기 '+L.length+'개</span></div>';
  h+='<p class="hint">왼쪽 단어가 요약문에서 어떤 말로 바뀔까요? <b>소리 내어 말해 본 뒤</b> 확인을 눌러요.</p>';
  h+='<div class="tabs"><button data-a="rvall" data-v="open">모두 열기</button><button data-a="rvall" data-v="hide">모두 가리기</button></div><div class="card">';
  L.forEach(function(s){
    var o=swOpen[s.id],c=sc[s.form.toLowerCase()],on=swD['s'+s.id],fl=wrongOf(s.id);
    h+='<div class="swr"><div class="swq"><span class="qn">'+s.sq+'번</span><span class="sa">'+words(s.a)+(fl?'<small class="flag">'+fl+'번 틀림</small>':'')+'</span><span class="sb">'+(o?'<em>'+words(s.b)+'</em>'+esc(s.k):'→ ?')+'</span>'+sayBtn(s.a,'듣기')+(o?sayBtn(s.b,'정답 듣기'):'')+'<button data-a="rv" data-v="'+esc(s.id)+'">'+(o?'가리기':'확인')+'</button></div>';
    if(c)h+='<button class="acc2" data-a="dt" data-v="s'+esc(s.id)+'">'+esc(c.tag)+' 줄거리<span>'+(on?'접기':'펼치기')+'</span></button>'+(on?'<div class="story">'+sceneLine(c.line,s.form)+'</div>':'');
    h+='</div>';
  });
  return h+'</div><p class="sumline">시험에서는 본문 단어가 뜻이 같은 다른 단어로 바뀌어 나와요.</p>';
}
/* 자동 새로고침(기록 연동)이 일어나도 보던 문제로 되돌린다 */
try{var sv=JSON.parse(sessionStorage.getItem('vhyv')||'null');if(sv&&sv.p===location.pathname&&Date.now()-sv.t<600000&&sv.v&&sv.v!=='home'){view=sv.v;cur=sv.c||0;try{history.pushState({v:view},'');histPushed=true}catch(e){}}}catch(e){}
render();srvLoad();window.addEventListener('pageshow',srvLoad);
</script>
</body>
</html>
