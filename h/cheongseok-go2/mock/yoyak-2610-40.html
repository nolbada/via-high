<script>
var DATA={"meta": {"sch": "jusung-go2", "src": "common/sx-data-2610g2.js", "dir": "mock", "pidx": 15, "lesson": "26년 10월 40번", "title": "", "label": "", "page": "yoyak-2610-40"}, "scenes": [{"tag": "본문 1번", "ns": [1], "line": "돌고래의 뇌는 반향 정위를 위한 [[specialized|특화된]] 구역이 있어 [[acoustic|음향]] 정보를 더 빠르고 더 적은 에너지로 [[process|처리한다]].", "en": ["Dolphins’ brains have evolved specialized areas dedicated to echolocation, allowing them to process acoustic information more quickly and with less energy."], "kos": ["돌고래들의 뇌는 반향 정위에 사용되는 특화된 구역들을 진화시켰고, 그것은 그것들이 음향 정보를 더 빠르게 그리고 더 적은 에너지로 처리하게 해 준다."]}, {"tag": "본문 2~3번", "ns": [2, 3], "line": "귀에서 온 신호는 소리를 담당하는 청각 피질로 [[rapidly|빠르게]] 전달된다.", "en": ["One key adaptation is the structure of the dolphin’s auditory pathway.", "The signals from the ears are rapidly transmitted to the auditory cortex, the brain region responsible for processing sound."], "kos": ["한 가지 핵심적인 적응 구조는 돌고래의 청각 경로의 구조이다.", "귀로부터의 신호들은 소리를 처리하는 것을 담당하는 뇌 영역인 청각 피질로 빠르게 전달된다."]}, {"tag": "본문 4~5번", "ns": [4, 5], "line": "청각 피질에는 반향 정위 신호의 서로 다른 [[aspects|측면]]을 맡는 [[distinct|개별]] 구역이 있다.", "en": ["However, unlike many other mammals, dolphins have a highly specialized auditory cortex with distinct areas dedicated to processing different aspects of echolocation signals.", "Some areas may be responsible for analyzing the timing of echoes, while others focus on the frequency content or the intensity of the sound."], "kos": ["그러나, 많은 다른 포유류들과 달리, 돌고래는 반향 정위 신호들의 서로 다른 측면들을 처리하는 것에 사용되는 개별 구역들을 가진 고도로 특화된 청각 피질을 가지고 있다.", "어떤 구역들은 반사파들의 타이밍을 분석하는 것을 담당할지도 모르지만 한편으로는 다른 구역들은 소리의 주파수 성분 또는 강도에 초점을 맞춘다."]}, {"tag": "본문 6~7번", "ns": [6, 7], "line": "그래서 정보를 순서대로가 아니라 [[parallel|병렬로]] 처리한다. 공장 조립 라인을 떠올리면 된다.", "en": ["This specialization allows the dolphin’s brain to process echo information in parallel, rather than sequentially.", "Imagine a factory assembly line, where different workers are responsible for different tasks."], "kos": ["이러한 특화는 돌고래의 뇌가 반사파 정보를 순차적이기보다 병렬로 처리하게 해 준다.", "공장 조립 라인을 상상해 보면, 그곳에서는 서로 다른 노동자들이 서로 다른 과업들을 담당한다."]}, {"tag": "본문 8~9번", "ns": [8, 9], "line": "업무를 나눠 훨씬 더 [[efficiently|효율적으로]] 처리하고, 환경 변화에도 빠르게 반응한다.", "en": ["By dividing the work among specialized areas, the brain can process information much faster and more efficiently.", "This parallel processing reduces the cognitive load associated with echolocation, allowing dolphins to react quickly to changes in their environment."], "kos": ["특화된 구역들 사이에서 업무를 분담함으로써, 뇌는 정보를 훨씬 더 빠르고 더 효율적으로 처리할 수 있다.", "이러한 병렬 처리는 반향 정위와 연관된 인지 부하를 줄이고, 돌고래들이 자신의 환경에서의 변화들에 빠르게 반응하게 해 준다."]}], "story": [{"a": "specialized", "form": "specialized", "n": 1, "sq": 1, "sum": "evolved [[special]] areas", "hook": "특화된 구역을 진화시켰다는 문장의 specialized(특화된) → 요약문에서는 special(특별한)로 바꿨어요.", "b": "special", "k": "특화된 → 특별한", "en": "Dolphins’ brains have evolved specialized areas dedicated to echolocation, allowing them to process acoustic information more quickly and with less energy.", "ko": "돌고래들의 뇌는 반향 정위에 사용되는 특화된 구역들을 진화시켰고, 그것은 그것들이 음향 정보를 더 빠르게 그리고 더 적은 에너지로 처리하게 해 준다."}, {"a": "process", "form": "process", "n": 1, "sq": 1, "sum": "which let dolphins [[handle]] sound information", "hook": "음향 정보를 처리하게 해 준다는 문장의 process(처리하다) → 요약문에서는 handle(처리하다)로 바꿨어요.", "b": "handle", "k": "처리하다 → 처리하다", "en": "Dolphins’ brains have evolved specialized areas dedicated to echolocation, allowing them to process acoustic information more quickly and with less energy.", "ko": "돌고래들의 뇌는 반향 정위에 사용되는 특화된 구역들을 진화시켰고, 그것은 그것들이 음향 정보를 더 빠르게 그리고 더 적은 에너지로 처리하게 해 준다."}, {"a": "acoustic", "form": "acoustic", "n": 1, "sq": 1, "sum": "handle [[sound]] information", "hook": "음향 정보라는 문장의 acoustic(음향의) → 요약문에서는 sound(소리)로 바꿨어요.", "b": "sound", "k": "음향의 → 소리", "en": "Dolphins’ brains have evolved specialized areas dedicated to echolocation, allowing them to process acoustic information more quickly and with less energy.", "ko": "돌고래들의 뇌는 반향 정위에 사용되는 특화된 구역들을 진화시켰고, 그것은 그것들이 음향 정보를 더 빠르게 그리고 더 적은 에너지로 처리하게 해 준다."}, {"a": "rapidly", "form": "rapidly", "n": 3, "sq": 2, "sum": "travel [[quickly]] to a brain region", "hook": "귀의 신호가 청각 피질로 빠르게 전달된다는 문장의 rapidly(빠르게) → 요약문에서는 quickly(빠르게)로 바꿨어요.", "b": "quickly", "k": "빠르게 → 빠르게", "en": "The signals from the ears are rapidly transmitted to the auditory cortex, the brain region responsible for processing sound.", "ko": "귀로부터의 신호들은 소리를 처리하는 것을 담당하는 뇌 영역인 청각 피질로 빠르게 전달된다."}, {"a": "distinct", "form": "distinct", "n": 4, "sq": 2, "sum": "has [[separate]] areas", "hook": "서로 다른 측면을 처리하는 개별 구역이라는 문장의 distinct(개별적인) → 요약문에서는 separate(따로 나뉜)로 바꿨어요.", "b": "separate", "k": "개별적인 → 따로 나뉜", "en": "However, unlike many other mammals, dolphins have a highly specialized auditory cortex with distinct areas dedicated to processing different aspects of echolocation signals.", "ko": "그러나, 많은 다른 포유류들과 달리, 돌고래는 반향 정위 신호들의 서로 다른 측면들을 처리하는 것에 사용되는 개별 구역들을 가진 고도로 특화된 청각 피질을 가지고 있다."}, {"a": "aspect", "form": "aspects", "n": 4, "sq": 2, "sum": "a different [[part]] of the echo signal", "hook": "반향 정위 신호의 서로 다른 측면이라는 문장의 aspect(측면) → 요약문에서는 part(부분)로 바꿨어요.", "b": "part", "k": "측면 → 부분", "en": "However, unlike many other mammals, dolphins have a highly specialized auditory cortex with distinct areas dedicated to processing different aspects of echolocation signals.", "ko": "그러나, 많은 다른 포유류들과 달리, 돌고래는 반향 정위 신호들의 서로 다른 측면들을 처리하는 것에 사용되는 개별 구역들을 가진 고도로 특화된 청각 피질을 가지고 있다."}, {"a": "parallel", "form": "parallel", "n": 6, "sq": 3, "sum": "handles echo information [[simultaneously]]", "hook": "정보를 병렬로 처리한다는 문장의 parallel(병렬로) → 요약문에서는 simultaneously(동시에)로 바꿨어요.", "b": "simultaneously", "k": "병렬로 → 동시에", "en": "This specialization allows the dolphin’s brain to process echo information in parallel, rather than sequentially.", "ko": "이러한 특화는 돌고래의 뇌가 반사파 정보를 순차적이기보다 병렬로 처리하게 해 준다."}, {"a": "efficiently", "form": "efficiently", "n": 8, "sq": 3, "sum": "more [[effectively]]", "hook": "정보를 훨씬 더 효율적으로 처리한다는 문장의 efficiently(효율적으로) → 요약문에서는 effectively(효과적으로)로 바꿨어요.", "b": "effectively", "k": "효율적으로 → 효과적으로", "en": "By dividing the work among specialized areas, the brain can process information much faster and more efficiently.", "ko": "특화된 구역들 사이에서 업무를 분담함으로써, 뇌는 정보를 훨씬 더 빠르고 더 효율적으로 처리할 수 있다."}], "passage": [{"n": 1, "en": "Dolphins’ brains have evolved specialized areas dedicated to echolocation, allowing them to process acoustic information more quickly and with less energy.", "ko": "돌고래들의 뇌는 반향 정위에 사용되는 특화된 구역들을 진화시켰고, 그것은 그것들이 음향 정보를 더 빠르게 그리고 더 적은 에너지로 처리하게 해 준다."}, {"n": 2, "en": "One key adaptation is the structure of the dolphin’s auditory pathway.", "ko": "한 가지 핵심적인 적응 구조는 돌고래의 청각 경로의 구조이다."}, {"n": 3, "en": "The signals from the ears are rapidly transmitted to the auditory cortex, the brain region responsible for processing sound.", "ko": "귀로부터의 신호들은 소리를 처리하는 것을 담당하는 뇌 영역인 청각 피질로 빠르게 전달된다."}, {"n": 4, "en": "However, unlike many other mammals, dolphins have a highly specialized auditory cortex with distinct areas dedicated to processing different aspects of echolocation signals.", "ko": "그러나, 많은 다른 포유류들과 달리, 돌고래는 반향 정위 신호들의 서로 다른 측면들을 처리하는 것에 사용되는 개별 구역들을 가진 고도로 특화된 청각 피질을 가지고 있다."}, {"n": 5, "en": "Some areas may be responsible for analyzing the timing of echoes, while others focus on the frequency content or the intensity of the sound.", "ko": "어떤 구역들은 반사파들의 타이밍을 분석하는 것을 담당할지도 모르지만 한편으로는 다른 구역들은 소리의 주파수 성분 또는 강도에 초점을 맞춘다."}, {"n": 6, "en": "This specialization allows the dolphin’s brain to process echo information in parallel, rather than sequentially.", "ko": "이러한 특화는 돌고래의 뇌가 반사파 정보를 순차적이기보다 병렬로 처리하게 해 준다."}, {"n": 7, "en": "Imagine a factory assembly line, where different workers are responsible for different tasks.", "ko": "공장 조립 라인을 상상해 보면, 그곳에서는 서로 다른 노동자들이 서로 다른 과업들을 담당한다."}, {"n": 8, "en": "By dividing the work among specialized areas, the brain can process information much faster and more efficiently.", "ko": "특화된 구역들 사이에서 업무를 분담함으로써, 뇌는 정보를 훨씬 더 빠르고 더 효율적으로 처리할 수 있다."}, {"n": 9, "en": "This parallel processing reduces the cognitive load associated with echolocation, allowing dolphins to react quickly to changes in their environment.", "ko": "이러한 병렬 처리는 반향 정위와 연관된 인지 부하를 줄이고, 돌고래들이 자신의 환경에서의 변화들에 빠르게 반응하게 해 준다."}], "questions": [{"id": 1, "summary": "Dolphin brains evolved (A) areas for echolocation, which let dolphins (B) sound information faster and with less energy.", "ko": "돌고래의 뇌는 반향 정위를 위한 <b>(A) 특별한</b> 구역을 진화시켰고, 그 덕에 소리 정보를 더 빠르고 더 적은 에너지로 <b>(B) 처리할</b> 수 있다.", "opts": [["special", "hide"], ["ordinary", "handle"], ["ordinary", "hide"], ["tiny", "forget"], ["special", "handle"]], "optko": ["특별한 – 숨기다", "평범한 – 처리하다", "평범한 – 숨기다", "아주 작은 – 잊다", "특별한 – 처리하다"], "ans": 4, "wrong": ["hide(숨기다)가 틀려요. 돌고래는 음향 정보를 숨기는 게 아니라 더 빠르게, 더 적은 에너지로 처리해요(process).", "ordinary(평범한)가 틀려요. 본문은 돌고래의 뇌가 반향 정위에 쓰이는 특화된 구역(specialized areas)을 진화시켰다고 해요.", "둘 다 틀려요. 구역은 평범한 게 아니라 특화되어 있고, 돌고래는 정보를 숨기는 게 아니라 처리해요.", "둘 다 틀려요. 구역이 아주 작다(tiny)는 말은 본문에 없고, 돌고래는 정보를 잊는(forget) 게 아니라 빠르게 처리해요.", null], "evid": [{"n": 1, "hl": ["specialized areas dedicated to echolocation", "process acoustic information more quickly and with less energy"]}], "swaps": [["specialized", "special", "특화된 → 특별한"], ["process", "handle", "처리하다 → 처리하다"], ["acoustic", "sound", "음향의 → 소리"]], "swapnote": "specialized(특화된)는 special(특별한)로, process(처리하다)는 handle(처리하다)로, acoustic(음향의)은 sound(소리)로 바뀌었어요. 어려운 단어가 쉬운 단어로 바뀐 거예요.", "use": [{"w": "special", "ex": "This is a special day.", "ko": "오늘은 특별한 날이다.", "wk": "특별한", "hk": "특별한"}, {"w": "handle", "ex": "Can you handle this job?", "ko": "이 일을 처리할 수 있겠니?", "wk": "처리하다, 다루다", "hk": "처리할"}], "flow": "본문 1번에서 돌고래의 뇌가 반향 정위를 위한 특화된 구역을 진화시켜 음향 정보를 더 빠르고 더 적은 에너지로 처리한다고 소개해요.", "jd": [["Dolphin brains evolved [[special]] areas", "돌고래의 뇌는 [[특별한]] 구역을 진화시켰다"], ["for echolocation,", "반향 정위를 위한,"], ["which let dolphins [[handle]] sound information", "그 덕에 소리 정보를 [[처리할]] 수 있다"], ["faster and with less energy.", "더 빠르고 더 적은 에너지로."]], "fc": [["본문 1번", "돌고래의 특화된 뇌 구역", "돌고래의 뇌에는 {{echolocation|반향     h+='<div class="note">'+esc(q.swapnote)+'</div></div>';
    h+='<div class="card"><p class="lb">쓰임 익히기</p><div class="use">';
    q.use.forEach(function(u){h+='<div class="u"><div class="uw">'+esc(u.w)+'<small class="uwk">('+esc(u.wk)+')</small></div><div class="ue">'+useEx(u)+'</div><div class="uk">'+esc(u.ko).replace(esc(u.hk),'<mark>'+esc(u.hk)+'</mark>')+'</div></div>'});
    h+='</div></div>';

  }

var EVK={
'1':[[1,'돌고래의 뇌는 반향 정위용 <b>특화된</b>(specialized) 구역을 발달시켜 <b>음향</b>(acoustic) 정보를 더 빠르고 적은 에너지로 <b>처리함</b>(process)']],
'2':[[3,'귀의 신호는 <b>빠르게</b>(rapidly) 청각 피질로 전달됨'],[4,'돌고래의 청각 피질에는 신호의 서로 다른 <b>측면</b>(aspects)을 처리하는 <b>개별</b>(distinct) 구역이 있음'],[5,'어떤 구역은 반사파의 타이밍, 다른 구역은 주파수나 강도에 초점을 맞춤']],
'3':[[6,'이 특화 덕분에 뇌는 반사파 정보를 순차적이 아니라 <b>병렬로</b>(in parallel) 처리함'],[8,'업무를 나누면 정보를 훨씬 빠르고 더 <b>효율적으로</b>(efficiently) 처리할 수 있음']]
};
var REL={
specialized:{bj:'반향 정위에 쓰이는 <b>특화된</b>(specialized) 구역들',s:[['expert','전문적인'],['technical','기술적인'],['particular','특정한']],a:[['general','일반적인']],t:'special',tr:'specialized는 특정 기능에 맞춘, special(특별한)과 뜻이 다름'},
process:{bj:'음향 정보를 더 빠르게 <b>처리한다</b>(process)',s:[['deal with','다루다'],['treat','처리하다'],['manage','관리하다']],a:[],t:'handle',tr:'process는 명사 과정이 먼저, 여기서는 정보를 처리하다'},
acoustic:{bj:'<b>음향</b>(acoustic) 정보',s:[['auditory','청각의'],['sonic','소리의'],['audio','음성의']],a:[],t:'sound',tr:'acoustic은 소리에 관한, 명사 acoustics는 음향학'},
rapidly:{bj:'신호가 <b>빠르게</b>(rapidly) 전달된다',s:[['swiftly','재빨리'],['speedily','신속히']],a:[['slowly','느리게'],['gradually','점차']],t:'quickly',tr:'rapidly는 속도가 빠르게, rapid의 부사형'},
distinct:{bj:'<b>개별</b>(distinct) 구역들',s:[['discrete','분리된'],['individual','개별의']],a:[['similar','비슷한'],['identical','똑같은']],t:'separate',tr:'distinct는 다른 것과 구별되는, 또 뚜렷한 뜻도 있음'},
aspect:{bj:'신호의 서로 다른 <b>측면</b>(aspects)',s:[['dimension','측면'],['feature','특징'],['facet','측면']],a:[],t:'part',tr:'aspect는 어떤 것의 한 면'},
parallel:{bj:'정보를 <b>병렬로</b>(in parallel) 처리한다',s:[['concurrent','동시에 일어나는'],['side by side','나란히']],a:[['sequential','순차적인'],['serial','연속의']],t:'simultaneously',tr:'in parallel은 동시에, 반대는 sequentially'},
efficiently:{bj:'훨씬 더 <b>효율적으로</b>(efficiently) 처리한다',s:[['productively','생산적으로'],['economically','경제적으로'],['skillfully','능숙하게']],a:[['wastefully','낭비하며']],t:'effectively',tr:'efficiently는 낭비 없이, effectively는 결과를 내며'}
};
function relBox(s){
  var r=REL[String(s.a).toLowerCase()];if(!r)return '';
  var it=[{t:s.b,k:String(s.k).split(' → ')[1]||'',c:'k'}];
  r.s.forEach(function(x){it.push({t:x[0],k:x[1],c:'s'})});
  r.a.forEach(function(x){it.push({t:x[0],k:x[1],c:'a'})});
  var P={1:[[50,80]],2:[[26,78],[74,78]],3:[[16,70],[50,86],[84,70]],4:[[14,62],[36,86],[64,86],[86,62]],5:[[12,56],[28,86],[50,92],[72,86],[88,56]]}[it.length],svg='',nd='';
  it.forEach(function(x,j){
    svg+='<line x1="50%" y1="26%" x2="'+P[j][0]+'%" y2="'+(P[j][1]-7)+'%" stroke="'+(x.c=='a'?'#c0392b':'#2f5d50')+'" stroke-width="2"/>';
    nd+='<div class="rn '+x.c+'" style="left:'+P[j][0]+'%;top:'+P[j][1]+'%">'+esc(x.t)+(x.k?'<small>'+esc(x.k)+'</small>':'')+'</div>';
  });
  var left=String(s.k).split(' → ')[0];
  var h='<div class="relx"><div class="rmap"><svg>'+svg+'</svg><div class="rn c" style="left:50%;top:26%">'+esc(s.a)+'<small>'+esc(left)+'</small></div>'+nd+'</div>'
   +'<div class="rleg"><span><i style="border-color:#2f5d50"></i>바꿔 쓸 수 있는 말</span>'+(r.a.length?'<span><i style="border-color:#c0392b"></i>반대말</span>':'')+'</div>'
   +'<div class="pit"><div><em>본문</em>'+r.bj+'</div><div><em>요약문</em><b>'+esc(s.b)+'</b>('+esc(String(s.k).split(' → ')[1]||'')+')로 바뀜</div>'+(r.tr?'<div class="tp"><em>함정</em>'+esc(r.tr)+'</div>':'')+'</div></div>';
  return h;
}

    if(o)h+=relBox(s);else if(REL[String(s.a).toLowerCase()]){var rr=REL[String(s.a).toLowerCase()];h+='<div class="hch">유 '+(1+rr.s.length)+(rr.a.length?' · 반 '+rr.a.length:'')+'</div>'}
    if(c&&!REL[String(s.a).toLowerCase()])h+='<button class="acc2" data-a="dt" data-v="s'+esc(s.id)+'">'+esc(c.tag)+' 줄거리<span>'+(on?'접기':'펼치기')+'</span></button>'+(on?'<div class="story">'+sceneLine(c.line,s.form)+'</div>':'');
    h+='</div>';
  });
  return h+'</div><p class="sumline">시험에서는 본문 단어가 뜻이 같은 다른 단어로 바뀌어 나와요.</p><button class="btn sec" data-a="home">목록으로</button>';
}
