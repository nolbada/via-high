<script>
var DATA={"meta": {"sch": "jusung-go2", "src": "common/sx-data-2610g2.js", "dir": "mock", "pidx": 9, "lesson": "26년 10월 34번", "title": "", "label": "", "page": "yoyak-2610-34"}, "scenes": [{"tag": "본문 1번", "ns": [1], "line": "소셜 미디어가 비즈니스, 정치, 친목을 [[altered|바꿨다]]. 입소문이 일상어가 됐다.", "en": ["Social media has altered business, politics, and friendships, making going viral a household term."], "kos": ["소셜 미디어는 비즈니스, 정치, 친목을 변화시켰으며, ‘입소문이 나다’를 일상적인 용어로 만들었다."]}, {"tag": "본문 2번", "ns": [2], "line": "금융 산업은 전 세계 은행과 가정을 [[links|잇는다]]. 그래서 지구 반대편의 실수에도 우리는 [[vulnerable|취약하다]].", "en": ["The global financial industry links every bank and countless households in every country, making us vulnerable to human error taking place on the other side of the world."], "kos": ["세계 금융 산업은 모든 은행과 전 세계 각국의 수많은 가정을 연결하여, 우리를 세계의 다른 곳에서 발생한 인간의 오류에 취약해지게 만들었다."]}, {"tag": "본문 3~4번", "ns": [3, 4], "line": "옛날 기관들은 [[separate|따로따로]]여서 바깥 오류로부터 [[buffered|보호되었다]]. 지금은 그렇지 않다.", "en": ["As Columbia University strategy professor Rita McGrath explains, years ago most of our institutions were separate and thereby buffered from the effects of errors outside their walls.", "That is no longer the case."], "kos": ["Columbia University 전략학 교수 Rita McGrath가 설명하듯이, 수년 전 우리의 기관들 중 대부분은 서로 분리되어 있었고, 따라서 그것들의 장벽 밖에 있는 오류들의 영향으로부터 보호되었다.", "더 이상은 그렇지 않다."]}, {"tag": "본문 5~6번", "ns": [5, 6], "line": "컴퓨팅이 싸지며 정보의 디지털화가 [[enormously|엄청나게]] 늘었다. 스스로 소통하는 시스템은 [[infinite|무한히]] 다양한 [[potential|잠재적]] 고장을 낳았다.", "en": ["The digitization of massive amounts of information has continued to grow enormously as the cost of computing power has decreased.", "The development of smart systems that communicate autonomously gave rise to an infinite variety of potential breakdowns."], "kos": ["컴퓨팅 능력의 비용이 감소함에 따라 방대한 양의 정보의 디지털화는 계속해서 엄청나게 증가해 왔다.", "자율적으로 소통하는 스마트 시스템의 발달은 무한히 다양한 잠재적 고장들을 초래했다."]}, {"tag": "본문 7~8번", "ns": [7, 8], "line": "이런 상호 의존성은 복합적 실패의 온상이다. 따로 있던 것들이 부딪치면 다음 일을 예측하기 어렵다.", "en": ["This interdependence is a breeding ground for complex failure.", "As Rita puts it, when “things that used to be kept separate bump up against each other, it becomes far more difficult to predict what’s going to happen next.”"], "kos": ["이러한 상호 의존성은 복합적 실패의 온상이다.", "Rita가 말하듯, ‘분리되어 있던 것들이 서로 부딪치게 될 때, 다음에 무슨 일이 일어날지를 예측하는 것은 훨씬 더 어려워진다.’"]}, {"tag": "본문 9번", "ns": [9], "line": "정보 기술은 새로운 [[vulnerabilities|취약성]]을 [[creates|만든다]]. 연결성이 작은 실패를 [[instantly|순식간에]] 퍼뜨리기 때문이다.", "en": ["Information technology creates new vulnerabilities because interconnectedness instantly spreads the impact of small failures."], "kos": ["정보 기술은 새로운 취약성을 만들어 내는데, 왜냐하면 상호 연결성이 작은 실패들의 영향을 즉각적으로 확산시키기 때문이다."]}], "story": [{"a": "alter", "form": "altered", "n": 1, "sq": 1, "sum": "Social media has [[changed]] business", "hook": "소셜 미디어가 비즈니스, 정치, 친목을 변화시켰다는 문장의 alter(변화시키다) → 요약문에서는 change(바꾸다)로 바꿨어요.", "b": "change", "k": "변화시키다 → 바꾸다", "en": "Social media has altered business, politics, and friendships, making going viral a household term.", "ko": "소셜 미디어는 비즈니스, 정치, 친목을 변화시켰으며, ‘입소문이 나다’를 일상적인 용어로 만들었다."}, {"a": "link", "form": "links", "n": 2, "sq": 1, "sum": "the global financial industry [[connects]] banks", "hook": "금융 산업이 모든 은행과 가정을 연결한다는 문장의 link(연결하다) → 요약문에서는 connect(연결하다)로 바꿨어요.", "b": "connect", "k": "연결하다 → 연결하다", "en": "The global financial industry links every bank and countless households in every country, making us vulnerable to human error taking place on the other side of the world.", "ko": "세계 금융 산업은 모든 은행과 전 세계 각국의 수많은 가정을 연결하여, 우리를 세계의 다른 곳에서 발생한 인간의 오류에 취약해지게 만들었다."}, {"a": "vulnerable", "form": "vulnerable", "n": 2, "sq": 1, "sum": "making us [[open]] to errors", "hook": "지구 반대편의 실수에 취약해진다는 문장의 vulnerable(취약한) → 요약문에서는 open(노출된)으로 바꿨어요.", "b": "open", "k": "취약한 → 노출된", "en": "The global financial industry links every bank and countless households in every country, making us vulnerable to human error taking place on the other side of the world.", "ko": "세계 금융 산업은 모든 은행과 전 세계 각국의 수많은 가정을 연결하여, 우리를 세계의 다른 곳에서 발생한 인간의 오류에 취약해지게 만들었다."}, {"a": "separate", "form": "separate", "n": 3, "sq": 2, "sum": "most institutions were [[isolated]]", "hook": "옛날 기관들은 서로 분리되어 있었다는 문장의 separate(분리된) → 요약문에서는 isolated(고립된)로 바꿨어요.", "b": "isolated", "k": "분리된 → 고립된", "en": "As Columbia University strategy professor Rita McGrath explains, years ago most of our institutions were separate and thereby buffered from the effects of errors outside their walls.", "ko": "Columbia University 전략학 교수 Rita McGrath가 설명하듯이, 수년 전 우리의 기관들 중 대부분은 서로 분리되어 있었고, 따라서 그것들의 장벽 밖에 있는 오류들의 영향으로부터 보호되었다."}, {"a": "buffer", "form": "buffered", "n": 3, "sq": 2, "sum": "they were [[shielded]] from the effects", "hook": "바깥 오류의 영향으로부터 보호되었다는 문장의 buffer(보호하다) → 요약문에서는 shield(막아 주다)로 바꿨어요.", "b": "shield", "k": "보호하다 → 막아 주다", "en": "As Columbia University strategy professor Rita McGrath explains, years ago most of our institutions were separate and thereby buffered from the effects of errors outside their walls.", "ko": "Columbia University 전략학 교수 Rita McGrath가 설명하듯이, 수년 전 우리의 기관들 중 대부분은 서로 분리되어 있었고, 따라서 그것들의 장벽 밖에 있는 오류들의 영향으로부터 보호되었다."}, {"a": "enormously", "form": "enormously", "n": 5, "sq": 3, "sum": "digital information grew [[hugely]]", "hook": "정보의 디지털화가 엄청나게 늘었다는 문장의 enormously(엄청나게) → 요약문에서는 hugely(엄청나게)로 바꿨어요.", "b": "hugely", "k": "엄청나게 → 엄청나게", "en": "The digitization of massive amounts of information has continued to grow enormously as the cost of computing power has decreased.", "ko": "컴퓨팅 능력의 비용이 감소함에 따라 방대한 양의 정보의 디지털화는 계속해서 엄청나게 증가해 왔다."}, {"a": "infinite", "form": "infinite", "n": 6, "sq": 3, "sum": "caused [[countless]] possible breakdowns", "hook": "무한히 다양한 고장을 낳았다는 문장의 infinite(무한한) → 요약문에서는 countless(셀 수 없이 많은)로 바꿨어요.", "b": "countless", "k": "무한한 → 셀 수 없이 많은", "en": "The development of smart systems that communicate autonomously gave rise to an infinite variety of potential breakdowns.", "ko": "자율적으로 소통하는 스마트 시스템의 발달은 무한히 다양한 잠재적 고장들을 초래했다."}, {"a": "potential", "form": "potential", "n": 6, "sq": 3, "sum": "countless [[possible]] breakdowns", "hook": "잠재적인 고장들이라는 문장의 potential(잠재적인) → 요약문에서는 possible(일어날 수 있는)로 바꿨어요.", "b": "possible", "k": "잠재적인 → 일어날 수 있는", "en": "The development of smart systems that communicate autonomously gave rise to an infinite variety of potential breakdowns.", "ko": "자율적으로 소통하는 스마트 시스템의 발달은 무한히 다양한 잠재적 고장들을 초래했다."}, {"a": "create", "form": "creates", "n": 9, "sq": 4, "sum": "information technology [[brings]] new weaknesses", "hook": "정보 기술이 새로운 취약성을 만들어 낸다는 문장의 create(만들어 내다) → 요약문에서는 bring(가져오다)으로 바꿨어요.", "b": "bring", "k": "만들어 내다 → 가져오다", "en": "Information technology creates new vulnerabilities because interconnectedness instantly spreads the impact of small failures.", "ko": "정보 기술은 새로운 취약성을 만들어 내는데, 왜냐하면 상호 연결성이 작은 실패들의 영향을 즉각적으로 확산시키기 때문이다."}, {"a": "vulnerability", "form": "vulnerabilities", "n": 9, "sq": 4, "sum": "brings new [[weaknesses]]", "hook": "정보 기술이 새로운 취약성을 만든다는 문장의 vulnerability(취약성) → 요약문에서는 weakness(약점)로 바꿨어요.", "b": "weakness", "k": "취약성 → 약점", "en": "Information technology creates new vulnerabilities because interconnectedness instantly spreads the impact of small failures.", "ko": "정보 기술은 새로운 취약성을 만들어 내는데, 왜냐하면 상호 연결성이 작은 실패들의 영향을 즉각적으로 확산시키기 때문이다."}, {"a": "instantly", "form": "instantly", "n": 9, "sq": 4, "sum": "the impact of small failures [[immediately]]", "hook": "작은 실패의 영향이 즉각적으로 퍼진다는 문장의 instantly(즉각적으로) → 요약문에서는 immediately(즉시)로 바꿨어요.", "b": "immediately", "k": "즉각적으로 → 즉시", "en": "Information technology creates new vulnerabilities because interconnectedness instantly spreads the impact of small failures.", "ko": "정보 기술은 새로운 취약성을 만들어 내는데, 왜냐하면 상호 연결성이 작은 실패들의 영향을 즉각적으로 확산시키기 때문이다."}], "passage": [{"n": 1, "en": "Social media has altered business, politics, and friendships, making going viral a household term.", "ko": "소셜 미디어는 비즈니스, 정치, 친목을 변화시켰으며, ‘입소문이 나다’를 일상적인 용어로 만들었다."}, {"n": 2, "en": "The global financial industry links every bank and countless households in every country, making us vulnerable to human error taking place on the other side of the world.", "ko": "세계 금융 산업은 모든 은행과 전 세계 각국의 수많은 가정을 연결하여, 우리를 세계의 다른 곳에서 발생한 인간의 오류에 취약해지게 만들었다."}, {"n": 3, "en": "As Columbia University strategy professor Rita McGrath explains, years ago most of our institutions were separate and thereby buffered from the effects of errors outside their walls.", "ko": "Columbia University 전략학 교수 Rita McGrath가 설명하듯이, 수년 전 우리의 기관들 중 대부분은 서로 분리되어 있었고, 따라서 그것들의 장벽 밖에 있는 오류들의 영향으로부터 보호되었다."}, {"n": 4, "en": "That is no longer the case.", "ko": "더 이상은 그렇지 않다."}, {"n": 5, "en": "The digitization of massive amounts of information has continued to grow enormously as the cost of computing power has decreased.", "ko": "컴퓨팅 능력의 비용이 감소함에 따라 방대한 양의 정보의 디지털화는 계속해서 엄청나게 증가해 왔다."}, {"n": 6, "en": "The development of smart systems that communicate autonomously gave rise to an infinite variety of potential breakdowns.", "ko": "자율적으로 소통하는 스마트 시스템의 발달은 무한히 다양한 잠재적 고장들을 초래했다."}, {"n": 7, "en": "This interdependence is a breeding ground for complex failure.", "ko": "이러한 상호 의존성은 복합적 실패의 온상이다."}, {"n": 8, "en": "As Rita puts it, when “things that used to be kept separate bump up against each other, it becomes far more difficult to predict what’s going to happen next.”", "ko": "Rita가 말하듯, ‘분리되어 있던 것들이 서로 부딪치게 될 때, 다음에 무슨 일이 일어날지를 예측하는 것은 훨씬 더 어려워진다.’"}, {"n": 9, "en": "Information technology creates new vulnerabilities because interconnectedness instantly spreads the impact of small failures.", "ko": "정보 기술은 새로운 취약성을 만들어 내는데, 왜냐하면 상호 연결성이 작은 실패들의 영향을 즉각적으로 확산시키기 때문이다."}], "questions": [{"id": 1, "summary": "Social media has (A) business, politics, and friendships, and the global financial industry (B) banks and households worldwide, making us open to errors far away.", "ko": "소셜 미디어는 비즈니스, 정치, 친목을 <b>(A) 바꾸었고</b>, 세계 금융 산업은 전 세계의 은행과 가정을 <b>(B) 연결하여</b> 우리를 멀리서 일어난 오류에 노출되게 만들었다.", "opts": [["changed", "separates"], ["preserved", "connects"], ["preserved", "separates"], ["ignored", "protects"], ["changed", "connects"]], "optko": ["바꾸다 – 분리하다", "보존하다 – 연결하다", "보존하다 – 분리하다", "무시하다 – 보호하다", "바꾸다 – 연결하다"], "ans": 4, "wrong": ["separates(분리하다)가 틀려요. 본문 2번에서 금융 산업은 모든 은행과 가정을 연결해요(links). 그래서 먼 곳의 오류에도 흔들려요.", "preserved(보존하다)가 틀려요. 본문 1번에서 소셜 미디어는 비즈니스, 정치, 친목을 변화시켰어요(altered). 그대로 지킨 게 아니에요.", "둘 다 틀려요. 소셜 미디어는 여러 분야를 그대로 보존한 게 아니라 바꾸었고, 금융 산업은 은행과 가정을 분리하는 게 아니라 연결해요.", "둘 다 틀려요. 소셜 미디어는 여러 분야를 무시한(ignore) 게 아니라 바꾸었고, 금융 산업은 우리를 보호하는(protect) 게 아니라 연결해서 먼 곳의 오류에 취약하게 만들어요.", null], "evid": [{"n": 1, "hl": ["Social media has altered business, politics, and friendships"]}, {"n": 2, "hl": ["links every bank and countless households in every country", "vulnerable to human error taking place on the other side of the world"]}], "swaps": [["alter", "change", "변화시키다 → 바꾸다"], ["link", "connect", "연결하다 → 연결하다"], ["vulnerable", "open", "취약한 → 노출된"]], "swapnote": "alter(변화시키다)는 change(바꾸다)로, link(연결하다)는 connect(연결하다)로, vulnerable to(~에 취약한)는 open to(~에 노출된)로 바뀌었어요.", "use": [{"w": "change", "ex": "The new phone changed my life.", "ko": "새 휴대폰이 내 삶을 바꾸었다.", "wk": "바꾸다", "hk": "바꾸었다"}, {"w": "connect", "ex": "This bridge connects the two towns.", "ko": "이 다리는 두 마을을 연결한다.", "wk": "연결하다", "hk": "연결한다"}], "flow": "본문 1번에서 소셜 미디어가 비즈니스, 정치, 친목을 바꾸었다고 하고, 2번에서 금융 산업이 전 세계 은행과 가정을 이어서 지구 반대편의 실수에도 우리가 흔들리게 됐다고 이어요.", "jd": [["Social media has [[changed]]", "소셜 미디어는 [[바꾸었다]]"], ["business, politics, and friendships,", "비즈니스, 정치, 친목을,"], ["and the global financial industry [[connects]]", "그리고 세계 금융 산업은 [[연결한다]]"], ["banks and households worldwide,", "전 세계의 은행과 가정을,"], ["making us open to errors far away.", "그래서 우리를 멀리서 일어난 오류에 노출되게 만든다."]], "fc": [["본문 1번", "소셜 미디어가 세상을 바꿨다", "소셜 미디어는 비즈니스, 정치, 친목을 {{alter|변화시켰다}}."], ["본문 2번", "금융은 전 세계를 잇는다", "금융 산업은 모든 은행과 가정을 {{link|연결해서}} 우리를 먼 곳의 실수에 {{vulnerable|취약하게}} 만든다."], ["정답 포인트", "{{alter|변화시키다}} = {{change|바꾸다}}, {{link|연결하다}} = {{connect|연결하다}}", "같은 뜻의 다른 단어예요."]], "evid_full": [{"en": "Social media has altered business, politics, and friendships, making going viral a household term.", "ko": "소셜 미디어는 비즈니스, 정치, 친목을 변화시켰으며, ‘입소문이 나다’를 일상적인 용어로 만들었다.", "hl": ["Social media has altered business, politics, and friendships"], "hlko": ["소셜 미디어는 비즈니스, 정치, 친목을 변화시켰으며"], "n": 1}, {"en": "The global financial industry links every bank and countless households in every country, making us vulnerable to human error taking place on the other side of the world.", "ko": "세계 금융 산업은 모든 은행과 전 세계 각국의 수많은 가정을 연결하여, 우리를 세계의 다른 곳에서 발생한 인간의 오류에 취약해지게 만들었다.", "hl": ["links every bank and countless households in every country", "vulnerable to human error taking place on the other side of the world"], "hlko": ["모든 은행과 전 세계 각국의 수많은 가정을 연결하여", "세계의 다른 곳에서 발생한 인간의 오류에 취약해지게"], "n": 2}]}, {"id": 2, "summary": "Years ago, most institutions were (A), so they were (B) from the effects of errors outside their walls, but that has changed.", "ko": "수년 전에는 대부분의 기관이 <b>(A) 분리되어</b> 있어서 장벽 밖의 오류가 주는 영향으로부터 <b>(B) 보호받았지만</b>, 그것은 바뀌었다.", "opts": [["isolated", "suffering"], ["isolated", "shielded"], ["connected", "shielded"], ["connected", "suffering"], ["united", "learning"]], "optko": ["분리된 – 시달리는", "분리된 – 보호받는", "연결된 – 보호받는", "연결된 – 시달리는", "하나로 합쳐진 – 배우는"], "ans": 1, "wrong": ["suffering(시달리는)이 틀려요. 본문 3번에서 옛날 기관들은 바깥 오류의 영향으로부터 보호되었어요(buffered). 시달린 게 아니에요.", null, "connected(연결된)가 틀려요. 본문 3번에서 옛날 기관들은 서로 분리되어(separate) 있었어요. 연결된 건 지금 이야기예요.", "둘 다 틀려요. 옛날 기관들은 연결된 게 아니라 분리되어 있었고, 그래서 바깥 오류에 시달린 게 아니라 보호받았어요.", "둘 다 틀려요. 옛날 기관들은 하나로 합쳐진(united) 게 아니라 분리되어 있었고, 오류에서 배운(learn) 게 아니라 오류의 영향으로부터 보호받았어요."], "evid": [{"n": 3, "hl": ["most of our institutions were separate", "buffered from the effects of errors outside their walls"]}, {"n": 4, "hl": ["That is no longer the case."]}], "swaps": [["separate", "isolated", "분리된 → 고립된"], ["buffer", "shield", "보호하다 → 막아 주다"]], "swapnote": "separate(분리된)는 isolated(고립된)로, buffered(보호된)는 shielded(보호받는)로 바뀌었어요. no longer the case(더 이상 그렇지 않다)는 that has changed(그것은 바뀌었다)로 읽어요.", "use": [{ function vHome(){
  var d=doneCount(),f=firstOpen();
  var h='<a class="tag" href="../yoyak.html" style="text-decoration:none">목록</a><h1>'+DATA.meta.lesson+' '+esc(DATA.meta.title)+'</h1><p class="sub">요약문 연습 '+DATA.meta.label+' · '+Qs.length+'문제</p><div class="nums">';
  Qs.forEach(function(q,i){var a=PR.a[q.id];h+='<button class="nb '+(a===undefined?'':(a===q.ans?'o':'x'))+'" data-a="q" data-v="'+i+'">'+(i+1)+'</button>'});
  h+='</div>';
  h+=yyLine();
  h+='<button class="btn pri" data-a="resume">'+(d===0?'시작하기':(f<0?'결과 보기':'이어서 풀기 ('+d+' / '+Qs.length+')'))+'</button>';
  h+='<button class="btn sec" data-a="sw">바꿔 말하기 연습</button>'+(nFlag()?'<button class="btn flagbtn" data-a="chk">선생님 확인 단어 '+nFlag()+'개</button>':'');
  h+='<div class="foot"><button data-a="reset">문제 다시 풀기</button></div>';
  return h;
}
function vQ(){
  var q=Qs[cur],a=PR.a[q.id],done=a!==undefined;curQ=q.id;
  var h='<div class="top"><button class="back" data-a="home">목록</button><button class="back" data-a="sw">바꿔 말하기</button><span class="cnt">'+(cur+1)+' / '+Qs.length+'</span></div>';
  if(!done)h+='<p class="hint">문장의 밑줄 단어를 누르면 뜻이 나와요. 보기를 누르면 답을 골라요.</p>';
  h+='<div class="card sum">'+sumHtml(q,done)+'</div><div class="opts">';
  q.opts.forEach(function(o,i){
    var cls='opt'+(done?' lock':'');
    if(done){if(i===q.ans)cls+=' right';else if(i===a)cls+=' mine'}
    h+='<div class="'+cls+'"'+(done?'':' data-a="pick" data-v="'+i+'"')+'><span class="num">'+CN[i]+'</span><span class="ot">'+(done?words(o[0]):esc(o[0]))+'<span class="dash">–</span>'+(done?words(o[1]):esc(o[1]))+'</span>'+(done&&i===q.ans?'<span class="st">정답</span>':(done&&i===a?'<span class="st">내 답</span>':''))+'</div>';
  });
  h+='</div>';
  if(done){
    var ok=a===q.ans;
    h+='<div id="exp"><div class="card"><div class="row"><span class="badge">'+(cur+1)+'번</span><span class="chip">정답 '+CN[q.ans]+'</span><span class="msg '+(ok?'o':'x')+'">'+(ok?'맞았어요':'내 답 '+CN[a])+'</span></div>';
    h+='</div><div class="card"><p class="lb">직독직해 (끊어서 앞에서부터 이해해요)</p>'+jdHtml(q)+'<details><summary>자연스러운 해석 보기</summary><div class="ko">'+q.ko.replace(/\((A|B)\)\s*/g,'')+'</div></details></div>';
    h+='<div class="card"><p class="lb">보기 뜻</p><ul class="opl">';
    q.opts.forEach(function(o,i){h+='<li class="'+(i===q.ans?'a':'')+'">'+CN[i]+' '+(i===q.ans?'<mark>'+words(o[0])+' – '+words(o[1])+'</mark>':words(o[0])+' – '+words(o[1]))+'<span class="k">'+(i===q.ans?'<mark>'+esc(q.optko[i])+'</mark>  ← 정답':esc(q.optko[i]))+'</span></li>'});
    h+='</ul></div>';
    h+='<div class="card"><p class="lb">정답의 근거 · 본문 '+(EVK[String(q.id)]||q.evid_full.map(function(e){return [e.n]})).map(function(e){return e[0]+'번'}).join(', ')+'</p>';
    var EVS=EVK[String(q.id)];
    if(EVS)EVS.forEach(function(e){h+='<div class="ev"><div class="kk"><b class="evn">'+e[0]+'번</b> '+e[1]+'</div></div>'});
    else q.evid_full.forEach(function(e){h+='<div class="ev"><div class="en">'+rich(e.en,e.hl)+'</div><div class="kk">'+richKo(e.ko,e.hlko)+'</div></div>'});
    h+='</div>';
    h+='<div class="card"><p class="lb">이 단어, 이렇게 바뀌었어요</p>';
    q.swaps.forEach(function(s){h+='<div class="swap"><span class="a">'+words(s[0])+'</span><span class="arr">→</span><span class="b">'+words(s[1])+'</span><span class="ds">'+esc(s[2])+(/\s/.test(s[0])||/\s/.test(s[1])?'':' '+sayBtn(s[0],'듣기')+' '+sayBtn(s[1],'듣기'))+'</span></div>'});
    h+='<div class="note">'+esc(q.swapnote)+'</div></div>';
    h+='<div class="card"><p class="lb">쓰임 익히기</p><div class="use">';
    q.use.forEach(function(u){h+='<div class="u"><div class="uw">'+esc(u.w)+'<small class="uwk">('+esc(u.wk)+')</small></div><div class="ue">'+useEx(u)+'</div><div class="uk">'+esc(u.ko).replace(esc(u.hk),'<mark>'+esc(u.hk)+'</mark>')+'</div></div>'});
    h+='</div></div>';
    h+='<div class="card"><p class="lb">기억할 흐름</p><div class="fc">'+q.fc.map(function(c,i){return (i?'<div class="ar">▼</div>':'')+'<div class="c'+(i===q.fc.length-1?' last':'')+'"><span class="tg">'+esc(c[0])+'</span><div class="hd">'+mk(c[1])+'</div><div class="sb2">'+mk(c[2])+'</div></div>'}).join('')+'</div></div>';
    h+='<div class="card"><details><summary>다른 보기는 왜 아닐까요</summary><ul style="padding:0;margin:6px 0 0">';
    q.wrong.forEach(function(w,i){if(w)h+='<li><b>'+CN[i]+'</b> '+hlp(w)+'</li>'});
    h+='</ul></details></div>';
    h+='<button class="btn pri" data-a="next">'+(cur<Qs.length-1?'다음 문제':'결과 보기')+'</button><button class="btn sec" data-a="home">목록으로</button></div>';
  }
  return h;
}
function vRes(){
  var h='<div class="top"><button class="back" data-a="home">목록</button><button class="back" data-a="sw">바꿔 말하기</button></div><h1>'+Qs.length+'문제 중 '+okCount()+'문제 맞았어요</h1>';
  h+='<div class="nums">';
  Qs.forEach(function(q,i){var a=PR.a[q.id];h+='<button class="nb '+(a===undefined?'':(a===q.ans?'o':'x'))+'" data-a="q" data-v="'+i+'">'+(i+1)+'</button>'});
  h+='</div>';
  h+='<button class="btn pri" data-a="sw">바꿔 말하기 보기</button><button class="btn sec" data-a="reset">문제 다시 풀기</button><button class="btn sec" data-a="home">목록으로</button>';
  return h;
}
function sortedNotes(){return Object.keys(NOTES).map(function(k){return NOTES[k]}).sort(function(a,b){return b.t-a.t})}
function vNotes(){
  var L=sortedNotes();
  var h='<div class="top"><button class="back" data-a="home">목록</button><button class="back" data-a="sw">바꿔 말하기</button><span class="cnt">단어노트 '+L.length+'개</span></div>';
  if(!L.length)return h+'<div class="empty">밑줄 단어를 누르면 여기에 쌓여요.</div>';
  h+='<div class="card"><ul class="wl">';
  L.forEach(function(n){h+='<li><span class="lw">'+esc(n.l)+'</span><span class="lm">'+esc(n.k)+'</span>'+(n.c>1?'<span class="lc">'+n.c+'번</span>':'')+'<button class="rmw" data-a="rmnote" data-v="'+esc(n.l.toLowerCase())+'">빼기</button></li>'});
  return h+'</ul></div>';
}
function sk(id){return id.indexOf('sw:')===0?id.slice(3):id}
function wrongOf(id){var r=SRV[sk(id).toLowerCase()];return r&&r.c>0?r.c:0}
function flagList(){return Object.keys(SRV).map(function(k){return SRV[k]}).filter(function(r){return r.c>0}).sort(function(a,b){return b.c-a.c})}
function nFlag(){return flagList().length}
function srvLoad(){
  try{WN.list().then(function(r){
    if(!r||!r.ok||!r.items)return;SRV={};
    r.items.forEach(function(i){if(String(i.src||'').indexOf(SRC)>=0)SRV[String(i.w).toLowerCase()]={w:i.w,m:i.m,c:i.c||0}});
    if(view==='home'||view==='chk'||view==='sw')render();
  })}catch(e){}
}
function vChk(){
  var L=flagList();
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">선생님 확인 단어 '+L.length+'개</span></div>';
  if(!L.length)return h+'<div class="empty">틀린 단어가 없어요.</div>';
  h+='<p class="hint">선생님이 물어봤을 때 틀린 단어예요. 먼저 뜻을 떠올려 보고 확인해 보세요. 오답노트(H로드맵)에도 같이 있어요.</p><div class="card">';
  L.forEach(function(r){
    var id=r.w.toLowerCase(),o=swOpen['c'+id];
    h+='<div class="swr"><div class="swq"><span class="sa">'+esc(r.w)+'</span><span class="sb">'+(o?'<em>'+esc(r.m)+'</em>':'뜻은?')+'</span><small class="flag">'+r.c+'번 틀림</small><button data-a="rv" data-v="c'+esc(id)+'">'+(o?'가리기':'확인')+'</button></div></div>';
  });
  return h+'</div><a class="btn sec" style="display:block;text-align:center;text-decoration:none" href="https://nolbada.github.io/via/wn/">H로드맵 오답노트 열기</a>';
}
function sceneLine(t,cur){return esc(t).replace(/\[\[(\w+)\|([^\]]+)\]\]/g,function(m,w,k){return '<b class="wc'+(w.toLowerCase()===String(cur).toLowerCase()?' me':'')+'">'+w+'</b>('+k+')'})}

var EVK={};
var REL={};
function relBox(s){
  var r=REL[String(s.a).toLowerCase()];if(!r)return '';
  var it=[{t:s.b,k:String(s.k).split(' → ')[1]||'',c:'k'}];
  r.s.forEach(function(x){it.push({t:x[0],k:x[1],c:'s'})});
  r.a.forEach(function(x){it.push({t:x[0],k:x[1],c:'a'})});
  var P={1:[[50,80]],2:[[26,78],[74,78]],3:[[16,70],[50,86],[84,70]],4:[[14,62],[36,86],[64,86],[86,62]],5:[[12,56],[28,86],[50,92],[72,86],[88,56]]}[it.length],svg='',nd='';
  it.forEach(function(x,j){
    svg+='<line x1="50%" y1="26%" x2="'+P[j][0]+'%" y2="'+(P[j][1]-7)+'%" stroke="'+(x.c=='a'?'#c0392b':'#2f5d50')+'" stroke-width="2"/>';
    nd+='<div class="rn '+x.c+'" style="left:'+P[j][0]+'%;top:'+P[j][1]+'%">'+esc(x.t)+(x.k?'<small>'+esc(x.k)+'</small>':'')+'</div>';
  });
  var left=String(s.k).split(' → ')[0];
  var h='<div class="relx"><div class="rmap"><svg>'+svg+'</svg><div class="rn c" style="left:50%;top:26%">'+esc(s.a)+'<small>'+esc(left)+'</small></div>'+nd+'</div>'
   +'<div class="rleg"><span><i style="border-color:#2f5d50"></i>바꿔 쓸 수 있는 말</span>'+(r.a.length?'<span><i style="border-color:#c0392b"></i>반대말</span>':'')+'</div>'
   +'<div class="pit"><div><em>본문</em>'+r.bj+'</div><div><em>요약문</em><b>'+esc(s.b)+'</b>('+esc(String(s.k).split(' → ')[1]||'')+')로 바뀜</div>'+(r.tr?'<div class="tp"><em>함정</em>'+esc(r.tr)+'</div>':'')+'</div></div>';
  return h;
}
function vSw(){
  var L=swList(),sc={};
  (DATA.scenes||[]).forEach(function(c){(c.line.match(/\[\[\w+\|/g)||[]).forEach(function(m){sc[m.slice(2,-1).toLowerCase()]=c})});
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">바꿔 말하기 '+L.length+'개</span></div>';
  h+='<p class="hint">왼쪽 단어가 요약문에서 어떤 말로 바뀔까요? <b>소리 내어 말해 본 뒤</b> 확인을 눌러요.</p>';
  h+='<div class="tabs"><button data-a="rvall" data-v="open">모두 열기</button><button data-a="rvall" data-v="hide">모두 가리기</button><button data-a="staronly" class="'+(swStarOnly?'on':'')+'">별표만 '+Object.keys(STAR).length+'</button></div><div class="card">';
  if(swStarOnly)L=L.filter(function(s){return STAR[s.id]});
  if(!L.length)h+='<div class="empty">별표 친 단어가 없어요. 안 외워지는 단어에 별표를 눌러 두세요.</div>';
  L.forEach(function(s){
    var o=swOpen[s.id],c=sc[s.form.toLowerCase()],on=swD['s'+s.id],fl=wrongOf(s.id);
    h+='<div class="swr"><div class="swq"><span class="qn">'+s.sq+'번</span><span class="sa">'+words(s.a)+(fl?'<small class="flag">'+fl+'번 틀림</small>':'')+'</span><span class="sb">'+(o?'<em>'+words(s.b)+'</em>'+esc(s.k):'→ ?')+'</span>'+sayBtn(s.a,'듣기')+(o?sayBtn(s.b,'정답 듣기'):'')+'<button data-a="rv" data-v="'+esc(s.id)+'">'+(o?'가리기':'확인')+'</button><button data-a="star" data-v="'+esc(s.id)+'" class="stb'+(STAR[s.id]?' on':'')+'">별표</button></div>';
    if(o)h+=relBox(s);else if(REL[String(s.a).toLowerCase()]){var rr=REL[String(s.a).toLowerCase()];h+='<div class="hch">유 '+(1+rr.s.length)+(rr.a.length?' · 반 '+rr.a.length:'')+'</div>'}
    if(c&&!REL[String(s.a).toLowerCase()])h+='<button class="acc2" data-a="dt" data-v="s'+esc(s.id)+'">'+esc(c.tag)+' 줄거리<span>'+(on?'접기':'펼치기')+'</span></button>'+(on?'<div class="story">'+sceneLine(c.line,s.form)+'</div>':'');
    h+='</div>';
  });
  return h+'</div><p class="sumline">시험에서는 본문 단어가 뜻이 같은 다른 단어로 바뀌어 나와요.</p><button class="btn sec" data-a="home">목록으로</button>';
}
/* 자동 새로고침(기록 연동)이 일어나도 보던 문제로 되돌린다 */
try{var sv=JSON.parse(sessionStorage.getItem('vhyv')||'null');if(sv&&sv.p===location.pathname&&Date.now()-sv.t<600000&&sv.v&&sv.v!=='home'){view=sv.v;cur=sv.c||0;try{history.pushState({v:view},'');histPushed=true}catch(e){}}}catch(e){}
render();srvLoad();window.addEventListener('pageshow',srvLoad);
</script>
</body>
