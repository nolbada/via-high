<script>
var CAT={g:"어휘",o:"대명사",b:"연결어",k:"핵심 문장",p:"구문"};
var P={"num": "40", "sub": "고2 · 돌고래 뇌의 병렬 처리", "one": "돌고래의 청각 피질은 반향 정위 신호의 여러 측면을 특화된 구역들이 나누어 맡아 동시에 처리하므로, 인지 부하가 줄고 환경 변화에 빠르게 반응할 수 있음", "flow": [{"label": "도입부", "range": "1~3번", "sum": "돌고래의 뇌는 반향 정위를 전담하는 특화된 구역을 진화시켜 소리 정보를 더 빠르고 적은 에너지로 처리하고, 귀의 신호는 청각 피질로 빠르게 전달됨 <small>(specialized areas dedicated to echolocation)</small>", "eg": "어두운 동굴에서 소리를 지르고 메아리가 돌아오는 느낌으로 벽이 얼마나 먼지 짐작해 보는 것"}, {"label": "본론 (1)", "range": "4~5번", "sum": "다른 포유류와 달리 돌고래의 청각 피질은 따로 나뉜 구역들이 메아리의 타이밍, 주파수, 세기를 각각 맡음 <small>(distinct areas)</small>", "eg": "조별 과제에서 자료 조사, 발표 자료, 발표를 한 명씩 나누어 맡는 것"}, {"label": "본론 (2)", "range": "6~8번", "sum": "이 특화 덕분에 정보를 차례대로가 아니라 동시에 처리하며, 공장 조립 라인의 분업처럼 훨씬 빠르고 효율적임 <small>(in parallel, rather than sequentially)</small>", "eg": "계산대 하나에 줄을 세우는 대신 계산대 여러 개를 한꺼번에 여는 마트"}, {"label": "결론", "range": "9번", "sum": "병렬 처리가 반향 정위의 인지 부하를 줄여 돌고래가 환경 변화에 빠르게 반응하게 함 <small>(reduces the cognitive load)</small>", "eg": "머릿속이 덜 복잡하니 갑자기 날아오는 공도 바로 피할 수 있는 것"}, {"label": "요약", "range": "요약문", "sum": "청각 피질이 구역별로 신호를 동시에 처리하여 인지 부하 감소와 빠른 반응을 가능하게 함 <small>(simultaneously / thereby enabling)</small>", "eg": "여러 명이 나누어 동시에 하니 덜 지치고 더 빨라진다는 한 줄 정리"}], "sents": [{"n": 1, "mk": "Dolphins’ brains have evolved [1|specialized] areas [2|dedicated to echolocation], [3|allowing them to process] [4|acoustic] information more quickly and with less energy.", "ko": "돌고래들의 뇌는 반향 정위에 사용되는 특화된 구역들을 진화시켰고, 그것은 그것들이 음향 정보를 더 빠르게 그리고 더 적은 에너지로 처리하게 해 준다."}, {"n": 2, "mk": "One key [5|adaptation] is the structure of the dolphin’s [6|auditory pathway].", "ko": "한 가지 핵심적인 적응 구조는 돌고래의 청각 경로의 구조이다."}, {"n": 3, "mk": "The signals from the ears [7|are rapidly transmitted] to the [8|auditory cortex], [9|the brain region responsible for processing sound].", "ko": "귀로부터의 신호들은 소리를 처리하는 것을 담당하는 뇌 영역인 청각 피질로 빠르게 전달된다."}, {"n": 4, "mk": "[10|However], [11|unlike] many other mammals, dolphins have a highly specialized auditory cortex with [12|distinct] areas [13|dedicated to processing] different aspects of echolocation signals.", "ko": "그러나, 많은 다른 포유류들과 달리, 돌고래는 반향 정위 신호들의 서로 다른 측면들을 처리하는 것에 사용되는 개별 구역들을 가진 고도로 특화된 청각 피질을 가지고 있다.", "star": true}, {"n": 5, "mk": "[14|Some areas] may be responsible for analyzing the timing of echoes, [15|while] [16|others] focus on the frequency content or the [17|intensity] of the sound.", "ko": "어떤 구역들은 반사파들의 타이밍을 분석하는 것을 담당할지도 모르지만 한편으로는 다른 구역들은 소리의 주파수 성분 또는 강도에 초점을 맞춘다."}, {"n": 6, "mk": "[18|This specialization] [19|allows the dolphin’s brain to process] echo information [20|in parallel, rather than sequentially].", "ko": "이러한 특화는 돌고래의 뇌가 반사파 정보를 순차적이기보다 병렬로 처리하게 해 준다.", "star": true}, {"n": 7, "mk": "[21|Imagine a factory assembly line], [22|where] different workers are responsible for different tasks.", "ko": "공장 조립 라인을 상상해 보면, 그곳에서는 서로 다른 노동자들이 서로 다른 과업들을 담당한다."}, {"n": 8, "mk": "[23|By dividing the work among specialized areas], the brain can process information [24|much faster] and more [25|efficiently].", "ko": "특화된 구역들 사이에서 업무를 분담함으로써, 뇌는 정보를 훨씬 더 빠르고 더 효율적으로 처리할 수 있다."}, {"n": 9, "mk": "[26|This parallel processing] reduces the [27|cognitive load] [28|associated with echolocation], [29|allowing dolphins to react quickly] to changes in their environment.", "ko": "이러한 병렬 처리는 반향 정위와 연관된 인지 부하를 줄이고, 돌고래들이 자신의 환경에서의 변화들에 빠르게 반응하게 해 준다."}, {"n": "요약", "mk": "A dolphin’s auditory cortex processes the different aspects of echolocation signals [30|simultaneously] in its distinct areas, [31|thereby] [32|enabling the reduction of the cognitive load and the rapid responses] to changes in its environment.", "ko": "돌고래의 청각 피질은 반향 정위 신호들의 서로 다른 측면들을 동시에 처리한다 그것의 개별 구역들에서, 그렇게 함으로써 가능하게 한다 인지 부하의 감소와 그것의 환경에서의 변화들에 대한 신속한 반응들을.", "star": true}], "items": {"1": {"c": "g", "t": "specialized : 특화된, 전문화된", "n": ["specialized = 특화된, 전문화된", "specialize = 특화하다, 전문으로 하다", "specialization = 특화 (6번 문장)", "(반의) generalized = 일반화된"], "x": ["specialized areas는 ‘특화된 구역들’, 즉 한 가지 일만 전문으로 맡는 뇌 부위라는 뜻이다.", "6번 문장의 This specialization(이러한 특화)이 바로 이 단어의 명사형이다.", "글 전체가 ‘구역별로 일을 나누어 맡는다’는 내용이므로 첫 문장부터 핵심어로 기억해 둔다."]}, "2": {"c": "p", "t": "과거분사 후치 수식 : areas dedicated to echolocation", "n": ["dedicated to ~ = ~에 전념하는, ~ 전용의", "specialized areas (which are) dedicated to echolocation", "echolocation = 반향 정위 (소리를 내보내고 돌아오는 메아리로 위치를 알아내는 것)"], "x": ["dedicated to echolocation은 앞의 명사 specialized areas를 뒤에서 꾸미는 과거분사구이다.", "‘반향 정위에 쓰이는(전담하는) 특화된 구역들’로 해석한다.", "echolocation은 echo(메아리)와 location(위치)이 합쳐진 말로, 돌고래가 소리를 쏘아 메아리로 주변을 파악하는 능력이다."]}, "3": {"c": "p", "t": "분사구문 + allow O to V : 그 결과 ~할 수 있게 해 준다", "n": ["allowing ~ = 그리고 그것이 ~하게 해 준다 (결과)", "allow + O + to V = O가 ~하게 해 주다", "them = dolphins (돌고래들)"], "x": ["allowing them to process ~는 앞 내용의 결과를 나타내는 분사구문이다.", "allow는 목적격보어로 to부정사를 쓰므로 process나 processing이 아니라 to process가 맞다.", "them은 앞의 Dolphins를 가리킨다.", "특화된 구역 덕분에 ‘더 빠르게, 더 적은 에너지로’ 처리한다는 장점이 글 전체의 출발점이다."]}, "4": {"c": "g", "t": "acoustic : 음향의, 소리의", "n": ["acoustic = 음향의, 소리의", "(유의) auditory = 청각의", "acoustic information = 음향 정보, 소리 정보", "(비교) visual = 시각의"], "x": ["acoustic information은 ‘소리로 들어오는 정보’라는 뜻이다.", "돌고래는 눈보다 소리로 주변을 파악하므로 이 정보를 빨리 처리하는 것이 중요하다.", "more quickly and with less energy는 ‘더 빠르게 그리고 더 적은 에너지로’라는 뜻으로, 부사와 전치사구가 and로 이어져 있다."]}, "5": {"c": "g", "t": "adaptation : 적응, 적응 구조", "n": ["adaptation = 적응, (진화로 생긴) 적응 형질", "adapt = 적응하다", "One key adaptation = 한 가지 핵심적인 적응 구조"], "x": ["adaptation은 환경에 맞게 몸이나 기능이 바뀐 것을 말한다.", "One key adaptation is ~는 ‘한 가지 핵심 적응 구조는 ~이다’라는 뜻으로, 1번에서 말한 특화의 구체적인 내용을 하나씩 소개하기 시작하는 문장이다."]}, "6": {"c": "g", "t": "auditory pathway : 청각 경로", "n": ["auditory = 청각의", "pathway = 경로, 길", "auditory pathway = 소리 신호가 귀에서 뇌로 가는 길"], "x": ["the structure of the dolphin’s auditory pathway는 ‘돌고래의 청각 경로의 구조’라는 뜻이다.", "auditory는 3번의 auditory cortex(청각 피질)에도 다시 나오는 단어이다.", "다음 문장에서 이 경로를 따라 신호가 어디로 가는지 설명한다."]}, "7": {"c": "p", "t": "수동태 : are rapidly transmitted (빠르게 전달된다)", "n": ["be + p.p. = ~되다 (수동태)", "transmit = 전달하다, 전송하다", "be transmitted to ~ = ~로 전달되다"], "x": ["주어 Th
