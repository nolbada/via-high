<script>
var CAT={g:"어휘",o:"대명사",b:"연결어",k:"핵심 문장",p:"구문"};
var P={"num": "41-42", "sub": "고2 · 무료함의 가치와 자기 성찰", "one": "무료함은 방치하면 해로운 감정을 낳지만 본래 안전할 때만 누리는 사치이므로, 한가한 시간을 낭비가 아닌 자기 성찰과 성장의 기회로 활용해야 함", "flow": [{"label": "도입부", "range": "1~3번", "sum": "무료함을 제대로 다루지 않으면 우울·절망·짜증 같은 해로운 감정이 생기고, 재미만 좇으면 그 활동에 의존하게 됨. ‘한가한 시간은 악마의 작업장’이라는 통념 <small>(give rise to harmful emotions)</small>", "eg": "할 일이 없으면 무조건 게임부터 켜고, 게임을 못 하면 괜히 짜증이 나는 상태"}, {"label": "본론 (1)", "range": "4번", "sum": "균형점은 그 시간을 낭비가 아니라 자기 개선·자기 발견·긍정적 성찰을 위한 완벽한 시간으로 보는 것 <small>(not ~ but rather as a perfect time)</small>", "eg": "버스를 기다리는 10분을 버리는 시간 대신 오늘 하루를 돌아보는 시간으로 쓰는 것"}, {"label": "본론 (2)", "range": "5~8번", "sum": "무료할 수 있다는 것은 행운이며, 무료함은 위험이 없는 안전지대에서만 누리는 사치라서 위험한 상황에서는 누릴 수 없음 <small>(a luxury / in a safe zone)</small>", "eg": "시험 전날에는 심심할 틈이 없고, 시험이 끝난 주말에야 ‘심심하다’는 말이 나오는 것"}, {"label": "결론", "range": "9~11번", "sum": "따라서 한가한 순간을 깊은 자기 성찰에 활용해야 하며, 무료함은 개인적 발달과 건설적인 사유의 기회로 여겨져야 함 <small>(an opportunity for personal development)</small>", "eg": "심심한 저녁에 휴대폰을 내려놓고 일기를 쓰며 내 생각을 정리하는 것"}], "sents": [{"n": 1, "mk": "[1|It is crucial to recognize] that boredom can [2|give rise to] harmful emotions such as depression, despair, and irritation [3|if not adequately addressed].", "ko": "무료함이 적절하게 다뤄지지 않는다면 우울, 낙담, 그리고 짜증과 같은 해로운 감정들을 발생시킬 수 있다는 것을 인식하는 것은 중요하다."}, {"n": 2, "mk": "When we believe that [4|the only way to be happy] is by searching for fun activities, then we become [5|dependent on] [6|those activities], and negative thoughts and emotions [7|arise].", "ko": "우리가 행복해지는 유일한 방법이 재미있는 활동들을 찾는 것에 의해서만이라고 믿으면, 그때 우리는 그러한 활동들에 의존하게 되고, 부정적인 생각들과 감정들이 생긴다.", "star": true}, {"n": 3, "mk": "It is suggested that [8|‘Idle time is the devil’s workshop’] [9|implies] that [10|those with too much time on their hands] may fill that time with [11|troubling] thoughts and behavior.", "ko": "‘아무것도 안 하는 시간은 악마의 작업장이다’라는 것은 자신의 손에 너무 많은 시간을 가진 사람들이 그 시간을 문제를 일으키는 생각들과 행동으로 채울 수 있다는 것을 암시한다고 일컬어진다."}, {"n": 4, "mk": "The balance is [12|to not see] [13|it] as idle time, wasted time, or boredom [14|but rather as] a perfect time for self-improvement, self-identification, and positive [15|reflection] time.", "ko": "균형점은 그것을 아무것도 안 하는 시간, 낭비된 시간, 또는 무료함으로 보는 것이 아니라, 오히려 자기 개선, 자기 발견, 그리고 긍정적인 성찰 시간을 위한 완벽한 시간으로 보는 것이다.", "star": true}, {"n": 5, "mk": "[16|Reflecting], just [17|how lucky are we to be bored]?", "ko": "곰곰이 생각해 보면 우리가 무료할 수 있어서 정말 얼마나 행운인가?"}, {"n": 6, "mk": "Boredom doesn’t exist [18|in the presence of] danger, [19|as] [20|it] is only an [21|indulgence pastime] in a safe zone.", "ko": "무료함은 위험이 존재하는 곳에서는 존재하지 않는데, 왜냐하면 그것이 단지 안전지대 안에서의 탐닉 활동이기 때문이다."}, {"n": 7, "mk": "Boredom can [22|be perceived as] [23|a luxury] [24|that typically manifests] in safe and inactive situations, [25|providing an occasion to appreciate and comprehend] the environment.", "ko": "무료함은 안전하고 할 일이 없는 상황들에서 전형적으로 나타나는 사치로 인식될 수 있으며, 환경을 인식하고 이해할 기회를 제공한다."}, {"n": 8, "mk": "In [26|hazardous] circumstances, [27|the luxury of boredom] is [28|unavailable].", "ko": "위험한 상황들에서, 무료함이라는 사치는 손에 넣을 수 없다."}, {"n": 9, "mk": "[29|Thus], [30|it is paramount to utilize] idle moments for [31|profound] self-reflection.", "ko": "따라서, 심오한 자기 성찰을 위해 아무것도 안 하는 순간들을 활용하는 것은 가장 중요하다.", "star": true}, {"n": 10, "mk": "[32|It] represents an occasion to [33|listen, observe, and appreciate] [34|before expressing].", "ko": "그것은 표현하기 전에 경청하고, 관찰하고, 그리고 인식할 기회를 의미한다."}, {"n": 11, "mk": "[35|Rather than viewing boredom as unproductive], [36|it should be regarded as an opportunity for personal development] and [37|constructive] [38|contemplation].", "ko": "무료함을 비생산적이라고 여기기보다, 그것은 개인적 발달과 건설적인 사유를 위한 기회로 여겨져야 한다.", "star": true}], "items": {"1": {"c": "p", "t": "가주어 It + 진주어 to recognize + that절", "n": ["It is crucial to V = ~하는 것은 중요하다", "It = 가주어 / to recognize ~ = 진주어", "recognize that ~ = ~라는 것을 인식하다"], "x": ["It은 가주어이고 진짜 주어는 to recognize 이하이다.", "that 이하는 recognize의 목적어인 명사절이다.", "crucial은 ‘중요한, 결정적인’이라는 뜻이다.", "글은 무료함의 위험을 먼저 보여 주며 시작하지만, 뒤에서 관점을 뒤집는다."]}, "2": {"c": "g", "t": "give rise to : ~을 일으키다, 발생시키다", "n": ["give rise to ~ = ~을 일으키다 (= cause, lead to)", "harmful emotions = 해로운 감정들", "depression = 우울 / despair = 절망, 낙담 / irritation = 짜증"], "x": ["give rise to는 하나의 덩어리 동사로 ‘~을 낳다, 일으키다’라는 뜻이다.", "to는 전치사이므로 뒤에 명사(harmful emotions)가 온다.", "such as depression, despair, and irritation은 해로운 감정의 예를 나열한 것이다."]}, "3": {"c": "p", "t": "접속사가 남은 분사구문 : if not adequately addressed", "n": ["= if it(boredom) is not adequately addressed", "address = (문제를) 다루다, 처리하다 (다의어: 연설하다, 주소)", "adequately = 적절하게, 충분히"], "x": ["if 뒤에 주어와 be동사(it is)가 생략되고 과거분사 addressed만 남은 형태이다.", "무료함은 사람이 ‘다루는’ 대상이므로 수동의 과거분사 addressed가 맞다.", "address는 여기서 ‘(문제를) 다루다’라는 뜻이며, ‘주소, 연설하다’라는 뜻도 있는 다의어이다.", "무료함 자체가 나쁜 것이 아니라 ‘제대로 다루지 않을 때’ 문제가 된다는 조건이 중요하다."]}, "4": {"c": "p", "t": "to부정사의 형용사적 용법 : the only way to be happy", "n": ["the only way to be happy = 행복해지는 유일한 방법", "is by searching for ~ = ~을 찾는 것에 의해서이다", "by + -ing = ~함으로써"], "x": ["to be happy는 앞의 명사 the only way를 꾸미는 형용사적 용법의 to부정사이다.", "that절의 동사는 is이고, by searching for fun activities가 보어 자리에 온 전치사구이다.", "재미있는 활동만이 행복의 길이라고 믿는 잘못된 태도를 보여 준다."]}, "5": {"c": "g", "t": "dependent on : ~에 의존하는", "n": ["be/become dependent on ~ = ~에 의존하다", "(유의) reliant on ~", "(반의) independent of ~ = ~로부터 독립한", "depend on = ~에 의존하다"], "x": ["become dependent on those activities는 ‘그러한 활동들에 의존하게 된다’라는 뜻이다.", "dependent는 become의 보어로 쓰인 형용사이다.", "42번 어휘 문제에서 (a)로 표시된 자리이다. 재미만 좇으면 그 활동 없이는 못 견디게 된다는 흐름에 맞는 말이다."]}, "6": {"c": "o", "t": "those activities = fun activities (재미있는 활동들)", "n": ["those activities = 앞의 fun activities", "재미있는 활동들 = 행복의 유일한 길이라고 믿은 것"], "x": ["those activities는 바로 앞의 fun activities를 가리킨다.", "그 활동에 기대게 될수록 오히려 부정적인 생각과 감정이 생긴다는 역설이다."]}, "7": {"c": "p", "t": "자동사 arise : 생기다, 발생하다", "n": ["arise - arose - arisen = 생기다 (자동사, 목적어 없음)", "arouse = ~을 불러일으키다 (타동사)", "raise = ~을 올리다, 일으키다 (타동사)"], "x": ["negative thoughts and emotions arise는 ‘부정적인 생각과 감정이 생긴다’라는 뜻이다.", "arise는 목적어를 취하지 않는 자동사라서 수동태로 쓸 수 없다.", "뒤에 전환)", "n": ["not ~ as A but rather as B", "= A로 보는 것이 아니라 오히려 B로 보는 것", "A = idle time, wasted time, boredom", "B = a perfect time for self-improvement"], "x": ["but rather as가 앞의 not see it as와 짝을 이루어 대조를 만든다. as와 as가 나란히 병렬을 이룬다.", "1~3번의 부정적인 시각에서 긍정적인 시각으로 글의 방향이 바뀌는 지점이다.", "글의 주장(무료한 시간 = 자기 성찰의 기회)이 처음 드러나는 문장이다."], "e": "쉬운 예시 : 버스를 기다리는 10분을 버리는 시간이 아니라 오늘 하루를 정리하는 시간으로 쓰는 것이다."}, "15": {"c": "g", "t": "reflection : 성찰, 깊이 생각함 (다의어: 반사, 비친 모습)", "n": ["reflection = 성찰, 깊이 생각함", "reflect = 곰곰이 생각하다 / 반사하다, 비추다", "self-improvement = 자기 개선 / self-identification = 자기 발견"], "x": ["positive reflection time은 ‘긍정적인 성찰 시간’이라는 뜻이다.", "reflection은 ‘거울에 비친 모습, 반사’라는 뜻도 있는 다의어이다.", "바로 다음 5번 문장의 Reflecting, 9번의 self-reflection으로 이어지며 글 전체에 반복되는 핵심어이다."]}, "16": {"c": "p", "t": "분사구문 Reflecting : 곰곰이 생각해 보면", "n": ["Reflecting, ~ = 곰곰이 생각해 보면", "reflect = 곰곰이 생각하다"], "x": ["Reflecting은 문장 전체에 걸리는 분사구문으로 ‘곰곰이 생각해 보면’이라는 뜻이다.", "4번에서 말한 성찰(reflection)을 직접 해 보라고 권하는 느낌을 준다."]}, "17": {"c": "p", "t": "감탄의 의문문 : how lucky are we to be bored? (얼마나 행운인가)", "n": ["how + 형용사 + 동사 + 주어? = 얼마나 ~한가?", "just = 정말, 도대체 (강조)", "to be bored = 무료할 수 있어서 (판단의 근거)"], "x": ["답을 묻는 질문이 아니라 ‘우리는 무료할 수 있어서 정말 운이 좋다’는 것을 강하게 말하는 수사의문문이다.", "직접의문문이라 are we로 동사가 주어 앞에 왔다. 간접의문문이라면 how lucky we are 어순이 된다.", "to be bored는 lucky의 이유를 나타내는 부사적 용법의 to부정사이다.", "무료함을 불평거리가 아니라 행운으로 보는 반전의 문장이다."]}, "18": {"c": "g", "t": "in the presence of : ~이 있는 곳에서", "n": ["in the presence of ~ = ~이 있는 곳에서, ~의 앞에서", "presence = 존재, 있음", "(반의) absence = 없음, 부재"], "x": ["in the presence of danger는 ‘위험이 있는 곳에서’라는 뜻이다.", "위험이 있으면 무료함은 생기지 않는다는 말로, 무료함이 안전의 증거라는 생각으로 이어진다."]}, "19": {"c": "b", "t": "as : ~이기 때문에 (이유)", "n": ["as + 주어 + 동사 = ~이기 때문에", "as는 이유, 시간(~할 때), 방식(~처럼) 등 뜻이 많음"], "x": ["as는 여기서 이유를 나타내는 접속사이다.", "위험 속에는 무료함이 없다(결과), 무료함은 안전지대에서만 누리는 것이기 때문이다(이유)라는 흐름이다."]}, "20": {"c": "o", "t": "it = boredom (무료함)", "n": ["as it is only ~ = 그것(무료함)은 단지 ~이기 때문에", "it = Boredom"], "x": ["it은 같은 문장 앞의 Boredom을 가리킨다."]}, "21": {"c": "g", "t": "indulgence pastime : 마음껏 누리는 소일거리", "n": ["indulgence = 마음껏 함, 탐닉, 사치", "indulge in ~ = ~을 마음껏 즐기다", "pastime = 소일거리, 취미"], "x": ["an indulgence pastime은 ‘마음껏 누리는 소일거리’라는 뜻이다.", "살아남는 데 바쁘지 않은 사람만 누릴 수 있는 여유라는 느낌을 준다.", "in a safe zone(안전지대에서)이 이 말의 조건이며, 7번의 luxury(사치)로 이어진다."]}, "22": {"c": "p", "t": "perceive A as B의 수동태 : be perceived as B", "n": ["perceive A as B = A를 B로 인식하다", "A be perceived as B = A가 B로 인식되다", "(같은 형태) see/view/regard A as B"], "x": ["Boredom can be perceived as a luxury는 ‘무료함은 사치로 인식될 수 있다’라는 뜻이다.", "perceive A as B가 수동태로 바뀌어 A(Boredom)가 주어로 나왔다.", "11번의 be regarded as도 같은 형태이다."]}, "23": {"c": "k", "t": "핵심 비유 : 무료함 = 사치 (안전할 때만 누리는 것)", "n": ["luxury = 사치, 호사", "(반의) necessity = 필수품", "무료함 = 안전하고 할 일 없는 상황에서만 나오는 사치"], "x": ["보통 부정적으로 여기는 무료함을 ‘사치’에 비유하여, 오히려 귀한 것이라는 생각을 심어 준다.", "6~8번은 모두 ‘무료함은 안전할 때만 생긴다’는 같은 내용을 다른 말로 반복한다.", "8번에서 the luxury of boredom으로 다시 나온다."], "e": "쉬운 예시 : 시험 전날 밤에는 심심할 틈이 없고, 시험이 끝난 주말에야 ‘아, 심심하다’는 말이 나온다."}, "24": {"c": "p", "t": "주격 관계대명사 that + 단수 동사 manifests", "n": ["a luxury that typically manifests ~ = 전형적으로 ~에서 나타나는 사치", "manifest = 나타나다, 드러나다", "safe and inactive situations = 안전하고 할 일이 없는 상황들"], "x": ["that은 선행사 a luxury를 꾸미는 주격 관계대명사이다.", "선행사가 단수이므로 관계절 동사도 단수 manifests이다.", "manifest는 여기서 ‘나타나다’라는 자동사로 쓰였다."]}, "25": {"c": "p", "t": "분사구문 providing + to부정사의 형용사적 용법", "n": ["providing an occasion = 기회를 제공하면서", "an occasion to appreciate and comprehend = 인식하고 이해할 기회", "appreciate = 진가를 알다, 감상하다, 고마워하다 (다의어)"], "x": ["providing ~은 앞 내용에 이어지는 결과를 나타내는 분사구문이다. 뒤에 목적어 an occasion이 있으므로 능동의 현재분사가 맞다.", "to appreciate and comprehend는 an occasion을 꾸미는 형용사적 용법의 to부정사이며, 두 동사원형이 and로 병렬되어 있다.", "42번 어휘 문제에서 (c)로 표시된 자리이다. 무료함이 좋은 기회를 ‘준다’는 긍정적인 흐름에 맞는 말이다."]}, "26": {"c": "g", "t": "hazardous : 위험한", "n": ["hazardous = 위험한 (= dangerous)", "hazard = 위험 (요소)", "(반의) safe = 안전한"], "x": ["In hazardous circumstances는 ‘위험한 상황들에서’라는 뜻이다.", "6번의 danger, 7번의 safe와 짝을 이루어 ‘위험하면 무료함이 없다’는 내용을 다시 강조한다."]}, "27": {"c": "p", "t": "동격의 of : the luxury of boredom (무료함이라는 사치)", "n": ["A of B = B라는 A (동격)", "the luxury of boredom = 무료함이라는 사치", "(비슷한 예) the city of Seoul = 서울이라는 도시"], "x": ["여기서 of는 ‘~의’가 아니라 ‘~라는’이라는 동격의 뜻이다.", "7번에서 무료함을 사치라고 한 것을 짧게 다시 정리한 표현이다."]}, "28": {"c": "g", "t": "unavailable : 얻을 수 없는, 누릴 수 없는", "n": ["unavailable = 이용할 수 없는, 얻을 수 없는", "(반의) available = 이용할 수 있는", "un- = 반대의 뜻을 만드는 접두사"], "x": ["is unavailable은 ‘누릴 수 없다’라는 뜻이다.", "42번 어휘 문제에서 (d)로 표시된 자리이다. 위험할 때는 무료함이라는 사치를 누릴 수 없다는 흐름에 맞는 말이다.", "6~8번이 모두 ‘무료함은 안전할 때만’이라는 같은 내용임을 확인해 둔다."]}, "29": {"c": "b", "t": "Thus : 따라서 (근거 → 결론)", "n": ["Thus = 따라서, 그러므로", "5~8번 = 무료함은 안전할 때만 누리는 행운이자 사치", "9번 = 그러니 한가한 순간을 자기 성찰에 활용하라"], "x": ["Thus는 앞에서 말한 근거(무료함은 안전할 때만 누리는 사치)에서 필자의 주장을 끌어내는 연결어이다.", "문장삽입 문제에서 이 문장이 8번 뒤, 10번 앞에 들어가는 단서가 된다.", "10번의 It이 이 문장의 내용을 받으므로 9번이 빠지면 흐름이 끊긴다."]}, "30": {"c": "p", "t": "가주어 it + 진주어 to utilize : 활용하는 것이 가장 중요하다", "n": ["it is paramount to V = ~하는 것이 가장 중요하다", "paramount = 가장 중요한, 최고의 (= crucial, vital)", "utilize = 활용하다 (= use, make use of)"], "x": ["it은 가주어이고 to utilize 이하가 진주어이다.", "paramount는 ‘무엇보다 중요한’이라는 강한 뜻의 형용사로, 필자의 주장을 힘 있게 드러낸다.", "utilize idle moments for ~는 ‘~을 위해 한가한 순간들을 활용하다’라는 뜻이다."]}, "31": {"c": "g", "t": "profound : 깊은, 심오한", "n": ["profound = 깊은, 심오한", "(반의) superficial = 피상적인, 얕은", "profound self-reflection = 깊은 자기 성찰"], "x": ["profound self-reflection은 ‘깊은 자기 성찰’이라는 뜻이다.", "그냥 멍하게 있는 것이 아니라 자신을 깊이 들여다보는 것을 말한다."]}, "32": {"c": "o", "t": "It = 한가한 순간을 자기 성찰에 쓰는 것 (한가한 시간)", "n": ["It represents ~ = 그것은 ~을 의미한다", "It = 9번의 idle moments를 자기 성찰에 활용하는 것"], "x": ["It은 9번에서 말한, 한가한 순간을 깊은 자기 성찰에 쓰는 일을 가리킨다.", "represent는 여기서 ‘의미하다, 나타내다’라는 뜻이다."]}, "33": {"c": "p", "t": "병렬 : to listen, observe, and appreciate", "n": ["an occasion to V = ~할 기회", "to listen, (to) observe, and (to) appreciate", "observe = 관찰하다"], "x": ["to 뒤에 동사원형 listen, observe, appreciate가 and로 나란히 이어진 병렬 구조이다.", "to부정사는 앞의 an occasion을 꾸미는 형용사적 용법이다.", "7번의 appreciate가 다시 나와 무료함이 주변을 알아보는 기회라는 생각을 이어 간다."]}, "34": {"c": "p", "t": "전치사 before + 동명사 : before expressing", "n": ["before + -ing = ~하기 전에", "express = 표현하다", "(같은 형태) after + -ing"], "x": ["before는 여기서 전치사로 쓰여 뒤에 동명사 expressing이 왔다.", "말하거나 드러내기 전에 먼저 듣고 보고 알아보라는 뜻이다."]}, "35": {"c": "b", "t": "Rather than + -ing : ~하기보다는 (통념과 대조)", "n": ["Rather than viewing A as B = A를 B로 보기보다는", "view A as B = A를 B로 보다", "unproductive = 비생산적인 (반의 productive)"], "x": ["Rather than viewing boredom as unproductive는 ‘무료함을 비생산적이라고 여기기보다’라는 뜻이다.", "rather than 뒤에 동명사 viewing이 왔다.", "사람들의 흔한 생각(무료함은 쓸모없다)을 앞에 두고 필자의 결론과 대조한다."]}, "36": {"c": "k", "t": "주제문 : 무료함은 개인적 발달의 기회로 여겨져야 함", "n": ["regard A as B = A를 B로 여기다", "it should be regarded as B = 그것은 B로 여겨져야 한다", "it = boredom", "personal development = 개인적 발달, 성장"], "x": ["regard A as B가 수동태로 바뀌고 should가 더해져 ‘~로 여겨져야 한다’라는 필자의 주장을 나타낸다.", "it은 앞의 boredom을 가리킨다.", "4번의 a perfect time for self-improvement, 9번의 profound self-reflection과 같은 내용을 마지막으로 정리하는 주제문이다.", "41번 제목 문제는 이 문장과 4번, 9번을 함께 보고 푼다."], "e": "쉬운 예시 : 심심한 주말 저녁에 휴대폰을 내려놓고 일기를 쓰며 요즘 내 고민을 차분히 들여다보는 것이다."}, "37": {"c": "g", "t": "constructive : 건설적인, 도움이 되는", "n": ["constructive = 건설적인, 도움이 되는", "construct = 짓다, 세우다", "(반의) destructive = 파괴적인"], "x": ["constructive contemplation은 ‘건설적인 사유’, 즉 나를 성장시키는 쪽으로 하는 생각이라는 뜻이다.", "42번 어휘 문제에서 (e)로 표시된 자리이다. 1~3번의 해로운 감정, 문제를 일으키는 생각과 반대되는 말이다."]}, "38": {"c": "g", "t": "contemplation : 깊은 생각, 사색", "n": ["contemplation = 사색, 깊은 생각", "contemplate = 깊이 생각하다", "(유의) reflection = 성찰"], "x": ["contemplation은 조용히 깊이 생각하는 것을 말한다.", "4번의 reflection, 9번의 self-reflection과 같은 뜻의 말을 바꾸어 반복하여 글의 핵심을 마무리한다."]}}, "src": "26년 10월 41-42번"};var S=P.sents,I=P.items,FLOW=P.flow.map(function(f){return [f.label,f.range,f.sum,f.eg];});
var S=P.sents,I=P.items,FLOW=P.flow.map(function(f){return [f.label,f.range,f.sum,f.eg];});
var cur="all";
function textHTML(){var h='';S.forEach(function(s){h+='<div class="ps" id="s'+s.n+'"><i>'+s.n+(s.star?'<br>★':'')+'</i><div><div class="en">'+hl(s.mk)+'</div><div class="ko">'+s.ko+'</div></div></div>';});return h;}

function render(){
 var h='<h1>'+P.src+'</h1><div class="sub">'+P.sub+'</div>';

 FLOW.forEach(function(f){h+='<div class="fr"><b>'+f[0]+'</b><span><em>'+f[1]+'</em><strong>'+f[2]+'</strong><div class="eg2">예) '+f[3]+'</div></span></div>';});
 h+='</div></div>';

 items();

function items(){
 var out="",seen={};
 S.forEach(function(s){
  var ids=[];s.mk.replace(/\[(\d+)\|/g,function(m,id){if(!seen[id]){seen[id]=1;ids.push(id);}});
  ids.forEach(function(id){var it=I[id];if(cur!="all"&&it.c!=cur)return;
   out+='<div class="it c-'+it.c+'" id="it'+id+'"><h4><span class="tl">'+it.t+'</span><span class="tag">'+CAT[it.c]+'</span></h4>';

 });
 document.getElementById("items").innerHTML=out;

function hl2(s,id){return s.replace(/\[(\d+)\|([^\]]+)\]/g,function(m,i,t){return i==id?'<span class="hlk c-'+I[i].c+'">'+t+'</span>':t;});}
document.addEventListener("click",function(e){
