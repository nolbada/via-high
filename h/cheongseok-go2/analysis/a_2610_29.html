<script>
var CAT={g:"어휘",o:"대명사",b:"연결어",k:"핵심 문장",p:"구문"};
var P={"num": "29", "sub": "고2 · 자연과 과거 인류의 높은 초기 사망률", "one": "자연과 과거 인류는 태어난 생명 대부분이 일찍 죽는 상태였고, 이 높은 초기 사망률이 오랫동안 인구 증가를 가로막은 장벽", "flow": [{"label": "도입부", "range": "1~2번", "sum": "생존을 매년 허들을 넘는 경주에 비유, 과거에는 초반 허들이 매우 높아 많은 사람이 처음 몇 개도 못 넘고 쓰러짐 <small>(survival as a race, the early hurdles)</small>", "eg": "1단계부터 너무 어려워서 대부분의 플레이어가 시작하자마자 탈락하는 게임"}, {"label": "본론 (1)", "range": "3~5번", "sum": "인류는 자연 상태에 가깝게 살았고 자연은 생명을 극도로 낭비, 무화과 씨앗과 야생 개코원숭이가 그 사례 <small>(a state of nature, wasteful of life)</small>", "eg": "민들레 씨앗 수백 개가 바람에 날아가도 실제로 꽃으로 자라는 것은 몇 개뿐인 모습"}, {"label": "본론 (2)", "range": "6~7번", "sum": "전근대 농업 사회와 수렵 채집 조상의 유아 사망률도 유인원과 비슷하거나 더 높음, 4분의 1은 첫돌 전에, 또 4분의 1은 자손을 낳기 전에 사망 <small>(infant mortality rates, reproduce)</small>", "eg": "아이 넷 중 하나는 돌잔치를 못 하고, 또 하나는 어른이 되기 전에 세상을 떠나는 셈"}, {"label": "결론", "range": "8번", "sum": "그렇지 않았다면 최근의 엄청난 인구 증가는 훨씬 일찍 일어났을 것, 즉 높은 초기 사망률이 인구 증가를 막아 온 원인 <small>(Had it been otherwise)</small>", "eg": "욕조 바닥에 구멍이 나 있으면 물을 틀어도 안 차다가, 구멍을 막자 금세 물이 차오르는 모습"}], "sents": [{"n": 1, "mk": "You might [1|think of survival as a race] [2|in which] a hurdle [3|has to be jumped] every year.", "ko": "여러분은 생존을 매년 하나의 허들을 뛰어넘어야 하는 경주라고 생각할지도 모른다.", "star": true}, {"n": 2, "mk": "[4|The early hurdles] were once very high, and many people [5|fell] [6|before clearing] [7|the first few].", "ko": "초기의 허들은 한때 매우 높았고, 많은 사람들은 처음 몇 개를 넘기 전에 넘어졌다."}, {"n": 3, "mk": "[8|Demographically], humankind was living close to [9|a state of nature], and [10|nature is extremely wasteful of life].", "ko": "인구 통계학적으로, 인류는 자연 상태에 가깝게 살았었고, 자연은 생명을 극도로 낭비한다.", "star": true}, {"n": 4, "mk": "[11|From only a very small number of figs will] [12|even one of many seeds] [13|become] a fig tree.", "ko": "극소수의 무화과로부터 나오는 많은 씨앗들 중 단 하나만이 무화과 나무가 될 것이다.", "star": true}, {"n": 5, "mk": "[14|Almost a quarter of baboons] [15|born in the wild] die before they are a year old, [16|which is] [17|fairly typical for primates].", "ko": "야생에서 태어난 개코원숭이의 거의 4분의 1이 한 살이 되기 전에 죽는데, 이것은 영장류에게 꽤 전형적이다.", "star": true}, {"n": 6, "mk": "[18|Infant mortality rates] for humans in [19|pre-modern agricultural societies] were [20|similar to, and sometimes higher, than] [21|those] of apes.", "ko": "전근대 농업 사회에서 인간의 유아 사망률은 유인원의 그것과 비슷했고, 때로는 더 높았다.", "star": true}, {"n": 7, "mk": "[22|Things were little better] for our [23|hunter-gatherer ancestors], [24|a quarter of whom] failed to reach their first birthday, [25|while] another quarter [26|didn't live long enough to reproduce] just about everywhere until the nineteenth century.", "ko": "우리의 수렵 채집 조상들에게도 사정은 별로 나을 것이 없었는데, 그들 중 4분의 1이 자신들의 첫 번째 생일에 이르지 못했고, 19세기까지 거의 모든 곳에서 또 다른 4분의 1은 자손을 낳을 만큼 충분히 오래 살지 못했다.", "star": true}, {"n": 8, "mk": "[27|Had] [28|it] been [29|otherwise], [30|the huge recent growth in human population would have occurred much earlier].", "ko": "만약 그렇지 않았더라면, 최근의 엄청난 인구 증가는 훨씬 더 일찍 일어났었을 것이다.", "star": true}], "items": {"1": {"c": "k", "t": "핵심 비유 : 생존 = 매년 허들을 넘는 경주", "n": ["think of A as B = A를 B로 생각하다(여기다)", "survival = 생존 (survive 살아남다)", "a race = 경주 / a hurdle = 허들, 장애물"], "x": ["think of survival as a race는 ‘생존을 하나의 경주로 생각하다’라는 뜻이다.", "think of A as B는 regard A as B, see A as B와 같은 틀이다.", "글 전체가 이 경주 비유 위에서 전개된다. 허들은 해마다 넘어야 살아남는 생존의 고비를 뜻한다.", "2번 문장의 The early hurdles도 이 비유를 이어받은 표현이다."], "e": "쉬운 예시 : 해마다 질병, 추위, 굶주림이라는 허들을 하나씩 넘어야 다음 해로 갈 수 있는 달리기이다."}, "2": {"c": "p", "t": "전치사 + 관계대명사 in which + 완전한 절", "n": ["a race ← in which a hurdle has to be jumped (관계사절)", "in which = where (선행사 a race)", "in which 뒤 = 주어 + 동사가 갖춰진 완전한 절"], "x": ["in which 이하는 앞의 a race를 꾸며 ‘매년 허들을 뛰어넘어야 하는 경주’라는 뜻을 만든다.", "in which 뒤에 a hurdle(주어) + has to be jumped(동사)의 완전한 절이 왔다.", "뒤가 완전한 절이므로 which 하나만 쓰면 틀린다. in which나 where를 써야 한다.", "어법 문제에서 in which ↔ which를 바꿔 묻는 단골 자리이다."]}, "3": {"c": "p", "t": "has to be jumped : 조동사 + 수동태", "n": ["have to + be p.p. = ~되어야 한다", "a hurdle has to be jumped = 허들이 뛰어넘어져야 한다", "주어 hurdle은 넘는 대상 → 수동"], "x": ["has to be jumped는 ‘뛰어넘어져야 한다’라는 뜻이다.", "허들은 스스로 뛰는 것이 아니라 사람이 뛰어넘는 대상이라 수동태가 쓰였다.", "우리말로는 ‘허들을 뛰어넘어야 하는’처럼 자연스럽게 풀어 읽는다.", "주어가 a hurdle(단수)이라 has to가 쓰였다."]}, "4": {"c": "k", "t": "The early hurdles = 인생 초반의 위험 (영유아기)", "n": ["the early hurdles = 초기의 허들 = 갓난아기·어린 시절의 위험", "were once very high = 한때 매우 높았다", "once = 한때, 예전에 (과거)"], "x": ["The early hurdles는 경주 비유에서 출발 직후의 허들, 즉 태어나서 얼마 안 된 시기의 위험을 말한다.", "once는 여기서 ‘한때’라는 뜻이다. 지금은 그렇지 않다는 대비가 숨어 있다.", "이 문장이 앞으로 나올 무화과, 개코원숭이, 과거 인류 사례의 예고편 역할을 한다."], "e": "쉬운 예시 : 예전에는 감기나 설사만으로도 아기가 목숨을 잃는 일이 흔했다. 그것이 높은 초기 허들이다."}, "5": {"c": "g", "t": "fall : 넘어지다 → (비유) 쓰러지다, 죽다", "n": ["fall - fell - fallen = 넘어지다, 쓰러지다", "(비유) fall = 탈락하다, 죽다", "fall(넘어지다) ≠ fell(넘어뜨리다, 규칙동사)"], "x": ["fell은 fall의 과거형으로, 경주 비유에서는 ‘허들에 걸려 넘어졌다’는 뜻이다.", "실제 의미는 어린 나이에 목숨을 잃었다는 것이다. 비유를 실제 내용으로 바꿔 읽어야 스토리가 보인다.", "fell은 ‘(나무를) 베어 넘어뜨리다’라는 별개의 동사로도 쓰이니 헷갈리지 않게 한다."]}, "6": {"c": "p", "t": "before + 동명사 : ~하기 전에", "n": ["before clearing = 넘기 전에", "before = 전치사 → 뒤에 동명사(-ing)", "clear = (장애물을) 넘다, 통과하다"], "x": ["before clearing the first few는 ‘처음 몇 개를 넘기 전에’라는 뜻이다.", "before가 전치사로 쓰여 뒤에 동명사 clearing이 왔다.", "clear는 ‘깨끗한’이라는 형용사 외에 동사로 ‘(장애물을) 넘다, 치우다’라는 뜻이 있다. 여기서는 허들을 넘는다는 뜻이다."]}, "7": {"c": "o", "t": "the first few = the first few hurdles", "n": ["the first few = 처음 몇 개의 허들", "few 뒤의 hurdles가 반복을 피해 생략됨"], "x": ["the first few는 the first few hurdles에서 hurdles를 뺀 말이다.", "앞 절의 The early hurdles와 같은 대상을 가리킨다.", "‘처음 몇 개의 허들’, 즉 인생의 처음 몇 해를 넘기지 못했다는 뜻이다."]}, "8": {"c": "g", "t": "demographically : 인구 통계학적으로", "n": ["demography = 인구 통계학", "demographic = 인구 통계학의 (형용사)", "demographically = 인구 통계학적으로 (부사)"], "x": ["Demographically는 ‘인구 통계학적으로’라는 뜻의 부사로, 문장 전체를 꾸민다.", "demo-는 ‘사람들’이라는 뜻의 뿌리로 democracy(민주주의)와도 같다.", "출생과 사망 숫자로 보면 인류가 어떤 상태였는지를 말하겠다는 신호이다."]}, "9": {"c": "g", "t": "a state of nature : 자연 상태", "n": ["a state of nature = 자연 상태", "state = 상태 (다의어 : 국가, 주 / 진술하다)", "close to ~ = ~에 가깝게"], "x": ["a state of nature는 의학, 위생, 농업 기술 같은 보호 장치가 거의 없이 야생 동물처럼 사는 상태이다.", "humankind was living close
