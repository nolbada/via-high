<script>
var CAT={g:"어휘",o:"대명사",b:"연결어",k:"핵심 문장",p:"구문"};
var P={"num": "32", "sub": "고2 · 대중문화와 사법의 독립", "one": "재판과 정의는 SNS라는 가상의 광장에서 쏟아지는 여론이 아니라 대중의 압력에 흔들리지 않는 법정에서 이루어져야 함", "flow": [{"label": "도입부", "range": "1번", "sum": "대중문화가 사람과 전통을 잇는 유대를 약하게 만들어 가족·학교 같은 중간 매개 제도의 역할을 줄이고 그 영역을 겹치게 함 <small>(intermediary institutions)</small>", "eg": "집에서 배우던 예절과 학교에서 배우던 규칙을 이제 짧은 영상이 대신 가르치는 모습"}, {"label": "본론 (1)", "range": "2번", "sum": "그 예로 법정은 집단생활이 정상적이고 조화롭게 돌아가게 하는 전통적인 사회 기관 <small>(courts)</small>", "eg": "다툼이 생기면 목소리 큰 쪽이 아니라 정해진 심판이 판정하는 운동 경기"}, {"label": "본론 (2)", "range": "3번", "sum": "하지만 사법 판결에 압력을 넣으려고 SNS에 기대는 관행이 대중화되어 습관적인 문화가 되는 것은 해로움 <small>(put pressure on judicial decisions)</small>", "eg": "판정이 마음에 안 든다고 관중이 댓글로 심판을 몰아붙여 판정을 바꾸게 하려는 상황"}, {"label": "요지", "range": "4~5번", "sum": "정의는 오늘날 SNS로 바뀐 광장이 아니라 법정에서, 대중의 압력에 영향받지 않는 방식으로 실현되어야 함 <small>(immune to popular pressure)</small>", "eg": "관중석 함성과 상관없이 규정대로만 판정하는 비디오 판독"}], "sents": [{"n": 1, "mk": "If we [1|understand mass culture as a weakening factor] of the cultural ties [2|that unite people to their traditions], mass culture weakens the [3|intermediary] institutions in society (e.g. the family or the school), [4|diminishing their role and overlapping these institutions].", "ko": "만약 우리가 대중문화를 자신들의 전통들에 사람들을 결속시키는 문화적 유대감을 약화시키는 요인으로 이해한다면, 대중문화는 예를 들어 가족 또는 학교와 같은 사회 내의 매개하는 제도들을 약화시켜, 그것들의 역할을 축소시키고 이 제도들과 중첩된다."}, {"n": 2, "mk": "[5|For example], [6|courts are traditional social institutions and important] for the normal and [7|harmonious] functioning of [8|collective life].", "ko": "예를 들어, 법정은 전통적인 사회 기관이며 집단 생활의 정상적이고 조화로운 기능을 위해 중요하다."}, {"n": 3, "mk": "[9|However], when people [10|turn to] social networks [11|to put pressure on judicial decisions] in certain [12|mediated and politicized] processes, [13|this practice] is popularized and becomes a [14|habitual] form of culture, [15|which is harmful].", "ko": "하지만, 조정되고 정치화되는 어떤 과정에 있는 사법적 결정에 압박을 가하기 위해 사람들이 소셜 네트워크에 의존할 때, 이러한 관행은 대중화되고 습관적인 문화의 형태가 되며, 이는 해롭다.", "star": true}, {"n": 4, "m
