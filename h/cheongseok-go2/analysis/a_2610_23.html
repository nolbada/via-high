<script>
var CAT={g:"어휘",o:"대명사",b:"연결어",k:"핵심 문장",p:"구문"};
var P={"num": "23", "sub": "고2 · 문어의 분산된 신경계", "one": "문어는 뉴런의 절반 이상이 다리에 퍼져 있어 다리가 뇌의 상세한 지시 없이 스스로 움직이고 반응하며, 빨판으로는 만지는 것을 맛볼 수도 있다는 것", "flow": [{"label": "도입부", "range": "1~2번", "sum": "문어는 약 5억 개의 뉴런을 가졌고, 특이한 점은 그 뉴런들이 어디에 있는가 <small>(where those neurons are located)</small>", "eg": "직원 수보다 직원들이 어디에서 일하는지가 더 눈에 띄는 회사"}, {"label": "본론 (1)", "range": "3~4번", "sum": "뉴런의 절반 이상이 중앙의 뇌가 아니라 다리 전체에 분포, 각 다리의 신경망이 복잡한 움직임과 감각 반응을 그 자리에서 처리 <small>(distributed / locally)</small>", "eg": "본사 지시를 기다리지 않고 지점마다 알아서 손님을 응대하는 가게"}, {"label": "본론 (2)", "range": "5~6번", "sum": "그래서 많은 행동에 뇌의 상세한 지시가 필요 없고, 대신 다리가 환경과 직접 상호 작용하는 신경계의 연장선 역할 <small>(extensions of the nervous system)</small>", "eg": "감독이 하나하나 지시하지 않아도 선수 각자가 상황을 보고 움직이는 축구팀"}, {"label": "본론 (3)", "range": "7~9번", "sum": "다리의 빨판은 강하게 붙잡을 뿐 아니라 닿은 표면의 화학 신호도 탐지해, 접촉을 통해 화학 정보를 모음 <small>(detect chemical signals)</small>", "eg": "손가락 끝에 작은 혀가 달려 있다고 상상해 봄"}, {"label": "결론", "range": "10번", "sum": "실질적으로 문어는 만지는 것을 맛볼 수 있음 <small>(taste what it touches)</small>", "eg": "반찬을 손으로 만지기만 해도 짠지 단지 알아채는 셈"}], "sents": [{"n": 1, "mk": "[1|Research on cephalopod neurobiology] [2|suggests that] an octopus [3|possesses] [4|roughly five hundred million neurons].", "ko": "두족류 동물 신경 생물학에 관한 연구는 문어가 대략 5억 개의 뉴런을 가지고 있다는 것을 시사한다.", "star": true}, {"n": 2, "mk": "[5|What makes] [6|this system] unusual is [7|where many of those neurons are located].", "ko": "이 체계를 특이하게 만드는 것은 그 뉴런들 중 다수가 어디에 위치해 있는가이다.", "star": true}, {"n": 3, "mk": "[8|More than half are distributed] [9|throughout the arms] [10|rather than concentrated entirely] in the central brain.", "ko": "절반 이상은 중앙의 뇌에 전적으로 집중되어 있기보다는 다리들 전체에 걸쳐 분포되어 있다.", "star": true}, {"n": 4, "mk": "[11|Each arm contains] [12|networks of nerve cells capable of] [13|controlling complex movements and responding] to [14|sensory input] [15|locally].", "ko": "각각의 다리는 복잡한 움직임들을 통제하고 감각적 입력에 국소적으로 반응할 수 있는 신경 세포들의 네트워크를 갖고 있다.", "star": true}, {"n": 5, "mk": "[16|This] means that many actions [17|
