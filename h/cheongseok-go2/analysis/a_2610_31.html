<script>
var CAT={g:"어휘",o:"대명사",b:"연결어",k:"핵심 문장",p:"구문"};
var P={"num": "31", "sub": "고2 · 결함이 아닌 설계의 승리, 기본 설정", "one": "평생 행동 대부분이 오래전 정해진 기본 설정대로 자동으로 돌아가는 것은 결함이 아니라, 느리고 비싼 의식을 꼭 필요한 문제에만 쓰게 해 복잡한 삶을 감당 가능하게 만드는 핵심 설계", "flow": [{"label": "도입부", "range": "1번", "sum": "80년 인생 약 2만 9천 일의 행동 대부분은 수십 년 전에 정해져 거의 점검되지 않은 설정대로 작동 <small>(settings laid down, rarely inspected)</small>", "eg": "아침에 눈 뜨면 생각도 안 하고 양치하고, 늘 같은 순서로 교복을 입는 모습"}, {"label": "반전", "range": "2~3번", "sum": "이것이 절망적인 생각일 필요는 없음, 어떤 관점에서 보면 설계의 승리 <small>(need not be a hopeless thought, a triumph of engineering)</small>", "eg": "‘나는 습관대로만 사네’라는 한탄 대신 ‘덕분에 머리를 아끼는구나’로 바꿔 보는 시선"}, {"label": "본론 (1)", "range": "4번", "sum": "모든 발걸음과 포크 쥐기와 말을 의식적으로 결정해야 한다면 침대도 못 벗어남, 신중한 사고는 너무 느리고 비싸서 그렇게 하려는 생명체는 경쟁에서 짐 <small>(the deliberate mind, too slow and too costly)</small>", "eg": "걸을 때마다 ‘왼발, 이제 오른발’을 일일이 생각하면 등굣길만 한 시간 걸리는 상황"}, {"label": "본론 (2)", "range": "5번", "sum": "자동화 덕분에 선장(의식)이 정말 자기가 필요한 몇 안 되는 문제에만 갑판 위로 올라올 수 있음 <small>(frees the captain to come up on deck)</small>", "eg": "평소 항해는 자동 항법에 맡기고, 폭풍이 올 때만 조타실로 올라가는 선장"}, {"label": "결론", "range": "6~7번", "sum": "기본 설정은 인간 설계의 결함이 아니라 복잡한 삶을 감당할 수 있게 만드는 핵심 특징 <small>(not a flaw, the central feature, affordable)</small>", "eg": "스마트폰 기본 설정 덕분에 켤 때마다 설정을 처음부터 다시 하지 않고 바로 쓰는 것"}], "sents": [{"n": 1, "mk": "A person [1|who lives] eighty years lives [2|some] twenty-nine thousand days, and [3|the overwhelming majority of the behaviour] [4|packed into them] [5|runs on] [6|settings laid down, most of them, decades earlier and rarely inspected since].", "ko": "80년을 사는 사람은 약 2만 9천 일을 살고, 그 속에 빽빽이 들어 있는 행동의 압도적인 다수는 대부분이 수십 년 전에 정해져서 그 이후로는 거의 점검되지 않은 설정들에 따라 작동한다.", "star": true}, {"n": 2, "mk": "[7|This] [8|need not be] a [9|hopeless] thought.", "ko": "이것이 꼭 절망적인 생각일 필요는 없다.", "star": true}, {"n": 3, "mk": "[10|In one light] [11|it] is [12|a triumph of engineering].", "ko": "어떤 관점에서 그것은 설계의 승리이다.", "star": true}, {"n": 4, "mk": "[13|If you had to] consciously decide every footstep and every fork-grip and every word, you [14|would never make it out of bed]; [15|the deliberate mind] is [16|far too slow and too costly to run] a whole life in real time, and any creature that tried would be [17|outcompeted] by a creature [18|that didn't].", "ko": "만약 여러분이 발걸음 하나하나와, 포크를 쥐는 동작 하나하나와, 말 한마디 한마디를 의식적으로 결정해야 한다면 여러분은 침대에서 결코 빠져나오지 못할 것인데, 왜냐하면 신중한 사고는 너무 느리고 대가가 너무 커서 삶 전체를 실시간으로 운영할 수 없고, 그렇게 하려고 하는 모든 생명체는 그렇게 하지 않는 생명체에게 패배할 것이기 때문이다.", "star": true}, {"n": 5, "mk": "[19|The automation] is precisely [20|what] [21|frees the captain to come up on deck] for [22|the few problems] that actually require [23|him].", "ko": "자동화는 정확히 선장을 정말로 필요로 하는 몇 안 되는 문제들을 위해 그가 갑판 위로 올라올 수 있게 해방해 주는 것이다.", "star": true}, {"n": 6, "mk": "[24|The default] is [25|not a flaw] in [26|the human design].", "ko": "기본 설정은 인간 설계의 결함이 아니다.", "star": true}, {"n": 7, "mk": "[27|It] is [28|arguably] [29|the central feature, the thing] [30|that makes a complex life affordable at all].", "ko": "그것은 거의 틀림없이 핵심적인 특징, 즉 복잡한 삶을 조금이라도 감당할 수 있게 만드는 것이다.", "star": true}], "items": {"1": {"c": "p", "t": "주격 관계대명사 who + 단수 동사 lives", "n": ["A person ← who lives eighty years (관계사절)", "who = 주격 관계대명사 (선행사 A person)", "문장의 진짜 동사 = 뒤의 lives (twenty-nine thousand days)"], "x": ["who lives eighty years는 ‘80년을 사는’이라는 뜻으로 A person을 뒤에서 꾸민다.", "lives가 두 번 나온다. 앞의 lives는 관계사절의 동사, 뒤의 lives는 문장 전체의 동사이다.", "선행사 A person이 단수라 두 동사 모두 lives이다."]}, "2": {"c": "g", "t": "some + 숫자 : 약, 대략", "n": ["some + 숫자 = 약, 대략 (= about, approximately)", "some twenty-nine thousand days = 약 2만 9천 일", "80년 × 365일 ≈ 29,200일"], "x": ["some이 숫자 앞에 오면 ‘몇몇’이 아니라 ‘약, 대략’이라는 뜻이다.", "some twenty-nine thousand days는 ‘약 2만 9천 일’이다.", "80년을 날짜로 바꿔 보여 주면서 그 많은 날의 행동이 어떻게 돌아가는지 묻는 도입이다."]}, "3": {"c": "g", "t": "the overwhelming majority of ~ : ~의 압도적 다수", "n": ["overwhelming = 압도적인 (overwhelm 압도하다)", "majority = 다수 (반의어 minority 소수)", "the behaviour = 행동 (영국식 철자, 미국식 behavior)"], "x": ["the overwhelming majority of the behaviour는 ‘행동의 압도적 다수’라는 뜻이다.", "우리가 하는 행동 거의 대부분이라는 말이다.", "behaviour는 영국식 철자이다. 미국식은 behavior이다."]}, "4": {"c": "o", "t": "them = twenty-nine thousand days (packed into them)", "n": ["packed into them = 그 날들 속에 빽빽이 채워진", "them = some twenty-nine thousand days", "packed = 과거분사, the behaviour를 뒤에서 꾸밈"], "x": ["packed into them은 앞의 the behaviour를 꾸며 ‘그 날들 속에 빽빽이 들어 있는 행동’이라는 뜻을 만든다.", "them은 앞의 twenty-nine thousand days를 가리킨다.", "packed는 pack(채워 넣다)의 과거분사로 ‘채워 넣어진’이라는 수동의 뜻이다."]}, "5": {"c": "p", "t": "수일치 : the majority of the behaviour + runs", "n": ["주어 = the overwhelming majority of the behaviour", "behaviour (셀 수 없는 명사) → 단수 동사 runs", "run on ~ = ~으로 작동하다, ~에 따라 움직이다"], "x": ["runs on settings는 ‘설정에 따라 작동한다’라는 뜻이다.", "the majority of 뒤의 behaviour가 셀 수 없는 명사라 단수 동사 runs가 쓰였다.", "run on은 기계가 전기나 배터리로 돌아가듯 ‘~으로 작동하다’라는 뜻이다. 사람의 행동을 기계에 빗댄 표현이다."]}, "6": {"c": "k", "t": "핵심 문장 : 오래전 정해져 점검되지 않은 설정", "n": ["settings ← laid down ... and rarely inspected since (과거분사 병렬)", "lay down = 정하다, 규정하다 (laid down = 정해진)", "most of them = 그 대부분 (삽입) / since = 그 이후로 (부사)", "rarely = 거의 ~ 않는 / inspect = 점검하다"], "x": ["settings laid down, most of them, decades earlier and rarely inspected since는 ‘대부분이 수십 년 전에 정해져서 그 이후로 거의 점검되지 않은 설정’이라는 뜻이다.", "laid down과 rarely inspected 두 과거분사가 and로 이어져 settings를 함께 꾸민다.", "most of them은 ‘그 설정들 중 대부분’이라는 뜻으로 콤마 사이에 끼어든 말이다.", "이 설정이 뒤에서 말하는 the default(기본 설정), the automation(자동화)이다."], "e": "쉬운 예시 : 젓가락 잡는 법이나 신발 끈 묶는 법은 어릴 때 한 번 익힌 뒤로 다시 따져 본 적이 거의 없다."}, "7": {"c": "o", "t": "This = 행동 대부분이 오래된 설정대로 돌아간다는 사실", "n": ["This = 1번 문장의 내용", "= 우리 행동 대부분이 점검되지 않은 옛 설정으로 움직인다는 것"], "x": ["This는 1번 문장 전체의 내용을 가리킨다.", "그대로 들으면 ‘나는 생각 없이 사는구나’ 하는 우울한 생각이 들 수 있는 내용이다.", "이 문장부터 글의 방향이 긍정 쪽으로 바뀐다."]}, "8": {"c": "p", "t": "need not + 동사원형 : ~할 필요는 없다", "n": ["need not V = ~할 필요는 없다 (조동사 need)", "= don't have to V / don't need to V", "need not be ~ = ~일 필요는 없다"], "x": ["need not be a hopeless thought는 ‘절망적인 생각일 필요는 없다’라는 뜻이다.", "여기서 need는 조동사라 주어가 This(단수)여도 needs가 아니고, 뒤에 동사원형 be가 온다.", "not의 위치가 need 바
