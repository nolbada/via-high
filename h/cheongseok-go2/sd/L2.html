를 설명하는 간단한 사용 안내를 받았다."}, {"en": "Then they were shown an image of a galaxy and asked to click buttons that described its features.", "ko": "그런 다음 그들에게 은하 이미지 한 장이 보여졌고, 그 은하의 특징을 설명하는 버튼을 클릭하라는 요청을 받았다."}, {"en": "Is the galaxy smooth and rounded? Is its shape an oval or a spiral?", "ko": "은하가 매끄럽고 둥근가? 그것의 모양은 타원형인가 아니면 나선형인가?"}, {"en": "After completion of the tutorial and a little bit of practice, the participants were able to classify galaxies effectively.", "ko": "사용 안내를 마치고 약간 연습한 뒤, 참가자들은 은하를 효과적으로 분류할 수 있었다."}], "chunks": [[0, 1], [2, 4], [5, 7], [8, 10]], "half": 5, "ex": [{"head": "It took Schawinski a whole", "clue": ["a whole week", "just 50,000 galaxies"], "core": "5만 개 분류에 꼬박 일주일", "why": "글의 출발: 은하 5만 개 분류에 꼬박 일주일 걸린 Schawinski의 처지"}, {"head": "He thought, “But what about", "clue": ["the remaining 950,000"], "core": "남은 95만 개는 어쩌지?", "why": "remaining(남은) 95만 = 백만 − 5만 → 5만 개 얘기 바로 뒤"}, {"head": "One evening after work, Schawinski", "clue": ["complained about the situation"], "core": "퇴근 후 친구 Lintott을 만나 이 상황을 하소연", "why": "the situation(그 상황) = 바로 앞의 남은 95만 개 고민 → 걱정 다음 친구에게 하소연"}, {"head": "Lintott suggested that he turn", "clue": ["Lintott suggested", "the Internet"], "core": "Lintott: 인터넷으로 사람들에게 도움을 청해 보라", "why": "하소연을 들은 친구 Lintott의 제안 → 만남·불평 바로 다음"}, {"head": "Eventually, the two men ended", "clue": ["Eventually", "the two men", "Galaxy Zoo"], "core": "결국 두 사람이 크라우드소싱 프로젝트 Galaxy Zoo 시작", "why": "Eventually(결국) = 제안 끝의 결과 / the two men = Schawinski와 Lintott"}, {"head": "The website was kept as", "clue": ["The website", "as simple as possible"], "core": "웹사이트는 최대한 단순하게, 쓰기 쉬운 화면", "why": "The website(그 웹사이트) = 앞의 온라인 프로젝트 Galaxy Zoo"}, {"head": "This allowed those who wanted", "clue": ["This", "get started quickly"], "core": "단순함 덕분에 누구나 금방 시작 가능", "why": "This(이것) = 단순한 디자인 → 그 효과(빠른 시작)"}, {"head": "New visitors were greeted with", "clue": ["New visitors", "a brief tutorial"], "core": "처음 온 사람은 짧은 사용 지침부터", "why": "'빠르게 시작' → 실제로 시작하는 첫 단계(튜토리얼)"}, {"head": "Then they were shown an", "clue": ["Then", "they", "its features"], "core": "그다음 은하 사진을 보고 특징 버튼 클릭", "why": "Then(그다음) = 튜토리얼 다음 단계 / they(그들) = 신규 방문자"}, {"head": "Is the galaxy smooth and", "clue": ["the galaxy", "an oval or a spiral"], "core": "질문 예시: 매끄럽고 둥근가? 타원형? 나선형?", "why": "앞의 '특징을 설명하는 버튼'에 실제로 나오는 질문 예시"}, {"head": "After completion of the tutorial", "clue": ["After completion of the tutorial", "the participants"], "core": "튜토리얼과 약간의 연습 후 효과적으로 분류 가능", "why": "After completion(완료 후) = 앞의 튜토리얼·클릭 과정을 끝낸 결과"}], "postit": "5만 개에 일주일 → 남은 95만? → Lintott에게 하소연 → 인터넷 제안 → Galaxy Zoo → 단순한 사이트·튜토리얼 → 버튼 클릭 → 분류 성공", "cex": [{"core": "일주일에 5만 개 분류, 남은 95만 개 걱정", "why": "글의 출발: It took ~ a whole week(꼬박 일주일 걸렸다) → 앞의 '엄청난 시간'이 실제 수치로"}, {"core": "Lintott의 인터넷 제안, Galaxy Zoo 출범", "why": "One evening after work(어느 날 저녁 퇴근 후) → the situation(그 상황) = 남은 95만 개 고민"}, {"core": "단순한 사이트로 빠른 시작, 짧은 튜토리얼부터", "why": "The website(그 웹사이트) = 앞에서 출범한 Galaxy Zoo → 사이트 구성 소개"}, {"core": "은하 사진 보고 특징 버튼 클릭, 연습 후 효과적 분류", "why": "Then(그다음) = 튜토리얼 다음 단계 / they(그들) = 신규 방문자"}]}, {"id": "g2_L2-p3", "label": "2과 ③ 참여자들의 힘과 Zooniverse", "sents": [{"en": "It was online media that helped spread the word about Galaxy Zoo, bringing more and more participants to the website.", "ko": "Galaxy Zoo에 대한 소문을 퍼뜨리는 데 도움을 준 것은 바로 온라인 미디어였고, 그 웹사이트에 점점 더 많은 참여자를 불러 모았다."}, {"en": "Shortly after the website was launched, nearly 70,000 classifications were being made per hour.", "ko": "웹사이트가 개설된 지 얼마 지나지 않아, 시간당 약 7만 건의 분류가 이루어지고 있었다."}, {"en": "In a year and a half, more than 80,000 individuals participated, and they made more than 75 million classifications.", "ko": "일 년 반 만에, 8만 명 이상의 개인이 참여하였고, 그들은 7천5백만 건 이상의 분류를 해냈다."}, {"en": "If it had not been for those participants, Schawinski couldn’t have classified that many images.", "ko": "그 참여자들이 없었다면, Schawinski는 그렇게 많은 이미지를 분류할 수 없었을 것이다."}, {"en": "In fact, it would have taken him decades on his own.", "ko": "사실, 그 혼자서는 수십 년이 걸렸을 것이다."}, {"en": "More than 15 years have passed since the project first began in 2007.", "ko": "그 프로젝트가 2007년에 처음 시작된 이래로 15년 이상이 지났다."}, {"en": "Galaxy Zoo has now grown into Zooniverse, which is one of the most popular platforms on the Internet for ordinary people who want to participate in science projects.", "ko": "Galaxy Zoo는 이제 Zooniverse로 성장했는데, 이것은 과학 프로젝트에 참여하고 싶어 하는 일반인들을 위한 인터넷에서 가장 인기 있는 플랫폼 중 하나이다."}, {"en": "It is more active than ever before, with about 2 million registered users worldwide.", "ko": "그것은 전 세계 약 200만 명의 등록 사용자와 함께 그 어느 때보다 활발하다."}, {"en": "It now offers a wide range of projects in astronomy, biology, physics, and more.", "ko": "현재 그것은 천문학, 생물학, 물리학 등에서 광범위한 프로젝트들을 제공하고 있다."}, {"en": "If you want to get involved, you should definitely check it out!", "ko": "참여하고 싶다면 꼭 한번 확인해 보라!"}], "chunks": [[0, 0], [1, 2], [3, 4], [5, 6], [7, 9]], "half": 5, "ex": [{"head": "It was online media that", "clue": ["online media", "spread the word"], "core": "온라인 미디어 덕에 소문이 퍼져 참가자 급증", "why": "글의 출발: Galaxy Zoo가 어떻게 알려졌는지"}, {"head": "Shortly after the website was", "clue": ["Shortly after", "the website was launched"], "core": "개설 직후 시간당 약 7만 건 분류", "why": "Shortly after(~직후) = 시간 순서 첫 단계 / the website = Galaxy Zoo 사이트"}, {"head": "In a year and a", "clue": ["In a year and a half", "80,000 individuals"], "core": "1년 반 만에 8만 명 이상 참여, 7,500만 건 이상 분류", "why": "개설 직후 → 1년 반 뒤로 시간이 흐른 결과"}, {"head": "If it had not been", "clue": ["those participants", "that many images"], "core": "그 참여자들이 없었다면 그 많은 분류는 불가능", "why": "those participants(그 참여자들) = 앞의 8만 명, that many(그렇게 많은) = 7,500만 건"}, {"head": "In fact, it would have", "clue": ["In fact", "on his own"], "core": "사실 혼자였다면 수십 년 걸렸을 일", "why": "In fact(사실) = 앞 문장 강조 / on his own(혼자서) ↔ 참여자들의 도움"}, {"head": "More than 15 years have", "clue": ["More than 15 years", "since", "2007"], "core": "2007년 시작 후 15년 넘게 흐름", "why": "on his own(혼자서)면 수십 년 → 그 초기 성과 이야기 끝, 2007년 시작 후 15년 넘게 흐른 지금으로 시간 점프"}, {"head": "Galaxy Zoo has now grown", "clue": ["now", "grown into Zooniverse"], "core": "Galaxy Zoo → 인기 시민 과학 플랫폼 Zooniverse로 성장", "why": "now(이제) = 15년이 지난 지금의 모습"}, {"head": "It is more active than", "clue": ["It", "more active than ever before"], "core": "등록 사용자 약 200만 명, 그 어느 때보다 활발", "why": "It(그것) = 바로 앞에 처음 나온 Zooniverse"}, {"head": "It now offers a wide", "clue": ["It", "a wide range of projects"], "core": "천문학·생물학·물리학 등 다양한 프로젝트 제공", "why": "It = Zooniverse / 규모(사용자 수) 다음 내용(분야) 소개"}, {"head": "If you want to get", "clue": ["get involved", "check it out"], "core": "참여하고 싶다면 꼭 확인해 보기", "why": "it(그것) = Zooniverse / 소개를 다 한 뒤 독자에게 권유로 마무리"}], "postit": "온라인 미디어로 소문 → 시간당 7만 건 → 1년 반 7,500만 건 → 참여자 없었으면 수십 년 → 15년 뒤 Zooniverse → 200만 명·다양한 분야 → 참여 권유", "cex": [{"core": "온라인 미디어로 소문 확산, 참가자 급증", "why": "글의 출발: It was online media that(바로 온라인 미디어가) → Galaxy Zoo가 알려진 계기"}, {"core": "시간당 7만 건, 1년 반에 8만 명·7,500만 건", "why": "Shortly after(~직후) → 참가자 급증의 결과를 시간 순서대로 수치화"}, {"core": "참여자 없었다면 혼자 수십 년 걸렸을 일", "why": "those participants(그 참여자들) = 8만 명, that many(그렇게 많은) = 7,500만 건"}, {"core": "15년 뒤 인기 시민 과학 플랫폼 Zooniverse로", "why": "More than 15 years have passed(15년 넘게 흐름) → 초기 성과에서 현재로 시간 점프"}, {"core": "사용자 200만 명, 다양한 분야 프로젝트, 참여 권유", "why": "It(그것) = 바로 앞의 Zooniverse → 규모·분야 소개 후 권유로 마무리"}]}, {"id": "g2_L2-p4", "label": "2과 ④ 오로라 추적자와 Steve", "sents": [{"en": "In Alberta, Canada, there were some “aurora chasers” who formed an informal group online.", "ko": "캐나다 앨버타주에는 온라인상에서 비공식 단체를 결성한 ‘오로라 추적자들’이 있었다."}, {"en": "They would leave their homes at night and try to get exceptional photographs of auroras.", "ko": "그들은 밤에 집을 나서 특별한 오로라 사진을 찍으려고 하곤 했다."}, {"en": "Then they would share them with the rest of the group.", "ko": "그런 다음 그들은 단체의 나머지 사람들과 그것들을 공유하곤 했다."}, {"en": "In the summer of 2014, the group members began to notice something strange appearing in the night sky.", "ko": "2014년 여름, 그 단체 구성원들은 밤하늘에 이상한 무언가가 나타나는 것을 알아채기 시작했다."}, {"en": "There were unusual ribbons of green and purple light, some of which seemed to stretch for thousands of kilometers.", "ko": "녹색과 보라색의 특이한 빛의 띠가 있었는데, 그중 일부는 수천 킬로미터에 걸쳐 뻗어 있는 것처럼 보였다."}, {"en": "Sometimes they lasted for just a few minutes, while other times they remained in the sky for a whole hour.", "ko": "그것들은 어떤 때에는 단 몇 분간 지속되었지만, 다른 때에는 한 시간 내내 하늘에 머무르기도 했다."}, {"en": "They were similar in appearance to auroras, yet they possessed some notably different features.", "ko": "그것들은 오로라와 생김새가 비슷했지만, 몇 가지 현저하게 다른 특징들을 지니고 있었다."}, {"en": "Unsure of what they were, the group decided to name the phenomenon “Steve,” based on a scene from an animated movie where some characters give that name to an unfamiliar object.", "ko": "그것들이 무엇인지 확신하지 못한 그 단체는 등장인물들이 낯선 물체에 Steve라는 이름을 붙이는 한 애니메이션 영화의 장면을 바탕으로 이 현상을 ‘Steve’라고 이름 짓기로 결정했다."}], "chunks": [[0, 1], [2, 3], [4, 5], [6, 7]], "half": 4, "ex": [{"head": "In Alberta, Canada, there were", "clue": ["“aurora chasers”", "an informal group online"], "core": "캐나다 앨버타의 '오로라 추적자' 온라인 모임", "why": "글의 출발: 두 번째 시민 과학 이야기의 주인공 소개"}, {"head": "They would leave their homes", "clue": ["They", "at night", "photographs of auroras"], "core": "밤마다 집을 나서 멋진 오로라 사진 찍기", "why": "They(그들) = 앞의 오로라 추적자들 → 모임이 하는 일"}, {"head": "Then they would share them", "clue": ["Then", "them", "the rest of the group"], "core": "찍은 사진을 모임 사람들과 공유", "why": "Then(그런 다음) = 사진 찍은 다음 / them(그것들) = 오로라 사진"}, {"head": "In the summer of 2014", "clue": ["In the summer of 2014", "something strange"], "core": "2014년 여름, 밤하늘에 이상한 것 발견", "why": "평소 활동 소개 → 특정 시점(2014년)의 사건 시작"}, {"head": "There were unusual ribbons of", "clue": ["unusual ribbons of green and purple light"], "core": "초록·보라 빛의 특이한 띠, 수천 km 뻗기도", "why": "앞의 something strange(이상한 무언가)의 정체 묘사"}, {"head": "Sometimes they lasted for just", "clue": ["they", "a few minutes", "a whole hour"], "core": "몇 분 만에 사라지기도, 한 시간 내내 머물기도", "why": "they(그것들) = 빛의 띠들 → 모양 다음 지속 시간"}, {"head": "They were similar in appearance", "clue": ["similar in appearance to auroras", "yet"], "core": "오로라와 비슷하지만 확실히 다른 특징", "why": "They = 빛의 띠 / yet(그러나)로 '오로라는 아님' 강조"}, {"head": "Unsure of what they were", "clue": ["Unsure of what they were", "the phenomenon “Steve,”"], "core": "정체를 몰라 애니메이션 장면을 따서 'Steve'라 이름 붙임", "why": "Unsure(확신 없는) = 앞의 '오로라와 다름'의 결과 → 이름 짓기로 마무리"}], "postit": "오로라 추적자 모임 → 밤에 촬영·공유 → 2014년 이상한 빛 → 초록·보라 띠 → 몇 분~한 시간 → 오로라와 다름 → 'Steve' 명명", "cex": [{"core": "캐나다 앨버타 오로라 추적자들의 밤 사진 촬영", "why": "글의 출발: In Alberta, Canada(캐나다 앨버타에서) → 두 번째 시민 과학 이야기 주인공 소개"}, {"core": "사진 공유, 2014년 여름 밤하늘의 이상한 것", "why": "Then(그런 다음) = 오로라 사진을 찍은 뒤 → 그룹과 공유"}, {"core": "수천 km 초록·보라 빛 띠, 몇 분~한 시간 지속", "why": "There were unusual ribbons(특이한 띠가 있었다) → 앞의 something strange(이상한 것)의 정체 묘사"}, {"core": "오로라와 비슷하지만 달라서 'Steve'라 이름 붙임", "why": "They(그것들) = 빛의 띠 / yet(그러나)로 '오로라는 아님' → 이름 짓기"}]}, {"id": "g2_L2-p5", "label": "2과 ⑤ 전문가와 NASA 프로젝트", "sents": [{"en": "After photographing Steve for several years and discussing what it might be, the group members decided to get help from experts.", "ko": "몇 년 동안 Steve의 사진을 찍고 그것이 무엇일지에 대해 논의한 후에, 그 단체 구성원들은 전문가들로부터 도움을 받기로 결정했다."}, {"en": "They showed their photos of Steve to a professor of astronomy at a local university and a scientist at NASA.", "ko": "그들은 Steve의 사진들을 지역 대학의 천문학 교수와 NASA의 과학자에게 보여주었다."}, {"en": "Surprisingly, neither of them had any idea what Steve was.", "ko": "놀랍게도, 둘 중 누구도 Steve가 무엇인지 전혀 알지 못했다."}, {"en": "They confirmed that it was not an aurora, but it did not resemble anything they had seen before.", "ko": "그들은 그것이 오로라가 아니라는 것은 확인했지만, 그것은 그들이 이전에 보았던 어느 것과도 비슷하지 않았다."}, {"en": "They realized that the group had discovered a new type of phenomenon that had never been properly studied.", "ko": "그들은 그 단체가 제대로 연구된 적이 없는 새로운 유형의 현상을 발견했다는 것을 깨달았다."}, {"en": "In order to learn more about it, NASA funded a citizen science project involving the public.", "ko": "이에 대해 더 자세히 알아보기 위해, NASA는 대중이 참여하는 시민 과학 프로젝트에 자금을 제공했다."}, {"en": "The project asked ordinary people to gather photos of Steve and send them to NASA.", "ko": "그 프로젝트는 일반인들에게 Steve의 사진을 모아서 NASA에 보내달라고 요청했다."}, {"en": "It is still in progress today.", "ko": "그것은 오늘날에도 여전히 진행 중이다."}], "chunks": [[0, 1], [2, 3], [4, 5], [6, 7]], "half": 4, "ex": [{"head": "After photographing Steve for several", "clue": ["several years", "get help from experts"], "core": "몇 년 촬영·토론 끝에 전문가 도움을 받기로", "why": "글의 출발: 앞에서 이름 붙인 Steve, 정체를 알아보러 나섬"}, {"head": "They showed their photos of", "clue": ["They", "their photos of Steve", "a scientist at NASA"], "core": "지역 대학 천문학 교수와 NASA 과학자에게 사진 보여 줌", "why": "They(그들) = 모임 구성원 / '전문가 도움' → 실제로 누구에게 갔는지"}, {"head": "Surprisingly, neither of them had", "clue": ["Surprisingly", "neither of them"], "core": "놀랍게도 두 전문가 모두 정체를 전혀 모름", "why": "neither of them(둘 다 ~아닌) = 앞의 교수와 NASA 과학자 두 명"}, {"head": "They confirmed that it was", "clue": ["it was not an aurora", "but"], "core": "오로라는 아니지만 본 적 없는 무언가", "why": "They = 두 전문가 / 정체는 모름 → 그래도 알아낸 것(오로라 아님)"}, {"head": "They realized that the group", "clue": ["a new type of phenomenon", "never been properly studied"], "core": "아무도 제대로 연구한 적 없는 새로운 현상을 발견한 것", "why": "'본 적 없는 것' → 그러니 '새로운 현상'이라는 결론"}, {"head": "In order to learn more", "clue": ["In order to learn more about it", "a citizen science project"], "core": "더 알아보려고 NASA가 시민 과학 프로젝트에 자금 지원", "why": "it(그것) = 앞의 새로운 현상 → 알아보려는 다음 행동"}, {"head": "The project asked ordinary people", "clue": ["The project", "ordinary people"], "core": "일반인이 Steve 사진을 모아 NASA에 보내기", "why": "The project(그 프로젝트) = 앞에서 NASA가 지원한 시민 과학 프로젝트"}, {"head": "It is still in", "clue": ["It", "still in progress today"], "core": "지금도 진행 중", "why": "It(그것) = 그 프로젝트 → 현재 상황으로 마무리"}], "postit": "전문가에게 도움 → 교수·NASA에 사진 → 둘 다 모름 → 오로라 아님 → 새 현상 → NASA 시민 과학 프로젝트 → 지금도 진행 중", "cex": [{"core": "몇 년 촬영 끝에 교수·NASA 과학자에 도움 요청", "why": "글의 출발: After photographing Steve(Steve를 촬영한 뒤) → 정체를 알아보러 전문가에게"}, {"core": "두 전문가 모두 정체 모름, 오로라는 아님", "why": "Surprisingly(놀랍게도), neither of them(둘 다 아님) = 교수와 NASA 과학자"}, {"core": "새 현상 발견 → ": "You can become one as well if you have curiosity and an interest in taking part in scientific research.", "ko": "호기심과 과학 연구에 참여하는 것에 대한 관심이 있다면 당신도 시민 과학자가 될 수 있다."}, {"en": "The next great scientific achievement could be made by citizen scientists volunteering their time for the purpose of better understanding the world.", "ko": "다음 위대한 과학적 업적은 세상을 더 잘 이해하기 위한 목적으로 자신의 시간을 자발적으로 제공하는 시민 과학자들에 의해 이루어질 수도 있다."}], "chunks": [[0, 1], [2, 5], [6, 7], [8, 10]], "half": 6, "ex": [{"head": "In honor of the aurora", "clue": ["In honor of the aurora chasers", "the name “Steve”"], "core": "처음 발견한 오로라 추적자들을 기려 'Steve' 이름 유지", "why": "글의 출발: 앞에서 붙인 별명 Steve가 공식 이름으로 남음"}, {"head": "However, it is now written", "clue": ["However", "it", "all capital letters"], "core": "단, 이제는 대문자 STEVE = Strong Thermal Emission Velocity Enhancement", "why": "it(그것) = 앞의 이름 Steve / However(그러나)로 '그대로지만 달라진 점'"}, {"head": "Experts have acknowledged that it", "clue": ["the dedicated members of the aurora chasers group", "deserve the credit", "STEVE"], "core": "전문가들도 인정: 발견의 공로는 오로라 추적자들의 것", "why": "대문자 STEVE가 처음 쓰임 → 대문자 설명 다음 / 이름을 남긴 이유(공로) 재확인"}, {"head": "If it had not been", "clue": ["If it had not been for them"], "core": "그들이 없었다면 영원히 아무도 몰랐을 수도", "why": "them(그들) = 바로 앞 공로를 인정받은 오로라 추적자 구성원들 → 공로 인정 바로 뒤"}, {"head": "There are many interesting theories", "clue": ["many interesting theories", "none of them"], "core": "흥미로운 이론은 많지만 확실히 증명된 것은 없음", "why": "발견의 공로(과거) → 아직 정체가 안 풀린 지금 상황으로 전환"}, {"head": "Scientists and citizens continue to", "clue": ["this mystery", "every day"], "core": "과학자·시민이 함께 수수께끼를 풀며 매일 더 알아 감", "why": "this mystery(이 수수께끼) = 앞의 '증명 안 된 STEVE의 정체'"}, {"head": "Most of the individuals involved", "clue": ["these two projects", "not professional scientists"], "core": "두 프로젝트 참여자 대부분은 전문 과학자가 아님", "why": "these two projects(이 두 프로젝트) = Galaxy Zoo와 STEVE → 두 이야기를 다 마친 뒤 정리 시작"}, {"head": "Instead, they are citizen scientists—ordinary", "clue": ["Instead", "citizen scie
