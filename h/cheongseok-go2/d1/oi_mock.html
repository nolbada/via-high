var IT=[{"id": "m2610g2-21", "src": "mock_2610_g2.txt", "label": "26년 10월 21번", "type": "insert", "sentence": "In order to make this worthwhile for the lender, money has to have a price — a cost to the borrower and income to the lender.", "segs": ["To see how borrowing and lending changes a person's worldview, consider what the rate of interest does to people's perception of time.", "Imagine you are lending to somebody at an interest rate of 10 percent per year for five years.", "This rate tells us that the money lent has a cost that reflects the risk of you not being repaid and the opportunity cost of not spending that money yourself.", "The longer the term of the loan, the higher the chance you won't be paid back because it is further into the future — which by definition is unknowable — and the longer you will have to wait before spending the money yourself.", "This price factors in the value of time.", "To put it another way, a bird in the hand is worth two in the bush."], "answer": 4, "clues": [["make this worthwhile for the lender", "주어진 문장의 this = 앞에서 말한 '못 돌려받을 위험과 오래 기다림을 감수하고 돈을 빌려주는 일'"], ["This price", "④ 뒤 문장의 This price(이 가격) = 주어진 문장에서 처음 나오는 price(돈의 가격 = 이자) → 주어진 문장이 빠지면 This price가 가리킬 것이 사라짐"], ["The longer the term of the loan", "④ 앞 문장 = 기간이 길수록 위험도 기다림도 커짐 → 그래서 빌려준 사람에게 보상(가격)이 필요하다는 주어진 문장으로 이어짐"]], "flow": ["이자가 시간 인식을 어떻게 바꾸는지 보자 — 연 10% 이자로 5년 동안 빌려준다고 상상", "이 이자율 = 못 돌려받을 위험 + 그 돈을 직접 못 쓰는 기회비용", "기간이 길수록 못 받을 가능성도, 기다리는 시간도 커짐", "그래서 빌려준 사람에게 가치 있으려면 돈에 가격(이자)이 붙어야 함", "이 가격에는 시간의 가치가 들어 있음", "손 안의 새 한 마리가 덤불 속 두 마리만큼의 가치"]}, {"id": "m2610g2-23", "src": "mock_2610_g2.txt", "label": "26년 10월 23번", "type": "order", "given": "Research on cephalopod neurobiology suggests that an octopus possesses roughly five hundred million neurons. What makes this system unusual is where many of those neurons are located.", "parts": {"A": "More than half are distributed throughout the arms rather than concentrated entirely in the central brain. Each arm contains networks of nerve cells capable of controlling complex movements and responding to sensory input locally.", "C": "This means that many actions do not require detailed instructions from the brain itself. Instead, the arms function as highly capable extensions of the nervous system that interact with the environment directly.", "B": "The suckers lining each arm play an important role in this process. These structures provide strong grip but also detect chemical signals on surfaces they contact. Marine biologists studying octopus behavior have shown that this allows the animal to gather chemical information through touch."}, "answer": "A-C-B", "hint": {"given": "문어는 신경세포가 약 5억 개 — 특이한 건 그 신경세포들이 어디에 있느냐임", "A": "절반 넘게가 중앙 뇌가 아니라 다리에 퍼져 있고, 다리마다 움직임을 스스로 조절하는 신경망이 있음", "B": "다리의 빨판이 이 과정에서 중요함 — 꽉 잡기도 하고 표면의 화학 신호도 느낌", "C": "그래서 많은 행동이 뇌의 자세한 지시 없이 이루어지고, 다리가 환경과 직접 주고받음"}, "clues": [["More than half are distributed throughout the arms", "(A)는 주어진 글의 질문 '신경세포가 어디에 있느냐'에 대한 답 → 주어진 글 바로 뒤"], ["This means", "(C)의 This = (A)에서 말한 '다리마다 스스로 움직임을 조절하는 신경망' → (A) 뒤"], ["in this process", "(B)의 this process = (C)의 '다리가 환경과 직접 주고받는 과정' → (C) 뒤"], ["These structures", "(B) 안의 These structures = 바로 앞의 빨판(suckers)"]], "flow": ["문어의 신경세포 약 5억 개, 문제는 위치", "절반 넘게가 다리에 퍼져 있음", "다리가 뇌 지시 없이 스스로 환경과 주고받음", "빨판이 꽉 잡기도 하고 화학 신호도 감지 → 만지면서 화학 정보를 모음"]}, {"id": "m2610g2-24", "src": "mock_2610_g2.txt", "label": "26년 10월 24번", "type": "insert", "sentence": "Because of their practice of contemplation for the highest human good, philosophers were considered worthy to have all the best things in life.", "segs": ["Consistent though he may be, some of Aristotle's ideas meet us today as strange. He had no difficulty justifying slavery, for example, and in his era, philosophers enjoyed positions of high privilege and influence.", "Somehow that assertion seems oddly self-serving.", "It serves us to remember that every great thinker is of her own time and speaks to a particular audience, and certainly Aristotle is no exception.", "Human flourishing as he understood it probably would not be nearly as inclusive as we would want it to be today.", "How he understood right and good is best taken to be an indicator of how the privileged elite of ancient Greek society tended to understand right and good.", "As a result, for all it does well, it is also deeply flawed."], "answer": 1, "clues": [["philosophers were considered worthy to have all the best things in life", "주어진 문장은 ① 앞 문장의 '그 시대 철학자들이 높은 특권을 누렸다'는 말의 이유·내용을 이어 줌"], ["that assertion", "① 뒤 문장의 that assertion(그 주장) = 주어진 문장의 '철학자는 최고의 것을 누릴 자격이 있다'는 주장 → 주어진 문장이 빠지면 가리킬 주장이 사라짐"]], "flow": ["아리스토텔레스의 일부 생각은 오늘날 이상하게 보임", "노예제를 정당화했고, 당시 철학자들은 큰 특권을 누림", "철학자는 최고선을 사유하므로 최고의 것을 누릴 자격이 있다고 여겨짐", "그 주장은 묘하게 자기 잇속을 챙기는 말처럼 보임", "위대한 사상가도 자기 시대 사람 — 그의 생각은 특권층의 시각이라 결점이 있음"]}, {"id": "m2610g2-29", "src": "mock_2610_g2.txt", "label": "26년 10월 29번", "type": "order", "given": "You might think of survival as a race in which a hurdle has to be jumped every year. The early hurdles were once very high, and many people fell before clearing the first few.", "parts": {"B": "Demographically, humankind was living close to a state of nature, and nature is extremely wasteful of life. From only a very small number of figs will even one of many seeds become a fig tree. Almost a quarter of baboons born in the wild die before they are a year old, which is fairly typical for primates.", "A": "Infant mortality rates for humans in pre-modern agricultural societies were similar to, and sometimes higher than, those of apes.", "C": "Things were little better for our hunter-gatherer ancestors, a quarter of whom failed to reach their first birthday, while another quarter didn't live long enough to reproduce just about everywhere until the nineteenth century. Had it been otherwise, the huge recent growth in human population would have occurred much earlier."}, "answer": "B-A-C", "hint": {"given": "생존은 매년 허들을 넘는 경주 — 옛날엔 처음 허들이 아주 높아서 많은 사람이 넘어짐", "A": "옛 농경 사회 사람 아기의 사망률도 유인원과 비슷하거나 더 높았음", "B": "인류는 자연 상태에 가깝게 살았고 자연은 생명을 엄청나게 낭비함 — 무화과 씨앗은 극히 일부만 나무가 되고, 야생 개코원숭이는 거의 4분의 1이 한 살 전에 죽음", "C": "수렵 채집인 조상도 별로 나을 게 없었음 — 그렇지 않았다면 인구 급증이 훨씬 일찍 일어났을 것"}, "clues": [["nature is extremely wasteful of life", "(B)는 주어진 글의 '높은 허들에 많이 넘어짐'을 '자연은 생명을 낭비한다'로 받고 식물·동물 예를 듦 → 주어진 글 바로 뒤"], ["those of apes", "(A)의 those of apes(유인원의 사망률)는 (B) 끝의 primates(영장류) 이야기를 받음 → (B) 뒤"], ["Things were little better", "(C)의 '형편이 별로 나을 게 없었다'는 앞에 사람 아기의 높은 사망률((A))이 나와 있어야 함 → (A) 뒤"], ["Had it been otherwise", "(C) 안의 '그렇지 않았다면' = 사망률이 높지 않았다면 → 맨 끝 마무리"]], "flow": ["생존 = 매년 허들 넘기, 옛날엔 처음 허들이 아주 높았음", "자연은 생명을 낭비함 — 무화과 씨앗, 개코원숭이 예시", "옛 농경 사회 사람 아기 사망률도 유인원 수준", "수렵 채집인도 마찬가지, 그래서 인구 급증이 늦어짐"]}, {"id": "m2610g2-30", "src": "mock_2610_g2.txt", "label": "26년 10월 30번", "type": "insert", "sentence": "The same is probably true when you are back at the office after a sickness and your colleague tells you with a displeased expression that they were happy to take over your workload.", "segs": ["A study by Eva McMahan, professor of speech communication, confirmed the dominance of nonverbal signals.", "The phenomenon, however, was especially pronounced when adults found themselves in situations with conflicting messages (i.e., situations in which the contents of the verbal and nonverbal messages differ).", "Attempts to manipulate another person verbally are therefore likely to fail if the accompanying nonverbal communication does not match the spoken message.", "This is because people trust nonverbal messages more than verbal ones.", "When somebody tells you that they enjoy spending time with you, but you notice how they are looking away and are forcing a smile, you are probably less inclined to believe their words.", "You might not believe that they enjoyed replacing you while you were gone."], "answer": 5, "clues": [["The same is probably true", "주어진 문장의 The same = ⑤ 앞 문장의 '말과 표정이 달라서 그 말을 덜 믿게 되는' 상황 → 같은 일이 회사에서도 일어남"], ["the
