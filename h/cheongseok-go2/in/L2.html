</style></head><body class="notranslate"><div class="wrap" id="app"></div><script id="data" type="application/json">{"title": "교과서 2과 삽입 다지기", "sub": "영어II 2과 · 10문제", "key": "cheongseok-go2:in:L2", "pass": [{"label": "2과 ① 과학은 모두의 것과 은하 분류", "sents": [{"en": "When we think about science, we might consider it as a domain reserved exclusively for scientists in long, white lab coats who spend their days conducting experiments and analyzing data.", "ko": "과학에 대해 생각할 때, 우리는 과학을 실험하고 데이터를 분석하며 나날을 보내는, 길고 흰 실험실 가운을 입은 과학자들만의 영역이라고 여길지도 모른다."}, {"en": "They seem to have very little in common with ordinary people like us.", "ko": "그들은 우리와 같은 평범한 사람들과 공통점이 거의 없는 것 같이 보인다."}, {"en": "However, this perception is far from the truth.", "ko": "그러나 이러한 인식은 사실과 거리가 멀다."}, {"en": "In reality, science belongs to everyone, and we all have the ability to play a role in the advancement of science.", "ko": "사실 과학은 모두의 것이며, 우리는 모두 과학의 발전에 한몫할 수 있는 능력이 있다."}, {"en": "There have been numerous citizen science projects in which ordinary people have made contributions to remarkable scientific accomplishments.", "ko": "평범한 사람들이 놀라운 과학적 업적에 기여한 수많은 시민 과학 프로젝트들이 있었다."}, {"en": "Let’s take a look at two of them.", "ko": "그중 두 가지를 살펴보자."}, {"en": "Kevin Schawinski was a young astronomy researcher studying black holes and the evolution of galaxies at the University of Oxford.", "ko": "Kevin Schawinski는 옥스퍼드 대학에서 블랙홀과 은하의 진화를 연구하는 젊은 천문학 연구원이었다."}, {"en": "This might sound exciting, but his job there was dull and time-consuming.", "ko": "이것이 흥미롭게 들릴지도 모르지만, 그곳에서 그의 일은 따분하고 시간이 많이 걸리는 일이었다."}, {"en": "He had to classify around one million images of galaxies according to their shape.", "ko": "그는 약 백만 장의 은하 이미지를 모양에 따라 분류해야 했다."}, {"en": "Since they all looked similar but were actually shaped slightly differently, the best way to do this was to sort them while looking at each one individually.", "ko": "은하들은 모두 비슷해 보이지만 사실 모양이 조금씩 달랐기 때문에, 이 일을 해내는 가장 좋은 방법은 하나하나 직접 보면서 분류하는 것이었다."}, {"en": "Of course, this would require a tremendous amount of time.", "ko": "물론, 이것은 엄청난 시간이 필요할 것이었다."}]}, {"label": "2과 ② Galaxy Zoo의 탄생", "sents": [{"en": "It took Schawinski a whole week to classify just 50,000 galaxies.", "ko": "Schawinski가 고작 5만 개의 은하를 분류하는 데 꼬박 일주일이 걸렸다."}, {"en": "He thought, “But what about the remaining 950,000?”", "ko": "그는 ‘하지만 남아 있는 95만 개는 어쩌지?’라고 생각했다."}, {"en": "One evening after work, Schawinski met a friend named Chris Lintott and complained about the situation.", "ko": "어느 날 퇴근 후 저녁, Schawinski는 Chris Lintott이라는 이름의 친구를 만나서 그 상황에 대해 불평했다."}, {"en": "Lintott suggested that he turn to the Internet to ask other people for help.", "ko": "Lintott은 인터넷의 힘을 빌려 다른 사람들에게 도움을 청해 보라고 제안했다."}, {"en": "Eventually, the two men ended up launching a crowdsourced online project known as Galaxy Zoo.", "ko": "결국, 그 두 남자는 Galaxy Zoo라고 알려진 대중을 참여시키는(= 크라우드소싱) 온라인 프로젝트를 시작하게 되었다."}, {"en": "The website was kept as simple as possible, with a very basic design and an easy-to-use interface.", "ko": "그 웹사이트는 매우 기본적인 디자인과 사용하기 쉬운 인터페이스로 최대한 단순하게 유지되었다."}, {"en": "This allowed those who wanted to participate to get started quickly.", "ko": "이것은 참여하기를 원하는 사람들이 빠르게 시작할 수 있게 했다."}, {"en": "New visitors were greeted with a brief tutorial that explained the project.", "ko": "새로 온 방문자들은 먼저 프로젝트를 설명하는 간단한 사용 안내를 받았다."}, {"en": "Then they were shown an image of a galaxy and asked to click buttons that described its features.", "ko": "그런 다음 그들에게 은하 이미지 한 장이 보여졌고, 그 은하의 특징을 설명하는 버튼을 클릭하라는 요청을 받았다."}, {"en": "Is the galaxy smooth and rounded? Is its shape an oval or a spiral?", "ko": "은하가 매끄럽고 둥근가? 그것의 모양은 타원형인가 아니면 나선형인가?"}, {"en": "After completion of the tutorial and a little bit of practice, the participants were able to classify galaxies effectively.", "ko": "사용 안내를 마치고 약간 연습한 뒤, 참가자들은 은하를 효과적으로 분류할 수 있었다."}]}, {"label": "2과 ③ 참여자들의 힘과 Zooniverse", "sents": [{"en": "It was online media that helped spread the word about Galaxy Zoo, bringing more and more participants to the website.", "ko": "Galaxy Zoo에 대한 소문을 퍼뜨리는 데 도움을 준 것은 바로 온라인 미디어였고, 그 웹사이트에 점점 더 많은 참여자를 불러 모았다."}, {"en": "Shortly after the website was launched, nearly 70,000 classifications were being made per hour.", "ko": "웹사이트가 개설된 지 얼마 지나지 않아, 시간당 약 7만 건의 분류가 이루어지고 있었다."}, {"en": "In a year and a half, more than 80,000 individuals participated, and they made more than 75 million classifications.", "ko": "일 년 반 만에, 8만 명 이상의 개인이 참여하였고, 그들은 7천5백만 건 이상의 분류를 해냈다."}, {"en": "If it had not been for those participants, Schawinski couldn’t have classified that many images.", "ko": "그 참여자들이 없었다면, Schawinski는 그렇게 많은 이미지를 분류할 수 없었을 것이다."}, {"en": "In fact, it would have taken him decades on his own.", "ko": "사실, 그 혼자서는 수십 년이 걸렸을 것이다."}, {"en": "More than 15 years have passed since the project first began in 2007.", "ko": "그 프로젝트가 2007년에 처음 시작된 이래로 15년 이상이 지났다."}, {"en": "Galaxy Zoo has now grown into Zooniverse, which is one of the most popular platforms on the Internet for ordinary people who want to participate in science projects.", "ko": "Galaxy Zoo는 이제 Zooniverse로 성장했는데, 이것은 과학 프로젝트에 참여하고 싶어 하는 일반인들을 위한 인터넷에서 가장 인기 있는 플랫폼 중 하나이다."}, {"en": "It is more active than ever before, with about 2 million registered users worldwide.", "ko": "그것은 전 세계 약 200만 명의 등록 사용자와 함께 그 어느 때보다 활발하다."}, {"en": "It now offers a wide range of projects in astronomy, biology, physics, and more.", "ko": "현재 그것은 천문학, 생물학, 물리학 등에서 광범위한 프로젝트들을 제공하고 있다."}, {"en": "If you want to get involved, you should definitely check it out!", "ko": "참여하고 싶다면 꼭 한번 확인해 보라!"}]}, {"label": "2과 ④ 오로라 추적자와 Steve", "sents": [{"en": "In Alberta, Canada, there were some “aurora chasers” who formed an informal group online.", "ko": "캐나다 앨버타주에는 온라인상에서 비공식 단체를 결성한 ‘오로라 추적자들’이 있었다."}, {"en": "They would leave their homes at night and try to get exceptional photographs of auroras.", "ko": "그들은 밤에 집을 나서 특별한 오로라 사진을 찍으려고 하곤 했다."}, {"en": "Then they would share them with the rest of the group.", "ko": "그런 다음 그들은 단체의 나머지 사람들과 그것들을 공유하곤 했다."}, {"en": "In the summer of 2014, the group members began to notice something strange appearing in the night sky.", "ko": "2014년 여름, 그 단체 구성원들은 밤하늘에 이상한 무언가가 나타나는 것을 알아채기 시작했다."}, {"en": "There were unusual ribbons of green and purple light, some of which seemed to stretch for thousands of kilometers.", "ko": "녹색과 보라색의 특이한 빛의 띠가 있었는데, 그중 일부는 수천 킬로미터에 걸쳐 뻗어 있는 것처럼 보였다."}, {"en": "Sometimes they lasted for just a few minutes, while other times they remained in the sky for a whole hour.", "ko": "그것들은 어떤 때에는 단 몇 분간 지속되었지만, 다른 때에는 한 시간 내내 하늘에 머무르기도 했다."}, {"en": "They were similar in appearance to auroras, yet they possessed some notably different features.", "ko": "그것들은 오로라와 생김새가 비슷했지만, 몇 가지 현저하게 다른 특징들을 지니고 있었다."}, {"en": "Unsure of what they were, the group decided to name the phenomenon “Steve,” based on a scene from an animated movie where some characters give that name to an unfamiliar object.", "ko": "그것들이 무엇인지 확신하지 못한 그 단체는 등장인물들이 낯선 물체에 Steve라는 이름을 붙이는 한 애니메이션 영화의 장면을 바탕으로 이 현상을 ‘Steve’라고 이름 짓기로 결정했다."}]}, {"label": "2과 ⑤ 전문가와 NASA 프로젝트", "sents": [{"en": "After photographing Steve for several years and discussing what it might be, the group members decided to get help from experts.", "ko": "몇 년 동안 Steve의 사진을 찍고 그것이 무엇일지에 대해 논의한 후에, 그 단체 구성원들은 전문가들로부터 도움을 받기로 결정했다."}, {"en": "They showed their photos of Steve to a professor of astronomy at a local university and a scientist at NASA.", "ko": "그들은 Steve의 사진들을 지역 대학의 천문학 교수와 NASA의 과학자에게 보여주었다."}, {"en": "Surprisingly, neither of them had any idea what Steve was.", "ko": "놀랍게도, 둘 중 누구도 Steve가 무엇인지 전혀 알지 못했다."}, {"en": "They confirmed that it was not an aurora, but it did not resemble anything they had seen before.", "ko": "그들은 그것이 오로라가 아니라는 것은 확인했지만, 그것은 그들이 이전에 보았던 어느 것과도 비슷하지 않았다."}, {"en": "They realized that the group had discovered a new type of phenomenon that had never been properly studied.", "ko": "그들은 그 단체가 제대로 연구된 적이 없는 새로운 유형의 현상을 발견했다는 것을 깨달았다."}, {"en": "In order to learn more about it, NASA funded a citizen science project involving the public.", "ko": "이에 대해 더 자세히 알아보기 위해, NASA는 대중이 참여하는 시민 과학 프로젝트에 자금을 제공했다."}, {"en": "The project asked ordinary people to gather photos of Steve and send them to NASA.", "ko": "그 프로젝트는 일반인들에게 Steve의 사진을 모아서 NASA에 보내달라고 요청했다."}, {"en": "It is still in progress today.", "ko": "그것은 오늘날에도 여전히 진행 중이다."}]}, {"label": "2과 ⑥ STEVE와 누구나 시민 과학자", "sents": [{"en": "In honor of the aurora chasers who first discovered the phenomenon, the name “Steve” has been kept.", "ko": "이 현상을 처음 발견한 오로라 추적자들에게 경의를 표하여 ‘Steve’라는 이름은 유지되었다."}, {"en": "However, it is now written in all capital letters and stands for “Strong Thermal Emission Velocity Enhancement.”", "ko": "그러나, 그것은 이제 모두 대문자로 쓰이며, ‘속도 증가에 따른 강한 열 방출(Strong Thermal Emission Velocity Enhancement)’을 의미한다."}, {"en": "Experts have acknowledged that it is the dedicated members of the aurora chasers group that deserve the credit for discovering STEVE.", "ko": "전문가들은 STEVE를 발견한 공로를 인정받아야 할 사람들은 바로 오로라 추적자 단체의 헌신적인 구성원들임을 인정했다."}, {"en": "If it had not been for them, it might have remained unnoticed forever.", "ko": "만약 그들이 아니었다면, 그것은 영원히 알려지지 못한 상태로 남았을지도 모른다."}, {"en": "There are many interesting theories about STEVE, but none of them have been proven for certain.", "ko": "STEVE에 대한 흥미로운 이론들은 많지만, 그들 중 어느 것도 확실하게 증명된 것은 없다."}, {"en": "Scientists and citizens continue to collaborate to solve this mystery, and they are learning more and more about STEVE every day.", "ko": "과학자들과 시민들은 이 수수께끼를 풀기 위해 계속 협력하며, 매일 STEVE에 대해 점점 더 많은 것을 알아가고 있다."}, {"en": "Most of the individuals involved in these two projects are not professional scientists.", "ko": "이 두 프로젝트에 참여한 대부분의 개인들은 전문 과학자가 아니다."}, {"en": "Instead, they are citizen scientists—ordinary people who desire to help advance science in areas that they are interested in.", "ko": "대신, 그들은 시민 과학자들인데, 그들은 자신이 관심 있는 분야에서 과학의 발전을 돕고자 하는 평범한 사람들이다."}, {"en": "Even though citizen scientists may not have science degrees or long, white lab coats, they are still capable of making valuable contributions to science.", "ko": "시민 과학자들에게 과학 학위나 길고 흰 가운은 없을 수 있지만, 그들은 여전히 과학에 귀중한 기여를 할 수 있다."}, {"en": "You can become one as well if you have curiosity and an interest in taking part in scientific research.", "ko": "호기심과 과학 연구에 참여하는 것에 대한 관심이 있다면 당신도 시민 과학자가 될 수 있다."}, {"en": "The next great scientific achievement could be made by citizen scientists volunteering their time for the purpose of better understanding the world.", "ko": "다음 위대한 과학적 업적은 세상을 더 잘 이해하기 위한 목적으로 자신의 시간을 자발적으로 제공하는 시민 과학자들에 의해 이루어질 수도 있다."}]}], "items": [{"id": "in-g2_L2-01", "p": 0, "s": 2, "pos": [2, 4, 6, 8, 10], "cue": ["However(그러나) → 앞 두 문장의 생각(과학은 과학자만의 것)을 뒤집음", "this perception(이러한 인식) = 과학자는 ordinary people(평범한 사람들)과 공통점이 거의 없어 보인다는 생각", "far from the truth(사실과 거리가 먼) → 뒤 문장 In reality(실제로는)로 진짜 사실 제시"], "trap": [[4, "In reality(실제로는) 문장 뒤에 넣으면 this perception(이러한 인식)이 ‘과학은 모두의 것’이라는 올바른 생각을 가리켜, 맞는 말을 틀렸다고 하는 꼴"], [6, "citizen science projects(시민 과학 프로젝트) 소개가 끝난 뒤라 뒤집을 ‘인식’이 없음"]], "var": {"en": "Yet this view is far from the truth.", "ko": "그렇지만 이러한 견해는 사실과 거리가 멀다.", "chg": "However(그러나) → Yet(그렇지만), perception(인식) → view(견해)", "note": "단어가 바뀌어도 this view(이러한 견해)가 앞의 ‘과학은 과학자만의 것’이라는 생각을 요구"}, "fam": "역접 가족: However(그러나) / Yet(그렇지만) / Nevertheless(그럼에도 불구하고) / Still(그런데도) / On the other hand(반면에)", "post": "과학은 과학자만의 것이라는 인식 → 그러나 사실이 아님 → 실제로 과학은 모두의 것"}, {"id": "in-g2_L2-02", "p": 0, "s": 7, "pos": [3, 5, 7, 9, 11], "cue": ["This(이것) = 앞 문장 내용, studying black holes and the evolution of galaxies(블랙홀과 은하의 진화를 연구하는 일)", "his job there(그곳에서의 그의 일) → his = Kevin Schawinski, there = the University of Oxford(옥스퍼드 대학교)", "dull and time-consuming(따분하고 시간이 많이 걸리는) → 뒤 문장 He had to classify(그는 분류해야 했다)가 그 구체적 내용"], "trap": [[9, "‘백만 장을 분류해야 했다’ 뒤에 넣으면 This가 그 분류 작업을 가리켜 sound exciting(흥미롭게 들리다)과 안 맞고, 뒤 문장 they(그것들)가 images(이미지들)와 떨어짐"], [5, "Schawinski가 소개되기 전이라 his(그의)와 there(그곳에서)가 가리킬 사람·장소가 없음"]], "var": {"en": "Such research might sound exciting, but his job there was dull and time-consuming.", "ko": "그런 연구가 흥미롭게 들릴지도 모르지만, 그곳에서 그의 일은 따분하고 시간이 많이 걸리는 일이었다.", "chg": "This(이것) → Such research(그런 연구)", "note": "Such research(그런 연구)가 가리키는 것도 앞 문장의 블랙홀·은하 연구"}, "fam": "앞 명사를 받는 말: It(그것) / This(이것) / This + 명사(이 ~) / The + 명사(그 ~) / Such + 명사(그런 ~)", "post": "블랙홀·은하를 연구하는 Schawinski → 흥미롭게 들리지만 실제 일은 따분함 → 은하 이미지 백만 장 분류"}, {"id": "in-g2_L2-03", "p": 1, "s": 3, "pos": [1, 3, 5, 7, 10], "cue": ["Lintott → 앞 문장에서 a friend named Chris Lintott(Chris Lintott이라는 친구)으로 처음 소개된 뒤 성만 쓰는 것", "he(그) = Schawinski, suggested(제안했다) → complained about the situation(상황에 대해 불평했다)에 대한 반응", "뒤 문장 the two men(두 남자) = Schawinski와 Lintott, Eventually(결국) → 제안의 결과"], "trap": [[5, "Galaxy Zoo를 시작했다는 문장 뒤에 넣으면 프로젝트를 다 만든 다음에 ‘인터넷에 도움을 청해 보라’는 제안이 나와 순서가 거꾸로"], [1, "친구 Lintott이 등장하기도 전이라 누구인지 알 수 없음"]], "var": {"en": "In response, Lintott suggested that he turn to the Internet to ask other people for help.", "ko": "이에 답하여 Lintott은 인터넷의 힘을 빌려 다른 사람들에게 도움을 청해 보라고 제안했다.", "chg": "Lintott suggested(Lintott은 제안했다) → In response, Lintott suggested(이에 답하여 Lintott은 제안했다)", "note": "In response(이에 답하여)가 붙어 앞 문장의 complained(불평했다)와 더 뚜렷하게 연결"}, "fam": "", "post": "친구 Lintott에게 불평 → 인터넷에 도움을 청하라는 제안 → 두 사람의 Galaxy Zoo 시작"}, {"id": "in-g2_L2-04", "p": 1, "s": 8, "pos": [1, 3, 5, 6, 8], "cue": ["Then(그런 다음) → 앞 문장 greeted with a brief tutorial(짧은 안내 설명으로 맞이받은) 다음 순서", "they(그들) = 앞 문장의 New visitors(새 방문자들)", "buttons that described its features(그것의 특징을 설명하는 버튼) → 뒤 문장의 질문 Is the galaxy smooth and rounded?(은하가 매끄럽고 둥근가?)가 버튼 내용"], "trap": [[6, "웹 사이트 설명 뒤라 이어져 보이지만 they(그들)가 가리킬 방문자가 아직 없고 Then(그런 다음)이 이을 앞 순서도 없음"], [5, "Galaxy Zoo를 시작했다는 문장 뒤에 넣으면 they가 the two men(두 남자)이 되어 만든 사람들이 이미지를 보게 되는 꼴"]], "var": {"en": "Next, they were shown an image of a galaxy and asked to click buttons that described its features.", "ko": "다음으로 그들에게 은하 이미지 한 장이 보여졌고, 그 은하의 특징을 설명하는 버튼을 클릭하라는 요청을 받았다.", "chg": "Then(그런 다음) → Next(다음으로)", "note": "앞머리가 바뀌어도 순서 신호, 앞에 첫 단계 tutorial(안내 설명)이 필요"}, "fam": "시간 순서 가족: Then(그런 다음) / Next(다음으로) / Later(이후) / After that(그 후에) / Afterward(그 뒤에)", "post": "새 방문자에게 짧은 안내 → 은하 이미지를 보고 버튼 클릭 → 버튼의 질문들"}, {"id": "in-g2_L2-05", "p": 2, "s": 2, "pos": [1, 2, 5, 7, 9], "cue": ["In a year and a half(일 년 반 만에) → 앞 문장 Shortly after the website was launched(웹 사이트가 시작된 직후)보다 뒤의 시점, 시간 순서", "more than 80,000 individuals(8만 명 이상의 개인) → 뒤 문장 those participants(그 참가자들)가 받는 말", "75 million classifications(7천5백만 건의 분류) → 뒤 문장 that many images(그렇게 많은 이미지)가 받는 숫자"], "trap": [[1, "참가자가 늘었다는 글의 첫 문장 뒤라 자연스러워 보이지만 ‘일 년 반’이 ‘시작 직후’보다 먼저 나와 시간 순서가 거꾸로"], [5, "‘혼자서는 수십 년’ 문장 뒤에 넣으면 those participants(그 참가자들)와 that many images(그렇게 많은 이미지)가 가리킬 숫자가 뒤늦게 나옴"]], "var": {"en": "Within a year and a half, more than 80,000 individuals participated, and they made more than 75 million classifications.", "ko": "일 년 반 이내에, 8만 명 이상의 개인이 참여하였고, 그들은 7천5백만 건 이상의 분류를 해냈다.", "chg": "In(~ 만에) → Within(~ 이내에)", "note": "전치사가 바뀌어도 ‘시작 직후 → 일 년 반’이라는 시간 순서가 단서"}, "fam": "", "post": "시작 직후 시간당 7만 건 → 일 년 반 만에 8만 명·7천5백만 건 → 참가자들이 없었다면 불가능"}, {"id": "in-g2_L2-06", "p": 2, "s": 4, "pos": [1, 2, 4, 6, 8], "cue": ["In fact(사실) → 앞 문장 couldn’t have classified that many images(그렇게 많은 이미지를 분류하지 못했을 것이다)를 더 강하게 덧붙임", "him(그) = 앞 문장의 Schawinski", "would have taken(걸렸을 것이다) = 앞 문장 If it had not been for(~이 없었다면)에 이어지는 가정법"], "trap": [[6, "More than 15 years(15년 이상) 뒤라 ‘수십 년’과 시간 얘기가 겹쳐 보이지만 him(그)이 가리킬 사람이 없고 프로젝트의 현재 얘기로 넘어간 뒤"], [2, "시간당 분류 건수 뒤에는 Schawinski도 ‘없었다면’이라는 가정도 아직 안 나옴"]], "var": {"en": "Indeed, it would have taken him decades on his own.", "ko": "실제로, 그 혼자서는 수십 년이 걸렸을 것이다.", "chg": "In fact(사실) → Indeed(실제로)", "note": "앞머리가 바뀌어도 would have taken(걸렸을 것이다)이 앞의 가정 If it had not been for(~이 없었다면)를 요구"}, "fam": "강조·덧붙임 가족: In fact(사실) / Indeed(실제로) / Actually(실은) / As a matter of fact(사실은)", "post": "참가자들이 없었다면 분류 불가능 → 혼자서는 수십 년 걸렸을 일"}, {"id": "in-g2_L2-07", "p": 3, "s": 2, "pos": [1, 2, 4, 6, 8], "cue": ["Then(그런 다음) → 앞 문장 get exceptional photographs(뛰어난 사진을 찍다) 다 리킬 ‘이름’이 너무 멀고 many interesting theories(많은 흥미로운 이론들)와 섞임"]], "var": {"en": "The name, however, is now written in all capital letters and stands for “Strong Thermal Emission Velocity Enhancement.”", "ko": "그러나 그 이름은 이제 모두 대문자로 쓰이며, ‘속도 증가에 따른 강한 열 방출(Strong Thermal Emission Velocity Enhancement)’을 의미한다.", "chg": "However, it(그러나 그것은) → The name, however,(그러나 그 이름은)", "note": "however가 문장 중간으로 들어가도 역접, The name(그 이름)은 앞의 the name “Steve”를 다시 받는 말"}, "fam": "역접 가족: However(그러나) / Yet(그렇지만) / Nevertheless(그럼에도 불구하고) / Still(그런데도) / On the other hand(반면에)", "post": "Steve라는 이름은 유지 → 그러나 이제 대문자 STEVE, 새로운 뜻 → 발견의 공로는 오로라 추적자들"}, {"id": "in-g2_L2-10", "p": 5, "s": 7, "pos": [4, 6, 7, 9, 11], "cue": ["Instead(대신) → 앞 문장 are not professional scientists(전문 과학자가 아니다)의 not을 받아 ‘그럼 무엇인지’ 제시", "they(그들) = Most of the individuals involved in these two projects(이 두 프로젝트에 참여한 사람들 대부분)", "citizen scientists(시민 과학자들) → 뒤 문장 Even though citizen scientists ~(비록 시민 과학자들이 ~이지만)에서 다시 사용"], "trap": [[9, "citizen scientists(시민 과학자들)를 이미 쓴 문장 뒤에 넣으면 뒤늦게 뜻풀이하는 꼴이고 Instead(대신)가 받을 not ~(~이 아니다)도 없음"], [6, "STEVE 연구 얘기 뒤라 they가 Scientists and citizens(과학자와 시민)를 받는 듯하지만 ‘~이 아니다’라는 부정문이 앞에 없어 Instead(대신)를 쓸 수 없음"]], "var": {"en": "Rather, they are citizen scientists—ordinary people who desire to help advance science in areas that they are interested in.", "ko": "오히려, 그들은 시민 과학자들인데, 그들은 자신이 관심 있는 분야에서 과학의 발전을 돕고자 하는 평범한 사람들이다.", "chg": "Instead(대신) → Rather(오히려)", "note": "앞머리가 바뀌어도 앞에 not(~이 아니다)이 들어간 부정문이 필요"}, "fam": "‘A가 아니라 B’ 가족: Instead(대신) / Rather(오히려) / On the contrary(그와는 반대로)", "post": "참여자 대부분은 전문 과학자가 아님 → 대신 시민 과학자 → 학위가 없어도 과학에 기여 가능"}]}</script><script>
var D=JSON.parse(document.getElementById('data').textContent),IT=D.items,KEY='in:'+D.key;

 $('app').innerHTML=h;window.scrollTo(0,0)}

 h+='<div class="seg"><button class="'+(lv==1?'on':'')+'" onclick="op('+cur+',1)">1단계 원문</button><button class="'+(lv==2?'on':'')+'" onclick="op('+cur+',2)">2단계 변형</button></div>';
 h+='<div class="giv"><small>주어진 문장</small><span lang="en" translate="no">'+esc(g.en)+'</span>'+(done?'<div class="ko">'+esc(g.ko)+'</div>':'')+'</div>';
 h+='<div class="ps" lang="en" translate="no">';
 for(var i=0;i<=N;i++){var k=it.pos.indexOf(i);

 else{var ok=it.pos[pick]==it.s;h+='<div class="band '+(ok?'ok':'ng')+'">'+(ok?'정답 '+C[pick]:'오답 · 정답 '+C[it.pos.indexOf(it.s)])+'</div>';

  if(lv==2)h+='<div class="chg"><b>바뀐 앞머리</b>'+esc(it['var'].chg)+(it['var'].note?'<div>'+esc(it['var'].note)+'</div>':'')+'</div>';
