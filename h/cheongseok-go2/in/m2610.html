</style></head><body class="notranslate"><div class="wrap" id="app"></div><script id="data" type="application/json">{"title": "26년 10월 모의고사 삽입 다지기", "sub": "지문 16개 · 13문제", "key": "cheongseok-go2:in:2610_g2", "pass": [{"label": "26년 10월 21번 이자는 시간의 가치", "sents": [{"en": "To see how borrowing and lending changes a person’s worldview, consider what the rate of interest does to people’s perception of time.", "ko": "돈을 빌리고 빌려주는 일이 한 사람의 세계관을 어떻게 바꾸는지 알아보려면, 이자율이 시간에 대한 사람들의 인식에 무슨 일을 하는지 생각해 보라."}, {"en": "Imagine you are lending to somebody at an interest rate of 10 percent per year for five years.", "ko": "여러분이 누군가에게 연 10퍼센트의 이자율로 5년 동안 돈을 빌려주고 있다고 상상해 보라."}, {"en": "This rate tells us that the money lent has a cost that reflects the risk of you not being repaid and the opportunity cost of not spending that money yourself.", "ko": "이 이자율은 빌려준 돈에 대가가 있다는 것, 즉 여러분이 돈을 돌려받지 못할 위험과 그 돈을 직접 쓰지 못하는 기회비용을 반영한 대가가 있다는 것을 말해 준다."}, {"en": "The longer the term of the loan, the higher the chance you won’t be paid back because it is further into the future — which by definition is unknowable — and the longer you will have to wait before spending the money yourself.", "ko": "대출 기간이 길수록 돈을 돌려받지 못할 가능성은 더 높아지는데, 정의상 알 수 없는 더 먼 미래의 일이기 때문이며, 여러분이 그 돈을 직접 쓰기 전까지 기다려야 하는 시간도 더 길어진다."}, {"en": "In order to make this worthwhile for the lender, money has to have a price — a cost to the borrower and income to the lender.", "ko": "빌려주는 사람에게 이 일이 할 만한 가치가 있으려면, 돈에는 가격, 즉 빌리는 사람에게는 비용이고 빌려주는 사람에게는 수입인 것이 있어야 한다."}, {"en": "This price factors in the value of time.", "ko": "이 가격에는 시간의 가치가 반영되어 있다."}, {"en": "To put it another way, a bird in the hand is worth two in the bush.", "ko": "달리 말하면, 손 안의 새 한 마리가 덤불 속의 두 마리만큼의 가치가 있다."}]}, {"label": "26년 10월 22번 콘텐츠 제작자의 사회적 책임", "sents": [{"en": "Social and environmental responsibility has become an increasingly important ethical consideration for content creators.", "ko": "사회적·환경적 책임은 콘텐츠 제작자들에게 점점 더 중요한 윤리적 고려 사항이 되어 왔다."}, {"en": "As global awareness of social, environmental, and sustainability issues grows, many content creators are being called upon to consider the broader impact of their work.", "ko": "사회·환경·지속 가능성 문제에 대한 전 세계적인 인식이 커지면서, 많은 콘텐츠 제작자들은 자기 작업이 미치는 더 폭넓은 영향을 고려하라는 요구를 받고 있다."}, {"en": "This includes addressing topics such as climate change, social justice, and ethical consumerism in their content.", "ko": "이것은 자신의 콘텐츠에서 기후 변화, 사회 정의, 윤리적 소비주의 같은 주제를 다루는 것을 포함한다."}, {"en": "Content creators have a platform that can influence their audience’s attitudes and behaviors, and they have a responsibility to use that platform for positive change.", "ko": "콘텐츠 제작자들은 청중의 태도와 행동에 영향을 줄 수 있는 플랫폼을 가지고 있으며, 그 플랫폼을 긍정적인 변화를 위해 사용할 책임이 있다."}, {"en": "For example, promoting environmentally sustainable products or supporting causes related to equality and justice can help raise awareness and drive meaningful social impact.", "ko": "예를 들어, 환경적으로 지속 가능한 제품을 홍보하거나 평등과 정의에 관련된 대의를 지지하는 것은 인식을 높이고 의미 있는 사회적 영향을 이끌어 내는 데 도움이 될 수 있다."}, {"en": "Ethical content creators not only focus on promoting their products or services but also consider the values and causes they support, ensuring that their content aligns with their social and environmental principles.", "ko": "윤리적인 콘텐츠 제작자들은 자신의 제품이나 서비스를 홍보하는 데만 초점을 맞추지 않고 자신이 지지하는 가치와 대의도 고려하여, 자신의 콘텐츠가 사회적·환경적 원칙과 일치하도록 한다."}]}, {"label": "26년 10월 23번 문어 다리의 신경과 빨판", "sents": [{"en": "Research on cephalopod neurobiology suggests that an octopus possesses roughly five hundred million neurons.", "ko": "두족류 신경 생물학 연구는 문어가 약 5억 개의 뉴런을 가지고 있다는 것을 시사한다."}, {"en": "What makes this system unusual is where many of those neurons are located.", "ko": "이 체계를 특이하게 만드는 것은 그 뉴런들 중 다수가 어디에 있느냐이다."}, {"en": "More than half are distributed throughout the arms rather than concentrated entirely in the central brain.", "ko": "절반 이상이 중앙의 뇌에 전부 모여 있지 않고 다리 전체에 걸쳐 퍼져 있다."}, {"en": "Each arm contains networks of nerve cells capable of controlling complex movements and responding to sensory input locally.", "ko": "각 다리에는 복잡한 움직임을 통제하고 감각 입력에 그 자리에서 반응할 수 있는 신경 세포 네트워크가 있다."}, {"en": "This means that many actions do not require detailed instructions from the brain itself.", "ko": "이것은 많은 행동이 뇌 자체로부터 상세한 지시를 받을 필요가 없다는 뜻이다."}, {"en": "Instead, the arms function as highly capable extensions of the nervous system that interact with the environment directly.", "ko": "대신, 다리들은 환경과 직접 상호 작용하는 매우 유능한 신경계의 연장선으로 작동한다."}, {"en": "The suckers lining each arm play an important role in this process.", "ko": "각 다리를 따라 늘어선 빨판들은 이 과정에서 중요한 역할을 한다."}, {"en": "These structures provide strong grip but also detect chemical signals on surfaces they contact.", "ko": "이 구조들은 강하게 붙잡는 힘을 제공할 뿐 아니라, 접촉하는 표면의 화학적 신호도 감지한다."}, {"en": "Marine biologists studying octopus behavior have shown that this allows the animal to gather chemical information through touch.", "ko": "문어의 행동을 연구하는 해양 생물학자들은 이것 덕분에 문어가 접촉을 통해 화학 정보를 모을 수 있다는 것을 보여 주었다."}, {"en": "In practical terms, an octopus can effectively taste what it touches.", "ko": "실질적으로 말해, 문어는 사실상 자기가 만지는 것을 맛볼 수 있다."}]}, {"label": "26년 10월 24번 아리스토텔레스 사상의 시대적 한계", "sents": [{"en": "Consistent though he may be, some of Aristotle’s ideas meet us today as strange.", "ko": "비록 아리스토텔레스가 일관적이라 해도, 그의 생각 중 일부는 오늘날 우리에게 낯설게 다가온다."}, {"en": "He had no difficulty justifying slavery, for example, and in his era, philosophers enjoyed positions of high privilege and influence.", "ko": "예를 들어, 그는 노예 제도를 정당화하는 데 아무런 어려움이 없었고, 그의 시대에 철학자들은 높은 특권과 영향력이 있는 지위를 누렸다."}, {"en": "Because of their practice of contemplation for the highest human good, philosophers were considered worthy to have all the best things in life.", "ko": "인간의 최고선에 대해 사유하는 일을 한다는 이유로, 철학자들은 삶의 모든 좋은 것을 가질 자격이 있다고 여겨졌다."}, {"en": "Somehow that assertion seems oddly self-serving.", "ko": "어쩐지 그 주장은 이상하게도 자기 잇속만 차리는 것처럼 보인다."}, {"en": "It serves us to remember that every great thinker is of her own time and speaks to a particular audience, and certainly Aristotle is no exception.", "ko": "모든 위대한 사상가는 자기 시대에 속해 있고 특정한 청중에게 말한다는 것을 기억해 두는 것이 우리에게 도움이 되며, 아리스토텔레스도 분명 예외가 아니다."}, {"en": "Human flourishing as he understood it probably would not be nearly as inclusive as we would want it to be today.", "ko": "그가 이해한 인간 번영은 아마 오늘날 우리가 원하는 만큼 포용적이지는 않을 것이다."}, {"en": "How he understood right and good is best taken to be an indicator of how the privileged elite of ancient Greek society tended to understand right and good.", "ko": "그가 옳음과 선을 어떻게 이해했는지는 고대 그리스 사회의 특권 엘리트층이 옳음과 선을 어떻게 이해하는 경향이 있었는지를 보여 주는 지표로 보는 것이 가장 좋다."}, {"en": "As a result, for all it does well, it is also deeply flawed.", "ko": "그 결과, 그것은 잘하는 점이 많음에도 불구하고 심각한 결함도 있다."}]}, {"label": "26년 10월 29번 생존이라는 허들 경주", "sents": [{"en": "You might think of survival as a race in which a hurdle has to be jumped every year.", "ko": "여러분은 생존을 매년 허들 하나를 뛰어넘어야 하는 경주라고 생각할 수도 있다."}, {"en": "The early hurdles were once very high, and many people fell before clearing the first few.", "ko": "초기의 허들은 한때 매우 높았고, 많은 사람들이 처음 몇 개를 넘기도 전에 넘어졌다."}, {"en": "Demographically, humankind was living close to a state of nature, and nature is extremely wasteful of life.", "ko": "인구 통계학적으로 인류는 자연 상태에 가깝게 살았는데, 자연은 생명을 극도로 낭비한다."}, {"en": "From only a very small number of figs will even one of many seeds become a fig tree.", "ko": "극소수의 무화과에서만 많은 씨앗 중 단 하나라도 무화과나무가 된다."}, {"en": "Almost a quarter of baboons born in the wild die before they are a year old, which is fairly typical for primates.", "ko": "야생에서 태어난 개코원숭이의 거의 4분의 1이 한 살이 되기 전에 죽는데, 이것은 영장류에게 꽤 전형적인 일이다."}, {"en": "Infant mortality rates for humans in pre-modern agricultural societies were similar to, and sometimes higher than, those of apes.", "ko": "전근대 농업 사회에서 인간의 유아 사망률은 유인원의 유아 사망률과 비슷했고, 때로는 더 높았다."}, {"en": "Things were little better for our hunter-gatherer ancestors, a quarter of whom failed to reach their first birthday, while another quarter didn’t live long enough to reproduce just about everywhere until the nineteenth century.", "ko": "우리의 수렵 채집 조상들도 사정이 별로 나을 게 없었는데, 그들 중 4분의 1은 첫 생일을 맞지 못했고, 19세기까지 거의 모든 곳에서 또 다른 4분의 1은 자손을 낳을 만큼 오래 살지 못했다."}, {"en": "Had it been otherwise, the huge recent growth in human population would have occurred much earlier.", "ko": "만약 그렇지 않았다면, 최근의 엄청난 인구 증가는 훨씬 더 일찍 일어났을 것이다."}]}, {"label": "26년 10월 30번 말보다 믿는 비언어 신호", "sents": [{"en": "A study by Eva McMahan, professor of speech communication, confirmed the dominance of nonverbal signals.", "ko": "발화 의사소통 교수인 Eva McMahan의 한 연구는 비언어적 신호가 우세하다는 것을 확인했다."}, {"en": "The phenomenon, however, was especially pronounced when adults found themselves in situations with conflicting messages (i.e., situations in which the contents of the verbal and nonverbal messages differ).", "ko": "그러나 그 현상은 성인들이 모순된 메시지가 있는 상황, 즉 언어적 메시지와 비언어적 메시지의 내용이 서로 다른 상황에 놓였을 때 특히 두드러졌다."}, {"en": "Attempts to manipulate another person verbally are therefore likely to fail if the accompanying nonverbal communication does not match the spoken message.", "ko": "그러므로 함께 나타나는 비언어적 의사소통이 말로 한 메시지와 맞지 않으면, 다른 사람을 말로 조종하려는 시도는 실패하기 쉽다."}, {"en": "This is because people trust nonverbal messages more than verbal ones.", "ko": "이것은 사람들이 언어적 메시지보다 비언어적 메시지를 더 믿기 때문이다."}, {"en": "When somebody tells you that they enjoy spending time with you, but you notice how they are looking away and are forcing a smile, you are probably less inclined to believe their words.", "ko": "누군가가 여러분과 시간을 보내는 것이 즐겁다고 말하지만 그 사람이 눈길을 돌리고 억지웃음을 짓는 것을 알아차리면, 여러분은 아마 그 말을 덜 믿게 될 것이다."}, {"en": "The same is probably true when you are back at the office after a sickness and your colleague tells you with a displeased expression that they were happy to take over your workload.", "ko": "여러분이 병을 앓고 나서 회사에 돌아왔는데 동료가 언짢은 표정으로 여러분의 일을 기꺼이 맡았다고 말할 때도 아마 마찬가지일 것이다."}, {"en": "You might not believe that they enjoyed replacing you while you were gone.", "ko": "여러분은 아마 여러분이 없는 동안 그들이 여러분을 대신하는 것을 즐겼다는 말을 믿지 않을 것이다."}]}, {"label": "26년 10월 31번 행동의 자동화와 기본 설정", "sents": [{"en": "A person who lives eighty years lives some twenty-nine thousand days, and the overwhelming majority of the behaviour packed into them runs on settings laid down, most of them, decades earlier and rarely inspected since.", "ko": "80년을 사는 사람은 약 2만 9천 일을 살고, 그 날들에 빽빽이 들어 있는 행동의 압도적 다수는 대부분 수십 년 전에 정해진 뒤 거의 점검되지 않은 설정에 따라 움직인다."}, {"en": "This need not be a hopeless thought.", "ko": "이것이 꼭 절망적인 생각일 필요는 없다."}, {"en": "In one light it is a triumph of engineering.", "ko": "어떤 관점에서 보면 그것은 설계의 승리이다."}, {"en": "If you had to consciously decide every footstep and every fork-grip and every word, you would never make it out of bed; the deliberate mind is far too slow and too costly to run a whole life in real time, and any creature that tried would be outcompeted by a creature that didn’t.", "ko": "만약 여러분이 발걸음 하나, 포크 쥐는 동작 하나, 말 한마디까지 모두 의식적으로 결정해야 한다면 침대에서 결코 나오지 못할 것이다. 신중한 사고는 삶 전체를 실시간으로 운영하기에는 너무 느리고 대가가 크며, 그렇게 하려는 생명체는 그러지 않는 생명체에게 경쟁에서 질 것이기 때문이다."}, {"en": "The automation is precisely what frees the captain to come up on deck for the few problems that actually require him.", "ko": "자동화는 바로 선장이 자신을 정말로 필요로 하는 몇 안 되는 문제를 위해 갑판 위로 올라올 수 있게 풀어 주는 것이다."}, {"en": "The default is not a flaw in the human design.", "ko": "기본 설정은 인간 설계의 결함이 아니다."}, {"en": "It is arguably the central feature, the thing that makes a complex life affordable at all.", "ko": "그것은 거의 틀림없이 핵심적인 특징, 즉 복잡한 삶을 조금이라도 감당할 수 있게 해 주는 것이다."}]}, {"label": "26년 10월 32번 대중문화와 법원의 역할", "sents": [{"en": "If we understand mass culture as a weakening factor of the cultural ties that unite people to their traditions, mass culture weakens the intermediary institutions in society (e.g. the family or the school), diminishing their role and overlapping these institutions.", "ko": "대중문화를 사람들을 전통에 묶어 주는 문화적 유대를 약하게 만드는 요인으로 이해한다면, 대중문화는 사회 속 매개 제도(예: 가족이나 학교)를 약화시켜 그 역할을 줄이고 이 제도들과 겹친다."}, {"en": "For example, courts are traditional social institutions and important for the normal and harmonious functioning of collective life.", "ko": "예를 들어, 법원은 전통적인 사회 제도이며 공동생활이 정상적이고 조화롭게 돌아가는 데 중요하다."}, {"en": "However, when people turn to social networks to put pressure on judicial decisions in certain mediated and politicized processes, this practice is popularized and becomes a habitual form of culture, which is harmful.", "ko": "그러나 어떤 조정되고 정치화된 과정에서 사람들이 사법적 판결에 압력을 가하려고 소셜 네트워크에 의지하면, 이러한 관행이 대중화되어 습관적인 문화의 한 형태가 되는데, 이는 해롭다."}, {"en": "Justice must not be done in the public square, which today is converted into a virtual dimension, the social networks.", "ko": "재판은 대중 광장에서 이루어져서는 안 되는데, 오늘날 그 광장은 가상의 차원, 즉 소셜 네트워크로 바뀌어 있다."}, {"en": "In a democratic state of law, the appropriate place to judge and make justice is the court and in a way that is immune to popular pressure.", "ko": "민주적인 법치 국가에서 재판하고 정의를 실현하기에 알맞은 곳은 법원이며, 그것도 대중의 압력에 흔들리지 않는 방식이어야 한다."}]}, {"label": "26년 10월 33번 가소성과 평생 발달", "sents": [{"en": "Human development is now increasingly understood as an ongoing, flexible, and evolving process rather than a fixed sequence of stages.", "ko": "인간 발달은 오늘날 고정된 순서의 단계라기보다는 계속 진행되고, 유연하며, 서서히 발전하는 과정으로 점점 더 이해되고 있다."}, {"en": "At the core of this perspective lies the concept of plasticity.", "ko": "이러한 관점의 핵심에는 가소성이라는 개념이 있다."}, {"en": "Plasticity refers to the human capacity to change, adapt, and reorganize cognitive, emotional, and behavioural patterns in response to life experiences, environmental demands, and biological changes.", "ko": "가소성은 삶의 경험, 환경적 요구, 생물학적 변화에 반응하여 인지적·정서적·행동적 패턴을 바꾸고, 적응시키고, 재구성하는 인간의 능력을 가리킨다."}, {"en": "It highlights that individuals are not merely passive recipients of development but active agents capable of growth throughout their lives.", "ko": "그것은 개인이 단순히 발달을 수동적으로 받아들이는 존재가 아니라 평생에 걸쳐 성장할 수 있는 능동적인 주체라는 점을 강조한다."}, {"en": "In earlier views, development was believed to occur mainly during childhood, with adulthood seen as a period of stability and old age as a phase of decline.", "ko": "이전의 관점에서는 발달이 주로 아동기에 일어난다고 믿어졌고, 성인기는 안정의 시기로, 노년기는 쇠퇴의 단계로 여겨졌다."}, {"en": "The concept of plasticity challenges this rigid outlook by emphasizing that development continues across the entire lifespan.", "ko": "가소성의 개념은 발달이 전 생애에 걸쳐 계속된다는 점을 강조함으로써 이러한 경직된 사고방식에 이의를 제기한다."}, {"en": "Although the extent of change may vary at different stages, every phase of life allows room for adaptation and transformation.", "ko": "비록 변화의 정도는 단계마다 다를 수 있지만, 삶의 모든 단계는 적응과 변화의 여지를 허용한다."}]}, {"label": "26년 10월 34번 상호 연결성과 새로운 취약성", "sents": [{"en": "Social media has altered business, politics, and friendships, making going viral a household term.", "ko": "소셜 미디어는 비즈니스, 정치, 친구 관계를 바꾸어 놓았고, '입소문이 나다(going viral)'를 일상적인 용어로 만들었다."}, {"en": "The global financial industry links every bank and countless households in every country, making us vulnerable to human error taking place on the other side of the world.", "ko": "세계 금융 산업은 모든 나라의 모든 은행과 수많은 가정을 연결하여, 우리를 세계 반대편에서 일어나는 인간의 실수에 취약하게 만든다."}, {"en": "As Columbia University strategy professor Rita McGrath explains, years ago most of our institutions were separate and thereby buffered from the effects of errors outside their walls.", "ko": "Columbia University 전략학 교수 Rita McGrath가 설명하듯이, 수년 전에는 우리 기관들 대부분이 분리되어 있었고, 그 덕분에 자신의 울타리 밖에서 일어난 오류의 영향으로부터 보호되었다."}, {"en": "That is no longer the case.", "ko": "이제는 더 이상 그렇지 않다."}, {"en": "The digitization of massive amounts of information has continued to grow enormously as the cost of computing power has decreased.", "ko": "컴퓨팅 능력의 비용이 줄어들면서 방대한 양의 정보의 디지털화는 계속해서 엄청나게 늘어났다."}, {"en": "The development of smart systems that communicate autonomously gave rise to an infinite variety of potential breakdowns.", "ko": "자율적으로 소통하는 스마트 시스템의 발달은 무한히 다양한 잠재적 고장을 낳았다."}, {"en": "This interdependence is a breeding ground for complex failure.", "ko": "이러한 상호 의존성은 복합적인 실패의 온상이다."}, {"en": "As Rita puts it, when “things that used to be kept separate bump up against each other, it becomes far more difficult to predict what’s going to happen next.”", "ko": "Rita가 말하듯이, '분리되어 있던 것들이 서로 부딪치게 되면, 다음에 무슨 일이 일어날지 예측하기가 훨씬 더 어려워진다.'"}, {"en": "Information technology creates new vulnerabilities because interconnectedness instantly spreads the impact of small failures.", "ko": "정보 기술은 새로운 취약성을 만들어 내는데, 상호 연결성이 작은 실패의 영향을 즉시 퍼뜨리기 때문이다."}]}, {"label": "26년 10월 36번 우리는 사용자가 아니다", "sents": [{"en": "A simple truth that designers must embrace in order to create more effective products and experiences is the fact that we are not the user.", "ko": "디자이너가 더 효과적인 제품과 경험을 만들기 위해 받아들여야 하는 단순한 진리는 우리가 사용자가 아니라는 사실이다."}, {"en": "We’re much too close to what we build to objectively see it and understand how users will interact with it.", "ko": "우리는 우리가 만드는 것에 너무 가까이 있어서 그것을 객관적으로 보고 사용자가 그것과 어떻게 상호 작용할지 이해할 수 없다."}, {"en": "The best user interfaces are those that have been shaped by observations of real users and their interactions with them.", "ko": "가장 좋은 사용자 인터페이스는 실제 사용자와 그들이 인터페이스와 상호 작용하는 모습을 관찰한 결과로 만들어져 온 것들이다."}, {"en": "So how can designers shape their work to be more effective?", "ko": "그렇다면 디자이너는 어떻게 자신의 작업을 더 효과적으로 만들 수 있을까?"}, {"en": "An incredibly effective way is with usability testing.", "ko": "엄청나게 효과적인 한 가지 방법은 사용성 테스트를 활용하는 것이다."}, {"en": "The goal of this method is to uncover problems in a design, discover existing opportunities, and learn more about the behaviors and preferences of users by asking participants to engage in realistic activities.", "ko": "이 방법의 목표는 참가자에게 실제와 같은 활동을 하도록 요청하여, 디자인의 문제를 밝혀내고, 이미 있는 기회를 발견하며, 사용자의 행동과 선호에 대해 더 많이 알아내는 것이다."}, {"en": "This technique is effective for understanding how well a design will perform once it is in the hands of real users.", "ko": "이 기법은 디자인이 실제 사용자의 손에 들어갔을 때 얼마나 잘 작동할지 이해하는 데 효과적이다."}, {"en": "Designers can use this method to improve their work through subsequent revisions based on the findings from representative users.", "ko": "디자이너는 대표 사용자에게서 얻은 결과를 바탕으로 이후 수정을 거쳐 자신의 작업을 개선하는 데 이 방법을 사용할 수 있다."}]}, {"label": "26년 10월 37번 재평가와 감정 조절", "sents": [{"en": "Reappraisal—changing the way one thinks about emotional situations—might present a particularly effective avenue to regulating emotions because it transforms emotions at their root.", "ko": "재평가, 즉 감정적인 상황에 대해 생각하는 방식을 바꾸는 것은 감정을 근본부터 바꾸기 때문에 감정을 조절하는 데 특히 효과적인 방법이 될 수 있다."}, {"en": "Take, for example, someone who is going through a divorce.", "ko": "예를 들어, 이혼을 겪고 있는 사람을 생각해 보자."}, {"en": "This is often an adverse event, and yet, it can be construed in different ways.", "ko": "이것은 보통 부정적인 사건이지만, 그럼에도 서로 다른 방식으로 해석될 수 있다."}, {"en": "One might view it as an overpowering loss that will mark one’s family for life.", "ko": "어떤 사람은 그것을 가족에게 평생 흔적을 남길 압도적인 상실로 볼 수 있다."}, {"en": "Alternatively, one might see it as something that is painful but that might lead to positive outcomes in the long run, such as improved relationships.", "ko": "이와 달리, 어떤 사람은 그것을 고통스럽지만 장기적으로는 더 나아진 관계 같은 긍정적인 결과로 이어질 수 있는 일로 볼 수도 있다."}, {"en": "As a result of these different construals, one might feel different emotions.", "ko": "이렇게 서로 다른 해석의 결과로, 사람은 서로 다른 감정을 느낄 수 있다."}, {"en": "The first construal may bring intense sadness and anger.", "ko": "첫 번째 해석은 강렬한 슬픔과 분노를 가져올 수 있다."}, {"en": "The second construal might also bring sadness and anger but perhaps at lower levels.", "ko": "두 번째 해석 역시 슬픔과 분노를 가져올 수 있지만, 아마도 더 낮은 강도일 것이다."}, {"en": "Crucially, it might also bring some positive emotions, such as hope, strength, or gratitude.", "ko": "결정적으로, 그것은 희망, 강인함, 감사 같은 긍정적인 감정도 가져올 수 있다."}, {"en": "This example illustrates how reappraisal might powerfully transform short-term emotional responses.", "ko": "이 예시는 재평가가 단기적인 감정 반응을 어떻게 강력하게 바꿀 수 있는지 보여 준다."}, {"en": "When repeated over time, these short-term emotional consequences of reappraisal might accumulate to shape people’s psychological health.", "ko": "오랜 시간 반복되면, 재평가가 낳은 이러한 단기적인 감정의 결과가 쌓여 사람들의 심리적 건강을 형성할 수 있다."}, {"en": "Thereby, reappraisal might be a key to resilience.", "ko": "그렇게 함으로써, 재평가는 회복 탄력성의 열쇠가 될 수 있다."}]}, {"label": "26년 10월 38번 수질과 용도별 안전 기준", "sents": [{"en": "When we say that water is “clean,” we don’t just mean that it looks like a glass of water.", "ko": "우리가 물이 '깨끗하다'고 말할 때, 그것이 마실 물 한 잔처럼 보인다는 것만을 뜻하는 것은 아니다."}, {"en": "Water quality is about following a certain set of criteria, or “benchmarks.”", "ko": "수질은 특정한 기준의 집합, 즉 '지표'를 따르는 것에 관한 것이다."}, {"en": "These guidelines inform us exactly how much physical, chemical, or biological stuff can be in the water.", "ko": "이러한 지침은 정확히 얼마만큼의 물리적, 화학적, 생물학적 물질이 물속에 있어도 되는지를 알려 준다."}, {"en": "These rules ensure the water is safe for anything we want to do with it, whether that’s drinking it at home, watering crops on a farm, or running it through a huge industrial boiler.", "ko": "이러한 규칙은 우리가 물로 하려는 일이 집에서 마시는 것이든, 농장에서 작물에 물을 주는 것이든, 거대한 산업용 보일러에 흘려보내는 것이든, 그 물이 그 일에 안전하도록 보장한다."}, {"en": "We can’t utilize the same “one size fits all” rule for everyone because we use water for so many diverse things.", "ko": "우리는 물을 아주 다양한 일에 사용하기 때문에 모두에게 똑같은 '일률적인' 규칙을 쓸 수 없다."}, {"en": "For instance, the water that cools down a huge power plant generator doesn’t need to be as clean as the water you drink from the kitchen tap.", "ko": "예를 들어, 거대한 발전소의 발전기를 식히는 물은 여러분이 주방 수도꼭지에서 받아 마시는 물만큼 깨끗할 필요는 없다."}, {"en": "This is why groups set different “safety limits” for the water dependent on how it will be utilized.", "ko": "이것이 바로 여러 집단이 물이 어떻게 쓰일지에 따라 서로 다른 '안전 허용치'를 정하는 이유이다."}]}, {"label": "26년 10월 39번 사회사학자의 사료 읽기", "sents": [{"en": "Like all historians, social historians draw from a variety of primary sources.", "ko": "모든 역사학자와 마찬가지로, 사회사학자도 다양한 1차 자료를 활용한다."}, {"en": "Social history often emphasizes ordinary people rather than elites.", "ko": "사회사는 흔히 엘리트보다 평범한 사람들을 강조한다."}, {"en": "Yet, in most places and times, nonelites lacked access to education and, thus, did not produce substantial amounts of documentation.", "ko": "하지만 대부분의 지역과 시대에서 엘리트가 아닌 사람들은 교육을 받을 기회가 부족했고, 그래서 많은 양의 문서 기록을 남기지 못했다."}, {"en": "Even when they did produce documentation, these materials rarely ended up in archives where they could be preserved and made available to researchers.", "ko": "그들이 문서 기록을 남겼을 때조차, 이러한 자료들은 보존되어 연구자들이 이용할 수 있게 되는 기록 보관소에 거의 들어가지 못했다."}, {"en": "Because of such biases in the historical record, social historians have to be very creative in their work.", "ko": "역사 기록의 이러한 편향 때문에, 사회사학자는 자신의 작업에서 매우 창의적이어야 한다."}, {"en": "Like other historians, social historians analyze textual sources produced by government officials, employers, and other elites.", "ko": "다른 역사학자들처럼 사회사학자도 정부 관료, 고용주, 그 밖의 엘리트들이 만든 문서 자료를 분석한다."}, {"en": "Yet rather than simply take such sources at face value, they read them “against the grain”.", "ko": "하지만 그들은 그러한 자료를 단순히 액면 그대로 받아들이기보다는 '일반적인 방식과 다르게' 읽는다."}, {"en": "So, for example, a social historian will read legal documents not only for the “facts” provided by slaveowners; she will also examine the silences, interruptions, rumors, and other details that offer hints about the enslaved peoples’ attitudes and actions.", "ko": "그래서 예를 들어, 사회사학자는 법률 문서를 노예 소유주가 제공한 '사실'만을 얻으려고 읽는 것이 아니라, 노예가 된 사람들의 태도와 행동에 대한 힌트를 주는 침묵, 중단, 소문, 그 밖의 세부 사항도 살펴볼 것이다."}]}, {"label": "26년 10월 40번 돌고래의 병렬 처리 청각 피질", "sents": [{"en": "Dolphins’ brains have evolved specialized areas dedicated to echolocation, allowing them to process acoustic information more quickly and with less energy.", "ko": "돌고래의 뇌는 반향 정위에 쓰이는 특화된 구역을 진화시켰고, 이것은 그들이 음향 정보를 더 빠르고 더 적은 에너지로 처리할 수 있게 해 준다."}, {"en": "One key adaptation is the structure of the dolphin’s auditory pathway.", "ko": "한 가지 핵심적인 적응은 돌고래의 청각 경로의 구조이다."}, {"en": "The signals from the ears are rapidly transmitted to the auditory cortex, the brain region responsible for processing sound.", "ko": "귀에서 온 신호는 소리 처리를 담당하는 뇌 영역인 청각 피질로 빠르게 전달된다."}, {"en": "However, unlike many other mammals, dolphins have a highly specialized auditory cortex with distinct areas dedicated to processing different aspects of echolocation signals.", "ko": "그러나 다른 많은 포유류와 달리, 돌고래는 반향 정위 신호의 서로 다른 측면을 처리하는 개별 구역을 가진 고도로 특화된 청각 피질을 가지고 있다."}, {"en": "Some areas may be responsible for analyzing the timing of echoes, while others focus on the frequency content or the intensity of the sound.", "ko": "어떤 구역은 반사음의 타이밍 분석을 담당하고, 다른 구역은 소리의 주파수 성분이나 강도에 집중한다."}, {"en": "This specialization allows the dolphin’s brain to process echo information in parallel, rather than sequentially.", "ko": "이러한 특화 덕분에 돌고래의 뇌는 반사음 정보를 순차적으로가 아니라 병렬로 처리할 수 있다."}, {"en": "Imagine a factory assembly line, where different workers are responsible for different tasks.", "ko": "서로 다른 노동자들이 서로 다른 일을 맡는 공장 조립 라인을 떠올려 보라."}, {"en": "By dividing the work among specialized areas, the brain can process information much faster and more efficiently.", "ko": "특화된 구역들에 일을 나누어 줌으로써, 뇌는 정보를 훨씬 더 빠르고 효율적으로 처리할 수 있다."}, {"en": "This parallel processing reduces the cognitive load associated with echolocation, allowing dolphins to react quickly to changes in their environment.", "ko": "이러한 병렬 처리는 반향 정위에 따르는 인지 부담을 줄여 주어, 돌고래가 환경의 변화에 빠르게 반응할 수 있게 해 준다."}]}, {"label": "26년 10월 41~42번 무료함은 자기 성찰의 기회", "sents": [{"en": "It is crucial to recognize that boredom can give rise to harmful emotions such as depression, despair, and irritation if not adequately addressed.", "ko": "무료함이 적절히 다뤄지지 않으면 우울, 절망, 짜증 같은 해로운 감정을 일으킬 수 있다는 것을 인식하는 것이 중요하다."}, {"en": "When we believe that the only way to be happy is by searching for fun activities, then we become dependent on those activities, and negative thoughts and emotions arise.", "ko": "행복해지는 유일한 방법이 재미있는 활동을 찾는 것이라고 믿으면, 우리는 그 활동에 의존하게 되고 부정적인 생각과 감정이 생긴다."}, {"en": "It is suggested that ‘Idle time is the devil’s workshop’ implies that those with too much time on their hands may fill that time with troubling thoughts and behavior.", "ko": "'아무것도 안 하는 시간은 악마의 작업장'이라는 말은 손에 시간이 너무 많은 사람들이 그 시간을 문제를 일으키는 생각과 행동으로 채울 수 있다는 것을 암시한다고 한다."}, {"en": "The balance is to not see it as idle time, wasted time, or boredom but rather as a perfect time for self-improvement, self-identification, and positive reflection time.", "ko": "균형점은 그것을 아무것도 안 하는 시간, 낭비된 시간, 또는 무료함으로 보지 않고, 오히려 자기 개선, 자기 발견, 긍정적인 성찰을 위한 완벽한 시간으로 보는 것이다."}, {"en": "Reflecting, just how lucky are we to be bored?", "ko": "곰곰이 생각해 보면, 우리가 무료할 수 있다는 것은 얼마나 운이 좋은 일인가?"}, {"en": "Boredom doesn’t exist in the presence of danger, as it is only an indulgence pastime in a safe zone.", "ko": "무료함은 위험이 있는 곳에서는 존재하지 않는데, 그것은 안전지대에서만 누리는 탐닉의 오락이기 때문이다."}, {"en": "Boredom can be perceived as a luxury that typically manifests in safe and inactive situations, providing an occasion to appreciate and comprehend the environment.", "ko": "무료함은 보통 안전하고 할 일 없는 상황에서 나타나는 사치로 여겨질 수 있으며, 주변 환경을 인식하고 이해할 기회를 준다."}, {"en": "In hazardous circumstances, the luxury of boredom is unavailable.", "ko": "위험한 상황에서는 무료함이라는 사치를 누릴 수 없다."}, {"en": "Thus, it is paramount to utilize idle moments for profound self-reflection.", "ko": "따라서 아무것도 안 하는 순간을 깊은 자기 성찰에 활용하는 것이 가장 중요하다."}, {"en": "It represents an occasion to listen, observe, and appreciate before expressing.", "ko": "그것은 표현하기 전에 듣고, 관찰하고, 인식할 기회를 의미한다."}, {"en": "Rather than viewing boredom as unproductive, it should be regarded as an opportunity for personal development and constructive contemplation.", "ko": "무료함을 비생산적인 것으로 보기보다는, 개인적 성장과 건설적인 사색의 기회로 여겨야 한다."}]}], "items": [{"id": "mock_2610_g2_a:in-mock_2610_g2_a-01", "p": 0, "s": 5, "pos": [2, 3, 4, 5, 7], "cue": ["This price(이 가격) = 바로 앞 문장의 money has to have a price(돈에는 가격이 있어야 함)", "the value of time(시간의 가치)가 앞의 the longer the term(기간이 길수록)·wait(기다림)을 한 말로 정리", "바로 뒤 문장의 To put it another way(달리 말하면)의 속담 a bird in the hand(손 안의 새 한 마리)가 이 문장을 바꿔 말함"], "trap": [[4, "The longer the term(기간이 길수록) 문장 뒤도 '기다림' 얘기라 끌리지만 This price(이 가격)가 가리킬 '돈의 가격'이 그다음 문장에서야 처음 나옴"], [2, "interest rate(이자율) 뒤라 가격처럼 보이지만 This rate(이 이자율)가 interest rate(이자율)를 바로 받아야 하고 price(가격)라는 말도 아직 없음"]], "var": {"en": "Such a price takes into account the value of time.", "ko": "그런 가격은 시간의 가치를 고려한다.", "chg": "This price(이 가격) → Such a price(그런 가격), factors in(계산에 넣다) → takes into account(고려하다)", "note": "말이 바뀌어도 바로 앞 문장의 '돈의 가격' 바로 뒤
