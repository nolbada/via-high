</style></head><body class="notranslate"><div class="wrap" id="app"></div><script id="data" type="application/json">{"title": "교과서 4과 삽입 다지기", "sub": "영어II 4과 · 11문제", "key": "cheongseok-go2:in:L4", "pass": [{"label": "4과 ① 고장 난 노트북, 버려야 할까?", "sents": [{"en": "On her way to a study group meeting, Liz accidentally dropped her laptop on the street, seriously damaging it.", "ko": "스터디 그룹 모임에 가는 길에 Liz는 실수로 노트북을 길에 떨어뜨려 심하게 망가뜨렸다."}, {"en": "Although it still turns on, the screen is cracked, and some keys are not working.", "ko": "노트북은 여전히 켜지기는 하지만, 화면은 금이 갔고 몇몇 키는 작동하지 않는다."}, {"en": "She can have it repaired, but she is hesitating to do so.", "ko": "그녀는 그것을 수리할 수 있지만, 그렇게 하기를 망설이고 있다."}, {"en": "Sometimes repairs are expensive, and they often take a long time.", "ko": "수리는 때때로 비용이 많이 들고, 종종 오랜 시간이 걸린다."}, {"en": "Besides, the laptop is about five years old.", "ko": "게다가 그 노트북은 5년 정도 되었다."}, {"en": "In this case, getting rid of the old one and purchasing a new one might seem like a more reasonable option.", "ko": "이런 경우라면 오래된 노트북은 버리고 새것을 사는 것이 더 합리적인 선택처럼 보일 수 있다."}, {"en": "In reality, however, it may not be the best thing to do.", "ko": "하지만 실제로는 그것이 최선이 아닐 수도 있다."}, {"en": "If Liz throws her laptop in the trash, she will be contributing to a serious problem: e-waste.", "ko": "만약 Liz가 노트북을 쓰레기통에 버린다면, 그녀는 전자 쓰레기라는 심각한 문제에 일조하게 될 것이다."}]}, {"label": "4과 ② 전자 쓰레기와 수리가 어려운 이유", "sents": [{"en": "What exactly is e-waste?", "ko": "전자 쓰레기란 정확히 무엇인가?"}, {"en": "The term refers to discarded electronic devices and electrical appliances.", "ko": "이 용어는 버려진 전자 장치와 전기 기기를 가리킨다."}, {"en": "Due to toxic materials contained in these products, such as lead, e-waste is a serious health and environmental hazard.", "ko": "이 제품들에 들어 있는 납 같은 유독성 물질 때문에 전자 쓰레기는 심각한 건강·환경 위험 요소이다."}, {"en": "To make matters worse, the amount of e-waste produced each year is increasing at an alarming rate.", "ko": "설상가상으로 매년 생산되는 전자 쓰레기의 양이 걱정스러운 속도로 늘고 있다."}, {"en": "In 2021, a total of 57.4 million metric tons of e-waste was generated worldwide, which was a 37% increase from 2014, the year when data about e-waste was first collected.", "ko": "2021년 전 세계적으로 총 5,740만 메트릭톤의 전자 쓰레기가 발생했는데, 이는 전자 쓰레기 자료가 처음 수집된 해인 2014년보다 37% 증가한 것이었다."}, {"en": "Experts predict that by 2030, the amount of e-waste generated annually will have doubled in just 16 years.", "ko": "전문가들은 2030년이 되면 매년 발생하는 전자 쓰레기의 양이 불과 16년 만에 두 배가 될 것으로 예측한다."}, {"en": "For this reason, efforts are being made to address this problem, most of which are focused on making products easier to repair.", "ko": "이런 이유로 이 문제를 해결하려는 노력이 이루어지고 있는데, 그 대부분은 제품을 더 수리하기 쉽게 만드는 데 초점을 두고 있다."}, {"en": "Let's take a look at some practical approaches from around the world.", "ko": "전 세계의 몇 가지 현실적인 접근법을 살펴보자."}, {"en": "One reason many people dispose of their damaged devices is that they are too difficult to repair.", "ko": "많은 사람이 고장 난 장치를 버리는 한 가지 이유는 그것들이 수리하기 너무 어렵기 때문이다."}, {"en": "For example, a device may be difficult to disassemble, or its manufacturer may require that it be brought to an official service center to be fixed.", "ko": "예를 들어 어떤 장치는 분해하기 어렵거나, 제조사가 수리하려면 공식 서비스 센터로 가져오라고 요구할 수도 있다."}]}, {"label": "4과 ③ 수리할 권리 운동과 네 가지 요구", "sents": [{"en": "Many companies do not allow their customers to take their damaged items to third-party repair shops.", "ko": "많은 회사는 고객이 고장 난 물건을 제삼자 수리점에 가져가는 것을 허용하지 않는다."}, {"en": "What is more, some products are intentionally designed to be difficult to repair.", "ko": "게다가 어떤 제품들은 일부러 수리하기 어렵게 설계된다."}, {"en": "It is common for consumers to be unable to acquire the instructions for how to fix their items or the parts needed to complete repairs.", "ko": "소비자들이 물건 고치는 방법에 대한 설명서나 수리에 필요한 부품을 구하지 못하는 것은 흔한 일이다."}, {"en": "The right-to-repair movement is trying to solve these problems by promoting legislation that states the following: If you own a product, you have the right to fix it yourself or bring it to a technician of your choice.", "ko": "수리할 권리 운동은 다음 내용을 담은 법 제정을 추진해 이 문제들을 해결하려 한다: 제품을 소유하고 있다면 직접 고치거나 원하는 기술자에게 가져갈 권리가 있다."}, {"en": "To protect the rights of consumers, the right-to-repair movement demands four things.", "ko": "소비자의 권리를 보호하기 위해 수리할 권리 운동은 네 가지를 요구한다."}, {"en": "First, companies must make information about their products available to everyone.", "ko": "첫째, 회사들은 자기 제품에 대한 정보를 모든 사람이 이용할 수 있게 해야 한다."}, {"en": "Second, third parties, including individuals, should be able to obtain the parts and tools required to make repairs.", "ko": "둘째, 개인을 포함한 제삼자도 수리에 필요한 부품과 도구를 구할 수 있어야 한다."}, {"en": "Third, the practice of preventing consumers from installing custom software on their own devices should be prohibited by law.", "ko": "셋째, 소비자가 자기 기기에 맞춤형 소프트웨어를 설치하지 못하게 막는 관행은 법으로 금지되어야 한다."}, {"en": "Finally, it demands that manufacturers design devices in a way that makes repairs as easy as possible.", "ko": "마지막으로, 이 운동은 제조사들이 수리를 최대한 쉽게 하는 방식으로 기기를 설계할 것을 요구한다."}, {"en": "Advocates of the movement say that if all these goals are accomplished, far less e-waste will be generated.", "ko": "이 운동의 지지자들은 이 모든 목표가 이루어지면 전자 쓰레기가 훨씬 덜 발생할 것이라고 말한다."}, {"en": "Thanks to their efforts, more than 40 states in the U.S. have begun working on right-to-repair legislation.", "ko": "그들의 노력 덕분에 미국의 40개가 넘는 주가 수리할 권리 법 제정 작업을 시작했다."}, {"en": "This movement is gaining a growing influence in Europe as well, with more and more countries joining the cause.", "ko": "이 운동은 점점 더 많은 나라가 그 대의에 동참하면서 유럽에서도 영향력을 키우고 있다."}]}, {"label": "4과 ④ 프랑스의 수리 가능성 지수", "sents": [{"en": "In January 2021, the French government passed a bill that requires that every manufacturer include a “repairability index” on five categories of electronic devices and electrical appliances: smartphones, laptops, washing machines, televisions, and lawn mowers.", "ko": "2021년 1월 프랑스 정부는 모든 제조사가 스마트폰, 노트북, 세탁기, 텔레비전, 잔디 깎는 기계의 다섯 가지 전자·전기 제품에 '수리 가능성 지수'를 표시하도록 하는 법안을 통과시켰다."}, {"en": "Using a score ranging from 0 to 10, as well as a color-coded system, the index lets consumers see how easily the product can be repaired before they purchase it.", "ko": "이 지수는 0에서 10까지의 점수와 색깔 표시 체계를 사용해 소비자가 제품을 사기 전에 얼마나 쉽게 수리할 수 있는지 알 수 있게 해 준다."}, {"en": "The index takes into account several elements, including the availability of repair information, the ease of disassembly, and the price of spare parts.", "ko": "이 지수는 수리 정보를 구할 수 있는지, 분해가 쉬운지, 여분 부품 가격 등 여러 요소를 고려한다."}, {"en": "A low number on a bright red label means that repairing the product will be difficult, whereas a high number on a green label indicates that the product is easy to repair.", "ko": "밝은 빨간색 라벨의 낮은 숫자는 수리가 어렵다는 뜻이고, 초록색 라벨의 높은 숫자는 수리가 쉽다는 뜻이다."}, {"en": "The index was designed to have two positive effects.", "ko": "이 지수는 두 가지 긍정적인 효과를 내도록 만들어졌다."}, {"en": "Firstly, it allows consumers to make informed decisions when purchasing new devices and appliances.", "ko": "첫째, 이 지수는 소비자가 새 기기를 살 때 정보에 근거한 결정을 내릴 수 있게 해 준다."}, {"en": "Secondly, it encourages manufacturers to make their products easier to repair.", "ko": "둘째, 이 지수는 제조사가 제품을 더 수리하기 쉽게 만들도록 장려한다."}, {"en": "As a result, with fewer electronic and electrical items ending up in its landfills, France can expect to make a transition to a more sustainable society in the near future.", "ko": "그 결과 쓰레기 매립지로 가는 전자·전기 제품이 줄어들면서 프랑스는 가까운 미래에 더 지속 가능한 사회로 바뀔 것을 기대할 수 있다."}, {"en": "The impact of the index, however, is likely to spread far beyond France.", "ko": "하지만 이 지수의 영향은 프랑스를 훨씬 넘어 퍼질 가능성이 높다."}, {"en": "We live in a global economy, and any company that wants to sell its appliances on the French market will need to label its products according to the repairability index.", "ko": "우리는 세계 경제 속에 살고 있어서, 프랑스 시장에서 기기를 팔고 싶은 회사라면 어디든 수리 가능성 지수에 따라 제품에 라벨을 붙여야 할 것이다."}, {"en": "If the index is successful, we can anticipate seeing more countries around the world following France’s innovative lead.", "ko": "이 지수가 성공한다면, 전 세계의 더 많은 나라가 프랑스의 혁신적인 선례를 따르는 것을 기대할 수 있다."}]}, {"label": "4과 ⑤ 수리 카페의 시작과 확산", "sents": [{"en": "When consumers are given the right tools and materials, along with some helpful advice, they can repair much of the damage that occurs to electronic products by themselves.", "ko": "소비자에게 알맞은 도구와 재료, 그리고 유용한 조언이 주어지면 그들은 전자 제품에 생기는 손상의 상당 부분을 스스로 고칠 수 있다."}, {"en": "That is why Repair Cafés were started.", "ko": "그래서 수리 카페가 시작되었다."}, {"en": "They are free meeting places where people can gather together and fix their broken devices.", "ko": "수리 카페는 사람들이 함께 모여 고장 난 기기를 고칠 수 있는 무료 모임 장소이다."}, {"en": "The cafés are staffed by volunteer experts who can give technical advice and teach people how to fix things.", "ko": "이 카페에는 기술적 조언을 해 주고 물건 고치는 법을 가르쳐 줄 수 있는 자원봉사 전문가들이 있다."}, {"en": "The first Repair Café was opened in the Netherlands in the city of Amsterdam in 2009.", "ko": "최초의 수리 카페는 2009년 네덜란드 암스테르담에서 문을 열었다."}, {"en": "It was such a success that the idea soon spread to neighboring countries.", "ko": "그것은 크게 성공해서 그 아이디어가 곧 이웃 나라들로 퍼졌다."}, {"en": "Before long, there were Repair Cafés in over 30 countries around the world.", "ko": "얼마 지나지 않아 전 세계 30개가 넘는 나라에 수리 카페가 생겼다."}, {"en": "Along with preventing damaged items from becoming e-waste, these cafés also encourage people to share their invaluable skills and knowledge about the repair and maintenance of electronics.", "ko": "이 카페들은 고장 난 물건이 전자 쓰레기가 되는 것을 막을 뿐 아니라, 사람들이 전자 제품 수리와 관리에 대한 소중한 기술과 지식을 나누도록 장려한다."}, {"en": "They continue to grow in popularity, with more and more people signing up to volunteer.", "ko": "자원봉사를 신청하는 사람이 점점 늘면서 이 카페들은 계속 인기를 얻고 있다."}, {"en": "By providing spaces where people can learn, Repair Cafés enable individuals to maintain their devices and extend their life spans.", "ko": "사람들이 배울 수 있는 공간을 제공함으로써 수리 카페는 개인이 자기 기기를 관리하고 수명을 늘릴 수 있게 한다."}, {"en": "Furthermore, they foster a sustainable perspective that can have a huge positive impact on our future.", "ko": "게다가 수리 카페는 우리의 미래에 엄청난 긍정적 영향을 줄 수 있는 지속 가능한 관점을 키워 준다."}]}, {"label": "4과 ⑥ 수리가 일상인 세상 상상하기", "sents": [{"en": "Do you remember Liz, the girl who dropped her laptop?", "ko": "노트북을 떨어뜨린 소녀 Liz를 기억하는가?"}, {"en": "Imagine she lived in a world where repairing damaged devices and appliances was simply part of everyday life.", "ko": "그녀가 손상된 기기를 수리하는 것이 그저 일상의 일부인 세상에 살고 있다고 상상해 보라."}, {"en": "If that were the case, her options wouldn’t be limited to paying for expensive repairs or throwing away her laptop and buying a new one.", "ko": "만약 그렇다면 그녀의 선택지는 비싼 수리비를 내거나 노트북을 버리고 새것을 사는 것으로 제한되지 않을 것이다."}, {"en": "She would be able to order the necessary parts online and replace them herself.", "ko": "그녀는 필요한 부품을 온라인으로 주문해 직접 교체할 수 있을 것이다."}, {"en": "Alternatively, she could bring her damaged device to the nearest Repair Café to get advice on how to fix it.", "ko": "아니면 고치는 방법에 대한 조언을 얻으러 가장 가까운 수리 카페에 고장 난 기기를 가져갈 수도 있을 것이다."}, {"en": "Repairing it probably wouldn’t be very hard, and she likely would have purchased a laptop with a high repairability score.", "ko": "노트북을 수리하는 것은 아마 그리 어렵지 않을 것이고, 그녀는 아마 수리 가능성 점수가 높은 노트북을 샀을 것이다."}, {"en": "In fact, this sustainable world is a future we can all enjoy if we work toward it together.", "ko": "사실 이 지속 가능한 세상은 우리가 함께 노력하면 모두가 누릴 수 있는 미래이다."}, {"en": "Even more importantly, it is a future in which people will generate far less e-waste, making our planet a cleaner, healthier place for everyone.", "ko": "더 중요한 것은 그것이 사람들이 전자 쓰레기를 훨씬 덜 만들어 지구를 모두에게 더 깨끗하고 건강한 곳으로 만드는 미래라는 점이다."}]}], "items": [{"id": "in-g2_L4-01", "p": 0, "s": 6, "pos": [1, 2, 5, 6, 8], "cue": ["however(그러나) → 앞 문장 might seem like a more reasonable option(더 합리적인 선택처럼 보일 수 있다)을 뒤집음", "In reality(실제로는) ↔ seem(~처럼 보이다), 겉보기와 실제의 대비", "it(그것) = getting rid of the old one and purchasing a new one(오래된 것을 버리고 새것을 사는 것)"], "trap": [[5, "‘5년쯤 됐다’ 뒤에 넣으면 it(그것)이 가리킬 ‘버리고 새로 사기’가 아직 안 나왔고, 뒤 문장 In this case(이 경우에)와도 순서가 꼬임"], [8, "맨 끝에 넣으면 e-waste(전자 쓰레기) 문제까지 이미 꺼낸 뒤라 however(그러나)로 뒤집을 ‘합리적으로 보이는 선택’과 떨어지고, 버리면 안 되는 이유가 나온 다음에 ‘최선이 아닐 수 있다’가 뒤늦게 나오는 꼴"]], "var": {"en": "In fact, however, it may not be the best thing to do.", "ko": "하지만 사실은 그것이 최선 function home(){var h='<h1>'+esc(D.title)+'</h1><div class="sub">'+esc(D.sub)+'</div>';
 IT.forEach(function(it,i){var s=st[it.id]||{};h+='<button class="row" onclick="op('+i+',1)"><b>'+esc(D.pass[it.p].label)+(IT.filter(function(x){return x.p==it.p}).length>1?' · '+(IT.slice(0,i+1).filter(function(x){return x.p==it.p}).length):'')+'</b><span class="st'+(s[1]?' on':'')+'">1단계</span><span class="st'+(s[2]?' on':'')+'">2단계</span></button>'});
 $('app').innerHTML=h;window.scrollTo(0,0)}
function op(i,l){cur=i;lv=l;pick=-1;done=false;draw();window.scrollTo(0,0)}
function draw(){var it=IT[cur],P=D.pass[it.p].sents,N=P.length,g=lv==1?{en:P[it.s].en,ko:P[it.s].ko}:{en:it['var'].en,ko:it['var'].ko};
 var h='<div class="top"><b>'+esc(D.pass[it.p].label)+'</b><button class="hb" onclick="home()">목록</button></div>';
 h+='<div class="seg"><button class="'+(lv==1?'on':'')+'" onclick="op('+cur+',1)">1단계 원문</button><button class="'+(lv==2?'on':'')+'" onclick="op('+cur+',2)">2단계 변형</button></div>';
 h+='<div class="giv"><small>주어진 문장</small><span lang="en" translate="no">'+esc(g.en)+'</span>'+(done?'<div class="ko">'+esc(g.ko)+'</div>':'')+'</div>';
 h+='<div class="ps" lang="en" translate="no">';
 for(var i=0;i<=N;i++){var k=it.pos.indexOf(i);
  if(k>=0){var cls='mk';if(done){if(i==it.s)cls+=' ok';else if(k==pick)cls+=' ng'}else if(k==pick)cls+=' sel';
   h+='<button class="'+cls+'" '+(done?'':'onclick="pk('+k+')"')+'>'+C[k]+'</button> ';
   if(done&&i==it.s)h+='<span class="ins">'+esc(g.en)+'</span> '}
  if(i<N&&i!=it.s)h+=esc(P[i].en)+' '}
 h+='</div>';
 if(!done)h+='<button class="go" '+(pick<0?'disabled':'')+' onclick="sub()">제출</button>';
 else{var ok=it.pos[pick]==it.s;h+='<div class="band '+(ok?'ok':'ng')+'">'+(ok?'정답 '+C[pick]:'오답 · 정답 '+C[it.pos.indexOf(it.s)])+'</div>';
  h+='<div class="exh">이 자리인 이유</div>';it.cue.forEach(function(c){h+='<div class="why">'+esc(c)+'</div>'});
  (it.trap||[]).forEach(function(t){var k=it.pos.indexOf(t[0]);if(k<0)return;h+='<div class="trap"><b>'+C[k]+'</b> '+esc(t[1])+'</div>'});
  if(lv==2)h+='<div class="chg"><b>바뀐 앞머리</b>'+esc(it['var'].chg)+(it['var'].note?'<div>'+esc(it['var'].note)+'</div>':'')+'</div>';
  if(it.fam)h+='<div class="post"><small>연결어 가족</small>'+esc(it.fam)+'</div>';
  if(it.post)h+='<div class="post"><small>흐름 기억</small>'+esc(it.post)+'</div>';
  h+='<button class="go" onclick="op('+cur+','+lv+')">다시 풀기</button>';
  if(lv==1)h+='<button class="go sec" onclick="op('+cur+',2)">2단계 변형 문장으로</button>';
  else if(cur+1<IT.length)h+='<button class="go sec" onclick="op('+(cur+1)+',1)">다음 문제</button>'}
 h+='<button class="go sec" onclick="home()">목록으로</button>';
 $('app').innerHTML=h}
function pk(k){pick=k;draw()}
function sub(){done=true;var it=IT[cur];if(it.pos[pick]==it.s){st[it.id]=st[it.id]||{};st[it.id][lv]=1;save()}draw()}
home();
</script><a href="../index.html" style="position:fixed;right:12px;bottom:12px;z-index:9999;background:#1d4ed8;color:#fff;font:700 13px/1 sans-serif;padding:11px 14px;border-radius:22px;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.3)">⌂ 목록</a></body></html>
