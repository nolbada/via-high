</style><link rel="icon" type="image/svg+xml" href="../icon.svg"><link rel="apple-touch-icon" href="../icon-180.png"><meta name="apple-mobile-web-app-title" content="청석고정답"></head><body><div class="wrap"><div class="top"><a class="back" href="../index.html">← 목록</a></div><h1 id="h"></h1><div class="sub">본문과 다른 문장을 찾아 눌러 보세요.</div><div class="how">문장을 누르면 본문 근거와 해설이 열려요. 본문과 다른 문장이면 초록색, 본문과 같은 내용이면 주황색으로 표시돼요. 맞는 문장도 눌러서 읽어 보면 본문이 더 잘 기억나요.</div><div class="nav" id="nav"></div><div id="root"></div><div class="foot">비타민 영어클리닉 · 청석고 영어II</div></div><script src="../parts.js?v=261019"></script><script src="../wrong.js?v=261019"></script><script>
var D={"n": "2", "title": "2과 Science Is for Everyone (과학은 모두를 위한 것)", "parts": [["❶", "본문 ❶"], ["❷", "본문 ❷"], ["❸", "본문 ❸"], ["❹", "본문 ❹"], ["❺", "본문 ❺"], ["❻", "본문 ❻"], ["❼", "본문 ❼"]], "groups": [{"part": "❶", "title": "과학은 과학자만의 것일까", "flow": "우리는 과학을 길고 흰 실험실 가운을 입은 과학자들만의 영역이라고 생각하기 쉬워요. 그 과학자들은 평범한 사람들과 공통점이 거의 없어 보여요.", "items": [{"en": "We may think of science as a field that belongs only to scientists in long, white lab coats.", "ans": "T", "ko": "우리는 과학을 길고 흰 실험실 가운을 입은 과학자들에게만 속한 분야라고 생각할 수 있다.", "eve": "When we think about science, we might consider it as a domain reserved exclusively for scientists in long, white lab coats who spend their days conducting experiments and analyzing data.", "evk": "과학에 대해서 생각할 때, 우리는 그것을 실험을 하고 데이터를 분석하는 데 나날을 보내는 길고 흰 실험실 가운을 입은 과학자들에게 독점적으로 지정된 영역이라고 생각할 수 있다.", "why": "**a domain reserved exclusively for scientists(과학자들에게만 독점적으로 정해진 영역)**을 'a field that belongs only to scientists(과학자들에게만 속한 분야)'로 바꿔 쓴 맞는 문장이에요. might consider it as(그것을 ~라고 생각할 수 있다)는 may think of ~ as와 같은 뜻이에요."}, {"en": "Scientists seem to have a lot in common with ordinary people like us.", "ans": "F", "ko": "과학자들은 우리 같은 평범한 사람들과 공통점이 많아 보인다.", "eve": "They seem to have very little in common with ordinary people like us.", "evk": "그들은 우리와 같은 평범한 사람들과 공통점이 거의 없는 것 같이 보인다.", "why": "본문은 **very little in common(공통점이 거의 없는)**이에요. 'a lot in common(공통점이 많은)'은 정반대예요. 우리가 흔히 갖는 생각을 말하는 문장이라서 이어지는 However(그러나)에서 뒤집힌답니다."}, {"en": "People may imagine that scientists spend their days doing experiments and analyzing data.", "ans": "T", "ko": "사람들은 과학자들이 실험을 하고 데이터를 분석하며 나날을 보낸다고 상상할 수 있다.", "eve": "When we think about science, we might consider it as a domain reserved exclusively for scientists in long, white lab coats who spend their days conducting experiments and analyzing data.", "evk": "과학에 대해서 생각할 때, 우리는 그것을 실험을 하고 데이터를 분석하는 데 나날을 보내는 길고 흰 실험실 가운을 입은 과학자들에게 독점적으로 지정된 영역이라고 생각할 수 있다.", "why": "**spend their days conducting experiments and analyzing data(실험을 하고 데이터를 분석하는 데 나날을 보내다)**와 같은 내용이에요. conducting experiments(실험을 하는 것)를 doing experiments로 쉽게 바꿔 썼어요."}]}, {"part": "❶", "title": "과학은 모두의 것이에요", "flow": "그러나 이런 생각은 사실과 거리가 멀어요. 과학은 모두의 것이고, 평범한 사람들도 시민 과학 프로젝트로 놀라운 업적에 기여해 왔어요. 글쓴이는 그중 두 가지를 소개해요.", "items": [{"en": "The writer says that the idea that science is only for scientists is far from the truth.", "ans": "T", "ko": "글쓴이는 과학이 과학자만을 위한 것이라는 생각이 사실과 거리가 멀다고 말한다.", "eve": "However, this perception is far from the truth.", "evk": "그러나 이러한 인식은 사실과 거리가 멀다.", "why": "**this perception is far from the truth(이러한 인식은 사실과 거리가 멀다)**와 같아요. perception(인식)을 the idea(생각)로, far from the truth를 그대로 썼어요. However(그러나) 뒤에서 앞의 통념을 뒤집는 부분이에요."}, {"en": "Only trained scientists have the ability to help science move forward.", "ans": "F", "ko": "훈련받은 과학자들만이 과학이 발전하도록 도울 능력이 있다.", "eve": "In reality, science belongs to everyone, and we all have the ability to play a role in the advancement of science.", "evk": "사실은, 과학은 모두의 것이며, 우리는 모두 과학의 발전에 일조할 수 있는 능력이 있다.", "why": "본문은 **we all have the ability to play a role in the advancement of science(우리는 모두 과학의 발전에 일조할 능력이 있다)**예요. 'Only trained scientists(훈련받은 과학자들만)'는 we all(우리 모두)과 맞지 않아요."}, {"en": "Ordinary people have contributed to remarkable scientific accomplishments through citizen science projects.", "ans": "T", "ko": "평범한 사람들은 시민 과학 프로젝트를 통해 놀라운 과학적 업적에 기여해 왔다.", "eve": "There have been numerous citizen science projects in which ordinary people have made contributions to remarkable scientific accomplishments.", "evk": "평범한 사람들이 놀라운 과학적 업적에 기여한 수많은 시민 과학 프로젝트들이 있었다.", "why": "**ordinary people have made contributions to remarkable scientific accomplishments(평범한 사람들이 놀라운 과학적 업적에 기여했다)**와 같아요. made contributions(기여했다)를 contributed로 한 단어로 바꿔 썼어요."}, {"en": "The writer is going to look at two citizen science projects.", "ans": "T", "ko": "글쓴이는 두 가지 시민 과학 프로젝트를 살펴볼 것이다.", "eve": "Let’s take a look at two of them.", "evk": "그중 두 가지를 살펴보자.", "why": "**Let's take a look at two of them(그 icated design with many advanced features.", "ans": "F", "ko": "Galaxy Zoo 웹사이트는 많은 고급 기능이 있는 복잡한 디자인이었다.", "eve": "The website was kept as simple as possible, with a very basic design and an easy-to-use interface.", "evk": "그 웹사이트는 매우 기본적인 디자인과 사용하기 쉬운 인터페이스로 최대한 단순하게 유지되었다.", "why": "본문은 **kept as simple as possible, with a very basic design and an easy-to-use interface(매우 기본적인 디자인과 쓰기 쉬운 인터페이스로 최대한 단순하게 유지되었다)**예요. 'complicated(복잡한)'는 simple(단순한)과 반대예요."}, {"en": "The simple website let people who wanted to take part get started quickly.", "ans": "T", "ko": "단순한 웹사이트 덕분에 참여하고 싶은 사람들이 빠르게 시작할 수 있었다.", "eve": "This allowed those who wanted to participate to get started quickly.", "evk": "이것은 참여하기를 원하는 사람들이 빠르게 시작할 수 있게 했다.", "why": "**This allowed those who wanted to participate to get started quickly(이것은 참여하기를 원하는 사람들이 빠르게 시작할 수 있게 했다)**와 같아요. This는 앞 문장의 '단순한 웹사이트'를 가리켜요."}]}, {"part": "❸", "title": "사용 지침과 은하 분류법", "flow": "새 방문자는 간단한 사용 지침을 먼저 보고, 그다음 은하 이미지를 보며 특징을 설명하는 버튼을 눌렀어요. 지침을 마치고 약간 연습하면 참가자들은 은하를 효과적으로 분류할 수 있었어요.", "items": [{"en": "New visitors were first greeted with a brief tutorial that explained the project.", "ans": "T", "ko": "신규 방문자들은 먼저 프로젝트를 설명하는 간단한 사용 지침과 함께 환영받았다.", "eve": "New visitors were greeted with a brief tutorial that explained the project.", "evk": "신규 방문자들은 프로젝트에 대해 설명하는 간단한 사용 지침과 함께 환영받았다.", "why": "**New visitors were greeted with a brief tutorial that explained the project(신규 방문자들은 프로젝트에 대해 설명하는 간단한 사용 지침과 함께 환영받았다)**와 같아요. 뒤에 Then(그런 다음)이 나오니 지침이 가장 먼저예요."}, {"en": "Visitors were shown a galaxy image first and were given the tutorial only afterward.", "ans": "F", "ko": "방문자들은 은하 이미지를 먼저 보고, 그 뒤에야 사용 지침을 받았다.", "eve": "New visitors were greeted with a brief tutorial that explained the project. Then they were shown an image of a galaxy and asked to click buttons that described its features.", "evk": "신규 방문자들은 프로젝트에 대해 설명하는 간단한 사용 지침과 함께 환영받았다. 그런 다음 그들에게 은하 이미지가 보여졌고, 그것의 특징을 설명하는 버튼을 클릭하도록 요청받았다.", "why": "본문의 순서는 **a brief  수십 년이 걸렸을 것이다)**이에요. decades(수십 년)를 'a few weeks(몇 주)'로 바꿨으니 틀려요."}]}, {"part": "❹", "title": "Zooniverse로 성장한 Galaxy Zoo", "flow": "2007년에 시작된 프로젝트는 15년 넘게 지나 Zooniverse로 성장했어요. 지금도 활발하고 전 세계에 약 2백만 명의 등록 사용자가 있어요. 천문학뿐 아니라 생물학, 물리학 등 다양한 프로젝트가 있어요.", "items": [{"en": "More than 15 years have passed since the project began in 2007.", "ans": "T", "ko": "그 프로젝트가 2007년에 시작된 이후로 15년 넘게 지났다.", "eve": "More than 15 years have passed since the project first began in 2007.", "evk": "그 프로젝트가 2007년에 처음 시작된 이래로 15년 이상이 지났다.", "why": "**More than 15 years have passed since the project first began in 2007(그 프로젝트가 2007년에 처음 시작된 이래로 15년 이상이 지났다)**과 같아요. have passed(지났다)는 시작한 때부터 지금까지의 기간을 말해요."}, {"en": "Zooniverse is a small platform that few ordinary people use.", "ans": "F", "ko": "Zooniverse는 일반인들이 거의 쓰지 않는 작은 플랫폼이다.", "eve": "Galaxy Zoo has now grown into Zooniverse, which is one of the most popular platforms on the Internet for ordinary people who want to participate in science projects.", "evk": "Galaxy Zoo는 이제 Zooniverse로 성장했는데, 이것은 과학 프로젝트에 참여하고 싶어 하는 일반인들을 위한 인터넷에서 가장 인기 있는 플랫폼 중 하나이다.", "why": "본문은 **one of the most popular platforms on the Internet for ordinary people(일반인들을 위한 인터넷에서 가장 인기 있는 플랫폼 중 하나)**이에요. 'small(작은)'과 'few ordinary people use(일반인들이 거의 쓰지 않는다)'는 popular(인기 있는)와 반대예요."}, {"en": "Zooniverse has about 2 million registered users worldwide.", "ans": "T", "ko": "Zooniverse는 전 세계에 약 2백만 명의 등록된 사용자가 있다.", "eve": "It is more active than ever before, with about 2 million registered users worldwide.", "evk": "전 세계적으로 약 2백만 명의 등록된 사용자가 있는 그것은 그 어느 때보다 더 왕성하다.", "why": "**about 2 million registered users worldwide(전 세계적으로 약 2백만 명의 등록된 사용자)**와 같아요. registered(등록된)는 가입했다는 뜻이에요."}, {"en": "Zooniverse now offers projects only in astronomy.", "ans": "F", "ko": "Zooniverse는 이제 천문학 분야의 프로젝트만 제공한다.", "eve": "It now offers a wide range of projects in astronomy, biology, physics, and more.", "evk": "현재 그것은 천문학, 생물학, 물리학 등에서 광범위한 프로젝트들을 제공하고 있다.", "why": "본문은 **a wide rang     if(fin)done++;
  });
  prog.textContent='소단락 '+done+'/'+cards.length+' 확인';
  if(user&&cards.length&&done===cards.length&&!S._m){S._m=1;save();if(!WN.MODE){try{if(window.PG)PG.mark(PGK)}catch(e){}}}
  if(WN.MODE&&cards.length)wnRender(wn,done===cards.length);
}
paint();
