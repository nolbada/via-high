<script>
var Q=[{"id": "ctx1", "kind": "ctx", "n": 1, "title": null, "tko": null, "paras": [[{"t": "When we think about science, we might consider it as a domain reserved "}, {"t": "exclusively", "c": 1}, {"t": " for scientists in long, white lab coats who spend their days conducting experiments and analyzing data. They seem to have "}, {"t": "very little", "c": 2}, {"t": " in common with ordinary people like us. However, this perception is "}, {"t": "close to", "c": 3}, {"t": " the truth. In reality, science belongs to everyone, and we all have the ability to play a role in the "}, {"t": "decline", "c": 4}, {"t": " of science. There have been "}, {"t": "numerous", "c": 5}, {"t": " citizen science projects in which ordinary people have made contributions to remarkable scientific accomplishments. Let’s take a look at two of them."}]], "items": [{"c": 3, "w": "close to", "r": "far from", "gw": "~에 가까운", "gr": "~와 거리가 먼", "fb": null, "fg": "However, this perception is <span class=\"d\">far from</span> the truth.", "ko": "그러나 이러한 인식은 사실과 거리가 멀다.", "why": "<b>this perception is far from the truth(이러한 인식은 사실과 거리가 멀다)</b>가 원문이에요. 앞 문장은 과학자와 일반인은 공통점이 거의 없다는 흔한 생각(perception, 인식)이에요. 그런데 However(그러나)로 방향을 바꾸고, 바로 뒤에서 science belongs to everyone(과학은 모두의 것)이라고 말해요. 그러니 그 인식은 사실과 &#x27;거리가 멀어야&#x27; 해요. close to (~에 가까운)면 However 뒤가 앞 문장과 같은 편이 돼서 흐름이 막혀요."}, {"c": 4, "w": "decline", "r": "advancement", "gw": "쇠퇴", "gr": "발전", "fb": null, "fg": "In reality, science belongs to everyone, and we all have the ability to play a role in the <span class=\"d\">advancement</span> of science.", "ko": "사실은, 과학은 모두의 것이며, 우리는 모두 과학의 발전에 일조할 수 있는 능력이 있다.", "why": "<b>play a role in the advancement of science(과학의 발전에 일조하다)</b>가 원문이에요. 앞에서 science belongs to everyone(과학은 모두의 것)이라고 했고, 뒤에서는 평범한 사람들이 remarkable scientific accomplishments(놀라운 과학적 업적)에 기여한 프로젝트를 이야기해요. 모두가 과학의 decline (쇠퇴)에 역할을 한다는 말은 이 좋은 흐름과 맞지 않아요."}], "keep": "exclusively (독점적으로)는 '과학자들에게만 독점적으로 지정된 영역'이라는 뜻이라 맞고, very little (거의 없는)은 '평범한 사람들과 공통점이 거의 없다'는 흔한 생각이라 맞아요. numerous (수많은)는 '시민 과학 프로젝트가 수없이 많았다'는 내용이라 그대로 둬요.", "flow": "과학은 과학자만의 것이라는 생각을 뒤집는 글이에요. 'However(그러나)'를 기준으로 앞은 흔한 생각이고 뒤는 그 생각을 반박하는 내용이에요. 연결어가 어느 쪽 이야기를 부르는지 보세요.", "ko": "과학에 대해서 생각할 때, 우리는 그것을 실험을 하고 데이터를 분석하는 데 나날을 보내는 길고 흰 실험실 가운을 입은 과학자들에게 독점적으로 지정된 영역이라고 생각할 수 있다. 그들은 우리와 같은 평범한 사람들과 공통점이 거의 없는 것 같이 보인다. 그러나 이러한 인식은 사실과 거리가 멀다. 사실은, 과학은 모두의 것이며, 우리는 모두 과학의 발전에 일조할 수 있는 능력이 있다. 평범한 사람들이 놀라운 과학적 업적에 기여한 수많은 시민 과학 프로젝트들이 있었다. 그중 두 가지를 살펴보자."}, {"id": "ctx2", "kind": "ctx", "n": 2, "title": "Classifying Galaxies", "tko": "은하 분류하기", "paras": [[{"t": "Kevin Schawinski was a young astronomy researcher studying black holes and the evolution of galaxies at the University of Oxford. This might sound "}, {"t": "exciting", "c": 1}, {"t": ", but his job there was dull and "}, {"t": "time-saving", "c": 2}, {"t": ". He had to classify around one million images of galaxies according to their shape. Since they all looked similar but were actually shaped "}, {"t": "slightly", "c": 3}, {"t": " differently, the best way to do this was to sort them while looking at each one "}, {"t": "collectively", "c": 4}, {"t": ". Of course, this would require a "}, {"t": "tremendous", "c": 5}, {"t": " amount of time. It took Schawinski a whole week to classify just 50,000 galaxies. He thought, “But what about the remaining 950,000?”"}]], "items": [{"c": 2, "w": "time-saving", "r": "time-consuming", "gw": "시간을 절약하는", "gr": "시간이 많이 걸리는", "fb": null, "fg": "This might sound exciting, but his job there was dull and <span class=\"d\">time-consuming</span>.", "ko": "이것이 흥미롭게 들릴지도 모르지만, 그곳에서 그의 일은 따분하고 시간이 많이 걸리는 일이었다.", "why": "<b>his job there was dull and time-consuming(그곳에서 그의 일은 따분하고 시간이 많이 걸렸다)</b>이 원문이에요. 앞에서 This might sound exciting, but(이것이 흥미롭게 들릴지도 모르지만)이라고 했으니 but 뒤는 &#x27;따분한&#x27; 쪽이에요. 바로 뒤에서도 이미지 백만 장을 분류해야 하고 5만 개에 일주일이 걸렸다고 해서 시간이 오래 걸리는 일이에요. time-saving (시간을 절약하는)이면 이 내용과 정반대예요."}, {"c": 4, "w": "collectively", "r": "individually", "gw": "한꺼번에, 집합적으로", "gr": "개별적으로", "fb": null, "fg": "Since they all looked similar but were actually shaped slightly differently, the best way to do this was to sort them while looking at each one <span class=\"d\">individually</span>.", "ko": "그것들은 모두 비슷해 보이지만 사실 모양이 조금씩 달랐기 때문에, 그것을 해내는 가장 좋은 방법은 하나하나를 개별적으로 보면서 분류하는 것이었다.", "why": "<b>sort them while looking at each one individually(하나하나를 개별적으로 보면서 분류하다)</b>가 원문이에요. 은하들이 모두 비슷해 보이지만 사실 모양이 조금씩 달라서, 하나씩 따로 봐야 구별할 수 있어요. 그래서 바로 뒤에 &#x27;엄청난 시간이 필요할 것&#x27;이라는 말이 이어져요. collectively (한꺼번에)면 하나하나 보느라 오래 걸린다는 흐름과 맞지 않아요."}], "keep": "exciting (흥미로운)은 'But(그러나) 일은 따분했다'로 이어지는 앞부분이라 맞고, slightly (조금)는 '비슷해 보이지만 모양이 조금씩 다르다'는 내용이라 맞아요. tremendous (엄청난)는 '이미지 백만 장을 분류하려면 엄청난 시간이 필요하다'는 뜻이라 그대로 둬요.", "flow": "Schawinski가 맡은 지루한 일을 소개하는 글이에요. 'might sound exciting, but(흥미롭게 들릴지 몰라도 ...)'의 but 뒤는 반대 내용이 와요. 그리고 하나하나 보면 시간이 얼마나 걸릴지도 따라가 보세요.", "ko": "Kevin Schawinski는 옥스퍼드 대학에서 블랙홀과 은하의 진화를 연구하는 젊은 천문학 연구원이었다. 이것이 흥미롭게 들릴지도 모르지만, 그곳에서 그의 일은 따분하고 시간이 많이 걸리는 일이었다. 그는 약 백만 장의 은하 이미지를 모양에 따라 분류해야 했다. 그것들은 모두 비슷해 보이지만 사실 모양이 조금씩 달랐기 때문에, 그것을 해내는 가장 좋은 방법은 하나하나를 개별적으로 보면서 분류하는 것이었다. 물론, 이것은 엄청난 시간이 필요할 것이었다. Schawinski가 고작 5만 개의 은하를 분류하는 데 꼬박 일주일이 걸렸다. 그는 ‘하지만 남아 있는 95만 개는 어쩌지?’라고 생각했다."}, {"id": "ctx3", "kind": "ctx", "n": 3, "title": null, "tko": null, "paras": [[{"t": "One evening after work, Schawinski met a friend named Chris Lintott and "}, {"t": "complained", "c": 1}, {"t": " about the situation. Lintott suggested that he turn to the Internet to ask other people for help. Eventually, the two men ended up launching a crowdsourced online project known as Galaxy Zoo. The website was kept as "}, {"t": "complex", "c": 2}, {"t": " as possible, with a very basic design and an "}, {"t": "easy-to-use", "c": 3}, {"t": " interface. This allowed those who wanted to participate to get started "}, {"t": "slowly", "c": 4}, {"t": ". New visitors were greeted with a "}, {"t": "brief", "c": 5}, {"t": " tutorial that explained the project. Then they were shown an image of a galaxy and asked to click buttons that described its features. Is the galaxy smooth and rounded? Is its shape an oval or a spiral? After completion of the tutorial and a little bit of practice, the participants were able to classify galaxies "}, {"t": "effectively", "c": 6}, {"t": "."}]], "items": [{"c": 2, "w": "complex", "r": "simple", "gw": "복잡한", "gr": "단순한", "fb": null, "fg": "The website was kept as <span class=\"d\">simple</span> as possible, with a very basic design and an easy-to-use interface.", "ko": "그 웹사이트는 매우 기본적인 디자인과 사용하기 쉬운 인터페이스로 최대한 단순하게 유지되었다.", "why": "<b>The website was kept as simple as possible(그 웹사이트는 최대한 단순하게 유지되었다)</b>가 원문이에요. 바로 뒤에 with a very basic design and an easy-to-use interface(아주 기본적인 디자인과 사용하기 쉬운 인터페이스로)가 이어지니 &#x27;복잡하게&#x27; 만들었다는 말과 부딪쳐요. kept as complex (복잡하게 유지된) as possible은 이 설명과 맞지 않아요."}, {"c": 4, "w": "slowly", "r": "quickly", "gw": "천천히", "gr": "빠르게", "fb": null, "fg": "This allowed those who wanted to participate to get started <span class=\"d\">quickly</span>.", "ko": "이것은 참여하기를 원하는 사람들이 빠르게 시작할 수 있게 했다.", "why": "<b>This allowed those who wanted to participate to get started quickly(이것은 참여하고 싶은 사람들이 빠르게 시작할 수 있게 했다)</b>가 원문이에요. This는 앞 문장의 &#x27;단순하고 쓰기 쉬운 사이트&#x27;를 가리켜요. 단순하고 쓰기 쉬우니 시작도 빨라요. slowly (천천히)면 사이트를 단순하게 만든 이유가 사라져요."}], "keep": "complained (불평했다)는 앞에서 따분하고 오래 걸리던 일 때문이라 맞아요. easy-to-use (사용하기 쉬운)는 'basic design(기본적인 디자인)'과 어울리고, brief (간단한)는 tutorial(사용 지침)이 짧아서 금방 시작할 수 있다는 내용이에요. effectively (효과적으로)는 지침을 마치고 연습한 뒤 잘 분류했다는 마지막 문장이라 그대로 둬요.", "flow": "Galaxy Zoo가 어떻게 시작됐는지 알려 주는 글이에요. 사이트를 단순하게 만든 이유와 그 결과(빠르게 시작)가 이어지니, 앞뒤 문장이 같은 방향인지 보세요.", "ko": "어느 날 퇴근 후 저녁, Schawinski는 Chris Lintott이라는 이름의 친구를 만나서 그 상황에 대해 불평했다. Lintott은 다른 사람들에게 도움을 요청하기 위해 인터넷에 의지할 것을 제안했다. 결국, 그 두 남자는 Galaxy Zoo라고 알려진 대중을 참여시키는(= 크라우드소싱) 온라인 프로젝트를 시작하게 되었다. 그 웹사이트는 매우 기본적인 디자인과 사용하기 쉬운 인터페이스로 최대한 단순하게 유지되었다. 이것은 참여하기를 원하는 사람들이 빠르게 시작할 수 있게 했다. 신규 방문자들은 프로젝트에 대해 설명하는 간단한 사용 지침과 함께 환영받았다. 그런 다음 그들에게 은하 이미지가 보여졌고, 그것의 특징을 설명하는 버튼을 클릭하도록 요청받았다. 은하가 매끄럽고 둥근가? 그것의 모양은 타원형인가 아니면 나선형인가? 사용 지침의 완료와 약간의 연습 후에, 참가자들은 효과적으로 은하를 분류할 수 있었다."}, {"id": "ctx4", "kind": "ctx", "n": 4, "title": null, "tko": null, "paras": [[{"t": "It was online media that "}, {"t": "helped", "c": 1}, {"t": " spread the word about Galaxy Zoo, bringing more and more participants to the website. Shortly after the website was "}, {"t": "closed", "c": 2}, {"t": ", nearly 70,000 classifications were being made per hour. In a year and a half, more than 80,000 individuals participated, and they made more than 75 million classifications. If it had not been for those participants, Schawinski couldn’t have classified that many images. In fact, it would have taken him "}, {"t": "decades", "c": 3}, {"t": " on his own."}], [{"t": "More than 15 years have passed since the project first began in 2007. Galaxy Zoo has now grown into Zooniverse, which is one of the most "}, {"t": "popular", "c": 4}, {"t": " platforms on the Internet for ordinary people who want to participate in science projects. It is more "}, {"t": "active", "c": 5}, {"t": " than ever before, with about 2 million registered users worldwide. It now offers a "}, {"t": "narrow", "c": 6}, {"t": " range of projects in astronomy, biology, physics, and more. If you want to get involved, you should definitely check it out!"}]], "items": [{"c": 2, "w": "closed", "r": "launched", "gw": "닫힌", "gr": "개설된, 시작된", "fb": null, "fg": "Shortly after the website was <span class=\"d\">launched</span>, nearly 70,000 classifications were being made per hour.", "ko": "웹사이트가 개설된 지 얼마 지나지 않아, 시간당 약 7만 건의 분류가 이루어지고 있었다.", "why": "<b>Shortly after the website was launched(웹사이트가 개설된 지 얼마 지나지 않아)</b>가 원문이에요. 사이트가 열려야 시간당 약 7만 건의 분류가 이뤄질 수 있어요. 앞 문장도 &#x27;온라인 미디어가 소문을 퍼뜨려 참여자가 늘었다&#x27;는 내용이에요. closed (닫힌) 직후에 분류가 쏟아진다는 건 말이 안 돼요."}, {"c": 6, "w": "narrow", "r": "wide", "gw": "좁은", "gr": "넓은", "fb": null, "fg": "It now offers a <span class=\"d\">wide</span> range of projects in astronomy, biology, physics, and more.", "ko": "현재 그것은 천문학, 생물학, 물리학 등에서 광범위한 프로젝트들을 제공하고 있다.", "why": "<b>It now offers a wide range of projects(현재 광범위한 프로젝트들을 제공하고 있다)</b>가 원문이에요. 바로 앞에서 Zooniverse가 &#x27;가장 인기 있는 플랫폼 중 하나&#x27;이고 &#x27;그 어느 때보다 활발하다&#x27;고 했어요. 인기 있고 활발한 곳이 narrow (좁은) 범위의 프로젝트만 낸다면 흐름이 끊겨요. 천문학, 생물학, 물리학 등 여러 분야를 말하는 것도 wide (넓은)와 맞아요."}], "keep": "helped (도왔다)는 '온라인 미디어가 소문을 퍼뜨리는 데 도움을 줬다'는 뜻이라 맞고, decades (수십 년)는 '혼자서는 수십 년이 걸렸을 것'이라는 내용이라 맞아요. popular (인기 있는)와 active (활발한)는 Zooniverse가 잘되고 있다는 내용이라 그대로 둬요.", "flow": "Galaxy Zoo가 알려지고 Zooniverse로 커진 이야기예요. 참여자가 폭발적으로 늘어난 흐름이라서 좋은 방향으로 이어지는지 보세요. 숫자가 나오는 문장은 그 숫자가 어느 쪽을 뜻하는지 확인하면 돼요.", "ko": "Galaxy Zoo에 대한 소문을 퍼뜨리는 데 도움을 준 것은 바로 온라인 미디어였고, 그 웹사이트에 점점 더 많은 참여자를 불러 모았다. 웹사이트가 개설된 지 얼마 지나지 않아, 시간당 약 7만 건의 분류가 이루어지고 있었다. 일 년 반 만에, 8만 명 이상의 개인이 참여하였고, 그들은 7천5백만 건 이상의 분류를 해냈다. 그 참여자들이 없었다면, Schawinski는 그렇게 많은 이미지를 분류할 수 없었을 것이다. 사실, 그 혼자서는 수십 년이 걸렸을 것이다. 그 프로젝트가 2007년에 처음 시작된 이래로 15년 이상이 지났다. Galaxy Zoo는 이제 Zooniverse로 성장했는데, 이것은 과학 프로젝트에 참여하고 싶어 하는 일반인들을 위한 인터넷에서 가장 인기 있는 플랫폼 중 하나이다. 전 세계적으로 약 2백만 명의 등록된 사용자가 있는 그것은 그 어느 때보다 더 왕성하다. 현재 그것은 천문학, 생물학, 물리학 등에서 광범위한 프로젝트들을 제공하고 있다. 만약 당신이 참여하고 싶다면, 반드시 확인해 보아라!"}, {"id": "ctx5", "kind": "ctx", "n": 5, "title": "Chasing Steve", "tko": "Steve를 쫓아서", "paras": [[{"t": "In Alberta, Canada, there were some “aurora chasers” who formed an "}, {"t": "informal", "c": 1}, {"t": " group online. They would leave their homes at night and try to get "}, {"t": "exceptional", "c": 2}, {"t": " photographs of auroras. Then they would share them with the rest of the group."}], [{"t": "In the summer of 2014, the group members began to notice something "}, {"t": "familiar", "c": 3}, {"t": " appearing in the night sky. There were "}, {"t": "unusual", "c": 4}, {"t": " ribbons of green and purple light, some of which seemed to stretch for thousands of kilometers. Sometimes they lasted for just a few minutes, while other times they remained in the sky for a whole hour. They were similar in appearance to auroras, yet they possessed some notably "}, {"t": "similar", "c": 5}, {"t": " features. "}, {"t": "Sure", "c": 6}, {"t": " of what they were, the group decided to name the phenomenon “Steve,” based on a scene from an animated movie where some characters give that name to an unfamiliar object."}]], "items": [{"c": 3, "w": "familiar", "r": "strange", "gw": "익숙한", "gr": "이상한", "fb": null, "fg": "In the summer of 2014, the group members began to notice something <span class=\"d\">strange</span> appearing in the night sky.", "ko": "2014년 여름, 그 단체 구성원들은 밤하늘에 이상한 무언가가 나타나는 것을 알아채기 시작했다.", "why": "<b>began to notice something strange appearing in the night sky(밤하늘에 이상한 무언가가 나타나는 것을 알아채기 시작했다)</b>가 원문이에요. 바로 다음 문장이 unusual ribbons of green and purple light(녹색과 보라색의 특이한 빛의 띠)로 그 &#x27;무언가&#x27;를 설명해요. 익숙한 것이라면 알아챌 일도, 새 이름을 붙일 일도 없어요. familiar (익숙한)이면 흐름이 맞지 않아요."}, {"c": 5, "w": "similar", "r": "different", "gw": "비슷한", "gr": "다른", "fb": null, "fg": "They were similar in appearance to auroras, yet they possessed some notably <span class=\"d\">different</span> features.", "ko": "그것들은 오로라와 생김새가 비슷했지만, 몇 가지 현저하게 다른 특징들을 지니고 있었다.", "why": "<b>yet they possessed some notably different features(하지만 그것들은 몇 가지 현저하게 다른 특징들을 지니고 있었다)</b>가 원문이에요. yet(하지만) 앞은 &#x27;오로라와 생김새가 비슷하다&#x27;예요. yet 뒤에는 반대로 &#x27;다른 점&#x27;이 와야 해요. similar (비슷한)가 오면 같은 말을 되풀이해서 yet이 쓸모없어져요."}, {"c": 6, "w": "Sure", "r": "Unsure", "gw": "확신하는", "gr": "확신하지 못하는", "fb": null, "fg": "<span class=\"d\">Unsure</span> of what they were, the group decided to name the phenomenon “Steve,” based on a scene from an animated movie where some characters give that name to an unfamiliar object.", "ko": "그것들이 무엇인지 확신하지 못한 그 단체는 등장인물들이 낯선 물체에 Steve라는 이름을 붙이는 한 애니메이션 영화의 장면을 바탕으로 이 현상을 ‘Steve’라고 이름 짓기로 결정했다.", "why": "<b>Unsure of what they were(그것들이 무엇인지 확신하지 못한 채)</b>가 원문이에요. 이때는 전문가를 찾아가기 전이라 그것이 무엇인지 몰랐어요. 그래서 이름도 영화 속 장면에서 빌려 &#x27;Steve&#x27;라는 임시 이름을 붙였어요. Sure (확신하는)면 굳이 영화에서 이름을 빌릴 이유가 없어요."}], "keep": "informal (비공식의)은 '온라인에서 모인 비공식 단체'라서 맞고, exceptional (특별한)은 '특별한 오로라 사진을 찍으려 했다'는 내용이라 맞아요. unusual (특이한)은 새로 발견한 빛의 띠를 설명하는 말이라 그대로 둬요.", "flow": "오로라 추적자들이 낯선 빛의 띠를 처음 발견하는 글이에요. '낯선 현상을 만났다'는 흐름이라서, 익숙한지 낯선지, 비슷한지 다른지, 아는지 모르는지를 하나씩 따라가 보세요. yet(하지만) 같은 연결어가 방향을 알려 줘요.", "ko": "캐나다 앨버타주에는 온라인상에서 비공식 단체를 결성한 ‘오로라 추적자들’이 있었다. 그들은 밤에 집을 나서 특별한 오로라 사진을 찍으려고 하곤 했다. 그런 다음 그들은 단체의 나머지 사람들과 그것들을 공유하곤 했다. 2014년 여름, 그 단체 구성원들은 밤하늘에 이상한 무언가가 나타나는 것을 알아채기 시작했다. 녹색과 보라색의 특이한 빛의 띠가 있었는데, 그중 일부는 수천 킬로미터에 걸쳐 뻗어 있는 것처럼 보였다. 그것들은 어떤 때에는 단 몇 분간 지속되었지만, 다른 때에는 한 시간 내내 하늘에 머무르기도 했다. 그것들은 오로라와 생김새가 비슷했지만, 몇 가지 현저하게 다른 특징들을 지니고 있었다. 그것들이 무엇인지 확신하지 못한 그 단체는 등장인물들이 낯선 물체에 Steve라는 이름을 붙이는 한 애니메이션 영화의 장면을 바탕으로 이 현상을 ‘Steve’라고 이름 짓기로 결정했다."}, {"id": "ctx6", "kind": "ctx", "n": 6, "title": null, "tko": null, "paras": [[{"t": "After photographing Steve for several years and discussing what it might be, the group members decided to get help from experts. They showed their photos of Steve to a professor of astronomy at a local university and a scientist at NASA. "}, {"t": "Surprisingly", "c": 1}, {"t": ", neither of them had any idea what Steve was. They "}, {"t": "confirmed", "c": 2}, {"t": " that it was not an aurora, but it did not resemble anything they had seen before. They realized that the group had discovered a new type of phenomenon that had never been properly studied. In order to learn more about it, NASA "}, {"t": "funded", "c": 3}, {"t": " a citizen science project involving the public. The project asked ordinary people to gather photos of Steve and send them to NASA. It is still in progress today."}], [{"t": "In honor of the aurora chasers who first discovered the phenomenon, the name “Steve” has been kept. However, it is now written in all "}, {"t": "lowercase", "c": 4}, {"t": " letters and stands for “Strong Thermal Emission Velocity Enhancement.” Experts have "}, {"t": "acknowledged", "c": 5}, {"t": " that it is the dedicated members of the aurora chasers group that deserve the credit for discovering STEVE. If it had not been for them, it might have remained "}, {"t": "unnoticed", "c": 6}, {"t": " forever. There are many interesting theories about STEVE, but none of them have been proven for certain. Scientists and citizens continue to "}, {"t": "compete", "c": 7}, {"t": " to solve this mystery, and they are learning more and more about STEVE every day."}]], "items": [{"c": 4, "w": "lowercase", "r": "capital", "gw": "소문자의", "gr": "대문자의", "fb": null, "fg": "However, it is now written in all <span class=\"d\">capital</span> letters and stands for “Strong Thermal Emission Velocity Enhancement.”", "ko": "그러나, 그것은 이제 모두 대문자로 쓰이며, ‘속도 증가에 따른 강한 열 방출(Strong Thermal Emission Velocity Enhancement)’을 의미한다.", "why": "<b>it is now written in all capital letters and stands for “Strong Thermal Emission Velocity Enhancement”(이제 모두 대문자로 쓰이며 ...를 의미한다)</b>가 원문이에요. stands for (~을 의미한다)는 STEVE가 각 단어의 첫 글자를 딴 줄임말(약어)이 됐다는 말이에요. 약어는 STEVE처럼 대문자로 써요. However(그러나)로 앞의 이름 &#x27;Steve&#x27;와 달라진 점을 알려 주는 것도 대문자 쪽이 맞아요. lowercase (소문자의)면 약어라는 설명과 맞지 않아요."}, {"c": 7, "w": "compete", "r": "collaborate", "gw": "경쟁하다", "gr": "협력하다", "fb": null, "fg": "Scientists and citizens continue to <span class=\"d\">collaborate</span> to solve this mystery, and they are learning more and more about STEVE every day.", "ko": "과학자들과 시민들은 이 수수께끼를 풀기 위해 계속 협력하며, 매일 STEVE에 대해 점점 더 많은 것을 알아가고 있다.", "why": "<b>Scientists and citizens continue to collaborate to solve this mystery(과학자들과 시민들은 이 수수께끼를 풀기 위해 계속 협력한다)</b>가 원문이에요. 이 글은 시민이 발견하고 NASA가 시민 참여 프로젝트에 자금을 대 함께 연구한 이야기예요. 그래서 &#x27;함께 수수께끼를 푼다&#x27;가 맞아요. 바로 뒤의 they are learning more and more(점점 더 많이 알아가고 있다)도 협력의 결과예요. compete (경쟁하다)면 앞의 협력 흐름과 맞지 않아요."}], "keep": "Surprisingly (놀랍게도)는 전문가들도 Steve가 무엇인지 몰랐다는 뜻밖의 내용이라 맞고, confirmed (확인했다)는 '오로라가 아니라는 것은 확인했다'는 뜻이라 맞아요. funded (자금을 제공했다)는 NASA가 시민 과학 프로젝트에 돈을 댔다는 내용이고, acknowledged (인정했다)는 '공로는 구성원들에게 있다고 인정했다'는 뜻이에요. unnoticed (눈에 띄지 않은)는 '그들이 아니었다면 알려지지 않았을 것'이라 그대로 둬요.", "flow": "Steve가 전문가에게까지 가서 이름이 정해지는 이야기예요. 전문가들도 몰랐고, 시민과 과학자가 함께 풀어 가는 흐름이에요. 'However(그러나)'가 어떤 변화를 알려 주는지, 사람들이 서로 협력하는지 경쟁하는지 보세요.", "ko": "몇 년 동안 Steve의 사진을 찍고 그것이 무엇일지에 대해 논의한 후에, 그 단체 구성원들은 전문가들로부터 도움을 받기로 결정했다. 그들은 Steve의 사진들을 지역 대학의 천문학 교수와 NASA의 과학자에게 보여주었다. 놀랍게도, 둘 중 누구도 Steve가 무엇인지 전혀 알지 못했다. 그들은 그것이 오로라가 아니라는 것은 확인했지만, 그것은 그들이 이전에 보았던 어느 것과도 비슷하지 않았다. 그들은 그 단체가 제대로 연구된 적이 없는 새로운 유형의 현상을 발견했다는 것을 깨달았다. 이에 대해 더 자세히 알아보기 위해, NASA는 대중이 참여하는 시민 과학 프로젝트에 자금을 제공했다. 그 프로젝트는 일반인들에게 Steve의 사진을 모아서 NASA에 보내달라고 요청했다. 그것은 오늘날에도 여전히 진행 중이다. 이 현상을 처음 발견한 오로라 추적자들에게 경의를 표하여 ‘Steve’라는 이름은 유지되었다. 그러나, 그것은 이제 모두 대문자로 쓰이며, ‘속도 증가에 따른 강한 열 방출(Strong Thermal Emission Velocity Enhancement)’을 의미한다. 전문가들은 STEVE를 발견한 공로를 인정받아야 할 사람들은 바로 오로라 추적자 단체의 헌신적인 구성원들임을 인정했다. 만약 그들이 아니었다면, 그것은 영원히 알려지지 못한 상태로 남았을지도 모른다. STEVE에 대한 흥미로운 이론들은 많지만, 그들 중 어느 것도 확실하게 증명된 것은 없다. 과학자들과 시민들은 이 수수께끼를 풀기 위해 계속 협력하며, 매일 STEVE에 대해 점점 더 많은 것을 알아가고 있다."}, {"id": "ctx7", "kind": "ctx", "n": 7, "title": null, "tko": null, "paras": [[{"t": "Most of the individuals involved in these two projects are not "}, {"t": "professional", "c": 1}, {"t": " scientists. Instead, they are citizen scientists—ordinary people who desire to help "}, {"t": "hinder", "c": 2}, {"t": " science in areas that they are interested in. Even though citizen scientists may not have science degrees or long, white lab coats, they are still "}, {"t": "incapable", "c": 3}, {"t": " of making valuable contributions to science. You can become one as well if you have "}, {"t": "curiosity", "c": 4}, {"t": " and an interest in taking part in scientific research. The next great scientific achievement could be made by citizen scientists volunteering their time for the purpose of "}, {"t": "better", "c": 5}, {"t": " understanding the world."}]], "items": [{"c": 2, "w": "hinder", "r": "advance", "gw": "방해하다", "gr": "발전시키다", "fb": null, "fg": "Instead, they are citizen scientists—ordinary people who desire to help <span class=\"d\">advance</span> science in areas that they are interested in.", "ko": "대신, 그들은 시민 과학자들인데, 그들은 자신이 관심 있는 분야에서 과학의 발전을 돕고자 하는 평범한 사람들이다.", "why": "<b>ordinary people who desire to help advance science(과학의 발전을 돕고자 하는 평범한 사람들)</b>이 원문이에요. 시민 과학자는 자기가 관심 있는 분야에서 과학을 돕고 싶어 하는 사람들이에요. 과학에 관심이 있어서 참여한 사람들이 과학을 hinder (방해하다)하려 한다면 말이 안 돼요."}, {"c": 3, "w": "incapable", "r": "capable", "gw": "~할 수 없는", "gr": "~할 수 있는", "fb": null, "fg": "Even though citizen scientists may not have science degrees or long, white lab coats, they are still <span class=\"d\">capable</span> of making valuable contributions to science.", "ko": "시민 과학자들에게 과학 학위나 길고 흰 가운은 없을 수 있지만, 그들은 여전히 과학에 귀중한 기여를 할 수 있다.", "why": "<b>they are still capable of making valuable contributions to science(그들은 여전히 과학에 귀중한 기여를 할 수 있다)</b>가 원문이에요. Even though(~이지만)가 이끄는 앞부분은 &#x27;학위도 가운도 없을 수 있다&#x27;는 불리한 조건이에요. 그래도(still) 기여할 수 있다고 해야 반대 방향으로 자연스럽게 이어져요. 마지막 문장에서 이들에게서 다음 위대한 업적이 나올 수 있다고 말하는 것도 맞아요. incapable (~할 수 없는)이면 이 흐름과 맞지 않아요."}], "keep": "professional (전문적인)은 '전문 과학자가 아니다'라는 뜻이라 맞고, curiosity (호기심)는 '호기심과 관심이 있다면 시민 과학자가 될 수 있다'는 내용이라 맞아요. better (더 잘)는 '세상을 더 잘 이해하기 위해'라는 뜻이라 그대로 둬요.", "flow": "앞의 두 프로젝트를 정리하며 시민 과학자가 누구인지 말하는 마무리 글이에요. 시민 과학자는 과학을 돕고 싶은 평범한 사람들이에요. 'Even though(~이지만)' 뒤에서 방향이 어떻게 바뀌는지 보세요.", "ko": "이 두 프로젝트에 참여한 대부분의 개인들은 전문 과학자가 아니다. 대신, 그들은 시민 과학자들인데, 그들은 자신이 관심 있는 분야에서 과학의 발전을 돕고자 하는 평범한 사람들이다. 시민 과학자들에게 과학 학위나 길고 흰 가운은 없을 수 있지만, 그들은 여전히 과학에 귀중한 기여를 할 수 있다. 호기심과 과학 연구에 참여하는 것에 대한 관심이 있다면 당신도 시민 과학자가 될 수 있다. 다음 위대한 과학적 업적은 세상을 더 잘 이해하기 위한 목적으로 자신의 시간을 자발적으로 제공하는 시민 과학자들에 의해 이루어질 수도 있다."}, {"id": "gram1", "kind": "gram", "n": 1, "title": null, "tko": null, "paras": [[{"t": "When we think about science, we might consider it as "}, {"t": "a domain reserving exclusively for scientists", "c": 1}, {"t": " in long, white lab coats "}, {"t": "who spend their days conduct experiments and analyzing data", "c": 2}, {"t": ". "}, {"t": "They seem to have very little in common", "c": 3}, {"t": " with ordinary people like us. However, "}, {"t": "this perception is far from the truth", "c": 4}, {"t": ". In reality, science belongs to everyone, and "}, {"t": "we all have the ability to play a role in the advancement of science", "c": 5}, {"t": ". There have been numerous citizen science projects in which "}, {"t": "ordinary people have been made contributions to remarkable scientific accomplishments", "c": 6}, {"t": ". Let’s take a look at two of them."}]], "items": [{"c": 1, "w": "reserving", "r": "reserved", "gw": "지정하는", "gr": "지정된", "fb": "a domain <span class=\"d\">reserving</span> exclusively for scientists", "fg": "a domain <span class=\"d\">reserved</span> exclusively for scientists", "ko": "과학에 대해서 생각할 때, 우리는 그것을 실험을 하고 데이터를 분석하는 데 나날을 보내는 길고 흰 실험실 가운을 입은 과학자들에게 독점적으로 지정된 영역이라고 생각할 수 있다.", "why": "domain(영역)은 스스로 &#x27;지정하는&#x27; 것이 아니라 과학자들에게 <b>지정되는</b> 거예요. 동사 reserve (따로 정해 두다)의 과거분사 reserved는 &#x27;정해진&#x27;이라는 수동의 뜻이라서, domain을 뒤에서 꾸미는 <b>a domain reserved exclusively for scientists(과학자들에게 독점적으로 지정된 영역)</b>가 맞아요. 현재분사 reserving은 &#x27;지정하는&#x27;이라 뜻이 반대가 돼요."}, {"c": 2, "w": "conduct", "r": "conducting", "gw": "수행하다", "gr": "수행하는 것", "fb": "who spend their days <span class=\"d\">conduct</span> experiments and analyzing data", "fg": "who spend their days <span class=\"d\">conducting</span> experiments and analyzing data", "ko": "과학에 대해서 생각할 때, 우리는 그것을 실험을 하고 데이터를 분석하는 데 나날을 보내는 길고 흰 실험실 가운을 입은 과학자들에게 독점적으로 지정된 영역이라고 생각할 수 있다.", "why": "<b>spend + 시간 + -ing</b>는 &#x27;~하며 시간을 보내다&#x27;예요. who spend their days conducting experiments and analyzing data (실험을 하고 데이터를 분석하며 나날을 보내는)처럼 and 앞뒤도 -ing로 모양을 똑같이 맞추는 병렬 구조예요. conduct (수행하다)는 원형이라 -ing 자리에 맞지 않고 병렬도 깨져요."}, {"c": 6, "w": "have been made", "r": "have made", "gw": "만들어져 왔다", "gr": "기여해 왔다", "fb": "ordinary people <span class=\"d\">have been made</span> contributions to remarkable scientific accomplishments", "fg": "ordinary people <span class=\"d\">have made</span> contributions to remarkable scientific accomplishments", "ko": "평범한 사람들이 놀라운 과학적 업적에 기여한 수많은 시민 과학 프로젝트들이 있었다.", "why": "<b>ordinary people have made contributions(평범한 사람들이 기여해 왔다)</b>에서 주어 ordinary people이 &#x27;기여를 하는&#x27; 쪽이라 능동이에요. make a contribution (기여하다)은 목적어 contributions를 바로 받아요. have been made (만들어져 왔다)처럼 수동태로 쓰면 뒤에 contributions라는 목적어가 또 남아서 틀려요. 수동태 뒤에는 목적어가 오지 않아요."}], "keep": "They seem to have very little in common (공통점이 거의 없는 것 같다)은 seem + to V 모양이 맞아요. this perception is far from the truth (이 인식은 사실과 거리가 멀다)는 be동사 뒤 far from이 맞고, we all have the ability to play a role (우리는 모두 역할을 할 능력이 있다)는 ability 뒤에 to V가 와서 맞아요.", "flow": "어법상 어색한 곳은 밑줄 친 문장 중에서만 찾아요. 이 글은 과학이 모두의 것이라고 말하는 도입이에요. 꾸며 주는 말이 '~하는'인지 '~된'인지, and 앞뒤 모양이 같은지, 수동태 뒤에 목적어가 남지는 않았는지 보세요.", "ko": "과학에 대해서 생각할 때, 우리는 그것을 실험을 하고 데이터를 분석하는 데 나날을 보내는 길고 흰 실험실 가운을 입은 과학자들에게 독점적으로 지정된 영역이라고 생각할 수 있다. 그들은 우리와 같은 평범한 사람들과 공통점이 거의 없는 것 같이 보인다. 그러나 이러한 인식은 사실과 거리가 멀다. 사실은, 과학은 모두의 것이며, 우리는 모두 과학의 발전에 일조할 수 있는 능력이 있다. 평범한 사람들이 놀라운 과학적 업적에 기여한 수많은 시민 과학 프로젝트들이 있었다. 그중 두 가지를 살펴보자."}, {"id": "gram2", "kind": "gram", "n": 2, "title": "Classifying Galaxies", "tko": "은하 분류하기", "paras": [[{"t": "Kevin Schawinski was "}, {"t": "a young astronomy researcher studied black holes and the evolution of galaxies", "c": 1}, {"t": " at the University of Oxford. This might sound exciting, but "}, {"t": "his job there was dull and time-consuming", "c": 2}, {"t": ". "}, {"t": "He had to classify around one million images of galaxies", "c": 3}, {"t": " according to their shape. "}, {"t": "Since they all looked similar but was actually shaped slightly differently", "c": 4}, {"t": ", "}, {"t": "the best way to do this was to sort them while looking at each one individually", "c": 5}, {"t": ". Of course, "}, {"t": "this would require a tremendous amount of time", "c": 6}, {"t": ". "}, {"t": "It took Schawinski a whole week classifying just 50,000 galaxies", "c": 7}, {"t": ". He thought, “But what about the remaining 950,000?”"}]], "items": [{"c": 1, "w": "studied", "r": 해요. be kept + 형용사는 &#x27;~한 상태로 유지되다&#x27;예요. simply (단순히)는 부사라서 상태를 말하는 이 자리에 쓸 수 없어요. 바로 뒤의 with a very basic design(아주 기본적인 디자인으로)과도 simple이 어울려요."}, {"c": 3, "w": "getting", "r": "to get", "gw": "시작하기", "gr": "시작하도록", "fb": "This allowed those who wanted to participate <span class=\"d\">getting</span> started quickly", "fg": "This allowed those who wanted to participate <span class=\"d\">to get</span> started quickly", "ko": "이것은 참여하기를 원하는 사람들이 빠르게 시작할 수 있게 했다.", "why": "<b>allow + 목적어 + to V</b>는 &#x27;목적어가 ~하도록 허락하다&#x27;예요. This allowed those who wanted to participate to get started quickly (이것은 참여하고 싶은 사람들이 빠르게 시작하도록 해 주었다)에서 those who wanted to participate가 목적어이고 그 뒤에 <b>to get</b>이 와야 해요. getting started는 allow 뒤에서 쓰는 모양이 아니에요."}, {"c": 5, "w": "clicking", "r": "to click", "gw": "클릭하기", "gr": "클릭하도록", "fb": "they were shown an image of a galaxy and asked <span class=\"d\">clicking</span> buttons that described its features", "fg": "they were shown an image of a galaxy and asked <span class=\"d\">to click</span> buttons that described its features", "ko": "그런 다음 그들에게 은하 이미지가 보여졌고, 그것의 특징을 설명하는 버튼을 클릭하도록 요청받았다.", "why": "<b>were shown ... and asked to click(보여졌고 ... 클릭하도록 요청받았다)</b>에서 asked는 수동태예요. ask + 사람 + to V (~에게 ~하라고 요청하다)의 수동이라 be asked to V 뒤에는 <b>to click</b>이 와요. asked clicking은 틀려요. were shown과 asked가 and로 이어져 둘 다 수동인 것은 맞아요."}], "keep": "Lintott suggested that he turn (Lintott은 그가 의지할 것을 제안했다)은 suggest 뒤 that절에서 동사원형 turn을 쓰는 규칙이라 맞아요. New visitors were greeted with ... a brief tutorial that explained (신규 방문자들은 ... 간단한 사용 지침과 함께 환영받았다)는 수동태가 맞고, were able to classify (분류할 수 있었다)는 be able to + 동사원형이라 그대로 둬요.", "flow": "어법상 어색한 곳은 밑줄 친 문장 중에서만 찾아요. 이 글은 Galaxy Zoo가 어떻게 만들어졌는지 설명해요. allow, ask 같은 동사 뒤에 어떤 모양이 오는지, be kept 뒤에 형용사가 오는지를 보세요.", "ko": "어느 날 퇴근 후 저녁, Schawinski는 Chris Lintott이라는 이름의 친구를 만나서 그 상황에 대해 불평했다. Lintott은 다른 사람들에게 도움을 요청하기 위해 인터넷에 의지할 것을 제안했다. 결국, 그 두 남자는 Galaxy Zoo라고 알려진 대중을 참여시키는(= 크라우드소싱) 온라인 프로젝트를 시작하게 되었다. 그 웹사이트는 매우 기본적인 디자인과 사용하기 쉬운 인터페이스로 최대한 단순하게 유지되었다. 이것은 참여하기를 원하는 사람들이 빠르게 시작할 수 있게 했다. 신규 방문자들은 프로젝트에 대해 설명하는 간단한 사용 지침과 함께 환영받았다. 그런 다음 그들에게 은하 이미지가 보여졌고, 그것의 특징을 설명하는 버튼을 클릭하도록 요청받았다. 은하가 매끄럽고 둥근가? 그것의 모양은 타원형인가 아니면 나선형인가? 사용 지침의 완료와 약간의 연습 후에, 참가자들은 효과적으로 은하를 분류할 수 있었다."}, {"id": "gram4", "kind": "gram", "n": 4, "title": null, "tko": null, "paras": [[{"t": "It was online media what helped spread the word about Galaxy Zoo", "c": 1}, {"t": ", bringing more and more participants to the website. "}, {"t": "Shortly after the website was launched, nearly 70,000 classifications were being made per hour", "c": 2}, {"t": ". In a year and a half, more than 80,000 individuals participated, and they made more than 75 million classifications. "}, {"t": "If it were not been for those participants", "c": 3}, {"t": ", Schawinski couldn’t have classified that many images. In fact, "}, {"t": "it would have taken him decades on his own", "c": 4}, {"t": "."}], [{"t": "More than 15 years have passed since the project first began in 2007", "c": 5}, {"t": ". Galaxy Zoo has now grown into "}, {"t": "Zooniverse, that is one of the most popular platforms on the Internet", "c": 6}, {"t": " for ordinary people who want to participate in science projects. It is more active than ever before, with about 2 million registered users worldwide. "}, {"t": "It now offers a wide range of projects in astronomy", "c": 7}, {"t": ", biology, physics, and more. If you want to get involved, you should definitely check it out!"}]], "items": [{"c": 1, "w": "what", "r": "that", "gw": "무엇", "gr": "~한 것은(강조)", "fb": "It was online media <span class=\"d\">what</span> helped spread the word about Galaxy Zoo", "fg": "It was online media <span class=\"d\">that</span> helped spread the word about Galaxy Zoo", "ko": "Galaxy Zoo에 대한 소문을 퍼뜨리는 데 도움을 준 것은 바로 온라인 미디어였고, 그 웹사이트에 점점 더 많은 참여자를 불러 모았다.", "why": "<b>It was ... that</b>은 &#x27;바로 ~가 ...했다&#x27;라고 강조하는 틀이에요. It was online media that helped spread the word (소문을 퍼뜨리는 데 도움을 준 것은 바로 온라인 미디어였다)에서 강조된 말 뒤에 that이 와요. what은 앞에 선행사 없이 &#x27;~하는 것&#x27;을 뜻하는데, 이미 online media가 앞에 있으니 쓸 수 없어요."}, {"c": 3, "w": "were", "r": "had", "gw": "~이었다", "gr": "~했었다", "fb": "If it <span class=\"d\">were</span> not been for those participants", "fg": "If it <span class=\"d\">had</span> not been for those participants", "ko": "그 참여자들이 없었다면, Schawinski는 그렇게 많은 이미지를 분류할 수 없었을 것이다.", "why": "뒤에 Schawinski couldn&#x27;t have classified (분류할 수 없었을 것이다)가 있어서 과거 사실의 반대를 말하는 가정법 과거완료예요. 그래서 if절은 <b>had not been</b>이어야 해요. If it had not been for those participants (그 참여자들이 없었다면)는 &#x27;~이 없었다면&#x27;이라는 관용 표현이에요. were not been은 be동사가 겹쳐서 틀려요."}, {"c": 6, "w": "that", "r": "which", "gw": "~인 것", "gr": "~인데(앞말 설명)", "fb": "Zooniverse, <span class=\"d\">that</span> is one of the most popular platforms on the Internet", "fg": "Zooniverse, <span class=\"d\">which</span> is one of the most popular platforms on the Internet", "ko": "Galaxy Zoo는 이제 Zooniverse로 성장했는데, 이것은 과학 프로젝트에 참여하고 싶어 하는 일반인들을 위한 인터넷에서 가장 인기 있는 플랫폼 중 하나이다.", "why": "쉼표(,) 뒤에서 앞의 Zooniverse를 덧붙여 설명하는 관계대명사는 <b>which</b>를 써요. 이것을 계속적 용법이라고 해요. Zooniverse, which is one of the most popular platforms (Zooniverse는 가장 인기 있는 플랫폼 중 하나인데)처럼요. 쉼표 뒤에는 that을 쓸 수 없어요."}], "keep": "Shortly after the website was launched ... were being made (웹사이트가 개설된 지 얼마 지나지 않아 ... 이루어지고 있었다)는 수동태 과거진행이 맞아요. it would have taken him decades (그에게 수십 년이 걸렸을 것이다)는 would have p.p.가 맞고, More than 15 years have passed since ... began (시작된 이래로 15년 이상이 지났다)은 현재완료와 since가 맞아요. It now offers a wide range of (광범위한 ...를 제공한다)는 a wide range of + 복수명사가 맞아요.", "flow": "어법상 어색한 곳은 밑줄 친 문장 중에서만 찾아요. 이 글은 Galaxy Zoo가 알려지고 Zooniverse로 커진 이야기예요. 강조하는 It was ~ that 틀인지, if절과 주절의 시제가 짝인지, 쉼표 뒤 관계사가 맞는지 보세요.", "ko": "Galaxy Zoo에 대한 소문을 퍼뜨리는 데 도움을 준 것은 바로 온라인 미디어였고, 그 웹사이트에 점점 더 많은 참여자를 불러 모았다. 웹사이트가 개설된 지 얼마 지나지 않아, 시간당 약 7만 건의 분류가 이루어지고 있었다. 일 년 반 만에, 8만 명 이상의 개인이 참여하였고, 그들은 7천5백만 건 이상의 분류를 해냈다. 그 참여자들이 없었다면, Schawinski는 그렇게 많은 이미지를 분류할 수 없었을 것이다. 사실, 그 혼자서는 수십 년이 걸렸을 것이다. 그 프로젝트가 2007년에 처음 시작된 이래로 15년 이상이 지났다. Galaxy Zoo는 이제 Zooniverse로 성장했는데, 이것은 과학 프로젝트에 참여하고 싶어 하는 일반인들을 위한 인터넷에서 가장 인기 있는 플랫폼 중 하나이다. 전 세계적으로 약 2백만 명의 등록된 사용자가 있는 그것은 그 어느 때보다 더 왕성하다. 현재 그것은 천문학, 생물학, 물리학 등에서 광범위한 프로젝트들을 제공하고 있다. 만약 당신이 참여하고 싶다면, 반드시 확인해 보아라!"}, {"id": "gram5", "kind": "gram", "n": 5, "title": "Chasing Steve", "tko": "Steve를 쫓아서", "paras": [[{"t": "In Alberta, Canada, there were some “aurora chasers” "}, {"t": "who formed an informal group online", "c": 1}, {"t": ". "}, {"t": "They would leave their homes at night and try to get exceptional photographs of auroras", "c": 2}, {"t": ". Then they would share them with the rest of the group."}], [{"t": "In the summer of 2014, "}, {"t": "the group members began to notice something strange to appear in the night sky", "c": 3}, {"t": ". There were unusual ribbons of green and purple light, "}, {"t": "some of them seemed to stretch for thousands of kilometers", "c": 4}, {"t": ". Sometimes they lasted for just a few minutes, while "}, {"t": "other times they remained in the sky for a whole hour", "c": 5}, {"t": ". "}, {"t": "They were similar in appearance to auroras", "c": 6}, {"t": ", yet they possessed some notably different features. "}, {"t": "Unsure of what were they", "c": 7}, {"t": ", the group decided to name the phenomenon “Steve,” based on a scene from an animated movie where some characters give that name to an unfamiliar object."}]], "items": [{"c": 3, "w": "to appear", "r": "appearing", "gw": "나타나도록", "gr": "나타나는 중인", "fb": "the group members began to notice something strange <span class=\"d\">to appear</span> in the night sky", "fg": "the group members began to notice something strange <span class=\"d\">appearing</span> in the night sky", "ko": "2014년 여름, 그 단체 구성원들은 밤하늘에 이상한 무언가가 나타나는 것을 알아채기 시작했다.", "why": "<b>notice + 목적어 + -ing</b>는 &#x27;~가 ...하는 것을 알아채다&#x27;예요. 지각동사(notice, see, hear 등) 뒤에서 목적어의 동작이 진행되는 모습을 나타낼 때 -ing를 써요. began to notice something strange appearing in the night sky (밤하늘에 이상한 무언가가 나타나는 것을 알아채기 시작했다)처럼 써요. notice 뒤에는 목적어 + to V를 쓰지 않아요."}, {"c": 4, "w": "them", "r": "which", "gw": "그것들", "gr": "그중(관계대명사)", "fb": "some of <span class=\"d\">them</span> seemed to stretch for thousands of kilometers", "fg": "some of <span class=\"d\">which</span> seemed to stretch for thousands of kilometers", "ko": "녹색과 보라색의 특이한 빛의 띠가 있었는데, 그중 일부는 수천 킬로미터에 걸쳐 뻗어 있는 것처럼 보였다.", "why": "쉼표 뒤에 <b>접속사 없이</b> 두 문장이 붙어 있어요. 대명사 them은 문장을 이어 주지 못해요. 앞 문장과 이으면서 &#x27;그중 일부는&#x27;이라는 뜻을 만드는 <b>some of which</b>를 써야 해요. ribbons of green and purple light, some of which seemed to stretch (녹색과 보라색 빛의 띠, 그중 일부는 뻗어 있는 것처럼 보였다)가 돼요."}, {"c": 7, "w": "were they", "r": "they were", "gw": "그것들은 ~였나", "gr": "그것들이 ~인지", "fb": "Unsure of what <span class=\"d\">were they</span>", "fg": "Unsure of what <span class=\"d\">they were</span>", "ko": "그것들이 무엇인지 확신하지 못한 그 단체는 등장인물들이 낯선 물체에 Steve라는 이름을 붙이는 한 애니메이션 영화의 장면을 바탕으로 이 현상을 ‘Steve’라고 이름 짓기로 결정했다.", "why": "<b>what they were</b>는 &#x27;그것들이 무엇인지&#x27;라는 간접의문문이에요. 간접의문문은 의문사 뒤에 &#x27;주어 + 동사&#x27; 순서로 써요. 그래서 what they were가 맞고, what were they는 직접 질문의 순서라 틀려요. Unsure of what they were (그것들이 무엇인지 확신하지 못한 채)는 주어 the group의 상태를 설명하는 분사구문이에요."}], "keep": "who formed an informal group online (온라인에서 비공식 단체를 결성한)은 선행사 aurora chasers 뒤 관계대명사 who가 맞아요. They would leave ... and try (집을 나서 ...시도하곤 했다)는 would 뒤 동사원형 병렬이 맞아요. they remained in the sky (하늘에 머물렀다)와 similar in appearance to auroras (생김새가 오로라와 비슷하다)도 모양이 맞아요.", "flow": "어법상 어색한 곳은 밑줄 친 문장 중에서만 찾아요. 이 글은 오로라 추적자들이 낯선 빛의 띠를 처음 본 이야기예요. 지각동사 notice 뒤 모양, 문장 두 개가 접속사 없이 붙지 않았는지, 간접의문문의 어순을 보세요.", "ko": "캐나다 앨버타주에는 온라인상에서 비공식 단체를 결성한 ‘오로라 추적자들’이 있었다. 그들은 밤에 집을 나서 특별한 오로라 사진을 찍으려고 하곤 했다. 그런 다음 그들은 단체의 나머지 사람들과 그것들을 공유하곤 했다. 2014년 여름, 그 단체 구성원들은 밤하늘에 이상한 무언가가 나타나는 것을 알아채기 시작했다. 녹색과 보라색의 특이한 빛의 띠가 있었는데, 그중 일부는 수천 킬로미터에 걸쳐 뻗어 있는 것처럼 보였다. 그것들은 어떤 때에는 단 몇 분간 지속되었지만, 다른 때에는 한 시간 내내 하늘에 머무르기도 했다. 그것들은 오로라와 생김새가 비슷했지만, 몇 가지 현저하게 다른 특징들을 지니고 있었다. 그것들이 무엇인지 확신하지 못한 그 단체는 등장인물들이 낯선 물체에 Steve라는 이름을 붙이는 한 애니메이션 영화의 장면을 바탕으로 이 현상을 ‘Steve’라고 이름 짓기로 결정했다."}, {"id": "gram6", "kind": "gram", "n": 6, "title": null, "tko": null, "paras": [[{"t": "After photographing Steve for several years and discussing what it might be, the group members decided to get help from experts. They showed their photos of Steve to a professor of astronomy at a local university and a scientist at NASA. Surprisingly, "}, {"t": "neither of them had any idea what Steve was", "c": 1}, {"t": ". They confirmed that it was not an aurora, but it did not resemble anything they had seen before. They realized that the group had discovered "}, {"t": "a new type of phenomenon that had never been properly studied", "c": 2}, {"t": ". In order to learn more about it, "}, {"t": "NASA funded a citizen science project involving the public", "c": 3}, {"t": ". The project asked ordinary people to gather photos of Steve and send them to NASA. It is still in progress today."}], [{"t": "In honor of the aurora chasers who first discovered the phenomenon, the name “Steve” has been kept. However, "}, {"t": "it is now written in all capital letters", "c": 4}, {"t": " and stands for “Strong Thermal Emission Velocity Enhancement.” Experts have acknowledged that "}, {"t": "it is the dedicated members of the aurora chasers group that deserves the credit for discovering STEVE", "c": 5}, {"t": ". "}, {"t": "If it had not been for them, it might remain unnoticed forever", "c": 6}, {"t": ". There are many interesting theories about STEVE, but "}, {"t": "none of them have proven for certain", "c": 7}, {"t": ". Scientists and citizens continue to collaborate to solve this mystery, and they are learning more and more about STEVE every day."}]], "items": [{"c": 5, "w": "deserves", "r": "deserve", "gw": "받을 만하다(단수)", "gr": "받을 만하다(복수)", "fb": "it is the dedicated members of the aurora chasers group that <span class=\"d\">deserves</span> the credit for discovering STEVE", "fg": "it is the dedicated members of the aurora chasers group that <span class=\"d\">deserve</span> the credit for discovering STEVE", "ko": "전문가들은 STEVE를 발견한 공로를 인정받아야 할 사람들은 바로 오로라 추적자 단체의 헌신적인 구성원들임을 인정했다.", "why": "<b>It is ... that</b> 강조 구문에서 that 뒤 동사는 강조된 말에 맞춰요. 강조된 말은 <b>the dedicated members(헌신적인 구성원들)</b>로 복수예요. 그래서 that deserve the credit (공로를 인정받아야 하는)처럼 복수 동사 deserve를 써야 해요. 바로 앞의 group은 단수처럼 보이지만 members를 꾸미는 말이라 동사의 주어가 아니에요."}, {"c": 6, "w": "remain", "r": "have remained", "gw": "남아 있다", "gr": "남아 있었을 것이다", "fb": "If it had not been for them, it might <span class=\"d\">remain</span> unnoticed forever", "fg": "If it had not been for them, it might <span class=\"d\">have remained</span> unnoticed forever", "ko": "만약 그들이 아니었다면, 그것은 영원히 알려지지 못한 상태로 남았을지도 모른다.", "why": "if절이 <b>If it had not been for them(그들이 아니었다면)</b>으로 과거 사실의 반대예요. 이때 주절은 would/might + have p.p.를 써요. 그래서 it might have remained unnoticed forever (영원히 알려지지 못한 채 남았을지도 모른다)가 돼요. might remain은 과거에 일어나지 않은 일을 현재나 미래 이야기처럼 바꿔서 if절과 짝이 맞지 않아요."}, {"c": 7, "w": "have proven", "r": "have been proven", "gw": "증명했다", "gr": "증명되었다", "fb": "none of them <span class=\"d\">have proven</span> for certain", "fg": "none of them <span class=\"d\">have been proven</span> for certain", "ko": "STEVE에 대한 흥미로운 이론들은 많지만, 그들 중 어느 것도 확실하게 증명된 것은 없다.", "why": "주어 <b>none of them(그것들 중 어느 것도)</b>은 앞에 나온 이론들이에요. 이론은 스스로 증명하는 게 아니라 <b>증명되는</b> 쪽이라서 수동태 have been proven이 맞아요. none of them have been proven for certain (그것들 중 어느 것도 확실하게 증명되지 않았다)이 돼요. 동사 prove (증명하다)의 과거분사 proven이 수동에 쓰인 거예요. have proven은 능동이라 뜻이 맞지 않아요."}], "keep": "neither of them had any idea what Steve was (둘 중 누구도 Steve가 무엇인지 알지 못했다)는 간접의문문이라 what Steve was 순서가 맞아요. a new type of phenomenon that had never been properly studied (제대로 연구된 적이 없는 새로운 유형의 현상)는 수동 과거완료가 맞고, NASA funded a citizen science project involving the public (대중이 참여하는 시민 과학 프로젝트에 자금을 제공했다)은 project를 꾸미는 -ing라 맞아요. it is now written in all capital letters (이제 모두 대문자로 쓰인다)도 수동이 맞아요.", "flow": "어법상 어색한 곳은 밑줄 친 문장 중에서만 찾아요. 이 글은 Steve가 전문가에게 가서 이름이 정해지고 연구되는 이야기예요. 강조 구문의 동사 수, if절과 주절의 짝, 능동인지 수동인지를 보세요.", "ko": "몇 년 동안 Steve의 사진을 찍고 그것이 무엇일지에 대해 논의한 후에, 그 단체 구성원들은 전문가들로부터 도움을 받기로 결정했다. 그들은 Steve의 사진들을 지역 대학의 천문학 교수와 NASA의 과학자에게 보여주었다. 놀랍게도, 둘 중 누구도 Steve가 무엇인지 전혀 알지 못했다. 그들은 그것이 오로라가 아니라는 것은 확인했지만, 그것은 그들이 이전에 보았던 어느 것과도 비슷하지 않았다. 그들은 그 단체가 제대로 연구된 적이 없는 새로운 유형의 현상을 발견했다는 것을 깨달았다. 이에 대해 더 자세히 알아보기 위해, NASA는 대중이 참여하는 시민 과학 프로젝트에 자금을 제공했다. 그 프로젝트는 일반인들에게 Steve의 사진을 모아서 NASA에 보내달라고 요청했다. 그것은 오늘날에도 여전히 진행 중이다. 이 현상을 처음 발견한 오로라 추적자들에게 경의를 표하여 ‘Steve’라는 이름은 유지되었다. 그러나, 그것은 이제 모두 대문자로 쓰이며, ‘속도 증가에 따른 강한 열 방출(Strong Thermal Emission Velocity Enhancement)’을 의미한다. 전문가들은 STEVE를 발견한 공로를 인정받아야 할 사람들은 바로 오로라 추적자 단체의 헌신적인 구성원들임을 인정했다. 만약 그들이 아니었다면, 그것은 영원히 알려지지 못한 상태로 남았을지도 모른다. STEVE에 대한 흥미로운 이론들은 많지만, 그들 중 어느 것도 확실하게 증명된 것은 없다. 과학자들과 시민들은 이 수수께끼를 풀기 위해 계속 협력하며, 매일 STEVE에 대해 점점 더 많은 것을 알아가고 있다."}, {"id": "gram7", "kind": "gram", "n": 7, "title": null, "tko": null, "paras": [[{"t": "Most of the individuals involving in these two projects", "c": 1}, {"t": " are not professional scientists. Instead, they are citizen scientists—"}, {"t": "ordinary people who desire to help advance science", "c": 2}, {"t": " in areas that they are interested in. "}, {"t": "Even though citizen scientists may not have science degrees", "c": 3}, {"t": " or long, white lab coats, "}, {"t": "they are still capable of making valuable contributions to science", "c": 4}, {"t": ". You can become one as well "}, {"t": "if you had curiosity and an interest in taking part in scientific research", "c": 5}, {"t": ". "}, {"t": "The next great scientific achievement could be made by citizen scientists volunteered their time", "c": 6}, {"t": " for the purpose of better understanding the world."}]], "items": [{"c": 1, "w": "involving", "r": "involved", "gw": "포함하는", "gr": "참여한", "fb": "Most of the individuals <span class=\"d\">involving</span> in these two projects", "fg": "Most of the individuals <span class=\"d\">involved</span> in these two projects", "ko": "이 두 프로젝트에 참여한 대부분의 개인들은 전문 과학자가 아니다.", "why": "individuals(개인들)는 프로젝트에 &#x27;참여한&#x27; 사람들이에요. 사람이 스스로 프로젝트를 포함시키는 게 아니라 프로젝트에 엮이게 된 쪽이라서 수동 뜻의 과거분사가 와요. individuals involved in these two projects (이 두 프로젝트에 참여한 개인들)가 맞아요. be involved in은 &#x27;~에 참여하다&#x27;로 외워 두면 돼요. involving은 &#x27;포함하는&#x27;이라 사람과 맞지 않아요."}, {"c": 5, "w": "had", "r": "have", "gw": "있었다면", "gr": "있다면", "fb": "if you <span class=\"d\">had</span> curiosity and an interest in taking part in scientific research", "fg": "if you <span class=\"d\">have</span> curiosity and an interest in taking part in scientific research", "ko": "호기심과 과학 연구에 참여하는 것에 대한 관심이 있다면 당신도 시민 과학자가 될 수 있다.", "why": "주절이 <b>You can become one(당신도 될 수 있다)</b>으로 현재 이야기예요. 실제로 가능한 조건이라서 if절은 현재형을 써요. if you have curiosity and an interest ... (호기심과 관심이 있다면)이 맞아요. had는 과거 시제라서 가정법 과거로 읽히는데, 그러면 주절이 would/could여야 하고 여기는 can이라 짝이 맞지 않아요."}, {"c": 6, "w": "volunteered", "r": "volunteering", "gw": "자원했다", "gr": "자원하는", "fb": "The next great scientific achievement could be made by citizen scientists <span class=\"d\">volunteered</span> their time", "fg": "The next great scientific achievement could be made by citizen scientists <span class=\"d\">volunteering</span> their time", "ko": "다음 위대한 과학적 업적은 세상을 더 잘 이해하기 위한 목적으로 자신의 시간을 자발적으로 제공하는 시민 과학자들에 의해 이루어질 수도 있다.", "why": "문장의 동사는 이미 <b>could be made</b>예요. 그 뒤 citizen scientists는 by(~에 의해)의 목적어이고, 그 뒤에 volunteered (자원했다)를 또 쓰면 동사가 두 개가 돼요. citizen scientists를 &#x27;자기 시간을 자발적으로 내는&#x27;이라고 뒤에서 꾸미는 현재분사 <b>volunteering</b>이 맞아요. 시민 과학자는 스스로 시간을 내는 쪽이라 능동 -ing예요."}], "keep": "ordinary people who desire to help advance science (과학의 발전을 돕고자 하는 평범한 사람들)는 desire + to V와 help + 동사원형이 맞아요. Even though citizen scientists may not have ... (시민 과학자들에게 ...이 없을 수 있지만)은 양보 접속사 뒤에 완전한 문장이 와서 맞고, they are still capable of making (여전히 ~할 수 있다)는 전치사 of 뒤 -ing라 맞아요.", "flow": "어법상 어색한 곳은 밑줄 친 문장 중에서만 찾아요. 이 글은 시민 과학자가 누구인지 정리하는 마무리예요. 동사가 이미 있는데 또 나온 건 아닌지, 분사가 능동인지 수동인지, if절 시제가 주절과 짝이 맞는지 보세요.", "ko": "이 두 프로젝트에 참여한 대부분의 개인들은 전문 과학자가 아니다. 대신, 그들은 시민 과학자들인데, 그들은 자신이 관심 있는 분야에서 과학의 발전을 돕고자 하는 평범한 사람들이다. 시민 과학자들에게 과학 학위나 길고 흰 가운은 없을 수 있지만, 그들은 여전히 과학에 귀중한 기여를 할 수 있다. 호기심과 과학 연구에 참여하는 것에 대한 관심이 있다면 당신도 시민 과학자가 될 수 있다. 다음 위대한 과학적 업적은 세상을 더 잘 이해하기 위한 목적으로 자신의 시간을 자발적으로 제공하는 시민 과학자들에 의해 이루어질 수도 있다."}];

function $(i){return document.getElementById(i)}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function html(t,c,h){var e=el(t,c);e.innerHTML=h;return e}
function R(q){return S.res[q.id]||(S.res[q.id]={sel:[],done:false})}
function truth(q){return q.items.map(function(i){return i.c})}
function isOk(q){var r=R(q),t=truth(q);return r.done&&r.sel.length===t.length&&t.every(function(c){return r.sel.indexOf(c)>=0})}
function nm(q){return (q.kind==='ctx'?'문맥 ':'어법 ')+q.n+'번 글'}
function show(w){['home','quiz'].forEach(function(i){$(i).classList.toggle('hide',i!==w)});window.scrollTo(0,0)}

var WNA='awk';
function wnNote(host,mode){ /* host: 요소 뒤에 안내 줄 삽입 */
  var d=document.createElement('div');d.id='wnote';d.style.cssText='margin:8px 0;font-size:14px;color:#57534e';
  host.parentNode.insertBefore(d,host.nextSibling);return d}
function wnRender(d,fin){
  if(WN.MODE){
    d.innerHTML=WN.MIX?WN.mixNote(fin):'<b>오답 다시 풀기</b> · 오답 노트에 담은 문제만 보여요. <a href="../wrong.html" style="color:#0f766e;text-decoration:underline">오답 노트 보기 ›</a>'+(fin?'<div style="margin-top:6px">이제 안 봐도 되는 문제는 오답 노트에서 \'빼기\'로 뺄 수 있어요.</div>':'');
  }else{
    var n=WN.ids('L2',PART,WNA).length;
    d.innerHTML=n?'<a href="../wrong.html" style="font-size:13px;color:#0f766e;text-decoration:underline">틀린 '+n+'개가 오답 노트에 담겼어요 ›</a>':''}
}
function wnEmpty(host){
  var m=document.createElement('div');m.style.cssText='margin:24px 0;padding:18px;border:1px solid #d6d3d1;border-radius:12px;text-align:center;font-size:16px';
  m.innerHTML='오답 노트에 담긴 문제가 없어요.<div style="margin-top:8px"><a href="../wrong.html" style="color:#0f766e;text-decoration:underline">오답 노트로 가기 ›</a></div>';
  host.parentNode.insertBefore(m,host.nextSibling)}
function home(){
  S.cur=null;save();show('home');
  var _hw=$('wnote');if(!_hw){_hw=wnNote($('ptxt').parentNode.querySelector('.how'));}wnRender(_hw,WN.MODE&&Q.length>0&&Q.every(function(x){return R(x).done}));
  if(WEMPTY&&!$('wnempty')){wnEmpty(_hw);_hw.nextSibling.id='wnempty'}
  var done=0,ok=0;Q.forEach(function(q){if(R(q).done){done++;if(isOk(q))ok++}});
  $('pb').style.width=(100*done/Q.length)+'%';
  $('ptxt').textContent=done+'/'+Q.length+'개 풀었어요 · '+ok+'개 맞았어요';
  var first=Q.filter(function(q){return !R(q).done})[0];
  var c=$('cont');
  if(first){c.classList.remove('hide');c.textContent=(done?'이어서 풀기 · ':'시작하기 · ')+nm(first);c.onclick=function(){open(first.id)}}
  else{c.classList.add('hide')}
  var L=$('lists');L.innerHTML='';
  [['ctx','문맥상 어색한 것 찾기'],['gram','어법상 어색한 것 찾기']].forEach(function(g){
    L.appendChild(el('h2',null,g[1]));var box=el('div','list');
    Q.filter(function(q){return q.kind===g[0]}).forEach(function(q){
      var r=R(q),b=el('button','li');
      var left=el('div');left.appendChild(document.createTextNode(nm(q)));left.appendChild(el('small',null,'어색한 곳 '+q.items.length+'개 고르기'));
      var st=el('span','st',r.done?(isOk(q)?'○ 정답':'× 다시 보기'):(r.sel.length?'푸는 중':'아직 안 풂'));
      if(r.done)st.classList.add(isOk(q)?'ok':'ng');else if(r.sel.length)st.classList.add('ing');
      b.appendChild(left);b.appendChild(st);b.onclick=function(){open(q.id)};box.appendChild(b)});
    L.appendChild(box)});
}
function qById(id){return Q.filter(function(q){return q.id===id})[0]}
function open(id){S.cur=id;save();draw(qById(id));show('quiz')}
function draw(q){
  var r=R(q),n=q.items.length,idx=Q.indexOf(q);
  $('qn').textContent=nm(q)+' ('+(idx+1)+'/'+Q.length+')';
  $('ask').innerHTML='밑줄 친 곳 중 <b>'+(q.kind==='ctx'?'문맥상':'어법상')+' 어색한 것 '+n+'개</b>를 고르세요.';
  var ps=$('ps');ps.innerHTML='';ps.classList.toggle('locked',r.done);
  var _om=$('wman');if(_om)_om.remove();
  var _mb=WN.manual({kind:'L2',part:PART,act:'awk',qid:q.id,label:'어색한 곳('+(q.kind==='ctx'?'문맥':'어법')+') · '+(q.ko||'').replace(/\s+/g,' ').slice(0,16)+'…'});
  if(_mb){var _mw=document.createElement('div');_mw.id='wman';_mw.appendChild(_mb);$('ask').parentNode.insertBefore(_mw,$('ask').nextSibling)}
  if(q.title){var tp=el('p','ptitle');tp.textContent=q.title+' ';var sp=el('span',null,'('+q.tko+')');sp.style.cssText='color:var(--sub);font-size:15px;font-weight:600';tp.appendChild(sp);ps.appendChild(tp)}
  var T=truth(q);
  q.paras.forEach(function(p){
    var pe=el('p');
    p.forEach(function(s){
      if(!s.c){pe.appendChild(document.createTextNode(s.t));return}
      var c=el('span','cd');c.setAttribute('data-c',s.c);c.appendChild(document.createTextNode(s.t));
      c.appendChild(el('sup',null,CIRC.charAt(s.c-1)));
      var picked=r.sel.indexOf(s.c)>=0,isT=T.indexOf(s.c)>=0;
      if(r.done){
        if(picked&&isT)c.classList.add('hit');else if(isT)c.classList.add('miss');else if(picked)c.classList.add('bad');
        if(isT){var it=q.items.filter(function(i){return i.c===s.c})[0];pe.appendChild(c);pe.appendChild(el('span','fx',' → '+it.r+' '));return}
      }else{
        if(picked)c.classList.add('sel');
        c.onclick=function(){toggle(q,s.c)};
      }
      pe.appendChild(c);
    });
    ps.appendChild(pe)});
  var sub=$('submit'),cnt=$('cnt');
  if(r.done){sub.classList.add('hide');cnt.classList.add('hide');result(q)}
  else{sub.classList.remove('hide');cnt.classList.remove('hide');$('res').classList.add('hide');upd(q)}
}
function upd(q){var r=R(q),n=q.items.length;$('cnt').innerHTML='선택한 곳 <b>'+r.sel.length+'</b> / '+n+(r.sel.length?' · '+r.sel.slice().sort(function(a,b){return a-b}).map(function(c){return CIRC.charAt(c-1)}).join(' '):'');$('submit').disabled=r.sel.length!==n}
function toggle(q,c){
  var r=R(q);if(r.done)return;
  var i=r.sel.indexOf(c);
  if(i>=0)r.sel.splice(i,1);else{if(r.sel.length>=q.items.length)return;r.sel.push(c)}
  save();
  var e=document.querySelector('.cd[data-c="'+c+'"]');if(e)e.classList.toggle('sel',r.sel.indexOf(c)>=0);upd(q);
}
$('submit').onclick=function(){var q=qById(S.cur),r=R(q);if(r.sel.length!==q.items.length)return;r.done=true;if(!isOk(q)){var _k=(q.ko||'').replace(/\s+/g,' ');WN.add({kind:'L2',part:PART,act:'awk',qid:q.id,label:'어색한 곳('+(q.kind==='ctx'?'문맥':'어법')+') · '+_k.slice(0,16)+'…'})}
if(!S.marked&&Q.every(function(x){return R(x).done})){S.marked=1;if(WN.MIX)WN.finish();if(!WN.MODE){try{if(window.PG)PG.mark(PGK)}catch(e){}}}save();draw(q);setTimeout(function(){var x=$('res');if(x.scrollIntoView)x.scrollIntoView({behavior:'smooth',block:'start'})},30)};
function result(q){
  var r=R(q),res=$('res');res.innerHTML='';res.classList.remove('hide');
  var T=truth(q),got=r.sel.filter(function(c){return T.indexOf(c)>=0}).length,ok=isOk(q);
  res.appendChild(el('div','verdict '+(ok?'ok':'ng'),ok?'○ 모두 맞았어요':'× 어색한 곳 '+q.items.length+'개 중 '+got+'개를 찾았어요'));
  q.items.forEach(function(it,ii){
    var d=el('div','it'),h=el('div','ih');
    h.appendChild(el('span','no','('+(ii+1)+')'));
    var hit=r.sel.indexOf(it.c)>=0;
    h.appendChild(el('span','tag '+(hit?'y':'n'),(hit?'찾았어요 ':'놓쳤어요 ')+CIRC.charAt(it.c-1)));
    var ia=el('span','ia');ia.appendChild(el('span','x',it.w));ia.appendChild(document.createTextNode(' '));ia.appendChild(el('em',null,'('+it.gw+')'));ia.appendChild(document.createTextNode(' → '));ia.appendChild(el('span','r',it.r));ia.appendChild(document.createTextNode(' '));ia.appendChild(el('em',null,'('+it.gr+')'));
    h.appendChild(ia);d.appendChild(h);
    var f=el('div','fix');
    if(it.fb)f.appendChild(html('span','l bad','<small>틀린 문장</small>'+it.fb));
    f.appendChild(html('span','l good','<small>고친 문장</small>'+it.fg));d.appendChild(f);
    d.appendChild(el('div','kot',it.ko));
    d.appendChild(html('div','why',it.why));
    res.appendChild(d)});
  var wrongPick=r.sel.filter(function(c){return T.indexOf(c)<0});
  if(wrongPick.length){res.appendChild(html('div','note','<b>잘못 고른 곳</b> '+wrongPick.map(function(c){return CIRC.charAt(c-1)}).join(' ')+'은(는) 글의 흐름과 문법에 맞는 표현이라 그대로 둬요.'))}
  if(WN.MIX){WN.finish();res.appendChild(html('div','note','틀린 문제는 <a href="../wrong.html" style="color:#0f766e;text-decoration:underline">오답 노트</a>에 담겨요.'))}
  else if(WN.MODE){res.appendChild(html('div','note','이제 안 봐도 되는 문제는 <a href="../wrong.html" style="color:#0f766e;text-decoration:underline">오답 노트</a>에서 \'빼기\'로 뺄 수 있어요.'))}
  else if(WN.has('L2',PART,'awk',q.id)){res.appendChild(html('div','note','<a href="../wrong.html" style="color:#0f766e;text-decoration:underline">틀린 '+WN.ids('L2',PART,'awk').length+'개가 오답 노트에 담겼어요 ›</a>'))}
  res.appendChild(html('div','note','<b>글의 흐름</b> '+q.flow));
  res.appendChild(html('div','note','<b>그대로 두는 부분</b> '+q.keep));
  var kb=el('div','kobox');kb.textContent=q.ko;
  var row=el('div','row');
  var bk=el('button','btn','한글 해석 보기');bk.onclick=function(){var on=kb.classList.toggle('on');bk.textContent=on?'한글 해석 닫기':'한글 해석 보기'};
  res.appendChild(bk);res.appendChild(kb);
  var idx=Q.indexOf(q),nx=Q[idx+1];
  var again=el('button','big alt','이 문제 다시 풀기');again.onclick=function(){S.res[q.id]={sel:[],done:false};save();draw(q);window.scrollTo(0,0)};
  var next=el('button','big',nx?'다음 문제 · '+nm(nx):'목록으로');next.onclick=function(){if(nx)open(nx.id);else home()};
  row.appendChild(again);row.appendChild(next);res.appendChild(row);
}
$('toHome').onclick=home;
$('resetAll').onclick=function(){if(!confirm('푼 기록을 모두 지우고 처음부터 할까요?'))return;S={res:{},cur:null};save();home()};
if(S.cur&&qById(S.cur))open(S.cur);else home();
</script><script src="../../common/prog.js?v=261019"></script><script>if(!WN.MODE)PG.bar(PGK,"풀었어요")</script></body></html>
