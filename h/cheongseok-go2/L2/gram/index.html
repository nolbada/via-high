<style>

 --gd:#15803d;--gl:#c6efcf;--bd:#1d4ed8;--bl:#cfe0fb;--kd:#be185d;--kl:#fbcfe3;--od:#c2570c;--ol:#ffe0b8}

ibutions to ~는 무슨 뜻인가?", "a": "~에 기여하다", "p": "contributions to"}, {"t": "them = citizen science projects (시민 과학 프로젝트들)", "c": "o", "x": "two of them의 them은 앞 문장의 numerous citizen science projects(수많은 시민 과학 프로젝트들)를 가리킨다. ‘그 프로젝트들 중 두 가지’를 살펴보자는 뜻이다.", "n": ["them = citizen science projects"], "q": "two of them의 them은 무엇인가?", "a": "시민 과학 프로젝트들 (citizen science projects)", "p": "them"}, {"t": "take a look at ~ : ~을 살펴보다", "c": "g", "x": "Let’s take a look at two of them은 ‘그중 두 가지를 살펴보자’라는 뜻이다. Let’s + 동사원형은 ‘~하자’라는 권유의 표현이다. take a look at ~은 ‘~을 한번 살펴보다’라는 뜻이다. look at ~과 같은 뜻이지만, 가볍게 ‘한번 본다’는 느낌이 있다.", "n": ["Let’s + 동사원형 = ~하자", "take a look at ~ = ~을 살펴보다"], "q": "Let’s take a look at two of them은 무슨 뜻인가?", "a": "그중 두 가지를 살펴보자", "p": "Let’s take a look at"}]}, {"no": 2, "id": "z2", "sents": [{"n": 7, "mk": "Kevin Schawinski was a young astronomy researcher [1|studying black holes and the evolution of galaxies] at the University of Oxford.", "en": "Kevin Schawinski was a young astronomy researcher studying black holes and the evolution of galaxies at the University of Oxford.", "ko": "Kevin Schawinski는 옥스퍼드 대학에서 블랙홀과 은하의 진화를 연구하는 젊은 천문학 연구원이었다."}, {"n": 8, "mk": "[2|This] might [3|sound exciting], but his job there was dull and time-consuming.", "en": "This might sound exciting, but his job there was dull and time-consuming.", "ko": "이것이 흥미롭게 들릴지도 모르지만, 그곳에서 그의 일은 따분하고 시간이 많이 걸리는 일이었다."}, {"n": 9, "mk": "He [4|had to] classify around one million images of galaxies [5|according to] their shape.", "en": "He had to classify around one million images of galaxies according to their shape.", "ko": "그는 약 백만 장의 은하 이미지를 모양에 따라 분류해야 했다."}, {"n": 10, "mk": "[6|Since] [7|they] all [8|looked similar but were actually shaped slightly differently], [9|the best way to do] [10|this] [11|was to sort] them [12|while looking at] each one individually.", "en": "Since they all looked similar but were actually shaped slightly differently, the best way to do this was to sort them while looking at each one individually.", "ko": "그것들은 모두 비슷해 보이지만 사실 모양이 조금씩 달랐기 때문에, 그것을 해내는 가장 좋은 방법은 하나하나를 개별적으로 보면서 분류하는 것이었다."}, {"n": 11, "mk": "Of course, this [13|would] require [14|a tremendous amount of time].", "en": "Of course, this would require a tremendous amount of time.", "ko": "물론, 이것은 엄청난 시간이 필요할 것이었다."}, {"n": 12, "mk": "[15|It took] Schawinski [16|a whole week] [15|to classify] [16|just] 50,000 galaxies.", "en": "It took Schawinski a whole week to classify just 50,000 galaxies.", "ko": "Schawinski가 고작 5만 개의 은하를 분류하는 데 꼬박 일주일이 걸렸다."}, {"n": 13, "mk": "He thought, “But [17|what about] [18|the remaining 950,000]?”", "en": "He thought, “But what about the remaining 950,000?”", "ko": "그는 ‘하지만 남아 있는 95만 개는 어쩌지?’라고 생각했다."}], "items": [{"t": "명사 + 현재분사구 : researcher studying ~ (후치수식)", "c": "k", "x": "a young astronomy researcher studying black holes and the evolution of galaxies는 ‘블랙홀과 은하의 진화를 연구하는 젊은 천문학 연구원’이라는 뜻이다. studying이 앞 명사 researcher를 뒤에서 꾸미는 현재분사이다. 연구원이 ‘연구하는’ 주체라서 능동의 뜻인 -ing를 쓴다. who was studying(연구하고 있던)으로 바꿔 쓸 수 있다. black holes와 the evolution of galaxies는 and로 이어진 병렬 목적어이다.", "n": ["명사 + -ing ~ = ~하는 (명사)", "= a researcher who was studying ~"], "q": "researcher studying black holes는 어떻게 해석하는가?", "a": "블랙홀을 연구하는 연구원", "p": "studying black holes and the evolution of galaxies"}, {"t": "This = his research (그의 연구)", "c": "o", "x": "This might sound exciting의 This는 앞 문장에서 말한 Schawinski의 연구(블랙홀과 은하의 진화를 연구하는 일)를 가리킨다. this는 앞에 나온 내용 전체를 받는 데도 쓴다.", "n": ["This = his research (앞 문장의 내용)"], "q": "This might sound exciting의 This는 무엇을 가리키는가?", "a": "Schawinski의 연구 (블랙홀과 은하의 진화를 연구하는 일)", "p": "This"}, {"t": "sound + 형용사 : ~하게 들리다", "c": "b", "x": "This might sound exciting은 ‘이것은 흥미롭게 들릴지도 모른다’라는 뜻이다. sound는 ‘~하게 들리다’라는 뜻의 감각동사로, 뒤에 부사가 아니라 형용사(exciting)가 온다. might는 ‘~일지도 모른다’는 약한 추측이다. 뒤의 but은 ‘흥미롭게 들리지만 실제 일은 따분했다’는 반대 내용을 이어 준다. dull(따분한)과 time-consuming(시간이 많이 걸리는)은 and로 이어진 형용사 병렬이다.", "n": ["sound + 형용사 = ~하게 들리다", "dull and time-consuming = 형용사 병렬"], "q": "sound 뒤에는 부사와 형용사 중 무엇이 오는가?", "a": "형용사 (sound exciting)", "p": "sound exciting"}, {"t": "had to V : ~해야 했다", "c": "b", "x": "He had to classify는 ‘그는 분류해야 했다’라는 뜻이다. had to는 have to(~해야 한다)의 과거형으로 ‘~해야 했다’라는 뜻이고, 뒤에는 동사원형 classify가 온다. around는 여기서 ‘약, 대략’이라는 뜻의 부사이다. classify는 ‘~을 분류하다’라는 뜻이다.", "n": ["had to + 동사원형 = ~해야 했다", "around + 숫자 = 약 ~"], "q": "He had to classify ...는 어떻게 해석하는가?", "a": "그는 분류해야 했다", "p": "had to"}, {"t": "according to ~ : ~에 따라", "c": "g", "x": "according to their shape는 ‘그것들의 모양에 따라’라는 뜻이다. according to ~는 ‘~에 따라, ~에 의하면’이라는 뜻이고 to 뒤에 명사가 온다. 여기서 their는 galaxies(은하들)를 가리킨다.", "n": ["according to ~ = ~에 따라, ~에 의하면"], "q": "according to their shape는 무슨 뜻인가?", "a": "그것들(은하)의 모양에 따라", "p": "according to"}, {"t": "접속사 Since : ~이기 때문에 (이유)", "c": "b", "x": "Since they all looked similar ...는 ‘그것들은 모두 비슷해 보였기 때문에’라는 뜻이다. since는 ‘~이기 때문에’라는 이유의 접속사로 쓰였다. since에는 ‘~한 이후로’라는 뜻도 있지만, 여기서는 뒤에 이유와 결과의 흐름이 이어지므로 ‘~때문에’로 해석한다. 뒤의 the best way ... was ...가 그 결과에 해당하는 주절이다.", "n": ["Since + 절, 주절 = ~이기 때문에, …이다 (이유)", "since = ~이후로 (시간) 도 있음 → 문맥으로 판단"], "q": "여기서 Since는 어떤 뜻인가?", "a": "~이기 때문에 (이유)", "p": "Since"}, {"t": "they = images of galaxies (은하 이미지들)", "c": "o", "x": "Since they all looked similar의 they는 앞 문장의 images of galaxies(은하 이미지들)를 가리킨다. all은 they와 같은 대상을 가리켜 ‘모두’라는 뜻을 더한다.", "n": ["they = images of galaxies"], "q": "they all looked similar의 they는 무엇을 가리키는가?", "a": "은하 이미지들 (images of galaxies)", "p": "they"}, {"t": "look + 형용사 · be shaped + 부사 : ~해 보이다 · 모양이 ~하다", "c": "b", "x": "looked similar but were actually shaped slightly differently는 ‘모두 비슷해 보였지만 사실 모양이 조금씩 달랐다’라는 뜻이다. looked similar는 look + 형용사로 ‘비슷해 보이다’이다. were shaped는 shape(~의 모양을 만들다)의 수동태이고, slightly differently(조금 다르게)는 부사이다. looked와 were shaped는 but으로 이어진 병렬 동사이고 주어 they를 함께 쓴다.", "n": ["look + 형용사 = ~해 보이다", "be shaped + 부사 = 모양이 ~하다", "looked ~ but were shaped = 병렬 동사"], "q": "were actually shaped slightly differently는 무슨 뜻인가?", "a": "사실 모양이 조금씩 달랐다", "p": "looked similar but were actually shaped slightly differently"}, {"t": "명사 + to부정사 : the best way to do ~ (~하는 방법)", "c": "b", "x": "the best way to do this는 ‘이것을 하는 가장 좋은 방법’이라는 뜻이다. to do this가 앞 명사 the best way를 뒤에서 꾸미는 형용사적 용법의 to부정사이다. way 뒤의 to부정사는 ‘~하는 (방법)’으로 해석한다. best는 good의 최상급으로 ‘가장 좋은’이라는 뜻이다.", "n": ["명사 + to V = ~할 (명사)", "the best way to do ~ = ~하는 가장 좋은 방법"], "q": "the best way to do this에서 to do this는 무엇을 꾸미는가?", "a": "the best way (형용사적 용법의 to부정사)", "p": "the best way to do"}, {"t": "this = classifying the galaxy images (은하 이미지를 분류하는 일)", "c": "o", "x": "the best way to do this의 this는 앞에서 말한 ‘은하 이미지를 모양에 따라 분류하는 일’을 가리킨다. do this는 ‘이 일을 해내다’라는 뜻이다.", "n": ["this = 은하 이미지를 분류하는 일"], "q": "do this의 this는 무엇을 가리키는가?", "a": "은하 이미지를 모양에 따라 분류하는 일", "p": "this"}, {"t": "be동사 + to V : 보어로 쓰인 to부정사 (~하는 것이다)", "c": "k", "x": "the best way to do this was to sort them은 ‘이것을 하는 가장 좋은 방법은 그것들을 분류하는 것이었다’라는 뜻이다. was 뒤의 to sort는 주어를 설명하는 보어 역할을 하는 명사적 용법의 to부정사이고, ‘~하는 것’으로 해석한다. sort는 ‘~을 분류하다’라는 뜻이고, them은 galaxy images(은하 이미지들)이다.", "n": ["주어 is/was + to V = ~하는 것이다/였다 (보어)", "sort = ~을 분류하다"], "q": "was to sort them은 어떻게 해석하는가?", "a": "그것들을 분류하는 것이었다", "p": "was to sort"}, {"t": "접속사 while + -ing : ~하면서 (분사구문)", "c": "k", "x": "while looking at each one individually는 ‘하나하나를 개별적으로 보면서’라는 뜻이다. while he was looking에서 he was를 뺀 모양의 분사구문이다. 주절의 주어(the best way)가 아니라 분류하는 사람(Schawinski)이 looking의 의미상 주어이다. 접속사 while을 남겨 두면 ‘~하는 동안, ~하면서’라는 동시 동작의 뜻이 분명해진다. individually는 ‘개별적으로’라는 뜻의 부사이다.", "n": ["while + -ing = ~하면서 (= while he was looking)", "접속사를 남긴 분사구문"], "q": "while looking at each one은 어떻게 해석하는가?", "a": "하나하나를 보면서", "p": "while looking at"}, {"t": "would : 과거 이야기 속의 예상 (~일 것이었다)", "c": "b", "x": "this would require a tremendous amount of time은 ‘이것은 엄청난 시간이 필요할 것이었다’라는 뜻이다. 이야기가 과거라서 will 대신 would를 써서 ‘그때 앞으로 ~일 것이다’라는 예상을 나타낸다. Of course는 ‘물론’이라는 뜻이다. 여기서 this는 앞 문장의 ‘하나하나 보면서 분류하는 방법’을 가리킨다.", "n": ["would = (과거에서 본) ~일 것이다", "Of course = 물론"], "q": "this would require ...에서 would는 어떤 뜻인가?", "a": "과거에서 본 예상 (~일 것이었다)", "p": "would"}, {"t": "a tremendous amount of + 불가산명사 : 엄청난 양의 ~", "c": "g", "x": "a tremendous amount of time은 ‘엄청난 양의 시간’이라는 뜻이다. tremendous는 ‘엄청난, 대단한’이라는 뜻이다. amount of 뒤에는 time처럼 셀 수 없는 명사가 오고, 셀 수 있는 명사에는 number of를 쓴다. require는 ‘~을 필요로 하다’라는 뜻이다.", "n": ["a tremendous amount of + 셀 수 없는 명사 = 엄청난 양의 ~", "require = ~을 필요로 하다"], "q": "a tremendous amount of time은 무슨 뜻인가?", "a": "엄청난 양의 시간", "p": "a tremendous amount of time"}, {"t": "It takes + 사람 + 시간 + to V : (사람)이 ~하는 데 (시간)이 걸리다", "c": "k", "x": "It took Schawinski a whole week to classify just 50,000 galaxies는 ‘Schawinski가 고작 5만 개의 은하를 분류하는 데 꼬박 일주일이 걸렸다’라는 뜻이다. It은 가주어이고 진짜 주어는 to classify ~이다. It takes + 사람 + 시간 + to V는 ‘(사람)이 ~하는 데 (시간)이 걸리다’라는 뜻이다. took은 take의 과거형이다.", "n": ["It takes + 사람 + 시간 + to V = ~하는 데 …가 걸리다", "It = 가주어, to V = 진짜 주어"], "q": "It took Schawinski a whole week to classify ...는 어떻게 해석하는가?", "a": "Schawinski가 ~을 분류하는 데 꼬박 일주일이 걸렸다", "p": "It took Schawinski a whole week to classify"}, {"t": "a whole + 단수명사 · just : 꼬박 ~ · 고작", "c": "g", "x": "a whole week는 ‘꼬박 일주일’이라는 뜻이다. whole은 ‘전체의, 꼬박’이라는 뜻이고 a whole + 단수명사 순서로 쓴다. just 50,000 galaxies의 just는 ‘고작, 겨우’라는 뜻의 부사로, 분류한 양이 적다는 느낌을 준다. 100만 개 중 5만 개를 분류하는 데 일주일이 걸렸다는 점이 이 일이 얼마나 느린지 보여 준다.", "n": ["a whole week = 꼬박 일주일", "just + 숫자 = 고작 ~"], "q": "just 50,000 galaxies에서 just는 무슨 뜻인가?", "a": "고작, 겨우", "p": "just"}, {"t": "What about ~? : ~는 어떻게 하지?", "c": "g", "x": "But what about the remaining 950,000?은 ‘하지만 남아 있는 95만 개는 어쩌지?’라는 뜻이다. What about ~?는 ‘~은 어떡하지?, ~은 어때?’라고 묻는 표현이다. He thought, “...”는 마음속으로 한 생각을 그대로 인용한 모양이다.", "n": ["What about ~? = ~은 어떡하지?"], "q": "What about the remaining 950,000?은 무슨 뜻인가?", "a": "남아 있는 95만 개는 어쩌지?", "p": "what about"}, {"t": "remaining : 남아 있는 (분사형 형용사)", "c": "b", "x": "the remaining 950,000은 ‘남아 있는 95만 개’라는 뜻이다. remaining은 동사 remain(남아 있다)의 현재분사에서 나온 형용사이다. 남은 것들이 스스로 ‘남아 있는’ 것이라서 능동의 -ing를 쓴다. 전체 100만 개에서 5만 개를 뺀 나머지 95만 개를 가리킨다.", "n": [ rief tutorial은 무슨 뜻인가?", "a": "간단한 사용 지침과 함께 환영받았다", "p": "were greeted with"}, {"t": "주격 관계대명사 that : a tutorial that explained ~", "c": "b", "x": "a brief tutorial that explained the project는 ‘프로젝트에 대해 설명하는 간단한 사용 지침’이라는 뜻이다. that은 선행사 a brief tutorial을 받는 주격 관계대명사이고, 바로 뒤에 동사 explained가 온다. 사용 지침이 ‘설명하는’ 주체라서 능동의 동사를 쓴다.", "n": ["선행사 + that + 동사 = ~하는 (선행사)", "that 바로 뒤에 동사 → 주격"], "q": "that explained the project에서 that의 역할은?", "a": "선행사 a brief tutorial을 받는 주격 관계대명사", "p": "that"}, {"t": "they = New visitors (신규 방문자들)", "c": "o", "x": "Then they were shown an image의 they는 앞 문장의 New visitors(신규 방문자들)를 가리킨다. 사용 지침을 본 다음 이어서 은하 이미지를 보게 된다는 흐름이다.", "n": ["they = New visitors"], "q": "Then they were shown ...의 they는 누구인가?", "a": "신규 방문자들 (New visitors)", "p": "they"}, {"t": "4형식 수동태 · 병렬 : were shown A and (were) asked to V", "c": "k", "x": "they were shown an image of a galaxy and asked to click buttons는 ‘그들에게 은하 이미지가 보여졌고 버튼을 클릭하도록 요청받았다’라는 뜻이다. show A B(A에게 B를 보여 주다)를 수동태로 바꾸면 A were shown B가 되어, 직접목적어 an image가 동사 뒤에 남는다. asked 앞에는 were가 생략되어 있다. ask + 목적어 + to V를 수동태로 만들면 were asked to click처럼 to부정사가 그대로 남는다. 뒤의 buttons that described its features에서 that은 buttons를 꾸미는 주격 관계대명사이다.", "n": ["show A B → A be shown B (B가 남음)", "ask + O + to V → be asked to V"], "q": "were shown an image of a galaxy는 어떻게 해석하는가?", "a": "은하 이미지를 보게 되었다 (그들에게 은하 이미지가 보여졌다)", "p": "were shown an image of a galaxy and asked to click"}, {"t": "be동사 의문문 · A or B : ~인가, 아니면 ~인가", "c": "b", "x": "Is the galaxy smooth and rounded?는 ‘은하가 매끄럽고 둥근가?’라는 뜻이다. be동사 의문문은 Is + 주어 ~? 순서로 쓴다. Is its shape an oval or a spiral?은 or로 두 가지 중 하나를 고르게 묻는 선택의문문이다. oval은 ‘타원형’, spiral은 ‘나선형’이라는 뜻이고, its는 the galaxy의 소유격으로 ‘은하의’라는 뜻이다. smooth and rounded는 and로 이어진 형용사 병렬이다.", "n": ["Is + 주어 ~? = ~인가?", "A or B? = A인가 아니면 B인가?"], "q": "Is its shape an oval or a spiral?은 무슨 뜻인가?", "a": "그것(은하)의 모양은 타원형인가 아니면 나선형인가?", "p": "Is its shape an oval or a spiral"}, {"t": "전치사 After + 명사구 : completion of ~ · a little bit rticipants], Schawinski [10|couldn’t have classified that many images].", "en": "If it had not been for those participants, Schawinski couldn’t have classified that many images.", "ko": "그 참여자들이 없었다면, Schawinski는 그렇게 많은 이미지를 분류할 수 없었을 것이다."}, {"n": 27, "mk": "In fact, it [11|would have taken] him decades [12|on his own].", "en": "In fact, it would have taken him decades on his own.", "ko": "사실, 그 혼자서는 수십 년이 걸렸을 것이다."}, {"n": 28, "mk": "More than 15 years [13|have passed since] the project first began in 2007.", "en": "More than 15 years have passed since the project first began in 2007.", "ko": "그 프로젝트가 2007년에 처음 시작된 이래로 15년 이상이 지났다."}, {"n": 29, "mk": "Galaxy Zoo [14|has now grown into] Zooniverse, [15|which] is [16|one of the most popular platforms] on the Internet for ordinary people [17|who want to participate] in science projects.", "en": "Galaxy Zoo has now grown into Zooniverse, which is one of the most popular platforms on the Internet for ordinary people who want to participate in science projects.", "ko": "Galaxy Zoo는 이제 Zooniverse로 성장했는데, 이것은 과학 프로젝트에 참여하고 싶어 하는 일반인들을 위한 인터넷에서 가장 인기 있는 플랫폼 중 하나이다."}, {"n": 30, "mk": "[18|It] is [19|more active than ever before], [20|with about 2 million registered users worldwide].", "en": "It is more active than ever before, with about 2 million registered users worldwide.", "ko": "전 세계적으로 약 2백만 명의 등록된 사용자가 있는 그것은 그 어느 때보다 더 왕성하다."}, {"n": 31, "mk": "[18|It] now offers [21|a wide range of] projects in astronomy, biology, physics, and more.", "en": "It now offers a wide range of projects in astronomy, biology, physics, and more.", "ko": "현재 그것은 천문학, 생물학, 물리학 등에서 광범위한 프로젝트들을 제공하고 있다."}, {"n": 32, "mk": "[22|If you want to get involved], you should definitely [23|check it out]!", "en": "If you want to get involved, you should definitely check it out!", "ko": "만약 당신이 참여하고 싶다면, 반드시 확인해 보아라!"}], "items": [{"t": "강조구문 It was ~ that ... : 바로 ~이다", "c": "k", "x": "It was online media that helped spread the word는 ‘소문을 퍼뜨리는 데 도움을 준 것은 바로 온라인 미디어였다’라는 뜻이다. It is/was ~ that ...은 강조하고 싶은 말을 It was와 that 사이에 넣는 강조구문이다. 여기서는 online media가 강조되었고, that 뒤는 주어가 빠진 문장(helped spread ...)이다. It was와 that을 빼면 Online media helped spread the word ...가 된다. ‘바로 ~이다’라고 해석한다.", "n": ["It is/was + 강조할 말 + that ... = …한 것은 바로 ~이다", "It was와 that을 빼도 완전한 문장"], "q": "It was online media that helped ...는 어떻게 해석하는가?", "a": "도움을 준 것은 바로 온라인 미디어였다", "p": "It was online media that"}, {"t": "help + (to) 동사원형 : ~하는 것을 돕다", "c": "b", "x": "helped spread the word는 ‘소문을 퍼뜨리는 것을 도왔다’라는 뜻이다. help 뒤에는 to부정사나 동사원형이 올 수 있고, 여기서는 to가 생략된 동사원형 spread가 왔다. spread는 ‘퍼뜨리다’라는 뜻이고, spread - spread - spread로 원형·과거·과거분사가 모두 같다.", "n": ["help + (to) 동사원형 = ~하는 것을 돕다", "spread - spread - spread"], "q": "helped spread에서 spread가 동사원형인 이유는?", "a": "help 뒤에는 to가 생략된 동사원형도 올 수 있기 때문이다.", "p": "helped spread"}, {"t": "spread the word about ~ : ~에 대한 소문을 퍼뜨리다", "c": "g", "x": "spread the word about Galaxy Zoo는 ‘Galaxy Zoo에 대한 소문을 퍼뜨리다’라는 뜻이다. spread the word는 ‘소문을 내다, 알리다’라는 뜻의 표현이고, about 뒤에 알리는 대상이 온다. 여기서 word는 ‘단어’가 아니라 ‘소식, 소문’이라는 뜻이다.", "n": ["spread the word about ~ = ~에 대한 소문을 퍼뜨리다", "word = 소식, 소문"], "q": "spread the word about Galaxy Zoo는 무슨 뜻인가?", "a": "Galaxy Zoo에 대한 소문을 퍼뜨리다", "p": "spread the word about Galaxy Zoo"}, {"t": "분사구문 ~, -ing : 그리고 ~하다 (결과)", "c": "k", "x": "bringing more and more participants to the website는 ‘그리고 점점 더 많은 참여자를 그 웹사이트로 불러 모았다’라는 뜻이다. and it brought ...에서 접속사와 주어를 빼고 동사를 -ing로 바꾼 분사구문이다. 앞 절의 내용(온라인 미디어가 소문을 퍼뜨린 것)의 결과를 덧붙여 설명한다. more and more participants는 ‘점점 더 많은 참여자들’이라는 뜻이고, bring A to B는 ‘A를 B로 데려오다’라는 뜻이다.", "n": ["주절, -ing ~ = …하고 (그 결과) ~하다", "more and more + 명사 = 점점 더 많은 ~"], "q": "bringing more and more participants는 어떻게 해석하는가?", "a": "점점 더 많은 참여자를 불러 모으며", "p": "bringing"}, {"t": "shortly after + 절 : ~한 직후에", "c": "g", "x": "Shortly after the website was launched는 ‘웹사이트가 개설된 지 얼마 지나지 않아’라는 뜻이다. shortly after는 ‘~한 직후에, ~한 지 얼마 안 되어’라는 뜻이다. after 뒤에 주어와 동사가 있는 절(the website was launched)이 와서 after는 접속사로 쓰였다. was launched는 launch(개시하다)의 수동태이다.", "n": ["shortly after ~ = ~한 직후에", "launch = (웹사이트 등을) 개시하다"], "q": "Shortly after the website was launched는 무슨 뜻인가?", "a": "웹사이트가 개설된 지 얼마 지나지 않아", "p": "Shortly after"}, {"t": "진행형 수동태 : were being made", "c": "k", "x": "nearly 70,000 classifications were being made per hour는 ‘시간당 약 7만 건의 분류가 이루어지고 있었다’라는 뜻이다. were being made는 be동사 + being + p.p.의 과거진행형 수동태로 ‘~되고 있었다’라는 뜻이다. 분류는 ‘만들어지는’ 쪽이라서 수동태이다. 주어 classifications가 복수라서 were being이다. nearly는 ‘거의, 약’, per hour는 ‘시간당’이라는 뜻이다.", "n": ["be + being + p.p. = ~되고 있다 (진행형 수동태)", "nearly = 거의, 약 / per hour = 시간당"], "q": "were being made는 어떤 형태인가?", "a": "과거진행형 수동태 (be + being + p.p.)", "p": "were being made"}, {"t": "in + 기간 : ~ 만에, ~ 후에", "c": "g", "x": "In a year and a half는 ‘일 년 반 만에’라는 뜻이다. in + 기간은 ‘~ 만에, ~ 안에’라는 뜻이다. a year and a half는 ‘1년 반’이다.", "n": ["in + 기간 = ~ 만에, ~ 안에", "a year and a half = 1년 반"], "q": "In a year and a half는 무슨 뜻인가?", "a": "일 년 반 만에", "p": "In a year and a half"}, {"t": "they = individuals (8만 명 이상의 개인들)", "c": "o", "x": "they made more than 75 million classifications의 they는 앞 절의 more than 80,000 individuals(8만 명 이상의 개인)를 가리킨다. 참여한 사람들이 7천5백만 건 넘는 분류를 해냈다는 뜻이다.", "n": ["they = more than 80,000 individuals"], "q": "they made more than 75 million classifications의 they는 누구인가?", "a": "8만 명 이상의 참여한 개인들", "p": "they"}, {"t": "If it had not been for ~ : ~이 없었다면 (가정법 과거완료)", "c": "k", "x": "If it had not been for those participants는 ‘그 참여자들이 없었다면’이라는 뜻이다. If it had not been for ~는 ‘(과거에) ~이 없었다면’이라는 가정법 과거완료의 관용 표현이다. Without those participants나 But for those participants로 바꿔 쓸 수 있다. 과거 사실의 반대를 가정하므로 뒤의 주절에는 조동사 과거형 + have p.p.가 온다.", "n": ["If it had not been for ~ = ~이 없었다면 (과거)", "= Without ~ / But for ~"], "q": "If it had not been for those participants는 어떻게 해석하는가?", "a": "그 참여자들이 없었다면", "p": "If it had not been for those participants"}, {"t": "조동사 과거 + have p.p. : ~했을 것이다 · that many", "c": "k", "x": "Schawinski couldn’t have classified that many images는 ‘Schawinski는 그렇게 많은 이미지를 분류할 수 없었을 것이다’라는 뜻이다. could not have p.p.는 ‘~할 수 없었을 것이다’라는 뜻으로, 앞 if절(과거 사실의 반대)에 맞는 가정법 과거완료의 주절이다. that many에서 that은 ‘그렇게’라는 뜻의 부사라서 that many images는 ‘그렇게 많은 이미지’가 된다.", "n": ["If + had p.p., 주어 + 조동사 과거 + have p.p.", "that many = 그렇게 많은"], "q": "couldn’t have classified는 무슨 뜻인가?", "a": "분류할 수 없었을 것이다", "p": "couldn’t have classified that many images"}, {"t": "would have p.p. : ~했을 것이다 (가정법 과거완료) · It takes + 사람 + 시간", "c": "k", "x": "it would have taken him decades on his own은 ‘그 혼자서는 수십 년이 걸렸을 것이다’라는 뜻이다. would have p.p.는 ‘(과거에) ~했을 것이다’라는 가정법 과거완료의 주절 모양이다. 여기서는 if절이 없는 대신 on his own(그 혼자서는)이 조건의 뜻을 대신한다. It takes + 사람 + 시간 구문이라서 taken him decades(그에게 수십 년이 걸렸을 것이다)가 되었다. decades는 ‘수십 년’이라는 뜻이다.", "n": ["would have p.p. = ~했을 것이다", "on his own이 if절의 뜻을 대신함"], "q": "it would have taken him decades는 어떻게 해석하는가?", "a": "그에게 수십 년이 걸렸을 것이다", "p": "would have taken"}, {"t": "on one’s own : 혼자서, 스스로", "c": "g", "x": "on his own은 ‘혼자서, 스스로’라는 뜻이다. on one’s own은 by oneself와 같은 뜻의 표현이고, 소유격은 주어에 맞춰 his, her, their 등으로 바뀐다. 여기서는 참여자들 없이 Schawinski 혼자서라는 뜻이다.", "n": ["on one’s own = 혼자서, 스스로 (= by oneself)"], "q": "on his own은 무슨 뜻인가?", "a": "혼자서, 스스로", "p": "on his own"}, {"t": "현재완료 + since : ~한 이래로 …가 지났다", "c": "k", "x": "More than 15 years have passed since the project first began in 2007은 ‘그 프로젝트가 2007년에 처음 시작된 이래로 15년 이상이 지났다’라는 뜻이다. have passed는 현재완료이고, since + 과거 시점의 절은 ‘~한 이래로’라는 뜻이다. 주어 More than 15 years가 복수라서 have를 썼다. It has been more than 15 years since ~로 바꿔 쓸 수 있다.", "n": ["현재완료 + since + 과거 절 = ~한 이래로 …해 왔다", "= It has been 15 years since ~"], "q": "have passed since ...는 어떻게 해석하는가?", "a": "~한 이래로 (시간이) 지났다", "p": "have passed since"}, {"t": "현재완료 has grown into ~ : ~로 성장했다", "c": "k", "x": "Galaxy Zoo has now grown into Zooniverse는 ‘Galaxy Zoo는 이제 Zooniverse로 성장했다’라는 뜻이다. has grown은 현재완료로, 과거에 시작된 성장이 지금의 결과로 이어졌음을 나타낸다. grow into ~는 ‘자라서 ~이 되다, ~로 성장하다’라는 뜻이다. grow - grew - grown으로 변한다.", "n": ["has/have + p.p. = 현재완료  무언가’를 영어로 쓸 때 올바른 어순은?", "a": "something strange", "p": "something strange"}, {"t": "some of which : 수량 표현 + of + 관계대명사 (계속적 용법)", "c": "k", "x": "some of which seemed to stretch ...는 ‘그중 일부는 ~에 걸쳐 뻗어 있는 것처럼 보였다’라는 뜻이다. some of which는 some + of + 관계대명사 which이고, 앞의 ribbons of green and purple light를 받는다. 앞에 쉼표가 있는 계속적 용법으로 and some of them(그리고 그것들 중 일부는)처럼 풀어 해석한다. which 뒤의 절에서 some of which 전체가 주어 역할을 한다.", "n": [", 수량 + of + which = 그리고 그중 ~는", "which = ribbons of green and purple light"], "q": "some of which의 which는 무엇을 가리키는가?", "a": "ribbons of green and purple light (빛의 띠들)", "p": "some of which"}, {"t": "seem to V · stretch for ~ : ~인 것처럼 보이다 · ~에 걸쳐 뻗다", "c": "b", "x": "seemed to stretch for thousands of kilometers는 ‘수천 킬로미터에 걸쳐 뻗어 있는 것처럼 보였다’라는 뜻이다. seem to V는 ‘~인 것처럼 보이다’라는 뜻이다. stretch는 ‘(길게) 뻗다’라는 뜻이고, for 뒤에 거리나 시간이 오면 ‘~에 걸쳐’라는 범위를 나타낸다.", "n": ["seem to V = ~인 것처럼 보이다", "stretch for + 거리 = ~에 걸쳐 뻗다"], "q": "seemed to stretch for thousands of kilometers는 무슨 뜻인가?", "a": "수천 킬로미터에 걸쳐 뻗어 있는 것처럼 보였다", "p": "seemed to stretch for"}, {"t": "thousands of ~ : 수천의 ~", "c": "g", "x": "thousands of kilometers는 ‘수천 킬로미터’라는 뜻이다. thousands of ~는 ‘수천의 ~’이라는 막연하게 많은 수를 나타내며, thousand에 s를 붙이고 of를 쓴다. 정확한 숫자와 함께 쓸 때는 two thousand kilometers처럼 s와 of 없이 쓴다.", "n": ["thousands of + 복수명사 = 수천의 ~", "two thousand (숫자 뒤에는 s, of 없음)"], "q": "thousands of kilometers는 무슨 뜻인가?", "a": "수천 킬로미터", "p": "thousands of"}, {"t": "접속사 while (대조) · Sometimes ~, other times ~", "c": "k", "x": "Sometimes they lasted for just a few minutes, while other times they remained in the sky for a whole hour는 ‘어떤 때에는 단 몇 분간 지속되었지만, 다른 때에는 한 시간 내내 하늘에 머무르기도 했다’라는 뜻이다. while은 여기서 ‘~인 반면에’라는 대조의 접속사이다. Sometimes와 other times가 짝을 이루어 두 경우를 대비한다. just a few minutes의 a few는 ‘몇 개의, 몇몇의’라는 뜻이다.", "n": ["while = ~인 반면에 (대조)", "Sometimes ~, other times ~ = 어떤 때는 ~, 다른 때는 ~"], "q": "여기서 while은 어떤 뜻인가?", "a": "~인 반면에 (대조)", "p": "Sometimes"}, {"t": "they = ribbons of light (빛의 띠들)", "c": "o", "x": "Sometimes they ing unsure of ...에서 Being이 생략된 분사구문이다. 주절의 주어 the group이 ‘확신하지 못한’ 사람들이라서 Unsure가 the group의 상태를 나타낸다. 이유를 나타내므로 ‘~해서’로 해석한다. unsure of ~는 ‘~을 확신하지 못하는’이라는 뜻이다.", "n": ["(Being) unsure of ~ = ~을 확신하지 못해서", "분사구문의 주어 = 주절의 주어 (the group)"], "q": "Unsure of what they were는 어떻게 해석하는가?", "a": "그것들이 무엇인지 확신하지 못해서", "p": "Unsure of"}, {"t": "간접의문문 : what they were (의문사 + 주어 + 동사)", "c": "b", "x": "what they were는 ‘그것들이 무엇인지’라는 뜻이다. 의문문이 다른 문장 안으로 들어가면 의문사 + 주어 + 동사 순서가 된다. 그래서 what were they가 아니라 what they were이다. 전치사 of의 목적어 역할을 하는 명사절이다. 여기서 they는 앞에서 말한 빛의 띠들이다.", "n": ["간접의문문 = 의문사 + 주어 + 동사", "what were they (X) → what they were"], "q": "‘그것들이 무엇인지’를 영어로 쓰면?", "a": "what they were (의문사 + 주어 + 동사 순서)", "p": "what they were"}, {"t": "decide to V · name + O + C : …을 ~라고 이름 짓다", "c": "k", "x": "the group decided to name the phenomenon “Steve”는 ‘그 단체는 이 현상을 ‘Steve’라고 이름 짓기로 결정했다’라는 뜻이다. decide는 to부정사를 목적어로 취한다. name + 목적어 + 보어는 ‘…을 ~라고 이름 짓다’라는 5형식 구조로, the phenomenon이 목적어, “Steve”가 보어이다. phenomenon은 ‘현상’이라는 뜻이다.", "n": ["decide to V = ~하기로 결정하다", "name + O + C = O를 C라고 이름 짓다"], "q": "name the phenomenon “Steve”는 무슨 뜻인가?", "a": "그 현상을 ‘Steve’라고 이름 짓다", "p": "decided to name the phenomenon"}, {"t": "based on ~ : ~을 바탕으로", "c": "b", "x": "based on a scene from an animated movie는 ‘한 애니메이션 영화의 장면을 바탕으로’라는 뜻이다. based는 base(~의 기초를 두다)의 과거분사로, based on ~은 ‘~에 근거하여, ~을 바탕으로’라는 뜻이다. 이름을 지은 근거를 덧붙여 설명한다. animated는 ‘애니메이션으로 된’이라는 뜻의 형용사이다.", "n": ["based on ~ = ~에 근거하여, ~을 바탕으로", "animated movie = 애니메이션 영화"], "q": "based on a scene from an animated movie는 무슨 뜻인가?", "a": "한 애니메이션 영화의 장면을 바탕으로", "p": "based on"}, {"t": "관계부사 where : a scene ~ movie where ...", "c": "b", "x": "an animated movie where some characters give that name to an unfamiliar object는 ‘등장인물들이 낯선 물체에 그 이름을 붙이는 애니메이션 영화’라는 뜻이다. where는 선행사 an animated movie를 꾸미는 관계부사로, ‘그 영화 속에서’라는 뜻을 더한다. where 뒤에는 주어와 동사가 모두 있는 완전한 절(some characters give that name ...)이 온다. unfamiliar는 ‘낯선’이라는 뜻이다.", "n": ["장소·상황 + where + 완전한 절 = ~하는 (곳)", "give A to B = A를 B에게 주다 (이름을 붙이다)"], "q": "where 뒤에는 어떤 절이 오는가?", "a": "주어와 동사가 모두 있는 완전한 절", "p": "where"}]}, {"no": 6, "id": "z6", "sents": [{"n": 41, "mk": "[1|After photographing] Steve for several years [1|and discussing] [2|what it might be], the group members decided to get help from experts.", "en": "After photographing Steve for several years and discussing what it might be, the group members decided to get help from experts.", "ko": "몇 년 동안 Steve의 사진을 찍고 그것이 무엇일지에 대해 논의한 후에, 그 단체 구성원들은 전문가들로부터 도움을 받기로 결정했다."}, {"n": 42, "mk": "[3|They] [4|showed their photos of Steve to] a professor of astronomy at a local university and a scientist at NASA.", "en": "They showed their photos of Steve to a professor of astronomy at a local university and a scientist at NASA.", "ko": "그들은 Steve의 사진들을 지역 대학의 천문학 교수와 NASA의 과학자에게 보여주었다."}, {"n": 43, "mk": "Surprisingly, [5|neither of them] had [6|any idea what Steve was].", "en": "Surprisingly, neither of them had any idea what Steve was.", "ko": "놀랍게도, 둘 중 누구도 Steve가 무엇인지 전혀 알지 못했다."}, {"n": 44, "mk": "They confirmed that it was not an aurora, but it did not [7|resemble] [8|anything they had seen] before.", "en": "They confirmed that it was not an aurora, but it did not resemble anything they had seen before.", "ko": "그들은 그것이 오로라가 아니라는 것은 확인했지만, 그것은 그들이 이전에 보았던 어느 것과도 비슷하지 않았다."}, {"n": 45, "mk": "They realized that the group [9|had discovered] a new type of phenomenon [10|that had never been properly studied].", "en": "They realized that the group had discovered a new type of phenomenon that had never been properly studied.", "ko": "그들은 그 단체가 제대로 연구된 적이 없는 새로운 유형의 현상을 발견했다는 것을 깨달았다."}, {"n": 46, "mk": "[11|In order to learn] more about it, NASA funded a citizen science project involving the public.", "en": "In order to learn more about it, NASA funded a citizen science project involving the public.", "ko": "이에 대해 더 자세히 알아보기 위해, NASA는 대중이 참여하는 시민 과학 프로젝트에 자금을 제공했다."}, {"n": 47, "mk": "The project [12|asked ordinary people to gather] photos of Steve and send them to NASA.", "en": "The project asked ordinary people to gather photos of Steve and send them to NASA.", "ko": "그 프로젝트는 일반인들에게 Steve의 사진을 모아서 NASA에 보내달라고 요청했다."}, {"n": 48, "mk": "It is still [13|in progress] today.", "en": "It is still in progress today.", "ko": "그것은 오늘날에도 여전히 진행 중이다."}, {"n": 49, "mk": "[14|In honor of] the aurora chasers who first discovered the phenomenon, the name “Steve” [15|has been kept].", "en": "In honor of the aurora chasers who first discovered the phenomenon, the name “Steve” has been kept.", "ko": "이 현상을 처음 발견한 오로라 추적자들에게 경의를 표하여 ‘Steve’라는 이름은 유지되었다."}, {"n": 50, "mk": "However, it is now [16|written in all capital letters] and [17|stands for] “Strong Thermal Emission Velocity Enhancement.”", "en": "However, it is now written in all capital letters and stands for “Strong Thermal Emission Velocity Enhancement.”", "ko": "그러나, 그것은 이제 모두 대문자로 쓰이며, ‘속도 증가에 따른 강한 열 방출(Strong Thermal Emission Velocity Enhancement)’을 의미한다."}, {"n": 51, "mk": "Experts have acknowledged that [18|it is the dedicated members of the aurora chasers group that deserve] the credit for discovering STEVE.", "en": "Experts have acknowledged that it is the dedicated members of the aurora chasers group that deserve the credit for discovering STEVE.", "ko": "전문가들은 STEVE를 발견한 공로를 인정받아야 할 사람들은 바로 오로라 추적자 단체의 헌신적인 구성원들임을 인정했다."}, {"n": 52, "mk": "[19|If it had not been for them], it [20|might have remained unnoticed] forever.", "en": "If it had not been for them, it might have remained unnoticed forever.", "ko": "만약 그들이 아니었다면, 그것은 영원히 알려지지 못한 상태로 남았을지도 모른다."}, {"n": 53, "mk": "There are many interesting theories about STEVE, but [21|none of them] [22|have been proven for certain].", "en": "There are many interesting theories about STEVE, but none of them have been proven for certain.", "ko": "STEVE에 대한 흥미로운 이론들은 많지만, 그들 중 어느 것도 확실하게 증명된 것은 없다."}, {"n": 54, "mk": "Scientists and citizens [23|continue to collaborate to solve] this mystery, and they are learning more and more about STEVE every day.", "en": "Scientists and citizens continue to collaborate to solve this mystery, and they are learning more and more about STEVE every day.", "ko": "과학자들과 시민들은 이 수수께끼를 풀기 위해 계속 협력하며, 매일 STEVE에 대해 점점 더 많은 것을 알아가고 있다."}], "items": [{"t": "전치사 After + 동명사 병렬 : photographing and discussing", "c": "b", "x": "After photographing Steve for several years and discussing what it might be는 ‘몇 년 동안 Steve의 사진을 찍고 그것이 무엇일지에 대해 논의한 후에’라는 뜻이다. After는 전치사로 쓰여 뒤에 동명사(photographing, discussing)가 왔다. photographing과 discussing은 and로 이어진 병렬 구조이다. photograph는 ‘사진을 찍다’, discuss는 ‘~에 대해 논의하다’라는 뜻이고, discuss 뒤에는 about을 쓰지 않는다.", "n": ["After + -ing and -ing = ~하고 …한 후에 (병렬)", "discuss + 목적어 (about 없이)"], "q": "After photographing ... and discussing ...에서 photographing과 discussing은 어떤 관계인가?", "a": "and로 이어진 병렬 구조 (둘 다 전치사 After 뒤의 동명사)", "p": "After photographing"}, {"t": "간접의문문 : what it might be", "c": "b", "x": "what it might be는 ‘그것이 무엇일지’라는 뜻이다. 의문사 what 뒤에 주어 it과 동사 might be가 이어지는 간접의문문(의문사 + 주어 + 동사)이며, discussing의 목적어 역할을 하는 명사절이다. 여기서 it은 앞의 Steve를 가리킨다. might be는 ‘~일지도 모른다’라는 추측이다.", "n": ["간접의문문 = 의문사 + 주어 + 동사", "it = Steve"], "q": "what it might be는 어떻게 해석하는가?", "a": "그것(Steve)이 무엇일지", "p": "what it might be"}, {"t": "They = the group members (단체 구성원들)", "c": "o", "x": "They showed their photos of Steve의 They는 앞 문장의 the group members(단체 구성원들)를 가리킨다. 뒤의 their도 같은 구성원들이다.", "n": ["They = the group members", "their = the group members’"], "q": "They showed their photos의 They는 누구인가?", "a": "오로라 추적자 단체의 구성원들 (the group members)", "p": "They"}, {"t": "show A to B : B에게 A를 보여 주다", "c": "b", "x": "showed their photos of Steve to a professor ... and a scientist at NASA는 ‘Steve의 사진을 교수와 NASA의 과학자에게 보여주었다’라는 뜻이다. show A to B는 ‘B에게 A를 보여 주다’라는 3형식 표현이다. to 뒤에 a professor of astronomy at a local university와 a scientist at NASA가 and로 이어져 있다. professor of astronomy는 ‘천문학 교수’, local은 ‘지역의’라는 뜻이다.", "n": ["show A to B = B에게 A를 보여 주다", "to 뒤의 두 명사구가 and로 병렬"], "q": "showed their photos of Steve to ...는 어떻게 해석하는가?", "a": "Steve의 사진을 ~에게 보여주었다", "p": "showed their photos of Steve to"}, {"t": "neither of + 복수대명사 : (둘) 중 어느 쪽도 ~않다", "c": "k", "x": "neither of them had any idea는 ‘둘 중 누구도 전혀 알지 못했다’라는 뜻이다. neither of ~는 ‘(둘) 중 어느 쪽도 ~않다’라는 뜻이다. neither 자체가 부정의 뜻이라서 not을 또 쓰지 않는다. 여기서는 교수와 NASA 과학자, 두 사람이 대상이다. 셋 이상이면 none of ~를 쓴다. Surprisingly는 ‘놀랍게도’라는 뜻으로 문장 전체를 꾸민다.", "n": ["neither of + 복수 = 둘 중 어느 쪽도 ~않다 (이미 부정)", "셋 이상은 none of ~"], "q": "neither of them이 가리키는 인원은 몇 명인가?", "a": "두 명 (교수와 NASA 과학자)", "p": "neither of them"}, {"t": "have any idea + 의문사절 : ~인지 전혀 모르다", "c": "b", "x": "had any idea what Steve was는 ‘Steve가 무엇인지 전혀 알지 못했다’라는 뜻이다. have no idea what ~은 ‘~인지 전혀 모르다’라는 뜻이다. 이 문장에서는 neither가 이미 부정의 뜻이라서 no 대신 any를 썼다. what Steve was는 의문사 + 주어 + 동사 순서의 간접의문문이다.", "n": ["have no idea + 의문사절 = ~인지 전혀 모르다", "neither(부정) 뒤에는 no 대신 any"], "q": "neither of them had any idea에서 no가 아니라 any를 쓴 이유는?", "a": "neither 자체가 부정의 뜻이라서 any를 쓴다.", "p": "any idea what Steve was"}, {"t": "resemble : 전치사 없이 쓰는 타동사", "c": "b", "x": "it did not resemble anything they had seen before는 ‘그것은 그들이 이전에 보았던 어느 것과도 비슷하지 않았다’라는 뜻이다. resemble은 ‘~와 닮다’라는 뜻의 타동사라서 with나 to 없이 바로 목적어(anything)가 온다. ‘~와’라고 해석해서 with를 붙이기 쉬우니 주의해야 한다. did not은 일반동사의 부정이라서 뒤에 동사원형 resemble이 왔다.", "n": ["resemble + 목적어 = ~와 닮다 (전치사 X)", "resemble with (X)"], "q": "resemble anything에서 resemble 뒤에 전치사가 없는 이유는?", "a": "resemble이 ‘~와 닮다’라는 뜻의 타동사이기 때문이다.", "p": "resemble"}, {"t": "목적격 관계대명사 생략 · 과거완료 : anything they had seen", "c": "k", "x": "anything they had seen before는 ‘그들이 이전에 보았던 어떤 것’이라는 뜻이다. anything과 they 사이에 목적격 관계대명사 that이 생략되어 있다. had seen은 had + p.p.의 과거완료로, ‘닮지 않았다(did not resemble)’는 시점보다 더 앞선 경험을 나타낸다.", "n": ["명사 + (that) + 주어 + 동사 = ~가 …한 (명사)", "had p.p. = 그보다 앞선 때의 일"], "q": "anything they had seen before에서 생략된 것은 무엇인가?", "a": "목적격 관계대명사 that", "p": "anything they had seen"}, {"t": "과거완료 had p.p. : 그 전에 ~했었다", "c": "k", "x": "the group had discovered a new type of phenomenon은 ‘그 단체가 새로운 유형의 현상을 발견했다’라는 뜻이다. realized(깨달았다)보다 발견한 일이 더 먼저 일어났으므로 had discovered라는 과거완료를 썼다. 과거완료는 과거의 어느 때보다 앞선 일을 나타내는 had + p.p. 모양이다. a new type of ~는 ‘새로운 유형의 ~’라는 뜻이고, phenomenon은 ‘현상’이다.", "n": ["had + p.p. = (과거보다 앞선) ~했었다", "realized(과거) < had discovered(그 이전)"], "q": "realized that the group had discovered에서 had discovered를 쓴 이유는?", "a": "발견한 일이 깨달은 때보다 더 먼저 일어났기 때문이다.", "p": "had discovered"}, {"t": "주격 관계대명사 that + 과거완료 수동태 : had never been p.p.", "c": "k", "x": "a new type of phenomenon that had never been properly studied는 ‘제대로 연구된 적이 없는 새로운 유형의 현상’이라는 뜻이다. that은 선행사 phenomenon을 받는 주격 관계대명사이다. had never been studied는 had been + p.p.의 과거완료 수동태로, 발견하기 전까지는 ‘연구된 적이 없었다’는 경험을 나타낸다. never는 had와 been 사이에 온다. properly는 ‘제대로’라는 뜻의 부사이다.", "n": ["had been + p.p. = ~되었었다 (과거완료 수동태)", "never는 had와 been 사이"], "q": "had never been properly studied는 무슨 뜻인가?", "a": "제대로 연구된 적이 없었다", "p": "that had never been properly studied"}, {"t": "In order to V : ~하기 위해서", "c": "b", "x": "In order to learn more about it은 ‘이에 대해 더 자세히 알아보기 위해’라는 뜻이다. in order to + 동사원형은 목적을 분명히 나타내는 ‘~하기 위해서’라는 표현이다. it은 앞에서 말한 Steve를 가리킨다. 뒤의 involving the public은 앞 명사 project를 뒤에서 꾸미는 현재분사구로 ‘대중이 참여하는’이라는 뜻이고, fund는 ‘~에 자금을 대다’라는 뜻이다.", "n": ["in order to V = ~하기 위해서 (목적)", "project involving the public = 대중이 참여하는 프로젝트"], "q": "In order to learn more about it은 어떻게 해석하는가?", "a": "이에 대해 더 자세히 알아보기 위해", "p": "In order to learn"}, {"t": "ask + 목적어 + to V : …에게 ~해 달라고 요청하다", "c": "k", "x": "The project asked ordinary people to gather photos of Steve and send them to NASA는 ‘그 프로젝트는 일반인들에게 Steve의 사진을 모아서 NASA에 보내달라고 요청했다’라는 뜻이다. ask + 목적어 + to V는 ‘목적어에게 ~해 달라고 요청하다’라는 5형식 구조이다. to gather와 (to) send는 and로 이어진 병렬이고, 두 번째 to는 생략되어 있다. them은 photos of Steve(Steve의 사진들)를 가리킨다.", "n": ["ask + O + to V = O에게 ~해 달라고 요청하다", "to gather and (to) send = 병렬"], "q": "asked ordinary people to gather ...는 어떻게 해석하는가?", "a": "일반인들에게 ~을 모아 달라고 요청했다", "p": "asked ordinary people to gather"}, {"t": "in progress : 진행 중인", "c": "g", "x": "It is still in progress today는 ‘그것은 오늘날에도 여전히 진행 중이다’라는 뜻이다. in progress는 ‘진행 중인’이라는 뜻의 표현이다. It은 앞 문장의 a citizen science project(시민 과학 프로젝트)를 가리킨다. still은 ‘여전히’라는 뜻이다.", "n": ["in progress = 진행 중인", "It = the project"], "q": "in progress는 무슨 뜻인가?", "a": "진행 중인", "p": "in progress"}, {"t": "in honor of ~ : ~에게 경의를 표하여", "c": "g", "x": "In honor of the aurora chasers는 ‘오로라 추적자들에게 경의를 표하여’라는 뜻이다. in honor of ~는 ‘~을 기리어, ~에게 경의를 표하여’라는 뜻이다. 뒤의 who first discovered the phenomenon은 the aurora chasers를 꾸미는 주격 관계대명사절로 ‘그 현상을 처음 발견한’이라는 뜻이다.", "n": ["in honor of ~ = ~에게 경의를 표하여", "who first discovered ~ = ~을 처음 발견한 (관계대명사절)"], "q": "In honor of the aurora chasers는 무슨 뜻인가?", "a": "오로라 추적자들에게 경의를 표하여", "p": "In honor of"}, {"t": "현재완료 수동태 : has been kept", "c": "k", "x": "the name “Steve” has been kept는 ‘‘Steve’라는 이름은 유지되었다’라는 뜻이다. has been kept는 has been + p.p.의 현재완료 수동태이다. 이름은 ‘유지되는’ 쪽이라서 수동태이고, 지금까지 이어지는 상태를 현재완료로 나타낸다. 주어 the name이 단수라서 has를 썼다.", "n": ["has/have been + p.p. = ~되어 왔다 (현재완료 수동태)", "주어가 단수 → has"], "q": "has been kept는 어떤 형태인가?", "a": "현재완료 수동태 (has been + p.p.)", "p": "has been kept"}, {"t": "수동태 : is written in all capital letters", "c": "b", "x": "it is now written in all capital letters는 ‘그것은 이제 모두 대문자로 쓰인다’라는 뜻이다. it은 앞 문장의 the name “Steve”를 가리킨다. is written은 write의 수동태이고, in all capital letters는 ‘모두 대문자로’라는 뜻이다. capital letter는 ‘대문자’를 말한다. is written과 stands for는 and로 이어진 병렬 동사이다.", "n": ["be + p.p. = ~되다 (수동태)", "it = the name “Steve”"], "q": "is now written in all capital letters는 무슨 뜻인가?", "a": "이제 모두 대문자로 쓰인다", "p": "written in all capital letters"}, {"t": "stand for ~ : ~을 의미하다, ~의 약자이다", "c": "g", "x": "stands for “Strong Thermal Emission Velocity Enhancement”는 ‘‘속도 증가에 따른 강한 열 방출’을 의미한다’라는 뜻이다. stand for ~는 약어나 상징이 ‘~을 의미하다, ~의 약자이다’라는 뜻이다. 주어 it이 3인칭 단수라서 stands로 썼다.", "n": ["stand for ~ = ~을 의미하다, ~의 약자이다"], "q": "STEVE stands for ...는 무슨 뜻인가?", "a": "STEVE는 ~의 약자이다 (~을 의미한다)", "p": "stands for"}, {"t": "강조구문 It is ~ that ... : …하는 것은 바로 ~이다", "c": "k", "x": "it is the dedicated members of the aurora chasers group that deserve the credit for discovering STEVE는 ‘STEVE를 발견한 공로를 인정받아야 할 사람들은 바로 오로라 추적자 단체의 헌신적인 구성원들이다’라는 뜻이다. It is ~ that ...은 강조구문이고, 여기서는 the dedicated members of the aurora chasers group이 강조되었다. 강조된 말이 복수(members)라서 that 뒤의 동사도 복수형 deserve이다. deserve the credit for -ing는 ‘~한 공로를 인정받을 만하다’라는 뜻이고, dedicated는 ‘헌신적인’이라는 뜻이다.", "n": ["It is + 강조할 말 + that ... = …하는 것은 바로 ~이다", "강조된 말에 동사 일치 (members → deserve)"], "q": "that deserve에서 동사가 복수형인 이유는?", "a": "강조된 the dedicated members가 복수이기 때문이다.", "p": "it is the dedicated members of the aurora chasers group that deserve"}, {"t": "If it had not been for ~ : ~이 없었다면 (가정법 과거완료)", "c": "k", "x": "If it had not been for them은 ‘만약 그들이 아니었다면’이라는 뜻이다. If it had not been for ~는 ‘(과거에) ~이 없었다면’이라는 가정법 과거완료의 표현이다. Without them이나 But for them으로 바꿔 쓸 수 있다. 여기서 them은 앞 문장의 the dedicated members of the aurora chasers group(헌신적인 구성원들)을 가리킨다.", "n": ["If it had not been for ~ = ~이 없었다면", "them = the dedicated members (오로라 추적자들)"], "q": "If it had not been for them에서 them은 누구인가?", "a": "오로라 추적자 단체의 헌신적인 구성원들", "p": "If it had not been for them"}, {"t": "might have p.p. : ~했을지도 모른다 · remain + 형용사", "c": "k", "x": "it might have remained unnoticed forever는 ‘그것은 영원히 알려지지 못한 상태로 남았을지도 모른다’라는 뜻이다. might have p.p.는 ‘(과거에) ~했을지도 모른다’라는 가정법 과거완료의 주절 모양이다. remain은 뒤에 형용사를 쓰는 2형식 동사로 ‘~인 채로 남아 있다’라는 뜻이다. unnoticed는 ‘눈에 띄지 않은’이라는 뜻의 형용사이다. 여기서 it은 STEVE를 가리킨다.", "n": ["might have p.p. = ~했을지도 모른다", "remain + 형용사 = ~인 채로 남아 있다"], "q": "might have remained unnoticed는 무슨 뜻인가?", "a": "눈에 띄지 않은 채로 남았을지도 모른다", "p": "might have remained unnoticed"}, {"t": "none of + 복수명사 : 그중 어느 것도 ~않다", "c": "k", "x": "none of them have been proven for certain은 ‘그것들 중 어느 것도 확실하게 증명된 것은 없다’라는 뜻이다. none of ~는 ‘~ 중 어느 것도 …않다’라는 뜻이다. none of 뒤에 복수명사가 오면 동사를 복수(have)로도, 단수(has)로도 쓴다. 여기서 them은 many interesting theories(흥미로운 이론들)를 가리킨다. none 자체가 부정이라서 not을 따로 쓰지 않는다.", "n": ["none of + 복수 = 어느 것도 ~않다 (이미 부정)", "them = many interesting theories"], "q": "none of them에서 them은 무엇인가?", "a": "many interesting theories (흥미로운 이론들)", "p": "none of them"}, {"t": "현재완료 수동태 : have been proven (for certain)", "c": "b", "x": "have been proven for certain은 ‘확실하게 증명되었다’라는 뜻이다. have been proven은 have been + p.p.의 현재완료 수동태이다. 이론은 ‘증명되는’ 쪽이라서 수동태이다. for certain은 ‘확실하게, 분명히’라는 뜻의 표현이다. prove의 과거분사는 proven 또는 proved이다.", "n": ["have been + p.p. = ~되어 왔다", "for certain = 확실하게"], "q": "for certain은 무슨 뜻인가?", "a": "확실하게, 분명히", "p": "have been proven for certain"}, {"t": "continue to V · 목적을 나타내는 to부정사", "c": "b", "x": "Scientists and citizens continue to collaborate to solve this mystery는 ‘과학자들과 시민들은 이 수수께끼를 풀기 위해 계속 협력한다’라는 뜻이다. continue to V는 ‘계속해서 ~하다’라는 뜻이다. 뒤의 to solve는 ‘~하기 위해’라는 목적을 나타내는 부사적 용법의 to부정사이다. 뒤 절의 they are learning more and more about STEVE는 현재진행형이고, more and more는 ‘점점 더 많은 것’이라는 뜻이다. mystery는 ‘수수께끼’, collaborate는 ‘협력하다’라는 뜻이다.", "n": ["continue to V = 계속해서 ~하다", "to solve = ~하기 위해 (목적)"], "q": "collaborate to solve this mystery에서 to solve는 어떤 용법인가?", "a": "목적을 나타내는 부사적 용법 (~하기 위해)", "p": "continue to collaborate to solve"}]}, {"no": 7, "id": "z7", "sents": [{"n": 55, "mk": "[1|Most of the individuals] [2|involved in these two projects] are not professional scientists.", "en": "Most of the individuals involved in these two projects are not professional scientists.", "ko": "이 두 프로젝트에 참여한 대부분의 개인들은 전문 과학자가 아니다."}, {"n": 56, "mk": "Instead, [3|they] are citizen scientists—[4|ordinary people who] [5|desire to help advance] science in [6|areas that they are interested in].", "en": "Instead, they are citizen scientists—ordinary people who desire to help advance science in areas that they are interested in.", "ko": "대신, 그들은 시민 과학자들인데, 그들은 자신이 관심 있는 분야에서 과학의 발전을 돕고자 하는 평범한 사람들이다."}, {"n": 57, "mk": "[7|Even though] citizen scientists [8|may not have] science degrees [8|or] long, white lab coats, they are still [9 function marks(mk,s,mode,only,sn){
