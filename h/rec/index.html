<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1d4ed8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="REC">
<title>REC 기록</title>
<link rel="icon" type="image/png" sizes="180x180" href="icon-rec-180.png">
<link rel="apple-touch-icon" href="icon-rec-180.png">
<style>
:root{--bg:#f6f8fb;--card:#fff;--ink:#16202e;--sub:#5b6878;--line:#dbe2ea;--pri:#1d4ed8;--warn:#b45309;--warnL:#fff4e0}
@media(prefers-color-scheme:dark){:root{--bg:#0f1520;--card:#18212f;--ink:#e8eef6;--sub:#9aa9bb;--line:#2a3648;--pri:#8ab4ff;--warn:#fbbf24;--warnL:#33270a}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.55;font-size:16px}
.w{max-width:720px;margin:0 auto;padding:16px 16px 60px}
h1{font-size:22px;margin:4px 0 2px}.sub{color:var(--sub);font-size:14px;margin-bottom:12px}
.row{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
button,input,textarea{font:inherit}
.bt{padding:9px 14px;border:1px solid var(--pri);border-radius:9px;background:transparent;color:var(--pri)}
.bt.p{background:var(--pri);color:#fff;font-weight:700}
.pw{display:flex;gap:8px;margin:12px 0}
.pw input{flex:1;padding:10px;border:1px solid var(--line);border-radius:9px;font-size:17px;background:var(--card);color:inherit}
.msg{margin:10px 0;color:var(--sub);font-size:15px}
.sum{padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);line-height:1.8}
.late{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--warnL);color:var(--warn);font-size:15px}
.rc{margin:10px 0;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.rc .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.rc b{font-size:18px}.rc .s{font-size:13px;color:var(--sub)}
.rc .l{font-size:14px;color:var(--sub);white-space:nowrap}
.ch{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ch i{font-style:normal;font-size:14px;padding:3px 9px;border-radius:12px;border:1px solid var(--line)}
details{margin:16px 0;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:10px 14px}
summary{cursor:pointer;font-weight:700}
textarea{width:100%;min-height:120px;margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:inherit;font-size:15px}
.pv{font-size:14px;color:var(--sub);margin-top:6px}
.foot{margin-top:28px;font-size:13px;color:var(--sub);text-align:center}
.fl{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.fl .bt{padding:7px 13px;font-size:15px}
.sub{margin-bottom:14px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.kp div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kp span{display:block;font-size:12.5px;color:var(--sub)}
.kp b{font-size:24px;font-weight:700;line-height:1.3}.kp small{font-size:13px;font-weight:400;color:var(--sub);margin-left:2px}
.fl .bt{border-color:var(--line);color:var(--sub);background:var(--card);border-radius:8px;padding:6px 12px;font-size:14px}
.fl .bt.p{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
.lst{margin:12px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.rw{display:flex;gap:12px;padding:14px;border-top:1px solid var(--line)}.rw:first-child{border-top:0}
.av{flex:none;width:40px;height:40px;border-radius:50%;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px}
.bd{flex:1;min-width:0}
.tp{display:flex;justify-content:space-between;align-items:center;gap:8px}
.nm{display:flex;align-items:baseline;gap:8px;min-width:0}.nm b{font-size:17px}.nm .s{font-size:13px;color:var(--sub)}
.tp .l{font-size:12.5px;color:var(--sub);white-space:nowrap}
.gr{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 14px;margin-top:10px}
.gr span{display:block;font-size:12px;color:var(--sub)}.gr b{font-size:16px;font-weight:600}
.mt{margin-top:6px;font-size:14px;color:var(--sub)}
@media(min-width:560px){.gr{grid-template-columns:repeat(4,1fr)}}
</style></head><body>
<div class="w" id="app"></div>
<script>
(function(){
var URL_='https://script.google.com/macros/s/AKfycbw1YQfKsgAXNk8NYoxOfz4bsCSy66fiim7HoFAUk162ksxrEbmspMs2UifNZ-93sdf05A/exec';
var app=document.getElementById('app'),PK='rec_admin_pw',NK='rec_names',pw='',ALL={},NAMES={};
try{pw=localStorage.getItem(PK)||''}catch(e){}
var DAY=['일','월','화','수','목','금','토'];
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fd(t){var d=new Date(t);return (d.getMonth()+1)+'/'+d.getDate()+'('+DAY[d.getDay()]+') '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
function day0(t){var d=new Date(t);d.setHours(0,0,0,0);return d.getTime()}
function post(b){b.pw=pw;return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b)}).then(function(r){return r.json()})}
function val(e){var v=e&&e.v;if(v&&typeof v==='object'&&typeof v.s==='string'){try{return JSON.parse(v.s)}catch(x){return v.s}}return v}
function head(){return '<h1>REC 기록</h1><div class="sub">고등 학생 기록 (선생님용)</div>'}
function login(msg){
  app.innerHTML=head()+'<div class="pw"><input id="pw" type="password" placeholder="선생님 비밀번호" autocomplete="current-password"><button class="bt p" id="go">보기</button></div><div class="msg" id="m">'+esc(msg||'')+'</div>';
  document.getElementById('go').onclick=function(){pw=document.getElementById('pw').value;load()};
  document.getElementById('pw').onkeydown=function(e){if(e.key==='Enter')document.getElementById('go').onclick()};
}
function load(){
  var m=document.getElementById('m');if(m)m.textContent='불러오는 중...';
  post({act:'admin_list'}).then(function(r){
    if(!r||!r.ok){if(r&&r.err==='pw'){try{localStorage.removeItem(PK)}catch(e){}login('비밀번호가 맞지 않아요.')}else login('불러오지 못했어요. 잠시 후 다시 해 주세요.');return}
    try{localStorage.setItem(PK,pw)}catch(e){}
    ALL=r.all||{};readNames();draw();
  }).catch(function(){login('연결이 안 됐어요. 인터넷을 확인해 주세요.')});
}
function readNames(){
  NAMES={};
  try{NAMES=JSON.parse(localStorage.getItem(NK)||'{}')||{}}catch(e){NAMES={}}
  var n=ALL['REC|names'];if(n&&n.map){var v=val(n.map);if(v&&typeof v==='object'){for(var k in v)NAMES[k]=v[k]}}
}
function dur(s){s=Math.round(s);if(s<=0)return '0분';if(s<60)return '1분 미만';return s>=3600?Math.floor(s/3600)+'시간 '+Math.round(s%3600/60)+'분':Math.round(s/60)+'분'}
var CNK={"geumcheon-go1":{"key:L3:hangeul":40,"key:L3:eobeop":32,"key:L3:dongsa":41,"key:L3:check":84,"key:L3:yeongeo":40,"key:L3:yesang1":20,"key:L3:yesang2":21,"key:L3:yesang3":20,"key:L3:yesang4":20,"key:L4:hangeul":42,"key:L4:eobeop":42,"key:L4:dongsa":46,"key:L4:check":120,"key:L4:yeongeo":42,"key:L4:yesang1":20,"key:L4:yesang2":20,"key:L4:yesang3":20,"key:L4:yesang4":20,"key:plus:c2-mirae-kim-34:g1":22,"key:plus:c2-mirae-kim-34:g2":22,"key:plus:c2-mirae-kim-34:g3":21},"geumcheon-go2":{"key:L4:hangeul":60,"key:L4:eobeop":34,"key:L4:dongsa":42,"key:L4:yeongeo":60},"cheongseok-go1":{"key:L3:hangeul":38,"key:L3:eobeop":38,"key:L3:dongsa":38,"key:L3:check":85,"key:L3:yeongeo":38,"key:L3:yesang1":20,"key:L3:yesang2":20,"key:L3:yesang3":20,"key:L3:yesang4":20,"key:L4:hangeul":51,"key:L4:eobeop":51,"key:L4:dongsa":51,"key:L4:check":111,"key:L4:yeongeo":51,"key:L4:yesang1":20,"key:L4:yesang2":20,"key:L4:yesang3":20,"key:L4:yesang4":20,"key:plus:c2-neungryul-min-34:g1":25,"key:plus:c2-neungryul-min-34:g2":25,"key:plus:c2-neungryul-min-34:g3":25,"key:plus:c2-neungryul-min-34:g4":25,"key:plus:c2-neungryul-min-34:n3_1":25,"key:plus:c2-neungryul-min-34:n3_2":25,"key:plus:c2-neungryul-min-34:n4_1":25,"key:plus:c2-neungryul-min-34:n4_2":25},"cheongseok-go2":{"key:L4:hangeul":60,"key:L4:eobeop":34,"key:L4:dongsa":42,"key:L4:yeongeo":60},"jusung-go1":{"key:L3:hangeul":47,"key:L3:eobeop":47,"key:L3:dongsa":47,"key:L3:check":112,"key:L3:yeongeo":47,"key:L3:yesang1":20,"key:L3:yesang2":20,"key:L3:yesang3":20,"key:L3:yesang4":20,"key:L4:hangeul":52,"key:L4:eobeop":44,"key:L4:dongsa":52,"key:L4:check":98,"key:L4:yeongeo":52,"key:L4:yesang1":20,"key:L4:yesang2":20,"key:L4:yesang3":20,"key:L4:yesang4":20,"key:plus:c2-neungryul-oh-34:g1":23,"key:plus:c2-neungryul-oh-34:g2":22,"key:plus:c2-neungryul-oh-34:g3":23,"key:plus:c2-neungryul-oh-34:g4":23,"key:plus:c2-neungryul-oh-34:g5":23,"key:plus:c2-neungryul-oh-34:n3_1":25,"key:plus:c2-neungryul-oh-34:n3_2":25,"key:plus:c2-neungryul-oh-34:n4_1":25,"key:plus:c2-neungryul-oh-34:n4_2":25},"jusung-go2":{"key:L4:hangeul":60,"key:L4:eobeop":34,"key:L4:dongsa":42,"key:L4:yeongeo":60,"key:mock:hangeul-2211":86,"key:mock:eobeop-2211":84,"key:mock:dongsa-2211":85,"key:mock:yeongeo-2211":86,"key:mock:hangeul-2311":118,"key:mock:eobeop-2311":117,"key:mock:dongsa-2311":117,"key:mock:yeongeo-2311":118,"key:mock:hangeul-2410":54,"key:mock:eobeop-2410":54,"key:mock:dongsa-2410":54,"key:mock:yeongeo-2410":54}};
var SC={gk:'금천',js:'주성',cs:'청석',geumcheon:'금천',jusung:'주성',cheongseok:'청석'};
function info(id){
  var d=ALL[id],ks=Object.keys(d),o={id:id,last:0,go2:/^REC\|go[12]\|/.test(id),school:'',chips:[]};
  ks.forEach(function(k){var t=d[k].t;if(t>1&&t>o.last)o.last=t;
    var m=/^(gk|js|cs)26-/.exec(k)||/(geumcheon|jusung|cheongseok)-go[12]/.exec(k);if(m&&!o.school)o.school=SC[m[1]]});
  if(o.go2){
    var p=id.split('|');o.name=p[2];o.grade=id.indexOf('REC|go1|')===0?'고1':'고2';
    var tm={q:0,w:0,h:0,t:0},wrong=0,qg=0,qd=0,pre=0,t0=day0(Date.now()),CUT=Date.parse('2026-10-22T13:22:50Z');
    var PT={};ks.forEach(function(k){if(k.indexOf('vhp:')===0){var o2=val(d[k]);if(o2&&typeof o2==='object')Object.keys(o2).forEach(function(q){var e=o2[q];if(e&&e.t&&(!PT[q]||e.t>PT[q]))PT[q]=e.t})}});
    ks.forEach(function(k){
      var m=/^vhts:[^:]+:(\d{4})-(\d\d)-(\d\d):[^:]+:([qwh])$/.exec(k);
      if(m){var v=+val(d[k])||0;tm[m[4]]+=v;if(new Date(+m[1],+m[2]-1,+m[3]).getTime()===t0)tm.t+=v}
      if(k.indexOf('vhd:')===0){var pv0=+val(d[k])||0,pt0=PT[k.slice(4)];if(pv0>0&&pt0&&pt0<CUT)pre+=pv0}
      if(k.indexOf('vhw:')===0){var w=val(d[k]);if(Array.isArray(w))wrong+=w.length}
      if(k.indexOf('vhp:')===0){var tb=CNK[k.slice(4)],pv=val(d[k]);if(tb&&pv&&typeof pv==='object')Object.keys(tb).forEach(function(q){var e=pv[q];if(e&&e.n){qg+=tb[q];if(e.t&&day0(e.t)===t0)qd+=tb[q]}})}
    });
    var tt=tm.q+tm.w+tm.h+pre;
    o.stats=[['누적 이용시간',dur(tt)],['오늘 이용시간',dur(tm.t)],['누적 채점문항',qg+'문제'],['오답노트',wrong+'개']];
  }else{
    o.code=id.split('|')[1];o.grade='고1';
    var done=0,today=0,rep=0,sum=0,hw=0,t0=day0(Date.now());
    ks.forEach(function(k){
      if(/^(gk|js|cs)26-st:/.test(k)){var s=val(d[k])||{},dn=s.done||{};Object.keys(dn).forEach(function(i){if(dn[i]){done++;if(+dn[i]>=t0)today++}})}
      if(/^(gk|js|cs)26-rep$/.test(k)){var r=val(d[k])||{};Object.keys(r).forEach(function(i){rep++;sum+=+(r[i].pct||0)})}
      if(/^(gk|js|cs)26-hwauto$/.test(k)){var h=val(d[k])||{};Object.keys(h).forEach(function(i){hw+=+h[i]||0})}
    });
    o.chips.push('완료 '+done+'개');
    o.chips.push('오늘 체크 '+today+'개');
    if(rep)o.chips.push('점수 기록 '+rep+'개 · 최고점 평균 '+Math.round(sum/rep)+'점');
    if(hw)o.chips.push('숙제 세트 '+hw+'회');
    o.name=NAMES[o.code]||'';
  }
  return o;
}
var FG='',FS='';try{FG=localStorage.getItem('rec_fg')||'';FS=localStorage.getItem('rec_fs')||''}catch(e){}
function fbtn(a,val,label,n){return '<button class="bt'+(val===(a==='g'?FG:FS)?' p':'')+'" data-f'+a+'="'+esc(val)+'">'+esc(label)+' '+n+'</button>'}
function draw(){
  var ids=Object.keys(ALL).filter(function(id){return id.indexOf('REC|')===0&&id!=='REC|names'});
  var all0=ids.map(info).sort(function(a,b){return b.last-a.last});
  var rows=all0.filter(function(r){return (!FG||r.grade===FG)&&(!FS||(FS==='-'?!r.school:r.school===FS))});
  var t0=day0(Date.now()),todayN=rows.filter(function(r){return r.last>=t0}).length;
  var late=rows.filter(function(r){return !r.last||t0-day0(r.last)>=3*86400000});
  var h=head()+'<div class="row"><button class="bt p" id="rf">새로고침</button><button class="bt" id="lo">나가기</button></div>';
  var gs=['고1','고2'].filter(function(g){return all0.some(function(r){return r.grade===g})});
  var inG=all0.filter(function(r){return !FG||r.grade===FG});
  var scs=[];inG.forEach(function(r){if(r.school&&scs.indexOf(r.school)<0)scs.push(r.school)});
  var noSc=inG.some(function(r){return !r.school});
  h+='<div class="fl">'+fbtn('g','','전체',all0.length)+gs.map(function(g){return fbtn('g',g,g,all0.filter(function(r){return r.grade===g}).length)}).join('')+'</div>';
  if(scs.length>1||FS)h+='<div class="fl">'+fbtn('s','','학교 전체',inG.length)+scs.map(function(s){return fbtn('s',s,s,inG.filter(function(r){return r.school===s}).length)}).join('')+(noSc?fbtn('s','-','미확인',inG.filter(function(r){return !r.school}).length):'')+'</div>';
  h+='<div class="kp"><div><span>학생</span><b>'+rows.length+'<small>명</small></b></div><div><span>오늘 기록</span><b>'+todayN+'<small>명</small></b></div><div><span>3일 이상 없음</span><b>'+late.length+'<small>명</small></b></div></div>';
  if(late.length)h+='<div class="late">3일 이상 기록 없음: '+late.map(function(r){return esc(r.name||r.code||'?')}).join(', ')+'</div>';
  if(!rows.length)h+='<div class="msg">'+(all0.length?'이 조건에 맞는 학생이 없어요.':'아직 기록이 있는 학생이 없어요.')+'</div>';
  if(rows.length){h+='<div class="lst">';rows.forEach(function(r){var nm=r.name||('코드 '+r.code);
    h+='<div class="rw"><div class="av">'+esc(nm.replace(/^코드 /,'').charAt(0)||'?')+'</div><div class="bd"><div class="tp"><div class="nm"><b>'+esc(nm)+'</b><span class="s">'+esc((r.school?r.school+' ':'')+r.grade)+'</span></div><span class="l">'+(r.last?fd(r.last):'기록 없음')+'</span></div>'
    +(r.stats?'<div class="gr">'+r.stats.map(function(c){return '<div><span>'+esc(c[0])+'</span><b>'+esc(c[1])+'</b></div>'}).join('')+'</div>':'<div class="mt">'+r.chips.map(esc).join(' · ')+'</div>')+'</div></div>';
  });h+='</div>'}
  h+='<details id="nm"><summary>이름 연결 (고1, 처음 한 번)</summary><div class="pv">학생 개인링크 시트에서 이름과 개인링크가 있는 칸을 복사해 아래에 붙여넣어 주세요. 이름은 구글 시트에만 저장되고 공개 저장소에는 들어가지 않아요.</div><textarea id="tx" placeholder="여기에 붙여넣기"></textarea><div class="pv" id="pv"></div><div class="row"><button class="bt p" id="sv">저장</button></div></details>';
  h+='<div class="foot">비타민 영어클리닉</div>';
  app.innerHTML=h;
  document.getElementById('rf').onclick=load;
  [].forEach.call(document.querySelectorAll('[data-fg]'),function(b){b.onclick=function(){FG=b.getAttribute('data-fg');try{localStorage.setItem('rec_fg',FG)}catch(e){}draw()}});
  [].forEach.call(document.querySelectorAll('[data-fs]'),function(b){b.onclick=function(){FS=b.getAttribute('data-fs');try{localStorage.setItem('rec_fs',FS)}catch(e){}draw()}});
  document.getElementById('lo').onclick=function(){try{localStorage.removeItem(PK)}catch(e){}pw='';login('')};
  var tx=document.getElementById('tx'),pv=document.getElementById('pv'),cur={};
  var codes={};all0.forEach(function(r){if(r.code)codes[r.code]=1});
  tx.oninput=function(){cur=parse(tx.value,codes);var n=Object.keys(cur).length;pv.textContent=n?n+'명 인식: '+Object.keys(cur).map(function(c){return cur[c]}).join(', '):'인식된 학생이 없어요.'};
  document.getElementById('sv').onclick=function(){
    var n=Object.keys(cur).length;if(!n){pv.textContent='붙여넣은 내용에서 이름과 개인링크(또는 코드)를 찾지 못했어요.';return}
    var all={};for(var k in NAMES)all[k]=NAMES[k];for(k in cur)all[k]=cur[k];
    try{localStorage.setItem(NK,JSON.stringify(all))}catch(e){}
    post({act:'admin_put',id:'REC|names',key:'map',v:all}).then(function(r){
      pv.textContent=(r&&r.ok)?'저장했어요. 다른 폰에서도 보여요.':'이 폰에만 저장했어요.';readNames();setTimeout(draw,900)
    }).catch(function(){pv.textContent='이 폰에만 저장했어요.';readNames();setTimeout(draw,900)});
  };
}
function parse(txt,codes){
  var map={};
  txt.split(/\r?\n/).forEach(function(line){
    var toks=line.split(/[\t ,;]+/).filter(Boolean),code=null,name=null;
    toks.forEach(function(t){
      var m=/[?&]c=([A-Za-z0-9]+)/.exec(t);
      if(m){code=m[1].toLowerCase();return}
      if(/^[A-Za-z0-9]{3,12}$/.test(t)&&codes[t.toLowerCase()]){code=t.toLowerCase();return}
      if(!name&&/^[가-힣]{2,4}$/.test(t)&&!/고$/.test(t))name=t;
    });
    if(code&&name)map[code]=name;
  });
  return map;
}
if(pw)load();else login('');
})();
</script></body></html>
