   {t:'본문 읽고 내용 잡기',core:[c('jwa','좌본문우해석',n+'/jwa.html','pdf'),c('hangeul','한글채우기 정답',n+'/hangeul.html','pdf'),c('find','틀린 곳 찾기',n+'/find.html','app',{sc:1}),v(1),c('eobeop','어법선택 정답·해설',n+'/eobeop.html','pdf')],

function care(){return P()==='c'}
function closed(c){return care()&&c.cc&&!S.unl[c.id]}
function done(c){
  if(S.done[c.id])return true;

  return false
}
function gating(c){return !(c.k==='tonly')&&!c.ng&&!closed(c)}

  if(TM&&ss('js26-tx')==='1')return true;

}
function lessonOpen(L){
  var ix=LESSONS.indexOf(L.n);

}

var NUM=['①','②','③','④','⑤','⑥'];
