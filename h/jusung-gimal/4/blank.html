mark{background:#ffe3e0;color:#8a1c1c;border-radius:4px;padding:0 3px}

.sechd{margin:26px 0 4px}

.wrap{max-width:420px}

.ex .th{background:var(--priL);border-radius:10px;padding:8px 12px;margin:6px 0;font-size:16px}.ex .ol2{list-style:none;margin:8px 0 2px;padding:0;font-size:15px;color:var(--sub)}.ex .ol2 li{margin:5px 0}.ex .ol2 li.c{color:var(--pri);font-weight:700}
.sent{display:block;margin:0 0 7px}.sent .kr{display:none;color:var(--sub);font-size:14.5px;line-height:1.6;margin:1px 0 3px;font-weight:400}body.kon .sent:not(.blk) .kr,.sent.open:not(.blk) .kr{display:block}.sent:not(.blk){cursor:pointer}#kt{margin-left:auto}.bar #rs{margin-left:0}

<link rel="icon" type="image/svg+xml" href="../icon.svg"><link rel="apple-touch-icon" href="../icon-180.png"><meta name="apple-mobile-web-app-title" content="주성고정답"></head><body><div class="wrap"><div class="top"><a class="back" href="../index.html">← 주성고 정답 목록</a></div><h1>4과 · 빈칸 추론 연습 (매번 다른 문제)</h1><p class="lede">같은 지문에서 빈칸이 계속 바뀌어요. 한 번 나온 문제는 한 바퀴를 다 돌 때까지 다시 나오지 않아요. 풀 때마다 문제와 보기 순서가 달라져요.</p><div class="bar"><span class="prog" id="prog"></span><button id="kt" type="button">한글 해석 보기</button><button id="rs" type="button">처음부터 다시</button></div><div id="stage"></div><div class="foot">비타민 영어클리닉 · 주성고1 공통영어2 4과</div></div>
<script src="../gate.js"></script>
<script>
var D={"segs": [{"id": "A", "title": "❶ 팔을 다쳤을 때와 웹의 어려움", "sents": ["Imagine you have fallen down and broken your right arm.", "There are some things that would be difficult to do with your injured arm.", "For example, you might not be able to carry heavy boxes or ride your bike.", "What about accessing the Internet?", "If you are right-handed, using a computer mouse or touchscreen with your left hand would be awkward and take a lot of time.", "However, this is a minor challenge compared to what some of us face on the Internet.", "For people with certain disabilities, many websites can be nearly impossible to use.", "This is the reason why web accessibility is important.", "Web accessibility is the practice of making sure that websites can be used by everyone, including people with disabilities."], "a": 0, "theme": "팔을 다치면 일상이 불편해지듯, 장애가 있는 사람에게는 많은 웹 사이트가 사용하기 거의 불가능하다는 도입이에요. 그래서 웹 접근성이 중요하고, 그것은 모두가 쓸 수 있게 하는 실천이에요.", "kos": ["당신이 넘어져 당신의 오른팔이 부러졌다고 상상해 보라.", "당신의 다친 팔로 하기에 어려울 몇몇 일들이 있다.", "예를 들어, 당신은 무거운 상자를 옮기거나 자전거를 타지 못할 수도 있다.", "인터넷에 접속하는 것은 어떨까?", "만약 당신이 오른손잡이라면, 당신의 왼손으로 컴퓨터 마우스나 터치스크린을 사용하는 것은 어색하고 많은 시간이 걸릴 것이다.", "그러나 이것은 우리 중 몇몇이 인터넷에서 직면하는 것에 비해 작은 문제이다.", "특정 장애가 있는 사람들에게는, 많은 웹 사이트가 사용하기에 거의 불가능할 수 있다.", "이것이 웹 접근성이 중요한 이유이다.", "웹 접근성은 웹 사이트가 장애가 있는 사람들을 포함하여 반드시 모두에게 사용될 수 있도록 하는 실천이다."]}, {"id": "B", "title": "❷ 이미지는 읽을 수 없다", "sents": ["So what exactly makes a website accessible?", "Here are some common features of accessible websites.", "Along with text, most websites include other forms of information, such as images.", "Sometimes such visual information is important for understanding the text. This is a problem for users with visual disabilities.", "When they go on a website, they often use programs called “screen readers,” which read online text aloud. However, these programs cannot “read” images."], "a": 7, "theme": "접근성 있는 웹 사이트의 첫 번째 특징을 말하려는 대목이에요. 시각 장애인은 스크린 리더로 글을 듣지만, 스크린 리더는 이미지를 읽지 못해 정보를 놓친다는 문제를 짚어요.", "kos": ["그렇다면 무엇이 정확히 웹 사이트를 접근 가능하게 만들까?", "여기 접근성 있는 웹 사이트들의 몇 가지 공통점이 있다.", "텍스트와 함께, 대부분의 웹 사이트는 이미지와 같은 다른 형식의 정보를 포함한다.", "때로는 그러한 시각적 정보가 텍스트를 이해하는 데 중요하다. 이는 시각 장애를 가진 사용자에게 문제이다.", "그들이 웹 사이트에 접속할 때, 그들은 종종 ‘스크린 리더’라 불리는 프로그램을 사용하는데, 이것은 온라인 텍스트를 소리 내어 읽어 준다. 그러나 이러한 프로그램들은 이미지를 ‘읽을’ 수 없다."]}, {"id": "C", "title": "❷ 대체 텍스트로 해결하기", "sents": ["Accessible websites solve this problem by providing alternative text, also known as “alt text.”", "Alt text is a brief description of non-textual information.", "For instance, if an image shows a group of students, its alt text would explain how many students are in the image and what they are doing.", "Screen readers can detect this alt text and read it aloud.", "This way, alt text ensures that people with visual disabilities can access more of the information on a website."], "a": 10, "theme": "해결책은 이미지에 대체 텍스트를 붙이는 것이에요. 스크린 리더가 그 설명을 읽어 주니, 시각 장애인도 웹 사이트의 더 많은 정보에 접근할 수 있어요.", "kos": ["접근성 있는 웹 사이트는 ‘alt text’라고도 알려진 대체 텍스트를 제공함으로써 이 문제를 해결한다.", "대체 텍스트는 비문자 정보에 대한 간단한 설명이다.", "예를 들어, 만약 이미지가 한 무리의 학생들을 보여 준다면, 그것의 대체 텍스트는 이미지에 얼마나 많은 학생들이 있으며 그들이 무엇을 하고 있는지 설명할 것이다.", "스크린 리더는 이 대체 텍스트를 감지하고 소리 내어 읽어 줄 수 있다.", "이러한 방식으로, 대체 텍스트는 시각 장애를 가진 사람들이 웹 사이트에서 더 많은 정보에 접근할 수 있도록 보장한다."]}, {"id": "D", "title": "❸ 대본과 자막", "sents": ["In some cases, audio content cannot be accessed or understood.", "Some people may have hearing disabilities, while others might be in places where they can’t listen to audio, such as a quiet library.", "Therefore, accessible websites often offer other ways to access information that is presented in audio form.", "For example, they may provide transcripts or captions that can help users access this information.", "Transcripts are text versions of the entire audio content, while captions are text versions of the audio that appear in a video as it plays.", "Captions include not only the text version of the spoken words but also descriptions of the music and other sounds in the video."], "a": 13, "theme": "소리 정보는 청각 장애인뿐 아니라 조용한 도서관에 있는 사람도 듣기 어려워요. 그래서 접근성 있는 웹 사이트는 대본이나 자막을 함께 제공해요.", "kos": ["일부 경우에, 음성 콘텐츠는 접근되거나 이해될 수 없다.", "어떤 사람들은 청각 장애를 가지고 있을 수도 있는데 반하여, 다른 사람들은 조용한 도서관과 같이 그들이 음성을 들을 수 없는 장소에 있을지도 모른다.", "그러므로 접근성 있는 웹 사이트들은 흔히 음성 형식으로 제시되는 정보에 접근할 수 있는 다른 방법들을 제공한다.", "예를 들어, 그것들은 사용자가 이 정보에 접근하는 데 도움이 될 수 있는 대본이나 자막을 제공할 수도 있다.", "대본은 전체 음성 콘텐츠의 텍스트 버전인 반면, 자막은 영상이 재생될 때 영상 안에 나타나는 음성의 텍스트 버전이다.", "자막은 발화된 단어의 텍스트 버전뿐만 아니라 영상 내의 음악과 다른 소리들에 대한 설명도 포함한다."]}, {"id": "E", "title": "❹ 보고 듣기에 쉬운 콘텐츠", "sents": ["Having a visual disability doesn’t necessarily mean a person can’t see at all.", "Some people, including many elderly people, simply have poor eyesight. This makes it difficult for them to read.", "For this reason, accessible websites have a background color that contrasts with the color of their text.", "This makes the text clear enough for most people to see.", "As for audio content, accessible websites allow users to adjust the volume of background sound or to turn it off altogether.", "This gives users both with and without hearing difficulties more control over their experience while they are using the sites."], "a": 18, "theme": "시력이 나쁜 사람을 위해 글자와 대조되는 배경색을 쓰고, 소리에 대해서는 배경음의 음량을 조절하거나 끌 수 있게 해요. 청각 장애 여부와 상관없이 모두가 더 많은 통제권을 가져요.", "kos": ["시각 장애를 지니고 있는 것은 반드시 한 사람이 전혀 보지 못한다는 것을 의미하지는 않는다.", "많은 노인들을 포함해서 일부 사람들은 그저 좋지 않은 시력을 가지고 있다. 이는 그들이 읽는 것을 어렵게 만든다.", "이러한 이유로, 접근성 있는 웹 사이트는 텍스트 색과 대조를 이루는 배경 색을 지니고 있다.", "이는 대부분의 사람들이 보기에 텍스트를 충분히 명확하게 만들어 준다.", "음성 콘텐츠에 관해 말하자면, 접근성 있는 웹 사이트는 사용자가 배경음의 음량을 조절하거나 완전히 끌 수 있도록 해준다.", "이는 청각 장애가 있는 사용자와 없는 사용자 모두에게 그들이 사이트를 사용하는 동안 그들의 경험에 대한 더 많은 통제권을 준다."]}, {"id": "F", "title": "❺ 키보드만으로 탐색하기", "sents": ["Some users have disabilities that limit the movement of their hands.", "They rely on their keyboards, rather than a mouse, to navigate websites.", "On accessible websites, users can access everything on the site using only a keyboard.", "This means that links, buttons, and fields, which are spaces where information is entered, can be accessed through keyboard navigation.", "Users navigate the websites by making use of keys such as the space bar, the arrow keys, the enter key, and the tab key.", "For example, they can use the tab key to jump from one part of a web page to another.", "Both users with disabilities and those with temporarily injured hands can benefit from this kind of navigation."], "a": 23, "theme": "손을 움직이기 어려운 사용자는 마우스 대신 키보드를 써요. 그래서 링크·버튼·입력란까지 키보드만으로 접근할 수 있어야 하고, 일시적으로 손을 다친 사람도 도움을 받아요.", "kos": ["일부 사용자들은 그들의 손의 움직임을 제한하는 장애를 가지고 있다.", "그들은 웹 사이트를 탐색하기 위해 마우스보다는 키보드에 의존한다.", "접근성 있는 웹 사이트에서, 사용자는 키보드만을 사용하여 사이트에 있는 모든 것에 접근할 수 있다.", "이는 링크, 버튼 그리고 정보가 입력되는 공간인 필드가 키보드 탐색을 통해 접근될 수 있다는 것을 의미한다.", "사용자는 스페이스 바, 화살표 키, 엔터 키 그리고 탭 키와 같은 키를 사용함으로써 웹 사이트를 탐색한다.", "예를 들어, 그들은 웹 페이지의 한 부분에서 다른 부분으로 뛰어넘기 위해 탭 키를 사용할 수 있다.", "장애를 가진 사용자와 일시적으로 손을 다친 사용자 모두가 이러한 종류의 탐색으로부터 득을 본다."]}, {"id": "G", "title": "❻ 색 말고 다른 표시도 쓰기", "sents": ["Color blindness is a common visual disability. People with color blindness find it difficult to tell some colors apart.", "This can cause problems, especially when graphs and charts only use colors to show the differences between sets of information.", "Accessible websites use other indicators along with the colors.", "For example, a line in green may also be dotted, while a line in blue is solid.", "This ensures that everyone can tell the two lines apart.", "The accessibility features of websites don’t just help people with disabilities.", "They can make online experiences easier for everyone, regardless of abilities or situations.", "When websites are easy to navigate and understand, we can all benefit from a more inclusive online experience."], "a": 28, "theme": "색맹인 사람은 색만으로 차이를 나타낸 그래프를 읽기 어려워요. 그래서 점선·실선처럼 색 이외의 표시를 함께 쓰고, 이런 접근성 기능은 결국 모두에게 이로워요.", "kos": ["색맹은 흔한 시각 장애이다. 색맹인 사람들은 몇몇 색들을 구별하는 것을 어렵다고 여긴다.", "이는 특히 그래프와 차트가 정보 세트들 간의 차이를 나타내기 위해 색상만을 사용할 때 문제를 일으킬 수 있다.", "접근성 있는 웹 사이트는 색상과 더불어 다른 지표들도 사용한다.", "예를 들어, 녹색 선은 점선일 수도 있는 반면에, 파란색 선은 실선이다.", "이는 모든 이가 두 선을 구별할 수 있도록 한다.", "웹 사이트의 접근성 특징들은 단지 장애가 있는 사람들만을 돕는 것이 아니다.", "그것들은 능력이나 상황과 상관없이 모두에게 온라인 경험을 더 용이하게 만들어 줄 수 있다.", "웹 사이트가 탐색하고 이해하기에 더 쉬울 때, 우리는 더 차별 없는 온라인 경험으로부터 득을 볼 수 있다."]}, {"id": "H", "title": "❼ 문화마다 다른 읽기 방향", "sents": ["Reading and writing systems are different across cultures.", "People from Western cultures read and write from left to right, while those from some Middle Eastern cultures read and write from right to left.", "People from some Eastern cultures, like that of Japan, read and write from top to bottom.", "Some global websites take these differences into consideration and adjust their websites for people in different regions.", "In countries where text is read from right to left, the website’s search button is on the left and the logo is on the right.", "If you visit the same websites in a different language setting, you will see a different format."], "a": 34, "theme": "읽고 쓰는 방향이 문화마다 달라서(왼→오, 오→왼, 위→아래), 세계적인 웹 사이트는 지역에 맞게 검색 버튼과 로고 위치까지 바꿔요.", "kos": ["읽기와 쓰기 체계는 문화마다 다르다.", "서양 문화 출신의 사람들은 왼쪽에서 오른쪽으로 읽고 쓰는 반면, 일부 중동 문화 출신의 사람들은 오른쪽에서 왼쪽으로 읽고 쓴다.", "일본과 같은 일부 동양 문화 출신 사람들은 위에서 아래로 읽고 쓴다.", "몇몇 세계적인 웹 사이트는 이러한 차이를 고려하고 다른 지역의 사람들을 위해 그들의 웹 사이트를 조정한다.", "글이 오른쪽에서 왼쪽으로 읽히는 국가에서는 웹 사이트의 검색 버튼이 왼쪽에 있고 로고가 오른쪽에 있다.", "만약 당신이 동일한 웹 사이트를 다른 언어 설정으로 방문한다면, 당신은 다른 구성 방식을 보게 될 것이다."]}], "items": [{"seg": 0, "si": 0, "ans": "fallen down and broken your right arm", "ako": "넘어져서 오른팔이 부러진", "clue": "", "ds": [["lost the ability to use your left hand", "왼손을 사용하는 능력을 잃은", ""], ["forgotten how to use a computer", "컴퓨터 사용법을 잊어버린", ""], ["recovered completely from a broken arm", "부러진 팔에서 완전히 회복된", ""], ["fallen asleep in front of the screen", "화면 앞에서 잠이 든", ""]], "ko": "당신이 넘어져 당신의 오른팔이 부러졌다고 상상해 보라."}, {"seg": 0, "si": 1, "ans": "difficult to do with your injured arm", "ako": "다친 팔로 하기에 어려운", "clue": "", "ds": [["easy to do even with your injured arm", "다친 팔로도 하기에 쉬운", ""], ["impossible to do with either of your arms", "어느 쪽 팔로도 하기에 불가능한", ""], ["difficult to do on the Internet", "인터넷에서 하기에 어려운", ""], ["necessary to do for your health", "건강을 위해 해야 하는", ""]], "ko": "당신의 다친 팔로 하기에 어려울 몇몇 일들이 있다."}, {"seg": 0, "si": 2, "ans": "carry heavy boxes or ride your bike", "ako": "무거운 상자를 옮기거나 자전거를 타다", "clue": "", "ds": [["watch TV or listen to music", "TV를 보거나 음악을 듣다", ""], ["use a computer mouse with your left hand", "왼손으로 컴퓨터 마우스를 사용하다", ""], ["do anything at all by yourself", "혼자서는 아무것도 하다", ""], ["walk to school or run in the park", "학교에 걸어가거나 공원에서 달리다", ""]], "ko": "예를 들어, 당신은 무거운 상자를 옮기거나 자전거를 타지 못할 수도 있다."}, {"seg": 0, "si": 4, "ans": "awkward and take a lot of time", "ako": "어색하고 많은 시간이 걸리다", "clue": "", "ds": [["easy and save a lot of time", "쉽고 많은 시간을 절약하다", ""], ["impossible and cost a lot of money", "불가능하고 많은 돈이 들다", ""], ["natural and need no practice", "자연스럽고 연습이 필요 없다", ""], ["painful and require a doctor’s help", "고통스럽고 의사의 도움이 필요하다", ""]], "ko": "만약 당신이 오른손잡이라면, 당신의 왼손으로 컴퓨터 마우스나 터치스크린을 사용하는 것은 어색하고 많은 시간이 걸릴 것이다."}, {"seg": 0, "si": 5, "ans": "a minor challenge", "ako": "작은 문제", "clue": "", "ds": [["a much greater challenge", "훨씬 더 큰 문제", ""], ["the same kind of challenge", "같은 종류의 문제", ""], ["an easy solution", "쉬운 해결책", ""], ["the biggest challenge of all", "그 무엇보다 가장 큰 문제", ""]], "ko": "그러나 이것은 우리 중 몇몇이 인터넷에서 직면하는 것에 비해 작은 문제이다."}, {"seg": 0, "si": 6, "ans": "nearly impossible to use", "ako": "사용하기에 거의 불가능한", "clue": "", "ds": [["a little difficult to use", "사용하기에 약간 어려운", ""], ["completely free to use", "사용하기에 완전히 무료인", ""], ["very exciting to use", "사용하기에 매우 흥미로운", ""], ["impossible to build", "만들기 불가능한", ""]], "ko": "특정 장애가 있는 사람들에게는, 많은 웹 사이트가 사용하기에 거의 불가능할 수 있다."}, {"seg": 0, "si": 7, "ans": "why web accessibility is important", "ako": "웹 접근성이 왜 중요한지", "clue": "", "ds": [["why people prefer using a mouse", "사람들이 마우스 사용을 선호하는 이유", ""], ["why injured arms heal so slowly", "다친 팔이 그렇게 느리게 낫는 이유", ""], ["why every website must be free", "모든 웹 사이트가 무료여야 하는 이유", ""], ["why the Internet is changing so fast", "인터넷이 그렇게 빠르게 변하는 이유", ""]], "ko": "이것이 웹 접근성이 중요한 이유이다."}, {"seg": 1, "si": 2, "ans": "other forms of information, such as images", "ako": "이미지와 같은 다른 형식의 정보", "clue": "", "ds": [["no other forms of information at all", "다른 형식의 정보는 전혀 없음", ""], ["every kind of information, such as smells", "냄새 같은 모든 종류의 정보", ""], ["other websites, such as search engines", "검색 엔진 같은 다른 웹 사이트", ""], ["other forms of text, such as long articles", "긴 기사 같은 다른 형식의 텍스트", ""]], "ko": "텍스트와 함께, 대부분의 웹 사이트는 이미지와 같은 다른 형식의 정보를 포함한다."}, {"seg": 1, "si": 3, "ans": "important for understanding the text", "ako": "텍스트를 이해하는 데 중요한", "clue": "", "ds": [["unnecessary for understanding the text", "텍스트를 이해하는 데 불필요한", ""], ["difficult for users to ignore", "사용자가 무시하기 어려운", ""], ["helpful only for users with visual disabilities", "시각 장애가 있는 사용자에게만 도움이 되는", ""], ["always more important than the text itself", "언제나 텍스트 자체보다 더 중요한", ""]], "ko": "때로는 그러한 시각적 정보가 텍스트를 이해하는 데 중요하다. 이는 시각 장애를 가진 사용자에게 문제이다."}, {"seg": 1, "si": 4, "ans": "read online text aloud", "ako": "온라인 텍스트를 소리 내어 읽다", "clue": "", "ds": [["translate online text into English", "온라인 텍스트를 영어로 번역하다", ""], ["describe images in detail", "이미지를 자세히 설명하다", ""], ["make online text bigger and brighter", "온라인 텍스트를 더 크고 밝게 만들다", ""], ["read every image and video aloud", "모든 이미지와 영상을 소리 내어 읽다", ""]], "ko": "그들이 웹 사이트에 접속할 때, 그들은 종종 ‘스크린 리더’라 불리는 프로그램을 사용하는데, 이것은 온라인 텍스트를 소리 내어 읽어 준다. 그러나 이러한 프로그램들은 이미지를 ‘읽을’ 수 없다."}, {"seg": 2, "si": 0, "ans": "alternative text", "ako": "대체 텍스트", "clue": "", "ds": [["larger images and louder sounds", "더 큰 이미지와 더 큰 소리", ""], ["a free screen reader program", "무료 스크린 리더 프로그램", ""], ["a text version of the whole website", "웹 사이트 전체의 텍스트 버전", ""], ["captions for every video", "모든 영상의 자막", ""]], "ko": "접근성 있는 웹 사이트는 ‘alt text’라고도 알려진 대체 텍스트를 제공함으로써 이 문제를 해결한다."}, {"seg": 2, "si": 2, "ans": "how many students are in the image and what they are doing", "ako": "이미지에 몇 명의 학생이 있고 그들이 무엇을 하고 있는지", "clue": "", "ds": [["who took the picture and when it was taken", "누가 사진을 찍었고 언제 찍혔는지", ""], ["why the students are in the image", "왜 그 학생들이 이미지에 있는지", ""], ["how the image was made on a computer", "그 이미지가 컴퓨터로 어떻게 만들어졌는지", ""], ["which students are the best in the class", "어떤 학생들이 반에서 가장 뛰어난지", ""]], "ko": "예를 들어, 만약 이미지가 한 무리의 학생들을 보여 준다면, 그것의 대체 텍스트는 이미지에 얼마나 많은 학생들이 있으며 그들이 무엇을 하고 있는지 설명할 것이다."}, {"seg": 2, "si": 3, "ans": "detect this alt text and read it aloud", "ako": "이 대체 텍스트를 감지하고 소리 내어 읽다", "clue": "", "ds": [["ignore this alt text and skip the image", "이 대체 텍스트를 무시하고 이미지를 건너뛰다", ""], ["turn this alt text into an image", "이 대체 텍스트를 이미지로 바꾸다", ""], ["translate this alt text into other languages", "이 대체 텍스트를 다른 언어로 번역하다", ""], ["show this alt text only to users who can see", "이 대체 텍스트를 볼 수 있는 사용자에게만 보여 주다", ""]], "ko": "스크린 리더는 이 대체 텍스트를 감지하고 소리 내어 읽어 줄 수 있다."}, {"seg": 3, "si": 0, "ans": "cannot be accessed or understood", "ako": "접근되거나 이해될 수 없다", "clue": "", "ds": [["can be heard by everyone equally", "모두가 똑같이 들을 수 있다", ""], ["is always too loud to hear", "언제나 너무 시끄러워 들을 수 없다", ""], ["must be removed from websites", "웹 사이트에서 제거되어야 한다", ""], ["should be played without sound", "소리 없이 재생되어야 한다", ""]], "ko": "일부 경우에, 음성 콘텐츠는 접근되거나 이해될 수 없다."}, {"seg": 3, "si": 1, "ans": "places where they can’t listen to audio", "ako": "음성을 들을 수 없는 장소", "clue": "", "ds": [["places where they can’t see the screen", "화면을 볼 수 없는 장소", ""], ["places where they have to speak loudly", "큰 소리로 말해야 하는 장소", ""], ["places where they can’t use a keyboard", "키보드를 사용할 수 없는 장소", ""], ["every place where people gather", "사람들이 모이는 모든 장소", ""]], "ko": "어떤 사람들은 청각 장애를 가지고 있을 수도 있는데 반하여, 다른 사람들은 조용한 도서관과 같이 그들이 음성을 들을 수 없는 장소에 있을지도 모른다."}, {"seg": 3, "si": 2, "ans": "other ways to access information", "ako": "정보에 접근하는 다른 방법들", "clue": "", "ds": [["only one way to access information", "정보에 접근하는 단 하나의 방법", ""], ["new ways to record information", "정보를 녹음하는 새로운 방법들", ""], ["simple ways to translate information", "정보를 번역하는 간단한 방법들", ""], ["the same ways to access information", "정보에 접근하는 똑같은 방법들", ""]], "ko": "그러므로 접근성 있는 웹 사이트들은 흔히 음성 형식으로 제시되는 정보에 접근할 수 있는 다른 방법들을 제공한다."}, {"seg": 3, "si": 3, "ans": "transcripts or captions", "ako": "대본이나 자막", "clue": "", "ds": [["screen readers or alt text", "스크린 리더나 대체 텍스트", ""], ["louder volume or clearer sound", "더 큰 음량이나 더 선명한 소리", ""], ["images or graphs", "이미지나 그래프", ""], ["keyboards or touchscreens", "키보드나 터치스크린", ""]], "ko": "예를 들어, 그것들은 사용자가 이 정보에 접근하는 데 도움이 될 수 있는 대본이나 자막을 제공할 수도 있다."}, {"seg": 3, "si": 4, "ans": "the entire audio content", "ako": "전체 음성 콘텐츠", "clue": "", "ds": [["only the first part of the audio", "음성의 첫 부분만", ""], ["a short summary of the video", "영상의 짧은 요약", ""], ["the written words on the screen", "화면에 쓰인 글", ""], ["the music in the background", "배경에 깔린 음악", ""]], "ko": "대본은 전체 음성 콘텐츠의 텍스트 버전인 반면, 자막은 영상이 재생될 때 영상 안에 나타나는 음성의 텍스트 버전이다."}, {"seg": 4, "si": 0, "ans": "a person can’t see at all", "ako": "사람이 전혀 보지 못한다는 것", "clue": "", "ds": [["a person can’t read in any language", "사람이 어떤 언어도 읽지 못한다는 것", ""], ["a person can’t hear any sounds", "사람이 어떤 소리도 듣지 못한다는 것", ""], ["a person needs help every day", "사람이 매일 도움이 필요하다는 것", ""], ["a person can’t use a computer", "사람이 컴퓨터를 사용하지 못한다는 것", ""]], "ko": "시각 장애를 지니고 있는 것은 반드시 한 사람이 전혀 보지 못한다는 것을 의미하지는 않는다."}, {"seg": 4, "si": 1, "ans": "difficult for them to read", "ako": "그들이 읽기 어려운", "clue": "", "ds": [["easier for them to hear", "그들이 듣기 더 쉬운", ""], ["impossible for them to use any website", "그들이 어떤 웹 사이트도 사용할 수 없는", ""], ["unnecessary for them to read", "그들이 읽을 필요가 없는", ""], ["difficult for them to hear", "그들이 듣기 어려운", ""]], "ko": "많은 노인들을 포함해서 일부 사람들은 그저 좋지 않은 시력을 가지고 있다. 이는 그들이 읽는 것을 어렵게 만든다."}, {"seg": 4, "si": 2, "ans": "contrasts with the color of their text", "ako": "텍스트 색과 대조를 이루는", "clue": "", "ds": [["matches the color of their text", "텍스트 색과 일치하는", ""], ["is brighter than any other color", "다른 어떤 색보다 더 밝은", ""], ["changes with the time of day var SEGS=D.segs,ITEMS=D.items,POOL=ITEMS.length,SET=8,KEY='js4-blank-v1',CIR=['①','②','③','④','⑤'];
var st={queue:[],cur:null,setDrawn:0,setCorrect:0,last:-1,bag:[]},curView=null;
function load(){try{var j=localStorage.getItem(KEY);if(!j)return false;var o=JSON.parse(j);if(!o||!Array.isArray(o.queue))return false;
 var ok=o.queue.every(function(x){return typeof x==='number'&&x>=0&&x<POOL});if(!ok)return false;
 st.queue=o.queue;st.cur=(typeof o.cur==='number'&&o.cur>=0&&o.cur<POOL)?o.cur:null;st.setDrawn=o.setDrawn|0;st.setCorrect=o.setCorrect|0;st.last=(typeof o.last==='number')?o.last:-1;return true}catch(e){return false}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({queue:st.queue,cur:st.cur,setDrawn:st.setDrawn,setCorrect:st.setCorrect,last:st.last}))}catch(e){}}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function fresh(){var a=[];for(var i=0;i<POOL;i++)a.push(i);return a}
// pure: queue(남은 문제), last(직전 구간) -> 뽑을 queue 위치
function pickPos(queue,last,rnd){
 rnd=rnd||Math.random;var cnt={};queue.forEach(function(id){var s=ITEMS[id].seg;cnt[s]=(cnt[s]||0)+1});
 var segsAvail=Object.keys(cnt).map(Number).filter(function(s){return s!==last});
 if(!segsAvail.length)segsAvail=Object.keys(cnt).map(Number);
 var seg;
 if(rnd()<0.5){var mx=Math.max.apply(null,segsAvail.map(function(s){return cnt[s]}));var top=segsAvail.filter(function(s){return cnt[s]===mx});seg=top[Math.floor(rnd()*top.length)]}
 else{var tot=segsAvail.reduce(function(a,s){return a+cnt[s]},0),r=rnd()*tot;seg=segsAvail[segsAvail.length-1];for(var i=0;i<segsAvail.length;i++){r-=cnt[segsAvail[i]];if(r<0){seg=segsAvail[i];break}}}
 var pos=[];queue.forEach(function(id,k){if(ITEMS[id].seg===seg)pos.push(k)});return pos[Math.floor(rnd()*pos.length)]}
function drawOne(){var k=pickPos(st.queue,st.last);var id=st.queue.splice(k,1)[0];st.last=ITEMS[id].seg;return id}
function nextPos(){if(!st.bag.length)st.bag=shuffle([0,1,2,3,4]);return st.bag.pop()}
var KP='gk-blank-kr',kt=document.getElementById('kt');
function setK(v){document.body.classList.toggle('kon',v);kt.textContent=v?'한글 해석 닫기':'한글 해석 보기';try{localStorage.setItem(KP,v?'1':'0')}catch(e){}}
var _k=false;try{_k=localStorage.getItem(KP)==='1'}catch(e){}
setK(_k);kt.addEventListener('click',function(){setK(!document.body.classList.contains('kon'))});
document.addEventListener('click',function(e){var s=e.target.closest&&e.target.closest('.sent');if(s&&!s.classList.contains('blk'))s.classList.toggle('open')});
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function endp(s){return /[.?!]$/.test(s)?s:s+'.'}
var stage=document.getElementById('stage'),prog=document.getElementById('prog');
function setProg(){var m=POOL-st.queue.length-(st.cur===null?0:0);prog.textContent='이번 판 '+Math.min(st.setDrawn,SET)+' / '+SET+' · 한 바퀴 '+m+' / '+POOL+' 소진 · 정답 '+st.setCorrect+'개'}
function passage(it,filled){var sg=SEGS[it.seg],h='';
 sg.sents.forEach(function(s,i){var t=endp(s),inner,bk=(i===it.si&&!filled);
  if(i===it.si){var p=s.toLowerCase().indexOf(it.ans.toLowerCase());var a=esc(s.slice(0,p)),b=esc(endp(s).slice(p+it.ans.length));
   inner=a+(filled?'<mark>'+esc(s.slice(p,p+it.ans.length))+'</mark>':'<span class="bl">____</span>')+b}
  else inner=esc(t);
  h+='<span class="sent'+(bk?' blk':'')+'">'+inner+'<span class="kr">'+esc(sg.kos[i])+'</span></span>'});return h}
function showQ(id){var it=ITEMS[id],sg=SEGS[it.seg];
 var pos=nextPos(),ds=shuffle(it.ds),opts=[],di=0;
 for(var i=0;i<5;i++){if(i===pos)opts.push({en:it.ans,ko:it.ako,why:'',ok:true});else{var d=ds[di++];opts.push({en:d[0],ko:d[1],why:d[2],ok:false})}}
 var n=Math.min(st.setDrawn,SET);
 var h='<div class="q" id="qc"><div class="qh"><span class="qn">'+n+'</span><span class="tg">빈칸 추론</span><span class="segt">'+esc(sg.title)+'</span></div>'
  +'<div class="psg" id="psg">'+passage(it,false)+'</div><div class="ask">빈칸에 들어갈 말로 가장 알맞은 것은?</div>';
 opts.forEach(function(o,i){h+='<button class="ob" type="button" data-i="'+i+'"><b>'+CIR[i]+'</b> '+esc(o.en)+' <small>('+esc(o.ko)+')</small></button>'});
 h+='<div class="ex" id="ex"></div></div><div id="nxw"></div>';
 stage.innerHTML=h;setProg();
 curView={id:id,opts:opts,pos:pos,done:false};
 var btns=stage.querySelectorAll('.ob');
 Array.prototype.forEach.call(btns,function(b){b.addEventListener('click',function(){answer(+b.getAttribute('data-i'))})})}
function answer(i){if(!curView||curView.done)return;curView.done=true;var it=ITEMS[curView.id],o=curView.opts,ok=o[i].ok;
 if(ok)st.setCorrect++;st.cur=null;save();setProg();
 var q=document.getElementById('qc');q.className='q done';
 var btns=q.querySelectorAll('.ob');o.forEach(function(x,k){if(x.ok)btns[k].classList.add('ok');else if(k===i)btns[k].classList.add('ng')});
 var pg=document.getElementById('psg'),op=Array.prototype.map.call(pg.querySelectorAll('.sent'),function(x){return x.classList.contains('open')});pg.innerHTML=passage(it,true);Array.prototype.forEach.call(pg.querySelectorAll('.sent'),function(x,i){if(op[i])x.classList.add('open')});
 var h='<div class="res '+(ok?'o':'x')+'">'+(ok?'정답이에요.':'아쉬워요. 정답은 '+CIR[curView.pos]+'번이에요.')+'</div>'
  +'<div class="th"><b>본문 엑기스</b><br>'+esc(SEGS[it.seg].theme)+'</div>'
  +'<div class="wd"><b>정답 '+CIR[curView.pos]+'</b><br>'+esc(endp(SEGS[it.seg].sents[it.si])).replace(esc(it.ans),'<mark>'+esc(it.ans)+'</mark>')+'<br><span style="color:var(--sub)">'+esc(it.ko)+'</span></div><ul class="ol2">';
 o.forEach(function(x,k){if(!x.ok)h+='<li>'+CIR[k]+' '+esc(x.ko)+'</li>'});
 h+='</ul>';
 document.getElementById('ex').innerHTML=h;
 var end=st.setDrawn>=SET||st.queue.length===0;
 if(end){try{GK.hw('L4-blank')}catch(e){}}
 document.getElementById('nxw').innerHTML='<button class="nx" type="button" id="nx">'+(end?'이번 판 결과 보기':'다음 문제')+'</button>';
 document.getElementById('nx').addEventListener('click',function(){end?summary():next()});
 document.getElementById('ex').scrollIntoView({block:'nearest'})}
function next(){if(st.queue.length===0){summary();return}var id=drawOne();st.setDrawn++;st.cur=id;save();showQ(id);window.scrollTo(0,0)}
function summary(){curView=null;var roundDone=st.queue.length===0;
 var h='<div class="sum"><h3>이번 판 결과</h3><p>'+st.setDrawn+'문제 중 <b>'+st.setCorrect+'개</b>를 맞혔어요.</p>';
 if(roundDone)h+='<p><b>한 바퀴를 모두 풀었어요.</b> 다시 섞어서 시작할 수 있어요.</p><button class="pb" type="button" id="go">다시 섞어서 시작</button>';
 else h+='<p>남은 문제 '+st.queue.length+'개 · 한 바퀴 '+(POOL-st.queue.length)+' / '+POOL+' 소진</p><button class="pb" type="button" id="go">다음 판 시작</button>';
 h+='</div>';stage.innerHTML=h;setProg();
 document.getElementById('go').addEventListener('click',function(){if(roundDone)st.queue=fresh();st.setDrawn=0;st.setCorrect=0;st.cur=null;save();next()});window.scrollTo(0,0)}
function resetAll(){st.queue=fresh();st.cur=null;st.setDrawn=0;st.setCorrect=0;st.last=-1;save();next()}
var rs=document.getElementById('rs'),rt=null;
rs.addEventListener('click',function(){if(rs.getAttribute('data-c')==='1'){clearTimeout(rt);rs.removeAttribute('data-c');rs.textContent='처음부터 다시';resetAll();return}
 rs.setAttribute('data-c','1');rs.textContent='한 번 더 누르면 초기화';rt=setTimeout(function(){rs.removeAttribute('data-c');rs.textContent='처음부터 다시'},3000)});
function init(){var ok=load();if(!ok){st.queue=fresh();st.cur=null;st.setDrawn=0;st.setCorrect=0;st.last=-1}
 if(st.cur!==null){showQ(st.cur);return}
 if(st.setDrawn>=SET||(st.queue.length===0&&st.setDrawn>0)){summary();return}
 if(st.queue.length===0)st.queue=fresh();
 next()}
window.__t={POOL:POOL,ITEMS:ITEMS,pickPos:pickPos,SET:SET,state:st};
init();
})();
</script><div style="height:64px"></div><a class="homefab" href="../index.html" style="position:fixed;right:12px;bottom:12px;z-index:9999;background:#0f766e;color:#fff;font:700 13px/1 sans-serif;padding:11px 14px;border-radius:22px;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.3)">⌂ 목록</a></body></html>
