.sent{display:block;margin:0 0 7px}.sent .kr{display:none;color:var(--sub);font-size:14.5px;line-height:1.6;margin:1px 0 3px;font-weight:400}body.kon .sent:not(.blk) .kr,.sent.open:not(.blk) .kr{display:block}.sent:not(.blk){cursor:pointer}#kt{margin-left:auto}.bar #rs{margin-left:0}

<link rel="icon" type="image/svg+xml" href="../icon.svg"><link rel="apple-touch-icon" href="../icon-180.png"><meta name="apple-mobile-web-app-title" content="주성고정답"></head><body><div class="wrap"><div class="top"><a class="back" href="../index.html">← 주성고 정답 목록</a></div><h1>3과 · 빈칸 추론 연습 (매번 다른 문제)</h1><p class="lede">같은 지문에서 빈칸이 계속 바뀌어요. 한 번 나온 문제는 한 바퀴를 다 돌 때까지 다시 나오지 않아요. 풀 때마다 문제와 보기 순서가 달라져요.</p><div class="bar"><span class="prog" id="prog"></span><button id="kt" type="button">한글 해석 보기</button><button id="rs" type="button">처음부터 다시</button></div><div id="stage"></div><div class="foot">비타민 영어클리닉 · 주성고1 공통영어2 3과</div></div>
<script src="../gate.js"></script>
<script>
var D={"segs": [{"id": "A", "title": "❶ 문화유산을 지킨 사람들", "sents": ["During World War II, there was a group of people who risked everything to protect priceless works of art from ruin.", "In 1943, around 345 people from 14 different Allied nations came together to form the Monuments, Fine Arts, and Archives (MFAA) program.", "They were not trained soldiers but scholars and experts of various kinds, such as professors, historians, and architects.", "These brave men and women volunteered to protect Europe’s cultural heritage and became known as the “Monuments Men.”"], "a": 0, "theme": "제2차 세계대전 중, 군인이 아니라 교수·역사학자·건축가 같은 전문가들이 유럽의 문화유산을 지키겠다고 자청해 모였고, 이들이 '모뉴먼츠 맨'으로 불리게 되었다는 도입이에요.", "kos": ["제2차 세계대전 동안, 대단히 귀중한 예술 작품들을 파괴로부터 지키기 위해 모든 것을 건 한 무리의 사람들이 있었다.", "1943년에, 14개의 다른 연합국에서 온 약 345명의 사람들이 기념물, 미술품, 그리고 기록물 (MFAA) 프로그램을 만들기 위해 모였다.", "그들은 훈련된 군인이 아니라 교수, 역사학자, 건축가와 같은 다양한 분야의 학자들과 전문가들이었다.", "이러한 용감한 남성과 여성은 유럽의 문화유산을 보호하는 일을 자청했고 '모뉴먼츠 맨'으로 알려지게 되었다."]}, {"id": "B", "title": "❷ 처음의 목표와 첫 활동", "sents": ["When the MFAA was first formed, its main goal was to prevent the destruction of cultural landmarks.", "The Monuments Men persuaded the Allied forces not to bomb areas with museums, churches, or other culturally significant buildings.", "They also visited areas that had already been destroyed to restore damaged architecture and works of art.", "It wasn’t long before their role expanded."], "a": 3, "theme": "MFAA의 처음 목표는 문화적 랜드마크의 파괴를 막는 것이었어요. 그래서 연합군에게 문화 건물이 있는 지역을 폭격하지 말라고 설득했고, 이미 파괴된 곳에서는 복원도 했어요.", "kos": ["MFAA가 처음 만들어졌을 때, 그것의 주된 목표는 문화적 랜드마크의 파괴를 막는 것이었다.", "모뉴먼츠 맨은 연합군이 박물관, 교회, 또는 다른 문화적으로 중요한 건물들이 있는 지역을 폭격하지 않도록 설득했다.", "그들은 또한 훼손된 건축물과 예술 작품을 복원하고자 이미 파괴된 지역을 방문했다.", "머지않아 그들의 역할은 확대되었다."]}, {"id": "C", "title": "❷ 훔친 보물과 위협", "sents": ["During the war, the Nazis had been stealing works of art and other cultural treasures from countries across Europe.", "They hid these treasures in places like castles, mines, and caves.", "When the Monuments Men learned about this, they started looking for the stolen treasures.", "Their search has since been called “the greatest treasure hunt in history.”", "When Germany began to lose the war, the stolen objects came under threat.", "Hitler ordered his forces to destroy everything that could be useful to the Allied armies before they retreated from an area.", "Some Nazi leaders believed that this included not just military and industrial equipment but everything of value—even the stolen works of art."], "a": 6, "theme": "나치가 유럽 곳곳에서 예술 작품을 훔쳐 숨겼고, 모뉴먼츠 맨은 이를 찾기 시작했어요. 그런데 독일이 지기 시작하자 히틀러는 쓸모 있는 건 모두 파괴하라고 명령해 훔친 보물이 위협받았어요.", "kos": ["전쟁 중에, 나치는 유럽 전역의 나라들로부터 예술 작품들과 기타 문화재들을 훔치고 있었다.", "그들은 이러한 보물들을 성, 광산, 동굴 같은 곳에 숨겼다.", "모뉴먼츠 맨이 이에 대해 알게 되었을 때, 그들은 도난당한 보물들을 찾기 시작했다.", "그 후 그들의 수색은 '역사상 가장 위대한 보물찾기'라고 불려 왔다.", "독일이 전쟁에서 패하기 시작했을 때, 도난당한 물건들은 위협을 받았다.", "히틀러는 그의 군대에게 그들이 한 지역에서 후퇴하기 전에 연합군에게 유용할 수 있는 모든 것을 파괴하라고 명령했다.", "일부 나치 지도자들은 이것이 군사 및 산업 장비뿐만 아니라 가치 있는 모든 것, 심지어 훔친 예술 작품들까지 포함한다고 여겼다."]}, {"id": "D", "title": "❸ 알타우제 광산의 폭발물", "sents": ["One of the largest collections of stolen items was hidden in the salt mines of Altaussee, Austria.", "Upon discovering its location, some of the Monuments Men rushed to the mines.", "They hoped to recover everything before it was too late.", "Meanwhile, the Nazi leader who was in charge of the area tried to destroy everything by setting off large explosives inside the mines.", "This could have been disastrous.", "Luckily, some local miners found the explosives in the mines and came up with a plan to protect their livelihood."], "a": 12, "theme": "가장 큰 은닉처 중 하나인 알타우제 소금 광산으로 모뉴먼츠 맨이 서둘러 갔지만, 나치 지도자는 대형 폭발물로 모든 걸 파괴하려 했어요. 다행히 지역 광부들이 폭발물을 발견했어요.", "kos": ["도난당한 물품의 가장 큰 더미 중 하나는 오스트리아의 알타우제 소금 광산에 숨겨져 있었다.", "그것의 위치를 알아내자마자, 모뉴먼츠 맨 중 일부가 광산으로 급히 움직였다.", "그들은 너무 늦기 전에 모든 것을 되찾기를 희망했다.", "한편, 그 지역을 담당하던 나치 지도자는 광산 내부에 대형 폭발물을 터뜨려 모든 것을 파괴하려고 했다.", "이는 처참할 수 있었다.", "다행히도, 지역의 일부 광부들이 광산에서 폭발물을 발견했고 자신들의 생계를 보호할 계획을 생각해 냈다."]}, {"id": "E", "title": "❸ 광부들의 계획과 광산 안의 보물", "sents": ["They secretly removed the large explosives and put smaller ones at the entrances.", "Once they went off, the Nazi leader believed that everything was destroyed.", "However, while the small explosions sealed off the entrances, they left the rest of the mines and the works of art unharmed.", "When the Monuments Men arrived and squeezed their way into the mines, they must have been amazed to see what was inside.", "There were thousands of priceless objects, including paintings, statues, books, furniture, and more."], "a": 15, "theme": "광부들은 대형 폭발물을 치우고 입구에 작은 폭발물을 놓아, 나치 지도자가 모든 게 파괴됐다고 믿게 만들었어요. 입구만 막혔을 뿐 예술 작품은 무사했고, 안에는 수천 점의 귀중한 물건이 있었어요.", "kos": ["그들은 몰래 대형 폭발물을 제거했고 입구에 더 작은 폭발물을 놓았다.", "그것들이 터지자, 나치 지도자는 모든 것이 파괴되었다고 여겼다.", "그러나 작은 폭발들이 입구를 봉쇄시키긴 했지만, 그것들은 광산의 나머지 부분과 예술 작품들을 손상되지 않은 채로 남아 있게 했다.", "모뉴먼츠 맨이 도착해 광산 안으로 비집고 들어갔을 때, 그들은 내부에 있던 것을 보고 놀랐음에 틀림없다.", "그곳에는 그림, 조각상, 책, 가구 등을 포함해 수천 점의 귀중한 물건들이 있었다."]}, {"id": "F", "title": "❹ 두 달 안에 옮겨야 하는 임무", "sents": ["The Monuments Men thought it would take about one year to transport everything they found to a safe location.", "However, because control of the area was going to change at the end of the war, they would have access to the mines for just two months.", "With insufficient packing supplies and only a few trucks, the transporting mission seemed impossible.", "Not only that, but food was in short supply.", "Even without eating proper meals, they worked up to twenty hours a day.", "They used coats and gas masks as packing materials and did everything they could to accomplish this vital mission in time.", "In the end, the Monuments Men succeeded in rescuing thousands of stolen works of art, including important pieces such as Jan van Eyck’s Adoration of the Mystic Lamb, Johannes Vermeer’s The Astronomer, and Michelangelo’s Madonna of Bruges."], "a": 20, "theme": "모두 옮기려면 약 1년이 필요한데 광산에 접근할 수 있는 기간은 두 달뿐이었어요. 자재·트럭·식량이 모두 부족했지만, 모뉴먼츠 맨은 하루 20시간씩 일하며 외투와 방독면까지 포장재로 써서 해냈어요.", "kos": ["모뉴먼츠 맨은 그들이 발견한 모든 것을 안전한 장소로 옮기는 데 대략 1년이 걸릴 것으로 생각했다.", "그러나 전쟁이 끝날 때 그 지역의 통제권이 바뀔 예정이었기 때문에, 그들은 오직 두 달 동안만 광산에 접근하게 될 것이었다.", "불충분한 포장 자재와 오직 몇 대의 트럭으로 수송 임무는 불가능한 것처럼 보였다.", "그뿐만 아니라 식량 공급량도 부족했다.", "제대로 된 식사도 하지 못한 채, 그들은 하루에 20시간까지 일했다.", "그들은 외투와 방독면을 포장 재료로 사용했고 이 중요한 임무를 시간 내에 완수하기 위해 그들이 할 수 있는 모든 것을 했다.", "마침내, 모뉴먼츠 맨은 얀 반 에이크의 「신비한 어린 양에 대한 경배」, 요하네스 페르메이르의 「천문학자」, 그리고 미켈란젤로의 「브뤼헤의 성모」와 같은 중요한 작품들을 포함하여 수천 점의 도난당한 예술 작품을 구출하는 데 성공했다."]}, {"id": "G", "title": "❺ 지속적인 영향", "sents": ["The efforts of the Monuments Men did not end with the war.", "For several years, they continued the work of recovering cultural treasures and identifying where they had been stolen from.", "In the end, the Monuments Men returned more than five million works of art and objects of cultural importance to their places of origin.", "Not everything that was stolen by the Nazis has been found, but what the Monuments Men accomplished is truly amazing.", "Without this determined group, the search for stolen works of art might never have begun.", "In addition, countless historical and cultural landmarks would have been lost forever due to the destruction of war.", "It is worth remembering the Monuments Men’s contribution to the preservation of cultural heritage.", "Thanks to their efforts, many incredible cultural sites and works of art have survived and can still be appreciated to this day."], "a": 26, "theme": "모뉴먼츠 맨의 노력은 전쟁 뒤에도 이어져 5백만 점이 넘는 작품을 원래 장소로 돌려보냈어요. 이 집단이 없었다면 수색도 시작되지 못했고 수많은 랜드마크가 영원히 사라졌을 거예요.", "kos": ["모뉴먼츠 맨의 노력은 전쟁과 함께 끝나지 않았다.", "여러 해 동안, 그들은 문화재를 되찾고 그것들이 어디에서 도난당했는지 식별하는 작업을 이어갔다.", "마침내, 모뉴먼츠 맨은 5백만 점이 넘는 예술 작품과 문화적으로 중요한 물건들을 그것들의 원래 장소들로 돌려보냈다.", "나치에 의해 도난당한 모든 것이 발견되지는 않았지만, 모뉴먼츠 맨이 이룬 것은 정말로 놀랍다.", "이 결연한 집단이 없었다면, 도난당한 예술 작품들의 수색은 시작되지 않았을지도 모른다.", "또한, 수많은 역사적, 문화적 랜드마크가 전쟁의 파괴로 인해 영원히 사라져 버렸을 것이다.", "문화유산 보존에 대한 모뉴먼츠 맨의 기여는 기억할 가치가 있다.", "그들의 노력 덕분에, 많은 놀라운 문화 유적지들과 예술 작품들이 살아남아 오늘날까지도 여전히 감상될 수 있다."]}, {"id": "H", "title": "❻ 사라져 가는 언어를 지키기", "sents": ["Did you know that there are over 7,000 languages currently being used around the world?", "Most of these languages are spoken by very small groups of people, and half of them could disappear within the next generation.", "This would be a great loss because language plays a big role in connecting people’s identity to their culture.", "This is why some organizations work to preserve them.", "For example, a nonprofit organization called Wikitongues has set the goal of preserving all languages that are in danger of being lost.", "The organization works to achieve this by recording videos of individuals speaking these languages and making mother-tongue resources more accessible."], "a": 32, "theme": "전 세계 7,000개가 넘는 언어 중 절반이 한 세대 안에 사라질 수 있어요. 언어는 정체성과 문화를 잇기에 큰 손실이고, 그래서 Wikitongues 같은 단체가 이를 보존하려 노력해요.", "kos": ["당신은 현재 전 세계에서 7,000개가 넘는 언어가 사용되고 있다는 것을 알고 있었는가?", "이러한 언어들의 대부분은 매우 소규모 집단의 사람들에 의해 사용되며, 그중 절반은 다음 세대 이내에 사라질 수도 있다.", "이는 큰 손실이 될 텐데 언어가 사람들의 정체성을 그들의 문화와 연결하는 데 큰 역할을 하기 때문이다.", "이것이 일부 단체가 언어를 보존하기 위해 일하는 이유이다.", "예를 들어, Wikitongues라는 비영리 단체는 소멸될 위험에 처한 모든 언어들을 보존한다는 목표를 세웠다.", "그 단체는 이 언어들을 사용하는 개인들의 영상을 기록하고 모국어 자원을 더 접근 가능하게 함으로써 이를 달성하기 위해 노력한다."]}], "items": [{"seg": 0, "si": 0, "ans": "protect priceless works of art from ruin", "ako": "대단히 귀중한 예술 작품을 파괴로부터 지키다", "clue": "", "ds": [["rebuild cities that were left in ruin", "폐허로 남은 도시들을 재건하다", ""], ["win the war for the Allied nations", "연합국을 위해 전쟁에서 승리하다", ""], ["sell priceless works of art to other countries", "대단히 귀중한 예술 작품을 다른 나라에 팔다", ""], ["train young soldiers for the war", "젊은 병사들을 전쟁에 대비해 훈련시키다", ""]], "ko": "제2차 세계대전 동안, 대단히 귀중한 예술 작품들을 파괴로부터 지키기 위해 모든 것을 건 한 무리의 사람들이 있었다."}, {"seg": 0, "si": 2, "ans": "scholars and experts of various kinds", "ako": "다양한 분야의 학자들과 전문가들", "clue": "", "ds": [["artists and musicians of various kinds", "다양한 분야의 예술가들과 음악가들", ""], ["scholars and experts of only one kind", "한 가지 분야의 학자들과 전문가들뿐", ""], ["politicians and leaders of various kinds", "다양한 분야의 정치인들과 지도자들", ""], ["doctors and nurses of various kinds", "다양한 분야의 의사들과 간호사들", ""]], "ko": "그들은 훈련된 군인이 아니라 교수, 역사학자, 건축가와 같은 다양한 분야의 학자들과 전문가들이었다."}, {"seg": 0, "si": 3, "ans": "Europe’s cultural heritage", "ako": "유럽의 문화유산", "clue": "", "ds": [["Europe’s military bases", "유럽의 군사 기지", ""], ["Europe’s natural resources", "유럽의 천연자원", ""], ["Europe’s royal families", "유럽의 왕실 가족들", ""], ["Europe’s ancient forests", "유럽의 오래된 숲", ""]], "ko": "이러한 용감한 남성과 여성은 유럽의 문화유산을 보호하는 일을 자청했고 '모뉴먼츠 맨'으로 알려지게 되었다."}, {"seg": 1, "si": 0, "ans": "prevent the destruction of cultural landmarks", "ako": "문화적 랜드마크의 파괴를 막다", "clue": "", "ds": [["build new museums and churches", "새로운 박물관과 교회를 짓다", ""], ["teach people about cultural landmarks", "사람들에게 문화적 랜드마크에 대해 가르치다", ""], ["photograph all the cultural landmarks in Europe", "유럽의 모든 문화적 랜드마크를 사진으로 찍다", ""], ["raise money for cultural landmarks", "문화적 랜드마크를 위한 돈을 모으다", ""]], "ko": "MFAA가 처음 만들어졌을 때, 그것의 주된 목표는 문화적 랜드마크의 파괴를 막는 것이었다."}, {"seg": 1, "si": 1, "ans": "not to bomb areas", "ako": "지역을 폭격하지 않도록", "clue": "", "ds": [["not to enter areas", "지역에 들어가지 않도록", ""], ["to leave areas", "지역을 떠나도록", ""], ["to repair areas", "지역을 수리하도록", ""], ["to visit areas", "지역을 방문하도록", ""]], "ko": "모뉴먼츠 맨은 연합군이 박물관, 교회, 또는 다른 문화적으로 중요한 건물들이 있는 지역을 폭격하지 않도록 설득했다."}, {"seg": 1, "si": 2, "ans": "to restore damaged architecture and works of art", "ako": "훼손된 건축물과 예술 작품을 복원하기 위해", "clue": "", "ds": [["to carefully remove damaged architecture and works of art", "훼손된 건축물과 예술 작품을 조심스럽게 치우기 위해", ""], ["to count all the damaged architecture and works of art", "훼손된 모든 건축물과 예술 작품의 수를 세기 위해", ""], ["to sell damaged architecture and works of art", "훼손된 건축물과 예술 작품을 팔기 위해", ""], ["to hide damaged architecture and works of art", "훼손된 건축물과 예술 작품을 숨기기 위해", ""]], "ko": "그들은 또한 훼손된 건축물과 예술 작품을 복원하고자 이미 파괴된 지역을 방문했다."}, {"seg": 2, "si": 0, "ans": "stealing works of art and other cultural treasures", "ako": "예술 작품과 기타 문화재를 훔치는", "clue": "", "ds": [["buying works of art and other cultural treasures", "예술 작품과 기타 문화재를 사들이는", ""], ["selling works of art and other cultural treasures", "예술 작품과 기타 문화재를 파는", ""], ["destroying works of art and other cultural treasures", "예술 작품과 기타 문화재를 파괴하는", ""], ["copying works of art and other cultural treasures", "예술 작품과 기타 문화재를 베끼는", ""]], "ko": "전쟁 중에, 나치는 유럽 전역의 나라들로부터 예술 작품들과 기타 문화재들을 훔치고 있었다."}, {"seg": 2, "si": 1, "ans": "hid these treasures", "ako": "이러한 보물들을 숨겼다", "clue": "", "ds": [["displayed these treasures", "이러한 보물들을 전시했다", ""], ["sold these treasures", "이러한 보물들을 팔았다", ""], ["returned these treasures", "이러한 보물들을 돌려주었다", ""], ["photographed these treasures", "이러한 보물들을 사진으로 찍었다", ""]], "ko": "그들은 이러한 보물들을 성, 광산, 동굴 같은 곳에 숨겼다."}, {"seg": 2, "si": 2, "ans": "started looking for the stolen treasures", "ako": "도난당한 보물들을 찾기 시작했다", "clue": "", "ds": [["started hiding all of the stolen treasures", "도난당한 보물들 전부를 숨기기 시작했다", ""], ["decided to buy the stolen treasures", "도난당한 보물들을 사기로 했다", ""], ["agreed to share the stolen treasures", "도난당한 보물들을 나누기로 합의했다", ""], ["wanted to ignore all the stolen treasures", "도난당한 보물들을 전부 무시하고 싶어 했다", ""]], "ko": "모뉴먼츠 맨이 이에 대해 알게 되었을 때, 그들은 도난당한 보물들을 찾기 시작했다."}, {"seg": 2, "si": 3, "ans": "the greatest treasure hunt in history", "ako": "역사상 가장 위대한 보물찾기", "clue": "", "ds": [["the largest art school in all of history", "역사상 가장 큰 미술 학교", ""], ["the most expensive military battle in history", "역사상 가장 비용이 많이 든 군사 전투", ""], ["the longest journey in history", "역사상 가장 긴 여행", ""], ["the richest museum in history", "역사상 가장 부유한 박물관", ""]], "ko": "그 후 그들의 수색은 '역사상 가장 위대한 보물찾기'라고 불려 왔다."}, {"seg": 2, "si": 4, "ans": "came under threat", "ako": "위협을 받았다", "clue": "", "ds": [["became more valuable", "더 가치 있어졌다", ""], ["were returned to their owners", "원래 주인에게 돌려졌다", ""], ["were sold to other countries", "다른 나라에 팔렸다", ""], ["were forgotten by everyone", "모두에게 잊혔다", ""]], "ko": "독일이 전쟁에서 패하기 시작했을 때, 도난당한 물건들은 위협을 받았다."}, {"seg": 2, "si": 5, "ans": "destroy everything that could be useful to the Allied armies", "ako": "연합군에게 유용할 수 있는 모든 것을 파괴하다", "clue": "", "ds": [["protect everything that could be useful to the Allied armies", "연합군에게 유용할 수 있는 모든 것을 보호하다", ""], ["leave everything that could be useful to the Allied armies", "연합군에게 유용할 수 있는 모든 것을 남겨 두다", ""], ["count everything that could be useful to the Allied armies", "연합군에게 유용할 수 있는 모든 것의 수를 세다", ""], ["hide everything that could be useful to the Allied armies", "연합군에게 유용할 수 있는 모든 것을 숨기다", ""]], "ko": "히틀러는 그의 군대에게 그들이 한 지역에서 후퇴하기 전에 연합군에게 유용할 수 있는 모든 것을 파괴하라고 명령했다."}, {"seg": 3, "si": 0, "ans": "hidden in the salt mines of Altaussee", "ako": "알타우제의 소금 광산에 숨겨져 있었다", "clue": "", "ds": [["stored in the churches of Altaussee", "알타우제의 교회들에 보관되어 있었다", ""], ["displayed in the museums of Altaussee", "알타우제의 박물관들에 전시되어 있었다", ""], ["sold in the markets of Altaussee", "알타우제의 시장들에서 팔리고 있었다", ""], ["buried in the fields of Altaussee", "알타우제의 들판에 묻혀 있었다", ""]], "ko": "도난당한 물품의 가장 큰 더미 중 하나는 오스트리아의 알타우제 소금 광산에 숨겨져 있었다."}, {"seg": 3, "si": 1, "ans": "rushed to the mines", "ako": "광산으로 급히 움직였다", "clue": "", "ds": [["walked slowly to the mines", "광산으로 천천히 걸어갔다", ""], ["stayed away from the mines", "광산에서 떨어져 있었다", ""], ["refused to enter the mines", "광산에 들어가기를 거부했다", ""], ["waited outside the mines for orders", "광산 밖에서 명령을 기다렸다", ""]], "ko": "그것의 위치를 알아내자마자, 모뉴먼츠 맨 중 일부가 광산으로 급히 움직였다."}, {"seg": 3, "si": 3, "ans": "setting off large explosives inside the mines", "ako": "광산 내부에 대형 폭발물을 터뜨려서", "clue": "", "ds": [["flooding the lower parts of the mines with water", "광산의 아래쪽 부분에 물을 채워서", ""], ["blocking the roads to the mines", "광산으로 가는 길을 막아서", ""], ["burning the buildings around the mines", "광산 주변의 건물들을 불태워서", ""], ["sending armed soldiers deep into the mines", "무장한 병사들을 광산 깊숙이 보내서", ""]], "ko": "한편, 그 지역을 담당하던 나치 지도자는 광산 내부에 대형 폭발물을 터뜨려 모든 것을 파괴하려고 했다."}, {"seg": 4, "si": 0, "ans": "put smaller ones at the entrances", "ako": "입구에 더 작은 것들을 놓았다", "clue": "", "ds": [["put larger ones at the entrances", "입구에 더 큰 것들을 놓았다", ""], ["put the same ones in the deepest tunnels", "가장 깊은 터널에 같은 것들을 놓았다", ""], ["told the Nazi leader about their plan", "나치 지도자에게 자신들의 계획을 알렸다", ""], ["threw them into a nearby river", "그것들을 근처 강에 던졌다", ""]], "ko": "그들은 몰래 대형 폭발물을 제거했고 입구에 더 작은 폭발물을 놓았다."}, {"seg": 4, "si": 1, "ans": "believed that everything was destroyed", "ako": "모든 것이 파괴되었다고 여겼다", "clue": "", "ds": [["believed that the whole plan had failed", "전체 계획이 실패했다고 여겼다", ""], ["believed that everything was safe", "모든 것이 안전하다고 여겼다", ""], ["believed that the miners had escaped", "광부들이 달아났다고 여겼다", ""], ["knew that the explosives were fake", "폭발물이 가짜라는 것을 알았다", ""]], "ko": "그것들이 터지자, 나치 지도자는 모든 것이 파괴되었다고 여겼다."}, {"seg": 4, "si": 2, "ans": "left the rest of the mines and the works of art unharmed", "ako": "광산의 나머지 부분과 예술 작품들을 손상되지 않은 채로 남아 있게 했다", "clue": "", "ds": [["destroyed the rest of the mines and most of the works of art", "광산의 나머지 부분과 예술 작품들 대부분을 파괴했다", ""], ["damaged the works of art but left the mines unharmed", "예술 작품들은 손상시켰지만 광산은 손상되지 않은 채로 남겼다", ""], ["destroyed only a part of the works of art", "예술 작품들의 일부만 파괴했다", ""], ["buried the works of art deeper in the mines", "예술 작품들을 광산 더 깊은 곳에 묻었다", ""]], "ko": "그러나 작은 폭발들이 입구를 봉쇄시키긴 했지만, 그것들은 광산의 나머지 부분과 예술 작품들을 손상되지 않은 채로 남아 있게 했다."}, {"seg": 4, "si": 3, "ans": "must have been amazed to see what was inside", "ako": "내부에 있던 것을 보고 놀랐음에 틀림없다", "clue": "", "ds": [["must have been disappointed to see what was inside", "내부에 있던 것을 보고 실망했음에 틀림없다", ""], ["must have been frightened to see what was inside", "내부에 있던 것을 보고 겁먹었음에 틀림없다", ""], ["must have been angry to see what was inside", "내부에 있던 것을 보고 화가 났음에 틀림없다", ""], ["must have been puzzled to see what was inside", "내부에 있던 것을 보고 어리둥절했음에 틀림없다", ""]], "ko": "모뉴먼츠 맨이 도착해 광산 안으로 비집고 들어갔을 때, 그들은 내부에 있던 것을 보고 놀랐음에 틀림없다."}, {"seg": 4, "si": 4, "ans": "thousands of priceless objects", "ako": "수천 점의 귀중한 물건들", "clue": "", "ds": [["only a few badly damaged objects", "심하게 손상된 몇 점의 물건들뿐", ""], ["nothing but empty boxes function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function fresh(){var a=[];for(var i=0;i<POOL;i++)a.push(i);return a}
// pure: queue(남은 문제), last(직전 구간) -> 뽑을 queue 위치
function pickPos(queue,last,rnd){
 rnd=rnd||Math.random;var cnt={};queue.forEach(function(id){var s=ITEMS[id].seg;cnt[s]=(cnt[s]||0)+1});
 var segsAvail=Object.keys(cnt).map(Number).filter(function(s){return s!==last});
 if(!segsAvail.length)segsAvail=Object.keys(cnt).map(Number);
 var seg;
 if(rnd()<0.5){var mx=Math.max.apply(null,segsAvail.map(function(s){return cnt[s]}));var top=segsAvail.filter(function(s){return cnt[s]===mx});seg=top[Math.floor(rnd()*top.length)]}
 else{var tot=segsAvail.reduce(function(a,s){return a+cnt[s]},0),r=rnd()*tot;seg=segsAvail[segsAvail.length-1];for(var i=0;i<segsAvail.length;i++){r-=cnt[segsAvail[i]];if(r<0){seg=segsAvail[i];break}}}
 var pos=[];queue.forEach(function(id,k){if(ITEMS[id].seg===seg)pos.push(k)});return pos[Math.floor(rnd()*pos.length)]}
function drawOne(){var k=pickPos(st.queue,st.last);var id=st.queue.splice(k,1)[0];st.last=ITEMS[id].seg;return id}
function nextPos(){if(!st.bag.length)st.bag=shuffle([0,1,2,3,4]);return st.bag.pop()}
var KP='gk-blank-kr',kt=document.getElementById('kt');
function setK(v){document.body.classList.toggle('kon',v);kt.textContent=v?'한글 해석 닫기':'한글 해석 보기';try{localStorage.setItem(KP,v?'1':'0')}catch(e){}}
var _k=false;try{_k=localStorage.getItem(KP)==='1'}catch(e){}
setK(_k);kt.addEventListener('click',function(){setK(!document.body.classList.contains('kon'))});
document.addEventListener('click',function(e){var s=e.target.closest&&e.target.closest('.sent');if(s&&!s.classList.contains('blk'))s.classList.toggle('open')});
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function endp(s){return /[.?!]$/.test(s)?s:s+'.'}
var stage=document.getElementById('stage'),prog=document.getElementById('prog');
function setProg(){var m=POOL-st.queue.length-(st.cur===null?0:0);prog.textContent='이번 판 '+Math.min(st.setDrawn,SET)+' / '+SET+' · 한 바퀴 '+m+' / '+POOL+' 소진 · 정답 '+st.setCorrect+'개'}
function passage(it,filled){var sg=SEGS[it.seg],h='';
 sg.sents.forEach(function(s,i){var t=endp(s),inner,bk=(i===it.si&&!filled);
  if(i===it.si){var p=s.toLowerCase().indexOf(it.ans.toLowerCase());var a=esc(s.slice(0,p)),b=esc(endp(s).slice(p+it.ans.length));
   inner=a+(filled?'<mark>'+esc(s.slice(p,p+it.ans.length))+'</mark>':'<span class="bl">____</span>')+b}
  else inner=esc(t);
  h+='<span class="sent'+(bk?' blk':'')+'">'+inner+'<span class="kr">'+esc(sg.kos[i])+'</span></span>'});return h}
function showQ(id){var it=ITEMS[id],sg=SEGS[it.seg];
 var pos=nextPos(),ds=shuffle(it.ds),opts=[],di=0;
 for(var i=0;i<5;i++){if(i===pos)opts.push({en:it.ans,ko:it.ako,why:'',ok:true});else{var d=ds[di++];opts.push({en:d[0],ko:d[1],why:d[2],ok:false})}}
 var n=Math.min(st.setDrawn,SET);
 var h='<div class="q" id="qc"><div class="qh"><span class="qn">'+n+'</span><span class="tg">빈칸 추론</span><span class="segt">'+esc(sg.title)+'</span></div>'
  +'<div class="psg" id="psg">'+passage(it,false)+'</div><div class="ask">빈칸에 들어갈 말로 가장 알맞은 것은?</div>';
 opts.forEach(function(o,i){h+='<button class="ob" type="button" data-i="'+i+'"><b>'+CIR[i]+'</b> '+esc(o.en)+' <small>('+esc(o.ko)+')</small></button>'});
 h+='<div class="ex" id="ex"></div></div><div id="nxw"></div>';
 stage.innerHTML=h;setProg();
 curView={id:id,opts:opts,pos:pos,done:false};
 var btns=stage.querySelectorAll('.ob');
 Array.prototype.forEach.call(btns,function(b){b.addEventListener('click',function(){answer(+b.getAttribute('data-i'))})})}
function answer(i){if(!curView||curView.done)return;curView.done=true;var it=ITEMS[curView.id],o=curView.opts,ok=o[i].ok;
 if(ok)st.setCorrect++;st.cur=null;save();setProg();
 var q=document.getElementById('qc');q.className='q done';
 var btns=q.querySelectorAll('.ob');o.forEach(function(x,k){if(x.ok)btns[k].classList.add('ok');else if(k===i)btns[k].classList.add('ng')});
 var pg=document.getElementById('psg'),op=Array.prototype.map.call(pg.querySelectorAll('.sent'),function(x){return x.classList.contains('open')});pg.innerHTML=passage(it,true);Array.prototype.forEach.call(pg.querySelectorAll('.sent'),function(x,i){if(op[i])x.classList.add('open')});
 var h='<div class="res '+(ok?'o':'x')+'">'+(ok?'정답이에요.':'아쉬워요. 정답은 '+CIR[curView.pos]+'번이에요.')+'</div>'
  +'<div class="th"><b>본문 엑기스</b><br>'+esc(SEGS[it.seg].theme)+'</div>'
  +'<div class="wd"><b>정답 '+CIR[curView.pos]+'</b><br>'+esc(endp(SEGS[it.seg].sents[it.si])).replace(esc(it.ans),'<mark>'+esc(it.ans)+'</mark>')+'<br><span style="color:var(--sub)">'+esc(it.ko)+'</span></div><ul class="ol2">';
 o.forEach(function(x,k){if(!x.ok)h+='<li>'+CIR[k]+' '+esc(x.ko)+'</li>'});
 h+='</ul>';
 document.getElementById('ex').innerHTML=h;
 var end=st.setDrawn>=SET||st.queue.length===0;
 if(end){try{GK.hw('L3-blank')}catch(e){}}
 document.getElementById('nxw').innerHTML='<button class="nx" type="button" id="nx">'+(end?'이번 판 결과 보기':'다음 문제')+'</button>';
 document.getElementById('nx').addEventListener('click',function(){end?summary():next()});
 document.getElementById('ex').scrollIntoView({block:'nearest'})}
function next(){if(st.queue.length===0){summary();return}var id=drawOne();st.setDrawn++;st.cur=id;save();showQ(id);window.scrollTo(0,0)}
function summary(){curView=null;var roundDone=st.queue.length===0;
 var h='<div class="sum"><h3>이번 판 결과</h3><p>'+st.setDrawn+'문제 중 <b>'+st.setCorrect+'개</b>를 맞혔어요.</p>';
 if(roundDone)h+='<p><b>한 바퀴를 모두 풀었어요.</b> 다시 섞어서 시작할 수 있어요.</p><button class="pb" type="button" id="go">다시 섞어서 시작</button>';
 else h+='<p>남은 문제 '+st.queue.length+'개 · 한 바퀴 '+(POOL-st.queue.length)+' / '+POOL+' 소진</p><button class="pb" type="button" id="go">다음 판 시작</button>';
 h+='</div>';stage.innerHTML=h;setProg();
 document.getElementById('go').addEventListener('click',function(){if(roundDone)st.queue=fresh();st.setDrawn=0;st.setCorrect=0;st.cur=null;save();next()});window.scrollTo(0,0)}
function resetAll(){st.queue=fresh();st.cur=null;st.setDrawn=0;st.setCorrect=0;st.last=-1;save();next()}
var rs=document.getElementById('rs'),rt=null;
rs.addEventListener('click',function(){if(rs.getAttribute('data-c')==='1'){clearTimeout(rt);rs.removeAttribute('data-c');rs.textContent='처음부터 다시';resetAll();return}
 rs.setAttribute('data-c','1');rs.textContent='한 번 더 누르면 초기화';rt=setTimeout(function(){rs.removeAttribute('data-c');rs.textContent='처음부터 다시'},3000)});
function init(){var ok=load();if(!ok){st.queue=fresh();st.cur=null;st.setDrawn=0;st.setCorrect=0;st.last=-1}
 if(st.cur!==null){showQ(st.cur);return}
 if(st.setDrawn>=SET||(st.queue.length===0&&st.setDrawn>0)){summary();return}
 if(st.queue.length===0)st.queue=fresh();
 next()}
window.__t={POOL:POOL,ITEMS:ITEMS,pickPos:pickPos,SET:SET,state:st};
init();
})();
</script><div style="height:64px"></div><a class="homefab" href="../index.html" style="position:fixed;right:12px;bottom:12px;z-index:9999;background:#0f766e;color:#fff;font:700 13px/1 sans-serif;padding:11px 14px;border-radius:22px;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.3)">⌂ 목록</a></body></html>
