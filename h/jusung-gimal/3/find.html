</style><link rel="icon" type="image/svg+xml" href="../icon.svg"><link rel="apple-touch-icon" href="../icon-180.png"><meta name="apple-mobile-web-app-title" content="주성고정답"></head><body><div class="wrap"><div class="top"><a class="back" href="../index.html">← 목록</a></div><h1 id="h"></h1><div class="sub">본문과 다른 문장을 찾아 눌러 보세요. (내용정리 플러스 T/F CHECK 문제 그대로)</div><div class="how">문장을 누르면 본문 근거와 해설이 열려요. 본문과 다른 문장이면 초록색, 본문과 같은 내용이면 주황색으로 표시돼요. 맞는 문장도 눌러서 읽어 보면 본문이 더 잘 기억나요.</div><div class="nav" id="nav"></div><div id="root"></div><div class="foot">비타민 영어클리닉 · 주성고 공통영어2</div></div><script src="../gate.js"></script><script>
var D={"n": "3", "title": "3과 Rescuing Cultural Treasures", "parts": [["❶", "본문 ❶"], ["❷", "본문 ❷"], ["❸", "본문 ❸"], ["❹", "본문 ❹"], ["❺", "본문 ❺"]], "groups": [{"part": "❶", "title": "예술품을 지키려는 사람들", "flow": "2차 세계대전 중 소중한 예술 작품을 지키려는 사람들이 모였고, 1943년에 MFAA 프로그램을 만들었어요.", "items": [{"no": 1, "en": "A group of people tried to protect precious art works from ruin during World War II.", "ans": "T", "ko": "2차 세계대전 중에 한 무리의 사람들이 귀중한 예술 작품을 파괴로부터 지키려고 애썼다.", "eve": "During World War II, there was a group of people who risked everything to protect priceless works of art from ruin.", "evk": "제2차 세계대전 동안, 대단히 귀중한 예술 작품들을 파괴로부터 지키기 위해 모든 것을 건 한 무리의 사람들이 있었다.", "why": "**a group of people who risked everything to protect priceless works of art from ruin**을 바꿔 쓴 맞는 문장이에요. priceless는 precious로, works of art는 art works로 바꿨어요."}, {"no": 2, "en": "Hundreds of people from several Allied nations organized the MFAA program in 1943.", "ans": "T", "ko": "여러 연합국에서 온 수백 명의 사람들이 1943년에 MFAA 프로그램을 조직했다.", "eve": "In 1943, around 345 people from 14 different Allied nations came together to form the Monuments, Fine Arts, and Archives (MFAA) program.", "evk": "1943년에, 14개의 다른 연합국에서 온 약 345명의 사람들이 기념물, 미술품, 그리고 기록물 (MFAA) 프로그램을 만들기 위해 모였다.", "why": "**around 345 people from 14 different Allied nations came together to form** the MFAA program을 바꿔 쓴 문장이에요. 345명은 hundreds로, 14개국은 several로, form은 organize로 바꿨어요."}]}, {"part": "❶", "title": "모뉴먼츠 맨은 누구인가", "flow": "이들은 훈련된 군인이 아니라 스스로 나선 학자와 전문가들이었고, ‘모뉴먼츠 맨’으로 알려졌어요.", "items": [{"no": 1, "en": "The MFAA consisted of professional soldiers trained for war.", "ans": "F", "ko": "MFAA는 전쟁을 위해 훈련받은 전문 군인들로 이루어져 있었다.", "eve": "They were not trained soldiers but scholars and experts of various kinds, such as professors, historians, and architects.", "evk": "그들은 훈련된 군인이 아니라 교수, 역사학자, 건축가와 같은 다양한 분야의 학자들과 전문가들이었다.", "why": "본문은 **not trained soldiers but scholars and experts**예요. 훈련된 군인이 아니라 학자와 전문가라서 정반대예요."}, {"no": 2, "en": "The men and women were forced to join the MFAA against their will.", "ans": "F", "ko": "그 남성들과 여성들은 자신의 뜻과 달리 MFAA에 가입하도록 강요받았다.", "eve": "These brave men and women volunteered to protect Europe’s cultural heritage and became known as the “Monuments Men.”", "evk": "이러한 용감한 남성과 여성은 유럽의 문화유산을 보호하는 일을 자청했고 '모뉴먼츠 맨'으로 알려지게 되었다.", "why": "본문은 **volunteered to protect Europe’s cultural heritage**예요. 스스로 자청했다는 말이라 'forced(강요받은)'와 정반대예요."}, {"no": 3, "en": "The members of the MFAA came to be called the “Monuments Men.”", "ans": "T", "ko": "MFAA의 구성원들은 ‘모뉴먼츠 맨’이라고 불리게 되었다.", "eve": "These brave men and women volunteered to protect Europe’s cultural heritage and became known as the “Monuments Men.”", "evk": "이러한 용감한 남성과 여성은 유럽의 문화유산을 보호하는 일을 자청했고 '모뉴먼츠 맨'으로 알려지게 되었다.", "why": "**became known as the “Monuments Men.”**을 came to be called로 바꿔 쓴 맞는 문장이에요. became known as와 came to be called는 같은 뜻이에요."}]}, {"part": "❷", "title": "처음 만든 목적", "flow": "처음 목표는 문화적 랜드마크가 파괴되는 것을 막는 일이었어요.", "items": [{"no": 1, "en": "The MFAA was originally established to protect cultural landmarks from destruction.", "ans": "T", "ko": "MFAA는 원래 문화적 랜드마크를 파괴로부터 보호하기 위해 설립되었다.", "eve": "When the MFAA was first formed, its main goal was to prevent the destruction of cultural landmarks.", "evk": "MFAA가 처음 만들어졌을 때, 그것의 주된 목표는 문화적 랜드마크의 파괴를 막는 것이었다.", "why": "**When the MFAA was first formed, its main goal was to prevent the destruction of cultural landmarks.**를 바꿔 쓴 맞는 문장이에요. first formed는 originally established로, prevent the destruction은 protect from destruction으로 바꿨어요."}]}, {"part": "❷", "title": "폭격을 막고 복원하기", "flow": "연합군에게 폭격하지 말라고 설득하고, 이미 훼손된 곳은 복원했어요. 한편 나치는 유럽에서 문화재를 훔치고 있었어요.", "items": [{"no": 1, "en": "The Monuments Men convinced the Allied forces not to bomb culturally important buildings.", "ans": "T", "ko": "모뉴먼츠 맨은 연합군이 문화적으로 중요한 건물을 폭격하지 않도록 설득했다.", "eve": "The Monuments Men persuaded the Allied forces not to bomb areas with museums, churches, or other culturally significant buildings.", "evk": "모뉴먼츠 맨은 연합군이 박물관, 교회, 또는 다른 문화적으로 중요한 건물들이 있는 지역을 폭격하지 않도록 설득했다.", "why": "**persuaded the Allied forces not to bomb** ... **culturally significant buildings**를 바꿔 쓴 문장이에요. persuaded는 convinced로, significant는 important로 바꿨어요."}, {"no": 2, "en": "The Monuments Men ignored places that had already been damaged during the war.", "ans": "F", "ko": "모뉴먼츠 맨은 전쟁 중에 이미 훼손된 장소들을 무시했다.", "eve": "They also visited areas that had already been destroyed to restore damaged architecture and works of art.", "evk": "그들은 또한 훼손된 건축물과 예술 작품을 복원하고자 이미 파괴된 지역을 방문했다.", "why": "본문은 이미 파괴된 지역을 **visited ... to restore**(복원하려고 방문했다)예요. 'ignored(무시했다)'는 정반대예요."}, {"no": 3, "en": "The Nazis stole many artworks and cultural treasures from European countries.", "ans": "T", "ko": "나치는 유럽 국가들로부터 많은 예술 작품과 문화재를 훔쳤다.", "eve": "During the war, the Nazis had been stealing works of art and other cultural treasures from countries across Europe.", "evk": "전쟁 중에, 나치는 유럽 전역의 나라들로부터 예술 작품들과 기타 문화재들을 훔치고 있었다.", "why": "**the Nazis had been stealing works of art and other cultural treasures from countries across Europe**를 바꿔 쓴 맞는 문장이에요. countries across Europe는 European countries와 같아요."}]}, {"part": "❷", "title": "숨겨진 보물을 찾아서", "flow": "나치는 훔친 보물을 성·광산·동굴에 숨겼고, 모뉴먼츠 맨은 이를 찾기 시작했어요. 그런데 독일이 밀리자 도난당한 물건들이 위협을 받았어요.", "items": [{"no": 1, "en": "The Nazis stored cultural objects in places such as castles, mines, and caves.", "ans": "T", "ko": "나치는 성, 광산, 동굴 같은 곳에 문화적 물건들을 보관했다.", "eve": "They hid these treasures in places like castles, mines, and caves.", "evk": "그들은 이러한 보물들을 성, 광산, 동굴 같은 곳에 숨겼다.", "why": "**They hid these treasures in places like castles, mines, and caves.**를 바꿔 쓴 문장이에요. hid(숨겼다)를 stored(보관했다)로 바꿔 쓴 것이라 맞아요."}, {"no": 2, "en": "The Monuments Men began searching for the items that the Nazis had stolen.", "ans": "T", "ko": "모뉴먼츠 맨은 나치가 훔친 물건들을 찾기 시작했다.", "eve": "When the Monuments Men learned about this, they started looking for the stolen treasures.", "evk": "모뉴먼츠 맨이 이에 대해 알게 되었을 때, 그들은 도난당한 보물들을 찾기 시작했다.", "why": "**they started looking for the stolen treasures**를 바꿔 쓴 맞는 문장이에요. started looking for는 began searching for와 같아요."}, {"no": 3, "en": "The Monuments Men’s search has been known as “the greatest treasure hunt in history.”", "ans": "T", "ko": "모뉴먼츠 맨의 수색은 “역사상 가장 위대한 보물찾기”로 알려져 있다.", "eve": "Their search has since been called “the greatest treasure hunt in history.”", "evk": "그 후 그들의 수색은 '역사상 가장 위대한 보물찾기'라고 불려 왔다.", "why": "**Their search has since been called “the greatest treasure hunt in history.”**를 바꿔 쓴 문장이에요. been called는 been known as와 같은 뜻이에요."}, {"no": 4, "en": "When Germany started to lose the war, the stolen objects were kept completely safe from harm.", "ans": "F", "ko": "독일이 전쟁에서 지기 시작했을 때, 도난당한 물건들은 완전히 안전하게 지켜졌다.", "eve": "When Germany began to lose the war, the stolen objects came under threat.", "evk": "독일이 전쟁에서 패하기 시작했을 때, 도난당한 물건들은 위협을 받았다.", "why": "본문은 **the stolen objects came under threat**(도난당한 물건들이 위협을 받았다)예요. 'completely safe(완전히 안전한)'는 정반대예요."}]}, {"part": "❷", "title": "히틀러의 파괴 명령", "flow": "히틀러는 물러나기 전에 연합군에게 유용한 모든 것을 부수라고 명령했고, 일부 나치 지도자는 훔친 예술 작품도 포함된다고 여겼어요.", "items": [{"no": 1, "en": "Hitler ordered his troops to destroy everything useful to the Allied armies.", "ans": "T", "ko": "히틀러는 자신의 군대에게 연합군에게 유용한 모든 것을 파괴하라고 명령했다.", "eve": "Hitler ordered his forces to destroy everything that could be useful to the Allied armies before they retreated from an area.", "evk": "히틀러는 그의 군대에게 그들이 한 지역에서 후퇴하기 전에 연합군에게 유용할 수 있는 모든 것을 파괴하라고 명령했다.", "why": "**Hitler ordered his forces to destroy everything that could be useful to the Allied armies**를 바꿔 쓴 문장이에요. forces는 troops로 바꿨어요."}, {"no": 2, "en": "Some Nazi leaders thought that destroying the stolen artworks was part of Hitler’s order.", "ans": "T", "ko": "일부 나치 지도자들은 도난당한 예술 작품을 파괴하는 것도 히틀러의 명령에 포함된다고 생각했다.", "eve": "Hitler ordered his forces to destroy everything that could be useful to the Allied armies before they retreated from an area. Some Nazi leaders believed that this included not just military and industrial equipment but everything of value—even the stolen works of art.", "evk": "히틀러는 그의 군대에게 그들이 한 지역에서 후퇴하기 전에 연합군에게 유용할 수 있는 모든 것을 파괴하라고 명령했다. 일부 나치 지도자들은 이것이 군사 및 산업 장비뿐만 아니라 가치 있는 모든 것, 심지어 훔친 예술 작품들까지 포함한다고 여겼다.", "why": "**Some Nazi leaders believed that this included ... even the stolen works of art**를 바꿔 쓴 문장이에요. 히틀러가 말한 '유용한 모든 것(this)'에 훔친 예술 작품까지 들어간다고 본 거예요."}]}, {"part": "❸", "title": "알타우제 소금 광산", "flow": "도난 물품의 가장 큰 더미 중 하나가 오스트리아 알타우제의 소금 광산에 숨겨져 있었어요.", "items": [{"no": 1, "en": "A huge number of stolen items were secretly stored in Austria’s Altaussee salt mines.", "ans": "T", "ko": "엄청나게 많은 도난 물품이 오스트리아 알타우제의 소금 광산에 몰래 보관되어 있었다.", "eve": "One of the largest collections of stolen items was hidden in the salt mines of Altaussee, Austria.", "evk": "도난당한 물품의 가장 큰 더미 중 하나는 오스트리아의 알타우제 소금 광산에 숨겨져 있었다.", "why": "**One of the largest collections of stolen items was hidden in the salt mines of Altaussee, Austria.**를 바꿔 쓴 문장이에요. one of the largest collections는 a huge number of items로, hidden은 secretly stored로 바꿨어요."}]}, {"part": "❸", "title": "시간을 다투는 경주와 폭파 시도", "flow": "모뉴먼츠 맨은 위치를 알아내자 광산으로 달려갔지만, 나치 지도자는 대형 폭발물로 모든 것을 없애려 했어요. 그런데 광부들이 계획을 세웠어요.", "items": [{"no": 1, "en": "The Monuments Men ignored the discovery of the mines and moved on to another site.", "ans": "F", "ko": "모뉴먼츠 맨은 광산의 발견을 무시하고 다른 장소로 넘어갔다.", "eve": "Upon discovering its location, some of the Monuments Men rushed to the mines.", "evk": "그것의 위치를 알아내자마자, 모뉴먼츠 맨 중 일부가 광산으로 급히 움직였다.", "why": "본문은 위치를 알아내자마자 **rushed to the mines**(광산으로 급히 갔다)예요. 'ignored ... moved on to another site'는 정반대예요."}, {"no": 2, "en": "The Monuments Men feared losing the chance to save every stolen item.", "ans": "T", "ko": "모뉴먼츠 맨은 도난당한 모든 물품을 구할 기회를 잃을까 봐 두려워했다.", "eve": "They hoped to recover everything before it was too late.", "evk": "그들은 너무 늦기 전에 모든 것을 되찾기를 희망했다.", "why": "**They hoped to recover everything before it was too late.**를 걱정의 입장에서 바꿔 쓴 문장이에요. '너무 늦기 전에 모두 되찾기를 바랐다'는 '기회를 잃을까 걱정했다'와 같은 뜻이에요."}, {"no": 3, "en": "The Nazi leader tried to use powerful bombs to destroy everything hidden in the mines.", "ans": "T", "ko": "나치 지도자는 광산에 숨겨진 모든 것을 파괴하려고 강력한 폭탄을 사용하려 했다.", "eve": "Meanwhile, the Nazi leader who was in charge of the area tried to destroy everything by setting off large explosives inside the mines.", "evk": "한편, 그 지역을 담당하던 나치 지도자는 광산 내부에 대형 폭발물을 터뜨려 모든 것을 파괴하려고 했다.", "why": "**tried to destroy everything by setting off large explosives inside the mines**를 바꿔 쓴 문장이에요. large explosives는 powerful bombs로 바꿨어요."}, {"no": 4, "en": "Some Austrian miners made a plan to protect their livelihood.", "ans": "T", "ko": "오스트리아의 일부 광부들은 자신들의 생계를 보호할 계획을 세웠다.", "eve": "One of the largest collections of stolen items was hidden in the salt mines of Altaussee, Austria. Luckily, some local miners found the explosives in the mines and came up with a plan to protect their livelihood.", "evk": "도난당한 물품의 가장 큰 더미 중 하나는 오스트리아의 알타우제 소금 광산에 숨겨져 있었다. 다행히도, 지역의 일부 광부들이 광산에서 폭발물을 발견했고 자신들의 생계를 보호할 계획을 생각해 냈다.", "why": "**some local miners ... came up with a plan to protect their livelihood**를 바꿔 쓴 문장이에요. 알타우제는 오스트리아에 있으니 local miners는 Austrian miners가 돼요."}]}, {"part": "❸", "title": "광부들의 계획", "flow": "광부들은 몰래 큰 폭발물을 치우고 입구에 작은 폭발물을 놓았어요. 작은 폭발은 입구만 막았어요.", "items": [{"no": 1, "en": "The miners replaced the large explosives with smaller ones at the mine entrances.", "ans": "T", "ko": "광부들은 큰 폭발물을 광산 입구의 더 작은 폭발물로 바꿔 놓았다.", "eve": "They secretly removed the large explosives and put smaller ones at the entrances.", "evk": "그들은 몰래 대형 폭발물을 제거했고 입구에 더 작은 폭발물을 놓았다.", "why": "**removed the large explosives and put smaller ones at the entrances**를 바꿔 쓴 문장이에요. 큰 폭발물을 치우고 그 자리에 작은 것을 놓았으니 replaced ~ with와 같아요."}, {"no": 2, "en": "The blasts from the smaller explosives completely ruined the rest of the mines.", "ans": "F", "ko": "더 작은 폭발물의 폭발은 광산의 나머지 부분을 완전히 망가뜨렸다.", "eve": "However, while the small explosions sealed off the entrances, they left the rest of the mines and the works of art unharmed.", "evk": "그러나 작은 폭발들이 입구를 봉쇄시키긴 했지만, 그것들은 광산의 나머지 부분과 예술 작품들을 손상되지 않은 채로 남아 있게 했다.", "why": "본문은 광산의 나머지 부분과 예술 작품이 **unharmed**(손상되지 않은) 채로 남았다고 해요. 'completely ruined(완전히 망가뜨렸다)'는 정반대예요."}, {"no": 3, "en": "The small explosions shut off access to the mines.", "ans": "T", "ko": "작은 폭발들이 광산으로 들어가는 길을 막아 버렸다.", "eve": "However, while the small explosions sealed off the entrances, they left the rest of the mines and the works of art unharmed.", "evk": "그러나 작은 폭발들이 입구를 봉쇄시키긴 했지만, 그것들은 광산의 나머지 부분과 예술 작품들을 손상되지 않은 채로 남아 있게 했다.", "why": "**the small explosions sealed off the entrances**를 바꿔 쓴 문장이에요. sealed off the entrances는 shut off access와 같은 뜻이에요."}]}, {"part": "❸", "title": "광산 안에서 본 것", "flow": "입구가 막혀 비집고 들어간 모뉴먼츠 맨은 수천 점의 귀중한 물건을 보고 놀랐어요.", "items": [{"no": 1, "en": "The Monuments Men had to push through narrow spaces to get into the mines.", "ans": "T", "ko": "모뉴먼츠 맨은 광산에 들어가려고 좁은 틈을 힘겹게 지나가야 했다.", "eve": "When the Monuments Men arrived and squeezed their way into the mines, they must have been amazed to see what was inside.", "evk": "모뉴먼츠 맨이 도착해 광산 안으로 비집고 들어갔을 때, 그들은 내부에 있던 것을 보고 놀랐음에 틀림없다.", "why": "**squeezed their way into the mines**를 풀어 쓴 문장이에요. squeeze one’s way는 좁은 틈을 비집고 들어간다는 뜻이라 'push through narrow spaces'와 같아요."}, {"no": 2, "en": "The Monuments Men were disappointed when they realized the mines were completely empty.", "ans": "F", "ko": "모뉴먼츠 맨은 광산이 완전히 비어 있다는 것을 알고 실망했다.", "eve": "When the Monuments Men arrived and squeezed their way into the mines, they must have been amazed to see what was inside. There were thousands of priceless objects, including paintings, statues, books, furniture, and more.", "evk": "모뉴먼츠 맨이 도착해 광산 안으로 비집고 들어갔을 때, 그들은 내부에 있던 것을 보고 놀랐음에 틀림없다. 그곳에는 그림, 조각상, 책, 가구 등을 포함해 수천 점의 귀중한 물건들이 있었다.", "why": "본문은 **amazed**(놀랐다)이고 안에는 **thousands of priceless objects**(수천 점의 귀중한 물건)가 있었어요. 'disappointed ... completely empty'는 정반대예요."}]}, {"part": "❹", "title": "예상했던 시간", "flow": "모뉴먼츠 맨은 모든 것을 안전한 곳으로 옮기는 데 약 1년이 걸릴 것으로 생각했어요.", "items": [{"no": 1, "en": "The Monuments Men estimated that it would take them around a year to move everything to safety.", "ans": "T", "ko": "모뉴먼츠 맨은 모든 것을 안전한 곳으로 옮기는 데 약 1년이 걸릴 것으로 예상했다.", "eve": "The Monuments Men thought it would take about one year to transport everything they found to a safe location.", "evk": "모뉴먼츠 맨은 그들이 발견한 모든 것을 안전한 장소로 옮기는 데 대략 1년이 걸릴 것으로 생각했다.", "why": "**thought it would take about one year to transport everything ... to a safe location**을 바꿔 쓴 문장이에요. thought는 estimated로, transport는 move로 바꿨어요."}]}, {"part": "❹", "title": "두 달뿐인 시간과 부족한 것들", "flow": "광산에 접근할 수 있는 기간은 두 달뿐이었고, 자재·트럭·식량이 모자랐지만 하루 20시간까지 일했어요.", "items": [{"no": 1, "en": "The Monuments Men actually had more than a year to access the mines.", "ans": "F", "ko": "모뉴먼츠 맨이 실제로 광산에 접근할 수 있는 기간은 1년이 넘었다.", "eve": "The Monuments Men thought it would take about one year to transport everything they found to a safe location. However, because control of the area was going to change at the end of the war, they would have access to the mines for just two months.", "evk": "모뉴먼츠 맨은 그들이 발견한 모든 것을 안전한 장소로 옮기는 데 대략 1년이 걸릴 것으로 생각했다. 그러나 전쟁이 끝날 때 그 지역의 통제권이 바뀔 예정이었기 때문에, 그들은 오직 두 달 동안만 광산에 접근하게 될 것이었다.", "why": "본문은 광산에 접근할 수 있는 기간이 **just two months**(오직 두 달)예요. '1년이 넘었다'는 틀려요. 1년은 처음에 예상한 시간이에요."}, {"no": 2, "en": "The transporting mission was easy because the Monuments Men had many vehicles.", "ans": "F", "ko": "모뉴먼츠 맨에게 차량이 많았기 때문에 수송 임무는 쉬웠다.", "eve": "With insufficient packing supplies and only a few trucks, the transporting mission seemed impossible.", "evk": "불충분한 포장 자재와 오직 몇 대의 트럭으로 수송 임무는 불가능한 것처럼 보였다.", "why": "본문은 **only a few trucks**(오직 몇 대의 트럭)이고 임무는 **seemed impossible**(불가능해 보였다)이에요. 'easy', 'many vehicles'는 정반대예요."}, {"no": 3, "en": "Despite lacking proper meals, the Monuments Men worked as long as twenty hours a day.", "ans": "T", "ko": "제대로 된 식사를 하지 못했음에도, 모뉴먼츠 맨은 하루에 20시간까지 일했다.", "eve": "Even without eating proper meals, they worked up to twenty hours a day.", "evk": "제대로 된 식사도 하지 못한 채, 그들은 하루에 20시간까지 일했다.", "why": "**Even without eating proper meals, they worked up to twenty hours a day.**를 바꿔 쓴 문장이에요. Even without ~은 Despite lacking ~과 같은 뜻이에요."}]}, {"part": "❹", "title": "불가능해 보인 임무를 해내다", "flow": "외투와 방독면까지 포장재로 쓰며 마침내 수천 점의 도난 예술 작품을 구출했어요.", "items": [{"no": 1, "en": "The Monuments Men creatively used everyday items, like coats and gas masks, for packing.", "ans": "T", "ko": "모뉴먼츠 맨은 외투와 방독면 같은 일상용품을 창의적으로 포장에 사용했다.", "eve": "They used coats and gas masks as packing materials and did everything they could to accomplish this vital mission in time.", "evk": "그들은 외투와 방독면을 포장 재료로 사용했고 이 중요한 임무를 시간 내에 완수하기 위해 그들이 할 수 있는 모든 것을 했다.", "why": "**They used coats and gas masks as packing materials**를 바꿔 쓴 문장이에요. 포장 자재가 모자라서 일상용품을 포장재로 쓴 거예요."}, {"no": 2, "en": "The mission ended with thousands of stolen artworks being safely rescued.", "ans": "T", "ko": "이 임무는 수천 점의 도난당한 예술 작품이 안전하게 구출되면서 끝났다.", "eve": "In the end, the Monuments Men succeeded in rescuing thousands of stolen works of art, including important pieces such as Jan van Eyck’s Adoration of the Mystic Lamb, Johannes Vermeer’s The Astronomer, and Michelangelo’s Madonna of Bruges.", "evk": "마침내, 모뉴먼츠 맨은 얀 반 에이크의 「신비한 어린 양에 대한 경배」, 요하네스 페르메이르의 「천문학자」, 그리고 미켈란젤로의 「브뤼헤의 성모」와 같은 중요한 작품들을 포함하여 수천 점의 도난당한 예술 작품을 구출하는 데 성공했다.", "why": "**succeeded in rescuing thousands of stolen works of art**를 바꿔 쓴 문장이에요. 마침내(In the end) 수천 점을 구출하는 데 성공했다는 결론이에요."}]}, {"part": "❺", "title": "전쟁이 끝난 뒤에도", "flow": "모뉴먼츠 맨의 노력은 전쟁과 함께 끝나지 않고 여러 해 동안 이어졌어요.", "items": [{"no": 1, "en": "The Monuments Men stopped all of their work immediately after the war ended.", "ans": "F", "ko": "모뉴먼츠 맨은 전쟁이 끝난 직후 모든 활동을 중단했다.", "eve": "The efforts of the Monuments Men did not end with the war. For several years, they continued the work of recovering cultural treasures and identifying where they had been stolen from.", "evk": "모뉴먼츠 맨의 노력은 전쟁과 함께 끝나지 않았다. 여러 해 동안, 그들은 문화재를 되찾고 그것들이 어디에서 도난당했는지 식별하는 작업을 이어갔다.", "why": "본문은 **The efforts of the Monuments Men did not end with the war.**예요. 전쟁이 끝난 뒤에도 여러 해 동안 작업을 이어갔으니 'stopped all of their work immediately'는 정반대예요."}]}, {"part": "❺", "title": "돌려보낸 작품들", "flow": "5백만 점이 넘는 작품을 돌려보냈지만 전부 찾은 것은 아니에요. 이들이 없었다면 수색은 시작되지 않았을지도 몰라요.", "items": [{"no": 1, "en": "More than five million artworks and cultural items were restored to their original places.", "ans": "T", "ko": "5백만 점이 넘는 예술 작품과 문화적 물건들이 원래 있던 곳으로 돌려보내졌다.", "eve": "In the end, the Monuments Men returned more than five million works of art and objects of cultural importance to their places of origin.", "evk": "마침내, 모뉴먼츠 맨은 5백만 점이 넘는 예술 작품과 문화적으로 중요한 물건들을 그것들의 원래 장소들로 돌려보냈다.", "why": "**returned more than five million works of art and objects of cultural importance to their places of origin**을 바꿔 쓴 문장이에요. places of origin은 original places와 같아요."}, {"no": 2, "en": "Every single artwork stolen by the Nazis was successfully recovered.", "ans": "F", "ko": "나치가 훔친 예술 작품이 하나도 빠짐없이 모두 되찾아졌다.", "eve": "Not everything that was stolen by the Nazis has been found, but what the Monuments Men accomplished is truly amazing.", "evk": "나치에 의해 도난당한 모든 것이 발견되지는 않았지만, 모뉴먼츠 맨이 이룬 것은 정말로 놀랍다.", "why": "본문은 **Not everything that was stolen by the Nazis has been found**(도난당한 모든 것이 발견되지는 않았다)예요. 부분 부정이라 'Every single ... recovered'는 틀려요."}, {"no": 3, "en": "Without the Monuments Men, the search for stolen artworks might never have started.", "ans": "T", "ko": "모뉴먼츠 맨이 없었다면, 도난당한 예술 작품의 수색은 시작되지 않았을지도 모른다.", "eve": "Without this determined group, the search for stolen works of art might never have begun.", "evk": "이 결연한 집단이 없었다면, 도난당한 예술 작품들의 수색은 시작되지 않았을지도 모른다.", "why": "**Without this determined group, the search for stolen works of art might never have begun.**을 바꿔 쓴 문장이에요. begun을 started로 바꿨어요."}]}, {"part": "❺", "title": "기억할 만한 기여", "flow": "이들의 기여는 기억할 가치가 있고, 덕분에 유적지와 예술 작품이 지금도 감상돼요.", "items": [{"no": 1, "en": "It’s important to remember what the Monuments Men did to protect cultural heritage.", "ans": "T", "ko": "모뉴먼츠 맨이 문화유산을 보호하려고 한 일을 기억하는 것은 중요하다.", "eve": "It is worth remembering the Monuments Men’s contribution to the preservation of cultural heritage.", "evk": "문화유산 보존에 대한 모뉴먼츠 맨의 기여는 기억할 가치가 있다.", "why": "**It is worth remembering the Monuments Men’s contribution to the preservation of cultural heritage.**를 바꿔 쓴 문장이에요. worth remembering(기억할 가치가 있다)을 important to remember로 바꿨어요."}, {"no": 2, "en": "Because of the Monuments Men’s dedication, numerous sites and artworks are enjoyed today.", "ans": "T", "ko": "모뉴먼츠 맨의 헌신 덕분에 수많은 유적지와 예술 작품이 오늘날 감상되고 있다.", "eve": "Thanks to their efforts, many incredible cultural sites and works of art have survived and can still be appreciated to this day.", "evk": "그들의 노력 덕분에, 많은 놀라운 문화 유적지들과 예술 작품들이 살아남아 오늘날까지도 여전히 감상될 수 있다.", "why": "**Thanks to their efforts, many incredible cultural sites and works of art have survived and can still be appreciated to this day.**를 바꿔 쓴 문장이에요. efforts는 dedication으로, appreciated는 enjoyed로 바꿨어요."}]}]};

{"part": "❻", "title": "Wikitongues의 활동", "flow": "비영리 단체 Wikitongues는 사라질 위험의 언어를 보존하려고 영상을 기록하고 모국어 자료를 접근하기 쉽게 만들어요.", "items": [{"no": 1, "en": "Wikitongues is a nonprofit organization that aims to preserve all endangered languages.", "ans": "T", "ko": "Wikitongues는 소멸 위기에 처한 모든 언어를 보존하는 것을 목표로 하는 비영리 단체이다.", "eve": "For example, a nonprofit organization called Wikitongues has set the goal of preserving all languages that are in danger of being lost.", "evk": "예를 들어, Wikitongues라는 비영리 단체는 소멸될 위험에 처한 모든 언어들을 보존한다는 목표를 세웠다.", "why": "**a nonprofit organization called Wikitongues has set the goal of preserving all languages that are in danger of being lost**를 바꿔 쓴 문장이에요. set the goal은 aims로, in danger of being lost는 endangered로 바꿨어요."}, {"no": 2, "en": "Wikitongues mainly works by teaching endangered languages in schools.", "ans": "F", "ko": "Wikitongues는 주로 학교에서 소멸 위기의 언어를 가르치는 방식으로 활동한다.", "eve": "The organization works to achieve this by recording videos of individuals speaking these languages and making mother-tongue resources more accessible.", "evk": "그 단체는 이 언어들을 사용하는 개인들의 영상을 기록하고 모국어 자원을 더 접근 가능하게 함으로써 이를 달성하기 위해 노력한다.", "why": "본문의 방법은 **recording videos of individuals speaking these languages**(언어를 쓰는 개인들의 영상 기록)와 **making mother-tongue resources more accessible**(모국어 자료를 더 접근하기 쉽게 만들기)예요. 학교에서 가르친다는 말은 없어요."}]}]);

var secs={};
D.parts.forEach(function(p){var b=el('button',null,p[1]);b.onclick=function(){secs[p[0]].scrollIntoView({behavior:'smooth',block:'start'})};nav.appendChild(b)});
var bClose=el('button','closeall','답 모두 닫기');bClose.onclick=function(){S={};save();paint();window.scrollTo({top:0,behavior:'smooth'})};nav.insertBefore(bClose,nav.firstChild);nav.appendChild(prog);
var cards=[],wasAll=false,gkReady=false;
D.parts.forEach(function(p){
  var h=el('h2',null,p[1]);root.appendChild(h);secs[p[0]]=h;
  D.groups.forEach(function(g,gi){
    if(g.part!==p[0])return;
    var card=el('div','grp'),head=el('div','gh');
    head.appendChild(el('div','gt',g.title));
    var cnt=el('span','cnt','');head.appendChild(cnt);card.appendChild(head);
    var nF=g.items.filter(function(i){return i.ans==='F'}).length;
    card.appendChild(el('div','ask',nF?('본문과 다른 문장이 '+nF+'개 있어요. 찾아서 눌러 보세요.'):'이 소단락의 문장은 모두 본문과 같은 내용이에요. 눌러서 본문 근거를 읽어 보세요.'));
    var btns=[];
    g.items.forEach(function(it,ii){
      var b=el('div','it');b.setAttribute('role','button');b.tabIndex=0;
      var line=el('div');line.appendChild(el('span','no',it.no+'.'));line.appendChild(document.createTextNode(' '+it.en));b.appendChild(line);
      var pn=el('div','pn');
      pn.appendChild(el('div','ko',it.ko));
      var ev=el('div','ev');ev.appendChild(el('span','e',it.eve));if(it.evk)ev.appendChild(el('span','k',it.evk));
      pn.appendChild(el('span','tag','본문 근거'));pn.appendChild(ev);
      pn.appendChild(el('span','tag','해설'));var w=el('div','why');rich(w,it.why);pn.appendChild(w);
      b.appendChild(pn);
      var id=gi+'-'+ii;
      function open(){
        if(b.classList.contains('open'))return;
        S[id]=1;save();paint();
      }
      b.onclick=open;b.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}};
      card.appendChild(b);btns.push({b:b,id:id,it:it,pn:pn});
    });
    var tools=el('div','tools');
    var bAll=el('button',null,'나머지 해설 모두 열기');bAll.onclick=function(){btns.forEach(function(x){S[x.id]=S[x.id]||2});save();paint()};
    var bReset=el('button',null,'이 소단락 다시 하기');bReset.onclick=function(){btns.forEach(function(x){delete S[x.id]});save();paint()};
    tools.appendChild(bAll);tools.appendChild(bReset);card.appendChild(tools);
    var flow=el('div','flow');flow.appendChild(el('span','tag','이 소단락 정리'));flow.appendChild(document.createTextNode(g.flow));card.appendChild(flow);
    root.appendChild(card);
    cards.push({g:g,btns:btns,cnt:cnt,flow:flow,nF:nF});
  });
});
function paint(){
  var done=0;
  cards.forEach(function(c){
    var found=0,all=true;
    c.btns.forEach(function(x){
      var o=!!S[x.id];
      x.b.classList.toggle('open',o);
      x.b.classList.remove('ok','no2');
      var old=x.b.querySelector('.badge');if(old)old.remove();
      if(o){
        var f=x.it.ans==='F';x.b.classList.add(f?'ok':'no2');
        if(f)found++;
        var bd=el('span','badge',f?'✔ 본문과 다른 문장 · 잘 찾았어요':'본문과 같은 내용이에요 · 맞는 문장');
        x.b.insertBefore(bd,x.pn);
      }
      if(!o)all=false;
    });
    var opened=0;c.btns.forEach(function(x){if(S[x.id])opened++});var fin=c.nF?found===c.nF:opened===c.btns.length;
    c.cnt.textContent=c.nF?('다른 문장 '+found+'/'+c.nF+' 찾음'):('확인 '+opened+'/'+c.btns.length);
    c.cnt.classList.toggle('done',fin);
    c.flow.classList.toggle('on',fin);
    if(fin)done++;
  });
  prog.textContent='소단락 '+done+'/'+cards.length+' 확인';
  var allNow=cards.length>0&&done===cards.length;
  if(allNow&&!wasAll&&gkReady&&window.GK){var tF=0,fF=0;cards.forEach(function(c){c.btns.forEach(function(x){if(x.it.ans==='F'){tF++;if(S[x.id]===1)fF++}})});GK.report('L3-find',tF?fF/tF*100:0)}
  wasAll=allNow;
}
paint();gkReady=true;
</script><div style="height:64px"></div><a class="homefab" href="../index.html" style="position:fixed;right:12px;bottom:12px;z-index:9999;background:#0f766e;color:#fff;font:700 13px/1 sans-serif;padding:11px 14px;border-radius:22px;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.3)">⌂ 목록</a></body></html>
