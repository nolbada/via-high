ho was in charge of the area tried to destroy everything by setting off large explosives inside the mines.", "20": "This could have been disastrous.", "21": "Luckily, some local miners found the explosives in the mines and came up with a plan to protect their livelihood.", "22": "They secretly removed the large explosives and put smaller ones at the entrances.", "23": "Once they went off, the Nazi leader believed that everything was destroyed.", "24": "However, while the small explosions sealed off the entrances, they left the rest of the mines and the works of art unharmed.", "25": "When the Monuments Men arrived and squeezed their way into the mines, they must have been amazed to see what was inside.", "26": "There were thousands of priceless objects, including paintings, statues, books, furniture, and more.", "27": "The Monuments Men thought it would take about one year to transport everything they found to a safe location.", "28": "However, because control of the area was going to change at the end of the war, they would have access to the mines for just two months.", "29": "With insufficient packing supplies and only a few trucks, the transporting mission seemed impossible.", "30": "Not only that, but food was in short supply.", "31": "Even without eating proper meals, they worked up to twenty hours a day.", "32": "They used coats and gas masks as packing materials and did everything they could to accomplish this vital mission in time.", "33": "In the end, the Monuments Men succeeded in rescuing thousands of stolen works of art, including important pieces such as Jan van Eyck’s Adoration of the Mystic Lamb, Johannes Vermeer’s The Astronomer, and Michelangelo’s Madonna of Bruges.", "34": "The efforts of the Monuments Men did not end with the war.", "35": "For several years, they continued the work of recovering cultural treasures and identifying where they had been stolen from.", "36": "In the end, the Monuments Men returned more than five million works of art and objects of cultural importance to their places of origin.", "37": "Not everything that was stolen by the Nazis has been found, but what the Monuments Men accomplished is truly amazing.", "38": "Without this determined group, the search for stolen works of art might never have begun.", "39": "In addition, countless historical and cultural landmarks would have been lost forever due to the destruction of war.", "40": "It is worth remembering the Monuments Men’s contribution to the preservation of cultural heritage.", "41": "Thanks to their efforts, many incredible cultural sites and works of art have survived and can still be appreciated to this day.", "42": "Did you know that there are over 7,000 languages currently being used around the world?", "43": "Most of these languages are spoken by very small groups of people, and half of them could disappear within the next generation.", "44": "This would be a great loss because language plays a big role in connecting people’s identity to their culture.", "45": "This is why some organizations work to preserve them.", "46": "For example, a nonprofit organization called Wikitongues has set the goal of preserving all languages that are in danger of being lost.", "47": "The organization works to achieve this by recording videos of individuals speaking these languages and making mother-tongue resources more accessible."}, "key": {"1": ["", "제2차 세계대전 중 예술 작품을 지키려고 모든 것을 건 사람들"], "2": ["", "1943년, 14개 연합국 약 345명이 모여 MFAA 프로그램을 만듦"], "3": ["They(그들)", "군인이 아니라 교수·역사학자·건축가 같은 전문가들"], "4": ["These(이러한)", "유럽의 문화유산을 지키려 자청 → '모뉴먼츠 맨'"], "5": ["When(~했을 때)", "처음 목표 = 문화적 랜드마크의 파괴를 막는 것"], "6": ["", "문화 건물이 있는 지역을 폭격하지 않도록 연합군을 설득"], "7": ["also(또한)", "이미 파괴된 지역에서 건축물·예술 작품 복원"], "8": ["It wasn’t long before(머지않아)", "그들의 역할이 확대됨"], "9": ["", "나치가 유럽 전역에서 예술 작품·문화재를 훔치고 있었음"], "10": ["These treasures(이러한 보물들)", "성·광산·동굴 같은 곳에 숨김"], "11": ["this(이것)", "이를 알게 된 모뉴먼츠 맨이 도난당한 보물을 찾기 시작"], "12": ["since(그 후)", "그 수색 = '역사상 가장 위대한 보물찾기'"], " D.KO={"1": "제2차 세계대전 동안, 대단히 귀중한 예술 작품들을 파괴로부터 지키기 위해 모든 것을 건 한 무리의 사람들이 있었다.", "2": "1943년에, 14개의 다른 연합국에서 온 약 345명의 사람들이 기념물, 미술품, 그리고 기록물 (MFAA) 프로그램을 만들기 위해 모였다.", "3": "그들은 훈련된 군인이 아니라 교수, 역사학자, 건축가와 같은 다양한 분야의 학자들과 전문가들이었다.", "4": "이러한 용감한 남성과 여성은 유럽의 문화유산을 보호하는 일을 자청했고 '모뉴먼츠 맨'으로 알려지게 되었다.", "5": "MFAA가 처음 만들어졌을 때, 그것의 주된 목표는 문화적 랜드마크의 파괴를 막는 것이었다.", "6": "모뉴먼츠 맨은 연합군이 박물관, 교회, 또는 다른 문화적으로 중요한 건물들이 있는 지역을 폭격하지 않도록 설득했다.", "7": "그들은 또한 훼손된 건축물과 예술 작품을 복원하고자 이미 파괴된 지역을 방문했다.", "8": "머지않아 그들의 역할은 확대되었다.", "9": "전쟁 중에, 나치는 유럽 전역의 나라들로부터 예술 작품들과 기타 문화재들을 훔치고 있었다.", "10": "그들은 이러한 보물들을 성, 광산, 동굴 같은 곳에 숨겼다.", "11": "모뉴먼츠 맨이 이에 대해 알게 되었을 때, 그들은 도난당한 보물들을 찾기 시작했다.", "12": "그 후 그들의 수색은 '역사상 가장 위대한 보물찾기'라고 불려 왔다.", "13": "독일이 전쟁에서 패하기 시작했을 때, 도난당한 물건들은 위협을 받았다.", "14": "히틀러는 그의 군대에게 그들이 한 지역에서 후퇴하기 전에 연합군에게 유용할 수 있는 모든 것을 파괴하라고 명령했다.", "15": "일부 나치 지도자들은 이것이 군사 및 산업 장비뿐만 아니라 가치 있는 모든 것, 심지어 훔친 예술 작품들까지 포함한다고 여겼다.", "16": "도난당한 물품의 가장 큰 더미 중 하나는 오스트리아의 알타우제 소금 광산에 숨겨져 있었다.", "17": "그것의 위치를 알아내자마자, 모뉴먼츠 맨 중 일부가 광산으로 급히 움직였다.", "18": "그들은 너무 늦기 전에 모든 것을 되찾기를 희망했다.", "19": "한편, 그 지역을 담당하던 나치 지도자는 광산 내부에 대형 폭발물을 터뜨려 모든 것을 파괴하려고 했다.", "20": "이는 처참할 수 있었다.", "21": "다행히도, 지역의 일부 광부들이 광산에서 폭발물을 발견했고 자신들의 생계를 보호할 계획을 생각해 냈다.", "22": "그들은 몰래 대형 폭발물을 제거했고 입구에 더 작은 폭발물을 놓았다.", "23": "그것들이 터지자, 나치 지도자는 모든 것이 파괴되었다고 여겼다.", "24": "그러나 작은 폭발들이 입구를 봉쇄시키긴 했지만, 그것들은 광산의 나머지 부분과 예술 작품들을 손상되지 않은 채로 남아 있게 했다.", "25": "모뉴먼츠 맨이 도착해 광산 안으로 비집고 들어갔을 때, 그들은 내부에 있던 것을 보고 놀랐음에 틀림없다.", "26": "그곳에는 그림, 조각상, 책, 가구 등을 포함해 수천 점의 귀중한 물건들이 있었다.", "27": "모뉴먼츠 맨은 그들이 발견한 모든 것을 안전한 장소로 옮기는 데 대략 1년이 걸릴 것으로 생각했다.", "28": "그러나 전쟁이 끝날 때 그 지역의 통제권이 바뀔 예정이었기 때문에, 그들은 오직 두 달 동안만 광산에 접근하게 될 것이었다.", "29": "불충분한 포장 자재와 오직 몇 대의 트럭으로 수송 임무는 불가능한 것처럼 보였다.", "30": "그뿐만 아니라 식량 공급량도 부족했다.", "31": "제대로 된 식사도 하지 못한 채, 그들은 하루에 20시간까지 일했다.", "32": "그들은 외투와 방독면을 포장 재료로 사용했고 이 중요한 임무를 시간 내에 완수하기 위해 그들이 할 수 있는 모든 것을 했다.", "33": "마침내, 모뉴먼츠 맨은 얀 반 에이크의 「신비한 어린 양에 대한 경배」, 요하네스 페르메이르의 「천문학자」, 그리고 미켈란젤로의 「브뤼헤의 성모」와 같은 중요한 작품들을 포함하여 수천 점의 도난당한 예술 작품을 구출하는 데 성공했다.", "34": "모뉴먼츠 맨의 노력은 전쟁과 함께 끝나지 않았다.", "35": "여러 해 동안, 그들은 문화재를 되찾고 그것들이 어디에서 도난당했는지 식별하는 작업을 이어갔다.", "36": "마침내, 모뉴먼츠 맨은 5백만 점이 넘는 예술 작품과 문화적으로 중요한 물건들을 그것들의 원래 장소들로 돌려보냈다.", "37": "나치에 의해 도난당한 모든 것이 발견되지는 않았지만, 모뉴먼츠 맨이 이룬 것은 정말로 놀랍다.", "38": "이 결연한 집단이 없었다면, 도난당한 예술 작품들의 수색은 시작되지 않았을지도 모른다.", "39": "또한, 수많은 역사적, 문화적 랜드마크가 전쟁의 파괴로 인해 영원히 사라져 버렸을 것이다.", "40": "문화유산 보존에 대한 모뉴먼츠 맨의 기여는 기억할 가치가 있다.", "41": "그들의 노력 덕분에, 많은 놀라운 문화 유적지들과 예술 작품들이 살아남아 오늘날까지도 여전히 감상될 수 있다.", "42": "당신은 현재 전 세계에서 7,000개가 넘는 언어가 사용되고 있다는 것을 알고 있었는가?", "43": "이러한 언어들의 대부분은 매우 소규모 집단의 사람들에 의해 사용되며, 그중 절반은 다음 세대 이내에 사라질 수도 있다.", "44": "이는 큰 손실이 될 텐데 언어가 사람들의 정체성을 그들의 문화와 연결하는 데 큰 역할을 하기 때문이다.", "45": "이것이 일부 단체가 언어를 보존하기 위해 일하는 이유이다.", "46": "예를 들어, Wikitongues라는 비영리 단체는 소멸될 위험에 처한 모든 언어들을 보존한다는 목표를 세웠다.", "47": "그 단체는 이 언어들을 사용하는 개인들의 영상을 기록하고 모국어 자원을 더 접근 가능하게 함으로써 이를 달성하기 위해 노력한다."};

 }else{

 if(e.target.closest('.nextq')){run.cur=i+1;saveRun();if(run.cur>=TOT){try{GK.hw('L3-sunabc')}catch(x){}}view();window.scrollTo(0,0)}
