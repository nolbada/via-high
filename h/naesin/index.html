<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#0f766e"><title>내신 링크 모음</title><style>
:root{--bg:#f6f8f7;--card:#fff;--ink:#16211f;--sub:#5a6b67;--line:#dbe4e1;--pri:#0f766e;--g1:#b45309;--g2:#1d4ed8}
@media(prefers-color-scheme:dark){:root{--bg:#0e1514;--card:#162120;--ink:#e8f0ee;--sub:#9db0ab;--line:#26363a;--pri:#2dd4bf;--g1:#fbbf24;--g2:#8ab4ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.6;font-size:17px}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 60px}h1{font-size:24px;margin:4px 0 2px}.sub{color:var(--sub);font-size:15px;margin-bottom:14px}
.sch{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 12px}
.sch h2{margin:0 0 6px;font-size:19px;display:flex;align-items:center;gap:8px}.badge{font-size:13px;color:#fff;border-radius:999px;padding:1px 10px}
.g1 .badge{background:var(--g1)}.g2 .badge{background:var(--g2)}
.sch a{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-top:1px solid var(--line);color:inherit;text-decoration:none}
.sch a:first-of-type{border-top:0}.go{font-size:14px;color:var(--pri);border:1px solid var(--pri);border-radius:999px;padding:1px 12px}
.none{color:var(--sub);font-size:15px;padding:6px 4px}
 .sec{font-size:20px;font-weight:800;margin:22px 2px 8px;padding-bottom:4px;border-bottom:2px solid var(--pri)}.sec small{font-size:13px;font-weight:500;color:var(--sub);margin-left:6px}
.g0 .badge{background:var(--pri)}.ex{display:inline-block;margin-left:auto;background:#fee2e2;color:#991b1b;border:1px solid #dc2626;border-radius:999px;font-size:12.5px;font-weight:800;padding:1px 10px}
.sch .r{display:flex;align-items:center;gap:8px;padding:10px 4px;border-top:1px solid var(--line)}.sch .r:first-of-type{border-top:0}.sch .r a{flex:1;border:0;padding:0;display:block}.sch .r small{color:var(--sub)}
.cp{font:inherit;font-size:14px;color:var(--pri);background:none;border:1px solid var(--pri);border-radius:999px;padding:1px 12px;cursor:pointer}.note{color:var(--sub);font-size:14px;margin:10px 2px}
</style></head><body><div class="wrap"><h1>내신 링크 모음</h1><div class="sub">선생님용 · 학교·학년별 앱 주소 모음 (학생에게는 각 학교 주소만 전달)</div><div id="L"></div></div>
<script>
var M='https://nolbada.github.io/via/mid/dongah-yun/',H='https://nolbada.github.io/via-high/h/';
var DATA=[
 {sec:'중등',items:[
  {g:'g0',b:'중2',n:'용아중 2학년 2학기 기말고사',ex:'12/9(수)~12/11(금)',rows:[
   ['2학기 기말 학생 앱','동아(윤정미) · 교과서 7과·8과 (앱 안에서 전환) · 오늘 수업은 주소 끝에 ?today=1,2 처럼 본문 번호 지정',M]]}]},
 {sec:'고등',items:[
  {g:'g1',b:'고1',n:'금천고',rows:[['2학기 기말 학생 앱 (원문·답안지·오늘의 학습)','공통영어2 미래엔(김) · 3과 → 4과 → 모의고사 (기말 12/7)',H+'geumcheon-go1/'],['2학기 기말 정답 목록','공통영어2 미래엔(김) · 3·4과',H+'geumcheon-gimal/']]},
  {g:'g1',b:'고1',n:'청석고',rows:[['2학기 기말 학생 앱 (원문·답안지·오늘의 학습)','공통영어2 능률(민) · 3과 → 4과 → 모의고사 (기말 12/7)',H+'cheongseok-go1/'],['2학기 기말 정답 목록','공통영어2 능률(민) · 3·4과',H+'cheongseok-gimal/']]},
  {g:'g1',b:'고1',n:'주성고',rows:[['2학기 기말 학생 앱 (원문·답안지·오늘의 학습)','공통영어2 능률(오) · 4과 → 3과 → 모의고사 (기말 12/1)',H+'jusung-go1/'],['2학기 기말 정답 목록','공통영어2 능률(오) · 3·4과',H+'jusung-gimal/']]},
  {g:'g2',b:'고2',n:'주성고',rows:[['2학기 기말 학생 앱 (원문·답안지·오늘의 학습)','영어II 능률(오선영) 4과 + 모의고사 22년 11월·23년 11월·24년 10월',H+'jusung-go2/']]},
  {g:'g2',b:'고2',n:'청석고',rows:[['2학기 기말 학생 앱 (원문·답안지·오늘의 학습)','영어II 능률(오선영) 4과 → 3과 → 모의고사 (기말 12/7)',H+'cheongseok-go2/']]},
  {g:'g2',b:'고2',n:'금천고',rows:[['2학기 기말 학생 앱 (원문·답안지·오늘의 학습)','영어II 능률(오선영) 4과 → 3과 → 모의고사 (기말 12/7)',H+'geumcheon-go2/']]}]}
];
function e(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
var U=[];
document.getElementById('L').innerHTML=DATA.map(function(S){return '<div class="sec">'+S.sec+'</div>'+S.items.map(function(c){
 return '<div class="sch '+c.g+'"><h2><span class="badge">'+c.b+'</span>'+c.n+(c.ex?'<span class="ex">'+c.ex+'</span>':'')+'</h2>'+c.rows.map(function(r){U.push(r[2]);
  return '<div class="r"><a href="'+r[2]+'"><span>'+e(r[0])+'<br><small>'+e(r[1])+'</small></span></a><button class="cp" data-i="'+(U.length-1)+'">복사</button></div>'}).join('')+'</div>'}).join('')}).join('')
 +'<div class="note">중등은 오늘 할 본문을 주소 끝 today=1,2 처럼 정해 줘요. 다른 학교·학년은 모으는 대로 이곳에 한 칸씩 더해져요.</div>';
document.addEventListener('click',function(ev){var b=ev.target.closest('.cp');if(!b)return;var u=U[b.dataset.i];
 function ok(){b.textContent='복사했어요';setTimeout(function(){b.textContent='복사'},1500)}
 function fb(){var t=document.createElement('textarea');t.value=u;document.body.appendChild(t);t.select();try{document.execCommand('copy');ok()}catch(x){}document.body.removeChild(t)}
 try{navigator.clipboard.writeText(u).then(ok,fb)}catch(x){fb()}});
</script></body></html>
