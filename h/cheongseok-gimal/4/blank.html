.wrap{max-width:420px}

.ex .th{background:var(--priL);border-radius:10px;padding:8px 12px;margin:6px 0;font-size:16px}.ex .ol2{list-style:none;margin:8px 0 2px;padding:0;font-size:15px;color:var(--sub)}.ex .ol2 li{margin:5px 0}.ex .ol2 li.c{color:var(--pri);font-weight:700}
.sent{display:block;margin:0 0 7px}.sent .kr{display:none;color:var(--sub);font-size:14.5px;line-height:1.6;margin:1px 0 3px;font-weight:400}body.kon .sent:not(.blk) .kr,.sent.open:not(.blk) .kr{display:block}.sent:not(.blk){cursor:pointer}#kt{margin-left:auto}.bar #rs{margin-left:0}

<link rel="icon" type="image/svg+xml" href="../icon.svg"><link rel="apple-touch-icon" href="../icon-180.png"><meta name="apple-mobile-web-app-title" content="청석고정답"></head><body><div class="wrap"><div class="top"><a class="back" href="../index.html">← 청석고 정답 목록</a></div><h1>4과 Looking to Nature for Help · 빈칸 추론 연습 (매번 다른 문제)</h1><p class="lede">매번 바뀌어요. 같은 지문이라도 빈칸 자리가 달라지고 보기 순서도 매번 섞여요. 한 번 나온 문제는 한 바퀴를 다 돌 때까지 다시 나오지 않아요.</p><div class="bar"><span class="prog" id="prog"></span><button id="kt" type="button">한글 해석 보기</button><button id="rs" type="button">처음부터 다시</button></div><div id="stage"></div><div class="foot">비타민 영어클리닉 · 청석고1 공통영어2 4과</div></div>
<script src="../gate.js"></script>
<script>
var D={"segs": [{"id": "A", "title": "① 위기에 처한 환경 (1)", "sents": ["Our environment is in trouble.", "With the planet becoming warmer, sea levels are rising and natural disasters such as forest fires and floods are increasing.", "More and more waste is also being produced.", "Plastic, in particular, is causing problems with soil and water pollution.", "It is clear that humans are a major contributor to the destruction of nature."], "theme": "지구가 따뜻해지고 쓰레기, 특히 플라스틱이 늘면서 환경이 어려움에 처했어요. 그 원인은 바로 인간이에요.", "kos": ["우리의 환경은 어려움에 처해 있다.", "지구가 더 따뜻해지면서, 해수면이 상승하고 있고 산불과 홍수 같은 자연재해도 증가하고 있다.", "또한 점점 더 많은 쓰레기가 생산되고 있다.", "특히 플라스틱은 토양과 수질 오염에 관련한 문제를 야기하고 있다.", "인간이 자연 파괴의 주요 원인 제공자라는 것은 분명하다."]}, {"id": "B", "title": "① 위기에 처한 환경 (2)", "sents": ["Will we be able to protect the environment from mountains of plastic?", "Can we stop climate change from reaching dangerous levels?", "Achieving these goals seems difficult.", "Nature, however, may have provided us with solutions to these problems.", "Here are three areas where changes are already happening."], "theme": "플라스틱 더미와 기후 변화를 막기는 어려워 보이지만, 자연이 이미 해결책을 주었을지도 몰라요. 이제 변화가 일어나는 세 영역을 소개해요.", "kos": ["산더미 같은 플라스틱으로부터 우리가 환경을 보호할 수 있게 될까?", "기후 변화가 위험 수준에 도달하지 못하게 우리가 할 수 있을까?", "이러한 목표들을 이루는 것은 어려워 보인다.", "그러나 자연은 우리에게 이런 문제들에 대한 해결책을 제공했을지도 모른다.", "여기 이미 변화가 일어나고 있는 세 영역이 있다."]}, {"id": "C", "title": "② 플라스틱 쓰레기 처리하기 (1)", "sents": ["About fifty percent of plastic is produced for single-use products.", "That means the items are used just once and then discarded.", "Do you ever stop to think about where these plastic items go after you throw them away?", "Recycling can help reduce the amount of plastic in our landfills.", "However, less than ten percent of the world’s plastic waste has been recycled so far.", "Often, plastic waste is moved to places where it is just dumped or burned.", "Furthermore, between 8 and 14 million metric tons of plastic end up in the ocean every year.", "This puts many marine species in danger."], "theme": "플라스틱의 절반은 한 번 쓰고 버려져요. 재활용은 10%도 안 되고, 나머지는 내버려지거나 태워지거나 바다로 흘러가 해양 생물을 위험에 빠뜨려요.", "kos": ["플라스틱의 약 50%는 일회용 제품을 위해 생산된다.", "그것은 제품들이 딱 한 번 사용된 후 버려진다는 것을 의미한다.", "여러분이 플라스틱을 버린 후에 이것들이 어디로 가는지 생각하기 위해 멈춰(곰곰이 생각해) 본 적이 있는가?", "재활용하는 것은 우리의 매립지의(매립지로 가는) 플라스틱의 양을 줄이는 것을 도울 수 있다.", "그러나, 지금까지 세계 플라스틱 쓰레기의 10% 미만이 재활용되어 왔다.", "종종, 플라스틱 쓰레기는 그저 내버려지거나 태워지는 곳으로 보내진다.", "게다가, 8백만에서 1천4백만 톤의 플라스틱이 매년 바다에 유입된다.", "이것은 많은 해양 종들을 위험에 빠뜨린다."]}, {"id": "D", "title": "② 플라스틱 쓰레기 처리하기 (2)", "sents": ["With this in mind, scientists are turning to mealworms.", "Mealworms are the larvae of a certain species of beetle.", "Special bacteria live inside them.", "These bacteria can break down plastic.", "This means that mealworms can actually feed on plastic.", "Scientists are now looking for ways to cultivate the bacteria outside of mealworms.", "They also want to speed up the process by which the bacteria break down plastic.", "This may help us keep our landfills plastic-free."], "theme": "밀웜 몸속의 특별한 박테리아는 플라스틱을 분해해요. 과학자들은 이 박테리아를 밀웜 밖에서 키우고 분해 속도를 높여 매립지의 플라스틱을 없애려 해요.", "kos": ["이것을 염두에 두고, 과학자들은 밀웜에 의지하고(몰두하고) 있다.", "밀웜은 특정 종류의 딱정벌레의 유충이다.", "특별한 박테리아가 그들 안에 산다.", "이 박테리아는 플라스틱을 분해할 수 있다.", "이것은 밀웜이 사실상 플라스틱을 먹고 살 수 있다는 것을 의미한다.", "과학자들은 이제 밀웜의 체외에서 박테리아를 배양하는 방법을 찾고 있다.", "그들은 또한 박테리아가 플라스틱을 분해하는 과정의 속도를 올리기를 원한다.", "이것은 우리가 우리의 매립지를 플라스틱 없는 상태로 유지하도록 도울지도 모른다."]}, {"id": "E", "title": "③ 오염된 토양 정화하기 (1)", "sents": ["Mining and other industries are causing soil pollution across the globe.", "Although polluted soil can be dug up and transported to a landfill, this process is expensive.", "Moreover, it only moves the problem to another area and does not really solve it.", "Fortunately, there is an eco-friendly and cost-effective way to restore polluted soil — planting willow trees.", "These amazing trees have extensive and well-developed root systems.", "As a result, they naturally extract a wide range of harmful materials from the soil."], "theme": "오염된 흙을 파서 옮기는 방법은 비싸고 문제를 옮길 뿐이에요. 대신 뿌리가 잘 발달한 버드나무를 심으면 흙 속 해로운 물질을 자연스럽게 뽑아내요.", "kos": ["광산업과 다른 산업들이 전 세계적으로 토양 오염을 일으키고 있다.", "비록 오염된 흙이 파져서 매립지로 옮겨질 수는 있지만, 이 과정은 비용이 많이 든다.", "게다가, 이것은 단지 문제를 다른 곳으로 옮기는 것이며 그것(문제)을 실제로 해결하지 않는다.", "다행히도, 오염된 흙을 복구하는 친환경적이고 비용 대비 효과적인 방법이 있는데, 바로 버드나무를 심는 것이다.", "이 놀라운 나무들은 광범위하고 잘 발달된 뿌리 체계를 가지고 있다.", "결과적으로, 그들은 토양으로부터 광범위한 해로운 물질들을 자연적으로 추출한다."]}, {"id": "F", "title": "③ 오염된 토양 정화하기 (2)", "sents": ["They can also grow quickly, even in soil with a high acidity level or a lot of heavy metals in it.", "Research on the effectiveness of using willow trees for this purpose is in development.", "Scientists have found that some species of willow trees are able to absorb harmful materials better than others.", "Therefore, this promising area should be further explored to find out which trees are the most effective.", "In time, we may be able to clean up our land with willow trees."], "theme": "버드나무는 나쁜 흙에서도 빨리 자라고, 종류에 따라 해로운 물질을 더 잘 흡수해요. 어떤 나무가 가장 효과적인지 더 연구하면 땅을 깨끗하게 할 수 있을지도 몰라요.", "kos": ["그들은 심지어 산도가 높거나 안에 중금속을 많이 품은 토양에서도 빠르게 자랄 수 있다.", "이러한 목적으로 버드나무를 활용하는 것의 효율성에 대한 연구가 진행되고 있다.", "과학자들은 몇몇 종류의 버드나무가 다른 것(종류)들에 비해 해로운 물질을 더 잘 흡수할 수 있다는 것을 알아냈다.", "그러므로, 어떤 (종류의) 나무들이 가장 효과적인지를 찾아내기 위해 이 촉망받는 분야는 더 깊게 탐구되어야 한다.", "조만간, 우리는 버드나무로 우리의 땅을 깨끗하게 할 수 있을지도 모른다."]}, {"id": "G", "title": "④ 조류 바이오 연료 생산하기 (1)", "sents": ["Statistics show that about thirty to forty percent of people in the world drink coffee each day.", "The coffee-making process, however, generates used coffee grounds, which are normally sent to landfills.", "There, they can create a harmful greenhouse gas.", "Unfortunately, there’s no way to stop everyone in the world from drinking coffee.", "However, we can reduce greenhouse gas emissions by turning used coffee grounds into biofuel.", "Biofuel is a natural fuel that is made from plant or animal sources.", "Researchers have found that they can grow algae on old coffee grounds without adding any other nutrients."], "theme": "매립지로 가는 커피 찌꺼기는 해로운 온실가스를 만들어요. 그런데 커피 찌꺼기에 다른 영양분 없이 조류를 키워 바이오 연료로 바꿀 수 있어요.", "kos": ["통계 자료는 세계의 약 30~40%의 사람들이 매일 커피를 마신다는 것을 보여 준다.", "그러나, 커피 만드는 과정은 커피 찌꺼기를 발생시키는데, 이것들은 보통 매립지로 보내진다.", "거기에서, 그것들은 해로운 온실가스를 만들 수 있다.", "불행하게도, 세계의 모든 사람들이 커피를 마시는 것을 멈추게 할 방법은 없다.", "그러나, 우리는 사용된 커피 찌꺼기를 바이오 연료로 바꿈으로써 온실가스 배출을 줄일 수는 있다.", "바이오 연료는 식물이나 동물성 원료로 만들어진 천연 연료이다.", "연구자들은 그들이 오래된 커피 찌꺼기에서 어떤 다른 영양분도 더하지 않고 조류를 자라게 할 수 있다는 것을 알아냈다."]}, {"id": "H", "title": "④ 조류 바이오 연료 생산하기 (2)", "sents": ["If these algae are exposed to twenty hours of light and four hours of darkness each day, they eventually produce high-quality biofuel.", "The biofuel is renewable and sustainable, and it creates only a small amount of emissions.", "These are just a few solutions we can find in nature.", "There could be many more possible solutions to the problems we currently face.", "It seems that Mother Nature has given us one more chance.", "In return, we need to look for more ways to keep the environment healthy and clean.", "If we do, the future of our planet may be bright after all."], "theme": "조류가 만든 바이오 연료는 재생 가능하고 배출물이 적어요. 자연은 우리에게 한 번 더 기회를 주었으니, 우리도 환경을 지킬 방법을 더 찾아야 해요.", "kos": ["만약 이 조류가 20시간의 빛과 4시간의 어둠에 매일 노출되면, 그들은 마침내 양질의 바이오 연료를 생산한다.", "이 바이오 연료는 재생 가능하고 지속 가능하며, 적은 양의 배출물만 나온다.", "이것들은 우리가 자연에서 찾을 수 있는 소수의 해결책들에 불과하다.", "우리가 현재 직면한 문제들에 대해 가능성 있는 훨씬 더 많은 해결책들이 있을 수 있다.", "대자연은 우리에게 또 한 번의 기회를 준 것처럼 보인다.", "보답으로, 우리는 환경을 건강하고 깨끗하게 지킬 더 많은 방법을 찾을 필요가 있다.", "우리가 그렇게 한다면, 우리 지구의 미래는 결국 밝을지도 모른다."]}], "items": [{"seg": 0, "si": 0, "ans": "in trouble", "ako": "어려움에 처해", "ds": [["in good shape", "좋은 상태에", ""], ["getting cleaner", "더 깨끗해지고", ""], ["safe from harm", "해로부터 안전한", ""], ["under control", "통제되고 있는", ""]], "ko": "우리의 환경은 어려움에 처해 있다.", "n": 1}, {"seg": 0, "si": 1, "ans": "sea levels are rising", "ako": "해수면이 상승하고 있고", "ds": [["sea levels are falling", "해수면이 낮아지고 있고", ""], ["forests are growing faster", "숲이 더 빨리 자라고 있고", ""], ["the air is getting cleaner", "공기가 더 깨끗해지고 있고", ""], ["glaciers are getting bigger", "빙하가 더 커지고 있고", ""]], "ko": "지구가 더 따뜻해지면서, 해수면이 상승하고 있고 산불과 홍수 같은 자연재해도 증가하고 있다.", "n": 2}, {"seg": 0, "si": 3, "ans": "soil and water pollution", "ako": "토양과 수질 오염", "ds": [["noise and light pollution", "소음과 빛 공해", ""], ["food shortages and hunger", "식량 부족과 굶주림", ""], ["traffic jams in cities", "도시의 교통 체증", ""], ["forest fires and floods", "산불과 홍수", ""]], "ko": "특히 플라스틱은 토양과 수질 오염에 관련한 문제를 야기하고 있다.", "n": 4}, {"seg": 0, "si": 4, "ans": "a major contributor to the destruction of nature", "ako": "자연 파괴의 주요 원인 제공자", "ds": [["the only protectors of nature", "자연의 유일한 보호자", ""], ["a minor part of the problem", "문제의 작은 부분", ""], ["victims of nature’s anger", "자연의 분노의 희생자", ""], ["a major solution to climate change", "기후 변화의 주요 해결책", ""]], "ko": "인간이 자연 파괴의 주요 원인 제공자라는 것은 분명하다.", "n": 5}, {"seg": 1, "si": 0, "ans": "from mountains of plastic", "ako": "산더미 같은 플라스틱으로부터", "ds": [["from too many trees", "너무 많은 나무로부터", ""], ["from clean energy", "깨끗한 에너지로부터", ""], ["from willow trees", "버드나무로부터", ""], ["from mealworms", "밀웜으로부터", ""]], "ko": "산더미 같은 플라스틱으로부터 우리가 환경을 보호할 수 있게 될까?", "n": 6}, {"seg": 1, "si": 2, "ans": "seems difficult", "ako": "어려워 보인다", "ds": [["seems very easy", "매우 쉬워 보인다", ""], ["is already done", "이미 이루어졌다", ""], ["is not necessary", "필요하지 않다", ""], ["costs nothing", "비용이 전혀 들지 않는다", ""]], "ko": "이러한 목표들을 이루는 것은 어려워 보인다.", "n": 8}, {"seg": 1, "si": 3, "ans": "solutions to these problems", "ako": "이런 문제들에 대한 해결책", "ds": [["more problems to worry about", "걱정할 더 많은 문제들", ""], ["reasons to give up", "포기할 이유들", ""], ["plastic for single-use products", "일회용 제품용 플라스틱", ""], ["a warning about forest fires", "산불에 대한 경고", ""]], "ko": "그러나 자연은 우리에게 이런 문제들에 대한 해결책을 제공했을지도 모른다.", "n": 9}, {"seg": 1, "si": 4, "ans": "changes are already happening", "ako": "이미 변화가 일어나고 있는", "ds": [["nothing has been tried yet", "아직 아무것도 시도되지 않은", ""], ["plastic is being produced", "플라스틱이 생산되고 있는", ""], ["changes are impossible", "변화가 불가능한", ""], ["problems are getting worse", "문제가 더 악화되고 있는", ""]], "ko": "여기 이미 변화가 일어나고 있는 세 영역이 있다.", "n": 10}, {"seg": 2, "si": 0, "ans": "single-use products", "ako": "일회용 제품", "ds": [["long-lasting furniture", "오래 쓰는 가구", ""], ["medical devices", "의료 기기", ""], ["recycled clothes", "재활용 옷", ""], ["children’s toys only", "어린이 장난감만", ""]], "ko": "플라스틱의 약 50%는 일회용 제품을 위해 생산된다.", "n": 11}, {"seg": 2, "si": 1, "ans": "used just once and then discarded", "ako": "딱 한 번 사용된 후 버려진다", "ds": [["used many times and then recycled", "여러 번 사용된 후 재활용된다", ""], ["never used at all", "전혀 사용되지 않는다", ""], ["sold to other countries", "다른 나라에 팔린다", ""], ["kept for a long time", "오랫동안 보관된다", ""]], "ko": "그것은 제품들이 딱 한 번 사용된 후 버려진다는 것을 의미한다.", "n": 12}, {"seg": 2, "si": 3, "ans": "reduce the amount of plastic", "ako": "플라스틱의 양을 줄이는 것", "ds": [["increase the amount of plastic", "플라스틱의 양을 늘리는 것", ""], ["reduce the price of plastic", "플라스틱의 가격을 낮추는 것", ""], ["reduce the number of mealworms", "밀웜의 수를 줄이는 것", ""], ["hide the plastic", "플라스틱을 숨기는 것", ""]], "ko": "재활용하는 것은 우리의 매립지의(매립지로 가는) 플라스틱의 양을 줄이는 것을 도울 수 있다.", "n": 14}, {"seg": 2, "si": 4, "ans": "less than ten percent", "ako": "10% 미만", "ds": [["more than ninety percent", "90% 이상", ""], ["about fifty percent", "약 50%", ""], ["almost all", "거의 전부", ""], ["about seventy percent", "약 70%", ""]], "ko": "그러나, 지금까지 세계 플라스틱 쓰레기의 10% 미만이 재활용되어 왔다.", "n": 15}, {"seg": 2, "si": 5, "ans": "just dumped or burned", "ako": "그저 내버려지거나 태워지는", "ds": [["carefully recycled", "신중하게 재활용되는", ""], ["turned into biofuel", "바이오 연료로 바뀌는", ""], ["eaten by mealworms", "밀웜에게 먹히는", ""], ["sold as new products", "새 제품으로 팔리는", ""]], "ko": "종종, 플라스틱 쓰레기는 그저 내버려지거나 태워지는 곳으로 보내진다.", "n": 16}, {"seg": 2, "si": 6, "ans": "end up in the ocean", "ako": "결국 바다로 흘러간다", "ds": [["are recycled into bottles", "병으로 재활용된다", ""], ["are eaten by beetles", "딱정벌레에게 먹힌다", ""], ["disappear in the air", "공중으로 사라진다", ""], ["are burned safely", "안전하게 태워진다", ""]], "ko": "게다가, 8백만에서 1천4백만 톤의 플라스틱이 매년 바다에 유입된다.", "n": 17}, {"
