</style><link rel="icon" type="image/svg+xml" href="../icon.svg"><link rel="apple-touch-icon" href="../icon-180.png"><meta name="apple-mobile-web-app-title" content="청석고정답"></head><body><div class="wrap"><div class="top"><a class="back" href="../index.html">← 목록</a></div><h1 id="h"></h1><div class="sub">본문과 다른 문장을 찾아 눌러 보세요.</div><div class="how">문장을 누르면 본문 근거와 해설이 열려요. 본문과 다른 문장이면 초록색, 본문과 같은 내용이면 주황색으로 표시돼요. 맞는 문장도 눌러서 읽어 보면 본문이 더 잘 기억나요.</div><div class="nav" id="nav"></div><div id="root"></div><div class="foot">비타민 영어클리닉 · 청석고 공통영어2</div></div><script src="../gate.js"></script><script>
var D={"n": "4", "title": "4과 Looking to Nature for Help", "parts": [["❶", "본문 ❶"], ["❷", "본문 ❷"], ["❸", "본문 ❸"], ["❹", "본문 ❹"]], "groups": [{"part": "❶", "title": "지구가 보내는 경고", "flow": "지구가 더워지면서 해수면이 오르고 산불·홍수 같은 자연재해가 늘고 있어요.", "items": [{"en": "As the planet warms up, the sea level is going up.", "ans": "T", "ko": "지구가 따뜻해지면서 해수면이 올라가고 있다.", "eve": "With the planet becoming warmer, sea levels are rising and natural disasters such as forest fires and floods are increasing.", "evk": "지구가 더 따뜻해지면서, 해수면이 상승하고 있고 산불과 홍수 같은 자연재해도 증가하고 있다.", "why": "warmer (더 따뜻한)와 rising (오르고 있는)이 그대로 이어져요. 지구가 더워지는 것이 원인이고 해수면 상승이 결과예요."}, {"en": "Forest fires and floods are becoming more common.", "ans": "T", "ko": "산불과 홍수가 점점 더 흔해지고 있다.", "eve": "With the planet becoming warmer, sea levels are rising and natural disasters such as forest fires and floods are increasing.", "evk": "지구가 더 따뜻해지면서, 해수면이 상승하고 있고 산불과 홍수 같은 자연재해도 증가하고 있다.", "why": "increasing (증가하고 있는)을 becoming more common (더 흔해지는)으로 바꿔 쓴 문장이에요."}, {"en": "Natural disasters like forest fires and floods are decreasing.", "ans": "F", "ko": "산불과 홍수 같은 자연재해가 줄어들고 있다.", "eve": "With the planet becoming warmer, sea levels are rising and natural disasters such as forest fires and floods are increasing.", "evk": "지구가 더 따뜻해지면서, 해수면이 상승하고 있고 산불과 홍수 같은 자연재해도 증가하고 있다.", "why": "본문은 increasing (증가하는)인데 decreasing (줄어드는)으로 바뀌었어요. 환경이 위기라는 글의 흐름과도 맞지 않아요."}, {"en": "Because the planet is getting cooler, sea levels are rising.", "ans": "F", "ko": "지구가 점점 더 차가워지고 있어서 해수면이 오르고 있다.", "eve": "With the planet becoming warmer, sea levels are rising and natural disasters such as forest fires and floods are increasing.", "evk": "지구가 더 따뜻해지면서, 해수면이 상승하고 있고 산불과 홍수 같은 자연재해도 증가하고 있다.", "why": "본문은 warmer (더 따뜻한)인데 cooler (더 차가운)로 바뀌었어요. 해수면 상승의 원인은 지구가 더워지는 것이에요."}]}, {"part": "❶", "title": "쓰레기와 플라스틱 문제", "flow": "점점 더 많은 쓰레기가 만들어지고, 특히 플라스틱이 토양과 물을 오염시켜요. 인간이 자연 파괴의 큰 원인이에요.", "items": [{"en": "The amount of waste being produced keeps growing.", "ans": "T", "ko": "생산되는 쓰레기의 양이 계속 늘고 있다.", "eve": "More and more waste is also being produced.", "evk": "또한 점점 더 많은 쓰레기가 생산되고 있다.", "why": "More and more (점점 더 많은)이 keeps growing (계속 늘고 있다)과 같은 뜻이에요."}, {"en": "Plastic is a cause of soil and water pollution.", "ans": "T", "ko": "플라스틱은 토양과 수질 오염의 원인이다.", "eve": "Plastic, in particular, is causing problems with soil and water pollution.", "evk": "특히 플라스틱은 토양과 수질 오염에 관련한 문제를 야기하고 있다.", "why": "in particular (특히)가 붙어서 많은 쓰레기 중에서도 플라스틱이 대표 문제라는 뜻이에요."}, {"en": "Plastic mainly causes problems with air pollution.", "ans": "F", "ko": "플라스틱은 주로 대기 오염 문제를 일으킨다.", "eve": "Plastic, in particular, is causing problems with soil and water pollution.", "evk": "특히 플라스틱은 토양과 수질 오염에 관련한 문제를 야기하고 있다.", "why": "본문은 soil and water (토양과 물) 오염이에요. air (공기)로 바뀌었어요."}, {"en": "Humans are a major cause of the destruction of nature.", "ans": "T", "ko": "인간은 자연 파괴의 주요 원인이다.", "eve": "It is clear that humans are a major contributor to the destruction of nature.", "evk": "인간이 자연 파괴의 주요 원인 제공자라는 것은 분명하다.", "why": "a major contributor (주요 원인 제공자)를 a major cause (주요 원인)로 쉽게 바꾼 문장이에요."}, {"en": "Humans have little to do with the destruction of nature.", "ans": "F", "ko": "인간은 자연 파괴와 거의 관련이 없다.", "eve": "It is clear that humans are a major contributor to the destruction of nature.", "evk": "인간이 자연 파괴의 주요 원인 제공자라는 것은 분명하다.", "why": "본문은 humans are a major contributor (인간이 주요 원인)라고 분명히 말해요. 정반대로 바뀌었어요."}]}, {"part": "❶", "title": "어려워 보이지만 자연에 답이 있다", "flow": "플라스틱과 기후 변화를 해결하기는 어려워 보이지만, 자연이 해결책을 줬을지도 몰라요. 이미 변화가 일어나는 세 영역을 소개해요.", "items": [{"en": "The writer asks if we can protect the environment from mountains of plastic.", "ans": "T", "ko": "글쓴이는 우리가 산더미 같은 플라스틱으로부터 환경을 보호할 수 있을지 묻는다.", "eve": "Will we be able to protect the environment from mountains of plastic?", "evk": "산더미 같은 플라스틱으로부터 우리가 환경을 보호할 수 있게 될까?", "why": "mountains of plastic (산더미 같은 플라스틱)은 플라스틱이 아주 많다는 표현이에요."}, {"en": "The writer asks if we can stop climate change from reaching dangerous levels.", "ans": "T", "ko": "글쓴이는 기후 변화가 위험한 수준에 이르지 않게 막을 수 있을지 묻는다.", "eve": "Can we stop climate change from reaching dangerous levels?", "evk": "기후 변화가 위험 수준에 도달하지 못하게 우리가 할 수 있을까?", "why": "stop A from B (A가 B하지 못하게 막다) 구조예요. 위험 수준(dangerous levels)에 닿기 전에 막자는 뜻이에요."}, {"en": "Achieving these goals seems easy.", "ans": "F", "ko": "이러한 목표들을 이루는 것은 쉬워 보인다.", "eve": "Achieving these goals seems difficult.", "evk": "이러한 목표들을 이루는 것은 어려워 보인다.", "why": "본문은 difficult (어려운)인데 easy (쉬운)로 바뀌었어요. 뒤의 However (그러나)로 반전이 나오는 것도 앞이 어렵다는 내용이기 때문이에요."}, {"en": "Nature may have given us solutions to these problems.", "ans": "T", "ko": "자연이 이 문제들에 대한 해결책을 우리에게 주었을지도 모른다.", "eve": "Nature, however, may have provided us with solutions to these problems.", "evk": "그러나 자연은 우리에게 이런 문제들에 대한 해결책을 제공했을지도 모른다.", "why": "provide A with B (A에게 B를 제공하다)예요. provided (제공했다)를 given (주었다)으로 바꿨어요."}, {"en": "Nature has nothing to offer for these problems.", "ans": "F", "ko": "자연은 이 문제들에 줄 것이 아무것도 없다.", "eve": "Nature, however, may have provided us with solutions to these problems.", "evk": "그러나 자연은 우리에게 이런 문제들에 대한 해결책을 제공했을지도 모른다.", "why": "본문은 solutions (해결책)을 제공했을지도 모른다고 해요. nothing to offer (줄 것이 없다)는 반대예요."}, {"en": "Changes are already happening in three areas.", "ans": "T", "ko": "세 영역에서 이미 변화가 일어나고 있다.", "eve": "Here are three areas where changes are already happening.", "evk": "여기 이미 변화가 일어나고 있는 세 영역이 있다.", "why": "three areas (세 영역)가 뒤에 나오는 플라스틱, 토양, 바이오 연료예요."}]}, {"part": "❷", "title": "일회용 플라스틱", "flow": "플라스틱의 절반 정도는 한 번 쓰고 버려지는 일회용 제품으로 만들어져요.", "items": [{"en": "About half of all plastic is made for single-use products.", "ans": "T", "ko": "전체 플라스틱의 약 절반이 일회용 제품을 위해 만들어진다.", "eve": "About fifty percent of plastic is produced for single-use products.", "evk": "플라스틱의 약 50%는 일회용 제품을 위해 생산된다.", "why": "fifty percent (50%)는 about half (약 절반)과 같아요."}, {"en": "Single-use items are used once and then thrown away.", "ans": "T", "ko": "일회용 제품은 한 번 쓰고 버려진다.", "eve": "That means the items are used just once and then discarded.", "evk": "그것은 제품들이 딱 한 번 사용된 후 버려진다는 것을 의미한다.", "why": "discarded (버려진)를 thrown away (버려진)로 바꿨어요. just once (딱 한 번)가 single-use (일회용)의 뜻이에요."}, {"en": "About ten percent of plastic is produced for single-use products.", "ans": "F", "ko": "플라스틱의 약 10%가 일회용 제품을 위해 생산된다.", "eve": "About fifty percent of plastic is produced for single-use products.", "evk": "플라스틱의 약 50%는 일회용 제품을 위해 생산된다.", "why": "본문은 fifty percent (50%)예요. ten percent (10%)로 숫자가 바뀌었어요."}, {"en": "The writer asks whether we ever think about where thrown-away plastic goes.", "ans": "T", "ko": "글쓴이는 버린 플라스틱이 어디로 가는지 생각해 본 적이 있는지 묻는다.", "eve": "Do you ever stop to think about where these plastic items go after you throw them away?", "evk": "여러분이 플라스틱을 버린 후에 이것들이 어디로 가는지 생각하기 위해 멈춰(곰곰이 생각해) 본 적이 있는가?", "why": "stop to think (멈춰서 생각하다)는 곰곰이 생각해 본다는 뜻이에요. 독자에게 던지는 질문이에요."}]}, {"part": "❷", "title": "재활용의 한계와 바다", "flow": "재활용이 도움은 되지만 실제로는 10%도 안 되고, 많은 쓰레기가 버려지거나 태워지며 바다로도 흘러가요.", "items": [{"en": "Recycling can reduce the amount of plastic in landfills.", "ans": "T", "ko": "재활용은 매립지의 플라스틱 양을 줄이는 데 도움이 될 수 있다.", "eve": "Recycling can help reduce the amount of plastic in our landfills.", "evk": "재활용하는 것은 우리의 매립지의(매립지로 가는) 플라스틱의 양을 줄이는 것을 도울 수 있다.", "why": "reduce (줄이다)와 landfills (매립지)를 그대로 썼어요."}, {"en": "More than half of the world's plastic waste has been recycled.", "ans": "F", "ko": "세계 플라스틱 쓰레기의 절반 이상이 재활용되어 왔다.", "eve": "However, less than ten percent of the world’s plastic waste has been recycled so far.", "evk": "그러나, 지금까지 세계 플라스틱 쓰레기의 10% 미만이 재활용되어 왔다.", "why": "본문은 less than ten percent (10% 미만)예요. 절반 넘게 재활용됐다는 말은 정반대예요. However (그러나)가 '재활용이 도움은 되지만 실제론 적다'는 반전을 알려 줘요."}, {"en": "Plastic waste is often sent to places where it is dumped or burned.", "ans": "T", "ko": "플라스틱 쓰레기는 종종 그냥 버려지거나 태워지는 곳으로 보내진다.", "eve": "Often, plastic waste is moved to places where it is just dumped or burned.", "evk": "종종, 플라스틱 쓰레기는 그저 내버려지거나 태워지는 곳으로 보내진다.", "why": "moved to (~로 옮     var bAll=el('button',null,'나머지 해설 모두 열기');bAll.onclick=function(){btns.forEach(function(x){S[x.id]=S[x.id]||2});save();paint()};
    var bReset=el('button',null,'이 소단락 다시 하기');bReset.onclick=function(){btns.forEach(function(x){delete S[x.id]});save();paint()};
    tools.appendChild(bAll);tools.appendChild(bReset);card.appendChild(tools);
    var flow=el('div','flow');flow.appendChild(el('span','tag','이 소단락 정리'));flow.appendChild(document.createTextNode(g.flow));card.appendChild(flow);
    root.appendChild(card);
    cards.push({g:g,btns:btns,cnt:cnt,flow:flow,nF:nF});
  });
});
function paint(){
  var done=0;
  cards.forEach(function(c){
    var found=0,all=true;
    c.btns.forEach(function(x){
      var o=!!S[x.id];
      x.b.classList.toggle('open',o);
      x.b.classList.remove('ok','no2');
      var old=x.b.querySelector('.badge');if(old)old.remove();
      if(o){
        var f=x.it.ans==='F';x.b.classList.add(f?'ok':'no2');
        if(f)found++;
        var bd=el('span','badge',f?'✔ 본문과 다른 문장 · 잘 찾았어요':'본문과 같은 내용이에요 · 맞는 문장');
        x.b.insertBefore(bd,x.pn);
      }
      if(!o)all=false;
    });
    var fin=found===c.nF;
    c.cnt.textContent='다른 문장 '+found+'/'+c.nF+' 찾음';
    c.cnt.classList.toggle('done',fin);
    c.flow.classList.toggle('on',fin);
    if(fin)done++;
  });
  prog.textContent='소단락 '+done+'/'+cards.length+' 확인';
  var allNow=cards.length>0&&done===cards.length;
  if(allNow&&!wasAll&&gkReady&&window.GK){var tF=0,fF=0;cards.forEach(function(c){c.btns.forEach(function(x){if(x.it.ans==='F'){tF++;if(S[x.id]===1)fF++}})});GK.report('L4-find',tF?fF/tF*100:0)}
  wasAll=allNow;
}
paint();gkReady=true;
</script></body></html>
