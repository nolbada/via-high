<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Y 내 단어장</title>
<style>
:root{--bg:#f4f6f8;--sf:#fff;--fg:#14202b;--mu:#566474;--ln:#d9e0e7;--ac:#0f766e;--acbg:#ccfbf1;--ok:#15803d;--okbg:#e3f4e8;--bad:#b91c1c;--badbg:#fde8e8;--warn:#b45309;--warnbg:#fef3c7;--corefg:#fff;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0e141b;--sf:#17212b;--fg:#e6ebf0;--mu:#9aa8b6;--ln:#2a3744;--ac:#2dd4bf;--acbg:#0f3a36;--ok:#4ade80;--okbg:#15301f;--bad:#f87171;--badbg:#3a1d1f;--warn:#fbbf24;--warnbg:#46330a;--corefg:#04201d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.5}
.hm{display:inline-block;margin:10px 16px 0;font-size:13px;color:var(--ac);text-decoration:none}
.wrap{max-width:560px;margin:0 auto;padding:8px 16px 40px}
h1{font-size:20px;margin:6px 0 2px}.sub{color:var(--mu);font-size:14px;margin:0 0 14px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
.small{font-size:13px;color:var(--mu)}
.nums{display:flex;gap:8px}.nums div{flex:1;text-align:center;background:var(--bg);border-radius:10px;padding:10px 4px}.nums b{display:block;font-size:22px}.nums span{font-size:12px;color:var(--mu)}
.btn{display:block;width:100%;min-height:50px;border:none;border-radius:12px;background:var(--ac);color:var(--corefg);font-size:17px;font-weight:700;cursor:pointer;margin-top:10px;font-family:inherit;text-align:center;text-decoration:none;padding:13px 8px}
.btn:disabled{opacity:.4;cursor:default}
.btn.g{background:var(--sf);color:var(--fg);border:1.5px solid var(--ln)}
.seg{display:flex;gap:8px;margin:14px 0 10px}.seg button{flex:1;height:44px;border-radius:12px;border:1.5px solid var(--ln);background:var(--sf);color:var(--fg);font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}.seg button.on{background:var(--ac);border-color:var(--ac);color:var(--corefg)}
.row{padding:12px 0;border-bottom:1px solid var(--ln)}.row:last-child{border-bottom:none}
.wt{font-size:18px;font-weight:700}.wguide{margin:10px 0;padding:10px 12px;border-radius:10px;background:rgba(120,140,160,.15);font-size:14px;line-height:1.6}.wsf{font-weight:400;color:var(--mu);font-size:15px}.wp{font-size:13px;color:var(--mu);font-weight:400}
.wm{font-size:16px;margin-top:2px}
.ws{font-size:14px;color:var(--mu);margin-top:4px;font-family:"Segoe UI",system-ui,sans-serif;line-height:1.5}.ws b{color:var(--fg);border-bottom:2px solid var(--ac)}
.wf{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:12px;color:var(--mu)}
.rm{border:none;background:none;color:var(--mu);font-size:13px;cursor:pointer;padding:8px 0 8px 12px;font-family:inherit;text-decoration:underline}
.q{font-size:15px;color:var(--mu);margin:0 0 6px}
.big{font-size:24px;font-weight:700;margin:2px 0 8px}
.sent{font-size:19px;line-height:1.9;font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;margin:6px 0 12px}.sent b{background:var(--warnbg);border-radius:6px;padding:1px 3px}
.opt{display:block;width:100%;text-align:left;min-height:48px;padding:11px 14px;margin-top:8px;border-radius:12px;border:2px solid var(--ln);background:var(--sf);color:var(--fg);font-size:17px;cursor:pointer;font-family:inherit}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.no{border-color:var(--bad);background:var(--badbg)}
.msg{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:15px;background:var(--warnbg)}.msg.g{background:var(--okbg)}
.bar{height:5px;background:var(--ln);border-radius:3px;overflow:hidden;margin-bottom:12px}.bar i{display:block;height:100%;background:var(--ac)}
.memo{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--acbg);font-size:16px}
.two{display:flex;gap:8px}.two .btn{margin-top:10px}
.empty{color:var(--mu);font-size:15px;padding:12px 0;line-height:1.6}
</style></head><body>

<!--WB:BEGIN--><script>var WD={"f1_0":{"t":"avoid","m":"동명사(V-ing)를 목적어로 사용 (avoid to do X)","d":1,"x":"f"},"f1_1":{"t":"hand in","m":"이어동사. 목적어가 대명사일 경우 hand it in","d":1,"x":"f"},"f1_2":{"t":"run","m":"다의어. 목적어 없으면 ‘작동하다’, 있으면 ‘운영하다’","d":1,"x":"f"},"f2_3":{"t":"lend","m":"4형식 수여동사. lend + 사람 + 사물 또는 3형식 lend + 사물 + to + 사람 구조로 사용","d":2,"x":"f"},"f2_4":{"t":"remain","m":"2형식 연결동사. 주어의 상태를 설명하는 형용사나 명사 보어가 필요","d":2,"x":"f"},"f2_5":{"t":"react to","m":"자동사구. 반응의 대상 앞에 반드시 전치사 to가 필요","d":2,"x":"f"},"f3_6":{"t":"look","m":"2형식 연결동사. look + 형용사또는 look like + 명사구조로 사용","d":3,"x":"f"},"f3_7":{"t":"explain","m":"4형식으로 착각하기 쉬운 3형식 동사. explain + 내용 + to + 사람순서로 사용","d":3,"x":"f"},"f3_8":{"t":"reply to","m":"자동사구. 대답의 대상 앞에 반드시 전치사 to가 필요","d":3,"x":"f"},"f4_9":{"t":"lie","m":"자동사 눕다, 놓여 있다(lie - lay - lain)","d":4,"x":"f"},"f4_10":{"t":"lay","m":"타동사 놓다, 눕히다(lay - laid - laid)","d":4,"x":"f"},"f4_11":{"t":"oppose","m":"타동사. ~에 반대하다. 전치사 없이 목적어를 바로 사용","d":4,"x":"f"},"f5_12":{"t":"consider","m":"3형식일 때 동명사(V-ing)를 목적어로 사용(①고려하다) 5형식일 때 consider + 목적어 + 명사/형용사 구조로 사용(②~라고 여기다)","d":5,"x":"f"},"f5_13":{"t":"address","m":"목적어가 '문제'이면 '다루다, 해결하다', '청중'이면 '연설하다'로 해석되는 다의어","d":5,"x":"f"},"f5_14":{"t":"feel like Ving","m":"~하고 싶다는 의미의 관용 표현. like 뒤에 반드시 동명사(V-ing)를 사용","d":5,"x":"f"},"f6_15":{"t":"discuss","m":"~에 대해 논의하다라는 의미지만, 전치사 about 없이 목적어를 바로 사용하는 타동사","d":6,"x":"f"},"f6_16":{"t":"find","m":"3형식(find + 목적어)일 때 '발견하다, 알다', 5형식(find + 목적어 + 형용사) 일 때 '~라고 생각하다'로 의미가 확장됨","d":6,"x":"f"},"f6_17":{"t":"taste","m":"2형식(taste + 형용사 보어) 일 때 '맛이 ~한 상태이다'는 주어의 상태를 나타냄. 3형식 (taste + 목적어) 일 때 '맛을 보다'는 능동적 동작으로 사용됨","d":6,"x":"f"},"f7_18":{"t":"count","m":"단독으로 쓰이면 '중요하다'(1형식), count on은 '의지하다', count A as B는 'A를 B로 여기다'등 구조에 따라 의미가 달라지는 다의어","d":7,"x":"f"},"f7_19":{"t":"answer","m":"~에 대답하다라는 의미지만, 전치사 to 없이 목적어를 바로 사용하는 타동사","d":7,"x":"f"},"f7_20":{"t":"advise","m":"advise + 사람 + to do형태로, 목적격 보어로 to부정사를 사용하는 대표적인 5형식 동사","d":7,"x":"f"},"f8_21":{"t":"graduate from","m":"~을 졸업하다. 반드시 전치사 from이 필요","d":8,"x":"f"},"f8_22":{"t":"order","m":"5형식으로 쓰일 때 목적격 보어로 to부정사를 사용하여 ~가 ...하도록 명령하다는 의미로 사용","d":8,"x":"f"},"f8_23":{"t":"be covered with","m":"~으로 덮여 있다. 행위자가 아닌 재료나 도구를 나타낼 때 by 대신 with를 사용하는 수동태","d":8,"x":"f"},"f9_24":{"t":"take care of","m":"~을 돌보다. 세 단어가 하나의 동사처럼 쓰이며 look after와 유사","d":9,"x":"f"},"f9_25":{"t":"delay","m":"동명사(V-ing)를 목적어로 사용. to부정사는 사용하지 않음 (delay to do X)","d":9,"x":"f"},"f9_26":{"t":"inform A of B","m":"A(사람)에게 B(내용)를 알리다. 내용 앞에 전치사 of가 반드시 필요","d":9,"x":"f"},"f10_27":{"t":"apply A to B","m":"A(이론/지식)를 B(상황)에 적용하다. apply for(~에 지원하다)와 구별 필요","d":10,"x":"f"},"f10_28":{"t":"be busy Ving","m":"~하느라 바쁘다. busy 뒤에 반드시 동명사(V-ing)를 사용","d":10,"x":"f"},"f10_29":{"t":"listen to","m":"~을 듣다. 듣는 대상 앞에 전치사 to가 반드시 필요","d":10,"x":"f"},"f11_30":{"t":"appear","m":"1형식 나타나다, 2형식 ~처럼 보이다. 자동사이므로 수동태 불가 (be appeared X)","d":11,"x":"f"},"f11_31":{"t":"forgive A for B","m":"A(사람)를 B(이유)에 대해 용서하다. 이유 앞에 전치사 for가 필요","d":11,"x":"f"},"f12_32":{"t":"mention","m":"~을 언급하다. 전치사 about 없이목적어를 바로 사용","d":12,"x":"f"},"f12_33":{"t":"do","m":"충분하다, 괜찮다. 1형식 자동사로 쓰이며 주로 will do형태로 사용","d":12,"x":"f"},"f12_34":{"t":"put off","m":"~을 미루다, 연기하다. 동명사(V-ing)를 목적어로 사용하며 대명사는 중간에 위치(put it off)","d":12,"x":"f"},"f13_35":{"t":"practice","m":"동명사(V-ing)를 목적어로 사용. to부정사는 사용하지 않음","d":13,"x":"f"},"f13_36":{"t":"come up with","m":"(아이디어·계획 등을) 떠올리다, 생각해내다. 세 단어가 하나의 동사처럼 쓰임","d":13,"x":"f"},"f13_37":{"t":"fill A with B","m":"A를 B로 채우다. 수동태 be filled with로도 자주 사용됨","d":13,"x":"f"},"f14_38":{"t":"include","m":"포함하다. conclude(끝내다)와 혼동 주의","d":14,"x":"f"},"f14_39":{"t":"conclude","m":"끝내다, 결론짓다. 공식적인 마무리의 의미","d":14,"x":"f"},"f14_40":{"t":"protect A from B","m":"A를 B로부터 보호하다. 위협 요소 앞에 from이 필요","d":14,"x":"f"},"f15_41":{"t":"leave","m":"3형식 떠나다, 5형식 ~한 상태로 만들다등 문형에 따라 의미가 달라짐","d":15,"x":"f"},"f15_42":{"t":"can't help Ving","m":"~하지 않을 수 없다. 관용적으로 동명사(V-ing)만 사용","d":15,"x":"f"},"f15_43":{"t":"come across","m":"우연히 마주치다, 발견하다. 의도치 않은 만남을 의미","d":15,"x":"f"},"f16_44":{"t":"describe","m":"설명하다. 4형식으로 쓸 수 없으며 describe A to B형태로 사용","d":16,"x":"f"},"f16_45":{"t":"turn down","m":"① 거절하다 ② (소리를) 낮추다. 대명사는 반드시 중간에 위치 (turn it down)","d":16,"x":"f"},"f16_46":{"t":"remind A of B","m":"A에게 B를 생각나게 하다. remind A to do와 구별 필요","d":16,"x":"f"},"f17_47":{"t":"involve","m":"~을 포함하다, 수반하다. 목적어로 동명사(V-ing)를 자주 사용하며 evolve(진화하다)와 혼동 주의","d":17,"x":"f"},"f17_48":{"t":"evolve","m":"~에서 ~로 진화/발전하다. 자동사이며 from A into B 형태와 자주 쓰임","d":17,"x":"f"},"f17_49":{"t":"participate in","m":"~에 참여하다. 활동이나 행사 앞에 반드시 전치사 in이 필요","d":17,"x":"f"},"f18_50":{"t":"cause","m":"~가 ...하게 만들다. 목적격 보어로 to부정사를 사용하는 5형식 동사이며, 보통 부정적인 결과를 야기할 때 자주 사용됨","d":18,"x":"f"},"f18_51":{"t":"call off","m":"취소하다. cancel과 같은 의미이며, 목적어가 대명사일 경우 call it off처럼 중간에 위치","d":18,"x":"f"},"f18_52":{"t":"be surprised at","m":"~에 놀라다. 감정의 원인 앞에 by가 아닌 전치사 at을 사용하는 대표적인 수동태 표현","d":18,"x":"f"},"f19_53":{"t":"suggest","m":"제안하다. 목적어로 동명사(V-ing)나 that절을 사용하며 to부정사는 쓰지 않음","d":19,"x":"f"},"f19_54":{"t":"sell","m":"팔다(타동사), (잘) 팔리다(자동사). 주어가 상품일 때 자동사로 자주 쓰임","d":19,"x":"f"},"f19_55":{"t":"thank A for B","m":"A에게 B에 대해 고마워하다. 감사 이유 앞에 전치사 for가 필요","d":19,"x":"f"},"f20_56":{"t":"offer","m":"제공하다, 제안하다. 4형식 수여동사로 offer + 사람 + 사물구조로 사용","d":20,"x":"f"},"f20_57":{"t":"fall down","m":"넘어지다, 쓰러지다. fall과 유사하나 완전히 넘어지는 동작을 강조하는 자동사구","d":20,"x":"f"},"f20_58":{"t":"be interested in","m":"~에 관심이 있다. 흥미를 유발하는 대상 앞에 in을 사용하는 수동태 관용 표현","d":20,"x":"f"},"f21_59":{"t":"tear","m":"철자는 같지만 발음과 뜻이 전혀 다른 다의어 ① [ter] 찢다 (동사): 불규칙 동사(tear-tore-torn) 변화에 주의 ② [tɪər] 눈물 (명사)","d":21,"x":"f"},"f21_60":{"t":"spend+시간/돈+Ving","m":"~하는 데 시간/돈을 쓰다. spend 뒤에 목적어(시간/돈)와 동명사(V-ing)가 오는 관용 표현","d":21,"x":"f"},"f21_61":{"t":"help oneself to","m":"~을 마음껏 먹다/쓰다. 주어에 맞는 재귀대명사(oneself, themselves 등)를 사용해야 함","d":21,"x":"f"},"f22_62":{"t":"greet","m":"~에게 인사하다. '~에게'라는 뜻이 있지만 전치사 없이 목적어를 바로 사용하는 타동사","d":22,"x":"f"},"f22_63":{"t":"take off","m":"① 벗다(타동사) ② 이륙하다(자동사). 문맥에 따라 의미가 달라지는 다의어이며, 대명사 목적어는 반드시 take it off처럼 중간에 위치","d":22,"x":"f"},"f22_64":{"t":"view A as B","m":"A를 B로 여기다. A와 B 사이에 전치사 as가 반드시 필요한 3형식 패턴 동사(A는 목적어, as B는 수식어)","d":22,"x":"f"},"f23_65":{"t":"elect","m":"~을 ...으로 선출하다. elect + 목적어 + 목적격 보어구조의 5형식 동사이며, 보어 앞에 as를 쓰지 않음","d":23,"x":"f"},"f23_66":{"t":"mind","m":"꺼리다. 동명사(V-ing)를 목적어로 사용하며 Do you mind ~ing?는 정중한 요청 표현","d":23,"x":"f"},"f23_67":{"t":"stand for","m":"① ~을 나타내다, 상징하다 ②~을 지지하다. 문맥에 따라 의미가 달라지는 다의어 동사구","d":23,"x":"f"},"f24_68":{"t":"correct / collect","m":"고치다 / 모으다. 철자가 비슷하여 혼동하기 쉬운 동사. correct는 '틀린 것을 바로잡다', collect는 '여러 개를 한데 모으다'라는 의미","d":24,"x":"f"},"f24_69":{"t":"make use of","m":"~을 (효과적으로) 이용하다. use보다 더 적극적으로 활용한다는 뉘앙스를 가짐","d":24,"x":"f"},"f25_70":{"t":"break down","m":"‘고장 나다, 실패하다, 감정이 무너지다’ 등 문맥에 따라 의미가 달라지는 다의어 자동사구","d":25,"x":"f"},"f25_71":{"t":"be tired of","m":"~에 싫증 나다, 지긋지긋하다. 반복되는 일에 대한 정신적 피로를 나타내며, 원인 앞에 of 를 사용. be tired from(육체적 피로)과 구별 필요","d":25,"x":"f"},"f25_72":{"t":"compare A with B","m":"A와 B를 비교하다. 비교 대상 사이에 전치사 with가 필요","d":25,"x":"f"},"f26_73":{"t":"keep","m":"보관하다(3형식), ~인 상태를 유지하다(2, 5형식) 등 문장 구조에 따라 의미가 달라지는 핵심 다의어 동사","d":26,"x":"f"},"f26_74":{"t":"marry","m":"~와 결혼하다. 전치사 with 없이 목적어를 바로 사용하는 타동사","d":26,"x":"f"},"f26_75":{"t":"bring up","m":"기르다, 양육하다(사람), (화제를) 꺼내다(사물) 등 목적어에 따라 의미가 달라지는 다의어 동사구","d":26,"x":"f"},"f27_76":{"t":"simulate vs. stimulate","m":"모의실험하다, 자극하다. 철자가 비슷해 혼동하기 쉬운 동사. simulate는 '모방', stimulate는 '촉진'의 의미","d":27,"x":"f"},"f27_77":{"t":"resemble","m":"~을 닮다, 유사하다. 사람, 사물 모두 사용 가능하며, with 같은 전치사 없이 목적어를 바로 사용하는 타동사. look like로 바꿔 쓸 수 있음. take after는 가족 간에만 사용되므로 구분 필요","d":27,"x":"f"},"f28_78":{"t":"allow","m":"~가 ...하도록 허락하다. 목적어의 행동을 to부정사로 표현하는 대표적인 5형식 동사.","d":28,"x":"f"},"f28_79":{"t":"announce","m":"발표하다. 4형식으로 쓸 수 없으며, 듣는 사람 앞에 반드시 to가 필요한 3형식 동사.","d":28,"x":"f"},"f28_80":{"t":"look up","m":"찾아보다(정보), 올려다보다(시선). 목적어나 문맥에 따라 의미가 달라지는 다의어 동사구.","d":28,"x":"f"},"f29_81":{"t":"matter","m":"중요하다, 문제가 되다. 주어와 동사만으로 의미가 완전한 1형식 자동사","d":29,"x":"f"},"f29_82":{"t":"figure out","m":"알아내다, 생각해 내다, 이해하다. understand, solve와 유사하지만, 생각해서 답을 찾아내는 과정을 강조하는 동사구","d":29,"x":"f"},"f29_83":{"t":"be satisfied with","m":"~에 만족하다. 감정의 원인이 되는 대상 앞에 by가 아닌 전치사 with를 사용하는 대표적인 수동태 관용 표현","d":29,"x":"f"},"f30_84":{"t":"expect","m":"~가 ...할 것으로 기대하다. 목적어의 행동을 to부정사로 표현하는 대표적인 5형식 동사. hope와 달리, 어떤 근거를 가지고 가능성이 높다고 예상하는 뉘앙스","d":30,"x":"f"},"f30_85":{"t":"be worth Ving","m":"~할 가치가 있다. worth 뒤에는 반드시 동명사(V-ing)가 와야 하는 관용 표현. to부정사는 올 수 없음","d":30,"x":"f"},"f30_86":{"t":"take A for B","m":"A를 B로 착각하다. A를 B로 잘못 판단했다는 의미의 관용 표현으로, A와 B 사이에 전치사 for가 필수적","d":30,"x":"f"},"f31_87":{"t":"enjoy","m":"~하는 것을 즐기다. 동명사(V-ing)를 목적어로 사용하는 대표 동사. to부정사는 올 수 없음","d":31,"x":"f"},"f31_88":{"t":"be known to","m":"~에게 알려져 있다. 정보가 알려진 대상(사람) 앞에 전치사 to를 사용. be known for (~로 유명하다), be known as(~로서 알려져 있다)와 구별 필요","d":31,"x":"f"},"f31_89":{"t":"result in","m":"~을 초래하다. 원인이 결과를 낳는다는 의미의 동사구. 원인을 나타내는 result from(~에서 비롯되다)과 구별해야 함.","d":31,"x":"f"},"f32_90":{"t":"expand / expend","m":"확장하다, 소모하다. 철자가 비슷해 혼동하기 쉬운 동사. expand는 크기나 범위를 '넓히는' 것, expend는 돈이나 에너지를 '쓰는' 것","d":32,"x":"f"},"f32_91":{"t":"warn A of B","m":"A에게 B를 경고하다. 경고 대상(A)과 위험 내용(B) 사이에 전치사 of 가 필요한 패턴. warn A that 절형태로도 자주 쓰임","d":32,"x":"f"},"f33_92":{"t":"promise","m":"약속하다. promise + 사람 + 사물(4형식), promise + to do, promise + that 절 등 다양한 구조로 사용 가능","d":33,"x":"f"},"f33_93":{"t":"be known for","m":"~로 유명하다. 명성의 '이유' 앞에 전치사 for를 사용. be known to (~에게 알려지다), be known as (~로서 알려지다)와 구별 필요","d":33,"x":"f"},"f33_94":{"t":"result from","m":"~에서 비롯되다. 결과 result from 원인의 구조로, 원인을 나타내는 동사구. 원인이 결과를 낳는 result in과 반드시 구별해야 함","d":33,"x":"f"},"f34_95":{"t":"bear","m":"참다, 견디다(can't bear), 낳다(be born), 명심하다(bear in mind)등 문맥에 따라 의미가 달라지는 핵심 다의어 동사. 불규칙 변화(bear-bore-born/borne)에 주의","d":34,"x":"f"},"f34_96":{"t":"stop","m":"~하는 것을 멈추다. 목적어로 **동명사(V-ing)**를 사용. stop to do(~하기 위해 멈추다)와 의미를 반드시 구별해야 함","d":34,"x":"f"},"f34_97":{"t":"apologize to","m":"~에게 사과하다. 사과 대상(사람) 앞에 to, 사과 이유 앞에 for를 사용하는 패턴 (apologize to 사람 / for 이유)","d":34,"x":"f"},"f35_98":{"t":"rise","m":"오르다, 뜨다. 목적어가 필요 없는 자동사. 불규칙 변화(rise-rose-risen)에 주의","d":35,"x":"f"},"f35_99":{"t":"raise","m":"올리다, 기르다, 모금하다. 목적어가 반드시 필요한 타동사. 규칙 변화(raise-raised-raised)이며, rise와 혼동하지 않도록 주의","d":35,"x":"f"},"f35_100":{"t":"put A into B","m":"A를 B에 넣다. 물리적인 이동을 나타내는 기본적인 동사구 패턴","d":35,"x":"f"},"f36_101":{"t":"account for","m":"설명하다, (비율을) 차지하다, 원인이 되다 등 문맥에 따라 의미가 달라지는 다의어 동사구이다.","d":36,"x":"f"},"f36_102":{"t":"be used to Ving","m":"~하는 데 익숙하다. '~하기 위해 사용되다'(be used to do)와 형태가 비슷하지만, to 뒤에 동명사(V-ing)를 사용하여 '익숙함'을 나타내는 관용 표현이다.","d":36,"x":"f"},"f36_103":{"t":"take into account","m":"~을 고려하다. take, into, account 세 단어가 하나의 동사처럼 쓰이며, consider와 유사하다.","d":36,"x":"f"},"f37_104":{"t":"inquire vs. require","m":"문의하다 / 요구하다. 철자가 비슷해 혼동하기 쉬운 동사이다. inquire는 정보를 '묻는 것', require는 필요에 의해 '요구하는 것'을 의미한다.","d":37,"x":"f"},"f37_105":{"t":"turn","m":"turn은 문맥과 뒤따르는 구조(형용사 보어 vs. 목적어 + into B) 에 따라 의미가 상태 변화와 완전한 전환으로 달라지므로, 문장 구조 신호를 주의 깊게 확인해야 한다.","d":37,"x":"f"},"f38_106":{"t":"read","m":"읽다(타동사), ~라고 쓰여 있다, ~하게 읽히다(자동사) 등 문맥에 따라 의미가 달라지는 다의어 동사이다.","d":38,"x":"f"},"f38_107":{"t":"reach","m":"~에 도착하다. '~에'라는 의미가 있지만 at, to 같은 전치사 없이 목적어를 바로 사용하는 타동사이다.","d":38,"x":"f"},"f38_108":{"t":"add to","m":"~을 더하다, 늘리다. 기존에 있던 것에 무언가를 추가하여 '정도'를 심화시키는 뉘앙스의 동사구이다.","d":38,"x":"f"},"f39_109":{"t":"demand","m":"요구하다. demand + to do, demand + that 절 등 강한 요구를 나타내며, 4형식으로는 쓸 수 없는 동사이다.","d":39,"x":"f"},"f39_110":{"t":"be known as","m":"~로서 알려져 있다. 주어의 '자격'이나 '별칭' 앞에 as를 사용한다. be known for (~로 유명하다) 와 구별할 필요가 있다.","d":39,"x":"f"},"f39_111":{"t":"go","m":"~한 상태가 되다. 2형식 동사로 쓰여 주어의 상태 변화를 나타낸다. 주로 부정적인 변화 (go bad, go dead)에 사용된다.","d":39,"x":"f"},"f40_112":{"t":"stand","m":"서다, ~을 참다, 견디다(can't stand). 문맥에 따라 의미가 달라지는 다의어이며, '참다'의 의미일 때 목적어로 동명사(V-ing)를 사용한다.","d":40,"x":"f"},"f40_113":{"t":"take place","m":"(계획된 행사가) 열리다, 개최되다. happen(우연히 발생하다)과 달리, 미리 계획된 사건에 사용되는 동사구이다.","d":40,"x":"f"},"f40_114":{"t":"divide A into B","m":"A를 B로 나누다. 나누는 대상(A)과 결과물(B) 사이에 전치사 into가 필요한 패턴이다.","d":40,"x":"f"},"f41_115":{"t":"cost","m":"~에게 ...을 잃게 하다. cost + 사람 + 사물(4형식) 구조로 쓰여, 주로 기회나 대가와 같은 추상적인 것을 잃게 만들었다는 부정적 뉘앙스를 가진다.","d":41,"x":"f"},"f41_116":{"t":"fix","m":"① 고치다, 해결하다 ② 고정시키다. 문맥에 따라 의미가 달라지는 다의어이다.","d":41,"x":"f"},"f41_117":{"t":"get rid of","m":"~을 제거하다, 없애다. 세 단어가 하나의 동사처럼 쓰이는 동사구이다.","d":41,"x":"f"},"f42_118":{"t":"command vs. commend","m":"명령하다 / 칭찬하다. 철자가 비슷해 혼동하기 쉬운 동사이다. command는 권위를 가지고 지시하는 것, commend는 공식적으로 칭찬하는 것을 의미한다.","d":42,"x":"f"},"f42_119":{"t":"depend on","m":"~에 의존하다, ~에 달려 있다. 의존하는 대상 앞에 전치사 on이 반드시 필요한 동사구이다. rely on과 유사하다.","d":42,"x":"f"},"f43_120":{"t":"appreciate","m":"① ~의 진가를 알아보다 ② 고마워하다. 문맥에 따라 의미가 달라지는 다의어이다. ①은 가치를 이해하는 것, ②는 친절에 감사하는 것을 의미한다.","d":43,"x":"f"},"f43_121":{"t":"be composed of","m":"~으로 구성되다. consist of 와 유사하며, 구성 요소 앞에 전치사 of를 사용하는 수동태 관용 표현이다.","d":43,"x":"f"},"f43_122":{"t":"confuse A with B","m":"A를 B와 혼동하다. 혼동하는 두 대상 사이에 전치사 with가 필요한 패턴 동사이다.","d":43,"x":"f"},"f44_123":{"t":"enter","m":"~에 들어가다. '~에'라는 의미가 있지만 into 같은 전치사 없이 목적어를 바로 사용하는 타동사이다.","d":44,"x":"f"},"f44_124":{"t":"take advantage of","m":"~을 (유리하게) 이용하다. 세 단어가 하나의 동사처럼 쓰이는 동사구로, 긍정적으로는 '활용하다', 부정적으로는 '악용하다'는 뉘앙스를 가진다.","d":44,"x":"f"},"f44_125":{"t":"blame A for B","m":"B에 대해 A를 탓하다. 비난의 대상(A)과 이유(B) 사이에 전치사 for가 필요한 패턴 동사이다.","d":44,"x":"f"},"f45_126":{"t":"persuade","m":"~가 ...하도록 설득하다. 목적어의 행동을 to부정사로 표현하는 대표적인 5형식 동사이다.","d":45,"x":"f"},"f45_127":{"t":"look forward to Ving","m":"~하는 것을 고대하다. to가 전치사이므로 뒤에 반드시 동명사(V-ing)를 사용하는 관용 표현이다.","d":45,"x":"f"},"f45_128":{"t":"keep up with","m":"~을 따라잡다, 뒤처지지 않다. 세 단어가 하나의 동사처럼 쓰이는 동사구이다.","d":45,"x":"f"},"f46_129":{"t":"transfer / transform","m":"옮기다 / 완전히 바꾸다. 철자가 비슷해 혼동하기 쉬운 동사이다. transfer는 위치 이동, transform은 형태나 성질의 완전한 변화를 의미한다.","d":46,"x":"f"},"f46_130":{"t":"imagine","m":"상상하다. 목적어로 동명사(V-ing)를 사용하거나 imagine that 절, imagine + 목적어 + 목적격 보어(5형식) 등 다양한 구조로 사용된다.","d":46,"x":"f"},"f47_131":{"t":"charge","m":"요금을 청구하다, 기소하다, 충전하다 등 문맥에 따라 의미가 달라지는 다의어이다.","d":47,"x":"f"},"f47_132":{"t":"put up with","m":"~을 참다, 견디다. 세 단어가 하나의 동사처럼 쓰이는 동사구로, tolerate와 유사하다.","d":47,"x":"f"},"f47_133":{"t":"prevent A from B","m":"A가 B하는 것을 막다. 대상(A)과 막는 행위(B) 사이에 전치사 from이 필요한 패턴 동사이다.","d":47,"x":"f"},"f48_134":{"t":"attend","m":"참석하다, 돌보다, 집중하다(attend to), 수반하다,동반하다 등 문맥에 따라 의미가 달라지는 다의어이다.","d":48,"x":"f"},"f48_135":{"t":"be made of","m":"~으로 만들어지다. 재료의 물리적 성질이 유지될 때 사용한다. 화학적 변화가 일어난 경우 be made from을 사용한다.","d":48,"x":"f"},"f48_136":{"t":"replace A with B","m":"A를 B로 교체하다. 교체 대상(A)과 새로운 것(B) 사이에 전치사 with가 필요한 패턴 동사이다.","d":48,"x":"f"},"f49_137":{"t":"approach","m":"~에 접근하다, 다가가다. '~에'라는 의미가 있지만 to 같은 전치사 없이 목적어를 바로 사용하는 타동사이다.","d":49,"x":"f"},"f49_138":{"t":"be made from","m":"~으로 만들어지다. 재료가 화학적 변화를 거쳐 원래의 성질을 잃었을 때 사용한다. 물리적 성질이 유지되는 be made of와 구별할 필요가 있다.","d":49,"x":"f"},"f49_139":{"t":"run out of","m":"~을 다 써버리다. 세 단어가 하나의 동사처럼 쓰이며, 보유하고 있던 것이 고갈됨을 의미하는 동사구이다.","d":49,"x":"f"},"f50_140":{"t":"propose","m":"제안하다. 목적어로 동명사(V-ing)나 that절을 사용하며, 4형식 구조로는 쓸 수 없는 동사이다.","d":50,"x":"f"},"f50_141":{"t":"show off","m":"자랑하다, 뽐내다. 두 단어가 하나의 동사처럼 쓰이는 동사구이다.","d":50,"x":"f"},"f50_142":{"t":"provide A with B","m":"A에게 B를 제공하다. 제공받는 사람(A)과 제공하는 물건(B) 사이에 전치사 with가 필요한 패턴 동사이다.","d":50,"x":"f"},"f51_143":{"t":"adapt vs. adopt","m":"적응하다 / 입양하다, 채택하다. 철자가 비슷해 혼동하기 쉬운 동사이다. adapt는 환경에 '맞추는 것', adopt는 새로운 것을 '받아들이는 것'을 의미한다.","d":51,"x":"f"},"f51_144":{"t":"present","m":"주다, 수여하다(4형식 불가), 발표하다, (어려움을) 안겨주다 등 문맥에 따라 의미가 달라지는 다의어이다. present A with B(A에게 B를 주다) 패턴으로 자주 사용된다.","d":51,"x":"f"},"f52_145":{"t":"fit","m":"(치수·모양이) 맞다(자동사), (상황·장소에) 어울리다(자동사), ~에 맞추다(타동사) 등 문맥에 따라 의미가 달라지는 다의어이다.","d":52,"x":"f"},"f52_146":{"t":"take charge of","m":"~을 책임지다, 맡다. 세 단어가 하나의 동사처럼 쓰이는 동사구이다.","d":52,"x":"f"},"f52_147":{"t":"distinguish A from B","m":"A와 B를 구별하다. 구별되는 두 대상 사이에 from을 사용하여 A와 B를 분리하는 패턴 동사이다.","d":52,"x":"f"},"f53_148":{"t":"admit","m":"인정하다. 목적어로 동명사(V-ing)를 사용하며, to부정사는 쓰지 않는다. admit that 절 형태로도 사용 가능하다.","d":53,"x":"f"},"f53_149":{"t":"be based on","m":"~에 근거하다, 기반을 두다. 주어의 근거나 출처를 나타내는 관용 표현.","d":53,"x":"f"},"f53_150":{"t":"mean","m":"① ~을 의미하다(3형식) ② ~할 의도이다(mean to do). 문맥에 따라 의미가 달라지는 다의어.","d":53,"x":"f"},"f54_151":{"t":"become","m":"① ~가 되다(2형식) ② ~에 어울리다(3형식, 예: Bright colors become her). 형식에 따라 의미가 달라지는 다의어이다.","d":54,"x":"f"},"f54_152":{"t":"contribute to Ving","m":"~하는 데 기여하다. to가 전치사이므로뒤에 반드시 동명사(V-ing)가 오는 관용 표현이다.","d":54,"x":"f"},"f54_153":{"t":"separate A from B","m":"A를 B와 분리하다. 분리되는 두 대상 사이에 전치사 from이 필요한 패턴 동사이다.","d":54,"x":"f"},"f55_154":{"t":"deny","m":"부인하다. 목적어로 **동명사(V-ing)**를 사용하며, to부정사는 쓰지 않는다. deny that 절 형태로도 사용 가능하다.","d":55,"x":"f"},"f55_155":{"t":"be contented with","m":"~에 만족하다. be satisfied with와 유사하며, 감정의 원인 앞에 전치사 with를 사용한다.","d":55,"x":"f"},"f55_156":{"t":"refer","m":"① ~을 언급하다(refer to) ② ~을 알아보도록 하다(refer A to B) ③ ~을 나타내다. 문맥에 따라 의미가 달라지는 다의어이다.","d":55,"x":"f"},"f56_157":{"t":"access vs. assess","m":"접근하다 / 평가하다. 발음과 철자가 비슷해 혼동하기 쉬운 동사이다. access는 '들어가거나 이용하는 것', assess는 '가치를 판단하는 것'을 의미한다.","d":56,"x":"f"},"f56_158":{"t":"exchange A for B","m":"A를 B로 교환하다. 교환하는 두 대상 사이에 전치사 for가 필요한 패턴 동사이다.","d":56,"x":"f"},"f57_159":{"t":"pay","m":"① (돈을) 지불하다 ② 이득이 되다, 보람이 있다. 문맥에 따라 의미가 달라지는 다의어이다. ②번 의미는 주로 부정문(won't pay)이나 in the long run과 함께 사용된다.","d":57,"x":"f"},"f57_160":{"t":"substitute for","m":"~을 대신하다, 대타로 나서다. 두 단어가 하나의 동사처럼 쓰이는 동사구로, 대신하는 대상 앞에 전치사 for가 필요하다.","d":57,"x":"f"},"f57_161":{"t":"quit Ving","m":"~하는 것을 그만두다. 목적어로 동명사(V-ing)를 사용하는 대표 동사이다.","d":57,"x":"f"},"f58_162":{"t":"object to","m":"~에 반대하다. to가 전치사이므로 뒤에 명사나 동명사(V-ing)가 오는 관용 표현이다.","d":58,"x":"f"},"f58_163":{"t":"prefer A to B","m":"B보다 A를 선호하다. 비교 대상 사이에 than이 아닌 전치사 to를 사용하여 선호를 나타내는 패턴 동사이다.","d":58,"x":"f"},"f58_164":{"t":"settle","m":"① (문제를) 해결하다 ② (마음을) 진정시키다 ③ 정착하다. 문맥에 따라 의미가 달라지는 다의어이다.","d":58,"x":"f"},"f59_165":{"t":"give up Ving","m":"~하는 것을 포기하다. 목적어로 동명사(V-ing)를 사용하는 대표 동사구이다.","d":59,"x":"f"},"f59_166":{"t":"survive","m":"살아남다. 전치사 없이 목적어를 바로 취하는 타동사(survive the winter) 또는 목적어 없이 쓰이는 자동사(managed to survive)로 모두 사용 가능하다.","d":59,"x":"f"},"f59_167":{"t":"save","m":"① (노력을) 덜어주다(4형식) ② (자리를) 맡아주다(4형식) ③ 구하다. 문맥에 따라 의미가 달라지는 다의어이다.","d":59,"x":"f"},"f60_168":{"t":"confirm vs. conform","m":"확인하다, 확정하다 / (규칙 등을) 따르다, 순응하다. 철자가 비슷해 혼동하기 쉬운 동사이다. confirm은 사실을 '확인', conform은 규칙에 '순응'하는 것이다.","d":60,"x":"f"},"f60_169":{"t":"postpone","m":"연기하다, 미루다. 목적어로 동명사(V-ing)를 사용하며, to부정사는 쓰지 않는다. put off와 유사하다.","d":60,"x":"f"},"f61_170":{"t":"change A into B","m":"A를 B로 바꾸다. A가 B로 변화할 때 전치사 into가 필요하다.","d":61,"x":"f"},"f61_171":{"t":"long for","m":"~을 갈망하다, 그리워하다. 간절한 바람이나 그리움을 나타내는 동사구이다.","d":61,"x":"f"},"f61_172":{"t":"hold","m":"① (행사 등을) 열다 ② (무게를) 지탱하다 ③ (감정 등을) 참다. 문맥에 따라 의미가 달라지는 다의어이다.","d":61,"x":"f"},"f62_173":{"t":"leap vs. reap","m":"껑충 뛰다 / 거두다, 수확하다. 발음과 철자가 비슷해 혼동하기 쉬운 동사이다. leap는 도약, reap은 노력의 결과를 얻는 것을 의미한다.","d":62,"x":"f"},"f62_174":{"t":"treat","m":"① 대하다, 여기다 ② 치료하다 ③ 대접하다. 문맥에 따라 의미가 달라지는 핵심 다의어이다.","d":62,"x":"f"},"f63_175":{"t":"inhibit vs. inhabit","m":"억제하다 / 서식하다. 발음과 철자가 비슷해 혼동하기 쉬운 동사이다. inhibit는 방해, inhabit는 거주를 의미한다.","d":63,"x":"f"},"f63_176":{"t":"relate A to B","m":"A를 B와 관련시키다. 두 대상(A와 B) 사이에 논리적 연결고리를 만들 때 전치사 to가 필요한 패턴 동사이다.","d":63,"x":"f"},"f64_177":{"t":"introduce","m":"소개하다. 4형식으로 쓸 수 없으며, 소개하는 내용 뒤에 듣는 사람을 쓸 때는 to가 필요한 3형식 동사이다.","d":64,"x":"f"},"f64_178":{"t":"adjust to Ving","m":"~하는 데 적응하다. to가 전치사이므로 뒤에 반드시 동명사(V-ing)를 사용하는 관용 표현이다.","d":64,"x":"f"},"f64_179":{"t":"give off","m":"(빛·냄새·열 등을) 내다, 발산하다. 두 단어가 하나의 동사처럼 쓰이는 동사구이다.","d":64,"x":"f"},"f11_180":{"t":"consist of","m":"~로 구성되다. 항상 of와 함께 쓰며 수동태로 쓰지 않음 (be consisted of X)","d":11,"x":"f"},"m1_0":{"t":"platform","p":"명","k":"플랫폼","d":1,"x":"m"},"m1_1":{"t":"distracted","p":"형","k":"주의가 산만해진","d":1,"x":"m"},"m1_2":{"t":"lack","p":"동/명","k":"부족하다; 부족","d":1,"x":"m"},"m1_3":{"t":"topic sentence","p":"구","k":"주제문","d":1,"x":"m"},"m1_4":{"t":"non-profit","p":"형","k":"비영리의","d":1,"x":"m"},"m1_5":{"t":"emotional care","p":"구","k":"정서적 돌봄","d":1,"x":"m"},"m1_6":{"t":"contain","p":"동","k":"포함하다","d":1,"x":"m"},"m1_7":{   else{h+='<div class="card" style="padding:4px 14px">';
   ids.sort(function(a,b){return o.w[b].add-o.w[a].add}).forEach(function(id){var w=o.w[id],e=WD[id];
    h+='<div class="row"><div class="wt">'+wbEsc(e.t)+wbSurf(id,w.s,w.ix)+(e.x==='m'?' <span class="wp">('+wbEsc(e.p)+')</span>':'')+'</div><div class="wm">'+wbEsc(e.x==='m'?e.k:e.m)+'</div><div class="ws">'+sentH(w.s,w.ix)+'</div><div class="wf"><span>Day '+e.d+' &middot; 다음 복습 '+dstr(w.due)+(w.miss?' &middot; 틀린 횟수 '+w.miss:'')+'</span><button class="rm" data-rm="'+id+'">빼기</button></div></div>'});
   h+='</div>'}
 }else{
  if(!qs.length)h+='<div class="card empty">틀린 문제가 없습니다. 누적 복습에서 틀린 문제가 여기에 모입니다.</div>';
  else{h+='<div class="card" style="padding:4px 14px">';
   qs.sort(function(a,b){return o.q[b].add-o.q[a].add}).forEach(function(id){var e=o.q[id],q=e.q;
    h+='<div class="row"><div class="wt" style="font-size:16px">Day '+e.k.split('-')[0]+' &middot; '+wbEsc(TYN[q.t]||'문제')+(q.verb?' <span class="wp">'+wbEsc(q.verb)+'</span>':'')+'</div><div class="ws">'+wbEsc((q.tok||[]).join(' '))+'</div><div class="wf"><span>다음 복습 '+dstr(e.due)+' &middot; 틀린 횟수 '+(e.miss||1)+'</span><button class="rm" data-rq="'+id+'">빼기</button></div></div>'});
   h+='</div>'}
 }
 $.innerHTML=h;window.scrollTo(0,0);
 var g=document.getElementById('go');if(g)g.onclick=function(){startRev(false)};
 var a=document.getElementById('all');if(a)a.onclick=function(){startRev(true)};
 $.querySelectorAll('.seg button').forEach(function(b){b.onclick=function(){TAB=b.dataset.t;home()}});
 $.querySelectorAll('[data-rm]').forEach(function(b){b.onclick=function(){var o=wbLoad();delete o.w[b.dataset.rm];wbSave(o);home()}});
 $.querySelectorAll('[data-rq]').forEach(function(b){b.onclick=function(){var o=wbLoad();delete o.q[b.dataset.rq];wbSave(o);home()}});
}
function startRev(all){var o=wbLoad(),now=Date.now(),ids=Object.keys(o.w).filter(function(id){return all||o.w[id].due<=now});ids=shuf(ids).slice(0,20);if(!ids.length){home();return}
 SS={ids:ids,i:0,ok:0,n:ids.length,bad:[],noSched:!!all,retryAt:-1};ask()}
function distract(id){var e=WD[id],ph=(e.p||'').split('/')[0],tk=function(s){return s.split(/[,;\s()~]+/).filter(function(x){return x.length>1})},mine=tk(e.k);
 var pool=Object.keys(WD).filter(function(k){var d=WD[k];if(d.x!=='m'||k===id||d.k===e.k)return false;var t=tk(d.k);return !t.some(function(x){return mine.indexOf(x)>=0})});
 var same=shuf(pool.filter(function(k){return (WD[k].p||'').split('/')[0]===ph})),rest=shuf(pool.filter(function(k){return (WD[k].p||'').split('/')[0]!==ph}));
 var out=[],seen={};same.concat(rest).forEach(function(k){if(out.length<3&&!seen[WD[k].k]){seen[WD[k].k]=1;out.push(WD[k].k)}});return out}
function ask(){
 var o=wbLoad(),id=SS.ids[SS.i],e=WD[id],w=o.w[id];
 if(!w){SS.i++;if(SS.i<SS.ids.length)ask();else endRev();return}
 var h='<div class="bar"><i style="width:'+(SS.i/SS.ids.length*100)+'%"></i></div><div class="card"><p class="q">'+(SS.i+1)+' / '+SS.ids.length+(SS.retryAt>=0&&SS.i>=SS.retryAt?' &middot; 한 번 더':'')+'</p>';
 if(e.x==='m'){
  h+='<div class="big">'+wbEsc(e.t)+'</div><div class="sent">'+sentH(w.s,w.ix)+'</div><p class="q">뜻을 고르세요.</p>';
  var opts=shuf([e.k].concat(distract(id)));
  h+=opts.map(function(x){return '<button class="opt" data-v="'+wbEsc(x)+'">'+wbEsc(x)+'</button>'}).join('')+'<div id="fb"></div></div>';
  $.innerHTML=h;window.scrollTo(0,0);
  $.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){
   var ok=b.dataset.v===e.k;$.querySelectorAll('.opt').forEach(function(x){x.disabled=true;if(x.dataset.v===e.k)x.classList.add('ok')});if(!ok)b.classList.add('no');
   rec(id,ok);document.getElementById('fb').innerHTML='<div class="msg '+(ok?'g':'')+'">'+(ok?'맞았습니다. ':'아쉽습니다. ')+wbInfo(id)+'</div><button class="btn" id="nx">'+(SS.i<SS.ids.length-1?'다음':'결과 보기')+'</button>';
   document.getElementById('nx').onclick=nxt}})
 }else{
  h+='<div class="big">'+wbEsc(e.t)+'</div><div class="sent">'+sentH(w.s,w.ix)+'</div><p class="q">이 말의 쓰임이 기억나나요?</p><button class="btn g" id="sh">책 메모 보기</button><div id="fb"></div></div>';
  $.innerHTML=h;window.scrollTo(0,0);
  document.getElementById('sh').onclick=function(){document.getElementById('sh').style.display='none';
   document.getElementById('fb').innerHTML='<div class="memo">'+wbEsc(e.m)+'</div><div class="two"><button class="btn g" id="no">헷갈린다</button><button class="btn" id="yes">알았다</button></div>';
   document.getElementById('yes').onclick=function(){rec(id,true);nxt()};document.getElementById('no').onclick=function(){rec(id,false);nxt()}}
 }
}
function rec(id,ok){if(ok)SS.ok++;else if(SS.bad.indexOf(id)<0)SS.bad.push(id);
 if(SS.noSched||(SS.retryAt>=0&&SS.i>=SS.retryAt))return;
 var o=wbLoad(),w=o.w[id];if(!w)return;
 if(ok){w.box=Math.min((w.box||0)+1,WINT.length-1);w.due=wbDue(w.box)}else{w.box=0;w.miss=(w.miss||0)+1;w.due=wbDue(0)}
 wbSave(o)}
function nxt(){SS.i++;
 if(SS.i<SS.ids.length){ask();return}
 if(SS.retryAt<0&&SS.bad.length&&!SS.noSched){SS.retryAt=SS.ids.length;SS.ids=SS.ids.concat(SS.bad);SS.bad=[];ask();return}
 endRev()}
function endRev(){var h='<div class="card"><p class="q">복습 완료</p><div class="big">'+SS.ok+' / '+SS.ids.length+'</div>';
 h+='<div class="small">틀린 단어는 내일 다시 나오고, 맞힌 단어는 점점 긴 간격으로 나옵니다.</div>';
 if(SS.bad.length){h+='<div class="memo" style="margin-top:12px"><b>마지막에도 헷갈린 단어</b>'+SS.bad.map(function(id){return '<div style="margin-top:6px">'+wbInfo(id)+'</div>'}).join('')+'</div>'}
 h+='<button class="btn" id="bk">내 단어장으로</button></div>';$.innerHTML=h;window.scrollTo(0,0);document.getElementById('bk').onclick=home}
(function(){var r=document.referrer||'';if(/xray|review/.test(r)){var b=document.getElementById('bk0');b.style.display='inline-block';b.onclick=function(e){e.preventDefault();history.back()}}})();
home();
</script></body></html>
