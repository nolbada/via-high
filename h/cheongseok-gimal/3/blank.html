.sent{display:block;margin:0 0 7px}.sent .kr{display:none;color:var(--sub);font-size:14.5px;line-height:1.6;margin:1px 0 3px;font-weight:400}body.kon .sent:not(.blk) .kr,.sent.open:not(.blk) .kr{display:block}.sent:not(.blk){cursor:pointer}#kt{margin-left:auto}.bar #rs{margin-left:0}

<link rel="icon" type="image/svg+xml" href="../icon.svg"><link rel="apple-touch-icon" href="../icon-180.png"><meta name="apple-mobile-web-app-title" content="청석고정답"></head><body><div class="wrap"><div class="top"><a class="back" href="../index.html">← 청석고 정답 목록</a></div><h1>3과 A Timeless Symbol of Korea · 빈칸 추론 연습 (매번 다른 문제)</h1><p class="lede">매번 바뀌어요. 같은 지문이라도 빈칸 자리가 달라지고 보기 순서도 매번 섞여요. 한 번 나온 문제는 한 바퀴를 다 돌 때까지 다시 나오지 않아요.</p><div class="bar"><span class="prog" id="prog"></span><button id="kt" type="button">한글 해석 보기</button><button id="rs" type="button">처음부터 다시</button></div><div id="stage"></div><div class="foot">비타민 영어클리닉 · 청석고1 공통영어2 3과</div></div>
<script>
var D={"segs": [{"id": "A", "title": "① 책이 된 호랑이 이야기", "sents": ["Children around the world learned a bit more about Korean culture when writer Tae Keller published her book When You Trap a Tiger in 2020.", "Its story starts with a girl who meets a tiger.", "Her grandmother knows the tiger as well.", "When her grandmother gets sick, the girl makes a deal with the tiger.", "Keller’s inspiration for her award-winning book was an old folktale that her halmoni (grandmother) used to tell her.", "It is called “The Sun and the Moon,” and it is about a brother, a sister, and a tiger.", "Keller wanted to revive the public’s interest in tigers by writing her own book."], "theme": "Tae Keller는 할머니가 들려주던 옛 설화 '해님 달님'에서 영감을 받아 호랑이 책을 썼고, 그 책으로 호랑이에 대한 사람들의 흥미를 되살리고 싶어 했어요.", "kos": ["전 세계 아이들은 작가 Tae Keller가 2020년에 그녀의 책 When You Trap a Tiger를 출판했을 때 한국 문화에 대해 조금 더 알게 되었다.", "그것의 이야기는 호랑이를 만난 한 소녀로부터 시작된다.", "그녀의 할머니 역시 그 호랑이를 알고 있다.", "그녀의 할머니가 아프게 되자, 그 소녀는 그 호랑이와 거래를 한다.", "Keller의 수상 도서에 영감을 준 것은 그녀의 할머니가 그녀에게 이야기해 주던 옛 설화였다.", "그것은 ‘해님 달님’이라고 불리는데, 오빠와 여동생, 그리고 호랑이에 관한 내용이다.", "Keller는 그녀 자신의 책을 씀으로써 호랑이에 대한 대중의 흥미를 되살리고 싶어 했다."]}, {"id": "B", "title": "② 한국 문화 속 호랑이 (1)", "sents": ["How is the tiger related to Korean culture?", "Long ago, tigers were so abundant in Korea that people often called the country the “Land of Tigers.”", "It is estimated that tigers lived in Korea for at least 100,000 years.", "The first appearance of a tiger in Korean culture dates back to the rock art of the Bronze Age.", "It depicts people hunting various animals, including tigers."], "theme": "옛날 한국은 '호랑이의 땅'이라 불릴 만큼 호랑이가 많았고, 호랑이는 청동기 시대 바위 그림에서부터 등장해요.", "kos": ["호랑이는 한국의 문화와 어떻게 연관되는가?", "오래 전, 한국에는 호랑이가 매우 많아서 사람들은 종종 그 나라를 ‘호랑이의 땅’이라고 불렀다.", "호랑이는 한국에 적어도 십만 년을 살았다고 추정된다.", "한국 문화에서 호랑이의 첫 번째 등장은 청동기 시대의 바위 그림으로 거슬러 올라간다.", "그것은 호랑이를 포함하여 다양한 동물을 사냥하는 사람들을 묘사한다."]}, {"id": "C", "title": "② 한국 문화 속 호랑이 (2)", "sents": ["Since then, tigers have appeared in many aspects of Korean culture, from legends to art and musical instruments.", "Some of you may have heard Korean folktales featuring tigers.", "In fact, approximately forty percent of Korean folktales about animals include a tiger.", "Tigers in Korean folktales are sometimes shown in a positive light and sometimes as foolish creatures.", "For example, in one story, a tiger helps a human become rich after the human saves the tiger’s life."], "theme": "호랑이는 전설·미술·악기까지 한국 문화 곳곳에 나오고, 동물 설화의 약 40%에 등장하며 좋게도, 어리석게도 그려져요.", "kos": ["그때부터, 호랑이는 전설에서부터 미술과 악기에 이르기까지 한국 문화의 많은 측면에 등장해 왔다.", "여러분 중 일부는 호랑이가 등장하는 한국 설화를 들어 봤을지도 모른다.", "사실, 동물에 대한 한국 설화의 약 40%가 호랑이를 포함한다.", "한국 설화에서 호랑이는 때로는 긍정적인 시각, 그리고 때로는 어리석은 존재로 보여진다.", "예를 들어, 한 이야기에서, 호랑이는 한 인간이 그 호랑이의 생명을 구해 준 이후 그가 부유해지도록 돕는다."]}, {"id": "D", "title": "③ 엇갈린 감정과 되살아난 상징 (1)", "sents": ["In another story, a tiger hears a mother tell her crying baby, “Don’t cry. Here’s a gotgam.”", "Because the baby stops crying, the tiger mistakenly thinks the gotgam is a very scary creature and runs away.", "It seems that people at the time had conflicting feelings about tigers.", "They had respect for tigers’ power and courage.", "However, they were also scared of tigers because being injured or even killed by tigers was common in the past.", "They may have made tigers into foolish characters in order to be less scared of them."], "theme": "곶감 이야기처럼 호랑이는 어리석게도 그려져요. 사람들은 호랑이의 힘과 용기를 존경하면서도 무서워했고, 덜 무서워하려고 어리석은 캐릭터로 만들었을지도 몰라요.", "kos": ["또 다른 이야기에서, 호랑이는 한 어머니가 울고 있는 자신의 아기에게 “울지 마. 여기 곶감이 있단다.”라고 말하는 것을 듣는다.", "그 아기가 울기를 멈추기 때문에, 호랑이는 그 곶감이 매우 무서운 생명체라고 잘못 생각하고 달아난다.", "그 당시 사람들은 호랑이에 대해 상충되는 감정을 지니고 있었던 것으로 보인다.", "그들은 호랑이의 힘과 용기에 대한 존경심이 있었다.", "그러나, 과거에는 호랑이에게 상처를 입거나 심지어 죽임을 당하는 일이 흔했기 때문에 그들은 호랑이를 무서워하기도 했다.", "그들은 호랑이를 덜 무서워하기 위해 호랑이를 어리석은 캐릭터로 만들었을지도 모른다."]}, {"id": "E", "title": "③ 엇갈린 감정과 되살아난 상징 (2)", "sents": ["Tigers in Korea faced a decline in population due to hunting during the Joseon period and nearly went extinct during the Japanese colonial era.", "With the disappearance of tigers in Korea, their use as a symbol of the nation faded away.", "However, their symbolism was revived in modern times through their selection as the mascot for both Olympics hosted by Korea.", "Hodori was the mascot for the Seoul Summer Olympics in 1988.", "It was a Siberian tiger, which represents courage.", "The PyeongChang Winter Olympics in 2018 created Soohorang, a white tiger, as its mascot.", "White tigers are considered sacred guardians."], "theme": "사냥으로 호랑이가 거의 사라지면서 나라의 상징이라는 의미도 희미해졌지만, 두 올림픽의 마스코트(호돌이·수호랑)로 다시 살아났어요.", "kos": ["한국의 호랑이들은 조선 시대 동안 사냥 때문에 개체 수 감소에 직면했고, 일제 강점기 동안 거의 멸종에 이르렀다.", "한국에서 호랑이가 사라지면서, 국가의 상징으로서의 그들의 용도도 희미해졌다.", "그러나, 한국에서 열린 두 올림픽의 마스코트로 선정되면서 그들의 상징성이 현대에 되살아났다.", "호돌이는 1988년 서울 하계 올림픽의 마스코트였다.", "그것은 시베리안 호랑이였는데, 그들은 용기를 상징한다.", "2018년 평창 동계 올림픽은 백호인 수호랑을 그것의 마스코트로 만들었다.", "백호는 신성한 수호자로 여겨진다."]}, {"id": "F", "title": "④ 오늘날의 호랑이", "sents": ["Tigers are also mentioned in the K-pop song “Tiger is Coming.”", "One verse of the song is a reinterpreted version of “Sugungga,” which is a traditional Korean song.", "The song drew worldwide attention, and its video was viewed millions of times online.", "These days, only a few wild tigers have been reported to be living in North Korea.", "However, the history, stories, and cultural meaning of tigers still have a place among modern Korean people.", "Who can deny that the tiger is a symbol of Korea?", "In 2021, the National Folk Museum of Korea published a book that collects all the stories about tigers in Korea.", "How about looking for tigers around you now?"], "theme": "노래 '범 내려온다'처럼 호랑이는 지금도 우리 곁에 있어요. 야생 호랑이는 거의 없지만, 호랑이의 역사·이야기·의미는 여전히 한국 사람들 사이에 살아 있어요.", "kos": ["호랑이는 또한 한국 대중가요 ‘범 내려온다’에도 언급된다.", "이 노래의 한 구절(가사)은 ‘수궁가’의 재해석판인데, 수궁가는 한국의 전통 가곡이다.", "그 노래는 세계적인 주목을 끌었고, 그것의 영상은 온라인에서 수백만 회 시청되었다.", "오늘날, 단지 소수의 야생 호랑이만이 북한에 살고 있다고 보고되어 왔다.", "그러나, 호랑이의 역사, 이야기, 그리고 문화적 의미는 현대 한국 사람들 사이에 여전히 자리하고 있다.", "호랑이가 한국의 상징이라는 점을 누가 부정할 수 있을까?", "2021년에, 국립 민속 박물관은 한국의 호랑이에 관한 모든 이야기를 모은 책을 출판했다.", "이제 여러분 주변에서 호랑이를 찾아보는 것은 어떨까?"]}], "items": [{"seg": 0, "si": 0, "ans": "learned a bit more about Korean culture", "ako": "한국 문화에 대해 조금 더 알게 되었다", "ds": [["forgot a lot about Korean culture", "한국 문화에 대해 많은 것을 잊어버렸다", ""], ["learned how to hunt tigers", "호랑이를 사냥하는 법을 배웠다", ""], ["learned a bit more about Japanese culture", "일본 문화에 대해 조금 더 알게 되었다", ""], ["lost interest in Korean folktales", "한국 설화에 대한 흥미를 잃었다", ""]], "ko": "전 세계 아이들은 작가 Tae Keller가 2020년에 그녀의 책 When You Trap a Tiger를 출판했을 때 한국 문화에 대해 조금 더 알게 되었다.", "n": 1}, {"seg": 0, "si": 1, "ans": "a girl who meets a tiger", "ako": "호랑이를 만난 한 소녀", "ds": [["a tiger who meets a king", "왕을 만나는 호랑이", ""], ["a girl who hunts a tiger", "호랑이를 사냥하는 한 소녀", ""], ["a boy who fears the moon", "달을 무서워하는 한 소년", ""], ["a grandmother who writes a book", "책을 쓰는 한 할머니", ""]], "ko": "그것의 이야기는 호랑이를 만난 한 소녀로부터 시작된다.", "n": 2}, {"seg": 0, "si": 3, "ans": "makes a deal with the tiger", "ako": "그 호랑이와 거래를 한다", "ds": [["runs away from the tiger", "그 호랑이에게서 달아난다", ""], ["makes a deal with a dragon", "용과 거래를 한다", ""], ["tells the tiger to leave her alone", "그 호랑이에게 자신을 내버려 두라고 말한다", ""], ["forgets about the tiger", "그 호랑이에 대해 잊어버린다", ""]], "ko": "그녀의 할머니가 아프게 되자, 그 소녀는 그 호랑이와 거래를 한다.", "n": 4}, {"seg": 0, "si": 4, "ans": "an old folktale", "ako": "옛 설화", "ds": [["a modern novel", "현대 소설", ""], ["a history textbook", "역사 교과서", ""], ["a news report", "뉴스 보도", ""], ["a children’s song", "동요", ""]], "ko": "Keller의 수상 도서에 영감을 준 것은 그녀의 할머니가 그녀에게 이야기해 주던 옛 설화였다.", "n": 5}, {"seg": 0, "si": 5, "ans": "a brother, a sister, and a tiger", "ako": "오빠와 여동생, 그리고 호랑이", "ds": [["a prince, a princess, and a bear", "왕자와 공주, 그리고 곰", ""], ["a king, a queen, and a dragon", "왕과 왕비, 그리고 용", ""], ["a mother, a baby, and a gotgam", "어머니와 아기, 그리고 곶감", ""], ["a rabbit, a turtle, and a dragon king", "토끼와 거북이, 그리고 용왕", ""]], "ko": "그것은 ‘해님 달님’이라고 불리는데, 오빠와 여동생, 그리고 호랑이에 관한 내용이다.", "n": 6}, {"seg": 0, "si": 6, "ans": "revive the p document.addEventListener('click',function(e){var s=e.target.closest&&e.target.closest('.sent');if(s&&!s.classList.contains('blk'))s.classList.toggle('open')});
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function endp(s){return /[.?!]["”’]?$/.test(s)?s:s+'.'}
var stage=document.getElementById('stage'),prog=document.getElementById('prog');
function setProg(){var m=POOL-st.queue.length-(st.cur===null?0:0);var tot=Math.min(SET,st.setDrawn+st.queue.length);prog.textContent='이번 판 '+Math.min(st.setDrawn,tot)+' / '+tot+' · 한 바퀴 '+m+' / '+POOL+' 소진 · 정답 '+st.setCorrect+'개'}
function passage(it,filled){var sg=SEGS[it.seg],h='';
 sg.sents.forEach(function(s,i){var t=endp(s),inner,bk=(i===it.si&&!filled);
  if(i===it.si){var p=s.toLowerCase().indexOf(it.ans.toLowerCase());var a=esc(s.slice(0,p)),b=esc(endp(s).slice(p+it.ans.length));
   inner=a+(filled?'<mark>'+esc(s.slice(p,p+it.ans.length))+'</mark>':'<span class="bl">____</span>')+b}
  else inner=esc(t);
  h+='<span class="sent'+(bk?' blk':'')+'">'+inner+'<span class="kr">'+esc(sg.kos[i])+'</span></span>'});return h}
function showQ(id){var it=ITEMS[id],sg=SEGS[it.seg];
 var pos=nextPos(),ds=shuffle(it.ds),opts=[],di=0;
 for(var i=0;i<5;i++){if(i===pos)opts.push({en:it.ans,ko:it.ako,why:'',ok:true});else{var d=ds[di++];opts.push({en:d[0],ko:d[1],why:d[2],ok:false})}}
 var n=Math.min(st.setDrawn,SET);
 var h='<div class="q" id="qc"><div class="qh"><span class="qn">'+n+'</span><span class="tg">빈칸 추론</span><span class="segt">'+esc(sg.title)+'</span></div>'
  +'<div class="psg" id="psg">'+passage(it,false)+'</div><div class="ask">빈칸에 들어갈 말로 가장 알맞은 것은?</div>';
 opts.forEach(function(o,i){h+='<button class="ob" type="button" data-i="'+i+'"><b>'+CIR[i]+'</b> '+esc(o.en)+' <small>('+esc(o.ko)+')</small></button>'});
 h+='<div class="ex" id="ex"></div></div><div id="nxw"></div>';
 stage.innerHTML=h;setProg();
 curView={id:id,opts:opts,pos:pos,done:false};
 var btns=stage.querySelectorAll('.ob');
 Array.prototype.forEach.call(btns,function(b){b.addEventListener('click',function(){answer(+b.getAttribute('data-i'))})})}
function answer(i){if(!curView||curView.done)return;curView.done=true;var it=ITEMS[curView.id],o=curView.opts,ok=o[i].ok;
 if(ok)st.setCorrect++;st.cur=null;save();setProg();
 var q=document.getElementById('qc');q.className='q done';
 var btns=q.querySelectorAll('.ob');o.forEach(function(x,k){if(x.ok)btns[k].classList.add('ok');else if(k===i)btns[k].classList.add('ng')});
 var pg=document.getElementById('psg'),op=Array.prototype.map.call(pg.querySelectorAll('.sent'),function(x){return x.classList.contains('open')});pg.innerHTML=passage(it,true);Array.prototype.forEach.call(pg.querySelectorAll('.sent'),function(x,i){if(op[i])x.classList.add('open')});
 var h='<div class="res '+(ok?'o':'x')+'">'+(ok?'정답이에요.':'아쉬워요. 정답은 '+CIR[curView.pos]+'번이에요.')+'</div>'
  +'<div class="th"><b>본문 엑기스</b><br>'+esc(SEGS[it.seg].theme)+'</div>'
  +'<div class="wd"><b>정답 '+CIR[curView.pos]+'</b><br>'+esc(endp(SEGS[it.seg].sents[it.si])).replace(esc(it.ans),'<mark>'+esc(it.ans)+'</mark>')+'<br><span style="color:var(--sub)">'+esc(it.ko)+'</span></div><ul class="ol2">';
 o.forEach(function(x,k){if(!x.ok)h+='<li>'+CIR[k]+' '+esc(x.ko)+'</li>'});
 h+='</ul>';
 document.getElementById('ex').innerHTML=h;
 var end=st.setDrawn>=SET||st.queue.length===0;
 document.getElementById('nxw').innerHTML='<button class="nx" type="button" id="nx">'+(end?'이번 판 결과 보기':'다음 문제')+'</button>';
 document.getElementById('nx').addEventListener('click',function(){end?summary():next()});
 document.getElementById('ex').scrollIntoView({block:'nearest'})}
function next(){if(st.queue.length===0){summary();return}var id=drawOne();st.setDrawn++;st.cur=id;save();showQ(id);window.scrollTo(0,0)}
function summary(){curView=null;var roundDone=st.queue.length===0;
 var h='<div class="sum"><h3>이번 판 결과</h3><p>'+st.setDrawn+'문제 중 <b>'+st.setCorrect+'개</b>를 맞혔어요.</p>';
 if(roundDone)h+='<p><b>한 바퀴를 모두 풀었어요.</b> 다시 섞어서 시작할 수 있어요.</p><button class="pb" type="button" id="go">다시 섞어서 시작</button>';
 else h+='<p>남은 문제 '+st.queue.length+'개 · 한 바퀴 '+(POOL-st.queue.length)+' / '+POOL+' 소진</p><button class="pb" type="button" id="go">다음 판 시작</button>';
 h+='</div>';stage.innerHTML=h;setProg();
 document.getElementById('go').addEventListener('click',function(){if(roundDone)st.queue=fresh();st.setDrawn=0;st.setCorrect=0;st.cur=null;save();next()});window.scrollTo(0,0)}
function resetAll(){st.queue=fresh();st.cur=null;st.setDrawn=0;st.setCorrect=0;st.last=-1;save();next()}
var rs=document.getElementById('rs'),rt=null;
rs.addEventListener('click',function(){if(rs.getAttribute('data-c')==='1'){clearTimeout(rt);rs.removeAttribute('data-c');rs.textContent='처음부터 다시';resetAll();return}
 rs.setAttribute('data-c','1');rs.textContent='한 번 더 누르면 초기화';rt=setTimeout(function(){rs.removeAttribute('data-c');rs.textContent='처음부터 다시'},3000)});
function init(){var ok=load();if(!ok){st.queue=fresh();st.cur=null;st.setDrawn=0;st.setCorrect=0;st.last=-1}
 if(st.cur!==null){showQ(st.cur);return}
 if(st.setDrawn>=SET||(st.queue.length===0&&st.setDrawn>0)){summary();return}
 if(st.queue.length===0)st.queue=fresh();
 next()}
window.__t={POOL:POOL,ITEMS:ITEMS,pickPos:pickPos,SET:SET,state:st};
init();
})();
</script><div style="height:64px"></div><a class="homefab" href="../index.html" style="position:fixed;right:12px;bottom:12px;z-index:9999;background:#0f766e;color:#fff;font:700 13px/1 sans-serif;padding:11px 14px;border-radius:22px;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.3)">⌂ 목록</a></body></html>
