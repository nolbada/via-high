var D={"n": "3", "title": "3과 A Timeless Symbol of Korea", "parts": [["❶", "본문 ❶"], ["❷", "본문 ❷"], ["❸", "본문 ❸"], ["❹", "본문 ❹"]], "groups": [{"part": "❶", "title": "책 속 소녀와 호랑이", "flow": "Tae Keller (태 켈러)의 책 When You Trap a Tiger (호랑이를 가두면)가 나오고, 소녀와 호랑이, 그리고 할머니의 이야기가 어떻게 시작되는지 소개해요.", "items": [{"en": "Tae Keller published her book When You Trap a Tiger in 2020.", "ans": "T", "ko": "Tae Keller는 2020년에 자신의 책 When You Trap a Tiger를 출판했다.", "eve": "Children around the world learned a bit more about Korean culture when writer Tae Keller published her book When You Trap a Tiger in 2020.", "evk": "전 세계 아이들은 작가 Tae Keller가 2020년에 그녀의 책 When You Trap a Tiger를 출판했을 때 한국 문화에 대해 조금 더 알게 되었다.", "why": "첫 문장에 published her book (그녀의 책을 출판했다)과 in 2020 (2020년에)이 그대로 나와요. 이 책이 전 세계 아이들에게 한국 문화를 알린 계기라는 것까지 같이 기억해 두세요."}, {"en": "Only children in Korea learned about Korean culture through Keller's book.", "ans": "F", "ko": "한국의 아이들만 Keller의 책을 통해 한국 문화를 알게 되었다.", "eve": "Children around the world learned a bit more about Korean culture when writer Tae Keller published her book When You Trap a Tiger in 2020.", "evk": "전 세계 아이들은 작가 Tae Keller가 2020년에 그녀의 책 When You Trap a Tiger를 출판했을 때 한국 문화에 대해 조금 더 알게 되었다.", "why": "본문은 Children around the world (전 세계 아이들)이 한국 문화를 더 알게 되었다고 해요. 한국 아이들만이라고 하면 범위가 좁아져서 틀려요."}, {"en": "The story begins with a boy who meets a tiger.", "ans": "F", "ko": "이야기는 호랑이를 만난 한 소년으로 시작한다.", "eve": "Its story starts with a girl who meets a tiger.", "evk": "그것의 이야기는 호랑이를 만난 한 소녀로부터 시작된다.", "why": "본문은 a girl who meets a tiger (호랑이를 만난 소녀)예요. 소년(boy)이 아니라 소녀입니다."}, {"en": "The girl's grandmother also knows the tiger.", "ans": "T", "ko": "소녀의 할머니도 그 호랑이를 알고 있다.", "eve": "Her grandmother knows the tiger as well.", "evk": "그녀의 할머니 역시 그 호랑이를 알고 있다.", "why": "as well (역시, 또한)은 소녀뿐 아니라 할머니도 호랑이를 안다는 뜻이에요. 그래서 이야기가 할머니와 연결되는 거예요."}, {"en": "When the girl's grandmother gets sick, the girl makes a deal with the tiger.", "ans": "T", "ko": "소녀의 할머니가 아프게 되자, 소녀는 호랑이와 거래를 한다.", "eve": "When her grandmother gets sick, the girl makes a deal with the tiger.", "evk": "그녀의 할머니가 아프게 되자, 그 소녀는 그 호랑이와 거래를 한다.", "why": "할머니가 sick (아픈) 상황이 먼저이고, 그 뒤에 소녀가 a deal (거래)을 해요. 아픈 사람은 할머니라는 점이 포인트예요."}, {"en": "When the girl gets sick, her grandmother makes a deal with the tiger.", "ans": "F", "ko": "소녀가 아프게 되자, 할머니가 호랑이와 거래를 한다.", "eve": "When her grandmother gets sick, the girl makes a deal with the tiger.", "evk": "그녀의 할머니가 아프게 되자, 그 소녀는 그 호랑이와 거래를 한다.", "why": "아픈 사람과 거래하는 사람이 바뀌었어요. 본문은 할머니가 아프고 소녀가 거래를 해요."}]}, {"part": "❶", "title": "영감이 된 설화와 Keller의 목표", "flow": "Keller (켈러)에게 영감을 준 옛 설화와, 그녀가 책으로 이루고 싶었던 목표가 나와요.", "items": [{"en": "Keller's inspiration for her award-winning book was an old folktale.", "ans": "T", "ko": "Keller의 수상작에 영감을 준 것은 옛 설화였다.", "eve": "Keller’s inspiration for her award-winning book was an old folktale that her halmoni (grandmother) used to tell her.", "evk": "Keller의 수상 도서에 영감을 준 것은 그녀의 할머니가 그녀에게 이야기해 주던 옛 설화였다.", "why": "inspiration (영감)이 old folktale (옛 설화)라고 바로 나와요. award-winning (상을 받은)도 같이 나오니 책이 상을 받았다는 점도 기억해 두세요."}, {"en": "Keller learned the folktale from her teacher at school.", "ans": "F", "ko": "Keller는 학교 선생님에게서 그 설화를 배웠다.", "eve": "Keller’s inspiration for her award-winning book was an old folktale that her halmoni (grandmother) used to tell her.", "evk": "Keller의 수상 도서에 영감을 준 것은 그녀의 할머니가 그녀에게 이야기해 주던 옛 설화였다.", "why": "본문은 her halmoni (grandmother) (그녀의 할머니)가 used to tell her (그녀에게 들려주곤 했다)예요. 선생님이 아니라 할머니입니다."}, {"en": "The folktale is called “The Sun and the Moon.”", "ans": "T", "ko": "그 설화는 ‘해님 달님’이라고 불린다.", "eve": "It is called “The Sun and the Moon,” and it is about a brother, a sister, and a tiger.", "evk": "그것은 ‘해님 달님’이라고 불리는데, 오빠와 여동생, 그리고 호랑이에 관한 내용이다.", "why": "It is called (그것은 ~라고 불린다) 뒤에 제목이 나와요. 이 설화가 이야기의 뿌리라는 흐름으로 잡으세요."}, {"en": "“The Sun and the Moon” is about a mother, a son, and a tiger.", "ans": "F", "ko": "‘해님 달님’은 어머니, 아들, 그리고 호랑이에 관한 이야기이다.", "eve": "It is called “The Sun and the Moon,” and it is about a brother, a sister, and a tiger.", "evk": "그것은 ‘해님 달님’이라고 불리는데, 오빠와 여동생, 그리고 호랑이에 관한 내용이다.", "why": "본문은 a brother, a sister, and a tiger (오빠, 여동생, 그리고 호랑이)예요. 등장인물이 어머니와 아들로 바뀌어 틀려요."}, {"en": "Keller wanted to bring back the public's interest in tigers.", "ans": "T", "ko": "Keller는 호랑이에 대한 대중의 관심을 되살리고 싶어 했다.", "eve": "Keller wanted to revive the public’s interest in tigers by writing her own book.", "evk": "Keller는 그녀 자신의 책을 씀으로써 호랑이에 대한 대중의 흥미를 되살리고 싶어 했다.", "why": "revive (되살리다)를 bring back (다시 가져오다)으로 바꿔 쓴 문장이에요. 뜻은 같아서 맞아요."}, {"en": "Keller wanted to revive interest in tigers by translating an old book.", "ans": "F", "ko": "Keller는 옛 책을 번역함으로써 호랑이에 대한 관심을 되살리고 싶어 했다.", "eve": "Keller wanted to revive the public’s interest in tigers by writing her own book.", "evk": "Keller는 그녀 자신의 책을 씀으로써 호랑이에 대한 대중의 흥미를 되살리고 싶어 했다.", "why": "본문은 by writing her own book (자기 자신의 책을 씀으로써)이에요. 번역(translating)이 아니라 직접 쓴 것입니다."}, {"en": "Keller tried to make people lose interest in tigers.", "ans": "F", "ko": "Keller는 사람들이 호랑이에 대한 흥미를 잃게 하려 했다.", "eve": "Keller wanted to revive the public’s interest in tigers by writing her own book.", "evk": "Keller는 그녀 자신의 책을 씀으로써 호랑이에 대한 대중의 흥미를 되살리고 싶어 했다.", "why": "revive (되살리다)는 다시 살린다는 뜻이라 흥미를 잃게 한다는 말과 정반대예요."}]}, {"part": "❷", "title": "호랑이의 땅 한국", "flow": "한국에 호랑이가 얼마나 많았는지, 얼마나 오래 살았는지 이야기해요.", "items": [{"en": "Tigers were so abundant in Korea that it was called the “Land of Tigers.”", "ans": "T", "ko": "한국에는 호랑이가 매우 많아서 ‘호랑이의 땅’이라고 불렸다.", "eve": "Long ago, tigers were so abundant in Korea that people often called the country the “Land of Tigers.”", "evk": "오래 전, 한국에는 호랑이가 매우 많아서 사람들은 종종 그 나라를 ‘호랑이의 땅’이라고 불렀다.", "why": "so abundant that (너무 풍부해서 ~할 정도)은 호랑이가 아주 많았다는 뜻이에요. 많아서 그런 별명이 생긴 거예요."}, {"en": "Because tigers were rare in Korea, it was called the “Land of Tigers.”", "ans": "F", "ko": "한국에는 호랑이가 드물어서 ‘호랑이의 땅’이라고 불렸다.", "eve": "Long ago, tigers were so abundant in Korea that people often called the country the “Land of Tigers.”", "evk": "오래 전, 한국에는 호랑이가 매우 많아서 사람들은 종종 그 나라를 ‘호랑이의 땅’이라고 불렀다.", "why": "abundant (풍부한)의 반대인 rare (드문)로 바꿨어요. 드물다면 그런 이름이 붙을 수 없어요."}, {"en": "Tigers are estimated to have lived in Korea for at least 100,000 years.", "ans": "T", "ko": "호랑이는 한국에서 적어도 10만 년 동안 살았다고 추정된다.", "eve": "It is estimated that tigers lived in Korea for at least 100,000 years.", "evk": "호랑이는 한국에 적어도 십만 년을 살았다고 추정된다.", "why": "at least (적어도)와 100,000 years (10만 년)이 그대로예요. 숫자와 at least (적어도)를 함께 외워 두세요."}, {"en": "Tigers are estimated to have lived in Korea for less than 1,000 years.", "ans": "F", "ko": "호랑이는 한국에서 1,000년도 안 되게 살았다고 추정된다.", "eve": "It is estimated that tigers lived in Korea for at least 100,000 years.", "evk": "호랑이는 한국에 적어도 십만 년을 살았다고 추정된다.", "why": "본문은 at least 100,000 years (적어도 10만 년)예요. 천 년 미만이라면 숫자가 완전히 달라요."}]}, {"part": "❷", "title": "바위 그림 속 첫 등장", "flow": "한국 문화에서 호랑이가 처음 나타난 때와 그 그림의 내용을 설명해요.", "items": [{"en": "The first tiger in Korean culture appears in the rock art of the Bronze Age.", "ans": "T", "ko": "한국 문화에서 호랑이의 첫 등장은 청동기 시대의 바위 그림에 있다.", "eve": "The first appearance of a tiger in Korean culture dates back to the rock art of the Bronze Age.", "evk": "한국 문화에서 호랑이의 첫 번째 등장은 청동기 시대의 바위 그림으로 거슬러 올라간다.", "why": "dates back to (~로 거슬러 올라간다)는 가장 오래된 기록이 그 시대라는 말이에요. rock art (바위 그림)와 Bronze Age (청동기 시대)를 짝으로 기억하세요."}, {"en": "The first tiger in Korean culture appears in paintings of the Joseon period.", "ans": "F", "ko": "한국 문화에서 호랑이의 첫 등장은 조선 시대의 그림에 있다.", "eve": "The first appearance of a tiger in Korean culture dates back to the rock art of the Bronze Age.", "evk": "한국 문화에서 호랑이의 첫 번째 등장은 청동기 시대의 바위 그림으로 거슬러 올라간다.", "why": "본문은 Bronze Age (청동기 시대)의 바위 그림이에요. 조선 시대는 뒤에 사냥으로 호랑이가 줄어드는 시기로 나오니 구분하세요."}, {"en": "The rock art shows people hunting various animals, including tigers.", "ans": "T", "ko": "그 바위 그림은 호랑이를 포함한 여러 동물을 사냥하는 사람들을 보여 준다.", "eve": "It depicts people hunting various animals, including tigers.", "evk": "그것은 호랑이를 포함하여 다양한 동물을 사냥 e.", "ans": "T", "ko": "사람들은 호랑이가 사람을 자주 다치게 하거나 죽였기 때문에 호랑이를 무서워하기도 했다.", "eve": "However, they were also scared of tigers because being injured or even killed by tigers was common in the past.", "evk": "그러나, 과거에는 호랑이에게 상처를 입거나 심지어 죽임을 당하는 일이 흔했기 때문에 그들은 호랑이를 무서워하기도 했다.", "why": "being injured or even killed ... was common (다치거나 죽는 일이 흔했다)을 풀어 쓴 문장이에요. However (그러나)로 존경과 반대되는 두려움이 이어져요."}, {"en": "People were scared of tigers although being hurt by tigers was rare.", "ans": "F", "ko": "사람들은 호랑이에게 다치는 일이 드물었는데도 호랑이를 무서워했다.", "eve": "However, they were also scared of tigers because being injured or even killed by tigers was common in the past.", "evk": "그러나, 과거에는 호랑이에게 상처를 입거나 심지어 죽임을 당하는 일이 흔했기 때문에 그들은 호랑이를 무서워하기도 했다.", "why": "본문은 common (흔한)이에요. 드물다(rare)로 바뀌면 두려워한 이유가 사라져요."}, {"en": "People may have made tigers foolish characters to feel less scared.", "ans": "T", "ko": "사람들은 덜 무서워하기 위해 호랑이를 어리석은 캐릭터로 만들었을지도 모른다.", "eve": "They may have made tigers into foolish characters in order to be less scared of them.", "evk": "그들은 호랑이를 덜 무서워하기 위해 호랑이를 어리석은 캐릭터로 만들었을지도 모른다.", "why": "in order to be less scared (덜 무서워하기 위해)가 이유예요. 그래서 설화 속 호랑이가 어리석게 그려진 것으로 설명돼요."}]}, {"part": "❸", "title": "사라진 호랑이와 사라진 상징", "flow": "조선 시대부터 일제 강점기까지 호랑이가 줄어들고, 상징도 희미해졌다는 내용이에요.", "items": [{"en": "Tigers declined in number because of hunting during the Joseon period.", "ans": "T", "ko": "호랑이는 조선 시대에 사냥 때문에 개체 수가 줄었다.", "eve": "Tigers in Korea faced a decline in population due to hunting during the Joseon period and nearly went extinct during the Japanese colonial era.", "evk": "한국의 호랑이들은 조선 시대 동안 사냥 때문에 개체 수 감소에 직면했고, 일제 강점기 동안 거의 멸종에 이르렀다.", "why": "due to hunting (사냥 때문에)이 원인이고 during the Joseon period (조선 시대 동안)가 때예요."}, {"en": "Tigers nearly went extinct during the Joseon period.", "ans": "F", "ko": "호랑이는 조선 시대에 거의 멸종했다.", "eve": "Tigers in Korea faced a decline in population due to hunting during the Joseon period and nearly went extinct during the Japanese colonial era.", "evk": "한국의 호랑이들은 조선 시대 동안 사냥 때문에 개체 수 감소에 직면했고, 일제 강점기 동안 거의 멸종에 이르렀다.", "why": "조선 시대는 감소가 시작된 때이고, 거의 멸종(nearly went extinct)한 때는 Japanese colonial era (일제 강점기)예요."}, {"en": "When tigers disappeared, their use as a national symbol faded away.", "ans": "T", "ko": "호랑이가 사라지면서 국가 상징으로서의 쓰임도 희미해졌다.", "eve": "With the disappearance of tigers in Korea, their use as a symbol of the nation faded away.", "evk": "한국에서 호랑이가 사라지면서, 국가의 상징으로서의 그들의 용도도 희미해졌다.", "why": "With the disappearance (사라지면서)가 원인이고, faded away (희미해졌다)가 결과예요."}, {"en": "When tigers disappeared, their use as a national symbol became more popular.", "ans": "F", "ko": "호랑이가 사라지자 국가 상징으로서의 쓰임은 더 인기를 얻었다.", "eve": "With the disappearance of tigers in Korea, their use as a symbol of the nation faded away.", "evk": "한국에서 호랑이가 사라지면서, 국가의 상징으로서의 그들의 용도도 희미해졌다.", "why": "faded away (희미해졌다)와 정반대로 바꿨어요. 사라지면 상징도 약해졌다고 나옵니다."}]}, {"part": "❸", "title": "올림픽 마스코트로 되살아난 호랑이", "flow": "두 올림픽 마스코트 호돌이와 수호랑을 통해 상징성이 다시 살아나요.", "items": [{"en": "Tigers became symbols again as mascots of both Olympics held in Korea.", "ans": "T", "ko": "호랑이는 한국에서 열린 두 올림픽의 마스코트로 다시 상징이 되었다.", "eve": "However, their symbolism was revived in modern times through their selection as the mascot for both Olympics hosted by Korea.", "evk": "그러나, 한국에서 열린 두 올림픽의 마스코트로 선정되면서 그들의 상징성이 현대에 되살아났다.", "why": "revived (되살아났다)가 핵심이에요. 마스코트로 선정되면서 현대에 상징성이 돌아왔어요."}, {"en": "Hodori was the mascot for the 1988 Seoul Summer Olympics.", "ans": "T", "ko": "호돌이는 1988년 서울 하계 올림픽의 마스코트였다.", "eve": "Hodori was the mascot for the Seoul Summer Olympics in 1988.", "evk": "호돌이는 1988년 서울 하계 올림픽의 마스코트였다.", "why": "Hodori (호돌이)는 1988년 서울 하계 올림픽이에요. 이름, 연도, 대회를 함께 묶어 두세요."}, {"en": "Hodori was a white tiger that represents sacred guardians.", "ans": "F", "ko": "호돌이는 신성한 수호자를 상징하는 백호였다.", "eve": "It was a Siberian tiger, which represents courage.", "evk": "그것은 시베리안 호랑이였는데, 그들은 용기를 상징한다.", "why": "호돌이는 a Siberian tiger (시베리안 호랑이)이고 용기를 상징해요. 백호는 수호랑입니다."}, {"en": "Soohorang, a white tiger, was the mascot of the 2018 PyeongChang Winter Olympics.", "ans": "T", "ko": "백호인 수호랑은 2018년 평창 동계 올림픽의 마스코트였다.", "eve": "The PyeongChang Winter Olympics in 2018 created Soohorang, a white tiger, as its mascot.", "evk": "2018년 평창 동계 올림픽은 백호인 수호랑을 그것의 마스코트로 만들었다.", "why": "white tiger (백호)와 2018년 평창 동계 올림픽이 짝이에요."}, {"en": "Hodori, the mascot of the 1988 Seoul Olympics, was a white tiger.", "ans": "F", "ko": "1988년 서울 올림픽의 마스코트 호돌이는 백호였다.", "eve": "It was a Siberian tiger, which represents courage.", "evk": "그것은 시베리안 호랑이였는데, 그들은 용기를 상징한다.", "why": "호돌이는 Siberian tiger (시베리안 호랑이)였고, 이 호랑이가 courage (용기)를 상징한다고 해요. 백호(white tiger)는 평창의 수호랑이고, sacred guardians (신성한 수호자)로 여겨져요. 호돌이를 백호라고 하면 틀려요."}]}, {"part": "❹", "title": "범 내려온다", "flow": "노래 ‘범 내려온다’에 호랑이가 나오고, 전통 가곡을 재해석했으며 큰 인기를 끌었어요.", "items": [{"en": "Tigers are mentioned in the K-pop song “Tiger is Coming.”", "ans": "T", "ko": "호랑이는 K-pop 노래 ‘범 내려온다’에 언급된다.", "eve": "Tigers are also mentioned in the K-pop song “Tiger is Coming.”", "evk": "호랑이는 또한 한국 대중가요 ‘범 내려온다’에도 언급된다.", "why": "also mentioned (또한 언급된다)로, 호랑이가 오늘날 대중가요에도 이어진다는 흐름이에요."}, {"en": "One verse of the song is a reinterpreted version of “Sugungga,” a traditional Korean song.", "ans": "T", "ko": "이 노래의 한 구절은 한국 전통 가곡 ‘수궁가’를 재해석한 것이다.", "eve": "One verse of the song is a reinterpreted version of “Sugungga,” which is a traditional Korean song.", "evk": "이 노래의 한 구절(가사)은 ‘수궁가’의 재해석판인데, 수궁가는 한국의 전통 가곡이다.", "why": "reinterpreted (재해석된)는 옛 노래를 새롭게 풀었다는 뜻이에요. 옛것과 새것이 만난 점이 포인트예요."}, {"en": "One verse of the song is based on a modern English pop song.", "ans": "F", "ko": "이 노래의 한 구절은 현대 영어 팝송에 바탕을 두고 있다.", "eve": "One verse of the song is a reinterpreted version of “Sugungga,” which is a traditional Korean song.", "evk": "이 노래의 한 구절(가사)은 ‘수궁가’의 재해석판인데, 수궁가는 한국의 전통 가곡이다.", "why": "본문은 Sugungga (수궁가)라는 traditional Korean song (한국 전통 가곡)이에요."}, {"en": "The song's video was viewed millions of times online.", "ans": "T", "ko": "그 노래의 영상은 온라인에서 수백만 번 시청되었다.", "eve": "The song drew worldwide attention, and its video was viewed millions of times online.", "evk": "그 노래는 세계적인 주목을 끌었고, 그것의 영상은 온라인에서 수백만 회 시청되었다.", "why": "millions of times (수백만 번)를 그대로 쓴 맞는 문장이에요. worldwide attention (세계적인 주목)도 함께 기억하세요."}, {"en": "The song drew attention only in Korea.", "ans": "F", "ko": "그 노래는 한국에서만 주목을 받았다.", "eve": "The song drew worldwide attention, and its video was viewed millions of times online.", "evk": "그 노래는 세계적인 주목을 끌었고, 그것의 영상은 온라인에서 수백만 회 시청되었다.", "why": "본문은 worldwide attention (세계적인 주목)이에요. 한국에서만이라고 하면 틀려요."}]}, {"part": "❹", "title": "오늘날 호랑이의 의미", "flow": "현재 야생 호랑이는 거의 없지만 호랑이의 문화적 의미는 여전히 남아 있다는 내용이에요.", "items": [{"en": "Only a few wild tigers have been reported in North Korea these days.", "ans": "T", "ko": "오늘날 북한에서는 소수의 야생 호랑이만 보고되었다.", "eve": "These days, only a few wild tigers have been reported to be living in North Korea.", "evk": "오늘날, 단지 소수의 야생 호랑이만이 북한에 살고 있다고 보고되어 왔다.", "why": "only a few (단지 소수)가 포인트예요. 지역도 North Korea (북한)로 기억해 두세요."}, {"en": "Many wild tigers have been reported in North Korea these days.", "ans": "F", "ko": "오늘날 북한에서는 많은 야생 호랑이가 보고되었다.", "eve": "These days, only a few wild tigers have been reported to be living in North Korea.", "evk": "오늘날, 단지 소수의 야생 호랑이만이 북한에 살고 있다고 보고되어 왔다.", "why": "본문은 only a few (소수)인데 many (많은)로 바뀌었어요. 지역은 North Korea (북한)로 같아서, 개체 수만 다른 거예요."}, {"en": "The cultural meaning of tigers still has a place among modern Korean people.", "ans": "T", "ko": "호랑이의 문화적 의미는 현대 한국인들 사이에 여전히 자리하고 있다.", "eve": "However, the history, stories, and cultural meaning of tigers still have a place among modern Korean people.", "evk": "그러나, 호랑이의 역사, 이야기, 그리고 문화적 의미는 현대 한국 사람들 사이에 여전히 자리하고 있다.", "why": "However (그러나)로 앞의 적은 개체 수와 대비돼요. 호랑이는 줄었어도 의미는 남아 있어요."}, {"en": "The text suggests that the tiger is a symbol of Korea.", "ans": "T", "ko": "이 글은 호랑이가 한국의 상징임을 시사한다.", "eve": "Who can deny that the tiger is a symbol of Korea?", "evk": "호랑이가 한국의 상징이라는 점을 누가 부정할 수 있을까?", "why": "Who can deny (누가 부정할 수 있을까)는 아무도 부정 못 한다는 수사 의문문이에요. 즉 호랑이는 한국의 상징이라는 주장이에요."}]}, {"part": "❹", "title": "박물관의 책과 마무리 질문", "flow": "국립민속박물관의 책 출판과, 주변에서 호랑이를 찾아보자는 마지막 제안이에요.", "items": [{"en": "In 2021, the National Folk Museum of Korea published a book collecting tiger stories.", "ans": "T", "ko": "2021년에 국립민속박물관은 호랑이 이야기를 모은 책을 출판했다.", "eve": "In 2021, the National Folk Museum of Korea published a book that collects all the stories about tigers in Korea.", "evk": "2021년에, 국립 민속 박물관은 한국의 호랑이에 관한 모든 이야기를 모은 책을 출판했다.", "why": "collects all the stories (모든 이야기를 모은)로, 호랑이 이야기를 한데 모은 책이에요. 2021이라는 연도도 기억하세요."}, {"en": "The National Folk Museum of Korea published the book in 2001.", "ans": "F", "ko": "국립민속박물관은 2001년에 그 책을 출판했다.", "eve": "In 2021, the National Folk Museum of Korea published a book that collects all the stories about tigers in Korea.", "evk": "2021년에, 국립 민속 박물관은 한국의 호랑이에 관한 모든 이야기를 모은 책을 출판했다.", "why": "본문의 연도는 2021이에요. 연도가 바뀌어 틀려요."}, {"en": "The text ends by suggesting that readers look for tigers around them.", "ans": "T", "ko": "글은 독자에게 주변에서 호랑이를 찾아보라고 제안하며 끝난다.", "eve": "How about looking for tigers around you now?", "evk": "이제 여러분 주변에서 호랑이를 찾아보는 것은 어떨까?", "why": "How about ~ing? (~하는 건 어때?)는 제안이에요. around you (여러분 주변에서)가 핵심이에요."}, {"en": "The text ends by saying tigers can be found only in museums.", "ans": "F", "ko": "글은 호랑이를 박물관에서만 찾을 수 있다고 말하며 끝난다.", "eve": "How about looking for tigers around you now?", "evk": "이제 여러분 주변에서 호랑이를 찾아보는 것은 어떨까?", "why": "본문은 around you (여러분 주변)에서 찾아보자는 제안이에요. 박물관에서만이 아니에요."}]}]};
var KEY='kc-find-'+D.n, S={};
try{S=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){S={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function rich(p,s){var parts=s.split('**');parts.forEach(function(t,i){if(!t)return;if(i%2){var b=el('b',null,t);p.appendChild(b)}else p.appendChild(document.createTextNode(t))})}
document.getElementById('h').textContent=D.title+' · 틀린 곳 찾기';
var root=document.getElementById('root'),prog=el('span','prog','');
var nav=document.getElementById('nav');
var secs={};
D.parts.forEach(function(p){var b=el('button',null,p[1]);b.onclick=function(){secs[p[0]].scrollIntoView({behavior:'smooth',block:'start'})};nav.appendChild(b)});
var bClose=el('button','closeall','답 모두 닫기');bClose.onclick=function(){S={};save();paint();window.scrollTo({top:0,behavior:'smooth'})};nav.insertBefore(bClose,nav.firstChild);nav.appendChild(prog);
var cards=[];
D.parts.forEach(function(p){
  var h=el('h2',null,p[1]);root.appendChild(h);secs[p[0]]=h;
  D.groups.forEach(function(g,gi){
    if(g.part!==p[0])return;
    var card=el('div','grp'),head=el('div','gh');
    head.appendChild(el('div','gt',g.title));
    var cnt=el('span','cnt','');head.appendChild(cnt);card.appendChild(head);
    var nF=g.items.filter(function(i){return i.ans==='F'}).length;
    card.appendChild(el('div','ask','본문과 다른 문장이 '+nF+'개 있어요. 찾아서 눌러 보세요.'));
    var btns=[];
    g.items.forEach(function(it,ii){
      var b=el('div','it');b.setAttribute('role','button');b.tabIndex=0;
      var line=el('div');line.appendChild(el('span','no',(ii+1)+'.'));line.appendChild(document.createTextNode(' '+it.en));b.appendChild(line);
      var pn=el('div','pn');
      pn.appendChild(el('div','ko',it.ko));
      var ev=el('div','ev');ev.appendChild(el('span','e',it.eve));if(it.evk)ev.appendChild(el('span','k',it.evk));
      pn.appendChild(el('span','tag','본문 근거'));pn.appendChild(ev);
      pn.appendChild(el('span','tag','해설'));var w=el('div','why');rich(w,it.why);pn.appendChild(w);
      b.appendChild(pn);
      var id=gi+'-'+ii;
      function open(){
        if(b.classList.contains('open'))return;
        S[id]=1;save();paint();
      }
      b.onclick=open;b.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}};
      card.appendChild(b);btns.push({b:b,id:id,it:it,pn:pn});
    });
    var tools=el('div','tools');
    var bAll=el('button',null,'나머지 해설 모두 열기');bAll.onclick=function(){btns.forEach(function(x){S[x.id]=1});save();paint()};
    var bReset=el('button',null,'이 소단락 다시 하기');bReset.onclick=function(){btns.forEach(function(x){delete S[x.id]});save();paint()};
    tools.appendChild(bAll);tools.appendChild(bReset);card.appendChild(tools);
    var flow=el('div','flow');flow.appendChild(el('span','tag','이 소단락 정리'));flow.appendChild(document.createTextNode(g.flow));card.appendChild(flow);
    root.appendChild(card);
    cards.push({g:g,btns:btns,cnt:cnt,flow:flow,nF:nF});
  });
});
function paint(){
  var done=0;
  cards.forEach(function(c){
    var found=0,all=true;
    c.btns.forEach(function(x){
      var o=!!S[x.id];
      x.b.classList.toggle('open',o);
      x.b.classList.remove('ok','no2');
      var old=x.b.querySelector('.badge');if(old)old.remove();
      if(o){
        var f=x.it.ans==='F';x.b.classList.add(f?'ok':'no2');
        if(f)found++;
        var bd=el('span','badge',f?'✔ 본문과 다른 문장 · 잘 찾았어요':'본문과 같은 내용이에요 · 맞는 문장');
        x.b.insertBefore(bd,x.pn);
      }
      if(!o)all=false;
    });
    var fin=found===c.nF;
    c.cnt.textContent='다른 문장 '+found+'/'+c.nF+' 찾음';
    c.cnt.classList.toggle('done',fin);
    c.flow.classList.toggle('on',fin);
    if(fin)done++;
  });
  prog.textContent='소단락 '+done+'/'+cards.length+' 확인';
}
paint();
</script></body></html>
