<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>동사형 선생님용 (고등)</title>
<style>
:root{--bg:#f6f7fb;--c:#fff;--ink:#222;--sub:#667;--pri:#3b5bdb;--ok:#e8590c;--line:#e3e6ef}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Malgun Gothic",sans-serif;line-height:1.55}
.w{max-width:720px;margin:0 auto;padding:12px 12px 80px}
h1{font-size:19px;margin:6px 0 8px}
.card{background:var(--c);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.sel,input[type=text]{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);font-size:16px;background:#fff;margin-bottom:6px}
.grid{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.n{min-width:42px;height:38px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:15px}
.n.on{background:var(--pri);color:#fff;border-color:var(--pri)}.n.star{border-color:#f59f00}
button.b{border:0;border-radius:10px;background:var(--pri);color:#fff;padding:11px 16px;font-size:16px;margin:4px 4px 4px 0}
button.g{border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px 13px;font-size:14px;margin:3px 3px 3px 0}
.q{font-size:21px;line-height:1.8}.ko{color:var(--sub);font-size:15px;margin-top:8px}
.bl{display:inline-block;border-bottom:2px solid #888;min-width:70px;text-align:center;color:#888;font-size:16px;margin:0 3px}
.ans{font-size:19px;margin:8px 0}.ans b{color:var(--ok)}
.sec{font-size:12px;color:var(--sub);margin:12px 0 3px;font-weight:700}
.why{font-size:14px;margin:4px 0;padding-left:18px}.why b{color:var(--ok)}
table{border-collapse:collapse;width:100%;font-size:15px}td{border:1px solid var(--line);padding:5px 8px;vertical-align:top}td:first-child{width:50%}td:last-child{background:#fffaf0}
.row2{display:flex;gap:6px}.row2 .sel{flex:1}
.prog{color:var(--sub);font-size:14px}
.row{display:flex;gap:8px}.row button{flex:1}
.o{background:#2f9e44!important}.x{background:#e03131!important}
.hint{font-size:13px;color:var(--sub)}
.jrow{display:flex;align-items:flex-start;gap:6px;font-size:15px}.jb{margin-left:auto;flex:none;white-space:nowrap}
.jo.on{background:#2f9e44!important;color:#fff;border-color:#2f9e44}.jx.on{background:#e03131!important;color:#fff;border-color:#e03131}
.stick{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px;display:flex;align-items:center;gap:10px;justify-content:space-between;margin:10px -12px -80px}
.rs{font-size:17px}.rs .w1{margin:8px 0;padding:8px 10px;border-radius:8px;background:#fff5f5;border:1px solid #ffc9c9;font-size:15px}.rs .w1 b{color:var(--ok)}
.nm{width:130px!important;display:inline-block!important;margin:0 4px!important;padding:5px 8px!important;font-size:16px!important}
@media print{.noprint{display:none!important}body{background:#fff}.card{break-inside:avoid;border-color:#999}}
</style></head><body><div class="w">
<h1>동사형 선생님용 · 고등 (시험지·답안지)</h1>

<div id="setup">
<div class="card noprint">
 <div class="row2"><select id="lv" class="sel"></select><select id="gr" class="sel"></select></div>
 <select id="pb" class="sel"></select>
 <select id="ls" class="sel"></select>
 <div class="hint">시험 볼 번호를 누르거나, 아래에 직접 입력하세요. 예: 1,3,5-8 (노란 테두리 = 교재 ★ 문장)</div>
 <div class="grid" id="grid"></div>
 <input type="text" id="txt" placeholder="번호 직접 입력 (예: 2,4,7-10)" inputmode="text">
 <div>
  <button class="g" id="all">전체</button><button class="g" id="none">해제</button><button class="g" id="stars">★만</button>
  <button class="g" id="rnd">랜덤 <select id="rn" style="font-size:14px"><option>5</option><option selected>8</option><option>10</option></select>개</button>
 </div>
</div>
<div class="card noprint">
 <label><input type="checkbox" id="shuf"> 선택한 번호를 섞어서 출제 (끄면 번호순)</label><br>
 <label><input type="checkbox" id="hko" checked> 문제에 한글 해석 보이기</label>
 <div style="margin-top:8px"><button class="b" id="go">시험 시작</button><button class="g" id="sheet">답안지 전체 보기</button></div>
 <div class="hint" id="cnt"></div>
</div>
</div>

<div id="test" style="display:none"></div>
<div id="sheetv" style="display:none"></div>
</div>
<script src="../data/index.js"></script>
<script>
var REG=VERBREG,LS=[],CID=null,G=null,li=0,picked={};
var KEY='verb_teacher_h_v1',ST={};try{ST=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\n/g,'<br>')}
function uniq(a){return a.filter(function(x,i){return a.indexOf(x)==i})}
function fill(id,opts,sel){var s=$(id);s.innerHTML='';opts.forEach(function(o){var e=document.createElement('option');e.value=o[0];e.textContent=o[1];s.appendChild(e)});if(sel!=null&&opts.some(function(o){return o[0]==sel}))s.value=sel}
function saveSet(){try{ST.sel={lv:$('lv').value,gr:$('gr').value,id:CID,ln:LS[li]&&LS[li].name};ST.p=ST.p||{};if(CID&&LS[li])ST.p[CID+'|'+LS[li].name]=Object.keys(picked).map(Number);ST.shuf=$('shuf').checked;ST.hko=$('hko').checked;localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}}
function grpKey(r){return r.school+'|'+r.pub}
function onLv(sel){fill('gr',uniq(REG.filter(function(r){return r.level==$('lv').value}).map(function(r){return r.grade})).map(function(g){return [g,g]}),sel);onGr()}
function onGr(sel,LN){var seen={},opts=[];REG.filter(function(r){return r.level==$('lv').value&&r.grade==$('gr').value}).forEach(function(r){var k=grpKey(r);if(!seen[k]){seen[k]=1;opts.push([k,r.pub+' ('+r.school+')'])}});fill('pb',opts,sel);onPb(LN)}
function onPb(LN){
  var k=$('pb').value;if(!k){LS=[];CID=null;G=null;$('ls').innerHTML='';return}
  var rs=REG.filter(function(r){return r.level==$('lv').value&&r.grade==$('gr').value&&grpKey(r)==k});
  var need=rs.filter(function(r){return !(window.VERBDATA&&VERBDATA[r.id])}),left=need.length;
  var go=function(){
    CID=k;G=rs[0];LS=[];rs.forEach(function(r){VERBDATA[r.id].lessons.forEach(function(L){LS.push(L)})});
    LS.sort(function(a,b){return parseInt(a.name)-parseInt(b.name)});
    var c=LN!=null?LS.map(function(L){return L.name}).indexOf(LN):0;if(c<0)c=0;
    fill('ls',LS.map(function(L,i){return [i,L.name+' ('+L.items.length+'문장)']}),c);li=+$('ls').value||0;loadPicked();draw()};
  if(!left){go();return}
  need.forEach(function(r){var s=document.createElement('script');s.src='../data/'+r.id+'.js';s.onload=function(){if(--left==0)go()};s.onerror=function(){alert('자료를 불러오지 못했어요')};document.head.appendChild(s)});
}
function loadPicked(){picked={};((ST.p&&LS[li]&&ST.p[CID+'|'+LS[li].name])||[]).forEach(function(i){picked[i]=1})}
$('lv').onchange=function(){onLv()};$('gr').onchange=function(){onGr()};$('pb').onchange=function(){onPb()};
$('ls').onchange=function(){li=+$('ls').value;loadPicked();draw()};
function draw(){
  var g=$('grid');g.innerHTML='';
  LS[li].items.forEach(function(it,i){
    var b=document.createElement('button');b.className='n'+(picked[i]?' on':'')+(it.star?' star':'');b.textContent=i+1;
    b.onclick=function(){if(picked[i])delete picked[i];else picked[i]=1;draw()};g.appendChild(b)});
  var ks=Object.keys(picked).map(Number).sort(function(a,b){return a-b});
  $('txt').value=compress(ks.map(function(x){return x+1}));
  $('cnt').textContent='선택: '+ks.length+'문장 (마지막 설정은 이 폰에 기억돼요)';saveSet();
}
function compress(a){var r=[],i=0;while(i<a.length){var j=i;while(j+1<a.length&&a[j+1]==a[j]+1)j++;r.push(j>i+1?a[i]+'-'+a[j]:a.slice(i,j+1).join(','));i=j+1}return r.join(',')}
$('txt').onchange=function(){
  picked={};$('txt').value.split(/[,\s]+/).forEach(function(p){
    var m=p.match(/^(\d+)(?:-(\d+))?$/);if(!m)return;var a=+m[1],b=m[2]?+m[2]:a;
    for(var x=a;x<=b;x++)if(x>=1&&x<=LS[li].items.length)picked[x-1]=1});draw()};
$('all').onclick=function(){picked={};LS[li].items.forEach(function(_,i){picked[i]=1});draw()};
$('none').onclick=function(){picked={};draw()};
$('stars').onclick=function(){picked={};LS[li].items.forEach(function(it,i){if(it.star)picked[i]=1});draw()};
$('rnd').onclick=function(){
  var n=+$('rn').value,idx=LS[li].items.map(function(_,i){return i});
  for(var i=idx.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=idx[i];idx[i]=idx[j];idx[j]=t}
  picked={};idx.slice(0,n).forEach(function(i){picked[i]=1});draw()};
function sel(){return Object.keys(picked).map(Number).sort(function(a,b){return a-b})}
function blanks(it){return esc(it.en).replace(/___\[([^\]]*)\]/g,function(m,b){return '<span class="bl">'+esc(b)+'</span>'})}
function answ(it){var k=0;return esc(it.en).replace(/___\[[^\]]*\]/g,function(){return '<b>'+esc(it.ans[k++])+'</b>'})}
function jj(it){if(!it.jj||!it.jj.length)return '';var h='<table>';(it.jj||[]).forEach(function(s){s.e.forEach(function(c,i){h+='<tr><td>'+esc(c)+'</td><td>'+esc(s.k[i]||'')+'</td></tr>'})});return h+'</table>'}
function detail(it){
  return '<div class="ans">'+answ(it)+'</div>'
   +(it.why?'<ul class="why">'+it.ans.map(function(a,j){return '<li><b>'+esc(a)+'</b> — '+esc(it.why[j]||'')+'</li>'}).join('')+'</ul>':'')
   +(it.jj&&it.jj.length?'<div class="sec">직독직해</div>'+jj(it):'');
}
var Q=[],qi=0,res={};
$('go').onclick=function(){
  var ks=sel();if(!ks.length){alert('번호를 먼저 선택하세요');return}
  if($('shuf').checked)for(var i=ks.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=ks[i];ks[i]=ks[j];ks[j]=t}
  Q=ks;qi=0;res={};$('setup').style.display='none';$('test').style.display='block';showQ()};
function showQ(){
  var t=$('test'),it=LS[li].items[Q[qi]];
  t.innerHTML='<div class="prog">'+G.grade+' '+G.pub+' '+LS[li].name+' · '+(qi+1)+' / '+Q.length+'문제 (본문 동사형 '+(Q[qi]+1)+'번)</div>'
   +'<div class="card"><div class="q">'+blanks(it)+'</div>'+($('hko').checked?'<div class="ko">'+esc(it.ko)+'</div>':'')+'<div id="dt" style="display:none">'+detail(it)+'</div></div>'
   +'<div id="a1"><button class="b" id="show">정답·직독직해 보기</button></div>'
   +'<div id="a2" class="row" style="display:none"><button class="b" id="nx">다음 문제 ▶</button></div>'
   +'<div style="margin-top:10px"><button class="g" id="pv">◀ 이전</button><button class="g" id="skip">건너뛰기 ▶</button><button class="g" id="end">종료</button></div>';
  $('show').onclick=function(){$('dt').style.display='block';$('a1').style.display='none';$('a2').style.display='flex'};
  $('nx').onclick=nx;
  $('pv').onclick=function(){if(qi>0){qi--;showQ()}};$('skip').onclick=nx;$('end').onclick=fin;
}
function nx(){if(qi<Q.length-1){qi++;showQ()}else fin()}
function fin(){$('test').style.display='none';$('setup').style.display='block'}
$('sheet').onclick=function(){
  var ks=sel();if(!ks.length){alert('번호를 먼저 선택하세요');return}
  var h='<div class="noprint"><button class="g" id="sb">◀ 돌아가기</button></div><h3>'+esc(G.grade+' '+G.pub+' '+LS[li].name)+' 동사형 선생님용 답안지</h3>';
  ks.forEach(function(i){var it=LS[li].items[i];h+='<div class="card"><b>'+(i+1)+'.</b> '+esc(it.ko)+detail(it)+'</div>'});
  $('sheetv').innerHTML=h;$('sheetv').style.display='block';$('setup').style.display='none';
  $('sb').onclick=function(){$('sheetv').style.display='none';$('setup').style.display='block'};
};
// 설정 복원
(function(){var s=ST.sel||{};
fill('lv',uniq(REG.map(function(r){return r.level})).map(function(x){return [x,x]}),s.lv);
fill('gr',uniq(REG.filter(function(r){return r.level==$('lv').value}).map(function(r){return r.grade})).map(function(g){return [g,g]}),s.gr);
onGr(s.id,s.ln)})();
if(ST.shuf!=null)$('shuf').checked=!!ST.shuf;if(ST.hko!=null)$('hko').checked=!!ST.hko;
$('shuf').onchange=saveSet;$('hko').onchange=saveSet;
</script></body></html>
