var DATA={"meta": {"sch": "geumcheon-go2", "src": "geumcheon-go2/L4/sx-data.js", "pidx": 4, "lesson": "4과", "title": "수리할 권리와 수리 카페", "label": "❺", "page": "yoyak-lian-z5"}, "scenes": [{"tag": "본문 1번", "ns": [1], "line": "프랑스 정부가 제조사에게 수리 가능성 [[index|지수]]를 붙이라는 법안을 [[passed|통과시켰다]].", "en": ["In January 2021, the French government passed a bill that requires that every manufacturer include a “repairability index” on five categories of electronic devices and electrical appliances: smartphones, laptops, washing machines, televisions, and lawn mowers."], "kos": ["2021년 1월, 프랑스 정부는 모든 제조사가 스마트폰, 노트북, 세탁기, 텔레비전, 그리고 잔디 깎는 기계라는 다섯 가지 종류의 전자 장치와 전자 기기에 ‘수리 가능성 지수’를 포함시킬 것을 요구하는 법안을 통과시켰다."]}, {"tag": "본문 3번", "ns": [3], "line": "점수는 수리 정보, 분해, 부품 가격 같은 [[elements|요소]]를 보고 매긴다.", "en": ["The index takes into account several elements, including the availability of repair information, the ease of disassembly, and the price of spare parts."], "kos": ["그 지수는 수리 정보의 이용 가능성, 분해의 용이성, 그리고 여분 부품의 가격을 포함하여 몇 가지 요소를 고려한다."]}, {"tag": "본문 5~7번", "ns": [5, 6, 7], "line": "이 지수는 두 가지 효과를 노리고 [[designed|만들어졌다]]. 소비자는 똑똑하게 고르고, 제조사는 고치기 쉬운 제품을 만들도록 [[encourages|장려받는다]].", "en": ["The index was designed to have two positive effects.", "Firstly, it allows consumers to make informed decisions when purchasing new devices and appliances.", "Secondly, it encourages manufacturers to make their products easier to repair."], "kos": ["그 지수는 두 가지의 긍정적인 효과를 가지도록 만들어졌다.", "첫 번째로, 그것은 소비자들이 새로운 장치와 기기를 구입할 때 정보에 근거한 결정을 내릴 수 있도록 한다.", "두 번째로, 그것은 제조사들이 자신의 제품을 수리하기 더 쉽게 만들도록 장려한다."]}, {"tag": "본문 8번", "ns": [8], "line": "버려지는 전자 제품이 줄어 지속 가능한 사회로의 [[transition|전환]]을 [[expect|기대할]] 수 있다.", "en": ["As a result, with fewer electronic and electrical items ending up in its landfills, France can expect to make a transition to a more sustainable society in the near future."], "kos": ["결과적으로, 더 적은 전자 및 전기 제품들이 쓰레기 매립지에 이르게 되면서, 프랑스는 가까운 미래에 더 지속 가능한 사회로 변화할 것을 기대할 수 있다."]}, {"tag": "본문 9~11번", "ns": [9, 10, 11], "line": "이 지수의 [[impact|영향]]은 프랑스 밖으로 퍼지고, 다른 나라들도 [[innovative|혁신적인]] 선례를 따를 수 있다.", "en": ["The impact of the index, however, is likely to spread far beyond France.", "We live in a global economy, and any company that wants to sell its appliances on the French market will need to label its products according to the repairability index.", "If the index is successful, we can anticipate seeing more countries around the world following France’s innovative lead."], "kos": ["하지만 그 지수의 영향은 프랑스를 넘어 더 멀리 퍼질 가능성이 있다.", "우리는 세계 경제 속에 살고 있으며, 프랑스 시장에서 기기를 판매하고 싶은 모든 회사는 그들의 제품에 수리 가능성 지수에 따라 라벨을 붙여야 할 것이다.", "만약 이 지수가 성공적이라면, 우리는 전 세계의 더 많은 나라들이 프랑스의 혁신적인 선례를 따르는 것을 보길 기대할 수 있다."]}], "story": [{"a": "pass", "form": "passed", "n": 1, "sq": 1, "sum": "France [[enacted]] a law requiring manufacturers", "hook": "프랑스 정부가 법안을 통과시켰다는 첫 문장의 passed(통과시켰다) → 요약문에서는 enacted(제정했다)로 바꿨어요.", "b": "enact", "k": "통과시키다 → 제정하다", "en": "In January 2021, the French government passed a bill that requires that every manufacturer include a “repairability index” on five categories of electronic devices and electrical appliances: smartphones, laptops, washing machines, televisions, and lawn mowers.", "ko": "2021년 1월, 프랑스 정부는 모든 제조사가 스마트폰, 노트북, 세탁기, 텔레비전, 그리고 잔디 깎는 기계라는 다섯 가지 종류의 전자 장치와 전자 기기에 ‘수리 가능성 지수’를 포함시킬 것을 요구하는 법안을 통과시켰다."}, {"a": "index", "form": "index", "n": 1, "sq": 1, "sum": "a repairability [[rating]] on five categories", "hook": "제품에 붙이는 수리 가능성 index(지수) → 요약문에서는 rating(등급)으로 바꿨어요.", "b": "rating", "k": "지수 → 등급, 평가", "en": "In January 2021, the French government passed a bill that requires that every manufacturer include a “repairability index” on five categories of electronic devices and electrical appliances: smartphones, laptops, washing machines, televisions, and lawn mowers.", "ko": "2021년 1월, 프랑스 정부는 모든 제조사가 스마트폰, 노트북, 세탁기, 텔레비전, 그리고 잔디 깎는 기계라는 다섯 가지 종류의 전자 장치와 전자 기기에 ‘수리 가능성 지수’를 포함시킬 것을 요구하는 법안을 통과시켰다."}, {"a": "element", "form": "elements", "n": 3, "sq": 2, "sum": "it considers several [[factors]], such as the availability", "hook": "수리 정보, 분해, 부품 가격 같은 elements(요소) → 요약문에서는 factors(요인)로 바꿨어요.", "b": "factor", "k": "요소 → 요인, 요소", "en": "The index takes into account several elements, including the availability of repair information, the ease of disassembly, and the price of spare parts.", "ko": "그 지수는 수리 정보의 이용 가능성, 분해의 용이성, 그리고 여분 부품의 가격을 포함하여 몇 가지 요소를 고려한다."}, {"a": "design", "form": "designed", "n": 5, "sq": 3, "sum": "The index was [[intended]] to have two positive effects", "hook": "두 가지 좋은 효과를 노리고 만들었다는 designed(설계되었다) → 요약문에서는 intended(의도되었다)로 바꿨어요.", "b": "intend", "k": "설계하다 → 의도하다", "en": "The index was designed to have two positive effects.", "ko": "그 지수는 두 가지의 긍정적인 효과를 가지도록 만들어졌다."}, {"a": "encourage", "form": "encourages", "n": 7, "sq": 3, "sum": "it [[motivates]] manufacturers to make products", "hook": "제조사가 고치기 쉬운 제품을 만들도록 북돋는 encourages(장려한다) → 요약문에서는 motivates(동기를 부여한다)로 바꿨어요.", "b": "motivate", "k": "장려하다 → 동기를 부여하다", "en": "Secondly, it encourages manufacturers to make their products easier to repair.", "ko": "두 번째로, 그것은 제조사들이 자신의 제품을 수리하기 더 쉽게 만들도록 장려한다."}, {"a": "expect", "form": "expect", "n": 8, "sq": 4, "sum": "France can [[anticipate]] a shift", "hook": "더 나은 사회를 바라볼 수 있다는 expect(기대하다) → 요약문에서는 anticipate(예상하다)로 바꿨어요.", "b": "anticipate", "k": "기대하다 → 예상하다, 기대하다", "en": "As a result, with fewer electronic and electrical items ending up in its landfills, France can expect to make a transition to a more sustainable society in the near future.", "ko": "결과적으로, 더 적은 전자 및 전기 제품들이 쓰레기 매립지에 이르게 되면서, 프랑스는 가까운 미래에 더 지속 가능한 사회로 변화할 것을 기대할 수 있다."}, {"a": "transition", "form": "transition", "n": 8, "sq": 4, "sum": "anticipate a [[shift]] to a more sustainable society", "hook": "지속 가능한 사회로 넘어가는 transition(전환) → 요약문에서는 shift(변화)로 바꿨어요.", "b": "shift", "k": "전환 → 변화, 전환", "en": "As a result, with fewer electronic and electrical items ending up in its landfills, France can expect to make a transition to a more sustainable society in the near future.", "ko": "결과적으로, 더 적은 전자 및 전기 제품들이 쓰레기 매립지에 이르게 되면서, 프랑스는 가까운 미래에 더 지속 가능한 사회로 변화할 것을 기대할 수 있다."}, {"a": "impact", "form": "impact", "n": 9, "sq": 5, "sum": "The [[influence]] of the index may spread", "hook": "프랑스를 넘어 퍼질 지수의 impact(영향) → 요약문에서는 influence(영향력)로 바꿨어요.", "b": "influence", "k": "영향 → 영향력", "en": "The impact of the index, however, is likely to spread far beyond France.", "ko": "하지만 그 지수의 영향은 프랑스를 넘어 더 멀리 퍼질 가능성이 있다."}, {"a": "innovative", "form": "innovative", "n": 11, "sq": 5, "sum": "its [[groundbreaking]] lead", "hook": "다른 나라가 따라 할 프랑스의 innovative(혁신적인) 선례 → 요약문에서는 groundbreaking(획기적인)으로 바꿨어요.", "b": "groundbreaking", "k": "혁신적인 → 획기적인", "en": "If the index is successful, we can anticipate seeing more countries around the world following France’s innovative lead.", "ko": "만약 이 지수가 성공적이라면, 우리는 전 세계의 더 많은 나라들이 프랑스의 혁신적인 선례를 따르는 것을 보길 기대할 수 있다."}], "passage": [{"n": 1, "en": "In January 2021, the French government passed a bill that requires that every manufacturer include a “repairability index” on five categories of electronic devices and electrical appliances: smartphones, laptops, washing machines, televisions, and lawn mowers.", "ko": "2021년 1월, 프랑스 정부는 모든 제조사가 스마트폰, 노트북, 세탁기, 텔레비전, 그리고 잔디 깎는 기계라는 다섯 가지 종류의 전자 장치와 전자 기기에 ‘수리 가능성 지수’를 포함시킬 것을 요구하는 법안을 통과시켰다."}, {"n": 2, "en": "Using a score ranging from 0 to 10, as well as a color-coded system, the index lets consumers see how easily the product can be repaired before they purchase it.", "ko": "그 지수는 색상으로 표시되는 시스템뿐만 아니라 0에서 10 사이의 점수도 사용하여 소비자들이 제품을 구입하기 전에 그것이 얼마나 쉽게 수리될 수 있는지 알 수 있게 해 준다."}, {"n": 3, "en": "The index takes into account several elements, including the availability of repair information, the ease of disassembly, and the price of spare parts.", "ko": "그 지수는 수리 정보의 이용 가능성, 분해의 용이성, 그리고 여분 부품의 가격을 포함하여 몇 가지 요소를 고려한다."}, {"n": 4, "en": "A low number on a bright red label means that repairing the product will be difficult, whereas a high number on a green label indicates that the product is easy to repair.", "ko": "초록색 라벨의 높은 숫자는 그 제품이 수리하기 쉽다는 것을 나타내는 데에 반하여, 밝은 빨간색 라벨의 낮은 숫자는 그 제품을 수리하는 것이 어려울 것이라는 것을 의미한다."}, {"n": 5, "en": "The index was designed to have two positive effects.", "ko": "그 지수는 두 가지의 긍정적인 효과를 가지도록 만들어졌다."}, {"n": 6, "en": "Firstly, it allows consumers to make informed decisions when purchasing new devices and appliances.", "ko": "첫 번째로, 그것은 소비자들이 새로운 장치와 기기를 구입할 때 정보에 근거한 결정을 내릴 수 있도록 한다."}, {"n": 7, "en": "Secondly, it encourages manufacturers to make their products easier to repair.", "ko": "두 번째로, 그것은 제조사들이 자신의 제품을 수리하기 더 쉽게 만들도록 장려한다."}, {"n": 8, "en": "As a result, with fewer electronic and electrical items ending up in its landfills, France can expect to make a transition to a more sustainable society in the near future.", "ko": "결과적으로, 더 적은 전자 및 전기 제품들이 쓰레기 매립지에 이르게 되면서, 프랑스는 가까운 미래에 더 지속 가능한 사회로 변화할 것을 기대할 수 있다."}, {"n": 9, "en": "The impact of the index, however, is likely to spread far beyond France.", "ko": "하지만 그 지수의 영향은 프랑스를 넘어 더 멀리 퍼질 가능성이 있다."}, {"n": 10, "en": "We live in a global economy, and any company that wants to sell its appliances on the French market will need to label its products according to the repairability index.", "ko": "우리는 세계 경제 속에 살고 있으며, 프랑스 시장에서 기기를 판매하고 싶은 모든 회사는 그들의 제품에 수리 가능성 지수에 따라 라벨을 붙여야 할 것이다."}, {"n": 11, "en": "If the index is successful, we can anticipate seeing more countries around the world following France’s innovative lead.", "ko": "만약 이 지수가 성공적이라면, 우리는 전 세계의 더 많은 나라들이 프랑스의 혁신적인 선례를 따르는 것을 보길 기대할 수 있다."}], "questions": [{"id": 1, "summary": "In January 2021, France (A) a law requiring manufacturers to include a repairability (B) on five categories of electronic products.", "ko": "2021년 1월, 프랑스는 제조사가 다섯 가지 종류의 전자 제품에 수리 가능성 <b>(B) 등급</b>을 포함하도록 요구하는 법을 <b>(A) 제정했다</b>.", "opts": [["enacted", "penalty"], ["rejected", "rating"], ["enacted", "rating"], ["rejected", "penalty"], ["postponed", "deadline"]], "optko": ["제정하다 – 벌금", "거부하다 – 등급", "제정하다 – 등급", "거부하다 – 벌금", "연기하다 – 기한"], "ans": 2, "wrong": ["penalty(벌금)가 틀려요. 제조사가 제품에 붙여야 하는 것은 벌금이 아니라 수리 가능성 지수(index)예요.", "rejected(거부하다)가 틀려요. 프랑스 정부는 법안을 거부한 게 아니라 통과시켰어요(passed).", null, "둘 다 틀려요. 법안을 거부하지 않았고, 붙이라고 한 것도 벌금이 아니에요.", "둘 다 틀려요. 법안을 연기한(postponed) 게 아니라 통과시켰고, 기한(deadline) 이야기도 본문에 없어요."], "evid": [{"n": 1, "hl": ["repairability index", "passed a bill"]}], "swaps": [["pass", "enact", "통과시키다 → 제정하다"], ["index", "rating", "지수 → 등급, 평가"], ["bill", "law", "법안 → 법"], ["devices", "products", "장치 → 제품"]], "swapnote": "pass a bill(법안을 통과시키다)은 시험에서 enact a law(법을 제정하다)로 바뀌어 나와요. index(지수)는 rating(등급)으로도 써요.", "use": [{"w": "enact", "ex": "The government enacted a new law to protect the sea.", "ko": "정부는 바다를 보호하기 위해 새 법을 제정했다.", "wk": "제정하다", "hk": "제정했다"}, {"w": "rating", "ex": "This restaurant has a high rating from visitors.", "ko": "이 식당은 방문객들에게 높은 평점을 받고 있다.", "wk": "등급, 평점", "hk": "평점"}], "flow": "본문 1번은 이 글의 출발점이에요. 2021년 1월에 프랑스 정부가 스마트폰, 노트북 같은 다섯 종류 제품에 수리 가능성 지수를 붙이게 하는 법안을 통과시켰어요.", "jd": [["In January 2021, France [[enacted]] a law", "2021년 1월, 프랑스는 법을 [[제정했다]]"], ["requiring manufacturers to include", "제조사가 포함하도록 요구하는"], ["a repairability [[rating]]", "수리 가능성 [[등급]]을"], ["on five categories of electronic products.", "다섯 가지 종류의 전자 제품에."]], "fc": [["본문 1번", "프랑스가 새 법안을 통과시켰다", "2021년 1월, 제조사에게 지수를 붙이라고 요구하는 법이에요."], ["대상", "스마트폰, 노트북, 세탁기, TV, 잔디 깎는 기계", "다섯 가지 전자 제품에 붙어요."], ["정답 포인트", "{{pass a bill|법안을 통과시키다}} = {{enact a law|법을 제정하다}}", "{{index|지수}} = {{rating|등급}}으로 바뀌어요."]], "evid_full": [{"en": "In January 2021, the French government passed a bill that requires that every manufacturer include a “repairability index” on five categories of electronic devices and electrical appliances: smartphones, laptops, washing machines, televisions, and lawn mowers.", "ko": "2021년 1월, 프랑스 정부는 모든 제조사가 스마트폰, 노트북, 세탁기, 텔레비전, 그리고 잔디 깎는 기계라는 다섯 가지 종류의 전자 장치와 전자 기기에 ‘수리 가능성 지수’를 포함시킬 것을 요구하는 법안을 통과시켰다.", "hl": ["repairability index", "passed a bill"], "hlko": ["수리 가능성 지수", function vHome(){
  var d=doneCount(),f=firstOpen();
  var h='<a class="tag" href="../index.html" style="text-decoration:none">목록</a><h1>'+DATA.meta.lesson+' '+esc(DATA.meta.title)+'</h1><p class="sub">요약문 연습 '+DATA.meta.label+' · '+Qs.length+'문제</p><div class="nums">';
  Qs.forEach(function(q,i){var a=PR.a[q.id];h+='<button class="nb '+(a===undefined?'':(a===q.ans?'o':'x'))+'" data-a="q" data-v="'+i+'">'+(i+1)+'</button>'});
  h+='</div>';
  h+=yyLine();
  h+='<button class="btn pri" data-a="resume">'+(d===0?'시작하기':(f<0?'결과 보기':'이어서 풀기 ('+d+' / '+Qs.length+')'))+'</button>';
  h+='<button class="btn sec" data-a="notes">단어노트 '+nNotes()+'개</button><button class="btn sec" data-a="sw">바꿔 말하기 연습</button>'+(nFlag()?'<button class="btn flagbtn" data-a="chk">선생님 확인 단어 '+nFlag()+'개</button>':'');
  h+='<div class="foot"><button data-a="reset">문제 다시 풀기</button></div>';
  return h;
}
function vQ(){
  var q=Qs[cur],a=PR.a[q.id],done=a!==undefined;curQ=q.id;
  var h='<div class="top"><button class="back" data-a="home">목록</button><button class="back" data-a="sw">바꿔 말하기</button><span class="cnt">'+(cur+1)+' / '+Qs.length+'</span></div>';
  if(!done)h+='<p class="hint">문장의 밑줄 단어를 누르면 뜻이 나와요. 보기를 누르면 답을 골라요.</p>';
  h+='<div class="card sum">'+sumHtml(q,done)+'</div><div class="opts">';
  q.opts.forEach(function(o,i){
    var cls='opt'+(done?' lock':'');
    if(done){if(i===q.ans)cls+=' right';else if(i===a)cls+=' mine'}
    h+='<div class="'+cls+'"'+(done?'':' data-a="pick" data-v="'+i+'"')+'><span class="num">'+CN[i]+'</span><span class="ot">'+(done?words(o[0]):esc(o[0]))+'<span class="dash">–</span>'+(done?words(o[1]):esc(o[1]))+'</span>'+(done&&i===q.ans?'<span class="st">정답</span>':(done&&i===a?'<span class="st">내 답</span>':''))+'</div>';
  });
  h+='</div>';
  if(done){
    var ok=a===q.ans;
    h+='<div id="exp"><div class="card"><div class="row"><span class="badge">'+(cur+1)+'번</span><span class="chip">정답 '+CN[q.ans]+'</span><span class="msg '+(ok?'o':'x')+'">'+(ok?'맞았어요':'내 답 '+CN[a])+'</span></div>';
    h+='</div><div class="card"><p class="lb">직독직해 (끊어서 앞에서부터 이해해요)</p>'+jdHtml(q)+'<details><summary>자연스러운 해석 보기</summary><div class="ko">'+q.ko.replace(/\((A|B)\)\s*/g,'')+'</div></details></div>';
    h+='<div class="card"><p class="lb">보기 뜻</p><ul class="opl">';
    q.opts.forEach(function(o,i){h+='<li class="'+(i===q.ans?'a':'')+'">'+CN[i]+' '+(i===q.ans?'<mark>'+words(o[0])+' – '+words(o[1])+'</mark>':words(o[0])+' – '+words(o[1]))+'<span class="k">'+(i===q.ans?'<mark>'+esc(q.optko[i])+'</mark>  ← 정답':esc(q.optko[i]))+'</span></li>'});
    h+='</ul></div>';
    h+='<div class="card"><p class="lb">정답의 근거 · 본문 '+q.evid_full.map(function(e){return e.n+'번'}).join(', ')+'</p>';
    q.evid_full.forEach(function(e){h+='<div class="ev"><div class="en">'+rich(e.en,e.hl)+'</div><div class="kk">'+richKo(e.ko,e.hlko)+'</div></div>'});
    h+='</div>';
    h+='<div class="card"><p class="lb">이 단어, 이렇게 바뀌었어요</p>';
    q.swaps.forEach(function(s){h+='<div class="swap"><span class="a">'+words(s[0])+'</span><span class="arr">→</span><span class="b">'+words(s[1])+'</span><span class="ds">'+esc(s[2])+(/\s/.test(s[0])||/\s/.test(s[1])?'':' '+sayBtn(s[0],'듣기')+' '+sayBtn(s[1],'듣기'))+'</span></div>'});
    h+='<div class="note">'+esc(q.swapnote)+'</div></div>';
    h+='<div class="card"><p class="lb">쓰임 익히기</p><div class="use">';
    q.use.forEach(function(u){h+='<div class="u"><div class="uw">'+esc(u.w)+'<small class="uwk">('+esc(u.wk)+')</small></div><div class="ue">'+useEx(u)+'</div><div class="uk">'+esc(u.ko).replace(esc(u.hk),'<mark>'+esc(u.hk)+'</mark>')+'</div></div>'});
    h+='</div></div>';
    h+='<div class="card"><p class="lb">기억할 흐름</p><div class="fc">'+q.fc.map(function(c,i){return (i?'<div class="ar">▼</div>':'')+'<div class="c'+(i===q.fc.length-1?' last':'')+'"><span class="tg">'+esc(c[0])+'</span><div class="hd">'+mk(c[1])+'</div><div class="sb2">'+mk(c[2])+'</div></div>'}).join('')+'</div></div>';
    h+='<div class="card"><details><summary>다른 보기는 왜 아닐까요</summary><ul style="padding:0;margin:6px 0 0">';
    q.wrong.forEach(function(w,i){if(w)h+='<li><b>'+CN[i]+'</b> '+hlp(w)+'</li>'});
    h+='</ul></details></div>';
    h+='<button class="btn pri" data-a="next">'+(cur<Qs.length-1?'다음 문제':'결과 보기')+'</button></div>';
  }
  return h;
}
function vRes(){
  var h='<div class="top"><button class="back" data-a="home">목록</button><button class="back" data-a="sw">바꿔 말하기</button></div><h1>'+Qs.length+'문제 중 '+okCount()+'문제 맞았어요</h1>';
  h+='<div class="nums">';
  Qs.forEach(function(q,i){var a=PR.a[q.id];h+='<button class="nb '+(a===undefined?'':(a===q.ans?'o':'x'))+'" data-a="q" data-v="'+i+'">'+(i+1)+'</button>'});
  h+='</div><p class="sub">단어노트에 '+nNotes()+'개가 쌓였어요.</p>';
  h+='<button class="btn pri" data-a="notes">단어노트 보기</button><button class="btn sec" data-a="reset">문제 다시 풀기</button><button class="btn sec" data-a="home">목록으로</button>';
  return h;
}
function sortedNotes(){return Object.keys(NOTES).map(function(k){return NOTES[k]}).sort(function(a,b){return b.t-a.t})}
function vNotes(){
  var L=sortedNotes();
  var h='<div class="top"><button class="back" data-a="home">목록</button><button class="back" data-a="sw">바꿔 말하기</button><span class="cnt">단어노트 '+L.length+'개</span></div>';
  if(!L.length)return h+'<div class="empty">밑줄 단어를 누르면 여기에 쌓여요.</div>';
  h+='<div class="card"><ul class="wl">';
  L.forEach(function(n){h+='<li><span class="lw">'+esc(n.l)+'</span><span class="lm">'+esc(n.k)+'</span>'+(n.c>1?'<span class="lc">'+n.c+'번</span>':'')+'<button class="rmw" data-a="rmnote" data-v="'+esc(n.l.toLowerCase())+'">빼기</button></li>'});
  return h+'</ul></div>';
}
function sk(id){return id.indexOf('sw:')===0?id.slice(3):id}
function wrongOf(id){var r=SRV[sk(id).toLowerCase()];return r&&r.c>0?r.c:0}
function flagList(){return Object.keys(SRV).map(function(k){return SRV[k]}).filter(function(r){return r.c>0}).sort(function(a,b){return b.c-a.c})}
function nFlag(){return flagList().length}
function srvLoad(){
  try{WN.list().then(function(r){
    if(!r||!r.ok||!r.items)return;SRV={};
    r.items.forEach(function(i){if(String(i.src||'').indexOf(SRC)>=0)SRV[String(i.w).toLowerCase()]={w:i.w,m:i.m,c:i.c||0}});
    if(view==='home'||view==='chk'||view==='sw')render();
  })}catch(e){}
}
function vChk(){
  var L=flagList();
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">선생님 확인 단어 '+L.length+'개</span></div>';
  if(!L.length)return h+'<div class="empty">틀린 단어가 없어요.</div>';
  h+='<p class="hint">선생님이 물어봤을 때 틀린 단어예요. 먼저 뜻을 떠올려 보고 확인해 보세요. 오답노트(H로드맵)에도 같이 있어요.</p><div class="card">';
  L.forEach(function(r){
    var id=r.w.toLowerCase(),o=swOpen['c'+id];
    h+='<div class="swr"><div class="swq"><span class="sa">'+esc(r.w)+'</span><span class="sb">'+(o?'<em>'+esc(r.m)+'</em>':'뜻은?')+'</span><small class="flag">'+r.c+'번 틀림</small><button data-a="rv" data-v="c'+esc(id)+'">'+(o?'가리기':'확인')+'</button></div></div>';
  });
  return h+'</div><a class="btn sec" style="display:block;text-align:center;text-decoration:none" href="https://nolbada.github.io/via/wn/">H로드맵 오답노트 열기</a>';
}
function sceneLine(t,cur){return esc(t).replace(/\[\[(\w+)\|([^\]]+)\]\]/g,function(m,w,k){return '<b class="wc'+(w.toLowerCase()===String(cur).toLowerCase()?' me':'')+'">'+w+'</b>('+k+')'})}
function vSw(){
  var L=swList(),sc={};
  (DATA.scenes||[]).forEach(function(c){(c.line.match(/\[\[\w+\|/g)||[]).forEach(function(m){sc[m.slice(2,-1).toLowerCase()]=c})});
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">바꿔 말하기 '+L.length+'개</span></div>';
  h+='<p class="hint">왼쪽 단어가 요약문에서 어떤 말로 바뀔까요? <b>소리 내어 말해 본 뒤</b> 확인을 눌러요.</p>';
  h+='<div class="tabs"><button data-a="rvall" data-v="open">모두 열기</button><button data-a="rvall" data-v="hide">모두 가리기</button></div><div class="card">';
  L.forEach(function(s){
    var o=swOpen[s.id],c=sc[s.form.toLowerCase()],on=swD['s'+s.id],fl=wrongOf(s.id);
    h+='<div class="swr"><div class="swq"><span class="sa">'+words(s.a)+(fl?'<small class="flag">'+fl+'번 틀림</small>':'')+'</span><span class="sb">'+(o?'<em>'+words(s.b)+'</em>'+esc(s.k):'→ ?')+'</span>'+sayBtn(s.a,'듣기')+(o?sayBtn(s.b,'정답 듣기'):'')+'<button data-a="rv" data-v="'+esc(s.id)+'">'+(o?'가리기':'확인')+'</button></div>';
    if(c)h+='<button class="acc2" data-a="dt" data-v="s'+esc(s.id)+'">'+esc(c.tag)+' 줄거리<span>'+(on?'접기':'펼치기')+'</span></button>'+(on?'<div class="story">'+sceneLine(c.line,s.form)+'</div>':'');
    h+='</div>';
  });
  return h+'</div><p class="sumline">시험에서는 본문 단어가 뜻이 같은 다른 단어로 바뀌어 나와요.</p>';
}
/* 자동 새로고침(기록 연동)이 일어나도 보던 문제로 되돌린다 */
try{var sv=JSON.parse(sessionStorage.getItem('vhyv')||'null');if(sv&&sv.p===location.pathname&&Date.now()-sv.t<600000&&sv.v&&sv.v!=='home'){view=sv.v;cur=sv.c||0;try{history.pushState({v:view},'');histPushed=true}catch(e){}}}catch(e){}
render();srvLoad();window.addEventListener('pageshow',srvLoad);
</script>
