var DATA={"meta": {"sch": "jusung-go2", "src": "common/sx-data-2610g2.js", "dir": "mock", "pidx": 5, "lesson": "26년 10월 30번", "title": "", "label": "", "page": "yoyak-2610-30"}, "scenes": [{"tag": "본문 1번", "ns": [1], "line": "한 연구가 비언어적 신호가 말보다 힘이 세다는 것을 [[confirmed|확인했다]].", "en": ["A study by Eva McMahan, professor of speech communication, confirmed the dominance of nonverbal signals."], "kos": ["발화 의사소통 교수인 Eva McMahan의 한 연구는 비언어적 신호들의 우위를 확인했다."]}, {"tag": "본문 2번", "ns": [2], "line": "말과 몸짓이 [[conflicting|서로 맞지 않는]] 상황에서 이 현상은 특히 [[pronounced|두드러졌다]].", "en": ["The phenomenon, however, was especially pronounced when adults found themselves in situations with conflicting messages (i.e., situations in which the contents of the verbal and nonverbal messages differ)."], "kos": ["그러나, 그 현상은 성인들이 모순되는 메시지들이 있는 상황, 즉 언어적 메시지와 비언어적 메시지의 내용들이 일치하지 않는 상황에 처해 있는 자신을 발견했을 때 특히 두드러졌다."]}, {"tag": "본문 3~4번", "ns": [3, 4], "line": "몸짓이 말과 맞지 않으면 남을 말로 [[manipulate|조종하려는]] [[attempts|시도]]는 실패하기 쉽다. 사람들은 몸짓을 더 [[trust|신뢰하기]] 때문이다.", "en": ["Attempts to manipulate another person verbally are therefore likely to fail if the accompanying nonverbal communication does not match the spoken message.", "This is because people trust nonverbal messages more than verbal ones."], "kos": ["그러므로 만약 동반되는 비언어적 의사소통이 발화된 메시지와 일치하지 않는다면 다른 사람을 언어적으로 조종하려는 시도는 실패할 가능성이 있다.", "이는 사람들이 비언어적 메시지들을 언어적인 것들보다 더 많이 신뢰하기 때문이다."]}, {"tag": "본문 5번", "ns": [5], "line": "함께 있어 즐겁다면서 눈길을 피하고 [[forcing|억지로]] 웃는 사람의 말은 덜 믿게 된다.", "en": ["When somebody tells you that they enjoy spending time with you, but you notice how they are looking away and are forcing a smile, you are probably less inclined to believe their words."], "kos": ["누군가가 여러분에게 그들이 여러분과 시간을 보내는 것을 즐긴다고 말하지만 그들이 눈길을 돌리고 억지웃음을 짓고 있는 모습을 여러분이 알아차리면 여러분은 아마도 그들의 말을 덜 믿게 될 것이다."]}, {"tag": "본문 6~7번", "ns": [6, 7], "line": "아팠다가 돌아왔는데 [[colleague|동료]]가 [[displeased|언짢은]] 표정으로 네 일을 맡아 즐거웠다고 하면, 그 말도 믿기 어렵다.", "en": ["The same is probably true when you are back at the office after a sickness and your colleague tells you with a displeased expression that they were happy to take over your workload.", "You might not believe that they enjoyed replacing you while you were gone."], "kos": ["여러분이 병이 나은 후 회사로 돌아갔을 때 여러분의 동료가 여러분의 업무량을 떠맡게 되어 즐거웠다고 언짢은 표정으로 여러분에게 말할 때에도 아마도 마찬가지일 것이다.", "여러분은 아마도 그들이 여러분이 없는 동안 여러분을 대신하기를 즐거워했다는 것을 믿지 않을 것이다."]}], "story": [{"a": "confirm", "form": "confirmed", "n": 1, "sq": 1, "sum": "A study [[proved]] the dominance", "hook": "연구가 비언어적 신호의 우위를 확인했다는 문장의 confirm(확인하다) → 요약문에서는 prove(증명하다)로 바꿨어요.", "b": "prove", "k": "확인하다 → 증명하다", "en": "A study by Eva McMahan, professor of speech communication, confirmed the dominance of nonverbal signals.", "ko": "발화 의사소통 교수인 Eva McMahan의 한 연구는 비언어적 신호들의 우위를 확인했다."}, {"a": "pronounced", "form": "pronounced", "n": 2, "sq": 1, "sum": "this effect was especially [[noticeable]]", "hook": "그 현상이 특히 두드러졌다는 문장의 pronounced(두드러진) → 요약문에서는 noticeable(눈에 띄는)로 바꿨어요.", "b": "noticeable", "k": "두드러진 → 눈에 띄는", "en": "The phenomenon, however, was especially pronounced when adults found themselves in situations with conflicting messages (i.e., situations in which the contents of the verbal and nonverbal messages differ).", "ko": "그러나, 그 현상은 성인들이 모순되는 메시지들이 있는 상황, 즉 언어적 메시지와 비언어적 메시지의 내용들이 일치하지 않는 상황에 처해 있는 자신을 발견했을 때 특히 두드러졌다."}, {"a": "conflict", "form": "conflicting", "n": 2, "sq": 1, "sum": "verbal and nonverbal messages [[clashed]]", "hook": "모순되는 메시지가 있는 상황이라는 문장의 conflict(모순되다) → 요약문에서는 clash(충돌하다)로 바꿨어요.", "b": "clash", "k": "모순되다 → 충돌하다", "en": "The phenomenon, however, was especially pronounced when adults found themselves in situations with conflicting messages (i.e., situations in which the contents of the verbal and nonverbal messages differ).", "ko": "그러나, 그 현상은 성인들이 모순되는 메시지들이 있는 상황, 즉 언어적 메시지와 비언어적 메시지의 내용들이 일치하지 않는 상황에 처해 있는 자신을 발견했을 때 특히 두드러졌다."}, {"a": "attempt", "form": "attempts", "n": 3, "sq": 2, "sum": "[[Trying]] to control others", "hook": "남을 말로 조종하려는 시도라는 문장의 attempt(시도) → 요약문에서는 try(시도하다)로 바꿨어요.", "b": "try", "k": "시도 → 시도하다", "en": "Attempts to manipulate another person verbally are therefore likely to fail if the accompanying nonverbal communication does not match the spoken message.", "ko": "그러므로 만약 동반되는 비언어적 의사소통이 발화된 메시지와 일치하지 않는다면 다른 사람을 언어적으로 조종하려는 시도는 실패할 가능성이 있다."}, {"a": "manipulate", "form": "manipulate", "n": 3, "sq": 2, "sum": "Trying to [[control]] others with words", "hook": "다른 사람을 말로 조종한다는 문장의 manipulate(조종하다) → 요약문에서는 control(조종하다)로 바꿨어요.", "b": "control", "k": "조종하다 → 조종하다", "en": "Attempts to manipulate another person verbally are therefore likely to fail if the accompanying nonverbal communication does not match the spoken message.", "ko": "그러므로 만약 동반되는 비언어적 의사소통이 발화된 메시지와 일치하지 않는다면 다른 사람을 언어적으로 조종하려는 시도는 실패할 가능성이 있다."}, {"a": "trust", "form": "trust", "n": 4, "sq": 2, "sum": "because people [[believe]] nonverbal messages", "hook": "사람들이 비언어적 메시지를 더 신뢰한다는 문장의 trust(신뢰하다) → 요약문에서는 believe(믿다)로 바꿨어요.", "b": "believe", "k": "신뢰하다 → 믿다", "en": "This is because people trust nonverbal messages more than verbal ones.", "ko": "이는 사람들이 비언어적 메시지들을 언어적인 것들보다 더 많이 신뢰하기 때문이다."}, {"a": "force", "form": "forcing", "n": 5, "sq": 3, "sum": "looks away and [[fakes]] a smile", "hook": "눈길을 돌리고 억지로 웃는다는 문장의 force(억지로 하다) → 요약문에서는 fake(~인 척하다)로 바꿨어요.", "b": "fake", "k": "억지로 하다 → ~인 척하다", "en": "When somebody tells you that they enjoy spending time with you, but you notice how they are looking away and are forcing a smile, you are probably less inclined to believe their words.", "ko": "누군가가 여러분에게 그들이 여러분과 시간을 보내는 것을 즐긴다고 말하지만 그들이 눈길을 돌리고 억지웃음을 짓고 있는 모습을 여러분이 알아차리면 여러분은 아마도 그들의 말을 덜 믿게 될 것이다."}, {"a": "colleague", "form": "colleague", "n": 6, "sq": 3, "sum": "or a [[coworker]] with", "hook": "동료가 언짢은 표정으로 말한다는 문장의 colleague(동료) → 요약문에서는 coworker(동료)로 바꿨어요.", "b": "coworker", "k": "동료 → 동료", "en": "The same is probably true when you are back at the office after a sickness and your colleague tells you with a displeased expression that they were happy to take over your workload.", "ko": "여러분이 병이 나은 후 회사로 돌아갔을 때 여러분의 동료가 여러분의 업무량을 떠맡게 되어 즐거웠다고 언짢은 표정으로 여러분에게 말할 때에도 아마도 마찬가지일 것이다."}, {"a": "displeased", "form": "displeased", "n": 6, "sq": 3, "sum": "with an [[unhappy]] expression", "hook": "언짢은 표정이라는 문장의 displeased(언짢은) → 요약문에서는 unhappy(언짢은)로 바꿨어요.", "b": "unhappy", "k": "언짢은 → 언짢은", "en": "The same is probably true when you are back at the office after a sickness and your colleague tells you with a displeased expression that they were happy to take over your workload.", "ko": "여러분이 병이 나은 후 회사로 돌아갔을 때 여러분의 동료가 여러분의 업무량을 떠맡게 되어 즐거웠다고 언짢은 표정으로 여러분에게 말할 때에도 아마도 마찬가지일 것이다."}], "passage": [{"n": 1, "en": "A study by Eva McMahan, professor of speech communication, confirmed the dominance of nonverbal signals.", "ko": "발화 의사소통 교수인 Eva McMahan의 한 연구는 비언어적 신호들의 우위를 확인했다."}, {"n": 2, "en": "The phenomenon, however, was especially pronounced when adults found themselves in situations with conflicting messages (i.e., situations in which the contents of the verbal and nonverbal messages differ).", "ko": "그러나, 그 현상은 성인들이 모순되는 메시지들이 있는 상황, 즉 언어적 메시지와 비언어적 메시지의 내용들이 일치하지 않는 상황에 처해 있는 자신을 발견했을 때 특히 두드러졌다."}, {"n": 3, "en": "Attempts to manipulate another person verbally are therefore likely to fail if the accompanying nonverbal communication does not match the spoken message.", "ko": "그러므로 만약 동반되는 비언어적 의사소통이 발화된 메시지와 일치하지 않는다면 다른 사람을 언어적으로 조종하려는 시도는 실패할 가능성이 있다."}, {"n": 4, "en": "This is because people trust nonverbal messages more than verbal ones.", "ko": "이는 사람들이 비언어적 메시지들을 언어적인 것들보다 더 많이 신뢰하기 때문이다."}, {"n": 5, "en": "When somebody tells you that they enjoy spending time with you, but you notice how they are looking away and are forcing a smile, you are probably less inclined to believe their words.", "ko": "누군가가 여러분에게 그들이 여러분과 시간을 보내는 것을 즐긴다고 말하지만 그들이 눈길을 돌리고 억지웃음을 짓고 있는 모습을 여러분이 알아차리면 여러분은 아마도 그들의 말을 덜 믿게 될 것이다."}, {"n": 6, "en": "The same is probably true when you are back at the office after a sickness and your colleague tells you with a displeased expression that they were happy to take over your workload.", "ko": "여러분이 병이 나은 후 회사로 돌아갔을 때 여러분의 동료가 여러분의 업무량을 떠맡게 되어 즐거웠다고 언짢은 표정으로 여러분에게 말할 때에도 아마도 마찬가지일 것이다."}, {"n": 7, "en": "You might not believe that they enjoyed replacing you while you were gone.", "ko": "여러분은 아마도 그들이 여러분이 없는 동안 여러분을 대신하기를 즐거워했다는 것을 믿지 않을 것이다."}], "questions": [{"id": 1, "summary": "A study (A) the dominance of nonverbal signals, and this effect was especially (B) when adults faced situations where verbal and nonverbal messages clashed.", "ko": "한 연구는 비언어적 신호의 우위를 <b>(A) 증명했고</b>, 이 현상은 성인들이 말과 비언어적 메시지가 서로 충돌하는 상황을 마주했을 때 특히 <b>(B) 눈에 띄었다</b>.", "opts": [["proved", "noticeable"], ["proved", "weak"], ["denied", "noticeable"], ["denied", "weak"], ["questioned", "rare"]], "optko": ["증명했다 – 눈에 띄는", "증명했다 – 약한", "부인했다 – 눈에 띄는", "부인했다 – 약한", "의문을 제기했다 – 드문"], "ans": 0, "wrong": [null, "weak(약한)가 틀려요. 본문 2번은 메시지가 서로 맞지 않는 상황에서 이 현상이 특히 두드러졌다(pronounced)고 해요.", "denied(부인했다)가 틀려요. 본문 1번은 연구가 비언어적 신호의 우위를 확인했다(confirmed)고 해요.", "둘 다 틀려요. 연구는 우위를 부인한 게 아니라 확인했고, 그 현상은 약해진 게 아니라 특히 두드러졌어요.", "둘 다 틀려요. 연구는 우위에 의문을 제기한(question) 게 아니라 확인했고, 현상은 드문(rare) 게 아니라 특히 두드러졌어요."], "evid": [{"n": 1, "hl": ["confirmed the dominance of nonverbal signals"]}, {"n": 2, "hl": ["especially pronounced", "situations with conflicting messages"]}], "swaps": [["confirm", "prove", "확인하다 → 증명하다"], ["pronounced", "noticeable", "두드러진 → 눈에 띄는"], ["conflict", "clash", "모순되다 → 충돌하다"]], "swapnote": "confirm(확인하다)은 prove(증명하다)로, pronounced(두드러진)는 noticeable(눈에 띄는)로, conflict(모순되다)는 clash(충돌하다)로 바뀌었어요.", "use": [{"w": "prove", "ex": "The test proved that he was right.", "ko": "그 시험은 그가 옳았다는 것을 증명했다.", "wk": "증명하다", "hk": "증명했다"}, {"w": "noticeable", "ex": "There was a noticeable change in her voice.", "ko": "그녀의 목소리에 눈에 띄는 변화가 있었다.", "wk": "눈에 띄는", "hk": "눈에 띄는"}], "flow": "본문 1번에서 한 연구가 비언어적 신호가 말보다 힘이 세다는 것을 확인했다고 하고, 2번에서 이 현상은 말과 몸짓이 서로 맞지 않는 상황에서 특히 두드러졌다고 이어요 function nNotes(){return Object.keys(NOTES).length}
function firstOpen(){for(var i=0;i<Qs.length;i++)if(PR.a[Qs[i].id]===undefined)return i;return -1}
function doneCount(){var n=0;Qs.forEach(function(q){if(PR.a[q.id]!==undefined)n++});return n}
function okCount(){var n=0;Qs.forEach(function(q){if(PR.a[q.id]===q.ans)n++});return n}
function hideSheet(){$('sheet').className=''}
var histPushed=false;
function go(v,i){
  if(i!==undefined)cur=i;
  if(v==='home'&&view!=='home'&&histPushed){histPushed=false;try{history.back();return}catch(e){}}
  if(v!=='home'&&view==='home'){try{history.pushState({v:v},'');histPushed=true}catch(e){}}
  view=v;try{if(v==='home')sessionStorage.removeItem('vhyv');else sessionStorage.setItem('vhyv',JSON.stringify({p:location.pathname,v:v,c:cur,t:Date.now()}))}catch(e){}
  hideSheet();window.__goTop=1;render();window.__goTop=0;window.scrollTo(0,0)
}
window.addEventListener('popstate',function(){histPushed=false;view='home';try{sessionStorage.removeItem('vhyv')}catch(e){}hideSheet();window.__goTop=1;render();window.__goTop=0;window.scrollTo(0,0)});
function sayBtn(){return ''}


/* 단어 누르기: 뜻을 보여 주고 단어노트에 자동으로 담는다 */
function tapWord(key){
  var g=G[key];if(!g)return;
  var lem=g[0],id=lem.toLowerCase();
  var n=NOTES[id]||{l:lem,k:g[1],c:0,t:0};
  n.c=(n.c||0)+1;n.t=Date.now();n.q=curQ;NOTES[id]=n;jset(K_NOTE,NOTES);
  if(!PUSHED['w:'+id]){PUSHED['w:'+id]=1;jset('vhvs:'+SCH,PUSHED);try{WN.add([{w:lem,m:g[1],src:SRC,how:'탭',ask:true}])}catch(e){}}
  $('sw').textContent=key.toLowerCase()===id?lem:key+'  →  '+lem;
  $('sl').textContent=g[1];
  $('sn').textContent='단어노트에 담았어요 (지금 '+nNotes()+'개)';
  $('sheet').className='on';
  document.querySelectorAll('.w[data-k]').forEach(function(e){var gg=G[e.getAttribute('data-k')];if(gg&&gg[0].toLowerCase()===id)e.classList.add('got')});
}
document.addEventListener('click',function(e){
  var w=e.target.closest&&e.target.closest('.w');
  if(w){e.stopPropagation();tapWord(w.getAttribute('data-k'));return}
  if(!(e.target.closest&&e.target.closest('#sheet')))hideSheet();
  var a=e.target.closest&&e.target.closest('[data-a]');
  if(!a)return;
  var act=a.getAttribute('data-a'),v=a.getAttribute('data-v');
  if(act==='home')go('home');
  else if(act==='q')go('q',+v);
  else if(act==='pick')pick(+v);
  else if(act==='rmnote'){var rid=String(v);var rn=NOTES[rid];delete NOTES[rid];jset(K_NOTE,NOTES);delete PUSHED['w:'+rid];jset('vhvs:'+SCH,PUSHED);try{WN.del(rn?rn.l:rid,SRC)}catch(x){}render()}
  else if(act==='next'){if(cur<Qs.length-1)go('q',cur+1);else go('res')}
  else if(act==='res')go('res');
  else if(act==='notes')go('notes');
  else if(act==='resume'){var f=firstOpen();if(f<0)go('res');else go('q',f)}
  else if(act==='reset'){PR={a:{}};jset(K_PROG,PR);go('home')}
  else if(act==='filt'){filt=v;render()}
  else if(act==='chk'){go('chk')}
  else if(act==='sw'){go('sw')}
  else if(act==='rvall'){var o=v==='open';swList().forEach(function(s){if(o){swOpen[s.id]=true;pushSw(s.id)}else delete swOpen[s.id]});render()}
  else if(act==='dt'){swD[v]=!swD[v];render()}
  else if(act==='rv'){swOpen[v]=!swOpen[v];if(swOpen[v])pushSw(v);render()}
  else if(act==='mean'){var m=document.getElementById('m_'+v);if(m)m.style.display=m.style.display==='block'?'none':'block'}
});
function pick(i){
  var q=Qs[cur];if(PR.a[q.id]!==undefined)return;
  PR.a[q.id]=i;jset(K_PROG,PR);recordYy(q,i);render();
}
/* 점수 기록: vhy:<학교> = {<페이지>:{<문제>:{n:푼 횟수,w:틀린 횟수,k:마지막 정답(1/0),c:고른 번호,t:시각}}} -> REC 로 자동 연동(선생님 화면) */
function recordYy(q,i){
  try{
    var K='vhy:'+SCH,P=location.pathname.split('/').slice(-2).join('/'),Y=jget(K,{});
    var pg=Y[P]||(Y[P]={}),e=pg[q.id]||(pg[q.id]={n:0,w:0});
    e.n=(e.n||0)+1;if(i!==q.ans)e.w=(e.w||0)+1;e.k=(i===q.ans?1:0);e.c=i;e.t=Date.now();
    jset(K,Y);
  }catch(x){}
  /* 바꿔 말하기 단어는 푼 즉시 모두 선생님 질문 목록에 올린다 */
  try{swList().forEach(function(s){pushSw(s.id)})}catch(x){}
}


function jdHtml(q){
  var h='<div class="sl">';
  q.jd.forEach(function(c){
    var en=c[0].split(/(\[\[.*?\]\])/).map(function(s){var m=s.match(/^\[\[(.*)\]\]$/);return m?'<mark>'+words(m[1])+'</mark>':words(s)}).join('');
    var ko=c[1].split(/(\[\[.*?\]\])/).map(function(s){var m=s.match(/^\[\[(.*)\]\]$/);return m?'<mark>'+esc(m[1])+'</mark>':esc(s)}).join('');
    h+='<div class="r"><b>'+en+'</b><span>'+ko+'</span></div>';
  });
  return h+'</div>';
}
function pushSw(id){return; /* 바꿔 말하기 단어는 선생님 질문 목록에 따로 올리지 않는다: 학생 목록 = 선생님 열람 목록 */
  if(String(id).indexOf('c')===0&&!/^sw:/.test(id))return;
  var s=swList().filter(function(x){return x.id===id})[0];if(!s||PUSHED[id])return;
  PUSHED[id]=1;jset('vhvs:'+SCH,PUSHED);
  try{WN.add([{w:s.a,m:s.k+' → '+s.b,src:SRC,how:'바꿔 말하기',ask:true}])}catch(e){}
}
function swList(){
  var L=(DATA.story||[]).map(function(s){return {a:s.a,form:s.form,b:s.b,k:s.k,id:'sw:'+s.a.toLowerCase(),n:s.n,sq:s.sq,sum:s.sum,hook:s.hook,en:s.en,ko:s.ko}}),seen={};
  L.forEach(function(s){seen[s.a.toLowerCase()]=1});
  /* 모든 문제의 '이 단어, 이렇게 바뀌었어요' 단어도 빠짐없이 바꿔 말하기 연습에 넣는다 */
  Qs.forEach(function(q,qi){(q.swaps||[]).forEach(function(w){var k=String(w[0]).toLowerCase();if(seen[k])return;seen[k]=1;L.push({a:w[0],form:w[0],b:w[1],k:w[2],id:'sw:'+k,n:0,sq:qi+1,sum:'',hook:'',en:'',ko:''})})});
  return L.map(function(s,i){return {s:s,i:i}}).sort(function(x,y){return (x.s.sq-y.s.sq)||(x.i-y.i)}).map(function(x){return x.s});
}
function hlWord(t,w){return t.split(new RegExp('(\\b'+w+'\\b)','i')).map(function(x,i){return i%2?'<mark>'+esc(x)+'</mark>':words(x)}).join('')}
function hlSum(t){return t.split(/(\[\[.*?\]\])/).map(function(x){var m=x.match(/^\[\[(.*)\]\]$/);return m?'<mark>'+words(m[1])+'</mark>':words(x)}).join('')}
var swOpen={},swD={};
/* 화면 */
function render(){
  var h='';
  if(view==='home')h=vHome();else if(view==='q')h=vQ();else if(view==='res')h=vRes();else if(view==='notes')h=vNotes();else if(view==='sw')h=vSw();else if(view==='chk')h=vChk();else h=vHome();
  var y=window.pageYOffset||0;
  $('app').innerHTML=h;
  if(!window.__goTop)window.scrollTo(0,y);
}
function yyLine(){
  try{var Y=jget('vhy:'+SCH,{}),pg=Y[location.pathname.split('/').slice(-2).join('/')]||{},n=0,r=0,w=0;
    Qs.forEach(function(q){var e=pg[q.id];if(e&&e.n){n++;if(e.k)r++;w+=e.w||0}});
    if(!n)return '';
    return '<p class="sub">내 기록: '+n+'문제 중 '+r+'문제 정답'+(w?' · 틀린 횟수 '+w+'번':'')+'</p>';
  }catch(x){return ''}
}
function vHome(){
  var d=doneCount(),f=firstOpen();
  var h='<a class="tag" href="../yoyak.html" style="text-decoration:none">목록</a><h1>'+DATA.meta.lesson+' '+esc(DATA.meta.title)+'</h1><p class="sub">요약문 연습 '+DATA.meta.label+' · '+Qs.length+'문제</p><div class="nums">';
  Qs.forEach(function(q,i){var a=PR.a[q.id];h+='<button class="nb '+(a===undefined?'':(a===q.ans?'o':'x'))+'" data-a="q" data-v="'+i+'">'+(i+1)+'</button>'});
  h+='</div>';
  h+=yyLine();
  h+='<button class="btn pri" data-a="resume">'+(d===0?'시작하기':(f<0?'결과 보기':'이어서 풀기 ('+d+' / '+Qs.length+')'))+'</button>';
  h+='<button class="btn sec" data-a="notes">단어노트 '+nNotes()+'개</button><button class="btn sec" data-a="sw">바꿔 말하기 연습</button>'+(nFlag()?'<button class="btn flagbtn" data-a="chk">선생님 확인 단어 '+nFlag()+'개</button>':'');
  h+='<div class="foot"><button data-a="reset">문제 다시 풀기</button></div>';
  return h;
}
function vQ(){
  var q=Qs[cur],a=PR.a[q.id],done=a!==undefined;curQ=q.id;
  var h='<div class="top"><button class="back" data-a="home">목록</button><button class="back" data-a="sw">바꿔 말하기</button><span class="cnt">'+(cur+1)+' / '+Qs.length+'</span></div>';
  if(!done)h+='<p class="hint">문장의 밑줄 단어를 누르면 뜻이 나와요. 보기를 누르면 답을 골라요.</p>';
  h+='<div class="card sum">'+sumHtml(q,done)+'</div><div class="opts">';
  q.opts.forEach(function(o,i){
    var cls='opt'+(done?' lock':'');
    if(done){if(i===q.ans)cls+=' right';else if(i===a)cls+=' mine'}
    h+='<div class="'+cls+'"'+(done?'':' data-a="pick" data-v="'+i+'"')+'><span class="num">'+CN[i]+'</span><span class="ot">'+(done?words(o[0]):esc(o[0]))+'<span class="dash">–</span>'+(done?words(o[1]):esc(o[1]))+'</span>'+(done&&i===q.ans?'<span class="st">정답</span>':(done&&i===a?'<span class="st">내 답</span>':''))+'</div>';
  });
  h+='</div>';
  if(done){
    var ok=a===q.ans;
    h+='<div id="exp"><div class="card"><div class="row"><span class="badge">'+(cur+1)+'번</span><span class="chip">정답 '+CN[q.ans]+'</span><span class="msg '+(ok?'o':'x')+'">'+(ok?'맞았어요':'내 답 '+CN[a])+'</span></div>';
    h+='</div><div class="card"><p class="lb">직독직해 (끊어서 앞에서부터 이해해요)</p>'+jdHtml(q)+'<details><summary>자연스러운 해석 보기</summary><div class="ko">'+q.ko.replace(/\((A|B)\)\s*/g,'')+'</div></details></div>';
    h+='<div class="card"><p class="lb">보기 뜻</p><ul class="opl">';
    q.opts.forEach(function(o,i){h+='<li class="'+(i===q.ans?'a':'')+'">'+CN[i]+' '+(i===q.ans?'<mark>'+words(o[0])+' – '+words(o[1])+'</mark>':words(o[0])+' – '+words(o[1]))+'<span class="k">'+(i===q.ans?'<mark>'+esc(q.optko[i])+'</mark>  ← 정답':esc(q.optko[i]))+'</span></li>'});
    h+='</ul></div>';
    h+='<div class="card"><p class="lb">정답의 근거 · 본문 '+q.evid_full.map(function(e){return e.n+'번'}).join(', ')+'</p>';
    q.evid_full.forEach(function(e){h+='<div class="ev"><div class="en">'+rich(e.en,e.hl)+'</div><div class="kk">'+richKo(e.ko,e.hlko)+'</div></div>'});
    h+='</div>';
    h+='<div class="card"><p class="lb">이 단어, 이렇게 바뀌었어요</p>';
    q.swaps.forEach(function(s){h+='<div class="swap"><span class="a">'+words(s[0])+'</span><span class="arr">→</span><span class="b">'+words(s[1])+'</span><span class="ds">'+esc(s[2])+(/\s/.test(s[0])||/\s/.test(s[1])?'':' '+sayBtn(s[0],'듣기')+' '+sayBtn(s[1],'듣기'))+'</span></div>'});
    h+='<div class="note">'+esc(q.swapnote)+'</div></div>';
    h+='<div class="card"><p class="lb">쓰임 익히기</p><div class="use">';
    q.use.forEach(function(u){h+='<div class="u"><div class="uw">'+esc(u.w)+'<small class="uwk">('+esc(u.wk)+')</small></div><div class="ue">'+useEx(u)+'</div><div class="uk">'+esc(u.ko).replace(esc(u.hk),'<mark>'+esc(u.hk)+'</mark>')+'</div></div>'});
    h+='</div></div>';
    h+='<div class="card"><p class="lb">기억할 흐름</p><div class="fc">'+q.fc.map(function(c,i){return (i?'<div class="ar">▼</div>':'')+'<div class="c'+(i===q.fc.length-1?' last':'')+'"><span class="tg">'+esc(c[0])+'</span><div class="hd">'+mk(c[1])+'</div><div class="sb2">'+mk(c[2])+'</div></div>'}).join('')+'</div></div>';
    h+='<div class="card"><details><summary>다른 보기는 왜 아닐까요</summary><ul style="padding:0;margin:6px 0 0">';
    q.wrong.forEach(function(w,i){if(w)h+='<li><b>'+CN[i]+'</b> '+hlp(w)+'</li>'});
    h+='</ul></details></div>';
    h+='<button class="btn pri" data-a="next">'+(cur<Qs.length-1?'다음 문제':'결과 보기')+'</button></div>';
  }
  return h;
}
function vRes(){
  var h='<div class="top"><button class="back" data-a="home">목록</button><button class="back" data-a="sw">바꿔 말하기</button></div><h1>'+Qs.length+'문제 중 '+okCount()+'문제 맞았어요</h1>';
  h+='<div class="nums">';
  Qs.forEach(function(q,i){var a=PR.a[q.id];h+='<button class="nb '+(a===undefined?'':(a===q.ans?'o':'x'))+'" data-a="q" data-v="'+i+'">'+(i+1)+'</button>'});
  h+='</div><p class="sub">단어노트에 '+nNotes()+'개가 쌓였어요.</p>';
  h+='<button class="btn pri" data-a="notes">단어노트 보기</button><button class="btn sec" data-a="reset">문제 다시 풀기</button><button class="btn sec" data-a="home">목록으로</button>';
  return h;
}
function sortedNotes(){return Object.keys(NOTES).map(function(k){return NOTES[k]}).sort(function(a,b){return b.t-a.t})}
function vNotes(){
  var L=sortedNotes();
  var h='<div class="top"><button class="back" data-a="home">목록</button><button class="back" data-a="sw">바꿔 말하기</button><span class="cnt">단어노트 '+L.length+'개</span></div>';
  if(!L.length)return h+'<div class="empty">밑줄 단어를 누르면 여기에 쌓여요.</div>';
  h+='<div class="card"><ul class="wl">';
  L.forEach(function(n){h+='<li><span class="lw">'+esc(n.l)+'</span><span class="lm">'+esc(n.k)+'</span>'+(n.c>1?'<span class="lc">'+n.c+'번</span>':'')+'<button class="rmw" data-a="rmnote" data-v="'+esc(n.l.toLowerCase())+'">빼기</button></li>'});
  return h+'</ul></div>';
}
function sk(id){return id.indexOf('sw:')===0?id.slice(3):id}
function wrongOf(id){var r=SRV[sk(id).toLowerCase()];return r&&r.c>0?r.c:0}
function flagList(){return Object.keys(SRV).map(function(k){return SRV[k]}).filter(function(r){return r.c>0}).sort(function(a,b){return b.c-a.c})}
function nFlag(){return flagList().length}
function srvLoad(){
  try{WN.list().then(function(r){
    if(!r||!r.ok||!r.items)return;SRV={};
    r.items.forEach(function(i){if(String(i.src||'').indexOf(SRC)>=0)SRV[String(i.w).toLowerCase()]={w:i.w,m:i.m,c:i.c||0}});
    if(view==='home'||view==='chk'||view==='sw')render();
  })}catch(e){}
}
function vChk(){
  var L=flagList();
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">선생님 확인 단어 '+L.length+'개</span></div>';
  if(!L.length)return h+'<div class="empty">틀린 단어가 없어요.</div>';
  h+='<p class="hint">선생님이 물어봤을 때 틀린 단어예요. 먼저 뜻을 떠올려 보고 확인해 보세요. 오답노트(H로드맵)에도 같이 있어요.</p><div class="card">';
  L.forEach(function(r){
    var id=r.w.toLowerCase(),o=swOpen['c'+id];
    h+='<div class="swr"><div class="swq"><span class="sa">'+esc(r.w)+'</span><span class="sb">'+(o?'<em>'+esc(r.m)+'</em>':'뜻은?')+'</span><small class="flag">'+r.c+'번 틀림</small><button data-a="rv" data-v="c'+esc(id)+'">'+(o?'가리기':'확인')+'</button></div></div>';
  });
  return h+'</div><a class="btn sec" style="display:block;text-align:center;text-decoration:none" href="https://nolbada.github.io/via/wn/">H로드맵 오답노트 열기</a>';
}
function sceneLine(t,cur){return esc(t).replace(/\[\[(\w+)\|([^\]]+)\]\]/g,function(m,w,k){return '<b class="wc'+(w.toLowerCase()===String(cur).toLowerCase()?' me':'')+'">'+w+'</b>('+k+')'})}
function vSw(){
  var L=swList(),sc={};
  (DATA.scenes||[]).forEach(function(c){(c.line.match(/\[\[\w+\|/g)||[]).forEach(function(m){sc[m.slice(2,-1).toLowerCase()]=c})});
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">바꿔 말하기 '+L.length+'개</span></div>';
  h+='<p class="hint">왼쪽 단어가 요약문에서 어떤 말로 바뀔까요? <b>소리 내어 말해 본 뒤</b> 확인을 눌러요.</p>';
  h+='<div class="tabs"><button data-a="rvall" data-v="open">모두 열기</button><button data-a="rvall" data-v="hide">모두 가리기</button></div><div class="card">';
  L.forEach(function(s){
    var o=swOpen[s.id],c=sc[s.form.toLowerCase()],on=swD['s'+s.id],fl=wrongOf(s.id);
    h+='<div class="swr"><div class="swq"><span class="qn">'+s.sq+'번</span><span class="sa">'+words(s.a)+(fl?'<small class="flag">'+fl+'번 틀림</small>':'')+'</span><span class="sb">'+(o?'<em>'+words(s.b)+'</em>'+esc(s.k):'→ ?')+'</span>'+sayBtn(s.a,'듣기')+(o?sayBtn(s.b,'정답 듣기'):'')+'<button data-a="rv" data-v="'+esc(s.id)+'">'+(o?'가리기':'확인')+'</button></div>';
    if(c)h+='<button class="acc2" data-a="dt" data-v="s'+esc(s.id)+'">'+esc(c.tag)+' 줄거리<span>'+(on?'접기':'펼치기')+'</span></button>'+(on?'<div class="story">'+sceneLine(c.line,s.form)+'</div>':'');
    h+='</div>';
  });
  return h+'</div><p class="sumline">시험에서는 본문 단어가 뜻이 같은 다른 단어로 바뀌어 나와요.</p>';
}
/* 자동 새로고침(기록 연동)이 일어나도 보던 문제로 되돌린다 */
try{var sv=JSON.parse(sessionStorage.getItem('vhyv')||'null');if(sv&&sv.p===location.pathname&&Date.now()-sv.t<600000&&sv.v&&sv.v!=='home'){view=sv.v;cur=sv.c||0;try{history.pushState({v:view},'');histPushed=true}catch(e){}}}catch(e){}
render();srvLoad();window.addEventListener('pageshow',srvLoad);
</script>
</body>
</html>
