<script>
var DATA={"meta": {"sch": "jusung-go2", "src": "common/sx-data-2610g2.js", "dir": "mock", "pidx": 12, "lesson": "26년 10월 37번", "title": "", "label": "", "page": "yoyak-2610-37"}, "scenes": [{"tag": "본문 1번", "ns": [1], "line": "재평가는 감정을 [[regulating|조절하는]] 데 특히 [[effective|효과적인]] 방법이다. 감정을 [[root|뿌리]]부터 [[transforms|바꾸기]] 때문이다.", "en": ["Reappraisal ― changing the way one thinks about emotional situations ― might present a particularly effective avenue to regulating emotions because it transforms emotions at their root."], "kos": ["재평가, 즉 누군가가 감정적인 상황들에 대해 생각하는 방식을 바꾸는 것은 그것이 감정을 본질적으로 변화시키기 때문에 감정을 조절하는 데 특히 효과적인 방법을 제공할지도 모른다."]}, {"tag": "본문 2~3번", "ns": [2, 3], "line": "이혼은 보통 [[adverse|부정적인]] 사건이지만 여러 방식으로 [[construed|해석될]] 수 있다.", "en": ["Take, for example, someone who is going through a divorce.", "This is often an adverse event, and yet, it can be construed in different ways."], "kos": ["예를 들어, 이혼을 겪고 있는 누군가를 생각해 보자.", "이것은 보통 부정적인 사건이지만, 그럼에도 불구하고 그것은 다른 방식들로 해석될 수 있다."]}, {"tag": "본문 4~5번", "ns": [4, 5], "line": "가족에게 평생 흔적을 남길 [[overpowering|강렬한]] 상실로 볼 수도 있고, 고통스럽지만 장기적으로 좋은 [[outcomes|결과]]로 이어질 일로 볼 수도 있다.", "en": ["One might view it as an overpowering loss that will mark one's family for life.", "Alternatively, one might see it as something that is painful but that might lead to positive outcomes in the long run, such as improved relationships."], "kos": ["누군가는 그것을 자신의 가족에게 평생 흔적을 남길 강렬한 상실로 여길지도 모른다.", "이와는 달리, 누군가는 그것을 고통스럽기는 하지만 개선된 관계와 같이 장기적으로는 긍정적인 결과로 이어질 수 있는 일로 여길지도 모른다."]}, {"tag": "본문 6~8번", "ns": [6, 7, 8], "line": "해석이 다르면 감정도 다르다. 첫 번째는 [[intense|강렬한]] 슬픔과 분노, 두 번째는 더 낮은 강도다.", "en": ["As a result of these different construals, one might feel different emotions.", "The first construal may bring intense sadness and anger.", "The second construal might also bring sadness and anger but perhaps at lower levels."], "kos": ["이러한 다른 해석들의 결과로서 누군가는 다른 감정들을 느낄지도 모른다.", "첫 번째 해석은 강렬한 슬픔과 분노를 불러올 수 있다.", "두 번째 해석 역시 슬픔과 분노를 불러올지도 모르지만, 아마도 더 낮은 강도로 그러할지도 모른다."]}, {"tag": "본문 9번", "ns": [9], "line": "결정적으로 희망, 강인함, [[gratitude|감사]] 같은 [[positive|긍정적인]] 감정도 불러올 수 있다.", "en": ["Crucially, it might also bring some positive emotions, such as hope, strength, or gratitude."], "kos": ["결정적으로 그것은 희망, 강인함 또는 감사함과 같은 어떤 긍정적인 감정들 또한 불러올지도 모른다."]}, {"tag": "본문 10~12번", "ns": [10, 11, 12], "line": "짧은 반응이 반복되면 [[accumulate|쌓여]] 심리적 건강을 만든다. 그래서 회복 탄력성의 [[key|열쇠]]가 될 수 있다.", "en": ["This example illustrates how reappraisal might powerfully transform short-term emotional responses.", "When repeated over time, these short-term emotional consequences of reappraisal might accumulate to shape people's psychological health.", "Thereby, reappraisal might be a key to resilience."], "kos": ["이 예시는 재평가가 어떻게 단기적인 감정적 반응들을 강력하게 변화시킬 수 있을지를 보여 준다.", "오랫동안 반복되면, 재평가의 이러한 단기적인 감정적 결과들이 축적되어 사람들의 심리적 건강을 형성할지도 모른다.", "그렇게 함으로써 재평가는 회복 탄력성의 해답이 될지도 모른다."]}], "story": [{"a": "effective", "form": "effective", "n": 1, "sq": 1, "sum": "an especially [[powerful]] way", "hook": "재평가가 감정 조절에 효과적인 방법이라는 문장의 effective(효과적인) → 요약문에서는 powerful(강력한)로 바꿨어요.", "b": "powerful", "k": "효과적인 → 강력한", "en": "Reappraisal ― changing the way one thinks about emotional situations ― might present a particularly effective avenue to regulating emotions because it transforms emotions at their root.", "ko": "재평가, 즉 누군가가 감정적인 상황들에 대해 생각하는 방식을 바꾸는 것은 그것이 감정을 본질적으로 변화시키기 때문에 감정을 조절하는 데 특히 효과적인 방법을 제공할지도 모른다."}, {"a": "regulate", "form": "regulating", "n": 1, "sq": 1, "sum": "way to [[control]] emotions", "hook": "감정을 조절하는 방법이라는 문장의 regulate(조절하다) → 요약문에서는 control(조절하다)로 바꿨어요.", "b": "control", "k": "조절하다 → 조절하다", "en": "Reappraisal ― changing the way one thinks about emotional situations ― might present a particularly effective avenue to regulating emotions because it transforms emotions at their root.", "ko": "재평가, 즉 누군가가 감정적인 상황들에 대해 생각하는 방식을 바꾸는 것은 그것이 감정을 본질적으로 변화시키기 때문에 감정을 조절하는 데 특히 효과적인 방법을 제공할지도 모른다."}, {"a": "transform", "form": "transforms", "n": 1, "sq": 1, "sum": "because it [[changes]] feelings", "hook": "감정을 본질적으로 변화시킨다는 문장의 transform(변화시키다) → 요약문에서는 change(바꾸다)로 바꿨어요.", "b": "change", "k": "변화시키다 → 바꾸다", "en": "Reappraisal ― changing the way one thinks about emotional situations ― might present a particularly effective avenue to regulating emotions because it transforms emotions at their root.", "ko": "재평가, 즉 누군가가 감정적인 상황들에 대해 생각하는 방식을 바꾸는 것은 그것이 감정을 본질적으로 변화시키기 때문에 감정을 조절하는 데 특히 효과적인 방법을 제공할지도 모른다."}, {"a": "root", "form": "root", "n": 1, "sq": 1, "sum": "at their [[source]]", "hook": "감정을 뿌리에서 바꾼다는 문장의 root(뿌리) → 요약문에서는 source(근원)로 바꿨어요.", "b": "source", "k": "뿌리 → 근원", "en": "Reappraisal ― changing the way one thinks about emotional situations ― might present a particularly effective avenue to regulating emotions because it transforms emotions at their root.", "ko": "재평가, 즉 누군가가 감정적인 상황들에 대해 생각하는 방식을 바꾸는 것은 그것이 감정을 본질적으로 변화시키기 때문에 감정을 조절하는 데 특히 효과적인 방법을 제공할지도 모른다."}, {"a": "adverse", "form": "adverse", "n": 3, "sq": 2, "sum": "often a [[harmful]] event", "hook": "이혼은 보통 부정적인 사건이라는 문장의 adverse(부정적인) → 요약문에서는 harmful(해로운)로 바꿨어요.", "b": "harmful", "k": "부정적인 → 해로운", "en": "This is often an adverse event, and yet, it can be construed in different ways.", "ko": "이것은 보통 부정적인 사건이지만, 그럼에도 불구하고 그것은 다른 방식들로 해석될 수 있다."}, {"a": "construe", "form": "construed", "n": 3, "sq": 2, "sum": "one can [[regard]] it", "hook": "다른 방식으로 해석될 수 있다는 문장의 construe(해석하다) → 요약문에서는 regard(여기다)로 바꿨어요.", "b": "regard", "k": "해석하다 → 여기다", "en": "This is often an adverse event, and yet, it can be construed in different ways.", "ko": "이것은 보통 부정적인 사건이지만, 그럼에도 불구하고 그것은 다른 방식들로 해석될 수 있다."}, {"a": "overpowering", "form": "overpowering", "n": 4, "sq": 2, "sum": "as a [[crushing]] loss for the family", "hook": "가족에게 평생 흔적을 남길 강렬한 상실이라는 문장의 overpowering(강렬한) → 요약문에서는 crushing(큰 타격을 주는)으로 바꿨어요.", "b": "crushing", "k": "강렬한 → 큰 타격을 주는", "en": "One might view it as an overpowering loss that will mark one's family for life.", "ko": "누군가는 그것을 자신의 가족에게 평생 흔적을 남길 강렬한 상실로 여길지도 모른다."}, {"a": "outcome", "form": "outcomes", "n": 5, "sq": 2, "sum": "lead to good [[results]] over time", "hook": "장기적으로 긍정적인 결과로 이어질 수 있다는 문장의 outcome(결과) → 요약문에서는 result(결과)로 바꿨어요.", "b": "result", "k": "결과 → 결과", "en": "Alternatively, one might see it as something that is painful but that might lead to positive outcomes in the long run, such as improved relationships.", "ko": "이와는 달리, 누군가는 그것을 고통스럽기는 하지만 개선된 관계와 같이 장기적으로는 긍정적인 결과로 이어질 수 있는 일로 여길지도 모른다."}, {"a": "intense", "form": "intense", "n": 7, "sq": 3, "sum": "brings [[strong]] sadness and anger", "hook": "첫 번째 해석이 강렬한 슬픔과 분노를 불러온다는 문장의 intense(강렬한) → 요약문에서는 strong(강한)으로 바꿨어요.", "b": "strong", "k": "강렬한 → 강한", "en": "The first construal may bring intense sadness and anger.", "ko": "첫 번째 해석은 강렬한 슬픔과 분노를 불러올 수 있다."}, {"a": "positive", "form": "positive", "n": 9, "sq": 3, "sum": "even [[uplifting]] feelings", "hook": "희망, 강인함, 감사함 같은 긍정적인 감정이라는 문장의 positive(긍정적인) → 요약문에서는 uplifting(힘을 북돋는)으로 바꿨어요.", "b": "uplifting", "k": "긍정적인 → 힘을 북돋는", "en": "Crucially, it might also bring some positive emotions, such as hope, strength, or gratitude.", "ko": "결정적으로 그것은 희망, 강인함 또는 감사함과 같은 어떤 긍정적인 감정들 또한 불러올지도 모른다."}, {"a": "gratitude", "form": "gratitude", "n": 9, "sq": 3, "sum": "like hope or [[thankfulness]]", "hook": "희망, 강인함 또는 감사함이라는 문장의 gratitude(감사함) → 요약문에서는 thankfulness(고마움)로 바꿨어요.", "b": "thankfulness", "k": "감사함 → 고마움", "en": "Crucially, it might also bring some positive emotions, such as hope, strength, or gratitude.", "ko": "결정적으로 그것은 희망, 강인함 또는 감사함과 같은 어떤 긍정적인 감정들 또한 불러올지도 모른다."}, {"a": "accumulate", "form": "accumulate", "n": 11, "sq": 4, "sum": "these effects [[gather]] and shape", "hook": "단기적인 결과들이 축적되어 건강을 형성한다는 문장의 accumulate(축적되다) → 요약문에서는 gather(쌓이다)로 바꿨어요.", "b": "gather", "k": "축적되다 → 쌓이다", "en": "When repeated over time, these short-term emotional consequences of reappraisal might accumulate to shape people's psychological health.", "ko": "오랫동안 반복되면, 재평가의 이러한 단기적인 감정적 결과들이 축적되어 사람들의 심리적 건강을 형성할지도 모른다."}, {"a": "key", "form": "key", "n": 12, "sq": 4, "sum": "may be a [[secret]] to resilience", "hook": "회복 탄력성의 열쇠라는 문장의 key(열쇠) → 요약문에서는 secret(비결)로 바꿨어요.", "b": "secret", "k": "열쇠 → 비결", "en": "Thereby, reappraisal might be a key to resilience.", "ko": "그렇게 함으로써 재평가는 회복 탄력성의 해답이 될지도 모른다."}], "passage": [{"n": 1, "en": "Reappraisal ― changing the way one thinks about emotional situations ― might present a particularly effective avenue to regulating emotions because it transforms emotions at their root.", "ko": "재평가, 즉 누군가가 감정적인 상황들에 대해 생각하는 방식을 바꾸는 것은 그것이 감정을 본질적으로 변화시키기 때문에 감정을 조절하는 데 특히 효과적인 방법을 제공할지도 모른다."}, {"n": 2, "en": "Take, for example, someone who is going through a divorce.", "ko": "예를 들어, 이혼을 겪고 있는 누군가를 생각해 보자."}, {"n": 3, "en": "This is often an adverse event, and yet, it can be construed in different ways.", "ko": "이것은 보통 부정적인 사건이지만, 그럼에도 불구하고 그것은 다른 방식들로 해석될 수 있다."}, {"n": 4, "en": "One might view it as an overpowering loss that will mark one's family for life.", "ko": "누군가는 그것을 자신의 가족에게 평생 흔적을 남길 강렬한 상실로 여길지도 모른다."}, {"n": 5, "en": "Alternatively, one might see it as something that is painful but that might lead to positive outcomes in the long run, such as improved relationships.", "ko": "이와는 달리, 누군가는 그것을 고통스럽기는 하지만 개선된 관계와 같이 장기적으로는 긍정적인 결과로 이어질 수 있는 일로 여길지도 모른다."}, {"n": 6, "en": "As a result of these different construals, one might feel different emotions.", "ko": "이러한 다른 해석들의 결과로서 누군가는 다른 감정들을 느낄지도 모른다."}, {"n": 7, "en": "The first construal may bring intense sadness and anger.", "ko": "첫 번째 해석은 강렬한 슬픔과 분노를 불러올 수 있다."}, {"n": 8, "en": "The second construal might also bring sadness and anger but perhaps at lower levels.", "ko": "두 번째 해석 역시 슬픔과 분노를 불러올지도 모르지만, 아마도 더 낮은 강도로 그러할지도 모른다."}, {"n": 9, "en": "Crucially, it might also bring some positive emotions, such as hope, strength, or gratitude.", "ko": "결정적으로 그것은 희망, 강인함 또는 감사함과 같은 어떤 긍정적인 감정들 또한 불러올지도 모른다."}, {"n": 10, "en": "This example illustrates how reappraisal might powerfully transform short-term emotional responses.", "ko": "이 예시는 재평가가 어떻게 단기적인 감정적 반응들을 강력하게 변화시킬 수 있을지를 보여 준다."}, {"n": 11, "en": "When repeated over time, these short-term emotional consequences of reappraisal might accumulate to shape people's psychological health.", "ko": "오랫동안 반복되면, 재평가의 이러한 단기적인 감정적 결과들이 축적되어 사람들의 심리적 건강을 형성할지도 모른다."}, {"n": 12, "en": "Thereby, reappraisal might be a key to resilience.", "ko": "그렇게 함으로써 재평가는 회복 탄력성의 해답이 될지도 모른다."}], "questions": [{"id": 1, "summary": "Reappraisal may be an especially (A) way to control emotions, because it changes feelings at their (B).", "ko": "재평가는 감정을 조절하는 특히 <b>(A) 강력한</b> 방법일 수 있는데, 감정을 그 <b>(B) 근원</b>에서 바꾸기 때문이다.", "opts": [["powerful", "surface"], ["weak", "source"], ["powerful", "source"], ["weak", "surface"], ["risky", "end"]], "optko": ["강력한 – 겉", "약한 – 근원", "강력한 – 근원", "약한 – 겉", "위험한 – 끝"], "ans": 2, "wrong": ["surface(겉)가 틀려요. 재평가는 감정을 뿌리(root), 곧 본질에서 바꿔요. 겉만 바꾸는 게 아니에요.", "weak(약한)가 틀려요. 본문은 재평가가 감정을 조절하는 데 특히 효과적인 방법일 수 있다고 해요(effective).", null, "둘 다 틀려요. 재평가는 약한 방법이 아니라 효과적인 방법이고, 감정을 겉이 아니라 뿌리에서 바꿔요.", "둘 다 틀려요. 위험한(risky) 방법이라는 말은 없고, 감정을 끝(end)이 아니라 뿌리에서 바꿔요."], "evid": [{"n": 1, "hl": ["a particularly effective avenue to regulating emotions", "transforms emotions at their root"]}], "swaps": [["effective", "powerful", "효과적인 → 강력한"], ["regulate", "control", "조절하다 → 조절하다"], ["transform", "change", "변화시키다 → 바꾸다"], ["root", "source", "뿌리 → 근원"]], "swapnote": "effective(효과적인)는 powerful(강력한)로, regulate(조절하다)는 control(조절하다)로, transform(변화시키다)은 change(바꾸다)로, root(뿌리)는 source(근원)로 바뀌었어요.", "use": [{"w": "powerful", "ex": "The engine is very powerful.", "ko": "그 엔진은 매우 강력하다.", "wk": "강력한", "hk": "강력하다"}, {"w": "source", "ex": "The river's source is in the mountains.", "ko": "그 강의 근원은 산속에 있다.", "wk": "근원, 출처", "hk": "근원은"}], "flow": "본문 1번에서 재평가, 곧 상황을 생각하는 방식을 바꾸는 일이 감정을 조절하는 특히 효과적인 방법일 수 있다고 하고, 그 이유는 감정을 뿌리에서 바꾸기 때문이라고 해요.", "jd": [["Reappraisal may be an especially [[powerful]] way", "재평가는 특히 [[강력한]] 방법일 수 있다"], ["to control emotions,", "감정을 조절하는,"], ["because it changes feelings", "감정을 바꾸기 때문이다"], ["at their [[source]].", "그 [[근원]]에서."]], "fc": [["본문 1번", "재평가는 효과적인 감정 조절법", "생각하는 방식을 바꾸는 {{reappraisal|재평가}}가 감정을 {{regulate|조절하는}} {{effective|효과적인}} 방법일 수 있어요."], ["본문 1번", "감정을 뿌리부터 바꾼다", "재평가는 감정을 {{root|뿌리}}에서 {{transform|변화시켜요}}."], ["정답 포인트", "{{effective|효과적인}} = {{powerful|강력한}}, {{root|뿌리}} = {{source|근원}}", "본문 단어가 쉬운 말로 바뀌어 나와요."]], "evid_full": [{"en": "Reappraisal ― changing the way one thinks about emotional situations ― might present a particularly effective avenue to regulating emotions because it transforms emotions at their root.", "ko": "재평가, 즉 누군가가 감정적인 상황들에 대해 생각하는 방식을 바꾸는 것은 그것이 감정을 본질적으로 변화시키기 때문에 감정을 조절하는 데 특히 효과적인 방법을 제공할지도 모른다.", "hl": ["a particularly effective avenue to regulating emotions", "transforms emotions at their root"], "hlko": ["감정을 조절하는 데 특히 효과적인 방법", "감정을 본질적으로 변화시키기 때문에"], "n": 1}]}, {"id": 2, "summary": "Divorce is often a (A) event, yet one can regard it as a crushing loss for the family or as something painful that may lead to (B) results over time.", "ko": "이혼은 흔히 <b>(A) 해로운</b> 사건이지만, 가족에게 큰 타격을 주는 상실로 볼 수도 있고, 고통스럽지만 시간이 지나면 <b>(B) 좋은</b> 결과로 이어질 수 있는 일로 볼 수도 있다.", "opts": [["harmful", "good"], ["harmful", "bad"], ["joyful", "good"], ["joyful", "bad"], ["pleasant", "rare"]], "optko": ["해로운 – 좋은", "해로운 – 나쁜", "즐거운 – 좋은", "즐거운 – 나쁜", "유쾌한 – 드문"], "ans": 0, "wrong": [null, "bad(나쁜)가 틀려요. 두 번째 해석은 고통스럽기는 하지만 장기적으로는 긍정적인 결과로 이어질 수 있다고 해요(positive outcomes).", "joyful(즐거운)이 틀려요. 이혼은 보통 부정적인 사건이에요(adverse event).", "둘 다 틀려요. 이혼은 즐거운 사건이 아니라 부정적인 사건이고, 장기적으로는 나쁜 결과가 아니라 긍정적인 결과로 이어질 수도 있어요.", "둘 다 틀려요. 이혼은 유쾌한(pleasant) 사건이 아니라 부정적인 사건이고, 결과가 드물다(rare)는 말은 본문에 없어요."], "evid": [{"n": 3, "hl": ["often an adverse event", "it can be construed in different ways"]}, {"n": 4, "hl": ["an overpowering loss that will mark one's family for life"]}, {"n": 5, "hl": ["painful but that might lead to positive outcomes in the long run"]}], "swaps": [["adverse", "harmful", "부정적인 → 해로운"], ["overpowering", "crushing", "강렬한 → 큰 타격을 주는"], ["construe", "regard", "해석하다 → 여기다"], ["outcome", "result", "결과 → 결과"]], "swapnote": "adverse(부정적인)는 harmful(해로운)로, overpowering(강렬한)은 crushing(큰 타격을 주는)으로, construe(해석하다)는 regard(여기다)로, outcome(결과)은 result(결과)로 바뀌었어요. positive outcomes(긍정적인 결과)는 good results(좋은 결과)로 읽어요.", "use": [{"w": "harmful", "ex": "Smoking is harmful to health.", "ko": "흡연은 건강에 해롭다.", "wk": "해로운", "hk": "해롭다"}, {"w": "good", "ex": "Fruit is good for you.", "ko": "과일은 몸에 좋다.", "wk": "좋은", "hk": "좋다"}], "flow": "본문 3번에서 이혼은 보통 부정적인 사건이지만 다르게 해석될 수 있다고 하고, 4번에서 가족에게 평생 흔적을 남길 상실로 보는 해석을, 5번에서 고통스럽지만 장기적으로 좋은 결과로 이어질 일로 보는 해석을 보여 줘요.", "jd": [["Divorce is often a [[harmful]] event,", "이혼은 흔히 [[해로운]] 사건이지만,"], ["yet one can regard it", "그것을 여길 수도 있다"], ["as a crushing loss for the family", "가족에게 큰 타격을 주는 상실로"], ["or as something painful", "또는 고통스럽지만"], ["that may lead to [[good]] results", "[[좋은]] 결과로 이어질 수 있는 일로"], ["over time.", "시간이 지나면."]], "fc": [["본문 3번", "이혼은 보통 부정적인 사건", "보통 {{adverse|부정적인}} 사건이지만 다르게 {{construe|해석될}} 수 있어요."], ["본문 4~5번", "상실로 볼지, 좋은 결과로 볼지", "평생 흔적을 남길 {{overpowering|강렬한}} 상실로 볼 수도, 장기적으로 좋은 {{outcome|결과}}로 이어질 일로 볼 수도 있어요."], ["정답 포인트", "{{adverse|부정적인}} = {{harmful|해로운}}, {{outcome|결과}} = {{result|결과}}", "어려운 단어가 쉬운 말로 바뀌어 나와요."]], "evid_full": [{"en": "This is often an adverse event, and yet, it can be construed in different ways.", "ko": "이것은 보통 부정적인 사건이지만, 그럼에도 불구하고 그것은 다른 방식들로 해석될 수 있다.", "hl": ["often an adverse event", "it can be construed in different ways"], "hlko": ["보통 부정적인 사건이지만", "다른 방식들로 해석될 수 있다"], "n": 3}, {"en": "One might view it as an overpowering loss that will mark one's family for life.", "ko": "누군가는 그것을 자신의 가족에게 평생 흔적을 남길 강렬한 상실로 여길지도 모른다.", "hl": ["an overpowering loss that will mark one's family for life"], "hlko": ["평생 흔적을 남길 강렬한 상실"], "n": 4}, {"en": "Alternatively, one might see it as something that is painful but that might lead to positive outcomes in the long run, such as improved relationships.", "ko": "이와는 달리, 누군가는 그것을 고통스럽기는 하지만 개선된 관계와 같이 장기적으로는 긍정적인 결과로 이어질 수 있는 일로 여길지도 모른다.", "hl": ["painful but that might lead to positive outcomes in the long run"], "hlko": ["장기적으로는 긍정적인 결과로 이어질 수 있는 일"], "n": 5}]}, {"id": 3, "summary": "Seeing a divorce in different ways leads to different feelings: the first view brings (A) sadness and anger, while the second may bring lower levels of them and even (B) feelings like hope or thankfulness.", "ko": "이혼을 다르게 보면 감정도 달라진다. 첫 번째 관점은 <b>(A) 강한</b> 슬픔과 분노를 가져오고, 두 번째는 그것들을 더 낮은 수준으로 가져오면서 희망이나 감사 같은 <b>(B) 힘을 북돋는</b> 감정도 가져올 수 있다.", "opts": [["strong", "painful"], ["mild", "uplifting"], ["mild", "painful"], ["faint", "dull"], ["strong", "uplifting"]], "optko": ["강한 – 고통스러운", "약한 – 힘을 북돋는", "약한 – 고통스러운", "희미한 – 따분한", "강한 – 힘을 북돋는"], "ans": 4, "wrong": ["painful(고통스러운)이 틀려요. 본문은 두 번째 해석이 희망, 강인함, 감사함 같은 긍정적인 감정도 불러올 수 있다고 해요.", "mild(약한)가 틀려요. 첫 번째 해석은 강렬한 슬픔과 분노를 불러와요(intense).", "둘 다 틀려요. 첫 번째 해석은 약한 게 아니라 강렬한 슬픔과 분노를 불러오고, 희망, 강인함, 감사함은 고통스러운 감정이 아니라 긍정적인 감정이에요.", "둘 다 틀려요. 첫 번째 해석의 슬픔과 분노는 희미한(faint) 게 아니라 강렬하고, 희망과 감사는 따분한(dull) 감정이 아니라 힘을 북돋는 감정이에요.", null], "evid": [{"n": 6, "hl": ["one might feel different emotions"]}, {"n": 7, "hl": ["The first construal may bring intense sadness and anger"]}, {"n": 8, "hl": ["bring sadness and anger but perhaps at lower levels"]}, {"n": 9, "hl": ["it might also bring some positive emotions, such as hope, strength, or gratitude"]}], "swaps": [["intense", "strong", "강렬한 → 강한"], ["positive", "uplifting", "긍정적인 → 힘을 북돋는"], ["gratitude", "thankfulness", "감사함 → 고마움"]], "swapnote": "intense(강렬한)는 strong(강한)으로, positive(긍정적인)는 uplifting(힘을 북돋는)으로, gratitude(감사함)는 thankfulness(고마움)로 바뀌었어요. 긍정적인 감정 = 힘을 북돋는 감정으로 읽어요.", "use": [{"w": "strong", "ex": "He felt a strong pain.", "ko": "그는 강한 통증을 느꼈다.", "wk": "강한", "hk": "강한"}, {"w": "uplifting", "ex": "The song was uplifting.", "ko": "그 노래는 기운을 북돋아 주었다.", "wk": "기운을 북돋는", "hk": "북돋아"}], "flow": "본문 6번에서 해석이 다르면 감정도 다르다고 하고, 7번에서 첫 번째 해석은 강렬한 슬픔과 분노를, 8번에서 두 번째는 더 낮은 강도를, 9번에서 결정적으로 희망과 강인함, 감사함 같은 긍정적인 감정까지 불러온다고 이어요.", "jd": [["Seeing a divorce in different ways", "이혼을 다르게 보면"], ["leads to different feelings:", "다른 감정으로 이어진다:"], ["the first view brings [[strong]] sadness and anger,", "첫 번째 관점은 [[강한]] 슬픔과 분노를 가져오고,"], ["while the second may bring lower levels of them", "두 번째는 그것들을 더 낮은 수준으로 가져오고"], ["and even [[uplifting]] feelings", "더 나아가 [[힘을 북돋는]] 감정도"], ["like hope or thankfulness.", "희망이나 감사 같은."]], "fc": [["본문 7번", "첫 번째 해석은 강렬한 슬픔", "첫 번째 {{construal|해석}}은 {{intense|강렬한}} 슬픔과 분노를 불러와요."], ["본문 8~9번", "두 번째 해석은 낮은 강도와 긍정적 감정", "슬픔과 분노가 더 낮고 {{positive|긍정적인}} 감정과 {{gratitude|감사함}}도 불러올 수 있어요."], ["정답 포인트", "{{intense|강렬한}} = {{strong|강한}}, {{positive|긍정적인}} = {{uplifting|힘을 북돋는}}", "같은 뜻의 다른 단어예요."]], "evid_full": [{"en": "As a result of these different construals, one might feel different emotions.", "ko": "이러한 다른 해석들의 결과로서 누군가는 다른 감정들을 느낄지도 모른다.", "hl": ["one might feel different emotions"], "hlko": ["누군가는 다른 감정들을 느낄지도 모른다"], "n": 6}, {"en": "The first construal may bring intense sadness and anger.", "ko": "첫 번째 해석은 강렬한 슬픔과 분노를 불러올 수 있다.", "hl": ["The first construal may bring intense sadness and anger"], "hlko": ["강렬한 슬픔과 분노를 불러올 수 있다"], "n": 7}, {"en": "The second construal might also bring sadness and anger but perhaps at lower levels.", "ko": "두 번째 해석 역시 슬픔과 분노를 불러올지도 모르지만, 아마도 더 낮은 강도로 그러할지도 모른다.", "hl": ["bring sadness and anger but perhaps at lower levels"], "hlko": ["슬픔과 분노를 불러올지도 모르지만, 아마도 더 낮은 강도로"], "n": 8}, {"en": "Crucially, it might also bring some positive emotions, such as hope, strength, or gratitude.", "ko": "결정적으로 그것은 희망, 강인함 또는 감사함과 같은 어떤 긍정적인 감정들 또한 불러올지도 모른다.", "hl": ["it might also bring some positive emotions, such as hope, strength, or gratitude"], "hlko": ["희망, 강인함 또는 감사함과 같은 어떤 긍정적인 감정들 또한 불러올지도 모른다"], "n": 9}]}, {"id": 4, "summary": "Reappraisal can powerfully change short-term feelings, and when repeated, these effects (A) and shape mental health, so it may be a (B) to resilience.", "ko": "재평가는 단기적인 감정을 강력하게 바꿀 수 있고, 반복되면 이 효과들이 <b>(A) 쌓여</b> 정신 건강을 형성하므로, 회복 탄력성의 <b>(B) 비결</b>일 수 있다.", "opts": [["gather", "barrier"], ["gather", "secret"], ["scatter", "secret"], ["scatter", "barrier"], ["vanish", "threat"]], "optko": ["쌓이다 – 장벽", "쌓이다 – 비결", "흩어지다 – 비결", "흩어지다 – 장벽", "사라지다 – 위협"], "ans": 1, "wrong": ["barrier(장벽)가 틀려요. 본문은 재평가가 회복 탄력성의 열쇠(key)가 될지도 모른다고 해요.", null, "scatter(흩어지다)가 틀려요. 단기적인 감정 결과들은 흩어지는 게 아니라 축적돼요(accumulate).", "둘 다 틀려요. 단기적인 결과들은 흩어지는 게 아니라 쌓이고, 재평가는 회복 탄력성의 장벽이 아니라 열쇠예요.", "둘 다 틀려요. 효과들은 사라지는(vanish) 게 아니라 쌓이고, 재평가는 회복 탄력성에 위협(threat)이 아니라 열쇠예요."], "evid": [{"n": 10, "hl": ["reappraisal might powerfully transform short-term emotional responses"]}, {"n": 11, "hl": ["these short-term emotional consequences of reappraisal might accumulate to shape people's psychological health"]}, {"n": 12, "hl": ["reappraisal might be a key to resilience"]}], "swaps": [["accumulate", "gather", "축적되다 → 쌓이다"], ["key", "secret", "열쇠 → 비결"]], "swapnote": "accumulate(축적되다)는 gather(쌓이다)로, key(열쇠)는 secret(비결)로 바뀌었어요. 회복 탄력성의 열쇠 = 회복 탄력성의 비결로 읽어요.", "use": [{"w": "gather", "ex": "Dust gathered on the old books.", "ko": "오래된 책들에 먼지가 쌓였다.", "wk": "쌓이다, 모이다", "hk": "쌓였다"}, {"w": "secret", "ex": "Practice is the secret to success.", "ko": "연습이 성공의 비결이다.", "wk": "비결, 비밀", "hk": "비결이다"}], "flow": "본문 10번에서 이 예시가 재평가가 단기적인 감정 반응을 강력하게 바꿀 수 있음을 보여 주고, 11번에서 오래 반복되면 그 결과가 쌓여 심리적 건강을 만들고, 12번에서 그래서 회복 탄력성의 열쇠가 될지도 모른다고 결론 내요.", "jd": [["Reappraisal can powerfully change short-term feelings,", "재평가는 단기적인 감정을 강력하게 바꿀 수 있고,"], ["and when repeated,", "반복되면,"], ["these effects [[gather]]", "이 효과들이 [[쌓여]]"], ["and shape mental health,", "정신 건강을 형성하며,"], ["so it may be a [[secret]] to resilience.", "그래서 회복 탄력성의 [[비결]]일 수 있다."]], "fc": [["본문 10~11번", "짧은 반응이 쌓인다", "단기적인 감정 반응이 반복되면 {{accumulate|축적돼서}} 심리적 {{health|건강}}을 만들어요."], ["본문 12번", "회복 탄력성의 열쇠", "그래서 재평가는 {{resilience|회복 탄력성}}의 {{key|열쇠}}가 될 수 있어요."], ["정 var EVK={
'1':[[1,'재평가는 감정을 근본에서 <b>변화시키기</b>(transforms) 때문에 감정을 <b>조절하는</b>(regulating) 데 <b>효과적인</b>(effective) 방법이 될 수 있음']],
'2':[[3,'이것은 보통 <b>부정적인</b>(adverse) 사건이지만 다른 방식으로 <b>해석될</b>(construed) 수 있음'],[4,'어떤 사람은 그것을 평생 흔적을 남길 <b>강렬한</b>(overpowering) 상실로 여김'],[5,'장기적으로 긍정적인 <b>결과</b>(outcomes)로 이어질 수도 있음']],
'3':[[7,'첫 번째 해석은 <b>강렬한</b>(intense) 슬픔과 분노를 불러올 수 있음'],[9,'<b>긍정적인</b>(positive) 감정, 곧 희망, 강인함, <b>감사함</b>(gratitude)도 불러올 수 있음']],
'4':[[11,'재평가의 단기적 결과가 오랫동안 반복되면 <b>축적되어</b>(accumulate) 심리적 건강을 형성함'],[12,'재평가는 회복 탄력성의 <b>열쇠</b>(key)가 될 수 있음']]
};
var REL={
effective:{bj:'감정을 조절하는 데 특히 <b>효과적인</b>(effective) 방법',s:[['successful','성공적인'],['potent','강력한'],['efficient','효율적인']],a:[['ineffective','효과 없는']],t:'powerful',tr:'effective는 목표한 결과를 내는'},
regulate:{bj:'감정을 <b>조절하는</b>(regulating) 데',s:[['adjust','조절하다'],['govern','다스리다'],['moderate','조절하다']],a:[['deregulate','규제를 풀다']],t:'control',tr:'regulate는 일정한 상태로 맞추다'},
transform:{bj:'감정을 본질적으로 <b>변화시키기</b>(transforms) 때문에',s:[['alter','바꾸다'],['convert','전환하다'],['reshape','재구성하다']],a:[['preserve','보존하다']],t:'change',tr:'transform은 모양이나 성질을 완전히 바꾸다'},
root:{bj:'그것은 감정을 그 <b>뿌리</b>(root)에서 변화시킨다',s:[['origin','기원'],['cause','원인'],['foundation','토대']],a:[['effect','결과']],t:'source',tr:'root는 식물의 뿌리, 여기서는 감정이 생기는 근본 원인'},
adverse:{bj:'이것은 보통 <b>부정적인</b>(adverse) 사건이다',s:[['unfavorable','불리한'],['negative','부정적인'],['detrimental','해로운']],a:[['favorable','유리한']],t:'harmful',tr:'adverse는 좋지 않은 영향을 주는'},
overpowering:{bj:'평생 흔적을 남길 <b>강렬한</b>(overpowering) 상실',s:[['overwhelming','압도적인'],['intense','강렬한'],['irresistible','저항할 수 없는']],a:[['mild','온화한']],t:'crushing',tr:'overpowering은 너무 강해서 견디기 어려운'},
construe:{bj:'다른 방식들로 <b>해석될</b>(construed) 수 있다',s:[['interpret','해석하다'],['understand','이해하다'],['read','해석하다']],a:[['misinterpret','잘못 해석하다']],t:'regard',tr:'construe는 construe A as B, A를 B로 해석하다'},
outcome:{bj:'장기적으로 긍정적인 <b>결과</b>(outcomes)로 이어질 수 있다',s:[['consequence','결과'],['effect','영향, 결과'],['upshot','결말']],a:[['cause','원인']],t:'result',tr:'outcome은 어떤 일의 최종 결과'},
intense:{bj:'<b>강렬한</b>(intense) 슬픔과 분노를 불러올 수 있다',s:[['extreme','극심한'],['fierce','격렬한'],['severe','심한']],a:[['mild','온화한']],t:'strong',tr:'intense는 정도가 아주 센'},
positive:{bj:'희망, 강인함 또는 감사함과 같은 <b>긍정적인</b>(positive) 감정',s:[['optimistic','낙관적인'],['favorable','유리한'],['constructive','건설적인']],a:[['negative','부정적인']],t:'uplifting',tr:'positive는 긍정적인, 반대는 부정적인 negative'},
gratitude:{bj:'희망, 강인함 또는 <b>감사함</b>(gratitude)',s:[['appreciation','감사'],['gratefulness','고마움']],a:[['ingratitude','배은망덕']],t:'thankfulness',tr:'gratitude는 grateful(고마워하는)의 명사형'},
accumulate:{bj:'단기적 결과들이 <b>축적되어</b>(accumulate) 심리적 건강을 형성한다',s:[['amass','모으다'],['pile up','쌓이다'],['build up','쌓아 올리다']],a:[['deplete','고갈시키다']],t:'gather',tr:'accumulate는 조금씩 모여 늘어나다'},

function relBox(s){
  var r=REL[String(s.a).toLowerCase()];if(!r)return '';
  var it=[{t:s.b,k:String(s.k).split(' → ')[1]||'',c:'k'}];
  r.s.forEach(function(x){it.push({t:x[0],k:x[1],c:'s'})});
  r.a.forEach(function(x){it.push({t:x[0],k:x[1],c:'a'})});
  var P={1:[[50,80]],2:[[26,78],[74,78]],3:[[16,70],[50,86],[84,70]],4:[[14,62],[36,86],[64,86],[86,62]],5:[[12,56],[28,86],[50,92],[72,86],[88,56]]}[it.length],svg='',nd='';
  it.forEach(function(x,j){
    svg+='<line x1="50%" y1="26%" x2="'+P[j][0]+'%" y2="'+(P[j][1]-7)+'%" stroke="'+(x.c=='a'?'#c0392b':'#2f5d50')+'" stroke-width="2"/>';
    nd+='<div class="rn '+x.c+'" style="left:'+P[j][0]+'%;top:'+P[j][1]+'%">'+esc(x.t)+(x.k?'<small>'+esc(x.k)+'</small>':'')+'</div>';
  });
  var left=String(s.k).split(' → ')[0];
  var h='<div class="relx"><div class="rmap"><svg>'+svg+'</svg><div class="rn c" style="left:50%;top:26%">'+esc(s.a)+'<small>'+esc(left)+'</small></div>'+nd+'</div>'
   +'<div class="rleg"><span><i style="border-color:#2f5d50"></i>바꿔 쓸 수 있는 말</span>'+(r.a.length?'<span><i style="border-color:#c0392b"></i>반대말</span>':'')+'</div>'
   +'<div class="pit"><div><em>본문</em>'+r.bj+'</div><div><em>요약문</em><b>'+esc(s.b)+'</b>('+esc(String(s.k).split(' → ')[1]||'')+')로 바뀜</div>'+(r.tr?'<div class="tp"><em>함정</em>'+esc(r.tr)+'</div>':'')+'</div></div>';
  return h;
}

}
