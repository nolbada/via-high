</div><script>
var IT=[{"id": "m2610g2-31", "src": "mock_2610_g2.txt", "label": "26년 10월 31번", "type": "order", "given": "A person who lives eighty years lives some twenty-nine thousand days, and the overwhelming majority of the behaviour packed into them runs on settings laid down, most of them, decades earlier and rarely inspected since.", "parts": {"A": "If you had to consciously decide every footstep and every fork-grip and every word, you would never make it out of bed; the deliberate mind is far too slow and too costly to run a whole life in real time, and any creature that tried would be outcompeted by a creature that didn't. The automation is precisely what frees the captain to come up on deck for the few problems that actually require him. The default is not a flaw in the human design.", "B": "It is arguably the central feature, the thing that makes a complex life affordable at all.", "C": "This need not be a hopeless thought. In one light it is a triumph of engineering."}, "answer": "C-A-B", "hint": {"given": "80년을 사는 사람의 행동 대부분은 수십 년 전에 정해진 설정대로 돌아감", "A": "모든 걸 의식해서 정하면 침대 밖으로도 못 나옴 — 자동화 덕분에 선장(의식)은 꼭 필요한 문제에만 나섬 — 기본 설정은 인간 설계의 결함이 아님", "B": "그것은 오히려 핵심 기능 — 복잡한 삶을 감당할 수 있게 해 주는 것", "C": "이게 꼭 절망적인 생각일 필요는 없음 — 어떻게 보면 설계(공학)의 큰 성공임"}, "clues": [["This need not be a hopeless thought", "(C)의 This = 주어진 글의 '행동 대부분이 옛 설정대로 돌아간다'는 생각 → 주어진 글 바로 뒤"], ["If you had to consciously decide every footstep", "(A)는 (C)의 '설계의 성공'인 이유를 풀어 줌 — 의식적인 마음은 너무 느리고 비용이 큼"], ["It is arguably the central feature", "(B)의 It = (A) 끝의 The default(기본 설정), '결함이 아니다 → 오히려 핵심 기능이다'로 이어짐 → (A) 바로 뒤"]], "flow": ["행동 대부분은 옛 설정대로 돌아감", "절망할 일이 아니라 설계의 성공", "의식은 느리고 비싸서, 자동화가 의식을 필요한 곳에만 쓰게 함 — 기본 설정은 결함이 아님", "기본 설정은 복잡한 삶을 감당하게 해 주는 핵심 기능"]}, {"id": "m2610g2-32", "src": "mock_2610_g2.txt", "label": "26년 10월 32번", "type": "insert", "sentence": "For example, courts are traditional social institutions and important for the normal and harmonious functioning of collective life.", "segs": ["", "If we understand mass culture as a weakening factor of the cultural ties that unite people to their traditions, mass culture weakens the intermediary institutions in society (e.g. the family or the school), diminishing their role and overlapping these institutions.", "However, when people turn to social networks to put pressure on judicial decisions in certain mediated and politicized processes, this practice is popularized and becomes a habitual form of culture, which is harmful.", "Justice must not be done in the public square, which today is converted into a virtual dimension, the social networks.", "In a democratic state of law, the appropriate place to judge and make justice is the court and in a way that is immune to popular pressure.", ""], "answer": 2, "clues": [["For example, courts", "주어진 문장의 For example = ②앞 문장의 '가족·학교 같은 매개 제도'의 또 다른 예로 법원을 듦"], ["judicial decisions", "②뒤 문장의 judicial decisions(재판 판결)는 법원(courts)이 먼저 나와야 이해됨 — 주어진 문장이 빠지면 However가 무엇과 대조되는지 사라짐"]], "flow": ["대중문화는 가족·학교 같은 매개 제도의 역할을 약하게 만듦", "예: 법원도 사회에 중요한 전통 제도임", "그런데 소셜 네트워크로 판결에 압력을 넣는 일이 습관처럼 퍼짐 — 해로움", "정의는 가상 광장(소셜 네트워크)에서 이뤄지면 안 됨", "재판은 법원에서, 대중 압력에 흔들리지 않게"]}, {"id": "m2610g2-33", "src": "mock_2610_g2.txt", "label": "26년 10월 33번", "type": "order", "given": "Human development is now increasingly understood as an ongoing, flexible, and evolving process rather than a fixed sequence of stages.", "parts": {"A": "The concept of plasticity challenges this rigid outlook by emphasizing that development continues across the entire lifespan. Although the extent of change may vary at different stages, every phase of life allows room for adaptation and transformation.", "B": "At the core of this perspective lies the concept of plasticity. Plasticity refers to the human capacity to change, adapt, and reorganize cognitive, emotional, and behavioural patterns in response to life experiences, environmental demands, and biological changes. It highlights that individuals are not merely passive recipients of development but active agents capable of growth throughout their lives.", "C": "In earlier views, development was believed to occur mainly during childhood, with adulthood seen as a period of stability and old age as a phase of decline."}, "answer": "B-C-A", "hint": {"given": "인간 발달은 이제 고정된 단계가 아니라 계속 유연하게 변하는 과정으로 이해됨", "A": "가소성 개념은 발달이 평생 계속된다고 강조하며 이 딱딱한 생각에 반대함 — 어느 시기든 변화의 여지가 있음", "B": "이 관점의 중심엔 가소성이 있음 — 가소성 = 경험·환경에 맞춰 바뀌고 적응하는 능력, 사람은 평생 성장하는 능동적 주체", "C": "예전 관점에서는 발달은 주로 아동기에, 성인기는 안정, 노년기는 쇠퇴라고 봄"}, "clues": [["At the core of this perspective", "(B)의 this perspective = 주어진 글의 '발달은 고정 단계가 아니라 계속 변하는 과정'이라는 관점 → 주어진 글 바로 뒤"], ["In earlier views", "(C)의 earlier views(예전 관점) = (B)의 새 관점(평생 성장)과 대비되는 옛날 생각 → (B) 뒤"], ["this rigid outlook", "(A)의 this rigid outlook(이 딱딱한 사고방식) = (C)의 '아동기에만 발달, 노년은 쇠퇴'라는 옛 관점 → (C) 바로 뒤"]], "flow": ["발달은 고정된 단계가 아니라 계속 변하는 과정", "그 중심에 가소성 — 경험·환경에 맞춰 바뀌는 능력, 평생 성장", "예전엔 아동기 발달, 성인기 안정, 노년기 쇠퇴로 봄", "가소성은 이 딱딱한 생각에 반대 — 평생 발달, 어느 시기든 변화 가능"]}, {"id": "m2610g2-34", "src": "mock_2610_g2.txt", "label": "26년 10월 34번", "type": "insert", "sentence": "That is no longer the case.", "segs": ["Social media has altered business, politics, and friendships, making going viral a household term.", "The global financial industry links every bank and countless households in every country, making us vulnerable to human error taking place on the other side of the world.", "As Columbia University strategy professor Rita McGrath explains, years ago most of our institutions were separate and thereby buffered from the effects of errors outside their walls.", "The digitization of massive amounts of information has continued to grow enormously as the cost of computing power has decreased.", "The development of smart systems that communicate autonomously gave rise to an infinite variety of potential breakdowns. This interdependence is a breeding ground for complex failure.", "As Rita puts it, when “things that used to be kept separate bump up against each other, it becomes far more difficult to predict what's going to happen next.” Information technology creates new vulnerabilities because interconnectedness instantly spreads the impact of small failures."], "answer": 3, "clues": [["That is no longer the case", "주어진 문장의 That = ③앞 문장의 '예전엔 기관들이 따로 떨어져 있어 바깥 실수에서 보호받았다'는 상황"], ["years ago", "③앞 문장의 years ago(몇 년 전엔)는 '지금은 아니다'로 이어져야 함 → 주어진 문장이 빠지면 과거에서 현재(디지털화)로 넘어가는 다리가 사라짐"]], "flow": ["소셜 미디어와 금융망이 세상을 서로 이어 놓음", "예전엔 기관들이 따로 있어서 바깥 실수에서 보호받음", "이제는 더 이상 그렇지 않음", "디지털화와 스마트 시스템 → 서로 얽힘이 복잡한 실패를 낳음", "연결성 때문에 작은 실패의 영향이 곧바로 퍼짐"]}, {"id": "m2610g2-40", "src": "mock_2610_g2.txt", "label": "26년 10월 40번", "type": "order", "given": "One key adaptation is the structure of the dolphin's auditory pathway. The signals from the ears are rapidly transmitted to the auditory cortex, the brain region responsible for processing sound.", "parts": {"C": "However, unlike many other mammals, dolphins have a highly specialized auditory cortex with distinct areas dedicated to processing different aspects of echolocation signals. Some areas may be responsible for analyzing the timing of echoes, while others focus on the frequency content or the intensity of the sound.", "B": "This specialization allows the dolphin's brain to process echo information in parallel, rather than sequentially.", "A": "Imagine a factory assembly line, where different workers are responsible for different tasks. By dividing the work among specialized areas, the brain can process information much faster and more efficiently. This parallel processing reduces the cognitive load associated with echolocation, allowing dolphins to react quickly to changes in their environment."}, "answer": "C-B-A", "hint": {"given": "돌고래 청각 경로의 구조 — 귀의 신호가 소리를 처리하는 청각 피질로 빠르게 전달됨", "A": "공장 조립 라인처럼 일을 나누면 더 빠르고 효율적 — 이 병렬 처리로 부담이 줄어 빨리 반응함", "B": "이렇게 나뉜 덕분에 돌고래 뇌는 메아리 정보를 하나씩이 아니라 동시에(병렬로) 처리함", "C": "그런데 다른 포유류와 달리 돌고래 청각 피질은 구역이 나뉘어 있고, 구역마다 맡은 일이 다름"}, "clues": [["However, unlike many other mammals", "(C)의 However = 주어진 글의 '보통의 청각 피질' 설명과 대조되는 돌고래만의 특징 → 주어진 글 바로 뒤"], ["This specialization", "(B)의 This specialization = (C)의 '구역마다 맡은 일이 다른' 전문화 → (C) 뒤"], ["This parallel processing", "(A) 안의 This parallel processing = (B)의 in parallel(병렬로) → (B) 뒤"]], "flow": ["귀의 신호가 청각 피질로 빠르게 전달됨", "돌고래 피질은 구역별로 맡은 일이 다름", "그래서 정보를 동시에(병렬로) 처리함", "조립 라인처럼 일을 나눠 빠르고 부담이 적음 → 빠른 반응"]}, {"id": "m2510-20", "src": "mock_2510_g2.txt", "label": "25년 10월 20번", "type": "insert", "sentence": "When working with patients who are seen frequently, it is easy to start to think of them as friends.", "segs": ["When you are working in healthcare, it is important to develop a solid professional relationship with your patients. By establishing realistic self-boundaries, you can protect that relationship. It is important to keep the focus on the patient.", "With a friend, you are likely to share personal information that is not appropriate with a patient.", "Patients may feel that they cannot share important health-related information because you are their friend, and it would be embarrassing to share that information.", "Self-boundaries can also be thought of as professional boundaries.", "You need to treat patients with respect and keep the relationship professional.", "Be friendly to patients and always keep the focus on the patient."], "answer": 1, "clues": [["think of them as friends", "주어진 문장 = 자주 보는 환자를 '친구'처럼 여기기 쉽다는 문제 제기 → 친구 이야기가 처음 등장하는 자리"], ["With a friend", "① 뒤 문장의 a friend = 주어진 문장의 friends → 주어진 문장이 빠지면 '친구'가 갑자기 튀어나옴"], ["It is important to keep the focus on the patient.", "① 앞 = 초점은 환자에게 → 그런데 자주 보면 친구처럼 느끼기 쉽다는 위험으로 이어짐"]], "flow": ["의료 일 = 환자와 견고한 직업적 관계, 자기 경계로 그 관계를 보호", "초점은 환자에게 두는 것이 중요", "자주 보는 환자는 친구처럼 생각하기 쉬움", "친구와는 환자와 나누면 안 될 개인 정보까지 나누게 됨", "환자도 친구라서 중요한 건강 정보를 말 못 할 수 있음", "자기 경계 = 직업적 경계 → 존중하고, 친절하되 초점은 항상 환자"]}, {"id": "m2510-21", "src": "mock_2510_g2.txt", "label": "25년 10월 21번", "type": "order", "given": "Coat a fresh, wet swab in salt, and gently touch various spots on your tongue, recording where your taste seems strongest.", "parts": {"A": "Gargle again, and then swab with lemon juice.", "B": "After a final gargle, try coffee. Compare your reactions with your friends'. Your taste pattern may reveal more than just taste preferences.", "C": "Then, gargle with water to thoroughly clean your tongue, use a swab coated with sugar on the same spots, and record those results."}, "answer": "C-A-B", "hint": {"given": "소금 묻힌 면봉으로 혀 여러 곳을 대 보며 맛이 가장 강한 곳을 기록", "A": "다시 헹구고 레몬주스로", "B": "마지막으로 헹군 뒤 커피 → 친구들과 비교 → 미각 패턴은 취향 이상을 보여줌", "C": "그런 다음 물로 헹구고 같은 자리에 설탕 면봉 → 기록"}, "clues": [["Then, gargle with water", "(C) = 첫 헹굼(물로) + 설탕 → 소금 실험 바로 다음"], ["Gargle again", "(A)의 again = 이미 한 번 헹군 (C) 뒤"], ["After a final gargle", "(B)의 final = 마지막 헹굼 → 맨 끝, 이어서 결과 비교"]], "flow": ["소금 면봉 → 기록", "물로 헹군 뒤 설탕 → 기록", "다시 헹구고 레몬주스", "마지막 헹굼 후 커피 → 친구와 비교 → 미각 패턴은 취향 이상을 보여줌"]}, {"id": "m2510-23", "src": "mock_2510_g2.txt", "label": "25년 10월 23번", "type": "order", "given": "We can discard or replace a scientific theory only if we have a better way of explaining the evidence that supports it. The theories of Newton and Einstein offer great examples.", "parts": {"A": "Some scientists today are seeking a theory of gravity that will go beyond Einstein's. If any new theory ever gains acceptance, it will have to match all the successes of Einstein's theory as well as work in new realms where Einstein's theory does not.", "B": "Still, the many successes of Newton's theory could not be ignored, and Einstein's theory would not have gained acceptance if it had not been able to explain these successes equally well. It did, and that is why we now view Einstein's theory as a broader theory of gravity than Newton's theory.", "C": "A vast body of evidence supports Newton's theory of gravity, but by the late nineteenth century scientists had begun to discover cases where its predictions did not perfectly match observations. These discrepancies were explained only when Einstein developed his general theory of relativity, which was able to match the observations."}, "answer": "C-B-A", "hint": {"given": "더 나은 설명이 있을 때만 과학 이론을 버리거나 바꿀 수 있음 — 뉴턴과 아인슈타인이 좋은 예", "A": "오늘날 아인슈타인을 넘어서는 이론을 찾는 중 → 새 이론은 아인슈타인의 성과 전부 + 새 영역에서도 작동해야 함", "B": "그래도 뉴턴의 성과는 무시 못 함 → 아인슈타인이 그것까지 설명했기에 더 넓은 이론", "C": "뉴턴 이론은 증거가 많지만 19세기 말 관찰과 어긋나는 사례 발견 → 아인슈타인 상대성 이론이 해명"}, "clues": [["A vast body of evidence supports Newton's theory", "(C) = 예시의 시작(뉴턴 → 불일치 → 아인슈타인) → 주어진 글의 offer great examples 바로 뒤"], ["Still, the many successes of Newton's theory", "(B)의 Still = (C)에서 아인슈타인이 불일치를 해명했어도 '그래도' 뉴턴의 성과는 남음 → (C) 뒤"], ["Some scientists today", "(A)의 today + go beyond Einstein's = (B)에서 아인슈타인 이론이 받아들여진 다음 단계 → 맨 끝"]], "flow": ["더 나은 설명이 있을 때만 이론 교체 — 뉴턴과 아인슈타인", "뉴턴 이론과 관찰의 불일치 → 아인슈타인이 해명", "뉴턴의 성과까지 설명했기에 아인슈타인 이론이 더 넓은 이론", "다음 이론도 아인슈타인의 성과 전부 + 새 영역 필요"]}, {"id": "m2510-24", "src": "mock_2510_g2.txt", "label": "25년 10월 24번", "type": "insert", "sentence": "Neurobic exercises — simple yet effective — are perfect for such breaks.", "segs": ["Imagine pausing in the middle of a busy day, taking a moment to refresh your mind and recharge your energy.", "This power of a midday break is often underestimated.", "When you break away from routine, especially with activities designed to stimulate your brain, you prevent cognitive tiredness and enhance productivity for the rest of the day.", "They target different areas of your brain, keeping it agile and alert.", "These exercises create a mental oasis that refreshes and prepares you for the afternoon's challenges. This strategic pause is not just a break; it boosts your cognitive capabilities, ensuring your mind remains sharp and focused.", "Even briefly experimenting with neurobic exercises can work wonders for your cognitive state during lunch. Start with using your non-dominant hand for routine tasks like writing or eating. This simple switch challenges your brain, activating pathways that aren't typically engaged and promoting greater flexibility in thinking."], "answer": 3, "clues": [["such breaks", "주어진 문장의 such breaks = ③ 앞 문장의 break away from routine(뇌를 자극하는 활동으로 일상에서 벗어나기)"], ["They target different areas of your brain", "③ 뒤 문장의 They = 주어진 문장의 Neurobic exercises → 주어진 문장이 빠지면 They가 가리킬 것이 없음"], ["These exercises", "그다음 문장의 These exercises도 Neurobic exercises를 받음"]], "flow": ["바쁜 하루 중 잠시 멈춰 정신·에너지를 재충전한다고 상상", "한낮 휴식의 힘은 과소평가됨", "뇌 자극 활동으로 일상에서 벗어나면 인지 피로 방지, 생산성↑", "뉴로빅 운동이 그런 휴식에 딱", "그것들은 뇌의 여러 부분을 자극, 오후를 위한 정신적 오아시스", "주되지 않은 손으로 글쓰기·식사부터 → 사고 유연성↑"]}, {"id": "m2510-29", "src": "mock_2510_g2.txt", "label": "25년 10월 29번", "type": "order", "given": "On rare occasions, the error may represent a change for the better; more probably, it will cause no significant difference in the cell's prospects. But in some cases, the error will cause serious damage: for example, by disrupting the coding sequence for a key protein.", "parts": {"A": "But changes that cause serious damage lead nowhere: the cell that suffers them dies, leaving no progeny. Through endless repetition of this cycle of mutation and natural selection organisms evolve: their genetic specifications change, sometimes giving organisms new ways to exploit the environment more effectively, to survive in competition with others, and to reproduce successfully.", "B": "Changes due to mistakes of the first type will tend to be perpetuated, because the altered cell has an increased likelihood of reproducing itself.", "C": "Changes due to mistakes of the second type—neutral changes—may be perpetuated or not: it is a matter of chance whether the altered cell or its cousins will succeed."}, "answer": "B-C-A", "hint": {"given": "복제 오류는 드물게 더 좋은 변화, 대개는 별 차이 없음, 어떤 경우엔 심각한 손상", "A": "심각한 손상을 주는 변화는 막다른 길(세포 죽음, 자손 X) → 이 돌연변이·자연 선택의 반복으로 생물이 진화", "B": "첫 번째 유형(더 좋은 변화)은 영속되기 쉬움 — 복제 가능성이 커져서", "C": "두 번째 유형(중립적 변화)은 영속될 수도 안 될 수도 — 우연의 문제"}, "clues": [["mistakes of the first type", "(B) = 주어진 글의 첫 번째 결과(더 좋은 변화) → 바로 뒤"], ["mistakes of the second type—neutral changes", "(C) = 두 번째 결과(별 차이 없음 = 중립) → (B) 뒤"], ["But changes that cause serious damage", "(A) = 세 번째 결과(심각한 손상) + this cycle로 전체 정리 → 맨 끝"]], "flow": ["복제 오류의 세 결과: 더 좋음(드묾) / 별 차이 없음(대개) / 심각한 손상", "더 좋은 변화 → 영속", "중립적 변화 → 우연에 달림", "심각한 손상 → 세포 죽음 → 이 반복으로 진화"]}, {"id": "m2510-30", "src": "mock_2510_g2.txt", "label": "25년 10월 30번", "type": "order", "given": "Within liberal culture, the value of fair equality of opportunity for individuals outweighs the preservation of the family's integrity.", "parts": {"A": "In contrast, for Confucian culture, while seeking fair equality of opportunity for individuals is important, the family assumes a fundamental role in human flourishing, and living within a family institution is considered the essential way of life. Individuals are primarily understood as family members before they are regarded as state citizens.", "B": "Some cultures, like the liberal one, may choose to impose increasing restrictions on the role of families and implement more egalitarian government programs for education, healthcare, and other positive rights in society in the pursuit of fair equality of opportunity. On the other hand, other cultures, like the Confucian one, may prefer to primarily assign welfare responsibilities to the family, accepting inequalities stemming from the existence of the family as long as everyone's basic freedoms and rights are safeguarded in the state.", "C": "Therefore, for Confucians, the family possesses inherent value that should never be abandoned, even if it results in certain societal inequalities."}, "answer": "A-C-B", "hint": {"given": "자유주의 문화: 개인의 공정한 기회 평등이 가족 보존보다 우선", "A": "이에 반해 유교 문화: 가족이 인간 번영의 기본, 개인은 시민이기 전에 가족 구성원", "B": "자유주의 같은 문화는 가족 역할을 제한하고 평등 정책 / 유교 같은 문화는 복지를 가족에게 맡기고 불평등도 받아들임", "C": "그러므로 유교에선 불평등이 생겨도 가족은 결코 포기하면 안 되는 고유한 가치"}, "clues": [["In contrast, for Confucian culture", "(A)의 In contrast = 주어진 글의 자유주의 문화와 대조 → 바로 뒤"], ["Therefore, for Confucians", "(C)의 Therefore = (A) 끝 '개인은 시민이기 전에 가족 구성원'의 결론(가족 = 포기 불가한 가치) → (A) 뒤"], ["Some cultures, like the liberal one ... On the other hand, other cultures, like the Confucian one", "(B) = 앞의 두 가치관이 정책으로 이어지는 결과(자유주의 = 가족 역할 제한 / 유교 = 복지를 가족에게) → 맨 끝. (C)가 (B) 뒤로 가면 정책 정리 뒤에 다시 가치로 되돌아가 Therefore의 근거가 어긋남"]], "flow": ["자유주의: 개인의 기회 평등 > 가족", "유교: 가족이 기본, 개인은 먼저 가족 구성원", "그러므로 유교에선 불평등이 생겨도 가족을 포기 X", "정책 차이: 자유주의 = 가족 역할 제한·평등 정책 / 유교 = 복지를 가족에게"]}, {"id": "m2510-31", "src": "mock_2510_g2.txt", "label": "25년 10월 31번", "type": "insert", "sentence": "Yet this is the case.", "segs": ["Statistics in the twentieth century became the systematic collection of quantitative information needed by the state.", "This process occurred in all the industrialised countries as a key part of their becoming modern states.", "Desrosières writes: \"It is difficult to think simultaneously that the objects being measured really do exist and that this is only a convention\".", "Phenomena such as prices being charged and products being sold exist, but the categories and classification frameworks supporting the collection, aggregation, and organisation of official statistics are devised to serve the purposes of the state, for macroeconomic or for social policies.", "Theodore Porter described the use of statistics to create state authority: \"Quantification is a way of making decisions without seeming to decide\", characterising it as a \"social technology\" intended to build trust in authority.", ""], "answer": 3, "clues": [["Yet this is the case.", "주어진 문장의 Yet = ③ 앞 인용문의 It is difficult to think(동시에 생각하기 어렵다)를 뒤집음 → '그런데 실제로 그렇다'"], ["this", "this = 대상은 실제로 존재하면서 동시에 관례라는 것"], ["Phenomena ... exist, but the categories ... are devised", "③ 뒤 문장 = 주어진 문장의 '실제로 그렇다'를 풀어 설명(현상은 존재 + 분류 틀은 국가가 만듦)"]], "flow": ["20세기 통계 = 국가가 필요한 정량 정보의 체계적 수집", "모든 산업 국가가 근대 국가가 되는 핵심 과정", "측정 대상이 실재하면서 관례라고 동시에 생각하기는 어려움", "그런데 실제로 그러함", "현상은 존재하지만 분류 틀은 국가 목적에 맞게 고안", "정량화 = 결정 안 하는 척 결정 → 권위에 대한 신뢰를 쌓는 사회적 기술"]}, {"id": "m2510-32", "src": "mock_2510_g2.txt", "label": "25년 10월 32번", "type": "insert", "sentence": "And yet every scientific tool, from microscopes to mathematics, and every aspect of the body, from the brain to the microorganism, requires such depth of expertise that this tends not to happen: we tend to study the human body in silos, each community sectioned from the others by its own specialised vocabulary.", "segs": ["Just as an expert in the taste and colour of wine will gain much by being aware of the chemistry that underlies those qualities, so each perspective on the body can potentially enhance the others.", "Research communities may be dedicated to one type of scientific tool or a specific component of the body, such as one type of cell.", "How different types of cell communicate with one another becomes its own specialist topic.", "Even simple forms of life on Earth are now rarely studied as a whole, and the human body is evidently much more complex.", "As long ago as 1890, The Times newspaper commented that knowledge 'had already become too vast to be manageable'.", "Today, nobody is an expert in the whole of anything."], "answer": 1, "clues": [["And yet ... this tends not to happen", "주어진 문장의 this = ① 앞 문장의 '각 관점이 서로를 강화하는 일' → And yet으로 '그런데 실제론 잘 안 일어남'"], ["in silos", "주어진 문장의 칸막이식 연구 → ① 뒤 Research communities may be dedicated to one type(한 가지에만 집중)의 근거"], ["Research communities", "주어진 문장이 빠지면 '관점을 합치면 이득' 바로 뒤에 '한 가지에만 집중하는 연구'가 와서 흐름이 끊김"]], "flow": ["와인 전문가가 화학을 알면 이득이듯, 신체에 대한 관점들도 서로를 강화할 수 있음", "하지만 깊은 전문성이 필요해 잘 안 됨 → 칸막이식 연구", "연구 공동체는 한 도구·한 세포에만 집중", "세포끼리 소통하는 방식도 따로 전문 주제", "단순한 생명체도 전체로 연구 X, 인체는 훨씬 복잡", "1890년에도 지식이 너무 방대 → 오늘날 누구도 전체의 전문가 아님"]}, {"id": "m2510-33", "src": "mock_2510_g2.txt", "label": "25년 10월 33번", "type": "insert", "answer": 2, "clues": [["Conversely, it also allowed", "Conversely(반대로) + also = 앞에 '반대 방향'의 일이 먼저 나와야 함 → ② 앞 문장의 통치자가 백성을 내려다보기(look down)"], ["it", "it = ② 앞 문장의 The introduction of large windows(대형 창문의 도입)"], ["gaze up at their leaders ↔ look down upon their subjects", "통치자는 내려다보고 ↔ 백성은 올려다봄: 짝을 이루는 두 방향 → 바로 붙어 있어야 함"]], "flow": ["궁전 = 감탄·위압을 위한 무대, 돌은 영속·힘 / 유리는 가시성", "큰 창문으로 통치자는 백성을 내려다보며 높은 지위 강조", "반대로 백성은 통치자를 올려다보며 경외감·거리감", "베르사유 거울의 방 → 왕을 눈부신 중심에 두어 절대 권위 강화", "유리는 단순히 미적인 게 아니라 전략적", "열린 시야로 감시·통제 → 신하들은 늘 관찰을 의식 → 건축이 사회적 행동을 지배"], "sentence": "Conversely, it also allowed subjects to gaze up at their leaders, creating a sense of awe and distance.", "segs": ["Historically, palaces weren't just homes; they were carefully constructed stages designed to impress and intimidate. While stone symbolized permanence and strength, glass offered something equally powerful: visibility.", "The introduction of large windows in palaces allowed rulers to literally look down upon their subjects, emphasizing their elevated position.", "Consider the Palace of Versailles: its Hall of Mirrors, lined with reflective surfaces, not only magnified the grandeur of the space but also placed the king at the center of a dazzling display, reinforcing his absolute authority.", "The use of glass in palaces wasn't merely aesthetic; it was strategic.", "Open sightlines allowed for better surveillance and control, ensuring the safety and security of the ruling family. Courtiers and visitors were constantly aware of being observed, contributing to an atmosphere of careful obedience and respect.", "The very architecture dictated social behavior, with glass acting as a silent enforcer of the power dynamic."]}, {"id": "m2510-40", "src": "mock_2510_g2.txt", "label": "25년 10월 40번", "type": "order", "given": "Viewing time as a purchasable and consistent product cemented artificial views on time into our psyche, but every now and again we are forced to acknowledge this mistake.", "parts": {"A": "For instance, when El Niño, a climatic system in the Pacific, causes wind speed to change dramatically, it can slow the rotation of the Earth slightly. Indeed, the Earth'
