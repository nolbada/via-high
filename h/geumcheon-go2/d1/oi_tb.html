ver, it", "(B)의 it = (A)의 버리고 새로 사는 것, however로 그 생각을 뒤집음"]], "flow": ["Liz가 노트북을 떨어뜨려 심하게 망가뜨림", "수리할 수 있지만 비싸고 오래 걸려서 망설임", "게다가 5년 된 노트북이라 새로 사는 게 합리적으로 보임", "하지만 버리면 전자 쓰레기라는 심각한 문제에 기여하게 됨"]}, {"id": "g2_L4-2", "src": "g2_L4.txt", "label": "4과 전자 쓰레기란 무엇인가", "type": "order", "given": "What exactly is e-waste? The term refers to discarded electronic devices and electrical appliances.", "parts": {"A": "Experts predict that by 2030, the amount of e-waste generated annually will have doubled in just 16 years. For this reason, efforts are being made to address this problem, most of which are focused on making products easier to repair. Let's take a look at some practical approaches from around the world.", "B": "Due to toxic materials contained in these products, such as lead, e-waste is a serious health and environmental hazard.", "C": "To make matters worse, the amount of e-waste produced each year is increasing at an alarming rate. In 2021, a total of 57.4 million metric tons of e-waste was generated worldwide, which was a 37% increase from 2014, the year when data about e-waste was first collected."}, "answer": "B-C-A", "hint": {"given": "전자 쓰레기란? 버려진 전자 장치와 전기 기기", "A": "2030년엔 16년 만에 두 배가 될 것, 그래서 수리를 쉽게 만드는 노력이 이루어짐", "B": "이 제품들 속 납 같은 유독 물질 때문에 건강·환경에 위험함", "C": "설상가상으로 양이 빠르게 늘어남, 2021년엔 2014년보다 37% 증가"}, "clues": [["these products", "(B)의 these products = 주어진 글의 버려진 전자 장치와 전기 기기"], ["To make matters worse", "(C)의 설상가상으로 = (B)의 위험하다는 나쁜 점에 더 나쁜 점(양 증가)을 보탬"], ["in just 16 years", "(A)의 16년 = (C)의 2014년(자료 첫 수집)부터 2030년까지, 그래서 (C) 다음"]], "flow": ["전자 쓰레기 = 버려진 전자 장치와 전기 기기", "유독 물질 때문에 건강·환경에 위험함", "게다가 양이 빠르게 늘어남(2014년 대비 2021년 37% 증가)", "2030년엔 두 배 예상, 그래서 수리를 쉽게 만드는 노력, 세계의 접근법 소개"]}, {"id": "g2_L4-3", "src": "g2_L4.txt", "label": "4과 수리할 권리 운동: 소비자에게 권한 부여하기", "type": "order", "given": "One reason many people dispose of their damaged devices is that they are too difficult to repair.", "parts": {"A": "What is more, some products are intentionally designed to be difficult to repair. It is common for consumers to be unable to acquire the instructions for how to fix their items or the parts needed to complete repairs.", "B": "For example, a device may be difficult to disassemble, or its manufacturer may require that it be brought to an official service center to be fixed. Many companies do not allow their customers to take their damaged items to third-party repair shops.", "C": "The right-to-repair movement is trying to solve these problems by promoting legislation that states the following: If you own a product, you have the right to fix it yourself or bring it to a technician of your choice."}, "answer": "B-A-C", "hint": {"given": "사람들이 고장 난 장치를 버리는 이유 하나 = 수리하기 너무 어려움", "A": "게다가 일부러 수리하기 어렵게 만든 제품도 있음, 설명서·부품도 구하기 어려움", "B": "예를 들어 분해가 어렵거나 공식 수리소로만 가져오게 함, 제삼자 수리점은 허용 안 함", "C": "수리할 권리 운동이 이 문제들을 해결하려 함, 내 물건은 내가 고칠 권리"}, "clues": [["For example", "(B) = 주어진 글의 수리하기 어렵다는 말의 첫 예시"], ["What is more", "(A)의 게다가 = (B)의 예시에 어려운 점을 더 보탬"], ["these problems", "(C)의 these problems = (B)·(A)에 나온 수리를 어렵게 만드는 문제들, 그래서 맨 뒤"]], "flow": ["고장 난 장치를 버리는 이유 = 수리하기 너무 어려움", "예: 분해가 어렵고 공식 수리소로만 가야 하고 제삼자 수리점은 안 됨", "게다가 일부러 수리 어렵게 만들고 설명서·부품도 못 구함", "수리할 권리 운동이 법 제정으로 이 문제들을 해결하려 함"]}, {"id": "g2_L4-4", "src": "g2_L4.txt", "label": "4과 수리할 권리 운동: 소비자에게 권한 부여하기", "type": "insert", "sentence": "Advocates of the movement say that if all these goals are accomplished, far less e-waste will be generated.", "segs": ["To protect the rights of consumers, the right-to-repair movement demands four things.", "First, companies must make information about their products available to everyone.", "Second, third parties, including individuals, should be able to obtain the parts and tools required to make repairs.", "Third, the practice of preventing consumers from installing custom software on their own devices should be prohibited by law.", "Finally, it demands that manufacturers design devices in a way that makes repairs as easy as possible.",
