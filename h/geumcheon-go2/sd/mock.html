떤 조정되고 정치화된 과정에서 사람들이 사법적 판결에 압력을 가하려고 소셜 네트워크에 의지하면, 이러한 관행이 대중화되어 습관적인 문화의 한 형태가 되는데, 이는 해롭다."}, {"en": "Justice must not be done in the public square, which today is converted into a virtual dimension, the social networks.", "ko": "재판은 대중 광장에서 이루어져서는 안 되는데, 오늘날 그 광장은 가상의 차원, 즉 소셜 네트워크로 바뀌어 있다."}, {"en": "In a democratic state of law, the appropriate place to judge and make justice is the court and in a way that is immune to popular pressure.", "ko": "민주적인 법치 국가에서 재판하고 정의를 실현하기에 알맞은 곳은 법원이며, 그것도 대중의 압력에 흔들리지 않는 방식이어야 한다."}], "chunks": [[0, 0], [1, 1], [2, 2], [3, 4]], "ex": [{"head": "If we understand mass culture", "clue": ["mass culture", "the intermediary institutions"], "core": "대중문화는 가족·학교 같은 매개 제도를 약하게 만듦", "why": "글의 출발: 대중문화가 전통 '제도(institutions)'를 약화시킨다는 주장"}, {"head": "For example, courts are traditional", "clue": ["For example", "courts", "traditional social institutions"], "core": "예: 법원도 공동생활에 중요한 전통 제도", "why": "For example(예를 들어) + institutions(제도) → 앞의 '매개 제도'의 예로 법원을 듦"}, {"head": "However, when people turn to", "clue": ["However", "social networks", "judicial decisions"], "core": "그런데 소셜 네트워크로 판결에 압력 → 습관이 되어 해로움", "why": "However(그러나) → '법원은 중요함'과 대조, judicial(재판의) = 앞의 courts"}, {"head": "Justice must not be done", "clue": ["the public square", "the social networks"], "core": "재판은 대중 광장(= 오늘날 소셜 네트워크)에서 하면 안 됨", "why": "앞의 '소셜 네트워크로 압력'을 받아 public square(대중 광장)로 바꿔 말하며 비판"}, {"head": "In a democratic state of", "clue": ["the appropriate place", "the court", "immune to popular pressure"], "core": "정의를 판단할 곳은 법원, 대중 압력에 흔들리지 않게", "why": "광장 X(앞) → 그럼 어디? 알맞은 곳은 법원 → 결론"}], "postit": "대중문화가 제도 약화 → 예: 법원 → 소셜 네트워크로 판결 압력 → 광장 재판 X → 법원에서, 압력 없이"}, {"id": "mock_2610_g2-33", "label": "26년 10월 33번 가소성과 평생 발달", "sents": [{"en": "Human development is now increasingly understood as an ongoing, flexible, and evolving process rather than a fixed sequence of stages.", "ko": "인간 발달은 오늘날 고정된 순서의 단계라기보다는 계속 진행되고, 유연하며, 서서히 발전하는 과정으로 점점 더 이해되고 있다."}, {"en": "At the core of this perspective lies the concept of plasticity.", "ko": "이러한 관점의 핵심에는 가소성이라는 개념이 있다."}, {"en": "Plasticity refers to the human capacity to change, adapt, and reorganize cognitive, emotional, and behavioural patterns in response to life experiences, environmental demands, and biological changes.", "ko": "가소성은 삶의 경험, 환경적 요구, 생물학적 변화에 반응하여 인지적·정서적·행동적 패턴을 바꾸고, 적응시키고, 재구성하는 인간의 능력을 가리킨다."}, {"en": "It highlights that individuals are not merely passive recipients of development but active agents capable of growth throughout their lives.", "ko": "그것은 개인이 단순히 발달을 수동적으로 받아들이는 존재가 아니라 평생에 걸쳐 성장할 수 있는 능동적인 주체라는 점을 강조한다."}, {"en": "In earlier views, development was believed to occur mainly during childhood, with adulthood seen as a period of stability and old age as a phase of decline.", "ko": "이전의 관점에서는 발달이 주로 아동기에 일어난다고 믿어졌고, 성인기는 안정의 시기로, 노년기는 쇠퇴의 단계로 여겨졌다."}, {"en": "The concept of plasticity challenges this rigid outlook by emphasizing that development continues across the entire lifespan.", "ko": "가소성의 개념은 발달이 전 생애에 걸쳐 계속된다는 점을 강조함으로써 이러한 경직된 사고방식에 이의를 제기한다."}, {"en": "Although the extent of change may vary at different stages, every phase of life allows room for adaptation and transformation.", "ko": "비록 변화의 정도는 단계마다 다를 수 있지만, 삶의 모든 단계는 적응과 변화의 여지를 허용한다."}], "chunks": [[0, 0], [1, 3], [4, 4], [5, 6]], "ex": [{"head": "Human development is now increasingly", "clue": ["rather than a fixed sequence of stages"], "core": "발달 = 고정된 단계 X, 계속 변하는 유연한 과정", "why": "글의 출발: 요즘 보는 발달의 새 관점(고정된 단계 X → 변하는 과정)"}, {"head": "At the core of this", "clue": ["this perspective", "plasticity"], "core": "이 관점의 핵심 = 가소성(plasticity)", "why": "this perspective(이 관점) = 바로 앞 '발달은 변하는 과정'이라는 관점 → 그 핵심 개념 소개"}, {"head": "Plasticity refers to the human", "clue": ["Plasticity refers to"], "core": "가소성 = 경험·환경에 맞춰 생각·감정·행동을 바꾸는 능력", "why": "앞 문장 끝에 처음 나온 plasticity(가소성)를 바로 뜻풀이 → refers to(~을 가리키다)"}, {"head": "It highlights that individuals", "clue": ["It", "not merely passive", "but active agents"], "core": "사람 = 수동적 수용자 X, 평생 성장하는 능동적 주체", "why": "It(그것) = 앞에서 정의한 가소성 → 가소성이 강조하는 점으로 이어짐"}, {"head": "In earlier views, development was", "clue": ["In earlier views"], "core": "예전 관점: 발달은 아동기, 성인기는 안정, 노년기는 쇠퇴", "why": "In earlier views(이전 관점에서는) → 지금의 가소성 관점과 대비되는 옛날 생각 등장"}, {"head": "The concept of plasticity challenges", "clue": ["challenges", "this rigid outlook"], "core": "가소성이 옛날의 경직된 관점에 반박 → 발달은 평생 계속", "why": "this rigid outlook(이 경직된 사고방식) = 바로 앞 '아동기 발달·노년기 쇠퇴' 관점 → 반드시 옛날 관점 다음"}, {"head": "Although the extent of change", "clue": ["every phase of life"], "core": "변화 정도는 달라도 모든 시기에 변화 가능", "why": "앞의 '전 생애(entire lifespan)'를 every phase of life(삶의 모든 단계)로 다시 정리하는 마무리"}], "postit": "발달 = 변하는 과정 → 핵심은 가소성(뜻·능동적 주체) → 옛날엔 아동기만 발달 → 가소성이 반박: 모든 시기에 변화"}, {"id": "mock_2610_g2-34", "label": "26년 10월 34번 상호 연결성과 새로운 취약성", "sents": [{"en": "Social media has altered business, politics, and friendships, making going viral a household term.", "ko": "소셜 미디어는 비즈니스, 정치, 친구 관계를 바꾸어 놓았고, '입소문이 나다(going viral)'를 일상적인 용어로 만들었다."}, {"en": "The global financial industry links every bank and countless households in every country, making us vulnerable to human error taking place on the other side of the world.", "ko": "세계 금융 산업은 모든 나라의 모든 은행과 수많은 가정을 연결하여, 우리를 세계 반대편에서 일어나는 인간의 실수에 취약하게 만든다."}, {"en": "As Columbia University strategy professor Rita McGrath explains, years ago most of our institutions were separate and thereby buffered from the effects of errors outside their walls.", "ko": "Columbia University 전략학 교수 Rita McGrath가 설명하듯이, 수년 전에는 우리 기관들 대부분이 분리되어 있었고, 그 덕분에 자신의 울타리 밖에서 일어난 오류의 영향으로부터 보호되었다."}, {"en": "That is no longer the case.", "ko": "이제는 더 이상 그렇지 않다."}, {"en": "The digitization of massive amounts of information has continued to grow enormously as the cost of computing power has decreased.", "ko": "컴퓨팅 능력의 비용이 줄어들면서 방대한 양의 정보의 디지털화는 계속해서 엄청나게 늘어났다."}, {"en": "The development of smart systems that communicate autonomously gave rise to an infinite variety of potential breakdowns.", "ko": "자율적으로 소통하는 스마트 시스템의 발달은 무한히 다양한 잠재적 고장을 낳았다."}, {"en": "This interdependence is a breeding ground for complex failure.", "ko": "이러한 상호 의존성은 복합적인 실패의 온상이다."}, {"en": "As Rita puts it, when “things that used to be kept separate bump up against each other, it becomes far more difficult to predict what’s going to happen next.”", "ko": "Rita가 말하듯이, '분리되어 있던 것들이 서로 부딪치게 되면, 다음에 무슨 일이 일어날지 예측하기가 훨씬 더 어려워진다.'"}, {"en": "Information technology creates new vulnerabilities because interconnectedness instantly spreads the impact of small failures.", "ko": "정보 기술은 새로운 취약성을 만들어 내는데, 상호 연결성이 작은 실패의 영향을 즉시 퍼뜨리기 때문이다."}], "chunks": [[0, 1], [2, 3], [4, 5], [6, 8]], "ex": [{"head": "Social media has altered business,", "clue": ["going viral"], "core": "소셜 미디어가 세상을 바꿈 → '입소문(viral)'이 일상어", "why": "글의 출발: 지금 세상이 얼마나 서로 연결됐는지 예시 1(소셜 미디어)"}, {"head": "The global financial industry links", "clue": ["links every bank", "vulnerable"], "core": "금융망이 전 세계를 연결 → 지구 반대편 실수에도 취약", "why": "연결 예시 2(금융망) → 연결 때문에 vulnerable(취약한)이라는 문제 제기"}, {"head": "As Columbia University strategy professor", "clue": ["years ago", "separate", "buffered"], "core": "예전: 기관들이 따로 떨어져 바깥 오류로부터 보호됨", "why": "years ago(수년 전) → 지금(연결된 세상)과 대비되는 과거. errors outside their walls(울타리 밖 오류) = 앞 문장의 지구 반대편 실수. 교수 이름 Rita McGrath가 여기서 처음 소개"}, {"head": "That is no longer the", "clue": ["That", "no longer"], "core": "하지만 이제는 그렇지 않음", "why": "That(그것) = 바로 앞 '기관들이 분리되어 보호받던 상황' → no longer(더 이상 ~ 아님)로 과거 부정"}, {"head": "The digitization of massive amounts", "clue": ["has continued to grow"], "core": "정보 디지털화가 엄청나게 늘어남", "why": "왜 '더 이상 그렇지 않은지' 이유 1: 디지털화가 계속 늘어남(현재완료 has continued)"}, {"head": "The development of smart systems", "clue": ["communicate autonomously", "breakdowns"], "core": "스스로 소통하는 스마트 시스템 → 고장 가능성 무한대", "why": "이유 2: 스마트 시스템끼리 서로 소통 → 서로 얽히는 상태 완성"}, {"head": "This interdependence is a breeding", "clue": ["This interdependence"], "core": "이 상호 의존 = 복합 실패의 온상", "why": "This interdependence(이 상호 의존) = 바로 앞 '서로 소통하는 스마트 시스템' → 반드시 그 다음"}, {"head": "As Rita puts it, when", "clue": ["As Rita puts it", "used to be kept separate"], "core": "Rita: 따로였던 것들이 부딪히면 예측이 훨씬 어려움", "why": "Rita(이름만) = 앞에서 성까지 소개한 그 교수 → 소개 문장보다 반드시 뒤"}, {"head": "Information technology creates new vulnerabilities", "clue": ["new vulnerabilities", "interconnectedness"], "core": "결론: 연결성이 작은 실패를 즉시 퍼뜨려 새로운 취약성 생김", "why": "앞의 내용을 정리하는 결론 → 처음 나온 vulnerable(취약한)을 vulnerabilities로 다시 받아 마무리"}], "postit": "연결된 세상(소셜 미디어·금융) → 예전엔 분리·보호 → 이젠 아님(디지털화·스마트 시스템) → 상호 의존 = 실패 온상 → 새로운 취약성"}, {"id": "mock_2610_g2-36", "label": "26년 10월 36번 우리는 사용자가 아니다", "sents": [{"en": "A simple truth that designers must embrace in order to create more effective products and experiences is the fact that we are not the user.", "ko": "디자이너가 더 효과적인 제품과 경험을 만들기 위해 받아들여야 하는 단순한 진리는 우리가 사용자가 아니라는 사실이다."}, {"en": "We’re much too close to what we build to objectively see it and understand how users will interact with it.", "ko": "우리는 우리가 만드는 것에 너무 가까이 있어서 그것을 객관적으로 보고 사용자가 그것과 어떻게 상호 작용할지 이해할 수 없다."}, {"en": "The best user interfaces are those that have been shaped by observations of real users and their interactions with them.", "ko": "가장 좋은 사용자 인터페이스는 실제 사용자와 그들이 인터페이스와 상호 작용하는 모습을 관찰한 결과로 만들어져 온 것들이다."}, {"en": "So how can designers shape their work to be more effective?", "ko": "그렇다면 디자이너는 어떻게 자신의 작업을 더 효과적으로 만들 수 있을까?"}, {"en": "An incredibly effective way is with usability testing.", "ko": "엄청나게 효과적인 한 가지 방법은 사용성 테스트를 활용하는 것이다."}, {"en": "The goal of this method is to uncover problems in a design, discover existing opportunities, and learn more about the behaviors and preferences of users by asking participants to engage in realistic activities.", "ko": "이 방법의 목표는 참가자에게 실제와 같은 활동을 하도록 요청하여, 디자인의 문제를 밝혀내고, 이미 있는 기회를 발견하며, 사용자의 행동과 선호에 대해 더 많이 알아내는 것이다."}, {"en": "This technique is effective for understanding how well a design will perform once it is in the hands of real users.", "ko": "이 기법은 디자인이 실제 사용자의 손에 들어갔을 때 얼마나 잘 작동할지 이해하는 데 효과적이다."}, {"en": "Designers can use this method to improve their work through subsequent revisions based on the findings from representative users.", "ko": "디자이너는 대표 사용자에게서 얻은 결과를 바탕으로 이후 수정을 거쳐 자신의 작업을 개선하는 데 이 방법을 사용할 수 있다."}], "chunks": [[0, 0], [1, 1], [2, 3], [4, 5], [6, 7]], "ex": [{"head": "A simple truth that designers", "clue": ["we are not the user"], "core": "디자이너가 받아들일 진리: 우리는 사용자가 아님", "why": "글의 출발: '디자이너 ≠ 사용자'라는 단순한 진리"}, {"head": "We’re much too close to", "clue": ["much too close", "to objectively see it"], "core": "만든 것에 너무 가까워 객관적으로 못 봄", "why": "왜 사용자가 아닌지 이유 → We(우리) = 앞 문장의 we(디자이너). too ~ to(너무 ~해서 …못함)"}, {"head": "The best user interfaces are", "clue": ["real users"], "core": "최고의 화면 = 실제 사용자 관찰로 만들어진 것", "why": "우리(디자이너)는 객관적으로 못 봄 → 그러니 real users(실제 사용자)를 관찰해야 함으로 연결"}, {"head": "So how can designers shape", "clue": ["So how"], "core": "그럼 디자이너는 어떻게 더 효과적으로?", "why": "So(그렇다면) → 앞 원칙을 실제로 어떻게 할지 질문 던짐"}, {"head": "An incredibly effective way is", "clue": ["An incredibly effective way", "usability testing"], "core": "답: 사용성 테스트", "why": "질문(how ~?)에 대한 답 → way(방법) = 질문의 how에 대응. 질문 바로 다음"}, {"head": "The goal of this method", "clue": ["this method"], "core": "목표: 실제 같은 활동으로 문제·기회·선호 발견", "why": "this method(이 방법) = 바로 앞 사용성 테스트 → 방법 소개 다음에 목표 설명"}, {"head": "This technique is effective for", "clue": ["This technique", "real users"], "core": "실제 사용자 손에서 얼마나 잘 작동할지 파악", "why": "This technique(이 기법) = 사용성 테스트를 다른 말로 다시 받음 → 목표 다음에 효과"}, {"head": "Designers can use this method", "clue": ["this method", "subsequent revisions"], "core": "결과를 바탕으로 계속 고쳐 나가는 데 활용", "why": "this method(이 방법) 한 번 더 → subsequent revisions(이후 수정)로 활용 단계 마무리"}], "postit": "디자이너 ≠ 사용자 → 너무 가까워 객관적 X → 실제 사용자 관찰 → 그럼 어떻게? → 사용성 테스트 → 목표·효과·개선"}, {"id": "mock_2610_g2-37", "label": "26년 10월 37번 재평가와 감정 조절", "sents": [{"en": "Reappraisal—changing the way one thinks about emotional situations—might present a particularly effective avenue to regulating emotions because it transforms emotions at their root.", "ko": "재평가, 즉 감정적인 상황에 대해 생각하는 방식을 바꾸는 것은 감정을 근본부터 바꾸기 때문에 감정을 조절하는 데 특히 효과적인 방법이 될 수 있다."}, {"en": "Take, for example, someone who is going through a divorce.", "ko": "예를 들어, 이혼을 겪고 있는 사람을 생각해 보자."}, {"en": "This is often an adverse event, and yet, it can be construed in different ways.", "ko": "이것은 보통 부정적인 사건이지만, 그럼에도 서로 다른 방식으로 해석될 수 있다."}, {"en": "One might view it as an overpowering loss that will mark one’s family for life.", "ko": "어떤 사람은 그것을 가족에게 평생 흔적을 남길 압도적인 상실로 볼 수 있다."}, {"en": "Alternatively, one might see it as something that is painful but that might lead to positive outcomes in the long run, such as improved relationships.", "ko": "이와 달리, 어떤 사람은 그것을 고통스럽지만 장기적으로는 더 나아진 관계 같은 긍정적인 결과로 이어질 수 있는 일로 볼 수도 있다."}, {"en": "As a result of these different construals, one might feel different emotions.", "ko": "이렇게 서로 다른 해석의 결과로, 사람은 서로 다른 감정을 느낄 수 있다."}, {"en": "The first construal may bring intense sadness and anger.", "ko": "첫 번째 해석은 강렬한 슬픔과 분노를 가져올 수 있다."}, {"en": "The second construal might also bring sadness and anger but perhaps at lower levels.", "ko": "두 번째 해석 역시 슬픔과 분노를 가져올 수 있지만, 아마도 더 낮은 강도일 것이다."}, {"en": "Crucially, it might also bring some positive emotions, such as hope, strength, or gratitude.", "ko": "결정적으로, 그것은 희망, 강인함, 감사 같은 긍정적인 감정도 가져올 수 있다."}, {"en": "This example illustrates how reappraisal might powerfully transform short-term emotional responses.", "ko": "이 예시는 재평가가 단기적인 감정 반응을 어떻게 강력하게 바꿀 수 있는지 보여 준다."}, {"en": "When repeated over time, these short-term emotional consequences of reappraisal might accumulate to shape people’s psychological health.", "ko": "오랜 시간 반복되면, 재평가가 낳은 이러한 단기적인 감정의 결과가 쌓여 사람들의 심리적 건강을 형성할 수 있다."}, {"en": "Thereby, reappraisal might be a key to resilience.", "ko": "그렇게 함으로써, 재평가는 회복 탄력성의 열쇠가 될 수 있다."}], "chunks": [[0, 0], [1, 2], [3, 4], [5, 8], [9, 11]], "ex": [{"head": "Reappraisal—changing the way one thinks", "clue": ["Reappraisal", "at their root"], "core": "재평가 = 생각하는 방식 바꾸기 → 감정을 뿌리부터 조절", "why": "글의 출발: 재평가(reappraisal)의 뜻과 효과 소개"}, {"head": "Take, for example, someone who", "clue": ["for example", "a divorce"], "core": "예시: 이혼을 겪는 사람", "why": "for example(예를 들어) → 앞의 재평가를 설명할 사례(이혼) 꺼냄"}, {"head": "This is often an adverse", "clue": ["This", "and yet", "in different ways"], "core": "이혼은 부정적 사건이지만 다르게 해석 가능", "why": "This(이것) = 바로 앞의 a divorce(이혼) → 사례 소개 바로 다음"}, {"head": "One might view it as", "clue": ["One might view it"], "core": "해석 1: 가족에게 평생 남을 큰 상실", "why": "it(그것) = 이혼. 앞의 in different ways(다른 방식들)의 첫 번째 방식 제시"}, {"head": "Alternatively, one might see it", "clue": ["Alternatively"], "core": "해석 2: 아프지만 장기적으로 좋은 결과로 이어질 일", "why": "Alternatively(이와 달리) → 첫 번째 해석과 다른 두 번째 해석"}, {"head": "As a result of these", "clue": ["these different construals"], "core": "해석이 다르면 느끼는 감정도 다름", "why": "these different construals(이 서로 다른 해석들) = 앞의 해석 1·2 → 두 해석이 다 나온 뒤에만 가능"}, {"head": "The first construal may bring", "clue": ["The first construal"], "core": "해석 1 → 강한 슬픔·분노", "why": "The first construal(첫 번째 해석) = 앞의 '평생 남을 상실' → 해석별 감정 시작"}, {"head": "The second construal might also", "clue": ["The second construal", "also", "at lower levels"], "core": "해석 2 → 슬픔·분노도 있지만 더 약하게", "why": "first 다음 second(두 번째) → 순서 고정. also(역시) = 첫 번째처럼 슬픔·분노는 있음"}, {"head": "Crucially, it might also bring", "clue": ["Crucially", "it", "positive emotions"], "core": "결정적으로 해석 2는 희망·감사 같은 긍정 감정도 가져옴", "why": "it(그것) = 두 번째 해석 → Crucially(결정적으로)로 두 번째 해석의 강점 추가"}, {"head": "This example illustrates how reappraisal", "clue": ["This example", "short-term"], "core": "이 예시 = 재평가가 단기 감정 반응을 바꿈", "why": "This example(이 예시) = 지금까지의 이혼 사례 → 사례가 끝난 뒤 정리"}, {"head": "When repeated over time, these", "clue": ["When repeated over time", "these short-term emotional consequences"], "core": "오래 반복되면 쌓여서 심리적 건강 형성", "why": "these short-term(이 단기적인) = 바로 앞 단기 감정 반응 → 장기로 확장"}, {"head": "Thereby, reappraisal might be a", "clue": ["Thereby", "resilience"], "core": "결론: 재평가 = 회복 탄력성의 열쇠", "why": "Thereby(그렇게 함으로써) = 앞의 '쌓여서 건강 형성'의 결과 → 마지막 결론"}], "postit": "재평가 = 생각 바꾸기 → 예: 이혼 → 해석 1(상실)·해석 2(성장) → 다른 감정 → 이 예시 정리 → 쌓이면 건강 → 회복 탄력성"}, {"id": "mock_2610_g2-38", "label": "26년 10월 38번 수질과 용도별 안전 기준", "sents": [{"en": "When we say that water is “clean,” we don’t just mean that it looks like a glass of water.", "ko": "우리가 물이 '깨끗하다'고 말할 때, 그것이 마실 물 한 잔처럼 보인다는 것만을 뜻하는 것은 아니다."}, {"en": "Water quality is about following a certain set of criteria, or “benchmarks.”", "ko": "수질은 특정한 기준의 집합, 즉 '지표'를 따르는 것에 관한 것이다."}, {"en": "These guidelines inform us exactly how much physical, chemical, or biological stuff can be in the water.", "ko": "이러한 지침은 정확히 얼마만큼의 물리적, 화학적, 생물학적 물질이 물속에 있어도 되는지를 알려 준다."}, {"en": "These rules ensure the water is safe for anything we want to do with it, whether that’s drinking it at home, watering crops on a farm, or running it through a huge industrial boiler.", "ko": "이러한 규칙은 우리가 물로 하려는 일이 집에서 마시는 것이든, 농장에서 작물에 물을 주는 것이든, 거대한 산업용 보일러에 흘려보내는 것이든, 그 물이 그 일에 안전하도록 보장한다."}, {"en": "We can’t utilize the same “one size fits all” rule for everyone because we use water for so many diverse things.", "ko": "우리는 물을 아주 다양한 일에 사용하기 때문에 모두에게 똑같은 '일률적인' 규칙을 쓸 수 없다."}, {"en": "For instance, the water that cools down a huge power plant generator doesn’t need to be as clean as the water you drink from the kitchen tap.", "ko": "예를 들어, 거대한 발전소의 발전기를 식히는 물은 여러분이 주방 수도꼭지에서 받아 마시는 물만큼 깨끗할 필요는 없다."}, {"en": "This is why groups set different “safety limits” for the water dependent on how it will be utilized.", "ko": "이것이 바로 여러 집단이 물이 어떻게 쓰일지에 따라 서로 다른 '안전 허용치'를 정하는 이유이다."}], "chunks": [[0, 0], [1, 2], [3, 4], [5, 6]], "ex": [{"head": "When we say that water", "clue": ["“clean,”", "don’t just mean"], "core": "'깨끗한 물' = 보기에 맑은 물만 뜻하는 것 X", "why": "글의 출발: '깨끗하다'는 말의 흔한 오해 깨기"}, {"head": "Water quality is about following", "clue": ["criteria", "“benchmarks.”"], "core": "수질 = 정해진 기준(criteria)을 따르는 것", "why": "겉모습 X → 그럼 진짜 뜻은? 기준을 따르는 것으로 바로 답함"}, {"head": "These guidelines inform us exactly", "clue": ["These guidelines"], "core": "기준 = 물속에 있어도 되는 물질의 양을 알려 줌", "why": "These guidelines(이 지침들) = 앞의 criteria·benchmarks(기준) → 기준 소개 바로 다음"}, {"head": "These rules ensure the water", "clue": ["These rules", "drinking", "watering crops", "industrial boiler"], "core": "이 규칙 = 마실 물·농업용·공업용 모두 안전 보장", "why": "These rules(이 규칙들) = 같은 기준을 또 다른 말로 받음 → 쓰임새 3가지(식수·농사·보일러) 등장"}, {"head": "We can’t utilize the same", "clue": ["“one size fits all”", "so many diverse things"], "core": "쓰임이 다양해서 똑같은 규칙 하나로는 안 됨", "why": "앞에서 나열한 다양한 쓰임 → so many diverse things(아주 다양한 일)로 받아 '일률적 규칙 불가'"}, {"head": "For instance, the water that", "clue": ["For instance", "doesn’t need to be as clean"], "core": "예: 발전기 냉각수는 식수만큼 깨끗할 필요 X", "why": "For instance(예를 들어) → '똑같은 규칙 불가'의 구체적 예시. 냉각수 vs 수돗물"}, {"head": "This is why groups set", "clue": ["This is why", "different “safety limits”"], "core": "결론: 쓰임에 따라 안전 허용치를 다르게 정함", "why": "This is why(이것이 ~한 이유) = 앞의 예시를 받아 결론. different(다른) = same(똑같은)과 대조"}], "postit": "깨끗함 ≠ 겉모습 → 기준 따르기 → 기준 = 물질 양·모든 용도 안전 → 용도 다양 → 일률 규칙 X → 예: 냉각수 → 용도별 허용치"}, {"id": "mock_2610_g2-39", "label": "26년 10월 39번 사회사학자의 사료 읽기", "sents": [{"en": "Like all historians, social historians draw from a variety of primary sources.", "ko": "모든 역사학자와 마찬가지로, 사회사학자도 다양한 1차 자료를 활용한다."}, {"en": "Social history often emphasizes ordinary people rather than elites.", "ko": "사회사는 흔히 엘리트보다 평범한 사람들을 강조한다."}, {"en": "Yet, in most places and times, nonelites lacked access to education and, thus, did not produce substantial amounts of documentation.", "ko": "하지만 대부분의 지역과 시대에서 엘리트가 아닌 사람들은 교육을 받을 기회가 부족했고, 그래서 많은 양의 문서 기록을 남기지 못했다."}, {"en": "Even when they did produce documentation, these materials rarely ended up in archives where they could be preserved and made available to researchers.", "ko": "그들이 문서 기록을 남겼을 때조차, 이러한 자료들은 보존되어 연구자들이 이용할 수 있게 되는 기록 보관소에 거의 들어가지 못했다."}, {"en": "Because of such biases in the historical record, social historians have to be very creative in their work.", "ko": "역사 기록의 이러한 편향 때문에, 사회사학자는 자신의 작업에서 매우 창의적이어야 한다."}, {"en": "Like other historians, social historians analyze textual sources produced by government officials, employers, and other elites.", "ko": "다른 역사학자들처럼 사회사학자도 정부 관료, 고용주, 그 밖의 엘리트들이 만든 문서 자료를 분석한다."}, {"en": "Yet rather than simply take such sources at face value, they read them “against the grain”.", "ko": "하지만 그들은 그러한 자료를 단순히 액면 그대로 받아들이기보다는 '일반적인 방식과 다르게' 읽는다."}, {"en": "So, for example, a social historian will read legal documents not only for the “facts” provided by slaveowners; she will also examine the silences, interruptions, rumors, and other details that offer hints about the enslaved peoples’ attitudes and actions.", "ko": "그래서 예를 들어, 사회사학자는 법률 문서를 노예 소유주가 제공한 '사실'만을 얻으려고 읽는 것이 아니라, 노예가 된 사람들의 태도와 행동에 대한 힌트를 주는 침묵, 중단, 소문, 그 밖의 세부 사항도 살펴볼 것이다."}], "chunks": [[0, 0], [1, 1], [2, 3], [4, 5], [6, 7]], "ex": [{"head": "Like all historians, social historians", "clue": ["social historians", "primary sources"], "core": "사회사학자도 여러 1차 자료를 씀", "why": "글의 출발: 사회사학자(social historians) 소개"}, {"head": "Social history often emphasizes ordinary", "clue": ["ordinary people rather than elites"], "core": "사회사 = 엘리트보다 평범한 사람 중심", "why": "사회사학자 → 그들의 분야(social history)의 특징으로 이어짐"}, {"head": "Yet, in most places and", "clue": ["Yet", "nonelites"], "core": "하지만 평범한 사람들은 교육 못 받아 기록이 적음", "why": "Yet(하지만) → 평범한 사람 연구의 문제. nonelites(비엘리트) = 앞의 ordinary people"}, {"head": "Even when they did produce", "clue": ["Even when", "these materials"], "core": "기록을 남겨도 보관소에 거의 안 감", "why": "they(그들) = 엘리트가 아닌 사람들. Even when(~할 때조차) → 앞의 '기록 적음'에 문제를 하나 더"}, {"head": "Because of such biases in", "clue": ["such biases"], "core": "이런 기록의 편향 때문에 창의적이어야 함", "why": "such biases(그러한 편향) = 앞의 '평범한 사람 기록은 적고 안 남음' → 문제 두 개 다음에 와야 함"}, {"head": "Like other historians, social historians", "clue": ["produced by government officials, employers, and other elites"], "core": "그래서 결국 엘리트가 만든 문서를 분석함", "why": "창의적이어야 하는 상황 → 남아 있는 건 엘리트 문서뿐 → 그것을 분석"}, {"head": "Yet rather than simply take", "clue": ["Yet", "such sources", "“against the grain”"], "core": "하지만 액면 그대로 X, 거슬러 읽음", "why": "such sources(그러한 자료) = 바로 앞 엘리트가 만든 문서 → Yet(하지만)으로 읽는 방식 반전"}, {"head": "So, for example, a social", "clue": ["for example", "not only", "she will also examine"], "core": "예: 법률 문서의 '사실' + 침묵·소문에서 노예들의 단서 찾기", "why": "for example(예를 들어) → '거슬러 읽기'의 구체적 예시. not only A; also B(A뿐 아니라 B도)"}], "postit": "사회사 = 평범한 사람 → 기록 적음·보관 X → 편향 → 엘리트 문서 분석 → 거슬러 읽기 → 예: 법률 문서의 침묵·소문"}, {"id": "mock_2610_g2-40", "label": "26년 10월 40번 돌고래의 병렬 처리 청각 피질", "sents": [{"en": "Dolphins’ brains have evolved specialized areas dedicated to echolocation, allowing them to process acoustic information more quickly and with less energy.", "ko": "돌고래의 뇌는 반향 정위에 쓰이는 특화된 구역을 진화시켰고, 이것은 그들이 음향 정보를 더 빠르고 더 적은 에너지로 처리할 수 있게 해 준다."}, {"en": "One key adaptation is the structure of the dolphin’s auditory pathway.", "ko": "한 가지 핵심적인 적응은 돌고래의 청각 경로의 구조이다."}, {"en": "The signals from the ears are rapidly transmitted to the auditory cortex, the brain region responsible for processing sound.", "ko": "귀에서 온 신호는 소리 처리를 담당하는 뇌 영역인 청각 피질로 빠르게 전달된다."}, {"en": "However, unlike many other mammals, dolphins have a highly specialized auditory cortex with distinct areas dedicated to processing different aspects of echolocation signals.", "ko": "그러나 다른 많은 포유류와 달리, 돌고래는 반향 정위 신호의 서로 다른 측면을 처리하는 개별 구역을 가진 고도로 특화된 청각 피질을 가지고 있다."}, {"en": "Some areas may be responsible for analyzing the timing of echoes, while others focus on the frequency content or the intensity of the sound.", "ko": "어떤 구역은 반사음의 타이밍 분석을 담당하고, 다른 구역은 소리의 주파수 성분이나 강도에 집중한다."}, {"en": "This specialization allows the dolphin’s brain to process echo information in parallel, rather than sequentially.", "ko": "이러한 특화 덕분에 돌고래의 뇌는 반사음 정보를 순차적으로가 아니라 병렬로 처리할 수 있다."}, {"en": "Imagine a factory assembly line, where different workers are responsible for different tasks.", "ko": "서로 다른 노동자들이 서로 다른 일을 맡는 공장 조립 라인을 떠올려 보라."}, {"en": "By dividing the work among specialized areas, the brain can process information much faster and more efficiently.", "ko": "특화된 구역들에 일을 나누어 줌으로써, 뇌는 정보를 훨씬 더 빠르고 효율적으로 처리할 수 있다."}, {"en": "This parallel processing reduces the cognitive load associated with echolocation, allowing dolphins to react quickly to changes in their environment.", "ko": "이러한 병렬 처리는 반향 정위에 따르는 인지 부담을 줄여 주어, 돌고래가 환경의 변화에 빠르게 반응할 수 있게 해 준다."}], "chunks": [[0, 0], [1, 2], [3, 4], [5, 5], [6, 8]], "ex": [{"head": "Dolphins’ brains have evolved specialized", "clue": ["specialized areas", "echolocation"], "core": "돌고래 뇌 = 반향 정위 전용 구역 → 더 빠르게·덜 힘들게", "why": "글의 출발: 돌고래 뇌의 특화된 구역(specialized areas)"}, {"head": "One key adaptation is the", "clue": ["One key adaptation"], "core": "핵심 적응 하나 = 청각 경로의 구조", "why": "One key adaptation(한 가지 핵심 적응) → 앞의 반향 정위용으로 진화한 뇌의 구체적 예 하나를 꺼냄"}, {"head": "The signals from the ears", "clue": ["the auditory cortex"], "core": "귀의 신호 → 소리 처리하는 청각 피질로 전달", "why": "청각 경로(pathway)를 따라 신호가 가는 곳 설명 → 청각 피질(auditory cortex) 처음 등장"}, {"head": "However, unlike many other mammals,", "clue": ["However, unlike many other mammals", "distinct areas"], "core": "그러나 돌고래 청각 피질은 여러 구역으로 나뉨", "why": "However(그러나) → 앞의 일반적인 청각 피질과 달리 돌고래만의 특별한 점. 피질이 앞에서 소개된 뒤라야 가능"}, {"head": "Some areas may be responsible", "clue": ["Some areas", "while others"], "core": "구역별 분담: 타이밍 담당 / 주파수·강도 담당", "why": "Some areas(어떤 구역들) = 앞의 distinct areas(개별 구역) → 구역마다 맡은 일 설명"}, {"head": "This specialization allows the dolphin’s", "clue": ["This specialization", "in parallel"], "core": "이 특화 덕에 병렬 처리(순차 X)", "why": "This specialization(이 특화) = 앞의 '구역별 일 나누기' → 그 결과 parallel(병렬) 처리"}, {"head": "Imagine a factory assembly line,", "clue": ["Imagine", "different workers", "different tasks"], "core": "비유: 공장 조립 라인(노동자마다 다른 일)", "why": "병렬 처리를 쉽게 보여 주는 비유 → 구역 = 노동자, 반향 정보 처리 = 일"}, {"head": "By dividing the work among", "clue": for(var i=0;i<ch.length;i++){var r=ch[i].getBoundingClientRect();if(y<r.top+r.height/2){put=ch[i];break}}
if(put)bx.insertBefore(ph,put);else bx.appendChild(ph);
if(e.clientY<60)window.scrollBy(0,-12);else if(e.clientY>window.innerHeight-60)window.scrollBy(0,12)}
function up(e){if(!dg)return;var c=dg;dg=null;c.removeEventListener('pointermove',move);c.removeEventListener('pointerup',up);c.removeEventListener('pointercancel',up);
c.classList.remove('drag');c.style.position='';c.style.left='';c.style.top='';c.style.width='';ph.parentNode.insertBefore(c,ph);ph.remove();ph=null}
function submit(){if(locked)return;locked=true;var p=P[cur],bx=$('bx'),cs=bx.children,ok=0,n=cs.length;
for(var i=0;i<n;i++){var k=+cs[i].getAttribute('data-k'),g=(k==i+1);if(g)ok++;cs[i].classList.add(g?'ok':'ng');cs[i].classList.remove('mv');cs[i].insertAdjacentHTML('beforeend','<span class="mk">'+(g?'O':'X')+'</span>')}
var all=ok==n;if(all){st[p.id]=st[p.id]||{};st[p.id][lv]=1;save()}
$('sb').style.display='none';
var h='<div class="band '+(all?'ok':'ng')+'">'+(all?'정답':'다시 확인')+'<small>'+n+'개 중 '+ok+'개 제자리</small></div>';
h+='<div class="exh">이 순서로 기억하기</div>';
var cs2={};units.forEach(function(u,ui){if(ui>0)cs2[u[0]]=1});
p.sents.forEach(function(s,i){var x=p.ex[i];h+='<div class="ex'+(lv==1&&cs2[i]?' cb':'')+'"><span class="no">'+(i+1)+'</span>'+(i==0?'<span class="ck">시작</span>':'')+'<div class="en" lang="en" translate="no">'+mark(s.en,x)+'</div><div class="ko">'+esc(s.ko)+'</div>'+(x.core?'<div class="core">'+esc(x.core)+'</div>':'')+(x.why?'<div class="why">'+esc(x.why)+'</div>':'')+'</div>'});
h+='<div class="post"><small>이 순서 이렇게 외우자</small>'+esc(p.postit)+'</div>';
h+='<button class="btn go" onclick="open_('+cur+','+lv+')">다시 섞기</button>';
if(lv==1)h+='<button class="btn sec" onclick="open_('+cur+',2)">2단계 문장으로</button>';
else if(cur+1<P.length)h+='<button class="btn sec" onclick="open_('+(cur+1)+',1)">다음 지문</button>';
$('res').innerHTML=h}
function mark(en,x){var hd=x.head||'',a=en,b='';if(hd&&en.indexOf(hd)==0){a=en.slice(0,hd.length);b=en.slice(hd.length)}else{a='';b=en}
var r=esc(b);(x.clue||[]).forEach(function(c){var t=esc(c);if(!t)return;var i=r.indexOf(t);if(i>=0&&r.lastIndexOf('<',i)<=r.lastIndexOf('>',i))r=r.slice(0,i)+'<span class="cl">'+t+'</span>'+r.slice(i+t.length)});
return (a?'<span class="hd">'+esc(a)+'</span>':'')+r}
list();
</script></body></html>
