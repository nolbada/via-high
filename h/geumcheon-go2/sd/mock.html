과 겹친다."}, {"en": "For example, courts are traditional social institutions and important for the normal and harmonious functioning of collective life.", "ko": "예를 들어, 법원은 전통적인 사회 제도이며 공동생활이 정상적이고 조화롭게 돌아가는 데 중요하다."}, {"en": "However, when people turn to social networks to put pressure on judicial decisions in certain mediated and politicized processes, this practice is popularized and becomes a habitual form of culture, which is harmful.", "ko": "그러나 어떤 조정되고 정치화된 과정에서 사람들이 사법적 판결에 압력을 가하려고 소셜 네트워크에 의지하면, 이러한 관행이 대중화되어 습관적인 문화의 한 형태가 되는데, 이는 해롭다."}, {"en": "Justice must not be done in the public square, which today is converted into a virtual dimension, the social networks.", "ko": "재판은 대중 광장에서 이루어져서는 안 되는데, 오늘날 그 광장은 가상의 차원, 즉 소셜 네트워크로 바뀌어 있다."}, {"en": "In a democratic state of law, the appropriate place to judge and make justice is the court and in a way that is immune to popular pressure.", "ko": "민주적인 법치 국가에서 재판하고 정의를 실현하기에 알맞은 곳은 법원이며, 그것도 대중의 압력에 흔들리지 않는 방식이어야 한다."}], "chunks": [[0, 0], [1, 1], [2, 2], [3, 4]], "ex": [{"head": "If we understand mass culture", "clue": ["mass culture", "the intermediary institutions"], "core": "대중문화는 가족·학교 같은 매개 제도를 약하게 만듦", "why": "글의 출발: 대중문화가 전통 '제도(institutions)'를 약화시킨다는 주장"}, {"head": "For example, courts are traditional", "clue": ["For example", "courts", "traditional social institutions"], "core": "예: 법원도 공동생활에 중요한 전통 제도", "why": "For example(예를 들어) + institutions(제도) → 앞의 '매개 제도'의 예로 법원을 듦"}, {"head": "However, when people turn to", "clue": ["However", "social networks", "judicial decisions"], "core": "그런데 소셜 네트워크로 판결에 압력 → 습관이 되어 해로움", "why": "However(그러나) → '법원은 중요함'과 대조, judicial(재판의) = 앞의 courts"}, {"head": "Justice must not be done", "clue": ["the public square", "the social networks"], "core": "재판은 대중 광장(= 오늘날 소셜 네트워크)에서 하면 안 됨", "why": "앞의 '소셜 네트워크로 압력'을 받아 public square(대중 광장)로 바꿔 말하며 비판"}, {"head": "In a democratic state of", "clue": ["the appropriate place", "the court", "immune to popular pressure"], "core": "정 tent of change may vary at different stages, every phase of life allows room for adaptation and transformation.", "ko": "비록 변화의 정도는 단계마다 다를 수 있지만, 삶의 모든 단계는 적응과 변화의 여지를 허용한다."}], "chunks": [[0, 0], [1, 3], [4, 4], [5, 6]], "ex": [{"head": "Human development is now increasingly", "clue": ["rather than a fixed sequence of stages"], "core": "발달 = 고정된 단계 X, 계속 변하는 유연한 과정", "why": "글의 출발: 요즘 보는 발달의 새 관점(고정된 단계 X → 변하는 과정)"}, {"head": "At the core of this", "clue": ["this perspective", "plasticity"], "core": "이 관점의 핵심 = 가소성(plasticity)", "why": "this perspective(이 관점) = 바로 앞 '발달은 변하는 과정'이라는 관점 → 그 핵심 개념 소개"}, {"head": "Plasticity refers to the human", "clue": ["Plasticity refers to"], "core": "가소성 = 경험·환경에 맞춰 생각·감정·행동을 바꾸는 능력", "why": "앞 문장 끝에 처음 나온 plasticity(가소성)를 바로 뜻풀이 → refers to(~을 가리키다)"}, {"head": "It highlights that individuals", "clue": ["It", "not merely passive", "but active agents"], "core": "사람 = 수동적 수용자 X, 평생 성장하는 능동적 주체", "why": "It(그것) = 앞에서 정의한 가소성 → 가소성이 강조하는 점으로 이어짐"}, {"head": "In earlier views, development was", "clue": ["In earlier views"], "core": "예전 관점: 발달은 아동기, 성인기는 안정, 노년기는 쇠퇴", "why": "In earlier views(이전 관점에서는) → 지금의 가소성 관점과 대비되는 옛날 생각 등장"}, {"head": "The concept of plasticity challenges", "clue": ["challenges", "this rigid outlook"], "core": "가소성이 옛날의 경직된 관점에 반박 → 발달은 평생 계속", "why": "this rigid outlook(이 경직된 사고방식) = 바로 앞 '아동기 발달·노년기 쇠퇴' 관점 → 반드시 옛날 관점 다음"}, {"head": "Although the extent of change", "clue": ["every phase of life"], "core": "변화 정도는 달라도 모든 시기에 변화 가능", "why": "앞의 '전 생애(entire lifespan)'를 every phase of life(삶의 모든 단계)로 다시 정리하는 마무리"}], "postit": "발달 = 변하는 과정 → 핵심은 가소성(뜻·능동적 주체) → 옛날엔 아동기만 발달 → 가소성이 반박: 모든 시기에 변화", "cex": [{"core": "발달 = 고정된 단계 X, 계속 변하는 유연한 과정", "why": "글의 출발: 요즘 보는 발달의 새 관점(rather than a fixed sequence, 고정된 순서가 아니라)"}, {"core": "관점의 핵심 가소성: 평생 성장하는 능동적 주체", "why": "this perspective(이 관점) = 앞의 '발달은 변하는 과정' → 그 핵심 개념 plasticity(가소성) 소개"}, {"core": "예전 관점: 아동기 발달, 성인기 안정, 노년기 쇠퇴", "why": "In earlier views(이전 관점에서는) → 가소성 관점과 대비되는 옛날 생각 등장"}, {"core": "가소성의 반박: 발달은 삶의 모든 단계에서 계속", "why": "this rigid outlook(이 경직된 관점) = 앞의 '아동기 발달·노년기 쇠퇴' → challenges(반박함)로 마무리"}]}, {"id": "mock_2610_g2-34", "label": "26년 10월 34번 상호 연결성과 새로운 취약성", "sents": [{"en": "Social media has altered business, politics, and friendships, making going viral a household term.", "ko": "소셜 미디어는 비즈니스, 정치, 친구 관계를 바꾸어 놓았고, '입소문이 나다(going viral)'를 일상적인 용어로 만들었다."}, {"en": "The global financial industry links every bank and countless households in every country, making us vulnerable to human error taking place on the other side of the world.", "ko": "세계 금융 산업은 모든 나라의 모든 은행과 수많은 가정을 연결하여, 우리를 세계 반대편에서 일어나는 인간의 실수에 취약하게 만든다."}, {"en": "As Columbia University strategy professor Rita McGrath explains, years ago most of our institutions were separate and thereby buffered from the effects of errors outside their walls.", "ko": "Columbia University 전략학 교수 Rita McGrath가 설명하듯이, 수년 전에는 우리 기관들 대부분이 분리되어 있었고, 그 덕분에 자신의 울타리 밖에서 일어난 오류의 영향으로부터 보호되었다."}, {"en": "That is no longer the case.", "ko": "이제는 더 이상 그렇지 않다."}, {"en": "The digitization of massive amounts of information has continued to grow enormously as the cost of computing power has decreased.", "ko": "컴퓨팅 능력의 비용이 줄어들면서 방대한 양의 정보의 디지털화는 계속해서 엄청나게 늘어났다."}, {"en": "The development of smart systems that communicate autonomously gave rise to an infinite variety of potential breakdowns.", "ko": "자율적으로 소통하는 스마트 시스템의 발달은 무한히 다양한 잠재적 고장을 낳았다."}, {"en": "This interdependence is a breeding ground for complex failure.", "ko": "이러한 상호 의존성은 복합적인 실패의 온상이다."}, {"en": "As Rita puts it, when “things that used to be kept separate bump up against each other, it becomes far more difficult to predict what’s going to happen next.”", "ko": "Rita가 말하듯이, '분리되어 있던 것들이 서로 부딪치게 되면, 다음에 무슨 일이 일어날지 예측하기가 훨씬 더 어려워진다.'"}, {"en": "Information technology creates new vulnerabilities because interconnectedness instantly spreads the impact of small failures.", "ko": "정보 기술은 새로운 취약성을 만들어 내는데, 상호 연결성이 작은 실패의 "why": "글의 출발: 세상이 서로 연결된 두 예시 → vulnerable(취약한)이라는 문제 제기"}, {"core": "예전엔 기관들이 분리돼 보호, 이제는 아님", "why": "years ago(수년 전) → 연결된 지금과 대비되는 과거, That is no longer the case(이제 그렇지 않음)"}, {"core": "정보 디지털화와 스스로 소통하는 스마트 시스템", "why": "더 이상 분리되지 않은 이유 → digitization(디지털화)과 smart systems(스마트 시스템)"}, {"core": "상호 의존이 작은 실패를 즉시 퍼뜨려 새 취약성", "why": "This interdependence(이 상호 의존) = 앞의 서로 소통하는 시스템 → Rita 인용 뒤 결론"}]}, {"id": "mock_2610_g2-36", "label": "26년 10월 36번 우리는 사용자가 아니다", "sents": [{"en": "A simple truth that designers must embrace in order to create more effective products and experiences is the fact that we are not the user.", "ko": "디자이너가 더 효과적인 제품과 경험을 만들기 위해 받아들여야 하는 단순한 진리는 우리가 사용자가 아니라는 사실이다."}, {"en": "We’re much too close to what we build to objectively see it and understand how users will interact with it.", "ko": "우리는 우리가 만드는 것에 너무 가까이 있어서 그것을 객관적으로 보고 사용자가 그것과 어떻게 상호 작용할지 이해할 수 없다."}, {"en": "The best user interfaces are those that have been shaped by observations of real users and their interactions with them.", "ko": "가장 좋은 사용자 인터페이스는 실제 사용자와 그들이 인터페이스와 상호 작용하는 모습을 관찰한 결과로 만들어져 온 것들이다."}, {"en": "So how can designers shape their work to be more effective?", "ko": "그렇다면 디자이너는 어떻게 자신의 작업을 더 효과적으로 만들 수 있을까?"}, {"en": "An incredibly effective way is with usability testing.", "ko": "엄청나게 효과적인 한 가지 방법은 사용성 테스트를 활용하는 것이다."}, {"en": "The goal of this method is to uncover problems in a design, discover existing opportunities, and learn more about the behaviors and preferences of users by asking participants to engage in realistic activities.", "ko": "이 방법의 목표는 참가자에게 실제와 같은 활동을 하도록 요청하여, 디자인의 문제를 밝혀내고, 이미 있는 기회를 발견하며, 사용자의 행동과 선호에 대해 더 많이 알아내는 것이다."}, {"en": "This technique is effective for understanding how well a design will perform once it is in the hands of real users.", "ko": "이 기법은 디자인이 실제 사용자의 손에 들어갔을 때 얼마나 잘 작동할지 이해하는 데 효과적이다."}, {"en": "Designers can use this method to improve their work through subsequent revisions based on the findings from representative users.", "ko": "디자이너는 대표 사용자에게서 얻은 결과를 바탕으로 이후 수정을 거쳐 자신의 작업을 개선하는 데 이 방법을 사용할 수 있다."}], "chunks": [[0, 0], [1, 1], [2, 3], [4, 5], [6, 7]], "ex": [{"head": "A simple truth that designers", "clue": ["we are not the user"], "core": "디자이너가 받아들일 진리: 우리는 사용자가 아님", "why": "글의 출발: '디자이너 ≠ 사용자'라는 단순한 진리"}, {"head": "We’re much too close to", "clue": ["much too close", "to objectively see it"], "core": "만든 것에 너무 가까워 객관적으로 못 봄", "why": "왜 사용자가 아닌지 이유 → We(우리) = 앞 문장의 we(디자이너). too ~ to(너무 ~해서 …못함)"}, {"head": "The best user interfaces are", "clue": ["real users"], "core": "최고의 화면 = 실제 사용자 관찰로 만들어진 것", "why": "우리(디자이너)는 객관적으로 못 봄 → 그러니 real users(실제 사용자)를 관찰해야 함으로 연결"}, {"head": "So how can designers shape", "clue": ["So how"], "core": "그럼 디자이너는 어떻게 더 효과적으로?", "why": "So(그렇다면) → 앞 원칙을 실제로 어떻게 할지 질문 던짐"}, {"head": "An incredibly effective way is", "clue": ["An incredibly effective way", "usability testing"], "core": "답: 사용성 테스트", "why": "질문(how ~?)에 대한 답 → way(방법) = 질문의 how에 대응. 질문 바로 다음"}, {"head": "The goal of this method", "clue": ["this method"], "core": "목표: 실제 같은 활동으로 문제·기회·선호 발견", "why": "this method(이 방법) = 바로 앞 사용성 테스트 → 방법 소개 다음에 목표 설명"}, {"head": "This technique is effective for", "clue": ["This technique", "real users"], "core": "실제 사용자 손에서 얼마나 잘 작동할지 파악", "why": "This technique(이 기법) = 사용성 테스트를 다른 말로 다시 받음 → 목표 다음에 효과"}, {"head": "Designers can use this method", "clue": ["this method", "subsequent revisions"], "core": "결과를 바탕으로 계속 고쳐 나가는 데 활용", "why": "this method(이 방법) 한 번 더 → subsequent revisions(이후 수정)로 활용 단계 마무리"}], "postit": "디자이너 ≠ 사용자 → 너무 가까워 객관적 X → 실제 사용자 관찰 → 그럼 어떻게? → 사용성 테스트 → 목표·효과·개선", "cex": [{"core": "디자이너가 받아들일 진리: 우리는 사용자가 아님", "why": "글의 출발: we are not the user(우리는 사용자가 아니다)라는 단순한 진리"}, {"core": "만든 것에 너무 가까워 객관적으로 못 봄", "why": "왜 사용자가 아닌지 이유 → too close to ~ to see(너무 가까워 볼 수 없음)"}, {"core": "실제 사용자 관찰이 최선, 그럼 어떻게?", "why": "객관적으로 못 보니 → real users(실제 사용자) 관찰, So how ~?(그럼 어떻게?)로 질문"}, {"core": "답은 사용성 테스트: 실제 활동으로 문제·선호 발견", "why": "앞 덩어리 끝 질문 how(어떻게)의 답 → An incredibly effective way(아주 효과적인 방법)"}, {"core": "실제 사용자 손에서의 성능 파악과 계속 수정", "why": "This technique(이 기법) = 앞의 사용성 테스트 → 효과와 subsequent revisions(이후 수정)로 마무리"}]}, {"id": "mock_2610_g2-37", "label": "26년 10월 37번 재평가와 감정 조절", "sents": [{"en": "Reappraisal—changing the way one thinks about emotional situations—might present a particularly effective avenue to regulating emotions because it transforms emotions at their root.", "ko": "재평가, 즉 감정적인 상황에 대해 생각하는 방식을 바꾸는 것은 감정을 근본부터 바꾸기 때문에 감정을 조절하는 데 특히 효과적인 방법이 될 수 있다."}, {"en": "Take, for example, someone who is going through a divorce.", "ko": "예를 들어, 이혼을 겪고 있는 사람을 생각해 보자."}, {"en": "This is often an adverse event, and yet, it can be construed in different ways.", "ko": "이것은 보통 부정적인 사건이지만, 그럼에도 서로 다른 방식으로 해석될 수 있다."}, {"en": "One might view it as an overpowering loss that will mark one’s family for life.", "ko": "어떤 사람은 그것을 가족에게 평생 흔적을 남길 압도적인 상실로 볼 수 있다."}, {"en": "Alternatively, one might see it as something that is painful but that might lead to positive outcomes in the long run, such as improved relationships.", "ko": "이와 달리, 어떤 사람은 그것을 고통스럽지만 장기적으로는 더 나아진 관계 같은 긍정적인 결과로 이어질 수 있는 일로 볼 수도 있다."}, {"en": "As a result of these different construals, one might feel different emotions.", "ko": "이렇게 서로 다른 해석의 결과로, 사람은 서로 다른 감정을 느낄 수 있다."}, {"en": "The first construal may bring intense sadness and anger.", "ko": "첫 번째 해석은 강렬한 슬픔과 분노를 가져올 수 있다."}, {"en": "The second construal might also bring sadness and anger but perhaps at lower levels.", "ko": "두 번째 해석 역시 슬픔과 분노를 가져올 수 있지만, 아마도 더 낮은 강도일 것이다."}, {"en": "Crucially, it might also bring some positive emotions, such as hope, strength, or gratitude.", "ko": "결정적으로, 그것은 희망, 강인함, 감사 같은 긍정적인 감정도 가져올 수 있다."}, {"en": "This example illustrates how reappraisal might powerfully transform short-term emotional responses.", "ko": "이 예시는 재평가가 단기적인 감정 반응을 어떻게 강력하게 바꿀 수 있는지 보여 준다."}, {"en": "When repeated over time, these short-term emotional consequences of reappraisal might accumulate to shape people’s psychological health.", "ko": "오랜 시간 반복되면, 재평가가 낳은 이러한 단기적인 감정의 결과가 쌓여 사람들의 심리적 건강을 형성할 수 있다."}, {"en": "Thereby, reappraisal might be a key to resilience.", "ko": "그렇게 함으로써, 재평가는 회복 탄력성의 열쇠가 될 수 있다."}], "chunks": [[0, 0], [1, 2], [3, 4], [5, 8], [9, 11]], "ex": [{"head": "Reappraisal—changing the way one thinks", "clue": ["Reappraisal", "at their root"], "core": "재평가 = 생각하는 방식 바꾸기 → 감정을 뿌리부터 조절", "why": "글의 출발: 재평가(reappraisal)의 뜻과 효과 소개"}, {"head": "Take, for example, someone who", "clue": ["for example", "a divorce"], "core": "예시: 이혼을 겪는 사람", "why": "for example(예를 들어) → 앞의 재평가를 설명할 사례(이혼) 꺼냄"}, {"head": "This is often an adverse", "clue": ["This", "and yet", "in different ways"], "core": "이혼은 부정적 사건이지만 다르게 해석 가능", "why": "This(이것) = 바로 앞의 a divorce(이혼) → 사례 소개 바로 다음"}, {"head": "One might view it as", "clue": ["One might view it"], "core": "해석 1: 가족에게 평생 남을 큰 상실", "why": "it(그것) = 이혼. 앞의 in different ways(다른 방식들)의 첫 번째 방식 제시"}, {"head": "Alternatively, one might see it", "clue": ["Alternatively"], "core": "해석 2: 아프지만 장기적으로 좋은 결과로 이어질 일", "why": "Alternatively(이와 달리) → 첫 번째 해석과 다른 두 번째 해석"}, {"head": "As a result of these", "clue": ["these different construals"], "core": "해석이 다르면 느끼는 감정도 다름", "why": "these different construals(이 서로 다른 해석들) = 앞의 해석 1·2 → 두 해석이 다 나온 뒤에만 가능"}, {"head": "The first construal may bring", "clue": ["The first construal"], "core": "해석 1 → 강한 슬픔·분노", "why": "The first construal(첫 번째 해석) = 앞의 '평생 남을 상실' → 해석별 감정 시작"}, {"head": "The second construal might also", "clue": ["The second construal", "also", "at lower levels"], "core": "해석 2 → 슬픔·분노도 있지만 더 약하게", "why": "first 다음 second(두 번째) → 순서 고정. also(역시) = 첫 번째처럼 슬픔·분노는 있음"}, {"head": "Crucially, it might also bring", "clue": ["Crucially", "it", "positive emotions"], "core": "결정적으로 해석 2는 희망·감사 같은 긍정 감정도 가져옴", "why": "it(그것) = 두 번째 해석 → Crucially(결정적으로)로 두 번째 해석의 강점 추가"}, {"head": "This example illustrates how reappraisal", "clue": ["This example", "short-term"], "core": "이 예시 = 재평가가 단기 감정 반응을 바꿈", "why": "This example(이 예시) = 지금까지의 이혼 사례 → 사례가 끝난 뒤 정리"}, {"head": "When repeated over time, these", "clue": ["When repeated over time", "these short-term emotional consequences"], "core": "오래 반복되면 쌓여서 심리적 건강 형성", "why": "these short-term(이 단기적인) = 바로 앞 단기 감정 반응 → 장기로 확장"}, {"head": "Thereby, reappraisal might be a", "clue": ["Thereby", "resilience"], "core": "결론: 재평가 = 회복 탄력성의 열쇠", "why": "Thereby(그렇게 함으로써) = 앞의 '쌓여서 건강 형성'의 결과 → 마지막 결론"}], "postit": "재평가 = 생각 바꾸기 → 예: 이혼 → 해석 1(상실)·해석 2(성장) → 다른 감정 → 이 예시 정리 → 쌓이면 건강 → 회복 탄력성", "cex": [{"core": "재평가 = 생각을 바꿔 감정을 뿌리부터 조절", "why": "글의 출발: reappraisal(재평가)의 뜻과 효과 소개"}, {"core": "예시: 부정적이지만 다르게 해석 가능한 이혼", "why": "Take, for example(예를 들어 보자) → 재평가 설명용 사례, This(이것) = 이혼"}, {"core": "해석 1 큰 상실 vs 해석 2 장기적으로 좋은 결과", "why": "it(그것) = 이혼 → 앞의 in different ways(다른 방식들)를 One might·Alternatively로 두 가지 제시"}, {"core": "해석이 다르면 감정도 다름: 해석 2엔 긍정 감정도", "why": "these different construals(이 서로 다른 해석들) = 앞의 두 해석 → The first·The second로 감정 비교"}, {"core": "반복된 재평가가 쌓여 회복 탄력성의 열쇠", "why": "This example(이 예시) = 이혼 사례 전체 → When repeated over time(오래 반복되면) 장기로 확장해 결론"}]}, {"id": "mock_2610_g2-38", "label": "26년 10월 38번 수질과 용도별 안전 기준", "sents": [{"en": "When we say that water is “clean,” we don’t just mean that it looks like a glass of water.", "ko": "우리가 물이 '깨끗하다'고 말할 때, 그것이 마실 물 한 잔처럼 보인다는 것만을 뜻하는 것은 아니다."}, {"en": "Water quality is about following a certain set of criteria, or “benchmarks.”", "ko": "수질은 특정한 기준의 집합, 즉 '지표'를 따르는 것에 관한 것이다."}, {"en": "These guidelines inform us exactly how much physical, chemical, or biological stuff can be in the water.", "ko": "이러한 지침은 정확히 얼마만큼의 물리적, 화학적, 생물학적 물질이 물속에 있어도 되는지를 알려 준다."}, {"en": "These rules ensure the water is safe for anything we want to do with it, whether that’s drinking it at home, watering crops on a farm, or running it through a huge industrial boiler.", "ko": "이러한 규칙은 우리가 물로 하려는 일이 집에서 마시는 것이든, 농장에서 작물에 물을 주는 것이든, 거대한 산업용 보일러에 흘려보내는 것이든, 그 물이 그 일에 안전하도록 보장한다."}, {"en": "We can’t utilize the same “one size fits all” rule for everyone because we use water for so many diverse things.", "ko": "우리는 물을 아주 다양한 일에 사용하기 때문에 모두에게 똑같은 '일률적인' 규칙을 쓸 수 없다."}, {"en": "For instance, the water that cools down a huge power plant generator doesn’t need to be as clean as the water you drink from the kitchen tap.", "ko": "예를 들어, 거대한 발전소의 발전기를 식히는 물은 여러분이 주방 수도꼭지에서 받아 마시는 물만큼 깨끗할 필요는 없다."}, {"en": "This is why groups set different “safety limits” for the water dependent on how it will be utilized.", "ko": "이것이 바로 여러 집단이 물이 어떻게 쓰일지에 따라 서로 다른 '안전 허용치'를 정하는 이유이다."}], "chunks": [[0, 0], [1, 2], [3, 4], [5, 6]], "ex": [{"head": "When we say that water", "clue": ["“clean,”", "don’t just mean"], "core": "'깨끗한 물' = 보기에 맑은 물만 뜻하는 것 X", "why": "글의 출발: '깨끗하다'는 말의 흔한 오해 깨기"}, {"head": "Water quality is about following", "clue": ["criteria", "“benchmarks.”"], "core": "수질 = 정해진 기준(criteria)을 따르는 것", "why": "겉모습 X → 그럼 진짜 뜻은? 기준을 따르는 것으로 바로 답함"}, {"head": "These guidelines inform us exactly", "clue": ["These guidelines"], "core": "기준 = 물속에 있어도 되는 물질의 양을 알려 줌", "why": "These guidelines(이 지침들) = 앞의 criteria·benchmarks(기준) → 기준 소개 바로 다음"}, {"head": "These rules ensure the water", "clue": ["These rules", "drinking", "watering crops", "industrial boiler"], "core": "이 규칙 = 마실 물·농업용·공업용 모두 안전 보장", "why": "These rules(이 규칙들) = 같은 기준을 또 다른 말로 받음 → 쓰임새 3가지(식수·농사·보일러) 등장"}, {"head": "We can’t utilize the same", "clue": ["“one size fits all”", "so many diverse things"], "core": "쓰임이 다양해서 똑같은 규칙 하나로는 안 됨", "why": "앞에서 나열한 다양한 쓰임 → so many diverse things(아주 다양한 일)로 받아 '일률적 규칙 불가'"}, {"head": "For instance, the water that", "clue": ["For instance", "doesn’t need to be as clean"], "core": "예: 발전기 냉각수는 식수만큼 깨끗할 필요 X", "why": "For instance(예를 들어) → '똑같은 규칙 불가'의 구체적 예시. 냉각수 vs 수돗물"}, {"head": "This is why groups set", "clue": ["This is why", "different “safety limits”"], "core": "결론: 쓰임에 따라 안전 허용치를 다르게 정함", "why": "This is why(이것이 ~한 이유) = 앞의 예시를 받아 결론. different(다른) = same(똑같은)과 대조"}], "postit": "깨끗함 ≠ 겉모습 → 기준 따르기 → 기준 = 물질 양·모든 용도 안전 → 용도 다양 → 일률 규칙 X → 예: 냉각수 → 용도별 허용치", "cex": [{"core": "깨끗한 물 = 겉보기 맑은 물만이 아님", "why": "글의 출발: we don't just mean(~만 뜻하는 것 아님)으로 '깨끗하다'의 흔한 오해 깨기"}, {"core": "수질 = 물속 물질 허용량을 정한 기준 따르기", "why": "겉모습 X → 그럼 진짜 뜻은? criteria(기준), These guidelines(이 지침들)로 받아 설명"}, {"core": "쓰임이 다양해 규칙 하나로는 안 됨", "why": "These rules(이 규칙들) = 앞의 기준 → 식수·농사·보일러 쓰임 나열, one size fits all(일률적) 불가"}, {"core": "예: 냉각수 vs 수돗물 → 쓰임별 다른 안전 허용치", "why": "For instance(예를 들어) → 일률적 규칙 불가의 예시, This is why(이것이 ~한 이유)로 결론"}]}, {"id": "mock_2610_g2-39", "label": "26년 10월 39번 사회사학자의 사료 읽기", "sents": [{"en": "Like all historians, social historians draw from a variety of primary sources.", "ko": "모든 역사학자와 마찬가지로, 사회사학자도 다양한 1차 자료를 활용한다."}, {"en": "Social history often emphasizes ordinary people rather than elites.", "ko": "사회사는 흔히 엘리트보다 평범한 사람들을 강조한다."}, {"en": "Yet, in most places and times, nonelites lacked access to education and, thus, did not produce substantial amounts of documentation.", "ko": "하지만 대부분의 지역과 시대에서 엘리트가 아닌 사람들은 교육을 받을 기회가 부족했고, 그래서 많은 양의 문서 기록을 남기지 못했다."}, {"en": "Even when they did produce documentation, these materials rarely ended up in archives where they could be preserved and made available to researchers.", "ko": "그들이 문서 기록을 남겼을 때조차, 이러한 자료들은 보존되어 연구자들이 이용할 수 있게 되는 기록 보관소에 거의 들어가지 못했다."}, {"en": "Because of such biases in the historical record, social historians have to be very creative in their work.", "ko": "역사 기록의 이러한 편향 때문에, 사회사학자는 자신의 작업에서 매우 창의적이어야 한다."}, {"en": "Like other historians, social historians analyze textual sources produced by government officials, employers, and other elites.", "ko": "다른 역사학자들처럼 사회사학자도 정부 관료, 고용주, 그 밖의 엘리트들이 만든 문서 자료를 분석한다."}, {"en": "Yet rather than simply take such sources at face value, they read them “against the grain”.", "ko": "하지만 그들은 그러한 자료를 단순히 액면 그대로 받아들이기보다는 '일반적인 방식과 다르게' 읽는다."}, {"en": "So, for example, a social historian will read legal documents not only for the “facts” provided by slaveowners; she will also examine the silences, interruptions, rumors, and other details that offer hints about the enslaved peoples’ attitudes and actions.", "ko": "그래서 예를 들어, 사회사학자는 법률 문서를 노예 소유주가 제공한 '사실'만을 얻으려고 읽는 것이 아니라, 노예가 된 사람들의 태도와 행동에 대한 힌트를 주는 침묵, 중단, 소문, 그 밖의 세부 사항도 살펴볼 것이다."}], "chunks": [[0, 0], [1, 1], [2, 3], [4, 5], [6, 7]], "ex": [{"head": "Like all historians, social historians", "clue": ["social historians", "primary sources"], "core": "사회사학자도 여러 1차 자료를 씀", "why": "글의 출발: 사회사학자(social historians) 소개"}, {"head": "Social history often emphasizes ordinary", "clue": ["ordinary people rather than elites"], "core": "사회사 = 엘리트보다 평범한 사람 중심", "why": "사회사학자 → 그들의 분야(social history)의 특징으로 이어짐"}, {"head": "Yet, in most places and", "clue": ["Yet", "nonelites"], "core": "하지만 평범한 사람들은 교육 못 받아 기록이 적음", "why": "Yet(하지만) → 평범한 사람 연구의 문제. nonelites(비엘리트) = 앞의 ordinary people"}, {"head": "Even when they did produce", "clue": ["Even when", "these materials"], "core": "기록을 남겨도 보관소에 거의 안 감", "why": "they(그들) = 엘리트가 아닌 사람들. Even when(~할 때조차) → 앞의 '기록 적음'에 문제를 하나 더"}, {"head": "Because of such biases in", "clue": ["such biases"], "core": "이런 기록의 편향 때문에 창의적이어야 함", "why": "such biases(그러한 편향) = 앞의 '평범한 사람 기록은 적고 안 남음' → 문제 두 개 다음에 와야 함"}, {"head": "Like other historians, social historians", "clue": ["produced by government officials, employers, and other elites"], "core": "그래서 결국 엘리트가 만든 문서를 분석함", "why": "창의적이어야 하는 상황 → 남아 있는 건 엘리트 문서뿐 → 그것을 분석"}, {"head": "Yet rather than simply take", "clue": ["Yet", "such sources", "“against the grain”"], "core": "하지만 액면 그대로 X, 거슬러 읽음", "why": "such sources(그러한 자료) = 바로 앞 엘리트가 만든 문서 → Yet(하지만)으로 읽는 방식 반전"}, {"head": "So, for example, a social", "clue": ["for example", "not only", "she will also examine"], "core": "예: 법률 문서의 '사실' + 침묵·소문에서 노예들의 단서 찾기", "why": "for example(예를 들어) → '거슬러 읽기'의 구체적 예시. not only A; also B(A뿐 아니라 B도)"}], "postit": "사회사 = 평범한 사람 → 기록 적음·보관 X → 편향 → 엘리트 문서 분석 → 거슬러 읽기 → 예: 법률 문서의 침묵·소문", "cex": [{"core": "사회사학자도 다양한 1차 자료 활용", "why": "글의 출발: social historians(사회사학자)와 그들이 쓰는 primary sources(1차 자료) 소개"}, {"core": "사회사는 엘리트보다 평범한 사람 중심", "why": "사회사학자 → 그들의 분야 social history(사회사)의 특징으로 이어짐"}, {"core": "평범한 사람들은 기록이 적고 보관도 안 됨", "why": "Yet(하지만) → 평범한 사람 연구의 문제, nonelites(비엘리트) = 앞의 ordinary people"}, {"core": "기록 편향 때문에 엘리트 문서를 창의적으로 분석", "why": "such biases(그러한 편향) = 앞의 '기록이 적고 안 남음' → 남은 엘리트 문서를 분석"}, {"core": "엘리트 문서를 거슬러 읽어 노예들의 단서 찾기", "why": "such sources(그러한 자료) = 앞의 엘리트 문서 → Yet(하지만) against the grain(거슬러) 읽기"}]}, {"id": "mock_2610_g2-40", "label": "26년 10월 40번 돌고래의 병렬 처리 청각 피질", "sents": [{"en": "Dolphins’ brains have evolved specialized areas dedicated to echolocation, allowing them to process acoustic information more quickly and with less energy.", "ko": "돌고래의 뇌는 반향 정위에 쓰이는 특화된 구역을 진화시켰고, 이것은 그들이 음향 정보를 더 빠르고 더 적은 에너지로 처리할 수 있게 해 준다."}, {"en": "One key adaptation is the structure of the dolphin’s auditory pathway.", "ko": "한 가지 핵심적인 적응은 돌고래의 청각 경로의 구조이다."}, {"en": "The signals from the ears are rapidly transmitted to the auditory cortex, the brain region responsible for processing sound.", "ko": "귀에서 온 신호는 소리 처리를 담당하는 뇌 영역인 청각 피질로 빠르게 전달된다."}, {"en": "However, unlike many other mammals, dolphins have a highly specialized auditory cortex with distinct areas dedicated to processing different aspects of echolocation signals.", "ko": "그러나 다른 많은 포유류와 달리, 돌고래는 반향 정위 신호의 서로 다른 측면을 처리하는 개별 구역을 가진 고도로 특화된 청각 피질을 가지고 있다."}, {"en": "Some areas may be responsible for analyzing the timing of echoes, while others focus on the frequency content or the intensity of the sound.", "ko": "어떤 구역은 반사음의 타이밍 분석을 담당하고, 다른 구역은 소리의 주파수 성분이나 강도에 집중한다."}, {"en": "This specialization allows the dolphin’s brain to process echo information in parallel, rather than sequentially.", "ko": "이러한 특화 덕분에 돌고래의 뇌는 반사음 정보를 순차적으로가 아니라 병렬로 처리할 수 있다."}, {"en": "Imagine a factory assembly line, where different workers are responsible for different tasks.", "ko": "서로 다른 노동자들이 서로 다른 일을 맡는 공장 조립 라인을 떠올려 보라."}, {"en": "By dividing the work among specialized areas, the brain can process information much faster and more efficiently.", "ko": "특화된 구역들에 일을 나누어 줌으로써, 뇌는 정보를 훨씬 더 빠르고 효율적으로 처리할 수 있다."}, {"en": "This parallel processing reduces the cognitive load associated with echolocation, allowing dolphins to react quickly to changes in their environment.", "ko": "이러한 병렬 처리는 반향 정위에 따르는 인지 부담을 줄여 주어, 돌고래가 환경의 변화에 빠르게 반응할 수 있게 해 준다."}], "chunks": [[0, 0], [1, 2], [3, 4], [5, 5], [6, 8]], "ex": [{"head": "Dolphins’ brains have evolved specialized", "clue": ["specialized areas", "echolocation"], "core": "돌고래 뇌 = 반향 정위 전용 구역 → 더 빠르게·덜 힘들게", "why": "글의 출발: 돌고래 뇌의 특화된 구역(specialized areas)"}, {"head": "One key adaptation is the", "clue": ["One key adaptation"], "core": "핵심 적응 하나 = 청각 경로의 구조", "why": "One key adaptation(한 가지 핵심 적응) → 앞의 반향 정위용으로 진화한 뇌의 구체적 예 하나를 꺼냄"}, {"head": "The signals from the ears", "clue": ["the auditory cortex"], "core": "귀의 신호 → 소리 처리하는 청각 피질로 전달", "why": "청각 경로(pathway)를 따라 신호가 가는 곳 설명 → 청각 피질(auditory cortex) 처음 등장"}, {"head": "However, unlike many other mammals,", "clue": ["However, unlike many other mammals", "distinct areas"], "core": "그러나 돌고래 청각 피질은 여러 구역으로 나뉨", "why": "However(그러나) → 앞의 일반적인 청각 피질과 달리 돌고래만의 특별한 점. 피질이 앞에서 소개된 뒤라야 가능"}, {"head": "Some areas may be responsible", "clue": ["Some areas", "while others"], "core": "구역별 분담: 타이밍 담당 / 주파수·강도 담당", "why": "Some areas(어떤 구역들) = 앞의 distinct areas(개별 구역) → 구역마다 맡은 일 설명"}, {"head": "This specialization allows the dolphin’s", "clue": ["This specialization", "in parallel"], "core": "이 특화 덕에 병렬 처리(순차 X)", "why": "This specialization(이 특화) = 앞의 '구역별 일 나누기' → 그 결과 parallel(병렬) 처리"}, {"head": "Imagine a factory assembly line,", "clue": ["Imagine", "different workers", "different tasks"], "core": "비유: 공장 조립 라인(노동자마다 다른 일)", "why": "병렬 처리를 쉽게 보여 주는 비유 → 구역 = 노동자, 반향 정보 처리 = 일"}, {"head": "By dividing the work among", "clue": ["By dividing the work"], "core": "일을 나누니 훨씬 빠르고 효율적", "why": "dividing the work(일 나누기) = 앞의 조립 라인 비유를 뇌에 다시 적용"}, {"head": "This parallel processing reduces the", "clue": ["This parallel processing", "cognitive load"], "core": "결과: 인지 부담↓ → 환경 변화에 빠르게 반응", "why": "This parallel processing(이 병렬 처리) = 앞의 in parallel 내용 → 병렬 얘기가 나온 뒤 마지막 결과"}], "postit": "반향 정위 전용 구역 → 청각 경로·피질 → 그러나 피질이 구역별로 나뉨 → 병렬 처리 → 조립 라인 비유 → 인지 부담↓", "cex": [{"core": "돌고래 뇌의 반향 정위 전용 구역", "why": "글의 출발: 돌고래 뇌가 echolocation(반향 정위)을 위해 진화시킨 특화 구역"}, {"core": "핵심 적응: 귀 신호를 청각 피질로 보내는 경로", "why": "One key adaptation(한 가지 핵심 적응) → 앞의 특화된 뇌의 구체적 예, auditory cortex(청각 피질) 등장"}, {"core": "돌고래 청각 피질은 구역별로 일을 나눠 맡음", "why": "However(그러나) + unlike many other mammals(다른 포유류와 달리) → 돌고래 피질만의 특별한 점"}, {"core": "구역 특화 덕에 순차 아닌 병렬 처리", "why": "This specialization(이 특화) = 앞의 '구역별 일 나누기' → 그 결과 in parallel(병렬로)"}, {"core": "조립 라인 비유: 일을 나눠 빠르고 부담 적게", "why": "병렬 처리를 Imagine(상상해 보라)으로 비유 → This parallel processing(이 병렬 처리)로 결과 마무리"}]}, {"id": "mock_2510_g2-20", "label": "25년 10월 20번 환자와의 직업적 거리", "sents": [{"en": "When you are working in healthcare, it is important to develop a solid professional relationship with your patients.", "ko": "여러분이 의료 분야에서 근무할 때, 여러분의 환자들과 견고한 직업적인 관계를 구축하는 것이 중요하다."}, {"en": "By establishing realistic self-boundaries, you can protect that relationship.", "ko": "현실적인 자기 경계를 확립함으로써, 여러분은 그 관계를 보호할 수 있다."}, {"en": "It is important to keep the focus on the patient.", "ko": "초점을 환자에게 두는 것이 중요하다."}, {"en": "When working with patients who are seen frequently, it is easy to start to think of them as friends.", "ko": "자주 만나게 되는 환자들을 상대로 일할 때는, 그들을 친구처럼 생각하기 시작하기 쉽다."}, {"en": "With a friend, you are likely to share personal information that is not appropriate with a patient.", "ko": "여러분은 환자와는 공유하기 적절하지 않은 개인 정보를 친구와 나눌 가능성이 있다."}, {"en": "Patients may feel that they cannot share important health-related information because you are their friend, and it would be embarrassing to share that information.", "ko": "환자들은 여러분이 자신들의 친구이기 때문에 중요한 건강 관련 정보를 자신들이 공유할 수 없다고 느낄 수도 있고, 그 정보를 나누는 것이 난처할 수 있다."}, {"en": "Self-boundaries can also be thought of as professional boundaries.", "ko": "자기 경계는 직업적인 경계로 간주될 수도 있다."}, {"en": "You need to treat patients with respect and keep the relationship professional.", "ko": "여러분은 환자들을 존중으로 대하고 그 관계를 전문적으로 유지할 필요가 있다."}, {"en": "Be friendly to patients and always keep the focus on the patient.", "ko": "환자들에게 친절하고 항상 환자에게 초점을 두어야 한다."}], "chunks": [[0, 1], [2, 3], [4, 5], [6, 8]], "ex": [{"head": "When you are working", "clue": ["professional relationship"], "core": "의료 일에선 환자와 견고한 직업적 관계가 중요", "why": "글의 출발: 의료인-환자 '직업적 관계(professional relationship)'"}, {"head": "By establishing realistic self-boundaries,", "clue": ["self-boundaries", "that relationship"], "core": "자기 경계를 세워야 그 관계를 지킴", "why": "that relationship(그 관계) = 앞 문장의 직업적 관계 → 앞 문장 바로 다음"}, {"head": "It is important to", "clue": ["keep the focus on the patient"], "core": "초점은 환자에게", "why": "관계를 지키는 첫 원칙 제시 → 다음 문장 '친구처럼 느끼기 쉬움'이라는 위험으로 연결"}, {"head": "When working with patients", "clue": ["seen frequently", "as friends"], "core": "자주 보는 환자 = 친구처럼 생각하기 쉬움", "why": "초점이 환자에게서 벗어나는 경우 = 친구처럼 느낄 때 → 문제 상황 시작"}, {"head": "With a friend, you", "clue": ["With a friend", "not appropriate"], "core": "친구에겐 환자에게 부적절한 개인 정보까지 말함", "why": "With a friend(친구와는) = 앞 문장 friends를 받음 → 친구 얘기 다음에만 가능"}, {"head": "Patients may feel that", "clue": ["because you are their friend", "embarrassing"], "core": "친구라서 환자가 중요한 건강 정보를 못 꺼냄", "why": "their friend(그들의 친구) → 친구 관계의 두 번째 문제(환자 쪽) 이어짐"}, {"head": "Self-boundaries can also be", "clue": ["also", "professional boundaries"], "core": "자기 경계 = 직업적 경계", "why": "also(또한) + 2번 문장의 self-boundaries 재등장 → 문제점 다 말한 뒤 해결책으로 복귀"}, {"head": "You need to treat", "clue": ["with respect", "keep the relationship professional"], "core": "존중하되 관계는 전문적으로 유지", "why": "professional boundaries(직업적 경계) → 그래서 관계를 professional(전문적)하게"}, {"head": "Be friendly to patients", "clue": ["Be friendly", "always keep the focus"], "core": "친절하되 항상 초점은 환자", "why": "결론: 3번 문장 '초점은 환자'를 다시 꺼내 마무리 → 맨 끝"}], "postit": "직업적 관계 → 자기 경계 → 초점은 환자 → 친구처럼 느낌 → 부적절한 정보·환자 침묵 → 직업적 경계 → 친절하되 초점은 환자", "cex": [{"core": "의료 일에선 자기 경계로 환자와의 직업적 관계 보호", "why": "글의 출발: in healthcare(의료 일에서) 환자와의 professional relationship(직업적 관계)이 중요"}, {"core": "초점은 환자, 자주 보면 친구처럼 여기기 쉬움", "why": "keep the focus on the patient(초점을 환자에게) → 앞의 관계를 지키는 첫 방법 제시"}, {"core": "친구 같은 관계의 사적 정보 공유와 환자의 정보 은폐", "why": "With a friend(친구에게는) → 앞의 '친구처럼 생각하기 쉬움'이 낳는 문제"}, {"core": "자기 경계 = 직업적 경계, 친절하되 초점은 환자", "why": "Self-boundaries(자기 경계) 반복 + also(또한) → 앞의 문제를 막는 경계 개념으로 돌아와 정리"}]}, {"id": "mock_2510_g2-21", "label": "25년 10월 21번 혀 실험으로 보는 미각 유형", "sents": [{"en": "Coat a fresh, wet swab in salt, and gently touch various spots on your tongue, recording where your taste seems strongest.", "ko": "새로운 젖은 면봉에 소금을 묻히고 여러분의 미각이 가장 강렬하다고 느껴지는 곳을 기록하면서, 혀의 다양한 부위들에 부드럽게 대 보아야 한다."}, {"en": "Then, gargle with water to thoroughly clean your tongue, use a swab coated with sugar on the same spots, and record those results.", "ko": "그런 다음, 여러분의 혀를 완전히 씻어 내기 위해 물로 헹구고, 설탕이 덮인 면봉을 같은 부위들에 사용하고, 그 결과들을 기록해야 한다."}, {"en": "Gargle again, and then swab with lemon juice.", "ko": "다시 헹구고 그런 다음 레몬주스를 면봉으로 혀에 발라야 한다."}, {"en": "After a final gargle, try coffee.", "ko": "마지막 헹굼 이후에 커피로 해 보아야 한다."}, {"en": "Compare your reactions with your friends'.", "ko": "여러분의 반응들을 친구들의 것들과 비교해야 한다."}, {"en": "Your taste pattern may reveal more than just taste preferences.", "ko": "여러분의 미각 패턴은 단순히 맛에 대한 선호도보다 더 많은 것을 보여줄지도 모른다."}, {"en": "Recent studies suggest links between taster status and behavioral disorders.", "ko": "최근의 연구들은 미각 유형(미각 둔감자·초미각자 등)와 행동 장애 사이의 연관성을 시사한다."}, {"en": "For example, \"non-tasters\" tend to have a higher incidence of alcoholism, perhaps because liquor seems less bitter to them.", "ko": "예를 들어 '미각 둔감자'는 더 높은 알코올 중독 발생률을 가지는 경향이 있는데, 아마도 술이 그들에게 덜 쓰다고 느껴지기 때문일 것이다."}, {"en": "Conversely, \"super-tasters\" may avoid nutritious but mildly bitter foods such as broccoli, thus depriving themselves of a balanced diet.", "ko": "반대로 '초미각자'는 브로콜리와 같이 영양가 있지만 약간 쓴 음식들을 회피할지도 모르고, 그러므로 스스로에게 균형 잡힌 식단을 박탈할 수도 있다."}, {"en": "So, although taste is not nearly as glamorous as vision, hearing, or even touch, it makes sense for you to pay closer attention to it because chemistry, at least in your mouth, could be destiny.", "ko": "그래서 비록 미각이 시각, 청각, 또는 심지어 촉각만큼 화려하지는 않지만, 적어도 여러분의 입안에서는, 화학 작용이 운명이 될 수 있기 때문에 여러분이 그것에 좀 더 세심한 주의를 기울이는 것이 합리적이다."}], "chunks": [[0, 0], [1, 2], [3, 4], [5, 7], [8, 9]], "ex": [{"head": "Coat a fresh, wet", "clue": ["salt", "recording"], "core": "1단계: 소금 면봉으로 혀 여러 곳 찍고 기록", "why": "글의 출발: 실험 첫 단계 = 소금"}, {"head": "Then, gargle with water", "clue": ["Then", "sugar", "the same spots"], "core": "2단계: 헹구고 설탕으로 같은 곳", "why": "Then(그런 다음) + the same spots(같은 부위) = 앞의 소금 찍은 곳 → 소금 다음"}, {"head": "Gargle again, and then", "clue": ["Gargle again", "lemon juice"], "core": "3단계: 또 헹구고 레몬주스", "why": "again(다시) = 앞에서 이미 한 번 헹굼(gargle) → 설탕 단계 다음"}, {"head": "After a final gargle,", "clue": ["After a final gargle", "coffee"], "core": "4단계: 마지막 헹굼 후 커피", "why": "final(마지막) → 실험 단계 중 맨 끝, 레몬 다음"}, {"head": "Compare your reactions with", "clue": ["your friends'"], "core": "결과를 친구들 것과 비교", "why": "실험 4단계가 다 끝난 뒤 반응(reactions) 비교 → 실험 마무리"}, {"head": "Your taste pattern may", "clue": ["Your taste pattern", "more than just taste preferences"], "core": "미각 패턴은 맛 취향 이상을 드러냄", "why": "실험 결과(taste pattern, 미각 패턴) → 이제 그 의미로 전환하는 요지 문장"}, {"head": "Recent studies suggest links", "clue": ["Recent studies", "behavioral disorders"], "core": "연구: 미각 유형과 행동 장애가 연관", "why": "'취향 이상의 것' = 행동 장애와의 연관 → 앞 문장을 구체화"}, {"head": "For example, \"non-tasters\" tend", "clue": ["For example", "non-tasters", "alcoholism"], "core": "예1: 미각 둔감자 → 술이 덜 써서 알코올 중독↑", "why": "For example(예를 들어) → 앞 문장 '행동 장애 연관'의 첫 사례"}, {"head": "Conversely, \"super-tasters\" may avoid", "clue": ["Conversely", "super-tasters", "broccoli"], "core": "예2: 초미각자 → 쓴 채소 피해 bel": "25년 10월 23번 새 이론이 옛 이론을 대신하려면", "sents": [{"en": "We can discard or replace a scientific theory only if we have a better way of explaining the evidence that supports it.", "ko": "단지 우리가 그것을 뒷받침하는 증거를 설명하는 더 우수한 방법이 있을 때에만 우리는 과학 이론을 폐기하거나 교체할 수 있다."}, {"en": "The theories of Newton and Einstein offer great examples.", "ko": "뉴턴과 아인슈타인의 이론들이 훌륭한 사례들을 제공한다."}, {"en": "A vast body of evidence supports Newton's theory of gravity, but by the late nineteenth century scientists had begun to discover cases where its predictions did not perfectly match observations.", "ko": "방대한 양의 증거가 뉴턴의 중력 이론을 뒷받침해 주지만, 19세기 후반에 이르러 과학자들은 그것의 예측들이 관찰 결과와 완벽하게 일치하지 않는 상황들을 발견하기 시작했다."}, {"en": "These discrepancies were explained only when Einstein developed his general theory of relativity, which was able to match the observations.", "ko": "이러한 불일치들은 아인슈타인이 관찰 결과와 일치할 수 있는 일반 상대성 이론을 개발했을 때에야 비로소 설명되었다."}, {"en": "Still, the many successes of Newton's theory could not be ignored, and Einstein's theory would not have gained acceptance if it had not been able to explain these successes equally well.", "ko": "그럼에도 불구하고, 뉴턴의 이론의 많은 성과는 무시될 수 없었고, 아인슈타인의 이론이 만약 이러한 성과를 똑같이 잘 설명할 수 없었다면 승인을 받지 못했을 것이다."}, {"en": "It did, and that is why we now view Einstein's theory as a broader theory of gravity than Newton's theory.", "ko": "그것은 그렇게 했고, 그것이 우리가 오늘날 아인슈타인의 이론을 뉴턴의 이론보다 더 광범위한 중력 이론으로 보는 이유이다."}, {"en": "Some scientists today are seeking a theory of gravity that will go beyond Einstein's.", "ko": "오늘날 몇몇의 과학자들은 아인슈타인의 이론을 초월할 중력 이론을 탐구하고 있다."}, {"en": "If any new theory ever gains acceptance, it will have to match all the successes of Einstein's theory as well as work in new realms where Einstein's theory does not.", "ko": "만약 어떤 새로운 이론이 언젠가 승인을 받는다면, 그것은 아인슈타인의 이론이 작동하지 않는 새로운 영역에서 작동할 뿐만 아니라 아인슈타인의 이론의 모든 성과에 대응해야 할 것이다."}], "chunks": [[0, 1], [2, 2], [3, 3], [4, 5], [6, 7]], "ex": [{"head": "We can discard or", "clue": ["only if", "a better way of explaining"], "core": "더 나은 설명이 있을 때만 10월 24번 점심시간 뉴로빅 운동", "sents": [{"en": "Imagine pausing in the middle of a busy day, taking a moment to refresh your mind and recharge your energy.", "ko": "분주한 하루의 중간에 잠시 멈춰서, 정신을 새롭게 하고 에너지를 재충전하는 순간을 가지는 것을 상상해 보라."}, {"en": "This power of a midday break is often underestimated.", "ko": "이러한 한낮의 휴식의 힘은 종종 과소평가된다."}, {"en": "When you break away from routine, especially with activities designed to stimulate your brain, you prevent cognitive tiredness and enhance productivity for the rest of the day.", "ko": "여러분이 특히 여러분의 두뇌를 자극하도록 고안된 활동들을 가지고 일상에서 벗어날 때 여러분은 인지적 피로를 방지하고 남은 하루 동안의 생산성을 향상시킨다."}, {"en": "Neurobic exercises — simple yet effective — are perfect for such breaks.", "ko": "간단하지만 효과적인 뉴로빅 운동이 그러한 휴식 시간에 완벽하다."}, {"en": "They target different areas of your brain, keeping it agile and alert.", "ko": "그것들은 여러분의 뇌의 다른 부분들을 목표로 하여, 그것을 기민하고 경계하게 유지한다."}, {"en": "These exercises create a mental oasis that refreshes and prepares you for the afternoon's challenges.", "ko": "이러한 운동들은 오후의 힘든 일들을 위해 여러분을 새롭게 하고 준비시켜 주는 정신적 오아시스를 창조한다."}, {"en": "This strategic pause is not just a break; it boosts your cognitive capabilities, ensuring your mind remains sharp and focused.", "ko": "이 전략적인 멈춤은 단순한 휴식이 아니며, 그것은 여러분의 인지 능력을 증진시키고 여러분의 정신이 또렷하고 집중된 상태가 유지되도록 확실히 한다."}, {"en": "Even briefly experimenting with neurobic exercises can work wonders for your cognitive state during lunch.", "ko": "잠깐 뉴로빅 운동들을 실험하는 것만으로도 점심시간 동안 여러분의 인지 상태에 기적 같은 효과를 낳을 수 있다."}, {"en": "Start with using your non-dominant hand for routine tasks like writing or eating.", "ko": "글쓰기 또는 식사와 같은 일상적인 과업들을 위해 여러분의 주로 쓰지 않는 손을 사용하는 것으로 시작하라."}, {"en": "This simple switch challenges your brain, activating pathways that aren't typically engaged and promoting greater flexibility in thinking.", "ko": "이 간단한 전환이 여러분의 뇌에 도전을 가하여, 전형적으로 사용되지 않는 경로들을 활성화시키고 사고에서의 더 큰 유연성을 장려한다."}], "chunks": [[0, 2], [3, 5], [6, 7], [8, 9]], "ex": [{"head": "Imagine pausing in the", "clue": ["Imagine", "in the middle of a busy day"], "core": "바쁜 날 중간에 잠깐 쉬며 재충전하는 상상", "why": "글의 출발: Imagine(상상해 보라)으로 '한낮의 휴식' 장면 제시"}, {"head": "This power of a", "clue": ["This power of a midday break", "underestimated"], "core": "한낮 휴식의 힘은 과소평가됨", "why": "This power of a midday break(한낮 휴식의 이 힘) = 앞 문장의 쉬는 장면"}, {"head": "When you break away", "clue": ["break away from routine", "prevent cognitive tiredness"], "core": "일상에서 벗어나 뇌 자극 → 피로 막고 생산성↑", "why": "과소평가된 '힘'의 내용 = 피로 예방·생산성 향상"}, {"head": "Neurobic exercises — simple", "clue": ["Neurobic exercises", "such breaks"], "core": "뉴로빅 운동 = 이런 휴식에 딱", "why": "such breaks(그런 휴식) = 앞의 뇌를 자극하는 휴식 → 여기서 뉴로빅이 처음 소개됨"}, {"head": "They target different areas", "clue": ["They target", "agile and alert"], "core": "뇌 여러 부위를 겨냥해 민첩하게", "why": "They(그것들) = 바로 앞 Neurobic exercises → 소개 직후"}, {"head": "These exercises create a", "clue": ["These exercises", "a mental oasis"], "core": "오후를 준비시키는 정신의 오아시스", "why": "These exercises(이 운동들) → 뉴로빅 설명 계속"}, {"head": "This strategic pause is", "clue": ["This strategic pause", "not just a break"], "core": "단순 휴식 X, 인지 능력을 끌어올림", "why": "This strategic pause(이 전략적 멈춤) = 뉴로빅으로 하는 휴식 → 효과 정리"}, {"head": "Even briefly experimenting with", "clue": ["Even briefly experimenting", "neurobic exercises"], "core": "잠깐만 해 봐도 놀라운 효과", "why": "Even briefly(잠깐이라도) → 효과 정리 후 '해 보라'로 넘어가는 다리"}, {"head": "Start with using your", "clue": ["Start with", "non-dominant hand"], "core": "주로 안 쓰는 손으로 쓰기·먹기부터", "why": "Start with(~로 시작하라) = 앞 문장 '해 보기'의 첫 방법"}, {"head": "This simple switch challenges", "clue": ["This simple switch", "flexibility in thinking"], "core": "이 간단한 전환이 새 경로 열고 사고 유연성↑", "why": "This simple switch(이 간단한 전환) = 손 바꾸기 → 그 방법 바로 다음, 맨 끝"}], "postit": "한낮 휴식 상상 → 과소평가된 힘 → 피로 예방 → 뉴로빅 소개 → 뇌 자극·오아시스 → 전략적 멈춤 → 해 보기 → 안 쓰는 손 → 사고 유연성", "cex": [{"core": "한낮 휴식의 힘, 뇌 자극으로 피로 막고 생산성↑", "why": "글의 출발: Imagine pausing(멈추는 것을 상상해 봐라) → midday break(한낮 휴식)의 힘"}, {"core": "뉴로빅 운동 = 뇌를 깨우는 휴식에 딱", "why": "such breaks(이런 휴식) = 앞의 뇌를 자극하는 한낮 휴식 → 뉴로빅 운동 소개"}, {"core": "이 전략적 멈춤이 인지 능력을 끌어올림", "why": "This strategic pause(이 전략적 멈춤) = 앞의 뉴로빅 운동으로 쉬는 시간"}, {"core": "안 쓰는 손으로 쓰기·먹기부터 시작", "why": "Start with(~부터 시작해라) → 앞의 '잠깐 해 봐도 효과'를 받아 구체적 방법 제시"}]}, {"id": "mock_2510_g2-29", "label": "25년 10월 29번 복제 오류와 자연 선택", "sents": [{"en": "When a cell divides, the genomes of its two daughters are often not quite identical to each other or to that of the parent cell.", "ko": "세포가 분열할 때, 그것의 두 딸세포들의 유전체들은 종종 서로 간에도, 또는 모세포의 그것과도 완전히 동일하지는 않다."}, {"en": "On rare occasions, the error may represent a change for the better; more probably, it will cause no significant difference in the cell's prospects.", "ko": "드물게 그 오류가 더 우수한 것으로의 변화를 나타낼 수도 있지만, 더 높은 확률로 그것은 세포의 전망에 큰 차이를 일으키지 않을 것이다."}, {"en": "But in some cases, the error will cause serious damage: for example, by disrupting the coding sequence for a key protein.", "ko": "그러나 어떤 경우에는 그 오류가 심각한 손상을 야기할 것이다. 예를 들어 핵심 단백질의 코딩 서열을 망가뜨림으로써 그렇게 할 것이다."}, {"en": "Changes due to mistakes of the first type will tend to be perpetuated, because the altered cell has an increased likelihood of reproducing itself.", "ko": "첫 번째 유형의 실수로 인한 변화들은 영속되는 경향이 있을 것인데, 변화가 일어난 세포가 스스로를 복제할 증가한 가능성을 가지고 있기 때문이다."}, {"en": "Changes due to mistakes of the second type—neutral changes—may be perpetuated or not: it is a matter of chance whether the altered cell or its cousins will succeed.", "ko": "두 번째 유형의 실수로 인한 변화들, 즉, '중립적인' 변화들은 영속될 수도 있고 아닐 수도 있다. 변화가 일어난 세포나 그것의 사촌들이 성공할지는 우연의 문제이다."}, {"en": "But changes that cause serious damage lead nowhere: the cell that suffers them dies, leaving no progeny.", "ko": "그러나 심각한 손상을 야기하는 변화들은 어느 곳에도 닿지 못한다. 그것들을 겪는 세포는 죽고, 자손을 남기지 않기 때문이다."}, {"en": "Through endless repetition of this cycle of mutation and natural selection organisms evolve: their genetic specifications change, sometimes giving organisms new ways to exploit the environment more effectively, to survive in competition with others, and to reproduce successfully.", "ko": "이러한 '돌연변이'와 '자연 선택'의 순환의 끊임없는 반복을 통해 유기체들은 진화한다. 그들의 유전적 특성들은 변화해서, 유기체에게 환경을 더 효과적으로 이용하고, 다른 것들과의 경쟁 속에서 살아남으며, 그리고 성공적으로 번식할 수 있는 새로운 방법들을 때로는 제공한다."}], "chunks": [[0, 0], [1, 2], [3, 3], [4, 4], [5, 6]], "ex": [{"head": "When a cell divides,", "clue": ["the genomes of its two daughters", "not quite identical"], "core": "세포 분열 때 유전체가 완전히 같지 않음(오류)", "why": "글의 출발: 세포 분열 시 생기는 복제 오류"}, {"head": "On rare occasions, the", "clue": ["the error", "change for the better", "no significant difference"], "core": "오류 결과: 드물게 좋아짐 / 대개 차이 없음", "why": "the error(그 오류) = 앞 문장 '같지 않음' → 오류의 결과 분류 시작"}, {"head": "But in some cases,", "clue": ["But in some cases", "serious damage"], "core": "어떤 경우엔 심각한 손상", "why": "But(그러나) → 좋음·중립에 이어 세 번째 결과(손상)"}, {"head": "Changes due to mistakes", "clue": ["the first type", "perpetuated"], "core": "1유형(좋은 변화) → 계속 이어짐", "why": "the first type(첫 번째 유형) = 앞에서 말한 '좋은 변화' → 세 유형 소개 다음"}, {"head": "Changes due to mistakes", "clue": ["the second type", "neutral changes", "a matter of chance"], "core": "2유형(중립) → 이어질지는 운", "why": "the second type(두 번째 유형) → 첫 번째 다음"}, {"head": "But changes that cause", "clue": ["But changes that cause serious damage", "leaving no progeny"], "core": "손상 변화 → 세포 죽고 자손 없음", "why": "But + serious damage(심각한 손상) = 세 번째 유형 → 두 번째 다음"}, {"head": "Through endless repetition of", "clue": ["this cycle of mutation and natural selection", "evolve"], "core": "이 돌연변이·선택의 무한 반복 → 진화", "why": "this cycle(이 순환) = 앞의 오류 → 남거나 사라짐 전체 → 결론, 맨 끝"}], "postit": "복제 오류 → 좋음·중립·손상 → 좋음: 유지 → 중립: 운 → 손상: 소멸 → 반복 = 진화", "cex": [{"core": "세포 분열 때 유전체가 완전히 같지 않음", "why": "글의 출발: When a cell divides(세포가 분열할 때) 유전체에 복제 오류가 생김"}, {"core": "오류 결과: 드물게 개선, 대개 무해, 때로 손상", "why": "the error(그 오류) = 앞의 딸세포 유전체의 차이 → 결과를 세 가지로 나눔"}, {"core": "좋은 변화는 번식에 유리해 계속 이어짐", "why": "mistakes of the first type(첫 번째 유형의 오류) = 앞의 '좋아지는 변화'"}, {"core": "중립 변화는 이어질지가 운에 달림", "why": "the second type(두 번째 유형) → 앞의 첫 유형에 이어 neutral changes(중립 변화)"}, {"core": "손상 변화는 자손 없이 끝남, 이 반복이 진화", "why": "But(하지만) + serious damage(심각한 손상) → 앞의 두 유형과 달리 이어지지 않는 세 번째"}]}, {"id": "mock_2510_g2-30", "label": "25년 10월 30번 자유주의와 유교의 가족관", "sents": [{"en": "Within liberal culture, the value of fair equality of opportunity for individuals outweighs the preservation of the family's integrity.", "ko": "자유주의 문화 내에서는, 개인들을 위한 기회의 공정한 평등이라는 가치가 가족의 온전함을 보존하는 것보다 우선된다."}, {"en": "In contrast, for Confucian culture, while seeking fair equality of opportunity for individuals is important, the family assumes a fundamental role in human flourishing, and living within a family institution is considered the essential way of life.", "ko": "이에 반해 유교 문화에서는, 개인들을 위한 기회의 공정한 평등을 추구하는 것이 중요하지만, 가족은 인간의 번영에 있어 기본적인 역할을 담당하며, 가족 제도 안에서 사는 것이 삶의 본질적인 방식으로 간주된다."}, {"en": "Individuals are primarily understood as family members before they are regarded as state citizens.", "ko": "개인들은 국가의 시민으로 여겨지기 전에 우선적으로 가족 구성원으로 이해된다."}, {"en": "Therefore, for Confucians, the family possesses inherent value that should never be abandoned, even if it results in certain societal inequalities.", "ko": "그러므로 유교를 따르는 사람들에게는, 가족은 그것이 어떤 사회적 불평등을 초래할지라도, 결코 포기되어서는 안 되는 내재적인 가치를 보유한다."}, {"en": "Some cultures, like the liberal one, may choose to impose increasing restrictions on the role of families and implement more egalitarian government programs for education, healthcare, and other positive rights in society in the pursuit of fair equality of opportunity.", "ko": "자유주의 문화와 같은 일부 문화들은, 가족의 역할에 점점 더 많은 제한들을 부과하고, 기회의 공정한 평등을 추구하면서 교육, 의료, 그리고 다른 적극적 권리들에 대한 더 평등주의적인 정부 프로그램들을 사회에서 실행하기를 선택할지도 모른다."}, {"en": "On the other hand, other cultures, like the Confucian one, may prefer to primarily assign welfare responsibilities to the family, accepting inequalities stemming from the existence of the family as long as everyone's basic freedoms and rights are safeguarded in the state.", "ko": "반면 유교 문화와 같은 다른 문화들은, 국가에서 모든 사람의 기본적 자유와 권리들이 보장되는 한, 가족의 존재로 인해 발생하는 불평등을 용인하며 복지에 대한 책임을 우선적으로 가족에게 할당하는 것을 선호할지도 모른다."}], "chunks": [[0, 0], [1, 3], [4, 4], [5, 5]], "ex": [{"head": "Within liberal culture, the", "clue": ["liberal culture", "outweighs"], "core": "자유주의: 개인 기회 평등 > 가족 보존", "why": "글의 출발: 자유주의 문화의 입장"}, {"head": "In contrast, for Confucian", "clue": ["In contrast", "Confucian culture", "fundamental role"], "core": "반대로 유교: 가족이 삶의 근본", "why": "In contrast(대조적으로) → 자유주의 다음에 반대편 유교"}, {"head": "Individuals are primarily understood", "clue": ["family members", "state citizens"], "core": "개인 = 시민이기 전에 가족 구성원", "why": "유교의 '가족 중심'을 개인 정의로 더 풀어 줌 → 유교 소개 다음"}, {"head": "Therefore, for Confucians, the", "clue": ["Therefore, for Confucians", "inherent value", "inequalities"], "core": "그래서 유교: 불평등 생겨도 가족은 버릴 수 없음", "why": "Therefore(그러므로) → 가족 구성원이 먼저라는 이유의 결론"}, {"head": "Some cultures, like the", "clue": ["Some cultures, like the liberal one", "egalitarian government programs"], "core": "자유주의형 사회: 가족 역할 제한·평등 정책", "why": "like the liberal one(자유주의처럼) → 두 입장 설명 뒤, 사회 정책으로 다시 비교 시작"}, {"head": "On the other hand,", "clue": ["On the other hand", "like the Confucian one", "welfare responsibilities"], "core": "유교형 사회: 복지를 가족에게, 불평등 감수", "why": "On the other hand(반면에) + like the Confucian one → 앞 문장 자유주의형의 짝, 맨 끝"}], "postit": "자유주의: 기회 평등 우선 → 유교: 가족 근본 → 시민 전에 가족 → 불평등도 감수 → 정책: 평등 정책 vs 가족 복지", "cex": [{"core": "자유주의: 개인 기회 평등이 가족 보존보다 우선", "why": "글의 출발: Within liberal culture(자유주의 문화에서) 개인 기회 평등 > 가족 보존"}, {"core": "유교: 가족이 삶의 근본, 불평등 생겨도 못 버림", "why": "In contrast(반대로) → 앞의 자유주의와 대비되는 Confucian culture(유교 문화)"}, {"core": "자유주의형 사회는 가족 역할 제한·평등 정책 시행", "why": "like the liberal one(자유주의처럼) → 앞의 두 문화 비교를 사회 정책으로 연결"}, {"core": "유교형 사회는 복지를 가족에게, 불평등 감수", "why": "On the other hand(반면에) → 앞의 자유주의형 정책과 대비되는 유교형 정책"}]}, {"id": "mock_2510_g2-31", "label": "25년 10월 31번 통계는 국가 권위의 기술", "sents": [{"en": "Statistics in the twentieth century became the systematic collection of quantitative information needed by the state.", "ko": "20세기의 통계 자료는 국가가 필요로 하는 정량적인 정보의 체계적인 수집이 되었다."}, {"en": "This process occurred in all the industrialised countries as a key part of their becoming modern states.", "ko": "이러한 과정은 모든 산업 국가에서 그것들이 근대 국가가 되는 것의 핵심적인 부분으로 발생했다."}, {"en": "Desrosières writes: \"It is difficult to think simultaneously that the objects being measured really do exist and that this is only a convention\".", "ko": "Desrosières는 '측정되는 대상들이 실제로 확실히 존재한다는 것과 이것이 단지 하나의 관례라는 것을 동시에 생각하기는 어렵다'라고 기술한다."}, {"en": "Yet this is the case.", "ko": "그러나 이는 사실이다."}, {"en": "Phenomena such as prices being charged and products being sold exist, but the categories and classification frameworks supporting the collection, aggregation, and organisation of official statistics are devised to serve the purposes of the state, for macroeconomic or for social policies.", "ko": "가격이 부과되는 것이나 제품이 판매되는 것과 같은 현상들은 존재하지만, 공식 통계 자료의 수집, 집계, 그리고 조직화를 뒷받침하는 범주들과 분류 체계들은 거시 경제 또는 사회 정책들을 위한 국가의 목적들에 기여하도록 고안된다."}, {"en": "Theodore Porter described the use of statistics to create state authority: \"Quantification is a way of making decisions without seeming to decide\", characterising it as a \"social technology\" intended to build trust in authority.", "ko": "Theodore Porter는 국가의 권위를 창조하기 위한 통계 자료의 사용을, '정량화는 결정하는 것처럼 보이지 않으면서 결정을 내리는 방법'이라고 묘사했고, 그것을 권위에 대한 신뢰를 구축하기 위해 의도된 '사회적 기술'로 특징지었다."}], "chunks": [[0, 0], [1, 1], [2, 2], [3, 5]], "ex": [{"head": "Statistics in the twentieth", "clue": ["systematic collection", "needed by the state"], "core": "20세기 통계 = 국가가 필요로 한 정보 수집", "why": "글의 출발: 통계와 국가의 관계"}, {"head": "This process occurred in", "clue": ["This process", "modern states"], "core": "모든 산업국가에서 근대 국가가 되는 과정의 핵심", "why": "This process(이 과정) = 앞 문장의 체계적 정보 수집"}, {"head": "Desrosières writes: \"It is", "clue": ["Desrosières", "only a convention"], "core": "측정 대상은 실재하는데 동시에 관례일 뿐? 생각하기 어려움", "why": "국가가 정한 통계라는 앞 얘기 → 학자의 인용으로 '실재 vs 관례' 문제 제기"}, {"head": "Yet this is the", "clue": ["Yet this is the case"], "core": "그런데 실제로 그러함", "why": "Yet(그러나) + this(이것) = 앞 인용의 '실재하면서 관례임' → 인용 바로 다음"}, {"head": "Phenomena such as prices", "clue": ["exist", "devised to serve the purposes of the state"], "core": "가격·상품은 실재, 분류 틀은 국가 목적용으로 만든 것", "why": "'그런데 그렇다'의 풀이: 실재(exist) + 관례(devised, 고안된) 두 쪽 다 보여 줌"}, {"head": "Theodore Porter described the", "clue": ["create state authority", "social technology"], "core": "포터: 계량화 = 권위에 신뢰를 쌓는 사회적 기술", "why": "국가 목적용 통계 → 권위를 세우는 기술로 결론, 맨 끝"}], "postit": "통계 = 국가용 정보 수집 → 근대 국가의 핵심 → 실재이자 관례? → 실제로 그러함 → 분류 틀은 국가 목적 → 권위를 세우는 사회적 기술", "cex": [{"core": "20세기 통계 = 국가에 필요한 정보의 체계적 수집", "why": "글의 출발: Statistics in the twentieth century(20세기 통계) = 국가를 위한 정보 수집"}, {"core": "산업국가가 근대 국가가 되는 핵심 과정", "why": "This process(이 과정) = 앞의 국가를 위한 체계적 정보 수집"}, {"core": "측정 대상이 실재하면서 관례라고 생각하기 어려움", "why": "Desrosières writes(데로지에르가 쓰다) → 앞의 국가 통계에 담긴 모순을 인용으로 제시"}, {"core": "분류 틀은 국가용, 계량화는 권위를 세우는 기술", "why": "Yet this is the case(그런데 실제로 그러하다) → 앞의 '생각하기 어려움'에 대한 답"}]}, {"id": "mock_2510_g2-32", "label": "25년 10월 32번 쪼개져서 전체를 모르는 인체 연구", "sents": [{"en": "Just as an expert in the taste and colour of wine will gain much by being aware of the chemistry that underlies those qualities, so each perspective on the body can potentially enhance the others.", "ko": "와인의 맛과 색의 전문가가 그러한 특성들의 기저에 있는 화학을 알게 됨으로써 많은 것을 획득하듯이, 마찬가지로 신체에 대한 각각의 관점은 아마도 다른 관점들을 강화시킬지도 모른다."}, {"en": "And yet every scientific tool, from microscopes to mathematics, and every aspect of the body, from the brain to the microorganism, requires such depth of expertise that this tends not to happen: we tend to study the human body in silos, each community sectioned from the others by its own specialised vocabulary.", "ko": "하지만 현미경에서부터 수학에 이르기까지의 모든 과학적 도구와 뇌에서부터 미생물에 이르기까지의 신체의 모든 측면은 너무 깊은 전문 지식을 요구해서 이런 일은 잘 일어나지 않는 경향이 있다. 즉, 우리는 각각의 공동체가 그것 자신의 전문적인 어휘에 의해 나머지 다른 것들과는 구분된 채, 인간의 신체를 개별적으로 분리해서 연구하는 경향이 있다."}, {"en": "Research communities may be dedicated to one type of scientific tool or a specific component of the body, such as one type of cell.", "ko": "연구 공동체는 한 종  스펀지 → 접시 실험 → 불어남 → 같은 원리 → 몸이 더 짜면 부풂 ↔ 바다가 더 짜면 쪼그라듦", "cex": [{"core": "바다 생물도 물을 받아들이고 여분 소금만 없앰", "why": "글의 출발: sea creatures(바다 생물)도 물이 필요 → 여분의 소금이 문제"}, {"core": "소금은 스펀지처럼 물을 빨아들임, 접시 실험", "why": "Salt(소금) → 앞의 extra salt(여분의 소금)를 받아 소금의 성질 설명"}, {"core": "물 먹은 소금 더미가 커짐", "why": "Now(이제) → 앞의 소금 옆에 물을 부은 실험의 결과"}, {"core": "같은 원리로 몸이 더 짜면 물을 흡수해 부풂", "why": "The same principle(같은 원리) = 앞의 소금이 물을 먹고 커지는 현상"}, {"core": "바닷물이 더 짜면 체액이 빠져 쪼그라듦", "why": "On the other hand(반면에) → 앞의 '몸이 더 짠 경우'와 반대 경우"}]}, {"id": "mock_2510_g2-37", "label": "25년 10월 37번 나비와 나방 구별법과 오해", "sents": [{"en": "Distinguishing moths from butterflies on outward appearance is not always easy, but there are a few rules of thumb that can help.", "ko": "외적 생김새로 나비들과 나방들을 구별하는 것이 항상 용이한 일은 아니지만, 도움이 될 수 있는 몇 가지 경험적 방법들이 있다."}, {"en": "In most butterflies the antennae end with a small club-shaped swelling, whereas in moths they are usually feathery or narrow to a fine tip.", "ko": "대부분의 나비들의 경우 더듬이들은 작은 곤봉 모양의 혹으로 끝나는 반면, 나방들의 경우 그것들은 보통 깃털 모양이거나 미세한 끝부분으로 점점 가늘어진다."}, {"en": "Butterflies tend to rest with their wings held shut above their body, whereas moths more usually rest with the upper sides of the wings on full view.", "ko": "나비들은 자신의 날개들이 자신의 몸 위에 닫힌 채 쉬는 경향이 있는 반면, 나방들은 더 흔히 날개들의 윗면이 완전히 노출되는 상태로 쉰다."}, {"en": "Further distinctions can be made by looking for a tiny hook that joins fore- and hindwings, a feature only present in moths.", "ko": "나방들에게만 존재하는 특징인, 앞날개와 뒷날개를 연결해 주는 아주 작은 갈고리를 탐색함으로써 그 이상의 구별들이 가능하다."}, {"en": "The stereotypical differences, with moths cast as the gloomy, nocturnal cousins of colourful sun-loving butterflies, are simply wrong.", "ko": "색이 화려하고 해를 좋아하는 나비들의 우울하고 야행성인 사촌으로 나방들이 묘사되는 정형화된 차이들은 그야말로 잘못된 것이다."}, {"en": "There are many brightly coloured moths and many which are active throughout the day.", "ko": "밝은색을 가진 나방들이 많고 낮 동안 내내 활동적인 나방들이 많이 있다."}, {"en": "Equally, there are a few nocturnal butterflies and plenty that come clothed in shades of brown and grey.", "ko": "마찬가지로, 야행성의 나비들이 몇몇 있고, 갈색과 회색조를 띠는 것들이 많이 있다."}, {"en": "It's more sensible to think of them together: both butterflies and moths are beautiful and fascinating insects.", "ko": "그들을 함께 묶어 생각하는 것이 더 합리적이다. 나비와 나방 둘 다 아름답고 매혹적인 곤충이기 때문이다."}], "chunks": [[0, 0], [1, 2], [3, 3], [4, 5], [6, 7]], "ex": [{"head": "Distinguishing moths from butterflies", "clue": ["Distinguishing moths from butterflies", "rules of thumb"], "core": "나방·나비 구별은 어렵지만 경험 법칙 몇 가지", "why": "글의 출발: 구별 기준을 소개하겠다는 예고"}, {"head": "In most butterflies the", "clue": ["antennae", "whereas"], "core": "구별1: 더듬이 끝 곤봉 모양(나비) vs 깃털·가늘어짐(나방)", "why": "rules of thumb(경험 법칙)의 첫 기준"}, {"head": "Butterflies tend to rest", "clue": ["rest with their wings", "whereas"], "core": "구별2: 날개 접고 쉼(나비) vs 펴고 쉼(나방)", "why": "같은 whereas(반면) 비교 형식으로 두 번째 기준 → 더듬이와 한 묶음"}, {"head": "Further distinctions can be", "clue": ["Further distinctions", "only present in moths"], "core": "추가 구별: 앞뒤 날개 잇는 고리는 나방만", "why": "Further(추가로) → 앞의 기준들 다음에 덧붙임"}, {"head": "The stereotypical differences, with", "clue": ["The stereotypical differences", "simply wrong"], "core": "그러나 '나방 = 칙칙·야행성'이라는 고정관념은 틀림", "why": "진짜 기준을 다 말한 뒤 잘못된 구별(stereotypical, 고정관념의)로 전환"}, {"head": "There are many brightly", "clue": ["brightly coloured moths", "throughout the day"], "core": "화려한 나방, 낮에 활동하는 나방도 많음", "why": "고정관념이 틀린 근거 1: 나방 쪽 반례"}, {"head": "Equally, there are a", "clue": ["Equally", "nocturnal butterflies"], "core": "마찬가지로 밤 나비, 갈색·회색 나비도 있음", "why": "Equally(마찬가지로) → 나방 반례 다음에 나비 반례"}, {"head": "It's more sensible to", "clue": ["think of them together"], "core": "둘 다 아름다운 곤충으로 함께 보기", "why": "두 반례 정리 → '함께 생각하라'는 결론, 맨 끝"}], "postit": "구별 법칙 예고 → 더듬이·쉬는 자세 → 날개 고리 → 고정관념은 틀림 → 화려·낮 나방 → 밤·갈색 나비 → 함께 보기", "cex": [{"core": "나방·나비 구별은 어렵지만 경험 법칙이 있음", "why": "글의 출발: Distinguishing moths from butterflies(나방·나비 구별) → rules of thumb(경험 법칙)"}, {"core": "더듬이 모양과 쉬는 날개 자세로 구별", "why": "antennae(더듬이) → 앞에서 예고한 경험 법칙의 첫 번째·두 번째"}, {"core": "앞뒤 날개 잇는 고리는 나방에만", "why": "Further distinctions(추가 구별) → 앞의 더듬이·날개 자세에 하나 더 추가"}, {"core": "'칙칙한 야행성 나방' 고정관념은 틀림", "why": "The stereotypical differences(고정관념적 차이) → 앞의 실제 구별법과 대비되는 오해"}, {"core": "밤 나비·갈색 나비도 있어 둘을 함께 보기", "why": "Equally(마찬가지로) → 앞의 화려한 나방 예에 대응하는 나비 쪽 예"}]}, {"id": "mock_2510_g2-38", "label": "25년 10월 38번 야생 생물 관리의 두 방식", "sents": [{"en": "There are numerous ways wildlife is managed, but they all imply stewardship and can be classified into two broad categories: active management and inactive management.", "ko": "야생 생물이 관리되는 수많은 방법들이 있지만, 그것들은 모두 관리 책임을 수반하고 적극적 관리와 소극적 관리라는 두 가지 넓은 범주로 분류될 수 있다."}, {"en": "Active management does something to the population ―such as increasing or decreasing its size ―in a direct manner through strategies like translocations or hunting, respectively.", "ko": "적극적 관리는 거주지 이전이나 사냥과 같은 전략을 통해, 각각 규모를 증가시키거나 감소시키는 것과 같이 무언가를 직접적인 방식으로 개체군에게 실행한다."}, {"en": "Populations can also be actively managed by altering the habitat to the benefit or disadvantage of a population.", "ko": "개체군들은 또한 서식지를 개체군에게 유리하거나 불리하게 변경함으로써 적극적으로 관리될 수 있다."}, {"en": "If population numbers are too low for the goal of management agencies, other active management can be incorporated, such as predator control to minimize neonatal deaths or habitat improvement to provide required cover for neonates from predators.", "ko": "만약 개체 수가 관리 기관들의 목표보다 너무 적으면 갓 태어난 개체의 사망을 최소화하는 포식자 통제나 포식자로부터 갓 태어난 새끼들을 위해 필요한 은신처를 제공하는 서식지 개선과 같은 다른 적극적 관리가 포함될 수 있다."}, {"en": "These efforts represent active approaches to management.", "ko": "이러한 노력들은 관리에 대한 적극적인 접근법을 나타낸다."}, {"en": "Other populations may not be actively managed, like those in national parks.", "ko": "국립 공원들의 개체군들처럼 다른 개체군들은 적극적으로 관리되지 않을지도 모른다."}, {"en": "In such situations, management activities minimize external influences on populations and habitat, which often involves management of humans and not animals.", "ko": "그러한 상황들에서 관리 활동들은 개체군들과 서식지에 대한 외부 영향력을 최소화하는데, 그것은 대체로 동물들이 아닌 인간들에 대한 통제를 포함한다."}], "chunks": [[0, 0], [1, 1], [2, 4], [5, 6]], "ex": [{"head": "There are numerous ways", "clue": ["two broad categories", "active management and inactive management"], "core": "야생 관리 = 적극적 관리 / 비적극적 관리", "why": "글의 출발: 두 범주 제시(active 적극적 → inactive 비적극적 순서 예고)"}, {"head": "Active management does something", "clue": ["Active management", "translocations or hunting"], "core": "적극적 관리: 이주·사냥으로 개체 수 직접 조절", "why": "두 범주 중 먼저 나온 Active management(적극적 관리) 설명"}, {"head": "Populations can also be", "clue": ["also", "altering the habitat"], "core": "서식지를 바꿔서도 적극적 관리", "why": "also(또한) + actively(적극적으로) → 직접 조절 다음 두 번째 적극적 방법"}, {"head": "If population numbers are", "clue": ["too low", "other active management", "predator control"], "core": "개체 수 너무 적으면 포식자 통제·서식지 개선", "why": "other active management(다른 적극적 관리) → 앞 방법들에 더하는 것"}, {"head": "These efforts represent active", "clue": ["These efforts", "active approaches"], "core": "이것들이 적극적 관리", "why": "These efforts(이런 노력들) = 앞의 여러 방법 → 적극적 관리 정리"}, {"head": "Other populations may not", "clue": ["Other populations", "not be actively managed", "national parks"], "core": "국립공원처럼 적극적으로 관리 안 하는 경우", "why": "적극적 관리 정리 다음 → 두 번째 범주 inactive(비적극적)로 전환"}, {"head": "In such situations, management", "clue": ["In such situations", "management of humans"], "core": "이땐 외부 영향 최소화 → 동물 아닌 사람 관리", "why": "In such situations(그런 상황에서) = 앞의 국립공원 같은 비적극적 관리, 맨 끝"}], "postit": "두 범주 → 적극: 직접 조절 → 서식지 변경 → 포식자 통제 등 → 적극 정리 → 비적극: 국립공원 → 사람을 관리", "cex": [{"core": "야생 관리 = 적극적 관리와 비적극적 관리", "why": "글의 출발: two broad categories(두 큰 범주) → active(적극적)와 inactive(비적극적) 관리"}, {"core": "적극적 관리: 이주·사냥으로 개체 수 직접 조절", "why": "Active management(적극적 관리) → 앞에서 나눈 두 범주 중 첫 번째 설명"}, {"core": "서식지 변경·포식자 통제도 적극적 관리", "why": "also(또한) → 앞의 직접 조절에 이어 서식지를 바꾸는 다른 적극적 방법 추가"}, {"core": "국립공원처럼 외부 영향 최소화, 사람을 관리", "why": "Other populations(다른 개체군) + not be actively managed(적극 관리 안 됨) → 두 번째 범주"}]}, {"id": "mock_2510_g2-39", "label": "25년 10월 39번 폐기의 경제와 서비스로서의 제품", "sents": [{"en": "Waste has historically been seen as a necessary driver of the economy.", "ko": "폐기는 역사적으로 경제의 필수적인 추진력으로 여겨져 왔다."}, {"en": "Sales are tied to the amount of a product supplied, which is directly dependent on the demand for that product.", "ko": "판매량은 어떤 제품의 공급량에 연결되고, 그것은 그 제품에 대한 수요량에 직접적으로 의존한다."}, {"en": "Therefore, if you design the product to eventually be wasted, you can ensure that the demand for more products will be sustained.", "ko": "따라서, 만약 여러분이 그 제품을 결국에는 폐기되도록 설계한다면, 여러분은 더 많은 제품에 대한 수요량이 지속될 것을 보장할 수 있다."}, {"en": "Many strategies have been incorporated into product design and use to ensure that waste is inevitable, such as planned obsolescence, limited access to tools for repairs, and use of cheap materials.", "ko": "계획적 노후화, 수리 도구들에 대한 제한된 접근, 그리고 저렴한 자재들의 사용과 같은 많은 전략들은 폐기가 불가피하다는 것을 보장하기 위해서 제품 설계와 사용에 포함되어 왔다."}, {"en": "All these strategies ensure that the consumer will have limited access to the product in use and will eventually require a replacement.", "ko": "이 모든 전략들은 소비자가 사용 중인 제품에 제한된 접근을 하게 될 것이고 결국에는 교체를 필요로 할 것을 보장한다."}, {"en": "Those who supported the idea that waste is necessary to drive demand failed to realize that prioritizing the elimination of waste via repair and remanufacturing creates a different kind of demand: products as a service.", "ko": "폐기가 수요를 촉진하는 데 필수적이라는 생각을 지지했던 사람들은 수리와 재제조를 통해 폐기의 제거를 우선시하는 것이 서비스로서의 상품이라는 다른 종류의 수요를 창출한다는 것을 인식하는 데 실패했다."}, {"en": "Through this setup, companies simply lease out products that were once sold directly to the customer.", "ko": "이러한 구조를 통해 기업들은 한때 소비자에게 직접적으로 판매되었던 제품들을 단순히 임대한다."}, {"en": "With this transition of ownership, companies maintain profit by offering maintenance and repair services and are encouraged to develop long-lasting products.", "ko": "이러한 소유권의 전환으로 기업들은 유지와 수리 서비스들을 제공함으로써 수익을 유지하고 더 오래 지속되는 제품들을 개발하도록 촉진된다."}], "chunks": [[0, 0], [1, 1], [2, 4], [5, 5], [6, 7]], "ex": [{"head": "Waste has historically been", "clue": ["Waste", "necessary driver of the economy"]
