<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1d4ed8"><title>오답 노트</title>
<link rel="icon" type="image/svg+xml" href="icon.svg"><link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="../common/sx.css?v=261019">
<style>
.g{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden}
.gh{display:flex;align-items:center;gap:10px;padding:12px 14px}
.gh .t{flex:1;font-weight:800;font-size:15.5px;color:var(--navy)}.gh .t small{display:block;font-weight:600;font-size:12.5px;color:var(--sub);margin-top:2px}
.gh a.go{background:var(--pri);color:#fff;border-radius:10px;padding:9px 13px;font-weight:800;font-size:14px;text-decoration:none;white-space:nowrap}
.gi{border-top:1px solid var(--line);padding:0 14px}.gi summary{cursor:pointer;list-style:none;font-size:13px;color:var(--pri);font-weight:700;padding:8px 0}.gi summary::-webkit-details-marker{display:none}
.it{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14.5px}.it span{flex:1}.it small{display:block;color:var(--sub);font-size:12.5px}
.it button.sb{border-color:#f59e0b;color:#b45309;font-size:15px;padding:5px 11px}.it button.sb.off{border-color:var(--line);color:var(--sub)}.gh .bt{display:flex;flex-direction:column;gap:6px}.gh a.go.al{background:var(--card);color:var(--pri);border:1.5px solid var(--pri)}.gh span.go.no{background:var(--line);color:var(--sub);border-radius:10px;padding:9px 13px;font-weight:800;font-size:14px;white-space:nowrap}.it button{border:1.5px solid var(--line);background:var(--card);color:var(--sub);border-radius:9px;padding:6px 10px;font-weight:700;font-size:12.5px;line-height:1;font-family:inherit;cursor:pointer}
.empty{text-align:center;color:var(--sub);padding:40px 10px;line-height:1.7}
.note{font-size:13px;color:var(--sub);line-height:1.6;margin:4px 2px 10px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:4px 0 6px}.chip{border:1.5px solid var(--line);background:var(--card);color:var(--navy);border-radius:999px;padding:8px 13px;font-weight:700;font-size:14px;line-height:1;font-family:inherit;cursor:pointer}.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}.chip b{margin-left:3px}.pl{border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:13.5px;font-weight:700;color:var(--pri);text-decoration:none;background:var(--card)}details.g>summary{cursor:pointer;list-style:none}details.g>summary::-webkit-details-marker{display:none}
.hd{margin:16px 2px 4px;font-size:14px;font-weight:800;color:var(--sub)}
.sum{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:6px 2px 10px}.sum b{font-size:17px;color:var(--navy)}.sum span{font-size:12.5px;color:var(--sub)}
.big{display:block;width:100%;margin:8px 0;border:0;border-radius:12px;padding:15px;font-weight:800;font-size:16px;line-height:1;font-family:inherit;background:var(--pri);color:#fff;cursor:pointer}
.big.st2{background:var(--card);color:var(--pri);border:1.5px solid var(--pri)}
.big.dis,.big.dis:disabled{background:#e3e7ef!important;color:#8793a8!important;border:1.5px solid #d3d9e6!important;cursor:default;opacity:1}
.star{font-style:normal;color:#f59e0b;font-size:16px}
@media(prefers-color-scheme:dark){.big.dis,.big.dis:disabled{background:#222c3d!important;color:#8d9ab0!important;border-color:#2a3548!important}.big{color:#0b1220}.big.st2{color:var(--pri)}}
</style></head><body><div class="wrap"><div class="top"><a class="back" href="index.html">← 목록</a></div>
<h1>오답 노트</h1><p class="note">1차 오답은 자동 저장, 2차 오답은 별표(★) 표시</p>
<div id="st"></div>
<div class="foot" style="text-align:center;color:var(--sub);font-size:13px;margin-top:26px">비타민 영어클리닉</div></div>
<a class="homefab" href="index.html">⌂ 목록</a>
<script src="parts.js?v=261019"></script><script src="../common/prog.js?v=261019"></script><script src="wrong.js?v=261019"></script>
<script>
(function(){
var NM={voc:'어휘',find:'TF',eobeop:'어법선택',ko:'한글 순서',abc:'ABC 순서',mun:'문장삽입',awk:'어색한 곳',blank:'빈칸추론',und:'밑줄의 의미'};
var ORDER=['voc','find','eobeop','ko','abc','mun','awk','blank','und'];
var FILE={voc:'vocab.html',find:'find.html',eobeop:'eobeop-test.html',ko:'sunseo-ko.html',abc:'sunseo-abc.html',mun:'sunseo-mun.html',awk:'awkward-test.html',blank:'blank.html'};
var FILEM={voc:'nd-voc.html',find:'nd-find.html',eobeop:'nd-eob.html',awk:'nd-awk.html',und:'nd-und.html'};
var KN={L3:'교과서 3과',L4:'교과서 4과',mock:'모의고사'};
var KINDS=Object.keys(PARTS).filter(function(k){return k!=='names'&&PARTS[k]});
function url(kind,act){var f=kind==='mock'?FILEM[act]:FILE[act];return f?kind+'/'+f:null}
function E(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function pname(k,p){var n=PARTS.names&&PARTS.names[k]&&PARTS.names[k][p];return n||(p?('구간 '+p):'전체')}
function qurl(star){var L=WN.list().filter(function(x){return !star||x.star!==false}),g={};
  L.forEach(function(x){var k=x.kind+'|'+x.act+'|'+x.part;(g[k]=g[k]||{kind:x.kind,act:x.act,part:x.part})});
  return Object.keys(g).map(function(k){return g[k]}).sort(function(A,B){return (A.kind===B.kind?0:A.kind<B.kind?-1:1)||(ORDER.indexOf(A.act)-ORDER.indexOf(B.act))||(A.part-B.part)})
    .map(function(G){var u=url(G.kind,G.act);return u?u+'?part='+G.part+'&wrong=1'+(star?'&star=1':''):null}).filter(Boolean)}
function paint(){
  var L=WN.list(),st=document.getElementById('st');
  if(!L.length){st.innerHTML='<div class="empty">담긴 오답이 아직 없어요.</div>';return}
  var SC=L.filter(function(x){return x.star!==false}).length,solved=WN.solved();
  var h='<div class="sum"><b>담긴 오답 '+L.length+'개</b><span>별표 '+SC+'개'+(solved?' · 지금까지 '+solved+'문제 풀었어요':'')+'</span></div>'
   +'<button type="button" class="big" data-run="all">담긴 오답 전체 풀기</button>'
   +(SC?'<button type="button" class="big st2" data-run="star">별표만 풀기</button>':'<button type="button" class="big dis" disabled>별표만 풀기</button>');
  var g={};L.forEach(function(x){var k=x.kind+'|'+x.act+'|'+x.part;(g[k]=g[k]||{kind:x.kind,act:x.act,part:x.part,a:[]}).a.push(x)});
  var keys=Object.keys(g).sort(function(a,b){var A=g[a],B=g[b];return (A.kind===B.kind?0:A.kind<B.kind?-1:1)||(ORDER.indexOf(A.act)-ORDER.indexOf(B.act))||(A.part-B.part)});
  keys.forEach(function(k){var G=g[k],ns=G.a.filter(function(x){return x.star!==false}).length;
    h+='<details class="g"><summary class="gh"><div class="t">'+E(NM[G.act]||G.act)+' · '+G.a.length+'개<small>'+E(KN[G.kind]||G.kind)+' · '+E(pname(G.kind,G.part))+(ns?' · 별표 '+ns+'개':'')+'</small></div></summary>'
     +'<div class="gi">'+G.a.map(function(x){return'<div class="it"><span>'+E(x.label||x.qid)+(x.label2?'<small>'+E(x.label2)+'</small>':'')+'</span>'+(x.star!==false?'<em class="star">★</em>':'')+'</div>'}).join('')+'</div></details>'});
  st.innerHTML=h}
document.getElementById('st').addEventListener('click',function(e){
  var b=e.target.closest('button[data-run]');if(!b)return;
  var urls=qurl(b.dataset.run==='star');if(!urls.length)return;
  try{sessionStorage.setItem('wq',JSON.stringify({urls:urls,i:0}))}catch(x){}
  location.href=urls[0]});
paint();
})();
</script></body></html>
