</style></head><body class="notranslate"><div class="wrap" id="app"></div><script id="data" type="application/json">{"title": "유의어 꽉잡기", "sub": "26년 10월 모의고사 · 52단어", "key": "geumcheon-go2:yk:2610_g2", "sec": 0, "pass": [{"label": "26년 10월 31번 행동의 자동화와 기본 설정", "sents": [{"en": "A person who lives eighty years lives some twenty-nine thousand days, and the overwhelming majority of the behaviour packed into them runs on settings laid down, most of them, decades earlier and rarely inspected since.", "ko": "80년을 사는 사람은 약 2만 9천 일을 살고, 그 날들에 빽빽이 들어 있는 행동의 압도적 다수는 대부분 수십 년 전에 정해진 뒤 거의 점검되지 않은 설정에 따라 움직인다."}, {"en": "This need not be a hopeless thought.", "ko": "이것이 꼭 절망적인 생각일 필요는 없다."}, {"en": "In one light it is a triumph of engineering.", "ko": "어떤 관점에서 보면 그것은 설계의 승리이다."}, {"en": "If you had to consciously decide every footstep and every fork-grip and every word, you would never make it out of bed; the deliberate mind is far too slow and too costly to run a whole life in real time, and any creature that tried would be outcompeted by a creature that didn’t.", "ko": "만약 여러분이 발걸음 하나, 포크 쥐는 동작 하나, 말 한마디까지 모두 의식적으로 결정해야 한다면 침대에서 결코 나오지 못할 것이다. 신중한 사고는 삶 전체를 실시간으로 운영하기에는 너무 느리고 대가가 크며, 그렇게 하려는 생명체는 그러지 않는 생명체에게 경쟁에서 질 것이기 때문이다."}, {"en": "The automation is precisely what frees the captain to come up on deck for the few problems that actually require him.", "ko": "자동화는 바로 선장이 자신을 정말로 필요로 하는 몇 안 되는 문제를 위해 갑판 위로 올라올 수 있게 풀어 주는 것이다."}, {"en": "The default is not a flaw in the human design.", "ko": "기본 설정은 인간 설계의 결함이 아니다."}, {"en": "It is arguably the central feature, the thing that makes a complex life affordable at all.", "ko": "그것은 거의 틀림없이 핵심적인 특징, 즉 복잡한 삶을 조금이라도 감당할 수 있게 해 주는 것이다."}]}, {"label": "26년 10월 32번 대중문화와 법원의 역할", "sents": [{"en": "If we understand mass culture as a weakening factor of the cultural ties that unite people to their traditions, mass culture weakens the intermediary institutions in society (e.g. the family or the school), diminishing their role and overlapping these institutions.", "ko": "대중문화를 사람들을 전통에 묶어 주는 문화적 유대를 약하게 만드는 요인으로 이해한다면, 대중문화는 사회 속 매개 제도(예: 가족이나 학교)를 약화시켜 그 역할을 줄이고 이 제도들과 겹친다."}, {"en": "For example, courts are traditional social institutions and important for the normal and harmonious functioning of collective life.", "ko": "예를 들어, 법원은 전통적인 사회 제도이며 공동생활이 정상적이고 조화롭게 돌아가는 데 중요하다."}, {"en": "However, when people turn to social networks to put pressure on judicial decisions in certain mediated and politicized processes, this practice is popularized and becomes a habitual form of culture, which is harmful.", "ko": "그러나 어떤 조정되고 정치화된 과정에서 사람들이 사법적 판결에 압력을 가하려고 소셜 네트워크에 의지하면, 이러한 관행이 대중화되어 습관적인 문화의 한 형태가 되는데, 이는 해롭다."}, {"en": "Justice must not be done in the public square, which today is converted into a virtual dimension, the social networks.", "ko": "재판은 대중 광장에서 이루어져서는 안 되는데, 오늘날 그 광장은 가상의 차원, 즉 소셜 네트워크로 바뀌어 있다."}, {"en": "In a democratic state of law, the appropriate place to judge and make justice is the court and in a way that is immune to popular pressure.", "ko": "민주적인 법치 국가에서 재판하고 정의를 실현하기에 알맞은 곳은 법원이며, 그것도 대중의 압력에 흔들리지 않는 방식이어야 한다."}]}, {"label": "26년 10월 33번 가소성과 평생 발달", "sents": [{"en": "Human development is now increasingly understood as an ongoing, flexible, and evolving process rather than a fixed sequence of stages.", "ko": "인간 발달은 오늘날 고정된 순서의 단계라기보다는 계속 진행되고, 유연하며, 서서히 발전하는 과정으로 점점 더 이해되고 있다."}, {"en": "At the core of this perspective lies the concept of plasticity.", "ko": "이러한 관점의 핵심에는 가소성이라는 개념이 있다."}, {"en": "Plasticity refers to the human capacity to change, adapt, and reorganize cognitive, emotional, and behavioural patterns in response to life experiences, environmental demands, and biological changes.", "ko": "가소성은 삶의 경험, 환경적 요구, 생물학적 변화에 반응하여 인지적·정서적·행동적 패턴을 바꾸고, 적응시키고, 재구성하는 인간의 능력을 가리킨다."}, {"en": "It highlights that individuals are not merely passive recipients of development but active agents capable of growth throughout their lives.", "ko": "그것은 개인이 단순히 발달을 수동적으로 받아들이는 존재가 아니라 평생에 걸쳐 성장할 수 있는 능동적인 주체라는 점을 강조한다."}, {"en": "In earlier views, development was believed to occur mainly during childhood, with adulthood seen as a period of stability and old age as a phase of decline.", "ko": "이전의 관점에서는 발달이 주로 아동기에 일어난다고 믿어졌고, 성인기는 안정의 시기로, 노년기는 쇠퇴의 단계로 여겨졌다."}, {"en": "The concept of plasticity challenges this rigid outlook by emphasizing that development continues across the entire lifespan.", "ko": "가소성의 개념은 발달이 전 생애에 걸쳐 계속된다는 점을 강조함으로써 이러한 경직된 사고방식에 이의를 제기한다."}, {"en": "Although the extent of change may vary at different stages, every phase of life allows room for adaptation and transformation.", "ko": "비록 변화의 정도는 단계마다 다를 수 있지만, 삶의 모든 단계는 적응과 변화의 여지를 허용한다."}]}, {"label": "26년 10월 34번 상호 연결성과 새로운 취약성", "sents": [{"en": "Social media has altered business, politics, and friendships, making going viral a household term.", "ko": "소셜 미디어는 비즈니스, 정치, 친구 관계를 바꾸어 놓았고, '입소문이 나다(going viral)'를 일상적인 용어로 만들었다."}, {"en": "The global financial industry links every bank and countless households in every country, making us vulnerable to human error taking place on the other side of the world.", "ko": "세계 금융 산업은 모든 나라의 모든 은행과 수많은 가정을 연결하여, 우리를 세계 반대편에서 일어나는 인간의 실수에 취약하게 만든다."}, {"en": "As Columbia University strategy professor Rita McGrath explains, years ago most of our institutions were separate and thereby buffered from the effects of errors outside their walls.", "ko": "Columbia University 전략학 교수 Rita McGrath가 설명하듯이, 수년 전에는 우리 기관들 대부분이 분리되어 있었고, 그 덕분에 자신의 울타리 밖에서 일어난 오류의 영향으로부터 보호되었다."}, {"en": "That is no longer the case.", "ko": "이제는 더 이상 그렇지 않다."}, {"en": "The digitization of massive amounts of information has continued to grow enormously as the cost of computing power has decreased.", "ko": "컴퓨팅 능력의 비용이 줄어들면서 방대한 양의 정보의 디지털화는 계속해서 엄청나게 늘어났다."}, {"en": "The development of smart systems that communicate autonomously gave rise to an infinite variety of potential breakdowns.", "ko": "자율적으로 소통하는 스마트 시스템의 발달은 무한히 다양한 잠재적 고장을 낳았다."}, {"en": "This interdependence is a breeding ground for complex failure.", "ko": "이러한 상호 의존성은 복합적인 실패의 온상이다."}, {"en": "As Rita puts it, when “things that used to be kept separate bump up against each other, it becomes far more difficult to predict what’s going to happen next.”", "ko": "Rita가 말하듯이, '분리되어 있던 것들이 서로 부딪치게 되면, 다음에 무슨 일이 일어날지 예측하기가 훨씬 더 어려워진다.'"}, {"en": "Information technology creates new vulnerabilities because interconnectedness instantly spreads the impact of small failures.", "ko": "정보 기술은 새로운 취약성을 만들어 내는데, 상호 연결성이 작은 실패의 영향을 즉시 퍼뜨리기 때문이다."}]}, {"label": "26년 10월 36번 우리는 사용자가 아니다", "sents": [{"en": "A simple truth that designers must embrace in order to create more effective products and experiences is the fact that we are not the user.", "ko": "디자이너가 더 효과적인 제품과 경험을 만들기 위해 받아들여야 하는 단순한 진리는 우리가 사용자가 아니라는 사실이다."}, {"en": "We’re much too close to what we build to objectively see it and understand how users will interact with it.", "ko": "우리는 우리가 만드는 것에 너무 가까이 있어서 그것을 객관적으로 보고 사용자가 그것과 어떻게 상호 작용할지 이해할 수 없다."}, {"en": "The best user interfaces are those that have been shaped by observations of real users and their interactions with them.", "ko": "가장 좋은 사용자 인터페이스는 실제 사용자와 그들이 인터페이스와 상호 작용하는 모습을 관찰한 결과로 만들어져 온 것들이다."}, {"en": "So how can designers shape their work to be more effective?", "ko": "그렇다면 디자이너는 어떻게 자신의 작업을 더 효과적으로 만들 수 있을까?"}, {"en": "An incredibly effective way is with usability testing.", "ko": "엄청나게 효과적인 한 가지 방법은 사용성 테스트를 활용하는 것이다."}, {"en": "The goal of this method is to uncover problems in a design, discover existing opportunities, and learn more about the behaviors and preferences of users by asking participants to engage in realistic activities.", "ko": "이 방법의 목표는 참가자에게 실제와 같은 활동을 하도록 요청하여, 디자인의 문제를 밝혀내고, 이미 있는 기회를 발견하며, 사용자의 행동과 선호에 대해 더 많이 알아내는 것이다."}, {"en": "This technique is effective for understanding how well a design will perform once it is in the hands of real users.", "ko": "이 기법은 디자인이 실제 사용자의 손에 들어갔을 때 얼마나 잘 작동할지 이해하는 데 효과적이다."}, {"en": "Designers can use this method to improve their work through subsequent revisions based on the findings from representative users.", "ko": "디자이너는 대표 사용자에게서 얻은 결과를 바탕으로 이후 수정을 거쳐 자신의 작업을 개선하는 데 이 방법을 사용할 수 있다."}]}, {"label": "26년 10월 37번 재평가와 감정 조절", "sents": [{"en": "Reappraisal—changing the way one thinks about emotional situations—might present a particularly effective avenue to regulating emotions because it transforms emotions at their root.", "ko": "재평가, 즉 감정적인 상황에 대해 생각하는 방식을 바꾸는 것은 감정을 근본부터 바꾸기 때문에 감정을 조절하는 데 특히 효과적인 방법이 될 수 있다."}, {"en": "Take, for example, someone who is going through a divorce.", "ko": "예를 들어, 이혼을 겪고 있는 사람을 생각해 보자."}, {"en": "This is often an adverse event, and yet, it can be construed in different ways.", "ko": "이것은 보통 부정적인 사건이지만, 그럼에도 서로 다른 방식으로 해석될 수 있다."}, {"en": "One might view it as an overpowering loss that will mark one’s family for life.", "ko": "어떤 사람은 그것을 가족에게 평생 흔적을 남길 압도적인 상실로 볼 수 있다."}, {"en": "Alternatively, one might see it as something that is painful but that might lead to positive outcomes in the long run, such as improved relationships.", "ko": "이와 달리, 어떤 사람은 그것을 고통스럽지만 장기적으로는 더 나아진 관계 같은 긍정적인 결과로 이어질 수 있는 일로 볼 수도 있다."}, {"en": "As a result of these different construals, one might feel different emotions.", "ko": "이렇게 서로 다른 해석의 결과로, 사람은 서로 다른 감정을 느낄 수 있다."}, {"en": "The first construal may bring intense sadness and anger.", "ko": "첫 번째 해석은 강렬한 슬픔과 분노를 가져올 수 있다."}, {"en": "The second construal might also bring sadness and anger but perhaps at lower levels.", "ko": "두 번째 해석 역시 슬픔과 분노를 가져올 수 있지만, 아마도 더 낮은 강도일 것이다."}, {"en": "Crucially, it might also bring some positive emotions, such as hope, strength, or gratitude.", "ko": "결정적으로, 그것은 희망, 강인함, 감사 같은 긍정적인 감정도 가져올 수 있다."}, {"en": "This example illustrates how reappraisal might powerfully transform short-term emotional responses.", "ko": "이 예시는 재평가가 단기적인 감정 반응을 어떻게 강력하게 바꿀 수 있는지 보여 준다."}, {"en": "When repeated over time, these short-term emotional consequences of reappraisal might accumulate to shape people’s psychological health.", "ko": "오랜 시간 반복되면, 재평가가 낳은 이러한 단기적인 감정의 결과가 쌓여 사람들의 심리적 건강을 형성할 수 있다."}, {"en": "Thereby, reappraisal might be a key to resilience.", "ko": "그렇게 함으로써, 재평가는 회복 탄력성의 열쇠가 될 수 있다."}]}, {"label": "26년 10월 38번 수질과 용도별 안전 기준", "sents": [{"en": "When we say that water is “clean,” we don’t just mean that it looks like a glass of water.", "ko": "우리가 물이 '깨끗하다'고 말할 때, 그것이 마실 물 한 잔처럼 보인다는 것만을 뜻하는 것은 아니다."}, {"en": "Water quality is about following a certain set of criteria, or “benchmarks.”", "ko": "수질은 특정한 기준의 집합, 즉 '지표'를 따르는 것에 관한 것이다."}, {"en": "These guidelines inform us exactly how much physical, chemical, or biological stuff can be in the water.", "ko": "이러한 지침은 정확히 얼마만큼의 물리적, 화학적, 생물학적 물질이 물속에 있어도 되는지를 알려 준다."}, {"en": "These rules ensure the water is safe for anything we want to do with it, whether that’s drinking it at home, watering crops on a farm, or running it through a huge industrial boiler.", "ko": "이러한 규칙은 우리가 물로 하려는 일이 집에서 마시는 것이든, 농장에서 작물에 물을 주는 것이든, 거대한 산업용 보일러에 흘려보내는 것이든, 그 물이 그 일에 안전하도록 보장한다."}, {"en": "We can’t utilize the same “one size fits all” rule for everyone because we use water for so many diverse things.", "ko": "우리는 물을 아주 다양한 일에 사용하기 때문에 모두에게 똑같은 '일률적인' 규칙을 쓸 수 없다."}, {"en": "For instance, the water that cools down a huge power plant generator doesn’t need to be as clean as the water you drink from the kitchen tap.", "ko": "예를 들어, 거대한 발전소의 발전기를 식히는 물은 여러분이 주방 수도꼭지에서 받아 마시는 물만큼 깨끗할 필요는 없다."}, {"en": "This is why groups set different “safety limits” for the water dependent on how it will be utilized.", "ko": "이것이 바로 여러 집단이 물이 어떻게 쓰일지에 따라 서로 다른 '안전 허용치'를 정하는 이유이다."}]}, {"label": "26년 10월 39번 사회사학자의 사료 읽기", "sents": [{"en": "Like all historians, social historians draw from a variety of primary sources.", "ko": "모든 역사학자와 마찬가지로, 사회사학자도 다양한 1차 자료를 활용한다."}, {"en": "Social history often emphasizes ordinary people rather than elites.", "ko": "사회사는 흔히 엘리트보다 평범한 사람들을 강조한다."}, {"en": "Yet, in most places and times, nonelites lacked access to education and, thus, did not produce substantial amounts of documentation.", "ko": "하지만 대부분의 지역과 시대에서 엘리트가 아닌 사람들은 교육을 받을 기회가 부족했고, 그래서 많은 양의 문서 기록을 남기지 못했다."}, {"en": "Even when they did produce documentation, these materials rarely ended up in archives where they could be preserved and made available to researchers.", "ko": "그들이 문서 기록을 남겼을 때조차, 이러한 자료들은 보존되어 연구자들이 이용할 수 있게 되는 기록 보관소에 거의 들어가지 못했다."}, {"en": "Because of such biases in the historical record, social historians have to be very creative in their work.", "ko": "역사 기록의 이러한 편향 때문에, 사회사학자는 자신의 작업에서 매우 창의적이어야 한다."}, {"en": "Like other historians, social historians analyze textual sources produced by government officials, employers, and other elites.", "ko": "다른 역사학자들처럼 사회사학자도 정부 관료, 고용주, 그 밖의 엘리트들이 만든 문서 자료를 분석한다."}, {"en": "Yet rather than simply take such sources at face value, they read them “against the grain”.", "ko": "하지만 그들은 그러한 자료를 단순히 액면 그대로 받아들이기보다는 '일반적인 방식과 다르게' 읽는다."}, {"en": "So, for example, a social historian will read legal documents not only for the “facts” provided by slaveowners; she will also examine the silences, interruptions, rumors, and other details that offer hints about the enslaved peoples’ attitudes and actions.", "ko": "그래서 예를 들어, 사회사학자는 법률 문서를 노예 소유주가 제공한 '사실'만을 얻으려고 읽는 것이 아니라, 노예가 된 사람들의 태도와 행동에 대한 힌트를 주는 침묵, 중단, 소문, 그 밖의 세부 사항도 살펴볼 것이다."}]}, {"label": "26년 10월 40번 돌고래의 병렬 처리 청각 피질", "sents": [{"en": "Dolphins’ brains have evolved specialized areas dedicated to echolocation, allowing them to process acoustic information more quickly and with less energy.", "ko": "돌고래의 뇌는 반향 정위에 쓰이는 특화된 구역을 진화시켰고, 이것은 그들이 음향 정보를 더 빠르고 더 적은 에너지로 처리할 수 있게 해 준다."}, {"en": "One key adaptation is the structure of the dolphin’s auditory pathway.", "ko": "한 가지 핵심적인 적응은 돌고래의 청각 경로의 구조이다."}, {"en": "The signals from the ears are rapidly transmitted to the auditory cortex, the brain region responsible for processing sound.", "ko": "귀에서 온 신호는 소리 처리를 담당하는 뇌 영역인 청각 피질로 빠르게 전달된다."}, {"en": "However, unlike many other mammals, dolphins have a highly specialized auditory cortex with distinct areas dedicated to processing different aspects of echolocation signals.", "ko": "그러나 다른 많은 포유류와 달리, 돌고래는 반향 정위 신호의 서로 다른 측면을 처리하는 개별 구역을 가진 고도로 특화된 청각 피질을 가지고 있다."}, {"en": "Some areas may be responsible for analyzing the timing of echoes, while others focus on the frequency content or the intensity of the sound.", "ko": "어떤 구역은 반사음의 타이밍 분석을 담당하고, 다른 구역은 소리의 주파수 성분이나 강도에 집중한다."}, {"en": "This specialization allows the dolphin’s brain to process echo information in parallel, rather than sequentially.", "ko": "이러한 특화 덕분에 돌고래의 뇌는 반사음 정보를 순차적으로가 아니라 병렬로 처리할 수 있다."}, {"en": "Imagine a factory assembly line, where different workers are responsible for different tasks.", "ko": "서로 다른 노동자들이 서로 다른 일을 맡는 공장 조립 라인을 떠올려 보라."}, {"en": "By dividing the work among specialized areas, the brain can process information much faster and more efficiently.", "ko": "특화된 구역들에 일을 나누어 줌으로써, 뇌는 정보를 훨씬 더 빠르고 효율적으로 처리할 수 있다."}, {"en": "This parallel processing reduces the cognitive load associated with echolocation, allowing dolphins to react quickly to changes in their environment.", "ko": "이러한 병렬 처리는 반향 정위에 따르는 인지 부담을 줄여 주어, 돌고래가 환경의 변화에 빠르게 반응할 수 있게 해 준다."}]}], "items": [{"id": "mock_2610_g2_a:m2610g2a-34", "p": 0, "s": 0, "w": "overwhelming", "h": "overwhelming", "pos": "형", "m": "압도적인, 엄청나게 많은", "form": "", "syn": [["vast", "막대한"], ["huge", "엄청난"]], "ant": [["slim", "근소한"], ["narrow", "근소한, 좁은"]], "trap": [["unbearable", "견딜 수 없는", "overwhelming의 다른 뜻 '감당하기 힘든'과 비슷한 말"]], "dis": [["polite", "예의 바른"]], "other": [["감당하기 힘든", "an overwhelming amount of homework", "감당하기 힘든 양의 숙제"]], "tip": "본문 overwhelming(압도적인, 엄청나게 많은) → 시험에서 vast(막대한)로 바뀔 수 있음 / unbearable(견딜 수 없는)는 다른 뜻 쪽 함정", "story": "우리 행동의 거의 전부가 오래전에 정해진 설정대로 돌아간다는 얘기에서 나온 단어"}, {"id": "mock_2610_g2_a:m2610g2a-35", "p": 0, "s": 0, "w": "runs", "h": "run", "pos": "동", "m": "작동하다, 돌아가다", "form": "동사 run의 3인칭 단수 현재형 (주어가 단수라 -s가 붙은 모양)", "syn": [["operate", "작동하다"], ["work", "작동하다"]], "ant": [], "trap": [["manage", "운영하다", "run의 다른 뜻 '운영하다'와 비슷한 말"], ["jog", "천천히 달리다", "run의 다른 뜻 '달리다'와 비슷한 말"]], "dis": [["melt", "녹다"]], "other": [["운영하다", "She runs a small bakery.", "그녀는 작은 빵집을 운영한다."], ["달리다", "I run every morning.", "나는 매일 아침 달린다."]], "tip": "run on settings의 run은 '달리다'가 아니라 '작동하다' → operate·work와 짝, 뒤의 run a whole life(삶 전체를 운영하다)는 또 다른 뜻", "story": "행동 대부분이 수십 년 전에 깔린 설정으로 돌아간다는 얘기에서 나온 단어"}, {"id": "mock_2610_g2_a:m2610g2a-36", "p": 0, "s": 0, "w": "inspected", "h": "inspect", "pos": "동", "m": "점검하다, 살펴보다", "form": "동사 inspect의 과거분사형 (수동·완료 표현이라 -ed 꼴)", "syn": [["examine", "살펴보다, 검사하다"], ["check", "점검하다"], ["review", "다시 살펴보다"]], "ant": [["neglect", "방치하다"]], "trap": [], "dis": [["decorate", "장식하다"], ["borrow", "빌리다"]], "other": [], "tip": "본문 inspect(점검하다, 살펴보다) → 시험에서 examine(살펴보다, 검사하다)로 바뀔 수 있음", "story": "한번 정해진 설정은 그 뒤로 거의 들여다보지 않는다는 얘기에서 나온 단어"}, {"id": "mock_2610_g2_a:m2610g2a-38", "p": 0, "s": 2, "w": "triumph", "h": "triumph", "pos": "명", "m": "승리, 대성공", "form": "", "syn": [["success", "성공"]], "ant": [["failure", "실패"], ["defeat", "패배"]], "trap": [], "dis": [["rumor", "소문"], ["habit", "습관"]], "other": [], "tip": "triumph(대성공) ↔ 뒤에 나오는 flaw(결함), 시험에서 success로 바뀔 수 있음", "story": "자동으로 움직이는 건 한심한 게 아니라 설계가 거둔 큰 성공이라는 얘기에서 나온 단어"}, {"id": "mock_2610_g2_a:m2610g2a-39", "p": 1, "s": 0, "w": "ties", "h": "tie", "pos": "명", "m": "유대, 끈", "form": "명사 tie의 복수형 (여러 개라 -s가 붙은 모양)", "syn": [["bond", "유대"], ["link", "연결 고리"], ["connection", "연결, 관계"]], "ant": [], "trap": [["necktie", "넥타이", "tie의 다른 뜻 '넥타이'와 비슷한 말"], ["draw", "무승부", "tie의 다른 뜻 '동점, 무승부'와 비슷한 말"]], "dis": [["debt", "빚"]], "other": [["넥타이", "He wore a red tie.", "그는 빨간 넥타이를 맸다."], ["동점, 무승부", "The game ended in a tie.", "경기는 무승부로 끝났다."]], "tip": "본문 tie(유대, 끈) → 시험에서 bond(유대)로 바뀔 수 있음 / necktie(넥타이)는 다른 뜻 쪽 함정", "story": "사람들을 전통과 이어 주는 문화적 끈을 대중문화가 약하게 한다는 얘기에서 나온 단어"}, {"id": "mock_2610_g2_a:m2610g2a-40", "p": 1, "s": 0, function __NOK(f,l){l=String(l);var m=l.match(/^(\d+)년\s*(\d+)월\s*(\d+)(?:[~-](\d+))?번/),a,b;if(m){if(m[1]+('0'+m[2]).slice(-2)!=f.y)return false;a=+m[3];b=m[4]?+m[4]:a}else{m=l.match(/^(\d+)(?:-(\d+))?$/);if(!m)return false;a=+m[1];b=m[2]?+m[2]:a;if(a>99||b>99||b<a)return false}for(var i=a;i<=b;i++)if(f.w[i])return true;return false}
(function(){var f=__NF();if(!f)return;IT=IT.filter(function(it){return __NOK(f,D.pass[it.p].label)});KEY+=':n'+f.q.replace(/[^0-9,]/g,'');var r=f.mn+'~'+f.mx+'번';D.sub=D.sub.replace(/\s*·\s*\d+단어$/,'')+' · '+r+(' · '+IT.length+'단어')})();
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function sget(k,d){try{var v=localStorage.getItem(KEY+':'+k);return v?JSON.parse(v):d}catch(e){return d}}
function sset(k,v){try{localStorage.setItem(KEY+':'+k,JSON.stringify(v))}catch(e){}}
function sdel(k){try{localStorage.removeItem(KEY+':'+k)}catch(e){}}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function sent(it){return D.pass[it.p].sents[it.s]}
function under(en,w){var i=en.indexOf(w);if(i<0){var re=new RegExp('\\b'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i'),m=re.exec(en);if(!m)return esc(en);i=m.index;w=m[0]}var pre=en.slice(0,i).replace(/(^|\s)(a|an|A|An)\s$/,function(m,a,b){return a+(b[0]=='A'?'A(n)':'a(n)')+' '});return esc(pre)+'<u>'+esc(w)+'</u>'+esc(en.slice(i+w.length))}
function optsOf(it){var o=[];it.syn.forEach(function(x){o.push({w:x[0],m:x[1],g:'syn'})});it.ant.forEach(function(x){o.push({w:x[0],m:x[1],g:'ant'})});it.trap.forEach(function(x){o.push({w:x[0],m:x[1],g:'trap',r:x[2]})});it.dis.forEach(function(x){o.push({w:x[0],m:x[1],g:'dis'})});return o}
function mk(idx){return {k:idx,o:shuf(optsOf(IT[idx]).map(function(x,i){return i})),sel:{},rev:false}}
function isOK(q){var it=IT[q.k],o=optsOf(it);for(var i=0;i<o.length;i++){var s=!!q.sel[i];if(s!==(o[i].g=='syn'))return false}return true}
function wrongs(){return sget('wrong',[])}
function setWrong(k,bad){var w=wrongs(),i=w.indexOf(k);if(bad&&i<0)w.push(k);if(!bad&&i>=0)w.splice(i,1);sset('wrong',w)}
function speak(w){try{var u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
var S=null;
function home(){S=null;clearInterval(TM);var w=wrongs(),pv=sget('prac',null),px=sget('real',null),ex=sget('exam',null);
 var h='<h1 lang="ko">'+esc(D.title)+'</h1><div class="sub">'+esc(D.sub)+'</div>';
 h+='<button class="mcard" onclick="startPrac(0)"><b>관계 지도 연습</b><span>'+(pv?('이어서 · '+(pv.i+1)+' / '+pv.q.length):'한 문제씩 풀고 · 바로 지도로 확인')+'</span></button>';
 if(w.length)h+='<button class="chipb" onclick="startPrac(1)">틀린 '+w.length+'개만 다시</button>';
 h+='<button class="mcard" onclick="startReal()"><b>실전 예행연습</b><span>'+(px?('이어서 · '+(px.i+1)+' / '+px.q.length):'시험처럼 한번에 · 틀린 것만 다시')+'</span></button>';
 h+='<button class="mcard" onclick="startExam()"><b>시험</b><span>'+(ex&&ex.done?('응시 완료 · '+ex.score+' / '+ex.q.length):'1회 · 타임어택'+(IT.length>25?' · 25문제':''))+'</span></button>';
 h+='<div class="small" style="margin:14px 4px">'+IT.length+'단어 · 틀린 단어 '+w.length+'개</div>';
 if(ex&&ex.done)h+='<button class="go sec" id="rx" onclick="twoTap(this,resetExam)">시험 기록 지우기</button>';
 $('app').innerHTML=h;window.scrollTo(0,0)}

/* 관계 지도 연습 */
function startPrac(only){var pv=sget('prac',null);if(!only&&pv){S=pv;S.mode='prac'}else{var ks=only?shuf(wrongs()):shuf(IT.map(function(x,i){return i}));S={mode:'prac',only:!!only,i:0,q:ks.map(mk)}}rPrac()}
function qCard(q,interactive){var it=IT[q.k],s=sent(it),o=optsOf(it);
 var h='<div class="card"><div class="src">'+esc(D.pass[it.p].label)+'</div><div class="sen" lang="en" translate="no">'+under(s.en,it.w)+'</div>';
 if(q.rev)h+='<div class="ko">'+esc(s.ko)+'</div>';
 h+='<div class="q">밑줄 친 단어와 바꿔 쓸 수 있는 것 모두</div>';
 if(!q.rev){h+='<div class="opts">';q.o.forEach(function(oi){var x=o[oi];h+='<button class="opt'+(q.sel[oi]?' sel':'')+'" lang="en" translate="no" '+(interactive?'onclick="tg('+oi+')"':'')+'>'+esc(x.w)+'</button>'});h+='</div>'}
 return h+'</div>'}
function tg(oi){var q=S.q[S.i];q.sel[oi]=!q.sel[oi];save();(S.mode=='prac'?rPrac:rReal)()}
function save(){if(S.mode=='prac'&&!S.only)sset('prac',S);if(S.mode=='real')sset('real',S);if(S.mode=='exam')sset('exam',S)}
function anySel(q){for(var k in q.sel)if(q.sel[k])return true;return false}
function topBar(t){var n=S.q.length;return '<div class="top"><b>'+t+'</b><span>'+(S.i+1)+' / '+n+'</span><button class="hb" onclick="home()">처음으로</button></div><div class="bar"><i style="width:'+(S.i/n*100)+'%"></i></div>'}
function rPrac(){var q=S.q[S.i],last=S.i>=S.q.length-1,h=topBar(S.only?'틀린 것 다시':'관계 지도 연습');
 if(!q.rev){h+=qCard(q,true)+'<button class="go" '+(anySel(q)?'':'disabled')+' onclick="chk()">확인</button>'}
 else{var ok=isOK(q);h+='<div class="band '+(ok?'ok':'ng')+'">'+(ok?'정답':'오답')+'</div>'+qCard(q,false)+mapCard(q)+'<button class="go" onclick="nxt()">'+(last?'결과 보기':'다음 문제')+'</button>'}
 h+='<button class="go sec" onclick="home()">목록으로</button>';
 $('app').innerHTML=h;window.scrollTo(0,0);if(q.rev)setTimeout(drawAll,30)}
function chk(){var q=S.q[S.i];q.rev=true;var ok=isOK(q);if(S.only){if(ok){q.ok=1}setWrong(q.k,!ok)}else setWrong(q.k,!ok);save();rPrac()}
function nxt(){if(S.i>=S.q.length-1){var ok=S.q.filter(isOK).length,n=S.q.length;if(!S.only)sdel('prac');$('app').innerHTML='<div class="band '+(ok==n?'ok':'ng')+'">'+n+'개 중 '+ok+'개 정답<small>틀린 단어는 "틀린 것만 다시"에 모여 있어요</small></div><button class="go" onclick="home()">목록으로</button>';return}S.i++;save();rPrac()}
/* 관계 지도 */
function chip(x,cls,tag,tc,extra){return '<button class="mw '+cls+'" onclick="speak(\''+x.w.replace(/'/g,"\\'")+'\')"><span class="e" lang="en" translate="no">'+esc(x.w)+'</span>'+(tag?'<i class="'+tc+'">'+tag+'</i>':'')+'<span class="k">'+esc(x.m)+'</span>'+(extra||'')+'</button>'}
function mapCard(q){var it=IT[q.k],o=optsOf(it),st=function(i){var x=o[i],s=!!q.sel[i];if(x.g=='syn')return s?['맞힘','g']:['놓침','b'];return s?['잘못 고름','b']:['',''];};
 var L='',R='',T='',X='';
 o.forEach(function(x,i){var t=st(i),miss=(x.g=='syn'&&!q.sel[i])?' miss':'';
  if(x.g=='syn')L+=chip(x,'l'+miss,t[0],t[1]);
  else if(x.g=='ant')R+=chip(x,'r',t[0]||'반대',t[0]?t[1]:'b');
  else if(x.g=='trap')T+=chip(x,'t',t[0]||'함정',t[0]?t[1]:'m','<span class="tr">'+esc(x.r||'')+'</span>');
  else X+=chip(x,'d',t[0],t[1]);});
 var h='<div class="card"><div class="map"><svg></svg><div class="mc"><b lang="en" translate="no">'+esc(it.h)+'</b><em>본문 뜻: '+esc(it.m)+'</em></div>';
 h+='<div class="cols"><div class="col"><h4>바꿔 쓸 수 있음</h4>'+L+'</div><div class="col"><h4>반대 뜻</h4>'+(R||'<div class="small">없음</div>')+'</div></div></div>';
 if(T||X)h+='<div class="lower">'+(T?'<h4>다른 뜻 함정</h4>'+T:'')+(X?'<h4>관계없음</h4>'+X:'')+'</div>';
 if(it.form)h+='<div class="small" style="margin-top:8px">'+esc(it.w)+' = '+esc(it.form)+'</div>';
 if(it.other&&it.other.length){h+='<div class="oth"><b>'+esc(it.h)+'의 다른 뜻</b>';it.other.forEach(function(x){h+='<div><b style="display:inline;color:#1f2430;font-size:.92rem">'+esc(x[0])+'</b> <span class="ex" lang="en" translate="no">'+esc(x[1])+'</span><div class="ex">'+esc(x[2])+'</div></div>'});h+='</div>'}
 if(it.tip)h+='<div class="tip">'+esc(it.tip)+'</div>';

 return h+'</div>'}
function drawAll(){[].forEach.call(document.querySelectorAll('.map'),function(map){var svg=map.querySelector('svg'),mc=map.querySelector('.mc'),m=map.getBoundingClientRect();if(!m.width)return;svg.setAttribute('width',m.width);svg.setAttribute('height',m.height);var c=mc.getBoundingClientRect(),sx=c.left-m.left+c.width/2,sy=c.bottom-m.top-2,h='';
 [].forEach.call(map.querySelectorAll('.mw.l,.mw.r'),function(b){var r=b.getBoundingClientRect(),L=b.classList.contains('l'),ex=(L?r.right:r.left)-m.left,ey=r.top-m.top+r.height/2;h+='<path class="'+(L?'ls':'ra')+(b.classList.contains('miss')?' miss':'')+'" d="M'+sx+' '+sy+' Q'+sx+' '+ey+' '+ex+' '+ey+'"/>'});svg.innerHTML=h})}
window.addEventListener('resize',function(){setTimeout(drawAll,50)});
/* 실전 예행연습 / 시험 공통 */
function startReal(){var px=sget('real',null);if(px&&!px.done){S=px}else{S={mode:'real',i:0,q:shuf(IT.map(function(x,i){return i})).map(mk)}}rReal()}
var TM=null;
function startExam(){var ex=sget('exam',null);if(ex&&ex.done){S=ex;showRes();return}if(ex){S=ex}else{var ks=shuf(IT.map(function(x,i){return i})).slice(0,25);S={mode:'exam',i:0,q:ks.map(mk),end:Date.now()+ks.length*20000};save()}rReal();clearInterval(TM);TM=setInterval(tick,500)}
function tick(){if(!S||S.mode!='exam'){clearInterval(TM);return}var r=Math.max(0,Math.round((S.end-Date.now())/1000));var e=$('tm');if(e)e.textContent=Math.floor(r/60)+':'+('0'+r%60).slice(-2);if(r<=0){clearInterval(TM);fin()}}
function rReal(){var q=S.q[S.i],last=S.i>=S.q.length-1,h=topBar(S.mode=='exam'?'시험 <span class="timer" id="tm"></span>':'실전 예행연습');
