</style></head><body class="notranslate"><div class="wrap" id="app"></div><script id="data" type="application/json">{"title": "유의어 꽉잡기", "sub": "25년 10월 모의고사 · 76단어", "key": "geumcheon-go2:yk:2510_g2", "sec": 0, "pass": [{"label": "25년 10월 20번 환자와의 직업적 거리", "sents": [{"en": "When you are working in healthcare, it is important to develop a solid professional relationship with your patients.", "ko": "여러분이 의료 분야에서 근무할 때, 여러분의 환자들과 견고한 직업적인 관계를 구축하는 것이 중요하다."}, {"en": "By establishing realistic self-boundaries, you can protect that relationship.", "ko": "현실적인 자기 경계를 확립함으로써, 여러분은 그 관계를 보호할 수 있다."}, {"en": "It is important to keep the focus on the patient.", "ko": "초점을 환자에게 두는 것이 중요하다."}, {"en": "When working with patients who are seen frequently, it is easy to start to think of them as friends.", "ko": "자주 만나게 되는 환자들을 상대로 일할 때는, 그들을 친구처럼 생각하기 시작하기 쉽다."}, {"en": "With a friend, you are likely to share personal information that is not appropriate with a patient.", "ko": "여러분은 환자와는 공유하기 적절하지 않은 개인 정보를 친구와 나눌 가능성이 있다."}, {"en": "Patients may feel that they cannot share important health-related information because you are their friend, and it would be embarrassing to share that information.", "ko": "환자들은 여러분이 자신들의 친구이기 때문에 중요한 건강 관련 정보를 자신들이 공유할 수 없다고 느낄 수도 있고, 그 정보를 나누는 것이 난처할 수 있다."}, {"en": "Self-boundaries can also be thought of as professional boundaries.", "ko": "자기 경계는 직업적인 경계로 간주될 수도 있다."}, {"en": "You need to treat patients with respect and keep the relationship professional.", "ko": "여러분은 환자들을 존중으로 대하고 그 관계를 전문적으로 유지할 필요가 있다."}, {"en": "Be friendly to patients and always keep the focus on the patient.", "ko": "환자들에게 친절하고 항상 환자에게 초점을 두어야 한다."}]}, {"label": "25년 10월 21번 혀 실험으로 보는 미각 유형", "sents": [{"en": "Coat a fresh, wet swab in salt, and gently touch various spots on your tongue, recording where your taste seems strongest.", "ko": "새로운 젖은 면봉에 소금을 묻히고 여러분의 미각이 가장 강렬하다고 느껴지는 곳을 기록하면서, 혀의 다양한 부위들에 부드럽게 대 보아야 한다."}, {"en": "Then, gargle with water to thoroughly clean your tongue, use a swab coated with sugar on the same spots, and record those results.", "ko": "그런 다음, 여러분의 혀를 완전히 씻어 내기 위해 물로 헹구고, 설탕이 덮인 면봉을 같은 부위들에 사용하고, 그 결과들을 기록해야 한다."}, {"en": "Gargle again, and then swab with lemon juice.", "ko": "다시 헹구고 그런 다음 레몬주스를 면봉으로 혀에 발라야 한다."}, {"en": "After a final gargle, try coffee.", "ko": "마지막 헹굼 이후에 커피로 해 보아야 한다."}, {"en": "Compare your reactions with your friends'.", "ko": "여러분의 반응들을 친구들의 것들과 비교해야 한다."}, {"en": "Your taste pattern may reveal more than just taste preferences.", "ko": "여러분의 미각 패턴은 단순히 맛에 대한 선호도보다 더 많은 것을 보여줄지도 모른다."}, {"en": "Recent studies suggest links between taster status and behavioral disorders.", "ko": "최근의 연구들은 미각 유형(미각 둔감자·초미각자 등)와 행동 장애 사이의 연관성을 시사한다."}, {"en": "For example, \"non-tasters\" tend to have a higher incidence of alcoholism, perhaps because liquor seems less bitter to them.", "ko": "예를 들어 '미각 둔감자'는 더 높은 알코올 중독 발생률을 가지는 경향이 있는데, 아마도 술이 그들에게 덜 쓰다고 느껴지기 때문일 것이다."}, {"en": "Conversely, \"super-tasters\" may avoid nutritious but mildly bitter foods such as broccoli, thus depriving themselves of a balanced diet.", "ko": "반대로 '초미각자'는 브로콜리와 같이 영양가 있지만 약간 쓴 음식들을 회피할지도 모르고, 그러므로 스스로에게 균형 잡힌 식단을 박탈할 수도 있다."}, {"en": "So, although taste is not nearly as glamorous as vision, hearing, or even touch, it makes sense for you to pay closer attention to it because chemistry, at least in your mouth, could be destiny.", "ko": "그래서 비록 미각이 시각, 청각, 또는 심지어 촉각만큼 화려하지는 않지만, 적어도 여러분의 입안에서는, 화학 작용이 운명이 될 수 있기 때문에 여러분이 그것에 좀 더 세심한 주의를 기울이는 것이 합리적이다."}]}, {"label": "25년 10월 22번 해 보기 전엔 모른다는 과학", "sents": [{"en": "Experiments testify to science's embrace of ignorance.", "ko": "실험들은 과학의 무지에 대한 포용을 입증한다."}, {"en": "Arguably the worst thing a scientist can do is to suppose they know what will happen in a given scenario without bothering to check.", "ko": "거의 틀림없이 과학자가 할 수 있는 가장 나쁜 것은 그들이 확인하려는 수고를 들이지 않고 주어진 시나리오에서 벌어질 일을 그들이 안다고 추측하는 것이다."}, {"en": "The rise of the experimental philosophy coincided with the liberation of curiosity as a valuable rather than a questionable attribute.", "ko": "실험 철학의 등장은 의심스러운 특성이 아닌 가치 있는 특성으로서의 호기심의 해방과 동시에 발생했다."}, {"en": "For all that experimental science today is often assumed to be supported by a philosophical framework and an approved methodology (\"state your hypothesis and then test it\"), the fact is that, as philosopher of science Ian Hacking says, \"One can conduct an experiment simply out of curiosity to see what will happen.\"", "ko": "오늘날의 실험 과학은 철학적 틀과 승인된 방법론('가설을 세우고 나서 그것을 검증하라')에 의해 뒷받침되고 있다고 종종 여겨지지만, 사실은 과학 철학자 Ian Hacking이 말하듯이, '누군가는 무슨 일이 벌어질 것인지를 알아보기 위해 그저 호기심에서 실험을 실행할 수도 있다'."}, {"en": "Indeed, in the view of Charles Darwin's son, the astronomer George Darwin, once in a while one should do a completely crazy experiment, even if it is most likely to prove fruitless.", "ko": "실제로 Charles Darwin의 아들인 천문학자 George Darwin의 관점에서는 비록 그것이 효과 없는 것으로 증명될 가능성이 대단히 크더라도 가끔 누군가는 완전히 무모한 실험을 실시해야 한다."}, {"en": "You never know until you try.", "ko": "여러분은 여러분이 시도하기 전까지는 절대 알 수 없다."}]}, {"label": "25년 10월 23번 새 이론이 옛 이론을 대신하려면", "sents": [{"en": "We can discard or replace a scientific theory only if we have a better way of explaining the evidence that supports it.", "ko": "단지 우리가 그것을 뒷받침하는 증거를 설명하는 더 우수한 방법이 있을 때에만 우리는 과학 이론을 폐기하거나 교체할 수 있다."}, {"en": "The theories of Newton and Einstein offer great examples.", "ko": "뉴턴과 아인슈타인의 이론들이 훌륭한 사례들을 제공한다."}, {"en": "A vast body of evidence supports Newton's theory of gravity, but by the late nineteenth century scientists had begun to discover cases where its predictions did not perfectly match observations.", "ko": "방대한 양의 증거가 뉴턴의 중력 이론을 뒷받침해 주지만, 19세기 후반에 이르러 과학자들은 그것의 예측들이 관찰 결과와 완벽하게 일치하지 않는 상황들을 발견하기 시작했다."}, {"en": "These discrepancies were explained only when Einstein developed his general theory of relativity, which was able to match the observations.", "ko": "이러한 불일치들은 아인슈타인이 관찰 결과와 일치할 수 있는 일반 상대성 이론을 개발했을 때에야 비로소 설명되었다."}, {"en": "Still, the many successes of Newton's theory could not be ignored, and Einstein's theory would not have gained acceptance if it had not been able to explain these successes equally well.", "ko": "그럼에도 불구하고, 뉴턴의 이론의 많은 성과는 무시될 수 없었고, 아인슈타인의 이론이 만약 이러한 성과를 똑같이 잘 설명할 수 없었다면 승인을 받지 못했을 것이다."}, {"en": "It did, and that is why we now view Einstein's theory as a broader theory of gravity than Newton's theory.", "ko": "그것은 그렇게 했고, 그것이 우리가 오늘날 아인슈타인의 이론을 뉴턴의 이론보다 더 광범위한 중력 이론으로 보는 이유이다."}, {"en": "Some scientists today are seeking a theory of gravity that will go beyond Einstein's.", "ko": "오늘날 몇몇의 과학자들은 아인슈타인의 이론을 초월할 중력 이론을 탐구하고 있다."}, {"en": "If any new theory ever gains acceptance, it will have to match all the successes of Einstein's theory as well as work in new realms where Einstein's theory does not.", "ko": "만약 어떤 새로운 이론이 언젠가 승인을 받는다면, 그것은 아인슈타인의 이론이 작동하지 않는 새로운 영역에서 작동할 뿐만 아니라 아인슈타인의 이론의 모든 성과에 대응해야 할 것이다."}]}, {"label": "25년 10월 24번 점심시간 뉴로빅 운동", "sents": [{"en": "Imagine pausing in the middle of a busy day, taking a moment to refresh your mind and recharge your energy.", "ko": "분주한 하루의 중간에 잠시 멈춰서, 정신을 새롭게 하고 에너지를 재충전하는 순간을 가지는 것을 상상해 보라."}, {"en": "This power of a midday break is often underestimated.", "ko": "이러한 한낮의 휴식의 힘은 종종 과소평가된다."}, {"en": "When you break away from routine, especially with activities designed to stimulate your brain, you prevent cognitive tiredness and enhance productivity for the rest of the day.", "ko": "여러분이 특히 여러분의 두뇌를 자극하도록 고안된 활동들을 가지고 일상에서 벗어날 때 여러분은 인지적 피로를 방지하고 남은 하루 동안의 생산성을 향상시킨다."}, {"en": "Neurobic exercises — simple yet effective — are perfect for such breaks.", "ko": "간단하지만 효과적인 뉴로빅 운동이 그러한 휴식 시간에 완벽하다."}, {"en": "They target different areas of your brain, keeping it agile and alert.", "ko": "그것들은 여러분의 뇌의 다른 부분들을 목표로 하여, 그것을 기민하고 경계하게 유지한다."}, {"en": "These exercises create a mental oasis that refreshes and prepares you for the afternoon's challenges.", "ko": "이러한 운동들은 오후의 힘든 일들을 위해 여러분을 새롭게 하고 준비시켜 주는 정신적 오아시스를 창조한다."}, {"en": "This strategic pause is not just a break; it boosts your cognitive capabilities, ensuring your mind remains sharp and focused.", "ko": "이 전략적인 멈춤은 단순한 휴식이 아니며, 그것은 여러분의 인지 능력을 증진시키고 여러분의 정신이 또렷하고 집중된 상태가 유지되도록 확실히 한다."}, {"en": "Even briefly experimenting with neurobic exercises can work wonders for your cognitive state during lunch.", "ko": "잠깐 뉴로빅 운동들을 실험하는 것만으로도 점심시간 동안 여러분의 인지 상태에 기적 같은 효과를 낳을 수 있다."}, {"en": "Start with using your non-dominant hand for routine tasks like writing or eating.", "ko": "글쓰기 또는 식사와 같은 일상적인 과업들을 위해 여러분의 주로 쓰지 않는 손을 사용하는 것으로 시작하라."}, {"en": "This simple switch challenges your brain, activating pathways that aren't typically engaged and promoting greater flexibility in thinking.", "ko": "이 간단한 전환이 여러분의 뇌에 도전을 가하여, 전형적으로 사용되지 않는 경로들을 활성화시키고 사고에서의 더 큰 유연성을 장려한다."}]}, {"label": "25년 10월 29번 복제 오류와 자연 선택", "sents": [{"en": "When a cell divides, the genomes of its two daughters are often not quite identical to each other or to that of the parent cell.", "ko": "세포가 분열할 때, 그것의 두 딸세포들의 유전체들은 종종 서로 간에도, 또는 모세포의 그것과도 완전히 동일하지는 않다."}, {"en": "On rare occasions, the error may represent a change for the better; more probably, it will cause no significant difference in the cell's prospects.", "ko": "드물게 그 오류가 더 우수한 것으로의 변화를 나타낼 수도 있지만, 더 높은 확률로 그것은 세포의 전망에 큰 차이를 일으키지 않을 것이다."}, {"en": "But in some cases, the error will cause serious damage: for example, by disrupting the coding sequence for a key protein.", "ko": "그러나 어떤 경우에는 그 오류가 심각한 손상을 야기할 것이다. 예를 들어 핵심 단백질의 코딩 서열을 망가뜨림으로써 그렇게 할 것이다."}, {"en": "Changes due to mistakes of the first type will tend to be perpetuated, because the altered cell has an increased likelihood of reproducing itself.", "ko": "첫 번째 유형의 실수로 인한 변화들은 영속되는 경향이 있을 것인데, 변화가 일어난 세포가 스스로를 복제할 증가한 가능성을 가지고 있기 때문이다."}, {"en": "Changes due to mistakes of the second type—neutral changes—may be perpetuated or not: it is a matter of chance whether the altered cell or its cousins will succeed.", "ko": "두 번째 유형의 실수로 인한 변화들, 즉, '중립적인' 변화들은 영속될 수도 있고 아닐 수도 있다. 변화가 일어난 세포나 그것의 사촌들이 성공할지는 우연의 문제이다."}, {"en": "But changes that cause serious damage lead nowhere: the cell that suffers them dies, leaving no progeny.", "ko": "그러나 심각한 손상을 야기하는 변화들은 어느 곳에도 닿지 못한다. 그것들을 겪는 세포는 죽고, 자손을 남기지 않기 때문이다."}, {"en": "Through endless repetition of this cycle of mutation and natural selection organisms evolve: their genetic specifications change, sometimes giving organisms new ways to exploit the environment more effectively, to survive in competition with others, and to reproduce successfully.", "ko": "이러한 '돌연변이'와 '자연 선택'의 순환의 끊임없는 반복을 통해 유기체들은 진화한다. 그들의 유전적 특성들은 변화해서, 유기체에게 환경을 더 효과적으로 이용하고, 다른 것들과의 경쟁 속에서 살아남으며, 그리고 성공적으로 번식할 수 있는 새로운 방법들을 때로는 제공한다."}]}, {"label": "25년 10월 30번 자유주의와 유교의 가족관", "sents": [{"en": "Within liberal culture, the value of fair equality of opportunity for individuals outweighs the preservation of the family's integrity.", "ko": "자유주의 문화 내에서는, 개인들을 위한 기회의 공정한 평등이라는 가치가 가족의 온전함을 보존하는 것보다 우선된다."}, {"en": "In contrast, for Confucian culture, while seeking fair equality of opportunity for individuals is important, the family assumes a fundamental role in human flourishing, and living within a family institution is considered the essential way of life.", "ko": "이에 반해 유교 문화에서는, 개인들을 위한 기회의 공정한 평등을 추구하는 것이 중요하지만, 가족은 인간의 번영에 있어 기본적인 역할을 담당하며, 가족 제도 안에서 사는 것이 삶의 본질적인 방식으로 간주된다."}, {"en": "Individuals are primarily understood as family members before they are regarded as state citizens.", "ko": "개인들은 국가의 시민으로 여겨지기 전에 우선적으로 가족 구성원으로 이해된다."}, {"en": "Therefore, for Confucians, the family possesses inherent value that should never be abandoned, even if it results in certain societal inequalities.", "ko": "그러므로 유교를 따르는 사람들에게는, 가족은 그것이 어떤 사회적 불평등을 초래할지라도, 결코 포기되어서는 안 되는 내재적인 가치를 보유한다."}, {"en": "Some cultures, like the liberal one, may choose to impose increasing restrictions on the role of families and implement more egalitarian government programs for education, healthcare, and other positive rights in society in the pursuit of fair equality of opportunity.", "ko": "자유주의 문화와 같은 일부 문화들은, 가족의 역할에 점점 더 많은 제한들을 부과하고, 기회의 공정한 평등을 추구하면서 교육, 의료, 그리고 다른 적극적 권리들에 대한 더 평등주의적인 정부 프로그램들을 사회에서 실행하기를 선택할지도 모른다."}, {"en": "On the other hand, other cultures, like the Confucian one, may prefer to primarily assign welfare responsibilities to the family, accepting inequalities stemming from the existence of the family as long as everyone's basic freedoms and rights are safeguarded in the state.", "ko": "반면 유교 문화와 같은 다른 문화들은, 국가에서 모든 사람의 기본적 자유와 권리들이 보장되는 한, 가족의 존재로 인해 발생하는 불평등을 용인하며 복지에 대한 책임을 우선적으로 가족에게 할당하는 것을 선호할지도 모른다."}]}, {"label": "25년 10월 31번 통계는 국가 권위의 기술", "sents": [{"en": "Statistics in the twentieth century became the systematic collection of quantitative information needed by the state.", "ko": "20세기의 통계 자료는 국가가 필요로 하는 정량적인 정보의 체계적인 수집이 되었다."}, {"en": "This process occurred in all the industrialised countries as a key part of their becoming modern states.", "ko": "이러한 과정은 모든 산업 국가에서 그것들이 근대 국가가 되는 것의 핵심적인 부분으로 발생했다."}, {"en": "Desrosières writes: \"It is difficult to think simultaneously that the objects being measured really do exist and that this is only a convention\".", "ko": "Desrosières는 '측정되는 대상들이 실제로 확실히 존재한다는 것과 이것이 단지 하나의 관례라는 것을 동시에 생각하기는 어렵다'라고 기술한다."}, {"en": "Yet this is the case.", "ko": "그러나 이는 사실이다."}, {"en": "Phenomena such as prices being charged and products being sold exist, but the categories and classification frameworks supporting the collection, aggregation, and organisation of official statistics are devised to serve the purposes of the state, for macroeconomic or for social policies.", "ko": "가격이 부과되는 것이나 제품이 판매되는 것과 같은 현상들은 존재하지만, 공식 통계 자료의 수집, 집계, 그리고 조직화를 뒷받침하는 범주들과 분류 체계들은 거시 경제 또는 사회 정책들을 위한 국가의 목적들에 기여하도록 고안된다."}, {"en": "Theodore Porter described the use of statistics to create state authority: \"Quantification is a way of making decisions without seeming to decide\", characterising it as a \"social technology\" intended to build trust in authority.", "ko": "Theodore Porter는 국가의 권위를 창조하기 위한 통계 자료의 사용을, '정량화는 결정하는 것처럼 보이지 않으면서 결정을 내리는 방법'이라고 묘사했고, 그것을 권위에 대한 신뢰를 구축하기 위해 의도된 '사회적 기술'로 특징지었다."}]}, {"label": "25년 10월 32번 쪼개져서 전체를 모르는 인체 연구", "sents": [{"en": "Just as an expert in the taste and colour of wine will gain much by being aware of the chemistry that underlies those qualities, so each perspective on the body can potentially enhance the others.", "ko": "와인의 맛과 색의 전문가가 그러한 특성들의 기저에 있는 화학을 알게 됨으로써 많은 것을 획득하듯이, 마찬가지로 신체에 대한 각각의 관점은 아마도 다른 관점들을 강화시킬지도 모른다."}, {"en": "And yet every scientific tool, from microscopes to mathematics, and every aspect of the body, from the brain to the microorganism, requires such depth of expertise that this tends not to happen: we tend to study the human body in silos, each community sectioned from the others by its own specialised vocabulary.", "ko": "하지만 현미경에서부터 수학에 이르기까지의 모든 과학적 도구와 뇌에서부터 미생물에 이르기까지의 신체의 모든 측면은 너무 깊은 전문 지식을 요구해서 이런 일은 잘 일어나지 않는 경향이 있다. 즉, 우리는 각각의 공동체가 그것 자신의 전문적인 어휘에 의해 나머지 다른 것들과는 구분된 채, 인간의 신체를 개별적으로 분리해서 연구하는 경향이 있다."}, {"en": "Research communities may be dedicated to one type of scientific tool or a specific component of the body, such as one type of cell.", "ko": "연구 공동체는 한 종류의 과학적 도구 또는 한 종류의 세포와 같은 신체의 특정한 한 구성 요소에 집중할지도 모른다."}, {"en": "How different types of cell communicate with one another becomes its own specialist topic.", "ko": "다른 유형의 세포들이 서로 어떻게 소통하는지가 그 자체의 전문적인 주제가 된다."}, {"en": "Even simple forms of life on Earth are now rarely studied as a whole, and the human body is evidently much more complex.", "ko": "심지어 지구상에 있는 단순한 형태의 생명체조차도 이제는 전체로서 탐구되는 경우가 드물며, 인간의 신체는 분명히 훨씬 더 복잡하다."}, {"en": "As long ago as 1890, The Times newspaper commented that knowledge 'had already become too vast to be manageable'.", "ko": "오래전인 1890년에도 'The Times' 신문은 지식이 '이미 너무 방대해져서 다루기 어렵게 되었다'라고 논평했다."}, {"en": "Today, nobody is an expert in the whole of anything.", "ko": "오늘날 아무도 어떤 것의 전체에 대한 전문가가 아니다."}]}, {"label": "25년 10월 33번 유리창으로 권위를 세운 궁전", "sents": [{"en": "Historically, palaces weren't just homes; they were carefully constructed stages designed to impress and intimidate.", "ko": "역사적으로 궁전들은 단순한 거처가 아니었다. 그것들은 깊은 인상을 주고 위협하기 위해 설계된 주의 깊게 건설된 무대들이었다."}, {"en": "While stone symbolized permanence and strength, glass offered something equally powerful: visibility.", "ko": "돌이 영속성과 힘을 상징했던 반면, 유리는 동등하게 강력한 어떤 것, 즉 가시성을 제공했다."}, {"en": "The introduction of large windows in palaces allowed rulers to literally look down upon their subjects, emphasizing their elevated position.", "ko": "궁전에 대형 창문을 도입한 것은 통치자들로 하여금 문자 그대로 자신들의 국민들을 내려다볼 수 있게 해 줬고, 그들의 높은 지위를 강조했다."}, {"en": "Conversely, it also allowed subjects to gaze up at their leaders, creating a sense of awe and distance.", "ko": "반대로 그것은 또한 국민들이 자신들의 통치자를 '위로' 올려다보게 했고, 경외심과 거리감을 만들어 냈다."}, {"en": "Consider the Palace of Versailles: its Hall of Mirrors, lined with reflective surfaces, not only magnified the grandeur of the space but also placed the king at the center of a dazzling display, reinforcing his absolute authority.", "ko": "베르사유 궁전을 고려해 보라. 반사되는 표면들로 일렬로 둘러싸인 그것의 거울의 방은 공간의 웅장함을 증대시켰을 뿐 아니라, 왕을 눈부신 장식의 중심에 두어 그의 절대 권위를 강화했다."}, {"en": "The use of glass in palaces wasn't merely aesthetic; it was strategic.", "ko": "궁전들에서의 유리의 용도는 단순히 미적인 것이 아니었다. 그것은 전략적이었다."}, {"en": "Open sightlines allowed for better surveillance and control, ensuring the safety and security of the ruling family.", "ko": "열린 시야는 더 우수한 감시와 통제를 가능하게 했고, 통치 가문의 안전과 보안을 보장했다."}, {"en": "Courtiers and visitors were constantly aware of being observed, contributing to an atmosphere of careful obedience and respect.", "ko": "신하들과 방문자들은 끊임없이 관찰되고 있는 것을 의식했고, 그것은 조심스러운 복종과 존경의 분위기를 조성했다."}, {"en": "The very architecture dictated social behavior, with glass acting as a silent enforcer of the power dynamic.", "ko": "유리가 권력 역학 관계의 조용한 집행자로서 역할을 하면서 건축물 그 자체가 사회적 행동을 지배했다."}]}, {"label": "25년 10월 36번 염도 차이로 부풀고 쪼그라드는 바다 생물", "sents": [{"en": "Even though sea creatures live in it, they still need to take in water for their bodies to function properly.", "ko": "비록 해양 생물들이 물에 살지만, 그럼에도 그것들은 자신들의 몸이 적절하게 기능하기 위해 물을 흡수할 필요가 있다."}, {"en": "They just need to get rid of any extra salt it might bring with it.", "ko": "다만 그것들은 그것(물)이 함께 가져올 수 있는 여분의 소금을 제거할 필요가 있다."}, {"en": "Salt absorbs water like a sponge.", "ko": "소금은 스펀지처럼 물을 흡수한다."}, {"en": "If you put a tiny mountain of salt on a small plate, then add enough water to the side, making sure an edge touches the salt, the salt will absorb the water.", "ko": "만약 여러분이 작은 접시 위에 조그만 소금 더미를 놓고, 그러고 나서 그 옆에 충분한 물을 부어 가장자리가 소금에 확실히 닿게 하면, 그 소금은 물을 흡수할 것이다."}, {"en": "Now you have a pile of wet salt.", "ko": "이제 여러분은 젖은 소금 더미를 갖게 된다."}, {"en": "Notice that it has increased in size.", "ko": "그것의 부피가 증가한 것에 주목하라."}, {"en": "The same principle applies to sea creatures.", "ko": "동일한 원리가 해양 생물들에게 적용된다."}, {"en": "If the body fluids in a sea animal are saltier than the seawater it lives in, then the extra salt in the creature's body will absorb seawater.", "ko": "만약 어떤 해양 동물의 체액이 그것이 사는 바닷물보다 더 짜다면, 그러면 그 생물의 몸 안의 여분 소금이 바닷물을 흡수할 것이다."}, {"en": "This can cause them to swell up.", "ko": "이것은 그것들이 부풀어 오르게 하는 원인이 될 수 있다."}, {"en": "On the other hand, if the amount of salt in the seawater is higher than the amount of salt in the body fluids of a sea animal, the extra salt in the water will draw fluids out of the creature's body, causing it to dehydrate and shrink.", "ko": "반대로, 만약 바닷물 속 소금의 양이 해양 동물의 체액 안의 소금의 양보다 더 높다면, 바닷물 속의 여분 소금이 생물의 몸으로부터 체액을 빨아내게 되고, 그것이 수분이 빠져 축소되게 하는 원인이 된다."}]}, {"label": "25년 10월 37번 나비와 나방 구별법과 오해", "sents": [{"en": "Distinguishing moths from butterflies on outward appearance is not always easy, but there are a few rules of thumb that can help.", "ko": "외적 생김새로 나비들과 나방들을 구별하는 것이 항상 용이한 일은 아니지만, 도움이 될 수 있는 몇 가지 경험적 방법들이 있다."}, {"en": "In most butterflies the antennae end with a small club-shaped swelling, whereas in moths they are usually feathery or narrow to a fine tip.", "ko": "대부분의 나비들의 경우 더듬이들은 작은 곤봉 모양의 혹으로 끝나는 반면, 나방들의 경우 그것들은 보통 깃털 모양이거나 미세한 끝부분으로 점점 가늘어진다."}, {"en": "Butterflies tend to rest with their wings held shut above their body, whereas moths more usually rest with the upper sides of the wings on full view.", "ko": "나비들은 자신의 날개들이 자신의 몸 위에 닫힌 채 쉬는 경향이 있는 반면, 나방들은 더 흔히 날개들의 윗면이 완전히 노출되는 상태로 쉰다."}, {"en": "Further distinctions can be made by looking for a tiny hook that joins fore- and hindwings, a feature only present in moths.", "ko": "나방들에게만 존재하는 특징인, 앞날개와 뒷날개를 연결해 주는 아주 작은 갈고리를 탐색함으로써 그 이상의 구별들이 가능하다."}, {"en": "The stereotypical differences, with moths cast as the gloomy, nocturnal cousins of colourful sun-loving butterflies, are simply wrong.", "ko": "색이 화려하고 해를 좋아하는 나비들의 우울하고 야행성인 사촌으로 나방들이 묘사되는 정형화된 차이들은 그야말로 잘못된 것이다."}, {"en": "There are many brightly coloured moths and many which are active throughout the day.", "ko": "밝은색을 가진 나방들이 많고 낮 동안 내내 활동적인 나방들이 많이 있다."}, {"en": "Equally, there are a few nocturnal butterflies and plenty that come clothed in shades of brown and grey.", "ko": "마찬가지로, 야행성의 나비들이 몇몇 있고, 갈색과 회색조를 띠는 것들이 많이 있다."}, {"en": "It's more sensible to think of them together: both butterflies and moths are beautiful and fascinating insects.", "ko": "그들을 함께 묶어 생각하는 것이 더 합리적이다. 나비와 나방 둘 다 아름답고 매혹적인 곤충이기 때문이다."}]}, {"label": "25년 10월 38번 야생 생물 관리의 두 방식", "sents": [{"en": "There are numerous ways wildlife is managed, but they all imply stewardship and can be classified into two broad categories: active management and inactive management.", "ko": "야생 생물이 관리되는 수많은 방법들이 있지만, 그것들은 모두 관리 책임을 수반하고 적극적 관리와 소극적 관리라는 두 가지 넓은 범주로 분류될 수 있다."}, {"en": "Active management does something to the population ―such as increasing or decreasing its size ―in a direct manner through strategies like translocations or hunting, respectively.", "ko": "적극적 관리는 거주지 이전이나 사냥과 같은 전략을 통해, 각각 규모를 증가시키거나 감소시키는 것과 같이 무언가를 직접적인 방식으로 개체군에게 실행한다."}, {"en": "Populations can also be actively managed by altering the habitat to the benefit or disadvantage of a population.", "ko": "개체군들은 또한 서식지를 개체군에게 유리하거나 불리하게 변경함으로써 적극적으로 관리될 수 있다."}, {"en": "If population numbers are too low for the goal of management agencies, other active management can be incorporated, such as predator control to minimize neonatal deaths or habitat improvement to provide required cover for neonates from predators.", "ko": "만약 개체 수가 관리 기관들의 목표보다 너무 적으면 갓 태어난 개체의 사망을 최소화하는 포식자 통제나 포식자로부터 갓 태어난 새끼들을 위해 필요한 은신처를 제공하는 서식지 개선과 같은 다른 적극적 관리가 포함될 수 있다."}, {"en": "These efforts represent active approaches to management.", "ko": "이러한 노력들은 관리에 대한 적극적인 접근법을 나타낸다."}, {"en": "Other populations may not be actively managed, like those in national parks.", "ko": "국립 공원들의 개체군들처럼 다른 개체군들은 적극적으로 관리되지 않을지도 모른다."}, {"en": "In such situations, management activities minimize external influences on populations and habitat, which often involves management of humans and not animals.", "ko": "그러한 상황들에서 관리 활동들은 개체군들과 서식지에 대한 외부 영향력을 최소화하는데, 그것은 대체로 동물들이 아닌 인간들에 대한 통제를 포함한다."}]}, {"label": "25년 10월 39번 폐기의 경제와 서비스로서의 제품", "sents": [{"en": "Waste has historically been seen as a necessary driver of the economy.", "ko": "폐기는 역사적으로 경제의 필수적인 추진력으로 여겨져 왔다."}, {"en": "Sales are tied to the amount of a product supplied, which is directly dependent on the demand for that product.", "ko": "판매량은 어떤 제품의 공급량에 연결되고, 그것은 그 제품에 대한 수요량에 직접적으로 의존한다."}, {"en": "Therefore, if you design the product to eventually be wasted, you can ensure that the demand for more products will be sustained.", "ko": "따라서, 만약 여러분이 그 제품을 결국에는 폐기되도록 설계한다면, 여러분은 더 많은 제품에 대한 수요량이 지속될 것을 보장할 수 있다."}, {"en": "Many strategies have been incorporated into product design and use to ensure that waste is inevitable, such as planned obsolescence, limited access to tools for repairs, and use of cheap materials.", "ko": "계획적 노후화, 수리 도구들에 대한 제한된 접근, 그리고 저렴한 자재들의 사용과 같은 많은 전략들은 폐기가 불가피하다는 것을 보장하기 위해서 제품 설계와 사용에 포함되어 왔다."}, {"en": "All these strategies ensure that the consumer will have limited access to the product in use and will eventually require a replacement.", "ko": "이 모든 전략들은 소비자가 사용 중인 제품에 제한된 접근을 하게 될 것이고 결국에는 교체를 필요로 할 것을 보장한다."}, {"en": "Those who supported the idea that waste is necessary to drive demand failed to realize that prioritizing the elimination of waste via repair and remanufacturing creates a different kind of demand: products as a service.", "ko": "폐기가 수요를 촉진하는 데 필수적이라는 생각을 지지했던 사람들은 수리와 재제조를 통해 폐기의 제거를 우선시하는 것이 서비스로서의 상품이라는 다른 종류의 수요를 창출한다는 것을 인식하는 데 실패했다."}, {"en": "Through this setup, companies simply lease out products that were once sold directly to the customer.", "ko": "이러한 구조를 통해 기업들은 한때 소비자에게 직접적으로 판매되었던 제품들을 단순히 임대한다."}, {"en": "With this transition of ownership, companies maintain profit by offering maintenance and repair services and are encouraged to develop long-lasting products.", "ko": "이러한 소유권의 전환으로 기업들은 유지와 수리 서비스들을 제공함으로써 수익을 유지하고 더 오래 지속되는 제품들을 개발하도록 촉진된다."}]}, {"label": "25년 10월 40번 인간이 정한 시간과 지구 자전", "sents": [{"en": "Viewing time as a purchasable and consistent product cemented artificial views on time into our psyche, but every now and again we are forced to acknowledge this mistake.", "ko": "시간을 구매 가능하고 일관된 상품으로 보는 것은 시간에 대한 인위적인 관점을 우리의 정신 속에 고착시켰지만, 때때로 우리는 이러한 실수를 인정하지 않을 수 없다."}, {"en": "On twenty-six occasions in the last fifty years, a second has been added to everyone's day to adjust for the Earth wobbling and the rate of its spin changing.", "ko": "지난 50년 동안 26회에 걸쳐 지구가 흔들리는 것과 그것의 자전 속도가 변하는 것에 맞추기 위해 모든 사람의 하루에 1초가 추가되어 왔다."}, {"en": "For instance, when El Niño, a climatic system in the Pacific, causes wind speed to change dramatically, it can slow the rotation of the Earth slightly.", "ko": "예를 들어 태평양의 한 기후 체계인 엘니뇨가 바람의 속도가 극적으로 바뀌는 것을 유발할 때, 그것은 지구의 자전을 약간 느리게 할 수 있다."}, {"en": "Indeed, the Earth's spin is generally slowing because the moon's gravity is acting as a drag, so days are getting longer by about 1.7 milliseconds per century.", "ko": "실제로 지구의 자전은 일반적으로 둔화되고 있는데 이는 달의 중력이 끌어당기는 힘으로 작용하고 있기 때문이고, 그래서 하루는 한 세기마다 약 1.7밀리세컨드씩 점점 더 길어지고 있다."}, {"en": "Such events disturb the similarity between man-made time and more flexible time based on the Earth's naturally occurring rotation.", "ko": "그러한 사건들은 인간이 만든 시간과 지구의 자연적으로 발생하는 자전에 기반한 더 유연한 시간 사이의 유사성을 방해한다."}, {"en": "When events like this happen, a bunch of humans make the decision to add a small slice of time to your day, without your knowledge.", "ko": "이런 일이 발생할 때, 몇몇 사람들은 여러분도 모르는 사이에 여러분의 하루에 아주 작은 시간 조각을 추가하기로 결정한다."}, {"en": "We try to force our fixed, man-made view of time on nature in the false hope that it will yield.", "ko": "우리는 자연이 굴복할 것이라는 헛된 희망을 지니고 우리의 고정된, 인간이 만든 시간에 대한 관점을 자연에 강요하려고 노력한다."}, {"en": "It doesn't.", "ko": "그러나 자연은 그러지 않는다."}]}], "items": [{"id": "mock_2510_g2:m2510g2-01", "p": 0, "s": 0, "w": "develop", "h": "develop", "pos": "동", "m": "(관계를) 쌓다, 만들어 가다", "form": "", "syn": [["build", "쌓다"], ["form", "형성하다"]], "ant": [["break", "깨다"]], "trap": [["invent", "발명하다", "develop의 흔한 뜻 '개발하다'와 비슷한 말"]], "dis": [["examine", "검사하다"]], "other": [["개발하다", "They developed a new game.", "그들은 새 게임을 개발했다."]], "tip": "develop a relationship(관계를 쌓다) = build a relationship(관계를 쌓다)", "story": "의료 일을 할 때 환자와 탄탄한 관계를 만들어 가는 얘기에서 나온 단어"}, {"id": "mock_2510_g2:m2510g2-02", "p": 0, "s": 0, "w": "solid", "h": "solid", "pos": "형", "m": "탄탄한, 믿음직한", "form": "", "syn": [["strong", "튼튼한"], ["firm", "굳건한"]], "ant": [["shaky", "불안정한"]], "trap": [["hard", "단단한", "solid의 다른 뜻 '단단한'과 같은 말"], ["frozen", "얼어붙은", "solid의 다른 뜻 '고체의'에서 떠올리기 쉬운 말"]], "dis": [], "other": [["고체의, 단단한", "Ice is solid water.", "얼음은 고체 상태의 물이다."]], "tip": "a solid relationship(탄탄한 관계)의 solid는 '고체' 아님", "story": "환자와 흔들리지 않는 직업적 관계를 쌓는 얘기에서 나온 단어"}, {"id": "mock_2510_g2:m2510g2-03", "p": 0, "s": 4, "w": "appropriate", "h": "appropriate", "pos": "형", "m": "적절한", "form": "", "syn": [["suitable", "적절한"], ["proper", "적절한"], ["right", "알맞은"]], "ant": [["improper", "부적절한"]], "trap": [], "dis": [["expensive", "비싼"]], "other": [], "tip": "appropriate(적절한) ↔ inappropriate(부적절한) = improper(부적절한)", "story": "친구에게는 해도 환자에게는 맞지 않는 개인적인 이야기 얘기에서 나온 단어"}, {"id": "mock_2510_  var h='<div class="card"><div class="src">'+esc(D.pass[it.p].label)+'</div><div class="sen" lang="en" translate="no">'+under(s.en,it.w)+'</div>';
 if(q.rev)h+='<div class="ko">'+esc(s.ko)+'</div>';
 h+='<div class="q">밑줄 친 단어와 바꿔 쓸 수 있는 것 모두</div>';
 if(!q.rev){h+='<div class="opts">';q.o.forEach(function(oi){var x=o[oi];h+='<button class="opt'+(q.sel[oi]?' sel':'')+'" lang="en" translate="no" '+(interactive?'onclick="tg('+oi+')"':'')+'>'+esc(x.w)+'</button>'});h+='</div>'}
 return h+'</div>'}
function tg(oi){var q=S.q[S.i];q.sel[oi]=!q.sel[oi];save();(S.mode=='prac'?rPrac:rReal)()}
function save(){if(S.mode=='prac'&&!S.only)sset('prac',S);if(S.mode=='real')sset('real',S);if(S.mode=='exam')sset('exam',S)}
function anySel(q){for(var k in q.sel)if(q.sel[k])return true;return false}
function topBar(t){var n=S.q.length;return '<div class="top"><b>'+t+'</b><span>'+(S.i+1)+' / '+n+'</span><button class="hb" onclick="home()">처음으로</button></div><div class="bar"><i style="width:'+(S.i/n*100)+'%"></i></div>'}
function rPrac(){var q=S.q[S.i],last=S.i>=S.q.length-1,h=topBar(S.only?'틀린 것 다시':'관계 지도 연습');
 if(!q.rev){h+=qCard(q,true)+'<button class="go" '+(anySel(q)?'':'disabled')+' onclick="chk()">확인</button>'}
 else{var ok=isOK(q);h+='<div class="band '+(ok?'ok':'ng')+'">'+(ok?'정답':'오답')+'</div>'+qCard(q,false)+mapCard(q)+'<button class="go" onclick="nxt()">'+(last?'결과 보기':'다음 문제')+'</button>'}
 h+='<button class="go sec" onclick="home()">목록으로</button>';
 $('app').innerHTML=h;window.scrollTo(0,0);if(q.rev)setTimeout(drawAll,30)}
function chk(){var q=S.q[S.i];q.rev=true;var ok=isOK(q);if(S.only){if(ok){q.ok=1}setWrong(q.k,!ok)}else setWrong(q.k,!ok);save();rPrac()}
function nxt(){if(S.i>=S.q.length-1){var ok=S.q.filter(isOK).length,n=S.q.length;if(!S.only)sdel('prac');$('app').innerHTML='<div class="band '+(ok==n?'ok':'ng')+'">'+n+'개 중 '+ok+'개 정답<small>틀린 단어는 "틀린 것만 다시"에 모여 있어요</small></div><button class="go" onclick="home()">목록으로</button>';return}S.i++;save();rPrac()}
/* 관계 지도 */
function chip(x,cls,tag,tc,extra){return '<button class="mw '+cls+'" onclick="speak(\''+x.w.replace(/'/g,"\\'")+'\')"><span class="e" lang="en" translate="no">'+esc(x.w)+'</span>'+(tag?'<i class="'+tc+'">'+tag+'</i>':'')+'<span class="k">'+esc(x.m)+'</span>'+(extra||'')+'</button>'}
function mapCard(q){var it=IT[q.k],o=optsOf(it),st=function(i){var x=o[i],s=!!q.sel[i];if(x.g=='syn')return s?['맞힘','g']:['놓침','b'];return s?['잘못 고름','b']:['',''];};
 var L='',R='',T='',X='';
 o.forEach(function(x,i){var t=st(i),miss=(x.g=='syn'&&!q.sel[i])?' miss':'';
  if(x.g=='syn')L+=chip(x,'l'+miss,t[0],t[1]);
  else if(x.g=='ant')R+=chip(x,'r',t[0]||'반대',t[0]?t[1]:'b');
  else if(x.g=='trap')T+=chip(x,'t',t[0]||'함정',t[0]?t[1]:'m','<span class="tr">'+esc(x.r||'')+'</span>');
  else X+=chip(x,'d',t[0],t[1]);});
 var h='<div class="card"><div class="map"><svg></svg><div class="mc"><b lang="en" translate="no">'+esc(it.h)+'</b><em>본문 뜻: '+esc(it.m)+'</em></div>';
 h+='<div class="cols"><div class="col"><h4>바꿔 쓸 수 있음</h4>'+L+'</div><div class="col"><h4>반대 뜻</h4>'+(R||'<div class="small">없음</div>')+'</div></div></div>';
 if(T||X)h+='<div class="lower">'+(T?'<h4>다른 뜻 함정</h4>'+T:'')+(X?'<h4>관계없음</h4>'+X:'')+'</div>';
 if(it.form)h+='<div class="small" style="margin-top:8px">'+esc(it.w)+' = '+esc(it.form)+'</div>';
 if(it.other&&it.other.length){h+='<div class="oth"><b>'+esc(it.h)+'의 다른 뜻</b>';it.other.forEach(function(x){h+='<div><b style="display:inline;color:#1f2430;font-size:.92rem">'+esc(x[0])+'</b> <span class="ex" lang="en" translate="no">'+esc(x[1])+'</span><div class="ex">'+esc(x[2])+'</div></div>'});h+='</div>'}
 if(it.tip)h+='<div class="tip">'+esc(it.tip)+'</div>';
 if(it.story)h+='<div class="post"><small>본문 기억</small>'+esc(it.story)+'</div>';
 return h+'</div>'}
function drawAll(){[].forEach.call(document.querySelectorAll('.map'),function(map){var svg=map.querySelector('svg'),mc=map.querySelector('.mc'),m=map.getBoundingClientRect();if(!m.width)return;svg.setAttribute('width',m.width);svg.setAttribute('height',m.height);var c=mc.getBoundingClientRect(),sx=c.left-m.left+c.width/2,sy=c.bottom-m.top-2,h='';
 [].forEach.call(map.querySelectorAll('.mw.l,.mw.r'),function(b){var r=b.getBoundingClientRect(),L=b.classList.contains('l'),ex=(L?r.right:r.left)-m.left,ey=r.top-m.top+r.height/2;h+='<path class="'+(L?'ls':'ra')+(b.classList.contains('miss')?' miss':'')+'" d="M'+sx+' '+sy+' Q'+sx+' '+ey+' '+ex+' '+ey+'"/>'});svg.innerHTML=h})}
window.addEventListener('resize',function(){setTimeout(drawAll,50)});
/* 실전 예행연습 / 시험 공통 */
function startReal(){var px=sget('real',null);if(px&&!px.done){S=px}else{S={mode:'real',i:0,q:shuf(IT.map(function(x,i){return i})).map(mk)}}rReal()}
var TM=null;
function startExam(){var ex=sget('exam',null);if(ex&&ex.done){S=ex;showRes();return}if(ex){S=ex}else{var ks=shuf(IT.map(function(x,i){return i})).slice(0,25);S={mode:'exam',i:0,q:ks.map(mk),end:Date.now()+ks.length*20000};save()}rReal();clearInterval(TM);TM=setInterval(tick,500)}
function tick(){if(!S||S.mode!='exam'){clearInterval(TM);return}var r=Math.max(0,Math.round((S.end-Date.now())/1000));var e=$('tm');if(e)e.textContent=Math.floor(r/60)+':'+('0'+r%60).slice(-2);if(r<=0){clearInterval(TM);fin()}}
function rReal(){var q=S.q[S.i],last=S.i>=S.q.length-1,h=topBar(S.mode=='exam'?'시험 <span class="timer" id="tm"></span>':'실전 예행연습');
 h+=qCard(q,true);
 h+='<div style="display:flex;gap:8px">'+(S.i>0?'<button class="go sec" style="flex:1" onclick="mv(-1)">이전</button>':'')+'<button class="go" style="flex:2" onclick="'+(last?'fin()':'mv(1)')+'">'+(last?'제출':'다음')+'</button></div>';
 if(S.mode!='exam')h+='<button class="go sec" onclick="home()">목록으로</button>';
 $('app').innerHTML=h;window.scrollTo(0,0);if(S.mode=='exam')tick()}
function mv(d){S.i+=d;save();rReal()}
function fin(){clearInterval(TM);S.q.forEach(function(q){q.rev=true;setWrong(q.k,!isOK(q))});S.done=1;S.score=S.q.filter(isOK).length;if(S.mode=='real')sdel('real');else save();showRes()}
function showRes(){var n=S.q.length,ok=S.score,bad=S.q.filter(function(q){return !isOK(q)});
 var h='<div class="top"><b>'+(S.mode=='exam'?'시험 결과':'실전 예행연습 결과')+'</b><button class="hb" style="margin-left:auto" onclick="home()">처음으로</button></div>';
 h+='<div class="band '+(ok==n?'ok':'ng')+'">'+n+'개 중 '+ok+'개 정답</div>';
 if(bad.length){h+='<div class="small" style="margin:4px 2px 8px">틀린 단어</div>';bad.forEach(function(q){h+=qCard(q,false)+mapCard(q)})}
 if(bad.length&&S.mode=='real')h+='<button class="go" onclick="startPrac(1)">틀린 것만 다시</button>';
 h+='<button class="go sec" onclick="home()">목록으로</button>';$('app').innerHTML=h;window.scrollTo(0,0);setTimeout(drawAll,30)}
home();
</script></body></html>
