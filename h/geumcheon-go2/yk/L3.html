</style></head><body class="notranslate"><div class="wrap" id="app"></div><script id="data" type="application/json">{"title": "유의어 꽉잡기", "sub": "영어II 3과 · 24단어", "key": "geumcheon-go2:yk:L3", "sec": 0, "pass": [{"label": "3과 ① 집단 결정과 학생 자치회의 고민", "sents": [{"en": "We make many personal choices in our lives, from who to have lunch with to what career to pursue.", "ko": "우리는 누구와 점심을 먹을 것인지부터 어떠한 직업을 추구할 것인지까지 우리의 삶에서 많은 개인적인 선택을 한다."}, {"en": "However, there are many situations where we must make decisions as a group.", "ko": "하지만, 우리가 집단으로서 결정을 내려야 하는 상황들이 많이 있다."}, {"en": "Group decision-making is not as simple as our personal choices, as it involves numerous voices with differing opinions.", "ko": "집단 의사 결정은 다른 의견을 가진 수많은 목소리를 수반하기 때문에 우리의 개인적인 선택들만큼 간단하지 않다."}, {"en": "Voting is often used to make group decisions fairer and more efficient, and various voting methods have been developed over time.", "ko": "투표는 흔히 집단 의사 결정을 더 공정하고 더 효율적으로 만들기 위해 사용되며, 시간이 흐르면서 다양한 투표 방법이 개발되어 왔다."}, {"en": "The following story illustrates how these different voting methods work.", "ko": "다음 이야기는 이러한 다양한 투표 방법이 어떻게 작동하는지 보여준다."}, {"en": "The members of the Greenville High School student council needed to decide how to raise money for children in need.", "ko": "Greenville 고등학교 학생 자치회의 구성원들은 어려움에 처한 아이들을 위해 모금할 방법을 결정해야 했다."}, {"en": "Their three options were an art show, a bake sale, and a charity concert, but there were conflicting opinions.", "ko": "그들의 세 가지 선택지는 미술 전시회, 빵 바자회, 그리고 자선 콘서트였지만, 상충되는 의견들이 있었다."}, {"en": "So they decided to put it to a vote.", "ko": "그래서 그들은 그것을 투표에 부치기로 결정했다."}, {"en": "When they asked for advice from Ms. Akers, the council’s advisor, she encouraged them not to use the familiar voting method, but to try something different instead.", "ko": "그들이 자치회의 고문 교사인 Akers 선생님에게 조언을 구했을 때, 그녀는 익숙한 투표 방법을 사용하지 말고, 대신 다른 것을 시도해 보라고 권장했다."}, {"en": "After doing some research, the council members decided to try three different voting systems: the first-past-the-post (FPTP) method, the alternative vote (AV) method, and the Condorcet method.", "ko": "약간의 조사를 한 후, 자치회 구성원들은 단순 다수결(FPTP) 방식, 대안 투표(AV) 방식, 그리고 콩도르세 방식이라는 세 가지의 다른 투표 시스템을 시도해 보기로 결정했다."}, {"en": "The entire council was curious to find out if the different methods would yield different results.", "ko": "모든 자치회 구성원들은 각각 다른 방법이 서로 다른 결과를 낼지 궁금해했다."}]}, {"label": "3과 ② 투표 당일과 FPTP 방식", "sents": [{"en": "On the day of the vote, each possible event was given a letter: “art show” was represented by the letter A, the letter B indicated “bake sale,” and C stood for “charity concert.”", "ko": "투표 당일, 각각의 가능한 행사에 글자가 하나씩 부여되었다. ‘미술 전시회’는 글자 A로 표시되었고, 글자 B는 ‘빵 바자회’를 나타냈으며, C는 ‘자선 콘서트’를 의미했다."}, {"en": "Each of the 20 council members was given a voting slip and instructed to write down the options in order of preference.", "ko": "20명의 자치회 구성원들 각각은 투표용지를 받았고, 선호하는 순서대로 선택지를 적으라는 지시를 받았다."}, {"en": "For example, if the charity concert was their first choice, followed by the bake sale and the art show, they would write CBA.", "ko": "예를 들어, 자선 콘서트가 첫 번째 선택이고 빵 바자회와 미술 전시회가 뒤따른다면, 그들은 CBA를 적을 것이다."}, {"en": "After every member had voted, the voting slips were counted.", "ko": "모든 구성원이 투표를 마친 후, 투표용지가 집계되었다."}, {"en": "The results were as follows:", "ko": "결과는 다음과 같았다."}, {"en": "The FPTP method is the simplest of the three methods.", "ko": "FPTP 방식은 세 가지 방식 중 가장 간단하다."}, {"en": "Voters are given several options, and whichever gets the most first-preference votes wins.", "ko": "투표자들에게는 여러 가지 선택지가 주어지고, 어떤 것이든 가장 많은 1지망 표를 얻은 것이 이긴다."}, {"en": "Neither the second nor third preference matters at all, so they are ignored.", "ko": "2지망도 3지망도 둘 다 전혀 중요하지 않으므로, 그것들은 무시된다."}, {"en": "This method is commonly used in political elections around the world.", "ko": "이 방식은 전 세계 정치 선거에서 흔히 사용된다."}, {"en": "The student council quickly determined that the winner would be option C, the charity concert.", "ko": "학생 자치회는 빠르게 자선 콘서트인 선택지 C가 승자가 될 것임을 알아냈다."}, {"en": "This was because it received 8 first-preference votes, while option A received 5 and option B received 7.", "ko": "이는 선택지 A가 5표, 선택지 B가 7표를 받은 반면, 그것(C)은 1지망 표 8표를 받았기 때문이었다."}]}, {"label": "3과 ③ FPTP의 약점과 AV 방식", "sents": [{"en": "The FPTP method is uncomplicated and easy to understand, but it has a significant weakness.", "ko": "FPTP 방식은 복잡하지 않고 이해하기 쉽지만, 상당한 약점을 가지고 있다."}, {"en": "It is possible to win a vote without the support of the majority.", "ko": "과반수의 지지 없이도 투표에서 승리하는 것이 가능하다."}, {"en": "That was the case here.", "ko": "이것이 바로 그런 경우였다."}, {"en": "According to the results of the FPTP method, the council’s choice was to hold a charity concert.", "ko": "FPTP 방식의 결과에 따르면, 자치회의 선택은 자선 콘서트를 개최하는 것이었다."}, {"en": "However, only 8 out of 20 council members chose the charity concert as their first preference, which equaled 40% of the total votes.", "ko": "하지만 20명의 자치회 구성원 중 8명만이 1지망으로 자선 콘서트를 골랐는데, 이는 전체 표의 40%에 해당했다."}, {"en": "Next, the council members examined the votes using the AV method, and they soon realized that there would be a different result.", "ko": "다음으로, 자치회 구성원들은 AV 방식을 사용하여 표를 검토했고, 그들은 곧 다른 결과가 나올 것이라는 것을 깨달았다."}, {"en": "The AV method can potentially include more than one round of counting.", "ko": "AV 방식은 잠재적으로 한 차례 이상의 집계를 포함할 수 있다."}, {"en": "For an option to win in the first round, it needs to get more than 50% of the first-preference votes.", "ko": "어떤 선택지가 1차 집계에서 승리하려면, 1지망 표의 50%를 넘게 얻어야 한다."}, {"en": "As the charity concert only received 40% of the total votes, a second round of counting was required.", "ko": "자선 콘서트는 전체 표의 40%만을 받았기 때문에, 2차 집계가 필요했다."}]}, {"label": "3과 ④ AV 결과와 약점", "sents": [{"en": "Option A, the art show, received the fewest first-preference votes, with only 5 council members voting for it.", "ko": "미술 전시회인 선택지 A는 1지망 표를 가장 적게 받았는데, 그것에 투표한 자치회 구성원은 5명뿐이었다."}, {"en": "Therefore, option A was eliminated, and the 5 council members’ votes were redistributed based on their second preferences.", "ko": "따라서 선택지 A는 제거되었고, 5명의 자치회 구성원들의 표가 그들의 두 번째 선호도에 따라 재분배되었다."}, {"en": "As a result, 4 votes for option B (ABC) and 1 for option C (ACB) were added to the total.", "ko": "그 결과, 선택지 B에 4표(ABC), 선택지 C에 1표(ACB)가 합계에 추가되었다."}, {"en": "This meant that option B had 11 total votes, while option C had only 9.", "ko": "이것은 선택지 B가 총 11표를 얻은 반면, 선택지 C는 9표밖에 얻지 못했다는 것을 의미했다."}, {"en": "As a result, the bake sale would be the winner.", "ko": "결과적으로, 빵 바자회가 승자가 될 것이었다."}, {"en": "Unfortunately, the AV method is not perfect either.", "ko": "안타깝게도, AV 방식도 완벽하지는 않다."}, {"en": "It sometimes allows second-preference votes to have a greater influence than first-preference votes.", "ko": "그것은 때때로 2지망 표가 1지망 표보다 더 큰 영향력을 갖게 하기도 한다."}, {"en": "In this case, the bake sale won, but this was mainly due to the second-preference votes it received.", "ko": "이 경우에는 빵 바자회가 승리했지만, 이는 주로 그것이 얻은 2지망 표 때문이었다."}]}, {"label": "3과 ⑤ 콩도르세 방식과 결과", "sents": [{"en": "Finally, the student council counted the votes using the Condorcet method.", "ko": "마지막으로, 학생 자치회는 콩도르세 방식을 사용하여 표를 집계했다."}, {"en": "This method involves comparing the voters’ preferences between each possible pair of options.", "ko": "이 방식은 가능한 선택지 쌍에 대한 투표자들의 선호도를 비교하는 것을 수반한다."}, {"en": "In this case, there were three pairs to consider: A vs. B, B vs. C, and A vs. C.", "ko": "이 경우에는, 고려해야 할 세 쌍이 있었는데, 그것은 바로 A와 B, B와 C, A와 C였다."}, {"en": "Through this method, the student council discovered that its members preferred option A to option B by a count of 11 to 9.", "ko": "이 방식을 통해, 학생 자치회는 구성원들이 11대 9로 선택지 B보다 선택지 A를 더 선호한다는 사실을 알아냈다."}, {"en": "In other words, 11 people preferred A to B, voting either ABC, ACB, or CAB.", "ko": "즉, 11명이 ABC, ACB, CAB 중 하나에 투표하며 B보다 A를 선호했다."}, {"en": "Meanwhile, 9 people preferred B to A by voting BAC, BCA, or CBA.", "ko": "한편, 9명은 BAC, BCA 또는 CBA에 투표함으로써 A보다 B를 선호했다."}, {"en": "Interestingly, the voters preferred option B to option C by the same count of 11 to 9.", "ko": "흥미롭게도, 투표자들은 동일하게 11대 9로 선택지 C보다 선택지 B를 선호했다."}, {"en": "They also preferred option A to option C by 11 to 9.", "ko": "그들은 또한 11대 9로 선택지 C보다 선택지 A를 선호했다."}, {"en": "As option A, the art show, was preferred to both of the other options, it would be considered the winner.", "ko": "미술 전시회인 선택지 A가 나머지 두 선택지보다 더 선호되었으므로, 이 선택지가 승자로 간주될 것이었다."}, {"en": "The Condorcet method’s weakness is that, along with being complex, it sometimes fails to select a winner.", "ko": "콩도르세 방식의 약점은 복잡하다는 것과 더불어 때때로 승자를 가려내지 못한다는 점이다."}, {"en": "This is especially true in elections that contain numerous options.", "ko": "이는 많은 선택지를 포함하는 선거에서 특히 그렇다."}, {"en": "It is possible that no option will be clearly preferred over the others.", "ko": "어떤 선택지도 다른 선택지들보다 명확하게 선호되지 않을 수 있다."}]}, {"label": "3과 ⑥ 승자는 제각각, 더 나은 결정", "sents": [{"en": "Instead of all methods pointing toward a single option and making the council’s choice easier, the winner differed with each method.", "ko": "모든 방식이 하나의 선택지를 가리키고 자치회의 선택을 더 쉽게 만드는 대신, 각 방식마다 승자는 달랐다."}, {"en": "After a long, intense discussion with Ms. Akers, the student council members decided to choose the Condorcet method, as they liked the idea of directly comparing each option with the others.", "ko": "Akers 선생님과의 오랜 열정적인 논의 끝에, 학생 자치회 구성원들은 콩도르세 방식을 선택하기로 결정했는데, 각 선택지를 다른 선택지들과 직접적으로 비교한다는 점이 마음에 들었기 때문이다."}, {"en": "Everyone agreed that they learned a lot about different voting systems through this experience.", "ko": "모두가 이번 경험을 통해 각기 다른 투표 시스템에 대해 많은 것을 배웠다는 것에 동의했다."}, {"en": "It is obvious that choosing an ideal voting method is a complex and challenging task.", "ko": "이상적인 투표 방법을 선택하는 것은 복잡하고 도전적인 일이라는 것은 분명하다."}, {"en": "No voting system is flawless or clearly superior to another.", "ko": "어떤 투표 시스템도 완벽하거나 다른 시스템보다 명백히 우수하지는 않다."}, {"en": "Whichever we choose will have pros and cons.", "ko": "우리가 선택하는 어느 것이든 장단점이 있을 것이다."}, {"en": "Some people believe that it is best to keep the process simple by not ranking our choices at all.", "ko": "어떤 사람들은 우리들의 선택들에 아예 순위를 매기지 않음으로써 과정을 단순하게 유지하는 것이 최선이라고 생각한다."}, {"en": "Others continue to develop and test new ways of voting, arguing that more complex methods deliver more accurate results.", "ko": "다른 사람들은 더 복잡한 방식이 더 정확한 결과를 가져온다고 주장하며 계속해서 새로운 투표 방법을 개발하고 시험한다."}, {"en": "All of these efforts are designed not to make decision-making difficult and inefficient, but to help us make better decisions as a society.", "ko": "이러한 모든 노력은 의사 결정을 어렵고 비효율적으로 만들려는 것이 아니라, 우리가 사회로서 더 나은 결정을 내리도록 돕기 위해 고안된 것이다."}, {"en": "Ultimately, understanding all of the possible voting methods and weighing their pros and cons allows us to better understand the process of decision-making.", "ko": "결국, 모든 가능한 투표 방법을 이해하고 장단점을 따져 보는 것은 우리가 의사 결정 과정을 더 잘 이해할 수 있게 한다."}, {"en": "When we understand decision-making better, we are more likely to become better decision-makers ourselves.", "ko": "우리가 의사 결정을 더 잘 이해할 때, 우리 스스로 더 나은 의사 결정자가 될 가능성이 더 높다."}]}], "items": [{"id": "g2L3-01", "p": 0, "s": 0, "w": "pursue", "h": "pursue", "pos": "동", "m": "(직업·목표를) 추구하다, 해 나가다", "form": "", "syn": [["follow", "따르다, (길을) 가다"], ["seek", "추구하다, 찾다"]], "ant": [["abandon", "버리다, 포기하다"]], "trap": [], "dis": [["borrow", "빌리다"], ["predict", "예측하다"]], "other": [["뒤쫓다, 추적하다", "The police pursued the thief.", "경찰이 도둑을 뒤쫓았다."]], "tip": "pursue a career = follow a career, 경찰 얘기면 '뒤쫓다'", "story": "점심 누구랑 먹을지부터 어떤 직업을 가질지까지 개인의 선택 얘기에서 나온 단어"}, {"id": "g2L3-02", "p": 0, "s": 4, "w": "illustrates", "h": "illustrate", "pos": "동", "m": "(예를 들어) 보여 주다, 설명하다", "form": "동사 illustrate의 3인칭 단수 현재형 (주어 story)", "syn": [["show", "보여 주다"], ["demonstrate", "보여 주다, 입증하다"]], "ant": [["hide", "숨기다"]], "trap": [["draw", "그리다", "illustrate의 다른 뜻 '삽화를 넣다'와 비슷한 말"]], "dis": [["repeat", "반복하다"]], "other": [["삽화를 넣다", "She illustrated the children's book.", "그녀가 그 동화책의 삽화를 그렸다."]], "tip": "illustrate how ~ = show how ~, illustration은 '삽화' 또는 '실례'", "story": "여러 투표 방식이 어떻게 작동하는지 이야기로 보여 주는 도입에서 나온 단어"}, {"id": "g2L3-03", "p": 0, "s": 5, "w": "raise", "h": "raise", "pos": "동", "m": "(돈을) 모으다, 마련하다", "form": "", "syn": [["collect", "모으다"]], "ant":  var h='<h1 lang="ko">'+esc(D.title)+'</h1><div class="sub">'+esc(D.sub)+'</div>';
 h+='<button class="mcard" onclick="startPrac(0)"><b>관계 지도 연습</b><span>'+(pv?('이어서 · '+(pv.i+1)+' / '+pv.q.length):'한 문제씩 풀고 · 바로 지도로 확인')+'</span></button>';
 if(w.length)h+='<button class="chipb" onclick="startPrac(1)">틀린 '+w.length+'개만 다시</button>';
 h+='<button class="mcard" onclick="startReal()"><b>실전 예행연습</b><span>'+(px?('이어서 · '+(px.i+1)+' / '+px.q.length):'시험처럼 한번에 · 틀린 것만 다시')+'</span></button>';
 h+='<button class="mcard" onclick="startExam()"><b>시험</b><span>'+(ex&&ex.done?('응시 완료 · '+ex.score+' / '+ex.q.length):'1회 · 타임어택'+(IT.length>25?' · 25문제':''))+'</span></button>';
 h+='<div class="small" style="margin:14px 4px">'+IT.length+'단어 · 틀린 단어 '+w.length+'개</div>';
 if(ex&&ex.done)h+='<button class="go sec" id="rx" onclick="twoTap(this,resetExam)">시험 기록 지우기</button>';
 $('app').innerHTML=h;window.scrollTo(0,0)}
function twoTap(b,f){if(b.getAttribute('data-a')){f();return}b.setAttribute('data-a',1);b.textContent='한 번 더 누르면 지워져요';setTimeout(function(){if(b){b.removeAttribute('data-a');b.textContent='시험 기록 지우기'}},2500)}
function resetExam(){sdel('exam');home()}
/* 관계 지도 연습 */
function startPrac(only){var pv=sget('prac',null);if(!only&&pv){S=pv;S.mode='prac'}else{var ks=only?shuf(wrongs()):shuf(IT.map(function(x,i){return i}));S={mode:'prac',only:!!only,i:0,q:ks.map(mk)}}rPrac()}
function qCard(q,interactive){var it=IT[q.k],s=sent(it),o=optsOf(it);
 var h='<div class="card"><div class="src">'+esc(D.pass[it.p].label)+'</div><div class="sen" lang="en" translate="no">'+under(s.en,it.w)+'</div>';
 if(q.rev)h+='<div class="ko">'+esc(s.ko)+'</div>';
 h+='<div class="q">밑줄 친 단어와 바꿔 쓸 수 있는 것 모두</div>';
 if(!q.rev){h+='<div class="opts">';q.o.forEach(function(oi){var x=o[oi];h+='<button class="opt'+(q.sel[oi]?' sel':'')+'" lang="en" translate="no" '+(interactive?'onclick="tg('+oi+')"':'')+'>'+esc(x.w)+'</button>'});h+='</div>'}
 return h+'</div>'}
function tg(oi){var q=S.q[S.i];q.sel[oi]=!q.sel[oi];save();(S.mode=='prac'?rPrac:rReal)()}
function save(){if(S.mode=='prac'&&!S.only)sset('prac',S);if(S.mode=='real')sset('real',S);if(S.mode=='exam')sset('exam',S)}
function anySel(q){for(var k in q.sel)if(q.sel[k])return true;return false}
function topBar(t){var n=S.q.length;return '<div class="top"><b>'+t+'</b><span>'+(S.i+1)+' / '+n+'</span><button class="hb" onclick="home()">처음으로</button></div><div class="bar"><i style="width:'+(S.i/n*100)+'%"></i></div>'}
function rPrac(){var q=S.q[S.i],last=S.i>=S.q.length-1,h=topBar(S.only?'틀린 것 다시':'관계 지도 연습');
 if(!q.rev){h+=qCard(q,true)+'<button class="go" '+(anySel(q)?'':'disabled')+' onclick="chk()">확인</button>'}
 else{var ok=isOK(q);h+='<div class="band '+(ok?'ok':'ng')+'">'+(ok?'정답':'오답')+'</div>'+qCard(q,false)+mapCard(q)+'<button class="go" onclick="nxt()">'+(last?'결과 보기':'다음 문제')+'</button>'}
 h+='<button class="go sec" onclick="home()">목록으로</button>';
 $('app').innerHTML=h;window.scrollTo(0,0);if(q.rev)setTimeout(drawAll,30)}
function chk(){var q=S.q[S.i];q.rev=true;var ok=isOK(q);if(S.only){if(ok){q.ok=1}setWrong(q.k,!ok)}else setWrong(q.k,!ok);save();rPrac()}
function nxt(){if(S.i>=S.q.length-1){var ok=S.q.filter(isOK).length,n=S.q.length;if(!S.only)sdel('prac');$('app').innerHTML='<div class="band '+(ok==n?'ok':'ng')+'">'+n+'개 중 '+ok+'개 정답<small>틀린 단어는 "틀린 것만 다시"에 모여 있어요</small></div><button class="go" onclick="home()">목록으로</button>';return}S.i++;save();rPrac()}
/* 관계 지도 */
function chip(x,cls,tag,tc,extra){return '<button class="mw '+cls+'" onclick="speak(\''+x.w.replace(/'/g,"\\'")+'\')"><span class="e" lang="en" translate="no">'+esc(x.w)+'</span>'+(tag?'<i class="'+tc+'">'+tag+'</i>':'')+'<span class="k">'+esc(x.m)+'</span>'+(extra||'')+'</button>'}
function mapCard(q){var it=IT[q.k],o=optsOf(it),st=function(i){var x=o[i],s=!!q.sel[i];if(x.g=='syn')return s?['맞힘','g']:['놓침','b'];return s?['잘못 고름','b']:['',''];};
 var L='',R='',T='',X='';
 o.forEach(function(x,i){var t=st(i),miss=(x.g=='syn'&&!q.sel[i])?' miss':'';
  if(x.g=='syn')L+=chip(x,'l'+miss,t[0],t[1]);
  else if(x.g=='ant')R+=chip(x,'r',t[0]||'반대',t[0]?t[1]:'b');
  else if(x.g=='trap')T+=chip(x,'t',t[0]||'함정',t[0]?t[1]:'m','<span class="tr">'+esc(x.r||'')+'</span>');
  else X+=chip(x,'d',t[0],t[1]);});
 var h='<div class="card"><div class="map"><svg></svg><div class="mc"><b lang="en" translate="no">'+esc(it.h)+'</b><em>본문 뜻: '+esc(it.m)+'</em></div>';
 h+='<div class="cols"><div class="col"><h4>바꿔 쓸 수 있음</h4>'+L+'</div><div class="col"><h4>반대 뜻</h4>'+(R||'<div class="small">없음</div>')+'</div></div></div>';
 if(T||X)h+='<div class="lower">'+(T?'<h4>다른 뜻 함정</h4>'+T:'')+(X?'<h4>관계없음</h4>'+X:'')+'</div>';
 if(it.form)h+='<div class="small" style="margin-top:8px">'+esc(it.w)+' = '+esc(it.form)+'</div>';
 if(it.other&&it.other.length){h+='<div class="oth"><b>'+esc(it.h)+'의 다른 뜻</b>';it.other.forEach(function(x){h+='<div><b style="display:inline;color:#1f2430;font-size:.92rem">'+esc(x[0])+'</b> <span class="ex" lang="en" translate="no">'+esc(x[1])+'</span><div class="ex">'+esc(x[2])+'</div></div>'});h+='</div>'}
 if(it.tip)h+='<div class="tip">'+esc(it.tip)+'</div>';
 if(it.story)h+='<div class="post"><small>본문 기억</small>'+esc(it.story)+'</div>';
 return h+'</div>'}
function drawAll(){[].forEach.call(document.querySelectorAll('.map'),function(map){var svg=map.querySelector('svg'),mc=map.querySelector('.mc'),m=map.getBoundingClientRect();if(!m.width)return;svg.setAttribute('width',m.width);svg.setAttribute('height',m.height);var c=mc.getBoundingClientRect(),sx=c.left-m.left+c.width/2,sy=c.bottom-m.top-2,h='';
 [].forEach.call(map.querySelectorAll('.mw.l,.mw.r'),function(b){var r=b.getBoundingClientRect(),L=b.classList.contains('l'),ex=(L?r.right:r.left)-m.left,ey=r.top-m.top+r.height/2;h+='<path class="'+(L?'ls':'ra')+(b.classList.contains('miss')?' miss':'')+'" d="M'+sx+' '+sy+' Q'+sx+' '+ey+' '+ex+' '+ey+'"/>'});svg.innerHTML=h})}
window.addEventListener('resize',function(){setTimeout(drawAll,50)});
/* 실전 예행연습 / 시험 공통 */
function startReal(){var px=sget('real',null);if(px&&!px.done){S=px}else{S={mode:'real',i:0,q:shuf(IT.map(function(x,i){return i})).map(mk)}}rReal()}
var TM=null;
function startExam(){var ex=sget('exam',null);if(ex&&ex.done){S=ex;showRes();return}if(ex){S=ex}else{var ks=shuf(IT.map(function(x,i){return i})).slice(0,25);S={mode:'exam',i:0,q:ks.map(mk),end:Date.now()+ks.length*20000};save()}rReal();clearInterval(TM);TM=setInterval(tick,500)}
function tick(){if(!S||S.mode!='exam'){clearInterval(TM);return}var r=Math.max(0,Math.round((S.end-Date.now())/1000));var e=$('tm');if(e)e.textContent=Math.floor(r/60)+':'+('0'+r%60).slice(-2);if(r<=0){clearInterval(TM);fin()}}
function rReal(){var q=S.q[S.i],last=S.i>=S.q.length-1,h=topBar(S.mode=='exam'?'시험 <span class="timer" id="tm"></span>':'실전 예행연습');
 h+=qCard(q,true);
 h+='<div style="display:flex;gap:8px">'+(S.i>0?'<button class="go sec" style="flex:1" onclick="mv(-1)">이전</button>':'')+'<button class="go" style="flex:2" onclick="'+(last?'fin()':'mv(1)')+'">'+(last?'제출':'다음')+'</button></div>';
 if(S.mode!='exam')h+='<button class="go sec" onclick="home()">목록으로</button>';
 $('app').innerHTML=h;window.scrollTo(0,0);if(S.mode=='exam')tick()}
function mv(d){S.i+=d;save();rReal()}
function fin(){clearInterval(TM);S.q.forEach(function(q){q.rev=true;setWrong(q.k,!isOK(q))});S.done=1;S.score=S.q.filter(isOK).length;if(S.mode=='real')sdel('real');else save();showRes()}
function showRes(){var n=S.q.length,ok=S.score,bad=S.q.filter(function(q){return !isOK(q)});
 var h='<div class="top"><b>'+(S.mode=='exam'?'시험 결과':'실전 예행연습 결과')+'</b><button class="hb" style="margin-left:auto" onclick="home()">처음으로</button></div>';
 h+='<div class="band '+(ok==n?'ok':'ng')+'">'+n+'개 중 '+ok+'개 정답</div>';
 if(bad.length){h+='<div class="small" style="margin:4px 2px 8px">틀린 단어</div>';bad.forEach(function(q){h+=qCard(q,false)+mapCard(q)})}
 if(bad.length&&S.mode=='real')h+='<button class="go" onclick="startPrac(1)">틀린 것만 다시</button>';
 h+='<button class="go sec" onclick="home()">목록으로</button>';$('app').innerHTML=h;window.scrollTo(0,0);setTimeout(drawAll,30)}
home();
</script><a href="../index.html" style="position:fixed;right:12px;bottom:12px;z-index:9999;background:#1d4ed8;color:#fff;font:700 13px/1 sans-serif;padding:11px 14px;border-radius:22px;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.3)">⌂ 목록</a></body></html>
