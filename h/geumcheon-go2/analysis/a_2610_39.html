<script>
var CAT={g:"어휘",o:"대명사",b:"연결어",k:"핵심 문장",p:"구문"};
var P={"num": "39", "sub": "고2 · 사회사학자가 기록을 읽는 법", "one": "평범한 사람들은 기록을 거의 남기지 못했기 때문에, 사회사학자들은 엘리트가 만든 자료를 액면 그대로 믿지 않고 ‘결을 거슬러’ 읽어 그 속에 숨은 보통 사람들의 모습을 찾아낸다는 것", "flow": [{"label": "도입부", "range": "1~2번", "sum": "사회사학자도 다양한 원자료를 쓰지만, 엘리트보다 평범한 사람들에게 초점을 맞춤 <small>(ordinary people rather than elites)</small>", "eg": "왕의 일기보다 시장 상인의 하루가 궁금한 역사"}, {"label": "본론 (1) 문제", "range": "3~4번", "sum": "비엘리트는 교육을 받지 못해 기록을 많이 남기지 못했고, 남긴 기록도 기록 보관소에 거의 보존되지 못함 <small>(lacked access to education / rarely ended up in archives)</small>", "eg": "학생들이 쓴 쪽지는 다 버려지고 학교 공문만 서류철에 남는 것"}, {"label": "본론 (2)", "range": "5번", "sum": "이런 기록의 편향 때문에 사회사학자는 매우 창의적이어야 함 <small>(biases / very creative)</small>", "eg": "단서가 적은 사건일수록 탐정이 더 기발한 방법을 찾아야 하는 것"}, {"label": "본론 (3) 해결책", "range": "6~7번", "sum": "정부 관료·고용주 같은 엘리트가 만든 문서를 분석하되, 액면 그대로 받아들이지 않고 ‘결을 거슬러’ 읽음 <small>(against the grain)</small>", "eg": "담임 선생님의 학급 일지에서 적혀 있지 않은 학생들 사정까지 읽어 내는 것"}, {"label": "결론 예시", "range": "8번", "sum": "노예 소유주의 법적 문서에서 ‘사실’뿐 아니라 침묵·단절·소문까지 살펴 노예가 된 사람들의 태도와 행동을 알아냄 <small>(silences, interruptions, rumors)</small>", "eg": "친구가 말하다 멈춘 부분에서 오히려 진짜 속마음을 짐작하는 것"}], "sents": [{"n": 1, "mk": "[1|Like] all historians, [2|social historians] [3|draw from] a variety of [4|primary sources].", "ko": "모든 역사학자들과 마찬가지로, 사회사학자들은 다양한 원자료들을 가져와 쓴다."}, {"n": 2, "mk": "[5|Social history] often [6|emphasizes] [7|ordinary people rather than elites].", "ko": "사회사는 대개 엘리트들보다 평범한 사람들을 강조한다."}, {"n": 3, "mk": "[8|Yet], in most places and times, [9|non-elites] [10|lacked access to] education and, [11|thus], did not produce [12|substantial amounts of documentation].", "ko": "하지만, 대부분의 지역들과 시대들에서, 엘리트가 아닌 사람들은 교육에 대한 접근 기회가 부족했고, 따라서, 풍부한 양의 문서로 된 기록을 생산하지 못했다."}, {"n": 4, "mk": "[13|Even when] they [14|did produce] documentation, [15|these materials] [16|rarely ended up in] [17|archives where] they could be preserved and [18|made available] to researchers.", "ko": "심지어 그들이 문서로 된 기록을 정말로 생산했을 때조차도, 이러한 자료들은 그것들이 보존될 수 있고 연구자들에게 이용 가능해질 수 있는 기록 보관소들에 거의 다다르지 못했다.", "star": true}, {"n": 5, "mk": "[19|Because of] [20|such biases in the historical record], social historians have to be [21|very creative] in their work.", "ko": "역사적 기록에서의 그러한 편향들 때문에, 사회사학자들은 자신들의 작업에 있어서 매우 창의적이어야 한다.", "star": true}, {"n": 6, "mk": "[22|Like other historians], social historians analyze [23|textual sources] [24|produced by] [25|government officials], employers, and other elites.", "ko": "다른 역사학자들처럼 사회사학자들은 정부 관료들, 고용주들, 그리고 다른 엘리트들에 의해 생산된 텍스트 자료를 분석한다."}, {"n": 7, "mk": "[26|Yet] [27|rather than simply take] [28|such sources] [29|at face value], they read them [30|“against the grain”].", "ko": "하지만 그러한 자료들을 단순히 액면 그대로 받아들이기보다 그들은 그것들을 ‘일반적인 방식과 다르게’ 해석한다.", "star": true}, {"n": 8, "mk": "[31|So, for example,] a social historian will read legal documents [32|not only for] [33|the “facts”] [34|provided by] slaveowners; [35|she] will also examine the [36|silences, interruptions, rumors], and other details [37|that offer hints about] the [38|enslaved] peoples’ attitudes and actions.", "ko": "그래서, 예를 들어, 어떤 사회사학자는 법적 문서들을 노예 소유주들에 의해 제공된 ‘사실들’을 얻기 위해 읽을 뿐만 아니라, 그녀는 또한 노예가 된 사람들의 태도들과 행동들에 대한 힌트들을 제공하는 공백들, 단절들, 소문들, 그리고 다른 세부 사항들을 조사할 것이다.", "star": true}], "items": {"1": {"c": "p", "t": "전치사 like : ~처럼, ~와 마찬가지로", "n": ["Like + 명사 = ~처럼, ~와 마찬가지로", "(동사) like = 좋아하다", "6번 Like other historians와 반복"], "x": ["Like all historians는 ‘모든 역사학자들과 마찬가지로’라는 뜻이다.", "여기서 like는 뒤에 명사 all historians가 오는 전치사이다.", "사회사학자도 다른 역사학자와 같은 점이 있다는 공통점부터 말하고, 2번부터 차이점으로 넘어간다."]}, "2": {"c": "g", "t": "social historian : 사회사학자", "n": ["social history = 사회사 (보통 사람들의 생활사)", "historian = 역사학자", "history = 역사"], "x": ["social historians는 ‘사회사학자들’이라는 뜻이다.", "왕이나 전쟁보다 평범한 사람들의 생활과 사회를 연구하는 역사학자이다."]}, "3": {"c": "g", "t": "draw from ~ : ~에서 끌어오다, 가져다 쓰다", "n": ["draw from ~ = ~에서 (자료·힘을) 끌어내다", "(다의어) draw = 그리다, 당기다, 끌어내다"], "x": ["social historians draw from a variety of primary sources는 ‘사회사학자들은 다양한 원자료를 가져다 쓴다’라는 뜻이다.", "draw는 ‘그리다’가 아니라 ‘끌어오다’라는 뜻으로 쓰였다."]}, "4": {"c": "g", "t": "primary source : 원자료, 1차 사료", "n": ["primary source = 그 시대에 직접 만들어진 자료 (편지, 일기, 법원 기록)", "(반의) secondary source = 2차 자료 (후대의 연구서)", "(다의어) primary = 주요한, 최초의"], "x": ["a variety of primary sources는 ‘다양한 원자료들’이라는 뜻이다.", "primary를 ‘주요한’으로만 외우면 이 글의 맥락을 놓친다. 여기서는 ‘처음 만들어진, 원래의’라는 뜻이다.", "이 원자료가 누가 만든 것이냐가 3~4번의 문제로 이어진다."]}, "5": {"c": "k", "t": "사회사의 초점 : 엘리트가 아닌 보통 사람", "n": ["Social history = 사회사", "emphasize = 강조하다", "사회사 = 평범한 사람들의 역사"], "x": ["Social history often emphasizes ordinary people rather than elites는 ‘사회사는 대개 엘리트보다 평범한 사람들을 강조한다’라는 뜻이다.", "1번의 공통점에 이어, 사회사만의 특징을 보여 주는 문장이다.", "이 특징 때문에 3번에서 ‘보통 사람들은 기록이 적다’는 문제가 생긴다."], "e": "쉬운 예시 : 조선 시대 왕의 업적보다 그 시대 농부들이 무엇을 먹고 어떻게 살았는지를 궁금해하는 연구이다."}, "6": {"c": "g", "t": "emphasize : 강조하다, 중시하다", "n": ["emphasize = 강조하다 (같은 뜻 highlight, stress)", "emphasis = 강조 (명사)", "(반의) overlook = 간과하다"], "x": ["emphasizes ordinary people은 ‘평범한 사람들을 중시한다’라는 뜻이다.", "주어 Social history가 단수이므로 emphasizes에 -s가 붙었다."]}, "7": {"c": "p", "t": "A rather than B : B보다는 A", "n": ["A rather than B = B라기보다는 A", "ordinary people = 평범한 사람들 / elites = 엘리트, 지배층", "A와 B는 같은 형태(명사)로 대등"], "x": ["ordinary people rather than elites는 ‘엘리트들보다는 평범한 사람들’이라는 뜻이다.", "rather than 앞뒤로 같은 품사(명사)가 대등하게 연결된 병렬 구조이다.", "7번에서는 rather than 뒤에 동사원형 take가 오는 형태로 다시 나온다."]}, "8": {"c": "b", "t": "Yet : 하지만 (문제 제기)", "n": ["Yet = 하지만, 그러나", "사회사는 보통 사람 중시 ↔ 보통 사람은 기록이 적음"], "x": ["Yet은 ‘하지만’이라는 뜻으로, 2번의 목표와 충돌하는 현실 문제를 꺼낸다.", "평범한 사람을 연구하고 싶은데 정작 그들의 기록이 없다는 것이 이 글의 갈등이다."]}, "9": {"c": "g", "t": "non-elite : 엘리트가 아닌 사람", "n": ["non- = ~이 아닌 (부정 접두사)", "non-elites = ordinary people", "elite = 엘리트, 지배층"], "x": ["non-elites는 ‘엘리트가 아닌 사람들’로, 2번의 ordinary people을 다른 말로 표현한 것이다."]}, "10": {"c": "p", "t": "lack + 목적어 / access to ~ : ~에 대한 접근 기회", "n": ["lack A = A가 부족하다 (전치사 없이 바로 목적어)", "be lacking in A = A가 부족하다", "access to ~ = ~에 대한 접근, 이용 기회"], "x": ["non-elites lacked access to education은 ‘엘리트가 아닌 사람들은 교육에 대한 접근 기회가 부족했다’라는 뜻이다.", "
