<style>

<script>
var CAT={g:"어휘",o:"대명사",b:"연결어",k:"핵심 문장",p:"구문"};
var P={"num": "36", "sub": "고2 · 사용성 테스트로 디자인 개선하기", "one": "디자이너는 사용자가 아니므로, 실제 사용자가 직접 써 보게 하는 사용성 테스트로 디자인의 문제를 찾아 고쳐 나가야 한다는 것", "flow": [{"label": "도입부 = 전제", "range": "1번", "sum": "더 효과적인 제품을 만들려면 디자이너는 ‘우리는 사용자가 아니다’라는 단순한 진리부터 받아들여야 함 <small>(we are not the user)</small>", "eg": "내가 낸 퀴즈 문제는 답을 아는 나에게만 쉬워 보이는 것"}, {"label": "본론 (1)", "range": "2~3번", "sum": "만든 사람은 제품에 너무 가까워 객관적으로 보지 못하고, 가장 좋은 인터페이스는 실제 사용자 관찰로 다듬어진 것 <small>(much too close / observations of real users)</small>", "eg": "내가 쓴 글의 오타는 안 보이다가 친구가 읽어 주면 바로 보이는 것"}, {"label": "본론 (2)", "range": "4~5번", "sum": "그렇다면 어떻게 더 효과적으로 만들까 하는 질문과 그 답인 사용성 테스트 <small>(usability testing)</small>", "eg": "새로 만든 보드게임을 친구들에게 먼저 해 보게 하는 것"}, {"label": "본론 (3)", "range": "6~7번", "sum": "실제와 같은 활동을 시켜 문제·가능성·사용자의 행동과 선호를 알아내고, 실제 사용자 손에서 얼마나 잘 작동할지 이해하는 방법 <small>(uncover problems / in the hands of real users)</small>", "eg": "친구가 규칙 설명서를 보고도 헤매는 모습을 보고 어디가 어려운지 알게 됨"}, {"label": "결론", "range": "8번", "sum": "대표 사용자에게서 얻은 결과를 바탕으로 수정을 거듭해 작업을 개선 <small>(subsequent revisions)</small>", "eg": "친구들 반응을 듣고 게임 규칙을 몇 번이고 고쳐 다시 내놓음"}], "sents": [{"n": 1, "mk": "A simple truth [1|that designers must embrace] [2|in order to create] more [3|effective] products and experiences is [4|the fact that] [5|we are not the user].", "ko": "디자이너들이 더 효과적인 제품과 경험을 만들어 내기 위해 수용해야만 하는 단순한 진리는 우리가 ‘사용자가 아니라’는 사실이다.", "star": true}, {"n": 2, "mk": "We're [6|much too] close to [7|what we build] to [8|objectively] see [9|it] and understand [10|how users will interact with it].", "ko": "우리는 우리가 만드는 것에 너무 가까워서 그것을 객관적으로 보고 사용자들이 그것과 어떻게 상호 작용할지 이해할 수 없다."}, {"n": 3, "mk": "The best [11|user interfaces] are [12|those that have been shaped] by [13|observations] of real users and [14|their interactions with them].", "ko": "가장 좋은 사용자 인터페이스들은 실제 사용자들과 그들의 그것들과의 상호 작용에 대한 관찰 결과들에 의해 만들어져 온 것들이다."}, {"n": 4, "mk": "[15|So] how can designers [16|shape] their work [17|to be more effective]?", "ko": "그러면 디자이너들은 어떻게 자신의 작업이 더 효과적일 수 있도록 만들 수 있을까?"}, {"n": 5, "mk": "An [18|incredibly] effective way [19|is with] [20|usability testing].", "ko": "한 가지 엄청나게 효과적인 방법은 사용성 테스트를 가지고 하는 것이다.", "star": true}, {"n": 6, "mk": "The goal of [21|this method] is [22|to uncover] problems in a design, discover [23|existing opportunities], and learn more about the behaviors and preferences of users [24|by asking participants to engage in] [25|realistic] activities.", "ko": "이 방법의 목표는 참가자들이 실제적인 활동들에 참여하도록 요청함으로써 디자인상의 문제들을 밝혀 내고, 현재 있는 가능성들을 발견하고, 사용자들의 행동들과 선호하는 것들에 대해 더 많이 학습하는 것이다."}, {"n": 7, "mk": "[26|This technique] is effective for understanding [27|how well a design will perform] [28|once] it is [29|in the hands of real users].", "ko": "이 기술은 디자인이 실제 사용자들의 손 안에 있을 때 얼마나 그것이 잘 작동할 것인지를 이해하는 데 효과적이다.", "star": true}, {"n": 8, "mk": "Designers can use this method [30|to improve] their work through [31|subsequent revisions] [32|based on] the [33|findings] from [34|representative] users.", "ko": "디자이너들은 대표적인 사용자들로부터 발견한 것들에 기반한 차후의 수정들을 통해 그들의 작업물을 개선하기 위해 이 방법을 사용할 수 있다."}], "items": {"1": {"c": "p", "t": "목적격 관계대명사 that : 앞의 A simple truth를 꾸밈", "n": ["A simple truth that designers must embrace = 디자이너들이 받아들여야 하는 단순한 진리", "embrace = 받아들이다, 수용하다 (다의어: 껴안다)", "that 뒤에 embrace의 목적어가 빠짐"], "x": ["that designers must embrace는 ‘디자이너들이 반드시 받아들여야 하는’이라는 뜻으로 A simple truth를 꾸민다.", "embrace 뒤에 목적어가 없으므로 이 that은 목적격 관계대명사이다.", "문장의 주어는 A simple truth ~ experiences까지이고, 동사는 is이다."]}, "2": {"c": "p", "t": "in order to V : ~하기 위해 (목적)", "n": ["in order to V = so as to V = ~하기 위해", "create = 만들어 내다", "products and experiences = 제품과 경험"], "x": ["in order to create more effective products and experiences는 ‘더 효과적인 제품과 경험을 만들어 내기 위해’라는 뜻이다.", "목적을 분명하게 드러낼 때 to 앞에 in order를 붙인다.", "이 목적의 to부정사구까지 주어에 붙어 길어졌으므로, 동사 is를 찾아 뼈대를 잡는 것이 중요하다."]}, "3": {"c": "g", "t": "effective : 효과적인", "n": ["effective = 효과적인", "effectively = 효과적으로 / effect = 효과", "(반의) ineffective = 효과 없는"], "x": ["more effective products는 ‘더 효과적인 제품’이라는 뜻이다.", "effective는 이 글 전체에 반복되는
