<script>
var CAT={g:"어휘",o:"대명사",b:"연결어",k:"핵심 문장",p:"구문"};
var P={"num": "38", "sub": "고2 · 용도에 따라 다른 수질 기준", "one": "물이 깨끗하다는 것은 겉모습이 아니라 정해진 기준을 따르는 것이며, 물은 쓰임새가 다양하므로 용도에 따라 서로 다른 안전 허용치가 정해진다는 것", "flow": [{"label": "도입부", "range": "1~2번", "sum": "‘깨끗한 물’은 마실 물처럼 보이는 물이 아니라 일정한 기준, 곧 지표를 따르는 물 <small>(criteria, benchmarks)</small>", "eg": "맑아 보이는 계곡물도 그냥 마시면 배탈이 날 수 있음"}, {"label": "본론 (1)", "range": "3~4번", "sum": "기준은 물속에 물리적·화학적·생물학적 물질이 얼마나 있어도 되는지 알려 주고, 마시기·농사·산업용 보일러 등 어떤 용도든 물이 안전하도록 보장 <small>(guidelines / ensure)</small>", "eg": "과자 봉지에 ‘이 성분은 이만큼까지만’이라고 정해진 기준이 있는 것"}, {"label": "요지", "range": "5번", "sum": "물을 아주 다양하게 쓰기 때문에 모두에게 똑같은 ‘일률적인’ 규칙은 쓸 수 없음 <small>(one size fits all)</small>", "eg": "‘프리사이즈’ 옷이 모든 사람에게 꼭 맞지는 않는 것"}, {"label": "본론 (2) 예시", "range": "6번", "sum": "발전기를 식히는 물은 주방 수돗물만큼 깨끗할 필요가 없음 <small>(doesn’t need to be as clean as)</small>", "eg": "걸레를 빠는 물을 마시는 물만큼 까다롭게 고르지 않는 것"}, {"label": "결론", "range": "7번", "sum": "그래서 물이 어떻게 쓰일지에 따라 각기 다른 안전 허용치를 정함 <small>(different safety limits)</small>", "eg": "어항 물과 마시는 물을 서로 다른 기준으로 관리하는 것"}], "sents": [{"n": 1, "mk": "[1|When we say that water is “clean,”] we [2|don’t just mean] that [3|it] [4|looks like a glass of water].", "ko": "우리가 물이 ‘깨끗하다’라고 말할 때, 우리는 단지 그것이 마실 물 한 잔처럼 보인다는 것을 의미하지는 않는다."}, {"n": 2, "mk": "[5|Water quality] [6|is about following] a certain set of [7|criteria], [8|or] “[9|benchmarks].”", "ko": "수질은 특정한 기준들의 집합, 즉 ‘지표들’을 따르는 것에 관한 것이다."}, {"n": 3, "mk": "[10|These guidelines] [11|inform us] [12|exactly how much] [13|physical, chemical, or biological stuff] can be in the water.", "ko": "이러한 지침들은 우리에게 정확히 얼마나 많은 물리적, 화학적, 혹은 생물학적인 것들이 물 안에 있을 수 있는지를 알려 준다."}, {"n": 4, "mk": "[14|These rules] [15|ensure the water is safe] for [16|anything we want to do with it], [17|whether that’s drinking it at home], watering crops on a farm, or [18|running it through] a huge industrial boiler.", "ko": "이러한 규칙들은 우리가 물로 하고 싶은 것이 집에서 물을 마시는 것이든, 농장에서 작물들에 물을 주는 것이든, 혹은 거대한 산업용 보일러를 통해 물을 흘려보내는 것이든 간에 그것에서 그 물이 안전하다고 보장한다."}, {"n": 5, "mk": "We can’t [19|utilize] the same [20|“one size fits all” rule] for everyone [21|because] we use water for so many [22|diverse] things.", "ko": "우리가 물을 아주 많은 다양한 일에 사용하기 때문에 우리는 동일한 ‘일률적인’ 규칙을 모두에게 활용할 수 없다.", "star": true}, {"n": 6, "mk": "[23|For instance], the water [24|that cools down] a huge power plant generator [25|doesn’t need to be as clean as] [26|the water you drink] from the [27|kitchen tap].", "ko": "예를 들어, 거대한 발전소의 발전기를 식히는 물은 여러분이 주방 수도꼭지로부터 마시는 물만큼 깨끗할 필요가 없다.", "star": true}, {"n": 7, "mk": "[28|This is why] groups set different [29|“safety limits”] for the water [30|dependent on] [31|how it will be utilized].", "ko": "이것이 물이 어떻게 활용될지에 따라 집단들이 그것에 대한 각기 다른 ‘안전 허용치’를 설정하는 이유이다.", "star": true}], "items": {"1": {"c": "k", "t": "도입 : 우리가 말하는 ‘깨끗한 물’의 진짜 뜻", "n": ["“clean” = 따옴표로 단어의 뜻을 따져 봄", "When we say ~ = 우리가 ~라고 말할 때", "흔한 생각(겉보기)을 먼저 꺼냄"], "x": ["When we say that water is “clean,”은 ‘우리가 물이 깨끗하다라고 말할 때’라는 뜻이다.", "clean에 따옴표를 쳐서, 우리가 쉽게 쓰는 이 말이 실제로 무엇을 뜻하는지 따져 보겠다는 신호이다.", "이 글은 겉보기 기준 → 과학적 기준 → 용도별 기준으로 생각을 넓혀 간다."]}, "2": {"c": "p", "t": "부분부정 : not just ~ = 단지 ~만은 아니다", "n": ["don’t just mean that ~ = 단지 ~라는 뜻만은 아니다", "not just = not only = not merely", "겉보기 말고 다른 기준이 있음을 암시"], "x": ["we don’t just mean that ~은 ‘우리는 단지 ~라는 것을 뜻하지는 않는다’라는 뜻이다.", "‘전혀 아니다’가 아니라 ‘그것만은 아니다’라는 부분부정이다.", "그 ‘다른 기준’이 바로 2번의 criteria이다."]}, "3": {"c": "o", "t": "it = water (물)", "n": ["it = water"], "x": ["it looks like ~의 it은 앞의 water를 가리킨다."]}, "4": {"c": "p", "t": "look like + 명사 : ~처럼 보이다", "n": ["look like + 명사 = ~처럼 보이다", "look + 형용사 = ~하게 보이다", "a glass of water = 물 한 잔 (마실 물)"], "x": ["it looks like a glass of water는 ‘그것이 마실 물 한 잔처럼 보인다’라는 뜻이다.", "뒤에 명사 a glass of water가 오므로 look 뒤에 전치사 like가 필요하다.", "눈으로 보기에 맑다는 ‘겉보기 기준’을 말한다."]}, "5": {"c": "g", "t": "water quality : 수질 (물의 질)", "n": ["quality = 질, 품질", "(다의어) quality = 자질, 특성", "water quality = 수질"], "x": ["Water quality는 ‘수질’이라는 뜻이다.", "1번의 ‘깨끗하다’를 과학적인 말로 바꾼 표현이다."]}, "6": {"c": "p", "t": "be about + 동명사 : ~에 관한 것이다", "n": ["be about -ing = ~하는 것에 관한 것이다", "about은 전치사 → 동명사 following", "follow = 따르다"], "x": ["Water quality is about following a certain set of criteria는 ‘수질은 특정한 기준들의 집합을 따르는 것에 관한 것이다’라는 뜻이다.", "전치사 about 뒤이므로 동사 follow가 동명사 following으로 바뀌었다."]}, "7": {"c": "g", "t": "criteria : 기준들 (단수 criterion)", "n": ["criterion = 기준 (단수)", "criteria = 기준들 (복수)", "a set of criteria = 기준들의 묶음"], "x": ["a certain set of criteria는 ‘특정한 기준들의 집합’이라는 뜻이다.", "criteria는 복수형이고 단수형은 criterion이다. a criteria처럼 쓰면 틀린다."]}, "8": {"c": "b", "t": "바꿔 말하기 or : 즉, 다시 말해", "n": ["A, or B = A, 즉 B", "criteria = benchmarks (같은 것)", "쉼표 + or = 다른 말로 하면"], "x": ["criteria, or “benchmarks.”는 ‘기준들, 즉 지표들’이라는 뜻이다.", "여기서 or는 ‘또는’이라는 선택이 아니라 앞의 말을 다른 말로 바꾸어 주는 역할이다."]}, "9": {"c": "g", "t": "benchmark : 기준점, 지표", "n": ["benchmark = 기준점, 비교의 기준", "(같은 뜻) standard, criterion", "측정하고 비교할 수 있는 수치"], "x": ["“benchmarks”는 ‘지표들, 기준점들’이라는 뜻이다.", "안전한지 아닌지를 재고 비교할 수 있는 기준 수치를 말한다."]}, "10": {"c": "o", "t": "These guidelines = criteria, benchmarks (기준들)", "n": ["These guidelines = 2번의 criteria / benchmarks", "guideline = 지침"], "x": ["These guidelines는 앞 문장의 criteria와 benchmarks를 다른 말로 받은 것이다.", "4번의 These rules도 같은 기준들을 가리킨다. 글이 같은 대상을 criteria → guidelines → rules로 바꿔 부르고 있다."]}, "11": {"c": "p", "t": "inform + 사람 + 명사절 : ~에게 …을 알려 주다", "n": ["inform A of B = A에게 B를 알리다", "inform us + how much ~ = 우리에게 얼마나 ~인지 알려 주다", "information = 정보"], "x": ["These guidelines inform us exactly how much ~는 ‘이 지침들은 우리에게 정확히 얼마나 많은 ~인지 알려 준다’라는 뜻이다.", "inform 뒤에 사람 목적어 us와 간접의문문 명사절이 이어진다."]}, "12": {"c": "p", "t": "간접의문문 : how much + 명사 + 주어 + 동사", "n": ["how much stuff can be in the water = 얼마나 많은 물질이 물속에 있을 수 있는지", "의문사구 how much stuff가 주어 역할", "exactly = 정확히"], "x": ["exactly how much physical, chemical, or biological stuff can be in the water는 ‘정확히 얼마나 많은 물리적, 화학적, 또는 생물학적 물질이 물속에 있을 수 있는지’라는 뜻이다.", "의문사구가 그대로 주어이므로 바로 동사 can be가 이어진다.", "기준이란 ‘0이어야 한다’가 아니라 ‘이만큼까지는 괜찮다’는 허용량이라는 점이 7번 safety limits와 연결된다."]}, "13": {"c": "g  FLOW.forEach(function(f){h+='<div class="fr"><b>'+f[0]+'</b><span><em>'+f[1]+'</em><strong>'+f[2]+'</strong><div class="eg2">예) '+f[3]+'</div></span></div>';});
 h+='</div></div>';
 h+='<div class="card" id="text">'+textHTML()+'</div>';
 h+='<div class="tabs" id="tabs"><button data-c="all" class="on">전체</button>';
 Object.keys(CAT).forEach(function(c){h+='<button data-c="'+c+'" class="c-'+c+'">'+CAT[c]+'</button>';});
 h+='</div><div id="items"></div>';
 h+='<div class="ft">비타민 영어클리닉 · 금천고 영어II</div>';
 document.getElementById("app").innerHTML=h;
 items();
}
function items(){
 var out="",seen={};
 S.forEach(function(s){
  var ids=[];s.mk.replace(/\[(\d+)\|/g,function(m,id){if(!seen[id]){seen[id]=1;ids.push(id);}});
  ids.forEach(function(id){var it=I[id];if(cur!="all"&&it.c!=cur)return;
   out+='<div class="it c-'+it.c+'" id="it'+id+'"><h4><span class="tl">'+it.t+'</span><span class="tag">'+CAT[it.c]+'</span></h4>';
   out+='<div class="quote">'+s.n+'. '+hl2(s.mk,id)+'<div class="qk">'+s.ko+'</div></div>';
   out+='<div class="note"><div class="nl">노트 정리</div>'+it.n.map(function(l){return '<div class="ln">'+l+'</div>';}).join("")+'</div>';
   out+='<div class="xs">'+it.x.map(function(l){return '<div>'+l+'</div>';}).join("")+'</div>';
   if(it.e)out+='<div class="eg">'+it.e+'</div>';
   out+='<button class="bkb" data-back="'+s.n+'">본문으로 돌아가기</button></div>';
  });
 });
 document.getElementById("items").innerHTML=out;
}
function hl2(s,id){return s.replace(/\[(\d+)\|([^\]]+)\]/g,function(m,i,t){return i==id?'<span class="hlk c-'+I[i].c+'">'+t+'</span>':t;});}
document.addEventListener("click",function(e){
 var t=e.target;
 
 if(t.dataset&&t.dataset.id){var el=document.getElementById("it"+t.dataset.id);if(el){el.scrollIntoView({behavior:"smooth",block:"center"});el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash");}return;}
 if(t.closest&&t.closest("#tabs")&&t.dataset.c){cur=t.dataset.c;setTabs();document.getElementById("text").innerHTML=textHTML();items();return;}
 if(t.dataset&&t.dataset.back){var p=document.getElementById("s"+t.dataset.back);p.scrollIntoView({behavior:"smooth",block:"center"});return;}
 if(t.tagName=="I"&&t.parentNode.classList.contains("ps")){t.parentNode.classList.toggle("open");}
});
function setTabs(){[].forEach.call(document.querySelectorAll("#tabs button"),function(b){b.classList.toggle("on",b.dataset.c==cur);});}
render();
</script>
