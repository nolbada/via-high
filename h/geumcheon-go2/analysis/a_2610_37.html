<script>
var CAT={g:"어휘",o:"대명사",b:"연결어",k:"핵심 문장",p:"구문"};
var P={"num": "37", "sub": "고2 · 감정 조절과 재평가", "one": "같은 사건도 어떻게 해석하느냐에 따라 감정이 달라지므로, 상황을 다르게 바라보는 재평가가 감정을 뿌리부터 바꾸고 결국 회복 탄력성의 열쇠가 될 수 있다는 것", "flow": [{"label": "도입부 = 주제", "range": "1번", "sum": "재평가, 곧 감정적인 상황을 생각하는 방식을 바꾸는 것은 감정을 뿌리부터 바꾸므로 감정 조절에 특히 효과적인 방법 <small>(reappraisal / at their root)</small>", "eg": "갑자기 비가 와서 약속이 취소된 날을 ‘망친 날’ 대신 ‘집에서 푹 쉬는 날’로 바꿔 생각하기"}, {"label": "본론 (1) 예시", "range": "2~5번", "sum": "이혼이라는 부정적인 사건도 평생 흔적을 남길 상실로 볼 수도, 아프지만 길게 보면 더 나은 관계로 이어질 일로 볼 수도 있음 <small>(construed in different ways)</small>", "eg": "시험 점수가 떨어진 일을 ‘이제 끝났다’로 볼지 ‘공부법을 바꿀 기회’로 볼지"}, {"label": "본론 (2)", "range": "6~9번", "sum": "해석이 다르면 감정도 다름. 첫 해석은 강한 슬픔과 분노, 두 번째 해석은 더 약한 슬픔과 분노에 희망·강인함·감사까지 <small>(different construals → different emotions)</small>", "eg": "같은 낮은 점수에도 한 친구는 하루 종일 울고, 다른 친구는 속상해도 다음 계획을 세움"}, {"label": "결론", "range": "10~12번", "sum": "재평가가 단기 감정 반응을 바꾸고, 그것이 오래 반복되어 쌓이면 심리적 건강을 형성하여 회복 탄력성의 열쇠가 됨 <small>(accumulate / a key to resilience)</small>", "eg": "작은 일마다 다르게 보는 연습이 쌓여 웬만한 실패에도 금방 다시 일어서는 사람이 됨"}], "sents": [{"n": 1, "mk": "[1|Reappraisal] ― [2|changing the way one thinks about emotional situations] ― might present a particularly effective [3|avenue to regulating] emotions because [4|it] [5|transforms emotions at their root].", "ko": "재평가, 즉 누군가가 감정적인 상황들에 대해 생각하는 방식을 바꾸는 것은 그것이 감정을 본질적으로 변화시키기 때문에 감정을 조절하는 데 특히 효과적인 방법을 제공할지도 모른다.", "star": true}, {"n": 2, "mk": "[6|Take, for example,] [7|someone who is going through] a [8|divorce].", "ko": "예를 들어, 이혼을 겪고 있는 누군가를 생각해 보자."}, {"n": 3, "mk": "[9|This] is often an [10|adverse] event, [11|and yet], it [12|can be construed] in different ways.", "ko": "이것은 보통 부정적인 사건이지만, 그럼에도 불구하고 그것은 다른 방식들로 해석될 수 있다."}, {"n": 4, "mk": "[13|One] might [14|view it as] an [15|overpowering] loss [16|that will mark one's family for life].", "ko": "누군가는 그것을 자신의 가족에게 평생 흔적을 남길 강렬한 상실로 여길지도 모른다."}, {"n": 5, "mk": "[17|Alternatively], one might [18|see it as] something [19|that is painful but that might lead to] positive outcomes [20|in the long run], [21|such as improved relationships].", "ko": "이와는 달리, 누군가는 그것을 고통스럽기는 하지만 개선된 관계와 같이 장기적으로는 긍정적인 결과로 이어질 수 있는 일로 여길지도 모른다.", "star": true}, {"n": 6, "mk": "[22|As a result of] [23|these different construals], one might feel [24|different emotions].", "ko": "이러한 다른 해석들의 결과로서 누군가는 다른 감정들을 느낄지도 모른다.", "star": true}, {"n": 7, "mk": "[25|The first construal] may [26|bring] [27|intense] sadness and anger.", "ko": "첫 번째 해석은 강렬한 슬픔과 분노를 불러올 수 있다."}, {"n": 8, "mk": "[28|The second construal] might [29|also] bring sadness and anger [30|but perhaps at lower levels].", "ko": "두 번째 해석 역시 슬픔과 분노를 불러올지도 모르지만, 아마도 더 낮은 강도로 그러할지도 모른다."}, {"n": 9, "mk": "[31|Crucially], [32|it] might also bring some [33|positive emotions], such as hope, strength, or [34|gratitude].", "ko": "결정적으로 그것은 희망, 강인함 또는 감사함과 같은 어떤 긍정적인 감정들 또한 불러올지도 모른다."}, {"n": 10, "mk": "[35|This example] [36|illustrates] [37|how reappraisal might powerfully transform] [38|short-term] emotional responses.", "ko": "이 예시는 재평가가 어떻게 단기적인 감정적 반응들을 강력하게 변화시킬 수 있을지를 보여 준다."}, {"n": 11, "mk": "[39|When repeated over time], [40|these short-term emotional consequences of reappraisal] might [41|accumulate] [42|to shape] people's [43|psychological health].", "ko": "오랫동안 반복되면, 재평가의 이러한 단기적인 감정적 결과들이 축적되어 사람들의 심리적 건강을 형성할지도 모른다.", "star": true}, {"n": 12, "mk": "[44|Thereby], reappraisal might be [45|a key to] [46|resilience].", "ko": "그렇게 함으로써 재평가는 회복 탄력성의 해답이 될지도 모른다.", "star": true}], "items": {"1": {"c": "k", "t": "주제어 : reappraisal (재평가)", "n": ["reappraisal = re(다시) + appraisal(평가) = 재평가", "appraise = 평가하다", "= 감정적 상황을 생각하는 방식을 바꾸는 것"], "x": ["Reappraisal은 ‘재평가’라는 뜻으로, 바로 뒤 대시(―) 사이에서 그 뜻을 풀어 준다.", "상황 자체는 그대로 두고, 그 상황을 바라보는 생각을 바꾸는 것이다.", "글 전체가 이 재평가의 효과를 설명하므로 첫 단어가 곧 주제어이다."], "e": "쉬운 예시 : 친구가 답장을 늦게 했을 때 ‘나를 무시하나’ 대신 ‘바빴나 보다’로 다시 생각하면 화가 덜 난다."}, "2": {"c": "p", "t": "대시(―) 사이 동격 설명 + the way S V", "n": ["Reappraisal ― changing ~ ― = 재평가, 즉 ~을 바꾸는 것", "the way one thinks = 사람이 생각하는 방식", "the way와 how는 함께 쓰지 않음"], "x": ["changing the way one thinks about emotional situations는 ‘누군가가 감정적인 상황에 대해 생각하는 방식을 바꾸는 것’이라는 뜻이다.", "대시 사이의 동명사구가 주어 Reappraisal의 뜻을 풀어 주는 동격 역할을 한다.", "one은 ‘(일반적인) 사람’이라는 뜻이다. 문장의 동사는 대시 뒤의 might present이다."]}, "3": {"c": "p", "t": "avenue to + 동명사 : ~하는 길, 수단 (to는 전치사)", "n": ["avenue = 방법, 수단 (원래 뜻: 길, 대로)", "avenue to -ing = ~으로 가는 길", "regulate = 조절하다 → regulating"], "x": ["a particularly effective avenue to regulating emotions는 ‘감정을 조절하는 데 특히 효과적인 방법’이라는 뜻이다.", "여기서 to는 to부정사가 아니라 ‘~으로 (가는)’이라는 전치사이므로 뒤에 동명사 regulating이 왔다.", "to regulate로 바꾼 어법 문제가 나올 수 있는 자리이다."]}, "4": {"c": "o", "t": "it = reappraisal (재평가)", "n": ["it = Reappraisal", "their = emotions의"], "x": ["because it transforms emotions의 it은 문장 주어인 Reappraisal을 가리킨다.", "이어지는 at their root의 their는 emotions를 가리킨다."]}, "5": {"c": "k", "t": "재평가의 힘 : 감정을 뿌리부터 바꿈", "n": ["transform = 변화시키다, 바꾸어 놓다", "at the root = 근본에서, 뿌리부터", "감정을 참는 것 ≠ 감정이 생기는 원인을 바꾸는 것"], "x": ["it transforms emotions at their root는 ‘그것이 감정을 근본부터 바꾸기 때문이다’라는 뜻이다.", "이미 생긴 감정을 억누르는 것이 아니라, 감정이 생기는 출발점인 ‘생각’을 바꾼다는 뜻이다.", "transform은 10번 문장에서 다시 나와 글의 처음과 끝을 이어 준다."]}, "6": {"c": "b", "t": "Take, for example, ~ : 예를 들어 ~을 생각해 보자", "n": ["Take ~ = ~을 예로 들어 보자 (명령문)", "for example = 예를 들어", "주제(1번) → 예시(2번~)"], "x": ["Take, for example, someone ~은 ‘예를 들어, ~하는 누군가를 생각해 보자’라는 뜻이다.", "take는 여기서 ‘잡다’가 아니라 ‘예로 들다, 생각해 보다’라는 뜻이다.", "1번의 주제를 이혼이라는 구체적인 예로 보여 주기 시작하는 신호이다."]}, "7": {"c": "p", "t": "주격 관계대명사 who + go through (겪다)", "n": ["someone who is V-ing = ~하고 있는 누군가", "go through ~ = (힘든 일을) 겪다", "(같은 뜻) undergo, experience"], "x": ["someone who is going through a divorce는 ‘이혼을 겪고 있는 누군가’라는 뜻이다.", "who는 someone을 꾸미는 주격 관계대명사이다.", "go through는 ‘통과하다’라는 뜻도 있지만 여기서는 힘든 시기를 ‘겪다’라는 뜻이다."]}, "8": {"c": "g", "t": "divorce : 이혼 (동사: 이혼하다)", "n": ["divorce = 이혼, 이혼하다", "(관련) marriage = 결혼"], "x": ["a divorce는 ‘이혼’이라는 뜻이다.", "누구에게나 괴로운 사건이라서, 같은 사건도 해석에 따라 감정이 달라진다는 점을 보여 주기 좋은 예시이다."]}, "9": {"c": "o", "t": "This = 이혼을 겪는 것", "n": ["This = going through a divorce", "앞 문장의 예시 상황 전체를 받음"], "x": ["This is often an adverse event의 This는 앞 문장의 ‘이혼을 겪는 것’을 가리킨다.", "뒤의 it도 같은 이혼이라는 사건을 가리킨다."]}, "10": {"c": "g", "t": "adverse : 부정적인, 불리한", "n": ["adverse = 부정적인, 불리한, 해로운", "(반의) favorable = 유리한, 호의적인", "(혼동) averse = 싫어하는"], "x": ["an adverse event는 ‘부정적인 사건’이라는 뜻이다.", "철자가 비슷한 averse(싫어하는)와 헷갈리지 않도록 해야 한다."]}, "11": {"c": "b", "t": "and yet : 그런데도, 그럼에도 불구하고", "n": ["and yet = 그럼에도 불구하고 (but보다 강한 반전)", "부정적 사건 ↔ 다르게 해석될 수 있음"], "x": ["and yet은 ‘그럼에도 불구하고’라는 뜻으로 앞뒤 내용을 대조한다.", "‘보통은 나쁜 일이다’와 ‘그래도 다르게 볼 수 있다’를 이어 주는 것이 이 글의 중심 생각이다."]}, "12": {"c": "g", "t": "construe : 해석하다, 이해하다 (명사 construal)", "n": ["construe = 해석하다, ~으로 받아들이다", "construal = 해석 (6~8번에 반복)", "(혼동) construct = 건설하다"], "x": ["it can be construed in different ways는 ‘그것은 다른 방식으로 해석될 수 있다’라는 뜻이다.", "사건은 해석되는 대상이므로 조동사 can 뒤에 수동태 be construed가 쓰였다.", "이 단어의 명사형 construal이 뒤에서 계속 나오므로 꼭 알아 두어야 한다."]}, "13": {"c": "o", "t": "One = (이혼을 겪는) 사람", "n": ["One = 사람, 누군가 (일반적인 사람)", "one's = 그 사람의"], "x": ["One might view it as ~의 One은 이혼을 겪고 있는 ‘어떤 사람’을 가리킨다.", "it은 여전히 이혼이라는 사건이고, one's family는 그 사람의 가족이다."]}, "14": {"c": "p", "t": "view A as B : A를 B로 여기다", "n": ["view A as B = see A as B = regard A as B", "= A를 B로 보다, 여기다", "5번의 see it as와 짝"], "x": ["One might view it as an overpowering loss는 ‘누군가는 그것을 압도적인 상실로 여길지도 모른다’라는 뜻이다.", "4번은 첫 번째 해석, 5번은 두 번째 해석으로, 같은 A as B 틀로 대조된다."]}, "15": {"c": "g", "t": "overpowering : 압도적인, 너무 강렬한", "n": ["overpowering = 압도적인, 이겨 내기 힘든", "overpower = 압도하다, 제압하다", "loss = 상실, 잃음"], "x": ["an overpowering loss는 ‘이겨 내기 힘든 강렬한 상실’이라는 뜻이다.", "사건을 감당할 수 없을 만큼 큰 비극으로 보는 해석이다."]}, "16": {"c": "p", "t": "주격 관계대명사 that + mark (흔적을 남기다)", "n": ["that = an overpowering loss를 꾸밈", "mark = 흔적을 남기다 (명사: 표시)", "for life = 평생 동안"], "x": ["that will mark one's family for life는 ‘자신의 가족에게 평생 흔적을 남길’이라는 뜻으로 loss를 꾸민다.", "mark는 여기서 동사로, 지워지지 않는 상처를 남긴다는 느낌이다.", "이 해석은 7번에서 강렬한 슬픔과 분노로 이어진다."]}, "17": {"c": "b", "t": "Al
