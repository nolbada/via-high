<script>
var CAT={g:"어휘",o:"대명사",b:"연결어",k:"핵심 문장",p:"구문"};
var P={"num": "34", "sub": "고2 · 상호 연결과 복합적 실패", "one": "정보 기술로 모든 것이 서로 연결되면서, 예전에는 벽 안에 머물던 작은 실패가 순식간에 퍼져 예측하기 어려운 새로운 취약성이 생김", "flow": [{"label": "도입부", "range": "1~2번", "sum": "소셜 미디어와 세계 금융 산업이 모든 것을 연결해, 지구 반대편의 실수에도 우리가 취약해짐 <small>(vulnerable to human error)</small>", "eg": "다른 나라 은행의 전산 실수 하나에 우리나라 주가가 출렁였다는 뉴스"}, {"label": "본론 (1)", "range": "3~4번", "sum": "예전의 기관들은 서로 분리되어 벽 밖의 오류로부터 보호받았지만, 이제는 더 이상 그렇지 않음 <small>(buffered / no longer the case)</small>", "eg": "칸칸이 막힌 건물이라 옆방에 불이 나도 내 방까지 번지지 않던 시절이 끝남"}, {"label": "본론 (2)", "range": "5~6번", "sum": "컴퓨팅 비용이 떨어지며 정보의 디지털화가 급증하고, 스스로 소통하는 스마트 시스템이 무한히 다양한 고장 가능성을 낳음 <small>(potential breakdowns)</small>", "eg": "집 안 기기들이 자동으로 이어져 있어서 하나가 오작동하면 다른 기기까지 엉뚱하게 움직이는 상황"}, {"label": "요지", "range": "7~9번", "sum": "이 상호 의존성이 복합적 실패의 온상, 분리되던 것들이 부딪치면 예측이 훨씬 어려워지고 연결성이 작은 실패의 영향을 즉시 퍼뜨림 <small>(a breeding ground for complex failure)</small>", "eg": "촘촘히 세운 도미노에서 하나만 넘어져도 줄 전체가 무너지는 장면"}], "sents": [{"n": 1, "mk": "Social media [1|has altered] business, politics, and friendships, [2|making going viral a household term].", "ko": "소셜 미디어는 비즈니스, 정치, 친목을 변화시켰으며, ‘입소문이 나다’를 일상적인 용어로 만들었다."}, {"n": 2, "mk": "The global financial industry [3|links every bank and countless households] in every country, [4|making us vulnerable to] [5|human error taking place] on the other side of the world.", "ko": "세계 금융 산업은 모든 은행과 전 세계 각국의 수많은 가정을 연결하여, 우리를 세계의 다른 곳에서 발생한 인간의 오류에 취약해지게 만들었다.", "star": true}, {"n": 3, "mk": "[6|As Columbia University strategy professor Rita McGrath explains], years ago most of our institutions [7|were separate] and [8|thereby] [9|buffered from] the effects of errors outside [10|their walls].", "ko": "Columbia University 전략학 교수 Rita McGrath가 설명하듯이, 수년 전 우리의 기관들 중 대부분은 서로 분리되어 있었고, 따라서 그것들의 장벽 밖에 있는 오류들의 영향으로부터 보호되었다."}, {"n": 4, "mk": "[11|That] is [12|no longer the case].", "ko": "더 이상은 그렇지 않다.", "star": true}, {"n": 5, "mk": "The [13|digitization] of massive amounts of information [14|has continued to gr function items(){
 var out="",seen={};
 S.forEach(function(s){
  var ids=[];s.mk.replace(/\[(\d+)\|/g,function(m,id){if(!seen[id]){seen[id]=1;ids.push(id);}});
  ids.forEach(function(id){var it=I[id];if(cur!="all"&&it.c!=cur)return;
   out+='<div class="it c-'+it.c+'" id="it'+id+'"><h4><span class="tl">'+it.t+'</span><span class="tag">'+CAT[it.c]+'</span></h4>';

  });
 });
 document.getElementById("items").innerHTML=out;

document.addEventListener("click",function(e){
