<script>
var CAT={g:"어휘",o:"대명사",b:"연결어",k:"핵심 문장",p:"구문"};
var P={"num": "33", "sub": "고2 · 인간 발달의 가소성", "one": "인간 발달은 정해진 단계가 아니라 가소성 덕분에 평생 계속되는 유연한 과정이며, 인간은 삶의 모든 단계에서 변화할 수 있는 능동적 주체", "flow": [{"label": "도입부", "range": "1~2번", "sum": "인간 발달을 고정된 단계가 아니라 계속되고 유연하며 진화하는 과정으로 보는 관점, 그 핵심은 가소성 <small>(plasticity)</small>", "eg": "정해진 계단을 차례로 밟는 것이 아니라 계속 업데이트되는 휴대폰 운영체제"}, {"label": "본론 (1)", "range": "3~4번", "sum": "가소성은 경험·환경·몸의 변화에 맞춰 생각·감정·행동 패턴을 바꾸고 재구성하는 능력, 인간은 수동적 수용자가 아닌 능동적 주체 <small>(active agents)</small>", "eg": "전학 간 학교에서 친구 사귀는 법과 공부 습관을 스스로 바꿔 나가는 학생"}, {"label": "본론 (2)", "range": "5번", "sum": "이전 관점 : 발달은 주로 아동기에 일어나고 성인기는 안정기, 노년기는 쇠퇴기 <small>(In earlier views)</small>", "eg": "‘어른이 되면 사람은 안 바뀐다’는 흔한 말"}, {"label": "요지", "range": "6~7번", "sum": "가소성은 발달이 전 생애에 걸쳐 계속된다고 강조하며 이 경직된 관점을 반박, 정도는 달라도 삶의 모든 단계에 적응과 변화의 여지 <small>(across the entire lifespan)</small>", "eg": "일흔이 넘어 스마트폰 사용법을 배우고 새 취미를 시작하는 할머니"}], "sents": [{"n": 1, "mk": "Human development [1|is now increasingly understood as] [2|an ongoing, flexible, and evolving process] [3|rather than] [4|a fixed sequence of stages].", "ko": "인간 발달은 고정된 순서의 단계들이라기보다는 계속 진행 중이고, 유연하며, 그리고 서서히 발전하는 과정으로 오늘날 점점 이해되고 있다."}, {"n": 2, "mk": "[5|At the core of] [6|this perspective] [7|lies the concept] of [8|plasticity].", "ko": "이러한 관점의 핵심에는 가소성의 개념이 있다.", "star": true}, {"n": 3, "mk": "Plasticity [9|refers to] [10|the human capacity to change, adapt, and reorganize] [11|cognitive, emotional, and behavioural] patterns [12|in response to] life experiences, environmental demands, and biological changes.", "ko": "가소성은 삶의 경험들, 환경적 요구들, 그리고 생물학적 변화들에 반응하여 인지적, 정서적, 그리고 행동적 패턴들을 변화시키고, 적응시키며, 재구성하는 인간의 능력을 지칭한다."}, {"n": 4, "mk": "[13|It] [14|highlights that] individuals are [15|not merely passive recipients of development but active agents] [16|capable of growth] throughout their lives.", "ko": "그것은 개인들이 단순히 발달의 수동적인 수용자가 아니라 평생에 걸쳐 성장이 가능한 능동적인 주체들이라는 점을 강조한다."}, {"n": 5, "mk": "[17|In earlier views], development [18|was believed to occur] mainly during childhood,  h+='<div class="tabs" id="tabs"><button data-c="all" class="on">전체</button>';
 Object.keys(CAT).forEach(function(c){h+='<button data-c="'+c+'" class="c-'+c+'">'+CAT[c]+'</button>';});
 h+='</div><div id="items"></div>';
 h+='<div class="ft">비타민 영어클리닉 · 금천고 영어II</div>';
 document.getElementById("app").innerHTML=h;
 items();
}
function items(){
 var out="",seen={};
 S.forEach(function(s){
  var ids=[];s.mk.replace(/\[(\d+)\|/g,function(m,id){if(!seen[id]){seen[id]=1;ids.push(id);}});
  ids.forEach(function(id){var it=I[id];if(cur!="all"&&it.c!=cur)return;
   out+='<div class="it c-'+it.c+'" id="it'+id+'"><h4><span class="tl">'+it.t+'</span><span class="tag">'+CAT[it.c]+'</span></h4>';
   out+='<div class="quote">'+s.n+'. '+hl2(s.mk,id)+'<div class="qk">'+s.ko+'</div></div>';
   out+='<div class="note"><div class="nl">노트 정리</div>'+it.n.map(function(l){return '<div class="ln">'+l+'</div>';}).join("")+'</div>';
   out+='<div class="xs">'+it.x.map(function(l){return '<div>'+l+'</div>';}).join("")+'</div>';
   if(it.e)out+='<div class="eg">'+it.e+'</div>';
   out+='<button class="bkb" data-back="'+s.n+'">본문으로 돌아가기</button></div>';
  });
 });
 document.getElementById("items").innerHTML=out;
}
function hl2(s,id){return s.replace(/\[(\d+)\|([^\]]+)\]/g,function(m,i,t){return i==id?'<span class="hlk c-'+I[i].c+'">'+t+'</span>':t;});}
document.addEventListener("click",function(e){
 var t=e.target;
 
 if(t.dataset&&t.dataset.id){var el=document.getElementById("it"+t.dataset.id);if(el){el.scrollIntoView({behavior:"smooth",block:"center"});el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash");}return;}
 if(t.closest&&t.closest("#tabs")&&t.dataset.c){cur=t.dataset.c;setTabs();document.getElementById("text").innerHTML=textHTML();items();return;}
 if(t.dataset&&t.dataset.back){var p=document.getElementById("s"+t.dataset.back);p.scrollIntoView({behavior:"smooth",block:"center"});return;}
 if(t.tagName=="I"&&t.parentNode.classList.contains("ps")){t.parentNode.classList.toggle("open");}
});
function setTabs(){[].forEach.call(document.querySelectorAll("#tabs button"),function(b){b.classList.toggle("on",b.dataset.c==cur);});}
render();
</script>
</body>
</html>
