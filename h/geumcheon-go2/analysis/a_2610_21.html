var CAT={g:"어휘",o:"대명사",b:"연결어",k:"핵심 문장",p:"구문"};
var P={"num": "21", "sub": "고2 · 이자율과 시간의 가치", "one": "이자율은 빌려준 돈을 못 받을 위험과 그 돈을 지금 쓰지 못하고 기다리는 대가, 곧 시간의 가치를 돈의 가격으로 매긴 것", "flow": [{"label": "도입부", "range": "1~2번", "sum": "빌리고 빌려주는 일이 세계관을 바꾸는 방식을 보려면 이자율이 시간 인식에 주는 영향을 보자는 제안, 연 10퍼센트·5년 대출이라는 가상 상황 설정 <small>(perception of time)</small>", "eg": "친구에게 용돈 5만 원을 1년 동안 빌려주는 상황을 떠올려 봄"}, {"label": "본론 (1)", "range": "3번", "sum": "이자율은 돈을 못 돌려받을 위험과 그 돈을 직접 쓰지 못하는 기회비용을 반영한 대가 <small>(risk / opportunity cost)</small>", "eg": "빌려준 돈을 떼일까 하는 걱정과, 그 돈으로 사려던 운동화를 못 사는 아쉬움"}, {"label": "본론 (2)", "range": "4번", "sum": "대출 기간이 길수록 알 수 없는 먼 미래의 일이 되어 못 받을 위험이 커지고, 직접 쓰기까지 기다리는 시간도 길어짐 <small>(the longer ~, the higher ~)</small>", "eg": "일주일 뒤에 갚겠다는 약속보다 3년 뒤에 갚겠다는 약속이 훨씬 불안함"}, {"label": "요지", "range": "5~6번", "sum": "빌려주는 일이 가치 있으려면 돈에 가격(이자)이 붙어야 하고, 이 가격이 곧 시간의 가치를 감안한 것 <small>(factors in the value of time)</small>", "eg": "오래 기다려 준 만큼 조금 더 얹어서 돌려받아야 공평하다는 느낌"}, {"label": "결론", "range": "7번", "sum": "손 안의 새 한 마리가 덤불 속 두 마리만큼 값지다는 속담으로 재진술, 확실한 지금이 불확실한 미래보다 가치 있음 <small>(a bird in the hand)</small>", "eg": "나중에 사 주겠다는 치킨 두 마리 약속보다 지금 손에 든 치킨 한 마리"}], "sents": [{"n": 1, "mk": "[1|To see] how [2|borrowing and lending changes] a person's [3|worldview], consider [4|what the rate of interest does to] people's [5|perception of time].", "ko": "돈을 빌리고 빌려주는 일이 어떻게 한 사람의 세계관을 바꾸는지 알아보기 위해, 이자율이 시간에 대한 사람들의 인식에 무슨 일을 하는지 생각해 보라.", "star": true}, {"n": 2, "mk": "[6|Imagine] you are [7|lending to somebody] [8|at an interest rate of 10 percent per year] for five years.", "ko": "여러분이 누군가에게 연 10퍼센트의 이자율로 5년 동안 돈을 빌려주고 있다고 상상해 보라."}, {"n": 3, "mk": "[9|This rate] tells us that [10|the money lent] [11|has a cost that reflects] the risk of [12|you not being repaid] and [13|the opportunity cost] of not spending that money yourself.", "ko": "이 이자율은 빌려준 돈이 여러분이 상환받지 못할 위험과 그 돈을 직접 소비하지 않는 기회비용을 반영하는 대가를 가진다는 것을 우리에게 말해 준다.", "star": true}, {"n": 4, "mk": "[14|The longer] the [15|term] of the loan, the higher the chance you [16|won't be paid back] because [17|it] is further into the future ― [18|which by definition is unknowable] ― [19|and the longer you will have to wait] before spending the money yourself.", "ko": "대출 기간이 길어질수록, 상환을 못 받을 가능성이 더 높아지는데, 정의상 알 수 없는 더 먼 미래의 일이 되기 때문이며, 여러분이 그 돈을 직접 소비하기 전까지 더 오래 기다려야 할 것이다."}, {"n": 5, "mk": "[20|In order to make] [21|this] [22|worthwhile] for the lender, [23|money has to have a price] ― [24|a cost to the borrower and income to the lender].", "ko": "돈을 빌려준 사람에게 이것을 가치 있게 만들기 위해서, 빌린 사람에게는 대가이고 빌려준 사람에게는 수입인 비용을 돈이 가져야만 한다.", "star": true}, {"n": 6, "mk": "[25|This price] [26|factors in] [27|the value of time].", "ko": "이 비용은 시간의 가치를 감안한다.", "star": true}, {"n": 7, "mk": "[28|To put it another way], [29|a bird in the hand] [30|is worth two in the bush].", "ko": "달리 말하면, 손 안의 새 한 마리가 덤불 속의 두 마리만큼의 가치가 있다.", "star": true}], "items": {"1": {"c": "p", "t": "To see ~ : ~을 알아보기 위해 (to부정사, 목적)", "n": ["To see ~ = ~을 알아보기 위해", "to부정사의 부사적 용법 (목적)", "뒤의 consider ~ 가 진짜 주절 (명령문)"], "x": ["To see how ~ a person's worldview는 ‘~이 어떻게 한 사람의 세계관을 바꾸는지 알아보기 위해’라는 뜻이다.", "문장 앞의 To see는 목적을 나타내고, 주절은 쉼표 뒤의 consider로 시작하는 명령문이다.", "글의 첫 문장에서 무엇을 살펴볼지 방향을 정해 주는 도입 역할을 한다."]}, "2": {"c": "p", "t": "동명사 주어 borrowing and lending + 단수 동사 changes", "n": ["borrowing = 빌리기 / lending = 빌려주기", "borrowing and lending = 돈을 주고받는 하나의 행위", "하나의 개념 → 단수 동사 changes"], "x": ["borrowing and lending은 두 동명사가 and로 이어졌지만 ‘돈을 빌리고 빌려주는 일’이라는 하나의 행위로 묶여 단수 취급되었다.", "그래서 동사가 change가 아니라 changes이다.", "how 뒤에 주어와 동사가 이어지는 간접의문문 안의 수일치로 어법 문제에 나오기 쉽다."]}, "3": {"c": "g", "t": "worldview : 세계관", "n": ["worldview = 세계관, 세상을 보는 눈", "world(세상) + view(보는 관점)"], "x": ["a person's worldview는 ‘한 사람의 세계관’이라는 뜻이다.", "돈을 빌리고 빌려주는 경험이 세상, 특히 시간을 보는 눈까지 바꾼다는 것이 글의 출발점이다."]}, "4": {"c": "p", "t": "what A does to B : A가 B에 어떤 영향을 미치는지", "n": ["what A does to B = A가 B에게 무슨 일을 하는지", "= A가 B에 어떤 영향을 주는지", "the rate of interest = 이자율 (= interest rate)"], "x": ["what the rate of interest does to people's perception of time은 ‘이자율이 사람들의 시간 인식에 무슨 일을 하는지’라는 뜻이다.", "what이 이끄는 간접의문문이 consider의 목적어로 쓰였다.", "does to는 ‘~에 작용하다, 영향을 미치다’로 이해하면 자연스럽다."]}, "5": {"c": "k", "t": "글의 화제 : 이자율과 시간에 대한 인식", "n": ["perception = 인식, 지각", "perceive = 인식하다 (동사)", "perception of time = 시간을 어떻게 느끼고 따지는가"], "x": ["perception of time은 ‘시간에 대한 인식’이라는 뜻이다.", "이 글은 이자율이 사람들에게 ‘지금’과 ‘나중’의 가치를 다르게 따지게 만든다는 이야기로 이어진다.", "첫 문장에서 화제(이자율 → 시간 인식)를 미리 던져 두는 것이다."], "e": "쉬운 예시 : 같은 만 원이라도 오늘 받는 만 원과 1년 뒤에 받는 만 원을 다르게 느끼는 것이 바로 시간에 대한 인식이다."}, "6": {"c": "k", "t": "Imagine ~ : 가상 상황으로 설명 시작", "n": ["Imagine (that) S V = ~라고 상상해 보라", "Imagine 뒤 that 생략", "구체적인 대출 상황을 예로 듦"], "x": ["Imagine you are lending to somebody ~는 ‘여러분이 누군가에게 돈을 빌려주고 있다고 상상해 보라’라는 뜻이다.", "Imagine 뒤에 접속사 that이 생략되고 절이 바로 이어졌다.", "1번 문장의 추상적인 질문을 숫자가 있는 구체적 상황으로 바꿔 독자가 따라오게 하는 문장이다."]}, "7": {"c": "g", "t": "lend : 빌려주다 ↔ borrow : 빌리다", "n": ["lend = 빌려주다 (lend - lent - lent)", "borrow = 빌리다", "lender = 빌려주는 사람 / borrower = 빌리는 사람"], "x": ["lending to somebody는 ‘누군가에게 빌려주는 것’이라는 뜻이다.", "lend는 빌려주는 쪽, borrow는 빌리는 쪽이다. 이 글은 빌려주는 사람(lender)의 입장에서 설명한다.", "3번 문장의 the money lent에서 lent는 lend의 과거분사이다."]}, "8": {"c": "p", "t": "at + 비율 : ~의 비율로", "n": ["at a rate of ~ = ~의 비율로", "interest rate = 이자율", "per year = 1년마다, 연"], "x": ["at an interest rate of 10 percent per year는 ‘연 10퍼센트의 이자율로’라는 뜻이다.", "비율, 속도, 가격 앞에는 전치사 at을 쓴다.", "for five years는 ‘5년 동안’으로 기간을 나타낸다."]}, "9": {"c": "o", "t": "This rate = 연 10퍼센트의 이자율", "n": ["This rate = 2번 문장의 an interest rate of 10 percent"], "x": ["This rate는 앞 문장에서 가정한 연 10퍼센트의 이자율을 가리킨다.", "이제 그 이자율이 무엇을 뜻하는지 풀어 주는 문장이다."]}, "10": {"c": "p", "t": "과거분사 후치수식 : the money lent", "n": ["the money ← lent (빌려준)", "lent = lend의 과거분사", "돈이 ‘빌려지는’ 수동 관계"], "x": ["the money lent는 ‘빌려준 돈’이라는 뜻으로, 과거분사 lent가 the money를 뒤에서 꾸민다.", "돈은 스스로 빌려주는 것이 아니라 빌려지는 것이므로 과거분사를 쓴다.", "주어 the money는 셀 수 없는 단수명사라서 동사가 has이다."]}, "11": {"c": "p", "t": "주격 관계대명사 that : a cost ← that reflects ~", "n": ["a cost ← that reflects A and B", "reflect = 반영하다", "A = 못 돌려받을 위험 / B = 기회비용"], "x": ["has a cost that reflects ~는 ‘~을 반영하는 대가를 가진다’라는 뜻이다.", "that은 a cost를 꾸미는 주격 관계대명사이고, 선행사가 단수라서 reflects이다.", "reflects 뒤에 the risk ~와 the opportunity cost ~ 두 가지가 and로 이어진다. 이 두 가지가 이자율의 정체이다."]}, "12": {"c": "p", "t": "동명사의 의미상 주어 + not + 수동 : you not being repaid", "n": ["the risk of + (you) + not + being repaid", "you = 동명사의 의미상 주어", "being repaid = 돌려받는 것 (수동)", "repay = 갚다 / be repaid = 돌려받다"], "x": ["the risk of you not being repaid는 ‘여러분이 상환받지 못할 위험’이라는 뜻이다.", "you는 동명사 being repaid의 행위 주체(의미상 주어)이고, 부정어 not은 동명사 바로 앞에 온다.", "빌려준 사람은 돈을 ‘돌려받는’ 입장이라 수동 형태 being repaid를 쓴다."]}, "13": {"c": "k", "t": "핵심 개념 : opportunity cost (기회비용)", "n": ["opportunity cost = 기회비용", "= 하나를 택하느라 포기한 다른 것의 가치", "of not spending that money yourself = 그 돈을 직접 쓰지 못하는 것의"], "x": ["the opportunity cost of not spending that money yourself는 ‘그 돈을 직접 쓰지 않는 것의 기회비용’이라는 뜻이다.", "빌려준 동안에는 그 돈으로 사고 싶은 것을 살 수 없으니, 그 포기한 즐거움이 대가가 된다.", "not spending은 동명사 앞에 not을 붙인 부정형이고, yourself는 ‘직접, 스스로’를 강조한다."], "e": "쉬운 예시 : 친구에게 10만 원을 빌려준 1년 동안 그 돈으로 살 수 있었던 이어폰을 못 산다. 그 이어폰이 기회비용이다."}, "14": {"c": "p", "t": "the + 비교급 ~, the + 비교급 … : ~할수록 더 …하다", "n": ["The longer A, the higher B = A가 길수록 B가 더 높다", "the longer you will have to wait = 더 오래 기다려야 함", "조건 하나 → 결과 둘 (위험↑, 기다림↑)"], "x": ["The longer the term of the loan, the higher the chance ~는 ‘대출 기간이 길수록 ~할 가능성이 더 높다’라는 뜻이다.", "앞 절과 뒤 절 모두 be동사(is)가 생략된 형태이다.", "뒤의 and the longer you will have to wait도 같은 the + 비교급으로, 기간이 길어질 때의 두 번째 결과이다."]}, "15": {"c": "g", "t": "term : 기간 (다의어)", "n": ["term = (정해진) 기간", "(다의어) term = 용어, 학기", "(다의어) in ~ terms = ~의 관점에서"], "x": ["the term of the loan은 ‘대출 기간’이라는 뜻이다.", "term은 ‘용어’, ‘학기’라는 뜻으로도 많이 쓰이므로 문맥으로 뜻을 골라야 한다.", "여기서는 돈을 빌려준 뒤 돌려받기까지의 기간이다."]}, "16": {"c": "g", "t": "pay back : 갚다 / be paid back : 돌려받다", "n": ["pay back = (돈을) 갚다 (= repay)", "be paid back = 돌려받다 (수동)", "the chance (that) you won't be paid back"], "x": ["the chance you won't be paid back은 ‘여러분이 돌려받지 못할 가능성’이라는 뜻이다.", "the chance 뒤에 동격의 접속사 that이 생략되어 있다.", "3번 문장의 not being repaid와 같은 내용을 다른 표현으로 다시 말한 것이다."]}, "17": {"c": "o", "t": "it = 빌려준 돈을 돌려받는 일 (대출의 상환)", "n": ["it = 대출금을 돌려받는 일", "it is further into the future = 그 일이 더 먼 미래의 일이 됨"], "x": ["because it is further into the future의 it은 빌려준 돈을 돌려받는 일, 곧 대출의 상환을 가리킨다.", "기간이 길수록 돌려받는 시점이 더 먼 미래로 밀려난다는 뜻이다."]}, "18": {"c": "p", "t": "계속적 관계대명사 which : 미래 = 정의상 알 수 없는 것", "n": ["the future ― which by definition is unknowable", "which = the future", "by definition = 정의상, 당연히", "unknowable = 알 수 없는"], "x": ["which by definition is unknowable은 ‘그런데 그것은 정의상 알 수 없다’라는 뜻이다.", "which는 바로 앞의 the future를 가리키고, 대시(―) 사이에 끼워 넣은 덧붙임 설명이다.", "미래는 원래 알 수 없는 것이므로, 먼 미래일수록 돌려받지 못할 위험이 커진다는 이유를 보충한다."]}, "19": {"c": "p", "t": "두 번째 결과 : and the longer you will have to wait", "n": ["the longer you will have to wait = 더 오래 기다려야 할 것", "before spending ~ = ~을 쓰기 전에 (before + 동명사)", "결과 ① 위험 증가 / 결과 ② 기다림 증가"], "x": ["and the longer you will have to wait before spending the money yourself는 ‘그 돈을 직접 쓰기 전에 더 오래 기다려야 할 것이다’라는 뜻이다.", "3번 문장의 두 요소(위험, 기회비용)가 기간이 길어지면 둘 다 커진다는 것을 보여 준다.", "before 뒤에 동명사 spending이 온 것은 before가 전치사로 쓰였기 때문이다."]}, "20": {"c": "p", "t": "in order to + make + 목적어 + 형용사 : ~을 …하게 만들기 위해", "n": ["in order to V = ~하기 위해", "make + this + worthwhile (형용사 보어)", "= 이것을 가치 있게 만들기 위해"], "x": ["In order to make this worthwhile for the lender는 ‘빌려주는 사람에게 이것을 가치 있게 만들기 위해’라는 뜻이다.", "make 뒤에 목적어 this와 목적격보어 worthwhile(형용사)이 온 5형식 구조이다.", "보어 자리에 부사가 아니라 형용사가 와야 한다."]}, "21": {"c": "o", "t": "this = 위험과 기다림을 감수하고 돈을 빌려주는 일", "n": ["this = 돈을 오랫동안 빌려주는 일", "(못 받을 위험 + 직접 못 쓰는 기다림을 떠안는 일)"], "x": ["make this worthwhile의 this는 앞 문장들에서 설명한, 위험과 기다림을 감수하며 돈을 빌려주는 일을 가리킨다.", "손해 볼 수 있는 일을 빌려주는 사람이 할 만한 일로 만들려면 무엇이 필요한지 말하는 문장이다."]}, "22": {"c": "g", "t": "worthwhile : (시간·노력을 들일) 가치가 있는", "n": ["worthwhile = 할 만한 가치가 있는", "worth + 명사 = ~의 가치가 있는", "worthy of ~ = ~을 받을 만한"], "x": ["worthwhile은 ‘시간이나 노력, 위험을 들일 만한 가치가 있는’이라는 형용사이다.", 야 한다."]}, "29": {"c": "k", "t": "핵심 비유 : 손 안의 새 = 지금 확실히 가진 것", "n": ["a bird in the hand = 손 안의 새 한 마리 = 지금 확실한 돈", "two in the bush = 덤불 속 두 마리 = 불확실한 미래의 더 큰 돈", "확실한 현재가 불확실한 미래보다 값지다"], "x": ["a bird in the hand는 이미 손에 쥐고 있어서 확실히 누릴 수 있는 지금의 가치를 비유한다.", "two in the bush는 잡을 수 있을지 모르는 미래의 더 큰 보상을 비유한다.", "그래서 미래로 미뤄지는 돈에는 이자를 붙여야 지금의 돈과 균형이 맞는다는 것이 글의 결론이다."], "e": "쉬운 예시 : 다음 달에 2만 원을 주겠다는 약속보다 지금 손에 든 1만 원이 더 믿음직하다."}, "30": {"c": "p", "t": "be worth + 명사 : ~의 가치가 있다", "n": ["be worth + 명사/동명사 = ~의 가치가 있다", "two = two birds (birds 생략)", "worth 뒤에 of 쓰지 않음"], "x": ["is worth two in the bush는 ‘덤불 속의 두 마리만큼의 가치가 있다’라는 뜻이다.", "worth는 형용사이지만 전치사처럼 바로 뒤에 목적어(명사)를 취한다.", "two 뒤에는 앞에 나온 birds가 반복을 피해 생략되었다."]}}, "src": "26년 10월 21번"};var S=P.sents,I=P.items,FLOW=P.flow.map(function(f){return [f.label,f.range,f.sum,f.eg];});

var cur="all";

function items(){
 var out="",seen={};
 S.forEach(function(s){
  var ids=[];s.mk.replace(/\[(\d+)\|/g,function(m,id){if(!seen[id]){seen[id]=1;ids.push(id);}});
  ids.forEach(function(id){var it=I[id];if(cur!="all"&&it.c!=cur)return;
   out+='<div class="it c-'+it.c+'" id="it'+id+'"><h4><span class="tl">'+it.t+'</span><span class="tag">'+CAT[it.c]+'</span></h4>';

  });
 });
 document.getElementById("items").innerHTML=out;
}
function hl2(s,id){return s.replace(/\[(\d+)\|([^\]]+)\]/g,function(m,i,t){return i==id?'<span class="hlk c-'+I[i].c+'">'+t+'</span>':t;});}
document.addEventListener("click",function(e){
