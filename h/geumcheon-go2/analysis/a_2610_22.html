<script>
var CAT={g:"어휘",o:"대명사",b:"연결어",k:"핵심 문장",p:"구문"};
var P={"num": "22", "sub": "고2 · 콘텐츠 제작자의 사회적 책임", "one": "영향력이 큰 콘텐츠 제작자는 상품 홍보를 넘어 사회적·환경적 책임을 고려하고 자신의 플랫폼을 긍정적 변화에 써야 한다는 것", "flow": [{"label": "도입부 = 주제", "range": "1번", "sum": "사회적·환경적 책임이 콘텐츠 제작자에게 점점 더 중요한 윤리적 고려 사항이 됨 <small>(ethical consideration)</small>", "eg": "구독자가 많은 유튜버일수록 영상 하나, 말 한마디를 더 조심하게 됨"}, {"label": "본론 (1)", "range": "2~3번", "sum": "사회·환경·지속가능성 문제에 대한 세계적 인식 증가로 제작자가 자기 작업의 더 넓은 영향을 고려하도록 요구받음, 곧 기후 변화·사회 정의·윤리적 소비 같은 주제를 콘텐츠에서 다루는 것 <small>(broader impact)</small>", "eg": "먹방 영상에서 일회용기 대신 다회용기를 쓰는 모습을 보여 줌"}, {"label": "본론 (2)", "range": "4번", "sum": "제작자의 플랫폼은 시청자의 태도와 행동을 바꿀 수 있으므로, 그 플랫폼을 긍정적 변화를 위해 쓸 책임 <small>(use that platform for positive change)</small>", "eg": "인기 크리에이터가 분리수거 요령을 알려 주면 따라 하는 시청자가 많아짐"}, {"label": "예시", "range": "5번", "sum": "친환경 제품 홍보, 평등·정의 관련 대의 지지가 인식을 높이고 의미 있는 사회적 영향을 이끌어 냄 <small>(raise awareness)</small>", "eg": "기부 캠페인 영상 하나로 많은 시청자가 함께 참여하게 됨"}, {"label": "결론", "range": "6번", "sum": "윤리적 제작자는 홍보에만 집중하지 않고 자신이 지지하는 가치와 대의를 고려해 콘텐츠를 자신의 원칙과 일치시킴 <small>(aligns with their principles)</small>", "eg": "환경을 강조해 온 크리에이터가 환경에 해로운 제품 광고는 거절함"}], "sents": [{"n": 1, "mk": "[1|Social and environmental responsibility] [2|has become] an [3|increasingly important] [4|ethical consideration] for content creators.", "ko": "사회적 그리고 환경적 책임은 콘텐츠 제작자들에게 점점 더 중요한 윤리적 고려 사항이 되어 왔다.", "star": true}, {"n": 2, "mk": "[5|As] global [6|awareness] of social, environmental, and [7|sustainability] issues grows, many content creators [8|are being called upon to consider] [9|the broader impact of their work].", "ko": "사회적, 환경적, 그리고 지속가능성 문제들에 대한 전 세계적인 인식이 커짐에 따라, 많은 콘텐츠 제작자들은 자신의 작업의 더 폭넓은 영향력을 고려하도록 요구받고 있다.", "star": true}, {"n": 3, "mk": "[10|This] [11|includes addressing] topics [12|such as] climate change, social justice, and [13|ethical consumerism] in their content.", "ko": "이것은 그들의 콘텐츠에서 기후 변화, 사회 정의, 그리고 윤리적 소비주의와 같은 주제들을 다루는 것을 포함한다.", "star": true}, {"n": 4, "mk": "Content creators have [14|a platform] [15|that can influence]
