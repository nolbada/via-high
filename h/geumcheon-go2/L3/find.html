</style><link rel="icon" type="image/svg+xml" href="../icon.svg"><link rel="apple-touch-icon" href="../icon-180.png"><meta name="apple-mobile-web-app-title" content="금천고정답"></head><body><div class="wrap"><div class="top"><a class="back" href="../index.html">← 목록</a></div><h1 id="h"></h1><div class="sub">본문과 다른 문장을 찾아 눌러 보세요.</div><div class="how">문장을 누르면 본문 근거와 해설이 열려요. 본문과 다른 문장이면 초록색, 본문과 같은 내용이면 주황색으로 표시돼요. 맞는 문장도 눌러서 읽어 보면 본문이 더 잘 기억나요.</div><div class="nav" id="nav"></div><div id="root"></div><div class="foot">비타민 영어클리닉 · 금천고 영어II</div></div><script src="../parts.js?v=261019"></script><script src="../wrong.js?v=261019"></script><script>
var D={"n": "3", "title": "3과 There's More than One Way to Vote (투표하는 방법에는 여러 가지가 있다)", "parts": [["❶", "본문 ❶"], ["❷", "본문 ❷"], ["❸", "본문 ❸"], ["❹", "본문 ❹"], ["❺", "본문 ❺"], ["❻", "본문 ❻"], ["❼", "본문 ❼"]], "groups": [{"part": "❶", "title": "혼자 하는 선택과 집단 결정", "flow": "우리는 점심 상대부터 직업까지 삶에서 개인적인 선택을 많이 해요. 하지만 집단으로 결정해야 하는 상황도 많아요. 집단 결정은 의견이 제각각이라 개인 선택처럼 간단하지 않아요.", "items": [{"en": "In our lives, we make personal choices about things like who to eat lunch with and what career to pursue.", "ans": "T", "ko": "우리는 삶에서 누구와 점심을 먹을지, 어떤 직업을 추구할지 같은 일에 대해 개인적인 선택을 한다.", "eve": "We make many personal choices in our lives, from who to have lunch with to what career to pursue.", "evk": "우리는 누구와 점심을 먹을 것인지부터 어떠한 직업을 추구할 것인지까지 우리의 삶에서 많은 개인적인 선택을 한다.", "why": "**from who to have lunch with to what career to pursue(누구와 점심을 먹을지부터 어떤 직업을 추구할지까지)**가 개인적인 선택의 예예요. eat lunch with(함께 점심을 먹다)는 have lunch with(함께 점심을 먹다)의 다른 말이라서 문장과 내용이 같아요."}, {"en": "Situations in which we must make decisions as a group are very rare.", "ans": "F", "ko": "우리가 집단으로 결정을 내려야 하는 상황은 매우 드물다.", "eve": "However, there are many situations where we must make decisions as a group.", "evk": "하지만, 우리가 집단으로서 결정을 내려야 하는 상황들이 많이 있다.", "why": "본문은 **there are many situations where we must make decisions as a group(집단으로서 결정을 내려야 하는 상황들이 많이 있다)**이에요. very rare(매우 드문)는 many(많은)와 정반대예요. However(하지만)로 화제를 개인 선택에서 집단 결정으로 돌린 문장이에요."}, {"en": "Group decision-making is not as simple as personal choice because many people with different opinions are involved.", "ans": "T", "ko": "집단 의사 결정은 서로 다른 의견을 가진 많은 사람이 얽혀 있기 때문에 개인적인 선택만큼 간단하지 않다.", "eve": "Group decision-making is not as simple as our personal choices, as it involves numerous voices with differing opinions.", "evk": "집단 의사 결정은 다른 의견을 가진 수많은 목소리를 수반하기 때문에 우리의 개인적인 선택들만큼 간단하지 않다.", "why": "**not as simple as our personal choices(우리의 개인적인 선택들만큼 간단하지 않다)**와 같아요. 이유는 **numerous voices with differing opinions(다른 의견을 가진 수많은 목소리)** 때문이에요. 여러 사람의 의견이 부딪히니 혼자 고르는 것보다 어렵다는 흐름이에요."}]}, {"part": "❶", "title": "다양한 투표 방법", "flow": "투표는 집단 결정을 더 공정하고 효율적으로 만들려고 흔히 쓰여요. 시간이 흐르면서 투표 방법도 여러 가지로 개발되어 왔어요. 이어지는 이야기는 그 방법들이 어떻게 쓰이는지 보여 줘요.", "items": [{"en": "Voting is often used to make group decisions fairer and more efficient.", "ans": "T", "ko": "투표는 집단 결정을 더 공정하고 더 효율적으로 만들기 위해 흔히 쓰인다.", "eve": "Voting is often used to make group decisions fairer and more efficient, and various voting methods have been developed over time.", "evk": "투표는 흔히 집단 의사 결정을 더 공정하고 더 효율적으로 만들기 위해 사용되며, 시간이 흐르면서 다양한 투표 방법이 개발되어 왔다.", "why": "**to make group decisions fairer and more efficient(집단 결정을 더 공정하고 더 효율적으로 만들기 위해)**가 투표의 쓰임새예요. fairer(더 공정한)와 more efficient(더 효율적인)가 그대로 나오는 맞는 문장이에요."}, {"en": "Since voting began, no new voting methods have been developed.", "ans": "F", "ko": "투표가 시작된 이후로 새로운 투표 방법은 하나도 개발되지 않았다.", "eve": "Voting is often used to make group decisions fairer and more efficient, and various voting methods have been developed over time.", "evk": "투표는 흔히 집단 의사 결정을 더 공정하고 더 효율적으로 만들기 위해 사용되며, 시간이 흐르면서 다양한 투표 방법이 개발되어 왔다.", "why": "본문은 **various voting methods have been developed over time(시간이 흐르면서 다양한 투표 방법이 개발되어 왔다)**이에요. no new voting methods(새로운 투표 방법이 하나도 없다)는 정반대예요. 이 말이 있어야 뒤에 나오는 여러 투표 방식 이야기로 자연스럽게 이어져요."}]}, {"part": "❷", "title": "모금 방법을 정해야 하는 자치회", "flow": "Greenville 고등학교 학생 자치회는 어려움에 처한 아이들을 위한 모금 방법을 정해야 했어요. 선택지는 미술 전시회, 빵 바자회, 자선 콘서트 세 가지였는데 의견이 엇갈렸어요. 그래서 투표로 정하기로 했어요.", "items": [{"en": "The Greenville High School student council had to decide how to raise money for children in need.", "ans": "T", "ko": "Greenville 고등학교 학생 자치회는 어려움에 처한 아이들을 위해 어떻게 모금할지 결정해야 했다.", "eve": "The members of the Greenville High School student council needed to decide how to raise money for children in need.", "evk": "Greenville 고등학교 학생 자치회의 구성원들은 어려움에 처한 아이들을 위해 모금할 방법을 결정해야 했다.", "why": "**needed to decide how to raise money for children in need(어려움에 처한 아이들을 위해 모금할 방법을 결정해야 했다)**를 had to decide(결정해야 했다)로 바꿔 쓴 맞는 문장이에요. needed to(~해야 했다)와 had to(~해야 했다)는 뜻이 같아요."}, {"en": "The council’s three options were an art show, a bake sale, and a school festival.", "ans": "F", "ko": "자치회의 세 가지 선택지는 미술 전시회, 빵 바자회, 그리고 학교 축제였다.", "eve": "Their three options were an art show, a bake sale, and a charity concert, but there were conflicting opinions.", "evk": "그들의 세 가지 선택지는 미술 전시회, 빵 바자회, 그리고 자선 콘서트였지만, 상충되는 의견들이 있었다.", "why": "본문의 세 번째 선택지는 **a charity concert(자선 콘서트)**예요. a school festival(학교 축제)은 본문에 나오지 않아요. an art show(미술 전시회), a bake sale(빵 바자회)까지는 맞고, 마지막 하나만 바뀐 문장이에요."}, {"en": "Because the council members’ opinions conflicted, they decided to settle the matter by voting.", "ans": "T", "ko": "자치회 구성원들의 의견이 엇갈렸기 때문에, 그들은 투표로 그 문제를 해결하기로 했다.", "eve": "Their three options were an art show, a bake sale, and a charity concert, but there were conflicting opinions. So they decided to put it to a vote.", "evk": "그들의 세 가지 선택지는 미술 전시회, 빵 바자회, 그리고 자선 콘서트였지만, 상충되는 의견들이 있었다. 그래서 그들은 그것을 투표에 부치기로 결정했다.", "why": "**there were conflicting opinions(상충되는 의견들이 있었다)** 다음에 **So they decided to put it to a vote(그래서 그들은 그것을 투표에 부치기로 결정했다)**가 이어져요. So(그래서)가 원인과 결과를 이어 주고, put it to a vote(투표에 부치다)를 settle the matter by voting(투표로 문제를 해결하다)으로 풀어 쓴 맞는 문장이에요."}]}, {"part": "❷", "title": "Akers 선생님의 조언", "flow": "자치회는 고문 교사인 Akers 선생님께 조언을 구했어요. 선생님은 익숙한 투표 방법 대신 다른 방법을 시도해 보라고 권했어요.", "items": [{"en": "Ms. Akers encouraged the council to try a different voting method instead of the familiar one.", "ans": "T", "ko": "Akers 선생님은 자치회가 익숙한 방법 대신 다른 투표 방법을 시도해 보라고 권했다.", "eve": "When they asked for advice from Ms. Akers, the council’s advisor, she encouraged them not to use the familiar voting method, but to try something different instead.", "evk": "그들이 자치회의 고문 교사인 Akers 선생님에게 조언을 구했을 때, 그녀는 익숙한 투표 방법을 사용하지 말고, 대신 다른 것을 시도해 보라고 권장했다.", "why": "**encouraged them not to use the familiar voting method, but to try something different instead(익숙한 투표 방법을 쓰지 말고 대신 다른 것을 시도해 보라고 권장했다)**와 같아요. 본문의 something different(다른 것)를 a different voting method(다른 투표 방법)로 바꿔 쓴 맞는 문장이에요."}, {"en": "Ms. Akers, the council’s advisor, told the council members to keep using the familiar voting method.", "ans": "F", "ko": "자치회의 고문 Akers 선생님은 구성원들에게 익숙한 투표 방법을 계속 쓰라고 말했다.", "eve": "When they asked for advice from Ms. Akers, the council’s advisor, she encouraged them not to use the familiar voting method, but to try something different instead.", "evk": "그들이 자치회의 고문 교사인 Akers 선생님에게 조언을 구했을 때, 그녀는 익숙한 투표 방법을 사용하지 말고, 대신 다른 것을 시도해 보라고 권장했다.", "why": "본문은 **not to use the familiar voting method(익숙한 투표 방법을 사용하지 말라)**예요. keep using the familiar voting method(익숙한 투표 방법을 계속 쓰라)는 정반대예요. 선생님이 새로운 방법을 시도해 보라고 한 것이 이야기의 출발점이에요."}]}, {"part": "❷", "title": "세 가지 투표 방식과 궁금증", "flow": "자치회는 조사를 한 뒤 세 가지 투표 방식을 써 보기로 했어요. 그 세 가지는 FPTP, AV, 콩도르세 방식이에요. 방식이 달라지면 결과도 달라질지 모두가 궁금해했어요.", "items": [{"en": "After doing some research, the council members decided to try five different voting systems.", "ans": "F", "ko": "약간의 조사를 한 후, 자치회 구성원들은 다섯 가지의 다른 투표 시스템을 시도해 보기로 결정했다.", "eve": "After doing some research, the council members decided to try three different voting systems: the first-past-the-post (FPTP) method, the alternative vote (AV) method, and the Condorcet method.", "evk": "약간의 조사를 한 후, 자치회 구성원들은 단순 다수결(FPTP) 방식, 대안 투표(AV) 방식, 그리고 콩도르세 방식이라는 세 가지의 다른 투표 시스템을 시도해 보기로 결정했다.", "why": "본문은 **three different voting systems(세 가지의 다른 투표 시스템)**예요. five(다섯)는 틀려요. 세 가지는 the first-past-the-post (FPTP) method(단순 다수결 방식), the alternative vote (AV) method(대안 투표 방식), the Condorcet method(콩도르세 방식)예요."}, {"en": "The entire council was curious whether the different methods would produce different results.", "ans": "T", "ko": "자치회 전체는 서로 다른 방법이 서로 다른 결과를 낳을지 궁금해했다.", "eve": "The entire council was curious to find out if the different methods would yield different results.", "evk": "모든 자치회 구성원들은 각각 다른 방법이 서로 다른 결과를 낼지 궁금해했다.", "why": "**curious to find out if the different methods would yield different results(각각 다른 방법이 서로 다른 결과를 낼지 알아내고 싶어 했다)**와 같아요. yield(내다, 산출하다)를 produce(낳다)로, if(~인지)를 whether(~인지)로 바꿔 쓴 맞는 문장이에요."}]}, {"part": "❸", "title": "선택지에 글자 붙이기", "flow": "투표 당일에는 각 행사에 글자가 하나씩 붙었어요. 미술 전시회는 A, 빵 바자회는 B, 자선 콘서트는 C예요. 이 글자 덕분에 순위를 짧게 적을 수 있어요.", "items": [{"en": "On the day of the vote, the letter A stood for the art show, B for the bake sale, and C for the charity concert.", "ans": "T", "ko": "투표 당일, 글자 A는 미술 전시회를, B는 빵 바자회를, C는 자선 콘서트를 나타냈다.", "eve": "On the day of the vote, each possible event was given a letter: “art show” was represented by the letter A, the letter B indicated “bake sale,” and C stood for “charity concert.”", "evk": "투표 당일, 각각의 가능한 행사에 글자가 하나씩 부여되었다. ‘미술 전시회’는 글자 A로 표시되었고, 글자 B는 ‘빵 바자회’를 나타냈으며, C는 ‘자선 콘서트’를 의미했다.", "why": "**“art show” was represented by the letter A(‘미술 전시회’는 글자 A로 표시되었다)**, **the letter B indicated “bake sale”(글자 B는 ‘빵 바자회’를 나타냈다)**, **C stood for “charity concert”(C는 ‘자선 콘서트’를 의미했다)**와 모두 같아요. stand for(~을 의미하다)와 indicate(나타내다)는 비슷한 뜻이에요."}, {"en": "The letter A was given to the bake sale, and the letter B was given to the art show.", "ans": "F", "ko": "글자 A는 빵 바자회에, 글자 B는 미술 전시회에 부여되었다.", "eve": "On the day of the vote, each possible event was given a letter: “art show” was represented by the letter A, the letter B indicated “bake sale,” and C stood for “charity concert.”", "evk": "투표 당일, 각각의 가능한 행사에 글자가 하나씩 부여되었다. ‘미술 전시회’는 글자 A로 표시되었고, 글자 B는 ‘빵 바자회’를 나타냈으며, C는 ‘자선 콘서트’를 의미했다.", "why": "본문은 **“art show” was represented by the letter A(‘미술 전시회’는 글자 A로 표시되었다)**예요. A와 B가 서로 바뀌었어요. 이 글자 대응은 뒤의 투표 결과를 읽을 때 계속 쓰이니 꼭 기억해 두세요."}]}, {"part": "❸", "title": "순위를 적은 투표용지", "flow": "20명의 자치회 구성원은 각자 투표용지를 받았어요. 선호하는 순서대로 선택지를 적는 방식이에요. 예를 들어 자선 콘서트, 빵 바자회, 미술 전시회 순이면 CBA라고 적어요. 모두 투표한 뒤에 표를 집계했어요.", "items": [{"en": "Each of the 20 council members was told to write the options in the order they preferred.", "ans": "T", "ko": "20명의 자치회 구성원 각각은 자신이 선호하는 순서대로 선택지를 적으라는 지시를 받았다.", "eve": "Each of the 20 council members was given a voting slip and instructed to write down the options in order of preference.", "evk": "20명의 자치회 구성원들 각각은 투표용지를 받았고, 선호하는 순서대로 선택지를 적으라는 지시를 받았다.", "why": "**instructed to write down the options in order of preference(선호하는 순서대로 선택지를 적으라는 지시를 받았다)**와 같아요. instructed(지시를 받은)를 was told to(~하라는 말을 들었다)로, in order of preference(선호 순서대로)를 풀어 쓴 맞는 문장이에요."}, {"en": "A member whose first choice was the charity concert, followed by the bake sale and the art show, would write CBA.", "ans": "T", "ko": "첫 번째 선택이 자선 콘서트이고 그다음이 빵 바자회, 미술 전시회인 구성원은 CBA를 적을 것이다.", "eve": "For example, if the charity concert was their first choice, followed by the bake sale and the art show, they would write CBA.", "evk": "예를 들어, 자선 콘서트가 첫 번째 선택이고 빵 바자회와 미술 전시회가 뒤따른다면, 그들은 CBA를 적을 것이다.", "why": "**if the charity concert was their first choice, followed by the bake sale and the art show, they would write CBA(자선 콘서트가 첫 번째 선택이고 빵 바자회와 미술 전시회가 뒤따른다면 CBA를 적을 것이다)**와 같아요. C는 자선 콘서트, B는 빵 바자회, A는 미술 전시회라서 순서대로 쓰면 CBA가 돼요."}, {"en": "The voting slips were counted before every member had voted.", "ans": "F", "ko": "투표용지는 모든 구성원이 투표를 하기 전에 집계되었다.", "eve": "After every member had voted, the voting slips were counted.", "evk": "모든 구성원이 투표를 마친 후, 투표용지가 집계되었다.", "why": "본문은 **After every member had voted, the voting slips were counted(모든 구성원이 투표를 마친 후, 투표용지가 집계되었다)**예요. 순서가 거꾸로 바뀌었어요. After(~한 후에)와 before(~하기 전에)를 바꿔 놓은 문장이에요."}]}, {"part": "❹", "title": "가장 간단한 FPTP 방식", "flow": "FPTP는 세 가지 중 가장 간단한 방식이에요. 1지망 표를 가장 많이 얻은 선택지가 이겨요. 2지망과 3지망은 무시하고, 전 세계 정치 선거에서 흔히 쓰여요.", "items": [{"en": "Of the three methods, the FPTP method is the simplest.", "ans": "T", "ko": "세 가지 방식 중에서 FPTP 방식이 가장 간단하다.", "eve": "The FPTP method is the simplest of the three methods.", "evk": "FPTP 방식은 세 가지 방식 중 가장 간단하다.", "why": "**the simplest of the three methods(세 가지 방식 중 가장 간단한 것)**와 같아요. simplest(가장 간단한)는 simple(간단한)의 최상급이에요. 세 방식 가운데 가장 쉬운 방식부터 소개하는 흐름이에요."}, {"en": "In the FPTP method, the option with the most second-preference votes wins.", "ans": "F", "ko": "FPTP 방식에서는 2지망 표를 가장 많이 얻은 선택지가 이긴다.", "eve": "Voters are given several options, and whichever gets the most first-preference votes wins.", "evk": "투표자들에게는 여러 가지 선택지가 주어지고, 어떤 것이든 가장 많은 1지망 표를 얻은 것이 이긴다.", "why": "본문은 **whichever gets the most first-preference votes wins(어떤 것이든 가장 많은 1지망 표를 얻은 것이 이긴다)**예요. second-preference(2지망)가 아니라 first-preference(1지망)가 기준이에요."}, {"en": "In the FPTP method, second and third preferences are ignored because they do not matter at all.", "ans": "T", "ko": "FPTP 방식에서는 2지망과 3지망이 전혀 중요하지 않기 때문에 무시된다.", "eve": "Neither the second nor third preference matters at all, so they are ignored.", "evk": "2지망도 3지망도 둘 다 전혀 중요하지 않으므로, 그것들은 무시된다.", "why": "**Neither the second nor third preference matters at all, so they are ignored(2지망도 3지망도 전혀 중요하지 않으므로 무시된다)**와 같아요. so(그래서)가 이유와 결과를 이어 주고, Neither A nor B(A도 B도 둘 다 아니다)는 둘 다 부정하는 표현이에요."}, {"en": "The FPTP method is rarely used in political elections around the world.", "ans": "F", "ko": "FPTP 방식은 전 세계 정치 선거에서 좀처럼 사용되지 않는다.", "eve": "This method is commonly used in political elections around the world.", "evk": "이 방식은 전 세계 정치 선거에서 흔히 사용된다.", "why": "본문은 **commonly used in political elections around the world(전 세계 정치 선거에서 흔히 사용된다)**예요. rarely used(좀처럼 사용되지 않는)는 commonly used(흔히 사용되는)와 정반대예요."}]}, {"part": "❹", "title": "FPTP의 결과: 자선 콘서트 승리", "flow": "FPTP로 세어 보니 자선 콘서트(C)가 이기는 것이 금방 정해졌어요. C는 8표, A는 5표, B는 7표를 받았어요.", "items": [{"en": "With the FPTP method, the council quickly determined that the charity concert, option C, would win.", "ans": "T", "ko": "FPTP 방식에서 자치회는 자선 콘서트인 선택지 C가 이길 것이라는 점을 빠르게 알아냈다.", "eve": "The student council quickly determined that the winner would be option C, the charity concert.", "evk": "학생 자치회는 빠르게 자선 콘서트인 선택지 C가 승자가 될 것임을 알아냈다.", "why": "**quickly determined that the winner would be option C, the charity concert(자선 콘서트인 선택지 C가 승자가 될 것임을 빠르게 알아냈다)**와 같아요. determine(알아내다, 결정하다)이 쓰였고, winner(승자)를 win(이기다)으로 바꿔 쓴 맞는 문장이에요."}, {"en": "Option C received 8 first-preference votes, while option A received 7 and option B received 5.", "ans": "F", "ko": "선택지 C는 1지망 표를 8표 받은 반면, 선택지 A는 7표, 선택지 B는 5표를 받았다.", "eve": "This was because it received 8 first-preference votes, while option A received 5 and option B received 7.", "evk": "이는 선택지 A는 5표, 선택지 B는 7표를 받은 반면, 그것은 8표의 1지망 표를 받았기 때문이었다.", "why": "본문은 **option A received 5 and option B received 7(선택지 A는 5표, 선택지 B는 7표를 받았다)**이에요. A와 B의 표 수가 서로 바뀌었어요. C 8표는 맞고, 합치면 8+5+7=20표로 구성원 수와 같아요."}, {"en": "Option B received more first-preference votes than option A.", "ans": "T", "ko": "선택지 B는 선택지 A보다 더 많은 1지망 표를 받았다.", "eve": "This was because it received 8 first-preference votes, while option A received 5 and option B received 7.", "evk": "이는 선택지 A는 5표, 선택지 B는 7표를 받은 반면, 그것은 8표의 1지망 표를 받았기 때문이었다.", "why": "본문은 A가 **5(5표)**, B가 **7(7표)**이에요. 7이 5보다 크니까 B가 A보다 많은 표를 받은 맞는 문장이에요. while(~인 반면)은 세 선택지의 표 수를 대비해서 보여 주는 말이에요."}]}, {"part": "❹", "title": "FPTP의 약점", "flow": "FPTP는 복잡하지 않고 이해하기 쉽지만 큰 약점이 있어요. 과반수의 지지가 없어도 이길 수 있다는 점이에요. 이번 투표가 바로 그런 경우였어요.", "items": [{"en": "The FPTP method is easy to understand, but it has a significant weakness.", "ans": "T", "ko": "FPTP 방식은 이해하기 쉽지만 상당한 약점을 가지고 있다.", "eve": "The FPTP method is uncomplicated and easy to understand, but it has a significant weakness.", "evk": "FPTP 방식은 복잡하지 않고 이해하기 쉽지만, 상당한 약점을 가지고 있다.", "why": "**uncomplicated and easy to understand, but it has a significant weakness(복잡하지 않고 이해하기 쉽지만, 상당한 약점을 가지고 있다)**와 같아요. but(하지만) 앞은 장점, 뒤는 약점으로 대비돼요."}, {"en": "Under the FPTP method, an option cannot win a vote without the support of the majority.", "ans": "F", "ko": "FPTP 방식에서는 과반수의 지지 없이는 투표에서 이길 수 없다.", "eve": "It is possible to win a vote without the support of the majority.", "evk": "과반수의 지지 없이도 투표에서 승리하는 것이 가능하다.", "why": "본문은 **It is possible to win a vote without the support of the majority(과반수의 지지 없이도 투표에서 승리하는 것이 가능하다)**예요. cannot win(이길 수 없다)은 possible(가능한)과 정반대예요. 이것이 바로 앞에서 말한 FPTP의 약점이에요."}, {"en": "In this vote, the winning option won without the support of the majority.", "ans": "T", "ko": "이번 투표에서 승리한 선택지는 과반수의 지지 없이 이겼다.", "eve": "It is possible to win a vote without the support of the majority. That was the case here.", "evk": "과반수의 지지 없이도 투표에서 승리하는 것이 가능하다. 이것이 바로 그런 경우였다.", "why": "**It is possible to win a vote without the support of the majority. That was the case here(과반수의 지지 없이도 이길 수 있는데, 이것이 바로 여기서의 경우였다)**와 같아요. That was the case here(이것이 바로 그런 경우였다)가 이번 투표가 약점의 실제 사례라는 뜻이에요."}]}, {"part": "❹", "title": "8표는 전체의 40%", "flow": "FPTP 결과에 따라 자치회의 선택은 자선 콘서트가 되었어요. 그런데 20명 중 1지망으로 고른 사람은 8명뿐이었어요. 이는 전체 표의 40%예요.", "items": [{"en": "The 8 council members who chose the charity concert made up 60% of the total votes.", "ans": "F", "ko": "자선 콘서트를 고른 8명의 자치회 구성원은 전체 표의 60%를 차지했다.", "eve": "However, only 8 out of 20 council members chose the charity concert as their first preference, which equaled 40% of the total votes.", "evk": "하지만 20명의 자치회 구성원 중 8명만이 1지망으로 자선 콘서트를 골랐는데, 이는 전체 표의 40%에 해당했다.", "why": "본문은 **which equaled 40% of the total votes(전체 표의 40%에 해당했다)**예요. 8÷20=0.4라서 40%가 맞아요. 60%는 틀려요. 과반수(50% 초과)가 아니라는 점이 FPTP의 약점으로 이어져요."}, {"en": "Only 8 of the 20 council members chose the charity concert as their first preference.", "ans": "T", "ko": "20명의 자치회 구성원 중 8명만이 자선 콘서트를 1지망으로 골랐다.", "eve": "However, only 8 out of 20 council members chose the charity concert as their first preference, which equaled 40% of the total votes.", "evk": "하지만 20명의 자치회 구성원 중 8명만이 1지망으로 자선 콘서트를 골랐는데, 이는 전체 표의 40%에 해당했다.", "why": "**only 8 out of 20 council members chose the charity concert as their first preference(20명 중 8명만이 1지망으로 자선 콘서트를 골랐다)**와 같아요. However(하지만)로 시작해서 앞의 승리 결과와 반대되는 사실을 알려 주는 문장이에요."}]}, {"part": "❺", "title": "AV 방식과 1차 집계", "flow": "자치회는 이번에는 AV 방식으로 표를 살펴보았고, 결과가 달라질 것임을 곧 깨달았어요. AV는 집계를 여러 차례 할 수 있어요. 1지망 표가 50%를 넘어야 1차에서 이기는데, 자선 콘서트는 40%뿐이라 2차 집계가 필요했어요.", "items": [{"en": "The council members soon realized that the AV method would give a different result.", "ans": "T", "ko": "자치회 구성원들은 AV 방식이 다른 결과를 낼 것이라는 점을 곧 깨달았다.", "eve": "Next, the council members examined the votes using the AV method, and they soon realized that there would be a different result.", "evk": "다음으로, 자치회 구성원들은 AV 방식을 사용하여 표를 검토했고, 그들은 곧 다른 결과가 나올 것이라는 것을 깨달았다.", "why": "**they soon realized that there would be a different result(그들은 곧 다른 결과가 나올 것이라는 것을 깨달았다)**와 같아요. Next(다음으로)로 FPTP 다음 방식을 소개하고, 결과가 달라질 것이라는 예고를 하는 문장이에요."}, {"en": "The AV method always ends after just one round of counting.", "ans": "F", "ko": "AV 방식은 언제나 단 한 차례의 집계로 끝난다.", "eve": "The AV method can potentially include more than one round of counting.", "evk": "AV 방식은 잠재적으로 한 차례 이상의 집계를 포함할 수 있다.", "why": "본문은 **can potentially include more than one round of counting(잠재적으로 한 차례 이상의 집계를 포함할 수 있다)**이에요. always ends after just one round(언제나 한 차례 뒤에 끝난다)는 틀려요. 실제로 이번에는 2차 집계까지 갔어요."}, {"en": "To win in the first round of the AV method, an option needs more than 50% of the first-preference votes.", "ans": "T", "ko": "AV 방식에서 1차 집계에서 이기려면 선택지가 1지망 표의 50%를 넘게 얻어야 한다.", "eve": "For an option to win in the first round, it needs to get more than 50% of the first-preference votes.", "evk": "어떤 선택지가 1차 집계에서 승리하기 위해서는, 1지망 표의 50% 이상을 얻어야 한다.", "why": "**For an option to win in the first round, it needs to get more than 50% of the first-preference votes(1차 집계에서 승리하려면 1지망 표의 50% 이상을 얻어야 한다)**와 같아요. 이 기준 때문에 40%를 받은 자선 콘서트는 1차에서 이기지 못해요."}, {"en": "Because the charity concert received 40% of the total votes, the council did not need a second round of counting.", "ans": "F", "ko": "자선 콘서트가 전체 표의 40%를 받았기 때문에 자치회는 2차 집계가 필요하지 않았다.", "eve": "As the charity concert only received 40% of the total votes, a second round of counting was required.", "evk": "자선 콘서트는 전체 표의 40%만을 받았기 때문에, 2차 집계가 필요했다.", "why": "본문은 **a second round of counting was required(2차 집계가 필요했다)**예요. 40%는 50%에 못 미쳐서 1차에서 승자가 나오지 않았기 때문이에요. did not need(필요하지 않았다)는 정반대예요."}]}, {"part": "❺", "title": "A 탈락과 표 재분배", "flow": "1지망 표가 가장 적은 A(미술 전시회)가 탈락했어요. A에 투표했던 5명의 표는 2지망에 따라 다시 나뉘었어요. 그 결과 B가 11표, C가 9표가 되어 빵 바자회가 이기게 되었어요.", "items": [{"en": "Option A, the art show, received the most first-preference votes, with 5 council members voting for it.", "ans": "F", "ko": "미술 전시회인 선택지 A는 5명의 자치회 구성원이 투표해서 가장 많은 1지망 표를 받았다.", "eve": "Option A, the art show, received the fewest first-preference votes, with only 5 council members voting for it.", "evk": "미술 전시회인 선택지 A는 오직 5명의 자치회 구성원들만 그것에 투표하며 가장 적은 1지망 표를 받았다.", "why": "본문은 **received the fewest first-preference votes(가장 적은 1지망 표를 받았다)**예요. the most(가장 많은)가 아니라 the fewest(가장 적은)가 맞아요. 5표는 A 5표, B 7표, C 8표 중에서 가장 적은 숫자예요."}, {"en": "After option A was eliminated, its 5 votes were redistributed according to the voters’ second preferences.", "ans": "T", "ko": "선택지 A가 제거된 뒤, A의 5표는 투표자들의 2지망에 따라 재분배되었다.", "eve": "Therefore, option A was eliminated, and the 5 council members’ votes were redistributed based on their second preferences.", "evk": "따라서 선택지 A는 제거되었고, 5명의 자치회 구성원들의 표가 그들의 두 번째 선호도에 따라 재분배되었다.", "why": "**option A was eliminated, and the 5 council members’ votes were redistributed based on their second preferences(선택지 A는 제거되었고 5명의 표는 그들의 두 번째 선호도에 따라 재분배되었다)**와 같아요. based on(~에 근거하여)을 according to(~에 따라)로 바꿔 쓴 맞는 문장이에요."}, {"en": "As a result of the redistribution, 4 votes were added to option C and 1 vote was added to option B.", "ans": "F", "ko": "재분배 결과, 선택지 C에 4표, 선택지 B에 1표가 합계에 추가되었다.", "eve": "As a result, 4 votes for option B (ABC) and 1 for option C (ACB) were added to the total.", "evk": "그 결과, 선택지 B에 4표(ABC), 선택지 C에 1표(ACB)가 합계에 추가되었다.", "why": "본문은 **4 votes for option B (ABC) and 1 for option C (ACB)(선택지 B에 4표(ABC), 선택지 C에 1표(ACB))**예요. B와 C가 서로 바뀌었어요. ABC는 A 다음 2지망이 B이고, ACB는 A 다음 2지망이 C라서 이렇게 나뉘어요."}, {"en": "After the redistribution, the bake sale had 11 votes and the charity concert had only 9, so the bake sale became the winner.", "ans": "T", "ko": "재분배 후 빵 바자회는 11표, 자선 콘서트는 9표밖에 얻지 못해서 빵 바자회가 승자가 되었다.", "eve": "This meant that option B had 11 total votes, while option C had only 9. As a result, the bake sale would be the winner.", "evk": "이것은 선택지 C는 9표밖에 얻지 못한 반면 선택지 B가 총 11표를 얻었다는 것을 의미했다. 결과적으로, 빵 바자회가 승자가 될 것이었다.", "why": "**option B had 11 total votes, while option C had only 9(선택지 B는 총 11표, 선택지 C는 9표밖에 얻지 못했다)**이고, **the bake sale would be the winner(빵 바자회가 승자가 될 것이었다)**예요. B는 7+4=11표, C는 8+1=9표라서 계산도 맞아요."}]}, {"part": "❺", "title": "AV 방식의 약점", "flow": "AV 방식도 완벽하지 않아요. 때로는 2지망 표가 1지망 표보다 더 큰 영향력을 갖기도 해요. 이번에 빵 바자회가 이긴 것도 주로 2지망 표 덕분이었어요.", "items": [{"en": "The AV method is perfect, unlike the FPTP method.", "ans": "F", "ko": "AV 방식은 FPTP 방식과 달리 완벽하다.", "eve": "Unfortunately, the AV method is not perfect either.", "evk": "안타깝게도, AV 방식도 완벽하지는 않다.", "why": "본문은 **the AV method is not perfect either(AV 방식도 완벽하지는 않다)**예요. either(~도 또한)는 앞서 FPTP에 약점이 있었던 것처럼 AV에도 약점이 있다는 뜻이에요. perfect(완벽한)라고 한 것은 틀려요."}, {"en": "The AV method can sometimes let second-preference votes have more influence than first-preference votes.", "ans": "T", "ko": "AV 방식은 때때로 2지망 표가 1지망 표보다 더 큰 영향력을 갖게 할 수 있다.", "eve": "It sometimes allows second-preference votes to have a greater influence than first-preference votes.", "evk": "그것은 때때로 2지망 표가 1지망 표보다 더 큰 영향력을 갖게 하기도 한다.", "why": "**It sometimes allows second-preference votes to have a greater influence than first-preference votes(때때로 2지망 표가 1지망 표보다 더 큰 영향력을 갖게 하기도 한다)**와 같아요. a greater influence(더 큰 영향력)를 more influence(더 많은 영향력)로 바꿔 쓴 맞는 문장이에요."}, {"en": "The bake sale won under the AV method mainly because of the second-preference votes it received.", "ans": "T", "ko": "빵 바자회는 AV 방식에서 주로 그것이 받은 2지망 표 덕분에 이겼다.", "eve": "In this case, the bake sale won, but this was mainly due to the second-preference votes it received.", "evk": "이 경우에는 빵 바자회가 승리했지만, 이는 주로 그것이 얻은 2지망 표 때문이었다.", "why": "**the bake sale won, but this was mainly due to the second-preference votes it received(빵 바자회가 승리했지만 이는 주로 그것이 얻은 2지망 표 때문이었다)**와 같아요. due to(~ 때문에)를 because of(~ 때문에)로 바꿔 쓴 맞는 문장이에요. 1지망은 7표였고 2지망에서 4표를 더 얻어서 이긴 거예요."}]}, {"part": "❻", "title": "콩도르세 방식: 두 선택지씩 비교", "flow": "마지막으로 자치회는 콩도르세 방식으로 표를 셌어요. 이 방식은 가능한 선택지 쌍마다 투표자들이 어느 쪽을 더 선호하는지 비교해요.", "items": [{"en": "The Condorcet method compares the voters’ preferences between each possible pair of options.", "ans": "T", "ko": "콩도르세 방식은 가능한 선택지 쌍마다 투표자들의 선호도를 비교한다.", "eve": "This method involves comparing the voters’ preferences between each possible pair of options.", "evk": "이 방식은 가능한 선택지 쌍에 대한 투표자들의 선호도를 비교하는 것을 수반한다.", "why": "**comparing the voters’ preferences between each possible pair of options(가능한 선택지 쌍에 대한 투표자들의 선호도를 비교하는 것)**와 같아요. 한 번에 전체 순위를 보는 것이 아니라 두 개씩 짝지어 맞붙이는 방식이에요."}, {"en": "The Condorcet method only counts the first-preference votes for each option.", "ans": "F", "ko": "콩도르세 방식은 각 선택지의 1지망 표만 센다.", "eve": "This method involves comparing the voters’ preferences between each possible pair of options.", "evk": "이 방식은 가능한 선택지 쌍에 대한 투표자들의 선호도를 비교하는 것을 수반한다.", "why": "본문은 이 방식이 **each possible pair of options(가능한 선택지 쌍마다)**에서 선호도를 비교한다고 해요. only counts the first-preference votes(1지망 표만 센다)는 FPTP 방식의 설명이에요."}]}, {"part": "❻", "title": "세 쌍과 A 대 B의 결과", "flow": "선택지가 셋이라 비교할 쌍은 A와 B, B와 C, A와 C의 세 쌍이에요. 먼저 A와 B를 비교하니 구성원들은 A를 11대 9로 더 선호했어요.", "items": [{"en": "There were three pairs to consider: A vs. B, B vs. C, and A vs. C.", "ans": "T", "ko": "고려해야 할 쌍은 세 쌍이었는데, A와 B, B와 C, A와 C였다.", "eve": "In this case, there were three pairs to consider: A vs. B, B vs. C, and A vs. C.", "evk": "이 경우에는, 고려해야 할 세 쌍이 있었는데, 그것은 바로 A와 B, B와 C, A와 C였다.", "why": "**there were three pairs to consider: A vs. B, B vs. C, and A vs. C(고려해야 할 세 쌍이 있었는데, A와 B, B와 C, A와 C였다)**와 같아요. vs.는 versus(~ 대 ~)의 줄임말이에요. 선택지 3개에서 2개씩 고르면 3쌍이 나와요."}, {"en": "The council members preferred option B to option A by a count of 11 to 9.", "ans": "F", "ko": "자치회 구성원들은 11대 9로 선택지 A보다 선택지 B를 선호했다.", "eve": "Through this method, the student council discovered that its members preferred option A to option B by a count of 11 to 9.", "evk": "이 방식을 통해, 학생 자치회는 구성원들이 11대 9로 선택지 B보다 선택지 A를 선호한다는 사실을 발견했다.", "why": "본문은 **preferred option A to option B by a count of 11 to 9(11대 9로 선택지 B보다 선택지 A를 선호했다)**예요. A와 B의 위치가 바뀌었어요. prefer A to B(B보다 A를 더 좋아하다)에서 앞에 오는 것이 더 선호하는 쪽이에요."}]}, {"part": "❻", "title": "A를 택한 11명과 B를 택한 9명", "flow": "A를 B보다 선호한 11명은 ABC, ACB, CAB로 적었어요. B를 A보다 선호한 9명은 BAC, BCA, CBA로 적었어요. 글자의 순서에서 A가 B보다 앞에 있는지 뒤에 있는지를 보면 돼요.", "items": [{"en": "Eleven people preferred A to B by voting ABC, ACB, or CAB.", "ans": "T", "ko": "11명은 ABC, ACB, 또는 CAB에 투표함으로써 B보다 A를 선호했다.", "eve": "In other words, 11 people preferred A to B, voting either ABC, ACB, or CAB.", "evk": "즉, 11명이 ABC, ACB, CAB 중 하나에 투표하며 B보다 A를 선호했다.", "why": "**11 people preferred A to B, voting either ABC, ACB, or CAB(11명이 ABC, ACB, CAB 중 하나에 투표하며 B보다 A를 선호했다)**와 같아요. 세 가지 모두 A가 B보다 앞에 있어서 A를 더 선호한다는 뜻이에요."}, {"en": "Eleven people preferred B to A by voting BAC, BCA, or CBA.", "ans": "F", "ko": "11명은 BAC, BCA, 또는 CBA에 투표함으로써 A보다 B를 선호했다.", "eve": "In other words, 11 people preferred A to B, voting either ABC, ACB, or CAB. Meanwhile, 9 people preferred B to A by voting BAC, BCA, or CBA.", "evk": "즉, 11명이 ABC, ACB, CAB 중 하나에 투표하며 B보다 A를 선호했다. 한편, 9명은 BAC, BCA 또는 CBA에 투표함으로써 A보다 B를 선호했다.", "why": "본문은 **9 people preferred B to A by voting BAC, BCA, or CBA(9명은 BAC, BCA, CBA에 투표함으로써 A보다 B를 선호했다)**예요. 11명이 아니라 9명이 맞아요. 11명은 A를 선호한 쪽이에요."}, {"en": "Nine people preferred B to A by voting BAC, BCA, or CBA.", "ans": "T", "ko": "9명은 BAC, BCA, 또는 CBA에 투표함으로써 A보다 B를 선호했다.", "eve": "Meanwhile, 9 people preferred B to A by voting BAC, BCA, or CBA.", "evk": "한편, 9명은 BAC, BCA 또는 CBA에 투표함으로써 A보다 B를 선호했다.", "why": "**Meanwhile, 9 people preferred B to A by voting BAC, BCA, or CBA(한편 9명은 BAC, BCA 또는 CBA에 투표함으로써 A보다 B를 선호했다)**와 같아요. Meanwhile(한편)이 앞의 11명과 대비되는 9명을 소개해요. 11+9=20명이라 구성원 수와 맞아요."}]}, {"part": "❻", "title": "B 대 C, A 대 C의 결과", "flow": "B와 C를 비교해도 11대 9로 B가 더 선호되었어요. A와 C를 비교해도 11대 9로 A가 더 선호되었어요.", "items": [{"en": "The voters preferred option B to option C by 11 to 9.", "ans": "T", "ko": "투표자들은 11대 9로 선택지 C보다 선택지 B를 선호했다.", "eve": "Interestingly, the voters preferred option B to option C by the same count of 11 to 9.", "evk": "흥미롭게도, 투표자들은 동일하게 11대 9로 선택지 C보다 선택지 B를 선호했다.", "why": "**the voters preferred option B to option C by the same count of 11 to 9(투표자들은 동일하게 11대 9로 선택지 C보다 선택지 B를 선호했다)**와 같아요. Interestingly(흥미롭게도)는 A와 B 때 나온 숫자와 똑같이 11대 9라서 붙은 말이에요."}, {"en": "The voters preferred option C to option A by 11 to 9.", "ans": "F", "ko": "투표자들은 11대 9로 선택지 A보다 선택지 C를 선호했다.", "eve": "They also preferred option A to option C by 11 to 9.", "evk": "그들은 또한 11대 9로 선택지 C보다 선택지 A를 선호했다.", "why": "본문은 **They also preferred option A to option C by 11 to 9(그들은 또한 11대 9로 선택지 C보다 선택지 A를 선호했다)**예요. A와 C의 위치가 바뀌었어요. also(또한)는 A가 B에 이어 C에게도 이겼다는 뜻이에요."}]}, {"part": "❻", "title": "두 선택지를 모두 이긴 A", "flow": "A는 나머지 두 선택지보다 모두 더 선호되었어요. 그래서 콩도르세 방식에서는 미술 전시회가 승자로 여겨져요.", "items": [{"en": "Option A, the art show, was preferred to both of the other options, so it would be considered the winner.", "ans": "T", "ko": "미술 전시회인 선택지 A는 나머지 두 선택지보다 모두 더 선호되었으므로 승자로 간주될 것이었다.", "eve": "As option A, the art show, was preferred to both of the other options, it would be considered the winner.", "evk": "미술 전시회인 선택지 A가 나머지 두 선택지보다 더 선호되었으므로, 이 선택지가 승자로 간주될 것이었다.", "why": "**As option A, the art show, was preferred to both of the other options, it would be considered the winner(선택지 A는 나머지 두 선택지보다 더 선호되었으므로 승자로 간주될 것이었다)**와 같아요. As(~이므로)가 이유를 나타내고, both of(둘 다)는 B와 C 모두를 뜻해요."}, {"en": "Option A, the art show, lost to option B in the pairwise comparison, so it was not considered the winner.", "ans": "F", "ko": "미술 전시회인 선택지 A는 쌍별 비교에서 선택지 B에게 져서 승자로 간주되지 않았다.", "eve": "Through this method, the student council discovered that its members preferred option A to option B by a count of 11 to 9. As option A, the art show, was preferred to both of the other options, it would be considered the winner.", "evk": "이 방식을 통해, 학생 자치회는 구성원들이 11대 9로 선택지 B보다 선택지 A를 선호한다는 사실을 발견했다. 미술 전시회인 선택지 A가 나머지 두 선택지보다 더 선호되었으므로, 이 선택지가 승자로 간주될 것이었다.", "why": "본문은 A가 **preferred to both of the other options(나머지 두 선택지보다 더 선호되었다)**라고 해요. A는 B에게 11대 9로 이겼으니 lost(졌다)는 틀려요. 그래서 A가 it would be considered the winner(승자로 간주될 것이었다)가 되는 거예요."}]}, {"part": "❻", "title": "콩도르세 방식의 약점", "flow": "콩도르세 방식은 복잡하고, 때로는 승자를 가려내지 못해요. 선택지가 많은 선거에서 특히 그래요. 어떤 선택지도 다른 선택지들보다 확실히 선호되지 않을 수 있기 때문이에요.", "items": [{"en": "Besides being complex, the Condorcet method sometimes fails to select a winner.", "ans": "T", "ko": "콩도르세 방식은 복잡할 뿐만 아니라 때때로 승자를 가려내지 못한다.", "eve": "The Condorcet method’s weakness is that, along with being complex, it sometimes fails to select a winner.", "evk": "콩도르세 방식의 약점은 복잡하다는 것과 더불어 때때로 승자를 가려내지 못한다는 점이다.", "why": "**along with being complex, it sometimes fails to select a winner(복잡하다는 것과 더불어 때때로 승자를 가려내지 못한다)**와 같아요. along with(~와 더불어)를 Besides(~ 외에도)로 바꿔 쓴 맞는 문장이에요. fail to(~하지 못하다)가 약점의 핵심이에요."}, {"en": "The Condorcet method always selects a winner, even in elections with numerous options.", "ans": "F", "ko": "콩도르세 방식은 선택지가 많은 선거에서도 언제나 승자를 가려낸다.", "eve": "The Condorcet method’s weakness is that, along with being complex, it sometimes fails to select a winner. This is especially true in elections that contain numerous options.", "evk": "콩도르세 방식의 약점은 복잡하다는 것과 더불어 때때로 승자를 가려내지 못한다는 점이다. 이는 많은 선택지를 포함하는 선거에서 특히 그렇다.", "why": "본문은 **sometimes fails to select a winner(때때로 승자를 가려내지 못한다)**예요. always selects(언제나 가려낸다)는 틀려요. 특히 **elections that contain numerous options(많은 선택지를 포함하는 선거)**에서 더 그렇다고 했어요."}, {"en": "It is possible that no option will be clearly preferred over the others in the Condorcet method.", "ans": "T", "ko": "콩도르세 방식에서는 어떤 선택지도 다른 선택지들보다 명확하게 선호되지 않을 수 있다.", "eve": "It is possible that no option will be clearly preferred over the others.", "evk": "어떤 선택지도 다른 선택지들보다 명확하게 선호되지 않을 수 있다.", "why": "**It is possible that no option will be clearly preferred over the others(어떤 선택지도 다른 선택지들보다 명확하게 선호되지 않을 수 있다)**와 같아요. 이런 경우에는 이긴 선택지가 없으니 승자를 가려내지 못하게 돼요."}]}, {"part": "❼", "title": "방식마다 달랐던 승자", "flow": "세 방식이 같은 선택지를 가리켰다면 결정이 쉬웠을 거예요. 하지만 방식마다 승자가 달랐어요. FPTP는 자선 콘서트, AV는 빵 바자회, 콩도르세는 미술 전시회예요.", "items": [{"en": "The winner differed with each method, so the council’s choice did not become easier.", "ans": "T", "ko": "방식마다 승자가 달랐기 때문에 자치회의 선택은 더 쉬워지지 않았다.", "eve": "Instead of all methods pointing toward a single option and making the council’s choice easier, the winner differed with each method.", "evk": "모든 방식이 하나의 선택지를 가리키고 자치회의 선택을 더 쉽게 만드는 대신, 각 방식마다 승자는 달랐다.", "why": "**Instead of all methods pointing toward a single option and making the council’s choice easier, the winner differed with each method(모든 방식이 하나의 선택지를 가리켜 선택을 더 쉽게 만드는 대신, 방식마다 승자가 달랐다)**와 같아요. Instead of(~ 대신에)가 기대와 실제를 대비시키는 말이에요."}, {"en": "All three methods pointed toward the same option, which made the council’s choice easier.", "ans": "F", "ko": "세 가지 방식 모두 같은 선택지를 가리켜서 자치회의 선택이 더 쉬워졌다.", "eve": "Instead of all methods pointing toward a single option and making the council’s choice easier, the winner differed with each method.", "evk": "모든 방식이 하나의 선택지를 가리키고 자치회의 선택을 더 쉽게 만드는 대신, 각 방식마다 승자는 달랐다.", "why": "본문은 **the winner differed with each method(방식마다 승자가 달랐다)**예요. 방식마다 다른 선택지가 이겨서 선택이 오히려 쉬워지지 않았어요. 실제로 승자는 C, B, A로 모두 달랐어요."}]}, {"part": "❼", "title": "콩도르세 방식 선택", "flow": "자치회는 Akers 선생님과 오랜 논의를 한 끝에 콩도르세 방식을 고르기로 했어요. 각 선택지를 다른 선택지들과 직접 비교한다는 점이 마음에 들었기 때문이에요.", "items": [{"en": "The council members chose the Condorcet method because they liked directly comparing each option with the others.", "ans": "T", "ko": "자치회 구성원들은 각 선택지를 다른 선택지들과 직접 비교한다는 점이 마음에 들어서 콩도르세 방식을 선택했다.", "eve": "After a long, intense discussion with Ms. Akers, the student council members decided to choose the Condorcet method, as they liked the idea of directly comparing each option with the others.", "evk": "Akers 선생님과의 오랜 열정적인 논의 끝에, 학생 자치회 구성원들은 콩도르세 방식을 선택하기로 결정했는데, 각 선택지를 다른 선택지들과 직접적으로 비교한다는 점이 마음에 들었기 때문이다.", "why": "**decided to choose the Condorcet method, as they liked the idea of directly comparing each option with the others(각 선택지를 다른 선택지들과 직접 비교한다는 점이 마음에 들었기 때문에 콩도르세 방식을 선택하기로 했다)**와 같아요. as(~이므로)가 이유를 이끌어요."}, {"en": "After a long, intense discussion with Ms. Akers, the council members decided to choose the AV method.", "ans": "F", "ko": "Akers 선생님과의 오랜 열정적인 논의 끝에, 자치회 구성원들은 AV 방식을 선택하기로 결정했다.", "eve": "After a long, intense discussion with Ms. Akers, the student council members decided to choose the Condorcet method, as they liked the idea of directly comparing each option with the others.", "evk": "Akers 선생님과의 오랜 열정적인 논의 끝에, 학생 자치회 구성원들은 콩도르세 방식을 선택하기로 결정했는데, 각 선택지를 다른 선택지들과 직접적으로 비교한다는 점이 마음에 들었기 때문이다.", "why": "본문에서 고른 방식은 **the Condorcet method(콩도르세 방식)**예요. the AV method(AV 방식)는 틀려요. 논의 상대가 Akers 선생님이라는 점과 논의가 길고 열정적이었다는 점은 맞아요."}]}, {"part": "❼", "title": "경험에서 배운 것", "flow": "모두가 이번 경험으로 여러 투표 시스템에 대해 많이 배웠다고 동의했어요. 이상적인 투표 방법을 고르는 일은 복잡하고 어려운 일이라는 점도 분명해졌어요.", "items": [{"en": "Everyone agreed that they had learned a lot about different voting systems through this experience.", "ans": "T", "ko": "모두가 이번 경험을 통해 서로 다른 투표 시스템에 대해 많은 것을 배웠다는 데 동의했다.", "eve": "Everyone agreed that they learned a lot about different voting systems through this experience.", "evk": "모두가 이번 경험을 통해 각기 다른 투표 시스템에 대해 많은 것을 배웠다는 것에 동의했다.", "why": "**Everyone agreed that they learned a lot about different voting systems through this experience(모두가 이번 경험을 통해 각기 다른 투표 시스템에 대해 많이 배웠다는 것에 동의했다)**와 같아요. learned a lot(많이 배웠다)은 뒤에서 말할 결론의 바탕이 돼요."}, {"en": "It is obvious that choosing an ideal voting method is a simple and easy task.", "ans": "F", "ko": "이상적인 투표 방법을 선택하는 것은 단순하고 쉬운 일이라는 것은 분명하다.", "eve": "It is obvious that choosing an ideal voting method is a complex and challenging task.", "evk": "이상적인 투표 방법을 선택하는 것은 복잡하고 도전적인 일이라는 것은 분명하다.", "why": "본문은 **a complex and challenging task(복잡하고 도전적인 일)**예요. simple and easy(단순하고 쉬운)는 정반대예요. obvious(분명한)는 같지만 그 뒤의 내용이 반대로 바뀌었어요."}]}, {"part": "❼", "title": "완벽한 투표 방식은 없다", "flow": "어떤 투표 시스템도 완벽하거나 다른 것보다 확실히 우수하지 않아요. 무엇을 고르든 장점과 단점이 함께 있어요.", "items": [{"en": "One voting system is flawless and clearly superior to all the others.", "ans": "F", "ko": "한 투표 시스템은 흠이 없고 다른 모든 시스템보다 명백히 우수하다.", "eve": "No voting system is flawless or clearly superior to another.", "evk": "어떤 투표 시스템도 완벽하거나 다른 시스템보다 명백히 우수하지는 않다.", "why": "본문은 **No voting system is flawless or clearly superior to another(어떤 투표 시스템도 완벽하거나 다른 시스템보다 명백히 우수하지는 않다)**예요. flawless(흠 없는)한 시스템이 있다는 말은 No voting system(어떤 시스템도 ~ 않다)과 정반대예요."}, {"en": "Whichever voting system we choose will have both advantages and disadvantages.", "ans": "T", "ko": "우리가 어떤 투표 시스템을 선택하든 장점과 단점이 모두 있을 것이다.", "eve": "Whichever we choose will have pros and cons.", "evk": "우리가 선택하는 어느 것이든 장단점이 있을 것이다.", "why": "**Whichever we choose will have pros and cons(우리가 선택하는 어느 것이든 장단점이 있을 것이다)**와 같아요. pros and cons(장단점)를 advantages and disadvantages(장점과 단점)로 바꿔 쓴 맞는 문장이에요."}]}, {"part": "❼", "title": "두 가지 입장", "flow": "어떤 사람들은 순위를 아예 매기지 않아서 과정을 단순하게 유지하는 것이 최선이라고 생각해요. 다른 사람들은 더 복잡한 방식이 더 정확한 결과를 낸다고 주장하며 새 방법을 계속 개발해요.", "items": [{"en": "Some people think it is best to keep the process simple by not ranking choices at all.", "ans": "T", "ko": "어떤 사람들은 선택지에 아예 순위를 매기지 않음으로써 과정을 단순하게 유지하는 것이 최선이라고 생각한다.", "eve": "Some people believe that it is best to keep the process simple by not ranking our choices at all.", "evk": "어떤 사람들은 우리들의 선택들에 아예 순위를 매기지 않음으로써 과정을 단순하게 유지하는 것이 최선이라고 생각한다.", "why": "**it is best to keep the process simple by not ranking our choices at all(우리의 선택들에 아예 순위를 매기지 않음으로써 과정을 단순하게 유지하는 것이 최선이다)**와 같아요. by -ing(~함으로써)가 방법을 나타내요."}, {"en": "Others have stopped developing new voting methods, even though they argue that more complex methods give more accurate results.", "ans": "F", "ko": "다른 사람들은 더 복잡한 방식이 더 정확한 결과를 낸다고 주장하면서도 새로운 투표 방법 개발을 멈췄다.", "eve": "Others continue to develop and test new ways of voting, arguing that more complex methods deliver more accurate results.", "evk": "다른 사람들은 더 복잡한 방식이 더 정확한 결과를 가져온다고 주장하며 계속해서 새로운 투표 방법을 개발하고 시험한 try{S=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){S={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function rich(p,s){var parts=s.split('**');parts.forEach(function(t,i){if(!t)return;if(i%2){var b=el('b',null,t);p.appendChild(b)}else p.appendChild(document.createTextNode(t))})}
document.getElementById('h').textContent=D.title+' · 본문과 다른 문장 찾기';
if(PART){var _n=el('div','sub','');_n.innerHTML='이번 범위: <b>'+PARTS.names.L3[PART]+'</b>';var _h=document.getElementById('h');_h.parentNode.insertBefore(_n,_h.nextSibling)}
var root=document.getElementById('root'),prog=el('span','prog','');
var nav=document.getElementById('nav');

var WNA='find';
function wnNote(host,mode){ /* host: 요소 뒤에 안내 줄 삽입 */
  var d=document.createElement('div');d.id='wnote';d.style.cssText='margin:8px 0;font-size:14px;color:#57534e';
  host.parentNode.insertBefore(d,host.nextSibling);return d}
function wnRender(d,fin){
  if(WN.MODE){
    d.innerHTML=WN.MIX?WN.mixNote(fin):'<b>오답 다시 풀기</b> · 오답 노트에 담은 문제만 보여요. <a href="../wrong.html" style="color:#0f766e;text-decoration:underline">오답 노트 보기 ›</a>'+(fin?'<div style="margin-top:6px">이제 안 봐도 되는 문제는 오답 노트에서 \'빼기\'로 뺄 수 있어요.</div>':'');
  }else{
    var n=WN.ids('L3',PART,WNA).length;
    d.innerHTML=n?'<a href="../wrong.html" style="font-size:13px;color:#0f766e;text-decoration:underline">틀린 '+n+'개가 오답 노트에 담겼어요 ›</a>':''}
}
function wnEmpty(host){
  var m=document.createElement('div');m.style.cssText='margin:24px 0;padding:18px;border:1px solid #d6d3d1;border-radius:12px;text-align:center;font-size:16px';
  m.innerHTML='오답 노트에 담긴 문제가 없어요.<div style="margin-top:8px"><a href="../wrong.html" style="color:#0f766e;text-decoration:underline">오답 노트로 가기 ›</a></div>';
  host.parentNode.insertBefore(m,host.nextSibling)}
var wn=wnNote(nav);wnRender(wn,false);
if(WEMPTY){nav.style.display='none';wnEmpty(wn)}
function wnItem(g){return{kind:'L3',part:PART,act:'find',qid:String(g._i),label:'본문 '+g.part+' · '+g.title}}
function wnMan(g){var m=g._wm;if(!m)return;m.innerHTML='';var b=WN.manual(wnItem(g));if(b)m.appendChild(b)}
function wnWrong(g){WN.add(wnItem(g));wnMan(g);wnRender(wn,false)}
var secs={};
D.parts.forEach(function(p){var b=el('button',null,p[1]);b.onclick=function(){secs[p[0]].scrollIntoView({behavior:'smooth',block:'start'})};nav.appendChild(b)});
var bClose=el('button','closeall','답 모두 닫기');bClose.onclick=function(){S={};save();paint();window.scrollTo({top:0,behavior:'smooth'})};nav.insertBefore(bClose,nav.firstChild);nav.appendChild(prog);
var cards=[];
D.parts.forEach(function(p){
  var h=el('h2',null,p[1]);root.appendChild(h);secs[p[0]]=h;
  D.groups.forEach(function(g,gi){
    if(g.part!==p[0])return;
    var card=el('div','grp'),head=el('div','gh');
    head.appendChild(el('div','gt',g.title));
    var cnt=el('span','cnt','');head.appendChild(cnt);card.appendChild(head);
    var nF=g.items.filter(function(i){return i.ans==='F'}).length;
    card.appendChild(el('div','ask',nF?('본문과 다른 문장이 '+nF+'개 있어요. 찾아서 눌러 보세요.'):'본문과 다른 문장이 있을 수도, 없을 수도 있어요. 모두 눌러서 확인해 보세요.'));
    var btns=[];
    g.items.forEach(function(it,ii){
      var b=el('div','it');b.setAttribute('role','button');b.tabIndex=0;
      var line=el('div');line.appendChild(el('span','no',(ii+1)+'.'));line.appendChild(document.createTextNode(' '+it.en));b.appendChild(line);
      var pn=el('div','pn');
      pn.appendChild(el('div','ko',it.ko));
      var ev=el('div','ev');ev.appendChild(el('span','e',it.eve));if(it.evk)ev.appendChild(el('span','k',it.evk));
      pn.appendChild(el('span','tag','본문 근거'));pn.appendChild(ev);
      pn.appendChild(el('span','tag','해설'));var w=el('div','why');rich(w,it.why);pn.appendChild(w);
      b.appendChild(pn);
      var id=gi+'-'+ii;
      function open(){
        if(b.classList.contains('open'))return;
        var fd=btns.filter(function(x){return S[x.id]&&x.it.ans==='F'}).length;
        if(it.ans==='T'&&fd<nF)wnWrong(g);
        S[id]=1;save();paint(true);
      }
      b.onclick=open;b.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}};
      card.appendChild(b);btns.push({b:b,id:id,it:it,pn:pn});
    });
    var tools=el('div','tools');
    var bAll=el('button',null,'나머지 해설 모두 열기');bAll.onclick=function(){var fd=btns.filter(function(x){return S[x.id]&&x.it.ans==='F'}).length;if(fd<nF)wnWrong(g);btns.forEach(function(x){S[x.id]=1});save();paint(true)};
    var bReset=el('button',null,'이 소단락 다시 하기');bReset.onclick=function(){btns.forEach(function(x){delete S[x.id]});save();paint()};
    tools.appendChild(bAll);tools.appendChild(bReset);card.appendChild(tools);var wm=el('div','wm');g._wm=wm;card.appendChild(wm);wnMan(g);
    var flow=el('div','flow');flow.appendChild(el('span','tag','이 소단락 정리'));flow.appendChild(document.createTextNode(g.flow));card.appendChild(flow);
    root.appendChild(card);
    cards.push({g:g,btns:btns,cnt:cnt,flow:flow,nF:nF});
  });
});
function paint(user){
  var done=0;
  cards.forEach(function(c){
    var found=0,all=true;
    c.btns.forEach(function(x){
      var o=!!S[x.id];
      x.b.classList.toggle('open',o);
      x.b.classList.remove('ok','no2');
      var old=x.b.querySelector('.badge');if(old)old.remove();
      if(o){
        var f=x.it.ans==='F';x.b.classList.add(f?'ok':'no2');
        if(f)found++;
        var bd=el('span','badge',f?'✔ 본문과 다른 문장 · 잘 찾았어요':'본문과 같은 내용이에요 · 맞는 문장');
        x.b.insertBefore(bd,x.pn);
      }
      if(!o)all=false;
    });
    var fin=found===c.nF&&(c.nF>0||c.btns.every(function(x){return !!S[x.id]}));
    c.cnt.textContent=c.nF?('다른 문장 '+found+'/'+c.nF+' 찾음'):(c.btns.every(function(x){return !!S[x.id]})?'모두 확인':'확인 중');
    c.cnt.classList.toggle('done',fin);
    c.flow.classList.toggle('on',fin);
    if(fin)done++;
  });
  prog.textContent='소단락 '+done+'/'+cards.length+' 확인';
  if(user&&cards.length&&done===cards.length&&!S._m){S._m=1;save();if(!WN.MODE){try{if(window.PG)PG.mark(PGK)}catch(e){}}}
  if(WN.MODE&&cards.length)wnRender(wn,done===cards.length);
}
paint();
</script><div style="height:64px"></div><a class="homefab" href="../index.html" style="position:fixed;right:12px;bottom:12px;z-index:9999;background:#0f766e;color:#fff;font:700 13px/1 sans-serif;padding:11px 14px;border-radius:22px;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.3)">⌂ 목록</a><script src="../../common/prog.js?v=261019"></script><script>if(!WN.MODE)PG.bar(PGK,"풀었어요")</script></body></html>
