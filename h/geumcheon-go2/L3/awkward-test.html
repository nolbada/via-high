<script>
var Q=[{"id": "ctx1", "kind": "ctx", "n": 1, "title": null, "tko": null, "paras": [[{"t": "We make many "}, {"t": "collective", "c": 1}, {"t": " choices in our lives, from who to have lunch with to what career to pursue. However, there are many situations where we must make decisions as a group. Group decision-making is not as simple as our personal choices, as it "}, {"t": "dismisses", "c": 2}, {"t": " numerous voices with differing opinions. Voting is often used to make group decisions "}, {"t": "fairer", "c": 3}, {"t": " and more efficient, and various voting methods have been developed over time. The following story illustrates how these different voting methods work."}], [{"t": "The members of the Greenville High School student council needed to decide how to raise money for children in need. Their three options were an art show, a bake sale, and a charity concert, but there were "}, {"t": "consistent", "c": 4}, {"t": " opinions. So they decided to put it to a vote. When they asked for advice from Ms. Akers, the council’s advisor, she encouraged them not to use the "}, {"t": "familiar", "c": 5}, {"t": " voting method, but to try something different instead. After doing some research, the council members decided to try three different voting systems: the first-past-the-post (FPTP) method, the alternative vote (AV) method, and the Condorcet method. The entire council was "}, {"t": "curious", "c": 6}, {"t": " to find out if the different methods would yield different results."}]], "items": [{"c": 1, "w": "collective", "r": "personal", "gw": "공동의", "gr": "개인적인", "fb": null, "fg": "We make many <span class=\"d\">personal</span> choices in our lives, from who to have lunch with to what career to pursue.", "ko": "우리는 누구와 점심을 먹을 것인지부터 어떠한 직업을 추구할 것인지까지 우리의 삶에서 많은 개인적인 선택을 한다.", "why": "<b>We make many personal choices in our lives(우리는 삶에서 많은 개인적인 선택을 한다)</b>가 원문이에요. 바로 이어서 from who to have lunch with to what career to pursue(누구와 점심을 먹을지부터 어떤 직업을 추구할지까지)처럼 혼자 정하는 일을 예로 들어요. 다음 문장이 However(하지만)로 &#x27;집단으로 결정해야 하는 상황&#x27;을 말하니, 앞은 개인의 선택이어야 대조가 돼요. collective (공동의)면 However가 어울리지 않아요."}, {"c": 2, "w": "dismisses", "r": "involves", "gw": "무시하다", "gr": "수반하다", "fb": null, "fg": "Group decision-making is not as simple as our personal choices, as it <span class=\"d\">involves</span> numerous voices with differing opinions.", "ko": "집단 의사 결정은 다른 의견을 가진 수많은 목소리를 수반하기 때문에 우리의 개인적인 선택들만큼 간단하지 않다.", "why": "<b>as it involves numerous voices with differing opinions(수많은 다른 의견의 목소리를 수반하기 때문에)</b>가 원문이에요. 집단 결정이 개인 선택만큼 단순하지 않은 이유는 여러 의견이 얽혀 있기 때문이에요. dismisses (무시하다)면 여러 목소리를 외면한다는 뜻이 되어, &#x27;단순하지 않다&#x27;는 앞 내용과 이어지지 않아요."}, {"c": 4, "w": "consistent", "r": "conflicting", "gw": "일관된", "gr": "상충하는", "fb": null, "fg": "Their three options were an art show, a bake sale, and a charity concert, but there were <span class=\"d\">conflicting</span> opinions.", "ko": "그들의 세 가지 선택지는 미술 전시회, 빵 바자회, 그리고 자선 콘서트였지만, 상충되는 의견들이 있었다.", "why": "<b>there were conflicting opinions(상충하는 의견들이 있었다)</b>가 원문이에요. 다음 문장이 So they decided to put it to a vote(그래서 그들은 투표에 부치기로 했다)인 것은 의견이 갈렸기 때문이에요. 앞에 but(하지만)이 있는 것도 선택지는 세 가지인데 의견이 하나로 모이지 않았다는 뜻이라서 그래요. consistent (일관된)면 의견이 같다는 뜻이라 굳이 투표할 이유가 없어요."}], "keep": "fairer (더 공정한)는 투표가 집단 결정을 &#x27;더 공정하고 더 효율적으로&#x27; 만든다는 말이라 맞아요. familiar (익숙한)는 Akers 선생님이 &#x27;익숙한 투표 방법 말고 다른 것을 해 보라&#x27;고 권했다는 뜻이라 맞고, curious (궁금한)는 &#x27;다른 방법이 다른 결과를 낼지 궁금해했다&#x27;는 뜻이라 그대로 둬요.", "flow": "개인의 선택과 집단의 결정을 견주며 시작해서, 학생 자치회가 투표 방법을 고르는 이야기로 넘어가요. However(하지만)와 but(하지만)이 방향을 바꾸는 자리이니, 앞뒤가 서로 반대되는지 보세요.", "ko": "우리는 누구와 점심을 먹을 것인지부터 어떠한 직업을 추구할 것인지까지 우리의 삶에서 많은 개인적인 선택을 한다. 하지만, 우리가 집단으로서 결정을 내려야 하는 상황들이 많이 있다. 집단 의사 결정은 다른 의견을 가진 수많은 목소리를 수반하기 때문에 우리의 개인적인 선택들만큼 간단하지 않다. 투표는 흔히 집단 의사 결정을 더 공정하고 더 효율적으로 만들기 위해 사용되며, 시간이 흐르면서 다양한 투표 방법이 개발되어 왔다. 다음 이야기는 이러한 다양한 투표 방법이 어떻게 적용되는지 보여준다. Greenville 고등학교 학생 자치회의 구성원들은 어려움에 처한 아이들을 위해 모금할 방법을 결정해야 했다. 그들의 세 가지 선택지는 미술 전시회, 빵 바자회, 그리고 자선 콘서트였지만, 상충되는 의견들이 있었다. 그래서 그들은 그것을 투표에 부치기로 결정했다. 그들이 자치회의 고문 교사인 Akers 선생님에게 조언을 구했을 때, 그녀는 익숙한 투표 방법을 사용하지 말고, 대신 다른 것을 시도해 보라고 권장했다. 약간의 조사를 한 후, 자치회 구성원들은 단순 다수결(FPTP) 방식, 대안 투표(AV) 방식, 그리고 콩도르세 방식이라는 세 가지의 다른 투표 시스템을 시도해 보기로 결정했다. 모든 자치회 구성원들은 각각 다른 방법이 서로 다른 결과를 낼지 궁금해했다."}, {"id": "ctx2", "kind": "ctx", "n": 2, "title": "The First-Past-The-Post Method", "tko": "단순 다수결 방식", "paras": [[{"t": "The FPTP method is the "}, {"t": "simplest", "c": 1}, {"t": " of the three methods. Voters are given several options, and whichever gets the most first-preference votes wins. Neither the second nor third preference matters at all, so they are "}, {"t": "considered", "c": 2}, {"t": ". This method is "}, {"t": "commonly", "c": 3}, {"t": " used in political elections around the world."}], [{"t": "The student council quickly determined that the winner would be option C, the charity concert. This was because it received 8 first-preference votes, while option A received 5 and option B received 7."}], [{"t": "The FPTP method is uncomplicated and easy to understand, but it has a significant "}, {"t": "strength", "c": 4}, {"t": ". It is "}, {"t": "impossible", "c": 5}, {"t": " to win a vote without the support of the majority. That was the case here. According to the results of the FPTP method, the council’s choice was to hold a charity concert. However, "}, {"t": "only", "c": 6}, {"t": " 8 out of 20 council members chose the charity concert as their first preference, which equaled 40% of the total votes."}]], "items": [{"c": 2, "w": "considered", "r": "ignored", "gw": "고려되는", "gr": "무시되는", "fb": null, "fg": "Neither the second nor third preference matters at all, so they are <span class=\"d\">ignored</span>.", "ko": "2지망도 3지망도 둘 다 전혀 중요하지 않으므로, 그것들은 무시된다.", "why": "<b>Neither the second nor third preference matters at all, so they are ignored(2지망도 3지망도 전혀 중요하지 않으므로 그것들은 무시된다)</b>가 원문이에요. 바로 앞 문장은 &#x27;1지망 표를 가장 많이 얻은 것이 이긴다&#x27;예요. matters at all(전혀 중요하지 않다) 뒤의 so(그래서)는 결과를 이끄니, 중요하지 않은 표는 &#x27;무시된다&#x27;가 와야 해요. considered (고려되는)면 앞 내용과 부딪쳐요."}, {"c": 4, "w": "strength", "r": "weakness", "gw": "강점", "gr": "약점", "fb": null, "fg": "The FPTP method is uncomplicated and easy to understand, but it has a significant <span class=\"d\">weakness</span>.", "ko": "FPTP 방식은 복잡하지 않고 이해하기 쉽지만, 상당한 약점을 가지고 있다.", "why": "<b>it has a significant weakness(상당한 약점을 가지고 있다)</b>가 원문이에요. 앞에 uncomplicated and easy to understand(복잡하지 않고 이해하기 쉽다)라는 좋은 점이 나오고 but(하지만)으로 이어지니 뒤에는 나쁜 점이 와요. 그 약점이 바로 다음 문장의 내용(과반수의 지지 없이도 이길 수 있다)이에요. strength (강점)면 but 앞뒤가 모두 좋은 말이 돼서 어색해요."}, {"c": 5, "w": "impossible", "r": "possible", "gw": "불가능한", "gr": "가능한", "fb": null, "fg": "It is <span class=\"d\">possible</span> to win a vote without the support of the majority.", "ko": "과반수의 지지 없이도 투표에서 승리하는 것이 가능하다.", "why": "<b>It is possible to win a vote without the support of the majority(과반수의 지지 없이도 투표에서 이기는 것이 가능하다)</b>가 원문이에요. 바로 뒤에 That was the case here(이번이 바로 그런 경우였다)가 오고, 20명 중 8명(40%)만 골랐는데도 자선 콘서트가 이겼다는 내용이 이어져요. impossible (불가능한)이면 과반수 없이 이긴 이번 일과 모순돼요."}], "keep": "simplest (가장 간단한)는 &#x27;세 방식 중 가장 간단하다&#x27;는 설명이라 맞고, commonly (흔히)는 &#x27;전 세계 정치 선거에서 흔히 쓰인다&#x27;는 내용이라 맞아요. only (오직)는 &#x27;20명 중 8명만&#x27;이라는 뜻이라 그대로 둬요.", "flow": "세 가지 투표 방식 중 첫 번째인 FPTP를 소개하는 글이에요. 장점을 말한 뒤 but(하지만)으로 약점을 말하고, 8표만으로 이긴 사례가 나와요. 표가 무시되는지 고려되는지, 강점인지 약점인지, 가능한지 불가능한지를 보세요.", "ko": "FPTP 방식은 세 가지 방식 중 가장 간단하다. 투표자들에게는 여러 가지 선택지가 주어지고, 어떤 것이든 가장 많은 1지망 표를 얻은 것이 이긴다. 2지망도 3지망도 둘 다 전혀 중요하지 않으므로, 그것들은 무시된다. 이 방식은 전 세계 정치 선거에서 흔히 사용된다. 학생 자치회는 빠르게 자선 콘서트인 선택지 C가 승자가 될 것임을 알아냈다. 이는 선택지 A는 5표, 선택지 B는 7표를 받은 반면, 그것은 8표의 1지망 표를 받았기 때문이었다. FPTP 방식은 복잡하지 않고 이해하기 쉽지만, 상당한 약점을 가지고 있다. 과반수의 지지 없이도 투표에서 승리하는 것이 가능하다. 이것이 바로 그런 경우였다. FPTP 방식의 결과에 따르면, 자치회의 선택은 자선 콘서트를 개최하는 것이었다. 하지만 20명의 자치회 구성원 중 8명만이 1지망으로 자선 콘서트를 골랐는데, 이는 전체 표의 40%에 해당했다."}, {"id": "ctx3", "kind": "ctx", "n": 3, "title": "The Alternative Vote Method", "tko": "대안 투표 방식", "paras": [[{"t": "Next, the council members examined the votes using the AV method, and they soon realized that there would be a "}, {"t": "different", "c": 1}, {"t": " result. The AV method can potentially "}, {"t": "exclude", "c": 2}, {"t": " more than one round of counting. For an option to win in the first round, it needs to get more than 50% of the first-preference votes. As the charity concert only received 40% of the total votes, a second round of counting was "}, {"t": "required", "c": 3}, {"t": "."}], [{"t": "Option A, the art show, received the "}, {"t": "fewest", "c": 4}, {"t": " first-preference votes, with only 5 council members voting for it. Therefore, option A was "}, {"t": "selected", "c": 5}, {"t": ", and the 5 council members’ votes were redistributed based on their second preferences. As a result, 4 votes for option B (ABC) and 1 for option C (ACB) were added to the total. This meant that option B had 11 total votes, while option C had only 9. As a result, the bake sale would be the winner."}], [{"t": "Fortunately", "c": 6}, {"t": ", the AV method is not perfect either. It sometimes allows second-preference votes to have a greater influence than first-preference votes. In this case, the bake sale won, but this was mainly due to the second-preference votes it received."}]], "items": [{"c": 2, "w": "exclude", "r": "include", "gw": "제외하다", "gr": "포함하다", "fb": null, "fg": "The AV method can potentially <span class=\"d\">include</span> more than one round of counting.", "ko": "AV 방식은 잠재적으로 한 차례 이상의 집계를 포함할 수 있다.", "why": "<b>The AV method can potentially include more than one round of counting(AV 방식은 잠재적으로 한 차례 이상의 집계를 포함할 수 있다)</b>이 원문이에요. 바로 뒤에서 첫 집계에서 이기려면 50%를 넘어야 하는데 40%라서 a second round of counting(2차 집계)이 필요했다고 해요. 집계가 여러 번 있다는 내용이니 include가 맞아요. exclude (제외하다)면 2차 집계가 나오는 뒤 내용과 부딪쳐요."}, {"c": 5, "w": "selected", "r": "eliminated", "gw": "선택되었다", "gr": "제거되었다", "fb": null, "fg": "Therefore, option A was <span class=\"d\">eliminated</span>, and the 5 council members’ votes were redistributed based on their second preferences.", "ko": "따라서 선택지 A는 제거되었고, 5명의 자치회 구성원들의 표가 그들의 두 번째 선호도에 따라 재분배되었다.", "why": "<b>Therefore, option A was eliminated(따라서 선택지 A는 제거되었다)</b>가 원문이에요. A는 the fewest first-preference votes(가장 적은 1지망 표)를 받았고, 그 5명의 표가 redistributed(재분배되었다)고 해요. 표를 다시 나눠 주는 것은 꼴찌 선택지가 탈락했을 때 하는 일이에요. selected (선택되었다)면 표가 가장 적은 A가 뽑혔다는 뜻이 되어 Therefore(따라서)로 이어지지 않아요."}, {"c": 6, "w": "Fortunately", "r": "Unfortunately", "gw": "다행히", "gr": "안타깝게도", "fb": null, "fg": "<span class=\"d\">Unfortunately</span>, the AV method is not perfect either.", "ko": "안타깝게도, AV 방식도 완벽하지는 않다.", "why": "<b>Unfortunately, the AV method is not perfect either(안타깝게도 AV 방식도 완벽하지는 않다)</b>가 원문이에요. 문장 안에 not perfect either(역시 완벽하지 않다)가 있어서 나쁜 소식이고, 뒤 문장도 2지망 표가 1지망 표보다 더 큰 영향력을 가질 수 있다는 약점이에요. either(~도 역시)는 앞의 FPTP도 약점이 있었다는 것을 받아요. Fortunately (다행히)면 &#x27;완벽하지 않다&#x27;와 어울리지 않아요."}], "keep": "different (다른)는 &#x27;다른 결과가 나올 것&#x27;이라는 뜻이라 맞고, required (필요한)는 &#x27;2차 집계가 필요했다&#x27;는 뜻이라 맞아요. fewest (가장 적은)는 &#x27;A가 가장 적은 1지망 표를 받았다&#x27;는 뜻이라 그대로 둬요.", "flow": "두 번째 투표 방식인 AV를 설명하는 글이에요. 첫 집계에서 과반이 안 나오면 꼴찌를 빼고 표를 다시 나눠요. 집계가 늘어나는지 줄어드는지, 꼴찌 선택지가 뽑히는지 빠지는지, 좋은 소식인지 나쁜 소식인지를 보세요.", "ko": "다음으로, 자치회 구성원들은 AV 방식을 사용하여 표를 검토했고, 그들은 곧 다른 결과가 나올 것이라는 것을 깨달았다. AV 방식은 잠재적으로 한 차례 이상의 집계를 포함할 수 있다. 어떤 선택지가 1차 집계에서 승리하기 위해서는, 1지망 표의 50% 이상을 얻어야 한다. 자선 콘서트는 전체 표의 40%만을 받았기 때문에, 2차 집계가 필요했다. 미술 전시회인 선택지 A는 오직 5명의 자치회 구성원들만 그것에 투표하며 가장 적은 1지망 표를 받았다. 따라서 선택지 A는 제거되었고, 5명의 자치회 구성원들의 표가 그들의 두 번째 선호도에 따라 재분배되었다. 그 결과, 선택지 B에 4표(ABC), 선택지 C에 1표(ACB)가 합계에 추가되었다. 이것은 선택지 C는 9표밖에 얻지 못한 반면 선택지 B가 총 11표를 얻었다는 것을 의미했다. 결과적으로, 빵 바자회가 승자가 될 것이었다. 안타깝게도, AV 방식도 완벽하지는 않다. 그것은 때때로 2지망 표가 1지망 표보다 더 큰 영향력을 갖게 하기도 한다. 이 경우에는 빵 바자회가 승리했지만, 이는 주로 그것이 얻은 2지망 표 때문이었다."}, {"id": "ctx4", "kind": "ctx", "n": 4, "title": "The Condorcet Method", "tko": "콩도르세 방식", "paras": [[{"t": "Finally, the student council counted the votes using the Condorcet method. This method "}, {"t": "involves", "c": 1}, {"t": " comparing the voters’ preferences between each possible pair of options. In this case, there were three pairs to consider: A vs. B, B vs. C, and A vs. C."}], [{"t": "Through this method, the student council discovered that its members preferred option A to option B by a count of 11 to 9. In other words, 11 people preferred A to B, voting either ABC, ACB, or CAB. Meanwhile, 9 people preferred B to A by voting BAC, BCA, or CBA. "}, {"t": "Interestingly", "c": 2}, {"t": ", the voters preferred option B to option C by the same count of 11 to 9. They also preferred option A to option C by 11 to 9. As option A, the art show, was preferred to both of the other options, it would be considered the "}, {"t": "loser", "c": 3}, {"t": "."}], [{"t": "The Condorcet method’s "}, {"t": "weakness", "c": 4}, {"t": " is that, along with being "}, {"t": "simple", "c": 5}, {"t": ", it sometimes fails to select a winner. This is especially true in elections that "}, {"t": "lack", "c": 6}, {"t": " numerous options. It is possible that no option will be clearly preferred over the others."}]], "items": [{"c": 3, "w": "loser", "r": "winner", "gw": "패자", "gr": "승자", "fb": null, "fg": "As option A, the art show, was preferred to both of the other options, it would be considered the <span class=\"d\">winner</span>.", "ko": "미술 전시회인 선택지 A가 나머지 두 선택지보다 더 선호되었으므로, 이 선택지가 승자로 간주될 것이었다.", "why": "<b>it would be considered the winner(그 선택지는 승자로 간주될 것이다)</b>가 원문이에요. A는 B보다도 11대 9로, C보다도 11대 9로 선호됐어요. 앞에 As option A ... was preferred to both of the other options(A가 나머지 두 선택지보다 더 선호되었으므로)라는 이유가 있으니 결과는 승자예요. loser (패자)면 모든 비교에서 이긴 선택지를 패자라고 하는 셈이라 말이 안 돼요."}, {"c": 5, "w": "simple", "r": "complex", "gw": "간단한", "gr": "복잡한", "fb": null, "fg": "The Condorcet method’s weakness is that, along with being <span class=\"d\">complex</span>, it sometimes fails to select a winner.", "ko": "콩도르세 방식의 약점은 복잡하다는 것과 더불어 때때로 승자를 가려내지 못한다는 점이다.", "why": "<b>along with being complex, it sometimes fails to select a winner(복잡하다는 것과 더불어 때때로 승자를 가려내지 못한다)</b>가 원문이에요. 문장 앞이 The Condorcet method&#x27;s weakness(콩도르세 방식의 약점)이고, along with(~와 더불어)는 같은 방향의 나쁜 점을 더할 때 써요. 승자를 못 가리는 것이 약점이니 함께 나오는 말도 약점인 complex(복잡한)가 맞아요. simple (간단한)은 장점이라 약점 문장에 어울리지 않아요."}, {"c": 6, "w": "lack", "r": "contain", "gw": "부족하다", "gr": "포함하다", "fb": null, "fg": "This is especially true in elections that <span class=\"d\">contain</span> numerous options.", "ko": "이는 많은 선택지를 포함하는 선거에서 특히 그렇다.", "why": "<b>elections that contain numerous options(많은 선택지를 포함하는 선거)</b>가 원문이에요. 선택지가 많을수록 어느 하나가 나머지를 모두 이기지 못해 승자를 못 가릴 수 있어요. 바로 뒤 It is possible that no option will be clearly preferred over the others(어떤 선택지도 다른 선택지들보다 명확하게 선호되지 않을 수 있다)가 그 설명이에요. lack numerous options (많은 선택지가 부족한)면 선택지가 적은 선거가 되어 이 흐름과 맞지 않아요."}], "keep": "involves (수반하다)는 &#x27;가능한 모든 쌍을 비교하는 것을 수반한다&#x27;는 설명이라 맞아요. Interestingly (흥미롭게도)는 &#x27;세 비교가 모두 똑같이 11대 9&#x27;라는 신기한 결과를 소개하는 말이라 맞고, weakness (약점)는 &#x27;때때로 승자를 못 가린다&#x27;는 내용과 이어져 그대로 둬요.", "flow": "세 번째 방식인 콩도르세를 설명하는 글이에요. 선택지를 둘씩 짝지어 비교해요. 모든 비교에서 이긴 쪽을 뭐라고 부르는지, 약점을 말하는 문장에 장점이 끼어 있지 않은지, 선택지가 많은지 적은지를 보세요.", "ko": "마지막으로, 학생 자치회는 콩도르세 방식을 사용하여 표를 집계했다. 이 방식은 가능한 선택지 쌍에 대한 투표자들의 선호도를 비교하는 것을 수반한다. 이 경우에는, 고려해야 할 세 쌍이 있었는데, 그것은 바로 A와 B, B와 C, A와 C였다. 이 방식을 통해, 학생 자치회는 구성원들이 11대 9로 선택지 B보다 선택지 A를 선호한다는 사실을 발견했다. 즉, 11명이 ABC, ACB, CAB 중 하나에 투표하며 B보다 A를 선호했다. 한편, 9명은 BAC, BCA 또는 CBA에 투표함으로써 A보다 B를 선호했다. 흥미롭게도, 투표자들은 동일하게 11대 9로 선택지 C보다 선택지 B를 선호했다. 그들은 또한 11대 9로 선택지 C보다 선택지 A를 선호했다. 미술 전시회인 선택지 A가 나머지 두 선택지보다 더 선호되었으므로, 이 선택지가 승자로 간주될 것이었다. 콩도르세 방식의 약점은 복잡하다는 것과 더불어 때때로 승자를 가려내지 못한다는 점이다. 이는 많은 선택지를 포함하는 선거에서 특히 그렇다. 어떤 선택지도 다른 선택지들보다 명확하게 선호되지 않을 수 있다."}, {"id": "ctx5", "kind": "ctx", "n": 5, "title": null, "tko": null, "paras": [[{"t": "Instead of all methods pointing toward a single option and making the council’s choice "}, {"t": "easier", "c": 1}, {"t": ", the winner differed with each method. After a long, intense discussion with Ms. Akers, the student council members decided to choose the Condorcet method, as they liked the idea of "}, {"t": "directly", "c": 2}, {"t": " comparing each option with the others. Everyone agreed that they learned a lot about different voting systems through this experience."}], [{"t": "It is obvious that choosing an ideal voting method is a complex and challenging task. No voting system is "}, {"t": "flawless", "c": 3}, {"t": " or clearly superior to another. Whichever we choose will have pros and cons. Some people believe that it is best to keep the process "}, {"t": "complex", "c": 4}, {"t": " by not ranking our choices at all. Others continue to develop and test new ways of voting, arguing that more complex methods deliver more accurate results. All of these efforts are designed not to make decision-making difficult and inefficient, but to help us make better decisions as a society. Ultimately, understanding all of the possible voting methods and weighing their pros and cons "}, {"t": "forbids", "c": 5}, {"t": " us to better understand the process of decision-making. When we understand decision-making better, we are more "}, {"t": "unlikely", "c": 6}, {"t": " to become better decision-makers ourselves."}]], "items": [{"c": 4, "w": "complex", "r": "simple", "gw": "복잡한", "gr": "단순한", "fb": null, "fg": "Some people believe that it is best to keep the process <span class=\"d\">simple</span> by not ranking our choices at all.", "ko": "어떤 사람들은 우리들의 선택들에 아예 순위를 매기지 않음으로써 과정을 단순하게 유지하는 것이 최선이라고 생각한다.", "why": "<b>keep the process simple by not ranking our choices at all(선택에 순위를 아예 매기지 않음으로써 과정을 단순하게 유지하다)</b>이 원문이에요. 순위를 매기지 않으면 과정이 간단해지니 simple(단순한)이 맞아요. 다음 문장 Others(다른 사람들은) ... more complex methods(더 복잡한 방식)로 반대 의견이 나오는 것도 앞이 simple이기 때문이에요. complex (복잡한)면 &#x27;순위를 안 매긴다&#x27;는 방법과도 뒤의 대비와도 맞지 않아요."}, {"c": 5, "w": "forbids", "r": "allows", "gw": "금지하다", "gr": "허용하다", "fb": null, "fg": "Ultimately, understanding all of the possible voting methods and weighing their pros and cons <span class=\"d\">allows</span> us to better understand the process of decision-making.", "ko": "결국, 모든 가능한 투표 방법을 이해하고 장단점을 따져 보는 것은 우리가 의사 결정 과정을 더 잘 이해할 수 있게 한다.", "why": "<b>weighing their pros and cons allows us to better understand the process of decision-making(장단점을 따져 보는 것은 우리가 의사 결정 과정을 더 잘 이해하게 해 준다)</b>이 원문이에요. 앞 문장이 &#x27;이 모든 노력은 더 나은 결정을 돕기 위한 것&#x27;이라고 했고, 뒤 문장도 When we understand decision-making better(의사 결정을 더 잘 이해할 때)로 이어져요. forbids (금지하다)면 이해하는 것을 막는다는 뜻이 되어 이 흐름과 반대가 돼요."}, {"c": 6, "w": "unlikely", "r": "likely", "gw": "~할 것 같지 않은", "gr": "~할 가능성이 있는", "fb": null, "fg": "When we understand decision-making better, we are more <span class=\"d\">likely</span> to become better decision-makers ourselves.", "ko": "우리가 의사 결정을 더 잘 이해할 때, 우리 스스로 더 나은 의사 결정자가 될 가능성이 더 높다.", "why": "<b>we are more likely to become better decision-makers ourselves(우리 스스로 더 나은 의사 결정자가 될 가능성이 더 높다)</b>가 원문이에요. When we understand decision-making better(의사 결정을 더 잘 이해할 때)가 조건이고, 이 문장은 그 좋은 결과예요. more unlikely (더 ~할 것 같지 않은)면 잘 이해할수록 오히려 나빠진다는 뜻이라 글 전체의 결론과 어긋나요."}], "keep": "easier (더 쉬운)는 &#x27;자치회의 선택을 더 쉽게 만드는&#x27; 쪽이라 맞아요. directly (직접적으로)는 &#x27;각 선택지를 다른 선택지와 직접 비교한다&#x27;는 뜻이라 맞고, flawless (흠 없는)는 &#x27;완벽하거나 명백히 우수한 투표 시스템은 없다&#x27;는 문장이라 그대로 둬요.", "flow": "방식마다 승자가 달랐고 자치회는 콩도르세 방식을 골랐어요. 이어서 이상적인 투표 방법은 없지만 모든 노력은 더 나은 결정을 돕는다는 결론으로 마무리해요. 순위를 매기는 과정이 단순한지 복잡한지, 이해가 우리를 돕는지 막는지를 보세요.", "ko": "모든 방식이 하나의 선택지를 가리키고 자치회의 선택을 더 쉽게 만드는 대신, 각 방식마다 승자는 달랐다. Akers 선생님과의 오랜 열정적인 논의 끝에, 학생 자치회 구성원들은 콩도르세 방식을 선택하기로 결정했는데, 각 선택지를 다른 선택지들과 직접적으로 비교한다는 점이 마음에 들었기 때문이다. 모두가 이번 경험을 통해 각기 다른 투표 시스템에 대해 많은 것을 배웠다는 것에 동의했다. 이상적인 투표 방법을 선택하는 것은 복잡하고 도전적인 일이라는 것은 분명하다. 어떤 투표 시스템도 완벽하거나 다른 시스템보다 명백히 우수하지는 않다. 우리가 선택하는 어느 것이든 장단점이 있을 것이다. 어떤 사람들은 우리들의 선택들에 아예 순위를 매기지 않음으로써 과정을 단순하게 유지하는 것이 최선이라고 생각한다. 다른 사람들은 더 복잡한 방식이 더 정확한 결과를 가져온다고 주장하며 계속해서 새로운 투표 방법을 개발하고 시험한다. 이러한 모든 노력은 의사 결정을 어렵고 비효율적으로 만들기 위한 것이 아니라, 우리가 집단으로서 더 나은 의사 결정을 내릴 수 있게 돕기 위해 고안된 것이다. 결국, 모든 가능한 투표 방법을 이해하고 장단점을 따져 보는 것은 우리가 의사 결정 과정을 더 잘 이해할 수 있게 한다. 우리가 의사 결정을 더 잘 이해할 때, 우리 스스로 더 나은 의사 결정자가 될 가능성이 더 높다."}, {"id": "gram1", "kind": "gram", "n": 1, "title": null, "tko": null, "paras": [[{"t": "We make many personal choices in our lives, "}, {"t": "from who to have lunch with to what career to pursue", "c": 1}, {"t": ". However, "}, {"t": "there are many situations what we must make decisions as a group", "c": 2}, {"t": ". Group decision-making is not as simple as our personal choices, as "}, {"t": "it involves numerous voices with differing opinions", "c": 3}, {"t": ". Voting is often used "}, {"t": "to make group decisions fairer and more efficiently", "c": 4}, {"t": ", and "}, {"t": "various voting methods have been developed over time", "c": 5}, {"t": ". The following story illustrates how these different voting methods work."}], [{"t": "The members of the Greenville High School student council needed to decide how to raise money for children in need. Their three options were an art show, a bake sale, and a charity concert, but there were conflicting opinions. So they decided to put it to a vote. When they asked for advice from Ms. Akers, the council’s advisor, "}, {"t": "she encouraged them not to use the familiar voting method, but tried something different instead", "c": 6}, {"t": ". After doing some research, the council members decided to try three different voting systems: the first-past-the-post (FPTP) method, the alternative vote (AV) method, and the Condorcet method. The entire council was curious to find out if "}, {"t": "the different methods would yield different results", "c": 7}, {"t": "."}]], "items": [{"c": 2, "w": "what", "r": "where", "gw": "'~하는 것'을 뜻하는 what", "gr": "'~하는 상황'을 받는 where", "fb": "there are many situations <span class=\"d\">what</span> we must make decisions as a group", "fg": "there are many situations <span class=\"d\">where</span> we must make decisions as a group", "ko": "하지만, 우리가 집단으로서 결정을 내려야 하는 상황들이 많이 있다.", "why": "situations(상황들) 뒤에 <b>we must make decisions as a group(우리는 집단으로서 결정을 내려야 한다)</b>라는 완전한 문장이 이어져요. 선행사가 &#x27;상황&#x27;이고 뒤가 완전하면 관계부사 <b>where</b>를 써요. what은 앞에 명사를 두지 않고 &#x27;~하는 것&#x27;이라는 뜻을 스스로 품고 있어서 situations what처럼 쓸 수 없어요."}, {"c": 4, "w": "efficiently", "r": "efficient", "gw": "효율적으로 (부사)", "gr": "효율적인 (형용사)", "fb": "to make group decisions fairer and more <span class=\"d\">efficiently</span>", "fg": "to make group decisions fairer and more <span class=\"d\">efficient</span>", "ko": "투표는 흔히 집단 의사 결정을 더 공정하고 더 효율적으로 만들기 위해 사용되며, 시간이 흐르면서 다양한 투표 방법이 개발되어 왔다.", "why": "<b>make group decisions fairer and more efficient</b>는 make + 목적어 + 형용사(~을 ...하게 만들다) 모양이에요. 목적어(group decisions)의 상태를 말하는 자리라서 fairer(더 공정한)와 나란히 쓰는 말도 형용사여야 해요. 부사 efficiently(효율적으로)는 이 자리에 쓸 수 없고, 같은 모양으로 맞춘 <b>more efficient</b>(더 효율적인)가 맞아요."}, {"c": 6, "w": "tried", "r": "to try", "gw": "시도했다 (과거)", "gr": "시도하라고 (to + 동사원형)", "fb": "she encouraged them not to use the familiar voting method, but <span class=\"d\">tried</span> something different instead", "fg": "she encouraged them not to use the familiar voting method, but <span class=\"d\">to try</span> something different instead", "ko": "그들이 자치회의 고문 교사인 Akers 선생님에게 조언을 구했을 때, 그녀는 익숙한 투표 방법을 사용하지 말고, 대신 다른 것을 시도해 보라고 권장했다.", "why": "<b>encouraged them not to use ..., but to try ...(...을 사용하지 말고 대신 ...을 시도해 보라고 권했다)</b>는 encourage + 목적어 + to V 뒤에 not to use와 but 뒤의 말이 짝을 이루는 모양이에요. not to use(사용하지 않도록)와 짝이 되려면 but 뒤도 <b>to try</b>(시도하도록)여야 해요. tried (시도했다)는 과거 동사라 짝이 맞지 않아요."}], "keep": "from who to have lunch with to what career to pursue (누구와 점심을 먹을지부터 어떤 직업을 추구할지까지)는 의문사 + to 동사원형 모양이 맞아요. it involves numerous voices (그것은 수많은 목소리를 수반한다)는 주어 it에 동사 involves가 맞고, various voting methods have been developed (다양한 투표 방법이 개발되어 왔다)는 현재완료 수동이 맞아요. the different methods would yield different results (다른 방법이 다른 결과를 낼지)는 would yield가 맞아요.", "flow": "집단 결정에는 투표가 필요하다고 소개하고, 학생 자치회 이야기를 시작하는 글이에요. 관계사가 선행사에 맞는지, and로 이어진 말의 모양이 같은지, not A but B에서 A와 B의 모양이 같은지를 보세요.", "ko": "우리는 누구와 점심을 먹을 것인지부터 어떠한 직업을 추구할 것인지까지 우리의 삶에서 많은 개인적인 선택을 한다. 하지만, 우리가 집단으로서 결정을 내려야 하는 상황들이 많이 있다. 집단 의사 결정은 다른 의견을 가진 수많은 목소리를 수반하기 때문에 우리의 개인적인 선택들만큼 간단하지 않다. 투표는 흔히 집단 의사 결정을 더 공정하고 더 효율적으로 만들기 위해 사용되며, 시간이 흐르면서 다양한 투표 방법이 개발되어 왔다. 다음 이야기는 이러한 다양한 투표 방법이 어떻게 적용되는지 보여준다. Greenville 고등학교 학생 자치회의 구성원들은 어려움에 처한 아이들을 위해 모금할 방법을 결정해야 했다. 그들의 세 가지 선택지는 미술 전시회, 빵 바자회, 그리고 자선 콘서트였지만, 상충되는 의견들이 있었다. 그래서 그들은 그것을 투표에 부치기로 결정했다. 그들이 자치회의 고문 교사인 Akers 선생님에게 조언을 구했을 때, 그녀는 익숙한 투표 방법을 사용하지 말고, 대신 다른 것을 시도해 보라고 권장했다. 약간의 조사를 한 후, 자치회 구성원들은 단순 다수결(FPTP) 방식, 대안 투표(AV) 방식, 그리고 콩도르세 방식이라는 세 가지의 다른 투표 시스템을 시도해 보기로 결정했다. 모든 자치회 구성원들은 각각 다른 방법이 서로 다른 결과를 낼지 궁금해했다."}, {"id": "gram2", "kind": "gram", "n": 2, "title": null, "tko": null, "paras": [[{"t": "On the day of the vote, "}, {"t": "each possible event was given a letter", "c": 1}, {"t": ": "}, {"t": "“art show” was represented by the letter A", "c": 2}, {"t": ", the letter B indicated “bake sale,” and "}, {"t": "C stood for “charity concert.”", "c": 3}], [{"t": "Each of the 20 council members was given a voting slip and "}, {"t": "instructed write down the options in order of preference", "c": 4}, {"t": ". For example, if the charity concert was their first choice, "}, {"t": "followed by the bake sale and the art show", "c": 5}, {"t": ", they would write CBA."}], [{"t": "After every member had voted, "}, {"t": "the voting slips were counted", "c": 6}, {"t": ". The results were as follows:"}]], "items": [{"c": 4, "w": "write", "r": "to write", "gw": "적다 (동사원형)", "gr": "적으라고 (to + 동사원형)", "fb": "was given a voting slip and instructed <span class=\"d\">write</span> down the options in order of preference", "fg": "was given a voting slip and instructed <span class=\"d\">to write</span> down the options in order of preference", "ko": "20명의 자치회 구성원들 각각은 투표용지를 받았고, 선호하는 순서대로 선택지를 적으라는 지시를 받았다.", "why": "<b>instructed to write down the options(선택지를 적으라는 지시를 받았다)</b>가 원문이에요. instruct + 사람 + to V(~하라고 지시하다)를 수동으로 바꾸면 be instructed to V가 돼요. 그래서 instructed 뒤에는 동사원형 write가 아니라 <b>to write</b>(적으라고)가 와야 해요."}], "keep": "each possible event was given a letter (각각의 가능한 행사에 글자가 하나씩 부여되었다)는 &#x27;글자가 주어졌다&#x27;는 수동이 맞아요. “art show” was represented by the letter A (‘미술 전시회’는 글자 A로 표시되었다)는 be represented by(~로 나타내어지다)가 맞고, C stood for (C는 ~를 의미했다)도 맞아요. followed by the bake sale and the art show (빵 바자회와 미술 전시회가 뒤따른다면)는 &#x27;뒤따르는&#x27;이라는 뜻의 과거분사가 맞고, the voting slips were counted (투표용지가 집계되었다)는 수동이 맞아요.", "flow": "투표 당일 선택지에 글자를 붙이고 투표용지를 나눠 주는 장면이에요. 지시를 받는 문장에서 instructed 뒤의 모양이 알맞은지 보세요.", "ko": "투표 당일, 각각의 가능한 행사에 글자가 하나씩 부여되었다. ‘미술 전시회’는 글자 A로 표시되었고, 글자 B는 ‘빵 바자회’를 나타냈으며, C는 ‘자선 콘서트’를 의미했다. 20명의 자치회 구성원들 각각은 투표용지를 받았고, 선호하는 순서대로 선택지를 적으라는 지시를 받았다. 예를 들어, 자선 콘서트가 첫 번째 선택이고 빵 바자회와 미술 전시회가 뒤따른다면, 그들은 CBA를 적을 것이다. 모든 구성원이 투표를 마친 후, 투표용지가 집계되었다. 결과는 다음과 같았다."}, {"id": "gram3", "kind": "gram", "n": 3, "title": "The First-Past-The-Post Method", "tko": "단순 다수결 방식", "paras": [[{"t": "The FPTP method is the simplest of the three methods", "c": 1}, {"t": ". Voters are given several options, and "}, {"t": "however gets the most first-preference votes wins", "c": 2}, {"t": ". "}, {"t": "Neither the second nor third preference matters at all", "c": 3}, {"t": ", so they are ignored. "}, {"t": "This method is commonly used in political elections around the world", "c": 4}, {"t": "."}], [{"t": "The student council quickly determined that the winner would be option C, the charity concert. This was because "}, {"t": "it received 8 first-preference votes, while option A received 5 and option B received 7", "c": 5}, {"t": "."}], [{"t": "The FPTP method is uncomplicated and easy to understand, but it has a significant weakness. "}, {"t": "It is possible to win a vote without the support of the majority", "c": 6}, {"t": ". That was the case here. According to the results of the FPTP method, the council’s choice was to hold a charity concert. However, "}, {"t": "only 8 out of 20 council members chose the charity concert as their first preference, that equaled 40% of the total votes", "c": 7}, {"t": "."}]], "items": [{"c": 2, "w": "however", "r": "whichever", "gw": "하지만 (부사)", "gr": "어느 것이든 (복합관계대명사)", "fb": "Voters are given several options, and <span class=\"d\">however</span> gets the most first-preference votes wins", "fg": "Voters are given several options, and <span class=\"d\">whichever</span> gets the most first-preference votes wins", "ko": "투표자들에게는 여러 가지 선택지가 주어지고, 어떤 것이든 가장 많은 1지망 표를 얻은 것이 이긴다.", "why": "<b>whichever gets the most first-preference votes wins(어느 것이든 1지망 표를 가장 많이 얻은 것이 이긴다)</b>에서 whichever는 gets의 주어 역할을 하면서 &#x27;어느 것이든&#x27;이라는 뜻으로 절 전체를 이끌어요. however (하지만, 아무리 ~해도)는 부사라서 이렇게 주어 자리에 쓸 수 없어요."}, {"c": 7, "w": "that", "r": "which", "gw": "'그것'을 뜻하는 that", "gr": "앞 내용 전체를 받는 which", "fb": "chose the charity concert as their first preference, <span class=\"d\">that</span> equaled 40% of the total votes", "fg": "chose the charity concert as their first preference, <span class=\"d\">which</span> equaled 40% of the total votes", "ko": "하지만 20명의 자치회 구성원 중 8명만이 1지망으로 자선 콘서트를 골랐는데, 이는 전체 표의 40%에 해당했다.", "why": "쉼표 뒤의 <b>equaled 40% of the total votes(전체 표의 40%에 해당했다)</b>는 앞 내용 전체(20명 중 8명이 자선 콘서트를 골랐다는 것)를 받아 덧붙여 설명하는 말이에요. 쉼표 뒤에서 앞 내용을 이어 설명할 때는 관계대명사 <b>which</b>를 써요. that은 쉼표 뒤에서는 쓸 수 없어요."}], "keep": "The FPTP method is the simplest of the three methods (세 방식 중 가장 간단하다)는 the simplest of ... 모양이 맞아요. Neither the second nor third preference matters at all (2지망도 3지망도 전혀 중요하지 않다)은 Neither ... nor 모양이 맞고, This method is commonly used (이 방식은 흔히 사용된다)는 수동이 맞아요. it received 8 first-preference votes, while option A received 5 ... (선택지 A는 5표를 받은 반면 그것은 8표를 받았다)는 while(~인 반면)이 맞고, It is possible to win a vote (투표에서 이기는 것이 가능하다)는 가주어 It과 진주어 to win 모양이 맞아요.", "flow": "세 방식 중 첫 번째인 FPTP를 소개하는 글이에요. 접속사 자리에 쓸 수 있는 말인지, 쉼표 뒤에 that을 쓸 수 있는지를 보세요.", "ko": "FPTP 방식은 세 가지 방식 중 가장 간단하다. 투표자들에게는 여러 가지 선택지가 주어지고, 어떤 것이든 가장 많은 1지망 표를 얻은 것이 이긴다. 2지망도 3지망도 둘 다 전혀 중요하지 않으므로, 그것들은 무시된다. 이 방식은 전 세계 정치 선거에서 흔히 사용된다. 학생 자치회는 빠르게 자선 콘서트인 선택지 C가 승자가 될 것임을 알아냈다. 이는 선택지 A는 5표, 선택지 B는 7표를 받은 반면, 그것은 8표의 1지망 표를 받았기 때문이었다. FPTP 방식은 복잡하지 않고 이해하기 쉽지만, 상당한 약점을 가지고 있다. 과반수의 지지 없이도 투표에서 승리하는 것이 가능하다. 이것이 바로 그런 경우였다. FPTP 방식의 결과에 따르면, 자치회의 선택은 자선 콘서트를 개최하는 것이었다. 하지만 20명의 자치회 구성원 중 8명만이 1지망으로 자선 콘서트를 골랐는데, 이는 전체 표의 40%에 해당했다."}, {"id": "gram4", "kind": "gram", "n": 4, "title": "The Alternative Vote Method", "tko": "대안 투표 방식", "paras": [[{"t": "Next, the council members examined the votes "}, {"t": "used the AV method", "c": 1}, {"t": ", and "}, {"t": "they soon realized that there would be a different result", "c": 2}, {"t": ". The AV method can potentially include more than one round of counting. "}, {"t": "For an option to win in the first round, it needs to get more than 50% of the first-preference votes", "c": 3}, {"t": ". As the charity concert only received 40% of the total votes, a second round of counting was required."}], [{"t": "Option A, the art show, received the fewest first-preference votes, with only 5 council members voting for it. Therefore, option A was eliminated, and "}, {"t": "the 5 council members’ votes were redistributed based on their second preferences", "c": 4}, {"t": ". As a result, 4 votes for option B (ABC) and 1 for option C (ACB) were added to the total. This meant that "}, {"t": "option B had 11 total votes, while option C had only 9", "c": 5}, {"t": ". As a result, the bake sale would be the winner."}], [{"t": "Unfortunately, the AV method is not perfect either. "}, {"t": "It sometimes allows second-preference votes have a greater influence than first-preference votes", "c": 6}, {"t": ". In this case, the bake sale won, but "}, {"t": "this was mainly due to the second-preference votes it was received", "c": 7}, {"t": "."}]], "items": [{"c": 1, "w": "used", "r": "using", "gw": "사용했다 (과거)", "gr": "사용하여 (-ing)", "fb": "the council members examined the votes <span class=\"d\">used</span> the AV method", "fg": "the council members examined the votes <span class=\"d\">using</span> the AV method", "ko": "다음으로, 자치회 구성원들은 AV 방식을 사용하여 표를 검토했고, 그들은 곧 다른 결과가 나올 것이라는 것을 깨달았다.", "why": "문장에 이미 <b>the council members examined the votes(자치회 구성원들은 표를 검토했다)</b>라는 동사 examined가 있어요. 뒤에 used(사용했다)를 또 쓰면 접속사 없이 동사가 두 개가 돼요. &#x27;AV 방식을 사용하여&#x27;라고 덧붙이는 말은 능동 분사구문 <b>using</b>이 맞아요."}, {"c": 6, "w": "have", "r": "to have", "gw": "가지다 (동사원형)", "gr": "갖게 (to + 동사원형)", "fb": "It sometimes allows second-preference votes <span class=\"d\">have</span> a greater influence than first-preference votes", "fg": "It sometimes allows second-preference votes <span class=\"d\">to have</span> a greater influence than first-preference votes", "ko": "그것은 때때로 2지망 표가 1지망 표보다 더 큰 영향력을 갖게 하기도 한다.", "why": "allow는 <b>allow + 목적어 + to V(~가 ...하도록 허락하다)</b> 모양으로 써요. &#x27;2지망 표가 더 큰 영향력을 갖게 한다&#x27;이므로 votes 뒤에 have가 아니라 <b>to have</b>가 와야 해요."}, {"c": 7, "w": "was received", "r": "received", "gw": "받아졌다 (수동)", "gr": "받았다 (능동)", "fb": "the second-preference votes it <span class=\"d\">was received</span>", "fg": "the second-preference votes it <span class=\"d\">received</span>", "ko": "이 경우에는 빵 바자회가 승리했지만, 이는 주로 그것이 얻은 2지망 표 때문이었다.", "why": "<b>the second-preference votes it received(그것이 받은 2지망 표)</b>에서 it은 빵 바자회(the bake sale)예요. 빵 바자회가 표를 &#x27;받은&#x27; 쪽이라 능동 <b>received</b>가 맞아요. was received라고 수동으로 쓰면 &#x27;그것이 받아졌다&#x27;가 되어 뜻이 맞지 않아요."}], "keep": "they soon realized that there would be a different result (곧 다른 결과가 나올 것임을 깨달았다)는 realized + that절이 맞아요. For an option to win in the first round, it needs to get ... (어떤 선택지가 1차에서 이기려면 ...을 얻어야 한다)는 for + 의미상 주어 + to V 모양이 맞고, the 5 council members’ votes were redistributed (5명의 표가 재분배되었다)는 표가 &#x27;다시 나눠지는&#x27; 수동이 맞아요. option B had 11 total votes, while option C had only 9 (B는 총 11표를 얻은 반면 C는 9표밖에 얻지 못했다)는 while(~인 반면)이 맞아요.", "flow": "두 번째 방식인 AV를 설명하는 글이에요. 한 문장에 동사가 몇 개인지, allow 뒤의 모양이 알맞은지, 표를 받은 쪽이 누구인지를 보세요.", "ko": "다음으로, 자치회 구성원들은 AV 방식을 사용하여 표를 검토했고, 그들은 곧 다른 결과가 나올 것이라는 것을 깨달았다. AV 방식은 잠재적으로 한 차례 이상의 집계를 포함할 수 있다. 어떤 선택지가 1차 집계에서 승리하기 위해서는, 1지망 표의 50% 이상을 얻어야 한다. 자선 콘서트는 전체 표의 40%만을 받았기 때문에, 2차 집계가 필요했다. 미술 전시회인 선택지 A는 오직 5명의 자치회 구성원들만 그것에 투표하며 가장 적은 1지망 표를 받았다. 따라서 선택지 A는 제거되었고, 5명의 자치회 구성원들의 표가 그들의 두 번째 선호도에 따라 재분배되었다. 그 결과, 선택지 B에 4표(ABC), 선택지 C에 1표(ACB)가 합계에 추가되었다. 이것은 선택지 C는 9표밖에 얻지 못한 반면 선택지 B가 총 11표를 얻었다는 것을 의미했다. 결과적으로, 빵 바자회가 승자가 될 것이었다. 안타깝게도, AV 방식도 완벽하지는 않다. 그것은 때때로 2지망 표가 1지망 표보다 더 큰 영향력을 갖게 하기도 한다. 이 경우에는 빵 바자회가 승리했지만, 이는 주로 그것이 얻은 2지망 표 때문이었다."}, {"id": "gram5", "kind": "gram", "n": 5, "title": "The Condorcet Method", "tko": "콩도르세 방식", "paras": [[{"t": "Finally, "}, {"t": "the student council counted the votes using the Condorcet method", "c": 1}, {"t": ". "}, {"t": "This method involves comparing the voters’ preferences between each possible pair of options", "c": 2}, {"t": ". In this case, there were three pairs to consider: A vs. B, B vs. C, and A vs. C."}], [{"t": "Through this method, the student council discovered that "}, {"t": "its members preferred option A to option B by a count of 11 to 9", "c": 3}, {"t": ". In other words, 11 people preferred A to B, voting either ABC, ACB, or CAB. Meanwhile, 9 people preferred B to A by voting BAC, BCA, or CBA. Interestingly, the voters preferred option B to option C by the same count of 11 to 9. They also preferred option A to option C by 11 to 9. "}, {"t": "As option A, the art show, was preferred to both of the other options", "c": 4}, {"t": ", it would be considered the winner."}], [{"t": "The Condorcet method’s weakness is that, along with being complex, "}, {"t": "it sometimes fails selecting a winner", "c": 5}, {"t": ". This is especially true "}, {"t": "in elections that contains numerous options", "c": 6}, {"t": ". It is possible that "}, {"t": "no option will clearly prefer over the others", "c": 7}, {"t": "."}]], "items": [{"c": 5, "w": "selecting", "r": "to select", "gw": "고르는 것 (-ing)", "gr": "고르는 것 (to + 동사원형)", "fb": "it sometimes fails <span class=\"d\">selecting</span> a winner", "fg": "it sometimes fails <span class=\"d\">to select</span> a winner", "ko": "콩도르세 방식의 약점은 복잡하다는 것과 더불어 때때로 승자를 가려내지 못한다는 점이다.", "why": "<b>fail to V(~하지 못하다)</b>는 fail 뒤에 to + 동사원형을 써요. fail은 동명사(-ing)를 목적어로 취하지 않아서 fails selecting이 아니라 <b>fails to select a winner(승자를 가려내지 못한다)</b>가 맞아요."}, {"c": 6, "w": "contains", "r": "contain", "gw": "포함한다 (단수형)", "gr": "포함한다 (복수형)", "fb": "This is especially true in elections that <span class=\"d\">contains</span> numerous options", "fg": "This is especially true in elections that <span class=\"d\">contain</span> numerous options", "ko": "이는 많은 선택지를 포함하는 선거에서 특히 그렇다.", "why": "that이 가리키는 말은 바로 앞의 <b>elections(선거들)</b>예요. elections는 복수 명사라서 관계대명사절의 동사도 복수 형태인 <b>contain</b>이 맞아요. contains는 단수 주어에 쓰는 형태라 맞지 않아요."}, {"c": 7, "w": "clearly prefer", "r": "be clearly preferred", "gw": "명확하게 선호하다 (능동)", "gr": "명확하게 선호되다 (수동)", "fb": "no option will <span class=\"d\">clearly prefer</span> over the others", "fg": "no option will <span class=\"d\">be clearly preferred</span> over the others", "ko": "어떤 선택지도 다른 선택지들보다 명확하게 선호되지 않을 수 있다.", "why": "<b>no option will be clearly preferred over the others(어떤 선택지도 다른 선택지들보다 명확하게 선호되지 않을 것이다)</b>가 원문이에요. 주어 no option(어떤 선택지도)은 &#x27;선호하는&#x27; 쪽이 아니라 투표자들에게 <b>선호받는</b> 쪽이에요. 또 능동 prefer 뒤에는 목적어가 와야 하는데 여기에는 목적어가 없어요. 그래서 수동인 <b>be preferred</b>가 맞아요."}], "keep": "the student council counted the votes using the Condorcet method (콩도르세 방식을 사용하여 표를 집계했다)는 using이 분사구문으로 맞아요. This method involves comparing the voters’ preferences (이 방식은 투표자들의 선호도를 비교하는 것을 수반한다)는 involve + -ing 모양이 맞고, its members preferred option A to option B (구성원들이 선택지 B보다 A를 선호했다)는 prefer A to B 모양이 맞아요. As option A ... was preferred to both of the other options (A가 나머지 두 선택지보다 선호되었으므로)는 수동이 맞아요.", "flow": "마지막 방식인 콩도르세를 설명하는 글이에요. 약점을 설명하는 마지막 세 문장에서 to가 빠졌는지, 동사가 주어의 수에 맞는지, 능동인지 수동인지를 보세요.", "ko": "마지막으로, 학생 자치회는 콩도르세 방식을 사용하여 표를 집계했다. 이 방식은 가능한 선택지 쌍에 대한 투표자들의 선호도를 비교하는 것을 수반한다. 이 경우에는, 고려해야 할 세 쌍이 있었는데, 그것은 바로 A와 B, B와 C, A와 C였다. 이 방식을 통해, 학생 자치회는 구성원들이 11대 9로 선택지 B보다 선택지 A를 선호한다는 사실을 발견했다. 즉, 11명이 ABC, ACB, CAB 중 하나에 투표하며 B보다 A를 선호했다. 한편, 9명은 BAC, BCA 또는 CBA에 투표함으로써 A보다 B를 선호했다. 흥미롭게도, 투표자들은 동일하게 11대 9로 선택지 C보다 선택지 B를 선호했다. 그들은 또한 11대 9로 선택지 C보다 선택지 A를 선호했다. 미술 전시회인 선택지 A가 나머지 두 선택지보다 더 선호되었으므로, 이 선택지가 승자로 간주될 것이었다. 콩도르세 방식의 약점은 복잡하다는 것과 더불어 때때로 승자를 가려내지 못한다는 점이다. 이는 많은 선택지를 포함하는 선거에서 특히 그렇다. 어떤 선택지도 다른 선택지들보다 명확하게 선호되지 않을 수 있다."}, {"id": "gram6", "kind": "gram", "n": 6, "title": null, "tko": null, "paras": [[{"t": "Instead of all methods pointing toward a single option and making the council’s choice easier", "c": 1}, {"t": ", the winner differed with each method. After a long, intense discussion with Ms. Akers, "}, {"t": "the student council members decided to choose the Condorcet method, as they liked the idea of directly comparing each option with the others", "c": 2}, {"t": ". Everyone agreed that they learned a lot about different voting systems through this experience."}], [{"t": "It is obvious that "}, {"t": "choosing an ideal voting method is a complex and challenging task", "c": 3}, {"t": ". No voting system is flawless or clearly superior to another. "}, {"t": "However we choose will have pros and cons", "c": 4}, {"t": ". Some people believe that it is best to keep the process simple by not ranking our choices at all. Others continue to develop and test new ways of voting, "}, {"t": "argued that more complex methods deliver more accurate results", "c": 5}, {"t": ". All of these efforts are "}, {"t": "designed not making decision-making difficult and inefficient", "c": 6}, {"t": ", but to help us make better decisions as a society. Ultimately, understanding all of the possible voting methods and weighing their pros and cons allows us to better understand the process of decision-making. When we understand decision-making better, "}, {"t": "we are more likely to become better decision-makers ourselves", "c": 7}, {"t": "."}]], "items": [{"c": 4, "w": "However", "r": "Whichever", "gw": "하지만 (부사)", "gr": "어느 것이든 (복합관계대명사)", "fb": "<span class=\"d\">However</span> we choose will have pros and cons", "fg": "<span class=\"d\">Whichever</span> we choose will have pros and cons", "ko": "우리가 선택하는 어느 것이든 장단점이 있을 것이다.", "why": "<b>Whichever we choose will have pros and cons(우리가 선택하는 어느 것이든 장단점이 있을 것이다)</b>에서 whichever는 choose의 목적어이면서, 문장의 주어 덩어리(명사절)를 이끌어요. However (아무리 ~해도)는 부사라서 이렇게 주어 역할을 하는 절을 이끌 수 없어요."}, {"c": 5, "w": "argued", "r": "arguing", "gw": "주장했다 (과거)", "gr": "주장하며 (-ing)", "fb": "Others continue to develop and test new ways of voting, <span class=\"d\">argued</span> that more complex methods deliver more accurate results", "fg": "Others continue to develop and test new ways of voting, <span class=\"d\">arguing</span> that more complex methods deliver more accurate results", "ko": "다른 사람들은 더 복잡한 방식이 더 정확한 결과를 가져온다고 주장하며 계속해서 새로운 투표 방법을 개발하고 시험한다.", "why": "문장에 이미 <b>Others continue to develop and test(다른 사람들은 계속해서 개발하고 시험한다)</b>라는 동사가 있어요. 쉼표 뒤에 argued(주장했다)를 또 쓰면 동사가 두 개가 돼요. &#x27;~라고 주장하며&#x27;라고 덧붙이는 말은 <b>arguing</b>이 맞아요. 주어 Others가 &#x27;주장하는&#x27; 능동 관계라서 -ing예요."}, {"c": 6, "w": "not making", "r": "not to make", "gw": "만들지 않는 (-ing)", "gr": "만들지 않기 위한 (to + 동사원형)", "fb": "All of these efforts are designed <span class=\"d\">not making</span> decision-making difficult and inefficient, but to help us make better decisions as a society", "fg": "All of these efforts are designed <span class=\"d\">not to make</span> decision-making difficult and inefficient, but to help us make better decisions as a society", "ko": "이러한 모든 노력은 의사 결정을 어렵고 비효율적으로 만들기 위한 것이 아니라, 우리가 집단으로서 더 나은 의사 결정을 내릴 수 있게 돕기 위해 고안된 것이다.", "why": "<b>not to make ..., but to help ...(...을 만들기 위한 것이 아니라 ...을 돕기 위한 것)</b>은 not A but B 짝이에요. but 뒤가 to help(돕기 위해)로 to + 동사원형이니 앞도 같은 모양인 <b>not to make</b>여야 해요. 목적을 나타내는 to부정사의 부정은 not to V예요."}], "keep": "Instead of all methods pointing toward a single option and making the council’s choice easier (모든 방식이 하나의 선택지를 가리키고 자치회의 선택을 더 쉽게 만드는 대신)는 전치사 of 뒤에 동명사가 와서 맞아요. the idea of directly comparing each option with the other       if(r.done){
        if(picked&&isT)c.classList.add('hit');else if(isT)c.classList.add('miss');else if(picked)c.classList.add('bad');
        if(isT){var it=q.items.filter(function(i){return i.c===s.c})[0];pe.appendChild(c);pe.appendChild(el('span','fx',' → '+it.r+' '));return}
      }else{
        if(picked)c.classList.add('sel');
        c.onclick=function(){toggle(q,s.c)};
      }
      pe.appendChild(c);
    });
    ps.appendChild(pe)});
  var sub=$('submit'),cnt=$('cnt');
  if(r.done){sub.classList.add('hide');cnt.classList.add('hide');result(q)}
  else{sub.classList.remove('hide');cnt.classList.remove('hide');$('res').classList.add('hide');upd(q)}
}
function upd(q){var r=R(q),n=q.items.length;$('cnt').innerHTML='선택한 곳 <b>'+r.sel.length+'</b> / '+n+(r.sel.length?' · '+r.sel.slice().sort(function(a,b){return a-b}).map(function(c){return CIRC.charAt(c-1)}).join(' '):'');$('submit').disabled=r.sel.length!==n}
function toggle(q,c){
  var r=R(q);if(r.done)return;
  var i=r.sel.indexOf(c);
  if(i>=0)r.sel.splice(i,1);else{if(r.sel.length>=q.items.length)return;r.sel.push(c)}
  save();
  var e=document.querySelector('.cd[data-c="'+c+'"]');if(e)e.classList.toggle('sel',r.sel.indexOf(c)>=0);upd(q);
}
$('submit').onclick=function(){var q=qById(S.cur),r=R(q);if(r.sel.length!==q.items.length)return;r.done=true;if(!isOk(q)){var _k=(q.ko||'').replace(/\s+/g,' ');WN.add({kind:'L3',part:PART,act:'awk',qid:q.id,label:'어색한 곳('+(q.kind==='ctx'?'문맥':'어법')+') · '+_k.slice(0,16)+'…'})}
if(!S.marked&&Q.every(function(x){return R(x).done})){S.marked=1;if(WN.MIX)WN.finish();if(!WN.MODE){try{if(window.PG)PG.mark(PGK)}catch(e){}}}save();draw(q);setTimeout(function(){var x=$('res');if(x.scrollIntoView)x.scrollIntoView({behavior:'smooth',block:'start'})},30)};
function result(q){
  var r=R(q),res=$('res');res.innerHTML='';res.classList.remove('hide');
  var T=truth(q),got=r.sel.filter(function(c){return T.indexOf(c)>=0}).length,ok=isOk(q);
  res.appendChild(el('div','verdict '+(ok?'ok':'ng'),ok?'○ 모두 맞았어요':'× 어색한 곳 '+q.items.length+'개 중 '+got+'개를 찾았어요'));
  q.items.forEach(function(it,ii){
    var d=el('div','it'),h=el('div','ih');
    h.appendChild(el('span','no','('+(ii+1)+')'));
    var hit=r.sel.indexOf(it.c)>=0;
    h.appendChild(el('span','tag '+(hit?'y':'n'),(hit?'찾았어요 ':'놓쳤어요 ')+CIRC.charAt(it.c-1)));
    var ia=el('span','ia');ia.appendChild(el('span','x',it.w));ia.appendChild(document.createTextNode(' '));ia.appendChild(el('em',null,'('+it.gw+')'));ia.appendChild(document.createTextNode(' → '));ia.appendChild(el('span','r',it.r));ia.appendChild(document.createTextNode(' '));ia.appendChild(el('em',null,'('+it.gr+')'));
    h.appendChild(ia);d.appendChild(h);
    var f=el('div','fix');
    if(it.fb)f.appendChild(html('span','l bad','<small>틀린 문장</small>'+it.fb));
    f.appendChild(html('span','l good','<small>고친 문장</small>'+it.fg));d.appendChild(f);
    d.appendChild(el('div','kot',it.ko));
    d.appendChild(html('div','why',it.why));
    res.appendChild(d)});
  var wrongPick=r.sel.filter(function(c){return T.indexOf(c)<0});
  if(wrongPick.length){res.appendChild(html('div','note','<b>잘못 고른 곳</b> '+wrongPick.map(function(c){return CIRC.charAt(c-1)}).join(' ')+'은(는) 글의 흐름과 문법에 맞는 표현이라 그대로 둬요.'))}
  if(WN.MIX){WN.finish();res.appendChild(html('div','note','틀린 문제는 <a href="../wrong.html" style="color:#0f766e;text-decoration:underline">오답 노트</a>에 담겨요.'))}
  else if(WN.MODE){res.appendChild(html('div','note','이제 안 봐도 되는 문제는 <a href="../wrong.html" style="color:#0f766e;text-decoration:underline">오답 노트</a>에서 \'빼기\'로 뺄 수 있어요.'))}
  else if(WN.has('L3',PART,'awk',q.id)){res.appendChild(html('div','note','<a href="../wrong.html" style="color:#0f766e;text-decoration:underline">틀린 '+WN.ids('L3',PART,'awk').length+'개가 오답 노트에 담겼어요 ›</a>'))}
  res.appendChild(html('div','note','<b>글의 흐름</b> '+q.flow));
  res.appendChild(html('div','note','<b>그대로 두는 부분</b> '+q.keep));
  var kb=el('div','kobox');kb.textContent=q.ko;
  var row=el('div','row');
  var bk=el('button','btn','한글 해석 보기');bk.onclick=function(){var on=kb.classList.toggle('on');bk.textContent=on?'한글 해석 닫기':'한글 해석 보기'};
  res.appendChild(bk);res.appendChild(kb);
  var idx=Q.indexOf(q),nx=Q[idx+1];
  var again=el('button','big alt','이 문제 다시 풀기');again.onclick=function(){S.res[q.id]={sel:[],done:false};save();draw(q);window.scrollTo(0,0)};
  var next=el('button','big',nx?'다음 문제 · '+nm(nx):'목록으로');next.onclick=function(){if(nx)open(nx.id);else home()};
  row.appendChild(again);row.appendChild(next);res.appendChild(row);
}
$('toHome').onclick=home;
$('resetAll').onclick=function(){if(!confirm('푼 기록을 모두 지우고 처음부터 할까요?'))return;S={res:{},cur:null};save();home()};
if(S.cur&&qById(S.cur))open(S.cur);else home();
</script><script src="../../common/prog.js?v=261019"></script><script>if(!WN.MODE)PG.bar(PGK,"풀었어요")</script></body></html>
