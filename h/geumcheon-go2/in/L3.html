</style></head><body class="notranslate"><div class="wrap" id="app"></div><script id="data" type="application/json">{"title": "교과서 3과 삽입 다지기", "sub": "영어II 3과 · 11문제", "key": "geumcheon-go2:in:L3", "pass": [{"label": "3과 ① 집단 결정과 학생 자치회의 고민", "sents": [{"en": "We make many personal choices in our lives, from who to have lunch with to what career to pursue.", "ko": "우리는 누구와 점심을 먹을 것인지부터 어떠한 직업을 추구할 것인지까지 우리의 삶에서 많은 개인적인 선택을 한다."}, {"en": "However, there are many situations where we must make decisions as a group.", "ko": "하지만, 우리가 집단으로서 결정을 내려야 하는 상황들이 많이 있다."}, {"en": "Group decision-making is not as simple as our personal choices, as it involves numerous voices with differing opinions.", "ko": "집단 의사 결정은 다른 의견을 가진 수많은 목소리를 수반하기 때문에 우리의 개인적인 선택들만큼 간단하지 않다."}, {"en": "Voting is often used to make group decisions fairer and more efficient, and various voting methods have been developed over time.", "ko": "투표는 흔히 집단 의사 결정을 더 공정하고 더 효율적으로 만들기 위해 사용되며, 시간이 흐르면서 다양한 투표 방법이 개발되어 왔다."}, {"en": "The following story illustrates how these different voting methods work.", "ko": "다음 이야기는 이러한 다양한 투표 방법이 어떻게 작동하는지 보여준다."}, {"en": "The members of the Greenville High School student council needed to decide how to raise money for children in need.", "ko": "Greenville 고등학교 학생 자치회의 구성원들은 어려움에 처한 아이들을 위해 모금할 방법을 결정해야 했다."}, {"en": "Their three options were an art show, a bake sale, and a charity concert, but there were conflicting opinions.", "ko": "그들의 세 가지 선택지는 미술 전시회, 빵 바자회, 그리고 자선 콘서트였지만, 상충되는 의견들이 있었다."}, {"en": "So they decided to put it to a vote.", "ko": "그래서 그들은 그것을 투표에 부치기로 결정했다."}, {"en": "When they asked for advice from Ms. Akers, the council’s advisor, she encouraged them not to use the familiar voting method, but to try something different instead.", "ko": "그들이 자치회의 고문 교사인 Akers 선생님에게 조언을 구했을 때, 그녀는 익숙한 투표 방법을 사용하지 말고, 대신 다른 것을 시도해 보라고 권장했다."}, {"en": "After doing some research, the council members decided to try three different voting systems: the first-past-the-post (FPTP) method, the alternative vote (AV) method, and the Condorcet method.", "ko": "약간의 조사를 한 후, 자치회 구성원들은 단순 다수결(FPTP) 방식, 대안 투표(AV) 방식, 그리고 콩도르세 방식이라는 세 가지의 다른 투표 시스템을 시도해 보기로 결정했다."}, {"en": "The entire council was curious to find out if the different methods would yield different results.", "ko": "모든 자치회 구성원들은 각각 다른 방법이 서로 다른 결과를 낼지 궁금해했다."}]}, {"label": "3과 ② 투표 당일과 FPTP 방식", "sents": [{"en": "On the day of the vote, each possible event was given a letter: “art show” was represented by the letter A, the letter B indicated “bake sale,” and C stood for “charity concert.”", "ko": "투표 당일, 각각의 가능한 행사에 글자가 하나씩 부여되었다. ‘미술 전시회’는 글자 A로 표시되었고, 글자 B는 ‘빵 바자회’를 나타냈으며, C는 ‘자선 콘서트’를 의미했다."}, {"en": "Each of the 20 council members was given a voting slip and instructed to write down the options in order of preference.", "ko": "20명의 자치회 구성원들 각각은 투표용지를 받았고, 선호하는 순서대로 선택지를 적으라는 지시를 받았다."}, {"en": "For example, if the charity concert was their first choice, followed by the bake sale and the art show, they would write CBA.", "ko": "예를 들어, 자선 콘서트가 첫 번째 선택이고 빵 바자회와 미술 전시회가 뒤따른다면, 그들은 CBA를 적을 것이다."}, {"en": "After every member had voted, the voting slips were counted.", "ko": "모든 구성원이 투표를 마친 후, 투표용지가 집계되었다."}, {"en": "The results were as follows:", "ko": "결과는 다음과 같았다."}, {"en": "The FPTP method is the simplest of the three methods.", "ko": "FPTP 방식은 세 가지 방식 중 가장 간단하다."}, {"en": "Voters are given several options, and whichever gets the most first-preference votes wins.", "ko": "투표자들에게는 여러 가지 선택지가 주어지고, 어떤 것이든 가장 많은 1지망 표를 얻은 것이 이긴다."}, {"en": "Neither the second nor third preference matters at all, so they are ignored.", "ko": "2지망도 3지망도 둘 다 전혀 중요하지 않으므로, 그것들은 무시된다."}, {"en": "This method is commonly used in political elections around the world.", "ko": "이 방식은 전 세계 정치 선거에서 흔히 사용된다."}, {"en": "The student council quickly determined that the winner would be option C, the charity concert.", "ko": "학생 자치회는 빠르게 자선 콘서트인 선택지 C가 승자가 될 것임을 알아냈다."}, {"en": "This was because it received 8 first-preference votes, while option A received 5 and option B received 7.", "ko": "이는 선택지 A가 5표, 선택지 B가 7표를 받은 반면, 그것(C)은 1지망 표 8표를 받았기 때문이었다."}]}, {"label": "3과 ③ FPTP의 약점과 AV 방식", "sents": [{"en": "The FPTP method is uncomplicated and easy to understand, but it has a significant weakness.", "ko": "FPTP 방식은 복잡하지 않고 이해하기 쉽지만, 상당한 약점을 가지고 있다."}, {"en": "It is possible to win a vote without the support of the majority.", "ko": "과반수의 지지 없이도 투표에서 승리하는 것이 가능하다."}, {"en": "That was the case here.", "ko": "이것이 바로 그런 경우였다."}, {"en": "According to the results of the FPTP method, the council’s choice was to hold a charity concert.", "ko": "FPTP 방식의 결과에 따르면, 자치회의 선택은 자선 콘서트를 개최하는 것이었다."}, {"en": "However, only 8 out of 20 council members chose the charity concert as their first preference, which equaled 40% of the total votes.", "ko": "하지만 20명의 자치회 구성원 중 8명만이 1지망으로 자선 콘서트를 골랐는데, 이는 전체 표의 40%에 해당했다."}, {"en": "Next, the council members examined the votes using the AV method, and they soon realized that there would be a different result.", "ko": "다음으로, 자치회 구성원들은 AV 방식을 사용하여 표를 검토했고, 그들은 곧 다른 결과가 나올 것이라는 것을 깨달았다."}, {"en": "The AV method can potentially include more than one round of counting.", "ko": "AV 방식은 잠재적으로 한 차례 이상의 집계를 포함할 수 있다."}, {"en": "For an option to win in the first round, it needs to get more than 50% of the first-preference votes.", "ko": "어떤 선택지가 1차 집계에서 승리하려면, 1지망 표의 50%를 넘게 얻어야 한다."}, {"en": "As the charity concert only received 40% of the total votes, a second round of counting was required.", "ko": "자선 콘서트는 전체 표의 40%만을 받았기 때문에, 2차 집계가 필요했다."}]}, {"label": "3과 ④ AV 결과와 약점", "sents": [{"en": "Option A, the art show, received the fewest first-preference votes, with only 5 council members voting for it.", "ko": "미술 전시회인 선택지 A는 1지망 표를 가장 적게 받았는데, 그것에 투표한 자치회 구성원은 5명뿐이었다."}, {"en": "Therefore, option A was eliminated, and the 5 council members’ votes were redistributed based on their second preferences.", "ko": "따라서 선택지 A는 제거되었고, 5명의 자치회 구성원들의 표가 그들의 두 번째 선호도에 따라 재분배되었다."}, {"en": "As a result, 4 votes for option B (ABC) and 1 for option C (ACB) were added to the total.", "ko": "그 결과, 선택지 B에 4표(ABC), 선택지 C에 1표(ACB)가 합계에 추가되었다."}, {"en": "This meant that option B had 11 total votes, while option C had only 9.", "ko": "이것은 선택지 B가 총 11표를 얻은 반면, 선택지 C는 9표밖에 얻지 못했다는 것을 의미했다."}, {"en": "As a result, the bake sale would be the winner.", "ko": "결과적으로, 빵 바자회가 승자가 될 것이었다."}, {"en": "Unfortunately, the AV method is not perfect either.", "ko": "안타깝게도, AV 방식도 완벽하지는 않다."}, {"en": "It sometimes allows second-preference votes to have a greater influence than first-preference votes.", "ko": "그것은 때때로 2지망 표가 1지망 표보다 더 큰 영향력을 갖게 하기도 한다."}, {"en": "In this case, the bake sale won, but this was mainly due to the second-preference votes it received.", "ko": "이 경우에는 빵 바자회가 승리했지만, 이는 주로 그것이 얻은 2지망 표 때문이었다."}]}, {"label": "3과 ⑤ 콩도르세 방식과 결과", "sents": [{"en": "Finally, the student council counted the votes using the Condorcet method.", "ko": "마지막으로, 학생 자치회는 콩도르세 방식을 사용하여 표를 집계했다."}, {"en": "This method involves comparing the voters’ preferences between each possible pair of options.", "ko": "이 방식은 가능한 선택지 쌍에 대한 투표자들의 선호도를 비교하는 것을 수반한다."}, {"en": "In this case, there were three pairs to consider: A vs. B, B vs. C, and A vs. C.", "ko": "이 경우에는, 고려해야 할 세 쌍이 있었는데, 그것은 바로 A와 B, B와 C, A와 C였다."}, {"en": "Through this method, the student council discovered that its members preferred option A to option B by a count of 11 to 9.", "ko": "이 방식을 통해, 학생 자치회는 구성원들이 11대 9로 선택지 B보다 선택지 A를 더 선호한다는 사실을 알아냈다."}, {"en": "In other words, 11 people preferred A to B, voting either ABC, ACB, or CAB.", "ko": "즉, 11명이 ABC, ACB, CAB 중 하나에 투표하며 B보다 A를 선호했다."}, {"en": "Meanwhile, 9 people preferred B to A by voting BAC, BCA, or CBA.", "ko": "한편, 9명은 BAC, BCA 또는 CBA에 투표함으로써 A보다 B를 선호했다."}, {"en": "Interestingly, the voters preferred option B to option C by the same count of 11 to 9.", "ko": "흥미롭게도, 투표자들은 동일하게 11대 9로 선택지 C보다 선택지 B를 선호했다."}, {"en": "They also preferred option A to option C by 11 to 9.", "ko": "그들은 또한 11대 9로 선택지 C보다 선택지 A를 선호했다."}, {"en": "As option A, the art show, was preferred to both of the other options, it would be considered the winner.", "ko": "미술 전시회인 선택지 A가 나머지 두 선택지보다 더 선호되었으므로, 이 선택지가 승자로 간주될 것이었다."}, {"en": "The Condorcet method’s weakness is that, along with being complex, it sometimes fails to select a winner.", "ko": "콩도르세 방식의 약점은 복잡하다는 것과 더불어 때때로 승자를 가려내지 못한다는 점이다."}, {"en": "This is especially true in elections that contain numerous options.", "ko": "이는 많은 선택지를 포함하는 선거에서 특히 그렇다."}, {"en": "It is possible that no option will be clearly preferred over the others.", "ko": "어떤 선택지도 다른 선택지들보다 명확하게 선호되지 않을 수 있다."}]}, {"label": "3과 ⑥ 승자는 제각각, 더 나은 결정", "sents": [{"en": "Instead of all methods pointing toward a single option and making the council’s choice easier, the winner differed with each method.", "ko": "모든 방식이 하나의 선택지를 가리키고 자치회의 선택을 더 쉽게 만드는 대신, 각 방식마다 승자는 달랐다."}, {"en": "After a long, intense discussion with Ms. Akers, the student council members decided to choose the Condorcet method, as they liked the idea of directly comparing each option with the others.", "ko": "Akers 선생님과의 오랜 열정적인 논의 끝에, 학생 자치회 구성원들은 콩도르세 방식을 선택하기로 결정했는데, 각 선택지를 다른 선택지들과 직접적으로 비교한다는 점이 마음에 들었기 때문이다."}, {"en": "Everyone agreed that they learned a lot about different voting systems through this experience.", "ko": "모두가 이번 경험을 통해 각기 다른 투표 시스템에 대해 많은 것을 배웠다는 것에 동의했다."}, {"en": "It is obvious that choosing an ideal voting method is a complex and challenging task.", "ko": "이상적인 투표 방법을 선택하는 것은 복잡하고 도전적인 일이라는 것은 분명하다."}, {"en": "No voting system is flawless or clearly superior to another.", "ko": "어떤 투표 시스템도 완벽하거나 다른 시스템보다 명백히 우수하지는 않다."}, {"en": "Whichever we choose will have pros and cons.", "ko": "우리가 선택하는 어느 것이든 장단점이 있을 것이다."}, {"en": "Some people believe that it is best to keep the process simple by not ranking our choices at all.", "ko": "어떤 사람들은 우리들의 선택들에 아예 순위를 매기지 않음으로써 과정을 단순하게 유지하는 것이 최선이라고 생각한다."}, {"en": "Others continue to develop and test new ways of voting, arguing that more complex methods deliver more accurate results.", "ko": "다른 사람들은 더 복잡한 방식이 더 정확한 결과를 가져온다고 주장하며 계속해서 새로운 투표 방법을 개발하고 시험한다."}, {"en": "All of these efforts are designed not to make decision-making difficult and inefficient, but to help us make better decisions as a society.", "ko": "이러한 모든 노력은 의사 결정을 어렵고 비효율적으로 만들려는 것이 아니라, 우리가 사회로서 더 나은 결정을 내리도록 돕기 위해 고안된 것이다."}, {"en": "Ultimately, understanding all of the possible voting methods and weighing their pros and cons allows us to better understand the process of decision-making.", "ko": "결국, 모든 가능한 투표 방법을 이해하고 장단점을 따져 보는 것은 우리가 의사 결정 과정을 더 잘 이해할 수 있게 한다."}, {"en": "When we understand decision-making better, we are more likely to become better decision-makers ourselves.", "ko": "우리가 의사 결정을 더 잘 이해할 때, 우리 스스로 더 나은 의사 결정자가 될 가능성이 더 높다."}]}], "items": [{"id": "in-g2_L3-01", "p": 0, "s": 1, "pos": [1, 3, 5, 7, 9], "cue": ["However(그러나) → 앞 문장 personal choices(개인적인 선택)와 대비되는 decisions as a group(집단으로서의 결정)", "뒤 문장 Group decision-making(집단 의사 결정) = make decisions as a group(집단으로서 결정을 내리다)을 받는 말"], "trap": [[3, "Group decision-making(집단 의사 결정)을 이미 설명한 뒤라 ‘집단으로 결정해야 하는 상황이 있다’는 소개가 뒤늦음"], [5, "투표 방법 얘기로 넘어간 뒤라 개인 선택과의 대비가 들어갈 자리가 아님"]], "var": {"en": "On the other hand, there are many situations where we must make decisions as a group.", "ko": "반면에, 우리가 집단으로서 결정을 내려야 하는 상황들이 많이 있다.", "chg": "However(그러나) → On the other hand(반면에)", "note": "앞머리가 바뀌어도 personal(개인의) ↔ group(집단)의 대비가 단서"}, "fam": "역접 가족: However(그러나) / Yet(그렇지만) / Nevertheless(그럼에도 불구하고) / Still(그런데도) / On the other hand(반면에)", "post": "개인적인 선택들 → 그러나 집단 결정이 필요한 상황 → 집단 결정은 더 복잡함"}, {"id": "in-g2_L3-02", "p": 0, "s": 4, "pos": [1, 2, 4, 6, 8], "cue": ["these different voting methods(이러한 다양한 투표 방법) = 앞 문장의 various voting methods(다양한 투표 방법들)", "The following story(다음 이야기) → 뒤 문장부터 Greenville High School(그린빌 고등학교) 학생 자치회 이야기 시작"], "trap": [[6, "이야기가 이미 시작된 뒤라 The following story(다음 이야기)라는 예고가 뒤늦음"], [2, "집단 결정 얘기 뒤라 통해 보이지만 voting methods(투표 방법)가 아직 한 번도 안 나와 these(이러한)가 가리킬 말이 없음"]], "var": {"en": "The story below illustrates how such voting methods work.", "ko": "아래 이야기는 그런 투표 방법들이 어떻게 작동하는지 보여준다.", "chg": "The following story(다음 이야기) → The story below(아래 이야기), these different(이러한 다양한) → such(그런)", "note": "these가 such로 바뀌어도 앞에 voting methods(투표 방법)가 먼저 나와야 하는 점은 그대로"}, "fam": "앞 명사를 받는 말: It(그것) / This(이것) / This + 명사(이 ~) / The + 명사(그 ~) / Such + 명사(그런 ~)", "post": "다양한 투표 방법이 개발됨 → 그 방법들을 보여 줄 이야기 예고 → 학생 자치회 이야기 시작"}, {"id": "in-g2_L3-03", "p": 1, "s": 2, "pos": [1, 2, 4, 6, 9], "cue": ["For example(예를 들어) → 앞 문장 write down the options in order of preference(선호 순서대로 선택지를 적다)의 예", "their(그들의)·they(그들) = 앞 문장의 Each of the 20 council members(자치회 구성원 20명 각각)", "CBA → 글의 첫 문장에서 정한 글자 A, B, C를 선호 순서로 나열한 것"], "trap": [[1, "글자를 정한 바로 뒤라 CBA가 이어져 보이지만 ‘순서대로 적으라’는 지시가 아직 없고 their·they가 가리킬 사람도 없음"], [4, "were counted(집계되었다) 뒤, 즉 개표가 끝난 뒤라 적는 방법의 예가 나올 시점이 지남"]], "var": {"en": "For instance, if the charity concert was their first choice, followed by the bake sale and the art show, they would write CBA.", "ko": "예를 들어, 자선 콘서트가 첫 번째 선택이고 빵 바자회와 미술 전시회가 뒤따른다면, 그들은 CBA를 적을 것이다.", "chg": "For example(예를 들어) → For instance(예를 들어)", "note": "모양이 달라도 같은 예시 신호, 앞에 ‘선호 순서대로 적기’라는 지시가 필요"}, "fam": "예시 가족: For example(예를 들어) / For instance(예를 들어) / such as(~와 같은) / To illustrate(예를 들어 설명하면)", "post": "선호 순서대로 적으라는 지시 → 예: 콘서트·바자회·전시회 순이면 CBA → 투표 후 개표"}, {"id": "in-g2_L3-04", "p": 1, "s": 10, "pos": [3, 5, 7, 9, 10], "cue": ["This was because(이것은 ~ 때문이었다) → 앞 문장이 결과, the winner would be option C(승자는 선택지 C일 것이다)", "it(그것) = option C, the charity concert(선택지 C, 자선 콘서트)", "8 first-preference votes(1지망 표 8표) → FPTP 방식의 the most first-preference votes(가장 많은 1지망 표)와 연결"], "trap": [[9, "‘정치 선거에서 흔히 쓰인다’ 뒤에 넣으면 This가 그 사실을 가리켜 이유가 안 맞고, it(그것)이 가리킬 option C도 아직 안 나옴"], [7, "‘1지망 표가 가장 많으면 이긴다’ 뒤라 표 얘기가 이어지지만 승자 발표 전에 이유부터 나오는 꼴"]], "var": {"en": "The reason was that it received 8 first-preference votes, while option A   h+='<div class="exh">이 자리인 이유</div>';it.cue.forEach(function(c){h+='<div class="why">'+esc(c)+'</div>'});
  (it.trap||[]).forEach(function(t){var k=it.pos.indexOf(t[0]);if(k<0)return;h+='<div class="trap"><b>'+C[k]+'</b> '+esc(t[1])+'</div>'});
  if(lv==2)h+='<div class="chg"><b>바뀐 앞머리</b>'+esc(it['var'].chg)+(it['var'].note?'<div>'+esc(it['var'].note)+'</div>':'')+'</div>';
  if(it.fam)h+='<div class="post"><small>연결어 가족</small>'+esc(it.fam)+'</div>';
  if(it.post)h+='<div class="post"><small>흐름 기억</small>'+esc(it.post)+'</div>';
  h+='<button class="go" onclick="op('+cur+','+lv+')">다시 풀기</button>';
  if(lv==1)h+='<button class="go sec" onclick="op('+cur+',2)">2단계 변형 문장으로</button>';
  else if(cur+1<IT.length)h+='<button class="go sec" onclick="op('+(cur+1)+',1)">다음 문제</button>'}
 h+='<button class="go sec" onclick="home()">목록으로</button>';
 $('app').innerHTML=h}
function pk(k){pick=k;draw()}
function sub(){done=true;var it=IT[cur];if(it.pos[pick]==it.s){st[it.id]=st[it.id]||{};st[it.id][lv]=1;save()}draw()}
home();
</script></body></html>
