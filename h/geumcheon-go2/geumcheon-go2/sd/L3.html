rnative vote (AV) method, and the Condorcet method.", "ko": "약간의 조사를 한 후, 자치회 구성원들은 단순 다수결(FPTP) 방식, 대안 투표(AV) 방식, 그리고 콩도르세 방식이라는 세 가지의 다른 투표 시스템을 시도해 보기로 결정했다."}, {"en": "The entire council was curious to find out if the different methods would yield different results.", "ko": "모든 자치회 구성원들은 각각 다른 방법이 서로 다른 결과를 낼지 궁금해했다."}], "chunks": [[0, 0], [1, 2], [3, 4], [5, 7], [8, 10]], "half": 5, "ex": [{"head": "We make many personal choices", "clue": ["personal choices"], "core": "점심 친구부터 진로까지, 삶은 개인적 선택의 연속", "why": "글의 출발: 누구나 하는 '개인적인 선택'"}, {"head": "However, there are many situations", "clue": ["However", "as a group"], "core": "하지만 집단으로 결정해야 할 때도 많음", "why": "However(하지만) → 개인 선택과 대조되는 '집단 결정' 등장"}, {"head": "Group decision-making is not as", "clue": ["Group decision-making", "not as simple as"], "core": "집단 결정은 의견이 제각각이라 개인 선택만큼 간단하지 않음", "why": "Group decision-making = 앞의 'decisions as a group'을 다시 받은 말"}, {"head": "Voting is often used to", "clue": ["Voting", "fairer and more efficient"], "core": "그래서 투표를 쓰고, 다양한 투표 방법이 발전해 옴", "why": "'간단하지 않음'이라는 문제 → 해결책(투표) 제시"}, {"head": "The following story illustrates how", "clue": ["The following story", "these different voting methods"], "core": "다음 이야기로 여러 투표 방법의 작동 확인", "why": "these(이러한) 방법들 = 앞의 다양한 투표 방법 → 본론 예고"}, {"head": "The members of the Greenville", "clue": ["student council", "raise money"], "core": "Greenville 고 학생 자치회: 어려운 아이들을 위한 모금 방법을 정해야 함", "why": "The following story(다음 이야기) 예고 → 이야기 시작: 학생 자치회와 과제 등장"}, {"head": "Their three options were an", "clue": ["Their three options", "conflicting opinions"], "core": "선택지 셋(미술 전시회·빵 바자회·자선 콘서트), 의견 충돌", "why": "Their(그들의) = 자치회, options = 모금 방법 후보"}, {"head": "So they decided to put", "clue": ["So", "put it to a vote"], "core": "그래서 투표로 정하기로", "why": "So(그래서) = 의견이 갈린 결과 / it = 모금 방법 결정"}, {"head": "When they asked for advice", "clue": ["Ms. Akers", "the familiar voting method", "something different"], "core": "고문 Akers 선생님: 익숙한 방식 말고 다른 방식을 써 보라", "why": "투표하기로 한 뒤에야 '어떤 투표 방식'을 조언받을 수 있음"}, {"head": "After doing some research, the", "clue": ["After doing some research", "three different voting systems"], "core": "조사 후 FPTP·AV·콩도르세 세 방식을 써 보기로", "why": "something different(다른 것) 권유 → 조사해서 고른 '다른' 세 방식"}, {"head": "The entire council was curious", "clue": ["the different methods", "different results"], "core": "방식마다 결과가 다를지 모두 궁금해함", "why": "the different methods = 바로 앞의 세 투표 방식"}], "postit": "개인 선택 ↔ 집단 결정 → 쉽지 않음 → 투표·다양한 방식 → 이야기 예고 → 자치회 모금 고민 → 의견 충돌 → 투표로 → 선생님: 다른 방식 → 세 방식 선택 → 결과가 다를까?", "cex": [{"core": "점심 친구부터 진로까지, 삶은 개인적 선택의 연속", "why": "글의 출발: We make many personal choices(우리는 많은 개인적 선택을 한다) → 개인 선택부터"}, {"core": "집단 결정은 의견이 제각각이라 간단하지 않음", "why": "However(하지만) → 개인 선택과 대조되는 decisions as a group(집단 결정) 등장"}, {"core": "해결책 투표와 다양한 투표 방법, 이야기로 확인 예고", "why": "Voting(투표) → '간단하지 않은' 집단 결정을 공정·효율적으로 만드는 방법"}, {"core": "자치회 모금 방법 셋, 의견 충돌로 투표 결정", "why": "The following story(다음 이야기) 예고 → student council(학생 자치회) 이야기 시작"}, {"core": "Akers 조언으로 FPTP·AV·콩도르세 시도", "why": "When they asked for advice(조언을 구했을 때) → 투표하기로 한 뒤 어떤 방식으로 할지"}]}, {"id": "g2_L3-p2", "label": "3과 ② 투표 당일과 FPTP 방식", "sents": [{"en": "On the day of the vote, each possible event was given a letter: “art show” was represented by the letter A, the letter B indicated “bake sale,” and C stood for “charity concert.”", "ko": "투표 당일, 각각의 가능한 행사에 글자가 하나씩 부여되었다. ‘미술 전시회’는 글자 A로 표시되었고, 글자 B는 ‘빵 바자회’를 나타냈으며, C는 ‘자선 콘서트’를 의미했다."}, {"en": "Each of the 20 council members was given a voting slip and instructed to write down the options in order of preference.", "ko": "20명의 자치회 구성원들 각각은 투표용지를 받았고, 선호하는 순서대로 선택지를 적으라는 지시를 받았다."}, {"en": "For example, if the charity concert was their first choice, followed by the bake sale and the art show, they would write CBA.", "ko": "예를 들어, 자선 콘서트가 첫 번째 선택이고 빵 바자회와 미술 전시회가 뒤따른다면, 그들은 CBA를 적을 것이다."}, {"en": "After every member had voted, the voting slips were counted.", "ko": "모든 구성원이 투표를 마친 후, 투표용지가 집계되었다."}, {"en": "The results were as follows:", "ko": "결과는 다음과 같았다."}, {"en": "The FPTP method is the simplest of the three methods.", "ko": "FPTP 방식은 세 가지 방식 중 가장 간단하다."}, {"en": "Voters are given several options, and whichever gets the most first-preference votes wins.", "ko": "투표자들에게는 여러 가지 선택지가 주어지고, 어떤 것이든 가장 많은 1지망 표를 얻은 것이 이긴다."}, {"en": "Neither the second nor third preference matters at all, so they are ignored.", "ko": "2지망도 3지망도 둘 다 전혀 중요하지 않으므로, 그것들은 무시된다."}, {"en": "This method is commonly used in political elections around the world.", "ko": "이 방식은 전 세계 정치 선거에서 흔히 사용된다."}, {"en": "The student council quickly determined that the winner would be option C, the charity concert.", "ko": "학생 자치회는 빠르게 자선 콘서트인 선택지 C가 승자가 될 것임을 알아냈다."}, {"en": "This was because it received 8 first-preference votes, while option A received 5 and option B received 7.", "ko": "이는 선택지 A가 5표, 선택지 B가 7표를 받은 반면, 그것(C)은 1지망 표 8표를 받았기 때문이었다."}], "chunks": [[0, 0], [1, 2], [3, 4], [5, 7], [8, 10]], "half": 5, "ex": [{"head": "On the day of the", "clue": ["On the day of the vote", "a letter"], "core": "투표 날, 행사마다 글자: A 미술 전시회, B 빵 바자회, C 자선 콘서트", "why": "글의 출발: 투표 당일, 선택지에 이름표(글자) 붙이기"}, {"head": "Each of the 20 council", "clue": ["a voting slip", "in order of preference"], "core": "20명 모두 투표용지에 선호 순서대로 적기", "why": "글자를 정한 다음 → 그 글자로 적을 투표용지 배부"}, {"head": "For example, if the charity", "clue": ["For example", "CBA"], "core": "예: 자선 콘서트 > 빵 바자회 > 미술 전시회 = CBA", "why": "For example(예를 들어) = 앞의 '선호 순서대로 쓰기'의 예시"}, {"head": "After every member had voted", "clue": ["After every member had voted", "the voting slips"], "core": "모두 투표한 뒤 투표용지 집계", "why": "After(~한 후) = 투표 다음 단계 / the voting slips = 앞의 투표용지"}, {"head": "The results were as", "clue": ["The results", "as follows"], "core": "결과는 다음과 같음(표)", "why": "집계 → 그 결과 발표로 마무리"}, {"head": "The FPTP method is the", "clue": ["The FPTP method", "the simplest"], "core": "FPTP = 세 방식 중 가장 간단", "why": "결과 표가 나온 뒤 → 세 방식 중 첫 번째 FPTP부터 설명 시작"}, {"head": "Voters are given several options", "clue": ["first-preference votes", "wins"], "core": "1지망 표를 가장 많이 받은 것이 승리", "why": "'간단하다'는 방식이 실제로 어떻게 돌아가는지 설명"}, {"head": "Neither the second nor third", "clue": ["Neither the second nor third preference", "ignored"], "core": "2·3지망은 전혀 상관없어 무시", "why": "앞의 first(1지망)만 센다 → 그럼 second·third는? 바로 이어서"}, {"head": "This method is commonly used", "clue": ["This method", "political elections"], "core": "전 세계 정치 선거에서 흔히 사용", "why": "This method(이 방식) = 앞에서 설명한 FPTP"}, {"head": "The student council quickly determined", "clue": ["The student council", "option C"], "core": "자치회 결과: 곧바로 C(자선 콘서트) 승리", "why": "방식 설명(일반) → 자치회 투표에 적용(이야기)으로 전환"}, {"head": "This was because it received", "clue": ["This was because", "8 first-preference votes"], "core": "이유: C 8표, A 5표, B 7표", "why": "This(이것) = C가 이긴 일 / because(왜냐하면)로 이유 설명"}], "postit": "선택지에 글자 → 선호 순서대로 쓰기(CBA) → 집계·결과 → FPTP 가장 간단 → 1지망만 셈 → 정치 선거에 흔함 → C 승리(8 > 7 > 5)", "cex": [{"core": "투표 날 A 전시회·B 바자회·C 콘서트로 표시", "why": "글의 출발: On the day of the vote(투표 당일) → 선택지에 글자 이름표 붙이기"}, {"core": "20명이 선호 순서대로 적기, 예: CBA", "why": "Each of the 20 council members(20명 각자) → 정한 글자로 투표용지에 적기"}, {"core": "투표 후 용지 집계, 결과 발표", "why": "After every member had voted(모두 투표한 후) → 다음 단계인 집계"}, {"core": "FPTP = 1지망 최다 득표 승리, 2·3지망 무시", "why": "The FPTP method(FPTP 방식) → 결과 표 뒤 세 방식 중 첫 번째 설명 시작"}, {"core": "정치 선거에 흔한 방식, 자치회 결과 C(8표) 승리", "why": "This method(이 방식) = FPTP → 일반 설명에서 자치회 결과 적용으로"}]}, {"id": "g2_L3-p3", "label": "3과 ③ FPTP의 약점과 AV 방식", "sents": [{"en": "The FPTP method is uncomplicated and easy to understand, but it has a significant weakness.", "ko": "FPTP 방식은 복잡하지 않고 이해하기 쉽지만, 상당한 약점을 가지고 있다."}, {"en": "It is possible to win a vote without the support of the majority.", "ko": "과반수의 지지 없이도 투표에서 승리하는 것이 가능하다."}, {"en": "That was the case here.", "ko": "이것이 바로 그런 경우였다."}, {"en": "According to the results of the FPTP method, the council’s choice was to hold a charity concert.", "ko": "FPTP 방식의 결과에 따르면, 자치회의 선택은 자선 콘서트를 개최하는 것이었다."}, {"en": "However, only 8 out of 20 council members chose the charity concert as their first preference, which equaled 40% of the total votes.", "ko": "하지만 20명의 자치회 구성원 중 8명만이 1지망으로 자선 콘서트를 골랐는데, 이는 전체 표의 40%에 해당했다."}, {"en": "Next, the council members examined the votes using the AV method, and they soon realized that there would be a different result.", "ko": "다음으로, 자치회 구성원들은 AV 방식을 사용하여 표를 검토했고, 그들은 곧 다른 결과가 나올 것이라는 것을 깨달았다."}, {"en": "The AV method can potentially include more than one round of counting.", "ko": "AV 방식은 잠재적으로 한 차례 이상의 집계를 포함할 수 있다."}, {"en": "For an option to win in the first round, it needs to get more than 50% of the first-preference votes.", "ko": "어떤 선택지가 1차 집계에서 승리하려면, 1지망 표의 50%를 넘게 얻어야 한다."}, {"en": "As the charity concert only received 40% of the total votes, a second round of counting was required.", "ko": "자선 콘서트는 전체 표의 40%만을 받았기 때문에, 2차 집계가 필요했다."}], "chunks": [[0, 1], [2, 4], [5, 6], [7, 8]], "half": 5, "ex": [{"head": "The FPTP method is uncomplicated", "clue": ["uncomplicated", "but", "a significant weakness"], "core": "FPTP는 쉽지만 큰 약점 있음", "why": "글의 출발: 결과가 나온 뒤 FPTP 평가(장점 + 약점 예고)"}, {"head": "It is possible to win", "clue": ["without the support of the majority"], "core": "약점: 과반수 지지 없이도 이길 수 있음", "why": "a significant weakness(큰 약점)의 구체적 내용"}, {"head": "That was the case", "clue": ["That", "the case here"], "core": "바로 이번이 그 경우", "why": "That(그것) = 과반수 없이 이기는 일 / here(여기) = 자치회 투표"}, {"head": "According to the results of", "clue": ["According to the results", "a charity concert"], "core": "FPTP 결과로는 자선 콘서트 선택", "why": "'이번이 그 경우' → 자치회 결과 다시 확인"}, {"head": "However, only 8 out of", "clue": ["However", "only 8 out of 20", "40%"], "core": "하지만 20명 중 8명만 1지망 = 40%, 과반 아님", "why": "However(하지만) → 이겼지만 과반수(50% 초과)는 아니었음 증명"}, {"head": "Next, the council members examined", "clue": ["Next", "the AV method", "a different result"], "core": "다음은 AV 방식, 곧 다른 결과가 나올 것을 깨달음", "why": "Next(다음으로) → FPTP 약점까지 본 뒤 두 번째 방식 AV로"}, {"head": "The AV method can potentially", "clue": ["more than one round of counting"], "core": "AV는 집계를 여러 번 할 수 있음", "why": "AV 방식의 첫 특징: 집계 라운드가 여러 번"}, {"head": "For an option to win", "clue": ["the first round", "more than 50%"], "core": "1차에서 이기려면 1지망 50% 초과 필요", "why": "the first round(그 1차) = 앞에서 말한 여러 라운드 중 첫 번째"}, {"head": "As the charity concert only", "clue": ["only received 40%", "a second round"], "core": "콘서트는 40%뿐 → 2차 집계 필요", "why": "50% 기준 → 40%는 못 넘음 → 그래서 2차로"}], "postit": "FPTP 약점: 과반 없이 승리 → 이번이 그 경우 → 콘서트 40%뿐 → 다음 AV 방식 → 여러 번 집계 → 1차는 50% 초과 필요 → 40%라 2차로", "cex": [{"core": "FPTP의 약점: 과반수 지지 없이도 승리 가능", "why": "글의 출발: uncomplicated ~, but(간단하지만) → FPTP 평가와 a significant weakness(큰 약점)"}, {"core": "이번 콘서트 승리도 1지망 40%, 과반 아님", "why": "That was the case here(이번이 그 경우) → 약점을 자치회 결과에 적용"}, {"core": "다음 AV 방식, 다른 결과와 여러 차례 집계", "why": "Next(다음으로) → FPTP 약점 확인 뒤 두 번째 방식 AV로"}, {"core": "1차 승리엔 과반 필요, 콘서트 40%라 2차로", "why": "the first round(1차) = 앞의 '여러 차례 집계' 중 첫 번째 기준"}]}, {"id": "g2_L3-p4", "label": "3과 ④ AV 결과와 약점", "sents": [{"en": "Option A, the art show, received the fewest first-preference votes, with only 5 council members voting for it.", "ko": "미술 전시회인 선택지 A는 1지망 표를 가장 적게 받았는데, 그것에 투표한 자치회 구성원은 5명뿐이었다."}, {"en": "Therefore, option A was eliminated, and the 5 council members’ votes were redistributed based on their second preferences.", "ko": "따라서 선택지 A는 제거되었고, 5명의 자치회 구성원들의 표가 그들의 두 번째 선호도에 따라 재분배되었다."}, {"en": "As a result, 4 votes for option B (ABC) and 1 for option C (ACB) were added to the total.", "ko": "그 결과, 선택지 B에 4표(ABC), 선택지 C에 1표(ACB)가 합계에 추가되었다."}, {"en": "This meant that option B had 11 total votes, while option C had only 9.", "ko": "이것은 선택지 B가 총 11표를 얻은 반면, 선택지 C는 9표밖에 얻지 못했다는 것을 의미했다."}, {"en": "As a result, the bake sale would be the winner.", "ko": "결과적으로, 빵 바자회가 승자가 될 것이었다."}, {"en": "Unfortunately, the AV method is not perfect either.", "ko": "안타깝게도, AV 방식도 완벽하지는 않다."}, {"en": "It sometimes allows second-preference votes to have a greater influence than first-preference votes.", "ko": "그것은 때때로 2지망 표가 1지망 표보다 더 큰 영향력을 갖게 하기도 한다."}, {"en": "In this case, the bake sale won, but this was mainly due to the second-preference votes it received.", "ko": "이 경우에는 빵 바자회가 승리했지만, 이는 주로 그것이 얻은 2지망 표 때문이었다."}], "chunks": [[0, 1], [2, 3], [4, 5], [6, 7]], "half": 4, "ex": [{"head": "Option A, the art show", "clue": ["Option A", "the fewest"], "core": "A(미술 전시회)는 1지망 5표로 꼴찌", "why": "글의 출발: 2차 집계에서 1지망 꼴찌는 A(미술 전시회), 단 5표"}, {"head": "Therefore, option A was eliminated", "clue": ["Therefore", "eliminated", "second preferences"], "core": "그래서 A 탈락, 그 5표는 2지망대로 재분배", "why": "Therefore(그래서) = 꼴찌였던 결과 / the 5 council members = A에 투표한 5명"}, {"head": "As a result, 4 votes", "clue": ["As a result", "4 votes for option B", "1 for option C"], "core": "재분배 결과: B에 4표(ABC), C에 1표(ACB) 추가", "why": "As a result(그 결과) = 앞의 A 탈락·재분배의 결과 → 표 추가"}, {"head": "This meant that option B", "clue": ["This meant", "11 total votes", "only 9"], "core": "그래서 B 총 11표, C는 9표", "why": "This(이것) = 표 추가 → 7+4 = 11, 8+1 = 9 계산"}, {"head": "As a result, the bake", "clue": ["As a result", "the bake sale"], "core": "결과: 빵 바자회 승리", "why": "11 대 9 → 승자 결정 / bake sale(빵 바자회) = 선택지 B"}, {"head": "Unfortunately, the AV method is", "clue": ["Unfortunately", "not perfect either"], "core": "아쉽게도 AV도 완벽하지 않음", "why": "either(~도) = FPTP처럼 AV도 약점 있음 → 결과 뒤 평가"}, {"head": "It sometimes allows second-preference votes", "clue": ["It", "second-preference votes", "a greater influence"], "core": "약점: 2지망이 1지망보다 더 큰 힘을 가질 수 있음", "why": "It(그것) = AV 방식 / not perfect의 구체적 내용"}, {"head": "In this case, the bake", "clue": ["In this case", "mainly due to the second-preference votes"], "core": "이번에도 빵 바자회는 주로 2지망 표 덕분에 승리", "why": "In this case(이 경우) = 앞의 일반적인 약점을 자치회 결과에 적용"}], "postit": "꼴찌 A 탈락 → 5표 2지망으로 재분배 → B 11 vs C 9 → 빵 바자회 승리 → AV도 불완전 → 2지망이 더 셀 수 있음 → 이번이 바로 그 경우", "cex": [{"core": "1지망 꼴찌 A 탈락, 5표를 2지망대로 재분배", "why": "글의 출발: Option A ~ the fewest(A가 가장 적게) → 2차 집계에서 꼴찌 처리"}, {"core": "B에 4표·C에 1표 추가 → B 11표, C 9표", "why": "As a result(그 결과) = A 탈락·재분배 결과 → 표 계산"}, {"core": "빵 바자회 승리, 그러나 AV도 완벽하지 않음", "why": "As a result(그 결과) = B 11표, C 9표 → 승자 결정"}, {"core": "2지망이 1지망보다 큰 힘, 바자회 승리도 2지망 덕", "why": "It(그것) = AV 방식 → not perfect(완벽하지 않음)의 구체적 내용"}]}, {"id": "g2_L3-p5", "label": "3과 ⑤ 콩도르세 방식과 결과", "sents": [{"en": "Finally, the student council counted the votes using the Condorcet method.", "ko": "마지막으로, 학생 자치회는 콩도르세 방식을 사용하여 표를 집계했다."}, {"en": "This method involves comparing the voters’ preferences between each possible pair of options.", "ko": "이 방식은 가능한 선택지 쌍에 대한 투표자들의 선호도를 비교하는 것을 수반한다."}, {"en": "In this case, there were three pairs to consider: A vs. B, B vs. C, and A vs. C.", "ko": "이 경우에는, 고려해야 할 세 쌍이 있었는데, 그것은 바로 A와 B, B와 C, A와 C였다."}, {"en": "Through this method, the student council discovered that its members preferred option A to option B by a count of 11 to 9.", "ko": "이 방식을 통해, 학생 자치회는 구성원들이 11대 9로 선택지 B보다 선택지 A를 더 선호한다는 사실을 알아냈다."}, {"en": "In other words, 11 people preferred A to B, voting either ABC, ACB, or CAB.", "ko": "즉, 11명이 ABC, ACB, CAB 중 하나에 투표하며 B보다 A를 선호했다."}, {"en": "Meanwhile, 9 people preferred B to A by voting BAC, BCA, or CBA.", "ko": "한편, 9명은 BAC, BCA 또는 CBA에 투표함으로써 A보다 B를 선호했다."}, {"en": "Interestingly, the voters preferred option B to option C by the same count of 11 to 9.", "ko": "흥미롭게도, 투표자들은 동일하게 11대 9로 선택지 C보다 선택지 B를 선호했다."}, {"en": "They also preferred option A to option C by 11 to 9.", "ko": "그들은 또한 11대 9로 선택지 C보다 선택지 A를 선호했다."}, {"en": "As option A, the art show, was preferred to both of the other options, it would be considered the winner.", "ko": "미술 전시회인 선택지 A가 나머지 두 선택지보다 더 선호되었으므로, 이 선택지가 승자로 간주될 것이었다."}, {"en": "The Condorcet method’s weakness is that, along with being complex, it sometimes fails to select a winner.", "ko": "콩도르세 방식의 약점은 복잡하다는 것과 더불어 때때로 승자를 가려내지 못한다는 점이다."}, {"en": "This is especially true in elections that contain numerous options.", "ko": "이는 많은 선택지를 포함하는 선거에서 특히 그렇다."}, {"en": "It is possible that no option will be clearly preferred over the others.", "ko": "어떤 선택지도 다른 선택지들보다 명확하게 선호되지 않을 수 있다."}], "chunks": [[0, 1], [2, 5], [6, 8], [9, 11]], "half": 6, "ex": [{"head": "Finally, the student council counted", "clue": ["Finally", "the Condorcet method"], "core": "마지막은 콩도르세 방식으로 집계", "why": "글의 출발: Finally(마지막으로) → 세 번째 방식"}, {"head": "This method involves comparing the", "clue": ["This method", "each possible pair"], "core": "선택지를 두 개씩 짝지어 선호 비교", "why": "This method(이 방식) = 앞의 콩도르세 방식"}, {"head": "In this case, there were", "clue": ["In this case", "three pairs"], "core": "이번엔 세 쌍: A-B, B-C, A-C", "why": "pair(쌍) 비교 설명 → 자치회 경우의 실제 쌍"}, {"head": "Through this method, the student", "clue": ["Through this method", "option A to option B", "11 to 9"], "core": "첫 쌍 결과: A가 B를 11 대 9로 이김", "why": "세 쌍 중 첫 번째(A vs. B) 결과부터"}, {"head": "In other words, 11 people", "clue": ["In other words", "ABC, ACB, or CAB"], "core": "즉 ABC·ACB·CAB에 투표한 11명이 A > B", "why": "In other words(즉) = 앞의 11 대 9를 풀어서 설명"}, {"head": "Meanwhile, 9 people preferred B", "clue": ["Meanwhile", "9 people"], "core": "한편 BAC·BCA·CBA에 투표한 9명은 B > A", "why": "Meanwhile(한편) → 11명의 반대편 9명"}, {"head": "Interestingly, the voters preferred option", "clue": ["Interestingly", "the same count of 11 to 9"], "core": "흥미롭게도 B가 C를 똑같이 11 대 9로 이김", "why": "the same count(같은 표 차) = 앞 A vs. B의 11 대 9 → 다음 쌍 B vs. C 결과"}, {"head": "They also preferred option A", "clue": ["also", "option A to option C"], "core": "A도 C를 11 대 9로 이김", "why": "also(또한) → 마지막 남은 쌍 A vs. C 결과 추가"}, {"head": "As option A, the art", "clue": ["both of the other options", "the winner"], "core": "A가 B·C 둘 다 이김 → 승자는 미술 전시회", "why": "세 쌍 결과가 다 나온 뒤에야 종합 판정 가능"}, {"head": "The Condorcet method’s weakness is", "clue": ["The Condorcet method’s weakness", "fails to select a winner"], "core": "약점: 복잡하고 승자를 못 정할 때도 있음", "why": "앞 두 방식처럼 결과 뒤 약점 평가로 전환"}, {"head": "This is especially true in", "clue": ["This", "numerous options"], "core": "특히 선택지가 많을 때 더 그러함", "why": "This(이것) = 앞의 '승자를 못 정함'"}, {"head": "It is possible that no", "clue": ["no option", "clearly preferred"], "core": "어떤 선택지도 확실히 앞서지 못할 수 있음", "why": "'승자 못 정함'이 실제로 어떤 상황인지 설명하며 마무리"}], "postit": "콩도르세 → 두 개씩 짝 비교 → 세 쌍 → A > B 11:9 → B > C·A > C도 11:9 → A가 둘 다 이김 = 승자 → 약점: 복잡·승자 없음 → 선택지 많을수록", "cex": [{"core": "마지막 콩도르세 방식 = 선택지를 둘씩 짝지어 비교", "why": "글의 출발: Finally(마지막으로) → FPTP·AV에 이은 세 번째 방식"}, {"core": "세 쌍 중 A vs. B: A가 11 대 9로 승리", "why": "In this case(이 경우) → pair(쌍) 비교를 자치회에 적용, 첫 쌍 결과"}, {"core": "B>C·A>C도 11 대 9, A(미술 전시회) 승자", "why": "Interestingly(흥미롭게도), the same count(같은 표 차) → 나머지 두 쌍 결과"}, {"core": "약점: 복잡하고 선택지가 많으면 승자를 못 정하기도", "why": "The Condorcet method's weakness(콩도르세 방식의 약점) → 앞 두 방식처럼 결과 뒤 약점"}]}, {"id": "g2_L3-p6", "label": "3과 ⑥ 승자는 제각각, 더 나은 결정", "sents": [{"en": "Instead of all methods pointing toward a single option and making the council’s choice easier, the winner differed with each method.", "ko": "모든 방식이 하나의 선택지를 가리키고 자치회의 선택을 더 쉽게 만드는 대신, 각 방식마다 승자는 달랐다."}, {"en": "After a long, intense discussion with Ms. Akers, the student council members decided to choose the Condorcet method, as they liked the idea of directly comparing each option with the others.", "ko": "Akers 선생님과의 오랜 열정적인 논의 끝에, 학생 자치회 구성원들은 콩도르세 방식을 선택하기로 결정했는데, 각 선택지를 다른 선택지들과 직접적으로 비교한다는 점이 마음에 들었기 때문이다."}, {"en": "Everyone agreed that they learned a lot about different voting systems through this experience.", "ko": "모두가 이번 경험을 통해 각기 다른 투표 시스템에 대해 많은 것을 배웠다는 것에 동의했다."}, {"en": "It is obvious that choosing an ideal voting method is a complex and challenging task.", "ko": "이상적인 투표 방법을 선택하는 것은 복잡하고 도전적인 일이라는 것은 분명하다."}, {"en": "No voting system is flawless or clearly superior to another.", "ko": "어떤 투표 시스템도 완벽하거나 다른 시스템보다 명백히 우수하지는 않다."}, {"en": "Whichever we choose will have pros and cons.", "ko": "우리가 선택하는 어느 것이든 장단점이 있을 것이다."}, {"en": "Some people believe that it is best to keep the process simple by not ranking our choices at all.", "ko": "어떤 사람들은 우리들의 선택들에 아예 순위를 매기지 않음으로써 과정을 단순하게 유지하는 것이 최선이라고 생각한다."}, {"en": "Others continue to develop and test new ways of voting, arguing that more complex methods deliver more accurate results.", "ko": "다른 사람들은 더 복잡한 방식이 더 정확한 결과를 가져온다고 주장하며 계속해서 새로운 투표 방법을 개발하고 시험한다."}, {"en": "All of these efforts are designed not to make decision-making difficult and inefficient, but to help us make better decisions as a society.", "ko": "이러한 모든 노력은 의사 결정을 어렵고 비효율적으로 만들려는 것이 아니라, 우리가 사회로서 더 나은 결정을 내리도록 돕기 위해 고안된 것이다."}, {"en": "Ultimately, understanding all of the possible voting methods and weighing their pros and cons allows us to better understand the process of decision-making.", "ko": "결국, 모든 가능한 투표 방법을 이해하고 장단점을 따져 보는 것은 우리가 의사 결정 과정을 더 잘 이해할 수 있게 한다."}, {"en": "When we understand decision-making better, we are more likely to become better decision-makers ourselves.", "ko": "우리가 의사 결정을 더 잘 이해할 때, 우리 스스로 더 나은 의사 결정자가 될 가능성이 더 높다."}], "chunks": [[0, 1], [2, 5], [6, 7], [8, 10]], "half": 6, "ex": [{"head": "Instead of all methods pointing", "clue": ["Instead of", "the winner differed with each method"], "core": "세 방식의 승자가 모두 다름(C·B·A)", "why": "글의 출발: 세 방식 결과를 한 줄로 정리 — 승자가 방식마다 다름"}, {"head": "After a long, intense discussion", "clue": ["After a long, intense discussion", "the Condorcet method"], "core": "긴 토론 끝에 콩도르세 선택, 직접 비교 방식이 마음에 듦", "why": "승자가 다 다름 → 그럼 어느 방식으로? 결정 내림"}, {"head": "Everyone agreed that they learned", "clue": ["Everyone agreed", "this experience"], "core": "모두 이번 경험으로 투표 방식을 많이 배웠다고 동의", "why": "this experience(이번 경험) = 앞의 투표·토론·결정 전체 → 이야기 마무리"}, {"head": "It is obvious that choosing", "clue": ["It is obvious", "an ideal voting method"], "core": "이상적인 투표 방식 고르기는 복잡하고 어려운 일", "why": "이야기 끝(배움) → 일반적인 교훈으로 확장: 이상적 방식 고르기 어려움"}, {"head": "No voting system is flawless", "clue": ["No voting system", "flawless"], "core": "완벽하거나 확실히 더 나은 방식은 없음", "why": "'고르기 어려움'의 이유: 완벽한 방식이 없기 때문"}, {"head": "Whichever we choo
