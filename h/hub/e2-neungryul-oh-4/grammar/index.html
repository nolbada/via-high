<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>문법 · 영어2 능률(오) 4과</title>
<link rel="stylesheet" href="../../hub.css">
<style>
.qs{margin:10px 0 18px;padding:14px 14px 12px;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 1px 3px rgba(20,40,70,.06)}
.qs .qh{display:flex;gap:10px;align-items:flex-start}
.qs .qn{flex:none;width:30px;height:30px;border-radius:15px;background:#e5e8ee;font-weight:700;font-size:14px;text-align:center;line-height:30px}
.qs .qt{flex:1;font-size:18px;line-height:2.05}
.tk{display:inline;padding:3px 2px;margin:0;border:0;background:none;font:inherit;color:inherit;border-radius:6px;cursor:pointer}
.tk.sel{background:#dbe7f5;box-shadow:0 0 0 2px #9db9d8}
.tk.err{background:#fff0b8;font-weight:700}
.tk.mine{background:#ffe3c2;box-shadow:0 0 0 2px #e0a050}
.qs .ko{margin:6px 0 2px;color:var(--sub);font-size:15px;line-height:1.6}
.qs .wd{margin:6px 0 4px;font-size:14px;line-height:1.7;color:var(--sub)}
.qs .wd b{color:var(--ink);font-weight:700}
.qs .wd span{display:inline-block;margin-right:10px}
.qs .bs{color:var(--sub);font-size:14px;font-weight:400}
.qs .ask{margin:8px 0 6px;font-size:15px}
.act{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.act input{flex:1;min-width:140px;font-size:17px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-family:inherit}
.act button{font-size:16px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-family:inherit}
.act button.go{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
.act .hint{flex:1 1 100%;font-size:14px;color:var(--sub)}
.fb{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--soft);font-size:16px;line-height:1.7}
.fb .res{font-weight:700;margin-bottom:2px}
.fb .res.ok{color:var(--ok)}.fb .res.re{color:#8a5a00}
.fb p{margin:4px 0}
.fb .lab{display:inline-block;min-width:54px;font-weight:700;color:var(--pri)}
.fb mark{background:#fff0b8;padding:0 2px;border-radius:3px}
.fb .ko{color:var(--sub)}
.fb .gl{font-size:15px}
.fb .gl .bs{display:block;margin-left:54px}
.fb .pt{margin:4px 0 8px;padding-left:10px;border-left:3px solid #c9d6e6}
</style>
</head><body>
<div class="w" id="app"></div>
<script src="../steps.js"></script>
<script src="../../hub.js"></script>
<script src="data.js"></script>
<script>
(function(){
var HUB=window.HUB,esc=HUB.esc,app=document.getElementById('app');
var BID='e2-neungryul-oh-4',D=GRDATA[BID+'|4'],KEY='hub_'+BID+'_grammar';
var TEACH=new URLSearchParams(location.search).get('t')==='1';
HUB.bar('grammar');
var ST=HUB.get(KEY)||{ans:{}};
var CORN=D.corners,ITEMS=D.items,SEL={};
function save(){
  HUB.put(KEY,ST);
  var n=0;ITEMS.forEach(function(it){if(ST.ans[it.id])n++});
  HUB.setStep('grammar',{done:n===ITEMS.length,count:n,N:ITEMS.length});
}
function byC(k){return ITEMS.filter(function(it){return it.k===k})}
function stat(k){
  var a=byC(k),n=0,r=0;
  a.forEach(function(it){var v=ST.ans[it.id];if(v){n++;if(v.r==='ok')r++}});
  return {N:a.length,n:n,r:r};
}
function norm(s){return String(s||'').toLowerCase().replace(/[’‘]/g,"'").replace(/[.,;:!?"]+$/,'').replace(/^["]+/,'').replace(/\s+/g,' ').trim()}
function toks(it){
  var re=/\S+/g,m,o=[];
  while((m=re.exec(it.en)))o.push({t:m[0],s:m.index,e:m.index+m[0].length});
  return o;
}
function inSpan(it,t){return it.sp&&t.s<it.sp[1]&&t.e>it.sp[0]}
function cor(it){return it.sp?it.en.slice(0,it.sp[0])+it.fx+it.en.slice(it.sp[1]):it.en}
function corHTML(it){
  return esc(it.en.slice(0,it.sp[0]))+'<mark>'+esc(it.fx)+'</mark>'+esc(it.en.slice(it.sp[1]));
}
function sentHTML(it,a,done){
  var T=toks(it),h='',sel=SEL[it.id];
  T.forEach(function(t,i){
    var c='tk';
    if(done){
      if(inSpan(it,t))c+=' err';
      else if(a&&a.s===i&&a.s>=0)c+=' mine';
    }else if(sel===i)c+=' sel';
    h+=(i?' ':'')+(done?'<span class="'+c+'">'+esc(t.t)+'</span>':'<button type="button" class="'+c+'" data-q="'+it.id+'" data-t="'+i+'">'+esc(t.t)+'</button>');
  });
  return h;
}
function wdHTML(it){
  var seen={},h='';
  function add(w,g){var k=w.toLowerCase();if(seen[k]||!g)return;seen[k]=1;h+='<span><b>'+esc(w)+'</b> '+esc(g)+'</span>'}
  (it.wd||[]).forEach(function(x){add(x[0],x[1])});
  (it.gl||[]).forEach(function(x){add(x[0],x[1])});
  return h?'<div class="wd">'+h+'</div>':'';
}
function glHTML(it){
  var h='';
  (it.gl||[]).forEach(function(x){
    h+='<p class="gl"><span class="lab">단어</span><b>'+esc(x[0])+'</b> <span class="bs">'+esc(x[1])+'</span>'+(x[2]?'<span class="bs">'+esc(x[2])+'</span>':'')+'</p>';
  });
  return h;
}
function fbHTML(it,a){
  var h='<div class="fb">';
  if(!TEACH){
    var rr=a.r==='ok'?['ok','정답이에요']:(a.r==='sp'?['re','틀린 곳은 찾았어요. 고친 답을 확인해 봐요']:['re','다시 확인해 봐요']);
    h+='<div class="res '+rr[0]+'">'+rr[1]+'</div>';
  }
  if(it.sp){
    h+='<p><span class="lab">정답</span>'+corHTML(it)+'</p>';
    h+='<p><span class="lab">고치기</span><b>'+esc(it.en.slice(it.sp[0],it.sp[1]))+'</b> &rarr; <b>'+esc(it.fx)+'</b></p>'+(it.alt&&it.alt.length?'<p><span class="lab">다른 정답</span>'+it.alt.map(esc).join(', ')+'</p>':'');
    h+='<p><span class="lab">포인트</span>'+esc(it.tag)+'</p>';
    h+='<p class="pt">'+esc(it.ru)+'</p>';
    if(it.wr)h+='<p><span class="lab">왜 틀려요</span>'+esc(it.wr)+'</p>';
  }else{
    h+='<p><span class="lab">정답</span>이 문장은 본문 그대로예요. 고칠 곳이 없어요.</p>';
    if(it.pts&&it.pts.length){
      h+='<p><span class="lab">확인</span>시험에 잘 나오는 곳은 이래요.</p>';
      it.pts.forEach(function(p){h+='<p class="pt"><b>'+esc(p[0])+'</b> ('+esc(p[1])+')<br>'+esc(p[2])+'</p>'});
    }
  }
  h+=glHTML(it);
  h+='<p class="ko">'+esc(it.ko)+'</p></div>';
  return h;
}
function actHTML(it){
  var sel=SEL[it.id],T=toks(it),h='<div class="act">';
  if(sel!=null){
    h+='<span class="hint"><b>'+esc(T[sel].t)+'</b> 자리를 어떻게 고칠까요? 바뀌는 단어(또는 짧은 구)만 쓰면 돼요.</span><input type="text" id="fx'+it.id+'" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="고친 형태"><button type="button" class="go" data-ok="'+it.id+'">확인</button>';
  }else{
    h+='<span class="hint">틀린 곳이 있으면 그 단어를 눌러 보세요. 없으면 아래 버튼을 눌러요.</span>';
  }
  h+='<button type="button" data-no="'+it.id+'">이상 없음</button></div>';
  return h;
}
function home(){
  HUB.last.clear('grammar');
  var h='<h1>문법</h1><p class="sub">영어2 능률(오) 4과 · 금천고 · 청석고 · 주성고'+(TEACH?' · 선생님용(정답 표시)':'')+'</p>';
  h+='<div class="rule"><p>본문 문장이 한 곳만 문법이 틀리게 바뀌어 있어요. 아무 표시도 없으니 직접 찾아야 해요.</p><p>틀린 곳을 누르고 올바르게 고쳐 써요. 틀린 곳이 없는 문장도 섞여 있어요. 그때는 &lsquo;이상 없음&rsquo;을 눌러요.</p><p>고칠 때는 바뀌는 단어(또는 짧은 구)만 쓰면 돼요. 시험 서술형에서는 문장 전체를 써야 해요.</p><p>단어 뜻은 문장 아래에 있어요. 해설에서는 단어를 원래 모양(원형)으로 풀어서 설명해요.</p></div><div class="menu">';
  CORN.forEach(function(c){
    var s=stat(c.k),dn=s.n===s.N;
    h+='<button data-c="'+c.k+'" class="'+(dn?'done':'')+'"><b>'+esc(c.name)+' <span class="stat">'+(s.n?(s.n+' / '+s.N+' 풀음 · 정답 '+s.r):'')+'</span></b><span>'+esc(c.desc)+' · '+s.N+'문제</span></button>';
  });
  h+='</div><div class="foot">단어잡고 구문잡고 · 동남비타민영어학원</div>';
  app.innerHTML=h;
  var f=document.getElementById('foot');if(f)f.remove();
  app.querySelectorAll('[data-c]').forEach(function(b){b.onclick=function(){corner(b.getAttribute('data-c'))}});
  window.scrollTo(0,0);
}
function corner(k,onlyWrong){
  var ci=0;CORN.forEach(function(c,i){if(c.k===k)ci=i});
  var c=CORN[ci],list=byC(k),all=byC(k);
  if(onlyWrong)list=list.filter(function(it){var a=ST.ans[it.id];return a&&a.r!=='ok'});
  HUB.last.set('grammar',{k:k,w:onlyWrong?1:0,a:0});
  var h='<div class="rnav"><button id="tl">코너 목록</button><div class="t"><b>'+esc(c.name)+'</b>'+esc(c.desc)+'</div><button id="pv"'+(ci===0?' disabled':'')+'>이전</button><button id="nx"'+(ci===CORN.length-1?' disabled':'')+'>다음</button></div>';
  if(onlyWrong&&!list.length)h+='<p class="ask">다시 풀 문제가 없어요.</p>';
  list.forEach(function(it){
    var a=ST.ans[it.id],done=!!a||TEACH;
    h+='<div class="qs" id="q'+it.id+'"><div class="qh"><span class="qn">'+(all.indexOf(it)+1)+'</span><div class="qt">'+sentHTML(it,a,done)+'</div></div><div class="ko">'+esc(it.ko)+'</div>'+wdHTML(it);
    h+=done?fbHTML(it,a||{r:'ok'}):actHTML(it);
    h+='<div class="wkr">'+HUB.weak.btn('gra'+it.id)+'</div></div>';
  });
  app.innerHTML=h;
  var s=stat(k);
  var f=document.getElementById('foot');if(!f){f=document.createElement('div');f.id='foot';document.body.appendChild(f)}
  var wrongN=all.filter(function(it){var a=ST.ans[it.id];return a&&a.r!=='ok'}).length;
  f.innerHTML='<div class="info"><b>'+s.n+' / '+s.N+' 풀었어요</b><small>정답 '+s.r+'개'+(wrongN?' · 다시 볼 문제 '+wrongN+'개':'')+'</small></div>'+(wrongN&&!onlyWrong?'<button id="rw">틀린 문제만 다시</button>':(onlyWrong?'<button id="all" class="ghost">전체 보기</button>':''));
  document.getElementById('tl').onclick=function(){f.remove();home()};
  document.getElementById('pv').onclick=function(){if(ci>0)corner(CORN[ci-1].k)};
  document.getElementById('nx').onclick=function(){if(ci<CORN.length-1)corner(CORN[ci+1].k)};
  var rw=document.getElementById('rw');if(rw)rw.onclick=function(){
    all.forEach(function(it){var a=ST.ans[it.id];if(a&&a.r!=='ok'){delete ST.ans[it.id];delete SEL[it.id]}});
    save();corner(k);
  };
  var al=document.getElementById('all');if(al)al.onclick=function(){corner(k)};
  if(!TEACH){
    function item(id){return ITEMS.filter(function(x){return x.id===id})[0]}
    function redo(y,focusId){corner(k,onlyWrong);scrollTo(0,y);if(focusId){var i=document.getElementById('fx'+focusId);if(i)i.focus({preventScroll:true})}}
    app.querySelectorAll('.tk[data-q]').forEach(function(b){b.onclick=function(){
      var id=+b.getAttribute('data-q');if(ST.ans[id])return;
      SEL[id]=+b.getAttribute('data-t');redo(scrollY,id);
    }});
    app.querySelectorAll('[data-no]').forEach(function(b){b.onclick=function(){
      var id=+b.getAttribute('data-no'),it=item(id);if(ST.ans[id])return;
      ST.ans[id]={s:-1,f:'',r:it.sp?'no':'ok'};delete SEL[id];save();redo(scrollY);
    }});
    function submit(id){
      var it=item(id),i=document.getElementById('fx'+id);if(ST.ans[id]||SEL[id]==null)return;
      var T=toks(it),t=T[SEL[id]],v=i?i.value:'';
      if(!norm(v)){if(i)i.focus();return}
      var r='no';
      if(it.sp){if(inSpan(it,t)){r=([it.fx].concat(it.alt||[]).some(function(z){return norm(z)===norm(v)}))?'ok':'sp'}}
      ST.ans[id]={s:SEL[id],f:v,r:r};delete SEL[id];save();redo(scrollY);
    }
    app.querySelectorAll('[data-ok]').forEach(function(b){b.onclick=function(){submit(+b.getAttribute('data-ok'))}});
    app.querySelectorAll('.act input').forEach(function(i){i.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();submit(+i.id.slice(2))}}});
  }
  HUB.last.track('grammar','.qs',function(){return {k:k,w:onlyWrong?1:0}});
  window.scrollTo(0,0);
}
(function(){
  var L=HUB.last.get('grammar');
  home();
  if(L&&L.k&&CORN.some(function(c){return c.k===L.k})){
    corner(L.k,false);
    setTimeout(function(){HUB.last.scrollTo('.qs',L.a||0)},40);
    HUB.last.toast('마지막으로 풀던 곳('+CORN.filter(function(c){return c.k===L.k})[0].name+' · '+((L.a||0)+1)+'번)에서 이어서 열었어요','처음부터',function(){var f=document.getElementById('foot');if(f)f.remove();home()});
  }
})();
})();
</script>
</body></html>
