<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>좌본문우해석 · 공통영어2 능률(오) 3과</title>
<link rel="stylesheet" href="../../hub.css">
<style>
.jh{font-size:14px;font-weight:700;color:var(--pri);margin:14px 0 6px}
.jn{margin:12px 0 4px}.jn .no{display:inline-block;min-width:26px;text-align:center;border-radius:13px;background:#e8eef7;color:var(--pri);font-weight:700;font-size:14px;line-height:26px}
.jt{width:100%;border-collapse:collapse;table-layout:fixed;font-size:calc(var(--fs,19px) - 2px)}
.jt td{border:1px solid #d9dee8;padding:6px 8px;vertical-align:top;line-height:1.5;word-break:break-word}
.jt td.k{background:#fff8dc;color:#3a3320}
.nat{margin-top:16px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:#fff}
.nat p{margin:6px 0;font-size:calc(var(--fs,19px) - 2px);line-height:1.65}
.nat .no{color:var(--pri);font-weight:700;margin-right:6px}
.gist{margin:14px 0;padding:12px 14px;border-radius:12px;background:#eef6ee;border:1px solid #bcd9bf}
.gist b{display:block;color:var(--ok);margin-bottom:4px;font-size:15px}
.gist p{margin:0;font-size:17px;line-height:1.7}
.sq{margin:10px 0;padding:12px 14px;border:1px solid var(--line);border-left:4px solid #8ab4d4;border-radius:10px;background:#fff}
.sq .no{display:inline-block;min-width:24px;text-align:center;border-radius:12px;background:#e8eef7;color:var(--pri);font-weight:700;font-size:13px;line-height:24px;margin-bottom:6px}
.sq .e{color:#2a6496;line-height:1.7}
.sq .k{color:#4a6a86;line-height:1.7;padding-left:1.4em;margin-bottom:6px}
.sq .nt{margin-top:8px;padding-top:8px;border-top:1px dashed #cfd9e6;line-height:1.7}
.sq .ez{margin-top:8px;padding:8px 10px;background:#eaf6f3;border-left:3px solid #2a9d8f;border-radius:4px;line-height:1.7}
.sq .ez i{display:block;font-style:normal;font-size:12px;font-weight:700;color:#1f7a6f;margin-bottom:2px}
.sq{cursor:pointer}
.sq .sl{line-height:1.8;color:#2a6496}
.sq.on .sl{padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid #e2e8f0;font-weight:700}
.sq:not(.on) .e,.sq:not(.on) .k,.sq:not(.on) .nt,.sq:not(.on) .ez,.sq:not(.on) .pr{display:none}
.pn{color:#c2571a;font-weight:700;font-size:.92em}
.sq .pr{margin-top:8px;padding:8px 10px;background:#fff4ea;border-left:3px solid #e07a1f;border-radius:4px;line-height:1.7}
.sq .pr i{display:block;font-style:normal;font-size:12px;font-weight:700;color:#c2571a;margin-bottom:2px}
.sq .pr span{color:#6b5a48;font-size:.9em}
.sq .hint{margin-top:8px;font-size:13px;font-weight:700;color:#2a6496;text-align:center;padding:6px;border:1px dashed #8ab4d4;border-radius:8px}
.sq.on .hint{display:none}
.tools #all{padding:6px 12px;border:1px solid #8ab4d4;background:#fff;color:#2a6496;border-radius:8px;font-size:14px;font-weight:700}
.sq .bk{float:right;margin:-2px 0 0 8px;padding:4px 10px;border:1px solid #c9a36b;background:#fff;color:#8a5a14;border-radius:8px;font-size:13px;font-weight:700}
.sq.bm{border-left-color:#e07a1f;background:#fffaf2}
.sq.bm .bk{background:#e07a1f;color:#fff;border-color:#e07a1f}
#bmgo{display:block;width:100%;margin:10px 0;padding:12px;border:0;border-radius:10px;background:#e07a1f;color:#fff;font-size:16px;font-weight:700}
.sq .nt i{display:block;font-style:normal;font-size:12px;font-weight:700;color:#2a6496;margin-bottom:2px}
.sb{font:inherit;font-size:13px;margin-left:8px;padding:2px 9px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--sub)}
.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:8px 0}
.tools label{font-size:16px}
.op{margin:10px 0 12px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--soft)}
.op b{display:block;margin-bottom:4px;color:var(--pri)}
.op ul{margin:0;padding-left:20px;font-size:16px;line-height:1.7}
.cq{margin:16px 0 8px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#fff}
.cq .h{font-size:14px;font-weight:700;color:var(--pri);margin-bottom:4px}
.cq .q{font-size:17px;font-weight:700;margin:2px 0 8px;line-height:1.55}
.cq .o{display:block;width:100%;text-align:left;margin:6px 0;padding:11px 12px;border:2px solid var(--line);border-radius:10px;background:var(--bg);font:inherit;font-size:16px;color:var(--ink)}
.cq .o.ok{border-color:var(--ok);background:#eaf6ee}.cq .o.no{border-color:#d6a24a;background:#fff6e6}
.cq .fb2{margin-top:8px;font-size:15px;line-height:1.65}
.cq .fb2 .res{font-weight:700;margin-bottom:2px}
.cq .ev{margin:6px 0;padding-left:10px;border-left:3px solid #c9d6e6}
.cq .ev .k{color:var(--sub)}
.cq .wdl{font-size:14px;color:var(--sub);line-height:1.7}
.cq .wdl b{color:var(--ink)}
</style>
</head><body>
<div class="w" id="app"></div>
<script src="../steps.js"></script>
<script src="../../../books/c2-neungryul-oh-34/L3.js"></script>
<script src="extra.js"></script>
<script src="pron.js"></script>
<script src="../../../data/c2-neungryul-oh-34.js"></script>
<script src="../../hub.js"></script>
<script>
(function(){
var HUB=window.HUB,esc=HUB.esc,app=document.getElementById('app');
var BID='c2-neungryul-oh-3',VBID='c2-neungryul-oh-34',RAW=TFDATA[VBID+'|3'];HUB.bar('read');
var SECS=RAW.secs,META=RAW.meta,KEY='hub_'+BID+'_read';
var ST=HUB.get(KEY)||{done:{},fs:19,hide:false,bm:null};ST.q=ST.q||{};
var X=(window.READX&&READX[VBID+'|3'])||[],PERM=[[1,0,2],[2,1,0],[0,2,1],[1,2,0],[2,0,1],[1,0,2],[0,2,1]];
var EASY=[];
var GIST=[];
function nrm(t){return String(t).replace(/[^A-Za-z0-9]/g,'').toLowerCase()}
var JJ={};try{VERBDATA[VBID].lessons.forEach(function(L){if(L.name!=="3과")return;L.items.forEach(function(it){(it.jj||[]).forEach(function(j){JJ[nrm(j.e.join(' '))]=j})})})}catch(e){}
function getJ(en){
  var j=JJ[nrm(en)];if(j)return j;
  var parts=en.split(/(?<=[.?!][\u201d"]?)\s+(?=[A-Z\u201c"])/);if(parts.length<2)return null;
  var e=[],k=[],i,q;
  for(i=0;i<parts.length;i++){q=JJ[nrm(parts[i])];if(!q||q.e.length!==q.k.length)return null;e=e.concat(q.e);k=k.concat(q.k)}
  return {e:e,k:k};
}
function save(){HUB.put(KEY,ST);var n=Object.keys(ST.done).filter(function(k){return ST.done[k]}).length;HUB.setStep('read',{done:n===SECS.length,count:n,N:SECS.length})}
function list(){
  HUB.last.clear('read');
  var h='<h1>좌본문우해석</h1><p class="sub">'+esc(META.grade)+' '+esc(META.pub)+' '+esc(META.lesson)+' · '+esc(META.school)+' '+esc(META.term)+'</p>';
  h+='<div class="rule"><p>영어를 덩어리로 끊어 읽고, 한글 덩어리와 나란히 맞춰 봐요. 그다음 자연스러운 해석과 \"결국 이 얘기\"를 읽어요.</p><p>다 읽은 영역은 안에서 읽음 표시를 눌러 두면 허브에 기록돼요.</p><p>문장 오른쪽의 책갈피를 눌러 두면, 나중에 목록에서 그 문장부터 이어 읽을 수 있어요.</p></div>'+(ST.bm&&SECS[ST.bm.si]?'<button id="bmgo">책갈피에서 이어 읽기 · 본문 '+esc(SECS[ST.bm.si].key)+' '+(ST.bm.i+1)+'번 문장</button>':'')+'<div class="menu">';
  SECS.forEach(function(s,i){h+='<button data-s="'+i+'" class="'+(ST.done[i]?'done':'')+'"><b>본문 '+esc(s.key)+' <span class="stat">'+(ST.done[i]?'읽음':'')+'</span></b><span>'+esc(s.title)+' · '+s.sents.length+'문장</span></button>'});
  h+='</div><div class="foot">단어잡고 구문잡고 · 동남비타민영어학원</div>';
  app.innerHTML=h;
  app.querySelectorAll('[data-s]').forEach(function(b){b.onclick=function(){open(+b.getAttribute('data-s'))}});
  var bg=document.getElementById('bmgo');if(bg)bg.onclick=function(){var b=ST.bm;open(b.si);setTimeout(function(){var c=document.querySelectorAll('.sq')[b.i];if(c)c.scrollIntoView({block:'start'})},60)};
  document.getElementById('foot')&&document.getElementById('foot').remove();window.scrollTo(0,0);
}
function cqHTML(si,x){
  var P=PERM[si%PERM.length],sel=ST.q[si],h='<div class="cq"><div class="h">확인 문제</div><div class="q">'+esc(x.q)+'</div>';
  P.forEach(function(oi){
    var c='o';if(sel!=null){if(oi===x.a)c+=' ok';else if(oi===sel)c+=' no'}
    h+='<button type="button" class="'+c+'" data-o="'+oi+'"'+(sel!=null?' disabled':'')+'>'+esc(x.o[oi])+'</button>';
  });
  if(sel!=null){
    var S=SECS[si],good=sel===x.a;
    h+='<div class="fb2"><div class="res">'+(good?'정답이에요':'다시 확인해 봐요. 정답은 초록색이에요')+'</div><div>'+esc(x.why)+'</div>';
    x.ev.forEach(function(n){var t=S.sents[n-1];h+='<div class="ev"><b>'+n+'.</b> '+esc(t.en)+'<div class="k">'+esc(t.ko)+'</div></div>'});
    h+='<div class="wdl">'+x.wd.map(function(w){return '<div><b>'+esc(w[0])+'</b> '+esc(w[1])+'</div>'}).join('')+'</div>';
    h+='<div class="act2"><button type="button" id="rq" class="ghost">다시 풀기</button></div></div>';
  }
  return h+'</div>';
}
function annot(text,ents){
  var out='',cur=0,i,e,p;
  for(i=0;i<ents.length;i++){e=ents[i];p=text.indexOf(e.k,cur);if(p<0)continue;
    out+=esc(text.slice(cur,p+e.k.length))+'<span class="pn">(='+esc(e.n)+')</span>';cur=p+e.k.length}
  return out+esc(text.slice(cur));
}
function open(si){
  var s=SECS[si];
  var h='<div class="rnav"><button id="tl">영역 목록</button><div class="t"><b>본문 '+esc(s.key)+'</b>'+esc(s.title.split(' · ')[0])+'</div><button id="pv"'+(si===0?' disabled':'')+'>이전</button><button id="nx"'+(si===SECS.length-1?' disabled':'')+'>다음</button></div>';
  h+='<div class="tools"><span class="sz"><button id="fm">가-</button><button id="fp">가+</button></span><button id="all">전체 열기</button></div>';
  var x=X[si];
  h+='<div id="rds" style="--fs:'+ST.fs+'px">';
  s.sents.forEach(function(t,i){
    var j=getJ(t.en),PR=(window.PRON&&PRON[si+'.'+i])||[];
    h+='<div class="rd sq" style="font-size:var(--fs)"><span class="no">'+(i+1)+'</span><button type="button" class="bk">책갈피</button>';
    h+='<div class="sl">'+esc(j&&j.e.length===j.k.length?j.e.join(' / '):t.en)+'</div>';
    if(j&&j.e.length===j.k.length){j.e.forEach(function(e,k){h+='<div class="e">'+esc(e)+'</div><div class="k">&#8627; '+annot(j.k[k],PR.filter(function(q){return q[1]===k&&q[2]}).map(function(q){return {k:q[2],n:q[3]}}))+'</div>'})}
    else h+='<div class="e">'+esc(t.en)+'</div>';
    h+='<div class="nt"><i>이어 읽으면</i>'+annot(t.ko,PR.filter(function(q){return q[5]}).map(function(q){return {k:q[5],n:q[3]}}))+'</div>'+(PR.length?(function(){var seen={},r='';PR.forEach(function(q){var key=q[0]+'|'+q[3];if(seen[key])return;seen[key]=1;r+='<div><b>'+esc(q[0])+'</b> = '+esc(q[3])+' <span>('+esc(q[4])+')</span></div>'});return '<div class="pr"><i>대명사가 가리키는 것</i>'+r+'</div>'})():'')+(EASY[si]&&EASY[si][i]?'<div class="ez"><i>쉽게 말하면</i>'+esc(EASY[si][i])+'</div>':'')+'<div class="hint">슬래시대로 읽고 뜻을 떠올려 본 뒤, 눌러서 펼치기</div></div>';
  });
  h+='</div>';
  if(GIST[si])h+='<div class="gist"><b>결국 이 얘기</b><p>'+esc(GIST[si])+'</p></div>';
  if(x)h+=cqHTML(si,x);
  app.innerHTML=h;
  var f=document.getElementById('foot');if(!f){f=document.createElement('div');f.id='foot';document.body.appendChild(f)}
  f.innerHTML='<div class="info"><b>'+(ST.done[si]?'읽음 표시됨':'다 읽었나요?')+'</b></div><button id="dn"'+(ST.done[si]?' class="ghost"':'')+'>'+(ST.done[si]?'읽음 취소':'다 읽었어요')+'</button>';
  document.getElementById('tl').onclick=list;
  document.getElementById('pv').onclick=function(){if(si>0)open(si-1)};
  document.getElementById('nx').onclick=function(){if(si<SECS.length-1)open(si+1)};
  document.getElementById('fm').onclick=function(){ST.fs=Math.max(15,ST.fs-1);save();document.getElementById('rds').style.setProperty('--fs',ST.fs+'px')};
  document.getElementById('fp').onclick=function(){ST.fs=Math.min(26,ST.fs+1);save();document.getElementById('rds').style.setProperty('--fs',ST.fs+'px')};

  var cards=app.querySelectorAll('.sq'),ab=document.getElementById('all');
  function sync(){var n=0;cards.forEach(function(c){if(c.classList.contains('on'))n++});ab.textContent=n===cards.length?'전체 닫기':'전체 열기'}
  cards.forEach(function(c){c.onclick=function(){c.classList.toggle('on');sync()}});
  function mark(){cards.forEach(function(c,i){var on=!!(ST.bm&&ST.bm.si===si&&ST.bm.i===i);c.classList.toggle('bm',on);c.querySelector('.bk').textContent=on?'책갈피 해제':'책갈피'})}
  cards.forEach(function(c,i){c.querySelector('.bk').onclick=function(e){e.stopPropagation();var on=ST.bm&&ST.bm.si===si&&ST.bm.i===i;ST.bm=on?null:{si:si,i:i};save();mark()}});
  mark();
  ab.onclick=function(){var on=ab.textContent==='전체 열기';cards.forEach(function(c){c.classList.toggle('on',on)});sync()};
  app.querySelectorAll('[data-o]').forEach(function(b){b.onclick=function(){ST.q[si]=+b.getAttribute('data-o');save();var y=scrollY;open(si);scrollTo(0,y)}});
  var rq=document.getElementById('rq');if(rq)rq.onclick=function(){delete ST.q[si];save();var y=scrollY;open(si);scrollTo(0,y)};
  document.getElementById('dn').onclick=function(){ST.done[si]=!ST.done[si];save();open(si)};
  window.scrollTo(0,0);
  HUB.last.set('read',{si:si,a:0});HUB.last.track('read','.rd',function(){return {si:si}});
}
(function(){
  var L=HUB.last.get('read');
  list();
  if(L&&SECS[L.si]){
    open(L.si);
    setTimeout(function(){HUB.last.scrollTo('.rd',L.a||0)},40);
    HUB.last.toast('마지막으로 보던 곳(본문 '+SECS[L.si].key+' · '+((L.a||0)+1)+'번 문장)에서 이어서 열었어요','처음부터',function(){HUB.last.clear('read');list()});
  }
})();
})();
</script>
</body></html>
