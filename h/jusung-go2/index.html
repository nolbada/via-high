<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1d4ed8"><title>주성고 영어II · 비타민 영어클리닉</title>
<link rel="icon" type="image/svg+xml" href="icon.svg"><link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#17202e;--sub:#5b677a;--line:#d9e0ec;--pri:#1d4ed8;--priL:#e6edfc;--off:#e9eef8;--offInk:#6b7a93;--yel:#fffbe3;--yelL:#efd96b;--yelInk:#6b5200}
@media(prefers-color-scheme:dark){:root{--bg:#0e131c;--card:#161d2a;--ink:#e8edf6;--sub:#9aa7bd;--line:#2a3548;--pri:#8ab4ff;--priL:#1a2a4a;--off:#222c3d;--offInk:#8d9ab0;--yel:#33290a;--yelL:#6b5a1a;--yelInk:#f1dc8a}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.55;font-size:16px;padding-bottom:84px}
.wrap{max-width:640px;margin:0 auto;padding:18px 16px}
h1{font-size:23px;margin:2px 0 2px}.sub{color:var(--sub);font-size:14px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin:10px 0}
.card h2{font-size:15px;margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
a.cell,span.cell{display:block;text-align:center;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;padding:11px 3px;font-size:14px;font-weight:700;text-decoration:none;line-height:1.3}
a.cell.on{background:var(--pri);border-color:var(--pri);color:#fff}
@media(prefers-color-scheme:dark){a.cell.on{color:#0b1220}}
.cell small{display:block;font-size:11.5px;font-weight:700;margin-top:1px;min-height:14px}
span.cell.soon{border-style:dashed;color:var(--offInk);background:transparent;font-weight:600}
.bar{height:8px;background:var(--off);border-radius:99px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--pri)}
.note{background:var(--yel);border:1px solid var(--yelL);color:var(--yelInk);border-radius:12px;padding:9px 12px;font-size:13px;margin:10px 0}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;height:64px;padding-bottom:env(safe-area-inset-bottom);box-sizing:content-box;z-index:50}
.tabs button{flex:1;border:0;background:none;color:var(--sub);font:700 12.5px/1 inherit;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer}
.tabs button.on{color:var(--pri);font-weight:800}.tabs svg{width:22px;height:22px}
.pane{display:none}.pane.on{display:block}
.seg{display:flex;background:var(--off);border-radius:12px;padding:3px;margin:8px 0}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:8px 0;font:700 14px/1.3 inherit;font-family:inherit;color:var(--sub);cursor:pointer}
.seg button.on{background:var(--card);color:var(--pri);font-weight:800}
.acc{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:9px 0;overflow:hidden}
.acc>summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:800;font-size:15.5px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.acc>summary::-webkit-details-marker{display:none}.acc>summary:after{content:"▸";color:var(--sub)}.acc[open]>summary:after{content:"▾";color:var(--pri)}
.acc .in{padding:0 12px 12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;border-radius:11px;padding:9px 12px;margin:6px 0;font-size:14.5px;font-weight:700;text-decoration:none;background:var(--off);color:var(--offInk)}
.row small{display:block;font-weight:500;font-size:12px}
a.row.on{background:var(--pri);color:#fff}@media(prefers-color-scheme:dark){a.row.on{color:#0b1220}}
.row.soon{background:transparent;border:1px dashed var(--line)}
.row .go{font-size:13px}
.s{padding:9px 2px;border-top:1px solid var(--line)}.s:first-child{border-top:0}
.s .en{font-size:15.5px;line-height:1.65}.s .ko{font-size:14px;line-height:1.65;color:var(--pri);margin-top:2px}
.tg{display:inline-block;font-size:11.5px;font-weight:800;border-radius:999px;padding:0 8px;margin-left:6px;border:1px solid var(--line);color:var(--sub)}
.tg.t{border-color:var(--pri);color:var(--pri)}
.gc{border:1.5px solid var(--pri);border-radius:12px;padding:10px 12px;margin:8px 0}.gt{font-weight:800;color:var(--pri);font-size:15px}.gd{font-size:14px;line-height:1.6;margin:3px 0}.ge{background:var(--yel);border:1px solid var(--yelL);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:13.5px;line-height:1.55}
.soonbox{border:1px dashed var(--line);border-radius:14px;padding:18px 14px;text-align:center;color:var(--sub);font-size:14.5px}
.foot{margin:20px 0 6px;text-align:center;color:var(--sub);font-size:12.5px}
</style></head><body><div class="wrap">

<section class="pane on" id="p-today">
<h1>오늘의 학습</h1><p class="sub">하고 싶은 걸 골라 눌러요. 끝내면 파랗게 바뀌어요.</p>
<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline"><b>채운 칸</b><b id="sum" style="color:var(--pri)"></b></div><div class="bar"><i id="sbar" style="width:0"></i></div>
<div style="font-size:12.5px;color:var(--sub)">시험 전까지 모든 활동을 두 번씩! (✓ 한 번, ✓✓ 두 번 이상)</div></div>
<div id="today"></div>
<div class="note">내 진도는 내가 정해요. 칸을 누르면 바로 그 활동이 열려요. 기록은 이 폰에만 저장돼요. 점선 칸은 준비 중이에요.</div>
</section>

<section class="pane" id="p-keys">
<h1>답안지</h1><p class="sub">푼 뒤에 맞춰 보고, 확인했으면 답안지 맨 아래 「답 확인했어요」를 눌러요. 확인한 건 진하게 바뀌어요.</p>
<div id="keys"></div>
</section>

<section class="pane" id="p-text">
<h1>원문</h1><p class="sub">지문을 고르고 보고 싶은 방식을 눌러요.</p>
<div class="seg" id="seg"></div>
<div id="text"></div>
</section>

<div class="foot">비타민 영어클리닉 · 주성고 영어II</div></div>

<nav class="tabs" id="tabs"></nav>

<script src="../common/prog.js?v=261019"></script>
<script src="L4/sx-data.js?v=261019"></script><script>var D4=DATA;</script>
<script src="mock/sx-data.js?v=261019"></script><script>var DM=DATA;</script>
<script src="key15.js?v=261019"></script><script src="gram.js?v=261019"></script>
<script>
(function(){
var ACT=[['ko','한글 순서'],['abc','ABC 순서'],['mun','문장삽입'],['blank','빈칸추론'],['find','TF'],['awk','어색한 곳'],['voc','어휘'],['eobeop','어법선택'],['dongsa','동사형']];
var SEC=[
 {label:'4과 (교과서)',set:'L4',url:{ko:'L4/sunseo-ko.html',abc:'L4/sunseo-abc.html',mun:'L4/sunseo-mun.html',blank:'L4/blank.html',find:'L4/find.html',awk:'L4/awkward-test.html',eobeop:'L4/eobeop-test.html',dongsa:'L4/dongsa-test.html'}},
 {label:'모의고사 (22년 11월 · 23년 11월 · 24년 10월)',set:'mock',url:{ko:'mock/sunseo-ko.html',abc:'mock/sunseo-abc.html',mun:'mock/sunseo-mun.html',blank:'mock/blank.html'}}
];
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function today(){
  var P=PG.get(),h='',tot=0,got=0;
  SEC.forEach(function(s){
    h+='<div class="card"><h2>'+esc(s.label)+'</h2><div class="grid">';
    ACT.forEach(function(a){
      var u=s.url[a[0]],k=s.set+':'+a[0],n=(P[k]||{}).n||0;
      if(!u){h+='<span class="cell soon">'+a[1]+'<small>준비 중</small></span>';return}
      tot++;if(n)got++;
      h+='<a class="cell'+(n?' on':'')+'" href="'+u+'">'+a[1]+'<small>'+(n>=2?'✓✓':n?'✓':'')+'</small></a>';
    });
    h+='</div></div>';
  });
  document.getElementById('today').innerHTML=h;
  document.getElementById('sum').textContent=got+' / '+tot+'칸';
  document.getElementById('sbar').style.width=(tot?Math.round(got*100/tot):0)+'%';
}
function keys(){
  var P=PG.get();
  function row(name,sub,url,k){var n=(P[k]||{}).n||0;return url?'<a class="row'+(n?' on':'')+'" href="'+url+'"><span>'+name+'<small>'+(n?'확인했어요':sub)+'</small></span><span class="go">'+(n?'다시 보기':'열기')+'</span></a>':'<div class="row soon"><span>'+name+'<small>준비 중</small></span></div>'}
  var h='';
  h+='<details class="acc" open><summary>교과서</summary><div class="in">'+
     '<div style="font-size:13px;color:var(--sub);margin:2px 2px 4px">4과</div>'+
     row('어색한 곳 찾기','정답·해설','L4/awkward.html','key:L4:awk')+
     row('동사형 연습','정답·해설','L4/dongsa.html','key:L4:dongsa')+
     row('어법 선택형','정답·해설','L4/eobeop.html','key:L4:eobeop')+
     '</div></details>';
  h+='<details class="acc"><summary>모의고사</summary><div class="in">';
  ['22년 11월','23년 11월','24년 10월'].forEach(function(y){
    h+='<div style="font-size:13px;color:var(--sub);margin:8px 2px 2px">'+y+'</div>'+row('한글채우기','','')+row('영어채우기','','');
  });
  h+='</div></details>';
  h+='<details class="acc"><summary>플러스 자료</summary><div class="in"><div class="soonbox">기출예상 등 정답·해설이 여기에 쌓여요.<br>준비 중</div></div></details>';
  document.getElementById('keys').innerHTML=h;
}
var MODES=['문장 해석','문법 분석','주요 문장','동사형 말하기'],mode=0,hide15=false;
function text(){
  var seg=document.getElementById('seg');
  seg.innerHTML=MODES.map(function(m,i){return '<button type="button" data-m="'+i+'" class="'+(i===mode?'on':'')+'">'+m.replace(' ','<br>')+'</button>'}).join('');
  var h='';
  [[D4,'4과 (교과서)','L4'],[DM,'모의고사','mock']].forEach(function(g,gi){
    h+='<details class="acc"'+(gi===0?' open':'')+'><summary>'+g[1]+'</summary><div class="in">';
    if(mode===3){
      h+=g[2]==='L4'?'<a class="row on" href="L4/dongsa-test.html"><span>4과 동사형 말하기 연습<small>원문 위에서 바로 연습하는 모드는 준비 중이에요. 지금은 동사형 시험으로 연결돼요.</small></span><span class="go">열기</span></a>':'<div class="soonbox">준비 중</div>';
    }else if(mode===2){
      if(g[2]==='L4'){
        h+='<div style="font-size:13px;color:var(--sub);margin:2px 2px 6px">시험에 나올 수 있는 주요 문장 15개예요. 해석을 가리고 먼저 스스로 해석해 봐요.</div><button type="button" id="hide15" class="row on" style="border:0;width:100%;cursor:pointer;font-family:inherit">해석 '+(hide15?'보이기':'가리기')+'</button>';
        var no=0;
        KEY15.groups.forEach(function(gr){
          h+='<div style="font-size:13px;font-weight:800;color:var(--sub);margin:12px 2px 2px">'+esc(gr.title)+'</div>';
          gr.items.forEach(function(it){no++;h+='<div class="s"><div class="en"><b style="color:var(--pri)">'+no+'</b> '+esc(it.en)+'</div>'+(hide15?'':'<div class="ko">'+esc(it.ko)+'</div>')+'</div>'});
        });
      }else h+='<div class="soonbox">준비 중</div>';
    }else if(mode===1){
      g[0].passages.forEach(function(p){
        var G=GRAM[p.id];
        if(!G){h+='<div class="row soon"><span>'+esc(p.label)+'<small>준비 중</small></span></div>';return}
        h+='<details class="acc" style="margin:7px 0"><summary><span>'+esc(p.label)+'</span></summary><div class="in">';
        p.en.forEach(function(e,i){
          h+='<div class="s"><div class="en"><b style="color:var(--pri)">'+(i+1)+'</b> '+esc(e)+'</div><div class="ko">'+esc((p.ko||[])[i]||'')+'</div>';
          (G[i+1]||[]).forEach(function(c){
            h+='<div class="gc"><div class="gt">'+esc(c.t)+(c.tag?'<span class="tg t">'+esc(c.tag)+'</span>':'')+'</div><div class="gd">'+esc(c.d)+'</div><div class="ge">쉬운 예: <b>'+esc(c.ex)+'</b><br>'+esc(c.exk)+'</div></div>';
          });
          h+='</div>';
        });
        h+='</div></details>';
      });
    }else if(mode!==0){
      h+='<div class="soonbox">'+MODES[mode]+'은(는) 준비 중이에요.<br>하나씩 채워서 열어 드려요.</div>';
    }else{
      g[0].passages.forEach(function(p){
        var tg=p.taught===true?'<span class="tg t">수업에서 다룸</span>':p.taught===false?'<span class="tg">안 다룸</span>':'';
        h+='<details class="acc" style="margin:7px 0"><summary><span>'+esc(p.label)+tg+'</span></summary><div class="in">';
        p.en.forEach(function(e,i){h+='<div class="s"><div class="en">'+esc(e)+'</div><div class="ko">'+esc((p.ko||[])[i]||'')+'</div></div>'});
        h+='</div></details>';
      });
    }
    h+='</div></details>';
  });
  document.getElementById('text').innerHTML=h;
}
document.getElementById('text').addEventListener('click',function(e){if(e.target.id==='hide15'){hide15=!hide15;text();}});
document.getElementById('seg').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;mode=+b.dataset.m;text()});
var TABS=[['text','원문','<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/><path d="M9 13h7M9 17h7"/>'],['keys','답안지','<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 12l3 3 5-6"/>'],['today','오늘의 학습','<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>']];
function show(id){
  TABS.forEach(function(t){document.getElementById('p-'+t[0]).classList.toggle('on',t[0]===id)});
  [].forEach.call(document.querySelectorAll('#tabs button'),function(b){b.classList.toggle('on',b.dataset.t===id)});
  if(id==='today')today();if(id==='keys')keys();if(id==='text')text();
  try{sessionStorage.setItem('vh-tab',id)}catch(e){}
  window.scrollTo(0,0);
}
document.getElementById('tabs').innerHTML=TABS.map(function(t){return '<button type="button" data-t="'+t[0]+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+t[2]+'</svg>'+t[1]+'</button>'}).join('');
document.getElementById('tabs').addEventListener('click',function(e){var b=e.target.closest('button');if(b)show(b.dataset.t)});
window.addEventListener('pageshow',function(){var t='today';try{t=sessionStorage.getItem('vh-tab')||'today'}catch(e){}show(t)});
})();
</script></body></html>
