      o+='<div class="arow"><b>'+(ACT.indexOf(a)+1)+'. '+esc(nm[id])+(OPT[id]?' <em>(선택)</em>':'')+'</b>'+(VAR[id]?'<i class="vr">매번 다른 문제</i>':'<i class="vr o">1회성</i>')+'<div class="two" style="grid-template-columns:1fr"><a class="cell'+(on?' on':'')+'" href="'+u+'?part='+(v.L||v.D)+'">'+(on?'했어요':'풀기')+'<small>'+(on?'✓':'')+'</small></a></div></div>'});
    return o+'</div></div>'}
  flat.forEach(function(f){ACT.forEach(function(a){if(setOf(f.v).url[a[0]]){tot++;if(isOn(f.v,a[0]))got++}})});
  var ti=0;flat.forEach(function(f,i){if(f.x<=tdd)ti=i});
  var late=flat.filter(function(f){return f.x<tdd&&!doneV(f.v)&&f!==flat[ti]}).length;
  h+='<div class="dayhead"><b>오늘의 학습</b><span>'+(late?'밀린 DAY가 '+late+'개 있어요. 아래 전체 배정표에서 채워요.':'오늘 일정이에요. 순서는 자유예요.')+'</span></div>';
  h+=card(flat[ti]);
  h+='<details class="alld"><summary>전체 배정표 보기 <small>(어디까지 가야 하는지)</small></summary>';
  VIS.forEach(function(V,wi){
    var nd=flat.filter(function(f){return f.wi===wi&&doneV(f.v)}).length;
    h+='<details class="wkd"'+(wi===cw?' open':'')+'><summary><span><b>'+(wi+1)+'주</b> '+ROAD[wi][0]+'~'+ROAD[wi][1]+' · '+esc(ROAD[wi][2])+'</span><i>'+nd+'/'+V.length+'</i></summary>';
    flat.forEach(function(f){if(f.wi===wi)h+=card(f)});
    h+='</details>';
  });
  h+='</details>';
  document.getElementById('today').innerHTML=h;
  document.getElementById('sum').textContent=got+' / '+tot+'칸';
  document.getElementById('sbar').style.width=(tot?Math.round(got*100/tot):0)+'%';
}
var KEYS=[
 {g:'교과서',open:1,subs:[{t:'4과',items:[['어색한 곳 찾기','정답·해설','L4/awkward.html','key:L4:awk'],['동사형 연습','정답·해설','L4/dongsa.html','key:L4:dongsa'],['어법 선택형','정답·해설','L4/eobeop.html','key:L4:eobeop']]}]},
 {g:'모의고사',subs:[{t:'22년 11월',items:[['한글채우기'],['영어채우기']]},{t:'23년 11월',items:[['한글채우기'],['영어채우기']]},{t:'24년 10월',items:[['한글채우기'],['영어채우기']]}]},
 {g:'플러스 자료',subs:[{t:'기출예상 등',items:[]}]}
];
function keys(){
  var P=PG.get(),h='';
  function row(it){var n=(P[it[3]]||{}).n||0;return it[2]?'<a class="row'+(n?' on':'')+'" href="'+it[2]+'"><span>'+esc(it[0])+'<small>'+(n?'확인했어요':esc(it[1]||''))+'</small></span><span class="go">'+(n?'다시 보기':'열기')+'</span></a>':'<div class="row soon"><span>'+esc(it[0])+'<small>준비 중</small></span></div>'}

    h+='<details class="acc"'+(g.open?' open':'')+'><summary>'+esc(g.g)+'</summary><div class="in">';
    g.subs.forEach(function(sb){
      h+='<details class="acc sub"'+(g.open?' open':'')+'><summary>'+esc(sb.t)+'</summary><div class="in">'+(sb.items.length?sb.items.map(row).join(''):'<div class="soonbox">정답·해설이 여기에 쌓여요.<br>준비 중</div>')+'</div></details>';
    });

}
document.getElementById('today').addEventListener('click',function(e){
  var nt=e.target.closest('[data-note]');if(nt){e.preventDefault();var kk=nt.dataset.note,en=PG.get()[kk];if(en&&en.n&&en.t>=weekStart(new Date()).getTime())PG.unmark(kk);else PG.mark(kk);today();return}
  var c=e.target.closest('[data-cal]');if(c){vm+=+c.dataset.cal;if(vm<0){vm=11;vy--}if(vm>11){vm=0;vy++}today()}
});
var MODES=['문장 해석','문법 분석','주요 문장'],mode=0,hide15=false;
function text(){
  var seg=document.getElementById('seg');
  seg.innerHTML=MODES.map(function(m,i){return '<button type="button" data-m="'+i+'" class="'+(i===mode?'on':'')+'">'+m.replace(' ','<br>')+'</button>'}).join('');
  var h='';
  [[D4,'4과 (교과서)','L4'],[DM,'모의고사','mock']].forEach(function(g,gi){
    h+='<details class="acc"'+(gi===0?' open':'')+'><summary>'+g[1]+'</summary><div class="in">';
    if(false){    }else if(mode===2){
      if(g[2]==='L4'){
        h+='<div style="font-size:13px;color:var(--sub);margin:2px 2px 6px">시험에 나올 수 있는 주요 문장 15개예요. 해석을 가리고 먼저 스스로 해석해 봐요.</div><button type="button" id="hide15" class="row on" style="border:0;width:100%;cursor:pointer;font-family:inherit">해석 '+(hide15?'보이기':'가리기')+'</button>';
        var no=0;
        KEY15.groups.forEach(function(gr){
          h+='<div style="font-size:13px;font-weight:800;color:var(--sub);margin:12px 2px 2px">'+esc(gr.title)+'</div>';
          gr.items.forEach(function(it){no++;h+='<div class="s"><div class="en"><b style="color:var(--pri)">'+no+'</b> '+esc(it.en)+'</div>'+(hide15?'':'<div class="ko">'+esc(it.ko)+'</div>')+'</div>'});
        });
      }else h+='<div class="soonbox">준비 중</div>';
    }else if(mode===1){
      if(g[2]==='L4'){h+='<div class="soonbox">교과서는 문법 분석이 없어요.<br>모의고사에서 봐요.</div>';}
      else g[0].passages.forEach(function(p){
        var G=GRAM[p.id];
        if(!G){h+='<div class="row soon"><span>'+esc(p.label)+'<small>준비 중</small></span></div>';return}
        h+='<details class="acc" style="margin:7px 0"><summary><span>'+esc(p.label)+'</span></summary><div class="in">';
        p.en.forEach(function(e,i){
          var cs=G[i+1]||[],segs=[];
          cs.forEach(function(c,ci){var at=c.hl?e.indexOf(c.hl):-1;if(at>=0)segs.push({a:at,b:at+c.hl.length,n:ci})});
          segs.sort(function(x,y){return x.a-y.a});
          var en='',pos=0;
          segs.forEach(function(sg){if(sg.a<pos)return;en+=esc(e.slice(pos,sg.a))+'<mark class="m'+sg.n%4+'">'+esc(e.slice(sg.a,sg.b))+'<sup>'+(sg.n+1)+'</sup></mark>';pos=sg.b});
          en+=esc(e.slice(pos));
          h+='<div class="s"><div class="en"><b style="color:var(--pri)">'+(i+1)+'</b> '+en+'</div><div class="ko">'+esc((p.ko||[])[i]||'')+'</div>';
          cs.forEach(function(c,ci){
            h+='<div class="gc g'+ci%4+'"><div class="gt"><span class="gn">'+(ci+1)+'</span>'+esc(c.t)+(c.tag?'<span class="tg t">'+esc(c.tag)+'</span>':'')+'</div><div class="gd">'+esc(c.d)+'</div><div class="ge">쉬운 예: <b>'+esc(c.ex)+'</b><br>'+esc(c.exk)+'</div></div>';
          });
          h+='</div>';
        });
        h+='</div></details>';
      });
    }else if(mode!==0){
      h+='<div class="soonbox">'+MODES[mode]+'은(는) 준비 중이에요.<br>하나씩 채워서 열어 드려요.</div>';
    }else{
      g[0].passages.forEach(function(p){
        var tg=p.taught===true?'<span class="tg t">수업에서 다룸</span>':p.taught===false?'<span class="tg">안 다룸</span>':'';
        h+='<details class="acc" style="margin:7px 0"><summary><span>'+esc(p.label)+tg+'</span></summary><div class="in">';
        var J=window.SHOW_JJ?(JJ4[p.id]||JJM[p.id]):null;
        p.en.forEach(function(e,i){
          h+='<div class="s"><div class="en"><b style="color:var(--pri)">'+(i+1)+'</b></div>';
          if(J&&J[i]){h+='<div class="jjl">직독직해</div><table class="jj">'+J[i].e.map(function(c,j){return '<tr><td>'+esc(c)+'</td><td>'+esc(J[i].k[j])+'</td></tr>'}).join('')+'</table><div class="jjl">자연스러운 해석</div>'}
          else h+='<div class="en" style="margin-top:2px">'+esc(e)+'</div>';
          h+='<div class="ko">'+esc((p.ko||[])[i]||'')+'</div></div>';
        });
        var Z=window.SHOW_JJ?EZ[p.id]:null;
        if(Z){h+='<div class="ez"><div class="jjl">쉬운 정리</div><div>'+esc(Z.easy)+'</div></div>'+(Z.life?'<div class="ez life"><div class="jjl">생활 속 예시</div><div>'+esc(Z.life)+'</div></div>':'')}
        h+='</div></details>';
      });
    }
    h+='</div></details>';
  });
  document.getElementById('text').innerHTML=h;
}

function show(id){
  TABS.forEach(function(t){document.getElementById('p-'+t[0]).classList.toggle('on',t[0]===id)});
  [].forEach.call(document.querySelectorAll('#tabs button'),function(b){b.classList.toggle('on',b.dataset.t===id)});
