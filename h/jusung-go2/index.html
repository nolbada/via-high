<div id="today"></div>
<div class="note">내 진도는 내가 정해요. 칸을 누르면 바로 그 활동이 열려요. 기록은 이 폰에만 저장돼요. 점선 칸은 준비 중이에요.</div>
</section>

var TABS=[['text','원문','<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/><path d="M9 13h7M9 17h7"/>'],['keys','답안지','<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 12l3 3 5-6"/>'],['today','오늘의 학습','<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>']];
function show(id){
  TABS.forEach(function(t){document.getElementById('p-'+t[0]).classList.toggle('on',t[0]===id)});
  [].forEach.call(document.querySelectorAll('#tabs button'),function(b){b.classList.toggle('on',b.dataset.t===id)});
  if(id==='today')today();if(id==='keys')keys();if(id==='text')text();
  try{sessionStorage.setItem('vh-tab',id)}catch(e){}
  window.scrollTo(0,0);
}
document.getElementById('tabs').innerHTML=TABS.map(function(t){return '<button type="button" data-t="'+t[0]+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+t[2]+'</svg>'+t[1]+'</button>'}).join('');
document.getElementById('tabs').addEventListener('click',function(e){var b=e.target.closest('button');if(b)show(b.dataset.t)});
window.addEventListener('pageshow',function(e){var t='today';try{var nv=(performance.getEntriesByType('navigation')[0]||{}).type;if(e.persisted||nv==='back_forward')t=sessionStorage.getItem('vh-tab')||'today'}catch(x){}show(t)});
})();
