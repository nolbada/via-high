</style></head><body><div class="wrap"><div class="top"><a class="back" href="../index.html">← 주성고 정답 목록</a></div><div id="hv"><h1>주성고 영어II 능률(오선영) 4과 워크북 5 · 동사형 연습</h1><p class="lede">괄호마다 알맞은 모양을 <b>고르는</b> 시험이에요. 한 문제씩 풀고 <b>제출</b>하면 정답과 해설이 나와요.</p><div class="how"><b>한 덩어리 동사</b>(be -ing, be p.p., have p.p., will be -ing 등)는 <b>한 칸</b>으로 고르면 돼요. 푼 기록은 이 기기에 저장되어 <b>이어서 풀 수</b> 있어요.</div><div class="sumb" id="prog"></div><button class="big" id="goon" type="button"></button><div class="gtt">문제 번호 (초록 = 모두 정답, 빨강 = 틀린 칸 있음)</div><div class="grid" id="grid"></div><div id="wrong"></div><button class="big alt" id="rs" type="button">처음부터 다시 풀기</button></div><div id="qv" class="hide"><div class="bar"><button class="btn" id="tolist" type="button">← 번호 목록</button><span class="sp"></span><span id="cnt"></span></div><div class="tq" id="card"></div></div><div class="foot">비타민 영어클리닉 · 주성고 영어II</div></div><div style="height:64px"></div><a class="homefab" href="../index.html" style="position:fixed;right:12px;bottom:12px;z-index:9999;background:#0f766e;color:#fff;font:700 13px/1 sans-serif;padding:11px 14px;border-radius:22px;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.3)">⌂ 목록</a><script>window.ITEMS=[{"n": 1, "headko": null, "ko": "스터디 그룹 모임에 가는 길에, Liz는 실수로 그녀의 노트북을 길에 떨어뜨려 그것을 심각하게 손상시켰다. 그것은 여전히 켜지기는 하지만, 화면은 금이 갔고, 몇몇 키들은 작동하지 않는다.", "fko": "스터디 그룹 모임에 가는 길에, Liz는 실수로 그녀의 노트북을 길에 떨어뜨려 그것을 심각하게 손상시켰다. 그것은 여전히 켜지기는 하지만, 화면은 금이 갔고, 몇몇 키들은 작동하지 않는다.", "exp": "<div class=\"pt\"><div class=\"pw\"><span class=\"mk\">1)<\/span>dropped<small>(drop) · 떨어뜨렸다<\/small><\/div><div class=\"ln\">이야기는 <b>지난 일<\/b>이에요.<\/div><div class=\"ln\">Liz 다음에 오는 진짜 동사 자리라서 <b>과거형 dropped<\/b>를 써요.<\/div><div class=\"exb\"><span class=\"et\">쉬운 예<\/span><div>Yesterday I dropped my phone. (어제 나는 내 휴대폰을 떨어뜨렸다.)<\/div><\/div><\/div><div class=\"pt\"><div class=\"pw\"><span class=\"mk\">2)<\/span>damaging<small>(damage) · 손상시키면서<\/small><\/div><div class=\"ln\">문장의 진짜 동사는 이미 dropped예요.<\/div><div class=\"ln\">그래서 뒤에 오는 동사는 '<b>~하면서(그 결과 ~했다)<\/b>'를 뜻하는 <b>-ing<\/b>로 붙여요.<\/div><div class=\"exb\"><span class=\"et\">쉬운 예<\/span><div>He fell down, breaking his arm. (그는 넘어져서 팔이 부러졌다.)<\/div><span class=\"nt\">→ 본문 …dropped her laptop, seriously damaging it.과 같은 모양.<\/span><\/div><\/div><div class=\"pt\"><div class=\"pw\"><span class=\"mk\">3)<\/span>turns<small>(turn) · 켜진다<\/small><\/div><div class=\"ln\">주어 it은 <b>하나<\/b>이고, 지금도 계속 되는 사실이니까 <b>현재형<\/b>이에요.<\/div><div class=\"ln\">하나(3인칭 단수)일 때는 동사 끝에 <b>-s<\/b>가 붙어요.<\/div><div class=\"exb\"><span class=\"et\">쉬운 예<\/span><div>The TV turns on by itself. (그 TV는 저절로 켜진다.)<\/div><\/div><\/div><div class=\"pt\"><div class=\"pw\"><span class=\"mk\">4)<\/span>is cracked<small>(crack) · 금이 가 있다<\/small><\/div><div class=\"ln\">화면은 스스로 금을 가게 하는 게 아니라 <b>금이 가진 것(당한 것)<\/b>이에요.<\/div><div class=\"ln\">'~되어 있다'는 <b>be + p.p.<\/b> 한 덩어리! 지금 상태니까 <b>is cracked<\/b>예요.<\/div><div class=\"exb\"><span class=\"et\">쉬운 예<\/span><div>The window is broken. (창문이 깨져 있다.)<\/div><\/div><\/div><div class=\"pt\"><div class=\"pw\"><span class=\"mk\">5)<\/span>are not working<small>(be, not, work) · 작동하지 않고 있다<\/small><\/div><div class=\"ln\">키(keys)가 여러 개라서 <b>are<\/b>, 그리고 '지금 고장 나서 안 되는 중'이라 <b>be + -ing(진행)<\/b> 한 덩어리예요.<\/div><div class=\"ln\">키가 스스로 작동하는 것이니 p.p.(당하는 모양)가 아니에요.<\/div><div class=\"exb\"><span class=\"et\">쉬운 예<\/span><div>The lights are not working. (전등이 작동하지 않고 있다.)<\/div><\/div><\/div>", "parts": ["On her way to a study group meeting, Liz accidentally ", 0, " her laptop on the street, seriously ", 1, " it. Although it still ", 2, " on, the screen ", 3, ", and some keys ", 4, "."], "blanks": [{"base": "drop", "ans": "dropped", "opts": ["dropped", "drop", "dropping", "to drop", "drops"]}, {"base": "damage", "ans": "damaging", "opts": ["damaging", "damaged", "damage", "to damage", "damages"]}, {"base": "turn", "ans": "turns", "opts": ["turns", "turn", "turned", "is turning", "to turn"]}, {"base": "crack", "ans": "is cracked", "opts": ["is cracked", "cracks", "cracked", "is cracking", "was cracking"]}, {"base": "be, not, work", "ans": "are not working", "opts": ["are not working", "do not work", "are not worked", "is not working", "were not working"]}]}, {"n": 2, "headko": null, "ko": "그녀는 그것을 수리할 수 있지만, 그렇게 하기를 망설이고 있다. 때때로 수리 작업은 돈이 많이 들고, 보통 오랜 시간이 걸린다.", "fko": "그녀는 그것을 수리할 수 있지만, 그렇게 하기를 망설이고 있다. 때때로 수리 작업은 돈이 많이 들고, 보통 오랜 시간이 걸린다.", "exp": "<div class=\"pt\"><div class=\"pw\"><span class=\"mk\">1)<\/span>have<small>(have) · 하다(시키다)<\/small><\/div><div class=\"ln\">can(~할 수 있다) 뒤에는 <b>동사 원래 모양(원형)<\/b>만 와요.<\/div><div class=\"exb\"><span class=\"et\">쉬운 예<\/span><div>I can swim. (나는 수영할 수 있다.)<\/div><\/div><\/div><div class=\"pt\"><div class=\"pw\"><span class=\"mk\">2)<\/span>repaired<small>(repair) · 수리된<\/small><\/div><div class=\"ln\">'have + 물건 + p.p.'는 '그 물건이 <b>고쳐지게<\/b> 하다(맡기다)'예요.<\/div><div class=\"ln\">노트북은 고치는 쪽이 아니라 <b>고쳐지는 쪽<\/b>이라서 <b>p.p.<\/b>를 써요.<\/div><div class=\"exb\"><span class=\"et\">쉬운 예<\/span><div>I had my hair cut. (나는 머리카락을 (미용실에서) 자르게 했다.)<\/div><span class=\"nt\">→ 본문 have it repaired(그것을 수리시키다)와 같은 모양.<\/span><\/div><\/div><div class=\"pt\"><div class=\"pw\"><span class=\"mk\">3)<\/span>is hesitating<small>(be, hesitate) · 망설이고 있다<\/small><\/div><div class=\"ln\">'but she …' 지금 이 순간 <b>망설이고 있는 중<\/b>이에요.<\/div><div class=\"ln\">'~하는 중'은 <b>be + -ing<\/b> 한 덩어리이고, she는 하나라서 <b>is<\/b>예요.<\/div><div class=\"exb\"><span class=\"et\">쉬운 예<\/span><div>She is waiting for the bus. (그녀는 버스를 기다리고 있다.)<\/div><\/div><\/div><div class=\"pt\"><div class=\"pw\"><span class=\"mk\">4)<\/span>to do<small>(do) · 하기를<\/small><\/div><div class=\"ln\">'망설이다(hesitate)' 뒤에서 '<b>~하기를<\/b>' 하고 이어 줄 때는 <b>to + 동사원형<\/b>이에요.<\/div><div class=\"exb\"><span class=\"et\">쉬운 예<\/span><div>I hesitate to ask her. (나는 그녀에게 묻기를 망설인다.)<\/div><\/div><\/div><div class=\"pt\"><div class=\"pw\"><span class=\"mk\">5)<\/span>are<small>(be) · ~이다<\/small><\/div><div class=\"ln\">주어 repairs는 <b>여러 개(복수)<\/b>이고 일반적인 사실이라 <b>현재형 are<\/b>예요.<\/div><div class=\"exb\"><span class=\"et\">쉬운 예<\/span><div>Cars are expensive. (자동차들은 비싸다.)<\/div><\/div><\/div><div class=\"pt\"><div class=\"pw\"><span class=\"mk\">6)<\/span>take<small>(take) · 걸린다<\/small><\/div><div class=\"ln\">주어 they는 <b>여러 개<\/b>이고 늘 그런 일(often)이라 현재형이에요.<\/div><div class=\"ln\">여럿일 때는 -s를 붙이지 않아요.<\/div><div class=\"exb\"><span class=\"et\">쉬운 예<\/span><div>They often take the bus. (그들은 자주 버스를 탄다.)<\/div><\/div><\/div>", "parts": ["She can ", 0, " it ", 1, ", but she ", 2, " ", 3, " so. Sometimes repairs ", 4, " expensive, and they often ", 5, " a long time."], "blanks": [{"base": "have", "ans": "have", "opts": ["have", "has", "had", "having", "to have"]}, {"base": "repair", "ans": "repaired", "opts": ["repaired", "repair", "repairing", "to repair", "repairs"]}, {"base": "be, hesitate", "ans": "is hesitating", "opts": ["is hesitating", "hesitates", "is hesitated", "hesitated", "was hesitating"]}, {"base": "do", "ans": "to do", "opts": ["to do", "do", "doing", "done", "did"]}, {"base": "be", "ans": "are", "opts": ["are", "is", "was", "be", "being"]}, {"base": "take", "ans": "take", "opts": ["take", "takes", "took", "taking", "to take"]}]}, {"n": 3, "headko": null, "ko": "게다가 그 노트북은 5년 정도 되었다. 이 경우에 오래된 노트북은 버리고 새로운 것을 구입하는 것이 더 합리적인 선택처럼 보일 수 있다.", "fko": "게다가 그 노트북은 5년 정도 되었다. 이 경우에 오래된 노트북은 버리고 새로운 것을 구입하는 것이 더 합리적인 선택처럼 보일 수 있다.", "exp": "<div class=\"pt\"><div class=\"pw\"><span class=\"mk\">1)<\/span>is<small>(be) · ~이다<\/small><\/div><div class=\"ln\">주어 the laptop은 <b>하나<\/b>이고 지금 이야기라서 현재형 <b>is<\/b>예요.<\/div><div class=\"exb\"><span class=\"et\">쉬운 예<\/span><div>My dog is five years old. (내 강아지는 다섯 살이다.)<\/div><\/div><\/div><div class=\"pt\"><div class=\"pw\"><span class=\"mk\">2)<\/span>getting<small>(get) · 버리는 것<\/small><\/div><div class=\"ln\">'~하는 것'이 문장의 <b>주인(주어)<\/b> 자리에 오면 <b>-ing<\/b>로 바꿔요.<\/div><div class=\"ln\">get rid of(~을 없애다)가 get<b>ting<\/b> rid of가 된 거예요.<\/div><div class=\"exb\"><span class=\"et\">쉬운 예<\/span><div>Swimming is fun. (수영하는 것은 재미있다.)<\/div><span class=\"nt\">→ 본문 Getting rid of the old one … might seem…과 같은 모양.<\/span><\/div><\/div><div class=\"pt\"><div class=\"pw\"><span class=\"mk\">3)<\/span>purchasing<small>(purchase) · 구입하는 것<\/small><\/div><div class=\"ln\">and로 두 개를 이어 줄 때는 <b>앞과 같은 모양<\/b>으로 맞춰요.<\/div><div class=\"ln\">앞이 getting이니까 뒤도 <b>purchasing<\/b>이에요.<\/div><div class=\"exb\"><span class=\"et\">쉬운 예<\/span><div>I like reading and writing. (나는 읽는 것과 쓰는 것을 좋아한다.)<\/div><\/div><\/div><div class=\"pt\"><div class=\"pw\"><span class=\"mk\">4)<\/span>seem<small>(seem) · ~처럼 보이다<\/small><\/div><div class=\"ln\">might(~일지도 모른다) 같은 조동사 뒤에는 <b>동사 원래 모양<\/b>만 와요.<\/div><div class=\"exb\"><span class=\"et\">쉬운 예<\/span><div>It might rain. (비가 올지도 모른다.)<\/div><\/div><\/div>", "parts": ["Besides, the laptop ", 0, " about five years old. In this case, ", 1, " rid of the old one and ", 2, " a new one might ", 3, " like a more reasonable option."], "blanks": [{"base": "be", "ans": "is", "opts": ["is", "are", "was", "be", "being"]}, {"base": "get", "ans": "getting", "opts": ["getting", "get", "got", "gets", "gotten"]}, {"base": "purchase", "ans": "purchasing", "opts": ["purchasing", "purchase", "purchased", "purchases", "to purchase"]}, {"base": "seem", "ans": "seem", "opts": ["seem", "seems", "seemed", "seeming", "to seem"]}]}, {"n": 4, "headko": null, "ko": "하지만 실제로는 그것이 최선이 아닐 수 있다. 만약 Liz가 그녀의 노트북을 쓰레기통에 버린다면, 그녀는 전자 쓰레기라는 심각한 문제에 기여하게 될 것이다.", "fko": "하지만 실제로는 그것이 최선이 아닐 수 있다. 만약 Liz가 그녀의 노트북을 쓰레기통에 버린다면, 그녀는 전자 쓰레기라는 심각한 문제에 기여하게 될 것이다.", "exp": "<div class=\"pt\"><div class=\"pw\"><span class=\"mk\">1)<\/span>be<small>(be) · ~이다<\/small><\/div><div class=\"ln\">'may not'은 조동사라서 뒤에 <b>원래 모양 be<\/b>가 와요.<\/div><div class=\"exb\"><span class=\"et\">쉬운 예<\/span><div>He may not be at home. (그는 집에 없을지도 모른다.)<\/div><\/div><\/div><div class=\"pt\"><div class=\"pw\"><span class=\"mk\">2)<\/span>to do<small>(do) · 할<\/small><\/div><div class=\"ln\">the best thing '<b>할<\/b> 가장 좋은 일'처럼, 앞 명사를 뒤에서 꾸밀 때는 <b>to + 동사원형<\/b>이에요.<\/div><div class=\"exb\"><span class=\"et\">쉬운 예<\/span><div>I need something to drink. (나는 마실 것이 필요하다.)<\/div><\/div><\/div><div class=\"pt\"><div class=\"pw\"><span class=\"mk\">3)<\/span>throws<small>(throw) · 버린다<\/small><\/div><div class=\"ln\">if(만약 ~라면)로 시작하는 부분은 <b>앞으로의 일도 현재형<\/b>으로 써요.<\/div><div class=\"ln\">주어 Liz는 하나라서 <b>-s<\/b>가 붙어요.<\/div><div class=\"exb\"><span class=\"et\">쉬운 예<\/span><div>If it rains, we will stay home. (비가 오면 우리는 집에 있을 것이다.)<\/div><\/div><\/div><div class=\"pt\"><div class=\"pw\"><span class=\"mk\">4)<\/span>be contributing<small>(be, contribute) · 기여하고 있을<\/small><\/div><div class=\"ln\">쓰레기통에 버리면 그때 '<b>기여하고 있는 셈이 될 것<\/b>'이라는 뜻이에요.<\/div><div class=\"ln\">will 뒤에 '~하고 있다'를 붙이면 <b>will + be + -ing<\/b>! be -ing는 한 덩어리예요.<\/div><div class=\"exb\"><span class=\"et\">쉬운 예<\/span><div>This time tomorrow, I will be sleeping. (내일 이맘때 나는 자고 있을 것이다.)<\/div><\/div><\/div>", "parts": ["In reality, however, it may not ", 0, " the best thing ", 1, ". If Liz ", 2, " her laptop in the trash, she will ", 3, " to a serious problem: e-waste."], "blanks": [{"base": "be", "ans": "be", "opts": ["be", "is", "being", "been", "was"]}, {"base": "do", "ans": "to do", "opts": ["to do", "do", "doing", "done", "does"]}, {"base": "throw", "ans": "throws", "opts": ["throws", "throw", "will throw", "threw", "is throwing"]}, {"base": "be, contribute", "ans": "be contributing", "opts": ["be contributing", "contribute", "be contributed", "contributing", "have contributed"]}]}, {"n": 5, "headko": null, "ko": "전자 쓰레기란 정확히 무엇인가? 이 용어는 버려진 전자 장치와 전기 기기를 나타낸다.", "fko": "전자 쓰레기란 정확히 무엇인가? 이 용어는 버려진 전자 장치와 전기 기기를 나타낸다.", "exp": "<div class=\"pt\"><div class=\"pw\"><span class=\"mk\">1)<\/span>is<small>(be) · ~이다<\/small><\/div><div class=\"ln\">What exactly 뒤의 e-waste는 <b>하나(셀 수 없는 덩어리)<\/b>라서 <b>is<\/b>예요.<\/div><div class=\"exb\"><span class=\"et\">쉬운 예<\/span><div>What is this? (이것은 무엇이니?)<\/div><\/div><\/div><div class=\"pt\"><div class=\"pw\"><span class=\"mk\">2)<\/span>refers<small>(refer) · 가리킨다<\/small><\/div><div class=\"ln\">주어 the term은 <b>하나<\/b>이고 뜻을 설명하는 현재 이야기라서 <b>-s<\/b>가 붙어요.<\/div><div class=\"exb\"><span class=\"et\">쉬운 예<\/span><div>This word means &#x27;big&#x27;. (이 단어는 &#x27;큰&#x27;이라는 뜻이다.)<\/div><\/div><\/div><div class=\"pt\"><div class=\"pw\"><span class=\"mk\">3)<\/span>discarded<small>(discard) · 버려진<\/small><\/div><div class=\"ln\">기기들은 <b>버림을 당한<\/b> 것이에요.<\/div><div class=\"ln\">'~된'은 <b>p.p.<\/b>로 명사 앞에 붙여요.<\/div><div class=\"exb\"><span class=\"et\">쉬운 예<\/span><div>Look at the broken window. (깨진 창문을 봐라.)<\/div><span class=\"nt\">→ 본문 discarded electronic devices(버려진 전자 기기들)와 같은 모양.<\/span><\/div><\/div>", "parts": ["What exactly ", 0, " e-waste? The term ", 1, " to ", 2, " electronic devices and electrical appliances."], "blanks": [{"base": "be", "ans": "is", "opts": ["is", "are", "does", "be", "was"]}, {"base": "refer", "ans": "refers", "opts": ["refers", "refer", "referred", "referring", "to refer"]}, {"base": "discard", "ans": "discarded", "opts": ["discarded", "discard", "discarding", "to discard", "discards"]}]}, {"n": 6, "headko": null, "ko": "이 제품들에 포함된 납과 같은 유독성 물질 때문에 전자 쓰레기는 심각한 건강 및 환경 위험 요소이다.", "fko": "이 제품들에 포함된 납과 같은 유독성 물질 때문에 전자 쓰레기는 심각한 건강 및 환경 위험 요소이다.", "exp": "<div class=\"pt\"><div class=\"pw\"><span class=\"mk\">1)<\/span>contained<small>(contain) · 들어 있는<\/small><\/div><div class=\"ln\">materials(물질)는 제품 안에 <b>담겨 있는<\/b> 것, 즉 당하는 쪽이에요.<\/div><div class=\"ln\">'~된'은 <b>p.p.<\/b>로 명사 뒤에서 꾸며요.<\/div><div class=\"exb\"><span class=\"et\">쉬운 예<\/span><div>The food sold here is fresh. (여기서 팔리는 음식은 신선하다.)<\/div><\/div><\/div><div class=\"pt\"><div class=\"pw\"><span class=\"mk\">2)<\/span>is<small>(be) · ~이다<\/small><\/div><div class=\"ln\">주어 e-waste는 <b>하나<\/b>이고 지금도 맞는 사실이라 <b>is<\/b>예요.<\/div><div class=\"exb\"><span class=\"et\">쉬운 예<\/span><div>Water is important. (물은 중요하다.)<\/div><\/div><\/div>", "parts": ["Due to toxic materials ", 0, " in these products, such as lead, e-waste ", 1, " a serious health and environmental hazard."], "blanks": [{"base": "contain", "ans": "contained", "opts": ["contained", "containing", "contain", "to contain", "contains"]}, {"base": "be", "ans": "is", "opts": ["is", "are", "was", "being", "be"]}]}, {"n": 7, "headko": null, "ko": "설상가상으로, 매년 생산되는 전자 쓰레기의 양은 걱정스러운 속도로 증가하고 있다.", "fko": "설상가상으로, 매년 생산되는 전자 쓰레기의 양은 걱정스러운 속도로 증가하고 있다.", "exp": "<div class=\"pt\"><div class=\"pw\"><span class=\"mk\">1)<\/span>produced<small>(produce) · 만들어진<\/small><\/div><div class=\"ln\">전자 쓰레기의 양은 사람들에 의해 <b>만들어진<\/b> 것이에요.<\/div><div class=\"ln\">'~된'은 <b>p.p.<\/b>로 뒤에서 꾸며요.<\/div><div class=\"exb\"><span class=\"et\">쉬운 예<\/span><div>the rice grown in Korea (한국에서 재배된 쌀)<\/div><\/div><\/div><div class=\"pt\"><div class=\"pw\"><span class=\"mk\">2)<\/span>is increasing<small>(increase) · 늘고 있다<\/small><\/div><div class=\"ln\">the amount는 <b>하나<\/b>라서 <b>is<\/b>!<\/div><div class=\"ln\">'지금 계속 늘어나는 중'이라서 <b>be + -ing(진행)<\/b> 한 덩어리예요.<\/div><div class=\"exb\"><span class=\"et\">쉬운 예<\/span><div>The number of students is growing. (학생 수가 늘고 있다.)<\/div><\/div><\/div><div class=\"pt\"><div class=\"pw\"><span class=\"mk\">3)<\/span>alarming<small>(alarm) · 걱정스러운<\/small><\/div><div class=\"ln\">rate(속도)가 보는 사람을 <b>놀라게(걱정시키게) 하는<\/b> 쪽이라서 <b>-ing<\/b>예요.<\/div><div class=\"ln\">사람이 놀란 상태일 땐 -ed를 써요.<\/div><div class=\"exb\"><span class=\"et\">쉬운 예<\/span><div>It is an exciting game. (그것은 신나는 경기다.)<\/div><\/div><\/div>", "parts": ["To make matters worse, the amount of e-waste ", 0, " each year ", 1, " at an ", 2, " rate."], "blanks": [{"base": "produce", "ans": "produced", "opts": ["produced", "producing", "produce", "to produce", "produces"]}, {"base": "increase", "ans": "is increasing", "opts": ["is increasing", "are increasing", "increases", "is increased", "increased"]}, {"base": "alarm", "ans": "alarming", "opts": ["alarming", "alarmed", "alarm", "alarms", "to alarm"]}]}, {"n": 8, "headko": null, "ko": "2021년에 전 세계적으로 총 5,740만 메트릭톤의 전자 쓰레기가 발생했는데, 이는 전자 쓰레기에 대한 자료가 처음으로 수집된 해인 2014년에 비해 37% 증가한 것이다.", "fko": "2021년에 전 세계적으로 총 5,740만 메트릭톤의 전자 쓰레기가 발생했는데, 이는 전자 쓰레기에 대한 자료가 처음으로 수집된 해인 2014년에 비해 37% 증가한 것이다.", "exp": "<div class=\"pt\"><div class=\"pw\"><span class=\"mk\">1)<\/span>was generated<small>(generate) · 발생했다<\/small><\/div><div class=\"ln\">전자 쓰레기는 저절로 생긴 게 아니라 <b>만들어진(발생된)<\/b> 것이에요.<\/div><div class=\"ln\">2021년 이야기이니 <b>과거<\/b>! 그래서 <b>was + p.p.<\/b> 한 덩어리예요.<\/div><div class=\"exb\"><span class=\"et\">쉬운 예<\/span><div>The cake was made by my mom. (그 케이크는 엄마가 만드셨다.)<\/div><\/div><\/div><div class=\"pt\"><div class=\"pw\"><span class=\"mk\">2)<\/span>was<small>(be) · ~였다<\/small><\/div><div class=\"ln\">which는 앞 내용(2021년 일)을 받아요.<\/div><div class=\"ln\">옛날 해 이야기라서 <b>과거 was<\/b>예요.<\/div><div class=\"exb\"><span class=\"et\">쉬운 예<\/span><div>It was a big fish. (그것은 큰 물고기였다.)<\/div><\/div><\/div><div class=\"pt\"><div class=\"pw\"><span class=\"mk\">3)<\/span>was first collected<small>(first, collect) · 처음 수집되었다<\/small><\/div><div class=\"ln\">자료(data)는 <b>모아지는<\/b> 쪽이라 수동 <b>was + p.p.<\/b>!<\/div><div class=\"ln\">2014년 이야기라서 과거이고, first(처음)는 <b>was와 collected 사이<\/b>에 들어가요.<\/div><div class=\"exb\"><span class=\"et\">쉬운 예<\/span><div>The room was cleaned yesterday. (그 방은 어제 청소되었다.)<\/div><\/div><\/div>", "parts": ["In 2021, a total of 57.4 million metric tons of e-waste ", 0, " worldwide, which ", 1, " a 37% increase from 2014, the year when data about e-waste ", 2, "."], "blanks": [{"base": "generate", "ans": "was generated", "opts": ["was generated", "generated", "was generating", "generates", "is generated"]}, {"base": "be", "ans": "was", "opts": ["was", "is", "were", "be", "has been"]}, {"base": "first, collect", "ans": "was first collected", "opts": ["was first collected", "first collected", "was first collecting", "is first collected", "was és in over 30 countries around the world."], "blanks": [{"base": "open", "ans": "was opened", "opts": ["was opened", "opened", "was opening", "opens", "is opened"]}, {"base": "be", "ans": "was", "opts": ["was", "is", "were", "be", "has been"]}, {"base": "spread", "ans": "spread", "opts": ["spread", "spreads", "spreading", "spreaded", "to spread"]}, {"base": "be", "ans": "were", "opts": ["were", "was", "are", "be", "being"]}]}, {"n": 34, "headko": null, "ko": "고장 난 물건들이 전자 쓰레기가 되는 것을 막는 것과 더불어, 이 카페들은 또한 사람들이 전자 제품의 수리와 보수 관리에 대한 매우 유용한 기술들과 지식을 공유할 수 있도록 장려한다.", "fko": "고장 난 물건들이 전자 쓰레기가 되는 것을 막는 것과 더불어, 이 카페들은 또한 사람들이 전자 제품의 수리와 보수 관리에 대한 매우 유용한 기술들과 지식을 공유할 수 있도록 장려한다.", "exp": "<div class=\"pt\"><div class=\"pw\"><span class=\"mk\">1)<\/span>preventing<small>(prevent) · 막는 것<\/small><\/div><div class=\"ln\">Along with(~와 더불어) 같은 <b>전치사 뒤<\/b>에는 <b>-ing<\/b>를 써요.<\/div><div class=\"exb\"><span class=\"et\">쉬운 예<\/span><div>I&#x27;m good at drawing. (나는 그림 그리기를 잘한다.)<\/div><\/div><\/div><div class=\"pt\"><div class=\"pw\"><span class=\"mk\">2)<\/span>damaged<small>(damage) · 손상된<\/small><\/div><div class=\"ln\">물건은 <b>망가짐을 당한<\/b> 쪽이라서 <b>p.p.<\/b>로 명사 앞에 붙여요.<\/div><div class=\"exb\"><span class=\"et\">쉬운 예<\/span><div>a broken toy (고장 난 장난감)<\/div><\/div><\/div><div class=\"pt\"><div class=\"pw\"><span class=\"mk\">3)<\/span>becoming<small>(become) · 되는 것<\/small><\/div><div class=\"ln\">from(~로부터) 같은 <b>전치사 뒤<\/b>에는 <b>-ing<\/b>를 써요.<\/div><div class=\"ln\">prevent A from -ing는 'A가 ~하지 못하게 막다'예요.<\/div><div class=\"exb\"><span class=\"et\">쉬운 예<\/span><div>The rain stopped us from going out. (비 때문에 우리는 나가지 못했다.)<\/div><\/div><\/div><div class=\"pt\"><div class=\"pw\"><span class=\"mk\">4)<\/span>encourage<small>(encourage) · 장려한다<\/small><\/div><div class=\"ln\">these cafés는 <b>여럿<\/b>이고 지금 이야기라서 <b>-s 없는 현재형<\/b>이에요.<\/div><div class=\"exb\"><span class=\"et\">쉬운 예<\/span><div>These cafés open early. (이 카페들은 일찍 문을 연다.)<\/div><\/div><\/div><div class=\"pt\"><div class=\"pw\"><span class=\"mk\">5)<\/span>to share<small>(share) · 나누도록<\/small><\/div><div class=\"ln\">encourage(장려하다) 뒤에는 '<b>누가 ~하도록<\/b>'이 <b>목적어 + to + 동사원형<\/b>으로 와요.<\/div><div class=\"exb\"><span class=\"et\">쉬운 예<\/span><div>He encouraged me to try. (그는 내가 시도해 보도록 격려했다.)<\/div><\/div><\/div>", "parts": ["Along with ", 0, " ", 1, " items from ", 2, " e-waste, these cafés also ", 3, " people ", 4, " their invaluable skills and knowledge about the repair and maintenance of electronics."], "blanks": [{"base": "prevent", "ans": "preventing", "opts": ["preventing", "prevent", "prevented", "to prevent", "prevents"]}, {"base": "damage", "ans": "damaged", "opts": ["damaged", "damage", "damaging", "to damage", "damages"]}, {"base": "become", "ans": "becoming", "opts": ["becoming", "become", "became", "to become", "becomes"]}, {"base": "encourage", "ans": "encourage", "opts": ["encourage", "encourages", "encouraged", "encouraging", "to encourage"]}, {"base": "share", "ans": "to share", "opts": ["to share", "share", "sharing", "shared", "shares"]}]}, {"n": 35, "headko": null, "ko": "점점 더 많은 사람들이 자원봉사를 하기 위해 신청하면서, 이 카페들은 계속해서 인기를 얻고 있다.", "fko": "점점 더 많은 사람들이 자원봉사를 하기 위해 신청하면서, 이 카페들은 계속해서 인기를 얻고 있다.", "exp": "<div class=\"pt\"><div class=\"pw\"><span class=\"mk\">1)<\/span>continue<small>(continue) · 계속한다<\/small><\/div><div class=\"ln\">They는 <b>여럿<\/b>이고 지금 이야기라서 <b>-s 없는 현재형<\/b>이에요.<\/div><div class=\"exb\"><span class=\"et\">쉬운 예<\/span><div>They continue to walk. (그들은 계속 걷는다.)<\/div><\/div><\/div><div class=\"pt\"><div class=\"pw\"><span class=\"mk\">2)<\/span>to grow<small>(grow) · 커지다<\/small><\/div><div class=\"ln\">continue(계속하다) 뒤에는 <b>to + 동사원형<\/b>을 붙일 수 있어요.<\/div><div class=\"ln\">continue 뒤에는 -ing도 되지만, 이 문제에서는 to-v 모양이에요.<\/div><div class=\"exb\"><span class=\"et\">쉬운 예<\/span><div>I want to go home. (나는 집에 가고 싶다.)<\/div><\/div><\/div><div class=\"pt\"><div class=\"pw\"><span class=\"mk\">3)<\/span>signing<small>(sign) · 신청하면서<\/small><\/div><div class=\"ln\">'with + 사람들 + ~하면서'에서 사람들이 <b>스스로 신청하는<\/b> 쪽이라서 <b>-ing<\/b>예요.<\/div><div class=\"exb\"><span class=\"et\">쉬운 예<\/span><div>He walked with his dog following him. (그는 개가 따라오는 채로 걸었다.)<\/div><\/div><\/div>", "parts": ["They ", 0, " ", 1, " in popularity, with more and more people ", 2, " up to volunteer."], "blanks": [{"base": "continue", "ans": "continue", "opts": ["continue", "continues", "continued", "continuing", "to continue"]}, {"base": "grow", "ans": "to grow", "opts": ["to grow", "grow", "grew", "grows", "grown"]}, {"base": "sign", "ans": "signing", "opts": ["signing", "signed", "sign", "to sign", "signs"]}]}, {"n": 36, "headko": null, "ko": "사람들이 배울 수 있는 공간을 제공함으로써, 수리 카페들은 개인이 자신들의 장치를 유지하고 그것들의 수명을 연장할 수 있게 한다.", "fko": "사람들이 배울 수 있는 공간을 제공함으로써, 수리 카페들은 개인이 자신들의 장치를 유지하고 그것들의 수명을 연장할 수 있게 한다.", "exp": "<div class=\"pt\"><div class=\"pw\"><span class=\"mk\">1)<\/span>providing<small>(provide) · 제공함으로써<\/small><\/div><div class=\"ln\">By(~함으로써) 같은 <b>전치사 뒤<\/b>에는 <b>-ing<\/b>를 써요.<\/div><div class=\"exb\"><span class=\"et\">쉬운 예<\/span><div>He learned English by watching movies. (그는 영화를 보면서 영어를 배웠다.)<\/div><\/div><\/div><div class=\"pt\"><div class=\"pw\"><span class=\"mk\">2)<\/span>learn<small>(learn) · 배우다<\/small><\/div><div class=\"ln\">can(~할 수 있다) 뒤에는 <b>동사 원래 모양<\/b>이에요.<\/div><div class=\"exb\"><span class=\"et\">쉬운 예<\/span><div>We can learn here. (우리는 여기서 배울 수 있다.)<\/div><\/div><\/div><div class=\"pt\"><div class=\"pw\"><span class=\"mk\">3)<\/span>enable<small>(enable) · 가능하게 한다<\/small><\/div><div class=\"ln\">Repair Cafés는 <b>여럿<\/b>이고 지금 이야기라서 <b>-s 없는 현재형<\/b>이에요.<\/div><div class=\"exb\"><span class=\"et\">쉬운 예<\/span><div>Dogs love people. (개들은 사람을 사랑한다.)<\/div><\/div><\/div><div class=\"pt\"><div class=\"pw\"><span class=\"mk\">4)<\/span>to maintain<small>(maintain) · 유지하도록<\/small><\/div><div class=\"ln\">enable(가능하게 하다) 뒤에는 '<b>누가 ~할 수 있게<\/b>'가 <b>목적어 + to + 동사원형<\/b>으로 와요.<\/div><div class=\"exb\"><span class=\"et\">쉬운 예<\/
