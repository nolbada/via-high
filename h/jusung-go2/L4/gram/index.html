<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e98a00"><title>교과서 4과 문법 분석</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#17202e;--sub:#5b677a;--line:#d9e0ec;--pri:#1d4ed8;--off:#e9eef8;--note:#fffbe6;--noteL:#d9c76a;--noteT:#8a6d00;--noteLn:#efe6b3;
 --gd:#15803d;--gl:#c6efcf;--bd:#1d4ed8;--bl:#cfe0fb;--kd:#be185d;--kl:#fbcfe3;--od:#c2570c;--ol:#ffe0b8}

 --gd:#4ade80;--gl:#16361f;--bd:#8ab4ff;--bl:#1a2a4a;--kd:#f472b6;--kl:#401a30;--od:#fb923c;--ol:#43270f}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.55;font-size:16px}
.wrap{max-width:640px;margin:0 auto;padding:14px 16px 56px}
.top{display:flex;align-items:center;gap:10px;margin:2px 0 10px}

.c-g{--d:var(--gd);--l:var(--gl)}.c-b{--d:var(--bd);--l:var(--bl)}.c-k{--d:var(--kd);--l:var(--kl)}.c-o{--d:var(--od);--l:var(--ol)}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px 13px;margin-bottom:10px}
.no{font-size:12px;font-weight:800;color:var(--pri);margin-bottom:4px}
.drb{display:flex;gap:6px;margin:0 0 10px}
.drb button{flex:1;padding:8px 0;border-radius:10px;border:1.5px solid var(--d);background:var(--l);color:var(--ink);font:800 13px inherit;font-family:inherit;cursor:pointer}

.ps{font-size:16px;line-height:2;display:flex;gap:8px;border-top:1px solid var(--line);padding-top:4px;margin-top:4px}.ps:first-of-type{border-top:0;margin-top:0}
.ps i{font-style:normal;font-size:12px;font-weight:800;color:var(--pri);flex:none;width:20px;padding-top:1px}

.hl{background:var(--l);border-bottom:2px solid var(--d);border-radius:3px;padding:0 2px}

.note .nl{font-size:11.5px;font-weight:800;color:var(--noteT);margin-bottom:2px}.note .ln{font-size:14px;font-weight:700;line-height:26px;color:var(--ink)}
.bkb{margin-top:8px;border:1.5px solid var(--d);background:var(--card);color:var(--d);border-radius:999px;padding:6px 14px;font:700 13px inherit;font-family:inherit;cursor:pointer}
.rf{font-size:11.5px;font-weight:800;color:var(--d);margin:0 2px 0 1px;vertical-align:baseline;position:relative;top:-.5em;line-height:0}
.flash{animation:fl 1.4s ease}@keyframes fl{0%,60%{box-shadow:0 0 0 4px #f5c84288}100%{box-shadow:none}}
.back{border:1.5px solid var(--line);background:var(--card);color:var(--sub);border-radius:10px;padding:8px 16px;font:700 13.5px inherit;font-family:inherit;margin-bottom:8px;cursor:pointer}

.rv .q:after{content:"▾";position:absolute;right:9px;top:5px;color:var(--d)}.rv.open .q:after{content:"▴"}
.rv .a{display:none;margin-top:5px;border:1.5px solid var(--d);background:var(--l);border-radius:10px;padding:8px 10px;font-size:13.5px;line-height:1.6}.rv.open .a{display:block}
.rv .a .at{font-weight:800;color:var(--d);margin-bottom:4px}
.rv .a .ex{font-size:13px;color:var(--sub);margin-top:6px}
.lab{font-size:13px;font-weight:800;margin:2px 2px 6px;color:var(--sub)}

<script>
var D={"secs": [{"no": 1, "id": "z1", "sents": [{"n": 1, "mk": "[1|On her way to] a study group meeting, Liz accidentally dropped her laptop on the street, [2|seriously damaging it].", "en": "On her way to a study group meeting, Liz accidentally dropped her laptop on the street, seriously damaging it.", "ko": "스터디 그룹 모임에 가는 길에, Liz는 실수로 그녀의 노트북을 길에 떨어뜨려 그것을 심각하게 손상시켰다."}, {"n": 2, "mk": "[4|Although] [3|it] still turns on, the screen is [5|cracked], and some keys are not working.", "en": "Although it still turns on, the screen is cracked, and some keys are not working.", "ko": "그것은 여전히 켜지기는 하지만, 화면은 금이 갔고, 몇몇 키들은 작동하지 않는다."}, {"n": 3, "mk": "She [6|can have] [3|it] [6|repaired], but she [7|is hesitating to do so].", "en": "She can have it repaired, but she is hesitating to do so.", "ko": "그녀는 그것을 수리할 수 있지만, 그렇게 하기를 망설이고 있다."}, {"n": 4, "mk": "Sometimes repairs are expensive, and they often take a long time.", "en": "Sometimes repairs are expensive, and they often take a long time.", "ko": "때때로 수리 작업은 돈이 많이 들고, 보통 오랜 시간이 걸린다."}, {"n": 5, "mk": "[11|Besides], the laptop is about five years old.", "en": "Besides, the laptop is about five years old.", "ko": "게다가 그 노트북은 5년 정도 되었다."}, {"n": 6, "mk": "In this case, [8|getting rid of the old] [9|one] [8|and purchasing a new] [9|one] [10|might seem like] a more reasonable option.", "en": "In this case, getting rid of the old one and purchasing a new one might seem like a more reasonable option.", "ko": "이 경우에 오래된 노트북은 버리고 새로운 것을 구입하는 것이 더 합리적인 선택처럼 보일 수 있다."}, {"n": 7, "mk": "[11|In reality], however, it may not be [12|the best thing to do].", "en": "In reality, however, it may not be the best thing to do.", "ko": "하지만 실제로는 그것이 최선이 아닐 수 있다."}, {"n": 8, "mk": "[13|If Liz throws her laptop in the trash], she [14|will be contributing to] a serious problem: e-waste.", "en": "If Liz throws her laptop in the trash, she will be contributing to a serious problem: e-waste.", "ko": "만약 Liz가 그녀의 노트북을 쓰레기통에 버린다면, 그녀는 전자 쓰레기라는 심각한 문제에 기여하게 될 것이다."}], "items": [{"t": "on one's way to ~ : ~에 가는 도중에", "c": "g", "x": "On her way to a study group meeting은 ‘스터디 그룹 모임에 가는 길에’라는 뜻이다. 사고가 일어난 때와 장소를 먼저 알려 주는 표현이다. 뒤에 장소를 나타내는 명사가 온다. accidentally는 ‘실수로’라는 뜻의 부사이다.", "n": ["on one's way to ~ = ~에 가는 도중에", "accidentally = 실수로"], "q": "On her way to a study group meeting은 어떻게 해석하는가?", "a": "스터디 그룹 모임에 가는 길에", "p": "On her way to"}, {"t": "분사구문 ~, -ing : 그리고 ~하다", "c": "k", "x": "Liz accidentally dropped her laptop on the street, seriously damaging it은 ‘노트북을 길에 떨어뜨려 그것을 심각하게 손상시켰다’라는 뜻이다. and she seriously damaged it에서 접속사와 주어를 빼고 동사를 -ing로 바꾼 분사구문이다. 주어가 주절과 같은 Liz라서 생략된다. 떨어뜨린 일에 이어서 생긴 결과를 말한다.", "n": ["주절, -ing ~ = …하고 (그리고) ~하다", "분사구문의 주어 = 주절의 주어 (생략)"], "q": "seriously damaging it의 의미상 주어는 누구인가?", "a": "Liz (주절의 주어와 같아서 생략)", "p": "seriously damaging it"}, {"t": "it = her laptop (Liz의 노트북)", "c": "o", "x": "Although it still turns on의 it은 앞에서 나온 her laptop(그녀의 노트북)을 가리킨다. have it repaired의 it도 같은 노트북이다. 사람이 아니라 ‘노트북’이 켜지고, 노트북이 수리된다는 뜻이다.", "n": ["it = her laptop", "대명사 → 앞에서 누구(무엇)인지 찾기"], "q": "Although it still turns on의 it은 무엇을 가리키는가?", "a": "Liz의 노트북 (her laptop)", "p": "it still turns on"}, {"t": "접속사 although + 절 : 비록 ~이지만", "c": "b", "x": "Although it still turns on은 ‘그것은 여전히 켜지기는 하지만’이라는 뜻이다. although(비록 ~이지만)는 접속사라서 뒤에 it still turns on처럼 주어와 동사가 있는 절이 온다. 명사만 올 때는 despite나 in spite of를 쓴다. turn on은 여기서 ‘(기계가) 켜지다’라는 뜻이다.", "n": ["although + 주어 + 동사 = 비록 ~이지만 (양보)", "turn on = 켜지다"], "q": "although 뒤에는 어떤 모양이 오는가?", "a": "주어 + 동사가 있는 절", "p": "Although it still turns on"}, {"t": "분사형 형용사 cracked : 금이 간", "c": "b", "x": "the screen is cracked는 ‘화면이 금이 갔다’라는 뜻이다. cracked는 동사 crack(금이 가다)의 과거분사에서 나온 형용사로, ‘금이 간’이라는 상태를 나타낸다. be동사 뒤에서 주어의 상태를 설명하는 보어이다.", "n": ["cracked = 금이 간 (분사형 형용사)", "be + 형용사 = ~한 상태이다"], "q": "the screen is cracked는 무슨 뜻인가?", "a": "화면이 금이 갔다 (금이 간 상태)", "p": "cracked"}, {"t": "have + 목적어 + 과거분사 : ~가 …되게 하다", "c": "k", "x": "She can have it repaired는 ‘그녀는 그것을 수리되게 할 수 있다’, 즉 ‘수리를 맡길 수 있다’라는 뜻이다. 목적어 it(노트북)은 직접 수리하는 것이 아니라 수리되는 쪽이라서 repair의 과거분사 repaired를 쓴다. 능동의 repair를 쓰면 안 된다. repair는 ‘~을 고치다, 수리하다’라는 뜻이다.", "n": ["have + O + p.p. = O가 ~되게 하다 (~받다)", "목적어와 목적격보어가 수동 관계 → 과거분사"], "q": "She can have it repaired에서 repaired가 과거분사인 이유는?", "a": "it(노트북)이 수리되는 수동 관계이기 때문이다.", "p": "can have it repaired"}, {"t": "hesitate + to부정사 · 현재진행형 · do so : 망설이다", "c": "b", "x": "she is hesitating to do so는 ‘그렇게 하기를 망설이고 있다’라는 뜻이다. hesitate는 to부정사를 목적어로 취해서 ‘~하기를 주저하다’라는 뜻이다. is hesitating은 be동사 + 현재분사의 현재진행형으로 지금 망설이는 중임을 나타낸다. do so는 앞의 have it repaired를 대신하는 말로, 같은 표현의 반복을 피한다.", "n": ["hesitate + to V = ~하기를 주저하다", "do so = 앞에 나온 행동을 대신 받음 (have it repaired)"], "q": "she is hesitating to do so에서 do so는 무엇을 대신하는가?", "a": "have it repaired (노트북을 수리하는 것)", "p": "is hesitating to do so"}, {"t": "동명사구 주어 : ~하는 것은", "c": "k", "x": "getting rid of the old one and purchasing a new one은 ‘오래된 노트북은 버리고 새것을 구입하는 것’이라는 뜻의 동명사구 주어이다. getting과 purchasing이 and로 이어진 병렬 구조이고, 이 동명사구 전체가 주어 역할을 한다. 동사는 조동사 might 뒤라서 might seem처럼 모양이 그대로이다. get rid of ~는 ‘~을 버리다, 처분하다’이고, purchase는 ‘~을 구입하다’라는 뜻이다.", "n": ["동명사 -ing ~ = ~하는 것 (주어 역할)", "get rid of ~ = ~을 버리다 / purchase = 구입하다"], "q": "getting rid of the old one and purchasing a new one은 어떻게 해석하는가?", "a": "오래된 노트북은 버리고 새것을 구입하는 것", "p": "getting rid of the old one and purchasing a new one"}, {"t": "one = laptop (노트북)", "c": "o", "x": "the old one의 one은 앞에 나온 laptop을 가리키는 대명사이다. 같은 명사를 반복하지 않으려고 쓴다. 그래서 the old one은 ‘오래된 노트북’, a new one은 ‘새 노트북’이라는 뜻이다. one은 정해지지 않은 하나를 받는 부정대명사로, 앞 명사를 대신한다.", "n": ["one = 앞에 나온 명사(laptop)의 반복을 피함", "the old one = 오래된 노트북 / a new one = 새 노트북"], "q": "the old one과 a new one의 one은 각각 무엇을 대신하는가?", "a": "둘 다 laptop(노트북)", "p": "the old one"}, {"t": "seem like + 명사(구) : ~처럼 보이다", "c": "b", "x": "might seem like a more reasonable option은 ‘더 합리적인 선택처럼 보일 수 있다’라는 뜻이다. seem like 뒤에는 a more reasonable option 같은 명사구가 온다. might는 ‘~일 수도 있다’는 약한 추측을 나타낸다. reasonable은 ‘합리적인, 타당한’이라는 뜻이다.", "n": ["seem like + 명사(구) = ~인 것 같다, ~처럼 보이다", "reasonable = 합리적인"], "q": "seem like 뒤에는 어떤 말이 오는가?", "a": "명사(구)", "p": "might seem like a more reasonable option"}, {"t": "Besides · In reality : 게다가 · 실제로는", "c": "g", "x": "Besides는 ‘게다가, 뿐만 아니라’라는 뜻의 부사로, 앞 내용에 이유를 더할 때 쓴다. In reality는 ‘실제로는’이라는 뜻으로, 생각과 다른 현실을 말할 때 쓴다. 이 글에서는 ‘새로 사는 것이 합리적으로 보이지만 실제로는 최선이 아닐 수 있다’는 흐름을 만든다. (besides는 전치사로 ‘~ 외에도’라는 뜻도 있다.)", "n": ["besides = 게다가", "in reality = 실제로는"], "q": "Besides와 In reality는 각각 무슨 뜻인가?", "a": "Besides = 게다가 / In reality = 실제로는", "p": "Besides … In reality"}, {"t": "형용사적 용법의 to부정사 : ~할 (명사)", "c": "b", "x": "the best thing to do는 ‘할 수 있는 최선의 것’, 즉 ‘최선의 일’이라는 뜻이다. to do가 앞의 명사 thing을 뒤에서 꾸미는 형용사적 용법의 to부정사이다. to do가 thing을 뒤에서 꾸며 ‘할 (일)’로 해석한다. it may not be ~는 ‘~이 아닐 수도 있다’라는 뜻이고, it은 앞 문장의 ‘낡은 노트북을 버리고 새것을 사는 일’을 가리킨다.", "n": ["명사 + to V = ~할 (명사)", "the best thing to do = 할 수 있는 최선의 일"], "q": "the best thing to do에서 to do는 무엇을 꾸미는가?", "a": "thing (형용사적 용법의 to부정사)", "p": "the best thing to do"}, {"t": "접속사 if + 현재시제 : 만약 ~라면", "c": "k", "x": "If Liz throws her laptop in the trash는 ‘만약 Liz가 노트북을 쓰레기통에 버린다면’이라는 뜻이다. 조건을 나타내는 if절에서는 미래의 일이라도 현재시제(throws)를 쓴다. will throw처럼 쓰지 않는다. 주절에는 will be contributing처럼 미래를 나타내는 말이 온다. trash는 ‘쓰레기’ 외에 ‘쓰레기통’이라는 뜻도 있다.", "n": ["if + 주어 + 현재시제, 주어 + will + 동사 = 만약 ~라면 …할 것이다", "조건의 if절에는 미래 대신 현재시제"], "q": "if절에서 미래의 일인데 throws를 쓴 이유는?", "a": "조건을 나타내는 if절에서는 미래 대신 현재시제를 쓰기 때문이다.", "p": "If Liz throws her laptop in the trash"}, {"t": "미래진행형 · contribute to ~ : ~에 기여하게 될 것이다", "c": "b", "x": "she will be contributing to a serious problem은 ‘심각한 문제에 기여하게 될 것이다’라는 뜻이다. will be + 현재분사(-ing)는 미래진행형으로, 미래의 어느 때에 그 일을 하고 있을 것이라는 뜻이다. contribute to ~는 ‘~에 기여하다, ~의 원인이 되다’이고, 여기서 to는 전치사이다. 콜론(:) 뒤의 e-waste(전자 쓰레기)는 a serious problem을 풀어서 설명한 말이다.", "n": ["will be + -ing = ~하고 있을 것이다 (미래진행형)", "contribute to ~ = ~에 기여하다"], "q": "will be contributing은 어떤 시제인가? contribute to는 무슨 뜻인가?", "a": "미래진행형 / ~에 기여하다", "p": "will be contributing to"}]}, {"no": 2, "id": "z2", "sents": [{"n": 9, "mk": "What exactly is e-waste?", "en": "What exactly is e-waste?", "ko": "전자 쓰레기란 정확히 무엇인가?"}, {"n": 10, "mk": "The term [1|refers to] discarded electronic devices and electrical appliances.", "en": "The term refers to discarded electronic devices and electrical appliances.", "ko": "이 용어는 버려진 전자 장치와 전기 기기를 나타낸다."}, {"n": 11, "mk": "[2|Due to] toxic materials [3|contained in these products], [2|such as] lead, e-waste is a serious health and environmental hazard.", "en": "Due to toxic materials contained in these products, such as lead, e-waste is a serious health and environmental hazard.", "ko": "이 제품들에 포함된 납과 같은 유독성 물질 때문에 전자 쓰레기는 심각한 건강 및 환경 위험 요소이다."}, {"n": 12, "mk": "[4|To make matters worse], [5|the amount of e-waste] [3|produced each year] is increasing at an alarming rate.", "en": "To make matters worse, the amount of e-waste produced each year is increasing at an alarming rate.", "ko": "설상가상으로, 매년 생산되는 전자 쓰레기의 양은 걱정스러운 속도로 증가하고 있다."}, {"n": 13, "mk": "In 2021, [6|a total of 57.4 million metric tons of e-waste was generated] worldwide, [7|which] was a 37% increase from [8|2014, the year when data about e-waste was first collected].", "en": "In 2021, a total of 57.4 million metric tons of e-waste was generated worldwide, which was a 37% increase from 2014, the year when data about e-waste was first collected.", "ko": "2021년에 전 세계적으로 총 5,740만 메트릭톤의 전자 쓰레기가 발생했는데, 이는 전자 쓰레기에 대한 자료가 처음으로 수집된 해인 2014년에 비해 37% 증가한 것이다."}, {"n": 14, "mk": "Experts predict that [9|by 2030], [5|the amount of e-waste] [3|generated annually] [9|will have doubled] in just 16 years.", "en": "Experts predict that by 2030, the amount of e-waste generated annually will have doubled in just 16 years.", "ko": "전문가들은 2030년에는 매년 발생하는 전자 쓰레기의 양이 단 16년 만에 두 배가 될 것으로 예측한다."}, {"n": 15, "mk": "For this reason, efforts [10|are being made] to address this problem, [11|most of] [12|which] are focused on [13|making products easier to repair].", "en": "For this reason, efforts are being made to address this problem, most of which are focused on making products easier to repair.", "ko": "이러한 이유로 이 문제를 다루기 위해 노력이 이루어지고 있는데, 이 중 대부분은 제품들을 수리하기 더 쉽게 만드는 것에 중점을 두고 있다."}, {"n": 16, "mk": "Let’s [14|take a look at] some practical approaches from around the world.", "en": "Let’s take a look at some practical approaches from around the world.", "ko": "전 세계의 현실성 있는 접근법을 몇 가지 살펴보자."}], "items": [{"t": "refer to ~ : ~을 나타내다, ~에 대해 언급하다", "c": "g", "x": "The term refers to discarded electronic devices...에서 refers to는 ‘~을 나타낸다’라는 뜻이다. 주어 The term이 3인칭 단수라서 원형 refer에 -s가 붙은 모양이다. refer to에는 ‘~에 대해 언급하다’, ‘~을 참고하다’라는 뜻도 있다. 여기서는 용어가 가리키는 대상을 설명하는 말이다.", "n": ["refer to ~ = ~을 나타내다 / ~에 대해 언급하다 / ~을 참고하다"], "q": "The term refers to ~에서 refers to는 무슨 뜻인가?", "a": "~을 나타낸다 (원형 refer to ~)", "p": "refers to"}, {"t": "due to ~ · such as ~ : ~ 때문에 · ~와 같은", "c": "g", "x": "Due to toxic materials ...는 ‘유독성 물질 때문에’라는 뜻이다. due to는 두 단어가 한 덩어리로 전치사처럼 쓰여서 뒤에 명사(구)가 온다. such as lead는 ‘납과 같은’이라는 뜻으로 예를 들 때 쓴다. toxic(유독한)과 hazard(위험 요소)도 함께 알아 둔다.", "n": ["due to + 명사(구) = ~ 때문에", "such as ~ = ~와 같은 (예시)"], "q": "Due to toxic materials에서 Due to 뒤에는 어떤 말이 오는가?", "a": "명사(구) — Due to는 전치사처럼 쓰인다.", "p": "Due to toxic materials"}, {"t": "명사 + 과거분사구 : ~된 (명사)", "c": "b", "x": "materials contained in these products는 ‘이 제품들에 포함된 물질’이라는 뜻이다. contained in these products가 materials를 뒤에서 꾸미는 과거분사구이다. 물질은 ‘포함되는’ 쪽이라서 수동의 뜻인 과거분사를 쓴다. produced each year(매년 생산되는)와 generated annually(매년 발생하는)도 모두 앞의 e-waste를 같은 방식으로 뒤에서 꾸민다.", "n": ["명사 + p.p. ~ = ~된 (명사), 수동의 뜻으로 뒤에서 꾸밈", "materials (which are) contained in ~ 에서 which are 생략"], "q": "materials contained in these products에서 contained in these products는 무엇을 꾸미는가?", "a": "materials를 뒤에서 꾸민다. (‘~에 포함된 물질’)", "p": "contained in these products"}, {"t": "To make matters worse : 설상가상으로", "c": "g", "x": "To make matters worse는 ‘설상가상으로’라는 뜻의 숙어이다. 이미 나쁜 상황에 더 나쁜 내용을 덧붙일 때 쓴다. 이 문장에서는 전자 쓰레기가 위험한 데다 그 양까지 빠르게 늘고 있다는 내용이 이어진다. matters 대신 things를 써도 된다.", "n": ["to make matters[things] worse = 설상가상으로"], "q": "To make matters worse는 어떤 상황에서 쓰는가?", "a": "이미 나쁜 상황에 더 나쁜 내용을 덧붙일 때 (설상가상으로)", "p": "To make matters worse"}, {"t": "the amount of ~ + 단수동사 : ~의 양은 …하다", "c": "b", "x": "the amount of e-waste ... is increasing에서 주어의 핵심은 amount(양, 단수)이다. 그래서 동사도 단수인 is이다. of e-waste는 amount를 꾸미는 수식어이고, produced each year(매년 생산되는)는 e-waste를 뒤에서 꾸미는 말이다. 이런 수식어구 때문에 동사가 멀어 보여도 주어는 단수 amount이므로 is를 쓴다. the amount of ~는 ‘~의 양’이라는 뜻이다.", "n": ["the amount of ~ = ~의 양 (단수 취급)", "수식어구를 건너뛰고 amount에 동사를 일치"], "q": "the amount of e-waste ... ___ increasing에서 is/are 중 무엇이고 왜인가?", "a": "is — 주어가 단수 amount이고 나머지는 수식어이다.", "p": "the amount of e-waste produced each year is increasing"}, {"t": "a total of ~ + 수동태 : 총 ~가 …되었다", "c": "b", "x": "a total of 57.4 million metric tons of e-waste was generated는 ‘총 5,740만 메트릭톤의 전자 쓰레기가 발생했다’라는 뜻이다. a total of ~(~의 합, 총 ~)는 하나의 총량으로 보고 단수동사 was를 썼다. e-waste는 ‘발생되는’ 쪽이라서 was generated의 수동태이다. generate는 ‘~을 발생시키다’라는 뜻이다.", "n": ["a total of ~ = 총 ~, ~의 합", "was generated = 발생되었다 (be p.p. 수동태)"], "q": "a total of ... was generated는 어떤 태이고 무슨 뜻인가?", "a": "수동태 — 총 ~가 발생되었다", "p": "a total of 57.4 million metric tons of e-waste was generated"}, {"t": ", which : 계속적 용법의 주격 관계대명사 (앞 내용을 받음)", "c": "k", "x": "worldwide, which was a 37% increase에서 쉼표 뒤의 which는 앞 내용 전체를 받는 계속적 용법이다. ‘그런데 이것은 37% 증가한 것이었다’처럼 앞에서부터 해석한다. which가 주어 자리에 있어서 바로 뒤에 동사 was가 왔다. 여기서 which는 2021년에 5,740만 메트릭톤이 발생했다는 사실을 가리킨다.", "n": [", which + 동사 = 그리고 그것은 ~ (앞 내용을 받는 계속적 용법)", "계속적 용법은 앞에서부터 해석"], "q": "worldwide, which was a 37% increase의 which는 무엇을 가리키는가?", "a": "앞 절 전체, 즉 2021년에 5,740만 메트릭톤의 전자 쓰레기가 발생한 사실", "p": "which"}, {"t": "동격 + 관계부사 when : ~한 해인 2014년", "c": "b", "x": "2014, the year when data ... was first collected에서 the year는 2014와 같은 말이라서 동격이다. when 이하는 the year를 꾸미는 관계부사절이다. when 뒤에 주어(data)와 동사가 완전하게 있다. 해석은 ‘자료가 처음으로 수집된 해인 2014년’이다. was first collected는 수동태(be p.p.)이다.", "n": ["명사, the year when 들을 수리하기 더 쉽게 만드는 것’이라는 뜻이다. make + 목적어(products) + 목적격 보어(easier)의 5형식이다. 목적어가 어떤 상태인지를 형용사 easier(비교급)가 설명한다. to repair는 easier를 꾸미는 부사적 용법의 to부정사로 ‘수리하기에’라는 뜻이다. focused on 뒤라서 making은 전치사의 목적어인 동명사이다.", "n": ["make + 목적어 + 형용사 = ~을 …하게 만들다", "형용사 + to V = ~하기에 (…한) (부사적 용법)"], "q": "making products easier to repair에서 easier의 역할은?", "a": "목적격 보어 — products가 어떤 상태가 되게 하는지 나타낸다.", "p": "making products easier to repair"}, {"t": "take a look at ~ : ~을 보다, 살펴보다", "c": "g", "x": "Let’s take a look at some practical approaches는 ‘현실성 있는 접근법을 몇 가지 살펴보자’라는 뜻이다. take a look at ~은 ‘~을 보다’라는 뜻의 숙어이다. Let’s + 동사원형은 ‘~하자’라는 청유문이다. practical은 여기서 ‘현실성 있는’, approach는 ‘접근법’이라는 뜻이다.", "n": ["take a look at ~ = ~을 보다", "Let’s + 동사원형 = ~하자 (청유문)"], "q": "Let’s take a look at ~은 무슨 뜻인가?", "a": "~을 살펴보자", "p": "take a look at"}]}, {"no": 3, "id": "z3", "sents": [{"n": 17, "mk": "[2|One reason many people] [1|dispose of] their damaged devices is that [4|they] are [3|too difficult to repair].", "en": "One reason many people dispose of their damaged devices is that they are too difficult to repair.", "ko": "많은 사람이 그들의 고장 난 장치들을 버리는 한 가지 이유는 그것들이 수리하기 너무 어렵기 때문이다."}, {"n": 18, "mk": "For example, a device may be difficult to disassemble, or its manufacturer may [5|require that it be brought] to an official service center to be fixed.", "en": "For example, a device may be difficult to disassemble, or its manufacturer may require that it be brought to an official service center to be fixed.", "ko": "예를 들어, 어떤 장치는 분해하기 어려울 수 있고, 또는 그것의 제조사가 그것을 고치려면 공식 수리소로 가져올 것을 요구할 수도 있다."}, {"n": 19, "mk": "Many companies do not [7|allow their customers to take] their damaged items to third-party repair shops.", "en": "Many companies do not allow their customers to take their damaged items to third-party repair shops.", "ko": "많은 회사는 그들의 고객들이 고장 난 물건들을 제삼자의 수리점으로 가지고 가는 것을 허용하지 않는다."}, {"n": 20, "mk": "[6|What is more], some products are intentionally [8|designed to be difficult to repair].", "en": "What is more, some products are intentionally designed to be difficult to repair.", "ko": "게다가, 몇몇 제품은 의도적으로 수리하기 어렵게 만들어진다."}, {"n": 21, "mk": "[9|It is common for consumers to be unable to] [10|acquire] the instructions for how to fix their items or the parts [11|needed to complete repairs].", "en": "It is common for consumers to be unable to acquire the instructions for how to fix their items or the parts needed to complete repairs.", "ko": "소비자들이 그들의 물건을 고치는 방법에 대한 설명이나 수리를 완료하기 위해 필요한 부품들을 얻지 못하는 것은 흔하다."}, {"n": 22, "mk": "The right-to-repair movement [13|is trying to solve] these problems by promoting [12|legislation that states] the following: If you own a product, you have the right to fix it yourself or bring it to a technician [14|of your choice].", "en": "The right-to-repair movement is trying to solve these problems by promoting legislation that states the following: If you own a product, you have the right to fix it yourself or bring it to a technician of your choice.", "ko": "수리할 권리 운동은 다음 내용을 명시하는 법률 제정을 추진함으로써 이러한 문제들을 해결하려고 하고 있는데, 그것은 만약 당신이 어떤 제품을 소유하고 있다면, 당신은 그것을 직접 고치거나 당신이 선택한 기술자에게 가지고 갈 권리가 있다는 내용이다."}, {"n": 23, "mk": "To protect the rights of consumers, the right-to-repair movement demands four things.", "en": "To protect the rights of consumers, the right-to-repair movement demands four things.", "ko": "소비자의 권리를 보호하기 위해, 수리할 권리 운동은 네 가지를 요구한다."}], "items": [{"t": "dispose of ~ : ~을 처리하다, 버리다", "c": "g", "x": "dispose of는 ‘~을 처리하다, 처분하다’라는 뜻의 숙어이다. 본문에서는 many people dispose of their damaged devices로 쓰여 ‘고장 난 장치들을 버린다’는 뜻이다. 숙어 전체를 하나로 외워 둔다.", "n": ["dispose of ~ = ~을 처리하다, 처분하다"], "q": "dispose of their damaged devices는 무슨 뜻인가?", "a": "고장 난 장치들을 버리다(처분하다)", "p": "dispose of"}, {"t": "One reason (why) ... : 관계부사 why의 생략", "c": "k", "x": "One reason many people dispose of ...에는 reason 뒤에 관계부사 why가 생략되어 있다. 원래는 One reason why many people dispose of ...이다. 선행사가 reason일 때 why는 생략할 수 있다.", "n": ["the reason (why) + 주어 + 동사 = ~하는 이유 (why 생략 가능)"], "q": "One reason many people dispose of ...에서 생략된 말은 무엇인가?", "a": "관계부사 why", "p": "One reason many people"}, {"t": "too + 형용사 + to부정사 : 너무 ~해서 …할 수 없다", "c": "b", "x": "too difficult to repair는 too + 형용사 + to부정사 구조이다. ‘수리하기에 너무 어렵다’는 뜻이고, that절은 사람들이 장치를 버리는 이유이고, 주어 they(devices)가 ‘수리되기에 너무 어렵다’는 내용이다. 그래서 이 구문은 ‘너무 ~해서 …할 수 없다’로도 풀이한다.", "n": ["too + 형용사 + to부정사 = 너무 ~해서 …할 수 없다 / …하기에 너무 ~하다"], "q": "too difficult to repair를 해석하라.", "a": "수리하기에 너무 어렵다", "p": "too difficult to repair"}, {"t": "they = 장치들 (their damaged devices)", "c": "o", "x": "that they are too difficult to repair의 they는 바로 앞의 their damaged devices, 즉 ‘고장 난 장치들’을 가리킨다. 사람들(many people)이 아니라 장치가 수리하기 어렵다는 내용이다.", "n": ["they = their damaged devices (고장 난 장치들)"], "q": "that they are too difficult to repair의 they는 무엇인가?", "a": "고장 난 장치들(their damaged devices)", "p": "they"}, {"t": "require that + 주어 + (should) 동사원형 : ~할 것을 요구하다", "c": "k", "x": "may require that it be brought에서 require는 ‘요구하다’라는 뜻이라서 that절의 동사가 should가 생략된 동사원형이 된다. 그래서 it is brought가 아니라 it be brought이다. 또 it은 앞의 a device를 가리키며, 장치가 ‘가져와지는’ 쪽이라서 be brought(수동태)를 쓴다.", "n": ["요구·주장·명령·제안 동사 + that + 주어 + (should) 동사원형", "require that it be brought = 그것이 가져와질 것을 요구하다"], "q": "require that it be brought에서 is가 아니라 be인 이유는?", "a": "require는 요구의 동사라서 that절에 should가 생략된 동사원형을 쓴다.", "p": "require that it be brought"}, {"t": "what is more : 게다가, 더욱이", "c": "g", "x": "What is more는 앞의 내용에 더해 다른 내용을 덧붙일 때 쓰는 연결 표현이다. 여기서는 앞 문장들의 이유에 더해 ‘제품이 일부러 수리하기 어렵게 만들어진다’는 이유를 덧붙인다.", "n": ["what is more = 게다가, 더욱이"], "q": "What is more의 뜻은?", "a": "게다가, 더욱이", "p": "What is more"}, {"t": "allow + 목적어 + to부정사 : ~가 …하는 것을 허락하다", "c": "k", "x": "do not allow their customers to take ...는 allow + 목적어 + to부정사 구조이다. 목적어는 their customers이고 to take가 목적격보어이다. ‘고객들이 가지고 가는 것을 허용하지 않는다’는 뜻이다.", "n": ["allow + O + to부정사 = O가 ~하는 것을 허락하다"], "q": "allow 뒤에는 어떤 모양이 이어지는가?", "a": "목적어 + to부정사", "p": "allow their customers to take"}, {"t": "be designed to + 동사원형 : ~하도록 만들어지다 (수동태 + to부정사)", "c": "b", "x": "are intentionally designed to be difficult to repair에서 are designed는 be동사 + p.p.의 수동태이다. be designed to ~ 전체를 ‘~하도록 만들어지다’로 묶어 익힌다. 제품이 ‘수리하기 어렵게 만들어진다’는 뜻이다.", "n": ["be + p.p. = ~되다 (수동태)", "be designed to ~ = ~하도록 만들어지다"], "q": "are designed에서 designed는 어떤 형태인가?", "a": "design(~을 만들다, 설계하다)의 과거분사 — be + p.p.의 수동태", "p": "designed to be difficult to repair"}, {"t": "It is common for A to ~ : 가주어-진주어 + 의미상 주어", "c": "k", "x": "It is common for consumers to be unable to ...에서 It은 가주어이고 진짜 주어는 to be unable to ... 이하이다. for consumers는 to부정사의 의미상 주어이다. ‘소비자들이 ~하지 못하는 것은 흔하다’로 해석한다. be unable to는 ‘~할 수 없다’라는 뜻이다.", "n": ["It is + 형용사 + for A + to부정사 = A가 ~하는 것은 …하다", "be unable to ~ = ~할 수 없다"], "q": "for consumers는 문장에서 어떤 역할인가?", "a": "to부정사의 의미상 주어", "p": "It is common for consumers to be unable to"}, {"t": "acquire : ~을 얻다, 획득하다", "c": "g", "x": "acquire는 ‘~을 획득하다, 습득하다’라는 뜻이다. 여기서는 설명서(the instructions)나 부품(the parts)을 ‘얻다’라는 뜻이다. 비슷한 말로 get, obtain이 있다.", "n": ["acquire = ~을 얻다, 획득하다 (= get, obtain)"], "q": "acquire the instructions는 무슨 뜻인가?", "a": "설명서를 얻다", "p": "acquire"}, {"t": "명사 + 과거분사구 : ~된 …", "c": "b", "x": "the parts needed to complete repairs에서 needed to complete repairs는 앞의 the parts를 뒤에서 꾸미는 과거분사구이다. ‘수리를 완료하기 위해 필요한 부품들’이라는 뜻이다. 부품은 ‘필요로 되는’ 쪽이라서 현재분사 needing이 아니라 과거분사 needed를 쓴다.", "n": ["명사 + p.p. + 수식어구 = ~된 …", "needed = need(~을 필요로 하다)의 과거분사"], "q": "needed to complete repairs는 어느 말을 꾸미는가?", "a": "the parts (부품들)", "p": "needed to complete repairs"}, {"t": "주격 관계대명사 that + 수일치 : legislation that states", "c": "k", "x": "legislation that states ...에서 that은 주격 관계대명사로 앞의 legislation을 설명한다. that 뒤에 바로 동사 states가 이어지기 때문에 that이 주어 역할을 한다. states는 동사 state(~을 명시하다)의 3인칭 단수형이고, legislation은 ‘법률 제정’이라는 뜻이다. 선행사 legislation이 단수라서 동사에 -s가 붙어 states이다.", "n": ["선행사 + that + 동사 = 주격 관계대명사 (that이 주어 역할)", "동사는 선행사(legislation)의 수에 일치 → states"], "q": "states의 -s가 붙은 이유는?", "a": "선행사 legislation이 단수이기 때문", "p": "legislation that states"}, {"t": "is trying to solve : 현재진행형 + try + to부정사", "c": "b", "x": "is trying은 be + -ing의 현재진행형으로 ‘지금 시도하고 있다’는 뜻이다. try to solve는 ‘~을 해결하려고 노력하다’라는 뜻이다. 반면 try -ing는 ‘시험 삼아 ~해 보다’라는 뜻이라서 구별해야 한다.", "n": ["be + -ing = ~하고 있다 (현재진행형)", "try + to부정사 = ~하려고 노력하다"], "q": "try to solve와 try solving의 차이는?", "a": "try to solve는 해결하려고 노력하다, try solving은 시험 삼아 해 보다", "p": "is trying to solve"}, {"t": "of one's choice : ~가 직접 선택한", "c": "g", "x": "a technician of your choice는 ‘당신이 선택한 기술자’라는 뜻이다. of one's choice가 앞의 명사를 뒤에서 꾸미며, one's 자리에는 문맥에 맞는 소유격이 들어간다. 여기서는 your이다.", "n": ["명사 + of one's choice = ~가 직접 선택한 …"], "q": "a technician of your choice의 뜻은?", "a": "당신이 선택한 기술자", "p": "of your choice"}]}, {"no": 4, "id": "z4", "sents": [{"n": 24, "mk": "First, companies must [1|make] information about [2|their] products [1|available] to everyone.", "en": "First, companies must make information about their products available to everyone.", "ko": "첫 번째로, 회사들은 그들의 제품에 대한 정보를 모두가 이용할 수 있게 해야 한다."}, {"n": 25, "mk": "Second, third parties, including individuals, should be able to obtain the [3|parts and tools required to make repairs].", "en": "Second, third parties, including individuals, should be able to obtain the parts and tools required to make repairs.", "ko": "두 번째로, 개인을 포함한 제삼자가 수리를 하기 위해 필요한 부품들과 도구들을 구할 수 있어야 한다."}, {"n": 26, "mk": "Third, [4|the practice of preventing consumers from installing] custom software on their own devices [5|should be prohibited by law].", "en": "Third, the practice of preventing consumers from installing custom software on their own devices should be prohibited by law.", "ko": "세 번째로, 소비자들이 맞춤형 소프트웨어를 자신의 장치에 설치하지 못하게 하는 행위는 법으로 금지되어야 한다."}, {"n": 27, "mk": "Finally, it [6|demands that manufacturers design] devices in [7|a way that] [1|makes repairs] [8|as easy as possible].", "en": "Finally, it demands that manufacturers design devices in a way that makes repairs as easy as possible.", "ko": "마지막으로, 그것은 제조사들에게 수리를 최대한 쉽게 만드는 방식으로 장치를 설계할 것을 요구한다."}, {"n": 28, "mk": "[14|Advocates] of the movement say that [9|if all these goals are accomplished], far less e-waste will be generated.", "en": "Advocates of the movement say that if all these goals are accomplished, far less e-waste will be generated.", "ko": "이 운동의 지지자들은 만약 이 모든 목표가 이루어진다면, 훨씬 적은 전자 쓰레기가 발생할 것이라고 말한다."}, {"n": 29, "mk": "[13|Thanks to] [11|their] efforts, more than 40 states in the U.S. [10|have begun] [13|working on] right-to-repair legislation.", "en": "Thanks to their efforts, more than 40 states in the U.S. have begun working on right-to-repair legislation.", "ko": "그들의 노력 덕분에 미국 40개 이상의 주에서 수리할 권리 법률 제정을 위해 노력하기 시작했다."}, {"n": 30, "mk": "This movement is gaining a growing influence in Europe as well, [12|with more and more countries joining] the [14|cause].", "en": "This movement is gaining a growing influence in Europe as well, with more and more countries joining the cause.", "ko": "이 운동은 점점 더 많은 국가들이 그 대의에 동참하면서 유럽에서도 영향력이 커지고 있다."}], "items": [{"t": "make + 목적어 + 형용사 : ~가 …하게 만들다", "c": "k", "x": "5형식 동사 make는 ‘목적어를 ~한 상태로 만든다’는 뜻이다. must make information ... available은 ‘정보를 이용 가능하게 만든다’는 뜻이고 available이 목적격보어이다. makes repairs as easy as possible에서도 easy가 목적격보어라서 ‘수리를 쉽게 만든다’가 된다. 목적격보어 자리에는 부사가 아니라 형용사를 쓴다.", "n": ["make + 목적어 + 형용사 = 목적어를 ~하게 만들다", "목적격보어 자리 = 형용사 (부사 X)"], "q": "make information about their products available에서 목적어와 목적격보어는 각각 무엇인가?", "a": "목적어 = information about their products, 목적격보어 = available", "p": "make information about their products available"}, {"t": "their = companies (회사들)", "c": "o", "x": "their products의 their는 문장 맨 앞의 주어 companies(회사들)를 가리킨다. 즉 ‘회사들의 제품’이라는 뜻이다. 뒤에 나오는 everyone(모두)을 가리키는 말이 아니다.", "n": ["their = companies", "대명사 → 앞의 주어에서 찾기"], "q": "their products의 their는 누구를 가리키는가?", "a": "회사들 (companies)", "p": "their"}, {"t": "the parts and tools required to make repairs : 과거분사구의 후치수식", "c": "b", "x": "required to make repairs는 앞의 명사 the parts and tools를 뒤에서 꾸미는 과거분사구이다. 부품과 도구는 ‘필요로 되는’ 대상이라서 수동의 뜻인 과거분사(required)를 쓴다. 해석은 ‘수리를 하기 위해 필요한 부품들과 도구들’이다. 여기서 to make repairs는 ‘수리를 하기 위해’라는 목적의 부사적 용법의 to부정사이다.", "n": ["명사 + p.p. + 수식어구 = ~되는[~된] 명사", "to make repairs = 수리를 하기 위해 (목적)"], "q": "the parts and tools required to make repairs에서 required는 무엇을 꾸미는가?", "a": "the parts and tools (과거분사구가 명사를 뒤에서 수식)", "p": "parts and tools required to make repairs"}, {"t": "prevent A from + -ing : A가 ~하지 못하게 막다", "c": "k", "x": "the practice of preventing consumers from installing custom software는 ‘소비자들이 맞춤형 소프트웨어를 설치하지 못하게 하는 행위’이다. prevent(~을 막다) + 목적어(consumers) + from + -ing 모양이고 from 뒤에는 동명사(installing)가 온다. the practice of ...의 of는 ‘행위’의 내용을 설명해 주는 동격의 전치사이다. keep, stop, ban 등도 같은 모양으로 쓴다.", "n": ["prevent[keep, stop] + A + from + -ing = A가 ~하지 못하게 막다", "from 뒤 = 동명사 (to부정사 X)"], "q": "‘소비자들이 설치하지 못하게 막다’를 prevent로 쓰면 consumers 뒤에 어떤 모양이 오는가?", "a": "from + installing (from + 동명사)", "p": "the practice of preventing consumers from installing"}, {"t": "should be prohibited by law : 조동사 + 수동태 · prohibit : ~을 금지하다", "c": "b", "x": "주어 the practice ...는 ‘금지되는’ 쪽이라서 should be prohibited처럼 조동사 + be + 과거분사의 수동태를 쓴다. prohibit(~을 금지하다)은 ban, forbid와 비슷한 뜻이고 ‘법으로 금지되어야 한다’가 된다. 행위를 하는 사람이 아니라 행위 자체가 금지되는 대상이다.", "n": ["조동사 + be + p.p. = ~되어야 한다 (조동사의 수동태)", "prohibit = ~을 금지하다 (유의어: ban, forbid)"], "q": "should be prohibited by law를 해석하고, 수동태 모양을 말해 보시오.", "a": "법으로 금지되어야 한다 / should + be + 과거분사(prohibited)", "p": "should be prohibited by law"}, {"t": "demand that + 주어 + 동사원형 : ~할 것을 요구하다", "c": "k", "x": "it demands that manufacturers design devices에서 demand(요구하다) 뒤의 that절 동사는 designs가 아니라 design이다. 요구·주장·제안의 동사 뒤 that절에서는 should가 생략되어 동사원형만 남기 때문이다. 그래서 주어가 단수(예: every manufacturer)여도 동사원형을 쓴다는 점이 시험 포인트이다.", "n": ["demand that + 주어 + (should) + 동사원형 = ~할 것을 요구하다", "should가 생략되어 동사원형만 남는다"], "q": "demand that every manufacturer ___ devices에서 design / designs / designed 중 맞는 것은?", "a": "design — that절에 should가 생략되어 주어가 단수여도 동사원형을 쓴다.", "p": "demands that manufacturers design"}, {"t": "a way that makes ... : 주격 관계대명사 that + 동사의 수일치", "c": "b", "x": "in a way that makes repairs as easy as possible에서 that은 a way를 꾸미는 주격 관계대명사이다. that 바로 뒤에 동사 makes가 바로 이어지는 점이 주격이라는 증거이다. 선행사 a way가 단수라서 관계대명사절의 동사도 단수인 makes이다. 해석은 ‘수리를 최대한 쉽게 만드는 방식으로’이다.", "n": ["선행사 + that + 동사 = 주격 관계대명사", "관계사절 동사의 수 = 선행사의 수에 일치 (a way → makes)"], "q": "a way that makes에서 동사가 make가 아니라 makes인 이유는?", "a": "선행사 a way가 단수라서 관계대명사절의 동사도 단수이다.", "p": "a way that makes repairs"}, {"t": "as + 형용사 + as possible : 가능한 한 ~한", "c": "b", "x": "as easy as possible는 ‘가능한 한 쉽게, 최대한 쉽게’라는 뜻이다. as와 as 사이에는 원래 형용사나 부사의 원급(easy)을 쓴다. as ... as possible는 as ... as one can과 같은 뜻으로 쓸 수 있다. 여기서는 repairs가 ‘최대한 쉬운’ 상태가 되게 만든다는 의미이다.", "n": ["as + 원급 + as possible = 가능한 한 ~한[하게]", "= as + 원급 + as + 주어 + can"], "q": "as easy as possible를 해석하시오. as와 as 사이에는 어떤 형태를 쓰는가?", "a": "가능한 한 쉽게 / 형용사·부사의 원급", "p": "as easy as possible"}, {"t": "if + 현재시제 ~, 주절에는 will : 조건절은 미래 대신 현재", "c": "b", "x": "if all these goals are accomplished는 ‘만약 이 모든 목표가 이루어진다면’이라는 조건절이다. 조건을 나타내는 if절에서는 미래의 일이라도 will을 쓰지 않고 현재시제(are accomplished)로 쓴다. 뒤의 주절은 far less e-waste will be generated처럼 미래를 나타내는 will을 쓴다. 두 절 모두 목표와 쓰레기가 ‘이루어지고 생성되는’ 대상이라서 수동태이다.", "n": ["if절(조건) = 현재시제로 미래를 나타냄", "주절 = will + 동사원형"], "q": "if all these goals ___ accomplished에서 will be / are 중 맞는 것은?", "a": "are — 조건 if절은 현재시제로 미래를 나타낸다.", "p": "if all these goals are accomplished"}, {"t": "have begun working on : 현재완료 + begin + 동명사", "c": "b", "x": "more than 40 states ... have begun에서 주어 states가 복수라서 have를 쓰고, 현재완료(have + p.p.)로 ‘시작해서 지금까지 이어지는’ 상황을 나타낸다. begin은 동명사와 to부정사를 모두 목적어로 취할 수 있어서 begun working on은 begun to work on과 뜻이 같다. begin의 과거분사는 begun이다(began은 과거형이다).", "n": ["have + p.p. = 현재완료 (주어가 복수 → have)", "begin + 동명사 = begin + to부정사 = ~하기 시작하다"], "q": "have begun working on과 같은 뜻으로 쓸 수 있는 형태는?", "a": "have begun to work on", "p": "have begun working on"}, {"t": "their = advocates (운동의 지지자들)", "c": "o", "x": "Thanks to their efforts의 their는 앞 문장의 주어 Advocates of the movement(이 운동의 지지자들)를 가리킨다. 그래서 ‘지지자들의 노력 덕분에’라는 뜻이 된다. 40개 이상의 주(states)를 가리키는 것이 아니다.", "n": ["their = advocates of the movement", "대명사 → 앞 문장의 주어에서 찾기"], "q": "Thanks to their efforts의 their는 누구를 가리키는가?", "a": "운동의 지지자들 (Advocates of the movement)", "p": "their efforts"}, {"t": "with + 목적어 + 현재분사 : ~가 …하면서", "c": "k", "x": "with more and more countries joining the cause는 with + 목적어(countries) + 현재분사(joining) 모양으로 ‘점점 더 많은 국가들이 동참하면서’라는 뜻이다. 목적어인 countries가 대의에 ‘동참하는’ 주체라서 수동이 아니라 능동의 현재분사를 쓴다. with 구문은 주절과 동시에 일어나는 상황을 덧붙여 준다.", "n": ["with + 목적어 + 현재분사(-ing) = ~가 …하면서 (능동)", "with + 목적어 + 과거분사(p.p.) = ~가 …된 채로 (수동)"], "q": "with more and more countries joining에서 joining 대신 joined를 쓰지 않는 이유는?", "a": "countries가 직접 동참하는 능동 관계라서 현재분사를 쓴다.", "p": "with more and more countries joining the cause"}, {"t": "thanks to ~ · work on ~ : ~ 덕분에 · ~에 애쓰다", "c": "g", "x": "Thanks to their efforts의 thanks to는 ‘~ 덕분에’라는 뜻의 하나의 전치사처럼 쓰는 표현이라서 뒤에 명사(efforts)가 온다. working on right-to-repair legislation의 work on은 ‘~에 애쓰다, 공들이다’라는 뜻이다. 여기서 working은 work의 -ing형이라서 ‘수리할 권리 법률 제정에 애쓰는 것’을 시작했다는 뜻이다.", "n": ["thanks to ~ = ~ 덕분에", "work on ~ = ~에 애쓰다, 공들이다"], "q": "thanks to와 work on은 각각 무슨 뜻인가?", "a": "thanks to = ~ 덕분에 / work on = ~에 애쓰다", "p": "Thanks to … working on"}, {"t": "advocate · cause : 지지자 · 대의", "c": "g", "x": "Advocates는 명사 advocate(옹호자, 지지자)의 복수형이고, 여기서는 수리할 권리 운동을 지지하는 사람들을 말한다. the cause는 cause(1. 원인 2. 대의명분)의 두 번째 뜻으로 ‘대의’이며, 운동이 내세우는 목표를 말한다. 원인으로 해석하면 문맥이 어색해진다.", "n": ["advocate n. = 옹호자, 지지자 (v. 옹호하다)", "cause n. = 1. 원인 2. 대의명분"], "q": "본문 the cause의 cause는 ‘원인’과 ‘대의’ 중 어떤 뜻인가?", "a": "대의 (명분) — 운동이 내세우는 목표", "p": "Advocates … the cause"}]}, {"no": 5, "id": "z5", "sents": [{"n": 31, "mk": "In January 2021, the French government passed a bill [1|that requires] [2|that every manufacturer include] a “repairability index” on five categories of electronic devices and electrical appliances: smartphones, laptops, washing machines, televisions, and lawn mowers.", "en": "In January 2021, the French government passed a bill that requires that every manufacturer include a “repairability index” on five categories of electronic devices and electrical appliances: smartphones, laptops, washing machines, televisions, and lawn mowers.", "ko": "2021년 1월, 프랑스 정부는 모든 제조사가 스마트폰, 노트북, 세탁기, 텔레비전, 그리고 잔디 깎는 기계라는 다섯 가지 종류의 전자 장치와 전기 기기에 ‘수리 가능성 지수’를 포함시킬 것을 요구하는 법안을 통과시켰다."}, {"n": 32, "mk": "[3|Using a score ranging from 0 to 10, as well as a color-coded system], the index [4|lets consumers see how easily the product can be repaired] before they purchase it.", "en": "Using a score ranging from 0 to 10, as well as a color-coded system, the index lets consumers see how easily the product can be repaired before they purchase it.", "ko": "그 지수는 색상으로 표시되는 시스템뿐만 아니라 0에서 10 사이의 점수도 사용하여 소비자들이 제품을 구입하기 전에 그것이 얼마나 쉽게 수리될 수 있는지 알 수 있게 해 준다."}, {"n": 33, "mk": "The index [5|takes into account] several elements, including the availability of repair information, the ease of disassembly, and the price of spare parts.", "en": "The index takes into account several elements, including the availability of repair information, the ease of disassembly, and the price of spare parts.", "ko": "그 지수는 수리 정보의 이용 가능성, 분해의 용이성, 그리고 여분 부품의 가격을 포함하여 몇 가지 요소를 고려한다."}, {"n": 34, "mk": "A low number on a bright red label means that [6|repairing the product] will be difficult, [6|whereas] a high number on a green label indicates that the product is easy to repair.", "en": "A low number on a bright red label means that repairing the product will be difficult, whereas a high number on a green label indicates that the product is easy to repair.", "ko": "초록색 라벨의 높은 숫자는 그 제품이 수리하기 쉽다는 것을 나타내는 데에 반하여, 밝은 빨간색 라벨의 낮은 숫자는 그 제품을 수리하는 것이 어려울 것이라는 것을 의미한다."}, {"n": 35, "mk": "The index [7|was designed to have] two positive effects.", "en": "The index was designed to have two positive effects.", "ko": "그 지수는 두 가지의 긍정적인 효과를 가지도록 만들어졌다."}, {"n": 36, "mk": "Firstly, it [8|allows consumers to make] informed decisions when purchasing new devices and appliances.", "en": "Firstly, it allows consumers to make informed decisions when purchasing new devices and appliances.", "ko": "첫 번째로, 그것은 소비자들이 새로운 장치와 기기를 구입할 때 정보에 근거한 결정을 내릴 수 있도록 한다."}, {"n": 37, "mk": "Secondly, it [8|encourages manufacturers to] [9|make their products easier to repair].", "en": "Secondly, it encourages manufacturers to make their products easier to repair.", "ko": "두 번째로, 그것은 제조사들이 자신의 제품을 수리하기 더 쉽게 만들도록 장려한다."}, {"n": 38, "mk": "As a result, [10|with fewer electronic and electrical items ending up in] [11|its] [10|landfills], France [12|can expect to make a transition to] a more sustainable society in the near future.", "en": "As a result, with fewer electronic and electrical items ending up in its landfills, France can expect to make a transition to a more sustainable society in the near future.", "ko": "결과적으로, 더 적은 전자 및 전기 제품들이 쓰레기 매립지에 이르게 되면서, 프랑스는 가까운 미래에 더 지속 가능한 사회로 변화할 것을 기대할 수 있다."}, {"n": 39, "mk": "The impact of the index, however, [13|is likely to spread] far beyond France.", "en": "The impact of the index, however, is likely to spread far beyond France.", "ko": "하지만 그 지수의 영향은 프랑스를 넘어 더 멀리 퍼질 가능성이 있다."}, {"n": 40, "mk": "We live in a global economy, and any company that wants to sell its appliances on the French market will need to label its products according to the repairability index.", "en": "We live in a global economy, and any company that wants to sell its appliances on the French market will need to label its products according to the repairability index.", "ko": "우리는 세계 경제 속에 살고 있으며, 프랑스 시장에서 기기를 판매하고 싶은 모든 회사는 그들의 제품에 수리 가능성 지수에 따라 라벨을 붙여야 할 것이다."}, {"n": 41, "mk": "[14|If the index is successful], we can [14|anticipate seeing more countries around the world following France’s innovative lead].", "en": "If the index is successful, we can anticipate seeing more countries around the world following France’s innovative lead.", "ko": "만약 이 지수가 성공적이라면, 우리는 전 세계의 더 많은 나라들이 프랑스의 혁신적인 선례를 따르는 것을 보길 기대할 수 있다."}], "items": [{"t": "관계대명사 that + 단수동사 : a bill that requires", "c": "b", "x": "a bill that requires ...에서 that은 주격 관계대명사로, 앞의 a bill(법안)을 꾸미는 절을 이끈다. 선행사 a bill이 단수라서 관계절의 동사도 requires처럼 단수형이다. ‘~을 요구하는 법안’처럼 뒤에서 앞으로 해석한다. passed a bill은 ‘법안을 통과시켰다’라는 뜻이다. pass는 ‘지나가다’ 외에 ‘~을 통과시키다’라는 뜻이 있고, bill은 ‘청구서’ 외에 ‘법안’이라는 뜻이 있다.", "n": ["a bill that + 단수동사 = ~하는 법안 (주격 관계대명사)", "pass a bill = 법안을 통과시키다"], "q": "a bill that requires에서 requires가 단수형인 이유는?", "a": "선행사 a bill이 단수이기 때문 (that은 주격 관계대명사)", "p": "a bill that requires"}, {"t": "요구 동사 + that + 주어 + 동사원형 : (should 생략)", "c": "k", "x": "requires that every manufacturer include에서 that은 ‘~라는 것’을 뜻하는 접속사이다. 요구를 나타내는 동사 requires 뒤의 that절은 동사가 should + 동사원형이고, 이때 should가 생략되어 include만 남는다. 그래서 every manufacturer가 단수 주어인데도 includes가 아니라 include이다. ‘모든 제조사가 포함시킬 것을 요구하는’으로 해석한다.", "n": ["require that + 주어 + (should) 동사원형 = ~할 것을 요구하다", "주어가 단수여도 동사는 원형 (should 생략)"], "q": "that every manufacturer include에서 includes가 아니라 include를 쓴 이유는?", "a": "요구 동사 뒤 that절은 should + 동사원형이고 should가 생략되었기 때문", "p": "that every manufacturer include"}, {"t": "분사구문 Using ~ : ~을 사용하여", "c": "k", "x": "Using a score ..., the index lets ...는 ‘점수를 사용하여, 그 지수는 ... 알 수 있게 해 준다’라는 뜻이다. 접속사와 주어를 생략하고 동사에 -ing를 붙인 분사구문이다. 의미상 주어가 주절의 주어 the index와 같아서 생략된다. ranging from 0 to 10은 앞의 a score를 꾸미는 현재분사구로 ‘0에서 10까지의 범위에 이르는 점수’라는 뜻이다. A as well as B는 ‘B뿐만 아니라 A도’라는 뜻이다. 여기서는 a score가 A, a color-coded system이 B라서 ‘시스템뿐 아니라 점수도’로 해석한다. color-coded는 ‘색상으로 표시된’이라는 뜻이다.", "n": ["Using ~, 주어 + 동사 = ~을 사용하여, …한다", "range from A to B = A에서 B까지의 범위에 이르다", "A as well as B = B뿐만 아니라 A도"], "q": "Using a score ...의 의미상 주어는 누구인가?", "a": "the index (주절의 주어와 같아서 생략)", "p": "Using a score ranging from 0 to 10"}, {"t": "let + 목적어 + 동사원형 · 간접의문문 : ~가 …하게 해 주다", "c": "b", "x": "lets consumers see는 ‘소비자들이 알 수 있게 해 준다’라는 뜻이다. let(~하게 하다)은 목적어 뒤에 동사원형 see가 온다. see의 목적어는 how easily the product can be repaired로, 의문사 how가 이끄는 간접의문문이라서 how easily + 주어 + 동사 순서이다. can be repaired는 ‘수리될 수 있다’라는 뜻의 수동태이다. before they purchase it에서 before는 ‘~하기 전에’를 뜻하는 접속사이다.", "n": ["let + O + 동사원형 = O가 ~하게 해 주다", "간접의문문 : 의문사 + 주어 + 동사 (how easily the product can be repaired)"], "q": "how easily the product can be repaired는 어떤 구문이고 무슨 뜻인가?", "a": "see의 목적어인 간접의문문 — 제품이 얼마나 쉽게 수리될 수 있는지", "p": "lets consumers see how easily the product can be repaired"}, {"t": "take ~ into account : ~을 고려하다", "c": "g", "x": "본문의 takes는 동사 take의 3인칭 단수형이다(주어 The index가 단수). The index takes into account several elements는 ‘그 지수는 몇 가지 요소를 고려한다’라는 뜻이다. take ~ into account는 ‘~을 고려하다’라는 뜻이고, 목적어 several elements가 길어서 into account 뒤에 왔다. element는 ‘요소, 요인’이라는 뜻이다. including ~ 뒤에는 availability, ease, price 세 가지가 나란히 이어진다(병렬).", "n": ["take ~ into account = ~을 고려하다", "element = 요소, 요인"], "q": "takes into account several elements는 무슨 뜻인가?", "a": "몇 가지 요소를 고려한다", "p": "takes into account"}, {"t": "접속사 whereas · 동명사구 주어 : ~인 반면에 · ~하는 것은", "c": "b", "x": "whereas는 ‘~인 반면에’라는 뜻의 접속사로, 앞뒤의 반대되는 내용을 이어 준다. 여기서는 ‘낮은 숫자는 어렵다’와 ‘높은 숫자는 쉽다’를 대비한다. repairing the product는 동명사구이고, that절 안에서 ‘그 제품을 수리하는 것은’이라는 주어 역할을 한다. 뒤의 will be difficult는 ‘어려울 것이다’라는 뜻이다. indicates that ...은 ‘~라는 것을 나타낸다’라는 뜻이다.", "n": ["whereas = ~인 반면에", "동명사구 주어 : repairing the product = 그 제품을 수리하는 것"], "q": "repairing the product will be difficult에서 repairing the product의 역할은?", "a": "동명사구 주어 (그 제품을 수리하는 것은)", "p": "whereas"}, {"t": "be designed to V : ~하도록 만들어지다", "c": "b", "x": "The index was designed to have two positive effects는 ‘그 지수는 두 가지 긍정적인 효과를 가지도록 만들어졌다’라는 뜻이다. was designed는 be + p.p.의 수동태이다. 뒤의 to have는 ‘~하도록’을 뜻하는 to부정사이다. positive는 ‘긍정적인’이라는 뜻이고, 반의어는 negative(부정적인)이다.", "n": ["be designed to V = ~하도록 만들어지다 (수동태 + to부정사)", "positive ↔ negative"], "q": "was designed to have two positive effects는 어떻게 해석하는가?", "a": "두 가지 긍정적인 효과를 가지도록 만들어졌다", "p": "was designed to have"}, {"t": "allow · encourage + 목적어 + to부정사 : ~가 …하도록 허용하다 · 장려하다", "c": "k", "x": "allows consumers to make는 ‘소비자들이 (정보에 근거한 결정을) 내릴 수 있게 해 준다’라는 뜻이다. encourages manufacturers to make는 ‘제조사들이 (제품을) 만들도록 장려한다’라는 뜻이다. allow와 encourage는 목적어 뒤에 to부정사가 오는 5형식 동사이다. 이때 to부정사 앞의 목적어(consumers, manufacturers)가 to부정사 행동의 주체가 된다.", "n": ["allow + O + to V = O가 ~하도록 허용하다", "encourage + O + to V = O가 ~하도록 장려하다"], "q": "encourages manufacturers to make에서 make하는 주체는 누구인가?", "a": "manufacturers (제조사들)", "p": "allows consumers to make"}, {"t": "make + 목적어 + 형용사 : ~를 …하게 만들다", "c": "b", "x": "make their products easier to repair는 ‘자신의 제품을 수리하기 더 쉽게 만들다’라는 뜻이다. make + 목적어(their products) + 형용사 보어(easier)의 5형식 구조이다. easier는 easy의 비교급이고, to repair는 형용사 easier를 꾸며서 ‘수리하기에’라는 뜻을 더하는 부사적 용법의 to부정사이다.", "n": ["make + O + 형용사 = O를 ~하게 만들다", "easy to V = ~하기에 쉬운"], "q": "make their products easier to repair에서 easier의 역할은?", "a": "목적어 their products의 상태를 설명하는 형용사 보어 (to repair는 ‘수리하기에’)", "p": "make their products easier to repair"}, {"t": "with + 명사 + 분사 : ~가 …하면서", "c": "k", "x": "with fewer electronic and electrical items ending up in its landfills는 ‘더 적은 전자 및 전기 제품들이 쓰레기 매립지에 이르게 되면서’라는 뜻이다. with + 명사 + 분사 형태로, 명사(items)가 스스로 ending up 하는 능동 관계라서 현재분사를 썼다. end up in ~은 ‘결국 ~에 있게 되다’라는 뜻이다. fewer는 few의 비교급으로, 셀 수 있는 복수명사 items 앞에 쓴다. landfill은 ‘쓰레기 매립지’라는 뜻이다.", "n": ["with + 명사 + 현재분사 = ~가 …하면서 (능동 관계)", "end up in ~ = 결국 ~에 있게 되다"], "q": "with fewer items ending up in landfills에서 ending이 현재분사인 이유는?", "a": "명사 items가 ‘이르게 되는’ 능동 관계이기 때문", "p": "with fewer electronic and electrical items ending up in its landfills"}, {"t": "its = France’s (프랑스의)", "c": "o", "x": "in its landfills의 its는 이 문장의 주어 France를 가리킨다. 그래서 its landfills는 ‘프랑스의 쓰레기 매립지’라는 뜻이다. 앞에 나온 index를 가리키는 것이 아니다.", "n": ["its = France’s", "소유격 대명사 → 가리키는 대상 찾기"], "q": "in its landfills의 its는 누구(무엇)를 가리키는가?", "a": "France (프랑스)", "p": "its"}, {"t": "expect to V · make a transition to ~ : ~할 것으로 예상하다 · ~로 변화하다", "c": "g", "x": "France can expect to make a transition to a more sustainable society는 ‘프랑스는 더 지속 가 부분의 손상을 직접 수리할 수 있다."}, {"n": 43, "mk": "That [3|is why Repair Cafés were started].", "en": "That is why Repair Cafés were started.", "ko": "그것이 수리 카페가 시작된 이유이다."}, {"n": 44, "mk": "[4|They] are free meeting places [5|where people can gather together and fix their broken devices].", "en": "They are free meeting places where people can gather together and fix their broken devices.", "ko": "그곳은 사람들이 함께 모여 자신들의 고장 난 장치들을 고칠 수 있는 자유로운 만남의 장소이다."}, {"n": 45, "mk": "The cafés [6|are staffed by] volunteer experts [7|who can give technical advice and teach people how to fix things].", "en": "The cafés are staffed by volunteer experts who can give technical advice and teach people how to fix things.", "ko": "그 카페들은 기술적인 조언을 줄 수 있고, 사람들에게 물건을 고치는 방법을 가르쳐 줄 수 있는 자원봉사자 전문가들을 직원으로 두고 있다."}, {"n": 46, "mk": "The first Repair Café was opened in the Netherlands in the city of Amsterdam in 2009.", "en": "The first Repair Café was opened in the Netherlands in the city of Amsterdam in 2009.", "ko": "가장 첫 번째 수리 카페는 네덜란드의 도시 암스테르담에서 2009년에 열렸다."}, {"n": 47, "mk": "[8|It] was [9|such a success that the idea soon spread to neighboring countries].", "en": "It was such a success that the idea soon spread to neighboring countries.", "ko": "그것은 너무 성공적이어서 그 아이디어가 곧 이웃 나라들로 확산되었다."}, {"n": 48, "mk": "[10|Before long], [11|there were Repair Cafés in over 30 countries] around the world.", "en": "Before long, there were Repair Cafés in over 30 countries around the world.", "ko": "얼마 후, 전 세계 30개국 이상에 수리 카페가 생겼다."}, {"n": 49, "mk": "[2|Along with] [12|preventing damaged items from becoming e-waste], these cafés also [13|encourage people to share] their invaluable skills and knowledge about the repair and maintenance of electronics.", "en": "Along with preventing damaged items from becoming e-waste, these cafés also encourage people to share their invaluable skills and knowledge about the repair and maintenance of electronics.", "ko": "고장 난 물건들이 전자 쓰레기가 되는 것을 막는 것과 더불어, 이 카페들은 또한 사람들이 전자 제품의 수리와 보수 관리에 대한 매우 유용한 기술들과 지식을 공유할 수 있도록 장려한다."}, {"n": 50, "mk": "They continue to grow in popularity, [14|with more and more people signing up to volunteer].", "en": "They continue to grow in popularity, with more and more people signing up to volunteer.", "ko": "점점 더 많은 사람들이 자원봉사를 하기 위해 신청하면서, 이 카페들은 계속해서 인기를 얻고 있다."}], "items": [{"t": "수동태 : are given the right tools", "c": "b", "x": "When consumers are given the right tools and materials는 ‘소비자들에게 알맞은 도구와 재료가 주어지면’이라는 뜻이다. consumers가 주어 자리에 오고, 동사는 be동사 + 과거분사(are given)의 수동태이다. 소비자는 도구를 ‘받는’ 쪽이라서 수동으로 쓴다. When은 ‘~할 때, ~하면’이라는 뜻의 접속사이다.", "n": ["be동사 + p.p. = ~되다, ~받다 (수동태)", "접속사 when + 주어 + 동사 = ~할 때, ~하면"], "q": "consumers are given the right tools는 어떻게 해석하는가?", "a": "소비자들에게 알맞은 도구가 주어진다 (수동태)", "p": "are given the right tools and materials"}, {"t": "along with ~ : ~에 덧붙여, ~와 함께", "c": "g", "x": "along with ~는 ‘~에 덧붙여, ~와 마찬가지로’라는 뜻이다. 두세 단어가 합쳐져 전치사 한 개처럼 쓰여서 뒤에 명사(구)나 동명사가 온다. along with some helpful advice는 ‘유용한 조언과 함께’이고, Along with preventing ...은 ‘~을 막는 것과 더불어’라는 뜻이다.", "n": ["along with + 명사(구)/-ing = ~에 덧붙여, ~와 더불어", "구전치사 : 여러 단어가 전치사 한 개 역할"], "q": "Along with preventing damaged items ...의 Along with는 무슨 뜻인가?", "a": "~에 덧붙여, ~와 더불어", "p": "along with"}, {"t": "명사절 관계부사 why : That is why ~ (그것이 ~한 이유이다)", "c": "k", "x": "That is why Repair Cafés were started는 ‘그것이 수리 카페가 시작된 이유이다’라는 뜻이다. why는 이유를 나타내는 관계부사로, 여기서는 is의 보어 자리에서 ‘~한 이유’라는 명사절을 이끈다. 앞 문장의 내용이 원인이고, why 뒤의 절이 그 결과이다. were started는 be동사 + 과거분사의 수동태이다.", "n": ["That is why + 주어 + 동사 = 그것이 ~한 이유이다 (앞 내용이 이유)", "why 뒤에는 완전한 절이 온다"], "q": "That is why Repair Cafés were started에서 ‘그것(That)’은 이유와 결과 중 무엇에 해당하는가?", "a": "이유 — 앞 문장의 내용이 수리 카페가 시작된 이유이다.", "p": "is why Repair Cafés were started"}, {"t": "They = Repair Cafés (수리 카페들)", "c": "o", "x": "They are free meeting places의 They는 바로 앞 문장에 나온 Repair Cafés(수리 카페들)를 가리킨다. 뒤의 their broken devices에서 their는 people(사람들)을 가리킨다.", "n": ["They = Repair Cafés", "their = people (사람들)"], "q": "They are free meeting places의 They는 누구(무엇)인가?", "a": "수리 카페들 (Repair Cafés)", "p": "They"}, {"t": "관계부사 where : ~하는 (장소)", "c": "b", "x": "meeting places where people can gather together and fix their broken devices는 ‘사람들이 함께 모여 고장 난 장치를 고칠 수 있는 만남의 장소’라는 뜻이다. where는 장소 meeting places를 꾸미는 관계부사이고, 뒤에 주어와 동사가 있는 완전한 절이 온다. gather together와 fix는 and로 이어진 병렬 구조이다. broken은 ‘고장 난’이라는 뜻의 형용사이다.", "n": ["장소 + where + 완전한 절 = ~하는 (장소)", "gather together and fix = 병렬 (can에 이어짐)"], "q": "where 뒤에는 어떤 절이 오는가?", "a": "주어와 동사가 모두 있는 완전한 절", "p": "where people can gather together and fix their broken devices"}, {"t": "be staffed by ~ : ~을 직원으로 두고 있다", "c": "g", "x": "staffed는 동사 staff(~에 직원을 두다)의 과거분사이다. be staffed by ~는 ‘(조직·부서가) ~을 직원으로 두고 있다’라는 뜻이다. The cafés are staffed by volunteer experts는 ‘그 카페들은 자원봉사자 전문가들을 직원으로 두고 있다’라는 뜻이다. 우리말로는 능동처럼 해석하지만 영어는 be동사 + 과거분사의 수동태이다. volunteer는 여기서 ‘자원봉사의’라는 뜻으로 experts를 꾸민다.", "n": ["be staffed by ~ = ~을 직원으로 두고 있다", "수동태 → ‘~을 직원으로 두고 있다’로 해석"], "q": "The cafés are staffed by volunteer experts는 어떻게 해석하는가?", "a": "그 카페들은 자원봉사자 전문가들을 직원으로 두고 있다.", "p": "are staffed by"}, {"t": "주격 관계대명사 who + teach + 간접목적어 + how to V", "c": "b", "x": "volunteer experts who can give technical advice and teach people ...에서 who는 volunteer experts를 설명하는 주격 관계대명사이고, who 뒤의 동사는 can give와 (can) teach이다. 두 동사는 and로 이어진 병렬 구조이다. teach people how to fix things는 ‘사람들에게 물건을 고치는 방법을 가르치다’라는 뜻이다. teach + 사람 + 가르치는 내용 순서이고, ‘의문사 + to부정사’(how to fix)가 가르치는 내용이다.", "n": ["선행사(사람) + who + 동사 = ~하는 (사람)", "teach + 사람 + how to V = ~에게 …하는 방법을 가르치다"], "q": "teach people how to fix things는 무슨 뜻인가?", "a": "사람들에게 물건을 고치는 방법을 가르치다", "p": "who can give technical advice and teach people how to fix things"}, {"t": "It = The first Repair Café (가장 첫 번째 수리 카페)", "c": "o", "x": "It was such a success의 It은 앞 문장의 The first Repair Café(가장 첫 번째 수리 카페)를 가리킨다. 첫 수리 카페가 너무 성공적이어서 그 아이디어가 이웃 나라들로 퍼졌다는 흐름이다.", "n": ["It = The first Repair Café"], "q": "It was such a success의 It은 무엇을 가리키는가?", "a": "가장 첫 번째 수리 카페 (The first Repair Café)", "p": "It"}, {"t": "such a(n) + 단수명사 + that ... : 너무 ~여서 …하다", "c": "k", "x": "such a success that the idea soon spread to neighboring countries는 ‘너무 성공적이어서 그 아이디어가 곧 이웃 나라들로 확산되었다’라는 뜻이다. such a(n) + 단수명사 뒤에 that절이 오면 ‘대단한 ~여서 …하다’라는 결과의 뜻이 된다. 여기서 a success는 ‘성공한 일’이라는 셀 수 있는 명사이다. spread는 ‘퍼지다’이며 과거형도 spread로 모양이 같다.", "n": ["such + a(n) + 단수명사 + (that +) 완전한 절 = 너무 ~여서 …하다", "spread - spread - spread (모양이 같음)"], "q": "such a success that ...는 어떻게 해석하는가?", "a": "너무 성공적이어서 ~했다 (결과)", "p": "such a success that the idea soon spread to neighboring countries"}, {"t": "before long : 곧, 머지않아", "c": "g", "x": "before long은 ‘곧, 머지않아’라는 뜻이다. Before long, there were Repair Cafés in over 30 countries는 ‘얼마 후 30개국 이상에 수리 카페가 생겼다’라는 뜻이다. 이 문장에서 쉼표 앞의 Before long은 시간을 나타내는 부사구이다.", "n": ["before long = 곧, 머지않아 (얼마 후)"], "q": "Before long, there were Repair Cafés ...에서 Before long은 무슨 뜻인가?", "a": "곧, 머지않아 (얼마 후)", "p": "Before long"}, {"t": "유도부사 there + be동사 + 주어 · over ~ : ~이 넘는", "c": "b", "x": "there were Repair Cafés in over 30 countries에서 there는 ‘거기’가 아니라 ‘~이 있다’라는 구문을 만드는 유도부사이다. 진짜 주어는 be동사 뒤의 Repair Cafés(복수)라서 동사는 were이다. 주어가 단수이면 there was를 쓴다. over 30 countries의 over는 ‘~이 넘는, ~보다 많은’이라는 뜻이다.", "n": ["There + be동사 + 주어 = ~이 있다 (be동사는 뒤의 주어에 일치)", "over + 숫자 = ~이 넘는"], "q": "there were Repair Cafés에서 동사가 were인 이유는?", "a": "진짜 주어 Repair Cafés가 복수이기 때문이다.", "p": "there were Repair Cafés in over 30 countries"}, {"t": "prevent A from -ing : A가 ~하지 못하게 막다", "c": "b", "x": "preventing damaged items from becoming e-waste는 ‘고장 난 물건들이 전자 쓰레기가 되는 것을 막는 것’이라는 뜻이다. prevent A from + -ing에서 A는 damaged items, from 뒤에는 becoming이 왔다. Along with 뒤라서 prevent가 동명사 preventing이 되었다. damaged는 ‘파손된’이라는 뜻의 분사형 형용사로 items를 꾸민다.", "n": ["prevent A from + -ing = A가 ~하지 못하게 막다", "from 뒤에는 동명사"], "q": "preventing damaged items from becoming e-waste는 무슨 뜻인가?", "a": "고장 난 물건들이 전자 쓰레기가 되는 것을 막는 것", "p": "preventing damaged items from becoming e-waste"}, {"t": "encourage + 목적어 + to부정사 : ~가 …하도록 장려하다", "c": "k", "x": "these cafés also encourage people to share their invaluable skills and knowledge는 ‘이 카페들은 사람들이 매우 유용한 기술들과 지식을 공유하도록 장려한다’라는 뜻이다. encourage + 목적어(people) + to share의 5형식 구조이다. 목적어 뒤에 to부정사가 오는 것이 핵심이다. invaluable은 in-이 붙었지만 ‘가치 없는’이 아니라 ‘값을 매길 수 없을 만큼 소중한’이라는 뜻이다.", "n": ["encourage + 목적어 + to V = 목적어가 …하도록 장려하다", "invaluable = 매우 소중한, 아주 유용한"], "q": "encourage people to share는 무슨 뜻인가?", "a": "사람들이 공유하도록 장려하다", "p": "encourage people to share"}, {"t": "with + 명사 + 분사 : ~가 …하면서", "c": "b", "x": "with more and more people signing up to volunteer는 ‘점점 더 많은 사람들이 자원봉사를 하려고 신청하면서’라는 뜻이다. with + 명사(people) + 분사(signing up)의 구조이다. people이 ‘신청하는’ 주체라서 능동의 -ing를 쓴다. sign up to V는 ‘~하겠다고 신청하다’이고, continue to grow는 ‘계속해서 커지다(늘다)’라는 뜻이다.", "n": ["with + 명사 + -ing = ~가 …하면서 (명사가 능동일 때)", "sign up + to부정사 = ~하겠다고 신청하다"], "q": "with more and more people signing up에서 signing이 -ing인 이유는?", "a": "people이 ‘신청하는’ 주체(능동)이기 때문이다.", "p": "with more and more people signing up to volunteer"}]}, {"no": 7, "id": "z7", "sents": [{"n": 51, "mk": "By providing spaces [1|where people can learn], Repair Cafés [2|enable individuals to maintain their devices and extend their life spans].", "en": "By providing spaces where people can learn, Repair Cafés enable individuals to maintain their devices and extend their life spans.", "ko": "사람들이 배울 수 있는 공간을 제공함으로써, 수리 카페들은 개인이 자신들의 장치를 유지하고 그것들의 수명을 연장할 수 있게 한다."}, {"n": 52, "mk": "Furthermore, [5|they] foster a sustainable perspective [3|that] can [4|have a huge positive impact on] our future.", "en": "Furthermore, they foster a sustainable perspective that can have a huge positive impact on our future.", "ko": "게다가 그것들은 우리의 미래에 막대한 긍정적인 영향을 미칠 수 있는 지속 가능한 관점을 조성한다."}, {"n": 53, "mk": "Do you remember [6|Liz, the girl who dropped her laptop]?", "en": "Do you remember Liz, the girl who dropped her laptop?", "ko": "노트북을 떨어뜨렸던 소녀 Liz를 기억하는가?"}, {"n": 54, "mk": "Imagine she lived in a world [1|where] [7|repairing damaged devices and appliances was] simply part of everyday life.", "en": "Imagine she lived in a world where repairing damaged devices and appliances was simply part of everyday life.", "ko": "그녀가 손상된 장치와 기기를 수리하는 것이 그저 일상의 한 부분인 세상에 살고 있었다고 상상해봐라."}, {"n": 55, "mk": "[8|If that were the case, her options wouldn’t be] [9|limited to paying for expensive repairs or] [10|throwing away] her laptop and buying a new one.", "en": "If that were the case, her options wouldn’t be limited to paying for expensive repairs or throwing away her laptop and buying a new one.", "ko": "만약 그랬다면, 그녀의 선택지는 비싼 수리를 위해 비용을 지불하거나 노트북을 버리고 새것을 사는 것으로 제한되지는 않았을 것이다."}, {"n": 56, "mk": "She [8|would be able to] order the necessary parts online and replace them herself.", "en": "She would be able to order the necessary parts online and replace them herself.", "ko": "그녀는 인터넷에서 필요한 부품들을 주문하고, 그것들을 직접 교체할 수 있었을 것이다."}, {"n": 57, "mk": "Alternatively, she [8|could bring] her damaged device to the nearest Repair Café to get advice on how to fix it.", "en": "Alternatively, she could bring her damaged device to the nearest Repair Café to get advice on how to fix it.", "ko": "그렇지 않으면, 그녀는 그것을 고치는 방법에 대한 조언을 얻기 위해 고장 난 장치를 가장 가까운 수리 카페에 가지고 갈 수도 있었을 것이다."}, {"n": 58, "mk": "[7|Repairing it] probably wouldn’t be very hard, and she likely [11|would have purchased] a laptop with a high repairability score.", "en": "Repairing it probably wouldn’t be very hard, and she likely would have purchased a laptop with a high repairability score.", "ko": "그녀는 높은 수리 가능성 점수를 가진 노트북을 구매했을 것이기 때문에, 그것을 수리하는 것은 아마 아주 어렵지는 않았을 것이다."}, {"n": 59, "mk": "In fact, this sustainable world is a future we can all enjoy if we [12|work toward] it together.", "en": "In fact, this sustainable world is a future we can all enjoy if we work toward it together.", "ko": "사실, 이 지속 가능한 세상은 우리가 그것을 향해 함께 노력한다면 우리 모두가 누릴 수 있는 미래이다."}, {"n": 60, "mk": "Even more importantly, it is a future [13|in which] people will generate far less e-waste, [14|making our planet a cleaner, healthier place for everyone].", "en": "Even more importantly, it is a future in which people will generate far less e-waste, making our planet a cleaner, healthier place for everyone.", "ko": "훨씬 더 중요한 것은 그것은 사람들이 훨씬 적은 전자 쓰레기를 발생시킬 미래이며, 이는 우리의 지구를 모두를 위한 더 깨끗하고 건강한 곳으로 만들 것이라는 것이다."}], "items": [{"t": "관계부사 where : ~하는 (장소·상황)", "c": "b", "x": "spaces where people can learn에서 where는 관계부사로, 앞의 spaces(공간)를 꾸민다. where 뒤에 people can learn처럼 빠진 것 없는 완전한 절이 온다. a world where repairing ... was simply part of everyday life의 where도 a world(세상)를 꾸며서 ‘~인 세상’으로 해석한다.", "n": ["관계부사 where = in which (장소·상황 선행사 뒤)", "where + 완전한 절"], "q": "spaces where people can learn에서 where는 무엇을 꾸미고, 뒤에는 어떤 절이 오는가?", "a": "앞의 spaces를 꾸민다. 빠진 것 없는 완전한 절이 온다.", "p": "spaces where people can learn"}, {"t": "enable + 목적어 + to부정사 : ~가 …할 수 있게 하다", "c": "k", "x": "enable individuals to maintain their devices and extend their life spans는 ‘개인이 자신들의 장치를 유지하고 수명을 연장할 수 있게 한다’라는 뜻이다. enable + O + to V의 5형식 구조이다. to maintain과 (to) extend가 and로 병렬 연결된다. maintain은 ‘유지 관리하다’, extend는 ‘연장하다’, life span은 ‘수명’이다.", "n": ["enable + O + to V = O가 …할 수 있게 하다", "to maintain and (to) extend : and로 병렬"], "q": "enable individuals to maintain ... and extend ...에서 maintain과 extend는 어떤 관계인가?", "a": "and로 병렬 연결되어 둘 다 enable의 목적격보어(to부정사)이다.", "p": "enable individuals to maintain their devices and extend their life spans"}, {"t": "주격 관계대명사 that : ~하는", "c": "b", "x": "a sustainable perspective that can have a huge positive impact에서 that 뒤에는 주어 없이 바로 동사 can have가 온다. 그래서 that은 주어 자리를 대신하는 주격 관계대명사이고, 선행사는 a sustainable perspective(지속 가능한 관점)이다. ‘막대한 긍정적인 영향을 미칠 수 있는 관점’처럼 뒤에서 앞으로 해석한다.", "n": ["주격 관계대명사 that + 동사 = 선행사를 꾸미는 절", "선행사 = a sustainable perspective"], "q": "a sustainable perspective that can have ...의 that은 무엇이고 선행사는 무엇인가?", "a": "주격 관계대명사이고, 선행사는 a sustainable perspective이다.", "p": "a sustainable perspective that can have a huge positive impact on our future"}, {"t": "have a(n) ~ impact on   return h}

  var top='<div class="top"><a href="../../index.html" id="bk">‹ 원문</a><h1>교과서 4과 문법 분석</h1></div>';
  document.getElementById('app').innerHTML=top+(S.drill?vDrill():vMain());
  window.scrollTo(0,0)}
function goTo(el){if(!el)return;el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}
var BK={n:null,i:null,sn:null};
document.addEventListener('click',function(e){
  var hk=e.target.closest('.hlk');if(hk){BK.n=S.sec;BK.sn=hk.dataset.sn;BK.i=hk.dataset.i;goTo(document.getElementById('it-'+hk.dataset.i));return}
  var bb=e.target.closest('.bkb');if(bb){var i=bb.dataset.back,s=sec(),tgt=(BK.i==i&&BK.n==s.no&&BK.sn)?BK.sn:firstSent(s,i).n;goTo(document.getElementById('ps-'+tgt));return}
  var rv=e.target.closest('.rv');if(rv){rv.classList.toggle('open');return}
  var bk=e.target.closest('#bk');if(bk){try{if(history.length>1&&document.referrer&&document.referrer.indexOf(location.host)>=0){e.preventDefault();history.back()}}catch(x){}return}
  var d=e.target.closest('[data-dr]');if(d){S.drill=d.dataset.dr||null;render();return}
  var p=e.target.closest('[data-s]');if(p){S.sec=+p.dataset.s;render();return}
});
render();
</script></body></html>
