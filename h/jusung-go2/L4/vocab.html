<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1d4ed8"><title>4과 어휘</title>
<link rel="icon" type="image/svg+xml" href="../icon.svg"><link rel="apple-touch-icon" href="../icon-180.png">
<link rel="stylesheet" href="../../common/sx.css?v=261019">
<style>
.acc{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden}
.acc>summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:800;font-size:16.5px;display:flex;justify-content:space-between}
.acc>summary::-webkit-details-marker{display:none}.acc>summary:after{content:"▸";color:var(--sub)}.acc[open]>summary:after{content:"▾";color:var(--pri)}
.acc .in{padding:0 12px 12px}
.w{display:flex;gap:10px;padding:8px 2px;border-top:1px solid var(--line);align-items:baseline}.w:first-child{border-top:0}
.w b{flex:0 0 42%;font-size:16.5px;color:var(--navy)}.w span{flex:1;font-size:15.5px;color:var(--ink)}
.hide .w span{filter:blur(6px);cursor:pointer;user-select:none}.hide .w span.show{filter:none}
.tg{display:inline-block;font-size:12px;font-weight:800;color:var(--pri);border:1px solid var(--pri);border-radius:999px;padding:0 9px}
.tbtn{display:block;width:100%;border:1.5px solid var(--pri);background:var(--card);color:var(--pri);font:800 15px/1 inherit;font-family:inherit;border-radius:12px;padding:12px;margin:10px 0;cursor:pointer}
.pw{padding:10px 2px;border-top:1px solid var(--line)}.pw:first-child{border-top:0}.pw h3{margin:0 0 4px;font-size:18px;color:var(--navy)}
.pi{margin:6px 0 8px}.pi .m{font-size:15.5px;font-weight:700}.pi .m i{font-style:normal;color:var(--pri);margin-right:4px}.pi .e{font-size:16px;margin-top:2px}.pi .k{font-size:14.5px;color:var(--sub)}
</style></head><body><div class="wrap"><div class="top"><a class="back" href="../index.html">← 목록</a></div>
<h1>4과 · 어휘</h1><p class="lede">교과서 4과 단어와 다의어예요. 단어 시험(WORD TEST)은 종이로 봐요.</p>
<button class="tbtn" id="hid" type="button">뜻 가리기</button>
<div id="stage"></div>
<div class="foot" style="text-align:center;color:var(--sub);font-size:13px;margin-top:26px">비타민 영어클리닉 · 주성고 영어II</div></div>
<a class="homefab" href="../index.html">⌂ 목록</a>
<script src="../../common/prog.js?v=261019"></script><script src="voc-data.js?v=261019"></script>
<script>
(function(){
var E=function(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var st=document.getElementById('stage'),h='';
[['본문','본문 단어',true],['대화문','대화문 단어',false]].forEach(function(g){
  var a=VOC.W[g[0]];h+='<details class="acc"'+(g[2]?' open':'')+'><summary><span>'+g[1]+' <span class="tg">'+a.length+'개</span></span></summary><div class="in wl">'+a.map(function(x){return'<div class="w"><b>'+E(x[0])+'</b><span>'+E(x[1])+'</span></div>'}).join('')+'</div></details>';
});
h+='<details class="acc"><summary><span>다의어 <span class="tg">'+VOC.POLY.length+'개</span></span></summary><div class="in">'+VOC.POLY.map(function(p){
  return'<div class="pw"><h3>'+E(p.w)+'</h3>'+p.items.map(function(it,i){return'<div class="pi"><div class="m"><i>'+(i+1)+'</i>'+E(it.m)+'</div><div class="e">'+E(it.e)+'</div><div class="k">'+E(it.k)+'</div></div>'}).join('')+'</div>'}).join('')+'</div></details>';
st.innerHTML=h;
var hid=false,btn=document.getElementById('hid');
btn.onclick=function(){hid=!hid;btn.textContent=hid?'뜻 보이기':'뜻 가리기';[].forEach.call(document.querySelectorAll('.wl'),function(x){x.classList.toggle('hide',hid)});[].forEach.call(document.querySelectorAll('.w span.show'),function(x){x.classList.remove('show')})};
st.addEventListener('click',function(e){var s=e.target.closest('.w span');if(s&&s.parentNode.parentNode.classList.contains('hide'))s.classList.toggle('show')});
PG.bar('L4:voc','어휘 공부했어요');
})();
</script></body></html>
