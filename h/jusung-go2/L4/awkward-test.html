 ~이지만) 켜지기는 한다'로 이어져 맞아요. serious (심각한)는 전자 쓰레기가 '심각한 문제'라는 마지막 문장이라 그대로 둬요.", "flow": "노트북을 떨어뜨린 Liz가 고칠지 새로 살지 고민하는 장면이에요. 'but(하지만)'과 'In reality, however(하지만 실제로는)'가 이야기의 방향을 바꿔 주니, 이 연결어가 어느 쪽 내용을 부르는지 보세요.", "ko": "스터디 그룹 모임에 가는 길에, Liz는 실수로 그녀의 노트북을 길에 떨어뜨려 그것을 심각하게 손상시켰다. 그것은 여전히 켜지기는 하지만, 화면은 금이 갔고, 몇몇 키들은 작동하지 않는다. 그녀는 그것을 수리할 수 있지만, 그렇게 하기를 망설이고 있다. 때때로 수리 작업은 돈이 많이 들고, 보통 오랜 시간이 걸린다. 게다가 그 노트북은 5년 정도 되었다. 이 경우에 오래된 노트북은 버리고 새로운 것을 구입하는 것이 더 합리적인 선택처럼 보일 수 있다. 하지만 실제로는 그것이 최선이 아닐 수 있다. 만약 Liz가 그녀의 노트북을 쓰레기통에 버린다면, 그녀는 전자 쓰레기라는 심각한 문제에 기여하게 될 것이다."}, {"id": "ctx2", "kind": "ctx", "n": 2, "title": null, "tko": null, "paras": [[{"t": "What exactly is e-waste? The term refers to "}, {"t": "discarded", "c": 1}, {"t": " electronic devices and electrical appliances. Due to toxic materials contained in these products, such as lead, e-waste is a serious health and environmental "}, {"t": "hazard", "c": 2}, {"t": ". To make matters "}, {"t": "better", "c": 3}, {"t": ", the amount of e-waste produced each year is increasing at an alarming rate. In 2021, a total of 57.4 million metric tons of e-waste was generated worldwide, which was a 37% "}, {"t": "decrease", "c": 4}, {"t": " from 2014, the year when data about e-waste was first collected. Experts predict that by 2030, the amount of e-waste generated annually will have doubled in just 16 years. For this reason, efforts are being made to address this problem, most of which are focused on making products "}, {"t": "easier", "c": 5}, {"t": " to repair. Let’s take a look at some practical approaches from around the world."}]], "items": [{"c": 3, "w": "better", "r": "worse", "gw": "더 좋은", "gr": "더 나쁜", "fb": null, "fg": "To make matters <span class=\"d\">worse</span>, the amount of e-waste produced each year is increasing at an alarming rate.", "ko": "설상가상으로, 매년 생산되는 전자 쓰레기의 양은 걱정스러운 속도로 증가하고 있다.", "why": "<b>To make matters worse(설상가상으로)</b>는 나쁜 일 위에 더 나쁜 일을 얹을 때 쓰는 말이에요. 앞 문장은 전자 쓰레기가 위험하다는 나쁜 소식이고, 뒤 문장도 &#x27;양이 걱정스러운 속도로 늘고 있다&#x27;는 나쁜 소식이에요. better (더 좋은)면 나쁜 소식 사이에 좋은 소식 신호가 껴서 어색해요."}, {"c": 4, "w": "decrease", "r": "increase", "gw": "감소", "gr": "증가", "fb": null, "fg": "In 2021, a total of 57.4 million metric tons of e-waste was generated worldwide, which was a 37% <span class=\"d\">increase</span> from 2014, the year when data about e-waste was first collected.", "ko": "2021년에 전 세계적으로 총 5,740만 메트릭톤의 전자 쓰레기가 발생했는데, 이는 전자 쓰레기에 대한 자료가 처음으로 수집된 해인 2014년에 비해 37% 증가한 것이다.", "why": "바로 앞에서 전자 쓰레기가 <b>increasing at an alarming rate(걱정스러운 속도로 늘고 있다)</b>고 했고, 뒤에서 &#x27;2030년에는 두 배가 될 것&#x27;이라고 예측해요. 2014년 대비 37% decrease (감소)가 끼면 &#x27;늘고 있다 → 두 배가 된다&#x27;는 흐름이 끊겨요. increase (증가)여야 해요."}], "keep": "discarded (버려진)는 '버려진 전자 장치'라서 맞고, hazard (위험 요소)는 독성 물질 때문에 건강과 환경에 위험하다는 뜻이라 맞아요. easier (더 쉬운)는 'making products easier to repair (제품을 수리하기 더 쉽게 만드는)'라서 그대로 둬요.", "flow": "전자 쓰레기가 무엇이고 얼마나 위험한지 알려 주는 글이에요. 'To make matters ___(설상가상으로)' 뒤에는 이미 나쁜 이야기에 더 나쁜 이야기가 얹혀요. 숫자가 늘고 있는지 줄고 있는지도 끝까지 따라가 보세요.", "ko": "전자 쓰레기란 정확히 무엇인가? 이 용어는 버려진 전자 장치와 전기 기기를 나타낸다. 이 제품들에 포함된 납과 같은 유독성 물질 때문에 전자 쓰레기는 심각한 건강 및 환경 위험 요소이다. 설상가상으로, 매년 생산되는 전자 쓰레기의 양은 걱정스러운 속도로 증가하고 있다. 2021년에 전 세계적으로 총 5,740만 메트릭톤의 전자 쓰레기가 발생했는데, 이는 전자 쓰레기에 대한 자료가 처음으로 수집된 해인 2014년에 비해 37% 증가한 것이다. 전문가들은 2030년에는 매년 발생하는 전자 쓰레기의 양이 단 16년 만에 두 배가 될 것으로 예측한다. 이러한 이유로 이 문제를 다루기 위해 노력이 이루어지고 있는데, 이 중 대부분은 제품들을 수리하기 더 쉽게 만드는 것에 중점을 두고 있다. 전 세계의 현실성 있는 접근법을 몇 가지 살펴보자."}, {"id": "ctx3", "kind": "ctx", "n": 3, "title": "Right-to-Repair Movement: Empowering Consumers", "tko": "수리할 권리 운동: 소비자에게 힘을 실어 주기", "paras": [[{"t": "One reason many people "}, {"t": "dispose of", "c": 1}, {"t": " their damaged devices is that they are too difficult to repair. For example, a device may be difficult to disassemble, or its manufacturer may require that it be brought to an official service center to be "}, {"t": "fixed", "c": 2}, {"t": ". Many companies do not allow their customers to take their damaged items to third-party repair shops. What is more, some products are "}, {"t": "intentionally", "c": 3}, {"t": " designed to be difficult to repair. It is common for consumers to be unable to acquire the instructions for how to fix their items or the parts needed to complete repairs."}], [{"t": "The right-to-repair movement is trying to solve these problems by promoting legislation that states the following: If you own a product, you have the right to fix it yourself or bring it to a technician of your choice. To protect the rights of consumers, the right-to-repair movement demands four things. First, companies must make information about their products available to everyone. Second, third parties, including individuals, should be able to obtain the parts and tools required to make repairs. Third, the practice of preventing consumers from installing custom software on their own devices should be "}, {"t": "allowed", "c": 4}, {"t": " by law. Finally, it demands that manufacturers design devices in a way that makes repairs as "}, {"t": "hard", "c": 5}, {"t": " as possible. Advocates of the movement say that if all these goals are accomplished, far less e-waste will be generated. Thanks to their efforts, more than 40 states in the U.S. have begun working on right-to-repair legislation. This movement is "}, {"t": "losing", "c": 6}, {"t": " a growing influence in Europe as well, with more and more countries joining the cause."}]], "items": [{"c": 4, "w": "allowed", "r": "prohibited", "gw": "허용되는", "gr": "금지되는", "fb": null, "fg": "Third, the practice of preventing consumers from installing custom software on their own devices should be <span class=\"d\">prohibited</span> by law.", "ko": "세 번째로, 소비자들이 맞춤형 소프트웨어를 자신의 장치에 설치하지 못하게 하는 행위는 법으로 금지되어야 한다.", "why": "소비자가 자기 기기에 소프트웨어를 설치하지 못하게 막는 행위는 <b>should be prohibited by law(법으로 금지되어야 한다)</b>가 맞아요. 이 운동은 소비자의 권리를 지키려는 운동이라서 &#x27;막는 행위&#x27;를 허용하라고 할 수 없어요. allowed (허용되는)면 운동의 목표와 반대가 돼요."}, {"c": 5, "w": "hard", "r": "easy", "gw": "어렵게", "gr": "쉽게", "fb": null, "fg": "Finally, it demands that manufacturers design devices in a way that makes repairs as <span class=\"d\">easy</span> as possible.", "ko": "마지막으로, 그것은 제조사들에게 수리를 최대한 쉽게 만드는 방식으로 장치를 설계할 것을 요구한다.", "why": "<b>makes repairs as easy as possible(수리를 최대한 쉽게 만든다)</b>가 원문이에요. 이 글은 &#x27;고치기 어려워서 버린다&#x27;는 문제에서 시작했고, 운동은 그 문제를 풀려는 거예요. 제조사에게 수리를 가능한 한 hard (어렵게) 만들라고 요구하면 운동의 목적과 정반대예요."}, {"c": 6, "w": "losing", "r": "gaining", "gw": "잃고 있는", "gr": "얻고 있는", "fb": null, "fg": "This movement is <span class=\"d\">gaining</span> a growing influence in Europe as well, with more and more countries joining the cause.", "ko": "이 운동은 점점 더 많은 국가들이 그 대의에 동참하면서 유럽에서도 영향력이 커지고 있다.", "why": "<b>This movement is gaining a growing influence in Europe as well(이 운동은 유럽에서도 영향력이 커지고 있다)</b>이 원문이에요. growing (커지는 중인)과 losing (잃는 중인)은 서로 부딪쳐요. 바로 앞에서 미국 40개 이상 주가 법을 준비한다고 했고, 뒤에서도 more and more countries joining (점점 더 많은 나라가 동참)이라서 &#x27;gaining (얻는)&#x27;이 맞아요."}], "keep": "dispose of (버리다)는 '기기를 버리는 이유'를 말하는 문장이라 맞고, fixed (수리되다)는 '공식 센터에서 수리되도록'이라 맞아요. intentionally (일부러)는 '일부러 고치기 어렵게 만든 제품이 있다'는 내용이라 그대로 둬요.", "flow": "사람들이 기기를 버리는 이유는 고치기 너무 어렵기 때문이에요. 그래서 '수리할 권리 운동'이 소비자를 위해 네 가지를 요구해요. 이 운동이 소비자 편인지 방해하는 편인지, 늘고 있는지 줄고 있는지를 보세요.", "ko": "많은 사람이 그들의 고장 난 장치들을 버리는 한 가지 이유는 그것들이 수리하기 너무 어렵기 때문이다. 예를 들어, 어떤 장치는 분해하기 어려울 수 있고, 또는 그것의 제조사가 그것을 고치려면 공식 수리소로 가져올 것을 요구할 수도 있다. 많은 회사는 그들의 고객들이 고장 난 물건들을 제삼자의 수리점으로 가지고 가는 것을 허용하지 않는다. 게다가, 몇몇 제품은 의도적으로 수리하기 어렵게 만들어진다. 소비자들이 그들의 물건을 고치는 방법에 대한 설명이나 수리를 완료하기 위해 필요한 부품들을 얻지 못하는 것은 흔하다. 수리할 권리 운동은 다음 내용을 명시하는 법률 제정을 추진함으로써 이러한 문제들을 해결하려고 하고 있는데, 그것은 만약 당신이 어떤 제품을 소유하고 있다면, 당신은 그것을 직접 고치거나 당신이 선택한 기술자에게 가지고 갈 권리가 있다는 내용이다. 소비자의 권리를 보호하기 위해, 수리할 권리 운동은 네 가지를 요구한다. 첫 번째로, 회사들은 그들의 제품에 대한 정보를 모두가 이용할 수 있게 해야 한다. 두 번째로, 개인을 포함한 제삼자가 수리를 하기 위해 필요한 부품들과 도구들을 구할 수 있어야 한다. 세 번째로, 소비자들이 맞춤형 소프트웨어를 자신의 장치에 설치하지 못하게 하는 행위는 법으로 금지되어야 한다. 마지막으로, 그것은 제조사들에게 수리를 최대한 쉽게 만드는 방식으로 장치를 설계할 것을 요구한다. 이 운동의 지지자들은 만약 이 모든 목표가 이루어진다면, 훨씬 적은 전자 쓰레기가 발생할 것이라고 말한다. 그들의 노력 덕분에 미국 40개 이상의 주에서 수리할 권리 법률 제정을 위해 노력하기 시작했다. 이 운동은 점점 더 많은 국가들이 그 대의에 동참하면서 유럽에서도 영향력이 커지고 있다."}, {"id": "ctx4", "kind": "ctx", "n": 4, "title": "Repairability Index: Information at a Glance", "tko": "수리 가능성 지수: 한눈에 보는 정보", "paras": [[{"t": "In January 2021, the French government passed a bill that requires that every manufacturer "}, {"t": "exclude", "c": 1}, {"t": " a “repairability index” on five categories of electronic devices and electrical appliances: smartphones, laptops, washing machines, televisions, and lawn mowers. Using a score ranging from 0 to 10, as well as a color-coded system, the index lets consumers see how easily the product can be "}, {"t": "repaired", "c": 2}, {"t": " before they purchase it. The index takes into account several elements, including the availability of repair information, the ease of disassembly, and the price of spare parts. A low number on a bright red label means that repairing the product will be difficult, whereas a high number on a green label indicates that the product is easy to repair."}], [{"t": "The index was designed to have two "}, {"t": "positive", "c": 3}, {"t": " effects. Firstly, it allows consumers to make informed decisions when purchasing new devices and appliances. Secondly, it "}, {"t": "forbids", "c": 4}, {"t": " manufacturers to make their products easier to repair. As a result, with fewer electronic and electrical items ending up in its landfills, France can expect to make a transition to a more sustainable society in the near future. The impact of the index, however, is "}, {"t": "unlikely", "c": 5}, {"t": " to spread far beyond France. We live in a global economy, and any company that wants to sell its appliances on the French market will need to label its products according to the repairability index. If the index is "}, {"t": "successful", "c": 6}, {"t": ", we can anticipate seeing more countries around the world following France’s innovative lead."}]], "items": [{"c": 1, "w": "exclude", "r": "include", "gw": "제외하다", "gr": "포함하다", "fb": null, "fg": "In January 2021, the French government passed a bill that requires that every manufacturer <span class=\"d\">include</span> a “repairability index” on five categories of electronic devices and electrical appliances: smartphones, laptops, washing machines, televisions, and lawn mowers.", "ko": "2021년 1월, 프랑스 정부는 모든 제조사가 스마트폰, 노트북, 세탁기, 텔레비전, 그리고 잔디 깎는 기계라는 다섯 가지 종류의 전자 장치와 전자 기기에 ‘수리 가능성 지수’를 포함시킬 것을 요구하는 법안을 통과시켰다.", "why": "<b>every manufacturer include a repairability index(모든 제조사가 수리 가능성 지수를 포함시킨다)</b>가 원문이에요. 바로 뒤에서 이 지수가 &#x27;소비자가 제품의 수리 난이도를 알 수 있게 해 준다&#x27;고 하니 지수를 제품에 &#x27;넣어야&#x27; 해요. exclude (제외하다)면 지수가 없어서 뒤 내용이 안 맞아요."}, {"c": 4, "w": "forbids", "r": "encourages", "gw": "금지하다", "gr": "장려하다", "fb": null, "fg": "Secondly, it <span class=\"d\">encourages</span> manufacturers to make their products easier to repair.", "ko": "두 번째로, 그것은 제조사들이 자신의 제품을 수리하기 더 쉽게 만들도록 장려한다.", "why": "지수의 &#x27;두 가지 긍정적 효과&#x27; 중 두 번째 문장이에요. 소비자가 정보를 보고 고르면 제조사가 수리하기 쉬운 제품을 만들도록 <b>encourages (장려한다)</b>는 흐름이에요. 뒤에서도 As a result (결과적으로) 매립지로 가는 쓰레기가 줄어든다고 해요. forbids (금지하다)는 &#x27;긍정적 효과&#x27;와 정반대예요."}, {"c": 5, "w": "unlikely", "r": "likely", "gw": "~할 것 같지 않은", "gr": "~할 가능성이 있는", "fb": null, "fg": "The impact of the index, however, is <span class=\"d\">likely</span> to spread far beyond France.", "ko": "하지만 그 지수의 영향은 프랑스를 넘어 더 멀리 퍼질 가능성이 있다.", "why": "<b>is likely to spread far beyond France(프랑스를 넘어 멀리 퍼질 가능성이 있다)</b>가 원문이에요. 바로 뒤에서 &#x27;세계 경제 속에서 프랑스 시장에 팔고 싶은 회사는 모두 지수에 따라 라벨을 붙여야 한다&#x27;고 이유를 대요. 외국 회사도 따라야 하니 프랑스 밖으로 퍼지는 거예요. unlikely (~할 것 같지 않은)면 이 이유가 맞지 않아요."}], "keep": "repaired (수리되는)는 '제품이 얼마나 쉽게 수리될 수 있는지'라서 맞고, positive (긍정적인)는 '두 가지 긍정적인 효과'라 맞아요. successful (성공적인)은 '지수가 성공하면 다른 나라들이 따라 한다'는 마지막 문장과 이어져서 그대로 둬요.", "flow": "프랑스가 만든 '수리 가능성 지수'를 소개하는 글이에요. 이 지수는 '두 가지 긍정적인 효과'를 내려고 만든 거예요. 지수를 넣게 하는지 빼게 하는지, 효과가 좋은 쪽인지 나쁜 쪽인지 보세요.", "ko": "2021년 1월, 프랑스 정부는 모든 제조사가 스마트폰, 노트북, 세탁기, 텔레비전, 그리고 잔디 깎는 기계라는 다섯 가지 종류의 전자 장치와 전자 기기에 ‘수리 가능성 지수’를 포함시킬 것을 요구하는 법안을 통과시켰다. 그 지수는 색상으로 표시되는 시스템뿐만 아니라 0에서 10 사이의 점수도 사용하여 소비자들이 제품을 구입하기 전에 그것이 얼마나 쉽게 수리될 수 있는지 알 수 있게 해 준다. 그 지수는 수리 정보의 이용 가능성, 분해의 용이성, 그리고 여분 부품의 가격을 포함하여 몇 가지 요소를 고려한다. 초록색 라벨의 높은 숫자는 그 제품이 수리하기 쉽다는 것을 나타내는 데에 반하여, 밝은 빨간색 라벨의 낮은 숫자는 그 제품을 수리하는 것이 어려울 것이라는 것을 의미한다. 그 지수는 두 가지의 긍정적인 효과를 가지도록 만들어졌다. 첫 번째로, 그것은 소비자들이 새로운 장치와 기기를 구입할 때 정보에 근거한 결정을 내릴 수 있도록 한다. 두 번째로, 그것은 제조사들이 자신의 제품을 수리하기 더 쉽게 만들도록 장려한다. 결과적으로, 더 적은 전자 및 전기 제품들이 쓰레기 매립지에 이르게 되면서, 프랑스는 가까운 미래에 더 지속 가능한 사회로 변화할 것을 기대할 수 있다. 하지만 그 지수의 영향은 프랑스를 넘어 더 멀리 퍼질 가능성이 있다. 우리는 세계 경제 속에 살고 있으며, 프랑스 시장에서 기기를 판매하고 싶은 모든 회사는 그들의 제품에 수리 가능성 지수에 따라 라벨을 붙여야 할 것이다. 만약 이 지수가 성공적이라면, 우리는 전 세계의 더 많은 나라들이 프랑스의 혁신적인 선례를 따르는 것을 보길 기대할 수 있다."}, {"id": "ctx5", "kind": "ctx", "n": 5, "title": "Repair Cafés: It Takes a Community", "tko": "수리 카페: 공동체가 필요하다", "paras": [[{"t": "When consumers are given the right tools and materials, along with some helpful advice, they can repair much of the damage that occurs to electronic products by themselves. That is why Repair Cafés were started. They are free meeting places where people can gather together and "}, {"t": "fix", "c": 1}, {"t": " their broken devices. The cafés are staffed by volunteer experts who can give technical advice and teach people how to fix things."}], [{"t": "The first Repair Café was opened in the Netherlands in the city of Amsterdam in 2009. It was such a "}, {"t": "failure", "c": 2}, {"t": " that the idea soon spread to neighboring countries. Before long, there were Repair Cafés in over 30 countries around the world. Along with "}, {"t": "preventing", "c": 3}, {"t": " damaged items from becoming e-waste, these cafés also encourage people to share their invaluable skills and knowledge about the repair and maintenance of electronics. They continue to "}, {"t": "grow", "c": 4}, {"t": " in popularity, with more and more people signing up to volunteer."}], [{"t": "By providing spaces where people can learn, Repair Cafés enable individuals to maintain their devices and "}, {"t": "shorten", "c": 5}, {"t": " their life spans. Furthermore, they foster a sustainable perspective that can have a huge "}, {"t": "negative", "c": 6}, {"t": " impact on our future."}]], "items": [{"c": 2, "w": "failure", "r": "success", "gw": "실패", "gr": "성공", "fb": null, "fg": "It was such a <span class=\"d\">success</span> that the idea soon spread to neighboring countries.", "ko": "그것은 너무 성공적이어서 그 아이디어가 곧 이웃 나라들로 확산되었다.", "why": "<b>It was such a success that the idea soon spread to neighboring countries(너무 성공적이어서 그 아이디어가 곧 이웃 나라들로 퍼졌다)</b>가 원문이에요. 퍼졌다는 건 잘 됐다는 뜻이고, 바로 뒤에서도 30개국이 넘는 곳에 수리 카페가 생겼다고 해요. 실패했다면 퍼질 수 없어요."}, {"c": 5, "w": "shorten", "r": "extend", "gw": "줄이다", "gr": "늘리다", "fb": null, "fg": "By providing spaces where people can learn, Repair Cafés enable individuals to maintain their devices and <span class=\"d\">extend</span> their life spans.", "ko": "사람들이 배울 수 있는 공간을 제공함으로써, 수리 카페들은 개인이 자신들의 장치를 유지하고 그것들의 수명을 연장할 수 있게 한다.", "why": "수리 카페는 사람들이 <b>maintain their devices and extend their life spans(기기를 유지하고 수명을 연장하도록)</b> 도와요. 앞에서 &#x27;고장 난 물건이 쓰레기가 되는 것을 막는다&#x27;고 했으니 수명을 shorten (줄이다)하면 반대예요."}, {"c": 6, "w": "negative", "r": "positive", "gw": "부정적인", "gr": "긍정적인", "fb": null, "fg": "Furthermore, they foster a sustainable perspective that can have a huge <span class=\"d\">positive</span> impact on our future.", "ko": "게다가 그것들은 우리의 미래에 막대한 긍정적인 영향을 미칠 수 있는 지속 가능한 관점을 조성한다.", "why": "수리 카페는 <b>a sustainable perspective(지속 가능한 관점)</b>를 키우고, 이것이 우리의 미래에 막대한 <b>positive impact(긍정적인 영향)</b>를 줄 수 있어요. 앞 문장 전체가 수리 카페의 좋은 점이고 Furthermore (게다가)로 이어지는 문장이라, negative (부정적인)면 흐름이 꺾여요."}], "keep": "fix (고치다)는 '모여서 고장 난 기기를 고치는' 곳이라 맞고, preventing (막는 것)은 '고장 난 물건이 전자 쓰레기가 되는 것을 막는 것'이라 맞아요. grow (커지다)는 '인기가 계속 커진다'는 내용이라 그대로 둬요.", "flow": "수리 카페를 소개하는 글이에요. 수리 카페는 사람들이 고장 난 기기를 직접 고치게 돕고, 쓰레기도 줄여요. 이야기가 좋은 쪽(성공, 연장, 긍정적)으로 이어지는지 보세요.", "ko": "소비자들에게 유용한 조언과 함께 알맞은 도구와 재료가 주어지면, 그들은 전자 제품에 발생하는 대부분의 손상을 직접 수리할 수 있다. 그것이 수리 카페가 시작된 이유이다. 그곳은 사람들이 함께 모여 자신들의 고장 난 장치들을 고칠 수 있는 자유로운 만남의 장소이다. 그 카페들은 기술적인 조언을 줄 수 있고, 사람들에게 물건을 고치는 방법을 가르쳐 줄 수 있는 자원봉사자 전문가들을 직원으로 두고 있다. 가장 첫 번째 수리 카페는 네덜란드의 도시 암스테르담에서 2009년에 열렸다. 그것은 너무 성공적이어서 그 아이디어가 곧 이웃 나라들로 확산되었다. 얼마 후, 전 세계 30개국 이상에 수리 카페가 생겼다. 고장 난 물건들이 전자 쓰레기가 되는 것을 막는 것과 더불어, 이 카페들은 또한 사람들이 전자 제품의 수리와 보수 관리에 대한 매우 유용한 기술들과 지식을 공유할 수 있도록 장려한다. 점점 더 많은 사람들이 자원봉사를 하기 위해 신청하면서, 이 카페들은 계속해서 인기를 얻고 있다. 사람들이 배울 수 있는 공간을 제공함으로써, 수리 카페들은 개인이 자신들의 장치를 유지하고 그것들의 수명을 연장할 수 있게 한다. 게다가 그것들은 우리의 미래에 막대한 긍정적인 영향을 미칠 수 있는 지속 가능한 관점을 조성한다."}, {"id": "ctx6", "kind": "ctx", "n": 6, "title": null, "tko": null, "paras": [[{"t": "Do you remember Liz, the girl who dropped her laptop? Imagine she lived in a world where repairing damaged devices and appliances was simply part of everyday life. If that were the case, her options wouldn’t be "}, {"t": "limited", "c": 1}, {"t": " to paying for expensive repairs or throwing away her laptop and buying a new one. She would be able to order the necessary parts online and "}, {"t": "replace", "c": 2}, {"t": " them herself. Alternatively, she could bring her "}, {"t": "damaged", "c": 3}, {"t": " device to the nearest Repair Café to get advice on how to fix it. Repairing it probably wouldn’t be very hard, and she likely would have purchased a laptop with a "}, {"t": "low", "c": 4}, {"t": " repairability score."}], [{"t": "In fact, this sustainable world is a future we can all enjoy if we work toward it together. Even more importantly, it is a future in which people will generate far "}, {"t": "more", "c": 5}, {"t": " e-waste, making our planet a cleaner, healthier place for everyone."}]], "items": [{"c": 4, "w": "low", "r": "high", "gw": "낮은", "gr": "높은", "fb": null, "fg": "Repairing it probably wouldn’t be very hard, and she likely would have purchased a laptop with a <span class=\"d\">high</span> repairability score.", "ko": "그녀는 높은 수리 가능성 점수를 가진 노트북을 구매했을 것이기 때문에, 그것을 수리하는 것은 아마 아주 어렵지는 않았을 것이다.", "why": "<b>Repairing it probably wouldn&#x27;t be very hard(그것을 수리하는 것은 아마 아주 어렵지는 않았을 것이다)</b>의 이유가 뒤에 와요. 수리가 어렵지 않으려면 수리 가능성 점수가 high (높은) 노트북을 샀어야 해요. 앞의 프랑스 지수 이야기에서도 &#x27;높은 숫자는 수리하기 쉽다&#x27;고 했어요."}, {"c": 5, "w": "more", "r": "less", "gw": "더 많은", "gr": "더 적은", "fb": null, "fg": "Even more importantly, it is a future in which people will generate far <span class=\"d\">less</span> e-waste, making our planet a cleaner, healthier place for everyone.", "ko": "훨씬 더 중요한 것은 그것은 사람들이 훨씬 적은 전자 쓰레기를 발생시킬 미래이며, 이는 우리의 지구를 모두를 위한 더 깨끗하고 건강한 곳으로 만들 것이라는 것이다.", "why": "<b>generate far less e-waste(훨씬 적은 전자 쓰레기를 발생시킨다)</b>가 원문이에요. 뒤에서 &#x27;지구를 더 깨끗하고 건강한 곳으로 만든다&#x27;고 하는데, 쓰레기가 more (더 많이) 나오면 지구가 깨끗해질 수 없어요. 이 글 전체가 &#x27;전자 쓰레기를 줄이자&#x27;는 이야기예요."}], "keep": "limited (제한되는)는 '선택지가 비싼 수리나 새로 사기로만 제한되지는 않았을 것'이라 맞고, replace (교체하다)는 '부품을 주문해서 직접 교체'라 맞아요. damaged (고장 난)는 '고장 난 기기를 수리 카페에 가져간다'는 내용이라 그대로 둬요.", "flow": "다시 Liz 이야기로 돌아와요. '수리가 일상인 세상'을 상상하는 가정법 글이라서, 그런 세상에서 Liz가 어떤 선택을 할지 따라가면 돼요. 마지막은 그 세상이 지구에 좋다는 결론이에요.", "ko": "노트북을 떨어뜨렸던 소녀 Liz를 기억하는가? 그녀가 손상된 장치와 기기를 수리하는 것이 그저 일상의 한 부분인 세상에 살고 있었다고 상상해 보라. 만약 그랬다면, 그녀의 선택지는 비싼 수리를 위해 비용을 지불하거나 노트북을 버리고 새것을 사는 것으로 제한되지는 않았을 것이다. 그녀는 인터넷에서 필요한 부품들을 주문하고, 그것들을 직접 교체할 수 있었을 것이다. 그렇지 않으면, 그녀는 그것을 고치는 방법에 대한 조언을 얻기 위해 고장 난 장치를 가장 가까운 수리 카페에 가지고 갈 수도 있었을 것이다. 그녀는 높은 수리 가능성 점수를 가진 노트북을 구매했을 것이기 때문에, 그것을 수리하는 것은 아마 아주 어렵지는 않았을 것이다. 사실, 이 지속 가능한 세상은 우리가 그것을 향해 함께 노력한다면 우리 모두가 누릴 수 있는 미래이다. 훨씬 더 중요한 것은 그것은 사람들이 훨씬 적은 전자 쓰레기를 발생시킬 미래이며, 이는 우리의 지구를 모두를 위한 더 깨끗하고 건강한 곳으로 만들 것이라는 것이다."}, {"id": "gram1", "kind": "gram", "n": 1, "title": null, "tko": null, "paras": [[{"t": "On her way to a study group meeting, Liz accidentally dropped her laptop on the street, "}, {"t": "seriously damaged it", "c": 1}, {"t": ". Although it still turns on, "}, {"t": "the screen is cracked", "c": 2}, {"t": ", and some keys are not working. "}, {"t": "She can have it repair", "c": 3}, {"t": ", but "}, {"t": "she is hesitating to do so", "c": 4}, {"t": ". Sometimes repairs are expensive, and they often take a long time. Besides, the laptop is about five years old. In this case, "}, {"t": "getting rid of the old one and purchasing a new one might seem like a more reasonable option", "c": 5}, {"t": ". In reality, however, "}, {"t": "it may not be the best thing doing", "c": 6}, {"t": ". If Liz throws her laptop in the trash, "}, {"t": "she will be contributing to a serious problem: e-waste", "c": 7}, {"t": "."}]], "items": [{"c": 1, "w": "damaged", "r": "damaging", "gw": "손상시켰다", "gr": "손상시키면서", "fb": "seriously <span class=\"d\">damaged</span> it", "fg": "seriously <span class=\"d\">damaging</span> it", "ko": "스터디 그룹 모임에 가는 길에, Liz는 실수로 그녀의 노트북을 길에 떨어뜨려 그것을 심각하게 손상시켰다.", "why": "앞에 이미 <b>Liz accidentally dropped her laptop(Liz는 실수로 노트북을 떨어뜨렸다)</b>라는 동사 문장이 있어요. 쉼표 뒤에 damaged (손상시켰다)를 또 쓰면 한 문장에 동사가 두 개가 돼요. 그래서 &#x27;떨어뜨려서 (그 결과) 심각하게 손상시켰다&#x27;는 덧붙이는 말인 <b>damaging</b>으로 바꿔야 해요."}, {"c": 3, "w": "repair", "r": "repaired", "gw": "수리하다", "gr": "수리받다", "fb": "She can have it <span class=\"d\">repair</span>", "fg": "She can have it <span class=\"d\">repaired</span>", "ko": "그녀는 그것을 수리할 수 있지만, 그렇게 하기를 망설이고 있다.", "why": "have it repair는 &#x27;그것이 수리하다&#x27;가 돼요. 하지만 노트북(it)은 스스로 수리하는 게 아니라 <b>수리를 받는</b> 거예요. 그래서 have + 목적어 + 과거분사인 <b>have it repaired(그것을 수리받다)</b>가 맞아요."}, {"c": 6, "w": "doing", "r": "to do", "gw": "하고 있는", "gr": "해야 할", "fb": "it may not be the best thing <span class=\"d\">doing</span>", "fg": "it may not be the best thing <span class=\"d\">to do</span>", "ko": "하지만 실제로는 그것이 최선이 아닐 수 있다.", "why": "<b>the best thing to do</b>는 &#x27;해야 할 최선의 것&#x27;이에요. 명사(thing) 뒤에 to + 동사원형을 붙이면 &#x27;~할&#x27;이 돼요. doing을 쓰면 &#x27;하고 있는 최선의 것&#x27;이 돼서 뜻이 달라져요."}], "keep": "the screen is cracked (화면은 금이 가 있다)는 '금이 가게 된' 상태라 be + 과거분사가 맞아요. she is hesitating to do so (망설이고 있다)는 진행형이라 맞고, getting rid of ... and purchasing ... might seem (버리고 구입하는 것이 ~처럼 보일 수 있다)는 동명사 주어에 동사가 맞아요. she will be contributing to (~에 기여하게 될 것이다)는 to가 전치사라서 -ing가 맞아요.", "flow": "어법상 어색한 곳은 밑줄 친 문장 중에서만 찾아요. 이 글은 Liz가 노트북을 떨어뜨린 이야기예요. 각 밑줄에서 동사가 이미 있는지, 수리를 '하는지 받는지'를 보세요.", "ko": "스터디 그룹 모임에 가는 길에, Liz는 실수로 그녀의 노트북을 길에 떨어뜨려 그것을 심각하게 손상시켰다. 그것은 여전히 켜지기는 하지만, 화면은 금이 갔고, 몇몇 키들은 작동하지 않는다. 그녀는 그것을 수리할 수 있지만, 그렇게 하기를 망설이고 있다. 때때로 수리 작업은 돈이 많이 들고, 보통 오랜 시간이 걸린다. 게다가 그 노트북은 5년 정도 되었다. 이 경우에 오래된 노트북은 버리고 새로운 것을 구입하는 것이 더 합리적인 선택처럼 보일 수 있다. 하지만 실제로는 그것이 최선이 아닐 수 있다. 만약 Liz가 그녀의 노트북을 쓰레기통에 버린다면, 그녀는 전자 쓰레기라는 심각한 문제에 기여하게 될 것이다."}, {"id": "gram2", "kind": "gram", "n": 2, "title": null, "tko": null, "paras": [[{"t": "What exactly is e-waste? The term refers to discarded electronic devices and electrical appliances. "}, {"t": "Due to toxic materials contained in these products", "c": 1}, {"t": ", such as lead, e-waste is a serious health and environmental hazard. To make matters worse, "}, {"t": "the amount of e-waste produced each year is increasing at an alarming rate", "c": 2}, {"t": ". In 2021, "}, {"t": "a total of 57.4 million metric tons of e-waste was generated worldwide", "c": 3}, {"t": ", "}, {"t": "which was a 37% increase from 2014, the year which data about e-waste was first collected", "c": 4}, {"t": ". Experts predict that by 2030, "}, {"t": "the amount of e-waste generated annually will have doubled in just 16 years", "c": 5}, {"t": ". For this reason, "}, {"t": "efforts are being made address this problem", "c": 6}, {"t": ", "}, {"t": "most of them are focused on making products easier to repair", "c": 7}, {"t": ". Let’s take a look at some practical approaches from around the world."}]], "items": [{"c": 4, "w": "which", "r": "when", "gw": "'그것'을 뜻하는 which", "gr": "'그때'를 뜻하는 when", "fb": "which was a 37% increase from 2014, the year <span class=\"d\">which</span> data about e-waste was first collected", "fg": "which was a 37% increase from 2014, the year <span class=\"d\">when</span> data about e-waste was first collected", "ko": "2021년에 전 세계적으로 총 5,740만 메트릭톤의 전자 쓰레기가 발생했는데, 이는 전자 쓰레기에 대한 자료가 처음으로 수집된 해인 2014년에 비해 37% 증가한 것이다.", "why": "the year (그 해) 뒤에 <b>data about e-waste was first collected(전자 쓰레기 자료가 처음 수집되었다)</b>라는 완전한 문장이 이어져요. 선행사가 &#x27;때&#x27;이고 뒤가 완전하면 관계부사 <b>when</b>을 써요. which는 뒤 문장에서 주어나 목적어가 빠져 있을 때 쓰는 말이에요."}, {"c": 6, "w": "address", "r": "to address", "gw": "다루다", "gr": "다루기 위해", "fb": "efforts are being made <span class=\"d\">address</span> this problem", "fg": "efforts are being made <span class=\"d\">to address</span> this problem", "ko": "이러한 이유로 이 문제를 다루기 위해 노력이 이루어지고 있는데, 이 중 대부분은 제품들을 수리하기 더 쉽게 만드는 것에 중점을 두고 있다.", "why": "<b>efforts are being made(노력이 이루어지고 있다)</b>에 이미 동사 are being made가 있어요. address (다루다)를 그냥 붙이면 동사가 두 개가 돼요. &#x27;이 문제를 다루기 위해&#x27;라는 목적을 말하려면 <b>to address</b>처럼 to + 동사원형으로 써야 해요."}, {"c": 7, "w": "them", "r": "which", "gw": "그것들 (문장이 둘로 끊김)", "gr": "그중 (한 문장으로 연결)", "fb": "most of <span class=\"d\">them</span> are focused on making products easier to repair", "fg": "most of <span class=\"d\">which</span> are focused on making products easier to repair", "ko": "이러한 이유로 이 문제를 다루기 위해 노력이 이루어지고 있는데, 이 중 대부분은 제품들을 수리하기 더 쉽게 만드는 것에 중점을 두고 있다.", "why": "앞에 이미 하나의 문장이 있고, 쉼표 뒤에 most of them are focused ...라는 문장이 또 나와요. 접속사 없이 쉼표만으로는 두 문장을 이을 수 없어요. 접속사 역할을 하는 <b>most of which</b>(그중 대부분은)를 쓰면 한 문장으로 이어져요."}], "keep": "Due to toxic materials contained in these products (이 제품들에 포함된 독성 물질 때문에)의 contained는 '포함된'이라는 뜻의 과거분사라 맞아요. the amount of e-waste produced each year is increasing (매년 생산되는 전자 쓰레기의 양은 늘고 있다)은 주어가 the amount라서 is가 맞아요. a total of 57.4 million metric tons of e-waste was generated (총 5,740만 톤이 발생했다)는 수동 was generated가 맞고, will have doubled (두 배가 되어 있을 것이다)는 2030년 기준 미래완료로 맞아요.", "flow": "전자 쓰레기의 뜻과 규모를 설명하는 글이에요. 관계사가 알맞은지, to가 빠졌는지, 문장 두 개가 접속사 없이 붙지 않았는지를 보세요.", "ko": "전자 쓰레기란 정확히 무엇인가? 이 용어는 버려진 전자 장치와 전기 기기를 나타낸다. 이 제품들에 포함된 납과 같은 유독성 물질 때문에 전자 쓰레기는 심각한 건강 및 환경 위험 요소이다. 설상가상으로, 매년 생산되는 전자 쓰레기의 양은 걱정스러운 속도로 증가하고 있다. 2021년에 전 세계적으로 총 5,740만 메트릭톤의 전자 쓰레기가 발생했는데, 이는 전자 쓰레기에 대한 자료가 처음으로 수집된 해인 2014년에 비해 37% 증가한 것이다. 전문가들은 2030년에는 매년 발생하는 전자 쓰레기의 양이 단 16년 만에 두 배가 될 것으로 예측한다. 이러한 이유로 이 문제를 다루기 위해 노력이 이루어지고 있는데, 이 중 대부분은 제품들을 수리하기 더 쉽게 만드는 것에 중점을 두고 있다. 전 세계의 현실성 있는 접근법을 몇 가지 살펴보자."}, {"id": "gram3", "kind": "gram", "n": 3, "title": "Right-to-Repair Movement: Empowering Consumers", "tko": "수리할 권리 운동: 소비자에게 힘을 실어 주기", "paras": [[{"t": "One reason many people dispose of their damaged devices is that they are too difficult to repair", "c": 1}, {"t": ". For example, a device may be difficult to disassemble, or "}, {"t": "its manufacturer may require that it is brought to an official service center to be fixed", "c": 2}, {"t": ". "}, {"t": "Many companies do not allow their customers to take their damaged items to third-party repair shops", "c": 3}, {"t": ". What is more, "}, {"t": "some products are intentionally designed to be difficult to repair", "c": 4}, {"t": ". "}, {"t": "It is common for consumers to be unable to acquire the instructions for how to fix their items or the parts needed to complete repairs", "c": 5}, {"t": "."}], [{"t": "The right-to-repair movement is trying to solve these problems by promoting legislation that states the following", "c": 6}, {"t": ": If you own a product, "}, {"t": "you have the right to fix it yourself or bring it to a technician of your choice", "c": 7}, {"t": ". To protect the rights of consumers, the right-to-repair movement demands four things. First, "}, {"t": "companies must make information about their products available to everyone", "c": 8}, {"t": ". Second, "}, {"t": "third parties, including individuals, should be able to obtain the parts and tools required to make repairs", "c": 9}, {"t": ". Third, the practice of preventing consumers from installing custom software on their own devices should be prohibited by law. Finally, "}, {"t": "it demands that manufacturers design devices in a way that makes repairs as easily as possible", "c": 10}, {"t": ". Advocates of the movement say that if all these goals are accomplished, far less e-waste will be generated. Thanks to their efforts, more than 40 states in the U.S. have begun working on right-to-repair legislation. This movement is gaining a growing influence in Europe as well, "}, {"t": "with more and more countries joined the cause", "c": 11}, {"t": "."}]], "items": [{"c": 2, "w": "is", "r": "be", "gw": "가져와진다", "gr": "가져와져야 한다 (동사원형)", "fb": "its manufacturer may require that it <span class=\"d\">is</span> brought to an official service center to be fixed", "fg": "its manufacturer may require that it <span class=\"d\">be</span> brought to an official service center to be fixed", "ko": "예를 들어, 어떤 장치는 분해하기 어려울 수 있고, 또는 그것의 제조사가 그것을 고치려면 공식 수리소로 가져올 것을 요구할 수도 있다.", "why": "require that ... (~하라고 요구하다) 뒤의 that절에서는 동사를 <b>동사원형(be)</b>으로 써요. 주어가 it이어도 is로 바꾸지 않아요. 그래서 it is brought가 아니라 <b>it be brought</b>가 맞아요."}, {"c": 10, "w": "easily", "r": "easy", "gw": "쉽게 (부사)", "gr": "쉬운 (형용사)", "fb": "it demands that manufacturers design devices in a way that makes repairs as <span class=\"d\">easily</span> as possible", "fg": "it demands that manufacturers design devices in a way that makes repairs as <span class=\"d\">easy</span> as possible", "ko": "마지막으로, 그것은 제조사들에게 수리를 최대한 쉽게 만드는 방식으로 장치를 설계할 것을 요구한다.", "why": "makes repairs as ___ as possible는 &#x27;수리를 가능한 한 ~하게 만든다&#x27;예요. make + 목적어 뒤에는 목적어의 상태를 말하는 <b>형용사</b>가 와요. easily는 부사라서 이 자리에 쓸 수 없고, <b>easy</b>가 맞아요."}, {"c": 11, "w": "joined", "r": "joining", "gw": "동참했다 (과거)", "gr": "동참하면서 (-ing)", "fb": "with more and more countries <span class=\"d\">joined</span> the cause", "fg": "with more and more countries <span class=\"d\">joining</span> the cause", "ko": "이 운동은 점점 더 많은 국가들이 그 대의에 동참하면서 유럽에서도 영향력이 커지고 있다.", "why": "앞에 <b>This movement is gaining ...(이 운동은 영향력이 커지고 있다)</b>라는 완전한 문장이 있어요. 뒤의 with + 명사 + 분사는 &#x27;~하면서&#x27;라는 덧붙이는 말이에요. 나라들이 &#x27;동참하는&#x27; 능동이므로 과거형 joined가 아니라 <b>joining</b>이 맞아요."}], "keep": "One reason ... is that they are too difficult to repair (한 가지 이유는 고치기 너무 어렵다는 것이다)는 that절과 too ~ to 모양이 맞아요. Many companies do not allow their customers to take (고객이 가져가는 것을 허용하지 않는다)는 allow + 목적어 + to V라 맞고, some products are intentionally designed (일부러 만들어진다)는 수동이 맞아요. It is common for consumers to be unable (소비자가 ~하지 못하는 것은 흔하다)와 by promoting (추진함으로써)도 맞아요. required to make repairs (수리에 필요한)는 과거분사가 뒤에서 꾸며서 맞아요.", "flow": "사람들이 기기를 버리는 이유와 '수리할 권리 운동'의 요구를 설명하는 글이에요. require 같은 동사 뒤 모양, make 뒤 보어 모양, with 뒤 분사 모양을 눈여겨보세요.", "ko": "많은 사람이 그들의 고장 난 장치들을 버리는 한 가지 이유는 그것들이 수리하기 너무 어렵기 때문이다. 예를 들어, 어떤 장치는 분해하기 어려울 수 있고, 또는 그것의 제조사가 그것을 고치려면 공식 수리소로 가져올 것을 요구할 수도 있다. 많은 회사는 그들의 고객들이 고장 난 물건들을 제삼자의 수리점으로 가지고 가는 것을 허용하지 않는다. 게다가, 몇몇 제품은 의도적으로 수리하기 어렵게 만들어진다. 소비자들이 그들의 물건을 고치는 방법에 대한 설명이나 수리를 완료하기 위해 필요한 부품들을 얻지 못하는 것은 흔하다. 수리할 권리 운동은 다음 내용을 명시하는 법률 제정을 추진함으로써 이러한 문제들을 해결하려고 하고 있는데, 그것은 만약 당신이 어떤 제품을 소유하고 있다면, 당신은 그것을 직접 고치거나 당신이 선택한 기술자에게 가지고 갈 권리가 있다는 내용이다. 소비자의 권리를 보호하기 위해, 수리할 권리 운동은 네 가지를 요구한다. 첫 번째로, 회사들은 그들의 제품에 대한 정보를 모두가 이용할 수 있게 해야 한다. 두 번째로, 개인을 포함한 제삼자가 수리를 하기 위해 필요한 부품들과 도구들을 구할 수 있어야 한다. 세 번째로, 소비자들이 맞춤형 소프트웨어를 자신의 장치에 설치하지 못하게 하는 행위는 법으로 금지되어야 한다. 마지막으로, 그것은 제조사들에게 수리를 최대한 쉽게 만드는 방식으로 장치를 설계할 것을 요구한다. 이 운동의 지지자들은 만약 이 모든 목표가 이루어진다면, 훨씬 적은 전자 쓰레기가 발생할 것이라고 말한다. 그들의 노력 덕분에 미국 40개 이상의 주에서 수리할 권리 법률 제정을 위해 노력하기 시작했다. 이 운동은 점점 더 많은 국가들이 그 대의에 동참하면서 유럽에서도 영향력이 커지고 있다."}, {"id": "gram4", "kind": "gram", "n": 4, "title": "Repairability Index: Information at a Glance", "tko": "수리 가능성 지수: 한눈에 보는 정보", "paras": [[{"t": "In January 2021, "}, {"t": "the French government passed a bill what requires that every manufacturer include a “repairability index” on five categories of electronic devices and electrical appliances", "c": 1}, {"t": ": smartphones, laptops, washing machines, televisions, and lawn mowers. Using a score ranging from 0 to 10, as well as a color-coded system, "}, {"t": "the index lets consumers see how easily the product can be repaired", "c": 2}, {"t": " before they purchase it. The index takes into account several elements, including the availability of repair information, the ease of disassembly, and the price of spare parts. "}, {"t": "A low number on a bright red label means that repairing the product will be difficult", "c": 3}, {"t": ", "}, {"t": "whereas a high number on a green label indicates that the product is easy to repair", "c": 4}, {"t": "."}], [{"t": "The index was designed to have two positive effects", "c": 5}, {"t": ". Firstly, it allows consumers to make informed decisions "}, {"t": "when purchasing new devices and appliances", "c": 6}, {"t": ". Secondly, "}, {"t": "it encourages manufacturers make their products easier to repair", "c": 7}, {"t": ". As a result, "}, {"t": "with fewer electronic and electrical items ended up in its landfills", "c": 8}, {"t": ", France can expect to make a transition to a more sustainable society in the near future. "}, {"t": "The impact of the index, however, is likely to spread far beyond France", "c": 9}, {"t": ". We live in a global economy, and "}, {"t": "any company that wants to sell its appliances on the French market will need to label its products", "c": 10}, {"t": " according to the repairability index. If the index is successful, we can anticipate seeing more countries around the world following France’s innovative lead."}]], "items": [{"c": 1, "w": "what", "r": "that", "gw": "'~하는 것'을 뜻하는 what", "gr": "'~하는'을 뜻하는 that", "fb": "the French government passed a bill <span class=\"d\">what</span> requires that every manufacturer include a “repairability index” on five categories of electronic devices and electrical appliances", "fg": "the French government passed a bill <span class=\"d\">that</span> requires that every manufacturer include a “repairability index” on five categories of electronic devices and electrical appliances", "ko": "2021년 1월, 프랑스 정부는 모든 제조사가 스마트폰, 노트북, 세탁기, 텔레비전, 그리고 잔디 깎는 기계라는 다섯 가지 종류의 전자 장치와 전자 기기에 ‘수리 가능성 지수’를 포함시킬 것을 요구하는 법안을 통과시켰다.", "why": "a bill (법안) 뒤에서 &#x27;요구하는 법안&#x27;이라고 꾸미려면 관계대명사 <b>that</b>을 써요. what은 앞에 명사를 두지 않고 &#x27;~하는 것&#x27;이라는 뜻을 스스로 품고 있어서, a bill what처럼 명사 뒤에 붙일 수 없어요."}, {"c": 7, "w": "make", "r": "to make", "gw": "만든다", "gr": "만들도록", "fb": "it encourages manufacturers <span class=\"d\">make</span> their products easier to repair", "fg": "it encourages manufacturers <span class=\"d\">to make</span> their products easier to repair", "ko": "두 번째로, 그것은 제조사들이 자신의 제품을 수리하기 더 쉽게 만들도록 장려한다.", "why": "encourage는 <b>encourage + 목적어 + to V</b> 모양으로 써요. &#x27;제조사들이 만들도록 장려한다&#x27;이므로 manufacturers 뒤에 make가 아니라 <b>to make</b>가 와야 해요."}, {"c": 8, "w": "ended", "r": "ending", "gw": "도착했다 (과거)", "gr": "도착하면서 (-ing)", "fb": "with fewer electronic and electrical items <span class=\"d\">ended</span> up in its landfills", "fg": "with fewer electronic and electrical items <span class=\"d\">ending</span> up in its landfills", "ko": "결과적으로, 더 적은 전자 및 전기 제품들이 쓰레기 매립지에 이르게 되면서, 프랑스는 가까운 미래에 더 지속 가능한 사회로 변화할 것을 기대할 수 있다.", "why": "with + 명사 + 분사 모양이에요. items (제품들)가 &#x27;매립지에 이르게 되는&#x27; 건 스스로 하는 일이고, end up (결국 ~에 이르다)은 당하는 말이 아니라서 과거분사 ended가 아니라 <b>ending</b>이 맞아요."}], "keep": "the index lets consumers see how easily the product can be repaired (소비자가 얼마나 쉽게 수리되는지 보게 해 준다)는 let + 목적어 + 동사원형이 맞아요. A low number ... means that repairing the product will be difficult (낮은 숫자는 수리가 어려울 거라는 뜻이다)와 whereas a high number ... indicates that ... is easy to repair도 맞아요. The index was designed to have two positive effects (두 가지 긍정적 효과를 갖도록 만들어졌다), when purchasing new devices (새 장치를 구입할 때), is likely to spread (퍼질 가능성이 있다), any company that wants ... will need to label (원하는 모든 회사는 라벨을 붙여야 한다)도 모양이 맞아요.", "flow": "프랑스의 수리 가능성 지수를 소개하는 글이에요. 관계대명사가 알맞은지, encourage 뒤의 모양, with 뒤 분사 모양을 보세요.", "ko": "2021년 1월, 프랑스 정부는 모든 제조사가 스마트폰, 노트북, 세탁기, 텔레비전, 그리고 잔디 깎는 기계라는 다섯 가지 종류의 전자 장치와 전자 기기에 ‘수리 가능성 지수’를 포함시킬 것을 요구하는 법안을 통과시켰다. 그 지수는 색상으로 표시되는 시스템뿐만 아니라 0에서 10 사이의 점수도 사용하여 소비자들이 제품을 구입하기 전에 그것이 얼마나 쉽게 수리될 수 있는지 알 수 있게 해 준다. 그 지수는 수리 정보의 이용 가능성, 분해의 용이성, 그리고 여분 부품의 가격을 포함하여 몇 가지 요소를 고려한다. 초록색 라벨의 높은 숫자는 그 제품이 수리하기 쉽다는 것을 나타내는 데       var r=R(q),b=el('button','li');
      var left=el('div');left.appendChild(document.createTextNode(nm(q)));left.appendChild(el('small',null,'어색한 곳 '+q.items.length+'개 고르기'));
      var st=el('span','st',r.done?(isOk(q)?'○ 정답':'× 다시 보기'):(r.sel.length?'푸는 중':'아직 안 풂'));
      if(r.done)st.classList.add(isOk(q)?'ok':'ng');else if(r.sel.length)st.classList.add('ing');
      b.appendChild(left);b.appendChild(st);b.onclick=function(){open(q.id)};box.appendChild(b)});
    L.appendChild(box)});
}
function qById(id){return Q.filter(function(q){return q.id===id})[0]}
function open(id){S.cur=id;save();draw(qById(id));show('quiz')}
function draw(q){
  var r=R(q),n=q.items.length,idx=Q.indexOf(q);
  $('qn').textContent=nm(q)+' ('+(idx+1)+'/'+Q.length+')';
  $('ask').innerHTML='밑줄 친 곳 중 <b>'+(q.kind==='ctx'?'문맥상':'어법상')+' 어색한 것 '+n+'개</b>를 고르세요.';
  var ps=$('ps');ps.innerHTML='';ps.classList.toggle('locked',r.done);
  if(q.title){var tp=el('p','ptitle');tp.textContent=q.title+' ';var sp=el('span',null,'('+q.tko+')');sp.style.cssText='color:var(--sub);font-size:15px;font-weight:600';tp.appendChild(sp);ps.appendChild(tp)}
  var T=truth(q);
  q.paras.forEach(function(p){
    var pe=el('p');
    p.forEach(function(s){
      if(!s.c){pe.appendChild(document.createTextNode(s.t));return}
      var c=el('span','cd');c.setAttribute('data-c',s.c);c.appendChild(document.createTextNode(s.t));
      c.appendChild(el('sup',null,CIRC.charAt(s.c-1)));
      var picked=r.sel.indexOf(s.c)>=0,isT=T.indexOf(s.c)>=0;
      if(r.done){
        if(picked&&isT)c.classList.add('hit');else if(isT)c.classList.add('miss');else if(picked)c.classList.add('bad');
        if(isT){var it=q.items.filter(function(i){return i.c===s.c})[0];pe.appendChild(c);pe.appendChild(el('span','fx',' → '+it.r+' '));return}
      }else{
        if(picked)c.classList.add('sel');
        c.onclick=function(){toggle(q,s.c)};
      }
      pe.appendChild(c);
    });
    ps.appendChild(pe)});
  var sub=$('submit'),cnt=$('cnt');
  if(r.done){sub.classList.add('hide');cnt.classList.add('hide');result(q)}
  else{sub.classList.remove('hide');cnt.classList.remove('hide');$('res').classList.add('hide');upd(q)}
}
function upd(q){var r=R(q),n=q.items.length;$('cnt').innerHTML='선택한 곳 <b>'+r.sel.length+'</b> / '+n+(r.sel.length?' · '+r.sel.slice().sort(function(a,b){return a-b}).map(function(c){return CIRC.charAt(c-1)}).join(' '):'');$('submit').disabled=r.sel.length!==n}
function toggle(q,c){
  var r=R(q);if(r.done)return;
  var i=r.sel.indexOf(c);
  if(i>=0)r.sel.splice(i,1);else{if(r.sel.length>=q.items.length)return;r.sel.push(c)}
  save();
  var e=document.querySelector('.cd[data-c="'+c+'"]');if(e)e.classList.toggle('sel',r.sel.indexOf(c)>=0);upd(q);
}
$('submit').onclick=function(){var q=qById(S.cur),r=R(q);if(r.sel.length!==q.items.length)return;r.done=true;if(!isOk(q)){var _k=(q.ko||'').replace(/\s+/g,' ');WN.add({kind:'L4',part:PART,act:'awk',qid:q.id,label:'어색한 곳('+(q.kind==='ctx'?'문맥':'어법')+') · '+_k.slice(0,16)+'…'})}
if(!S.marked&&Q.every(function(x){return R(x).done})){S.marked=1;if(!WN.MODE){try{if(window.PG)PG.mark(PGK)}catch(e){}}}save();draw(q);setTimeout(function(){var x=$('res');if(x.scrollIntoView)x.scrollIntoView({behavior:'smooth',block:'start'})},30)};
function result(q){
  var r=R(q),res=$('res');res.innerHTML='';res.classList.remove('hide');
  var T=truth(q),got=r.sel.filter(function(c){return T.indexOf(c)>=0}).length,ok=isOk(q);
  res.appendChild(el('div','verdict '+(ok?'ok':'ng'),ok?'○ 모두 맞았어요':'× 어색한 곳 '+q.items.length+'개 중 '+got+'개를 찾았어요'));
  q.items.forEach(function(it,ii){
    var d=el('div','it'),h=el('div','ih');
    h.appendChild(el('span','no','('+(ii+1)+')'));
    var hit=r.sel.indexOf(it.c)>=0;
    h.appendChild(el('span','tag '+(hit?'y':'n'),(hit?'찾았어요 ':'놓쳤어요 ')+CIRC.charAt(it.c-1)));
    var ia=el('span','ia');ia.appendChild(el('span','x',it.w));ia.appendChild(document.createTextNode(' '));ia.appendChild(el('em',null,'('+it.gw+')'));ia.appendChild(document.createTextNode(' → '));ia.appendChild(el('span','r',it.r));ia.appendChild(document.createTextNode(' '));ia.appendChild(el('em',null,'('+it.gr+')'));
    h.appendChild(ia);d.appendChild(h);
    var f=el('div','fix');
    if(it.fb)f.appendChild(html('span','l bad','<small>틀린 문장</small>'+it.fb));
    f.appendChild(html('span','l good','<small>고친 문장</small>'+it.fg));d.appendChild(f);
    d.appendChild(el('div','kot',it.ko));
    d.appendChild(html('div','why',it.why));
    res.appendChild(d)});
  var wrongPick=r.sel.filter(function(c){return T.indexOf(c)<0});
  if(wrongPick.length){res.appendChild(html('div','note','<b>잘못 고른 곳</b> '+wrongPick.map(function(c){return CIRC.charAt(c-1)}).join(' ')+'은(는) 글의 흐름과 문법에 맞는 표현이라 그대로 둬요.'))}
  if(WN.MODE){res.appendChild(html('div','note','이제 안 봐도 되는 문제는 <a href="../wrong.html" style="color:#0f766e;text-decoration:underline">오답 노트</a>에서 \'빼기\'로 뺄 수 있어요.'))}
  else if(WN.has('L4',PART,'awk',q.id)){res.appendChild(html('div','note','<a href="../wrong.html" style="color:#0f766e;text-decoration:underline">틀린 '+WN.ids('L4',PART,'awk').length+'개가 오답 노트에 담겼어요 ›</a>'))}
  res.appendChild(html('div','note','<b>글의 흐름</b> '+q.flow));
  res.appendChild(html('div','note','<b>그대로 두는 부분</b> '+q.keep));
  var kb=el('div','kobox');kb.textContent=q.ko;
  var row=el('div','row');
  var bk=el('button','btn','한글 해석 보기');bk.onclick=function(){var on=kb.classList.toggle('on');bk.textContent=on?'한글 해석 닫기':'한글 해석 보기'};
  res.appendChild(bk);res.appendChild(kb);
  var idx=Q.indexOf(q),nx=Q[idx+1];
  var again=el('button','big alt','이 문제 다시 풀기');again.onclick=function(){S.res[q.id]={sel:[],done:false};save();draw(q);window.scrollTo(0,0)};
  var next=el('button','big',nx?'다음 문제 · '+nm(nx):'목록으로');next.onclick=function(){if(nx)open(nx.id);else home()};
  row.appendChild(again);row.appendChild(next);res.appendChild(row);
}
$('toHome').onclick=home;
$('resetAll').onclick=function(){if(!confirm('푼 기록을 모두 지우고 처음부터 할까요?'))return;S={res:{},cur:null};save();home()};
if(S.cur&&qById(S.cur))open(S.cur);else home();
</script><script src="../../common/prog.js?v=261019"></script><script>if(!WN.MODE)PG.bar(PGK,"풀었어요")</script></body></html>
