<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f766e"><title>4과 본문과 다른 문장 찾기</title><style>
:root{--bg:#f6f8f7;--card:#fff;--ink:#16211f;--sub:#5a6b67;--line:#dbe4e1;--pri:#0f766e;--priL:#e3f3f0;--hi:#fff3bf;--hiInk:#7a4b00;--warn:#b45309;--warnL:#fff4e0;--red:#c0262d;--blue:#1d4ed8;--navy:#1e2a44;--ok:#15803d;--okL:#e4f5e8}

</style><link rel="icon" type="image/svg+xml" href="../icon.svg"><link rel="apple-touch-icon" href="../icon-180.png"><meta name="apple-mobile-web-app-title" content="주성고정답"></head><body><div class="wrap"><div class="top"><a class="back" href="../index.html">← 목록</a></div><h1 id="h"></h1><div class="sub">본문과 다른 문장을 찾아 눌러 보세요.</div><div class="how">문장을 누르면 본문 근거와 해설이 열려요. 본문과 다른 문장이면 초록색, 본문과 같은 내용이면 주황색으로 표시돼요. 맞는 문장도 눌러서 읽어 보면 본문이 더 잘 기억나요.</div><div class="nav" id="nav"></div><div id="root"></div><div class="foot">비타민 영어클리닉 · 주성고 영어II</div></div><script>
var D={"n": "4", "title": "4과 Breaking the Cycle (악순환 끊기)", "parts": [["❶", "본문 ❶"], ["❷", "본문 ❷"], ["❸", "본문 ❸"], ["❹~❺", "본문 ❹~❺"], ["❻", "본문 ❻"], ["❼", "본문 ❼"]], "groups": [{"part": "❶", "title": "노트북을 떨어뜨린 Liz", "flow": "Liz는 스터디 모임에 가던 길에 노트북을 떨어뜨려 심하게 망가뜨렸어요. 그래도 노트북은 켜지기는 해요. 다만 화면에 금이 가고 키 몇 개가 안 눌려요.", "items": [{"en": "Liz was going to a study group meeting when she accidentally dropped her laptop on the street.", "ans": "T", "ko": "Liz는 스터디 그룹 모임에 가는 중에 실수로 길에서 노트북을 떨어뜨렸다.", "eve": "On her way to a study group meeting, Liz accidentally dropped her laptop on the street, seriously damaging it.", "evk": "스터디 그룹 모임에 가는 길에, Liz는 실수로 그녀의 노트북을 길에 떨어뜨려 그것을 심각하게 손상시켰다.", "why": "**On her way to a study group meeting(스터디 그룹 모임에 가는 길에)**이 'Liz가 모임에 가던 중'이라는 뜻이에요. 그때 accidentally dropped her laptop(실수로 노트북을 떨어뜨렸다)이라고 해서 문장과 똑같아요. 'was going ... when ...(가던 중에 ~했다)'로 바꿔 쓴 맞는 문장이에요."}, {"en": "The laptop no longer turns on after Liz dropped it on the street.", "ans": "F", "ko": "노트북은 Liz가 길에 떨어뜨린 뒤로 더는 켜지지 않는다.", "eve": "Although it still turns on, the screen is cracked, and some keys are not working.", "evk": "그것은 여전히 켜지기는 하지만, 화면은 금이 갔고, 몇몇 키들은 작동하지 않는다.", "why": "본문은 **it still turns on(여전히 켜지기는 한다)**이에요. 'no longer turns on(더는 켜지지 않는다)'은 정반대예요. 화면은 깨졌고 키는 안 눌리지만, 켜지기는 한다는 게 Although(비록 ~이지만)의 뜻이에요."}]}, {"part": "❶", "title": "고칠까, 새로 살까", "flow": "Liz는 노트북을 수리할 수는 있지만 망설여요. 수리는 비싸고 오래 걸리는 데다 노트북도 5년이나 되었기 때문이에요. 그래서 새로 사는 게 합리적으로 보여요.", "items": [{"en": "Liz can get her laptop fixed, but she is hesitant to have it repaired.", "ans": "T", "ko": "Liz는 노트북을 수리받을 수 있지만, 수리를 맡기기를 망설인다.", "eve": "She can have it repaired, but she is hesitating to do so.", "evk": "그녀는 그것을 수리할 수 있지만, 그렇게 하기를 망설이고 있다.", "why": "**she is hesitating to do so(그렇게 하기를 망설이고 있다)**에서 do so가 '수리받는 것'이에요. hesitant (망설이는)로 바꿔 쓴 맞는 문장이에요. but(하지만) 앞에서 '고칠 수는 있다'고 했으니 뒤는 '그런데 망설인다'로 이어져요."}, {"en": "Repairing a laptop can be costly and time-consuming in some cases.", "ans": "T", "ko": "어떤 경우에는 노트북 수리가 돈이 많이 들고 시간도 오래 걸릴 수 있다.", "eve": "Sometimes repairs are expensive, and they often take a long time.", "evk": "때때로 수리 작업은 돈이 많이 들고, 보통 오랜 시간이 걸린다.", "why": "본문의 **Sometimes repairs are expensive, and they often take a long time(때때로 수리는 비싸고 보통 오래 걸린다)**과 같아요. costly(비용이 많이 드는)는 expensive의 다른 말, time-consuming(시간이 많이 걸리는)은 take a long time의 다른 말이에요."}, {"en": "Liz’s laptop is relatively new, having been purchased less than a year ago.", "ans": "F", "ko": "Liz의 노트북은 산 지 1년이 안 된 비교적 새것이다.", "eve": "Besides, the laptop is about five years old.", "evk": "게다가 그 노트북은 5년 정도 되었다.", "why": "본문은 **the laptop is about five years old(그 노트북은 5년 정도 되었다)**예요. 'less than a year ago(1년도 안 된)'는 틀려요. Besides(게다가)로 '낡았다'는 이유를 하나 더 보태는 문장이에요."}, {"en": "Buying a new laptop instead of repairing the old one could seem like a sensible choice.", "ans": "T", "ko": "오래된 노트북을 수리하는 대신 새 노트북을 사는 것이 합리적인 선택으로 보일 수 있다.", "eve": "In this case, getting rid of the old one and purchasing a new one might seem like a more reasonable option.", "evk": "이 경우에 오래된 노트북은 버리고 새로운 것을 구입하는 것이 더 합리적인 선택처럼 보일 수 있다.", "why": "**might seem like a more reasonable option(더 합리적인 선택처럼 보일 수 있다)**과 같은 내용이에요. sensible choice(분별 있는 선택)는 reasonable option(합리적인 선택)의 다른 말이에요. 수리는 비싸고 오래 걸리고 노트북도 낡았으니 그렇게 보인다는 뜻이에요."}]}, {"part": "❶", "title": "그래도 최선은 아닐 수 있다", "flow": "새로 사는 것이 합리적으로 보이지만, 그건 최선이 아닐 수 있어요. 오래된 노트북을 쓰레기통에 버리면 전자 쓰레기 문제를 더 키우기 때문이에요.", "items": [{"en": "Actually, replacing the old laptop might not be the best option.", "ans": "T", "ko": "사실 오래된 노트북을 교체하는 것은 최선의 선택이 아닐 수 있다.", "eve": "In reality, however, it may not be the best thing to do.", "evk": "하지만 실제로는 그것이 최선이 아닐 수 있다.", "why": "**In reality, however, it may not be the best thing to do(하지만 실제로는 그것이 최선이 아닐 수 있다)**와 같아요. 앞에서 '새로 사는 게 합리적으로 보인다'고 한 뒤 however(하지만)로 뒤집은 문장이에요. it은 '새것을 사는 것'을 가리켜요."}, {"en": "Throwing the laptop into the trash adds to the serious problem of electronic waste.", "ans": "T", "ko": "노트북을 쓰레기통에 버리는 것은 전자 쓰레기라는 심각한 문제를 키운다.", "eve": "If Liz throws her laptop in the trash, she will be contributing to a serious problem: e-waste.", "evk": "만약 Liz가 그녀의 노트북을 쓰레기통에 버린다면, 그녀는 전자 쓰레기라는 심각한 문제에 기여하게 될 것이다.", "why": "**she will be contributing to a serious problem: e-waste(그녀는 전자 쓰레기라는 심각한 문제에 기여하게 될 것이다)**와 같아요. contribute to (~에 기여하다)가 여기서는 나쁜 문제를 '키운다'는 뜻으로 쓰였고, adds to (~을 더하다)로 바꿔 쓴 맞는 문장이에요."}]}, {"part": "❷", "title": "전자 쓰레기란?", "flow": "글쓴이가 질문으로 시작해요. 전자 쓰레기는 버려진 전자 장치와 전기 기기를 뜻하는 말이에요.", "items": [{"en": "The writer asks about the definition of e-waste.", "ans": "T", "ko": "글쓴이는 전자 쓰레기가 무엇인지 뜻을 묻고 있다.", "eve": "What exactly is e-waste?", "evk": "전자 쓰레기란 정확히 무엇인가?", "why": "**What exactly is e-waste?(전자 쓰레기란 정확히 무엇인가?)**가 첫 문장이에요. 'asks about the definition(뜻을 묻는다)'과 같아요. 질문으로 먼저 관심을 끌고 바로 다음 문장에서 답해 주는 글이에요."}, {"en": "E-waste consists of electronic devices and electrical appliances that have been thrown away.", "ans": "T", "ko": "전자 쓰레기는 버려진 전자 장치와 전기 기기로 이루어져 있다.", "eve": "The term refers to discarded electronic devices and electrical appliances.", "evk": "이 용어는 버려진 전자 장치와 전기 기기를 나타낸다.", "why": "**refers to discarded electronic devices and electrical appliances(버려진 전자 장치와 전기 기기를 나타낸다)**와 같아요. discarded (버려진)를 that have been thrown away (버려진)로 풀어 쓴 맞는 문장이에요."}]}, {"part": "❷", "title": "왜 위험하고 얼마나 늘까", "flow": "전자 쓰레기에는 납 같은 독성 물질이 들어 있어서 건강과 환경에 위험해요. 게다가 해마다 늘어나는 속도가 걱정스러울 정도예요.", "items": [{"en": "E-waste is harmless because electronic devices contain no dangerous toxic materials.", "ans": "F", "ko": "전자 쓰레기는 전자 기기에 위험한 독성 물질이 없기 때문에 해롭지 않다.", "eve": "Due to toxic materials contained in these products, such as lead, e-waste is a serious health and environmental hazard.", "evk": "이 제품들에 포함된 납과 같은 유독성 물질 때문에 전자 쓰레기는 심각한 건강 및 환경 위험 요소이다.", "why": "본문은 **Due to toxic materials contained in these products, such as lead(납과 같은 유독성 물질 때문에)**예요. 독성 물질이 '들어 있어서' 위험하다는 글인데, 'contain no dangerous toxic materials(위험한 독성 물질이 없다)'와 'harmless(해롭지 않은)'는 정반대예요."}, {"en": "The amount of e-waste generated each year is increasing at a worrying rate.", "ans": "T", "ko": "해마다 발생하는 전자 쓰레기의 양은 걱정스러운 속도로 늘고 있다.", "eve": "To make matters worse, the amount of e-waste produced each year is increasing at an alarming rate.", "evk": "설상가상으로, 매년 생산되는 전자 쓰레기의 양은 걱정스러운 속도로 증가하고 있다.", "why": "**increasing at an alarming rate(걱정스러운 속도로 증가하고 있다)**와 같아요. worrying (걱정스러운)은 alarming (불안하게 만드는)의 다른 말이에요. To make matters worse(설상가상으로) 뒤에 나오는 나쁜 소식이에요."}]}, {"part": "❷", "title": "숫자로 보는 전자 쓰레기", "flow": "2021년의 전자 쓰레기는 2014년보다 37% 늘었어요. 전문가들은 2030년에는 16년 만에 두 배가 될 거라고 예측해요.", "items": [{"en": "Global e-waste production in 2021 was lower than in the year 2014.", "ans": "F", "ko": "2021년의 세계 전자 쓰레기 발생량은 2014년보다 적었다.", "eve": "In 2021, a total of 57.4 million metric tons of e-waste was generated worldwide, which was a 37% increase from 2014, the year when data about e-waste was first collected.", "evk": "2021년에 전 세계적으로 총 5,740만 메트릭톤의 전자 쓰레기가 발생했는데, 이는 전자 쓰레기에 대한 자료가 처음으로 수집된 해인 2014년에 비해 37% 증가한 것이다.", "why": "본문은 **a 37% increase from 2014(2014년보다 37% 증가)**예요. 2021년이 2014년보다 더 많아요. 'lower than(더 낮은)'은 반대예요. increase(증가)와 decrease(감소)를 바꿔 놓은 대표적인 함정이에요."}, {"en": "The annual amount of e-waste is expected to double by 2030 compared to 2014 levels.", "ans": "T", "ko": "연간 전자 쓰레기의 양이 2014년 수준과 비교해 2030년까지 두 배가 될 것으로 예상된다.", "eve": "In 2021, a total of 57.4 million metric tons of e-waste was generated worldwide, which was a 37% increase from 2014, the year when data about e-waste was first collected. Experts predict that by 2030, the amount of e-waste generated annually will have doubled in just 16 years.", "evk": "2021년에 전 세계적으로 총 5,740만 메트릭톤의 전자 쓰레기가 발생했는데, 이는 전자 쓰레기에 대한 자료가 처음으로 수집된 해인 2014년에 비해 37% 증가한 것이다. 전문가들은 2030년에는 매년 발생하는 전자 쓰레기의 양이 단 16년 만에 두 배가 될 것으로 예측한다.", "why": "**by 2030 ... will have doubled in just 16 years(2030년에는 단 16년 만에 두 배가 될 것이다)**와 같아요. 자료를 처음 모은 해가 2014년이고, 2014년에서 2030년까지가 16년이라서 '2014년 수준과 비교해 두 배'라는 말이 맞아요."}]}, {"part": "❷", "title": "문제를 풀려는 노력", "flow": "그래서 전 세계가 이 문제를 해결하려고 노력하고 있어요. 대부분은 제품을 수리하기 쉽게 만드는 데 집중하고 있어요.", "items": [{"en": "Current efforts to address e-waste usually ignore the issue of repairability.", "ans": "F", "ko": "전자 쓰레기를 해결하려는 지금의 노력은 대개 수리 가능성 문제를 무시한다.", "eve": "For this reason, efforts are being made to address this problem, most of which are focused on making products easier to repair.", "evk": "이러한 이유로 이 문제를 다루기 위해 노력이 이루어지고 있는데, 이 중 대부분은 제품들을 수리하기 더 쉽게 만드는 것에 중점을 두고 있다.", "why": "본문은 **most of which are focused on making products easier to repair(그 대부분은 제품을 수리하기 더 쉽게 만드는 데 중점을 둔다)**예요. 수리하기 쉽게 만드는 것이 노력의 중심이에요. 'ignore the issue of repairability(수리 가능성 문제를 무시한다)'는 정반대예요."}, {"en": "Practical ways to tackle e-waste in different parts of the world will be explored.", "ans": "T", "ko": "세계 여러 곳에서 전자 쓰레기를 다루는 현실적인 방법들을 살펴볼 것이다.", "eve": "Let’s take a look at some practical approaches from around the world.", "evk": "전 세계의 현실성 있는 접근법을 몇 가지 살펴보자.", "why": "**Let's take a look at some practical approaches from around the world(전 세계의 현실성 있는 접근법을 몇 가지 살펴보자)**와 같아요. tackle (다루다)은 address (다루다)의 다른 말이고, practical ways (현실적인 방법들)는 practical approaches (현실성 있는 접근법)와 같아요."}]}, {"part": "❸", "title": "사람들이 기기를 버리는 이유", "flow": "사람들이 고장 난 기기를 버리는 이유는 고치기가 너무 어렵기 때문이에요. 분해하기도 어렵고 공식 수리소로만 가야 하는 경우도 있어요.", "items": [{"en": "Many people throw away damaged devices due to repair difficulties.", "ans": "T", "ko": "많은 사람이 수리하기 어려워서 고장 난 기기를 버린다.", "eve": "One reason many people dispose of their damaged devices is that they are too difficult to repair.", "evk": "많은 사람이 그들의 고장 난 장치들을 버리는 한 가지 이유는 그것들이 수리하기 너무 어렵기 때문이다.", "why": "**One reason many people dispose of their damaged devices is that they are too difficult to repair(많은 사람이 기기를 버리는 한 가지 이유는 고치기 너무 어렵기 때문이다)**와 같아요. throw away (버리다)는 dispose of (버리다)의 다른 말이에요."}, {"en": "A device might be hard to disassemble or need to be taken to an official service center.", "ans": "T", "ko": "어떤 기기는 분해하기 어렵거나 공식 서비스 센터로 가져가야 할 수 있다.", "eve": "For example, a device may be difficult to disassemble, or its manufacturer may require that it be brought to an official service center to be fixed.", "evk": "예를 들어, 어떤 장치는 분해하기 어려울 수 있고, 또는 그것의 제조사가 그것을 고치려면 공식 수리소로 가져올 것을 요구할 수도 있다.", "why": "**a device may be difficult to disassemble, or its manufacturer may require that it be brought to an official service center(분해하기 어렵거나, 제조사가 공식 수리소로 가져오라고 요구할 수 있다)**와 같아요. 두 가지 어려움이 or(또는)로 이어진 문장이에요."}]}, {"part": "❸", "title": "수리를 막는 장벽들", "flow": "회사들은 고객이 다른 수리점에 가는 것을 허용하지 않아요. 일부러 고치기 어렵게 만든 제품도 있고, 설명서와 부품을 구하기도 어려워요.", "items": [{"en": "Companies usually encourage customers to use third-party repair shops.", "ans": "F", "ko": "회사들은 대개 고객이 제삼자 수리점을 이용하도록 권장한다.", "eve": "Many companies do not allow their customers to take their damaged items to third-party repair shops.", "evk": "많은 회사는 그들의 고객들이 고장 난 물건들을 제삼자의 수리점으로 가지고 가는 것을 허용하지 않는다.", "why": "본문은 **Many companies do not allow their customers to take their damaged items to third-party repair shops(많은 회사는 고객이 제삼자 수리점에 가져가는 것을 허용하지 않는다)**예요. do not allow (허용하지 않는다)인데 encourage (권장하다)라고 했으니 반대예요."}, {"en": "Some products are purposely designed so that they cannot be repaired easily.", "ans": "T", "ko": "어떤 제품들은 쉽게 수리되지 못하도록 일부러 만들어진다.", "eve": "What is more, some products are intentionally designed to be difficult to repair.", "evk": "게다가, 몇몇 제품은 의도적으로 수리하기 어렵게 만들어진다.", "why": "**some products are intentionally designed to be difficult to repair(몇몇 제품은 의도적으로 수리하기 어렵게 만들어진다)**와 같아요. purposely (일부러)는 intentionally (의도적으로)의 다른 말이에요."}, {"en": "Consumers easily obtain repair manuals and necessary replacement parts.", "ans": "F", "ko": "소비자들은 수리 설명서와 필요한 교체 부품을 쉽게 구한다.", "eve": "It is common for consumers to be unable to acquire the instructions for how to fix their items or the parts needed to complete repairs.", "evk": "소비자들이 그들의 물건을 고치는 방법에 대한 설명이나 수리를 완료하기 위해 필요한 부품들을 얻지 못하는 것은 흔하다.", "why": "본문은 **It is common for consumers to be unable to acquire the instructions ... or the parts(소비자가 설명서나 부품을 얻지 못하는 것은 흔하다)**예요. '못 구하는 게 흔하다'는 글인데 'easily obtain(쉽게 구한다)'이라고 하면 반대예요."}]}, {"part": "❸", "title": "수리할 권리 운동", "flow": "수리할 권리 운동은 법을 만들어서 이 문제를 풀려고 해요. 제품 주인은 직접 고치거나 원하는 기술자에게 맡길 권리가 있다는 내용이에요. 이 운동은 소비자를 위해 네 가지를 요구해요.", "items": [{"en": "The right-to-repair movement aims to let owners fix their devices.", "ans": "T", "ko": "수리할 권리 운동은 제품 주인이 자기 기기를 직접 고칠 수 있게 하는 것을 목표로 한다.", "eve": "The right-to-repair movement is trying to solve these problems by promoting legislation that states the following: If you own a product, you have the right to fix it yourself or bring it to a technician of your choice.", "evk": "수리할 권리 운동은 다음 내용을 명시하는 법률 제정을 추진함으로써 이러한 문제들을 해결하려고 하고 있는데, 그것은 만약 당신이 어떤 제품을 소유하고 있다면, 당신은 그것을 직접 고치거나 당신이 선택한 기술자에게 가지고 갈 권리가 있다는 내용이다.", "why": "**If you own a product, you have the right to fix it yourself(제품을 소유하면 직접 고칠 권리가 있다)**가 법률의 핵심이에요. 'aims to let owners fix their devices(주인이 기기를 고치게 하려는 목표)'와 같아요."}, {"en": "The right-to-repair movement makes three major demands to protect consumers.", "ans": "F", "ko": "수리할 권리 운동은 소비자를 보호하기 위해 세 가지 주요 요구를 한다.", "eve": "To protect the rights of consumers, the right-to-repair movement demands four things.", "evk": "소비자의 권리를 보호하기 위해, 수리할 권리 운동은 네 가지를 요구한다.", "why": "본문은 **the right-to-repair movement demands four things(수리할 권리 운동은 네 가지를 요구한다)**예요. three(세 가지)가 아니라 four(네 가지)예요. 뒤에 First, Second, Third, Finally로 네 개가 이어져요."}, {"en": "Companies must make product information available to everyone.", "ans": "T", "ko": "회사들은 제품 정보를 모두가 이용할 수 있게 해야 한다.", "eve": "First, companies must make information about their products available to everyone.", "evk": "첫 번째로, 회사들은 그들의 제품에 대한 정보를 모두가 이용할 수 있게 해야 한다.", "why": "**First, companies must make information about their products available to everyone(첫 번째로, 회사들은 제품 정보를 모두가 이용할 수 있게 해야 한다)**와 같아요. 네 가지 요구 중 첫 번째예요."}]}, {"part": "❸", "title": "네 가지 요구 ② ③", "flow": "두 번째 요구는 개인도 수리에 필요한 부품과 도구를 구할 수 있어야 한다는 거예요. 세 번째 요구는 소비자가 자기 기기에 소프트웨어를 설치하지 못하게 막는 관행을 법으로 금지하는 거예요.", "items": [{"en": "Individuals should be able to get necessary parts for repairs.", "ans": "T", "ko": "개인은 수리에 필요한 부품을 구할 수 있어야 한다.", "eve": "Second, third parties, including individuals, should be able to obtain the parts and tools required to make repairs.", "evk": "두 번째로, 개인을 포함한 제삼자가 수리를 하기 위해 필요한 부품들과 도구들을 구할 수 있어야 한다.", "why": "**third parties, including individuals, should be able to obtain the parts and tools required to make repairs(개인을 포함한 제삼자가 수리에 필요한 부품과 도구를 구할 수 있어야 한다)**와 같아요."}, {"en": "Laws should allow companies to block custom software installation.", "ans": "F", "ko": "법은 회사가 맞춤형 소프트웨어 설치를 막는 것을 허용해야 한다.", "eve": "Third, the practice of preventing consumers from installing custom software on their own devices should be prohibited by law.", "evk": "세 번째로, 소비자들이 맞춤형 소프트웨어를 자신의 장치에 설치하지 못하게 하는 행위는 법으로 금지되어야 한다.", "why": "본문은 **the practice of preventing consumers from installing custom software ... should be prohibited by law(소비자가 소프트웨어를 설치하지 못하게 하는 행위는 법으로 금지되어야 한다)**예요. 막는 행위를 '금지'해야 한다는 건데, 'allow companies to block(회사가 막도록 허용)'은 정반대예요."}]}, {"part": "❸", "title": "네 가지 요구 ④와 성과", "flow": "마지막 요구는 제조사가 수리를 최대한 쉽게 만들도록 설계하라는 거예요. 이 목표들이 이루어지면 전자 쓰레기가 훨씬 줄고, 미국의 40개 이상 주가 이미 법을 준비하기 시작했어요.", "items": [{"en": "Manufacturers should design their products to make repairs very easy.", "ans": "T", "ko": "제조사들은 수리를 아주 쉽게 만들도록 제품을 설계해야 한다.", "eve": "Finally, it demands that manufacturers design devices in a way that makes repairs as easy as possible.", "evk": "마지막으로, 그것은 제조사들에게 수리를 최대한 쉽게 만드는 방식으로 장치를 설계할 것을 요구한다.", "why": "**manufacturers design devices in a way that makes repairs as easy as possible(제조사들이 수리를 최대한 쉽게 만드는 방식으로 장치를 설계한다)**와 같아요. as easy as possible (가능한 한 쉬운)을 very easy (아주 쉬운)로 바꿔 쓴 맞는 문장이에요."}, {"en": "Accomplishing all the goals of the right-to-repair movement will produce much less electronic waste.", "ans": "T", "ko": "수리할 권리 운동의 모든 목표가 이루어지면 전자 쓰레기가 훨씬 적게 생길 것이다.", "eve": "Advocates of the movement say that if all these goals are accomplished, far less e-waste will be generated.", "evk": "이 운동의 지지자들은 만약 이 모든 목표가 이루어진다면, 훨씬 적은 전자 쓰레기가 발생할 것이라고 말한다.", "why": "**if all these goals are accomplished, far less e-waste will be generated(이 모든 목표가 이루어지면 훨씬 적은 전자 쓰레기가 발생할 것이다)**와 같아요. far less (훨씬 적은)가 much less (훨씬 적은)로 바뀌었을 뿐이에요."}, {"en": "Less than 40 American states have started working on right-to-repair legislation.", "ans": "F", "ko": "미국의 40개 미만의 주가 수리할 권리 법률을 준비하기 시작했다.", "eve": "Thanks to their efforts, more than 40 states in the U.S. have begun working on right-to-repair legislation.", "evk": "그들의 노력 덕분에 미국 40개 이상의 주에서 수리할 권리 법률 제정을 위해 노력하기 시작했다.", "why": "본문은 **more than 40 states in the U.S. have begun working on right-to-repair legislation(미국 40개 이상의 주가 법률 제정에 노력하기 시작했다)**예요. 'Less than(~보다 적은)'은 more than (~보다 많은)의 반대예요. 숫자 표현을 바꿔 놓은 함정이에요."}]}, {"part": "❸", "title": "유럽으로 퍼지는 운동", "flow": "이 운동은 미국을 넘어 유럽에서도 영향력이 커지고 있어요. 점점 더 많은 나라가 함께하고 있어요.", "items": [{"en": "The right-to-repair movement is currently losing its popularity in Europe.", "ans": "F", "ko": "수리할 권리 운동은 지금 유럽에서 인기를 잃고 있다.", "eve": "This movement is gaining a growing influence in Europe as well, with more and more countries joining the cause.", "evk": "이 운동은 점점 더 많은 국가들이 그 대의에 동참하면서 유럽에서도 영향력이 커지고 있다.", "why": "본문은 **This movement is gaining a growing influence in Europe as well(이 운동은 유럽에서도 영향력이 커지고 있다)**이에요. gaining a growing influence (커지는 영향력을 얻는다)와 'losing its popularity(인기를 잃는다)'는 정반대예요. 뒤의 more and more countries joining(점점 더 많은 나라가 동참)도 커지는 모습이에요."}]}, {"part": "❹~❺", "title": "프랑스의 새 법안", "flow": "2021년 1월에 프랑스가 법안을 통과시켰어요. 제조사가 다섯 종류의 제품에 수리 가능성 지수를 붙여야 하는 법이에요.", "items": [{"en": "France requires a repairability index for five types of electronic devices and electrical appliances.", "ans": "T", "ko": "프랑스는 다섯 종류의 전자 장치와 전기 기기에 수리 가능성 지수를 요구한다.", "eve": "In January 2021, the French government passed a bill that requires that every manufacturer include a “repairability index” on five categories of electronic devices and electrical appliances: smartphones, laptops, washing machines, televisions, and lawn mowers.", "evk": "2021년 1월, 프랑스 정부는 모든 제조사가 스마트폰, 노트북, 세탁기, 텔레비전, 그리고 잔디 깎는 기계라는 다섯 가지 종류의 전자 장치와 전자 기기에 ‘수리 가능성 지수’를 포함시킬 것을 요구하는 법안을 통과시켰다.", "why": "**requires that every manufacturer include a repairability index on five categories(모든 제조사가 다섯 가지 종류에 수리 가능성 지수를 포함시킬 것을 요구한다)**와 같아요. 다섯 가지는 스마트폰, 노트북, 세탁기, 텔레비전, 잔디 깎는 기계예요."}]}, {"part": "❹~❺", "title": "점수와 색깔로 알려 주는 지수", "flow": "지수는 0에서 10 사이의 점수와 색깔로 표시해요. 소비자는 사기 전에 이 제품이 얼마나 쉽게 수리되는지 알 수 있어요.", "items": [{"en": "The score and color system inform consumers about repairability before consumers make a purchase.", "ans": "T", "ko": "점수와 색깔 체계는 소비자가 구매하기 전에 수리 가능성을 알려 준다.", "eve": "Using a score ranging from 0 to 10, as well as a color-coded system, the index lets consumers see how easily the product can be repaired before they purchase it.", "evk": "그 지수는 색상으로 표시되는 시스템뿐만 아니라 0에서 10 사이의 점수도 사용하여 소비자들이 제품을 구입하기 전에 그것이 얼마나 쉽게 수리될 수 있는지 알 수 있게 해 준다.", "why": "**the index lets consumers see how easily the product can be repaired before they purchase it(그 지수는 소비자가 구입하기 전에 얼마나 쉽게 수리되는지 알 수 있게 해 준다)**와 같아요. 점수(score)와 색깔(color-coded system)이 둘 다 쓰인다고 앞부분에 있어요."}]}, {"part": "❹~❺", "title": "지수가 보는 것과 라벨 읽는 법", "flow": "지수는 수리 정보를 얻을 수 있는지, 분해가 쉬운지, 부품 값이 얼마인지를 따져요. 초록색 라벨의 높은 숫자는 수리하기 쉽다는 뜻이고, 빨간색 라벨의 낮은 숫자는 어렵다는 뜻이에요.", "items": [{"en": "The repairability index considers repair information availability and spare part prices.", "ans": "T", "ko": "수리 가능성 지수는 수리 정보를 얻을 수 있는지와 여분 부품의 가격을 고려한다.", "eve": "The index takes into account several elements, including the availability of repair information, the ease of disassembly, and the price of spare parts.", "evk": "그 지수는 수리 정보의 이용 가능성, 분해의 용이성, 그리고 여분 부품의 가격을 포함하여 몇 가지 요소를 고려한다.", "why": "**the availability of repair information, the ease of disassembly, and the price of spare parts(수리 정보의 이용 가능성, 분해의 용이성, 여분 부품의 가격)**가 지수가 보는 요소예요. 두 가지를 골라 쓴 맞는 문장이에요."}, {"en": "A green label with a high score indicates that the product is difficult to repair.", "ans": "F", "ko": "높은 점수의 초록색 라벨은 그 제품이 수리하기 어렵다는 것을 나타낸다.", "eve": "A low number on a bright red label means that repairing the product will be difficult, whereas a high number on a green label indicates that the product is easy to repair.", "evk": "초록색 라벨의 높은 숫자는 그 제품이 수리하기 쉽다는 것을 나타내는 데에 반하여, 밝은 빨간색 라벨의 낮은 숫자는 그 제품을 수리하는 것이 어려울 것이라는 것을 의미한다.", "why": "본문은 **a high number on a green label indicates that the product is easy to repair(초록색 라벨의 높은 숫자는 제품이 수리하기 쉽다는 것을 나타낸다)**예요. 어렵다는 건 낮은 숫자의 밝은 빨간색 라벨이에요. 쉬움과 어려움을 바꿔 놓은 함정이에요."}]}, {"part": "❹~❺", "title": "지수의 두 가지 좋은 효과", "flow": "지수는 두 가지 긍정적인 효과를 노리고 만들어졌어요. 첫째는 소비자가 정보를 알고 고르게 하는 거예요.", "items": [{"en": "The index aims to deliver two beneficial results.", "ans": "T", "ko": "지수는 두 가지 이로운 결과를 주려는 목적이 있다.", "eve": "The index was designed to have two positive effects.", "evk": "그 지수는 두 가지의 긍정적인 효과를 가지도록 만들어졌다.", "why": "**The index was designed to have two positive effects(그 지수는 두 가지의 긍정적인 효과를 가지도록 만들어졌다)**와 같아요. beneficial results (이로운 결과)는 positive effects (긍정적인 효과)와 같은 뜻이에요."}, {"en": "The index helps consumers make informed choices when buying appliances.", "ans": "T", "ko": "지수는 소비자가 기기를 살 때 정보에 근거해 고를 수 있게 돕는다.", "eve": "Firstly, it allows consumers to make informed decisions when purchasing new devices and appliances.", "evk": "첫 번째로, 그것은 소비자들이 새로운 장치와 기기를 구입할 때 정보에 근거한 결정을 내릴 수 있도록 한다.", "why": "**it allows consumers to make informed decisions when purchasing new devices and appliances(소비자가 새 장치를 구입할 때 정보에 근거한 결정을 내릴 수 있게 한다)**와 같아요. 첫 번째 효과예요."}]}, {"part": "❹~❺", "title": "둘째 효과와 그 영향", "flow": "둘째로 지수는 제조사가 제품을 더 수리하기 쉽게 만들도록 장려해요. 그 결과 쓰레기 매립지로 가는 제품이 줄어서 프랑스는 더 지속 가능한 사회로 갈 수 있어요. 게다가 영향은 프랑스 밖으로 퍼질 가능성이 있어요.", "items": [{"en": "The index prevents companies from making products easier to repair.", "ans": "F", "ko": "지수는 회사들이 제품을 수리하기 쉽게 만드는 것을 막는다.", "eve": "Secondly, it encourages manufacturers to make their products easier to repair.", "evk": "두 번째로, 그것은 제조사들이 자신의 제품을 수리하기 더 쉽게 만들도록 장려한다.", "why": "본문은 **it encourages manufacturers to make their products easier to repair(제조사들이 제품을 수리하기 더 쉽게 만들도록 장려한다)**예요. encourages (장려한다)인데 prevents (막는다)라고 하면 반대예요. 두 번째 '긍정적 효과'가 이 문장이에요."}, {"en": "France expects to become more sustainable by reducing landfill waste.", "ans": "T", "ko": "프랑스는 쓰레기 매립지의 쓰레기를 줄여 더 지속 가능해질 것으로 기대한다.", "eve": "As a result, with fewer electronic and electrical items ending up in its landfills, France can expect to make a transition to a more sustainable society in the near future.", "evk": "결과적으로, 더 적은 전자 및 전기 제품들이 쓰레기 매립지에 이르게 되면서, 프랑스는 가까운 미래에 더 지속 가능한 사회로 변화할 것을 기대할 수 있다.", "why": "**with fewer electronic and electrical items ending up in its landfills, France can expect to make a transition to a more sustainable society(매립지에 이르는 제품이 줄면서 프랑스는 더 지속 가능한 사회로 변화할 것을 기대할 수 있다)**와 같아요."}, {"en": "The repairability index will only affect the market within France.", "ans": "F", "ko": "수리 가능성 지수는 프랑스 안의 시장에만 영향을 줄 것이다.", "eve": "The impact of the index, however, is likely to spread far beyond France.", "evk": "하지만 그 지수의 영향은 프랑스를 넘어 더 멀리 퍼질 가능성이 있다.", "why": "본문은 **The impact of the index, however, is likely to spread far beyond France(그 지수의 영향은 프랑스를 넘어 더 멀리 퍼질 가능성이 있다)**예요. 'only ... within France(프랑스 안에서만)'는 반대예요. 프랑스에서 팔려는 외국 회사도 라벨을 붙여야 해서 영향이 밖으로 번져요."}]}, {"part": "❹~❺", "title": "세계 시장과 프랑스의 선례", "flow": "프랑스 시장에서 팔고 싶은 회사는 모두 지수에 따라 라벨을 붙여야 해요. 이 지수가 성공하면 더 많은 나라가 프랑스를 따라 할 수 있어요.", "items": [{"en": "Companies can sell appliances in France without using the index label.", "ans": "F", "ko": "회사들은 지수 라벨 없이도 프랑스에서 기기를 팔 수 있다.", "eve": "We live in a global economy, and any company that wants to sell its appliances on the French market will need to label its products according to the repairability index.", "evk": "우리는 세계 경제 속에 살고 있으며, 프랑스 시장에서 기기를 판매하고 싶은 모든 회사는 그들의 제품에 수리 가능성 지수에 따라 라벨을 붙여야 할 것이다.", "why": "본문은 **any company that wants to sell its appliances on the French market will need to label its products according to the repairability index(프랑스 시장에서 팔고 싶은 모든 회사는 지수에 따라 라벨을 붙여야 한다)**예요. will need to (~해야 할 것이다)이므로 'without ... label(라벨 없이)'은 틀려요."}, {"en": "Other nations may adopt similar repairability policies if France succeeds.", "ans": "T", "ko": "프랑스가 성공하면 다른 나라들도 비슷한 수리 가능성 정책을 받아들일 수 있다.", "eve": "If the index is successful, we can anticipate seeing more countries around the world following France’s innovative lead.", "evk": "만약 이 지수가 성공적이라면, 우리는 전 세계의 더 많은 나라들이 프랑스의 혁신적인 선례를 따르는 것을 보길 기대할 수 있다.", "why": "**If the index is successful, we can anticipate seeing more countries around the world following France's innovative lead(지수가 성공하면 더 많은 나라가 프랑스의 선례를 따르는 것을 기대할 수 있다)**와 같아요."}]}, {"part": "❻", "title": "수리 카페가 시작된 이유", "flow": "사람들에게 알맞은 도구, 재료, 조언이 주어지면 전자 제품의 손상을 직접 고칠 수 있어요. 그래서 수리 카페가 시작되었어요.", "items": [{"en": "Consumers can repair many damaged electronic products with proper tools and advice.", "ans": "T", "ko": "소비자는 알맞은 도구와 조언이 있으면 많은 고장 난 전자 제품을 수리할 수 있다.", "eve": "When consumers are given the right tools and materials, along with some helpful advice, they can repair much of the damage that occurs to electronic products by themselves.", "evk": "소비자들에게 유용한 조언과 함께 알맞은 도구와 재료가 주어지면, 그들은 전자 제품에 발생하는 대부분의 손상을 직접 수리할 수 있다.", "why": "**When consumers are given the right tools and materials, along with some helpful advice, they can repair much of the damage(알맞은 도구와 재료, 유용한 조언이 주어지면 손상의 대부분을 직접 수리할 수 있다)**와 같아요."}, {"en": "Repair Cafés were created to help people repair their broken electronic devices.", "ans": "T", "ko": "수리 카페는 사람들이 고장 난 전자 기기를 고치도록 돕기 위해 만들어졌다.", "eve": "That is why Repair Cafés were started. They are free meeting places where people can gather together and fix their broken devices.", "evk": "그것이 수리 카페가 시작된 이유이다. 그곳은 사람들이 함께 모여 자신들의 고장 난 장치들을 고칠 수 있는 자유로운 만남의 장소이다.", "why": "**That is why Repair Cafés were started(그것이 수리 카페가 시작된 이유이다)**와 바로 뒤의 **fix their broken devices(자신들의 고장 난 장치를 고친다)**가 근거예요. 도구와 조언을 제공해서 사람들이 직접 고치게 하려고 만든 곳이에요."}]}, {"part": "❻", "title": "수리 카페는 어떤 곳일까", "flow": "수리 카페는 누구나 모여서 고장 난 기기를 고치는 무료 장소예요. 자원봉사 전문가가 조언하고 가르쳐 줘요. 첫 수리 카페는 2009년 암스테르담에서 열렸어요.", "items": [{"en": "Repair Cafés are exclusive places where only certain people can repair devices.", "ans": "F", "ko": "수리 카페는 특정한 사람들만 기기를 고칠 수 있는 폐쇄적인 장소이다.", "eve": "They are free meeting places where people can gather together and fix their broken devices.", "evk": "그곳은 사람들이 함께 모여 자신들의 고장 난 장치들을 고칠 수 있는 자유로운 만남의 장소이다.", "why": "본문은 **They are free meeting places where people can gather together and fix their broken devices(사람들이 함께 모여 고장 난 장치를 고칠 수 있는 자유로운 만남의 장소)**예요. free (무료의)이고 people (사람들)이 모일 수 있으니 'exclusive(배타적인)'는 틀려요."}, {"en": "Volunteer experts at Repair Cafés provide technical advice and teach repair skills.", "ans": "T", "ko": "수리 카페의 자원봉사 전문가들은 기술적인 조언을 주고 수리하는 법을 가르쳐 준다.", "eve": "The cafés are staffed by volunteer experts who can give technical advice and teach people how to fix things.", "evk": "그 카페들은 기술적인 조언을 줄 수 있고, 사람들에게 물건을 고치는 방법을 가르쳐 줄 수 있는 자원봉사자 전문가들을 직원으로 두고 있다.", "why": "**staffed by volunteer experts who can give technical advice and teach people how to fix things(기술적인 조언을 주고 물건 고치는 법을 가르쳐 주는 자원봉사자 전문가들이 일한다)**와 같아요."}, {"en": "The first Repair Café opened in Amsterdam, the Netherlands, in 2009.", "ans": "T", "ko": "첫 번째 수리 카페는 2009년에 네덜란드 암스테르담에서 열렸다.", "eve": "The first Repair Café was opened in the Netherlands in the city of Amsterdam in 2009.", "evk": "가장 첫 번째 수리 카페는 네덜란드의 도시 암스테르담에서 2009년에 열렸다.", "why": "**The first Repair Café was opened in the Netherlands in the city of Amsterdam in 2009(첫 수리 카페는 2009년 네덜란드의 암스테르담에서 열렸다)**와 같아요. 장소와 연도가 모두 일치해요."}]}, {"part": "❻", "title": "빠르게 퍼진 수리 카페", "flow": "첫 수리 카페는 크게 성공해서 곧 이웃 나라로 퍼졌고, 얼마 뒤에는 30개국이 넘는 곳에 생겼어요. 수리 카페는 고장 난 물건이 쓰레기가 되는 것도 막아 줘요.", "items": [{"en": "The successful idea of Repair Cafés in Amsterdam quickly spread to nearby countries.", "ans": "T", "ko": "암스테르담에서 성공한 수리 카페 아이디어는 곧 이웃 나라들로 퍼졌다.", "eve": "It was such a success that the idea soon spread to neighboring countries.", "evk": "그것은 너무 성공적이어서 그 아이디어가 곧 이웃 나라들로 확산되었다.", "why": "**It was such a success that the idea soon spread to neighboring countries(너무 성공적이어서 그 아이디어가 곧 이웃 나라들로 퍼졌다)**와 같아요. nearby (근처의)는 neighboring (이웃의)의 다른 말이에요."}, {"en": "Repair Cafés soon became available in fewer than thirty countries worldwide.", "ans": "F", "ko": "수리 카페는 곧 전 세계 30개국 미만에서 이용할 수 있게 되었다.", "eve": "Before long, there were Repair Cafés in over 30 countries around the world.", "evk": "얼마 후, 전 세계 30개국 이상에 수리 카페가 생겼다.", "why": "본문은 **there were Repair Cafés in over 30 countries(30개국 이상에 수리 카페가 생겼다)**예요. 'fewer than thirty(30개 미만)'는 over 30 (30개 이상)과 반대예요. 숫자 표현을 바꿔 놓은 함정이에요."}, {"en": "Repair Cafés help prevent damaged electronics from becoming e-waste.", "ans": "T", "ko": "수리 카페는 고장 난 전자 제품이 전자 쓰레기가 되는 것을 막는 데 도움을 준다.", "eve": "Along with preventing damaged items from becoming e-waste, these cafés also encourage people to share their invaluable skills and knowledge about the repair and maintenance of electronics.", "evk": "고장 난 물건들이 전자 쓰레기가 되는 것을 막는 것과 더불어, 이 카페들은 또한 사람들이 전자 제품의 수리와 보수 관리에 대한 매우 유용한 기술들과 지식을 공유할 수 있도록 장려한다.", "why": "**Along with preventing damaged items from becoming e-waste(고장 난 물건이 전자 쓰레기가 되는 것을 막는 것과 더불어)**가 근거예요. 수리 카페가 하는 일 중 하나가 이거예요."}]}, {"part": "❻", "title": "커지는 인기와 긍정적 영향", "flow": "수리 카페는 계속 인기를 얻고 있고 자원봉사자도 늘고 있어요. 사람들이 기기를 오래 쓰게 도와주고, 지속 가능한 관점을 키워서 미래에 좋은 영향을 줘요.", "items": [{"en": "The number of people volunteering at Repair Cafés has remained unchanged.", "ans": "F", "ko": "수리 카페에서 자원봉사하는 사람의 수는 변함없이 그대로이다.", "eve": "They continue to grow in popularity, with more and more people signing up to volunteer.", "evk": "점점 더 많은 사람들이 자원봉사를 하기 위해 신청하면서, 이 카페들은 계속해서 인기를 얻고 있다.", "why": "본문은 **with more and more people signing up to volunteer(점점 더 많은 사람이 자원봉사를 신청하면서)**예요. more and more (점점 더 많은)이라서 늘고 있어요. 'remained unchanged(변하지 않았다)'는 틀려요."}, {"en": "Repair Cafés help people maintain devices and extend their useful life spans.", "ans": "T", "ko": "수리 카페는 사람들이 기기를 유지하고 수명을 늘리도록 돕는다.", "eve": "By providing spaces where people can learn, Repair Cafés enable individuals to maintain their devices and extend their life spans.", "evk": "사람들이 배울 수 있는 공간을 제공함으로써, 수리 카페들은 개인이 자신들의 장치를 유지하고 그것들의 수명을 연장할 수 있게 한다.", "why": "**enable individuals to maintain their devices and extend their life spans(개인이 자신의 장치를 유지하고 수명을 연장할 수 있게 한다)**와 같아요. useful life spans (쓸모 있는 수명)는 life spans (수명)와 같은 뜻이에요."}, {"en": "Repair Cafés promote a sustainable perspective that may positively affect our future.", "ans": "T", "ko": "수리 카페는 우리 미래에 긍정적인 영향을 줄 수 있는 지속 가능한 관점을 키운다.", "eve": "Furthermore, they foster a sustainable perspective that can have a huge positive impact on our future.", "evk": "게다가 그것들은 우리의 미래에 막대한 긍정적인 영향을 미칠 수 있는 지속 가능한 관점을 조성한다.", "why": "**they foster a sustainable perspective that can have a huge positive impact on our future(미래에 막대한 긍정적 영향을 미칠 수 있는 지속 가능한 관점을 조성한다)**와 같아요. promote (장려하다)는 foster (키우다)의 다른 말이에요."}]}, {"part": "❼", "title": "다시 Liz 이야기로", "flow": "글쓴이가 다시 Liz를 떠올리게 해요. 그리고 Liz가 수리가 일상인 세상에 살고 있다고 상상해 보라고 해요. 실제 이야기가 아니라 상상이에요.", "items": [{"en": "The writer asks if you remember Liz, who dropped her laptop.", "ans": "T", "ko": "글쓴이는 노트북을 떨어뜨린 Liz를 기억하느냐고 묻는다.", "eve": "Do you remember Liz, the girl who dropped her laptop?", "evk": "노트북을 떨어뜨렸던 소녀 Liz를 기억하는가?", "why": "**Do you remember Liz, the girl who dropped her laptop?(노트북을 떨어뜨렸던 소녀 Liz를 기억하는가?)**와 같아요. 글 처음의 이야기로 돌아가는 질문이에요."}, {"en": "Liz is currently living in a world where fixing damaged devices is normal.", "ans": "F", "ko": "Liz는 지금 손상된 기기를 고치는 것이 평범한 세상에 살고 있다.", "eve": "Imagine she lived in a world where repairing damaged devices and appliances was simply part of everyday life.", "evk": "그녀가 손상된 장치와 기기를 수리하는 것이 그저 일상의 한 부분인 세상에 살고 있었다고 상상해 보라.", "why": "본문은 **Imagine she lived in a world where repairing damaged devices ... was simply part of everyday life(그녀가 수리하는 것이 일상인 세상에 살고 있었다고 상상해 보라)**예요. 상상(Imagine)일 뿐이라서 'currently living(현재 살고 있다)'은 틀려요."}]}, {"part": "❼", "title": "수리가 일상인 세상의 Liz", "flow": "그런 세상이라면 Liz의 선택지는 비싼 수리나 새로 사기뿐이 아니에요. 인터넷으로 부품을 주문해 직접 바꿀 수도 있고, 가까운 수리 카페에서 조언을 얻을 수도 있어요.", "items": [{"en": "In the imagined world, Liz would have options beyond paying for expensive repairs or buying a new laptop.", "ans": "T", "ko": "상상 속의 세상에서 Liz는 비싼 수리나 새 노트북 구입 외의 선택지도 가질 것이다.", "eve": "If that were the case, her options wouldn’t be limited to paying for expensive repairs or throwing away her laptop and buying a new one.", "evk": "만약 그랬다면, 그녀의 선택지는 비싼 수리를 위해 비용을 지불하거나 노트북을 버리고 새것을 사는 것으로 제한되지는 않았을 것이다.", "why": "**her options wouldn't be limited to paying for expensive repairs or throwing away her laptop and buying a new one(선택지가 비싼 수리나 새것을 사는 것으로 제한되지는 않았을 것이다)**와 같아요. 제한되지 않는다는 말은 그 밖의 선택지도 있다는 뜻이에요."}, {"en": "Liz would have to go abroad to buy replacement parts for her laptop.", "ans": "F", "ko": "Liz는 노트북 교체 부품을 사려고 해외에 가야 할 것이다.", "eve": "She would be able to order the necessary parts online and replace them herself.", "evk": "그녀는 인터넷에서 필요한 부품들을 주문하고, 그것들을 직접 교체할 수 있었을 것이다.", "why": "본문은 **She would be able to order the necessary parts online and replace them herself(인터넷에서 부품을 주문하고 직접 교체할 수 있었을 것이다)**예요. 인터넷으로 주문하는 거라 해외에 가야 한다는 말은 틀려요."}, {"en": "Liz could visit a Repair Café for repair advice on her device.", "ans": "T", "ko": "Liz는 기기 수리에 대한 조언을 얻으려고 수리 카페를 방문할 수 있다.", "eve": "Alternatively, she could bring her damaged device to the nearest Repair Café to get advice on how to fix it.", "evk": "그렇지 않으면, 그녀는 그것을 고치는 방법에 대한 조언을 얻기 위해 고장 난 장치를 가장 가까운 수리 카페에 가지고 갈 수도 있었을 것이다.", "why": "**she could bring her damaged device to the nearest Repair Café to get advice on how to fix it(고치는 방법에 대한 조언을 얻으려고 가장 가까운 수리 카페에 가져갈 수 있었을 것이다)**와 같아요."}]}, {"part": "❼", "title": "우리가 누릴 수 있는 미래", "flow": "그런 세상에서는 수리하기 쉬운 노트북을 샀을 거예요. 이 지속 가능한 세상은 우리가 함께 노력하면 누릴 수 있는 미래이고, 전자 쓰레기가 훨씬 줄어서 지구가 더 깨끗해져요.", "items": [{"en": "Liz likely would have purchased a laptop that is very difficult to repair.", "ans": "F", "ko": "Liz는 수리하기 아주 어려운 노트북을 샀을 가능성이 높다.", "eve": "Repairing it probably wouldn’t be very hard, and she likely would have purchased a laptop with a high repairability score.", "evk": "그녀는 높은 수리 가능성 점수를 가진 노트북을 구매했을 것이기 때문에, 그것을 수리하는 것은 아마 아주 어렵지는 않았을 것이다.", "why": "본문은 **she likely would have purchased a laptop with a high repairability score(수리 가능성 점수가 높은 노트북을 샀을 것이다)**예요. 점수가 높으면 수리하기 쉬워요. 'very difficult to repair(수리하기 아주 어려운)'는 반대예요."}, {"en": "Everyone can enjoy the sustainable world in the future if people work toward it together.", "ans": "T", "ko": "사람들이 함께 노력하면 모두가 미래에 지속 가능한 세상을 누릴 수 있다.", "eve": "In fact, this sustainable world is a future we can all enjoy if we work toward it together.", "evk": "사실, 이 지속 가능한 세상은 우리가 그것을 향해 함께 노력한다면 우리 모두가 누릴 수 있는 미래이다.", "why": "**this sustainable world is a future we can all enjoy if we work toward it together(이 지속 가능한 세상은 우리가 함께 노력하면 모두가 누릴 수 있는 미래이다)**와 같아요."}, {"en": "People in the sustainable world will produce much less electronic waste.", "ans": "T", "ko": "지속 가능한 세상의 사람들은 전자 쓰레기를 훨씬 적게 만들어 낼 것이다.", "eve": "Even more importantly, it is a future in which people will generate far less e-waste, making our planet a cleaner, healthier place for everyone.", "evk": "훨씬 더 중요한 것은 그것은 사람들이 훨씬 적은 전자 쓰레기를 발생시킬 미래이며, 이는 우리의 지구를 모두를 위한 더 깨끗하고 건강한 곳으로 만들 것이라는 것이다.", "why": "**it is a future in which people will generate far less e-waste(사람들이 훨씬 적은 전자 쓰레기를 발생시킬 미래)**와 같아요. produce (만들어 내다)는 generate (발생시키다)의 다른 말이에요."}]}]};

var secs={};
D.parts.forEach(function(p){var b=el('button',null,p[1]);b.onclick=function(){secs[p[0]].scrollIntoView({behavior:'smooth',block:'start'})};nav.appendChild(b)});
var bClose=el('button','closeall','답 모두 닫기');bClose.onclick=function(){S={};save();paint();window.scrollTo({top:0,behavior:'smooth'})};nav.insertBefore(bClose,nav.firstChild);nav.appendChild(prog);
var cards=[];
D.parts.forEach(function(p){
  var h=el('h2',null,p[1]);root.appendChild(h);secs[p[0]]=h;
  D.groups.forEach(function(g,gi){
    if(g.part!==p[0])return;
    var card=el('div','grp'),head=el('div','gh');
    head.appendChild(el('div','gt',g.title));
    var cnt=el('span','cnt','');head.appendChild(cnt);card.appendChild(head);
    var nF=g.items.filter(function(i){return i.ans==='F'}).length;
    card.appendChild(el('div','ask',nF?('본문과 다른 문장이 '+nF+'개 있어요. 찾아서 눌러 보세요.'):'본문과 다른 문장이 있을 수도, 없을 수도 있어요. 모두 눌러서 확인해 보세요.'));
    var btns=[];
    g.items.forEach(function(it,ii){
      var b=el('div','it');b.setAttribute('role','button');b.tabIndex=0;
      var line=el('div');line.appendChild(el('span','no',(ii+1)+'.'));line.appendChild(document.createTextNode(' '+it.en));b.appendChild(line);
      var pn=el('div','pn');
      pn.appendChild(el('div','ko',it.ko));
      var ev=el('div','ev');ev.appendChild(el('span','e',it.eve));if(it.evk)ev.appendChild(el('span','k',it.evk));
      pn.appendChild(el('span','tag','본문 근거'));pn.appendChild(ev);
      pn.appendChild(el('span','tag','해설'));var w=el('div','why');rich(w,it.why);pn.appendChild(w);
      b.appendChild(pn);
      var id=gi+'-'+ii;
      function open(){
        if(b.classList.contains('open'))return;
        S[id]=1;save();paint();
      }
      b.onclick=open;b.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}};
      card.appendChild(b);btns.push({b:b,id:id,it:it,pn:pn});
    });
    var tools=el('div','tools');
    var bAll=el('button',null,'나머지 해설 모두 열기');bAll.onclick=function(){btns.forEach(function(x){S[x.id]=1});save();paint()};
    var bReset=el('button',null,'이 소단락 다시 하기');bReset.onclick=function(){btns.forEach(function(x){delete S[x.id]});save();paint()};
    tools.appendChild(bAll);tools.appendChild(bReset);card.appendChild(tools);
    var flow=el('div','flow');flow.appendChild(el('span','tag','이 소단락 정리'));flow.appendChild(document.createTextNode(g.flow));card.appendChild(flow);
    root.appendChild(card);
    cards.push({g:g,btns:btns,cnt:cnt,flow:flow,nF:nF});
  });
});
function paint(){
  var done=0;
  cards.forEach(function(c){
    var found=0,all=true;
    c.btns.forEach(function(x){
      var o=!!S[x.id];
      x.b.classList.toggle('open',o);
      x.b.classList.remove('ok','no2');
      var old=x.b.querySelector('.badge');if(old)old.remove();
      if(o){
        var f=x.it.ans==='F';x.b.classList.add(f?'ok':'no2');
        if(f)found++;
        var bd=el('span','badge',f?'✔ 본문과 다른 문장 · 잘 찾았어요':'본문과 같은 내용이에요 · 맞는 문장');
        x.b.insertBefore(bd,x.pn);
      }
      if(!o)all=false;
    });
    var fin=found===c.nF&&(c.nF>0||c.btns.every(function(x){return !!S[x.id]}));
    c.cnt.textContent=c.nF?('다른 문장 '+found+'/'+c.nF+' 찾음'):(c.btns.every(function(x){return !!S[x.id]})?'모두 확인':'확인 중');
    c.cnt.classList.toggle('done',fin);
    c.flow.classList.toggle('on',fin);
    if(fin)done++;
  });
  prog.textContent='소단락 '+done+'/'+cards.length+' 확인';
}
paint();
