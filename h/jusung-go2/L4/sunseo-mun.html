<h1>교과서 4과 · 순서배열 · 문장 단위 + 문장삽입</h1><p class="lede">(가) 영어 문장 3개 순서 쌓기, (나) 문장 삽입.</p>
<div id="mockinfo"></div>
<div class="how">(가)는 주어진 문장 다음에 올 <b>영어 문장</b>을 순서대로 쌓고 <b>제출</b>해요. (나)는 주어진 문장이 들어갈 자리 ①~⑤를 눌러요. 이 문제는 <b>매번 바뀌어요</b>. 풀다가 나가도 풀던 곳에서 이어서 풀 수 있어요.</div>
<div class="bar"><span id="cnt"></span><span class="sp"></span><button id="kt" type="button">한글 해석 보기</button><button id="rs" type="button">새 문제로 다시 풀기</button></div>
<div id="stage"></div>
<div class="foot">비타민 영어클리닉 · 주성고 영어II</div></div>
<a class="homefab" href="../index.html">⌂ 목록</a>
<script>
/* 문제 생성 로직 (순수 함수, DOM 없음). 브라우저(HTML 안에 삽입)와 node(sim.js) 양쪽에서 쓴다. */
(function (root) {
  'use strict';
  var G = {};
  G.SIZES = { ko: 6, mg: 4, mi: 4, abc: 6, blank: 8 };
  G.ABC_OPTS = ['ACB', 'BAC', 'BCA', 'CAB', 'CBA']; // 시험처럼 (A)(B)(C) 그대로인 순서는 없다
  var NEED = { ko: 'ko', mg: 'mun', mi: 'mun', abc: 'abc', blank: 'blank' };

  function rr(rnd) { return rnd || Math.random; }
  G.rint = function (n, rnd) { return Math.floor(rr(rnd)() * n); };
  G.shuffle = function (a, rnd) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(rr(rnd)() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  };
  G.sample = function (a, k, rnd) { return G.shuffle(a, rnd).slice(0, k); };
  G.byId = function (D) { var m = {}; D.passages.forEach(function (p) { m[p.id] = p; }); return m; };

  /* ---------- 가능한 모양 ---------- */
  G.windows = function (ps) { // 주어진 첫 문장 a + 이어지는 3문장 (link 3개 모두 true)
    var L = ps.link, n = ps.en.length, r = [];
    for (var a = 0; a + 3 < n; a++) if (L[a] && L[a + 1] && L[a + 2]) r.push(a);
    return r;
  };
  G.shapes = function (ps) { // ABC: [c0,c1,c2]
    var L = ps.link, n = ps.en.length, r = [];
    for (var c0 = 0; c0 <= n - 4; c0++) {
      if (!L[c0]) continue;
      for (var c1 = c0 + 1; c1 <= n - 3; c1++) {
        if (!L[c1]) continue;
        for (var c2 = c1 + 1; c2 <= n - 2; c2++) {
          if (!L[c2]) continue;
          var x = c1 - c0, y = c2 - c1, z = n - 1 - c2;
          if (Math.max(x, y, z) - Math.min(x, y, z) <= 1) r.push([c0, c1, c2]);
        }
      }
    }
    return r;
  };
  G.insList = function (ps) {
    var n = ps.en.length, L = ps.link;
    return (ps.ins || []).filter(function (j) {
      return j >= 1 && j <= n - 1 && L[j - 1] && (j >= n - 1 || L[j]);
    });
  };

  /* ---------- 카탈로그: 앱별 (지문, 문제 정체성) 목록 ---------- */
  G.catalog = function (D, app) {
    var need = NEED[app], out = [];
    D.passages.forEach(function (ps, pi) {
      if ((ps.modes || []).indexOf(need) < 0) return;
      var items = [], id = ps.id;
      if (app === 'ko' || app === 'mg') {
        G.windows(ps).forEach(function (a) { items.push({ id: id + '|' + app + '|' + a, a: a }); });
      } else if (app === 'mi') {
        if (ps.en.length >= 5) G.insList(ps).forEach(function (j) { items.push({ id: id + '|mi|' + j, j: j }); });
      } else if (app === 'abc') {
        if (ps.en.length >= 7) G.shapes(ps).forEach(function (c) { items.push({ id: id + '|abc|' + c.join(','), c: c }); });
      } else if (app === 'blank') {
        (ps.blanks || []).forEach(function (b, bi) {
          if (ps.en[b.s] && ps.en[b.s].indexOf(b.ans) >= 0 && b.opts && b.opts.length === 4)
            items.push({ id: id + '|blank|' + bi, bi: bi });
        });
      }
      if (items.length) out.push({ pi: pi, cls: ps.taught === true ? 'T' : 'U', items: items });
    });
    return out;
  };

  function wchoice(ws, rnd) {
    var t = 0, i; for (i = 0; i < ws.length; i++) t += ws[i];
    var r = rr(rnd)() * t;
    for (i = 0; i < ws.length; i++) { r -= ws[i]; if (r < 0) return i; }
    return ws.length - 1;
  }

  /* ---------- 한 판 계획: 약 2/3 수업에서 다룬 지문, 안 쓴 문제 우선 ---------- */
  G.planSet = function (entries, usedMap, n, rnd, prevPi, carry) {
    var used = {}, k;
    for (k in usedMap) used[k] = 1;
    var inSet = {}, setPis = {}, picks = [], reset = false;
    var hasT = entries.some(function (e) { return e.cls === 'T'; });
    var hasU = entries.some(function (e) { return e.cls === 'U'; });
    var plan = [], i;
    if (hasT && hasU) {
      var nT = Math.round(n * 2 / 3);
      for (i = 0; i < n; i++) plan.push(i < nT ? 'T' : 'U');
      plan = G.shuffle(plan, rnd);
    } else for (i = 0; i < n; i++) plan.push(hasT ? 'T' : 'U');
    function avail(cls) {
      var r = [];
      entries.forEach(function (e) {
        if (cls && e.cls !== cls) return;
        var free = e.items.filter(function (it) { return !used[it.id] && !inSet[it.id]; });
        if (free.length) r.push({ e: e, free: free });
      });
      return r;
    }
    var prev = prevPi == null ? -1 : prevPi;
    for (k = 0; k < n; k++) {
      var cl = plan[k], oth = cl === 'T' ? 'U' : 'T';
      var av = avail(cl);
      if (!av.length) av = avail(oth);
      if (!av.length) { // 한 바퀴 끝: 직전에 쓴 문제(최대 carry*n개)는 계속 막고 나머지(가장 오래된 것)부터 다시 쓴다 -> 5판 안 겹침 유지
        var mine = {}; entries.forEach(function (e) { e.items.forEach(function (it) { mine[it.id] = 1; }); });
        var all = Object.keys(used), others = all.filter(function (x) { return !mine[x]; }), keys = all.filter(function (x) { return mine[x]; });
        var c = Math.min(keys.length, carry == null ? 0 : carry * n), need = n - k;
        reset = true;
        for (;;) {
          used = {}; others.forEach(function (x) { used[x] = 1; });
          keys.slice(keys.length - c).forEach(function (x) { used[x] = 1; });
          var tot = 0; avail(null).forEach(function (x) { tot += x.free.length; });
          if (tot >= need || c <= 0) break;
          c--;
        }
        av = avail(cl); if (!av.length) av = avail(oth);
      }
      if (!av.length) { // 가능한 모양이 한 판보다 적다: 어쩔 수 없이 겹침 허용
        av = entries.map(function (e) { return { e: e, free: e.items }; });
      }
      if (av.length > 1) {
        var f = av.filter(function (x) { return x.e.pi !== prev; });
        if (f.length) av = f;
      }
      var ws = av.map(function (x) { return Math.sqrt(x.free.length) * (setPis[x.e.pi] ? 0.35 : 1); });
      var ch = av[wchoice(ws, rnd)];
      var it = ch.free[G.rint(ch.free.length, rnd)];
      inSet[it.id] = 1; setPis[ch.e.pi] = 1; prev = ch.e.pi;
      picks.push({ pi: ch.e.pi, item: it });
    }
    picks.forEach(function (p) { used[p.item.id] = 1; });
    return { picks: picks, used: used, reset: reset };
  };

  /* ---------- 정답 번호 수열: 고르게, 연속 같은 번호 없이 ---------- */
  G.ansSeq = function (n, rnd) {
    var out = [], bag = [], last = -1;
    while (out.length < n) {
      if (!bag.length) bag = G.shuffle([1, 2, 3, 4, 5], rnd);
      var idx = -1;
      for (var i = bag.length - 1; i >= 0; i--) if (bag[i] !== last) { idx = i; break; }
      if (idx < 0) { bag = bag.concat(G.shuffle([1, 2, 3, 4, 5].filter(function (v) { return v !== last; }), rnd)); idx = bag.length - 1; }
      last = bag.splice(idx, 1)[0]; out.push(last);
    }
    return out;
  };

  /* ---------- 문제 만들기 ---------- */
  G.makeSeq = function (kind, ps, item, rnd) {
    var a = item.a, idx = [a + 1, a + 2, a + 3], pool, t = 0;
    do { pool = G.shuffle(idx, rnd); t++; } while (t < 30 && pool.join() === idx.join());
    return { k: kind, pid: ps.id, a: a, pool: pool };
  };
  G.makeAbc = function (ps, item, ans) {
    return { k: 'abc', pid: ps.id, cuts: item.c.slice(), ans: ans };
  };
  G.abcParts = function (ps, p) { // 주어진 글 / 세 덩어리(문장 번호 목록) / 라벨

var DATA={"set":"L4","title":"교과서 4과","passages":[{"id":"L4-1","label":"4과 ❶ 순환 끊기: 노트북을 떨어뜨린 Liz","taught":null,"modes":["ko","abc","mun","blank"],"en":["On her way to a study group meeting, Liz accidentally dropped her laptop on the street, seriously damaging it.","Although it still turns on, the screen is cracked, and some keys are not working.","She can have it repaired, but she is hesitating to do so.","Sometimes repairs are expensive, and they often take a long time.","Besides, the laptop is about five years old.","In this case, getting rid of the old one and purchasing a new one might seem like a more reasonable option.","In reality, however, it may not be the best thing to do.","If Liz throws her laptop in the trash, she will be contributing to a serious problem: e-waste."],"ko":["스터디 그룹 모임에 가는 길에, Liz는 실수로 그녀의 노트북을 길에 떨어뜨려 그것을 심각하게 손상시켰다.","그것은 여전히 켜지기는 하지만, 화면은 금이 갔고, 몇몇 키들은 작동하지 않는다.","그녀는 그것을 수리할 수 있지만, 그렇게 하기를 망설이고 있다.","때때로 수리 작업은 돈이 많이 들고, 보통 오랜 시간이 걸린다.","게다가 그 노트북은 5년 정도 되었다.","이 경우에 오래된 노트북은 버리고 새로운 것을 구입하는 것이 더 합리적인 선택처럼 보일 수 있다.","하지만 실제로는 그것이 최선이 아닐 수 있다.","만약 Liz가 그녀의 노트북을 쓰레기통에 버린다면, 그녀는 전자 쓰레기라는 심각한 문제에 기여하게 될 것이다."],"key":[["","Liz가 노트북을 떨어뜨려 심하게 망가뜨림"],["Although(비록 ~이지만)","켜지긴 해도 화면이 깨지고 키가 안 눌림"],["","수리할 수 있지만 망설이는 중"],["","수리는 비싸고 오래 걸림(망설이는 이유)"],["Besides(게다가)","노트북이 이미 5년이나 됨"],["In this case(이 경우)","낡은 것 버리고 새로 사는 편이 합리적으로 보임"],["In reality, however(하지만 실제로는)","그것이 최선이 아닐 수 있음"],["","버리면 전자 쓰레기 문제에 기여하게 됨"]],"link":[true,false,true,true,true,true,true],"ins":[4,5,6]},{"id":"L4-2","label":"4과 ❷ 순환 끊기: 전자 쓰레기란 무엇인가","taught":null,"modes":["ko","abc","mun","blank"],"en":["What exactly is e-waste?","The term refers to discarded electronic devices and electrical appliances.","Due to toxic materials contained in these products, such as lead, e-waste is a serious health and environmental hazard.","To make matters worse, the amount of e-waste produced each year is increasing at an alarming rate.","In 2021, a total of 57.4 million metric tons of e-waste was generated worldwide, which was a 37% increase from 2014, the year when data about e-waste was first collected.","Experts predict that by 2030, the amount of e-waste generated annually will have doubled in just 16 years.","For this reason, efforts are being made to address this problem, most of which are focused on making products easier to repair.","Let’s take a look at some practical approaches from around the world."],"ko":["전자 쓰레기란 정확히 무엇인가?","이 용어는 버려진 전자 장치와 전기 기기를 나타낸다.","이 제품들에 포함된 납과 같은 유독성 물질 때문에 전자 쓰레기는 심각한 건강 및 환경 위험 요소이다.","설상가상으로, 매년 생산되는 전자 쓰레기의 양은 걱정스러운 속도로 증가하고 있다.","2021년에 전 세계적으로 총 5,740만 메트릭톤의 전자 쓰레기가 발생했는데, 이는 전자 쓰레기에 대한 자료가 처음으로 수집된 해인 2014년에 비해 37% 증가한 것이다.","전문가들은 2030년에는 매년 발생하는 전자 쓰레기의 양이 단 16년 만에 두 배가 될 것으로 예측한다.","이러한 이유로 이 문제를 다루기 위해 노력이 이루어지고 있는데, 이 중 대부분은 제품들을 수리하기 더 쉽게 만드는 것에 중점을 두고 있다.","전 세계의 현실성 있는 접근법을 몇 가지 살펴보자."],"key":[["","전자 쓰레기가 무엇인지 묻는 질문"],["","버려진 전자 장치와 전기 기기를 뜻함"],["","납 같은 독성 물질 때문에 건강·환경에 위험"],["To make matters worse(설상가상으로)","해마다 걱정스러운 속도로 늘어남"],["","2021년 5,740만 톤, 2014년보다 37% 증가"],["","2030년엔 16년 만에 두 배가 될 전망"],["For this reason(이러한 이유로)","수리하기 쉽게 만드는 데 노력이 집중됨"],["","세계의 현실적인 접근법을 살펴보자는 예고"]],"link":[true,true,true,true,false,true,true],"ins":[2,3,6]},{"id":"L4-4","label":"4과 ❹ 수리할 권리 운동: 네 가지 요구","taught":null,"modes":["ko","abc","mun","blank"],"en":["First, companies must make information about their products available to everyone.","Second, third parties, including individuals, should be able to obtain the parts and tools required to make repairs.","Third, the practice of preventing consumers from installing custom software on their own devices should be prohibited by law.","Finally, it demands that manufacturers design devices in a way that makes repairs as easy as possible.","Advocates of the movement say that if all these goals are accomplished, far less e-waste will be generated.","Thanks to their efforts, more than 40 states in the U.S. have begun working on right-to-repair legislation.","This movement is gaining a growing influence in Europe as well, with more and more countries joining the cause."],"ko":["첫 번째로, 회사들은 그들의 제품에 대한 정보를 모두가 이용할 수 있게 해야 한다.","두 번째로, 개인을 포함한 제삼자가 수리를 하기 위해 필요한 부품들과 도구들을 구할 수 있어야 한다.","세 번째로, 소비자들이 맞춤형 소프트웨어를 자신의 장치에 설치하지 못하게 하는 행위는 법으로 금지되어야 한다.","마지막으로, 그것은 제조사들에게 수리를 최대한 쉽게 만드는 방식으로 장치를 설계할 것을 요구한다.","이 운동의 지지자들은 만약 이 모든 목표가 이루어진다면, 훨씬 적은 전자 쓰레기가 발생할 것이라고 말한다.","그들의 노력 덕분에 미국 40개 이상의 주에서 수리할 권리 법률 제정을 위해 노력하기 시작했다.","이 운동은 점점 더 많은 국가들이 그 대의에 동참하면서 유럽에서도 영향력이 커지고 있다."],"key":[["First(첫 번째로)","제품 정보를 모두가 이용할 수 있어야 함"],["Second(두 번째로)","제삼자도 수리용 부품·도구를 구할 수 있어야 함"],["Third(세 번째로)","맞춤형 소프트웨어 설치를 막는 행위는 법으로 금지"],["Finally(마지막으로)","제조사가 수리 쉽게 설계하도록 요구"],["","이 목표들이 이뤄지면 전자 쓰레기가 크게 줄 것"],["","그들의 노력으로 미국 40개 주 이상이 법 제정 시작"],["","유럽에서도 점점 더 많은 나라가 동참"]],"link":[true,true,true,true,true,true],"ins":[1,2,3,4,5]},{"id":"L4-5","label":"4과 ❺ 수리 가능성 지수: 한눈에 보는 정보","taught":null,"modes":["ko","abc","mun","blank"],"en":["In January 2021, the French government passed a bill that requires that every manufacturer include a “repairability index” on five categories of electronic devices and electrical appliances: smartphones, laptops, washing machines, televisions, and lawn mowers.","Using a score ranging from 0 to 10, as well as a color-coded system, the index lets consumers see how easily the product can be repaired before they purchase it.","The index takes into account several elements, including the availability of repair information, the ease of disassembly, and the price of spare parts.","A low number on a bright red label means that repairing the product will be difficult, whereas a high number on a green label indicates that the product is easy to repair.","The index was designed to have two positive effects.","Firstly, it allows consumers to make informed decisions when purchasing new devices and appliances.","Secondly, it encourages manufacturers to make their products easier to repair.","As a result, with fewer electronic and electrical items ending up in its landfills, France can expect to make a transition to a more sustainable society in the near future.","The impact of the index, however, is likely to spread far beyond France.","We live in a global economy, and any company that wants to sell its appliances on the French market will need to label its products according to the repairability index.","If the index is successful, we can anticipate seeing more countries around the world following France’s innovative lead."],"ko":["2021년 1월, 프랑스 정부는 모든 제조사가 스마트폰, 노트북, 세탁기, 텔레비전, 그리고 잔디 깎는 기계라는 다섯 가지 종류의 전자 장치와 전자 기기에 ‘수리 가능성 지수’를 포함시킬 것을 요구하는 법안을 통과시켰다.","그 지수는 색상으로 표시되는 시스템뿐만 아니라 0에서 10 사이의 점수도 사용하여 소비자들이 제품을 구입하기 전에 그것이 얼마나 쉽게 수리될 수 있는지 알 수 있게 해 준다.","그 지수는 수리 정보의 이용 가능성, 분해의 용이성, 그리고 여분 부품의 가격을 포함하여 몇 가지 요소를 고려한다.","초록색 라벨의 높은 숫자는 그 제품이 수리하기 쉽다는 것을 나타내는 데에 반하여, 밝은 빨간색 라벨의 낮은 숫자는 그 제품을 수리하는 것이 어려울 것이라는 것을 의미한다.","그 지수는 두 가지의 긍정적인 효과를 가지도록 만들어졌다.","첫 번째로, 그것은 소비자들이 새로운 장치와 기기를 구입할 때 정보에 근거한 결정을 내릴 수 있도록 한다.","두 번째로, 그것은 제조사들이 자신의 제품을 수리하기 더 쉽게 만들도록 장려한다.","결과적으로, 더 적은 전자 및 전기 제품들이 쓰레기 매립지에 이르게 되면서, 프랑스는 가까운 미래에 더 지속 가능한 사회로 변화할 것을 기대할 수 있다.","하지만 그 지수의 영향은 프랑스를 넘어 더 멀리 퍼질 가능성이 있다.","우리는 세계 경제 속에 살고 있으며, 프랑스 시장에서 기기를 판매하고 싶은 모든 회사는 그들의 제품에 수리 가능성 지수에 따라 라벨을 붙여야 할 것이다.","만약 이 지수가 성공적이라면, 우리는 전 세계의 더 많은 나라들이 프랑스의 혁신적인 선례를 따르는 것을 보길 기대할 수 있다."],"key":[["","프랑스가 제조사에 수리 가능성 지수 표시를 의무화"],["","점수와 색상으로 수리가 얼마나 쉬운지 보여 줌"],["","수리 정보·분해 용이성·부품 가격 등을 고려"],["","낮은 빨간 라벨은 수리 어려움, 높은 초록 라벨은 쉬움"],["","지수가 노리는 긍정적 효과는 두 가지"],["Firstly(첫 번째로)","소비자가 정보에 근거해 구매 결정"],["Secondly(두 번째로)","제조사가 수리하기 쉬운 제품을 만들도록 장려"],["As a result(결과적으로)","매립 쓰레기가 줄어 지속 가능한 사회로"],["However(하지만)","지수의 영향이 프랑스 밖으로 퍼질 가능성"],["","세계 경제 속에서 프랑스 시장 기업도 라벨 부착 필요"],["","성공하면 더 많은 나라가 프랑스를 따를 것"]],"link":[true,false,false,false,true,true,true,true,true,true],"ins":[5,6,7,8,9]},{"id":"L4-6","label":"4과 ❻ 수리 카페: 온 지역 사회가 나서야 한다","taught":null,"modes":["ko","abc","mun","blank"],"en":["When consumers are given the right tools and materials, along with some helpful advice, they can repair much of the damage that occurs to electronic products by themselves.","That is why Repair Cafés were started.","They are free meeting places where people can gather together and fix their broken devices.","The cafés are staffed by volunteer experts who can give technical advice and teach people how to fix things.","The first Repair Café was opened in the Netherlands in the city of Amsterdam in 2009.","It was such a success that the idea soon spread to neighboring countries.","Before long, there were Repair Cafés in over 30 countries around the world.","Along with preventing damaged items from becoming e-waste, these cafés also encourage people to share their invaluable skills and knowledge about the repair and maintenance of electronics.","They continue to grow in popularity, with more and more people signing up to volunteer."],"ko":["소비자들에게 유용한 조언과 함께 알맞은 도구와 재료가 주어지면, 그들은 전자 제품에 발생하는 대부분의 손상을 직접 수리할 수 있다.","그것이 수리 카페가 시작된 이유이다.","그곳은 사람들이 함께 모여 자신들의 고장 난 장치들을 고칠 수 있는 자유로운 만남의 장소이다.","그 카페들은 기술적인 조언을 줄 수 있고, 사람들에게 물건을 고치는 방법을 가르쳐 줄 수 있는 자원봉사자 전문가들을 직원으로 두고 있다.","가장 첫 번째 수리 카페는 네덜란드의 도시 암스테르담에서 2009년에 열렸다.","그것은 너무 성공적이어서 그 아이디어가 곧 이웃 나라들로 확산되었다.","얼마 후, 전 세계 30개국 이상에 수리 카페가 생겼다.","고장 난 물건들이 전자 쓰레기가 되는 것을 막는 것과 더불어, 이 카페들은 또한 사람들이 전자 제품의 수리와 보수 관리에 대한 매우 유용한 기술들과 지식을 공유할 수 있도록 장려한다.","점점 더 많은 사람들이 자원봉사를 하기 위해 신청하면서, 이 카페들은 계속해서 인기를 얻고 있다."],"key":[["","도구·재료·조언이 있으면 직접 수리할 수 있음"],["That is why(그래서)","그래서 수리 카페가 시작됨"],["","사람들이 모여 장치를 고치는 무료 공간"],["","자원봉사 전문가가 조언하고 고치는 법을 가르침"],["","첫 수리 카페는 2009년 암스테르담"],["","큰 성공으로 이웃 나라들로 확산"],["Before long(얼마 후)","30개국 이상으로 퍼짐"],["","쓰레기 방지와 함께 기술·지식 공유를 장려"],["","점점 인기를 얻고 자원봉사 신청도 늘어남"]],"link":[true,true,true,false,true,true,true,true],"ins":[1,2,5,6,7]},{"id":"L4-7","label":"4과 ❼ 수리 카페와 지속 가능한 미래","taught":null,"modes":["ko","abc","mun","blank"],"en":["By providing spaces where people can learn, Repair Cafés enable individuals to maintain their devices and extend their life spans.","Furthermore, they foster a sustainable perspective that can have a huge positive impact on our future.","Do you remember Liz, the girl who dropped her laptop?","Imagine she lived in a world where repairing damaged devices and appliances was simply part of everyday life.","If that were the case, her options wouldn’t be limited to paying for expensive repairs or throwing away her laptop and buying a new one.","She would be able to order the necessary parts online and replace them herself.","Alternatively, she could bring her damaged device to the nearest Repair Café to get advice on how to fix it.","Repairing it probably wouldn’t be very hard, and she likely would have purchased a laptop with a high repairability score.","In fact, this sustainable world is a future we can all enjoy if we work toward it together.","Even more importantly, it is a future in which people will generate far less e-waste, making our planet a cleaner, healthier place for everyone."],"ko":["사람들이 배울 수 있는 공간을 제공함으로써, 수리 카페들은 개인이 자신들의 장치를 유지하고 그것들의 수명을 연장할 수 있게 한다.","게다가 그것들은 우리의 미래에 막대한 긍정적인 영향을 미칠 수 있는 지속 가능한 관점을 조성한다.","노트북을 떨어뜨렸던 소녀 Liz를 기억하는가?","그녀가 손상된 장치와 기기를 수리하는 것이 그저 일상의 한 부분인 세상에 살고 있었다고 상상해 보라.","만약 그랬다면, 그녀의 선택지는 비싼 수리를 위해 비용을 지불하거나 노트북을 버리고 새것을 사는 것으로 제한되지는 않았을 것이다.","그녀는 인터넷에서 필요한 부품들을 주문하고, 그것들을 직접 교체할 수 있었을 것이다.","그렇지 않으면, 그녀는 그것을 고치는 방법에 대한 조언을 얻기 위해 고장 난 장치를 가장 가까운 수리 카페에 가지고 갈 수도 있었을 것이다.","그녀는 높은 수리 가능성 점수를 가진 노트북을 구매했을 것이기 때문에, 그것을 수리하는 것은 아마 아주 어렵지는 않았을 것이다.","사실, 이 지속 가능한 세상은 우리가 그것을 향해 함께 노력한다면 우리 모두가 누릴 수 있는 미래이다.","훨씬 더 중요한 것은 그것은 사람들이 훨씬 적은 전자 쓰레기를 발생시킬 미래이며, 이는 우리의 지구를 모두를 위한 더 깨끗하고 건강한 곳으로 만들 것이라는 것이다."],"key":[["","배움의 공간을 제공해 장치 유지·수명 연장"],["Furthermore(게다가)","미래에 큰 영향을 줄 지속 가능한 관점을 키움"],["","다시 Liz를 떠올리게 하는 질문"],["","수리가 일상인 세상을 상상해 보라고 함"],["","선택지가 비싼 수리나 새로 사기에 한정되지 않음"],["","부품을 주문해 직접 교체할 수 있음"],["Alternatively(그렇지 않으면)","수리 카페에서 조언을 얻을 수도 있음"],["","수리 점수 높은 노트북을 샀을 테니 수리도 쉬움"],["In fact(사실)","함께 노력하면 누릴 수 있는 지속 가능한 미래"],["Even more importantly(훨씬 더 중요한 것은)","전자 쓰레기가 훨씬 줄어 지구가 깨끗해짐"]],"link":[true,false,true,true,true,true,true,true,true],"ins":[3,4,5,6,7,8]}]};
