</style></head><body class="notranslate"><div class="wrap" id="app"></div><script id="data" type="application/json">{"title": "23년 11월 모의고사 삽입 다지기", "sub": "지문 13개 · 12문제", "key": "jusung-go2:in:2311_g2", "pass": [{"label": "23년 11월 21번 불편함을 마주하게 하는 예술", "sents": [{"en": "The arts and aesthetics offer emotional connection to the full range of human experience.", "ko": "예술과 미학은 다양한 인간 경험에 대한 정서적인 연결을 제공한다."}, {"en": "“The arts can be more than just sugar on the tongue,” Anjan Chatterjee, a professor at the University of Pennsylvania, says.", "ko": "“예술은 단순히 혀 위의 설탕 이상의 것이 될 수 있다,”라고 Pennsylvania 대학교의 교수인 Anjan Chatterjee는 말한다."}, {"en": "“In art, when there’s something challenging, which can also be uncomfortable, this discomfort, if we’re willing to engage with it, offers the possibility of some change, some transformation.", "ko": "“예술에서, 무언가 도전적인 것이 있고 그것이 또한 불편할 수 있을 때, 이 불편은, 만약 우리가 기꺼이 그것과 마주하려 한다면, 어떤 변화, 즉 어떤 변형의 가능성을 제공한다."}, {"en": "That can also be a powerful aesthetic experience.”", "ko": "그것은 또한 강력한 미적 경험이 될 수 있다.”"}, {"en": "The arts, in this way, become vehicles to contend with ideas and concepts that are difficult and uncomfortable otherwise.", "ko": "예술은, 이런 방식으로, 그렇지 않았더라면 어렵고 불편했을 아이디어와 개념들과 씨름하는 매개체가 된다."}, {"en": "When Picasso painted his masterpiece Guernica in 1937, he captured the heartbreaking and cruel nature of war, and offered the world a way to consider the universal suffering caused by the Spanish Civil War.", "ko": "Picasso가 그의 걸작 Guernica를 1937년에 그렸을 때, 그는 가슴 아프고 잔인한 전쟁의 본질을 포착했고, 스페인 내전으로 인한 보편적인 고통을 숙고할 방법을 세상에 제공했다."}, {"en": "When Lorraine Hansberry wrote her play A Raisin in the Sun, she gave us a powerful story of people struggling with racism, discrimination, and the pursuit of the American dream while also offering a touching portrait of family life.", "ko": "Lorraine Hansberry가 그녀의 희곡 A Raisin in the Sun을 썼을 때, 그녀는 가족생활에 대한 감동적인 초상화도 보여 주면서, 인종차별, 차별, 그리고 아메리칸 드림의 추구와 씨름하는 사람들의 강렬한 이야기를 우리에게 주었다."}]}, {"label": "23년 11월 23번 쇼핑카트를 퍼뜨린 바람잡이", "sents": [{"en": "Sylvan Goldman invented the shopping cart and introduced it in his stores in 1937.", "ko": "Sylvan Goldman은 쇼핑카트를 발명하고 1937년에 그의 가게들에 그것을 도입했다."}, {"en": "It was an excellent device that would make it easy for shoppers to buy as much as they wanted without getting tired or seeking others’ help.", "ko": "그것은 쇼핑객들이 지치거나 다른 사람들의 도움을 구하지 않고 그들이 원했던 만큼 구매하는 것을 쉽게 만들어 준 훌륭한 장치였다."}, {"en": "But Goldman discovered that in spite of his repeated advertisements and explanations, he could not persuade his shoppers to use the wheeled carts.", "ko": "하지만 Goldman은 그의 반복적인 광고와 설명에도 불구하고, 그의 쇼핑객들에게 바퀴 달린 카트들을 사용하도록 설득할 수 없다는 것을 알게 됐다."}, {"en": "Men were reluctant because they thought they would appear weak if they pushed such carts instead of carrying their shopping.", "ko": "남성들은 그들의 쇼핑한 물건을 들고 다니는 대신 만약 그들이 그런 카트들을 민다면 그들이 나약해 보일 것으로 생각했기 때문에 꺼렸다."}, {"en": "Women wouldn’t touch them because the carts reminded them of baby carriages.", "ko": "여성들은 카트들이 그들에게 유모차를 연상시키기 때문에 그것들에 손대려 하지 않았다."}, {"en": "It was only a few elderly shoppers who used them.", "ko": "그것들을 사용하는 사람들은 오직 몇 명의 노인 쇼핑객들뿐이었다."}, {"en": "That made the carts even less attractive to the majority of the shoppers.", "ko": "그것은 카트들을 대다수 쇼핑객들에게 훨씬 덜 매력적이도록 만들었다."}, {"en": "Then Goldman hit upon an idea.", "ko": "그때 Goldman이 한 아이디어를 떠올렸다."}, {"en": "He hired several models, men and women, of different ages and asked them to wheel the carts in the store and shop.", "ko": "그는 다른 연령대의 남자와 여자 모델들을 고용했고, 그들에게 상점에서 카트들을 밀고 쇼핑하도록 요청했다."}, {"en": "A young woman employee standing near the entrance told the regular shoppers, ‘Look, everyone is using the carts. Why don’t you?’", "ko": "입구 근처에 서 있던 한 젊은 여성 직원이 일반 쇼핑객들에게 ‘보세요, 모든 사람이 카트를 사용하고 있습니다. 해보는 게 어떠세요?’라고 말했다."}, {"en": "That was the turning point.", "ko": "그것이 전환점이었다."}, {"en": "A few shills disguised as regular shoppers easily accomplished what logic, explanations, and advertisements failed to do.", "ko": "일반 쇼핑객들로 위장한 몇몇의 바람잡이들이 논리, 설명, 그리고 광고가 하지 못한 것을 쉽게 달성했다."}, {"en": "Within a few weeks shoppers readily accepted those carts.", "ko": "몇 주 만에 쇼핑객들은 그 카트들을 기꺼이 받아들였다."}]}, {"label": "23년 11월 30번 기술 발전과 사생활 보호", "sents": [{"en": "Technology changes how individuals and societies understand the concept of privacy.", "ko": "기술은 개인들과 사회가 사생활의 개념을 이해하는 방식을 변화시킨다."}, {"en": "The fact that someone has a new ability to access information or watch the actions of another does not justify doing so.", "ko": "누군가가 정보에 접근하거나 다른 사람의 행동을 관찰하는 새로운 능력을 갖추고 있다는 사실은 그렇게 하는 것을 정당화하지 않는다."}, {"en": "Rather, advances in technology require citizens and policy makers to consider how privacy protections should be expanded.", "ko": "오히려, 기술의 발전은 시민들과 정책 입안자들이 어떻게 사생활 보호가 확장되어야 하는지 고려할 것을 요구한다."}, {"en": "For example, when cameras first became available for commercial and private use, nations and citizens struggled over whether new laws should be enacted to protect individuals from being photographed without their permission.", "ko": "예를 들어, 카메라가 상업적·개인적 용도로 처음 사용 가능해졌을 때, 국가들과 시민들은 개인이 허락 없이 사진 찍히는 것으로부터 보호하기 위해 새로운 법을 제정해야 하는지를 두고 고심했다."}, {"en": "The reconsideration of privacy brought about by this new technology reaffirmed a distinction between private and public spaces.", "ko": "이 새로운 기술이 가져온 사생활에 대한 재고는 사적 및 공적 공간의 구별을 재확인했다."}, {"en": "It was determined by most cultures that people automatically gave consent to being seen ―and thus recorded ―once they voluntarily stepped into a public space.", "ko": "일단 사람들이 자발적으로 공공장소에 발을 들여놓으면, 보이는 것, 그리고 따라서 녹화되는 것에 자동으로 동의한 것이라고 대부분의 문화에서 결정되었다."}, {"en": "Although some people might be uncomfortable with the spread of surveillance cameras, citizens in most cultures have adjusted to the fact that giving up the right not to be observed in these circumstances causes less harm to the community than failing to have surveillance.", "ko": "일부 사람들은 감시카메라들의 확산을 불편하게 여길지도 모르지만, 대부분의 문화권에 있는 시민들은 이러한 상황에서 관찰되지 않을 권리를 포기하는 것이 감시받지 못하는 것보다 지역사회에 더 적은 해를 끼친다는 사실에 순응해 왔다."}]}, {"label": "23년 11월 31번 기적은 생각 안 하는 사람의 핑계", "sents": [{"en": "Coincidence that is statistically impossible seems to us like an irrational event, and some define it as a miracle.", "ko": "통계적으로 불가능한 우연은 우리에게 비이성적인 사건처럼 보이고, 어떤 이들은 그것을 기적으로 정의한다."}, {"en": "But, as Montaigne has said, “the origin of a miracle is in our ignorance, at the level of our knowledge of nature, and not in nature itself.”", "ko": "그러나, Montaigne가 말했듯이, “기적의 기원은 자연 그 자체가 아니라 자연에 대한 우리의 지식 수준에서, 우리의 무지에 있다.”"}, {"en": "Glorious miracles have been later on discovered to be obedience to the laws of nature or a technological development that was not widely known at the time.", "ko": "영광스러운 기적들은 자연의 법칙에 대한 순응으로서, 혹은 당시에는 널리 알려지지 않았던 기술적 발전으로서 나중에 발견되어 왔다."}, {"en": "As the German poet, Goethe, phrased it: “Things that are mysterious are not yet miracles.”", "ko": "독일 시인 Goethe가 표현했듯이, “신비한 것들이 아직 기적인 것은 아니다.”"}, {"en": "The miracle assumes the intervention of a “higher power” in its occurrence that is beyond human capability to grasp.", "ko": "기적은 그것의 발생에 있어서 인간이 이해할 수 있는 능력 너머의 ‘더 높은 힘’의 개입을 가정한다."}, {"en": "Yet there are methodical and simple ways to “cause a miracle” without divine revelation and inspiration.", "ko": "하지만, 신적인 계시와 영감 없이 ‘기적을 일으키는’ 체계적이고 간단한 방법들이 있다."}, {"en": "Instead of checking it out, investigating and finding the source of the event, we define it as a miracle.", "ko": "그것을 확인하는 것, 즉, 그 사건의 근원을 조사하고 찾는 것 대신에, 우리는 그것을 기적으로 정의한다."}, {"en": "The miracle, then, is the excuse of those who are too lazy to think.", "ko": "그렇다면, 기적은 생각하는 데 너무 게으른 사람들의 핑계이다."}]}, {"label": "23년 11월 32번 사건 뒤 정보가 기억에 섞임", "sents": [{"en": "Information encountered after an event can influence subsequent remembering.", "ko": "사건 후에 마주친 정보는 이후의 기억하는 것에 영향을 미칠 수 있다."}, {"en": "External information can easily integrate into a witness’s memory, especially if the event was poorly encoded or the memory is from a distant event, in which case time and forgetting have degraded the original memory.", "ko": "특히 사건이 불충분하게 부호화되었거나, 그 기억이 시간과 망각이 원래의 기억을 저하시켜 온 먼 사건으로부터 온 것이라면, 외부 정보는 목격자의 기억에 쉽게 통합될 수 있다."}, {"en": "With reduced information available in memory with which to confirm the validity of post-event misinformation, it is less likely that this new information will be rejected.", "ko": "사건 후의 잘못된 정보가 타당한지 확인하는 데 쓸 수 있는 정보가 기억 속에 줄어들어 있으면, 이 새로운 정보가 거부될 가능성은 더 낮다."}, {"en": "Instead, especially when it fits the witness’s current thinking and can be used to create a story that makes sense to him or her, it may be integrated as part of the original experience.", "ko": "대신에, 특히 그것이 목격자의 현재 생각과 맞고 그 또는 그녀에게 이해되는 하나의 이야기를 만드는 데 사용될 수 있을 때, 그것은 원래 경험의 일부로서 통합될 수 있다."}, {"en": "This process can be explicit (i.e., the witness knows it is happening), but it is often unconscious.", "ko": "이 과정은 명시적일 수 있지만(즉, 목격자는 그것이 일어나고 있다는 것을 알고 있다), 그것은 흔히 무의식적이다."}, {"en": "That is, the witness might find himself or herself thinking about the event differently without awareness.", "ko": "즉, 목격자는 의식하지 못한 채 그 사건에 대해 다르게 생각하는 그 자신 또는 그녀 자신을 발견할지도 모른다."}, {"en": "Over time, the witness may not even know the source of information that led to the (new) memory.", "ko": "시간이 지나면, 목격자는 그 (새로운) 기억으로 이어진 정보의 출처조차 모를 수도 있다."}, {"en": "Sources of misinformation in forensic contexts can be encountered anywhere, from discussions with other witnesses to social media searches to multiple interviews with investigators or other legal professionals, and even in court.", "ko": "법적 상황에서 잘못된 정보의 출처는 다른 목격자들과의 대화에서부터 소셜 미디어 검색, 수사관이나 다른 법률 전문가들과의 여러 번의 면담, 그리고 심지어 법정에 이르기까지 어디에서나 마주칠 수 있다."}]}, {"label": "23년 11월 33번 상관관계: 이유 설명은 미루기", "sents": [{"en": "Correlations are powerful because the insights they offer are relatively clear.", "ko": "상관관계는 그것들이 제공하는 통찰력이 비교적 명확하기 때문에 강력하다."}, {"en": "These insights are often covered up when we bring causality back into the picture.", "ko": "이러한 통찰력은 종종 우리가 인과 관계를 그 상황으로 다시 가져올 때 가려진다."}, {"en": "For instance, a used-car dealer supplied data to statisticians to predict which of the vehicles available for purchase at an auction were likely to have problems.", "ko": "예를 들어, 한 중고차 딜러가 경매에서 구입할 수 있는 차량들 중 어떤 차량에 문제가 발생할 가능성이 있는지를 예측하기 위한 데이터를 통계학자들에게 제공했다."}, {"en": "A correlation analysis showed that orange-colored cars were far less likely to have defects.", "ko": "한 상관관계 분석은 주황색 차들이 결함이 있을 가능성이 훨씬 적다는 것을 보여 줬다."}, {"en": "Even as we read this, we already think about why it might be so:", "ko": "심지어 우리가 이것을 읽으면서도, 우리는 이미 왜 그럴지에 대해 생각한다."}, {"en": "Are orange-colored car owners likely to be car enthusiasts and take better care of their vehicles?", "ko": "주황색 차를 소유한 사람들이 자동차 애호가여서 그들의 차량을 더 잘 관리할 가능성이 있는가?"}, {"en": "Or, is it because orange-colored cars are more noticeable on the road and therefore less likely to be in accidents, so they’re in better condition when resold?", "ko": "아니면, 주황색 차들이 도로에서 더 눈에 띄고, 그래서 사고가 날 가능성이 적어 재판매될 때 그것들이 상태가 더 좋은 것이기 때문인가?"}, {"en": "Quickly we are caught in a web of competing causal hypotheses.", "ko": "곧 우리는 서로 경쟁하는 인과 가설들의 그물망에 걸려든다."}, {"en": "But our attempts to illuminate things this way only make them cloudier.", "ko": "하지만 이런 식으로 상황을 밝히려는 우리의 시도는 그것들을 더 흐리게 만들 뿐이다."}, {"en": "Correlations exist; we can show them mathematically.", "ko": "상관관계는 존재하며 우리는 그것들을 수학적으로 보여 줄 수 있다."}, {"en": "We can’t easily do the same for causal links.", "ko": "우리는 인과 관계에 대해서는 쉽게 똑같이 할 수 없다."}, {"en": "So we would do well to hold off from trying to explain the reason behind the correlations.", "ko": "따라서 우리는 상관관계 뒤에 있는 이유를 설명하려는 것을 삼가는 편이 좋다."}]}, {"label": "23년 11월 34번 수명을 정하는 것은 야생 생존 시간", "sents": [{"en": "Most mice in the wild are eaten or die before their life span of two years is over.", "ko": "야생에 있는 대부분의 쥐들은 2년의 수명이 끝나기 전에 잡아먹히거나 죽는다."}, {"en": "They die from external causes, such as disease, starvation, or predators, not due to internal causes, such as aging.", "ko": "그들은 노화와 같은 내부적인 원인 때문이 아니라 질병, 굶주림 또는 포식자와 같은 외부적인 원인으로 죽는다."}, {"en": "That is why nature has made mice to live, on average, for no longer than two years.", "ko": "그것이 자연이 쥐를 평균적으로 2년 이상 살지 못하게 만든 이유이다."}, {"en": "Now we have arrived at an important point:", "ko": "이제 우리는 중요한 지점에 도달했다."}, {"en": "The average life span of an animal species, or the rate at which it ages, is determined by the average time that this animal species can survive in the wild.", "ko": "동물 종의 평균 수명, 또는 그것이 노화하는 속도는 이 동물 종이 야생에서 생존할 수 있는 평균 시간에 의해 결정된다."}, {"en": "That explains why a bat can live to be 30 years old.", "ko": "그것은 왜 박쥐가 30세까지 살 수 있는지를 설명해 준다."}, {"en": "In contrast to mice, bats can fly, which is why they can escape from danger much faster.", "ko": "쥐와 대조적으로 박쥐는 날 수 있고, 이것은 그들이 위험에서 훨씬 더 빨리 도망칠 수 있는 이유이다."}, {"en": "Thanks to their wings, bats can also cover longer distances and are better able to find food.", "ko": "그들의 날개 덕분에, 박쥐들은 또한 더 긴 거리를 이동할 수 있고 먹이를 더 잘 찾을 수 있다."}, {"en": "Every genetic change in the past that made it possible for a bat to live longer was useful, because bats are much better able than mice to flee from danger, find food, and survive.", "ko": "박쥐가 더 오래 사는 것을 가능하게 해 준 과거의 모든 유전적 변화는 박쥐가 쥐보다 위험으로부터 도망치고, 먹이를 찾고, 생존하는 것을 훨씬 더 잘할 수 있기 때문에 유용했다."}]}, {"label": "23년 11월 36번 기후 변화로 작아지는 동물", "sents": [{"en": "The size of a species is not accidental.", "ko": "종의 크기는 우연한 것이 아니다."}, {"en": "It’s a fine-tuned interaction between a species and the world it inhabits.", "ko": "그것은 한 종과 그것이 서식하는 세계 사이의 미세 조정된 상호작용이다."}, {"en": "Over large periods of time, size fluctuations have often signalled significant changes in the environment.", "ko": "오랜 시간에 걸쳐, 크기의 변동은 종종 환경에서의 상당한 변화를 나타내 왔다."}, {"en": "Generally speaking, over the last five hundred million years, the trend has been towards animals getting larger.", "ko": "일반적으로 말해서, 지난 5억 년 동안, 그 경향은 동물들이 점점 커지는 쪽으로 되어 왔다."}, {"en": "It’s particularly notable in marine animals, whose average body size has increased 150-fold in this time.", "ko": "그것은 특히 해양 동물들에게서 두드러지는데, 그들의 평균 몸 크기는 이 시기에 150배로 증가해 왔다."}, {"en": "But we are beginning to see changes in this trend.", "ko": "하지만 우리는 이 경향에서 변화를 관찰하기 시작하고 있다."}, {"en": "Scientists have discovered that many animals are shrinking.", "ko": "과학자들은 많은 동물이 작아지고 있다는 것을 발견해 왔다."}, {"en": "Around the world, species in every category have been found to be getting smaller, and one major cause appears to be the heat.", "ko": "전 세계적으로, 모든 범주의 종들이 점점 작아지고 있는 것으로 발견되어 왔고, 한 가지 주요 원인은 열인 것으로 보인다."}, {"en": "Animals living in the Italian Alps, for example, have seen temperatures rise by three to four degrees Celsius since the 1980s.", "ko": "예를 들어, 이탈리아 알프스에 살고 있는 동물들은 1980년대 이후로 기온이 섭씨 3에서 4도까지 상승하는 것을 보아 왔다."}, {"en": "To avoid overheating, chamois goats now spend more of their days resting rather than searching for food, and as a result, in just a few decades, the new generations of chamois are 25 percent smaller.", "ko": "과열을 피하기 위해서, 샤무아 염소들은 이제 먹이를 찾는 것보다 휴식을 취하는 데 더 많은 그들의 날들을 보내고, 결과적으로, 단지 몇십 년 만에, 새로운 세대들의 샤무아는 25% 더 작아져 있다."}]}, {"label": "23년 11월 37번 표본 대신 전체 데이터", "sents": [{"en": "For a long time, random sampling was a good shortcut.", "ko": "오랫동안, 무작위 추출법은 좋은 지름길이었다."}, {"en": "It made analysis of large data problems possible in the pre-digital era.", "ko": "그것은 디지털 시대 이전에 큰 데이터 문제 분석을 가능하게 했다."}, {"en": "But much as converting a digital image or song into a smaller file results in loss of data, information is lost when sampling.", "ko": "그러나 디지털 이미지나 노래를 더 작은 파일로 변환하는 것이 데이터 손실을 유발하는 것과 마찬가지로, 추출을 할 때 정보가 손실된다."}, {"en": "Having the full (or close to the full) dataset provides a lot more freedom to explore, to look at the data from different angles or to look closer at certain aspects of it.", "ko": "전체(또는 전체에 가까운) 데이터 세트를 가지는 것은 탐색하거나 다른 각도에서 데이터를 살펴보거나 그것의 특정 측면들을 더 자세히 보게 하는 자유를 훨씬 더 많이 제공한다."}, {"en": "A fitting example may be the light-field camera, which captures not just a single plane of light, as with conventional cameras, but rays from the entire light field, some 11 million of them.", "ko": "적절한 예는 라이트 필드 카메라일 것인데, 그것은 기존 카메라처럼 빛의 단일 평면만 포착하는 것이 아니라 전체 라이트 필드에서 오는 약 1,100만 개의 광선을 포착한다."}, {"en": "The photographers can decide later which element of an image to focus on in the digital file.", "ko": "사진사들은 디지털 파일에서 이미지의 어느 요소에 초점을 맞출지를 나중에 결정할 수 있다."}, {"en": "There is no need to focus at the beginning, since collecting all the information makes it possible to do that afterwards.", "ko": "모든 정보를 수집하는 것은 그것을 나중에 하는 것을 가능하게 만들기 때문에, 처음에 초점을 맞출 필요는 없다."}, {"en": "Because rays from the entire light field are included, it is closer to all the data.", "ko": "전체 라이트 필드에서 오는 광선들이 포함되기 때문에, 그것은 모든 데이터에 더 가깝다."}, {"en": "As a result, the information is more “reusable” than ordinary pictures, where the photographer has to decide what to focus on before she presses the shutter.", "ko": "결과적으로 사진사가 셔터를 누르기 전에 그녀가 무엇에 초점을 맞출지를 결정해야 하는 일반 사진들보다 그 정보는 더 ‘재사용 가능’하다."}]}, {"label": "23년 11월 38번 내향적 리더와 서번트 리더십", "sents": [{"en": "Introverted leaders do have to overcome the strong cultural presumption that extroverts are more effective leaders.", "ko": "내향적인 리더들은 외향적인 사람들이 더 유능한 리더라는 강력한 문화적 억측을 극복해야 한다."}, {"en": "Although the population splits into almost equal parts between introverts and extroverts, more than 96 percent of managers and executives are extroverted.", "ko": "비록 인구는 내향적인 사람과 외향적인 사람 사이에서 거의 동등한 비율로 나뉘지만, 관리자와 임원의 96% 이상이 외향적이다."}, {"en": "In a study done in 2006, 65 percent of senior corporate executives viewed introversion as a barrier to leadership.", "ko": "2006년에 실시된 한 연구에서, 기업 고위 임원의 65%가 내향성을 리더십의 장애물로 간주했다."}, {"en": "We must reexamine this stereotype, however, as it doesn’t always hold true.", "ko": "하지만 그것이 항상 맞는 것은 아니기 때문에 우리는 이 고정 관념을 재검토해야 한다."}, {"en": "Regent University found that a desire to be of service to others and to empower them to grow, which is more common among introverts than extroverts, is a key factor in becoming a leader and retaining leadership.", "ko": "Regent 대학교는 다른 사람들에게 도움이 되고 그들이 성장할 수 있도록 힘을 주고자 하는 열망이 리더가 되고 리더십을 유지하는 데 핵심적인 요소이고, 그것이 외향적인 사람들보다 내향적인 사람들 사이에서 더 일반적이라는 것을 발견했다."}, {"en": "So-called servant leadership, dating back to ancient philosophical literature, adheres to the belief that a company’s goals are best achieved by helping workers or customers achieve their goals.", "ko": "고대 철학 문헌으로 거슬러 올라가는 소위 서번트 리더십은 한 회사의 목표가 근로자나 고객이 그들의 목표를 달성하도록 도움으로써 가장 잘 달성된다는 믿음을 고수한다."}, {"en": "Such leaders do not seek attention but rather want to shine a light on others’ wins and achievements; servant leadership requires humility, but that humility ultimately pays off.", "ko": "그런 리더들은 관심을 추구하는 것이 아니라 오히려 다른 사람들의 승리와 업적에 빛을 비추고 싶어 하고, 서번트 리더십은 겸손을 필요로 하지만, 그 겸손은 궁극적으로 결실을 맺는다."}]}, {"label": "23년 11월 39번 정확성보다 많은 데이터", "sents": [{"en": "By the nineteenth century, France had developed a system of precisely defined units of measurement to capture space, time, and more, and had begun to get other nations to adopt the same standards.", "ko": "19세기까지, 프랑스는 공간, 시간, 그리고 더 많은 것을 포착하기 위해 정밀하게 규정된 측정 단위의 체계를 개발했고, 다른 국가들이 동일한 기준을 채택하도록 만들기 시작했었다."}, {"en": "Just half a century later, in the 1920s, the discoveries of quantum mechanics forever destroyed the dream of comprehensive and perfect measurement.", "ko": "불과 반세기 후, 1920년대에, 양자역학의 발견은 포괄적이고 완벽한 측정에 대한 꿈을 영원히 깨 버렸다."}, {"en": "And yet, outside a relatively small circle of physicists, the mindset of humankind’s drive to flawlessly measure continued among engineers and scientists.", "ko": "그러나 비교적 소수 집단의 물리학자를 제외하고는 공학자와 과학자 사이에서 완벽하게 측정하려고 하는 인류의 추진 정신은 계속되었다."}, {"en": "In the world of business it even expanded, as the precision-oriented sciences of mathematics and statistics began to influence all areas of commerce.", "ko": "정확성을 지향하는 수학과 통계학이라는 과학이 상업의 모든 영역에 영향을 미치기 시작하면서 비즈니스의 세계에서 그것은 심지어 확장되었다."}, {"en": "However, contrary to the trend of the past several decades, in many new situations that are occurring today, allowing for imprecision―for messiness―may be a positive feature, not a shortcoming.", "ko": "그러나, 지난 수십 년간의 경향과 반대로, 오늘날 일어나는 많은 새로운 상황에서는 부정확성, 즉 어수선함을 허용하는 것이 단점이 아니라 긍정적인 특성이 될 수 있다."}, {"en": "As a tradeoff for relaxing the standards of allowable errors, one can get a hold of much more data.", "ko": "허용 가능한 오류의 기준을 완화하는 대가로, 사람은 훨씬 더 많은 데이터를 얻을 수 있다."}, {"en": "It isn’t just that “more is better than some,” but that, in fact, sometimes “more is greater than better.”", "ko": "그것은 단순히 ‘많은 것이 약간보다 낫다’는 것만이 아니라, 사실 때로는 ‘많은 것이 더 좋은 것보다 더 훌륭하다’는 것이다."}]}, {"label": "23년 11월 40번 협력하는 사람이 얻는 사회적 이익", "sents": [{"en": "Multiple laboratory studies show that cooperative people tend to receive social advantages from others.", "ko": "여러 실험실 연구들은 협력적인 사람들이 다른 사람들로부터 사회적인 혜택들을 받는 경향이 있다는 것을 보여 준다."}, {"en": "One way to demonstrate this is to give people the opportunity to act positively or negatively toward contributors.", "ko": "이것을 증명하는 한 가지 방법은 사람들에게 기여자들을 향해 긍정적이거나 부정적으로 행동할 기회를 주는 것이다."}, {"en": "For example, Pat Barclay, a professor at the University of Guelph, had participants play a cooperative game where people could contribute money toward a group fund which helped all group members, and then allowed participants to give money to other participants based on their reputations.", "ko": "예를 들어, Guelph 대학교의 교수인, Pat Barclay는 참가자들로 하여금 모든 집단 구성원들을 도와주는 집단 기금에 사람들이 돈을 기부할 수 있는 협동 게임을 하도록 한 다음, 참가자들이 그들의 평판을 바탕으로 다른 참가자들에게 돈을 줄 수 있도록 허락했다."}, {"en": "People who contributed more to the group fund were given responsibility for more money than people who contributed less.", "ko": "집단 기금에 더 많이 기부한 사람들은 덜 기부한 사람들보다 더 많은 돈에 대한 책임이 주어졌다."}, {"en": "Similar results have been found by other researchers.", "ko": "유사한 결과들이 다른 연구자들에 의해 발견되었다."}, {"en": "People who contribute toward their groups are also chosen more often as interaction partners, preferred as leaders, rated as more desirable partners for long-term relationships, and are perceived to be trustworthy and have high social status.", "ko": "또한 그들의 집단에 기여하는 사람들은 상호작용 파트너로서 더 자주 선택되고, 리더로서 선호되며, 장기적인 관계를 위한 더 바람직한 파트너들로서 평가되고, 신뢰할 수 있고 사회적 지위가 높은 것으로 인식된다."}, {"en": "Uncooperative people tend to receive verbal criticism or even more severe punishment.", "ko": "비협조적인 사람들은 언어적인 비판이나 심지어 더 심한 벌을 받는 경향이 있다."}]}, {"label": "23년 11월 41~42번 청중과 공연자를 잇는 방법", "sents": [{"en": "In Western society, many music performance settings make a clear distinction between performers and audience members: the performers are the “doers” and those in the audience take a decidedly passive role.", "ko": "서양 사회에서, 많은 음악 공연 상황은 공연자와 청중 사이에 명확한 구분을 만든다. 공연자들은 ‘행위자들’이고, 청중 속 사람들은 분명히 수동적인 역할을 맡는다."}, {"en": "The performance space itself may further reinforce the distinction with a physical separation between the stage and audience seating.", "ko": "공연 공간 그 자체가 무대와 청중석 사이의 물리적 분리로 구분을 더 강화할 수 있다."}, {"en": "Perhaps because this distinction is so common, audiences seem to greatly value opportunities to have special “access” to performers that affords understanding about performers’ style of music.", "ko": "아마도 이러한 구분이 너무 흔하기 때문에, 청중들은 공연자의 음악 스타일에 대한 이해를 제공하는 공연자에 대한 특별한 ‘접근’을 할 기회들에 크게 가치를 부여하는 것처럼 보인다."}, {"en": "Some performing musicians have won great approval by regularly incorporating “audience participation” into their concerts.", "ko": "일부 공연음악가는 정기적으로 그들의 콘서트에 ‘청중 참여’를 포함함으로써 큰 호응을 받아 왔다."}, {"en": "Whether by leading a sing-along activity or teaching a rhythm to be clapped at certain points, including audience members in the music making can boost the level of engagement and enjoyment for all involved.", "ko": "함께 노래 부르기 활동을 하든지 지정된 지점에서 박수를 치도록 리듬을 가르치든지, 음악을 만드는데 있어서 청중 구성원을 포함하는 것은 모든 참여자의 참여와 즐거움의 수준을 높일 수 있다."}, {"en": "Performers who are uncomfortable leading audience participation can still connect with the audience simply by giving a special glimpse of the performer perspective.", "ko": "청중 참여를 이끄는 것이 불편한 공연자들도 공연자의 관점을 특별히 살짝 보여 주는 것만으로 여전히 청중과 연결될 수 있다."}, {"en": "It is quite common in classical music to provide audiences with program notes.", "ko": "클래식 음악에서는 청중에게 프로그램 해설을 제공하는 것이 상당히 흔하다."}, {"en": "Typically, this text in a program gives background information about pieces of music being performed and perhaps biographical information about historically significant composers.", "ko": "전형적으로, 이러한 프로그램의 텍스트는 연주되는 음악 작품에 대한 배경 정보와 아마도 역사적으로 중요한 작곡가들에 대한 전기 정보를 제공한다."}, {"en": "What may be of more interest to audience members is background information about the very performers who are onstage, including an explanation of why they have chosen the music they are presenting.", "ko": "청중들에게 더 흥미로울 수도 있는 것은 공연자들이 그들이 선보이고 있는 음악을 왜 선택했는지에 대한 설명을 포함한, 무대 위에 있는 바로 그 연주가에 관한 배경 정보이다."}, {"en": "Such insight can make audience members feel closer to the musicians onstage, both metaphorically and emotionally.", "ko": "그러한 통찰력은 청중들이 무대 위에 있는 음악가들에게 비유적이고 감정적으로 더 가까이 느끼게 만들 수 있다."}, {"en": "This connection will likely enhance the expressive and communicative experience.", "ko": "이러한 연결은 표현적이고 소통적인 경험을 아마 향상시킬 것이다."}]}], "items": [{"id": "mock_2311_g2:in-mock_2311_g2-01", "p": 0, "s": 4, "pos": [1, 2, 3, 4, 6], "cue": ["in this way(이런 식으로) = 앞 문장들의 인용 '불편함을 마주하면 변화·변형 가능'", "vehicles to contend with ideas ... difficult and uncomfortable(어렵고 불편한 생각과 씨름하는 수단)이 앞의 discomfort(불편함)를 이어받음", "뒤 문장들의 Guernica(게르니카)·A Raisin in the Sun(태양 속의 건포도)이 이 주장의 예"], "trap": [[6, "게르니카 예 뒤에 넣으면 두 예 사이에 끼어 예가 홀로 남고 in this way(이런 식으로)가 인용과 멀어짐"], [3, "인용 중간에 넣으면 That(그것)과 닫는 따옴표가 인용에서 떨어져 나감"]], "var": {"en": "The arts thus become vehicles to contend with ideas and concepts that are difficult and uncomfortable otherwise.", "ko": "그리하여 예술은 그렇지 않으면 어렵고 불편했을 생각과 개념과 씨름하는 수단이 된다.", "chg": "in this way(이런 식으로) → thus(그리하여)", "note": "정리 표현만 바뀌고 인용 끝, 예시 시작 앞 자리 그대로"}, "fam": "정리·결과: in this way(이런 식으로) / thus(그리하여) / in this sense(이런 의미에서)", "post": "예술은 경험 전체와 연결 → 불편함을 마주하면 변화 → 예술은 불편한 생각과 씨름하는 수단 → 게르니카 → 태양 속의 건포도의 흐름"}, {"id": "mock_2311_g2:in-mock_2311_g2-02", "p": 1, "s": 7, "pos": [3, 5, 7, 10, 12], "cue": ["Then(그때) = 앞 문장들의 실패(광고·설명에도 사람들이 안 씀) 직후의 전환", "an idea(한 가지 아이디어)의 내용이 바로 뒤 문장의 hired several models(모델 여러 명을 고용함)로 구체화", "바로 뒤 문장의 He(그) = 이 문장의 Goldman(골드만)"], "trap": [[10, "입구 직원의 말 뒤에 넣으면 이미 아이디어가 실행된 뒤라 '아이디어가 떠오름'이 너무 늦고 That was the turning point(그것이 전환점)와도 충돌"]], "var": {"en": "It was then that Goldman came up with an idea.", "ko": "골드만이 한 가지 아이디어를 떠올린 것은 바로 그때였다.", "chg": "Then ... hit upon(그때 ~을 떠올렸다) → It was then that ... came up with(~을 떠올린 것은 바로 그때였다)", "note": "강조 구문으로 바뀌어도 실패 뒤, 모델 고용 앞 자리 그대로"}, "fam": "", "post": "쇼핑 카트 발명 → 광고에도 안 씀 → 남자는 약해 보일까, 여자는 유모차 같아서 → 노인만 사용 → 아이디어 → 모델 고용 → 전환점 → 몇 주 만에 수용의 흐름"}, {"id": "mock_2311_g2:in-mock_2311_g2-03", "p": 2, "s": 4, "pos": [1, 2, 3, 4, 6], "cue": ["this new technology(이 새 기술) = 바로 앞 문장의 cameras(카메라)", "The reconsideration of privacy(사생활 재고) = 바로 앞 문장의 struggled over whether new laws should be enacted(새 법이 필요한지 고민함)", "a distinction between private and public spaces(사적 공간과 공적 공간의 구분) → 바로 뒤 문장의 public space(공적 공간)에 들어가면 동의한 것으로 봄"], "trap": [[3, "'보호 확대' 뒤에 넣으면 this new technology(이 새 기술)가 가리킬 카메라가 그다음 문장에서야 나옴"]], "var": {"en": "This rethinking of privacy, caused by the camera, reaffirmed a distinction between private and public spaces.", "ko": "카메라로 인해 생긴 이 사생활에 대한 재고는 사적 공간과 공적 공간의 구분을 재확인했다.", "chg": "The reconsideration ... brought about by this new technology(이 새 기술이 가져온 재고) → This rethinking ..., caused by the camera(카메라로 인해 생긴 이 재고)", "note": "말이 바뀌어도 바로 앞 문장의 카메라 예 바로 뒤 자리 그대로"}, "fam": "", "post": "기술이 사생활 개념을 바꿈 → 할 수 있다고 해도 되는 건 아님 → 보호 확대 필요 → 카메라 예 → 사적·공적 공간 구분 → 공공장소는 동의 → 감시 카메라 수용의 흐름"}, {"id": "mock_2311_g2:in-mock_2311_g2-05", "p": 4, "s": 3, "pos": [1, 2, 3, 5, 7], "cue": ["Instead(대신에) = 바로 앞 문장의 it is less likely that this new information will be rejected(새 정보가 거부될 가능성이 낮음)의 rejected(거부됨)와 반대", "it(그것) = 바로 앞 문장의 post-event misinformation(사건 후 잘못된 정보)", "integrated as part of the original experience(원래 경험의 일부로 통합됨)가 앞의 integrate into a witness's memory(목격자 기억에 섞임)의 구체화"], "trap": [[2, "'기억에 쉽게 섞임' 뒤에 넣으면 Instead(대신에)가 뒤집을 '거부되지 않음'이 아직 없음"]], "var": {"en": "Rather, especially when it fits the witness’s current thinking and can be used to create a story that makes sense to him or her, it may be integrated as part of the original experience.", "ko": "오히려, 특히 그것이 목격자의 현재 생각에 맞고 그에게 말이 되는 이야기를 만드는 데 쓰일 수 있을 때, 그것은 원래 경험의 일부로 통합될 수 있다.", "chg": "Instead(대신에) → Rather(오히려)", "note": "같은 '대신·오히려' 가족이라 바로 앞 문장의 '거부되지 않음' 바로 뒤 자리 그대로"}, "fam": "대신·오히려: Instead(대신에) / Rather(오히려) / On the contrary(그와는 반대로)", "post": "사건 후 정보가 기억에 영향 → 약한 기억엔 쉽게 섞임 → 거부되지 않음 → 오히려 원래 경험으로 통합 → 대개 무의식적 → 출처도 잊음 → 어디서나 잘못된 정보의 흐름"}, {"id": "mock_2311_g2:in-mock_2311_g2-06", "p": 5, "s": 10, "pos": [7, 8, 9, 10, 12], "cue": ["do the same(같은 일을 하다) = 바로 앞 문장의 we can show them mathematically(수학적으로 보여 줄 수 있음)", "Correlations(상관관계) ↔ causal links(인과 관계) 대비", "바로 뒤 문장의 So(그래서) hold off from trying to explain the reason(이유 설명을 미룸)의 근거"], "trap": [[9, "'설명하려 할수록 더 흐려짐' 뒤도 '못함' 얘기라 끌리지만 do the same(같은 일을 하다)이 가리킬 '수학적으로 보여 주기'가 그다음 문장에서야 나옴"]], "var": {"en": "The same is not easily done for causal links.", "ko": "인과 관계에 대해서는 같은 일이 쉽게 되지 않는다.", "chg": "We can't easily do the same(우리는 같은 일을 쉽게 할 수 없다) → The same is not easily done(같은 일이 쉽게 되지 않는다)", "note": "수동형으로 바뀌어도 바로 앞 문장의 '수학적으로 보여 줌' 바로 뒤 자리 그대로"}, "fam": "", "post": "상관관계의 통찰은 분명함 → 인과를 끌어들이면 가려짐 → 주황색 차 예 → 원인 가설 경쟁 → 더 흐려짐 → 상관은 수학으로 증명, 인과는 어려움 → 이유 설명은 미루기의 흐름"}, {"id": "mock_2311_g2:in-mock_2311_g2-07", "p": 6, "s": 7, "pos": [3, 4, 5, 6, 7], "cue": ["also(또한) = 바로 앞 문장의 escape from danger much faster(위험에서 훨씬 더 빨리 벗어남)에 이은 두 번째 장점", "Thanks to their wings(날개 덕분에) = 바로 앞 문장의 bats can fly(박쥐는 날 수 있음)를 이어받음", "cover longer distances(더 먼 거리를 다님)·find food(먹이를 찾음) → 바로 뒤 문장의 flee from danger, find food, and survive(위험에서 달아나고 먹이를 찾고 살아남음)로 정리"], "trap": [[6, "a bat can live to be 30 years old(박쥐는 30년까지 삶) 바로 뒤라 이유처럼 끌리지만 also(또한)가 덧붙일 첫 장점 bats can fly(박쥐는 날 수 있음)가 아직 안 나옴"], [5, "'야생 생존 시간이 수명 결정' 뒤에 넣으면 bat(박쥐)이 소개되기도 전에 their wings(그들의 날개)가 먼저 나옴"]], "var": {"en": "Because they have wings, bats can also cover longer distances and are better able to find food.", "ko": "날개가 있기 때문에 박쥐는 또한 더 먼 거리를 다닐 수 있고 먹이도 더 잘 찾을 수 있다.", "chg": "Thanks to their wings(날개 덕분에) → Because they have wings(날개가 있기 때문에)", "note": "앞머리가 바뀌어도 also(또한)가 '날 수 있음' 뒤에 붙는 단서로 남음"}, "fam": "추가: also(또한) / In addition(게다가) / Moreover(더욱이)", "post": "쥐는 외부 원인으로 일찍 죽음 → 그래서 수명 2년 → 수명은 야생 생존 시간이 결정 → 박쥐 30년 → 날 수 있어 위험 회피·먹이 찾기 → 오래 사는 유전 변화가 유리의 흐름"}, {"id": "mock_2311_g2:in-mock_2311_g2-08", "p": 7, "s": 5, "pos": [2, 3, 4, 5, 8], "cue": ["this trend(이 추세) = 앞의 animals getting larger(동물이 더 커짐)", "But(그러나)으로 '커지던 추세'의 변화 예고 → 바로 뒤 문장의 many animals are shrinking(많은 동물이 작아짐)", "바로 앞 문장의 marine animals(해양 동물)·150-fold(150배) 예가 끝난 뒤 전환"], "trap": [[4, "'커지는 추세' 바로 뒤도 this trend(이 추세)가 맞아 보이지만 It(그것)이 추세를 받아야 하는데 이 문장이 끼어 It(그것)이 '변화'를 가리키게 됨"]], "var": {"en": "However, we are beginning to see changes in this trend.", "ko": "그러나 우리는 이 추세에서 변화를 보기 시작하고 있다.", "chg": "But(그러나) → However(그러나)", "note": "같은 역접 가족이라 커지는 추세 설명이 끝난 뒤 자리 그대로"}, "fam": "역접: But(그러나) / However(그러나) / Yet(그런데) / Nevertheless(그럼에도 불구하고)", "post": "몸 크기는 환경과의 상호 작용 → 5억 년간 커지는 추세 → 해양 동물 150배 → 그러나 변화 → 동물이 작아짐 → 원인은 더위 → 알프스 샤무아 25% 작아짐의 흐름"}, {"id": "mock_2311_g2:in-mock_2311_g2-09", "p": 8, "s": 2, "pos": [1, 2, 4, 6, 8], "cue": ["But(그러나) = 앞 문장들의 random sampling(무작위 표본 추출)은 좋은 지름길이라는 장점의 반대", "converting ... into a smaller file(더 작은 파일로 변환) → loss of data(데이터 손실) 비유가 information is lost when sampling(표본 추출 시 정보 손실)", "바로 뒤 문장의 Having the full ... dataset(전체 데이터를 가짐)의 장점으로 연결"], "trap": [[1, "첫 문장 뒤에 넣으면 그다음 문장의 It(그것)이 표본 추출이 아니라 '정보 손실'을 가리키게 되어 문장이 꼬임"]], "var": {"en": "However, much as converting a digital image or song into a smaller file results in loss of data, information is lost when sampling.", "ko": "그러나 디지털 이미지나 노래를 더 작은 파일로 변환하면 데이터가 손실되는 것과 마찬가지로, 표본 추출을 할 때 정보가 손실된다.", "chg": "But(그러나) → However(그러나)", "note": "같은 역접 가족이라 표본 추출 장점 뒤 자리 그대로"}, "fam": "역접: But(그러나) / However(그러나) / Yet(그런데)", "post": "무작위 표본은 좋은 지름길 → 디지털 이전 분석 가능 → 그러나 정보 손실 → 전체 데이터는 자유로운 탐색 → 라이트필드 카메라 예 → 재사용 가능한 정보의 흐름"}, {"id": "mock_2311_g2:in-mock_2311_g2-10", "p": 9, "s var D=JSON.parse(document.getElementById('data').textContent),IT=D.items,KEY='in:'+D.key;

 h+='<div class="giv"><small>주어진 문장</small><span lang="en" translate="no">'+esc(g.en)+'</span>'+(done?'<div class="ko">'+esc(g.ko)+'</div>':'')+'</div>';

  if(lv==2)h+='<div class="chg"><b>바뀐 앞머리</b>'+esc(it['var'].chg)+(it['var'].note?'<div>'+esc(it['var'].note)+'</div>':'')+'</div>';
