</style></head><body class="notranslate"><div class="wrap" id="app"></div><script id="data" type="application/json">{"title": "24년 10월 모의고사 삽입 다지기", "sub": "지문 6개 · 6문제", "key": "jusung-go2:in:2410_g2", "pass": [{"label": "24년 10월 22번 별의 질량은 어떻게 잴까", "sents": [{"en": "To determine the mass of my bowling ball, I might put it onto a balance and compare it with a known mass, such as a number of metal cubes each weighing 1, 10, or 100 grams.", "ko": "내 볼링공의 질량을 알아내려면, 나는 그것을 저울에 올려놓고 각각 1그램, 10그램, 100그램이 나가는 여러 개의 금속 큐브처럼 이미 알고 있는 질량과 비교할 수 있다."}, {"en": "Things get much more complicated if I want to know the mass of a distant star.", "ko": "내가 먼 별의 질량을 알고 싶다면 상황은 훨씬 더 복잡해진다."}, {"en": "How do I measure it?", "ko": "나는 그것을 어떻게 측정할까?"}, {"en": "We can roughly say that measuring the mass of a star involves various theories.", "ko": "별의 질량을 측정하는 일에는 여러 이론이 들어간다고 대략 말할 수 있다."}, {"en": "If we want to measure the mass of a binary star, we first determine a center of mass between the two stars, then their distance from that center which we can then use, together with a value for the period and a certain instance of Kepler’s Third Law, to calculate the mass.", "ko": "쌍성의 질량을 재고 싶다면, 우리는 먼저 두 별 사이의 질량 중심을 알아내고, 그다음 그 중심으로부터 두 별까지의 거리를 알아낸 뒤, 그 거리를 공전 주기 값과 케플러 제3법칙의 특정한 경우와 함께 써서 질량을 계산한다."}, {"en": "In other words, in order to “measure” the star mass, we measure other quantities and use those values, together with certain equations, to calculate the mass.", "ko": "다시 말해, 별의 질량을 '측정'하려고 우리는 다른 양들을 재고 그 값들을 특정한 방정식과 함께 써서 질량을 계산한다."}, {"en": "Measurement is not a simple and unmediated estimation of independently existing properties, but a determination of certain magnitudes before the background of a number of accepted theories.", "ko": "측정은 독립적으로 존재하는 속성을 단순하고 직접적으로 어림하는 일이 아니라, 받아들여진 여러 이론을 배경으로 특정한 크기를 결정하는 일이다."}]}, {"label": "24년 10월 23번 고통과 쾌락은 한 저울의 양 끝", "sents": [{"en": "Based on discoveries in neuroscience, pain and pleasure are formed and processed in the same area of the brain.", "ko": "신경과학의 발견에 따르면, 고통과 쾌락은 뇌의 같은 영역에서 만들어지고 처리된다."}, {"en": "Our bodies constantly strive for homeostasis, which is defined as the balance of bodily functions.", "ko": "우리 몸은 끊임없이 항상성을 추구하는데, 항상성은 몸의 기능들이 균형을 이루는 상태로 정의된다."}, {"en": "Without the body’s effective compensatory mechanisms, which may cushion potential highs and lows, we would not be capable of surviving.", "ko": "잠재적인 기복을 완화해 줄 수 있는 몸의 효과적인 보상 기제가 없다면, 우리는 살아남을 수 없을 것이다."}, {"en": "Pleasure and pain are like two sides of the same coin; they seem to work together and are heavily reliant on one another and keep balance.", "ko": "쾌락과 고통은 같은 동전의 양면과 같아서, 함께 작동하고 서로에게 크게 의존하며 균형을 유지하는 것 같다."}, {"en": "If you imagine pleasure and pain as the two opposite points on a scale, you can easily understand that as one of the two points rises, the other must correspondingly fall.", "ko": "쾌락과 고통을 저울 위의 반대쪽 두 지점이라고 상상하면, 두 지점 중 하나가 올라가면 다른 하나는 그에 맞춰 내려갈 수밖에 없다는 것을 쉽게 이해할 수 있다."}, {"en": "We’ve all heard the expression, “No pain, no gain.”", "ko": "우리는 모두 \"고통 없이는 얻는 것도 없다\"라는 표현을 들어 본 적이 있다."}, {"en": "Well, according to psychiatrist Dr. Anna Lembke, there may be some truth to these words.", "ko": "자, 정신과 의사 Anna Lembke 박사에 따르면, 이 말에는 어느 정도 진실이 있을 수 있다."}, {"en": "She says that our attempts to escape being miserable are in fact making us even more miserable.", "ko": "그녀는 비참함에서 벗어나려는 우리의 시도가 사실은 우리를 훨씬 더 비참하게 만들고 있다고 말한다."}, {"en": "This is because pain is actually an essential component of our ability to maintain a neutral state, and allowing it will in turn reset our internal scale back to balance.", "ko": "이는 고통이 실제로 중립 상태를 유지하는 우리 능력의 필수 요소이고, 고통을 허용하면 결국 우리 내부의 저울이 다시 균형으로 맞춰지기 때문이다."}]}, {"label": "24년 10월 24번 끝없는 업그레이드 욕구", "sents": [{"en": "Manufacturers masterfully sow seeds of doubt about the adequacy of our current devices.", "ko": "제조업체들은 우리가 지금 쓰는 기기가 충분한지에 대한 의심의 씨앗을 노련하게 뿌린다."}, {"en": "Suddenly, the phone that was your lifeline a year ago is now a museum piece, unable to keep pace with your digital demands.", "ko": "갑자기, 1년 전 당신의 생명줄이던 휴대폰이 이제는 당신의 디지털 요구를 따라가지 못하는 박물관 유물이 된다."}, {"en": "And thus, the itch to upgrade begins, often before there’s a genuine need.", "ko": "그래서 업그레이드하고 싶은 욕구가, 흔히 진짜 필요가 생기기도 전에 시작된다."}, {"en": "This cycle isn’t just confined to our digital companions.", "ko": "이 순환은 우리의 디지털 동반자에만 국한되지 않는다."}, {"en": "It spills over into almost every aspect of consumer electronics, from the self-driving car to the smart fridge.", "ko": "그것은 자율주행차부터 스마트 냉장고까지 소비자 전자제품의 거의 모든 영역으로 번져 나간다."}, {"en": "Every product seems to be on an unstoppable march towards the next version, the next generation that promises to revolutionize your life.", "ko": "모든 제품이 다음 버전, 즉 당신의 삶을 혁신하겠다고 약속하는 다음 세대를 향해 멈출 수 없는 행진을 하는 것 같다."}, {"en": "What’s fascinating, or perhaps disturbing, is the utter efficacy of this cycle in shaping our desires.", "ko": "흥미로운, 어쩌면 불안한 점은 우리의 욕구를 만들어 내는 이 순환의 엄청난 효과다."}, {"en": "It’s not so much that we want the newest device; we’re led to believe we need it.", "ko": "우리가 최신 기기를 원한다기보다는, 우리가 그것이 필요하다고 믿도록 이끌린다."}, {"en": "The distinction between want and need blurs, shifting our financial priorities in favor of staying current with trends.", "ko": "원하는 것과 필요한 것의 구분이 흐려지고, 그것이 유행을 따라가는 쪽으로 우리의 재정 우선순위를 바꾼다."}, {"en": "For all the logical arguments against this ceaseless upgrading, the temptation remains compelling.", "ko": "이런 끝없는 업그레이드에 반대하는 온갖 논리적 주장에도 불구하고, 그 유혹은 여전히 강하다."}]}, {"label": "24년 10월 29번 동물이 원하는 걸 알아내는 실험", "sents": [{"en": "Conditioned Place Preference is a way of finding out what animals want.", "ko": "조건부 장소 선호는 동물이 무엇을 원하는지 알아내는 한 가지 방법이다."}, {"en": "Researchers train them to associate one place with an experience such as food or a loud noise and another place with something completely different, usually where nothing happens.", "ko": "연구자들은 동물들이 한 장소를 먹이나 시끄러운 소리 같은 경험과 연결하고, 다른 장소는 완전히 다른 것, 보통 아무 일도 일어나지 않는 것과 연결하도록 훈련시킨다."}, {"en": "The two places are made obviously different to make it as easy as possible for the animal to associate each place with what happened to it there.", "ko": "두 장소는 동물이 각 장소를 거기서 겪은 일과 최대한 쉽게 연결하도록 확실히 다르게 만들어진다."}, {"en": "The animal’s preference for being in one place or another is measured both before and after its experiences in the two places.", "ko": "한 장소나 다른 장소에 있는 것에 대한 동물의 선호는 두 장소에서 경험하기 전과 후에 모두 측정된다."}, {"en": "If there is a shift in where the animal chooses to spend its time for the reward, this suggests that it liked the experience and is trying to repeat it.", "ko": "동물이 보상을 위해 시간을 보내기로 선택하는 곳에 변화가 생기면, 이는 동물이 그 경험을 좋아했고 그것을 반복하려 한다는 뜻이다."}, {"en": "Conversely, if it now avoids the place the stimulus appeared and starts to prefer the place it did not experience it, then this suggests that it found the stimulus unpleasant.", "ko": "반대로, 동물이 이제 자극이 나타났던 장소를 피하고 그것을 겪지 않은 장소를 좋아하기 시작한다면, 이는 그 자극이 불쾌했다는 뜻이다."}, {"en": "For example, mice with cancer show a preference for the place where they have been given morphine, a drug used to relieve pain, rather than where they have received saline whereas healthy mice developed no such preference.", "ko": "예를 들어, 암에 걸린 쥐는 식염수를 맞은 곳보다 통증 완화에 쓰는 약인 모르핀을 맞은 곳을 더 좋아하는 반면, 건강한 쥐에게는 그런 선호가 생기지 않았다."}, {"en": "This suggests that the mice with cancer wanted the morphine.", "ko": "이는 암에 걸린 쥐가 모르핀을 원했다는 뜻이다."}]}, {"label": "24년 10월 30번 새의 번식기", "sents": [{"en": "Near the equator, many species of bird breed all year round.", "ko": "적도 근처에서는 많은 종의 새들이 일 년 내내 번식한다."}, {"en": "But in temperate and polar regions, the breeding seasons of birds are often sharply defined.", "ko": "그러나 온대와 극지방에서는 새들의 번식기가 흔히 뚜렷하게 정해져 있다."}, {"en": "They are triggered mainly by changes in day length.", "ko": "번식기는 주로 낮 길이의 변화로 시작된다."}, {"en": "If all goes well, the outcome is that birds raise their young when the food supply is at its peak.", "ko": "모든 것이 잘되면, 그 결과 새들은 먹이 공급이 가장 많을 때 새끼를 기른다."}, {"en": "Most birds are not simply reluctant to breed at other times but they are also physically incapable of doing so.", "ko": "대부분의 새들은 다른 때에 번식하기를 단지 꺼리는 것이 아니라 신체적으로도 그렇게 할 수 없다."}, {"en": "This is because their reproductive system shrinks, which helps flying birds save weight.", "ko": "이는 새들의 번식 기관이 줄어들기 때문인데, 그것은 나는 새들이 무게를 줄이는 데 도움이 된다."}, {"en": "The main exception to this rule are nomadic desert species.", "ko": "이 규칙의 주요 예외는 떠돌이 사막 종들이다."}, {"en": "These can initiate their breeding cycle within days of rain.", "ko": "이들은 비가 온 지 며칠 안에 번식 주기를 시작할 수 있다."}, {"en": "It’s for making the most of the sudden breeding opportunity.", "ko": "그것은 갑자기 찾아온 번식 기회를 최대한 활용하기 위한 것이다."}, {"en": "Also, different species divide the breeding season up in different ways.", "ko": "또한 종마다 번식기를 나누는 방식이 다르다."}, {"en": "Most seabirds raise a single brood.", "ko": "대부분의 바닷새는 한 번만 새끼를 기른다."}, {"en": "In warm regions, however, songbirds may raise several families in a few months.", "ko": "그러나 따뜻한 지역에서는 명금류가 몇 달 동안 여러 번 새끼를 기르기도 한다."}, {"en": "In an exceptionally good year, a pair of House Sparrows, a kind of songbird, can raise successive broods through a marathon reproductive effort.", "ko": "유난히 좋은 해에는 명금류의 한 종류인 참새 한 쌍이 마라톤 같은 번식 노력으로 연달아 새끼를 길러 낼 수 있다."}]}, {"label": "24년 10월 33번 읽기란 무엇인가", "sents": [{"en": "Some people argue that there is a single, logically consistent concept known as reading that can be neatly set apart from everything else people do with books.", "ko": "어떤 사람들은 사람들이 책으로 하는 다른 모든 일과 깔끔하게 구분될 수 있는, 읽기라는 하나의 논리적으로 일관된 개념이 있다고 주장한다."}, {"en": "Is reading really that simple?", "ko": "읽기는 정말 그렇게 단순할까?"}, {"en": "The most productive way to think about reading is as a loosely related set of behaviors that belong together owing to family resemblances, as Ludwig Wittgenstein used the phrase, without having in common a single defining trait.", "ko": "읽기를 생각하는 가장 생산적인 방법은, Ludwig Wittgenstein이 그 표현을 쓴 의미대로, 하나의 정의적 특징을 공유하지 않고도 가족 유사성 때문에 함께 묶이는 느슨하게 연결된 행동들의 집합으로 보는 것이다."}, {"en": "Consequently, efforts to distinguish reading from nonreading are destined to fail because there is no agreement on what qualifies as reading in the first place.", "ko": "그 결과, 읽기와 읽기가 아닌 것을 구분하려는 노력은 실패할 수밖에 없는데, 애초에 무엇이 읽기로 인정되는지에 대한 합의가 없기 때문이다."}, {"en": "The more one tries to figure out where the border lies between reading and not-reading, the more edge cases will be found to stretch the term’s flexible boundaries.", "ko": "읽기와 읽기가 아닌 것의 경계가 어디인지 알아내려 할수록, 그 용어의 유연한 경계를 늘리는 경계 사례가 더 많이 발견될 것이다."}, {"en": "Thus, it is worth attempting to collect together these exceptional forms of reading into a single forum, one highlighting the challenges faced by anyone wishing to establish the boundaries where reading begins and ends.", "ko": "따라서 이런 예외적인 읽기 형태들을 하나의 토론의 장으로 모아 보는 시도는 해 볼 가치가 있는데, 그것은 읽기가 어디서 시작하고 끝나는지 경계를 정하려는 누구나가 마주하는 어려움을 드러내 준다."}, {"en": "The attempt moves toward an understanding of reading as a spectrum that is expansive enough to accommodate the distinct reading activities.", "ko": "그 시도는 서로 다른 읽기 활동들을 다 담을 만큼 넓은 스펙트럼으로 읽기를 이해하는 방향으로 나아간다."}]}], "items": [{"id": "mock_2410_g2:in-mock_2410_g2-01", "p": 0, "s": 1, "pos": [1, 3, 4, 6, 7], "cue": ["Things get much more complicated(일이 훨씬 더 복잡해짐) = 바로 앞 문장의 bowling ball(볼링공)을 저울로 재는 쉬운 경우와 대비", "the mass of a distant star(먼 별의 질량)가 바로 뒤 문장의 How do I measure it?(그것을 어떻게 잴까?)의 it(그것)", "쉬운 예 → 어려운 예 → 질문 순서"], "trap": [[3, "질문 뒤에 넣으면 it(그것)이 볼링공 질량이 되는데, 볼링공 재는 법은 첫 문장에 이미 나와 질문이 성립 안 함"]], "var": {"en": "It becomes far more complicated if I want to know the mass of a distant star.", "ko": "먼 별의 질량을 알고 싶다면 일은 훨씬 더 복잡해진다.", "chg": "Things get much more(일이 훨씬 더 ~해지다) → It becomes far more(훨씬 더 ~해지다)", "note": "표현만 바뀌고 볼링공 뒤, 질문 앞 자리 그대로"}, "fam": "", "post": "볼링공은 저울로 비교 → 먼 별은 훨씬 복잡 → 어떻게 잴까 → 여러 이론 필요 → 쌍성 질량 계산 → 측정은 이론을 배경으로 한 결정의 흐름"}, {"id": "mock_2410_g2:in-mock_2410_g2-02", "p": 1, "s": 6, "pos": [3, 4, 5, 6, 9], "cue": ["these words(이 말) = 바로 앞 문장의 “No pain, no gain.”(고통 없이는 얻는 것도 없다)", "Dr. Anna Lembke(애나 렘키 박사)가 바로 뒤 문장의 She says(그녀는 말한다)의 She(그녀)", "Well(그런데)로 속담에 대한 전문가 의견을 이어 붙임"], "trap": [[5, "저울 비유 뒤에 넣으면 these words(이 versely(반대로) → On the other hand(반면에)", "note": "같은 대조 가족이라 바로 앞 문장의 긍정 경우 바로 뒤 자리 그대로"}, "fam": "반대·대조: Conversely(반대로) / On the other hand(반면에) / In contrast(대조적으로)", "post": "조건 장소 선호 실험 → 두 장소 구분 → 전후 선호 측정 → 좋으면 그 장소로 → 반대로 싫으면 피함 → 암에 걸린 쥐와 모르핀 예의 흐름"}, {"id": "mock_2410_g2:in-mock_2410_g2-05", "p": 4, "s": 6, "pos": [2, 4, 5, 6, 9], "cue": ["this rule(이 규칙) = 앞 문장들의 '대부분의 새는 다른 때 번식 못 함(생식기관이 줄어듦)'", "The main exception(주된 예외) → nomadic desert species(유목 사막 종)", "바로 뒤 문장의 These(이들) = 사막 종, within days of rain(비 온 지 며칠 안에) 번식 시작"], "trap": [[5, "'번식할 수 없음' 뒤도 예외가 붙을 듯하지만 This is because(이것은 ~ 때문이다)가 그 문장을 바로 받아야 함"]], "var": {"en": "Nomadic desert species are the main exception to this rule.", "ko": "유목 사막 종은 이 규칙의 주된 예외이다.", "chg": "The main exception ... are nomadic desert species(주된 예외는 유목 사막 종이다) → Nomadic desert species are the main exception(유목 사막 종이 주된 예외이다)", "note": "어순만 바뀌고 '생식기관이 줄어듦' 설명 뒤, These(이들) 앞 자리 그대로"}, "fam": "", "post": "적도 새는 연중 번식 → 온대·극지는 번식기 뚜렷 → 낮 길이가 신호 → 다른 때는 번식 불가 → 예외 사막 종 → 비 오면 바로 번식 → 종마다 번식기 나누기의 흐름"}, {"id": "mock_2410_g2:in-mock_2410_g2-06", "p": 5, "s": 1, "pos": [1, 3, 4, 5, 7], "cue": ["that simple(그렇게 단순한) = 바로 앞 문장의 a single, logically consistent concept(하나의 논리적으로 일관된 개념)·neatly set apart(깔끔하게 구분됨)", "질문으로 바로 앞 문장의 주장에 의문 제기 → 바로 뒤 문장의 loosely related set of behaviors(느슨하게 관련된 행동들의 집합)가 답", "주장 → 의문 → 반박 순서"], "trap": [[3, "'가족 유사성' 뒤에 넣으면 이미 반박이 나온 뒤라 질문이 너무 늦고 Consequently(결과적으로)가 '가족 유사성' 문장과 끊김"]], "var": {"en": "But is reading truly so simple?", "ko": "하지만 읽기가 정말 그렇게 단순할까?", "chg": "really that simple(정말 그렇게 단순한) → truly so simple(정말 그토록 단순한), But(하지만) 추가", "note": "질문 표현이 바뀌어도 바로 앞 문장의 주장 바로 뒤 자리 그대로"}, "fam": "", "post": "읽기는 하나의 개념이라는 주장 → 정말 그렇게 단순할까 → 가족 유사성 → 경계 긋기 실패 → 예외적 읽기 모으기 → 스펙트럼으로서의 읽기의 흐름"}]}</script><script>

 for(var i=0;i<=N;i++){var k=it.pos.indexOf(i);
  if(k>=0){var cls='mk';if(done){if(i==it.s)cls+=' ok';else if(k==pick)cls+=' ng'}else if(k==pick)cls+=' sel';
   h+='<button class="'+cls+'" '+(done?'':'onclick="pk('+k+')"')+'>'+C[k]+'</button> ';
   if(done&&i==it.s)h+='<span class="ins">'+esc(g.en)+'</span> '}
  if(i<N&&i!=it.s)h+=esc(P[i].en)+' '}
 h+='</div>';
 if(!done)h+='<button class="go" '+(pick<0?'disabled':'')+' onclick="sub()">제출</button>';
 else{var ok=it.pos[pick]==it.s;h+='<div class="band '+(ok?'ok':'ng')+'">'+(ok?'정답 '+C[pick]:'오답 · 정답 '+C[it.pos.indexOf(it.s)])+'</div>';
  h+='<div class="exh">이 자리인 이유</div>';it.cue.forEach(function(c){h+='<div class="why">'+esc(c)+'</div>'});
  (it.trap||[]).forEach(function(t){var k=it.pos.indexOf(t[0]);if(k<0)return;h+='<div class="trap"><b>'+C[k]+'</b> '+esc(t[1])+'</div>'});
  if(lv==2)h+='<div class="chg"><b>바뀐 앞머리</b>'+esc(it['var'].chg)+(it['var'].note?'<div>'+esc(it['var'].note)+'</div>':'')+'</div>';
  if(it.fam)h+='<div class="post"><small>연결어 가족</small>'+esc(it.fam)+'</div>';
  if(it.post)h+='<div class="post"><small>흐름 기억</small>'+esc(it.post)+'</div>';
  h+='<button class="go" onclick="op('+cur+','+lv+')">다시 풀기</button>';
  if(lv==1)h+='<button class="go sec" onclick="op('+cur+',2)">2단계 변형 문장으로</button>';
  else if(cur+1<IT.length)h+='<button class="go sec" onclick="op('+(cur+1)+',1)">다음 문제</button>'}
 h+='<button class="go sec" onclick="home()">목록으로</button>';
 $('app').innerHTML=h}
function pk(k){pick=k;draw()}
function sub(){done=true;var it=IT[cur];if(it.pos[pick]==it.s){st[it.id]=st[it.id]||{};st[it.id][lv]=1;save()}draw()}
home();
