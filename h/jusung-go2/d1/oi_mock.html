var IT=[{"id": "m2610g2-21", "src": "mock_2610_g2.txt", "label": "26년 10월 21번", "type": "insert", "sentence": "In order to make this worthwhile for the lender, money has to have a price — a cost to the borrower and income to the lender.", "segs": ["To see how borrowing and lending changes a person's worldview, consider what the rate of interest does to people's perception of time.", "Imagine you are lending to somebody at an interest rate of 10 percent per year for five years.", "This rate tells us that the money lent has a cost that reflects the risk of you not being repaid and the opportunity cost of not spending that money yourself.", "The longer the term of the loan, the higher the chance you won't be paid back because it is further into the future — which by definition is unknowable — and the longer you will have to wait before spending the money yourself.", "This price factors in the value of time.", "To put it another way, a bird in the hand is worth two in the bush."], "answer": 4, "clues": [["make this worthwhile for the lender", "주어진 문장의 this = 앞에서 말한 '못 돌려받을 위험과 오래 기다림을 감수하고 돈을 빌려주는 일'"], ["This price", "④ 뒤 문장의 This price(이 가격) = 주어진 문장에서 처음 나오는 price(돈의 가격 = 이자) → 주어진 문장이 빠지면 This price가 가리킬 것이 사라짐"], ["The longer the term of the loan", "④ 앞 문장 = 기간이 길수록 위험도 기다림도 커짐 → 그래서 빌려준 사람에게 보상(가격)이 필요하다는 주어진 문장으로 이어짐"]], "flow": ["이자가 시간 인식을 어떻게 바꾸는지 보자 — 연 10% 이자로 5년 동안 빌려준다고 상상", "이 이자율 = 못 돌려받을 위험 + 그 돈을 직접 못 쓰는 기회비용", "기간이 길수록 못 받을 가능성도, 기다리는 시간도 커짐", "그래서 빌려준 사람에게 가치 있으려면 돈에 가격(이자)이 붙어야 함", "이 가격에는 시간의 가치가 들어 있음", "손 안의 새 한 마리가 덤불 속 두 마리만큼의 가치"]}, {"id": "m2610g2-23", "src": "mock_2610_g2.txt", "label": "26년 10월 23번", "type": "order", "given": "Research on cephalopod neurobiology suggests that an octopus possesses roughly five hundred million neurons. What makes this system unusual is where many of those neurons are located.", "parts": {"A": "More than half are distributed throughout the arms rather than concentrated entirely in the central brain. Each arm contains networks of nerve cells capable of controlling complex movements and responding to sensory input locally.", "C": "This means that many actions do not require detailed instructions from the brain itself. Instead, the arms function as highly capable extensions of the nervous system that interact with the environment directly.", "B": "The suckers lining each arm play an important role in this process. These structures provide strong grip but also detect chemical signals on surfaces they contact. Marine biologists studying octopus behavior have shown that this allows the animal to gather chemical information through touch."}, "answer": "A-C-B", "hint": {"given": "문어는 신경세포가 약 5억 개 — 특이한 건 그 신경세포들이 어디에 있느냐임", "A": "절반 넘게가 중앙 뇌가 아니라 다리에 퍼져 있고, 다리마다 움직임을 스스로 조절하는 신경망이 있음", "B": "다리의 빨판이 이 과정에서 중요함 — 꽉 잡기도 하고 표면의 화학 신호도 느낌", "C": "그래서 많은 행동이 뇌의 자세한 지시 없이 이루어지고, 다리가 환경과 직접 주고받음"}, "clues": [["More than half are distributed throughout the arms", "(A)는 주어진 글의 질문 '신경세포가 어디에 있느냐'에 대한 답 → 주어진 글 바로 뒤"], ["This means", "(C)의 This = (A)에서 말한 '다리마다 스스로 움직임을 조절하는 신경망' → (A) 뒤"], ["in this process", "(B)의 this process = (C)의 '다리가 환경과 직접 주고받는 과정' → (C) 뒤"], ["These structures", "(B) 안의 These structures = 바로 앞의 빨판(suckers)"]], "flow": ["문어의 신경세포 약 5억 개, 문제는 위치", "절반 넘게가 다리에 퍼져 있음", "다리가 뇌 지시 없이 스스로 환경과 주고받음", "빨판이 꽉 잡기도 하고 화학 신호도 감지 → 만지면서 화학 정보를 모음"]}, {"id": "m2610g2-24", "src": "mock_2610_g2.txt", "label": "26년 10월 24번", "type": "insert", "sentence": "Because of their practice of contemplation for the highest human good, philosophers were considered worthy to have all the best things in life.", "segs": ["Consistent though he may be, some of Aristotle's ideas meet us today as strange. He had no difficulty justifying slavery, for example, and in his era, philosophers enjoyed positions of high privilege and influence.", "Somehow that assertion seems oddly self-serving.", "It serves us to remember that every great thinker is of her own time and speaks to a particular audience, and certainly Aristotle is no exception.", "Human flourishing as he understood it probably would not be nearly as inclusive as we would want it to be today.", "How he understood right and good is best taken to be an indicator of how the privileged elite of ancient Greek society tended to understand right and good.", "As a result, for all it does well, it is also deeply flawed."], "answer": 1, "clues": [["philosophers were considered worthy to have all the best things in life", "주어진 문장은 ① 앞 문장의 '그 시대 철학자들이 높은 특권을 누렸다'는 말의 이유·내용을 이어 줌"], ["that assertion", "① 뒤 문장의 that assertion(그 주장) = 주어진 문장의 '철학자는 최고의 것을 누릴 자격이 있다'는 주장 → 주어진 문장이 빠지면 가리킬 주장이 사라짐"]], "flow": ["아리스토텔레스의 일부 생각은 오늘날 이상하게 보임", "노예제를 정당화했고, 당시 철학자들은 큰 특권을 누림", "철학자는 최고선을 사유하므로 최고의 것을 누릴 자격이 있다고 여겨짐", "그 주장은 묘하게 자기 잇속을 챙기는 말처럼 보임", "위대한 사상가도 자기 시대 사람 — 그의 생각은 특권층의 시각이라 결점이 있음"]}, {"id": "m2610g2-29", "src": "mock_2610_g2.txt", "label": "26년 10월 29번", "type": "order", "given": "You might think of survival as a race in which a hurdle has to be jumped every year. The early hurdles were once very high, and many people fell before clearing the first few.", "parts": {"B": "Demographically, humankind was living close to a state of nature, and nature is extremely wasteful of life. From only a very small number of figs will even one of many seeds become a fig tree. Almost a quarter of baboons born in the wild die before they are a year old, which is fairly typical for primates.", "A": "Infant mortality rates for humans in pre-modern agricultural societies were similar to, and sometimes higher than, those of apes.", "C": "Things were little better for our hunter-gatherer ancestors, a quarter of whom failed to reach their first birthday, while another quarter didn't live long enough to reproduce just about everywhere until the nineteenth century. Had it been otherwise, the huge recent growth in human population would have occurred much earlier."}, "answer": "B-A-C", "hint": {"given": "생존은 매년 허들을 넘는 경주 — 옛날엔 처음 허들이 아주 높아서 많은 사람이 넘어짐", "A": "옛 농경 사회 사람 아기의 사망률도 유인원과 비슷하거나 더 높았음", "B": "인류는 자연 상태에 가깝게 살았고 자연은 생명을 엄청나게 낭비함 — 무화과 씨앗은 극히 일부만 나무가 되고, 야생 개코원숭이는 거의 4분의 1이 한 살 전에 죽음", "C": "수렵 채집인 조상도 별로 나을 게 없었음 — 그렇지 않았다면 인구 급증이 훨씬 일찍 일어났을 것"}, "clues": [["nature is extremely wasteful of life", "(B)는 주어진 글의 '높은 허들에 많이 넘어짐'을 '자연은 생명을 낭비한다'로 받고 식물·동물 예를 듦 → 주어진 글 바로 뒤"], ["those of apes", "(A)의 those of apes(유인원의 사망률)는 (B) 끝의 primates(영장류) 이야기를 받음 → (B) 뒤"], ["Things were little better", "(C)의 '형편이 별로 나을 게 없었다'는 앞에 사람 아기의 높은 사망률((A))이 나와 있어야 함 → (A) 뒤"], ["Had it been otherwise", "(C) 안의 '그렇지 않았다면' = 사망률이 높지 않았다면 → 맨 끝 마무리"]], "flow": ["생존 = 매년 허들 넘기, 옛날엔 처음 허들이 아주 높았음", "자연은 생명을 낭비함 — 무화과 씨앗, 개코원숭이 예시", "옛 농경 사회 사람 아기 사망률도 유인원 수준", "수렵 채집인도 마찬가지, 그래서 인구 급증이 늦어짐"]}, {"id": "m2610g2-32", "src": "mock_2610_g2.txt", "label": "26년 10월 32번", "type": "insert", "sentence": "For example, courts are traditional social institutions and important for the normal and harmonious functioning of collective life.", "segs": ["", "If we understand mass culture as a weakening factor of the cultural ties that unite people to their traditions, mass culture weakens the intermediary institutions in society (e.g. the family or the school), diminishing their role and overlapping these institutions.", "However, when people turn to social networks to put pressure on judicial decisions in certain mediated and politicized processes, this practice is popularized and becomes a habitual form of culture, which is harmful.", "Justice must not be done in the public square, which today is converted into a virtual dimension, the social networks.", "In a democratic state of law, the appropriate place to judge and make justice is the court and in a way that is immune to popular pressure.", ""], "answer": 2, "clues": [["For example, courts", "주어진 문장의 For example = ②앞 문장의 '가족·학교 같은 매개 제도'의 또 다른 예로 법원을 듦"], ["judicial decisions", "②뒤 문장의 judicial decisions(재판 판결)는 법원(courts)이 먼저 나와야 이해됨 — 주어진 문장이 빠지면 However가 무엇과 대조되는지 사라짐"]], "flow": ["대중문화는 가족·학교 같은 매개 제도의 역할을 약하게 만듦", "예: 법원도 사회에 중요한 전통 제도임", "그런데 소셜 네트워크로 판결에 압력을 넣는 일이 습관처럼 퍼짐 — 해로움", "정의는 가상 광장(소셜 네트워크)에서 이뤄지면 안 됨", "재판은 법원에서, 대중 압력에 흔들리지 않게"]}, {"id": "m2610g2-33", "src": "mock_2610_g2.txt", "label": "26년 10월 33번", "type": "order", "given": "Human development is now increasingly understood as an ongoing, flexible, and evolving process rather than a fixed sequence of stages.", "parts": {"A": "The concept of plasticity challenges this rigid outlook by emphasizing that development continues across the entire lifespan. Although the extent of change may vary at different stages, every phase of life allows room for adaptation and transformation.", "B": "At the core of this perspective lies the concept of plasticity. Plasticity refers to the human capacity to change, adapt, and reorganize cognitive, emotional, and behavioural patterns in response to life experiences, environmental demands, and biological changes. It highlights that individuals are not merely passive recipients of development but active agents capable of growth throughout their lives.", "C": "In earlier views, development was believed to occur mainly during childhood, with adulthood seen as a period of stability and old age as a phase of decline."}, "answer": "B-C-A", "hint": {"given": "인간 발달은 이제 고정된 단계가 아니라 계속 유연하게 변하는 과정으로 이해됨", "A": "가소성 개념은 발달이 평생 계속된다고 강조하며 이 딱딱한 생각에 반대함 — 어느 시기든 변화의 여지가 있음", "B": "이 관점의 중심엔 가소성이 있음 — 가소성 = 경험·환경에 맞춰 바뀌고 적응하는 능력, 사람은 평생 성장하는 능동적 주체", "C": "예전 관점에서는 발달은 주로 아동기에, 성인기는 안정, 노년기는 쇠퇴라고 봄"}, "clues": [["At the core of this perspective", "(B)의 this perspective = 주어진 글의 '발달은 고정 단계가 아니라 계속 변하는 과정'이라는 관점 → 주어진 글 바로 뒤"], ["In earlier views", "(C)의 earlier views(예전 관점) = (B)의 새 관점(평생 성장)과 대비되는 옛날 생각 → (B) 뒤"], ["this rigid outlook", "(A)의 this rigid outlook(이 딱딱한 사고방식) = (C)의 '아동기에만 발달, 노년은 쇠퇴'라는 옛 관점 → (C) 바로 뒤"]], "flow": ["발달은 고정된 단계가 아니라 계속 변하는 과정", "그 중심에 가소성 — 경험·환경에 맞춰 바뀌는 능력, 평생 성장", "예전엔 아동기 발달, 성인기 안정, 노년기 쇠퇴로 봄", "가소성은 이 딱딱한 생각에 반대 — 평생 발달, 어느 시기든 변화 가능"]}, {"id": "m2610g2-40", "src": "mock_2610_g2.txt", "label": "26년 10월 40번", "type": "order", "given": "One key adaptation is the structure of the dolphin's auditory pathway. The signals from the ears are rapidly transmitted to the auditory cortex, the brain region responsible for processing sound.", "parts": {"C": "However, unlike many other mammals, dolphins have a highly specialized auditory cortex with distinct areas dedicated to processing different aspects of echolocation signals. Some areas may be responsible for analyzing the timing of echoes, while others focus on the frequency content or the intensity of the sound.", "B": "This specialization allows the dolphin's brain to process echo information in parallel, rather than sequentially.", "A": "Imagine a factory assembly line, where different workers are responsible for different tasks. By dividing the work among specialized areas, the brain can process information much faster and more efficiently. This parallel processing reduces the cognitive load associated with echolocation, allowing dolphins to react quickly to changes in their environment."}, "answer": "C-B-A", "hint": {"given": "돌고래 청각 경로의 구조 — 귀의 신호가 소리를 처리하는 청각 피질로 빠르게 전달됨", "A": "공장 조립 라인처럼 일을 나누면 더 빠르고 효율적 — 이 병렬 처리로 부담이 줄어 빨리 반응함", "B": "이렇게 나뉜 덕분에 돌고래 뇌는 메아리 정보를 하나씩이 아니라 동시에(병렬로) 처리함", "C": "그런데 다른 포유류와 달리 돌고래 청각 피질은 구역이 나뉘어 있고, 구역마다 맡은 일이 다름"}, "clues": [["However, unlike many other mammals", "(C)의 However = 주어진 글의 '보통의 청각 피질' 설명과 대조되는 돌고래만의 특징 → 주어진 글 바로 뒤"], ["This specialization", "(B)의 This specialization = (C)의 '구역마다 맡은 일이 다른' 전문화 → (C) 뒤"], ["This parallel processing", "(A) 안의 This parallel processing = (B)의 in parallel(병렬로) → (B) 뒤"]], "flow": ["귀의 신호가 청각 피질로 빠르게 전달됨", "돌고래 피질은 구역별로 맡은 일이 다름", "그래서 정보를 동시에(병렬로) 처리함", "조립 라인처럼 일을 나눠 빠르고 부담이 적음 → 빠른 반응"]}, {"id": "m2610g2-41", "src": "mock_2610_g2.txt", "label": "26년 10월 41번", "type": "insert", "sentence": "The balance is to not see it as idle time, wasted time, or boredom but rather as a perfect time for self-improvement, self-identification, and positive reflection time.", "segs": ["It is crucial to recognize that boredom can give rise to harmful emotions such as depression, despair, and irritation if not adequately addressed.", "When we believe that the only way to be happy is by searching for fun activities, then we become dependent on those activities, and negative thoughts and emotions arise.", "It is suggested that 'Idle time is the devil's workshop' implies that those with too much time on their hands may fill that time with troubling thoughts and behavior.", "Reflecting, just how lucky are we to be bored?", "Boredom doesn't exist in the presence of danger, as it is only an indulgence pastime in a safe zone.", "Boredom can be perceived as a luxury that typically manifests in safe and inactive situations, providing an occasion to appreciate and comprehend the environment. In hazardous circumstances, the luxury of boredom is unavailable."], "answer": 3, "clues": [["not see it as idle time", "주어진 문장의 it = ③ 앞 문장의 that time(남아도는 시간), idle time(한가한 시간)도 ③ 앞 속담에서 나온 말"], ["The balance is", "주어진 문장의 The balance(균형점) = 앞의 '한가한 시간은 괴로운 생각으로 채워진다'는 걱정에 대한 해법 → 이 문장이 빠지면 ③ 뒤 '지루할 수 있어 얼마나 운이 좋은가'로 갑자기 뒤집힘"]], "flow": ["지루함을 방치하면 우울·짜증 같은 해로운 감정이 생김", "재미만 찾으면 거기에 의존하게 되고 부정적 감정이 생김", "'한가한 시간은 악마의 작업장' — 남는 시간을 괴로운 생각으로 채움", "균형점: 그 시간을 낭비가 아니라 자기 계발·성찰의 시간으로 볼 것", "생각해 보면 지루할 수 있다는 건 행운", "지루함은 안전할 때만 누리는 사치"]}, {"id": "m2410-22", "src": "mock_2410_g2.txt", "label": "24년 10월 22번", "type": "order", "given": "To determine the mass of my bowling ball, I might put it onto a balance and compare it with a known mass, such as a number of metal cubes each weighing 1, 10, or 100 grams.", "parts": {"A": "We can roughly say that measuring the mass of a star involves various theories. If we want to measure the mass of a binary star, we first determine a center of mass between the two stars, then their distance from that center which we can then use, together with a value for the period and a certain instance of Kepler’s Third Law, to calculate the mass.", "B": "In other words, in order to “measure” the star mass, we measure other quantities and use those values, together with certain equations, to calculate the mass. Measurement is not a simple and unmediated estimation of independently existing properties, but a determination of certain magnitudes before the background of a number of accepted theories.", "C": "Things get much more complicated if I want to know the mass of a distant star. How do I measure it?"}, "answer": "C-A-B", "hint": {"given": "볼링공의 질량은 저울에 올려 이미 아는 질량과 비교하면 알 수 있음", "A": "별의 질량 측정엔 여러 이론이 들어감 — 쌍성은 질량 중심·거리·공전주기·케플러 법칙으로 계산", "B": "즉 다른 값을 재서 방정식으로 계산하는 것 — 측정은 이론을 바탕으로 한 결정", "C": "먼 별의 질량은 훨씬 복잡함 — 그걸 어떻게 잴까?"}, "clues": [["Things get much more complicated", "(C)의 much more complicated = 주어진 글의 쉬운 볼링공 측정과 비교해 별은 더 복잡하다는 대조"], ["How do I measure it?", "(C)의 it = 먼 별의 질량, 이 질문에 대한 답이 (A)에서 시작됨"], ["In other words", "(B)의 In other words = (A)의 쌍성 계산 과정을 한마디로 다시 정리하는 연결어"]], "flow": ["볼링공: 저울에 올려 아는 질량과 비교", "먼 별의 질량은 훨씬 복잡함 — 어떻게 잴까?", "별 질량 측정엔 이론이 들어감(쌍성 계산 예)", "즉 다른 값 + 방정식으로 계산 → 측정 = 이론 바탕의 결정"]}, {"id": "m2410-23", "src": "mock_2410_g2.txt", "label": "24년 10월 23번", "type": "insert", "sentence": "Well, according to psychiatrist Dr. Anna Lembke, there may be some truth to these words.", "segs": ["Based on discoveries in neuroscience, pain and pleasure are formed and processed in the same area of the brain. Our bodies constantly strive for homeostasis, which is defined as the balance of bodily functions.", "Without the body’s effective compensatory mechanisms, which may cushion potential highs and lows, we would not be capable of surviving.", "Pleasure and pain are like two sides of the same coin; they seem to work together and are heavily reliant on one another and keep balance. If you imagine pleasure and pain as the two opposite points on a scale, you can easily understand that as one of the two points rises, the other must correspondingly fall.", "We’ve all heard the expression, “No pain, no gain.”", "She says that our attempts to escape being miserable are in fact making us even more miserable.", "This is because pain is actually an essential component of our ability to maintain a neutral state, and allowing it will in turn reset our internal scale back to balance."], "answer": 4, "clues": [["these words", "주어진 문장의 these words = 바로 앞 “No pain, no gain.”(고통 없이는 얻는 것도 없다)"], ["Dr. Anna Lembke", "④ 뒤 문장의 She = 주어진 문장에서 처음 등장하는 정신과 의사 Anna Lembke, 이 사람이 빠지면 She가 가리킬 사람이 없음"]], "flow": ["고통과 쾌락은 뇌의 같은 영역에서 만들어짐, 몸은 균형(항상성)을 추구", "고통과 쾌락은 동전의 양면·저울의 양 끝", "“No pain, no gain.”이라는 말", "Lembke 박사: 이 말에 일리가 있음", "비참함을 피하려는 시도가 더 비참하게 만듦", "고통을 허용해야 내부 저울이 균형으로 돌아옴"]}, {"id": "m2410-24", "src": "mock_2410_g2.txt", "label": "24년 10월 24번", "type": "insert", "sentence": "This cycle isn’t just confined to our digital companions.", "segs": ["Manufacturers masterfully sow seeds of doubt about the adequacy of our current devices.", "Suddenly, the phone that was your lifeline a year ago is now a museum piece, unable to keep pace with your digital demands.", "And thus, the itch to upgrade begins, often before there’s a genuine need.", "It spills over into almost every aspect of consumer electronics, from the self-driving car to the smart fridge.", "Every product seems to be on an unstoppable march towards the next version, the next generation that promises to revolutionize your life.", "What’s fascinating, or perhaps disturbing, is the utter efficacy of this cycle in shaping our desires. It’s not so much that we want the newest device; we’re led to believe we need it."], "answer": 3, "clues": [["This cycle", "주어진 문장의 This cycle = 앞 문장들의 '기기가 낡아 보이게 만듦 → 업그레이드하고 싶어짐'이라는 반복"], ["our digital companions", "digital companions(디지털 동반자) = 앞에 나온 휴대폰 같은 기기"], ["It spills over", "③ 뒤 문장의 It = 주어진 문장의 This cycle, '디지털 기기에만 그치지 않고 → 다른 전자제품으로 번짐'으로 이어짐"]], "flow": ["제조사가 지금 기기가 부족하다는 의심을 심음", "1년 전 생명줄이던 폰이 이제 박물관 유물처럼 느껴짐", "그래서 필요 전에 업그레이드 욕구가 생김", "이 순환은 디지털 기기에만 그치지 않음", "자율주행차·스마트 냉장고까지 번짐", "모든 제품이 다음 버전으로 행진함", "이 순환이 욕구를 만드는 힘 — 원하는 게 아니라 필요하다고 믿게 됨"]}, {"id": "m2410-29", "src": "mock_2410_g2.txt", "label": "24년 10월 29번", "type": "order", "given": "Conditioned Place Preference is a way of finding out what animals want. Researchers train them to associate one place with an experience such as food or a loud noise and another place with something completely different, usually where nothing happens.", "parts": {"A": "Conversely, if it now avoids the place the stimulus appeared and starts to prefer the place it did not experience it, then this suggests that it found the stimulus unpleasant. For example, mice with cancer show a preference for the place where they have been given morphine, a drug used to relieve pain, rather than where they have received saline whereas healthy mice developed no such preference. This suggests that the mice with cancer wanted the morphine.", "B": "The two places are made obviously different to make it as easy as possible for the animal to associate each place with what happened to it there. The animal’s preference for being in one place or another is measured both before and after its experiences in the two places.", "C": "If there is a shift in where the animal chooses to spend its time for the reward, this suggests that it liked the experience and is trying to repeat it."}, "answer": "B-C-A", "hint": {"given": "조건화된 장소 선호: 한 장소엔 먹이·큰 소리 같은 경험을, 다른 장소엔 아무 일 없음을 연결하도록 훈련", "A": "반대로 그 장소를 피하면 불쾌했다는 뜻 — 예: 암에 걸린 쥐는 모르핀 받은 곳을 선호", "B": "두 장소를 확실히 다르게 만들고, 경험 전후로 동물이 어느 장소를 좋아하는지 잼", "C": "머무는 장소가 바뀌면 그 경험을 좋아해서 반복하려는 것"}, "clues": [["The two places", "(B)의 The two places = 주어진 글의 one place와 another place"], ["measured both before and after", "(B)에서 전후를 재야 (C)의 '장소가 바뀌면(a shift)'을 말할 수 있음"], ["Conversely", "(A)의 Conversely(반대로) = (C)의 '좋아해서 다시 감'과 반대인 '피함'"]], "flow": ["동물이 원하는 걸 알아내는 방법: 장소와 경험을 연결하게 훈련", "두 장소를 확 다르게 만들고 경험 전후 선호를 잼", "선호 장소가 바뀌면 그 경험을 좋아한 것", "반대로 피하면 불쾌한 것 — 암 걸린 쥐는 모르핀 장소를 선호"]}, {"id": "m2410-30", "src": "mock_2410_g2.txt", "label": "24년 10월 30번", "type": "order", "given": "Most birds are not simply reluctant to breed at other times but they are also physically incapable of doing so. This is because their reproductive system shrinks, which helps flying birds save weight.", "parts": {"A": "The main exception to this rule are nomadic desert species. These can initiate their breeding cycle within days of rain. It’s for making the most of the sudden breeding opportunity.", "B": "In warm regions, however, songbirds may raise several families in a few months. In an exceptionally good year, a pair of House Sparrows, a kind of songbird, can raise successive broods through a marathon reproductive effort.", "C": "Also, different species divide the breeding season up in different ways. Most seabirds raise a single brood."}, "answer": "A-C-B", "hint": {"given": "대부분의 새는 다른 때엔 번식을 못 함 — 생식 기관이 줄어들어 몸무게를 아끼기 때문", "A": "이 규칙의 예외는 떠돌이 사막 새 — 비가 오면 며칠 만에 번식 시작", "B": "하지만 따뜻한 곳의 명금류는 몇 달 동안 여러 번 — 참새 한 쌍은 연달아 번식", "C": "또 종마다 번식기를 나누는 방식이 다름 — 대부분의 바닷새는 한 번만 새끼를 기름"}, "clues": [["The main exception to this rule", "(A)의 this rule = 주어진 글의 '다른 때엔 번식 못 함'이라는 규칙"], ["Also, different species", "(C)의 Also = 사막 새 이야기에 이어 새로운 내용(번식기 나누는 방식)을 덧붙이는 연결어"], ["however", "(B)의 however = (C)의 '바닷새는 한 번만'과 반대인 '명금류는 여러 번'"]], "flow": ["대부분 새는 정해진 때 외엔 번식 못 함(생식 기관이 줄어듦)", "예외: 사막 새는 비 오면 바로 번식", "또 종마다 번식기 나누는 방식이 다름 — 바닷새는 한 번", "하지만 명금류(참새 등)는 여러 번 번식"]}, {"id": "m2410-33", "src": "mock_2410_g2.txt", "label": "24년 10월 33번", "type": "order", "given": "Some people argue that there is a single, logically consistent concept known as reading that can be neatly set apart from everything else people do with books. Is reading really that simple?", "parts": {"A": "Thus, it is worth attempting to collect together these exceptional forms of reading into a single forum, one highlighting the challenges faced by anyone wishing to establish the boundaries where reading begins and ends. The attempt moves toward an understanding of reading as a spectrum that is expansive enough to accommodate the distinct reading activities.", "B": "Consequently, efforts to distinguish reading from nonreading are destined to fail because there is no agreement on what qualifies as reading in the first place. The more one tries to figure out where the border lies between reading and not-reading, the more edge cases will be found to stretch the term’s flexible boundaries.", "C": "The most productive way to think about reading is as a loosely related set of behaviors that belong together owing to family resemblances, as Ludwig Wittgenstein used the phrase, without having in common a single defining trait."}, "answer": "C-B-A", "hint": {"given": "읽기는 다른 행동과 깔끔하게 구분되는 하나의 개념이라는 주장 — 정말 그렇게 단순할까?", "A": "따라서 이런 예외적 읽기를 한데 모아 보는 게 가치 있음 — 읽기를 넓은 스펙트럼으로 이해", "B": "그래서 읽기/읽기 아님을 구분하려는 노력은 실패함 — 경계를 찾을수록 예외(경계 사례)가 늘어남", "C": "읽기는 공통된 한 가지 특징 없이 '가족 유사성'으로 느슨하게 묶인 행동들로 보는 게 가장 좋음"}, "clues": [["Is reading really that simple?", "주어진 글의 질문에 대한 답(아니다, 느슨한 묶음이다)이 (C)"], ["Consequently", "(B)의 Consequently(그 결과) = (C)의 '하나의 정의된 특징이 없음'에서 나오는 결과"], ["these exceptional forms of reading", "(A)의 these exceptional forms = (B)의 edge cases(경계 사례)"]], "flow": ["읽기는 단순한 하나의 개념? — 정말 그럴까?", "읽기 = 가족 유사성으로 느슨하게 묶인 행동들", "그래서 읽기/읽기 아님 구분은 실패, 경계 사례가 늘어남", "따라서 예외적 읽기를 모아 보자 → 읽기는 스펙트럼"]}, {"id": "m2311-21", "src": "mock_2311_g2.txt", "label": "23년 11월 21번", "type": "order", "given": "The arts and aesthetics offer emotional connection to the full range of human experience.", "parts": {"A": "“In art, when there’s something challenging, which can also be uncomfortable, this discomfort, if we’re willing to engage with it, offers the possibility of some change, some transformation. That can also be a powerful aesthetic experience.”", "B": "“The arts can be more than just sugar on the tongue,” Anjan Chatterjee, a professor at the University of Pennsylvania, says.", "C": "The arts, in this way, become vehicles to contend with ideas and concepts that are difficult and uncomfortable otherwise. When Picasso painted his masterpiece Guernica in 1937, he captured the heartbreaking and cruel nature of war, and offered the world a way to consider the universal suffering caused by the Spanish Civil War. When Lorraine Hansberry wrote her play A Raisin in the Sun, she gave us a powerful story of people struggling with racism, discrimination, and the pursuit of the American dream while also offering a touching portrait of family life."}, "answer": "B-A-C", "hint": {"given": "예술과 미학은 인간 경험 전체와 감정적으로 연결해 줌", "A": "예술 속 도전적이고 불편한 것을 기꺼이 마주하면 변화·변신의 가능성이 생기고, 그것도 강력한 미적 경험이 됨", "B": "Chatterjee 교수: 예술은 '혀 위의 설탕'(그냥 달콤한 것) 이상일 수 있음", "C": "이렇게 예술은 어렵고 불편한 생각을 다루는 수단이 됨 — 예: 피카소 게르니카(전쟁의 잔혹함), 핸스베리 희곡(인종차별과 가족의 삶)"}, "clues": [["“The arts can be more than just sugar on the tongue,”", "(B) = 주어진 글의 '예술은 인간 경험과 감정적으로 연결됨'을 교수의 말로 이어 감, 말한 사람(Chatterjee)이 처음 소개됨 → 주어진 글 바로 뒤"], ["“In art, when there’s something challenging", "(A) = 말한 사람 소개 없이 바로 이어지는 따옴표 인용 → 교수를 소개한 (B) 뒤, 설탕보다 더한 것 = 불편함"], ["The arts, in this way", "(C)의 in this way = (A)의 '불편함을 마주해 변화가 생김', difficult and uncomfortable도 (A)의 uncomfortable을 받음 → (A) 뒤"], ["When Picasso painted", "(C) 안의 피카소·핸스베리 = 어렵고 불편한 생각을 다루는 예술의 구체적 예"]], "flow": ["예술은 인간 경험과 감정적으로 연결", "교수: 예술은 '설탕' 이상", "불편함을 마주하면 변화가 생기고 그것도 강력한 미적 경험", "이렇게 예술 = 어려운 생각을 다루는 수단 — 예: 피카소 게르니카, 핸스베리 희곡"]}, {"id": "m2311-23", "src": "mock_2311_g2.txt", "label": "23년 11월 23번", "type": "order", "given": "It was an excellent device that would make it easy for shoppers to buy as much as they wanted without getting tired or seeking others’ help. But Goldman discovered that in spite of his repeated advertisements and explanations, he could not persuade his shoppers to use the wheeled carts.", "parts": {"A": "A young woman employee standing near the entrance told the regular shoppers, ‘Look, everyone is using the carts. Why don’t you?’ That was the turning point.", "B": "Men were reluctant because they thought they would appear weak if they pushed such carts instead of carrying their shopping. Women wouldn’t touch them because the carts reminded them of baby carriages. It was only a few elderly shoppers who used them.", "C": "That made the carts even less attractive to the majority of the shoppers. Then Goldman hit upon an idea. He hired several models, men and women, of different ages and asked them to wheel the carts in the store and shop."}, "answer": "B-C-A", "hint": {"given": "쇼핑 카트는 훌륭한 발명품이었지만, Goldman은 광고와 설명에도 손님들이 쓰게 하지 못함", "A": "입구의 젊은 여직원이 '보세요, 모두 카트를 쓰잖아요, 써 보세요' — 그것이 전환점이 됨", "B": "남자는 약해 보일까 봐, 여자는 유모차가 떠올라서 안 씀 — 몇몇 노인만 카트를 씀", "C": "그래서 카트는 손님들에게 더 매력 없어짐 — 그때 Goldman이 생각을 떠올려 여러 나이의 남녀 모델을 고용해 카트를 밀며 쇼핑하게 함"}, "clues": [["Men were reluctant", "(B) = 주어진 글의 '손님들을 설득 못 함'의 이유(남자·여자) → 주어진 글 바로 뒤"], ["That made the carts even less attractive", "(C)의 That = (B) 끝의 '노인 몇 명만 카트를 쓰는' 상황 → (B) 바로 뒤"], ["Then Goldman hit upon an idea.", "(C) 안의 Then = 문제가 더 나빠진 뒤 해결책이 나오는 시간 순서"], ["everyone is using the carts", "(A)의 '모두 카트를 쓴다' = (C)에서 고용한 모델들이 카트를 밀고 다니는 모습 → (C) 뒤"]], "flow": ["좋은 발명품 카트, 그러나 손님들이 안 씀", "남자는 약해 보일까 봐, 여자는 유모차 같아서, 노인만 씀", "그래서 더 인기 없어짐 → 아이디어: 모델을 고용해 카트를 밀게 함", "직원: '모두 쓰잖아요' → 전환점"]}, {"id": "m2311-30", "src": "mock_2311_g2.txt", "label": "23년 11월 30번", "type": "order", "given": "Technology changes how individuals and societies understand the concept of privacy. The fact that someone has a new ability to access information or watch the actions of another does not justify doing so.", "parts": {"A": "For example, when cameras first became available for commercial and private use, nations and citizens struggled over whether new laws should be enacted to protect individuals from being photographed without their permission. The reconsideration of privacy brought about by this new technology re-affirmed a distinction between private and public spaces.", "B": "It was determined by most cultures that people automatically gave consent to being seen ―and thus recorded ―once they voluntarily stepped into a public space. Although some people might be uncomfortable with the spread of surveillance cameras, citizens in most cultures have adjusted to the fact that giving up the right not to be observed in these circumstances causes less harm to the community than failing to have surveillance.", "C": "Rather, advances in technology require citizens and policy makers to consider how privacy protections should be expanded."}, "answer": "C-A-B", "hint": {"given": "기술은 사생활 개념을 바꿈 — 남의 정보를 볼 수 있게 됐다고 해서 그래도 된다는 건 아님", "A": "예: 카메라가 처음 나왔을 때 허락 없이 찍히는 걸 막는 법을 두고 고민함 — 그 결과 사적/공적 공간의 구분이 다시 확인됨", "B": "공적 공간에 스스로 들어가면 보이는 것(녹화)에 동의한 것으로 정함 — 감시카메라에도 적응함", "C": "오히려 기술 발전은 사생활 보호를 어떻게 넓힐지 생각하게 만듦"}, "clues": [["Rather", "(C)의 Rather(오히려) = 주어진 글의 '그래도 된다는 건 아님(does not justify)'을 받아 진짜 해야 할 일을 말함"], ["For example, when cameras first became available", "(A) = (C)의 '사생활 보호를 어떻게 넓힐지 고민'의 예"], ["a distinction between private and public spaces", "(A)의 사적/공적 공간 구분 → (B)의 public space(공적 공간)에 들어가면 동의한 것"]], "flow": ["기술이 사생활 개념을 바꿈 — 볼 수 있다고 봐도 되는 건 아님", "오히려 사생활 보호를 넓힐 방법을 고민해야 함", "예: 카메라 등장 → 사적/공적 공간 구분 재확인", "공적 공간에선 보이는 것에 동의 → 감시카메라에 적응"]}, {"id": "m2311-31", "src": "mock_2311_g2.txt", "label": "23년 11월 31번", "type": "order", "given": "Coincidence that is statistically impossible seems to us like an irrational event, and some define it as a miracle.", "parts": {"A": "Yet there are methodical and simple ways to “cause a miracle” without divine revelation and inspiration. Instead of checking it out, investigating and finding the source of the event, we define it as a miracle. The miracle, then, is the excuse of those who are too lazy to think.", "B": "But, as Montaigne has said, “the origin of a miracle is in our ignorance, at the level of our knowledge of nature, and not in nature itself.” Glorious miracles have been later on discovered to be obedience to the laws of nature or a technological development that was not widely known at the time.", "C": "As the German poet, Goethe, phrased it: “Things that are mysterious are not yet miracles.” The miracle assumes the intervention of a “higher power” in its occurrence that is beyond human capability to grasp."}, "answer": "B-C-A", "hint": {"given": "통계적으로 불가능한 우연은 비이성적인 사건 같아서 기적이라 부르기도 함", "A": "하지만 신의 계시 없이도 기적을 '일으키는' 방법이 있음 — 알아보지 않고 기적이라 부름 = 생각하기 귀찮은 사람의 핑계", "B": "그러나 몽테뉴: 기적의 근원은 자연이 아니라 우리의 무지 — 기적은 나중에 자연법칙·기술로 밝혀짐", "C": "괴테: 신비로운 것이 아직 기적은 아님 — 기적은 인간이 이해 못 하는 '더 높은 힘'을 가정함"}, "clues": [["But, as Montaigne has said", "(B)의 But = 주어진 글의 '기적이라 부름'에 반대하는 의견 시작"], ["As the German poet, Goethe, phrased it", "(C) = (B)의 몽테뉴 말에 이어 같은 생각을 다른 사람(괴테) 말로 덧붙임"], ["Yet there are methodical and simple ways", "(A)의 Yet = (C)의 '인간이 이해 못 하는 더 높은 힘'과 반대로 쉽게 기적을 만드는 방법이 있음"]], "flow": ["불가능해 보이는 우연을 기적이라 부름", "몽테뉴: 기적의 근원은 우리의 무지", "괴테: 신비로운 것은 아직 기적 아님 — 기적은 '더 높은 힘'을 가정", "하지만 알아보지 않고 기적이라 부를 뿐 → 기적 = 게으른 사람의 핑계"]}, {"id": "m2311-32", "src": "mock_2311_g2.txt", "label": "23년 11월 32번", "type": "insert", "sentence": "Instead, especially when it fits the witness’s current thinking and can be used to create a story that makes sense to him or her, it may be integrated as part of the original experience.", "segs": ["Information encountered after an event can influence subsequent remembering.", "External information can easily integrate into a witness’s memory, especially if the event was poorly encoded or the memory is from a distant event, in which case time and forgetting have degraded the original memory.", "With reduced information available in memory with which to confirm the validity of post-event misinformation, it is less likely that this new information will be rejected.", "This process can be explicit (i.e., the witness knows it is happening), but it is often unconscious.", "That is, the witness might find himself or herself thinking about the event differently without awareness.", "Over time, the witness may not even know the source of information that led to the (new) memory."], "answer": 3, "clues": [["Instead", "주어진 문장의 Instead(대신에) = 앞 문장의 '새 정보가 거부될 가능성이 낮음'을 받아 '거부 대신 원래 경험의 일부로 합쳐짐'"], ["it may be integrated", "주어진 문장의 it = 앞 문장의 this new information(사건 뒤의 잘못된 정보)"], ["This process can be explicit", "③ 뒤 문장의 This process = 주어진 문장의 '원래 경험처럼 합쳐지는 과정', 이게 빠지면 가리킬 과정이 없음"]], "flow": ["사건 뒤에 접한 정보가 기억에 영향을 줌", "기억이 약하면 외부 정보가 쉽게 섞여 들어감", "확인할 기억이 적으니 잘못된 정보가 거부될 가능성이 낮음", "대신 원래 경험의 일부로 합쳐짐", "이 과정은 의식적일 수도 있지만 대개 무의식적", "목격자는 모르는 새 사건을 다르게 생각함", "나중엔 그 정보의 출처도 모름"]}, {"id": "m2311-33", "src": "mock_2311_g2.txt", "label": "23년 11월 33번", "type": "insert", "sentence": "A correlation analysis showed that orange-colored cars were far less likely to have defects.", "segs": ["Correlations are powerful because the insights they offer are relatively clear. These insights are often covered up when we bring causality back into the picture.", "For instance, a used-car dealer supplied data to statisticians to predict which of the vehicles available for purchase at an auction were likely to have problems.", "Even as we read this, we already think about why it might be so:", "Are orange-colored car owners likely to be car enthusiasts and take better care of their vehicles? Or, is it because orange-colored cars are more noticeable on the road and therefore less likely to be in accidents, so they’re in better condition when resold?", "Quickly we are caught in a web of competing causal hypotheses.", "But our attempts to illuminate things this way only make them cloudier."], "answer": 2, "clues": [["A correlation analysis showed", "주어진 문장 = 앞 문장의 중고차 딜러 데이터 분석의 결과(주황색 차가 결함이 적음)"], ["Even as we read this", "② 뒤 문장의 this = 주어진 문장의 '주황색 차가 결함이 적다'는 결과, 이게 빠지면 why it might be so(왜 그런지)도 가리킬 게 없음"], ["orange-colored", "뒤 문장들의 orange-colored car owners는 주어진 문장에서 처음 나오는 주황색 차가 있어야 이해됨"]], "flow": ["상관관계는 통찰이 분명함 — 인과를 끌어오면 가려짐", "예: 중고차 딜러가 어떤 차에 문제 있을지 데이터를 줌", "분석 결과: 주황색 차가 결함이 훨씬 적음", "읽자마자 '왜 그럴까' 생각함", "차를 아껴서? 눈에 잘 띄어 사고가 적어서?", "경쟁하는 인과 가설의 거미줄에 걸림", "이렇게 밝히려 할수록 더 흐려짐"]}, {"id": "m2311-34", "src": "mock_2311_g2.txt", "label": "23년 11월 34번", "type": "insert", "sentence": "In contrast to mice, bats can fly, which is why they can escape from danger much faster.", "segs": ["Most mice in the wild are eaten or die before their life span of two years is over.", "They die from external causes, such as disease, starvation, or predators, not due to internal causes, such as aging.", "That is why nature has made mice to live, on average, for no longer than two years. Now we have arrived at an important point: The average life span of an animal species, or the rate at which it ages, is determined by the average time that this animal species can survive in the wild. That explains why a bat can live to be 30 years old.", "Thanks to their wings, bats can also cover longer distances and are better able to find food.", "Every genetic change in the past that made it possible for a bat to live longer was useful, because bats are much better able than mice to flee from danger, find food, and survive.", ""], "answer": 3, "clues": [["In contrast to mice", "주어진 문장 = 앞의 쥐(위험에 잡아먹힘)와 대조해 박쥐의 장점(날 수 있음)을 처음 말함 → 박쥐가 30년 사는 이유"], ["Thanks to their wings, bats can also", "③ 뒤 문장의 their wings와 also = 주어진 문장의 '날 수 있어서 위험을 빨리 피함'이 바로 앞에 있어야 '또' 날개 덕분에 먹이도 잘 찾음이 말이 됨"], ["That explains why a bat can live to be 30 years old.", "③ 앞 문장 = 박쥐가 30년 사는 것을 말하고, 그 이유(날 수 있음)가 주어진 문장으로 이어짐"]], "flow": ["야생 쥐는 대부분 2년 전에 외부 원인으로 죽음", "그래서 쥐는 평균 2년 이상 못 살게 됨", "동물의 수명은 야생에서 살아남는 평균 시간이 결정", "그래서 박쥐는 30년을 살 수 있음", "쥐와 달리 박쥐는 날 수 있어 위험을 빨리 피함", "날개 덕분에 먹이도 잘 찾음", "오래 살게 하는 유전적 변화가 박쥐에겐 쓸모 있었음"]}, {"id": "m2311-40", "src": "mock_2311_g2.txt", "label": "23년 11월 40번", "type": "order", "given": "Multiple laboratory studies show that cooperative people tend to receive social advantages from others. One way to demonstrate this is to give people the opportunity to act positively or negatively toward contributors.", "parts": {"A": "People who contribute toward their groups are also chosen more often as interaction partners, preferred as leaders, rated as more desirable partners for long-term relationships, and are perceived to be trustworthy and have high social status. Uncooperative people tend to receive verbal criticism or even more severe punishment.", "B": "People who contributed more to the group fund were given responsibility for more money than people who contributed less. Similar results have been found by other researchers.", "C": "For example, Pat Barclay, a professor at the University of Guelph, had participants play a cooperative game where people could contribute money toward a group fund which helped all group members, and then allowed participants to give money to other participants based on their reputations."}, "answer": "C-B-A", "hint": {"given": "협력적인 사람은 남들에게 사회적 이득을 받음 — 기여자에게 좋게/나쁘게 대할 기회를 줘서 보여 줄 수 있음", "A": "집단에 기여하는 사람은 파트너·리더로도 더 선택되고 믿을 만하게 여겨짐 — 비협조적인 사람은 비판·처벌받음", "B": "기금에 더 많이 낸 사람이 더 많은 돈을 맡음 — 다른 연구자들도 비슷한 결과", "C": "예: Barclay 교수의 실험 — 집단 기금에 돈을 내는 게임 후 평판에 따라 다른 사람에게 돈을 주게 함"}, "clues": [["For example, Pat Barclay", "(C)의 For example = 주어진 글의 '좋게/나쁘게 대할 기회를 주는 방법'의 실제 실험"], ["People who contributed more to the group fund", "(B)의 the group fund = (C) 게임에 나온 집단 기금, 그 실험의 결과"], ["are also chosen more often", "(A)의 also = (B)의 '돈을 더 맡음'에 더해 또 다른 이득"]], "flow": ["협력적인 사람은 사회적 이득을 받음", "예: 집단 기금 게임 실험", "더 많이 낸 사람이 더 많은 돈을 맡음(비슷한 결과 多)", "또 파트너·리더로 선택됨, 비협조자는 비판받음"]}, {"id": "m2311-41", "src": "mock_2311_g2.txt", "label": "23년 11월 41번", "type": "insert", "sentence": "It is quite common in classical music to provide audiences with program notes.", "segs": ["Some performing musicians have won great approval by regularly incorporating “audience participation” into their concerts. Whether by leading a sing-along activity or teaching a rhythm to be clapped at certain points, including audience members in the music making can boost the level of engagement and enjoyment for all involved.", "Performers who are uncomfortable leading audience participation can still connect with the audience simply by giving a special glimpse of the performer perspective.", "Typically, this text in a program gives background information about pieces of music being performed and perhaps biographical information about historically significant composers.", "What may be of more interest to audience members is background information about the very performers who are onstage, including an explanation of why they have chosen the music they are presenting.", "Such insight can make audience members feel closer to the musicians onstage, both metaphorically and emotionally.", "This connection will likely enhance the expressive and communicative experience."], "answer": 2, "clues": [["program notes", "주어진 문장의 program notes(프로그램 노트) = 클래식 공연에서 관객에게 주는 안내 글"], ["this text in a program", "② 뒤 문장의 this text in a program = 주어진 문장의 program notes, 이게 빠지면 this text가 가리킬 것이 없음"], ["giving a special glimpse of the performer perspective", "앞 문장의 '연주자 관점을 살짝 보여 주기' 방법으로 프로그램 노트 이야기가 시작되는 자리"]], "flow": ["관객 참여(따라 부르기·박수)는 모두의 몰입을 높임", "참여 이끌기가 불편한 연주자도 연주자 관점을 보여 주면 됨", "클래식에선 프로그램 노트를 주는 게 흔함", "보통 곡·작곡가 배경 정보를 줌", "관객이 더 궁금한 건 무대 위 연주자와 곡을 고른 이유", "이런 정보는 관객을 연주자와 더 가깝게 함", "이 연결이 표현·소통 경험을 높임"]}, {"id": "m2211-29", "src": "mock_2211_g2.txt", "label": "22년 11월 29번", "type": "insert", "sentence": "Product proliferation is another potential pre-emption strategy.", "segs": ["Pre-emption means that a strategy is designed to prevent a rival from starting some particular activity. In some case a pre-emptive move may simply be an announcement of some intent that might discourage rivals from doing the same.", "The idea of pre-emption implies that timing is sometimes very important — a decision or an action at one point in time might be much more rewarding than doing it at a different time point.", "Pre-emption may involve up-weighting advertising for a period before and during when a new entrant launches into a market.", "The intent is to make it more difficult for the new entrant’s advertising to make an impression on potential buyers.", "The general idea is to launch a large variety of product variants so that there is very little in the way of market demand that is not accommodated.", "Arguably, if a market is already filled with product variants it is more difficult for competitors to find untapped pockets of market demand."], "answer": 4, "clues": [["another potential pre-emption strategy", "주어진 문장의 another = 앞의 첫 번째 선제 전략(광고 늘리기) 다음에 나오는 '또 다른' 전략"], ["The general idea is to launch a large variety of product variants", "④ 뒤 문장의 product variants(제품 변형) = 주어진 문장의 Product proliferation(제품 확산), 이게 빠지면 갑자기 제품 이야기로 튐"]], "flow": ["선제 = 경쟁자가 어떤 활동을 시작 못 하게 막는 전략, 의도를 발표하는 것만으로도 가능", "선제는 타이밍이 중요함", "전략 1: 신규 진입자 출시 전후로 광고를 늘림", "의도: 신규 진입자 광고가 눈에 안 띄게", "전략 2: 제품 확산", "다양한 제품 변형을 출시해 빈 수요를 없앰", "시장이 꽉 차 있으면 경쟁자가 빈틈을 찾기 어려움"]}, {"id": "m2211-30", "src": "mock_2211_g2.txt", "label": "22년 11월 30번", "type": "order", "given": "When sunlight illuminates an object from above, the object will be brightest on top. The color of the object will gradually shade darker toward the bottom.", "parts": {"A": "Most animals, however, are darker above than they are below. When they are illuminated from above, the darker back is lightened and the lighter belly is shaded.", "B": "This shading gives the object depth and allows the viewer to distinguish its shape. Thus even if an animal is exactly, but uniformly, the same color as the substrate, it will be easily visible when illuminated.", "C": "The animal thus appears to be a single color and easily blends in with the substrate. This pattern of coloration, or countershading, destroys the visual impression of shape in the organism. It allows the animal to blend in with its background."}, "answer": "B-A-C", "hint": {"given": "햇빛이 위에서 비추면 물체 윗면이 가장 밝고 아래로 갈수록 어두워짐", "A": "하지만 대부분 동물은 위가 아래보다 어두움 — 위에서 빛을 받으면 등은 밝아지고 배는 어두워짐", "B": "이 음영이 깊이를 줘서 모양이 보임 — 그래서 배경과 같은 색이어도 빛을 받으면 잘 보임", "C": "그래서 한 가지 색처럼 보여 배경에 섞임 — 이것이 카운터셰이딩"}, "clues": [["This shading", "(B)의 This shading = 주어진 글의 '위는 밝고 아래로 갈수록 어두워짐'"], ["Most animals, however", "(A)의 however = (B)의 '같은 색이어도 잘 보임'과 반대로 동물은 다르게 생김"], ["The animal thus appears to be a single color", "(C)의 thus = (A)의 '등은 밝아지고 배는 어두워짐'의 결과"]], "flow": ["위에서 빛 → 위는 밝고 아래는 어두움", "이 음영으로 모양이 보임 → 같은 색이어도 잘 보임", "하지만 동물은 등이 어둡고 배가 밝음 → 빛 받으면 서로 상쇄", "한 가지 색처럼 보여 배경에 섞임 = 카운터셰이딩"]}, {"id": "m2211-31", "src": "mock_2211_g2.txt", "label": "22년 11월 31번", "type": "order", "given": "Imagine hearing a series of identical notes, AAAAA.", "parts": {"A": "Suddenly, the note changes: AAAAA#. Your primary auditory cortex immediately shows a strong surprise reaction: not only does the adaptation fade away, but additional neurons begin to vigorously fire in response to the unexpected sound.", "B": "And it is not just repetition that leads to adaptation: what matters is whether the notes are predictable. For instance, if you hear an alternating set of notes, such as ABABA, your brain gets used to this alternation, and the activity in your auditory areas again decreases. This time, however, it is an unexpected repetition, such as ABABB, that triggers a surprise response.", "C": "Each note draws out a response in the auditory areas of your brain — but as the notes repeat, those responses progressively decrease. This is called “adaptation,” a deceptively simple phenomenon that shows that your brain is learning to anticipate the next event."}, "answer": "C-A-B", "hint": {"given": "똑같은 음 AAAAA를 듣는다고 상상해 보기", "A": "갑자기 음이 바뀌면(AAAAA#) 청각 피질이 강한 놀람 반응을 보임", "B": "반복만이 아니라 예측 가능한지가 중요 — ABABA엔 익숙해지고, ABABB 같은 뜻밖의 반복에 놀람", "C": "음마다 뇌 청각 영역이 반응하지만 반복될수록 반응이 줄어듦 — 이것이 '적응'"}, "clues": [["Each note", "(C)의 Each note = 주어진 글의 똑같은
