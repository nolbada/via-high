function dots(cur){var h="";IT.forEach(function(_,i){h+='<span class="'+(S.ok[i]?"ok":S.ng[i]?"ng":"")+(i===cur?" cur":"")+'">'+(i+1)+'</span>'});
 document.getElementById("dots").innerHTML=h;var d=Object.keys(S.ok).length;
 document.getElementById("cnt").textContent=d+" / "+IT.length;document.getElementById("pg").style.width=(100*d/IT.length)+"%"}
function show(){var m=document.getElementById("main");if(!S.q.length){dots(-1);
 var w=Object.keys(S.ng).length;m.innerHTML='<div class="card end"><b>끝</b><p>'+IT.length+'문항 모두 맞힘'+(w?' · 한 번 이상 틀린 문항 '+w+'개':'')+'</p><button class="re" onclick="reset()">처음부터 다시</button></div>';window.scrollTo(0,0);return}
 var i=S.q[0],t=IT[i];dots(i);var h='<div class="card"><div class="lab">'+e(t.label)+'</div>';
 if(t.type==="order"){h+='<div class="q">주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?</div><div class="given">'+en(t.given)+'</div>';
  ["A","B","C"].forEach(function(x){h+='<div class="part"><b>('+x+')</b> '+en(t.parts[x])+'</div>'});
  h+='<div class="opts">';ORD.forEach(function(o,j){h+='<button class="opt" onclick="pick('+j+',this)">'+N[j]+' '+o.split("-").map(function(x){return"("+x+")"}).join(" - ")+'</button>'});h+='</div>'}
 else{h+='<div class="q">글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?</div><div class="given">'+en(t.sentence)+'</div><div lang="en">';
  t.segs.forEach(function(s,j){h+=e(s);if(j<5)h+=' <span class="mk">( '+N[j]+' )</span> '});h+='</div><div class="opts" style="grid-template-columns:repeat(5,1fr)">';
  for(var j=0;j<5;j++)h+='<button class="opt" style="text-align:center" onclick="pick('+j+',this)">'+N[j]+'</button>';h+='</div>'}
 m.innerHTML=h+'<div id="ex"></div></div>';window.scrollTo(0,0)}
var busy=0;function pick(j,b){if(busy)return;busy=1;var i=S.q[0],t=IT[i],right=t.type==="order"?ORD.indexOf(t.answer):t.answer-1;
 var bs=document.querySelectorAll(".opt");bs.forEach(function(x){x.disabled=true});
 if(j===right){b.classList.add("g");S.q.shift();S.ok[i]=1;save();setTimeout(function(){busy=0;show()},700);return}
 b.classList.add("r");bs[right].classList.add("g");S.ng[i]=1;S.q.push(S.q.shift());save();busy=0;explain(t,right)}
function explain(t,right){var h='<div class="band">오답 · 정답 '+N[right]+' '+(t.type==="order"?t.answer.split("-").map(function(x){return"("+x+")"}).join(" - "):"")+'</div><div class="sec">정답 순서로 읽기</div>';
 if(t.type==="order"){h+='<div class="seg"><span class="en" lang="en">'+e(t.given)+'</span><span class="ko">'+e(t.hint.given||"")+'</span></div>';
  t.answer.split("-").forEach(function(x){h+='<div class="seg"><b>('+x+')</b> <span class="en" lang="en">'+e(t.parts[x])+'</span><span class="ko">'+e(t.hint[x])+'</span></div>'})}
 else{t.segs.forEach(function(s,j){if(s.trim())h+='<div class="seg"><span class="en" lang="en">'+e(s)+'</span></div>';if(j===t.answer-1)h+='<div class="seg ins"><span class="en" lang="en">'+e(t.sentence)+'</span><span class="ko">'+N[j]+' 자리</span></div>'})}
 h+='<div class="sec">정답 단서</div>';t.clues.forEach(function(c){h+='<div class="clue"><b lang="en">'+e(c[0])+'</b><br>'+e(c[1])+'</div>'});
 h+='<div class="sec">한글 흐름</div><ol class="flow">';t.flow.forEach(function(f){h+='<li>'+e(f)+'</li>'});h+='</ol><button class="nx" onclick="show()">다음 문제</button>';
 document.getElementById("ex").innerHTML=h}
function reset(){S=null;try{localStorage.removeItem(K)}catch(e){}load();save();show()}
load();show();
</script></body></html>
