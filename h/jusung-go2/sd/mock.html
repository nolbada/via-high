*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:auto}
body{margin:0;background:#f4f5f7;color:#1f2430;font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:16px;line-height:1.55;overflow-x:hidden}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 40px}

.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 10px}

.lab{font-weight:700;font-size:16px;margin:2px 0 10px}

</style></head><body class="notranslate"><div class="wrap" id="v"></div><script>var DATA={"t": "모의고사 순서 다지기", "s": "지문 10개", "k": "jusung-go2:sd:mock", "p": [{"id": "mock_2610_g2-21", "label": "26년 10월 21번 이자는 시간의 가치", "sents": [{"en": "To see how borrowing and lending changes a person’s worldview, consider what the rate of interest does to people’s perception of time.", "ko": "돈을 빌리고 빌려주는 일이 한 사람의 세계관을 어떻게 바꾸는지 알아보려면, 이자율이 시간에 대한 사람들의 인식에 무슨 일을 하는지 생각해 보라."}, {"en": "Imagine you are lending to somebody at an interest rate of 10 percent per year for five years.", "ko": "여러분이 누군가에게 연 10퍼센트의 이자율로 5년 동안 돈을 빌려주고 있다고 상상해 보라."}, {"en": "This rate tells us that the money lent has a cost that reflects the risk of you not being repaid and the opportunity cost of not spending that money yourself.", "ko": "이 이자율은 빌려준 돈에 대가가 있다는 것, 즉 여러분이 돈을 돌려받지 못할 위험과 그 돈을 직접 쓰지 못하는 기회비용을 반영한 대가가 있다는 것을 말해 준다."}, {"en": "The longer the term of the loan, the higher the chance you won’t be paid back because it is further into the future — which by definition is unknowable — and the longer you will have to wait before spending the money yourself.", "ko": "대출 기간이 길수록 돈을 돌려받지 못할 가능성은 더 높아지는데, 정의상 알 수 없는 더 먼 미래의 일이기 때문이며, 여러분이 그 돈을 직접 쓰기 전까지 기다려야 하는 시간도 더 길어진다."}, {"en": "In order to make this worthwhile for the lender, money has to have a price — a cost to the borrower and income to the lender.", "ko": "빌려주는 사람에게 이 일이 할 만한 가치가 있으려면, 돈에는 가격, 즉 빌리는 사람에게는 비용이고 빌려주는 사람에게는 수입인 것이 있어야 한다."}, {"en": "This price factors in the value of time.", "ko": "이 가격에는 시간의 가치가 반영되어 있다."}, {"en": "To put it another way, a bird in the hand is worth two in the bush.", "ko": "달리 말하면, 손 안의 새 한 마리가 덤불 속의 두 마리만큼의 가치가 있다."}], "chunks": [[0, 1], [2, 2], [3, 5], [6, 6]], "ex": [{"head": "To see how borrowing and", "clue": ["the rate of interest", "perception of time"], "core": "이자율이 시간 인식을 어떻게 바꾸는지 보자는 질문", "why": "글의 출발: 이자율(the rate of interest)과 시간 인식이라는 주제 제시"}, {"head": "Imagine you are lending to", "clue": ["Imagine", "10 percent per year for five years"], "core": "연 10% 이자로 5년 동안 빌려주는 상황을 상상", "why": "Imagine(상상해 보라) → 앞의 '이자율' 얘기를 구체적 예(연 10%, 5년)로 바꿈"}, {"head": "This rate tells us that", "clue": ["This rate", "the risk of you not being repaid", "the opportunity cost"], "core": "이자율 = 못 돌려받을 위험 + 그 돈을 못 쓰는 기회비용의 대가", "why": "This rate(이 이자율) = 바로 앞의 '연 10퍼센트' → 상상한 예 다음에만 가능"}, {"head": "The longer the term of", "clue": ["The longer the term of the loan", "won’t be paid back", "the longer you will have to wait"], "core": "기간이 길수록 못 받을 위험도, 기다리는 시간도 커짐", "why": "앞 문장의 두 가지(위험·기회비용)를 '기간이 길수록' 둘 다 커진다고 키움"}, {"head": "In order to make this", "clue": ["this worthwhile for the lender", "a price"], "core": "그래서 빌려준 사람에게 보상이 되도록 돈에 가격(이자)이 붙음", "why": "this(이 일) = 오래 기다리며 위험을 감수하는 대출 → 커진 부담 다음에 '그러니 가격이 필요'"}, {"head": "This price factors in the", "clue": ["This price", "the value of time"], "core": "이 가격(이자)에 시간의 가치가 들어 있음", "why": "This price(이 가격) = 바로 앞에서 처음 나온 a price → 앞 문장 없이는 가리킬 것이 없음"}, {"head": "To put it another way,", "clue": ["To put it another way", "a bird in the hand"], "core": "손 안의 새 한 마리 = 덤불 속 두 마리 (지금 가진 돈이 더 값짐)", "why": "To put it another way(달리 말하면) → 바로 앞 '시간의 가치'를 속담으로 다시 말함"}], "postit": "이자율과 시간 인식 → 연 10%·5년 예 → 위험+기회비용 → 기간 길수록 커짐 → 그래서 돈에 가격 → 시간의 가치 → 손 안의 새 한 마리"}, {"id": "mock_2610_g2-23", "label": "26년 10월 23번 문어 다리의 신경과 빨판", "sents": [{"en": "Research on cephalopod neurobiology suggests that an octopus possesses roughly five hundred million neurons.", "ko": "두족류 신경 생물학 연구는 문어가 약 5억 개의 뉴런을 가지고 있다는 것을 시사한다."}, {"en": "What makes this system unusual is where many of those neurons are located.", "ko": "이 체계를 특이하게 만드는 것은 그 뉴런들 중 다수가 어디에 있느냐이다."}, {"en": "More than half are distributed throughout the arms rather than concentrated entirely in the central brain.", "ko": "절반 이상이 중앙의 뇌에 전부 모여 있지 않고 다리 전체에 걸쳐 퍼져 있다."}, {"en": "Each arm contains networks of nerve cells capable of controlling complex movements and responding to sensory input locally.", "ko": "각 다리에는 복잡한 움직임을 통제하고 감각 입력에 그 자리에서 반응할 수 있는 신경 세포 네트워크가 있다."}, {"en": "This means that many actions do not require detailed instructions from the brain itself.", "ko": "이것은 많은 행동이 뇌 자체로부터 상세한 지시를 받을 필요가 없다는 뜻이다."}, {"en": "Instead, the arms function as highly capable extensions of the nervous system that interact with the environment directly.", "ko": "대신, 다리들은 환경과 직접 상호 작용하는 매우 유능한 신경계의 연장선으로 작동한다."}, {"en": "The suckers lining each arm play an important role in this process.", "ko": "각 다리를 따라 늘어선 빨판들은 이 과정에서 중요한 역할을 한다."}, {"en": "These structures provide strong grip but also detect chemical signals on surfaces they contact.", "ko": "이 구조들은 강하게 붙잡는 힘을 제공할 뿐 아니라, 접촉하는 표면의 화학적 신호도 감지한다."}, {"en": "Marine biologists studying octopus behavior have shown that this allows the animal to gather chemical information through touch.", "ko": "문어의 행동을 연구하는 해양 생물학자들은 이것 덕분에 문어가 접촉을 통해 화학 정보를 모을 수 있다는 것을 보여 주었다."}, {"en": "In practical terms, an octopus can effectively taste what it touches.", "ko": "실질적으로 말해, 문어는 사실상 자기가 만지는 것을 맛볼 수 있다."}], "chunks": [[0, 1], [2, 3], [4, 5], [6, 8], [9, 9]], "ex": [{"head": "Research on cephalopod neurobiology suggests", "clue": ["five hundred million neurons"], "core": "문어의 뉴런은 약 5억 개", "why": "글의 출발: 문어의 뉴런(신경 세포) 수"}, {"head": "What makes this system unusual", "clue": ["this system", "where many of those neurons are located"], "core": "특이한 점은 그 뉴런들이 '어디에' 있느냐", "why": "this system·those neurons(그 뉴런들) = 앞 문장의 5억 개 뉴런"}, {"head": "More than half are distributed", "clue": ["More than half", "throughout the arms"], "core": "절반 넘게가 뇌가 아니라 다리에 퍼져 있음", "why": "앞 문장의 질문 '어디에 있나?'에 대한 답 → 바로 다음"}, {"head": "Each arm contains networks of", "clue": ["Each arm", "locally"], "core": "다리마다 움직임을 스스로 조절하는 신경망", "why": "the arms(다리들) 얘기를 이어 '다리 하나하나'로 자세히"}, {"head": "This means that many actions", "clue": ["This means", "do not require detailed instructions from the brain"], "core": "그래서 많은 행동이 뇌의 지시 없이 이루어짐", "why": "This(이것) = 다리마다 신경망이 있다는 앞 문장 → 그 결과"}, {"head": "Instead, the arms function as", "clue": ["Instead", "interact with the environment directly"], "core": "대신 다리가 환경과 직접 주고받는 신경계의 연장선", "why": "Instead(대신에) → 앞의 '뇌 지시가 필요 없음' 대신 다리가 직접 함"}, {"head": "The suckers lining each arm", "clue": ["The suckers", "in this process"], "core": "다리의 빨판이 이 과정에서 중요한 역할", "why": "this process(이 과정) = 다리가 환경과 직접 상호 작용하는 과정 → 앞 문장 다음"}, {"head": "These structures provide strong grip", "clue": ["These structures", "detect chemical signals"], "core": "빨판은 꽉 잡기도 하고 화학 신호도 감지", "why": "These structures(이 구조들) = 바로 앞 빨판(suckers)"}, {"head": "Marine biologists studying octopus behavior", "clue": ["this allows", "through touch"], "core": "이 덕분에 만지면서 화학 정보를 모음", "why": "this(이것) = 빨판이 화학 신호를 감지하는 일 → 앞 문장 다음"}, {"head": "In practical terms, an octopus", "clue": ["In practical terms", "taste what it touches"], "core": "결국 문어는 만지는 것을 맛봄", "why": "In practical terms(실질적으로 말해) → '만져서 화학 정보 수집'을 '맛본다'로 쉽게 정리"}], "postit": "뉴런 5억 개 → 어디 있나? → 절반 넘게 다리 → 뇌 지시 없이 다리가 직접 → 빨판이 이 과정에서 → 화학 신호 감지 → 만지면 맛봄"}, {"id": "mock_2610_g2-24", "label": "26년 10월 24번 아리스토텔레스 사상의 시대적 한계", "sents": [{"en": "Consistent though he may be, some of Aristotle’s ideas meet us today as strange.", "ko": "비록 아리스토텔레스가 일관적이라 해도, 그의 생각 중 일부는 오늘날 우리에게 낯설게 다가온다."}, {"en": "He had no difficulty justifying slavery, for example, and in his era, philosophers enjoyed positions of high privilege and influence.", "ko": "예를 들어, 그는 노예 제도를 정당화하는 데 아무런 어려움이 없었고, 그의 시대에 철학자들은 높은 특권과 영향력이 있는 지위를 누렸다."}, {"en": "Because of their practice of contemplation for the highest human good, philosophers were considered worthy to have all the best things in life.", "ko": "인간의 최고선에 대해 사유하는 일을 한다는 이유로, 철학자들은 삶의 모든 좋은 것을 가질 자격이 있다고 여겨졌다."}, {"en": "Somehow that assertion seems oddly self-serving.", "ko": "어쩐지 그 주장은 이상하게도 자기 잇속만 차리는 것처럼 보인다."}, {"en": "It serves us to remember that every great thinker is of her own time and speaks to a particular audience, and certainly Aristotle is no exception.", "ko": "모든 위대한 사상가는 자기 시대에 속해 있고 특정한 청중에게 말한다는 것을 기억해 두는 것이 우리에게 도움이 되며, 아리스토텔레스도 분명 예외가 아니다."}, {"en": "Human flourishing as he understood it probably would not be nearly as inclusive as we would want it to be today.", "ko": "그가 이해한 인간 번영은 아마 오늘날 우리가 원하는 만큼 포용적이지는 않을 것이다."}, {"en": "How he understood right and good is best taken to be an indicator of how the privileged elite of ancient Greek society tended to understand right and good.", "ko": "그가 옳음과 선을 어떻게 이해했는지는 고대 그리스 사회의 특권 엘리트층이 옳음과 선을 어떻게 이해하는 경향이 있었는지를 보여 주는 지표로 보는 것이 가장 좋다."}, {"en": "As a result, for all it does well, it is also deeply flawed.", "ko": "그 결과, 그것은 잘하는 점이 많음에도 불구하고 심각한 결함도 있다."}], "chunks": [[0, 0], [1, 1], [2, 3], [4, 6], [7, 7]], "ex": [{"head": "Consistent though he may be,", "clue": ["some of Aristotle’s ideas", "strange"], "core": "아리스토텔레스의 일부 생각은 오늘날 낯섦", "why": "글의 출발: 아리스토텔레스 생각 중 '낯선' 것이 있다는 주제"}, {"head": "He had no difficulty justifying", "clue": ["for example", "justifying slavery", "philosophers enjoyed positions of high privilege"], "core": "예: 노예제 정당화, 철학자들의 높은 특권", "why": "for example(예를 들어) → 앞 문장의 '낯선 생각'의 예 → 바로 다음"}, {"head": "Because of their practice of", "clue": ["their practice of contemplation", "considered worthy"], "core": "최고선을 사유한다는 이유로 철학자는 최고의 것을 누릴 자격", "why": "their(그들의) = 앞 문장의 philosophers → 특권을 누린 이유를 설명"}, {"head": "Somehow that assertion seems oddly", "clue": ["that assertion", "self-serving"], "core": "그 주장은 묘하게 자기 잇속 챙기기로 보임", "why": "that assertion(그 주장) = 바로 앞 '철학자는 최고의 것을 누릴 자격' → 앞 문장 없이는 불가"}, {"head": "It serves us to remember", "clue": ["every great thinker is of her own time", "no exception"], "core": "위대한 사상가도 자기 시대 사람, 아리스토텔레스도 예외 아님", "why": "자기 잇속 같은 주장(앞) → 그런 주장이 나온 배경: every great thinker is of her own time(위대한 사상가도 자기 시대 사람)"}, {"head": "Human flourishing as he understood", "clue": ["as he understood it", "not be nearly as inclusive"], "core": "그가 생각한 인간 번영은 오늘날만큼 포용적이지 않음", "why": "'시대의 한계' 원칙(앞) → 아리스토텔레스의 생각에 적용"}, {"head": "How he understood right and", "clue": ["the privileged elite", "right and good"], "core": "그의 옳음·선 = 고대 그리스 특권층의 시각", "why": "앞의 '포용적이지 않음'을 '특권층의 시각'으로 구체화"}, {"head": "As a result, for all", "clue": ["As a result", "deeply flawed"], "core": "그래서 장점에도 불구하고 큰 결점이 있음", "why": "As a result(그 결과) → 특권층의 시각이라는 앞 문장의 결론, it = 그의 옳음·선 이해"}], "postit": "낯선 생각 → 예: 노예제·철학자 특권 → 자격 있다는 주장 → 자기 잇속 → 사상가도 시대의 사람 → 특권층 시각 → 결함"}, {"id": "mock_2610_g2-29", "label": "26년 10월 29번 생존이라는 허들 경주", "sents": [{"en": "You might think of survival as a race in which a hurdle has to be jumped every year.", "ko": "여러분은 생존을 매년 허들 하나를 뛰어넘어야 하는 경주라고 생각할 수도 있다."}, {"en": "The early hurdles were once very high, and many people fell before clearing the first few.", "ko": "초기의 허들은 한때 매우 높았고, 많은 사람들이 처음 몇 개를 넘기도 전에 넘어졌다."}, {"en": "Demographically, humankind was living close to a state of nature, and nature is extremely wasteful of life.", "ko": "인구 통계학적으로 인류는 자연 상태에 가깝게 살았는데, 자연은 생명을 극도로 낭비한다."}, {"en": "From only a very small number of figs will even one of many seeds become a fig tree.", "ko": "극소수의 무화과에서만 많은 씨앗 중 단 하나라도 무화과나무가 된다."}, {"en": "Almost a quarter of baboons born in the wild die before they are a year old, which is fairly typical for primates.", "ko": "야생에서 태어난 개코원숭이의 거의 4분의 1이 한 살이 되기 전에 죽는데, 이것은 영장류에게 꽤 전형적인 일이다."}, {"en": "Infant mortality rates for humans in pre-modern agricultural societies were similar to, and sometimes higher than, those of apes.", "ko": "전근대 농업 사회에서 인간의 유아 사망률은 유인원의 유아 사망률과 비슷했고, 때로는 더 높았다."}, {"en": "Things were little better for our hunter-gatherer ancestors, a quarter of whom failed to reach their first birthday, while another quarter didn’t live long enough to reproduce just about everywhere until the nineteenth century.", "ko": "우리의 수렵 채집 조상들도 사정이 별로 나을 게 없었는데, 그들 중 4분의 1은 첫 생일을 맞지 못했고, 19세기까지 거의 모든 곳에서 또 다른 4분의 1은 자손을 낳을 만큼 오래 살지 못했다."}, {"en": "Had it been otherwise, the huge recent growth in human population would have occurred much earlier.", "ko": "만약 그렇지 않았다면, 최근의 엄청난 인구 증가는 훨씬 더 일찍 일어났을 것이다."}], "chunks": [[0, 1], [2, 4], [5, 5], [6, 7]], "ex": [{"head": "You might think of survival", "clue": ["a race", "a hurdle"], "core": "생존 = 매년 허들을 넘는 경주", "why": "글의 출발: 생존을 '허들 경주'에 빗댐"}, {"head": "The early hurdles were once", "clue": ["The early hurdles", "many people fell"], "core": "옛날엔 초반 허들이 높아 많은 사람이 넘어짐", "why": "The early hurdles(초반 허들) = 앞 문장의 a hurdle을 이어받음"}, {"head": "Demographically, humankind was living close", "clue": ["close to a state of nature", "nature is extremely wasteful of life"], "core": "인류는 자연 상태에 가까웠고, 자연은 생명을 엄청 낭비함", "why": "'많이 넘어짐(죽음)'의 이유 → 자연이 생명을 낭비하기 때문"}, {"head": "From only a very small", "clue": ["figs", "one of many seeds"], "core": "무화과 씨앗은 극히 일부만 나무가 됨", "why": "앞의 '생명 낭비'의 식물 예"}, {"head": "Almost a quarter of baboons", "clue": ["baboons", "typical for primates"], "core": "야생 개코원숭이 4분의 1이 한 살 전에 죽음 (영장류는 다 비슷)", "why": "식물 예 다음 동물 예, primates(영장류)로 사람 얘기를 준비"}, {"head": "Infant mortality rates for humans", "clue": ["humans", "similar to", "those of apes"], "core": "옛 농경 사회 아기 사망률도 유인원과 비슷하거나 더 높음", "why": "those of apes(유인원의 것) = 앞의 영장류 사망률 → 영장류 다음에 사람과 비교"}, {"head": "Things were little better for", "clue": ["little better", "our hunter-gatherer ancestors"], "core": "수렵 채집 조상도 4분의 1은 첫 생일 전에 죽는 등 나을 게 없음", "why": "little better(별로 나을 게 없는) → 앞의 '농경 사회도 높은 사망률'과 비교"}, {"head": "Had it been otherwise, the", "clue": ["Had it been otherwise", "much earlier"], "core": "아니었다면 인구 급증이 훨씬 일찍 일어났을 것", "why": "Had it been otherwise(그렇지 않았다면) = 높은 사망률이 아니었다면 → 맨 끝 결론"}], "postit": "생존 = 허들 경주 → 초반 허들 높음 → 자연은 생명 낭비 → 무화과·개코원숭이 → 사람 아기도 비슷 → 수렵 채집인도 → 아니었으면 인구 급증 더 일찍"}, {"id": "mock_2610_g2-32", "label": "26년 10월 32번 대중문화와 법원의 역할", "sents": [{"en": "If we understand mass culture as a weakening factor of the cultural ties that unite people to their traditions, mass culture weakens the intermediary institutions in society (e.g. the family or the school), diminishing their role and overlapping these institutions.", "ko": "대중문화를 사람들을 전통에 묶어 주는 문화적 유대를 약하게 만드는 요인으로 이해한다면, 대중문화는 사회 속 매개 제도(예: 가족이나 학교)를 약화시켜 그 역할을 줄이고 이 제도들과 겹친다."}, {"en": "For example, courts are traditional social institutions and important for the normal and harmonious functioning of collective life.", "ko": "예를 들어, 법원은 전통적인 사회 제도이며 공동생활이 정상적이고 조화롭게 돌아가는 데 중요하다."}, {"en": "However, when people turn to social networks to put pressure on judicial decisions in certain mediated and politicized processes, this practice is popularized and becomes a habitual form of culture, which is harmful.", "ko": "그러나 어떤 조정되고 정치화된 과정에서 사람들이 사법적 판결에 압력을 가하려고 소셜 네트워크에 의지하면, 이러한 관행이 대중화되어 습관적인 문화의 한 형태가 되는데, 이는 해롭다."}, {"en": "Justice must not be done in the public square, which today is converted into a virtual dimension, the social networks.", "ko": "재판은 대중 광장에서 이루어져서는 안 되는데, 오늘날 그 광장은 가상의 차원, 즉 소셜 네트워크로 바뀌어 있다."}, {"en": "In a democratic state of law, the appropriate place to judge and make justice is the court and in a way that is immune to popular pressure.", "ko": "민주적인 법치 국가에서 재판하고 정의를 실현하기에 알맞은 곳은 법원이며, 그것도 대중의 압력에 흔들리지 않는 방식이어야 한다."}], "chunks": [[0, 0], [1, 1], [2, 2], [3, 4]], "ex": [{"head": "If we understand mass culture", "clue": ["mass culture", "the intermediary institutions"], "core": "대중문화는 가족·학교 같은 매개 제도를 약하게 만듦", "why": "글의 출발: 대중문화가 전통 '제도(institutions)'를 약화시킨다는 주장"}, {"head": "For example, courts are traditional", "clue": ["For example", "courts", "traditional social institutions"], "core": "예: 법원도 공동생활에 중요한 전통 제도", "why": "For example(예를 들어) + institutions(제도) → 앞의 '매개 제도'의 예로 법원을 듦"}, {"head": "However, when people turn to", "clue": ["However", "social networks", "judicial decisions"], "core": "그런데 소셜 네트워크로 판결에 압력 → 습관이 되어 해로움", "why": "However(그러나) → '법원은 중요함'과 대조, judicial(재판의) = 앞의 courts"}, {"head": "Justice must not be done", "clue": ["the public square", "the social networks"], "core": "재판은 대중 광장(= 오늘날 소셜 네트워크)에서 하면 안 됨", "why": "앞의 '소셜 네트워크로 압력'을 받아 public square(대중 광장)로 바꿔 말하며 비판"}, {"head": "In a democratic state of", "clue": ["the appropriate place", "the court", "immune to popular pressure"], "core": "정의를 판단할 곳은 법원, 대중 압력에 흔들리지 않게", "why": "광장 X(앞) → 그럼 어디? 알맞은 곳은 법원 → 결론"}], "postit": "대중문화가 제도 약화 → 예: 법원 → 소셜 네트워크로 판결 압력 → 광장 재판 X → 법원에서, 압력 없이"}, {"id": "mock_2610_g2-33", "label": "26년 10월 33번 가소성과 평생 발달", "sents": [{"en": "Human development is now increasingly understood as an ongoing, flexible, and evolving process rather than a fixed sequence of stages.", "ko": "인간 발달은 오늘날 고정된 순서의 단계라기보다는 계속 진행되고, 유연하며, 서서히 발전하는 과정으로 점점 더 이해되고 있다."}, {"en": "At the core of this perspective lies the concept of plasticity.", "ko": "이러한 관점의 핵심에는 가소성이라는 개념이 있다."}, {"en": "Plasticity refers to the human capacity to change, adapt, and reorganize cognitive, emotional, and behavioural patterns in response to life experiences, environmental demands, and biological changes.", "ko": "가소성은 삶의 경험, 환경적 요구, 생물학적 변화에 반응하여 인지적·정서적·행동적 패턴을 바꾸고, 적응시키고, 재구성하는 인간의 능력을 가리킨다."}, {"en": "It highlights that individuals are not merely passive recipients of development but active agents capable of growth throughout their lives.", "ko": "그것은 개인이 단순히 발달을 수동적으로 받아들이는 존재가 아니라 평생에 걸쳐 성장할 수 있는 능동적인 주체라는 점을 강조한다."}, {"en": "In earlier views, development was believed to occur mainly during childhood, with adulthood seen as a period of stability and old age as a phase of decline.", "ko": "이전의 관점에서는 발달이 주로 아동기에 일어난다고 믿어졌고, 성인기는 안정의 시기로, 노년기는 쇠퇴의 단계로 여겨졌다."}, {"en": "The concept of plasticity challenges this rigid outlook by emphasizing that development continues across the entire lifespan.", "ko": "가소성의 개념은 발달이 전 생애에 걸쳐 계속된다는 점을 강조함으로써 이러한 경직된 사고방식에 이의를 제기한다."}, {"en": "Although the extent of change may vary at different stages, every phase of life allows room for adaptation and transformation.", "ko": "비록 변화의 정도는 단계마다 다를 수 있지만, 삶의 모든 단계는 적응과 변화의 여지를 허용한다."}], "chunks": [[0, 0], [1, 3], [4, 4], [5, 6]], "ex": [{"head": "Human development is now increasingly", "clue": ["rather than a fixed sequence of stages"], "core": "발달 = 고정된 단계 X, 계속 변하는 유연한 과정", "why": "글의 출발: 요즘 보는 발달의 새 관점(고정된 단계 X → 변하는 과정)"}, {"head": "At the core of this", "clue": ["this perspective", "plasticity"], "core": "이 관점의 핵심 = 가소성(plasticity)", "why": "this perspective(이 관점) = 바로 앞 '발달은 변하는 과정'이라는 관점 → 그 핵심 개념 소개"}, {"head": "Plasticity refers to the human", "clue": ["Plasticity refers to"], "core": "가소성 = 경험·환경에 맞춰 생각·감정·행동을 바꾸는 능력", "why": "앞 문장 끝에 처음 나온 plasticity(가소성)를 바로 뜻풀이 → refers to(~을 가리키다)"}, {"head": "It highlights that individuals", "clue": ["It", "not merely passive", "but active agents"], "core": "사람 = 수동적 수용자 X, 평생 성장하는 능동적 주체", "why": "It(그것) = 앞에서 정의한 가소성 → 가소성이 강조하는 점으로 이어짐"}, {"head": "In earlier views, development was", "clue": ["In earlier views"], "core": "예전 관점: 발달은 아동기, 성인기는 안정, 노년기는 쇠퇴", "why": "In earlier views(이전 관점에서는) → 지금의 가소성 관점과 대비되는 옛날 생각 등장"}, {"head": "The concept of plasticity challenges", "clue": ["challenges", "this rigid outlook"], "core": "가소성이 옛날의 경직된 관점에 반박 → 발달은 평생 계속", "why": "this rigid outlook(이 경직된 사고방식) = 바로 앞 '아동기 발달·노년기 쇠퇴' 관점 → 반드시 옛날 관점 다음"}, {"head": "Although the extent of change", "clue": ["every phase of life"], "core": "변화 정도는 달라도 모든 시기에 변화 가능", "why": "앞의 '전 생애(entire lifespan)'를 every phase of life(삶의 모든 단계)로 다시 정리하는 마무리"}], "postit": "발달 = 변하는 과정 → 핵심은 가소성(뜻·능동적 주체) → 옛날엔 아동기만 발달 → 가소성이 반박: 모든 시기에 변화"}, {"id": "mock_2610_g2-37", "label": "26년 10월 37번 재평가와 감정 조절", "sents": [{"en": "Reappraisal—changing the way one thinks about emotional situations—might present a particularly effective avenue to regulating emotions because it transforms emotions at their root.", "ko": "재평가, 즉 감정적인 상황에 대해 생각하는 방식을 바꾸는 것은 감정을 근본부터 바꾸기 때문에 감정을 조절하는 데 특히 효과적인 방법이 될 수 있다."}, {"en": "Take, for example, someone who is going through a divorce.", "ko": "예를 들어, 이혼을 겪고 있는 사람을 생각해 보자."}, {"en": "This is often an adverse event, and yet, it can be construed in different ways.", "ko": "이것은 보통 부정적인 사건이지만, 그럼에도 서로 다른 방식으로 해석될 수 있다."}, {"en": "One might view it as an overpowering loss that will mark one’s family for life.", "ko": "어떤 사람은 그것을 가족에게 평생 흔적을 남길 압도적인 상실로 볼 수 있다."}, {"en": "Alternatively, one might see it as something that is painful but that might lead to positive outcomes in the long run, such as improved relationships.", "ko": "이와 달리, 어떤 사람은 그것을 고통스럽지만 장기적으로는 더 나아진 관계 같은 긍정적인 결과로 이어질 수 있는 일로 볼 수도 있다."}, {"en": "As a result of these different construals, one might feel different emotions.", "ko": "이렇게 서로 다른 해석의 결과로, 사람은 서로 다른 감정을 느낄 수 있다."}, {"en": "The first construal may bring intense sadness and anger.", "ko": "첫 번째 해석은 강렬한 슬픔과 분노를 가져올 수 있다."}, {"en": "The second construal might also bring sadness and anger but perhaps at lower levels.", "ko": "두 번째 해석 역시 슬픔과 분노를 가져올 수 있지만, 아마도 더 낮은 강도일 것이다."}, {"en": "Crucially, it might also bring some positive emotions, such as hope, strength, or gratitude.", "ko": "결정적으로, 그것은 희망, 강인함, 감사 같은 긍정적인 감정도 가져올 수 있다."}, {"en": "This example illustrates how reappraisal might powerfully transform short-term emotional responses.", "ko": "이 예시는 재평가가 단기적인 감정 반응을 어떻게 강력하게 바꿀 수 있는지 보여 준다."}, {"en": "When repeated over time, these short-term emotional consequences of reappraisal might accumulate to shape people’s psychological health.", "ko": "오랜 시간 반복되면, 재평가가 낳은 이러한 단기적인 감정의 결과가 쌓여 사람들의 심리적 건강을 형성할 수 있다."}, {"en": "Thereby, reappraisal might be a key to resilience.", "ko": "그렇게 함으로써, 재평가는 회복 탄력성의 열쇠가 될 수 있다."}], "chunks": [[0, 0], [1, 2], [3, 4], [5, 8], [9, 11]], "ex": [{"head": "Reappraisal—changing the way one thinks", "clue": ["Reappraisal", "at their root"], "core": "재평가 = 생각하는 방식 바꾸기 → 감정을 뿌리부터 조절", "why": "글의 출발: 재평가(reappraisal)의 뜻과 효과 소개"}, {"head": "Take, for example, someone who", "clue": ["for example", "a divorce"], "core": "예시: 이혼을 겪는 사람", "why": "for example(예를 들어) → 앞의 재평가를 설명할 사례(이혼) 꺼냄"}, {"head": "This is often an adverse", "clue": ["This", "and yet", "in different ways"], "core": "이혼은 부정적 사건이지만 다르게 해석 가능", "why": "This(이것) = 바로 앞의 a divorce(이혼) → 사례 소개 바로 다음"}, emphasizes ordinary people rather than elites.", "ko": "사회사는 흔히 엘리트보다 평범한 사람들을 강조한다."}, {"en": "Yet, in most places and times, nonelites lacked access to education and, thus, did not produce substantial amounts of documentation.", "ko": "하지만 대부분의 지역과 시대에서 엘리트가 아닌 사람들은 교육을 받을 기회가 부족했고, 그래서 많은 양의 문서 기록을 남기지 못했다."}, {"en": "Even when they did produce documentation, these materials rarely ended up in archives where they could be preserved and made available to researchers.", "ko": "그들이 문서 기록을 남겼을 때조차, 이러한 자료들은 보존되어 연구자들이 이용할 수 있게 되는 기록 보관소에 거의 들어가지 못했다."}, {"en": "Because of such biases in the historical record, social historians have to be very creative in their work.", "ko": "역사 기록의 이러한 편향 때문에, 사회사학자는 자신의 작업에서 매우 창의적이어야 한다."}, {"en": "Like other historians, social historians analyze textual sources produced by government officials, employers, and other elites.", "ko": "다른 역사학자들처럼 사회사학자도 정부 관료, 고용주, 그 밖의 엘리트들이 만든 문서 자료를 분석한다."}, {"en": "Yet rather than simply take such sources at face value, they read them “against the grain”.", "ko": "하지만 그들은 그러한 자료를 단순히 액면 그대로 받아들이기보다는 '일반적인 방식과 다르게' 읽는다."}, {"en": "So, for example, a social historian will read legal documents not only for the “facts” provided by slaveowners; she will also examine the silences, interruptions, rumors, and other details that offer hints about the enslaved peoples’ attitudes and actions.", "ko": "그래서 예를 들어, 사회사학자는 법률 문서를 노예 소유주가 제공한 '사실'만을 얻으려고 읽는 것이 아니라, 노예가 된 사람들의 태도와 행동에 대한 힌트를 주는 침묵, 중단, 소문, 그 밖의 세부 사항도 살펴볼 것이다."}], "chunks": [[0, 0], [1, 1], [2, 3], [4, 5], [6, 7]], "ex": [{"head": "Like all historians, social historians", "clue": ["social historians", "primary sources"], "core": "사회사학자도 여러 1차 자료를 씀", "why": "글의 출발: 사회사학자(social historians) 소개"}, {"head": "Social history often emphasizes ordinary", "clue": ["ordinary people rather than elites"], "core": "사회사 = 엘리트보다 평범한 사람 중심", "why": "사회사학자 → 그들의 분야(social history)의 특징으로 이어짐"}, {"head": "Yet, in most places and", "clue": ["Yet", "nonelites"], "cor echolocation signals.", "ko": "그러나 다른 많은 포유류와 달리, 돌고래는 반향 정위 신호의 서로 다른 측면을 처리하는 개별 구역을 가진 고도로 특화된 청각 피질을 가지고 있다."}, {"en": "Some areas may be responsible for analyzing the timing of echoes, while others focus on the frequency content or the intensity of the sound.", "ko": "어떤 구역은 반사음의 타이밍 분석을 담당하고, 다른 구역은 소리의 주파수 성분이나 강도에 집중한다."}, {"en": "This specialization allows the dolphin’s brain to process echo information in parallel, rather than sequentially.", "ko": "이러한 특화 덕분에 돌고래의 뇌는 반사음 정보를 순차적으로가 아니라 병렬로 처리할 수 있다."}, {"en": "Imagine a factory assembly line, where different workers are responsible for different tasks.", "ko": "서로 다른 노동자들이 서로 다른 일을 맡는 공장 조립 라인을 떠올려 보라."}, {"en": "By dividing the work among specialized areas, the brain can process information much faster and more efficiently.", "ko": "특화된 구역들에 일을 나누어 줌으로써, 뇌는 정보를 훨씬 더 빠르고 효율적으로 처리할 수 있다."}, {"en": "This parallel processing reduces the cognitive load associated with echolocation, allowing dolphins to react quickly to changes in their environment.", "ko": "이러한 병렬 처리는 반향 정위에 따르는 인지 부담을 줄여 주어, 돌고래가 환경의 변화에 빠르게 반응할 수 있게 해 준다."}], "chunks": [[0, 0], [1, 2], [3, 4], [5, 5], [6, 8]], "ex": [{"head": "Dolphins’ brains have evolved specialized", "clue": ["specialized areas", "echolocation"], "core": "돌고래 뇌 = 반향 정위 전용 구역 → 더 빠르게·덜 힘들게", "why": "글의 출발: 돌고래 뇌의 특화된 구역(specialized areas)"}, {"head": "One key adaptation is the", "clue": ["One key adaptation"], "core": "핵심 적응 하나 = 청각 경로의 구조", "why": "One key adaptation(한 가지 핵심 적응) → 앞의 반향 정위용으로 진화한 뇌의 구체적 예 하나를 꺼냄"}, {"head": "The signals from the ears", "clue": ["the auditory cortex"], "core": "귀의 신호 → 소리 처리하는 청각 피질로 전달", "why": "청각 경로(pathway)를 따라 신호가 가는 곳 설명 → 청각 피질(auditory cortex) 처음 등장"}, {"head": "However, unlike many other mammals,", "clue": ["However, unlike many other mammals", "distinct areas"], "core": "그러나 돌고래 청각 피질은 여러 구역으로 나뉨", "why": "However(그러나) → 앞의 일반적인 청각 피질과 달리 돌고래만의 특별한 점. 피질이 앞에서 소개된 뒤라야 가능"}, {"head": "Some areas may be responsible", "clue": ["Some lf-identification, and positive reflection time.", "ko": "균형점은 그것을 아무것도 안 하는 시간, 낭비된 시간, 또는 무료함으로 보지 않고, 오히려 자기 개선, 자기 발견, 긍정적인 성찰을 위한 완벽한 시간으로 보는 것이다."}, {"en": "Reflecting, just how lucky are we to be bored?", "ko": "곰곰이 생각해 보면, 우리가 무료할 수 있다는 것은 얼마나 운이 좋은 일인가?"}, {"en": "Boredom doesn’t exist in the presence of danger, as it is only an indulgence pastime in a safe zone.", "ko": "무료함은 위험이 있는 곳에서는 존재하지 않는데, 그것은 안전지대에서만 누리는 탐닉의 오락이기 때문이다."}, {"en": "Boredom can be perceived as a luxury that typically manifests in safe and inactive situations, providing an occasion to appreciate and comprehend the environment.", "ko": "무료함은 보통 안전하고 할 일 없는 상황에서 나타나는 사치로 여겨질 수 있으며, 주변 환경을 인식하고 이해할 기회를 준다."}, {"en": "In hazardous circumstances, the luxury of boredom is unavailable.", "ko": "위험한 상황에서는 무료함이라는 사치를 누릴 수 없다."}, {"en": "Thus, it is paramount to utilize idle moments for profound self-reflection.", "ko": "따라서 아무것도 안 하는 순간을 깊은 자기 성찰에 활용하는 것이 가장 중요하다."}, {"en": "It represents an occasion to listen, observe, and appreciate before expressing.", "ko": "그것은 표현하기 전에 듣고, 관찰하고, 인식할 기회를 의미한다."}, {"en": "Rather than viewing boredom as unproductive, it should be regarded as an opportunity for personal development and constructive contemplation.", "ko": "무료함을 비생산적인 것으로 보기보다는, 개인적 성장과 건설적인 사색의 기회로 여겨야 한다."}], "chunks": [[0, 1], [2, 3], [4, 7], [8, 10]], "ex": [{"head": "It is crucial to recognize", "clue": ["boredom", "harmful emotions"], "core": "무료함을 방치하면 우울·절망·짜증 같은 해로운 감정", "why": "글의 출발: 무료함(boredom)의 위험부터 경고"}, {"head": "When we believe that the", "clue": ["fun activities", "dependent"], "core": "재미만 쫓으면 그 활동에 의존 → 부정적 감정", "why": "무료함을 재미로만 해결하려 하면? → 또 다른 문제(의존)로 이어짐"}, {"head": "It is suggested that ‘Idle", "clue": ["‘Idle time is the devil’s workshop’", "too much time"], "core": "'한가한 시간은 악마의 작업장' → 남는 시간에 나쁜 생각", "why": "부정적 생각 얘기 이어서 → 속담으로 '남는 시간의 위험' 한 번 더. idle(한가한)"}, {"head": "The balance is to not", "clue": ["The balance", "not see it as idle time", "but rather"], "core": "해
