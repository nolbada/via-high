는 것을 시사한다."}, {"en": "What makes this system unusual is where many of those neurons are located.", "ko": "이 체계를 특이하게 만드는 것은 그 뉴런들 중 다수가 어디에 있느냐이다."}, {"en": "More than half are distributed throughout the arms rather than concentrated entirely in the central brain.", "ko": "절반 이상이 중앙의 뇌에 전부 모여 있지 않고 다리 전체에 걸쳐 퍼져 있다."}, {"en": "Each arm contains networks of nerve cells capable of controlling complex movements and responding to sensory input locally.", "ko": "각 다리에는 복잡한 움직임을 통제하고 감각 입력에 그 자리에서 반응할 수 있는 신경 세포 네트워크가 있다."}, {"en": "This means that many actions do not require detailed instructions from the brain itself.", "ko": "이것은 많은 행동이 뇌 자체로부터 상세한 지시를 받을 필요가 없다는 뜻이다."}, {"en": "Instead, the arms function as highly capable extensions of the nervous system that interact with the environment directly.", "ko": "대신, 다리들은 환경과 직접 상호 작용하는 매우 유능한 신경계의 연장선으로 작동한다."}, {"en": "The suckers lining each arm play an important role in this process.", "ko": "각 다리를 따라 늘어선 빨판들은 이 과정에서 중요한 역할을 한다."}, {"en": "These structures provide strong grip but also detect chemical signals on surfaces they contact.", "ko": "이 구조들은 강하게 붙잡는 힘을 제공할 뿐 아니라, 접촉하는 표면의 화학적 신호도 감지한다."}, {"en": "Marine biologists studying octopus behavior have shown that this allows the animal to gather chemical information through touch.", "ko": "문어의 행동을 연구하는 해양 생물학자들은 이것 덕분에 문어가 접촉을 통해 화학 정보를 모을 수 있다는 것을 보여 주었다."}, {"en": "In practical terms, an octopus can effectively taste what it touches.", "ko": "실질적으로 말해, 문어는 사실상 자기가 만지는 것을 맛볼 수 있다."}], "chunks": [[0, 1], [2, 3], [4, 5], [6, 8], [9, 9]], "ex": [{"head": "Research on cephalopod neurobiology suggests", "clue": ["five hundred million neurons"], "core": "문어의 뉴런은 약 5억 개", "why": "글의 출발: 문어의 뉴런(신경 세포) 수"}, {"head": "What makes this system unusual", "clue": ["this system", "where many of those neurons are located"], "core": "특이한 점은 그 뉴런들이 '어디에' 있느냐", "why": "this system·those neurons(그 뉴런들) = 앞 문장의 5억 개 뉴런"}, {"head": "More than half are distributed", "clue": ["More than half",  화학 정보 수집'을 '맛본다'로 쉽게 정리"}]}, {"id": "mock_2610_g2-24", "label": "26년 10월 24번 아리스토텔레스 사상의 시대적 한계", "sents": [{"en": "Consistent though he may be, some of Aristotle’s ideas meet us today as strange.", "ko": "비록 아리스토텔레스가 일관적이라 해도, 그의 생각 중 일부는 오늘날 우리에게 낯설게 다가온다."}, {"en": "He had no difficulty justifying slavery, for example, and in his era, philosophers enjoyed positions of high privilege and influence.", "ko": "예를 들어, 그는 노예 제도를 정당화하는 데 아무런 어려움이 없었고, 그의 시대에 철학자들은 높은 특권과 영향력이 있는 지위를 누렸다."}, {"en": "Because of their practice of contemplation for the highest human good, philosophers were considered worthy to have all the best things in life.", "ko": "인간의 최고선에 대해 사유하는 일을 한다는 이유로, 철학자들은 삶의 모든 좋은 것을 가질 자격이 있다고 여겨졌다."}, {"en": "Somehow that assertion seems oddly self-serving.", "ko": "어쩐지 그 주장은 이상하게도 자기 잇속만 차리는 것처럼 보인다."}, {"en": "It serves us to remember that every great thinker is of her own time and speaks to a particular audience, and certainly Aristotle is no exception.", "ko": "모든 위대한 사상가는 자기 시대에 속해 있고 특정한 청중에게 말한다는 것을 기억해 두는 것이 우리에게 도움이 되며, 아리스토텔레스도 분명 예외가 아니다."}, {"en": "Human flourishing as he understood it probably would not be nearly as inclusive as we would want it to be today.", "ko": "그가 이해한 인간 번영은 아마 오늘날 우리가 원하는 만큼 포용적이지는 않을 것이다."}, {"en": "How he understood right and good is best taken to be an indicator of how the privileged elite of ancient Greek society tended to understand right and good.", "ko": "그가 옳음과 선을 어떻게 이해했는지는 고대 그리스 사회의 특권 엘리트층이 옳음과 선을 어떻게 이해하는 경향이 있었는지를 보여 주는 지표로 보는 것이 가장 좋다."}, {"en": "As a result, for all it does well, it is also deeply flawed.", "ko": "그 결과, 그것은 잘하는 점이 많음에도 불구하고 심각한 결함도 있다."}], "chunks": [[0, 0], [1, 1], [2, 3], [4, 6], [7, 7]], "ex": [{"head": "Consistent though he may be,", "clue": ["some of Aristotle’s ideas", "strange"], "core": "아리스토텔레스의 일부 생각은 오늘날 낯섦", "why": "글의 출발: 아리스토텔레스 생각 중 '낯선' 것이 있다는 주제"}, {"head": "He had no difficulty justifying", "clue": ["for example", "justifying slavery", "philosophers enjoyed positions of high privilege"], "core": "예: 노예제 정당화, 철학자들의 높은 특권", "why": "for example(예를 들어) → 앞 문장의 '낯선 생각'의 예 → 바로 다음"}, {"head": "Because of their practice of", "clue": ["their practice of contemplation", "considered worthy"], "core": "최고선을 사유한다는 이유로 철학자는 최고의 것을 누릴 자격", "why": "their(그들의) = 앞 문장의 philosophers → 특권을 누린 이유를 설명"}, {"head": "Somehow that assertion seems oddly", "clue": ["that assertion", "self-serving"], "core": "그 주장은 묘하게 자기 잇속 챙기기로 보임", "why": "that assertion(그 주장) = 바로 앞 '철학자는 최고의 것을 누릴 자격' → 앞 문장 없이는 불가"}, {"head": "It serves us to remember", "clue": ["every great thinker is of her own time", "no exception"], "core": "위대한 사상가도 자기 시대 사람, 아리스토텔레스도 예외 아님", "why": "자기 잇속 같은 주장(앞) → 그런 주장이 나온 배경: every great thinker is of her own time(위대한 사상가도 자기 시대 사람)"}, {"head": "Human flourishing as he understood", "clue": ["as he understood it", "not be nearly as inclusive"], "core": "그가 생각한 인간 번영은 오늘날만큼 포용적이지 않음", "why": "'시대의 한계' 원칙(앞) → 아리스토텔레스의 생각에 적용"}, {"head": "How he understood right and", "clue": ["the privileged elite", "right and good"], "core": "그의 옳음·선 = 고대 그리스 특권층의 시각", "why": "앞의 '포용적이지 않음'을 '특권층의 시각'으로 구체화"}, {"head": "As a result, for all", "clue": ["As a result", "deeply flawed"], "core": "그래서 장점에도 불구하고 큰 결점이 있음", "why": "As a result(그 결과) → 특권층의 시각이라는 앞 문장의 결론, it = 그의 옳음·선 이해"}], "postit": "낯선 생각 → 예: 노예제·철학자 특권 → 자격 있다는 주장 → 자기 잇속 → 사상가도 시대의 사람 → 특권층 시각 → 결함", "cex": [{"core": "아리스토텔레스 생각 일부는 오늘날 낯섦", "why": "글의 출발: Consistent though he may be(일관적일지 몰라도) 낯선 생각이 있다는 주제"}, {"core": "예: 노예제 정당화, 철학자의 높은 특권", "why": "for example(예를 들어) → 앞의 '낯선 생각'의 구체적 예"}, {"core": "철학자 특권의 근거는 자기 잇속 챙기기로 보임", "why": "their(그들의) = 앞의 philosophers(철학자들) → 특권 이유 뒤 that assertion(그 주장) 비판"}, {"core": "위대한 사상가도 시대의 한계: 특권층의 시각", "why": "자기 잇속 같은 주장의 배경 → every great thinker is of her own time(사상가도 자기 시대 사람)"}, {"core": "그래서 장점에도 깊은 결점이 있음", "why": "As a result(그 결과) → '특권층의 시각'이라는 앞 내용의 결론으로 마무리"}]}, {"id": "mock_2610_g2-29", "label": "26년 10월 29번 생존이라는 허들 경주", "sents": [{"en": "You might think of survival as a race in which a hurdle has to be jumped every year.", "ko": "여러분은 생존을 매년 허들 하나를 뛰어넘어야 하는 경주라고 생각할 수도 있다."}, {"en": "The early hurdles were once very high, and many people fell before clearing the first few.", "ko": "초기의 허들은 한때 매우 높았고, 많은 사람들이 처음 몇 개를 넘기도 전에 넘어졌다."}, {"en": "Demographically, humankind was living close to a state of nature, and nature is extremely wasteful of life.", "ko": "인구 통계학적으로 인류는 자연 상태에 가깝게 살았는데, 자연은 생명을 극도로 낭비한다."}, {"en": "From only a very small number of figs will even one of many seeds become a fig tree.", "ko": "극소수의 무화과에서만 많은 씨앗 중 단 하나라도 무화과나무가 된다."}, {"en": "Almost a quarter of baboons born in the wild die before they are a year old, which is fairly typical for primates.", "ko": "야생에서 태어난 개코원숭이의 거의 4분의 1이 한 살이 되기 전에 죽는데, 이것은 영장류에게 꽤 전형적인 일이다."}, {"en": "Infant mortality rates for humans in pre-modern agricultural societies were similar to, and sometimes higher than, those of apes.", "ko": "전근대 농업 사회에서 인간의 유아 사망률은 유인원의 유아 사망률과 비슷했고, 때로는 더 높았다."}, {"en": "Things were little better for our hunter-gatherer ancestors, a quarter of whom failed to reach their first birthday, while another quarter didn’t live long enough to reproduce just about everywhere until the nineteenth century.", "ko": "우리의 수렵 채집 조상들도 사정이 별로 나을 게 없었는데, 그들 중 4분의 1은 첫 생일을 맞지 못했고, 19세기까지 거의 모든 곳에서 또 다른 4분의 1은 자손을 낳을 만큼 오래 살지 못했다."}, {"en": "Had it been otherwise, the huge recent growth in human population would have occurred much earlier.", "ko": "만약 그렇지 않았다면, 최근의 엄청난 인구 증가는 훨씬 더 일찍 일어났을 것이다."}], "chunks": [[0, 1], [2, 4], [5, 5], [6, 7]], "ex": [{"head": "You might think of survival", "clue": ["a race", "a hurdle"], "core": "생존 = 매년 허들을 넘는 경주", "why": "글의 출발: 생존을 '허들 경주'에 빗댐"}, {"head": "The early hurdles were once", "clue": ["The early hurdles", "many people fell"], "core": "옛날엔 초반 허들이 높아 많은 사람이 넘어짐", "why": "The early hurdles(초반 허들) = 앞 문장의 a hurdle을 이어받음"}, {"head": "Demographically, humankind was living close", "clue": ["close to a state of nature", "nature is extremely wasteful of life"], "core": "인류는 자연 상태에 가까웠고, 자연은 생명을 엄청 낭비함", "why": "'많이 넘어짐(죽음)'의 이유 → 자연이 생명을 낭비하기 때문"}, {"head": "From only a very small", "clue": ["figs", "one of many seeds"], "core": "무화과 씨앗은 극히 일부만 나무가 됨", "why": "앞의 '생명 낭비'의 식물 예"}, {"head": "Almost a quarter of baboons", "clue": ["baboons", "typical for primates"], "core": "야생 개코원숭이 4분의 1이 한 살 전에 죽음 (영장류는 다 비슷)", "why": "식물 예 다음 동물 예, primates(영장류)로 사람 얘기를 준비"}, {"head": "Infant mortality rates for humans", "clue": ["humans", "similar to", "those of apes"], "core": "옛 농경 사회 아기 사망률도 유인원과 비슷하거나 더 높음", "why": "those of apes(유인원의 것) = 앞의 영장류 사망률 → 영장류 다음에 사람과 비교"}, {"head": "Things were little better for", "clue": ["little better", "our hunter-gatherer ancestors"], "core": "수렵 채집 조상도 4분의 1은 첫 생일 전에 죽는 등 나을 게 없음", "why": "little better(별로 나을 게 없는) → 앞의 '농경 사회도 높은 사망률'과 비교"}, {"head": "Had it been otherwise, the", "clue": ["Had it been otherwise", "much earlier"], "core": "아니었다면 인구 급증이 훨씬 일찍 일어났을 것", "why": "Had it been otherwise(그렇지 않았다면) = 높은 사망률이 아니었다면 → 맨 끝 결론"}], "postit": "생존 = 허들 경주 → 초반 허들 높음 → 자연은 생명 낭비 → 무화과·개코원숭이 → 사람 아기도 비슷 → 수렵 채집인도 → 아니었으면 인구 급증 더 일찍", "cex": [{"core": "생존 = 매년 허들 경주, 옛날엔 초반에 많이 넘어짐", "why": "글의 출발: 생존을 허들 경주에 빗댐 → The early hurdles(초반 허들)로 높았던 옛날"}, {"core": "자연은 생명을 낭비함: 무화과·개코원숭이 예", "why": "'많이 넘어짐(죽음)'의 이유 → nature is wasteful(자연은 낭비적), 식물·동물 예로 영장류까지"}, {"core": "옛 농경 사회 아기 사망률도 유인원 수준", "why": "those of apes(유인원의 것) = 앞의 영장류 사망률 → 영장류 다음 사람과 비교"}, {"core": "수렵 채집 조상도 비슷, 아니었다면 인구 급증이 더 일찍", "why": "little better(별로 나을 게 없는) → 농경 사회와 비교, Had it been otherwise(그렇지 않았다면)로 결론"}]}, {"id": "mock_2610_g2-32", "label": "26년 10월 32번 대중문화와 법원의 역할", "sents": [{"en": "If we understand mass culture as a weakening factor of the cultural ties that unite people to their traditions, mass culture weakens the intermediary institutions in society (e.g. the family or the school), diminishing their role and overlapping these institutions.", "ko": "대중문화를 사람들을 전통에 묶어 주는 문화적 유대를 약하게 만드는 요인으로 이해한다면, 대중문화는 사회 속 매개 제도(예: 가족이나 학교)를 약화시켜 그 역할을 줄이고 이 제도들과 겹친다."}, {"en": "For example, courts are traditional social institutions and important for the normal and harmonious functioning of collective life.", "ko": "예를 들어, 법원은 전통적인 사회 제도이며 공동생활이 정상적이고 조화롭게 돌아가는 데 중요하다."}, {"en": "However, when people turn to social networks to put pressure on judicial decisions in certain mediated and politicized processes, this practice is popularized and becomes a habitual form of culture, which is harmful.", "ko": "그러나 어떤 조정되고 정치화된 과정에서 사람들이 사법적 판결에 압력을 가하려고 소셜 네트워크에 의지하면, 이러한 관행이 대중화되어 습관적인 문화의 한 형태가 되는데, 이는 해롭다."}, {"en": "Justice must not be done in the public square, which today is converted into a virtual dimension, the social networks.", "ko": "재판은 대중 광장에서 이루어져서는 안 되는데, 오늘날 그 광장은 가상의 차원, 즉 소셜 네트워크로 바뀌어 있다."}, {"en": "In a democratic state of law, the appropriate place to judge and make justice is the court and in a way that is immune to popular pressure.", "ko": "민주적인 법치 국가에서 재판하고 정의를 실현하기에 알맞은 곳은 법원이며, 그것도 대중의 압력에 흔들리지 않는 방식이어야 한다."}], "chunks": [[0, 0], [1, 1], [2, 2], [3, 4]], "ex": [{"head": "If we understand mass culture", "clue": ["mass culture", "the intermediary institutions"], "core": "대중문화는 가족·학교 같은 매개 제도를 약하게 만듦", "why": "글의 출발: 대중문화가 전통 '제도(institutions)'를 약화시킨다는 주장"}, {"head": "For example, courts are traditional", "clue": ["For example", "courts", "traditional social institutions"], "core": "예: 법원도 공동생활에 중요한 전통 제도", "why": "For example(예를 들어) + institutions(제도) → 앞의 '매개 제도'의 예로 법원을 듦"}, {"head": "However, when people turn to", "clue": ["However", "social networks", "judicial decisions"], "core": "그런데 소셜 네트워크로 판결에 압력 → 습관이 되어 해로움", "why": "However(그러나) → '법원은 중요함'과 대조, judicial(재판의) = 앞의 courts"}, {"head": "Justice must not be done", "clue": ["the public square", "the social networks"], "core": "재판은 대중 광장(= 오늘날 소셜 네트워크)에서 하면 안 됨", "why": "앞의 '소셜 네트워크로 압력'을 받아 public square(대중 광장)로 바꿔 말하며 비판"}, {"head": "In a democratic state of", "clue": ["the appropriate place", "the court", "immune to popular pressure"], "core": "정의를 판단할 곳은 법원, 대중 압력에 흔들리지 않게", "why": "광장 X(앞) → 그럼 어디? 알맞은 곳은 법원 → 결론"}], "postit": "대중문화가 제도 약화 → 예: 법원 → 소셜 네트워크로 판결 압력 → 광장 재판 X → 법원에서, 압력 없이", "cex": [{"core": "대중문화는 가족·학교 같은 매개 제도를 약화", "why": "글의 출발: 대중문화가 intermediary institutions(매개 제도)를 약하게 만든다는 주장"}, {"core": "예: 공동생활에 중요한 전통 제도인 법원", "why": "For example(예를 들어) + institutions(제도) → 앞의 '매개 제도'의 예로 법원"}, {"core": "소셜 네트워크로 판결에 압력 → 해로운 습관", "why": "However(그러나) → '법원은 중요함'과 대조, judicial(재판의) = 앞의 courts"}, {"core": "정의는 광장 아닌 법원에서, 대중 압력 없이", "why": "앞의 '소셜 네트워크 압력'을 public square(대중 광장)로 바꿔 비판 → 알맞은 곳은 법원으로 결론"}]}, {"id": "mock_2610_g2-33", "label": "26년 10월 33번 가소성과 평생 발달", "sents": [{"en": "Human development is now increasingly understood as an ongoing, flexible, and evolving process rather than a fixed sequence of stages.", "ko": "인간 발달은 오늘날 고정된 순서의 단계라기보다는 계속 진행되고, 유연하며, 서서히 발전하는 과정으로 점점 더 이해되고 있다."}, {"en": "At the core of this perspective lies the concept of plasticity.", "ko": "이러한 관점의 핵심에는 가소성이라는 개념이 있다."}, {"en": "Plasticity refers to the human capacity to change, adapt, and reorganize cognitive, emotional, and behavioural patterns in response to life experiences, environmental demands, and biological changes.", "ko": "가소성은 삶의 경험, 환경적 요구, 생물학적 변화에 반응하여 인지적·정서적·행동적 패턴을 바꾸고, 적응시키고, 재구성하는 인간의 능력을 가리킨다."}, {"en": "It highlights that individuals are not merely passive recipients of development but active agents capable of growth throughout their lives.", "ko": "그것은 개인이 단순히 발달을 수동적으로 받아들이는 존재가 아니라 평생에 걸쳐 성장할 수 있는 능동적인 주체라는 점을 강조한다."}, {"en": "In earlier views, development was believed to occur mainly during childhood, with adulthood seen as a period of stability and old age as a phase of decline.", "ko": "이전의 관점에서는 발달이 주로 아동기에 일어난다고 믿어졌고, 성인기는 안정의 시기로, 노년기는 쇠퇴의 단계로 여겨졌다."}, {"en": "The concept of plasticity challenges this rigid outlook by emphasizing that development continues across the entire lifespan.", "ko": "가소성의 개념은 발달이 전 생애에 걸쳐 계속된다는 점을 강조함으로써 이러한 경직된 사고방식에 이의를 제기한다."}, {"en": "Although the extent of change may vary at different stages, every phase of life allows room for adaptation and transformation.", "ko": "비록 변화의 정도는 단계마다 다를 수 있지만, 삶의 모든 단계는 적응과 변화의 여지를 허용한다."}], "chunks": [[0, 0], [1, 3], [4, 4], [5, 6]], "ex": [{"head": "Human development is now increasingly", "clue": ["rather than a fixed sequence of stages"], "core": "발달 = 고정된 단계 X, 계속 변하는 유연한 과정", "why": "글의 출발: 요즘 보는 발달의 새 관점(고정된 단계 X → 변하는 과정)"}, {"head": "At the core of this", "clue": ["this perspective", "plasticity"], "core": "이 관점의 핵심 = 가소성(plasticity)", "why": "this perspective(이 관점) = 바로 앞 '발달은 변하는 과정'이라는 관점 → 그 핵심 개념 소개"}, {"head": "Plasticity refers to the human", "clue": ["Plasticity refers to"], "core": "가소성 = 경험·환경에 맞춰 생각·감정·행동을 바꾸는 능력", "why": "앞 문장 끝에 처음 나온 plasticity(가소성)를 바로 뜻풀이 → refers to(~을 가리키다)"}, {"head": "It highlights that individuals", "clue": ["It", "not merely passive", "but active agents"], "core": "사람 = 수동적 수용자 X, 평생 성장하는 능동적 주체", "why": "It(그것) = 앞에서 정의한 가소성 → 가소성이 강조하는 점으로 이어짐"}, {"head": "In earlier views, development was", "clue": ["In earlier views"], "core": "예전 관점: 발달은 아동기, 성인기는 안정, 노년기는 쇠퇴", "why": "In earlier views(이전 관점에서는) → 지금의 가소성 관점과 대비되는 옛날 생각 등장"}, {"head": "The concept of plasticity challenges", "clue": ["challenges", "this rigid outlook"], "core": "가소성이 옛날의 경직된 관점에 반박 → 발달은 평생 계속", "why": "this rigid outlook(이 경직된 사고방식) = 바로 앞 '아동기 발달·노년기 쇠퇴' 관점 → 반드시 옛날 관점 다음"}, {"head": "Although the extent of change", "clue": ["every phase of life"], "core": "변화 정도는 달라도 모든 시기에 변화 가능", "why": "앞의 '전 생애(entire lifespan)'를 every phase of life(삶의 모든 단계)로 다시 정리하는 마무리"}], "postit": "발달 = 변하는 과정 → 핵심은 가소성(뜻·능동적 주체) → 옛날엔 아동기만 발달 → 가소성이 반박: 모든 시기에 변화", "cex": [{"core": "발달 = 고정된 단계 X, 계속 변하는 유연한 과정", "why": "글의 출발: 요즘 보는 발달의 새 관점(rather than a fixed sequence, 고정된 순서가 아니라)"}, {"core": "관점의 핵심 가소성: 평생 성장하는 능동적 주체", "why": "this perspective(이 관점) = 앞의 '발달은 변하는 과정' → 그 핵심 개념 plasticity(가소성) 소개"}, {"core": "예전 관점: 아동기 발달, 성인기 안정, 노년기 쇠퇴", "why": "In earlier views(이전 관점에서는) → 가소성 관점과 대비되는 옛날 생각 등장"}, {"core": "가소성의 반박: 발달은 삶의 모든 단계에서 계속", "why": "this rigid outlook(이 경직된 관점) = 앞의 '아동기 발달·노년기 쇠퇴' → challenges(반박함)로 마무리"}]}, {"id": "mock_2610_g2-37", "label": "26년 10월 37번 재평가와 감정 조절", "sents": [{"en": "Reappraisal—changing the way one thinks about emotional situations—might present a particularly effective avenue to regulating emotions because it transforms emotions at their root.", "ko": "재평가, 즉 감정적인 상황에 대해 생각하는 방식을 바꾸는 것은 감정을 근본부터 바꾸기 때문에 감정을 조절하는 데 특히 효과적인 방법이 될 수 있다."}, {"en": "Take, for example, someone who is going through a divorce.", "ko": "예를 들어, 이혼을 겪고 있는 사람을 생각해 보자."}, {"en": "This is often an adverse event, and yet, it can be construed in different ways.", "ko": "이것은 보통 부정적인 사건이지만, 그럼에도 서로 다른 방식으로 해석될 수 있다."}, {"en": "One might view it as an overpowering loss that will mark one’s family for life.", "ko": "어떤 사람은 그것을 가족에게 평생 흔적을 남길 압도적인 상실로 볼 수 있다."}, {"en": "Alternatively, one might see it as something that is painful but that might lead to positive outcomes in the long run, such as improved relationships.", "ko": "이와 달리, 어떤 사람은 그것을 고통스럽지만 장기적으로는 더 나아진 관계 같은 긍정적인 결과로 이어질 수 있는 일로 볼 수도 있다."}, {"en": "As a result of these different construals, one might feel different emotions.", "ko": "이렇게 서로 다른 해석의 결과로, 사람은 서로 다른 감정을 느낄 수 있다."}, {"en": "The first construal may bring intense sadness and anger.", "ko": "첫 번째 해석은 강렬한 슬픔과 분노를 가져올 수 있다."}, {"en": "The second construal might also bring sadness and anger but perhaps at lower levels.", "ko": "두 번째 해석 역시 슬픔과 분노를 가져올 수 있지만, 아마도 더 낮은 강도일 것이다."}, {"en": "Crucially, it might also bring some positive emotions, such as hope, strength, or gratitude.", "ko": "결정적으로, 그것은 희망, 강인함, 감사 같은 긍정적인 감정도 가져올 수 있다."}, {"en": "This example illustrates how reappraisal might powerfully transform short-term emotional responses.", "ko": "이 예시는 재평가가 단기적인 감정 반응을 어떻게 강력하게 바꿀 수 있는지 보여 준다."}, {"en": "When repeated over time, these short-term emotional consequences of reappraisal might accumulate to shape people’s psychological health.", "ko": "오랜 시간 반복되면, 재평가가 낳은 이러한 단기적인 감정의 결과가 쌓여 사람들의 심리적 건강을 형성할 수 있다."}, {"en": "Thereby, reappraisal might be a key to resilience.", "ko": "그렇게 함으로써, 재평가는 회복 탄력성의 열쇠가 될 수 있다."}], "chunks": [[0, 0], [1, 2], [3, 4], [5, 8], [9, 11]], "ex": [{"head": "Reappraisal—changing the way one thinks", "clue": ["Reappraisal", "at their root"], "core": "재평가 = 생각하는 방식 바꾸기 → 감정을 뿌리부터 조절", "why": "글의 출발: 재평가(reappraisal)의 뜻과 효과 소개"}, {"head": "Take, for example, someone who", "clue": ["for example", "a divorce"], "core": "예시: 이혼을 겪는 사람", "why": "for example(예를 들어) → 앞의 재평가를 설명할 사례(이혼) 꺼냄"}, {"head": "This is often an adverse", "clue": ["This", "and yet", "in different ways"], "core": "이혼은 부정적 사건이지만 다르게 해석 가능", "why": "This(이것) = 바로 앞의 a divorce(이혼) → 사례 소개 바로 다음"}, {"head": "One might view it as", "clue": ["One might view it"], "core": "해석 1: 가족에게 평생 남을 큰 상실", "why": "it(그것) = 이혼. 앞의 in different ways(다른 방식들)의 첫 번째 방식 제시"}, {"head": "Alternatively, one might see it", "clue": ["Alternatively"], "core": "해석 2: 아프지만 장기적으로 좋은 결과로 이어질 일", "why": "Alternatively(이와 달리) → 첫 번째 해석과 다른 두 번째 해석"}, {"head": "As a result of these", "clue": ["these different construals"], "core": "해석이 다르면 느끼는 감정도 다름", "why": "these different construals(이 서로 다른 해석들) = 앞의 해석 1·2 → 두 해석이 다 나온 뒤에만 가능"}, {"head": "The first construal may bring", "clue": ["The first construal"], "core": "해석 1 → 강한 슬픔·분노", "why": "The first construal(첫 번째 해석) = 앞의 '평생 남을 상실' → 해석별 감정 시작"}, {"head": "The second construal might also", "clue": ["The second construal", "also", "at lower levels"], "core": "해석 2 → 슬픔·분노도 있지만 더 약하게", "why": "first 다음 second(두 번째) → 순서 고정. also(역시) = 첫 번째처럼 슬픔·분노는 있음"}, {"head": "Crucially, it might also bring", "clue": ["Crucially", "it", "positive emotions"], "core": "결정적으로 해석 2는 희망·감사 같은 긍정 감정도 가져옴", "why": "it(그것) = 두 번째 해석 → Crucially(결정적으로)로 두 번째 해석의 강점 추가"}, {"head": "This example illustrates how reappraisal", "clue": ["This example", "short-term"], "core": "이 예시 = 재평가가 단기 감정 반응을 바꿈", "why": "This example(이 예시) = 지금까지의 이혼 사례 → 사례가 끝난 뒤 정리"}, {"head": "When repeated over time, these", "clue": ["When repeated over time", "these short-term emotional consequences"], "core": "오래 반복되면 쌓여서 심리적 건강 형성", "why": "these short-term(이 단기적인) = 바로 앞 단기 감정 반응 → 장기로 확장"}, {"head": "Thereby, reappraisal might be a", "clue": ["Thereby", "resilience"], "core": "결론: 재평가 = 회복 탄력성의 열쇠", "why": "Thereby(그렇게 함으로써) = 앞의 '쌓여서 건강 형성'의 결과 → 마지막 결론"}], "postit": "재평가 = 생각 바꾸기 → 예: 이혼 → 해석 1(상실)·해석 2(성장) → 다른 감정 → 이 예시 정리 → 쌓이면 건강 → 회복 탄력성", "cex": [{"core": "재평가 = 생각을 바꿔 감정을 뿌리부터 조절", "why": "글의 출발: reappraisal(재평가)의 뜻과 효과 소개"}, {"core": "예시: 부정적이지만 다르게 해석 가능한 이혼", "why": "Take, for example(예를 들어 보자) → 재평가 설명용 사례, This(이것) = 이혼"}, {"core": "해석 1 큰 상실 vs 해석 2 장기적으로 좋은 결과", "why": "it(그것) = 이혼 → 앞의 in different ways(다른 방식들)를 One might·Alternatively로 두 가지 제시"}, {"core": "해석이 다르면 감정도 다름: 해석 2엔 긍정 감정도", "why": "these different construals(이 서로 다른 해석들) = 앞의 두 해석 → The first·The second로 감정 비교"}, {"core": "반복된 재평가가 쌓여 회복 탄력성의 열쇠", "why": "This example(이 예시) = 이혼 사례 전체 → When repeated over time(오래 반복되면) 장기로 확장해 결론"}]}, {"id": "mock_2610_g2-39", "label": "26년 10월 39번 사회사학자의 사료 읽기", "sents": [{"en": "Like all historians, social historians draw from a variety of primary sources.", "ko": "모든 역사학자와 마찬가지로, 사회사학자도 다양한 1차 자료를 활용한다."}, {"en": "Social history often emphasizes ordinary people rather than elites.", "ko": "사회사는 흔히 엘리트보다 평범한 사람들을 강조한다."}, {"en": "Yet, in most places and times, nonelites lacked access to education and, thus, did not produce substantial amounts of documentation.", "ko": "하지만 대부분의 지역과 시대에서 엘리트가 아닌 사람들은 교육을 받을 기회가 부족했고, 그래서 많은 양의 문서 기록을 남기지 못했다."}, {"en": "Even when they did produce documentation, these materials rarely ended up in archives where they could be preserved and made available to researchers.", "ko": "그들이 문서 기록을 남겼을 때조차, 이러한 자료들은 보존되어 연구자들이 이용할 수 있게 되는 기록 보관소에 거의 들어가지 못했다."}, {"en": "Because of such biases in the historical record, social historians have to be very creative in their work.", "ko": "역사 기록의 이러한 편향 때문에, 사회사학자는 자신의 작업에서 매우 창의적이어야 한다."}, {"en": "Like other historians, social historians analyze textual sources produced by government officials, employers, and other elites.", "ko": "다른 역사학자들처럼 사회사학자도 정부 관료, 고용주, 그 밖의 엘리트들이 만든 문서 자료를 분석한다."}, {"en": "Yet rather than simply take such sources at face value, they read them “against the grain”.", "ko": "하지만 그들은 그러한 자료를 단순히 액면 그대로 받아들이기보다는 '일반적인 방식과 다르게' 읽는다."}, {"en": "So, for example, a social historian will read legal documents not only for the “facts” provided by slaveowners; she will also examine the silences, interruptions, rumors, and other details that offer hints about the enslaved peoples’ attitudes and actions.", "ko": "그래서 예를 들어, 사회사학자는 법률 문서를 노예 소유주가 제공한 '사실'만을 얻으려고 읽는 것이 아니라, 노예가 된 사람들의 태도와 행동에 대한 힌트를 주는 침묵, 중단, 소문, 그 밖의 세부 사항도 살펴볼 것이다."}], "chunks": [[0, 0], [1, 1], [2, 3], [4, 5], [6, 7]], "ex": [{"head": "Like all historians, social historians", "clue": ["social historians", "primary sources"], "core": "사회사학자도 여러 1차 자료를 씀", "why": "글의 출발: 사회사학자(social historians) 소개"}, {"head": "Social history often emphasizes ordinary", "clue": ["ordinary people rather than elites"], "core": "사회사 = 엘리트보다 평범한 사람 중심", "why": "사회사학자 → 그들의 분야(social history)의 특징으로 이어짐"}, {"head": "Yet, in most places and", "clue": ["Yet", "nonelites"], "core": "하지만 평범한 사람들은 교육 못 받아 기록이 적음", "why": "Yet(하지만) → 평범한 사람 연구의 문제. nonelites(비엘리트) = 앞의 ordinary people"}, {"head": "Even when they did produce", "clue": ["Even when", "these materials"], "core": "기록을 남겨도 보관소에 거의 안 감", "why": "they(그들) = 엘리트가 아닌 사람들. Even when(~할 때조차) → 앞의 '기록 적음'에 문제를 하나 더"}, {"head": "Because of such biases in", "clue": ["such biases"], "core": "이런 기록의 편향 때문에 창의적이어야 함", "why": "such biases(그러한 편향) = 앞의 '평범한 사람 기록은 적고 안 남음' → 문제 두 개 다음에 와야 함"}, {"head": "Like other historians, social historians", "clue": ["produced by government officials, employers, and other elites"], "core": "그래서 결국 엘리트가 만든 문서를 분석함", "why": "창의적이어야 하는 상황 → 남아 있는 건 엘리트 문서뿐 → 그것을 분석"}, {"head": "Yet rather than simply take", "clue": ["Yet", "such sources", "“against the grain”"], "core": "하지만 액면 그대로 X, 거슬러 읽음", "why": "such sources(그러한 자료) = 바로 앞 엘리트가 만든 문서 → Yet(하지만)으로 읽는 방식 반전"}, {"head": "So, for example, a social", "clue": ["for example", "not only", "she will also examine"], "core": "예: 법률 문서의 '사실' + 침묵·소문에서 노예들의 단서 찾기", "why": "for example(예를 들어) → '거슬러 읽기'의 구체적 예시. not only A; also B(A뿐 아니라 B도)"}], "postit": "사회사 = 평범한 사람 → 기록 적음·보관 X → 편향 → 엘리트 문서 분석 → 거슬러 읽기 → 예: 법률 문서의 침묵·소문", "cex": [{"core": "사회사학자도 다양한 1차 자료 활용", "why": "글의 출발: social historians(사회사학자)와 그들이 쓰는 primary sources(1차 자료) 소개"}, {"core": "사회사는 엘리트보다 평범한 사람 중심", "why": "사회사학자 → 그들의 분야 social history(사회사)의 특징으로 이어짐"}, {"core": "평범한 사람들은 기록이 적고 보관도 안 됨", "why": "Yet(하지만) → 평범한 사람 연구의 문제, nonelites(비엘리트) = 앞의 ordinary people"}, {"core": "기록 편향 때문에 엘리트 문서를 창의적으로 분석", "why": "such biases(그러한 편향) = 앞의 '기록이 적고 안 남음' → 남은 엘리트 문서를 분석"}, {"core": "엘리트 문서를 거슬러 읽어 노예들의 단서 찾기", "why": "such sources(그러한 자료) = 앞의 엘리트 문서 → Yet(하지만) against the grain(거슬러) 읽기"}]}, {"id": "mock_2610_g2-40", "label": "26년 10월 40번 돌고래의 병렬 처리 청각 피질", "sents": [{"en": "Dolphins’ brains have evolved specialized areas dedicated to echolocation, allowing them to process acoustic information more quickly and with less energy.", "ko": "돌고래의 뇌는 반향 정위에 쓰이는 특화된 구역을 진화시켰고, 이것은 그들이 음향 정보를 더 빠르고 더 적은 에너지로 처리할 수 있게 해 준다."}, {"en": "One key adaptation is the structure of the dolphin’s auditory pathway.", "ko": "한 가지 핵심적인 적응은 돌고래의 청각 경로의 구조이다."}, {"en": "The signals from the ears are rapidly transmitted to the auditory cortex, the brain region responsible for processing sound.", "ko": "귀에서 온 신호는 소리 처리를 담당하는 뇌 영역인 청각 피질로 빠르게 전달된다."}, {"en": "However, unlike many other mammals, dolphins have a highly specialized auditory cortex with distinct areas dedicated to processing different aspects of echolocation signals.", "ko": "그러나 다른 많은 포유류와 달리, 돌고래는 반향 정위 신호의 서로 다른 측면을 처리하는 개별 구역을 가진 고도로 특화된 청각 피질을 가지고 있다."}, {"en": "Some areas may be responsible for analyzing the timing of echoes, while others focus on the frequency content or the intensity of the sound.", "ko": "어떤 구역은 반사음의 타이밍 분석을 담당하고, 다른 구역은 소리의 주파수 성분이나 강도에 집중한다."}, {"en": "This specialization allows the dolphin’s brain to process echo information in parallel, rather than sequentially.", "ko": "이러한 특화 덕분에 돌고래의 뇌는 반사음 정보를 순차적으로가 아니라 병렬로 처리할 수 있다."}, {"en": "Imagine a factory assembly line, where different workers are responsible for different tasks.", "ko": "서로 다른 노동자들이 서로 다른 일을 맡는 공장 조립 라인을 떠올려 보라."}, {"en": "By dividing the work among specialized areas, the brain can process information much faster and more efficiently.", "ko": "특화된 구역들에 일을 나누어 줌으로써, 뇌는 정보를 훨씬 더 빠르고 효율적으로 처리할 수 있다."}, {"en": "This parallel processing reduces the cognitive load associated with echolocation, allowing dolphins to react quickly to changes in their environment.", "ko": "이러한 병렬 처리는 반향 정위에 따르는 인지 부담을 줄여 주어, 돌고래가 환경의 변화에 빠르게 반응할 수 있게 해 준다."}], "chunks": [[0, 0], [1, 2], [3, 4], [5, 5], [6, 8]], "ex": [{"head": "Dolphins’ brains have evolved specialized", "clue": ["specialized areas", "echolocation"], "core": "돌고래 뇌 = 반향 정위 전용 구역 → 더 빠르게·덜 힘들게", "why": "글의 출발: 돌고래 뇌의 특화된 구역(specialized areas)"}, {"head": "One key adaptation is the", "clue": ["One key adaptation"], "core": "핵심 적응 하나 = 청각 경로의 구조", "why": "One key adaptation(한 가지 핵심 적응) → 앞의 반향 정위용으로 진화한 뇌의 구체적 예 하나를 꺼냄"}, {"head": "The signals from the ears", "clue": ["the auditory cortex"], "core": "귀의 신호 → 소리 처리하는 청각 피질로 전달", "why": "청각 경로(pathway)를 따라 신호가 가는 곳 설명 → 청각 피질(auditory cortex) 처음 등장"}, {"head": "However, unlike many other mammals,", "clue": ["However, unlike many other mammals", "distinct areas"], "core": "그러나 돌고래 청각 피질은 여러 구역으로 나뉨", "why": "However(그러나) → 앞의 일반적인 청각 피질과 달리 돌고래만의 특별한 점. 피질이 앞에서 소개된 뒤라야 가능"}, {"head": "Some areas may be responsible", "clue": ["Some areas", "while others"], "core": "구역별 분담: 타이밍 담당 / 주파수·강도 담당", "why": "Some areas(어떤 구역들) = 앞의 distinct areas(개별 구역) → 구역마다 맡은 일 설명"}, {"head": "This specialization allows the dolphin’s", "clue": ["This specialization", "in parallel"], "core": "이 특화 덕에 병렬 처리(순차 X)", "why": "This specialization(이 특화) = 앞의 '구역별 일 나누기' → 그 결과 parallel(병렬) 처리"}, {"head": "Imagine a factory assembly line,", "clue": ["Imagine", "different workers", "different tasks"], "core": "비유: 공장 조립 라인(노동자마다 다른 일)", "why": "병렬 처리를 쉽게 보여 주는 비유 → 구역 = 노동자, 반향 정보 처리 = 일"}, {"head": "By dividing the work among", "clue": ["By dividing the work"], "core": "일을 나누니 훨씬 빠르고 효율적", "why": "dividing the work(일 나누기) = 앞의 조립 라인 비유를 뇌에 다시 적용"}, {"head": "This parallel processing reduces the", "clue": ["This parallel processing", "cognitive load"], "core": "결과: 인지 부담↓ → 환경 변화에 빠르게 반응", "why": "This parallel processing(이 병렬 처리) = 앞의 in parallel 내용 → 병렬 얘기가 나온 뒤 마지막 결과"}], "postit": "반향 정위 전용 구역 → 청각 경로·피질 → 그러나 피질이 구역별로 나뉨 → 병렬 처리 → 조립 라인 비유 → 인지 부담↓", "cex": [{"core": "돌고래 뇌의 반향 정위 전용 구역", "why": "글의 출발: 돌고래 뇌가 echolocation(반향 정위)을 위해 진화시킨 특화 구역"}, {"core": "핵심 적응: 귀 신호를 청각 피질로 보내는 경로", "why": "One key adaptation(한 가지 핵심 적응) → 앞의 특화된 뇌의 구체적 예, auditory cortex(청각 피질) 등장"}, {"core": "돌고래 청각 피질은 구역별로 일을 나눠 맡음", "why": "However(그러나) + unlike many other mammals(다른 포유류와 달리) → 돌고래 피질만의 특별한 점"}, {"core": "구역 특화 덕에 순차 아닌 병렬 처리", "why": "This specialization(이 특화) = 앞의 '구역별 일 나누기' → 그 결과 in parallel(병렬로)"}, {"core": "조립 라인 비유: 일을 나눠 빠르고 부담 적게", "why": "병렬 처리를 Imagine(상상해 보라)으로 비유 → This parallel processing(이 병렬 처리)로 결과 마무리"}]}, {"id": "mock_2610_g2-41", "label": "26년 10월 41~42번 무료함은 자기 성찰의 기회", "sents": [{"en": "It is crucial to recognize that boredom can give rise to harmful emotions such as depression, despair, and irritation if not adequately addressed.", "ko": "무료함이 적절히 다뤄지지 않으면 우울, 절망, 짜증 같은 해로운 감정을 일으킬 수 있다는 것을 인식하는 것이 중요하다."}, {"en": "When we believe that the only way to be happy is by searching for fun activities, then we become dependent on those activities, and negative thoughts and emotions arise.", "ko": "행복해지는 유일한 방법이 재미있는 활동을 찾는 것이라고 믿으면, 우리는 그 활동에 의존하게 되고 부정적인 생각과 감정이 생긴다."}, {"en": "It is suggested that ‘Idle time is the devil’s workshop’ implies that those with too much time on their hands may fill that time with troubling thoughts and behavior.", "ko": "'아무것도 안 하는 시간은 악마의 작업장'이라는 말은 손에 시간이 너무 많은 사람들이 그 시간을 문제를 일으키는 생각과 행동으로 채울 수 있다는 것을 암시한다고 한다."}, {"en": "The balance is to not see it as idle time, wasted time, or boredom but rather as a perfect time for self-improvement, self-identification, and positive reflection time.", "ko": "균형점은 그것을 아무것도 안 하는 시간, 낭비된 시간, 또는 무료함으로 보지 않고, 오히려 자기 개선, 자기 발견, 긍정적인 성찰을 위한 완벽한 시간으로 보는 것이다."}, {"en": "Reflecting, just how lucky are we to be bored?", "ko": "곰곰이 생각해 보면, 우리가 무료할 수 있다는 것은 얼마나 운이 좋은 일인가?"}, {"en": "Boredom doesn’t exist in the presence of danger, as it is only an indulgence pastime in a safe zone.", "ko": "무료함은 위험이 있는 곳에서는 존재하지 않는데, 그것은 안전지대에서만 누리는 탐닉의 오락이기 때문이다."}, {"en": "Boredom can be perceived as a luxury that typically manifests in safe and inactive situations, providing an occasion to appreciate and comprehend the environment.", "ko": "무료함은 보통 안전하고 할 일 없는 상황에서 나타나는 사치로 여겨질 수 있으며, 주변 환경을 인식하고 이해할 기회를 준다."}, {"en": "In hazardous circumstances, the luxury of boredom is unavailable.", "ko": "위험한 상황에서는 무료함이라는 사치를 누릴 수 없다."}, {"en": "Thus, it is paramount to utilize idle moments for profound self-reflection.", "ko": "따라서 아무것도 안 하는 순간을 깊은 자기 성찰에 활용하는 것이 가장 중요하다."}, {"en": "It represents an occasion to listen, observe, and appreciate before expressing.", "ko": "그것은 표현하기 전에 듣고, 관찰하고, 인식할 기회를 의미한다."}, {"en": "Rather than viewing boredom as unproductive, it should be regarded as an opportunity for personal development and constructive contemplation.", "ko": "무료함을 비생산적인 것으로 보기보다는, 개인적 성장과 건설적인 사색의 기회로 여겨야 한다."}], "chunks": [[0, 1], [2, 3], [4, 7], [8, 10]], "ex": [{"head": "It is crucial to recognize", "clue": ["boredom", "harmful emotions"], "core": "무료함을 방치하면 우울·절망·짜증 같은 해로운 감정", "why": "글의 출발: 무료함(boredom)의 위험부터 경고"}, {"head": "When we believe that the", "clue": ["fun activities", "dependent"], "core": "재미만 쫓으면 그 활동에 의존 → 부정적 감정", "why": "무료함을 재미로만 해결하려 하면? → 또 다른 문제(의존)로 이어짐"}, {"head": "It is suggested that ‘Idle", "clue": ["‘Idle time is the devil’s workshop’", "too much time"], "core": "'한가한 시간은 악마의 작업장' → 남는 시간에 나쁜 생각", "why": "부정적 생각 얘기 이어서 → 속담으로 '남는 시간의 위험' 한 번 더. idle(한가한)"}, {"head": "The balance is to not", "clue": ["The balance", "not see it as idle time", "but rather"], "core": "해결: 남는 시간 = 낭비 X, 자기 개선·성찰의 시간", "why": "it(그것) = 앞 문장의 남는 시간. idle time을 그대로 다시 받음 → not A but B(A가 아니라 B)로 관점 전환"}, {"head": "Reflecting, just how lucky are", "clue": ["how lucky", "to be bored"], "core": "생각해 보면 무료할 수 있다는 건 행운", "why": "관점 전환 다음 → '무료함 = 행운'이라는 새 주장 던지는 질문(둘째 문단 시작)"}, {"head": "Boredom doesn’t exist in the", "clue": ["in the presence of danger", "in a safe zone"], "core": "무료함은 위험한 곳엔 없고 안전지대에만 있음", "why": "왜 행운인지 이유: 안전할 때만 무료할 수 있음"}, {"head": "Boredom can be perceived as", "clue": ["a luxury", "safe and inactive situations"], "core": "무료함 = 안전할 때만 누리는 사치(luxury)", "why": "안전지대 얘기 이어서 → 무료함을 luxury(사치)라는 말로 처음 표현"}, {"head": "In hazardous circumstances, the luxury", "clue": ["In hazardous circumstances", "the luxury of boredom"], "core": "위험한 상황에선 그 사치를 못 누림", "why": "the luxury(그 사치) = 바로 앞에서 처음 나온 a luxury → 반드시 그 다음"}, {"head": "Thus, it is paramount to", "clue": ["Thus", "idle moments"], "core": "그러니 한가한 순간을 깊은 자기 성찰에 써야 함", "why": "Thus(따라서) → 무료함 = 귀한 사치 → 그러니 잘 써야 한다는 결론. paramount(가장 중요한)"}, {"head": "It represents an occasion to", "clue": ["It", "an occasion"], "core": "그 순간 = 말하기 전에 듣고·보고·이해할 기회", "why": "It(그것) = 앞의 '한가한 순간을 성찰에 쓰는 것' → 그것이 주는 기회 설명"}, {"head": "Rather than viewing boredom as", "clue": ["Rather than", "unproductive", "an opportunity"], "core": "결론: 무료함 = 비생산 X, 성장과 사색의 기회", "why": "Rather than A, B(A라기보다 B) → 글 전체 주장을 정리하는 마지막 문장"}], "postit": "무료함 방치 → 해로운 감정·재미 의존·악마의 작업장 → 낭비 아닌 성찰 시간 → 무료함 = 안전할 때만 누리는 사치 → 그러니 성찰·성장에 활용", "cex": [{"core": "무료함 방치와 재미 의존이 부르는 부정적 감정", "why": "글의 출발: It is crucial(중요하다)로 boredom(무료함)의 위험부터 경고"}, {"core": "남는 시간을 낭비 아닌 자기 성찰 시간으로", "why": "부정적 생각 이어서 → 'Idle time is the devil's workshop'(한가하면 나쁜 짓) 속담, but rather(오히려)"}, {"core": "무료함 = 안전할 때만 누리는 사치이자 행운", "why": "관점 전환 다음 → just how lucky(얼마나 행운인가) 질문으로 새 주장, a luxury(사치)로 설명"}, {"core": "한가한 순간을 성장과 성찰의 기회로 활용", "why": "Thus(따라서) → 무료함은 귀한 사치 → 그러니 잘 써야 한다는 결론, Rather than A, B로 마무리"}]}, {"id": "mock_2410_g2-22", "label": "24년 10월 22번 별의 질량은 어떻게 잴까", "sents": [{"en": "To determine the mass of my bowling ball, I might put it onto a balance and compare it with a known mass, such as a number of metal cubes each weighing 1, 10, or 100 grams.", "ko": "내 볼링공의 질량을 알아내려면, 나는 그것을 저울에 올려놓고 각각 1그램, 10그램, 100그램이 나가는 여러 개의 금속 큐브처럼 이미 알고 있는 질량과 비교할 수 있다."}, {"en": "Things get much more complicated if I want to know the mass of a distant star.", "ko": "내가 먼 별의 질량을 알고 싶다면 상황은 훨씬 더 복잡해진다."}, {"en": "How do I measure it?", "ko": "나는 그것을 어떻게 측정할까?"}, {"en": "We can roughly say that measuring the mass of a star involves various theories.", "ko": "별의 질량을 측정하는 일에는 여러 이론이 들어간다고 대략 말할 수 있다."}, {"en": "If we want to measure the mass of a binary star, we first determine a center of mass between the two stars, then their distance from that center which we can then use, together with a value for the period and a certain instance of Kepler’s Third Law, to calculate the mass.", "ko": "쌍성의 질량을 재고 싶다면, 우리는 먼저 두 별 사이의 질량 중심을 알아내고, 그다음 그 중심으로부터 두 별까지의 거리를 알아낸 뒤, 그 거리를 공전 주기 값과 케플러 제3법칙의 특정한 경우와 함께 써서 질량을 계산한다."}, {"en": "In other words, in order to “measure” the star mass, we measure other quantities and use those values, together with certain equations, to calculate the mass.", "ko": "다시 말해, 별의 질량을 '측정'하려고 우리는 다른 양들을 재고 그 값들을 특정한 방정식과 함께 써서 질량을 계산한다."}, {"en": "Measurement is not a simple and unmediated estimation of independently existing properties, but a determination of certain magnitudes before the background of a number of accepted theories.", "ko": "측정은 독립적으로 존재하는 속성을 단순하고 직접적으로 어림하는 일이 아니라, 받아들여진 여러 이론을 배경으로 특정한 크기를 결정하는 일이다."}], "chunks": [[0, 0], [1, 2], [3, 4], [5, 6]], "ex": [{"head": "To determine the mass", "clue": ["a balance", "a known mass"], "core": "볼링공 질량은 저울에 올려 아는 질량과 비교하면 끝", "why": "글의 출발: 쉬운 측정의 예(볼링공 + 저울)"}, {"head": "Things get much more", "clue": ["much more complicated", "a distant star"], "core": "먼 별의 질량은 훨씬 복잡함", "why": "much more complicated(훨씬 더 복잡한) = 앞의 쉬운 볼링공과 비교 → 볼링공 바로 다음"}, {"head": "How do I", "clue": ["How do I measure it?"], "core": "그럼 별의 질량은 어떻게 잴까? (질문)", "why": "it(그것) = 바로 앞 먼 별의 질량 → 복잡하다고 한 직후 던지는 질문"}, {"head": "We can roughly say", "clue": ["measuring the mass of a star", "various theories"], "core": "별 질량 측정엔 여러 이론이 들어감", "why": "앞 질문(어떻게 잴까?)에 대한 첫 대답 → 질문 다음"}, {"head": "If we want to", "clue": ["a binary star", "Kepler’s Third Law"], "core": "쌍성: 질량 중심·거리·공전 주기·케플러 법칙으로 계산", "why": "binary star(쌍성) = '여러 이론이 들어간다'의 구체적 예 → 이론 얘기 바로 다음"}, {"head": "In other words, in", "clue": ["In other words", "other quantities", "certain equations"], "core": "즉 별 질량은 직접 안 재고 다른 값+방정식으로 계산", "why": "In other words(다시 말해) → 앞의 쌍성 계산 과정을 한마디로 정리"}, {"head": "Measurement is not a", "clue": ["Measurement is not", "accepted theories"], "core": "측정 = 그냥 재는 게 아니라 이론을 바탕으로 정하는 것", "why": "결론: 앞의 '다른 값+방정식' 사례를 '측정이란 무엇인가'로 넓혀 마무리"}], "postit": "볼링공은 저울로 쉽게 → 먼 별은 복잡, 어떻게? → 이론 필요(쌍성 계산) → 다시 말해 다른 값+방정식 → 측정 = 이론 바탕의 결정", "cex": [{"core": "볼링공 질량은 저울로 아는 질량과 비교", "why": "글의 출발: 쉬운 측정의 예 → bowling ball(볼링공)을 balance(저울)로 잼"}, {"core": "먼 별의 질량은 훨씬 복잡, 어떻게 잴까", "why": "much more complicated(훨씬 더 복잡한) → 앞의 쉬운 볼링공과 비교해 별로 넘어감"}, {"core": "별 질량 측정엔 이론 필요, 쌍성 계산의 예", "why": "앞 덩어리 끝 질문 How do I measure it?(어떻게 잴까?)에 대한 대답 → 여러 이론"}, {"core": "측정 = 다른 값+방정식, 이론 바탕의 결정", "why": "In other words(다시 말해) → 앞의 쌍성 계산 과정을 한마디로 정리"}]}, {"id": "mock_2410_g2-23", "label": "24년 10월 23번 고통과 쾌락은 한 저울의 양 끝", "sents": [{"en": "Based on discoveries in neuroscience, pain and pleasure are formed and processed in the same area of the brain.", "ko": "신경과학의 발견에 따르면, 고통과 쾌락은 뇌의 같은 영역에서 만들어지고 처리된다."}, {"en": "Our bodies constantly strive for homeostasis, which is defined as the balance of bodily functions.", "ko": "우리 몸은 끊임없이 항상성을 추구하는데, 항상성은 몸의 기능들이 균형을 이루는 상태로 정의된다."}, {"en": "Without the body’s effective compensatory mechanisms, which may cushion potential highs and lows, we would not be capable of surviving.", "ko": "잠재적인 기복을 완화해 줄 수 있는 몸의 효과적인 보상 기제가 없다면, 우리는 살아남을 수 없을 것이다."}, {"en": "Pleasure and pain are like two sides of the same coin; they seem to work together and are heavily reliant on one another and keep balance.", "ko": "쾌락과 고통은 같은 동전의 양면과 같아서, 함께 작동하고 서로에게 크게 의존하며 균형을 유지하는 것 같다."}, {"en": "If you imagine pleasure and pain as the two opposite points on a scale, you can easily understand that as one of the two points rises, the other must correspondingly fall.", "ko": "쾌락과 고통을 저울 위의 반대쪽 두 지점이라고 상상하면, 두 지점 중 하나가 올라가면 다른 하나는 그에 맞춰 내려갈 수밖에 없다는 것을 쉽게 이해할 수 있다."}, {"en": "We’ve all heard the expression, “No pain, no gain.”", "ko": "우리는 모두 \"고통 없이는 얻는 것도 없다\"라는 표현을 들어 본 적이 있다."}, {"en": "Well, according to psychiatrist Dr. Anna Lembke, there may be some truth to these words.", "ko": "자, 정신과 의사 Anna Lembke 박사에 따르면, 이 말에는 어느 정도 진실이 있을 수 있다."}, {"en": "She says that our attempts to escape being miserable are in fact making us even more miserable.", "ko": "그녀는 비참함에서 벗어나려는 우리의 시도가 사실은 우리를 훨씬 더 비참하게 만들고 있다고 말한다."}, {"en": "This is because pain is actually an essential component of our ability to maintain a neutral state, and allowing it will in turn reset our internal scale back to balance.", "ko": "이는 고통이 실제로 중립 상태를 유지하는 우리 능력의 필수 요소이고, 고통을 허용하면 결국 우리 내부의 저울이 다시 균형으로 맞춰지기 때문이다."}], "chunks": [[0, 1], [2, 5], [6, 6], [7, 8]], "ex": [{"head": "Based on discoveries in", "clue": ["pain and pleasure", "the same area of the brain"], "core": "고통과 쾌락은 뇌의 같은 곳에서 만들어짐", "why": "글의 출발: 고통과 쾌락 치로 이어 저울 비유"}, {"core": "Lembke: 고통 없이 얻는 것 없다는 말에 일리", "why": "these words(이 말) = 앞 덩어리 끝 No pain, no gain(고통 없이 얻는 것 없음)"}, {"core": "고통 회피가 더 비참, 고통이 균형 회복에 필수", "why": "She says(그녀는 말한다) = 앞의 Lembke(렘키) → '일리 있다'의 구체적 내용"}]}, {"id": "mock_2410_g2-24", "label": "24년 10월 24번 끝없는 업그레이드 욕구", "sents": [{"en": "Manufacturers masterfully sow seeds of doubt about the adequacy of our current devices.", "ko": "제조업체들은 우리가 지금 쓰는 기기가 충분한지에 대한 의심의 씨앗을 노련하게 뿌린다."}, {"en": "Suddenly, the phone that was your lifeline a year ago is now a museum piece, unable to keep pace with your digital demands.", "ko": "갑자기, 1년 전 당신의 생명줄이던 휴대폰이 이제는 당신의 디지털 요구를 따라가지 못하는 박물관 유물이 된다."}, {"en": "And thus, the itch to upgrade begins, often before there’s a genuine need.", "ko": "그래서 업그레이드하고 싶은 욕구가, 흔히 진짜 필요가 생기기도 전에 시작된다."}, {"en": "This cycle isn’t just confined to our digital companions.", "ko": "이 순환은 우리의 디지털 동반자에만 국한되지 않는다."}, {"en": "It spills over into almost every aspect of consumer electronics, from the self-driving car to the smart fridge.", "ko": "그것은 자율주행차부터 스마트 냉장고까지 소비자 전자제품의 거의 모든 영역으로 번져 나간다."}, {"en": "Every product seems to be on an unstoppable march towards the next version, the next generation that promises to revolutionize your life.", "ko": "모든 제품이 다음 버전, 즉 당신의 삶을 혁신하겠다고 약속하는 다음 세대를 향해 멈출 수 없는 행진을 하는 것 같다."}, {"en": "What’s fascinating, or perhaps disturbing, is the utter efficacy of this cycle in shaping our desires.", "ko": "흥미로운, 어쩌면 불안한 점은 우리의 욕구를 만들어 내는 이 순환의 엄청난 효과다."}, {"en": "It’s not so much that we want the newest device; we’re led to believe we need it.", "ko": "우리가 최신 기기를 원한다기보다는, 우리가 그것이 필요하다고 믿도록 이끌린다."}, {"en": "The distinction between want and need blurs, shifting our financial priorities in favor of staying current with trends.", "ko": "원하는 것과 필요한 것의 구분이 흐려지고, 그것이 유행을 따라가는 쪽으로 우리의 재정 우선순위를 바꾼다."}, {"en": "For all the logical arguments against this ceaseless upgrading, the temptation remains compelling.", "ko": "이런 끝없는 업그레이드에 반대하는 온갖 논리적 주장에도 불구하고, 그 유혹은 여전히 강하다."}], "chunks": [[0, 0], [1, 2], [3, 5], [6, 9]], "ex": [{"head": "Manufacturers masterfully sow seeds", "clue": ["seeds of doubt", "our current devices"], "core": "제조사가 '지금 기기로 충분한가?' 의심을 심음", "why": "글의 출발: 제조사가 지금 기기에 대한 의심을 심음"}, {"head": "Suddenly, the phone that", "clue": ["Suddenly", "a museum piece"], "core": "1년 전 생명줄 폰이 갑자기 박물관 유물", "why": "Suddenly(갑자기) = 의심을 심은 결과 → 멀쩡한 폰이 낡아 보이기 시작"}, {"head": "And thus, the itch", "clue": ["And thus", "the itch to upgrade"], "core": "그래서 필요하기도 전에 업그레이드 욕구 시작", "why": "And thus(그래서) = 폰이 유물처럼 느껴진 결과 → 업그레이드 욕구"}, {"head": "This cycle isn’t just", "clue": ["This cycle", "our digital companions"], "core": "이 순환은 폰 같은 디지털 기기만의 일이 아님", "why": "This cycle(이 순환) = 의심→유물→업그레이드, our digital companions(디지털 동반자) = 바로 앞의 휴대폰 → 폰 얘기 바로 다음"}, {"head": "It spills over into", "clue": ["It spills over", "almost every aspect of consumer electronics"], "core": "자율주행차·스마트 냉장고까지 번짐", "why": "It(그것) = This cycle, '폰에만 그치지 않음' → '그럼 어디까지?'의 답"}, {"head": "Every product seems to", "clue": ["Every product", "the next version"], "core": "모든 제품이 다음 버전을 향해 멈추지 않고 행진", "why": "Every product(모든 제품) = 앞의 '거의 모든 영역'을 한 번 더 넓게 정리"}, {"head": "What’s fascinating, or perhaps", "clue": ["this cycle in shaping our desires"], "core": "이 순환은 우리 욕구까지 만들어 내는 힘이 셈", "why": "this cycle(이 순환)이 다시 등장 → 범위 얘기(모든 제품) 끝난 뒤 '그 힘'에 대한 평가"}, {"head": "It’s not so much", "clue": ["It’s not so much", "we’re led to believe we need it"], "core": "원해서가 아니라 필요하다고 믿게 됨", "why": "앞의 '욕구를 만든다'를 구체적으로: want(원함)가 아니라 need(필요)로 믿게 됨"}, {"head": "The distinction between want", "clue": ["The distinction between want and need"], "core": "원함과 필요의 경계가 흐려져 돈 쓰는 순서가 바뀜", "why": "want and need = 바로 앞 문장의 want·need → 그 결과 둘의 구분이 흐려짐"}, {"head": "For all the logical", "clue": ["For all the logical arguments", "this ceaseless upgrading", "the temptation remains compelling"], "core": "따져 보면 반대할 이유가 많아도 유혹은 여전히 강함", "why": "For all(~에도 불구하고) → 지금까지의 순환을 정리하며 '그래도 유혹은 강함'으로 마무리"}], "postit": "제조사가 의심을 심음 → 1년 된 폰이 유물 → 그래서 업그레이드 욕구 → 이 순환은 모든 전자제품으로 → 욕구를 만드는 힘(원하는 게 아니라 필요하다고 믿게 됨) → 그래도 유혹은 강함", "cex": [{"core": "제조사가 지금 기기의 충분함에 의심을 심음", "why": "글의 출발: Manufacturers(제조사)가 seeds of doubt(의심의 씨앗)를 뿌림"}, {"core": "1년 된 폰이 유물이 되며 업그레이드 욕구 시작", "why": "Suddenly(갑자기) → 앞의 의심이 심긴 결과 멀쩡한 폰이 유물처럼 보임"}, {"core": "업그레이드 순환이 모든 전자제품으로 번짐", "why": "This cycle(이 순환) = 앞의 업그레이드 욕구 → 디지털 기기 밖으로 확장"}, {"core": "순환이 욕구를 만들어 원함·필요 경계를 흐림", "why": "this cycle(이 순환) 반복 → 앞의 확산 사실에서 우리 욕구에 미치는 힘으로 심화"}]}, {"id": "mock_2410_g2-29", "label": "24년 10월 29번 동물이 원하는 걸 알아내는 실험", "sents": [{"en": "Conditioned Place Preference is a way of finding out what animals want.", "ko": "조건부 장소 선호는 동물이 무엇을 원하는지 알아내는 한 가지 방법이다."}, {"en": "Researchers train them to associate one place with an experience such as food or a loud noise and another place with something completely different, usually where nothing happens.", "ko": "연구자들은 동물들이 한 장소를 먹이나 시끄러운 소리 같은 경험과 연결하고, 다른 장소는 완전히 다른 것, 보통 아무 일도 일어나지 않는 것과 연결하도록 훈련시킨다."}, {"en": "The two places are made obviously different to make it as easy as possible for the animal to associate each place with what happened to it there.", "ko": "두 장소는 동물이 각 장소를 거기서 겪은 일과 최대한 쉽게 연결하도록 확실히 다르게 만들어진다."}, {"en": "The animal’s preference for being in one place or another is measured both before and after its experiences in the two places.", "ko": "한 장소나 다른 장소에 있는 것에 대한 동물의 선호는 두 장소에서 경험하기 전과 후에 모두 측정된다."}, {"en": "If there is a shift in where the animal chooses to spend its time for the reward, this suggests that it liked the experience and is trying to repeat it.", "ko": "동물이 보상을 위해 시간을 보내기로 선택하는 곳에 변화가 생기면, 이는 동물이 그 경험을 좋아했고 그것을 반복하려 한다는 뜻이다."}, {"en": "Conversely, if it now avoids the place the stimulus appeared and starts to prefer the place it did not experience it, then this suggests that it found the stimulus unpleasant.", "ko": "반대로, 동물이 이제 자극이 나타났던 장소를 피하고 그것을 겪지 않은 장소를 좋아하기 시작한다면, 이는 그 자극이 불쾌했다는 뜻이다."}, {"en": "For example, mice with cancer show a preference for the place where they have been given morphine, a drug used to relieve pain, rather than where they have received saline whereas healthy mice developed no such preference.", "ko": "예를 들어, 암에 걸린 쥐는 식염수를 맞은 곳보다 통증 완화에 쓰는 약인 모르핀을 맞은 곳을 더 좋아하는 반면, 건강한 쥐에게는 그런 선호가 생기지 않았다."}, {"en": "This suggests that the mice with cancer wanted the morphine.", "ko": "이는 암에 걸린 쥐가 모르핀을 원했다는 뜻이다."}], "chunks": [[0, 1], [2, 3], [4, 4], [5, 7]], "ex": [{"head": "Conditioned Place Preference is", "clue": ["Conditioned Place Preference", "what animals want"], "core": "조건부 장소 선호 = 동물이 원하는 걸 알아내는 방법", "why": "글의 출발: 조건부 장소 선호라는 실험 방법 소개"}, {"head": "Researchers train them to", "clue": ["one place", "another place"], "core": "한 장소엔 경험(먹이·소음), 다른 장소엔 아무 일 없음", "why": "them(그것들) = 앞의 animals, 방법을 구체적으로(장소 두 곳) 설명"}, {"head": "The two places are", "clue": ["The two places"], "core": "두 장소는 확실히 다르게 만듦", "why": "The two places(그 두 장소) = 앞의 one place와 another place → 훈련 설명 바로 다음"}, {"head": "The animal’s preference for", "clue": ["both before and after"], "core": "경험 전과 후에 어느 장소를 좋아하는지 잼", "why": "두 장소를 만든 다음 단계 → 전후 측정, 뒤의 shift(변화)를 말할 근거"}, {"head": "If there is a", "clue": ["If there is a shift", "liked the experience"], "core": "좋아하는 장소가 바뀌면 그 경험이 좋았던 것", "why": "a shift(변화) = 전과 후를 재야 알 수 있음 → 전후 측정 바로 다음"}, {"head": "Conversely, if it now", "clue": ["Conversely", "avoids the place", "unpleasant"], "core": "반대로 그 장소를 피하면 자극이 불쾌했던 것", "why": "Conversely(반대로) = 앞의 '좋아서 다시 감'의 반대 '피함' → 좋은 경우 다음"}, {"head": "For example, mice with", "clue": ["For example", "mice with cancer", "morphine"], "core": "예: 암 걸린 쥐는 모르핀 맞은 곳을 선호(건강한 쥐는 X)", "why": "For example(예를 들어) → 앞에서 설명한 선호 측정 방법의 실제 예"}, {"head": "This suggests that the", "clue": ["This suggests", "the mice with cancer wanted the morphine"], "core": "암 걸린 쥐는 모르핀(진통제)을 원했음", "why": "This(이것) = 바로 앞 '모르핀 장소 선호' 결과 → 그 결과의 해석"}], "postit": "장소-경험 연결 훈련 → 두 장소를 확 다르게, 경험 전후 선호 측정 → 옮겨 가면 좋았던 것 → 반대로 피하면 불쾌 → 예: 암 걸린 쥐는 모르핀 장소 선호", "cex": [{"core": "동물 욕구 파악법: 장소와 경험 연결 훈련", "why": "글의 출발: Conditioned Place Preference(조건부 장소 선호)의 정의와 훈련 방법"}, {"core": "두 장소를 확실히 구분, 경험 전후 선호를 잼", "why": "The two places(그 두 장소) = 앞의 경험 있는 곳·없는 곳 → 실험 설계 설명"}, {"core": "선호 장소가 바뀌면 그 경험이 좋았던 것", "why": "If there is a shift(변화가 있으면) → 앞의 전후 측정 결과를 해석하는 첫 경우"}, {"core": "피하면 불쾌했던 것, 암 걸린 쥐의 모르핀 선호", "why": "Conversely(반대로) → 앞의 '좋았던 경우'의 반대 경우 + 쥐 실험 예시"}]}, {"id": "mock_2410_g2-30", "label": "24년 10월 30번 새의 번식기", "sents": [{"en": "Near the equator, many species of bird breed all year round.", "ko": "적도 근처에서는 많은 종의 새들이 일 년 내내 번식한다."}, {"en": "But in temperate and polar regions, the breeding seasons of birds are often sharply defined.", "ko": "그러나 온대와 극지방에서는 새들의 번식기가 흔히 뚜렷하게 정해져 있다."}, {"en": "They are triggered mainly by changes in day length.", "ko": "번식기는 주로 낮 길이의 변화로 시작된다."}, {"en": "If all goes well, the outcome is that birds raise their young when the food supply is at its peak.", "ko": "모든 것이 잘되면, 그 결과 새들은 먹이 공급이 가장 많을 때 새끼를 기른다."}, {"en": "Most birds are not simply reluctant to breed at other times but they are also physically incapable of doing so.", "ko": "대부분의 새들은 다른 때에 번식하기를 단지 꺼리는 것이 아니라 신체적으로도 그렇게 할 수 없다."}, {"en": "This is because their reproductive system shrinks, which helps flying birds save weight.", "ko": "이는 새들의 번식 기관이 줄어들기 때문인데, 그것은 나는 새들이 무게를 줄이는 데 도움이 된다."}, {"en": "The main exception to this rule are nomadic desert species.", "ko": "이 규칙의 주요 예외는 떠돌이 사막 종들이다."}, {"en": "These can initiate their breeding cycle within days of rain.", "ko": "이들은 비가 온 지 며칠 안에 번식 주기를 시작할 수 있다."}, {"en": "It’s for making the most of the sudden breeding opportunity.", "ko": "그것은 갑자기 찾아온 번식 기회를 최대한 활용하기 위한 것이다."}, {"en": "Also, different species divide the breeding season up in different ways.", "ko": "또한 종마다 번식기를 나누는 방식이 다르다."}, {"en": "Most seabirds raise a single brood.", "ko": "대부분의 바닷새는 한 번만 새끼를 기른다."}, {"en": "In warm regions, however, songbirds may raise several families in a few months.", "ko": "그러나 따뜻한 지역에서는 명금류가 몇 달 동안 여러 번 새끼를 기르기도 한다."}, {"en": "In an exceptionally good year, a pair of House Sparrows, a kind of songbird, can raise successive broods through a marathon reproductive effort.", "ko": "유난히 좋은 해에는 명금류의 한 종류인 참새 한 쌍이 마라톤 같은 번식 노력으로 연달아 새끼를 길러 낼 수 있다."}], "chunks": [[0, 1], [2, 5], [6, 8], [9, 10], [11, 12]], "ex": [{"head": "Near the equator, many", "clue": ["all year round"], "core": "적도 근처 새들은 1년 내내 번식", "why": "글의 출발: 적도 근처는 1년 내내 번식"}, {"head": "But in temperate and", "clue": ["But in temperate and polar regions", "sharply defined"], "core": "온대·극지방은 번식기가 딱 정해져 있음", "why": "But(그러나) = 앞의 '1년 내내'와 반대 → 뚜렷한 번식기"}, {"head": "They are triggered mainly", "clue": ["They are triggered", "day length"], "core": "번식기는 낮 길이 변화로 시작됨", "why": "They(그것들) = 바로 앞 the breeding seasons → 번식기 소개 바로 다음"}, {"head": "If all goes well,", "clue": ["the outcome", "the food supply is at its peak"], "core": "잘되면 먹이가 가장 많을 때 새끼를 기름", "why": "the outcome(그 결과) = 낮 길이에 맞춰 번식을 시작한 결과"}, {"head": "Most birds are not", "clue": ["at other times", "physically incapable"], "core": "다른 때엔 안 하는 게 아니라 몸이 못 함", "why": "at other times(다른 때) = 앞에서 말한 정해진 번식기 말고 다른 때"}, {"head": "This is because their", "clue": ["This is because", "their reproductive system shrinks"], "core": "번식 기관이 줄어들어서(→ 몸이 가벼워짐)", "why": "This is because(이는 ~ 때문) = 앞의 '몸이 못 함'의 이유"}, {"head": "The main exception to", "clue": ["The main exception to this rule", "nomadic desert species"], "core": "예외: 떠돌이 사막 새", "why": "this rule(이 규칙) = 앞의 '다른 때엔 번식 못 함' → 그 규칙의 예외"}, {"head": "These can initiate their", "clue": ["These", "within days of rain"], "core": "사막 새는 비 오고 며칠 안에 번식 시작", "why": "These(이들) = 바로 앞 nomadic desert species(떠돌이 사막 종)"}, {"head": "It’s for making the", "clue": ["It’s for", "the sudden breeding opportunity"], "core": "갑자기 온 번식 기회를 최대한 살리려는 것", "why": "It(그것) = 앞의 '비 오면 바로 번식', the sudden opportunity = 갑자기 내린 비"}, {"head": "Also, different species divide", "clue": ["Also", "different ways"], "core": "또 종마다 번식기를 나누는 방식이 다름", "why": "Also(또한) = 사막 새 예외 얘기에 새 내용(번식기 나누는 방식)을 덧붙임"}, {"head": "Most seabirds raise a", "clue": ["Most seabirds", "a single brood"], "core": "바닷새는 한 번만 새끼를 기름", "why": "'나누는 방식이 다름'의 첫 예: 바닷새는 한 번"}, {"head": "In warm regions, however,", "clue": ["however", "several families"], "core": "하지만 따뜻한 곳 명금류는 몇 달간 여러 번", "why": "however(그러나) = 앞의 바닷새 '한 번(single)'과 반대 '여러 번(several)'"}, {"head": "In an exceptionally good", "clue": ["House Sparrows", "a kind of songbird", "successive broods"], "core": "좋은 해엔 참새 한 쌍이 연달아 새끼를 기름", "why": "House Sparrows(참새) = a kind of songbird(명금류의 한 종류) → 앞의 명금류 얘기의 구체적 예"}], "postit": "적도는 1년 내내, 온대·극지는 번식기 뚜렷 → 낮 길이로 시작, 먹이 최고일 때 → 다른 때는 몸이 못 함(번식 기관 축소) → 예외: 사막 새는 비 오면 바로 → 또 종마다 나누는 방식 다름: 바닷새 한 번 ↔ 명금류 여러 번", "cex": [{"core": "적도 새는 연중 번식, 온대·극지는 번식기 정해짐", "why": "글의 출발: Near the equator(적도 근처) 연중 번식 → But(하지만) 온대·극지 대비"}, {"core": "낮 길이로 번식 시작, 다른 때엔 번식 기관이 줄어듦", "why": "They(그것들) = 앞의 뚜렷이 정해진 breeding seasons(번식기) → 시작 원인 설명"}, {"core": "예외: 비 온 뒤 바로 번식하는 사막 새", "why": "The main exception to this rule(이 규칙의 주된 예외) → 앞의 정해진 번식기 규칙의 예외"}, {"core": "종마다 번식기를 나누는 방식이 다름, 바닷새는 한 번", "why": "Also(또한) → 앞의 예외에 이어 번식기를 나누는 방식이라는 새 차이 추가"}, {"core": "따뜻한 곳 명금류는 여러 번, 참새의 예", "why": "however(하지만) → 앞의 바닷새 한 번 번식과 대비되는 여러 번 번식"}]}, {"id": "mock_2410_g2-33", "label": "24년 10월 33번 읽기란 무엇인가", "sents": [{"en": "Some people argue that there is a single, logically consistent concept known as reading that can be neatly set apart from everything else people do with books.", "ko": "어떤 사람들은 사람들이 책으로 하는 다른 모든 일과 깔끔하게 구분될 수 있는, 읽기라는 하나의 논리적으로 일관된 개념이 있다고 주장한다."}, {"en": "Is reading really that simple?", "ko": "읽기는 정말 그렇게 단순할까?"}, {"en": "The most productive way to think about reading is as a loosely related set of behaviors that belong together owing to family resemblances, as Ludwig Wittgenstein used the phrase, without having in common a single defining trait.", "ko": "읽기를 생각하는 가장 생산적인 방법은, Ludwig Wittgenstein이 그 표현을 쓴 의미대로, 하나의 정의적 특징을 공유하지 않고도 가족 유사성 때문에 함께 묶이는 느슨하게 연결된 행동들의 집합으로 보는 것이다."}, {"en": "Consequently, efforts to distinguish reading from nonreading are destined to fail because there is no agreement on what qualifies as reading in the first place.", "ko": "그 결과, 읽기와 읽기가 아닌 것을 구분하려는 노력은 실패할 수밖에 없는데, 애초에 무엇이 읽기로 인정되는지에 대한 합의가 없기 때문이다."}, {"en": "The more one tries to figure out where the border lies between reading and not-reading, the more edge cases will be found to stretch the term’s flexible boundaries.", "ko": "읽기와 읽기가 아닌 것의 경계가 어디인지 알아내려 할수록, 그 용어의 유연한 경계를 늘리는 경계 사례가 더 많이 발견될 것이다."}, {"en": "Thus, it is worth attempting to collect together these exceptional forms of reading into a single forum, one highlighting the challenges faced by anyone wishing to establish the boundaries where reading begins and ends.", "ko": "따라서 이런 예외적인 읽기 형태들을 하나의 토론의 장으로 모아 보는 시도는 해 볼 가치가 있는데, 그것은 읽기가 어디서 시작하고 끝나는지 경계를 정하려는 누구나가 마주하는 어려움을 드러내 준다."}, {"en": "The attempt moves toward an understanding of reading as a spectrum that is expansive enough to accommodate the distinct reading activities.", "ko": "그 시도는 서로 다른 읽기 활동들을 다 담을 만큼 넓은 스펙트럼으로 읽기를 이해하는 방향으로 나아간다."}], "chunks": [[0, 1], [2, 2], [3, 4], [5, 5], [6, 6]], "ex": [{"head": "Some people argue that", "clue": ["Some people argue", "a single, logically consistent concept"], "core": "읽기는 딱 떨어지는 하나의 개념이라는 주장", "why": "글의 출발: '읽기는 하나의 깔끔한 개념'이라는 주장"}, {"head": "Is reading really", "clue": ["that simple"], "core": "정말 그렇게 단순할까? (반론의 시작)", "why": "that simple(그렇게 단순한) = 앞 주장의 '깔끔하게 구분되는 하나의 개념'을 의심"}, {"head": "The most productive way", "clue": ["loosely related set of behaviors", "family resemblances", "without having in common a single defining trait"], "core": "읽기 = 공통점 하나 없이 가족처럼 닮아 느슨하게 묶인 행동들", "why": "질문(정말 단순?)에 대한 답: 아니다, 느슨한 묶음이다"}, {"head": "Consequently, efforts to distinguish", "clue": ["Consequently", "destined to fail"], "core": "그래서 읽기/읽기 아님 구분은 실패할 운명", "why": "Consequently(그 결과) = 앞의 '공통된 정의적 특징이 없음'에서 나오는 결과"}, {"head": "The more one tries", "clue": ["The  될 수 있다.”"}, {"en": "The arts, in this way, become vehicles to contend with ideas and concepts that are difficult and uncomfortable otherwise.", "ko": "예술은, 이런 방식으로, 그렇지 않았더라면 어렵고 불편했을 아이디어와 개념들과 씨름하는 매개체가 된다."}, {"en": "When Picasso painted his masterpiece Guernica in 1937, he captured the heartbreaking and cruel nature of war, and offered the world a way to consider the universal suffering caused by the Spanish Civil War.", "ko": "Picasso가 그의 걸작 Guernica를 1937년에 그렸을 때, 그는 가슴 아프고 잔인한 전쟁의 본질을 포착했고, 스페인 내전으로 인한 보편적인 고통을 숙고할 방법을 세상에 제공했다."}, {"en": "When Lorraine Hansberry wrote her play A Raisin in the Sun, she gave us a powerful story of people struggling with racism, discrimination, and the pursuit of the American dream while also offering a touching portrait of family life.", "ko": "Lorraine Hansberry가 그녀의 희곡 A Raisin in the Sun을 썼을 때, 그녀는 가족생활에 대한 감동적인 초상화도 보여 주면서, 인종차별, 차별, 그리고 아메리칸 드림의 추구와 씨름하는 사람들의 강렬한 이야기를 우리에게 주었다."}], "chunks": [[0, 0], [1, 1], [2, 3], [4, 6]], "ex": [{"head": "The arts and aesthetics offer", "clue": ["emotional connection"], "core": "예술은 인간 경험 전체와 감정으로 연결해 줌", "why": "글의 출발: 예술과 미학(aesthetics)이 주는 정서적 연결"}, {"head": "“The arts can be more", "clue": ["more than just sugar on the tongue", "Anjan Chatterjee"], "core": "예술 = 혀 위의 설탕(그냥 달콤함) 이상", "why": "말한 사람 Chatterjee 교수가 여기서 처음 소개됨 → 인용이 시작되는 자리"}, {"head": "“In art, when there’s something", "clue": ["this discomfort", "some change, some transformation"], "core": "불편함을 기꺼이 마주하면 변화·변형의 가능성", "why": "누가 말했는지 없이 따옴표가 또 열림 → 교수를 소개한 앞 문장 다음 / 설탕 '이상'의 정체 = 불편함"}, {"head": "That can also be a", "clue": ["That", "a powerful aesthetic experience"], "core": "그 변화의 가능성도 강력한 미적 경험", "why": "That(그것) = 앞 문장의 변화·변형의 가능성, 닫는 따옴표(”)로 인용 끝"}, {"head": "The arts, in this way,", "clue": ["in this way", "difficult and uncomfortable"], "core": "예술 = 어렵고 불편한 생각과 씨름하는 매개체", "why": "in this way(이런 방식으로) = 앞 인용의 '불편함을 통한 변화' → uncomfortable(불편한)도 그대로 받음"}, {"head": "When Picasso painted his masterpiece", "clue": ["Guernica", "cruel nature of war"], "core": "예 1: 피카소 게르니카 = 전쟁의 잔혹함", "why": "in this way(이런 방식으로)의 실제 예 1 → 일반 진술 바로 다음"}, {"head": "When Lorraine Hansberry wrote her", "clue": ["A Raisin in the Sun", "racism, discrimination"], "core": "예 2: 핸스베리 희곡 = 인종차별과 가족의 삶", "why": "같은 When ~ 구조로 예를 하나 더 → 피카소 예와 한 묶음"}], "postit": "예술의 정서적 연결 → 교수: 설탕 이상 → 불편함 마주하면 변화 → 불편한 생각과 씨름하는 매개체 → 예: 게르니카·핸스베리", "cex": [{"core": "예술은 인간 경험 전체와 감정으로 연결", "why": "글의 출발: The arts and aesthetics(예술과 미학) → 인간 경험 전체와의 감정적 연결"}, {"core": "예술은 혀 위의 설탕 이상이라는 말", "why": "more than just sugar on the tongue(혀 위의 설탕 이상) → 앞의 '감정 연결'이 달콤함만은 아님을 예고"}, {"core": "불편함을 마주하면 변화 가능성, 그것도 미적 경험", "why": "challenging(도전적인), uncomfortable(불편한) → 앞의 '설탕 이상'이 무엇인지 인용으로 풀어 줌"}, {"core": "불편한 생각을 다루는 매개체로서의 예술, 두 작품 예", "why": "in this way(이런 식으로) → 앞의 '불편함 속 변화'를 정리하고 피카소·핸스베리 예로 확인"}]}, {"id": "mock_2311_g2-23", "label": "23년 11월 23번 쇼핑카트를 퍼뜨린 바람잡이", "sents": [{"en": "Sylvan Goldman invented the shopping cart and introduced it in his stores in 1937.", "ko": "Sylvan Goldman은 쇼핑카트를 발명하고 1937년에 그의 가게들에 그것을 도입했다."}, {"en": "It was an excellent device that would make it easy for shoppers to buy as much as they wanted without getting tired or seeking others’ help.", "ko": "그것은 쇼핑객들이 지치거나 다른 사람들의 도움을 구하지 않고 그들이 원했던 만큼 구매하는 것을 쉽게 만들어 준 훌륭한 장치였다."}, {"en": "But Goldman discovered that in spite of his repeated advertisements and explanations, he could not persuade his shoppers to use the wheeled carts.", "ko": "하지만 Goldman은 그의 반복적인 광고와 설명에도 불구하고, 그의 쇼핑객들에게 바퀴 달린 카트들을 사용하도록 설득할 수 없다는 것을 알게 됐다."}, {"en": "Men were reluctant because they thought they would appear weak if they pushed such carts instead of carrying their shopping.", "ko": "남성들은 그들의 쇼핑한 물건을 들고 다니는 대신 만약 그들이 그런 카트들을 민다면 그들이 나약해 보일 것으로 생각했기 때문에 꺼렸다."}, {"en": "Women wouldn’t touch them because the carts reminded them of baby carriages.", "ko": "여성들은 카트들이 그들에게 유모차를 연상시키기 때문에 그것들에 손대려 하지 않았다."}, {"en": "It was only a few elderly shoppers who used them.", "ko": "그것들을 사용하는 사람들은 오직 몇 명의 노인 쇼핑객들뿐이었다."}, {"en": "That made the carts even less attractive to the majority of the shoppers.", "ko": "그것은 카트들을 대다수 쇼핑객들에게 훨씬 덜 매력적이도록 만들었다."}, {"en": "Then Goldman hit upon an idea.", "ko": "그때 Goldman이 한 아이디어를 떠올렸다."}, {"en": "He hired several models, men and women, of different ages and asked them to wheel the carts in the store and shop.", "ko": "그는 다른 연령대의 남자와 여자 모델들을 고용했고, 그들에게 상점에서 카트들을 밀고 쇼핑하도록 요청했다."}, {"en": "A young woman employee standing near the entrance told the regular shoppers, ‘Look, everyone is using the carts. Why don’t you?’", "ko": "입구 근처에 서 있던 한 젊은 여성 직원이 일반 쇼핑객들에게 ‘보세요, 모든 사람이 카트를 사용하고 있습니다. 해보는 게 어떠세요?’라고 말했다."}, {"en": "That was the turning point.", "ko": "그것이 전환점이었다."}, {"en": "A few shills disguised as regular shoppers easily accomplished what logic, explanations, and advertisements failed to do.", "ko": "일반 쇼핑객들로 위장한 몇몇의 바람잡이들이 논리, 설명, 그리고 광고가 하지 못한 것을 쉽게 달성했다."}, {"en": "Within a few weeks shoppers readily accepted those carts.", "ko": "몇 주 만에 쇼핑객들은 그 카트들을 기꺼이 받아들였다."}], "chunks": [[0, 1], [2, 2], [3, 6], [7, 9], [10, 12]], "ex": [{"head": "Sylvan Goldman invented the shopping", "clue": ["invented the shopping cart", "in 1937"], "core": "골드먼이 1937년 쇼핑카트 발명·도입", "why": "글의 출발: 쇼핑카트의 발명"}, {"head": "It was an excellent device", "clue": ["It", "an excellent device"], "core": "지치지 않고 원하는 만큼 사게 해 주는 훌륭한 장치", "why": "It(그것) = 앞 문장의 쇼핑카트 → 장점 설명"}, {"head": "But Goldman discovered that in", "clue": ["But", "could not persuade"], "core": "그런데 광고·설명에도 손님 설득 실패", "why": "But(그러나) → 앞의 '훌륭한 장치'와 반대로 아무도 안 씀"}, {"head": "Men were reluctant because they", "clue": ["Men were reluctant", "such carts"], "core": "남자: 카트 밀면 약해 보일까 봐 꺼림", "why": "설득 실패(앞 문장)의 이유 시작 / such carts(그런 카트) = 바퀴 달린 카트"}, {"head": "Women wouldn’t touch them because", "clue": ["Women", "baby carriages"], "core": "여자: 유모차가 떠올라 손도 안 댐", "why": "Men 다음 Women → 꺼린 이유를 사람별로 이어 감"}, {"head": "It was only a few", "clue": ["only a few elderly shoppers"], "core": "쓰는 사람은 노인 몇 명뿐", "why": "남자·여자 다 안 씀 → 결국 남은 사용자는 노인 몇 명"}, {"head": "That made the carts even", "clue": ["That", "even less attractive"], "core": "그래서 카트가 더 인기 없어짐", "why": "That(그것) = 노인만 쓰는 상황 → 노인용처럼 보여 더 매력 없어짐"}, {"head": "Then Goldman hit upon an", "clue": ["Then", "hit upon an idea"], "core": "그때 골드먼이 아이디어를 떠올림", "why": "Then(그때) → 상황이 최악이 된 뒤 해결책 등장"}, {"head": "He hired several models, men", "clue": ["hired several models", "of different ages"], "core": "여러 나이대 남녀 모델을 고용해 카트 밀고 쇼핑하게 함", "why": "앞 문장의 idea(아이디어)의 내용 → 아이디어 바로 다음"}, {"head": "A young woman employee standing", "clue": ["everyone is using the carts"], "core": "입구 직원: '보세요, 다들 카트 써요'", "why": "everyone is using(다들 쓰고 있다) = 앞에서 고용한 모델들이 카트 미는 모습"}, {"head": "That was the turning point.", "clue": ["That", "the turning point"], "core": "그 한마디가 전환점", "why": "That(그것) = 바로 앞 직원의 한마디"}, {"head": "A few shills disguised as", "clue": ["A few shills", "failed to do"], "core": "손님인 척한 바람잡이가 논리·광고가 못 한 일을 해냄", "why": "shills(바람잡이) = 앞의 모델들 / 광고·설명 실패(초반)와 대비해 정리"}, {"head": "Within a few weeks shoppers", "clue": ["Within a few weeks", "those carts"], "core": "몇 주 만에 손님들이 카트를 받아들임", "why": "전환점 이후의 결과 → 시간 표지 Within a few weeks(몇 주 만에)로 마무리"}], "postit": "카트 발명 → 그러나 설득 실패 → 남자·여자·노인 → 더 인기 없음 → 아이디어: 모델 고용 → 직원 한마디 → 전환점 → 바람잡이 성공", "cex": [{"core": "골드먼이 만든 편리한 쇼핑카트", "why": "글의 출발: Sylvan Goldman(골드먼)이 1937년 shopping cart(쇼핑카트)를 발명·도입"}, {"core": "광고·설명에도 손님 설득 실패", "why": "But(그런데) → 앞의 '훌륭한 장치'라는 평가와 달리 아무도 쓰지 않는 반전"}, {"core": "남녀 모두 꺼리고 노인만 써 더 외면받음", "why": "Men were reluctant(남자들은 꺼렸다) → 앞의 설득 실패 이유를 남녀별로 설명"}, {"core": "모델을 고용해 카트를 밀며 쇼핑하게 한 아이디어", "why": "Then(그때) + hit upon an idea(아이디어를 떠올림) → 앞의 인기 없는 상황을 뒤집을 해결책"}, {"core": "바람잡이가 전환점, 몇 주 만에 카트 정착", "why": "That(그것) = 앞의 모델·직원을 동원한 아이디어 → turning point(전환점)"}]}, {"id": "mock_2311_g2-30", "label": "23년 11월 30번 기술 발전과 사생활 보호", "sents": [{"en": "Technology changes how individuals and societies understand the concept of privacy.", "ko": "기술은 개인들과 사회가 사생활의 개념을 이해하는 방식을 변화시킨다."}, {"en": "The fact that someone has a new ability to access information or watch the actions of another does not justify doing so.", "ko": "누군가가 정보에 접근하거나 다른 사람의 행동을 관찰하는 새로운 능력을 갖추고 있다는 사실은 그렇게 하는 것을 정당화하지 않는다."}, {"en": "Rather, advances in technology require citizens and policy makers to consider how privacy protections should be expanded.", "ko": "오히려, 기술의 발전은 시민들과 정책 입안자들이 어떻게 사생활 보호가 확장되어야 하는지 고려할 것을 요구한다."}, {"en": "For example, when cameras first became available for commercial and private use, nations and citizens struggled over whether new laws should be enacted to protect individuals from being photographed without their permission.", "ko": "예를 들어, 카메라가 상업적·개인적 용도로 처음 사용 가능해졌을 때, 국가들과 시민들은 개인이 허락 없이 사진 찍히는 것으로부터 보호하기 위해 새로운 법을 제정해야 하는지를 두고 고심했다."}, {"en": "The reconsideration of privacy brought about by this new technology reaffirmed a distinction between private and public spaces.", "ko": "이 새로운 기술이 가져온 사생활에 대한 재고는 사적 및 공적 공간의 구별을 재확인했다."}, {"en": "It was determined by most cultures that people automatically gave consent to being seen ―and thus recorded ―once they voluntarily stepped into a public space.", "ko": "일단 사람들이 자발적으로 공공장소에 발을 들여놓으면, 보이는 것, 그리고 따라서 녹화되는 것에 자동으로 동의한 것이라고 대부분의 문화에서 결정되었다."}, {"en": "Although some people might be uncomfortable with the spread of surveillance cameras, citizens in most cultures have adjusted to the fact that giving up the right not to be observed in these circumstances causes less harm to the community than failing to have surveillance.", "ko": "일부 사람들은 감시카메라들의 확산을 불편하게 여길지도 모르지만, 대부분의 문화권에 있는 시민들은 이러한 상황에서 관찰되지 않을 권리를 포기하는 것이 감시받지 못하는 것보다 지역사회에 더 적은 해를 끼친다는 사실에 순응해 왔다."}], "chunks": [[0, 1], [2, 2], [3, 3], [4, 5], [6, 6]], "ex": [{"head": "Technology changes how individuals and", "clue": ["Technology", "the concept of privacy"], "core": "기술이 사생활 개념의 이해를 바꿈", "why": "글의 출발: 기술과 사생활(privacy)"}, {"head": "The fact that someone has", "clue": ["a new ability", "does not justify"], "core": "새로 할 수 있게 됐다고 해도 된다는 건 아님", "why": "new ability(새로운 능력) = 기술이 준 능력 → 앞 문장 바로 다음"}, {"head": "Rather, advances in technology require", "clue": ["Rather", "how privacy protections should be expanded"], "core": "오히려 사생활 보호를 어떻게 넓힐지 고민해야 함", "why": "Rather(오히려) → 앞의 부정(does not justify, 정당화 안 됨) 바로 뒤에서 진짜 할 일 제시"}, {"head": "For example, when cameras first", "clue": ["For example", "cameras", "without their permission"], "core": "예: 카메라 등장 → 허락 없는 촬영 막을 법 논쟁", "why": "For example(예를 들어) → 앞의 '보호를 넓히는 고민'의 실제 사례"}, {"head": "The reconsideration of privacy brought", "clue": ["this new technology", "a distinction between private and public spaces"], "core": "그 재고 결과 사적·공적 공간의 구분을 재확인", "why": "this new technology(이 새로운 기술) = 앞 문장의 카메라"}, {"head": "It was determined by most", "clue": ["a public space", "gave consent"], "core": "공공장소에 스스로 들어가면 보이고 녹화되는 데 동의한 것", "why": "public space(공적 공간) = 앞 문장의 '사적/공적 공간 구분' 중 공적 쪽을 자세히"}, {"head": "Although some people might be", "clue": ["surveillance cameras", "in these circumstances", "less harm"], "core": "불편해도 감시 없는 것보다 해가 적어 대부분 받아들임", "why": "these circumstances(이런 상황) = 공공장소에서 찍히는 상황 → 앞 문장 다음 결론"}], "postit": "기술이 사생활 개념 바꿈 → 할 수 있다 ≠ 해도 된다 → 오히려 보호 확장 고민 → 예: 카메라 → 사적·공적 구분 → 공공장소 = 동의 → 감시카메라 수용", "cex": [{"core": "기술이 바꾼 사생활 개념, 가능하다고 정당하진 않음", "why": "글의 출발: Technology(기술)가 privacy(사생활) 개념의 이해를 바꿈 → 새 능력 ≠ 허용"}, {"core": "기술 발전엔 사생활 보호 확대 고민이 필요", "why": "Rather(오히려) → 앞의 '해도 된다는 건 아님'을 받아 해야 할 일로 방향 전환"}, {"core": "카메라 등장과 무단 촬영 금지법 논쟁", "why": "For example(예를 들어) → 앞의 '보호를 어떻게 넓힐지 고민'을 카메라 사례로 보여 줌"}, {"core": "사적·공적 공간 구분 재확인, 공공장소는 동의한 것", "why": "this new technology(이 신기술) = 앞의 카메라 → 그 재고가 낳은 결론"}, {"core": "감시가 불편해도 해가 적어 대부분 받아들임", "why": "surveillance cameras(감시 카메라) → 앞의 '공공장소는 녹화에 동의'를 오늘날 감시 카메라로 연결"}]}, {"id": "mock_2311_g2-31", "label": "23년 11월 31번 기적은 생각 안 하는 사람의 핑계", "sents": [{"en": "Coincidence that is statistically impossible seems to us like an irrational event, and some define it as a miracle.", "ko": "통계적으로 불가능한 우연은 우리에게 비이성적인 사건처럼 보이고, 어떤 이들은 그것을 기적으로 정의한다."}, {"en": "But, as Montaigne has said, “the origin of a miracle is in our ignorance, at the level of our knowledge of nature, and not in nature itself.”", "ko": "그러나, Montaigne가 말했듯이, “기적의 기원은 자연 그 자체가 아니라 자연에 대한 우리의 지식 수준에서, 우리의 무지에 있다.”"}, {"en": "Glorious miracles have been later on discovered to be obedience to the laws of nature or a technological development that was not widely known at the time.", "ko": "영광스러운 기적들은 자연의 법칙에 대한 순응으로서, 혹은 당시에는 널리 알려지지 않았던 기술적 발전으로서 나중에 발견되어 왔다."}, {"en": "As the German poet, Goethe, phrased it: “Things that are mysterious are not yet miracles.”", "ko": "독일 시인 Goethe가 표현했듯이, “신비한 것들이 아직 기적인 것은 아니다.”"}, {"en": "The miracle assumes the intervention of a “higher power” in its occurrence that is beyond human capability to grasp.", "ko": "기적은 그것의 발생에 있어서 인간이 이해할 수 있는 능력 너머의 ‘더 높은 힘’의 개입을 가정한다."}, {"en": "Yet there are methodical and simple ways to “cause a miracle” without divine revelation and inspiration.", "ko": "하지만, 신적인 계시와 영감 없이 ‘기적을 일으키는’ 체계적이고 간단한 방법들이 있다."}, {"en": "Instead of checking it out, investigating and finding the source of the event, we define it as a miracle.", "ko": "그것을 확인하는 것, 즉, 그 사건의 근원을 조사하고 찾는 것 대신에, 우리는 그것을 기적으로 정의한다."}, {"en": "The miracle, then, is the excuse of those who are too lazy to think.", "ko": "그렇다면, 기적은 생각하는 데 너무 게으른 사람들의 핑계이다."}], "chunks": [[0, 0], [1, 2], [3, 4], [5, 7]], "ex": [{"head": "Coincidence that is statistically impossible", "clue": ["Coincidence", "a miracle"], "core": "통계적으로 불가능한 우연 → 기적이라 부름", "why": "글의 출발: 불가능해 보이는 우연을 기적(miracle)이라 부르는 사람들"}, {"head": "But, as Montaigne has said,", "clue": ["But", "in our ignorance"], "core": "몽테뉴: 기적의 기원은 자연이 아니라 우리의 무지", "why": "But(그러나) → 앞의 '기적이라 정의함'에 반대하는 의견 시작"}, {"head": "Glorious miracles have been later", "clue": ["later on discovered", "the laws of nature"], "core": "기적도 나중에 보니 자연법칙이나 몰랐던 기술", "why": "무지(ignorance) 주장의 증거 → 알고 보니 설명이 되더라"}, {"head": "As the German poet, Goethe,", "clue": ["As the German poet, Goethe, phrased it", "not yet miracles"], "core": "괴테: 신비한 것이 곧 기적은 아님", "why": "phrased it(그것을 표현했듯이) → 앞의 몽테뉴 생각을 괴테 말로 한 번 더"}, {"head": "The miracle assumes the intervention", "clue": ["The miracle assumes", "a “higher power”"], "core": "기적은 인간이 못 아는 '더 높은 힘'의 개입을 전제", "why": "기적이 무엇을 '가정'하는지 정리 → 다음 문장 Yet(하지만)의 반박 대상을 깔아 줌"}, {"head": "Yet there are methodical and", "clue": ["Yet", "“cause a miracle”"], "core": "하지만 신의 계시 없이도 기적을 만드는 간단한 방법이 있음", "why": "Yet(하지만) → 앞의 '더 높은 힘'과 반대로 사람 손으로 기적 만들기"}, {"head": "Instead of checking it out,", "clue": ["Instead of checking it out", "we define it as a miracle"], "core": "확인·조사 대신 그냥 기적이라 정의해 버림", "why": "그 '간단한 방법'의 정체 = 조사 안 하고 기적이라 부르기"}, {"head": "The miracle, then, is the", "clue": ["then", "too lazy to think"], "core": "결국 기적 = 생각하기 귀찮은 사람의 핑계", "why": "then(그렇다면) → 앞 문장을 받아 글 전체 결론"}], "postit": "불가능한 우연 = 기적? → 몽테뉴: 무지 탓 → 괴테: 신비 ≠ 기적 → 기적은 더 높은 힘 가정 → 하지만 쉬운 방법: 조사 대신 기적이라 부르기 → 기적 = 게으름의 핑계", "cex": [{"core": "통계적으로 불가능한 우연을 기적이라 부름", "why": "글의 출발: Coincidence ... statistically impossible(통계적으로 불가능한 우연) = miracle(기적)"}, {"core": "몽테뉴: 기적은 우리의 무지에서 나옴", "why": "But(하지만) → 앞의 '기적이라 정의'에 맞서 그 기원이 무지라는 반박"}, {"core": "괴테: 신비 ≠ 기적, 기적은 더 높은 힘을 전제", "why": "As ... Goethe phrased it(괴테가 말했듯) → 앞의 몽테뉴 인용에 이어 두 번째 인용 추가"}, {"core": "조사 대신 기적이라 정의, 기적 = 게으른 사람의 핑계", "why": "Yet(하지만) → 앞의 '더 높은 힘' 전제와 달리 계시 없이 기적을 만드는 방법 제시"}]}, {"id": "mock_2311_g2-32", "label": "23년 11월 32번 사건 뒤 정보가 기억에 섞임", "sents": [{"en": "Information encountered after an event can influence subsequent remembering.", "ko": "사건 후에 마주친 정보는 이후의 기억하는 것에 영향을 미칠 수 있다."}, {"en": "External information can easily integrate into a witness’s memory, especially if the event was poorly encoded or the memory is from a distant event, in which case time and forgetting have degraded the original memory.", "ko": "특히 사건이 불충분하게 부호화되었거나, 그 기억이 시간과 망각이 원래의 기억을 저하시켜 온 먼 사건으로부터 온 것이라면, 외부 정보는 목격자의 기억에 쉽게 통합될 수 있다."}, {"en": "With reduced information available in memory with which to confirm the validity of post-event misinformation, it is less likely that this new information will be rejected.", "ko": "사건 후의 잘못된 정보가 타당한지 확인하는 데 쓸 수 있는 정보가 기억 속에 줄어들어 있으면, 이 새로운 정보가 거부될 가능성은 더 낮다."}, {"en": "Instead, especially when it fits the witness’s current thinking and can be used to create a story that makes sense to him or her, it may be integrated as part of the original experience.", "ko": "대신에, 특히 그것이 목격자의 현재 생각과 맞고 그 또는 그녀에게 이해되는 하나의 이야기를 만드는 데 사용될 수 있을 때, 그것은 원래 경험의 일부로서 통합될 수 있다."}, {"en": "This process can be explicit (i.e., the witness knows it is happening), but it is often unconscious.", "ko": "이 과정은 명시적일 수 있지만(즉, 목격자는 그것이 일어나고 있다는 것을 알고 있다), 그것은 흔히 무의식적이다."}, {"en": "That is, the witness might find himself or herself thinking about the event differently without awareness.", "ko": "즉, 목격자는 의식하지 못한 채 그 사건에 대해 다르게 생각하는 그 자신 또는 그녀 자신을 발견할지도 모른다."}, {"en": "Over time, the witness may not even know the source of information that led to the (new) memory.", "ko": "시간이 지나면, 목격자는 그 (새로운) 기억으로 이어진 정보의 출처조차 모를 수도 있다."}, {"en": "Sources of misinformation in forensic contexts can be encountered anywhere, from discussions with other witnesses to social media searches to multiple interviews with investigators or other legal professionals, and even in court.", "ko": "법적 상황에서 잘못된 정보의 출처는 다른 목격자들과의 대화에서부터 소셜 미디어 검색, 수사관이나 다른 법률 전문가들과의 여러 번의 면담, 그리고 심지어 법정에 이르기까지 어디에서나 마주칠 수 있다."}], "chunks": [[0, 0], [1, 3], [4, 5], [6, 7]], "ex": [{"head": "Information encountered after an event", "clue": ["after an event", "subsequent remembering"], "core": "사건 뒤에 접한 정보가 나중 기억에 영향", "why": "글의 출발: 사건 후 정보와 기억"}, {"head": "External information can easily integrate", "clue": ["External information", "degraded the original memory"], "core": "기억이 약하거나 오래되면 외부 정보가 쉽게 섞임", "why": "after an event 정보 = External information(외부 정보)로 이어 받음"}, {"head": "With reduced information available in", "clue": ["reduced information", "this new information"], "core": "기억 속 정보가 줄어 새 정보를 덜 거부함", "why": "reduced information(줄어든 정보) = 앞 문장의 '저하된 원래 기억'"}, {"head": "Instead, especially when it fits", "clue": ["Instead", "part of the original experience"], "core": "대신 원래 경험의 일부로 들어감", "why": "Instead(대신에) → 앞의 '거부되지 않음' 대신 '통합됨'"}, {"head": "This process can be explicit", "clue": ["This process", "often unconscious"], "core": "이 과정은 흔히 무의식적", "why": "This process(이 과정) = 앞에서 새 정보가 원래 경험에 섞이는 과정"}, {"head": "That is, the witness might", "clue": ["That is", "without awareness"], "core": "즉 모르는 새 사건을 다르게 생각하게 됨", "why": "That is(즉) → 앞의 unconscious(무의식적)를 쉬운 말로 풀이"}, {"head": "Over time, the witness may", "clue": ["Over time", "the source of information"], "core": "시간이 지나면 그 정보의 출처조차 모름", "why": "Over time(시간이 지나면) → 모르는 새 섞인 결과가 더 진행됨"}, {"head": "Sources of misinformation in forensic", "clue": ["Sources of misinformation", "even in court"], "core": "잘못된 정보의 출처는 법정까지 어디에나", "why": "앞 문장 source(출처)를 받아 '그 출처가 어디인가'로 마무리"}], "postit": "사건 뒤 정보 → 약한 기억에 쉽게 섞임 → 거부 덜 함 → 원래 경험이 됨 → 이 과정은 무의식 → 즉 모르는 새 → 출처도 모름 → 출처는 어디에나", "cex": [{"core": "사건 뒤 접한 정보가 나중 기억에 영향", "why": "글의 출발: Information encountered after an event(사건 뒤 접한 정보)가 기억에 영향"}, {"core": "약하거나 오래된 기억에 외부 정보가 섞여 들어감", "why": "External information(외부 정보) = 앞의 사건 뒤 정보 → 언제 쉽게 섞이는지 설명"}, {"core": "이 과정은 흔히 무의식적, 모르는 새 다르게 기억", "why": "This process(이 과정) = 앞의 외부 정보가 원래 경험에 섞이는 과정"}, {"core": "시간이 지나면 출처도 모름, 잘못된 정보는 어디에나", "why": "Over time(시간이 지나면) → 앞의 무의식적 과정이 더 진행된 결과"}]}, {"id": "mock_2311_g2-33", "label": "23년 11월 33번 상관관계: 이유 설명은 미루기", "sents": [{"en": "Correlations are powerful because the insights they offer are relatively clear.", "ko": "상관관계는 그것들이 제공하는 통찰력이 비교적 명확하기 때문에 강력하다."}, {"en": "These insights are often covered up when we bring causality back into the picture.", "ko": "이러한 통찰력은 종종 우리가 인과 관계를 그 상황으로 다시 가져올 때 가려진다."}, {"en": "For instance, a used-car dealer supplied data to statisticians to predict which of the vehicles available for purchase at an auction were likely to have problems.", "ko": "예를 들어, 한 중고차 딜러가 경매에서 구입할 수 있는 차량들 중 어떤 차량에 문제가 발생할 가능성이 있는지를 예측하기 위한 데이터를 통계학자들에게 제공했다."}, {"en": "A correlation analysis showed that orange-colored cars were far less likely to have defects.", "ko": "한 상관관계 분석은 주황색 차들이 결함이 있을 가능성이 훨씬 적다는 것을 보여 줬다."}, {"en": "Even as we read this, we already think about why it might be so:", "ko": "심지어 우리가 이것을 읽으면서도, 우리는 이미 왜 그럴지에 대해 생각한다."}, {"en": "Are orange-colored car owners likely to be car enthusiasts and take better care of their vehicles?", "ko": "주황색 차를 소유한 사람들이 자동차 애호가여서 그들의 차량을 더 잘 관리할 가능성이 있는가?"}, {"en": "Or, is it because orange-colored cars are more noticeable on the road and therefore less likely to be in accidents, so they’re in better condition when resold?", "ko": "아니면, 주황색 차들이 도로에서 더 눈에 띄고, 그래서 사고가 날 가능성이 적어 재판매될 때 그것들이 상태가 더 좋은 것이기 때문인가?"}, {"en": "Quickly we are caught in a web of competing causal hypotheses.", "ko": "곧 우리는 서로 경쟁하는 인과 가설들의 그물망에 걸려든다."}, {"en": "But our attempts to illuminate things this way only make them cloudier.", "ko": "하지만 이런 식으로 상황을 밝히려는 우리의 시도는 그것들을 더 흐리게 만들 뿐이다."}, {"en": "Correlations exist; we can show them mathematically.", "ko": "상관관계는 존재하며 우리는 그것들을 수학적으로 보여 줄 수 있다."}, {"en": "We can’t easily do the same for causal links.", "ko": "우리는 인과 관계에 대해서는 쉽게 똑같이 할 수 없다."}, {"en": "So we would do well to hold off from trying to explain the reason behind the correlations.", "ko": "따라서 우리는 상관관계 뒤에 있는 이유를 설명하려는 것을 삼가는 편이 좋다."}], "chunks": [[0, 1], [2, 3], [4, 6], [7, 8], [9, 11]], "ex": [{"head": "Correlations are powerful because the", "clue": ["Correlations", "relatively clear"], "core": "상관관계는 통찰이 명확해서 강력", "why": "글의 출발: 상관관계(correlations)의 힘"}, {"head": "These insights are often covered", "clue": ["These insights", "causality"], "core": "인과 관계를 끌어들이면 그 통찰이 가려짐", "why": "These insights(이 통찰) = 앞 문장의 상관관계가 주는 통찰"}, {"head": "For instance, a used-car dealer", "clue": ["For instance", "a used-car dealer"], "core": "예: 중고차 딜러가 문제 차를 예측하려 데이터 '을 이탈리아 알프스 사례로"}]}, {"id": "mock_2311_g2-37", "label": "23년 11월 37번 표본 대신 전체 데이터", "sents": [{"en": "For a long time, random sampling was a good shortcut.", "ko": "오랫동안, 무작위 추출법은 좋은 지름길이었다."}, {"en": "It made analysis of large data problems possible in the pre-digital era.", "ko": "그것은 디지털 시대 이전에 큰 데이터 문제 분석을 가능하게 했다."}, {"en": "But much as converting a digital image or song into a smaller file results in loss of data, information is lost when sampling.", "ko": "그러나 디지털 이미지나 노래를 더 작은 파일로 변환하는 것이 데이터 손실을 유발하는 것과 마찬가지로, 추출을 할 때 정보가 손실된다."}, {"en": "Having the full (or close to the full) dataset provides a lot more freedom to explore, to look at the data from different angles or to look closer at certain aspects of it.", "ko": "전체(또는 전체에 가까운) 데이터 세트를 가지는 것은 탐색하거나 다른 각도에서 데이터를 살펴보거나 그것의 특정 측면들을 더 자세히 보게 하는 자유를 훨씬 더 많이 제공한다."}, {"en": "A fitting example may be the light-field camera, which captures not just a single plane of light, as with conventional cameras, but rays from the entire light field, some 11 million of them.", "ko": "적절한 예는 라이트 필드 카메라일 것인데, 그것은 기존 카메라처럼 빛의 단일 평면만 포착하는 것이 아니라 전체 라이트 필드에서 오는 약 1,100만 개의 광선을 포착한다."}, {"en": "The photographers can decide later which element of an image to focus on in the digital file.", "ko": "사진사들은 디지털 파일에서 이미지의 어느 요소에 초점을 맞출지를 나중에 결정할 수 있다."}, {"en": "There is no need to focus at the beginning, since collecting all the information makes it possible to do that afterwards.", "ko": "모든 정보를 수집하는 것은 그것을 나중에 하는 것을 가능하게 만들기 때문에, 처음에 초점을 맞출 필요는 없다."}, {"en": "Because rays from the entire light field are included, it is closer to all the data.", "ko": "전체 라이트 필드에서 오는 광선들이 포함되기 때문에, 그것은 모든 데이터에 더 가깝다."}, {"en": "As a result, the information is more “reusable” than ordinary pictures, where the photographer has to decide what to focus on before she presses the shutter.", "ko": "결과적으로 사진사가 셔터를 누르기 전에 그녀가 무엇에 초점을 맞출지를 결정해야 하는 일반 사진들보다 그 정보는 더 ‘재사용 가능’하다."}], "chunks": [[0, 1], [2, 2], [3, 3], [4, 8]], "ex": [{"head": "For a long time, ra
