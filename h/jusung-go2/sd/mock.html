2311_g2-38", "label": "23년 11월 38번 내향적 리더와 서번트 리더십", "sents": [{"en": "Introverted leaders do have to overcome the strong cultural presumption that extroverts are more effective leaders.", "ko": "내향적인 리더들은 외향적인 사람들이 더 유능한 리더라는 강력한 문화적 억측을 극복해야 한다."}, {"en": "Although the population splits into almost equal parts between introverts and extroverts, more than 96 percent of managers and executives are extroverted.", "ko": "비록 인구는 내향적인 사람과 외향적인 사람 사이에서 거의 동등한 비율로 나뉘지만, 관리자와 임원의 96% 이상이 외향적이다."}, {"en": "In a study done in 2006, 65 percent of senior corporate executives viewed introversion as a barrier to leadership.", "ko": "2006년에 실시된 한 연구에서, 기업 고위 임원의 65%가 내향성을 리더십의 장애물로 간주했다."}, {"en": "We must reexamine this stereotype, however, as it doesn’t always hold true.", "ko": "하지만 그것이 항상 맞는 것은 아니기 때문에 우리는 이 고정 관념을 재검토해야 한다."}, {"en": "Regent University found that a desire to be of service to others and to empower them to grow, which is more common among introverts than extroverts, is a key factor in becoming a leader and retaining leadership.", "ko": "Regent 대학교는 다른 사람들에게 도움이 되고 그들이 성장할 수 있도록 힘을 주고자 하는 열망이 리더가 되고 리더십을 유지하는 데 핵심적인 요소이고, 그것이 외향적인 사람들보다 내향적인 사람들 사이에서 더 일반적이라는 것을 발견했다."}, {"en": "So-called servant leadership, dating back to ancient philosophical literature, adheres to the belief that a company’s goals are best achieved by helping workers or customers achieve their goals.", "ko": "고대 철학 문헌으로 거슬러 올라가는 소위 서번트 리더십은 한 회사의 목표가 근로자나 고객이 그들의 목표를 달성하도록 도움으로써 가장 잘 달성된다는 믿음을 고수한다."}, {"en": "Such leaders do not seek attention but rather want to shine a light on others’ wins and achievements; servant leadership requires humility, but that humility ultimately pays off.", "ko": "그런 리더들은 관심을 추구하는 것이 아니라 오히려 다른 사람들의 승리와 업적에 빛을 비추고 싶어 하고, 서번트 리더십은 겸손을 필요로 하지만, 그 겸손은 궁극적으로 결실을 맺는다."}], "chunks": [[0, 0], [1, 2], [3, 4], [5, 6]], "ex": [{"head": "Introverted leaders do have to", "clue": ["Introverted leaders", "the strong cultural presumption"], "core": "내향적 리더는 '외향인이 더 유능'이라는 편견을 ndards.", "ko": "19세기까지, 프랑스는 공간, 시간, 그리고 더 많은 것을 포착하기 위해 정밀하게 규정된 측정 단위의 체계를 개발했고, 다른 국가들이 동일한 기준을 채택하도록 만들기 시작했었다."}, {"en": "Just half a century later, in the 1920s, the discoveries of quantum mechanics forever destroyed the dream of comprehensive and perfect measurement.", "ko": "불과 반세기 후, 1920년대에, 양자역학의 발견은 포괄적이고 완벽한 측정에 대한 꿈을 영원히 깨 버렸다."}, {"en": "And yet, outside a relatively small circle of physicists, the mindset of humankind’s drive to flawlessly measure continued among engineers and scientists.", "ko": "그러나 비교적 소수 집단의 물리학자를 제외하고는 공학자와 과학자 사이에서 완벽하게 측정하려고 하는 인류의 추진 정신은 계속되었다."}, {"en": "In the world of business it even expanded, as the precision-oriented sciences of mathematics and statistics began to influence all areas of commerce.", "ko": "정확성을 지향하는 수학과 통계학이라는 과학이 상업의 모든 영역에 영향을 미치기 시작하면서 비즈니스의 세계에서 그것은 심지어 확장되었다."}, {"en": "However, contrary to the trend of the past several decades, in many new situations that are occurring today, allowing for imprecision―for messiness―may be a positive feature, not a shortcoming.", "ko": "그러나, 지난 수십 년간의 경향과 반대로, 오늘날 일어나는 많은 새로운 상황에서는 부정확성, 즉 어수선함을 허용하는 것이 단점이 아니라 긍정적인 특성이 될 수 있다."}, {"en": "As a tradeoff for relaxing the standards of allowable errors, one can get a hold of much more data.", "ko": "허용 가능한 오류의 기준을 완화하는 대가로, 사람은 훨씬 더 많은 데이터를 얻을 수 있다."}, {"en": "It isn’t just that “more is better than some,” but that, in fact, sometimes “more is greater than better.”", "ko": "그것은 단순히 ‘많은 것이 약간보다 낫다’는 것만이 아니라, 사실 때로는 ‘많은 것이 더 좋은 것보다 더 훌륭하다’는 것이다."}], "chunks": [[0, 0], [1, 1], [2, 3], [4, 4], [5, 6]], "ex": [{"head": "By the nineteenth century, France", "clue": ["By the nineteenth century", "precisely defined units"], "core": "19세기 프랑스가 정밀 측정 단위를 만들어 퍼뜨림", "why": "글의 출발: 정밀 측정(precise measurement)의 시작"}, {"head": "Just half a century later,", "clue": ["Just half a century later", "quantum mechanics", "destroyed the dream"], "core": "반세기 뒤 양자역학이 완벽한 측정의 꿈을 깸", "why": "half a century later(반세기 뒤) = 19세기 다음 1920년대 → 시간 순서"}, {"head": "And yet, outside a relatively", "clue": ["And yet", "continued"], "core": "그래도 물리학자 밖에서는 정확한 측정 욕구가 계속됨", "why": "And yet(그런데도) → 앞의 '꿈이 깨짐'과 반대로 계속됨"}, {"head": "In the world of business", "clue": ["it even expanded"], "core": "비즈니스 세계에서는 오히려 더 확장", "why": "it(그것) = 앞 문장의 정확히 재려는 마음 / even(심지어) → 계속을 넘어 확장"}, {"head": "However, contrary to the trend", "clue": ["However", "contrary to the trend", "imprecision"], "core": "그러나 오늘날엔 부정확함을 허용하는 게 장점일 수 있음", "why": "However + contrary to the trend(경향과 반대로) = 앞의 정확성 추구 흐름을 뒤집음"}, {"head": "As a tradeoff for relaxing", "clue": ["relaxing the standards of allowable errors", "much more data"], "core": "오류 기준을 풀어 주는 대가로 훨씬 많은 데이터 확보", "why": "relaxing(완화) = 앞의 imprecision(부정확성) 허용을 다시 말함"}, {"head": "It isn’t just that “more", "clue": ["more is greater than better"], "core": "많은 것이 더 좋은 것보다 나을 때도 있음", "why": "앞의 much more data(훨씬 많은 데이터)를 표어로 마무리"}], "postit": "19세기 정밀 측정 → 양자역학이 꿈 깸 → 그래도 계속 → 비즈니스에선 확장 → 그러나 오늘날 부정확성 = 장점 → 더 많은 데이터 → 많은 게 더 나음", "cex": [{"core": "19세기 프랑스의 정밀 측정 단위와 확산", "why": "글의 출발: By the nineteenth century(19세기 무렵) 프랑스가 측정 단위 표준을 퍼뜨림"}, {"core": "반세기 뒤 양자역학이 완벽한 측정의 꿈을 깸", "why": "Just half a century later(겨우 반세기 뒤) → 앞의 19세기에서 1920년대로 시간 이동"}, {"core": "그래도 측정 욕구는 계속, 비즈니스에선 더 확장", "why": "And yet(그런데도) → 앞의 '꿈이 깨짐'에도 불구하고 이어진 정밀성 추구"}, {"core": "오늘날엔 부정확함 허용이 장점일 수 있음", "why": "However(그러나) + contrary to the trend(경향과 반대로) → 앞의 정밀성 확장과 대비"}, {"core": "오류 기준 완화 대가로 훨씬 많은 데이터 확보", "why": "As a tradeoff(그 대가로) → 앞의 '부정확함 허용'으로 얻는 이익 설명"}]}, {"id": "mock_2311_g2-40", "label": "23년 11월 40번 협력하는 사람이 얻는 사회적 이익", "sents": [{"en": "Multiple laboratory studies show that cooperative people tend to receive social advantages from others.", "ko": "여러 실험실 연구들은 협력적인 사람들이 다른 사람들로부터 사회적인 혜택들을 받는 경향이 있다는 것을 보여 준다."}, {"en": "One way to demonstrate this is to give people the opportunity to act positively or negatively toward contributors.", "ko": "이것을 증명하는 한 가지 방법은 사람들에게 기여자들을 향해 긍정적이거나 부정적으로 행동할 기회를 주는 것이다."}, {"en": "For example, Pat Barclay, a professor at the University of Guelph, had participants play a cooperative game where people could contribute money toward a group fund which helped all group members, and then allowed participants to give money to other participants based on their reputations.", "ko": "예를 들어, Guelph 대학교의 교수인, Pat Barclay는 참가자들로 하여금 모든 집단 구성원들을 도와주는 집단 기금에 사람들이 돈을 기부할 수 있는 협동 게임을 하도록 한 다음, 참가자들이 그들의 평판을 바탕으로 다른 참가자들에게 돈을 줄 수 있도록 허락했다."}, {"en": "People who contributed more to the group fund were given responsibility for more money than people who contributed less.", "ko": "집단 기금에 더 많이 기부한 사람들은 덜 기부한 사람들보다 더 많은 돈에 대한 책임이 주어졌다."}, {"en": "Similar results have been found by other researchers.", "ko": "유사한 결과들이 다른 연구자들에 의해 발견되었다."}, {"en": "People who contribute toward their groups are also chosen more often as interaction partners, preferred as leaders, rated as more desirable partners for long-term relationships, and are perceived to be trustworthy and have high social status.", "ko": "또한 그들의 집단에 기여하는 사람들은 상호작용 파트너로서 더 자주 선택되고, 리더로서 선호되며, 장기적인 관계를 위한 더 바람직한 파트너들로서 평가되고, 신뢰할 수 있고 사회적 지위가 높은 것으로 인식된다."}, {"en": "Uncooperative people tend to receive verbal criticism or even more severe punishment.", "ko": "비협조적인 사람들은 언어적인 비판이나 심지어 더 심한 벌을 받는 경향이 있다."}], "chunks": [[0, 1], [2, 2], [3, 4], [5, 6]], "ex": [{"head": "Multiple laboratory studies show that", "clue": ["cooperative people", "social advantages"], "core": "협력적인 사람은 남들에게 사회적 혜택을 받음", "why": "글의 출발: 협력(cooperative)과 사회적 이익"}, {"head": "One way to demonstrate this", "clue": ["One way to demonstrate this", "contributors"], "core": "보여 주는 방법: 기여자에게 좋게/나쁘게 대할 기회 주기", "why": "this(이것) = 앞의 '협력자가 혜택 받음' → 증명 방법"}, {"head": "For example, Pat Barclay, a", "clue": ["For example", "a group fund", "based on their reputations"], "core": "예: 집단 기금 게임 후 평판 보고 돈 주게 한 실험", "why": "For example(예를 들어) → 앞의 '기회 주기' 방법을 쓴 실제 실험"}, {"head": "People who contributed more to", "clue": ["the group fund", "responsibility for more money"], "core": "더 기부한 사람이 더 많은 돈을 맡음", "why": "the group fund(그 집단 기금) = 앞 실험의 기금 → 실험 결과"}, {"head": "Similar results have been found", "clue": ["Similar results"], "core": "다른 연구자들도 비슷한 결과", "why": "Similar results(비슷한 결과) = 바로 앞 실험 결과가 있어야 가능"}, {"head": "People who contribute toward their", "clue": ["also", "trustworthy"], "core": "기여자는 파트너·리더로도 선호되고 믿음을 받음", "why": "also(또한) → 돈을 더 맡는 것에 더해 다른 이득도"}, {"head": "Uncooperative people tend to receive", "clue": ["Uncooperative people", "punishment"], "core": "비협조자는 비판이나 벌을 받음", "why": "협력자의 이득 다음 → 반대편 비협조자(Uncooperative)의 결과로 대비"}], "postit": "협력자 = 사회적 혜택 → 증명 방법 → 예: 기금 게임 → 더 기부하면 돈 더 맡음 → 비슷한 결과 → 파트너·리더로도 선호 ↔ 비협조자는 벌", "cex": [{"core": "협력적인 사람은 사회적 혜택을 받음, 확인 방법", "why": "글의 출발: cooperative people(협력적인 사람)은 social advantages(사회적 혜택)를 받음"}, {"core": "예: 집단 기금 게임 후 평판 보고 돈 주기 실험", "why": "For example(예를 들어) → 앞의 '좋게/나쁘게 대할 기회 주기' 방법의 실제 실험"}, {"core": "더 기부한 사람이 더 많은 돈을 맡음, 유사 결과 다수", "why": "People who contributed more(더 기부한 사람) → 앞의 실험 설계에 이어 나온 결과"}, {"core": "기여자는 파트너·리더로 선호, 비협조자는 벌", "why": "also(또한) → 앞의 돈 실험 결과에 더해 기여자가 받는 다른 혜택들"}]}, {"id": "mock_2311_g2-41", "label": "23년 11월 41~42번 청중과 공연자를 잇는 방법", "sents": [{"en": "In Western society, many music performance settings make a clear distinction between performers and audience members: the performers are the “doers” and those in the audience take a decidedly passive role.", "ko": "서양 사회에서, 많은 음악 공연 상황은 공연자와 청중 사이에 명확한 구분을 만든다. 공연자들은 ‘행위자들’이고, 청중 속 사람들은 분명히 수동적인 역할을 맡는다."}, {"en": "The performance space itself may further reinforce the distinction with a physical separation between the stage and audience seating.", "ko": "공연 공간 그 자체가 무대와 청중석 사이의 물리적 분리로 구분을 더 강화할 수 있다."}, {"en": "Perhaps because this distinction is so common, audiences seem to greatly value opportunities to have special “access” to performers that affords understanding about performers’ style of music.", "ko": "아마도 이러한 구분이 너무 흔하기 때문에, 청중들은 공연자의 음악 스타일에 대한 이해를 제공하는 공연자에 대한 특별한 ‘접근’을 할 기회들에 크게 가치를 부여하는 것처럼 보인다."}, {"en": "Some performing musicians have won great approval by regularly incorporating “audience participation” into their concerts.", "ko": "일부 공연음악가는 정기적으로 그들의 콘서트에 ‘청중 참여’를 포함함으로써 큰 호응을 받아 왔다."}, {"en": "Whether by leading a sing-along activity or teaching a rhythm to be clapped at certain points, including audience members in the music making can boost the level of engagement and enjoyment for all involved.", "ko": "함께 노래 부르기 활동을 하든지 지정된 지점에서 박수를 치도록 리듬을 가르치든지, 음악을 만드는데 있어서 청중 구성원을 포함하는 것은 모든 참여자의 참여와 즐거움의 수준을 높일 수 있다."}, {"en": "Performers who are uncomfortable leading audience participation can still connect with the audience simply by giving a special glimpse of the performer perspective.", "ko": "청중 참여를 이끄는 것이 불편한 공연자들도 공연자의 관점을 특별히 살짝 보여 주는 것만으로 여전히 청중과 연결될 수 있다."}, {"en": "It is quite common in classical music to provide audiences with program notes.", "ko": "클래식 음악에서는 청중에게 프로그램 해설을 제공하는 것이 상당히 흔하다."}, {"en": "Typically, this text in a program gives background information about pieces of music being performed and perhaps biographical information about historically significant composers.", "ko": "전형적으로, 이러한 프로그램의 텍스트는 연주되는 음악 작품에 대한 배경 정보와 아마도 역사적으로 중요한 작곡가들에 대한 전기 정보를 제공한다."}, {"en": "What may be of more interest to audience members is background information about the very performers who are onstage, including an explanation of why they have chosen the music they are presenting.", "ko": "청중들에게 더 흥미로울 수도 있는 것은 공연자들이 그들이 선보이고 있는 음악을 왜 선택했는지에 대한 설명을 포함한, 무대 위에 있는 바로 그 연주가에 관한 배경 정보이다."}, {"en": "Such insight can make audience members feel closer to the musicians onstage, both metaphorically and emotionally.", "ko": "그러한 통찰력은 청중들이 무대 위에 있는 음악가들에게 비유적이고 감정적으로 더 가까이 느끼게 만들 수 있다."}, {"en": "This connection will likely enhance the expressive and communicative experience.", "ko": "이러한 연결은 표현적이고 소통적인 경험을 아마 향상시킬 것이다."}], "chunks": [[0, 1], [2, 2], [3, 4], [5, 6], [7, 10]], "ex": [{"head": "In Western society, many music", "clue": ty of product variants so that there is very little in the way of market demand that is not accommodated.", "ko": "일반적인 생각은 아주 다양한 제품 변형을 출시해서 충족되지 않는 시장 수요가 거의 없게 만드는 것이다."}, {"en": "Arguably, if a market is already filled with product variants it is more difficult for competitors to find untapped pockets of market demand.", "ko": "거의 틀림없이, 시장이 이미 제품 변형들로 가득 차 있다면 경쟁자들은 아직 손대지 않은 수요의 틈새를 찾기 더 어렵다."}], "chunks": [[0, 3], [4, 4], [5, 5], [6, 7]], "ex": [{"head": "Pre-emption means that a", "clue": ["Pre-emption means", "prevent a rival"], "core": "선점 = 경쟁자가 어떤 활동을 시작 못 하게 막는 전략", "why": "글의 출발: 선점(pre-emption)의 정의"}, {"head": "In some case a", "clue": ["a pre-emptive move", "an announcement of some intent"], "core": "의도를 발표하는 것만으로도 선점이 됨", "why": "a pre-emptive move(선점 조치) = 앞에서 정의한 선점의 가장 간단한 형태"}, {"head": "The idea of pre-emption", "clue": ["The idea of pre-emption", "timing"], "core": "선점에선 타이밍이 중요함", "why": "The idea of pre-emption(선점이라는 개념) → 정의 다음 '그래서 타이밍이 중요'"}, {"head": "Pre-emption may involve up-weighting", "clue": ["up-weighting advertising", "a new entrant"], "core": "전략 1: 신규 진입자 출시 전후로 광고를 늘림", "why": "Pre-emption(선점)이 실제로 쓰이는 첫 전략: before and during(전과 도중) = 앞의 타이밍 얘기"}, {"head": "The intent is to", "clue": ["The intent", "the new entrant’s advertising"], "core": "목적: 신규 진입자 광고가 눈에 안 띄게", "why": "The intent(그 의도) = 바로 앞 광고 늘리기의 목적, the new entrant(그 신규 진입자) = 앞의 a new entrant → 광고 얘기 바로 다음"}, {"head": "Product proliferation is another", "clue": ["Product proliferation", "another potential pre-emption strategy"], "core": "전략 2: 제품 확산", "why": "another(또 다른) = 첫 번째 전략(광고 늘리기)과 그 의도 설명이 끝난 뒤 → 새 전략으로 넘어감"}, {"head": "The general idea is", "clue": ["The general idea", "a large variety of product variants"], "core": "다양한 제품 변형을 내서 빈 수요를 없앰", "why": "product variants(제품 변형) = 바로 앞 Product proliferation(제품 확산)을 풀어 설명"}, {"head": "Arguably, if a market", "clue": ["Arguably", "already filled with product variants", "untapped pockets of market demand"], "core" hape in the organism.", "ko": "이런 배색 형태, 즉 카운터셰이딩은 생물의 모양에 대한 시각적 인상을 없앤다."}, {"en": "It allows the animal to blend in with its background.", "ko": "그것은 동물이 배경과 섞여 들게 해 준다."}], "chunks": [[0, 2], [3, 4], [5, 6], [7, 9]], "ex": [{"head": "Countershading is the process", "clue": ["Countershading", "camouflage"], "core": "카운터셰이딩 = 납작해 보이게 하는 위장", "why": "글의 출발: 카운터셰이딩(countershading)의 정의"}, {"head": "When sunlight illuminates an", "clue": ["from above", "brightest on top"], "core": "위에서 빛을 받으면 물체 윗부분이 가장 밝음", "why": "원리 설명 시작: 위에서 빛이 비치는 상황"}, {"head": "The color of the", "clue": ["The color of the object", "toward the bottom"], "core": "아래로 갈수록 점점 어두워짐", "why": "the object(그 물체) = 앞의 위에서 빛 받은 물체, 위(top)는 밝고 → 아래(bottom)는 어두움"}, {"head": "This shading gives the", "clue": ["This shading", "distinguish its shape"], "core": "이 음영 때문에 입체감이 생겨 모양이 보임", "why": "This shading(이 음영) = 바로 앞 '아래로 갈수록 어두워짐'"}, {"head": "Thus even if an", "clue": ["Thus", "uniformly", "easily visible"], "core": "그래서 바탕과 같은 색이어도 빛 받으면 잘 보임", "why": "Thus(따라서) = 음영으로 모양이 드러난다는 앞 문장의 결과를 동물에 적용"}, {"head": "Most animals, however, are", "clue": ["Most animals, however", "darker above"], "core": "하지만 대부분 동물은 등(위)이 배(아래)보다 어두움", "why": "however(그러나) = 앞의 '균일한 색이면 잘 보임'과 달리 실제 동물은 위가 어두움"}, {"head": "When they are illuminated", "clue": ["the darker back is lightened", "the lighter belly is shaded"], "core": "빛 받으면 어두운 등은 밝아지고 밝은 배는 어두워짐", "why": "they(그것들) = 앞의 Most animals, darker back(어두운 등) = 앞의 darker above"}, {"head": "The animal thus appears", "clue": ["The animal thus", "a single color"], "core": "그래서 한 가지 색처럼 보여 바탕에 섞임", "why": "thus(그래서) = 앞의 '등은 밝아지고 배는 어두워짐'이 서로 상쇄된 결과"}, {"head": "This pattern of coloration,", "clue": ["This pattern of coloration, or countershading"], "core": "이 배색 = 카운터셰이딩, 모양이 안 보이게 함", "why": "This pattern of coloration(이런 배색) = 앞의 '등이 어둡고 배가 밝은' 색 배치에 이름 붙이기"}, {"head": "It allows the animal", "clue": ["It allows", "blend in with its background"], "core": "동물이 배경에 섞여 들게 해 줌", "why": "It(그것) = 바로 앞 countershading → 마무리"}], "postit": "카운터셰이딩 = 납작해 보이게 하는 위장 → 위에서 빛: 위는 밝고 아래는 어두움 → 이 음영이 모양을 드러냄 → 하지만 동물은 등이 어둡고 배가 밝음 → 빛 받으면 한 가지 색처럼 → 배경에 섞임", "cex": [{"core": "카운터셰이딩 정의와 위에서 빛 받은 물체의 명암", "why": "글의 출발: Countershading(카운터셰이딩) 정의 → 위는 밝고 아래로 어두워지는 원리"}, {"core": "음영이 입체감을 줘 같은 색 바탕에서도 눈에 띔", "why": "This shading(이 음영) = 앞의 위는 밝고 아래로 어두워지는 명암 → 그 효과 설명"}, {"core": "동물은 등이 더 어두워 빛 받으면 명암이 상쇄됨", "why": "however(하지만) → 앞의 '같은 색이어도 잘 보임'에 맞서 대부분 동물의 실제 배색 제시"}, {"core": "단색처럼 보여 바탕에 섞임 = 카운터셰이딩", "why": "thus(그래서) → 앞의 등은 밝아지고 배는 어두워지는 결과를 받아 위장 효과로 정리"}]}, {"id": "mock_2211_g2-31", "label": "22년 11월 31번 놀람이 학습을 이끈다", "sents": [{"en": "No learning is possible without an error signal.", "ko": "오류 신호 없이는 어떤 학습도 가능하지 않다."}, {"en": "Organisms only learn when events violate their expectations.", "ko": "유기체는 사건이 자신의 예상을 벗어날 때만 학습한다."}, {"en": "In other words, surprise is one of the fundamental drivers of learning.", "ko": "다시 말해, 놀람은 학습의 근본적인 동력 중 하나이다."}, {"en": "Imagine hearing a series of identical notes, AAAAA.", "ko": "AAAAA처럼 똑같은 음이 연속으로 나오는 것을 듣는다고 상상해 보라."}, {"en": "Each note draws out a response in the auditory areas of your brain — but as the notes repeat, those responses progressively decrease.", "ko": "각각의 음은 뇌의 청각 영역에서 반응을 끌어내지만, 음이 반복되면서 그 반응은 점점 줄어든다."}, {"en": "This is called “adaptation,” a deceptively simple phenomenon that shows that your brain is learning to anticipate the next event.", "ko": "이것은 '적응'이라고 불리는데, 뇌가 다음 일을 예상하는 법을 배우고 있다는 것을 보여 주는, 겉보기엔 단순해 보이는 현상이다."}, {"en": "Suddenly, the note changes: AAAAA#.", "ko": "갑자기 음이 바뀐다: AAAAA#."}, {"en": "Your primary auditory cortex immediately shows a strong surprise reaction: not only does the adaptation fade away, but additional neurons begin to vigorously fire in response to the unexpected sound.", "ko": "일차 청각 피질은 즉시 강한 놀람 반응을 보인다. 적응이 사라질 뿐 아니라, 예상치 못한 소리에 반응해 추가 뉴런들이 힘차게 활동하기 시작한다."}, {"en": "And it is not just repetition that leads to adaptation: what matters is whether the notes are predictable.", "ko": "그리고 적응을 일으키는 것은 단순한 반복만이 아니다. 중요한 것은 음이 예측 가능한지이다."}, {"en": "For instance, if you hear an alternating set of notes, such as ABABA, your brain gets used to this alternation, and the activity in your auditory areas again decreases.", "ko": "예를 들어, ABABA처럼 번갈아 나오는 음을 들으면 뇌는 이 번갈아 나옴에 익숙해지고, 청각 영역의 활동은 다시 줄어든다."}, {"en": "This time, however, it is an unexpected repetition, such as ABABB, that triggers a surprise response.", "ko": "그러나 이번에는 ABABB처럼 예상치 못한 반복이 놀람 반응을 일으킨다."}], "chunks": [[0, 2], [3, 5], [6, 7], [8, 9], [10, 10]], "ex": [{"head": "No learning is possible", "clue": ["No learning", "an error signal"], "core": "오류 신호 없이는 학습도 없음", "why": "글의 출발: 학습에는 오류 신호가 필요"}, {"head": "Organisms only learn when", "clue": ["only learn", "violate their expectations"], "core": "예상이 어긋날 때만 배움", "why": "오류 신호(error signal)를 쉽게 풀어서: 예상이 어긋나는 것"}, {"head": "In other words, surprise", "clue": ["In other words", "surprise"], "core": "즉 놀람이 학습의 핵심 동력", "why": "In other words(다시 말해) → 앞의 '예상이 어긋날 때'를 '놀람'이라는 한 단어로 정리"}, {"head": "Imagine hearing a series", "clue": ["Imagine", "identical notes"], "core": "똑같은 음 AAAAA를 듣는다고 상상", "why": "Imagine(상상해 보라) → 앞의 '놀람이 학습을 이끈다'를 실험 예로 보여 주기 시작"}, {"head": "Each note draws out", "clue": ["Each note", "those responses progressively decrease"], "core": "음마다 뇌가 반응하지만 반복될수록 반응이 줄어듦", "why": "Each note(각각의 음) = 바로 앞 AAAAA의 음 하나하나"}, {"head": "This is called “adaptation,”", "clue": ["This is called", "adaptation"], "core": "반복으로 반응이 줄어드는 것 = 적응(예측을 배우는 중)", "why": "This(이것) = 앞의 '반복되며 반응이 줄어드는 것'에 이름 붙이기"}, {"head": "Suddenly, the note", "clue": ["Suddenly, the note changes"], "core": "갑자기 음이 AAAAA#으로 바뀜", "why": "Suddenly(갑자기) + the note(그 음) = 앞의 AAAAA → 적응이 생긴 뒤에 일어나는 변화"}, {"head": "Your primary auditory cortex", "clue": ["a strong surprise reaction", "the adaptation fade away", "the unexpected sound"], "core": "청각 피질이 강하게 놀라 적응이 사라지고 뉴런이 더 활동", "why": "the unexpected sound(예상치 못한 소리) = 바로 앞 AAAAA#, 적응(adaptation)이 사라짐 → 적응 설명 뒤"}, {"head": "And it is not", "clue": ["not just repetition", "predictable"], "core": "적응의 핵심은 반복이 아니라 예측 가능성", "why": "And it is not just repetition(반복만이 아니다) = 앞의 'AAAAA 반복 → 적응' 예를 넘어 확장"}, {"head": "For instance, if you", "clue": ["For instance", "ABABA", "again decreases"], "core": "예: ABABA처럼 번갈아 나와도 익숙해져 반응 감소", "why": "For instance(예를 들어) → 앞의 '예측 가능하면 적응'의 예, again(다시) = 앞의 AAAAA 때처럼"}, {"head": "This time, however, it", "clue": ["This time, however", "an unexpected repetition", "ABABB"], "core": "이번엔 오히려 예상 밖의 반복 ABABB에 놀람", "why": "This time, however(그러나 이번에는) = 앞의 ABABA 패턴과 달리 + AAAAA# 때와 대비"}], "postit": "오류 신호 없이는 학습 X → 놀람 = 학습의 동력 → AAAAA 반복: 반응 감소 = 적응 → 갑자기 AAAAA#: 강한 놀람 → 반복이 아니라 예측 가능성이 핵심: ABABA는 익숙 → 이번엔 ABABB에 놀람", "cex": [{"core": "학습은 예상이 어긋나는 놀람에서 시작", "why": "글의 출발: No learning ... without an error signal(오류 신호 없이는 학습 없음) → 놀람이 학습 동력"}, {"core": "같은 음 반복 시 뇌 반응 감소 = 적응", "why": "Imagine(상상해 봐라) → 앞의 '놀람이 학습 동력'을 소리 실험 예로 보여 줌"}, {"core": "음이 갑자기 바뀌자 청각 피질의 강한 놀람 반응", "why": "Suddenly(갑자기) + AAAAA# → 앞의 AAAAA 반복 뒤 음이 바뀌는 장면"}, {"core": "적응의 핵심은 예측 가능성, ABABA에도 적응", "why": "And it is not just repetition(반복만이 아님) → 앞의 반복 사례를 '예측 가능성'으로 넓힘"}, {"core": "예상 밖 반복 ABABB가 놀람을 일으킴", "why": "This time, however(하지만 이번엔) → 앞의 ABABA 적응 뒤 예상을 깬 반복을 대비"}]}, {"id": "mock_2211_g2-32", "label": "22년 11월 32번 금융 시장의 감염", "sents": [{"en": "The connectedness of the global economic market makes it vulnerable to potential “infection.”", "ko": "세계 경제 시장의 연결성은 그것을 잠재적인 '감염'에 취약하게 만든다."}, {"en": "A financial failure can make its way from borrowers to banks to insurers, spreading like a flu.", "ko": "금융 실패는 독감처럼 퍼지면서 대출자에서 은행으로, 다시 보험사로 옮겨 갈 수 있다."}, {"en": "However, there are unexpected characteristics when it comes to such infection in the market.", "ko": "그러나 시장에서의 그런 감염에는 예상치 못한 특징들이 있다."}, {"en": "Infection can occur even without any contact.", "ko": "감염은 아무런 접촉 없이도 일어날 수 있다."}, {"en": "A bank might become insolvent even without having any of its investments fail.", "ko": "은행은 투자가 하나도 실패하지 않았는데도 지급 불능이 될 수 있다."}, {"en": "Fear and uncertainty can be damaging to financial markets, just as cascading failures due to bad investments.", "ko": "나쁜 투자로 인한 연쇄적인 실패와 마찬가지로, 두려움과 불확실성도 금융 시장에 해로울 수 있다."}, {"en": "If we all woke up tomorrow and believed that Bank X would be insolvent, then it would become insolvent.", "ko": "만약 우리 모두가 내일 깨어나 X은행이 지급 불능이 될 거라고 믿는다면, 그 은행은 정말로 지급 불능이 될 것이다."}, {"en": "In fact, it would be enough for us to fear that others believed that Bank X was going to fail, or just to fear our collective fear!", "ko": "사실, 다른 사람들이 X은행이 망할 거라고 믿는다는 것을 두려워하거나, 그저 우리의 집단적 두려움을 두려워하기만 해도 충분할 것이다."}, {"en": "We might all even know that Bank X was well-managed with healthy investments, but if we expected others to pull their money out, then we would fear being the last to pull our money out.", "ko": "우리 모두가 X은행이 건전한 투자로 잘 운영된다는 것을 알고 있더라도, 다른 사람들이 돈을 뺄 거라고 예상한다면, 우리는 돈을 마지막으로 빼는 사람이 될까 봐 두려워할 것이다."}, {"en": "Financial distress can be self-fulfilling and is a particularly troublesome aspect of financial markets.", "ko": "금융 위기는 자기실현적일 수 있으며, 이것은 금융 시장의 특히 골치 아픈 면이다."}], "chunks": [[0, 1], [2, 4], [5, 6], [7, 9]], "ex": [{"head": "The connectedness of the", "clue": ["The connectedness", "infection"], "core": "세계 시장은 연결돼 있어 '감염'에 약함", "why": "글의 출발: 연결된 시장은 감염(infection)에 취약"}, {"head": "A financial failure can", "clue": ["A financial failure", "spreading like a flu"], "core": "금융 실패가 독감처럼 대출자→은행→보험사로 퍼짐", "why": "앞의 '감염'을 구체적으로: 독감처럼 차례로 옮겨 감"}, {"head": "However, there are unexpected", "clue": ["However", "unexpected characteristics", "such infection"], "core": "하지만 시장 감염엔 뜻밖의 특징이 있음", "why": "However(그러나) + such infection(그런 감염) = 앞의 독감 같은 전염과 다른 점"}, {"head": "Infection can occur even", "clue": ["even without any contact"], "core": "접촉 없이도 감염이 일어남", "why": "뜻밖의 특징 첫째: 독감과 달리 접촉(contact)이 없어도 됨"}, {"head": "A bank might become", "clue": ["A bank", "even without having any of its investments fail"], "core": "투자 실패 없이도 은행이 파산할 수 있음", "why": "even without(~ 없이도) 반복 → 앞의 '접촉 없이도'를 은행 예로 구체화"}, {"head": "Fear and uncertainty can", "clue": ["Fear and uncertainty", "just as cascading failures"], "core": "두려움과 불확실성도 투자 실패만큼 해로움", "why": "앞의 '투자 실패 없이도 파산'이 어떻게 가능한지 → 원인은 두려움"}, {"head": "If we all woke", "clue": ["Bank X would be insolvent", "it would become insolvent"], "core": "모두가 X은행이 망한다고 믿으면 정말 망함", "why": "앞의 '두려움이 해롭다'의 예 → X은행이 처음 등장"}, {"head": "In fact, it would", "clue": ["In fact", "others believed that Bank X", "our collective fear"], "core": "사실 '남들이 그렇게 믿을까' 두려워만 해도 충분", "why": "In fact(사실) = 앞의 '모두가 믿으면'보다 한 걸음 더, Bank X = 앞에서 처음 나온 X은행"}, {"head": "We might all even", "clue": ["well-managed with healthy investments", "the last to pull our money out"], "core": "건전한 은행이라도 남들이 뺄까 봐 마지막 사람이 될까 두려움", "why": "앞의 '남들 생각을 두려워함'을 실제 행동(돈 인출)으로 보여 줌"}, {"head": "Financial distress can be", "clue": ["self-fulfilling", "a particularly troublesome aspect"], "core": "금융 위기는 두려움이 스스로 현실이 됨(자기실현적)", "why": "self-fulfilling(자기실현적) = 앞의 '믿으면 정말 망함·두려워서 돈을 뺌'을 한 단어로 정리"}], "postit": "연결된 시장 → 실패가 독감처럼 퍼짐 → 하지만 뜻밖의 특징: 접촉·투자 실패 없이도 파산 → 두려움도 해로움, 모두 믿으면 진짜 파산 → 남들이 믿을까 봐 두려워하기만 해도 충분 → 금융 위기는 자기실현적", "cex": [{"core": "연결된 세계 시장은 독감처럼 금융 감염에 취약", "why": "글의 출발: connectedness(연결성) → 금융 실패가 독감처럼 퍼진다는 비유"}, {"core": "시장 감염의 뜻밖 특징: 접촉 없이도 감염", "why": "However(하지만) + such infection(그런 감염) → 앞의 독감 비유와 다른 특징 제시"}, {"core": "두려움·불확실성만으로도 은행이 실제로 망함", "why": "Fear and uncertainty(두려움과 불확실성) → 앞의 '투자 실패 없이도 파산'의 원인 설명"}, {"core": "남들의 두려움을 두려워만 해도 위기 = 자기실현적", "why": "In fact(사실) → 앞의 '모두가 믿으면 망함'에서 더 나아가 두려움만으로 충분함을 강조"}]}, {"id": "mock_2211_g2-33", "label": "22년 11월 33번 음수를 피하는 사람들", "sents": [{"en": "Negative numbers are a lot more abstract than positive numbers — you can’t see negative 4 cookies and you certainly can’t eat them — but you can think about them, and you have to, in all aspects of daily life, from debts to contending with freezing temperatures and parking garages.", "ko": "음수는 양수보다 훨씬 더 추상적이지만(음수 4개의 쿠키는 볼 수도 없고, 당연히 먹을 수도 없다), 우리는 음수를 생각할 수 있고, 빚에서부터 영하의 기온과 주차장을 다루는 일까지 일상생활의 모든 면에서 생각해야만 한다."}, {"en": "Still, many of us haven’t quite made peace with negative numbers.", "ko": "그래도 우리 중 많은 사람은 아직 음수와 완전히 화해하지 못했다."}, {"en": "People have invented all sorts of funny little mental strategies to sidestep the dreaded negative sign.", "ko": "사람들은 그 무서운 마이너스 기호를 피하려고 온갖 재미있는 작은 정신적 전략들을 만들어 냈다."}, {"en": "On mutual fund statements, losses (negative numbers) are printed in red or stuck in parentheses with no negative sign to be found.", "ko": "뮤추얼 펀드 내역서에서 손실(음수)은 빨간색으로 인쇄되거나, 마이너스 기호 하나 없이 괄호 안에 들어가 있다."}, {"en": "The history books tell us that Julius Caesar was born in 100 B.C., not -100.", "ko": "역사책은 율리우스 카이사르가 -100년이 아니라 기원전 100년에 태어났다고 말한다."}, {"en": "The underground levels in a parking garage often have designations like B1 and B2.", "ko": "주차장의 지하층은 흔히 B1, B2 같은 이름을 가지고 있다."}, {"en": "Temperatures are one of the few exceptions: folks do say, especially here in Ithaca, New York, that it’s -5 degrees outside, though even then, many prefer to say 5 below zero.", "ko": "기온은 몇 안 되는 예외 중 하나다. 사람들은, 특히 여기 뉴욕주 Ithaca에서는 바깥 기온이 -5도라고 말하지만, 그때조차 많은 사람은 '영하 5도'라고 말하는 쪽을 더 좋아한다."}, {"en": "There’s something about that negative sign that just looks so unpleasant.", "ko": "그 마이너스 기호에는 그저 너무 불쾌해 보이는 뭔가가 있다."}], "chunks": [[0, 1], [2, 2], [3, 5], [6, 7]], "ex": [{"head": "Negative numbers are a", "clue": ["Negative numbers", "in all aspects of daily life"], "core": "음수는 추상적이지만 일상(빚·영하·주차장)에서 늘 필요", "why": "글의 출발: 음수는 추상적이지만 일상에서 꼭 필요"}, {"head": "Still, many of us", "clue": ["Still", "made peace with negative numbers"], "core": "그래도 많은 사람이 음수를 불편해함", "why": "Still(그래도) = 앞의 '일상에서 늘 써야 함'에도 불구하고"}, {"head": "People have invented all", "clue": ["mental strategies", "the dreaded negative sign"], "core": "마이너스 기호를 피하는 온갖 꼼수를 만듦", "why": "앞의 '음수와 화해 못 함'이 실제 행동으로 → 기호를 피하는 전략"}, {"head": "On mutual fund statements,", "clue": ["On mutual fund statements", "no negative sign to be found"], "core": "예1: 펀드 손실은 빨간 글씨·괄호로(마이너스 X)", "why": "앞의 '피하는 전략'의 첫 예 → 전략 소개 뒤에만 가능"}, {"head": "The history books tell", "clue": ["100 B.C.", "not -100"], "core": "예2: 카이사르는 -100년이 아니라 기원전 100년생", "why": "B.C.(기원전) = -100 대신 쓰는 말 → 마이너스 기호를 피하는 전략의 또 다른 예"}, {"head": "The underground levels in", "clue": ["The underground levels", "B1 and B2"], "core": "예3: 주차장 지하층은 -1층 대신 B1·B2", "why": "전략의 예 계속 → 첫 문장의 parking garages(주차장)를 다시 받음"}, {"head": "Temperatures are one of", "clue": ["Temperatures are one of the few exceptions", "5 below zero"], "core": "기온은 예외지만 그래도 '영하 5도'라고 말하길 선호", "why": "exceptions(예외) = 앞의 '기호를 피하는' 예들과 다른 경우 → 예들이 다 나온 뒤"}, {"head": "There’s something about that", "clue": ["that negative sign", "unpleasant"], "core": "마이너스 기호는 그냥 보기 싫음", "why": "that negative sign(그 마이너스 기호) = 앞의 -5 대신 '영하 5도'를 고르는 이유로 마무리"}], "postit": "음수는 추상적이지만 일상에서 늘 필요 → 그래도 음수와 화해 못 함 → 마이너스 기호 피하는 온갖 전략 → 예: 펀드 손실 빨간 글씨·괄호, 기원전 100년, 지하 B1·B2 → 기온은 예외지만 '영하 5도' 선호 → 마이너스 기호는 그저 불쾌", "cex": [{"core": "음수는 추상적이지만 일상에 필요, 그래도 불편함", "why": "글의 출발: Negative numbers(음수)는 추상적 → Still(그래도) 사람들이 불편해함"}, {"core": "마이너스 기호를 피하려는 온갖 꼼수", "why": "the dreaded negative sign(두려운 마이너스 기호) → 앞의 '음수를 불편해함'이 행동으로 나타남"}, {"core": "펀드 손실·기원전·주차장 B1으로 마이너스 피하기", "why": "On mutual fund statements(펀드 내역서에서) → 앞의 '꼼수'의 구체적 예 나열 시작"}, {"core": "기온은 예외지만 '영하'를 선호, 마이너스는 보기 싫음", "why": "one of the few exceptions(몇 안 되는 예외) → 앞의 예들과 달리 마이너스를 쓰는 기온 사례"}]}, {"id": "mock_2211_g2-34", "label": "22년 11월 34번 교란 변수와 관찰 연구", "sents": [{"en": "Observational studies of humans cannot be properly controlled.", "ko": "사람에 대한 관찰 연구는 제대로 통제될 수 없다."}, {"en": "Humans live different lifestyles and in different environments.", "ko": "사람들은 서로 다른 생활 방식으로, 서로 다른 환경에서 산다."}, {"en": "Thus, they are insufficiently homogeneous to be suitable experimental subjects.", "ko": "따라서 사람들은 적합한 실험 대상이 될 만큼 충분히 동질적이지 않다."}, {"en": "These confounding factors undermine our ability to draw sound causal conclusions from human epidemiological surveys.", "ko": "이런 교란 변수들은 사람 대상 역학 조사에서 타당한 인과적 결론을 끌어내는 우리의 능력을 약화시킨다."}, {"en": "Confounding factors are variables (known or unknown) that make it difficult for epidemiologists to isolate the effects of the specific variable being studied.", "ko": "교란 변수는 역학자가 연구 중인 특정 변수의 효과만 따로 떼어 내기 어렵게 만드는 (알려졌거나 알려지지 않은) 변수다."}, {"en": "For example, Taubes argued that since many people who drink also smoke, researchers have difficulty determining the link between alcohol consumption and cancer.", "ko": "예를 들어 Taubes는 술을 마시는 많은 사람이 담배도 피우기 때문에, 연구자들이 음주와 암의 관계를 밝히기 어렵다고 주장했다."}, {"en": "Similarly, researchers in the famous Framingham study identified a significant correlation between coffee drinking and coronary heart disease.", "ko": "마찬가지로, 유명한 Framingham 연구의 연구자들은 커피 마시기와 관상동맥 심장병 사이에 상당한 상관관계를 발견했다."}, {"en": "However, most of this correlation disappeared once researchers corrected for the fact that many coffee drinkers also smoke.", "ko": "그러나 연구자들이 커피 마시는 많은 사람이 담배도 피운다는 사실을 보정하자, 이 상관관계는 대부분 사라졌다."}, {"en": "If the confounding factors are known, it is often possible to correct for them.", "ko": "교란 변수가 알려져 있으면, 그것을 보정하는 것이 흔히 가능하다."}, {"en": "However, if they are unknown, they will undermine the reliability of the causal conclusions we draw from epidemiological surveys.", "ko": "그러나 교란 변수가 알려져 있지 않으면, 그것은 우리가 역학 조사에서 끌어내는 인과적 결론의 신뢰성을 약화시킬 것이다."}], "chunks": [[0, 2], [3, 4], [5, 5], [6, 8], [9, 9]], "ex": [{"head": "Observational studies of humans", "clue": ["Observational studies of humans", "cannot be properly controlled"], "core": "사람 관찰 연구는 제대로 통제가 안 됨", "why": "글의 출발: 사람 대상 관찰 연구의 한계"}, {"head": "Humans live different lifestyles", "clue": ["different lifestyles", "different environments"], "core": "사람마다 생활 방식·환경이 다 다름", "why": "통제가 안 되는 이유: 사람마다 다름"}, {"head": "Thus, they are insufficiently", "clue": ["Thus", "insufficiently homogeneous"], "core": "그래서 실험 대상으로 쓰기엔 너무 제각각", "why": "Thus(따라서) = 앞의 '다 다르게 산다'의 결과"}, {"head": "These confounding factors undermine", "clue": ["These confounding factors", "sound causal conclusions"], "core": "이런 교란 변수가 인과 결론을 방해함", "why": "These confounding factors(이런 교란 변수) = 앞의 '제각각인 생활 방식·환경'"}, {"head": "Confounding factors are variables", "clue": ["Confounding factors are variables", "isolate the effects"], "core": "교란 변수 = 연구하는 변수 효과만 떼어 보기 어렵게 하는 변수", "why": "앞에서 처음 나온 confounding factors(교란 변수)의 뜻을 정의"}, {"head": "For example, Taubes argued", "clue": ["For example", "many people who drink also smoke"], "core": "예: 술꾼이 담배도 피워서 음주-암 관계를 못 밝힘", "why": "For example(예를 들어) = 앞의 교란 변수 정의에 대한 첫 예"}, {"head": "Similarly, researchers in the", "clue": ["Similarly", "coffee drinking and coronary heart disease"], "core": "마찬가지로 커피와 심장병 사이에 상관관계 발견", "why": "Similarly(마찬가지로) = 앞의 음주 예와 같은 종류의 두 번째 예"}, {"head": "However, most of this", "clue": ["However", "this correlation disappeared", "also smoke"], "core": "흡연을 보정하니 그 상관관계가 대부분 사라짐", "why": "this correlation(이 상관관계) = 바로 앞 커피-심장병 상관관계"}, {"head": "If the confounding factors", "clue": ["If the confounding factors are known", "correct for them"], "core": "교란 변수를 알면 보정할 수 있음", "why": "앞의 '흡연을 보정하니 사라짐'을 일반 원리로: 알면 보정 가능"}, {"head": "However, if they are", "clue": ["However, if they are unknown"], "core": "하지만 모르면 결론의 신뢰성을 해침", "why": "they(그것들) = 앞의 the confounding factors, known(알면) ↔ unknown(모르면) 대조"}], "postit": "사람 관찰 연구는 통제 불가 → 생활·환경이 다양해 동질적이지 않음 → 이것이 교란 변수(정의) → 예: 음주-암에 흡연 → 마찬가지로 커피-심장병, 흡연 보정하니 사라짐 → 알면 보정 가능 ↔ 모르면 결론 신뢰성 해침", "cex": [{"core": "사람은 생활·환경이 달라 관찰 연구 통제 불가", "why": "글의 출발: Observational studies(관찰 연구)는 통제 불가 → 사람마다 다른 생활·환경"}, {"core": "이런 교란 변수가 인과 결론을 방해", "why": "These confounding factors(이런 교란 변수) = 앞의 서로 다른 생활 방식·환경"}, {"core": "예: 음주자의 흡연으로 음주-암 관계 불명확", "why": "For example(예를 들어) → 앞의 교란 변수 정의를 술·담배 사례로 보여 줌"}, {"core": "커피-심장병 상관도 흡연 보정 시 소멸, 알면 보정", "why": "Similarly(마찬가지로) → 앞의 음주-흡연 예에 이어 커피-흡연이라는 같은 구조의 예"}, {"core": "모르는 교란 변수는 결론 신뢰성을 해침", "why": "However(하지만) + if they are unknown(모르면) → 앞의 '알면 보정 가능'과 대비"}]}, {"id": "mock_2211_g2-36", "label": "22년 11월 36번 잊힐 권리와 사생활 권리", "sents": [{"en": "The right to be forgotten is a right distinct from but related to a right to privacy.", "ko": "잊힐 권리는 사생활 권리와 구별되지만 관련이 있는 권리이다."}, {"en": "The right to privacy is, among other things, the right for information traditionally regarded as protected or personal not to be revealed.", "ko": "사생활 권리는 무엇보다도, 전통적으로 보호되어야 하거나 개인적인 것으로 여겨지는 정보가 공개되지 않을 권리이다."}, {"en": "The right to be forgotten, in contrast, can be applied to information that has been in the public domain.", "ko": "반면에 잊힐 권리는 공공 영역에 있었던 정보에도 적용될 수 있다."}, {"en": "The right to be forgotten broadly includes the right of an individual not to be forever defined by information from a specific point in time.", "ko": "잊힐 권리는 넓게 보면, 개인이 특정 시점의 정보에 의해 영원히 규정되지 않을 권리를 포함한다."}, {"en": "One motivation for such a right is to allow individuals to move on with their lives and not be defined by a specific event or period in their lives.", "ko": "그런 권리를 두는 한 가지 이유는 개인이 자기 삶을 계속 이어 가고, 삶의 특정 사건이나 시기로 규정되지 않게 하려는 것이다."}, {"en": "For example, it has long been recognized in some countries, such as the UK and France, that even past criminal convictions should eventually be “spent” and not continue to affect a person’s life.", "ko": "예를 들어 영국과 프랑스 같은 일부 국가에서는 과거의 유죄 판결조차 결국 '소멸'되어 더 이상 한 사람의 삶에 영향을 주지 않아야 한다는 것이 오래전부터 인정되어 왔다."}, {"en": "Despite the reason for supporting the right to be forgotten, the right to be forgotten can sometimes come into conflict with other rights.", "ko": "잊힐 권리를 지지하는 그런 이유에도 불구하고, 잊힐 권리는 때때로 다른 권리들과 충돌할 수 있다."}, {"en": "For example, formal exceptions are sometimes made for security or public health reasons.", "ko": "예를 들어 안보나 공중 보건상의 이유로 공식적인 예외가 만들어지기도 한다."}], "chunks": [[0, 0], [1, 2], [3, 5], [6, 7]], "ex": [{"head": "The right to be", "clue": ["The right to be forgotten", "a right to privacy"], "core": "잊힐 권리는 사생활 권리와 다르지만 관련 있음", "why": "글의 출발: 두 권리(잊힐 권리·사생활 권리) 비교 예고"}, {"head": "The right to privacy", "clue": ["The right to privacy", "not to be revealed"], "core": "사생활 권리 = 개인 정보가 공개되지 않을 권리", "why": "The right to privacy = 첫 문장의 a right to privacy를 the로 다시 받아 먼저 설명"}, {"head": "The right to be", "clue": ["in contrast", "in the public domain"], "core": "반면 잊힐 권리는 이미 공개됐던 정보에도 적용", "why": "in contrast(반면에) = 앞의 '공개되지 않을' 사생활 권리와 대조"}, {"head": "The right to be", "clue": ["broadly includes", "not to be forever defined"], "core": "특정 시점 정보로 영원히 규정되지 않을 권리", "why": "두 권리의 차이를 짚은 뒤 → 잊힐 권리 자체의 내용을 넓게 설명"}, {"head": "One motivation for such", "clue": ["One motivation for such a right", "move on with their lives"], "core": "이유: 과거 한 사건에 묶이지 않고 삶을 이어 가게", "why": "such a right(그런 권리) = 바로 앞 '영원히 규정되지 않을 권리'"}, {"head": "For example, it has", "clue": ["For example", "past criminal convictions", "spent"], "core": "예: 영국·프랑스는 과거 전과도 결국 소멸시킴", "why": "For example(예를 들어) = 앞의 '삶을 이어 가게 하려는 이유'의 실제 예"}, {"head": "Despite the reason for", "clue": ["Despite the reason for supporting", "come into conflict with other rights"], "core": "그래도 잊힐 권리가 다른 권리와 부딪칠 때가 있음", "why": "Despite the reason(그 이유에도 불구하고) = 앞에서 말한 지지 이유(motivation)가 다 나온 뒤"}, {"head": "For example, formal exceptions", "clue": ["For example", "formal exceptions", "security or public health reasons"], "core": "예: 안보·공중보건 이유로 예외를 둠", "why": "For example(예를 들어) = 바로 앞 '다른 권리와 충돌'의 예"}], "postit": "잊힐 권리 ≠ 사생활 권리(관련은 있음) → 사생활 권리: 비공개 정보 보호 ↔ 잊힐 권리: 공개됐던 정보에도 적용 → 특정 시점 정보로 영원히 규정되지 않을 권리 → 이유: 삶을 이어 가게(예: 영국·프랑스 전과 소멸) → 하지만 다른 권리와 충돌(안보·공중보건 예외)", "cex": [{"core": "잊힐 권리는 사생활 권리와 다르지만 관련", "why": "글의 출발: The right to be forgotten(잊힐 권리)과 right to privacy(사생활 권리) 비교 예고"}, {"core": "사생활은 비공개 권리, 잊힐 권리는 공개 정보에도", "why": "The right to privacy(사생활 권리) → 앞에서 비교 예고한 두 권리를 하나씩 정의"}, {"core": "과거 시점 정보에 영원히 묶이지 않을 권리와 그 이유", "why": "The right to be forgotten broadly(잊힐 권리는 넓게) → 앞의 대비 뒤 잊힐 권리 내용 확장"}, {"core": "그래도 다른 권리와 충돌, 안보·공중보건 예외", "why": "Despite the reason(그 이유에도 불구하고) → 앞의 지지 이유를 인정한 뒤 한계 제시"}]}, {"id": "mock_2211_g2-37", "label": "22년 11월 37번 경제학자가 출산율을 설명하는 법", "sents": [{"en": "To an economist who succeeds in figuring out a person’s preference structure — understanding whether the satisfaction gained from consuming one good is greater than that of another — explaining behavior in terms of changes in underlying likes and dislikes is usually highly problematic.", "ko": "한 사람의 선호 구조를 알아내는 데, 즉 한 상품을 소비해서 얻는 만족이 다른 상품보다 큰지를 이해하는 데 성공한 경제학자에게, 행동을 근본적인 좋고 싫음의 변화로 설명하는 것은 대개 매우 문제가 많다."}, {"en": "To argue, for instance, that the baby boom and then the baby bust resulted from an increase and then a decrease in the public’s inherent taste for children, rather than a change in relative prices against a background of stable preferences, places a social scientist in an unsound position.", "ko": "예를 들어, 베이비붐과 그 뒤의 출산 급감이 안정된 선호를 배경으로 한 상대 가격의 변화가 아니라, 아이에 대한 대중의 타고난 취향이 늘었다가 줄었기 때문이라고 주장하는 것은 사회과학자를 불안정한 입장에 놓는다."}, {"en": "In economics, such an argument about birth rates would be equivalent to saying that a rise and fall in mortality could be attributed to an increase in the inherent desire change for death.", "ko": "경제학에서 출산율에 대한 그런 주장은, 사망률이 오르내리는 것이 죽음에 대한 타고난 욕구의 변화(증가) 때문이라고 말하는 것과 같을 것이다."}, {"en": "For an economist, changes in income and prices, rather than changes in tastes, affect birth rates.", "ko": "경제학자에게는 취향의 변화가 아니라 소득과 가격의 변화가 출산율에 영향을 미친다."}, {"en": "When income rises, for example, people want more children (or, as you will see later, more satisfaction derived from children), even if their inherent desire for children stays the same.", "ko": "예를 들어 소득이 오르면, 아이에 대한 타고난 욕구가 그대로여도 사람들은 더 많은 아이(또는 뒤에서 보겠지만, 아이에게서 얻는 더 많은 만족)를 원한다."}], "chunks": [[0, 0], [1, 1], [2, 2], [3, 4]], "ex": [{"head": "To an economist who", "clue": ["changes in underlying likes and dislikes", "highly problematic"], "core": "경제학자에게 행동을 '취향 변화'로 설명하는 건 큰 문제", "why": "글의 출발: 취향(likes and dislikes) 변화로 설명하면 문제"}, {"head": "To argue, for instance,", "clue": ["for instance", "the baby boom and then the baby bust", "inherent taste for children"], "core": "예: 베이비붐·출산 급감을 '아이 취향 변화'로 설명 = 불안정", "why": "for instance(예를 들어) = 앞의 '취향 변화로 설명하면 문제'의 구체적 예"}, {"head": "In economics, such an", "clue": ["such an argument about birth rates", "mortality"], "core": "그 주장 = 사망률을 '죽고 싶은 욕구' 변화로 설명하는 꼴", "why": "such an argument(그런 주장) = 바로 앞 '아이 취향 변화' 주장 → 얼마나 이상한지 비유"}, {"head": "For an economist, changes", "clue": ["For an economist", "changes in income and prices", "rather than changes in tastes"], "core": "출산율은 취향이 아니라 소득·가격이 결정", "why": "취향 설명을 비판한 뒤 → 경제학자의 진짜 답(소득·가격) 제시"}, {"head": "When income rises, for", "clue": ["When income rises, for example", "stays the same"], "core": "예: 소득이 오르면 취향은 그대로여도 아이를 더 원함", "why": "income(소득) = 바로 앞의 '소득과 가격'의 예, for example(예를 들어)"}], "postit": "경제학자: 행동을 취향 변화로 설명하는 건 문제 → 예: 베이비붐·출산 급감을 아이 취향 변화로 설명 = 불안정 → 사망률을 죽음 욕구 변화로 설명하는 것과 같음 → 출산율은 취향이 아니라 소득·가격이 결정 → 예: 소득 오르면 아이를 더 원함", "cex": [{"core": "행동을 취향 변화로 설명하는 건 경제학자에게 문제", "why": "글의 출발: explaining behavior in terms of ... likes and dislikes(취향 변화로 설명) = 큰 문제"}, {"core": "베이비붐·급감을 아이 취향 변화로 보는 건 불안정", "why": "for instance(예를 들어) → 앞의 '취향 변화 설명은 문제'를 출산율 사례로 보여 줌"}, {"core": "그 주장은 사망률을 죽음 욕구로 설명하는 꼴", "why": "such an argument(그런 주장) = 앞의 아이 취향 변화 주장 → 사망률 비유로 비판"}, {"core": "출산율은 취향 아닌 소득·가격이 결정", "why": "For an economist(경제학자에게) → 앞의 잘못된 설명 비판 뒤 올바른 설명(소득·가격) 제시"}]}, {"id": "mock_2211_g2-38", "label": "22년 11월 38번 아이들이 채소를 싫어하는 이유", "sents": [{"en": "In the natural world, if an animal consumes a plant with enough antinutrients to make it feel unwell, it won’t eat that plant again.", "ko": "자연계에서 동물이 몸이 안 좋아질 만큼 항영양소가 많은 식물을 먹으면, 그 동물은 그 식물을 다시는 먹지 않을 것이다."}, {"en": "Intuitively, animals also know to stay away from these plants.", "ko": "직관적으로, 동물들은 이런 식물을 멀리해야 한다는 것도 안다."}, {"en": "Years of evolution and information being passed down created this innate intelligence.", "ko": "오랜 진화와 대대로 전해진 정보가 이 타고난 지능을 만들어 냈다."}, {"en": "This “intuition,” though, is not jus
