: "Besides, the laptop is about", "clue": ["Besides", "the laptop"], "core": "게다가 노트북이 5년 됨", "why": "Besides(게다가) = 앞의 망설임 이유에 하나 더 보탬"}, {"head": "In this case, getting rid of", "clue": ["In this case", "the old one"], "core": "이 경우엔 버리고 새로 사는 게 합리적으로 보임", "why": "In this case(이 경우) = 비싼 수리+5년 된 노트북, the old one = 5년 된 그 노트북"}, {"head": "In reality, however, it may", "clue": ["however", "it"], "core": "하지만 실제로는 최선이 아님", "why": "however(하지만) = 앞의 '새로 사는 게 합리적' 생각을 뒤집음, it = 버리고 새로 사기"}, {"head": "If Liz throws her laptop", "clue": ["throws her laptop in the trash", "e-waste"], "core": "버리면 전자 쓰레기 문제에 기여", "why": "최선이 아닌 이유 = 버리면 e-waste(전자 쓰레기) 문제 → 글의 주제 등장"}], "postit": "노트북 고장 → 수리 망설임(비용·시간) → 게다가 5년 → 새로 사기가 합리적? → 하지만 전자 쓰레기 문제", "cex": [{"core": "Liz의 노트북 낙하 사고, 화면 금·키 고장", "why": "글의 출발: On her way to a study group meeting(스터디 모임 가는 길에) → 사건 발생"}, {"core": "수리 가능하지만 비용·시간 때문에 망설임", "why": "She can have it repaired, but(고칠 수는 있지만) → it(그것) = 고장 난 노트북, 고민 시작"}, {"core": "5년 된 노트북 → 버리고 새로 사기가 합리적으로 보임", "why": "Besides(게다가) = 비용·시간에 이은 망설임 이유 하나 더"}, {"core": "하지만 최선이 아님, 버리면 전자 쓰레기 문제", "why": "In reality, however(하지만 실제로는) → '새로 사기가 합리적'이라는 생각 뒤집기"}]}, {"id": "g2_L4-p2", "label": "4과 ② 전자 쓰레기와 수리가 어려운 이유", "sents": [{"en": "What exactly is e-waste?", "ko": "전자 쓰레기란 정확히 무엇인가?"}, {"en": "The term refers to discarded electronic devices and electrical appliances.", "ko": "이 용어는 버려진 전자 장치와 전기 기기를 가리킨다."}, {"en": "Due to toxic materials contained in these products, such as lead, e-waste is a serious health and environmental hazard.", "ko": "이 제품들에 들어 있는 납 같은 유독성 물질 때문에 전자 쓰레기는 심각한 건강·환경 위험 요소이다."}, {"en": "To make matters worse, the amount of e-waste produced each year is increasing at an alarming rate.", "ko": "설상가상으로 매년 생산되는 전자 쓰레기의 양이 걱정스러운 속도로 늘고 있다."}, {"en": "In 2021, a total of 57.4 million metric tons of e-waste was generated worldwide, which was a 37% increase from 2014, the year when data about e-waste was first collected.", "ko": "2021년 전 세계적으로 총 5,740만 메트릭톤의 전자 쓰레기가 발생했는데, 이는 전자 쓰레기 자료가 처음 수집된 해인 2014년보다 37% 증가한 것이었다."}, {"en": "Experts predict that by 2030, the amount of e-waste generated annually will have doubled in just 16 years.", "ko": "전문가들은 2030년이 되면 매년 발생하는 전자 쓰레기의 양이 불과 16년 만에 두 배가 될 것으로 예측한다."}, {"en": "For this reason, efforts are being made to address this problem, most of which are focused on making products easier to repair.", "ko": "이런 이유로 이 문제를 해결하려는 노력이 이루어지고 있는데, 그 대부분은 제품을 더 수리하기 쉽게 만드는 데 초점을 두고 있다."}, {"en": "Let's take a look at some practical approaches from around the world.", "ko": "전 세계의 몇 가지 현실적인 접근법을 살펴보자."}, {"en": "One reason many people dispose of their damaged devices is that they are too difficult to repair.", "ko": "많은 사람이 고장 난 장치를 버리는 한 가지 이유는 그것들이 수리하기 너무 어렵기 때문이다."}, {"en": "For example, a device may be difficult to disassemble, or its manufacturer may require that it be brought to an official service center to be fixed.", "ko": "예를 들어 어떤 장치는 분해하기 어렵거나, 제조사가 수리하려면 공식 서비스 센터로 가져오라고 요구할 수도 있다."}], "chunks": [[0, 1], [2, 3], [4, 5], [6, 9]], "half": 4, "ex": [{"head": "What exactly is e-waste?", "clue": [], "core": "전자 쓰레기의 정체는?", "why": "글의 출발: 질문으로 e-waste(전자 쓰레기) 정의 시작"}, {"head": "The term refers to", "clue": ["The term"], "core": "버려진 전자 장치·전기 기기", "why": "The term(이 용어) = 바로 앞 질문의 e-waste → 질문에 대한 답"}, {"head": "Due to toxic materials contained", "clue": ["these products", "such as lead"], "core": "납 같은 유독 물질 → 건강·환경 위험", "why": "these products(이 제품들) = 앞의 전자 장치·전기 기기 → 정의 다음 위험성"}, {"head": "To make matters worse, the", "clue": ["To make matters worse"], "core": "설상가상, 양이 무섭게 증가", "why": "To make matters worse(설상가상으로) = 위험하다는 나쁜 점에 더 나쁜 점 추가"}, {"head": "In 2021, a total of", "clue": ["In 2021", "37% increase"], "core": "2021년 5,740만 톤, 2014년보다 37% 증가", "why": "증가한다는 말의 숫자 증거 → In 2021과 37% increase(증가)"}, {"head": "Experts predict that by 2030,", "clue": ["by 2030", "in just 16 years"], "core": "2030년엔 16년 만에 두 배 예상", "why": "시간 흐름 2014·2021 → by 2030(미래), 16년 = 2014~2030"}, {"head": "For this reason, efforts are", "clue": ["For this reason", "this problem"], "core": "그래서 노력 중 → 대부분 수리 쉽게 만들기", "why": "For this reason(이런 이유로) = 앞의 급증 예측 → 그래서 해결 노력"}, {"head": "Let's take a look at", "clue": ["practical approaches"], "core": "세계의 현실적인 해결법 소개 예고", "why": "노력 얘기 다음 → approaches(접근법)를 구체적으로 보자며 다음 글 예고"}, {"head": "One reason many people dispose", "clue": ["One reason", "too difficult to repair"], "core": "버리는 이유 = 수리가 너무 어려움", "why": "Let's take a look(살펴보자) 예고 → 먼저 문제의 뿌리부터: 수리가 너무 어려워 버리는 사람이 많음(앞의 making products easier to repair(수리 쉽게 만들기)가 필요한 이유)"}, {"head": "For example, a device may", "clue": ["For example"], "core": "예: 분해 어려움, 공식 센터만 가능", "why": "For example(예를 들어) = '수리하기 어렵다'의 첫 예시"}], "postit": "전자 쓰레기 정의 → 유독 물질로 위험 → 설상가상 양 급증(2021 37%↑) → 2030 두 배 → 그래서 수리 쉽게 → 세계 해법 → 버리는 이유 = 수리 어려움 → 예: 분해·공식 센터", "cex": [{"core": "전자 쓰레기 = 버려진 전자 장치·전기 기기", "why": "글의 출발: What exactly is e-waste?(전자 쓰레기란 정확히 무엇?) → 앞의 e-waste 정의"}, {"core": "납 등 유독 물질로 위험, 양도 무섭게 증가", "why": "these products(이 제품들) = 전자 장치·기기 → 정의 다음 위험성"}, {"core": "2021년 5,740만 톤, 2030년엔 두 배 예상", "why": "In 2021(2021년에) → '무섭게 증가'의 숫자 증거"}, {"core": "수리 쉽게 하려는 노력, 버리는 이유는 수리 어려움", "why": "For this reason(이런 이유로) = 전자 쓰레기 급증 → 해결 노력"}]}, {"id": "g2_L4-p3", "label": "4과 ③ 수리할 권리 운동과 네 가지 요구", "sents": [{"en": "Many companies do not allow their customers to take their damaged items to third-party repair shops.", "ko": "많은 회사는 고객이 고장 난 물건을 제삼자 수리점에 가져가는 것을 허용하지 않는다."}, {"en": "What is more, some products are intentionally designed to be difficult to repair.", "ko": "게다가 어떤 제품들은 일부러 수리하기 어렵게 설계된다."}, {"en": "It is common for consumers to be unable to acquire the instructions for how to fix their items or the parts needed to complete repairs.", "ko": "소비자들이 물건 고치는 방법에 대한 설명서나 수리에 필요한 부품을 구하지 못하는 것은 흔한 일이다."}, {"en": "The right-to-repair movement is trying to solve these problems by promoting legislation that states the following: If you own a product, you have the right to fix it yourself or bring it to a technician of your choice.", "ko": "수리할 권리 운동은 다음 내용을 담은 법 제정을 추진해 이 문제들을 해결하려 한다: 제품을 소유하고 있다면 직접 고치거나 원하는 기술자에게 가져갈 권리가 있다."}, {"en": "To protect the rights of consumers, the right-to-repair movement demands four things.", "ko": "소비자의 권리를 보호하기 위해 수리할 권리 운동은 네 가지를 요구한다."}, {"en": "First, companies must make information about their products available to everyone.", "ko": "첫째, 회사들은 자기 제품에 대한 정보를 모든 사람이 이용할 수 있게 해야 한다."}, {"en": "Second, third parties, including individuals, should be able to obtain the parts and tools required to make repairs.", "ko": "둘째, 개인을 포함한 제삼자도 수리에 필요한 부품과 도구를 구할 수 있어야 한다."}, {"en": "Third, the practice of preventing consumers from installing custom software on their own devices should be prohibited by law.", "ko": "셋째, 소비자가 자기 기기에 맞춤형 소프트웨어를 설치하지 못하게 막는 관행은 법으로 금지되어야 한다."}, {"en": "Finally, it demands that manufacturers design devices in a way that makes repairs as easy as possible.", "ko": "마지막으로, 이 운동은 제조사들이 수리를 최대한 쉽게 하는 방식으로 기기를 설계할 것을 요구한다."}, {"en": "Advocates of the movement say that if all these goals are accomplished, far less e-waste will be generated.", "ko": "이 운동의 지지자들은 이 모든 목표가 이루어지면 전자 쓰레기가 훨씬 덜 발생할 것이라고 말한다."}, {"en": "Thanks to their efforts, more than 40 states in the U.S. have begun working on right-to-repair legislation.", "ko": "그들의 노력 덕분에 미국의 40개가 넘는 주가 수리할 권리 법 제정 작업을 시작했다."}, {"en": "This movement is gaining a growing influence in Europe as well, with more and more countries joining the cause.", "ko": "이 운동은 점점 더 많은 나라가 그 대의에 동참하면서 유럽에서도 영향력을 키우고 있다."}], "chunks": [[0, 1], [2, 3], [4, 4], [5, 8], [9, 11]], "half": 5, "ex": [{"head": "Many companies do not allow", "clue": ["third-party repair shops"], "core": "제삼자 수리점은 허용 안 함", "why": "글의 출발: 많은 회사가 제삼자(third-party) 수리점 이용을 막음 → 수리가 어려운 현실"}, {"head": "What is more, some products", "clue": ["What is more", "intentionally"], "core": "게다가 일부러 수리 어렵게 설계", "why": "What is more(게다가) = 예시들에 더 심한 경우 추가, intentionally(의도적으로)"}, {"head": "It is common for consumers", "clue": ["the instructions", "the parts"], "core": "설명서·부품도 구하기 힘듦", "why": "수리 어려움 하나 더 → 설명서(instructions)·부품(parts)도 못 구함"}, {"head": "The right-to-repair movement is trying", "clue": ["these problems", "the following"], "core": "수리할 권리 운동 = 내 물건 내가 고칠 권리", "why": "these problems(이 문제들) = 앞에 나온 수리 어려움들 전부 → 그래서 맨 끝 해결책"}, {"head": "To protect the rights of", "clue": ["four things"], "core": "운동의 요구 사항은 네 가지", "why": "the right-to-repair movement = 바로 앞에서 소개한 수리할 권리 운동 → 그 운동의 four things(네 가지) 요구 예고"}, {"head": "First, companies must make information", "clue": ["First"], "core": "1. 제품 정보 공개", "why": "First(첫째) = 네 가지 중 첫 번째"}, {"head": "Second, third parties, including individuals,", "clue": ["Second"], "core": "2. 누구나 부품·도구 구입 가능", "why": "Second(둘째) → First 다음"}, {"head": "Third, the practice of preventing", "clue": ["Third"], "core": "3. 맞춤 소프트웨어 설치 막기 금지", "why": "Third(셋째) → Second 다음"}, {"head": "Finally, it demands that manufacturers", "clue": ["Finally", "it demands"], "core": "4. 수리 쉬운 설계", "why": "Finally(마지막으로) = 네 번째, it = 수리할 권리 운동"}, {"head": "Advocates of the movement say", "clue": ["all these goals"], "core": "목표가 다 이뤄지면 전자 쓰레기 확 줄어듦", "why": "all these goals(이 모든 목표) = 앞의 네 가지 요구 → Finally 다음"}, {"head": "Thanks to their efforts, more", "clue": ["Thanks to their efforts"], "core": "덕분에 미국 40개 이상 주가 법 추진", "why": "their(그들의) = 앞의 Advocates(지지자들) → 지지자 다음"}, {"head": "This movement is gaining a", "clue": ["This movement", "as well"], "core": "유럽에서도 영향력 확대", "why": "as well(~도 역시) = 미국에 이어 유럽까지, This movement = 수리할 권리 운동"}], "postit": "제삼자 수리 금지 → 게다가 일부러 어렵게·설명서/부품 없음 → 수리할 권리 운동 → 네 가지 요구(정보·부품·소프트웨어·설계) → 쓰레기 감소 → 미국 40개 주 → 유럽까지", "cex": [{"core": "제삼자 수리 불허, 일부러 수리 어렵게 설계", "why": "글의 출발: Many companies do not allow(많은 회사가 허용 안 함) → 수리가 어려운 현실"}, {"core": "설명서·부품도 못 구함 → 수리할 권리 운동 등장", "why": "It is common(흔한 일이다) → 수리 불허·어려운 설계에 이은 어려움 하나 더"}, {"core": "수리할 권리 운동의 네 가지 요구 예고", "why": "the right-to-repair movement(수리할 권리 운동) = 바로 앞 운동 → four things(네 가지) 예고"}, {"core": "정보 공개·부품 구입·소프트웨어 자유·수리 쉬운 설계", "why": "First(첫째) → 예고한 four things(네 가지) 요구 나열 시작"}, {"core": "목표 달성 시 쓰레기 감소, 미국·유럽으로 확산", "why": "all these goals(이 모든 목표) = 네 가지 요구 → 달성 시 기대 효과"}]}, {"id": "g2_L4-p4", "label": "4과 ④ 프랑스의 수리 가능성 지수", "sents": [{"en": "In January 2021, the French government passed a bill that requires that every manufacturer include a “repairability index” on five categories of electronic devices and electrical appliances: smartphones, laptops, washing machines, televisions, and lawn mowers.", "ko": "2021년 1월 프랑스 정부는 모든 제조사가 스마트폰, 노트북, 세탁기, 텔레비전, 잔디 깎는 기계의 다섯 가지 전자·전기 제품에 '수리 가능성 지수'를 표시하도록 하는 법안을 통과시켰다."}, {"en": "Using a score ranging from 0 to 10, as well as a color-coded system, the index lets consumers see how easily the product can be repaired before they purchase it.", "ko": "이 지수는 0에서 10까지의 점수와 색깔 표시 체계를 사용해 소비자가 제품을 사기 전에 얼마나 쉽게 수리할 수 있는지 알 수 있게 해 준다."}, {"en": "The index takes into account several elements, including the availability of repair information, the ease of disassembly, and the price of spare parts.", "ko": "이 지수는 수리 정보를 구할 수 있는지, 분해가 쉬운지, 여분 부품 가격 등 여러 요소를 고려한다."}, {"en": "A low number on a bright red label means that repairing the product will be difficult, whereas a high number on a green label indicates that the product is easy to repair.", "ko": "밝은 빨간색 라벨의 낮은 숫자는 수리가 어렵다는 뜻이고, 초록색 라벨의 높은 숫자는 수리가 쉽다는 뜻이다."}, {"en": "The index was designed to have two positive effects.", "ko": "이 지수는 두 가지 긍정적인 효과를 내도록 만들어졌다."}, {"en": "Firstly, it allows consumers to make informed decisions when purchasing new devices and appliances.", "ko": "첫째, 이 지수는 소비자가 새 기기를 살 때 정보에 근거한 결정을 내릴 수 있게 해 준다."}, {"en": "Secondly, it encourages manufacturers to make their products easier to repair.", "ko": "둘째, 이 지수는 제조사가 제품을 더 수리하기 쉽게 만들도록 장려한다."}, {"en": "As a result, with fewer electronic and electrical items ending up in its landfills, France can expect to make a transition to a more sustainable society in the near future.", "ko": "그 결과 쓰레기 매립지로 가는 전자·전기 제품이 줄어들면서 프랑스는 가까운 미래에 더 지속 가능한 사회로 바뀔 것을 기대할 수 있다."}, {"en": "The impact of the index, however, is likely to spread far beyond France.", "ko": "하지만 이 지수의 영향은 프랑스를 훨씬 넘어 퍼질 가능성이 높다."}, {"en": "We live in a global economy, and any company that wants to sell its appliances on the French market will need to label its products according to the repairability index.", "ko": "우리는 세계 경제 속에 살고 있어서, 프랑스 시장에서 기기를 팔고 싶은 회사라면 어디든 수리 가능성 지수에 따라 제품에 라벨을 붙여야 할 것이다."}, {"en": "If the index is successful, we can anticipate seeing more countries around the world following France’s innovative lead.", "ko": "이 지수가 성공한다면, 전 세계의 더 많은 나라가 프랑스의 혁신적인 선례를 따르는 것을 기대할 수 있다."}], "chunks": [[0, 0], [1, 3], [4, 7], [8, 10]], "half": 4, "ex": [{"head": "In January 2021, the French", "clue": ["“repairability index”"], "core": "프랑스, 5개 제품에 수리 가능성 지수 의무화", "why": "글의 출발: 2021년 프랑스 법안 → 수리 가능성 지수 첫 등장"}, {"head": "Using a score ranging from", "clue": ["the index", "a score", "color-coded system"], "core": "0~10 점수+색깔로 수리 쉬운 정도를 미리 확인", "why": "the index(그 지수) = 앞의 수리 가능성 지수 → 무엇을 보여 주는지 먼저"}, {"head": "The index takes into account", "clue": ["several elements"], "core": "고려 요소: 수리 정보·분해 용이성·부품 가격", "why": "점수가 나온 다음 → 그 점수를 무엇으로 매기는지(elements, 요소)"}, {"head": "A low number on a", "clue": ["A low number", "red label", "green label"], "core": "빨강+낮은 숫자 = 어려움, 초록+높은 숫자 = 쉬움", "why": "number(숫자)·label(색 라벨) = 앞의 score와 color-coded system 읽는 법 → 마무리"}, {"head": "The index was designed to", "clue": ["two positive effects"], "core": "지수의 목적 = 두 가지 좋은 효과", "why": "The index(그 지수) = 앞에서 설명한 수리 가능성 지수 → 생김새·읽는 법 다음에 그 효과"}, {"head": "Firstly, it allows consumers to", "clue": ["Firstly"], "core": "효과 1: 소비자의 똑똑한 구매", "why": "Firstly(첫째) = 두 효과 중 첫 번째, it = 그 지수"}, {"head": "Secondly, it encourages manufacturers to", "clue": ["Secondly"], "core": "효과 2: 제조사가 수리 쉬운 제품 생산", "why": "Secondly(둘째) → Firstly 다음"}, {"head": "As a result, with fewer", "clue": ["As a result", "France"], "core": "결과: 매립 쓰레기 감소 → 프랑스가 지속 가능한 사회로", "why": "As a result(그 결과) = 두 효과가 낳는 결과 → Secondly 다음"}, {"head": "The impact of the index,", "clue": ["however", "far beyond France"], "core": "하지만 영향은 프랑스 밖으로 확산", "why": "however(하지만) = 앞의 프랑스 안 이야기 → 프랑스 밖으로 범위 전환"}, {"head": "We live in a global", "clue": ["global economy", "the French market"], "core": "세계 경제 → 프랑스에서 팔려면 누구나 라벨 부착", "why": "프랑스 밖으로 퍼지는 이유 = global economy(세계 경제)"}, {"head": "If the index is successful,", "clue": ["If the index is successful", "France’s innovative lead"], "core": "성공하면 다른 나라들도 프랑스를 따라 함", "why": "마무리 전망 → 퍼짐의 끝은 다른 나라들의 따라 하기, lead(선례)"}], "postit": "프랑스 지수 법 → 0~10 점수+색 → 고려 요소 → 빨강 낮음/초록 높음 → 두 효과(소비자·제조사) → 결과: 지속 가능 사회 → 하지만 해외로 확산 → 다른 나라도 따라 할 것", "cex": [{"core": "2021년 프랑스, 5개 품목 수리 가능성 지수 의무화", "why": "글의 출발: In January 2021(2021년 1월) → 프랑스 법안과 repairability index(수리 가능성 지수)"}, {"core": "0~10 점수·색으로 수리 난이도 표시, 평가 요소", "why": "the index(그 지수) = 수리 가능성 지수 → 무엇을 어떻게 보여 주는지"}, {"core": "현명한 구매·수리 쉬운 제품 → 지속 가능 사회", "why": "The index ~ two positive effects(두 가지 좋은 효과) → 지수 소개 다음 기대 효과"}, {"core": "세계 경제 속 영향 확산, 다른 나라도 따를 전망", "why": "however(하지만) → 프랑스 안 이야기에서 far beyond France(프랑스 밖)로 범위 전환"}]}, {"id": "g2_L4-p5", "label": "4과 ⑤ 수리 카페의 시작과 확산", "sents": [{"en": "When consumers are given the right tools and materials, along with some helpful advice, they can repair much of the damage that occurs to electronic products by themselves.", "ko": "소비자에게 알맞은 도구와 재료, 그리고 유용한 조언이 주어지면 그들은 전자 제품에 생기는 손상의 상당 부분을 스스로 고칠 수 있다."}, {"en": "That is why Repair Cafés were started.", "ko": "그래서 수리 카페가 시작되었다."}, {"en": "They are free meeting places where people can gather together and fix their broken devices.", "ko": "수리 카페는 사람들이 함께 모여 고장 난 기기를 고칠 수 있는 무료 모임 장소이다."}, {"en": "The cafés are staffed by volunteer experts who can give technical advice and teach people how to fix things.", "ko": "이 카페에는 기술적 조언을 해 주고 물건 고치는 법을 가르쳐 줄 수 있는 자원봉사 전문가들이 있다."}, {"en": "The first Repair Café was opened in the Netherlands in the city of Amsterdam in 2009.", "ko": "최초의 수리 카페는 2009년 네덜란드 암스테르담에서 문을 열었다."}, {"en": "It was such a success that the idea soon spread to neighboring countries.", "ko": "그것은 크게 성공해서 그 아이디어가 곧 이웃 나라들로 퍼졌다."}, {"en": "Before long, there were Repair Cafés in over 30 countries around the world.", "ko": "얼마 지나지 않아 전 세계 30개가 넘는 나라에 수리 카페가 생겼다."}, {"en": "Along with preventing damaged items from becoming e-waste, these cafés also encourage people to share their invaluable skills and knowledge about the repair and maintenance of electronics.", "ko": "이 카페들은 고장 난 물건이 전자 쓰레기가 되는 것을 막을 뿐 아니라, 사람들이 전자 제품 수리와 관리에 대한 소중한 기술과 지식을 나누도록 장려한다."}, {"en": "They continue to grow in popularity, with more and more people signing up to volunteer.", "ko": "자원봉사를 신청하는 사람이 점점 늘면서 이 카페들은 계속 인기를 얻고 있다."}, {"en": "By providing spaces where people can learn, Repair Cafés enable individuals to maintain their devices and extend their life spans.", "ko": "사람들이 배울 수 있는 공간을 제공함으로써 수리 카페는 개인이 자기 기기를 관리하고 수명을 늘릴 수 있게 한다."}, {"en": "Furthermore, they foster a sustainable perspective that can have a huge positive impact on our future.", "ko": "게다가 수리 카페는 우리의 미래에 엄청난 긍정적 영향을 줄 수 있는 지속 가능한 관점을 키워 준다."}], "chunks": [[0, 1], [2, 4], [5, 6], [7, 10]], "half": 5, "ex": [{"head": "When consumers are given the", "clue": ["by themselves"], "core": "도구·재료·조언만 있으면 스스로 수리 가능", "why": "글의 출발: 소비자도 도움만 있으면 직접 고칠 수 있음"}, {"head": "That is why Repair Cafés", "clue": ["That is why"], "core": "그래서 생긴 것 = 수리 카페", "why": "That is why(그래서 ~이다) = 앞 문장(도움만 있으면 스스로 수리)이 이유"}, {"head": "They are free meeting places", "clue": ["They"], "core": "수리 카페 = 함께 모여 고치는 무료 장소", "why": "They(그것들) = 바로 앞의 Repair Cafés → 카페가 뭔지 설명"}, {"head": "The cafés are staffed by", "clue": ["The cafés", "volunteer experts"], "core": "자원봉사 전문가가 조언·수리법 지도", "why": "The cafés(그 카페들) = 앞의 수리 카페, 첫 문장의 조언(advice)을 누가 주는지"}, {"head": "The first Repair Café was", "clue": ["The first Repair Café", "in 2009"], "core": "최초 수리 카페: 2009년 암스테르담", "why": "The first Repair Café(최초의 수리 카페) = 앞에서 소개한 수리 카페가 처음 생긴 때 → 소개 다음 역사"}, {"head": "It was such a success", "clue": ["It", "such a success", "neighboring countries"], "core": "대성공 → 이웃 나라로 확산", "why": "It(그것) = 첫 수리 카페, such ~ that(너무 ~해서)"}, {"head": "Before long, there were Repair", "clue": ["Before long", "over 30 countries"], "core": "곧 30개국 이상으로", "why": "Before long(머지않아) = 시간 흐름, 이웃 나라 → 전 세계로 더 넓어짐"}, {"head": "Along with preventing damaged items", "clue": ["these cafés", "also"], "core": "쓰레기 예방 + 수리 지식 나눔", "why": "these cafés(이 카페들) = 앞의 전 세계 수리 카페 → 확산 얘기 다음 좋은 점"}, {"head": "They continue to grow in", "clue": ["They", "volunteer"], "core": "자원봉사 신청 늘며 인기 상승", "why": "They = these cafés, 지식 나눔 → 나누려는 자원봉사자 증가로 연결"}, {"head": "By providing spaces where people", "clue": ["spaces where people can learn"], "core": "배움의 공간 → 기기 관리·수명 연장", "why": "앞의 지식 나눔·자원봉사 → 그래서 배우는 공간이 됨"}, {"head": "Furthermore, they foster a sustainable", "clue": ["Furthermore"], "core": "게다가 지속 가능한 관점 → 미래에 큰 영향", "why": "Furthermore(게다가) = 수명 연장에 더 큰 의미 추가 → 마무리"}], "postit": "도움만 있으면 스스로 수리 → 그래서 수리 카페 → 무료 장소·자원봉사 전문가 → 2009 암스테르담 → 이웃 나라·30개국 → 쓰레기 예방+지식 나눔·인기 → 수명 연장 → 지속 가능한 관점", "cex": [{"core": "도움만 있으면 스스로 수리 가능 → 수리 카페 탄생", "why": "글의 출발: When consumers are given(소비자에게 주어지면) → 스스로 수리할 수 있다는 가능성"}, {"core": "자원봉사자가 돕는 무료 수리 장소, 2009년 시작", "why": "They(그것들) = Repair Cafés(수리 카페) → 카페가 어떤 곳인지 소개"}, {"core": "대성공으로 이웃 나라, 곧 30개국 이상 확산", "why": "It(그것) = 첫 수리 카페, such ~ that(너무 ~해서) → 성공과 확산"}, {"core": "쓰레기 예방·지식 나눔·수명 연장, 지속 가능 관점", "why": "these cafés(이 카페들) = 전 세계로 퍼진 수리 카페 → 확산 다음 좋은 점"}]}, {"id": "g2_L4-p6", "label": "4과 ⑥ 수리가 일상인 세상 상상하기", "sents": [{"en": "Do you remember Liz, the girl who dropped her laptop?", "ko": "노트북을 떨어뜨린 소녀 Liz를 기억하는가?"}, {"en": "Imagine she lived in a world where repairing damaged devices and appliances was simply part of everyday life.", "ko": "그녀가 손상된 기기를 수리하는 것이 그저 일상의 일부인 세상에 살고 있다고 상상해 보라."}, {"en": "If that were the case, her options wouldn’t be limited to paying for expensive repairs or throwing away her laptop and buying a new one.", "ko": "만약 그렇다면 그녀의 선택지는 비싼 수리비를 내거나 노트북을 버리고 새것을 사는 것으로 제한되지 않을 것이다."}, {"en": "She would be able to order the necessary parts online and replace them herself.", "ko": "그녀는 필요한 부품을 온라인으로 주문해 직접 교체할 수 있을 것이다."}, {"en": "Alternatively, she could bring her damaged device to the nearest Repair Café to get advice on how to fix it.", "ko": "아니면 고치는 방법에 대한 조언을 얻으러 가장 가까운 수리 카페에 고장 난 기기를 가져갈 수도 있을 것이다."}, {"en": "Repairing it probably wouldn’t be very hard, and she likely would have purchased a laptop with a high repairability score.", "ko": "노트북을 수리하는 것은 아마 그리 어렵지 않을 것이고, 그녀는 아마 수리 가능성 점수가 높은 노트북을 샀을 것이다."}, {"en": "In fact, this sustainable world is a future we can all enjoy if we work toward it together.", "ko": "사실 이 지속 가능한 세상은 우리가 함께 노력하면 모두가 누릴 수 있는 미래이다."}, {"en": "Even more importantly, it is a future in which people will generate far less e-waste, making our planet a cleaner, healthier place for everyone.", "ko": "더 중요한 것은 그것이 사람들이 전자 쓰레기를 훨씬 덜 만들어 지구를 모두에게 더 깨끗하고 건강한 곳으로 만드는 미래라는 점이다."}], "chunks": [[0, 1], [2, 3], [4, 5], [6, 7]], "half": 4, "ex": [{"head": "Do you remember Liz, the", "clue": ["Liz", "dropped her laptop"], "core": "노트북 떨어뜨린 Liz 다시 소환", "why": "글의 출발: 맨 처음 Liz 이야기로 되돌아감"}, {"head": "Imagine she lived in a", "clue": ["Imagine", "a world"], "core": "수리가 일상인 세상을 상상", "why": "she = Liz → Liz를 상상 속 세상에 넣어 봄"}, {"head": "If that were the case, her", "clue": ["If that were the case"], "core": "그 세상이라면 선택지가 둘뿐이 아님", "why": "that(그것) = 앞의 수리가 일상인 세상, 가정법(~라면)"}, {"head": "She would be able to", "clue": ["would", "herself"], "core": "선택지 1: 부품 주문해 직접 교체", "why": "제한되지 않는다 → 새 선택지 첫 번째, would(가정법 이어짐)"}, {"head": "Alternatively, she could bring her", "clue": ["Alternatively", "Repair Café"], "core": "선택지 2: 가까운 수리 카페로", "why": "Alternatively(그 대신, 아니면) = 앞의 직접 교체와 다른 선택지"}, {"head": "Repairing it probably wouldn’t be", "clue": ["Repairing i
