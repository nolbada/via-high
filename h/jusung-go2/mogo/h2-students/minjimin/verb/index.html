<script>
(function(){var hp=(location.hash||'').replace('#','').split('/'),id=hp[0];window.VMODE=hp[1]||'';

if(!/^[A-Za-z0-9_-]+$/.test(id)){box.textContent='지문을 먼저 골라 주세요.';return}
document.write('<script src="'+MOGO.src('verb',id)+'"><\/script>');
document.write('<script>(function(){var id="'+id+'",box=document.getElementById("app")||document.body;if(window.VERBDATA&&VERBDATA[id]){window.VID=id;var a=document.createElement("script");a.src="../../../h2/verb/app.js";document.body.appendChild(a)}else{box.textContent="로그인이 필요해요. 첫 화면(진도표)에서 이름과 번호를 입력해요."}})()<\/script>');})();
</script>
