<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#1e2a44"><title>주요 문장 15 정답지</title>
<link rel="stylesheet" href="key15.css?v=261021">
<style>:root{--pri:#1d4ed8;--priL:#e8efff}@media(prefers-color-scheme:dark){:root{--pri:#8ab4ff;--priL:#16203a}}
.pt{margin-top:10px;padding:9px 12px;background:var(--hi);color:var(--hiInk);border-radius:10px;font-size:15px}.pt b{margin-right:6px}
.row .e{font-size:18px}
.bg{display:inline-block;font-size:34px;font-weight:900;color:var(--pri);line-height:1.1}.ans{margin-top:12px;padding:10px 12px;border-left:4px solid var(--pri);background:var(--priL);border-radius:8px}.ans>b{display:block;margin-bottom:4px;font-size:15px;color:var(--pri)}
</style></head><body><div class="wrap">
<div class="top"><h1>주요 문장 15 정답지</h1></div>
<div class="seg" id="mseg"><button data-m="A">직역 말하기</button><button data-m="B">자연스러운 해석 말하기</button></div>
<div class="seg" id="rseg"><button data-r="1-7">1-7번</button><button data-r="8-15">8-15번</button><button data-r="all">전체</button></div>
<div class="grid" id="gr"></div>
<div id="list"></div>
<div class="foot">비타민 영어클리닉 · 선생님용</div></div>
<script src="key15-data.js?v=261022"></script>
<script>
function E(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function qlist(s){
  var q=[];
  (K15PR[s.no]||[]).forEach(function(p){q.push(['‘'+p[0]+'’ 는 무엇을 가리키나요?',p[1]])});
  s.gram.forEach(function(g,gi){
    var w=((K15HL[s.no]||[])[gi]||[]).map(function(x){return x.split(':')[1]});
    q.push(['「'+g.t+'」 문장에서 해당하는 부분을 짚고, 왜 그런 형태인지 말해 보세요.',(w.length?'짚을 곳 : '+w.join(', ')+' / ':'')+g.l.join(' ')]);
  });
  return q}
function qbox(s){
  return '<div class="pt"><b>선생님 질문</b>'+qlist(s).map(function(x,i){return '<div style="margin-top:8px"><b>Q'+(i+1)+'.</b> '+E(x[0])+'<div style="color:var(--sub)">답 : '+E(x[1])+'</div></div>'}).join('')+'</div>'}
var MODE='B',RG='all',NO=0;
function render(){
  document.querySelectorAll('#mseg button').forEach(function(b){b.classList.toggle('on',b.dataset.m===MODE)});
  document.querySelectorAll('#rseg button').forEach(function(b){b.classList.toggle('on',b.dataset.r===RG)});
  var pool=K15.filter(function(s){return RG==='1-7'?s.no<=7:RG==='8-15'?s.no>=8:true});
  if(NO&&pool.every(function(s){return s.no!==NO}))NO=0;
  document.getElementById('gr').innerHTML=pool.map(function(s){return '<button class="gn'+(NO===s.no?' on':'')+'" data-n="'+s.no+'">'+s.no+'</button>'}).join('');
  var s=K15[NO-1],h='';
  if(s){
    h='<div class="card"><span class="bg">'+s.no+'번</span>';
    if(MODE==='A')h+=s.ch.map(function(c){return '<div class="row"><div class="e" style="color:var(--pri);font-weight:700">'+E(c.e)+'</div><div class="k" style="color:var(--ink);font-size:19px;font-weight:600">'+E(c.k)+'</div></div>'}).join('');
    else h+='<div class="e" style="font-size:18px;color:var(--pri);font-weight:700;margin-top:10px">'+E(s.en)+'</div><div class="big" style="margin-top:6px">'+E(s.nat)+'</div>';
    if(K15PR[s.no])h+='<div style="margin-top:12px;font-size:17px;font-weight:700">대명사 : '+K15PR[s.no].map(function(p){return E(p[0])}).join(', ')+' 는 무엇을 가리키나요?</div>';
    h+='<div style="height:2px"></div>'+qbox(s)+'<div class="pt"><b>채점 포인트</b>'+E(s.pt)+'</div></div>';
  }
  document.getElementById('list').innerHTML=h;
}
document.addEventListener('click',function(ev){
  var t=ev.target,g=t.closest('.gn');if(g){NO=+g.dataset.n;render();return}
  var m=t.closest('#mseg button');if(m){MODE=m.dataset.m;render();return}
  var r=t.closest('#rseg button');if(r){RG=r.dataset.r;render()}
});
render();
</script></body></html>
