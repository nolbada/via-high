<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e98a00"><title>교과서 3과 문법 분석</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#17202e;--sub:#5b677a;--line:#d9e0ec;--pri:#1d4ed8;--off:#e9eef8;--note:#fffbe6;--noteL:#d9c76a;--noteT:#8a6d00;--noteLn:#efe6b3;
 --gd:#15803d;--gl:#c6efcf;--bd:#1d4ed8;--bl:#cfe0fb;--kd:#be185d;--kl:#fbcfe3;--od:#c2570c;--ol:#ffe0b8}

 --gd:#4ade80;--gl:#16361f;--bd:#8ab4ff;--bl:#1a2a4a;--kd:#f472b6;--kl:#401a30;--od:#fb923c;--ol:#43270f}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.55;font-size:16px}

.c-g{--d:var(--gd);--l:var(--gl)}.c-b{--d:var(--bd);--l:var(--bl)}.c-k{--d:var(--kd);--l:var(--kl)}.c-o{--d:var(--od);--l:var(--ol)}

<script>
var D={"secs": [{"no": 1, "id": "z1", "sents": [{"n": 1, "mk": "We [1|make many personal choices] in our lives, [2|from] [3|who to have lunch with] [2|to] [3|what career to pursue].", "en": "We make many personal choices in our lives, from who to have lunch with to what career to pursue.", "ko": "우리는 누구와 점심을 먹을 것인지부터 어떠한 직업을 추구할 것인지까지 우리의 삶에서 많은 개인적인 선택을 한다."}, {"n": 2, "mk": "However, [4|there are many situations] [5|where we must make decisions] as a group.", "en": "However, there are many situations where we must make decisions as a group.", "ko": "하지만, 우리가 집단으로서 결정을 내려야 하는 상황들이 많이 있다."}, {"n": 3, "mk": "Group decision-making is [6|not as simple as] our personal choices, [7|as] [14|it] [13|involves] numerous voices with [8|differing] opinions.", "en": "Group decision-making is not as simple as our personal choices, as it involves numerous voices with differing opinions.", "ko": "집단 의사 결정은 다른 의견을 가진 수많은 목소리를 수반하기 때문에 우리의 개인적인 선택들만큼 간단하지 않다."}, {"n": 4, "mk": "Voting is often [9|used to] [10|make group decisions fairer and more efficient], and various voting methods [11|have been developed] over time.", "en": "Voting is often used to make group decisions fairer and more efficient, and various voting methods have been developed over time.", "ko": "투표는 흔히 집단 의사 결정을 더 공정하고 더 효율적으로 만들기 위해 사용되며, 시간이 흐르면서 다양한 투표 방법이 개발되어 왔다."}, {"n": 5, "mk": "The [8|following] story illustrates [12|how these different voting methods work].", "en": "The following story illustrates how these different voting methods work.", "ko": "다음 이야기는 이러한 다양한 투표 방법이 어떻게 적용되는지 보여준다."}], "items": [{"t": "make a(n) ~ choice : ~한 선택을 하다", "c": "g", "x": "We make many personal choices에서 make a choice는 ‘선택하다’라는 뜻의 표현이다. 가운데에 형용사를 넣어 ‘어떤 종류의 선택인지’를 나타낸다. 여기서는 personal(개인적인)이 들어가 ‘개인적인 선택을 하다’가 된다. 과거형 made, 복수형 choices로도 자주 쓴다.", "n": ["make a(n) ~ choice = ~한 선택을 하다", "personal a. 개인의, 개인적인"], "q": "make many personal choices는 무슨 뜻인가?", "a": "개인적인 선택을 많이 하다", "p": "make many personal choices"}, {"t": "from A to B : A부터 B까지", "c": "g", "x": "from A to B는 범위의 처음과 끝을 말하는 표현이다. 이 문장에서는 from who to have lunch with(누구와 점심을 먹을지)에서 to what career to pursue(어떤 직업을 추구할지)까지라는 뜻으로 쓰였다. A와 B 자리에 의문사 + to부정사가 한 덩어리씩 들어간 점을 주의해서 본다.", "n": ["from A to B = A부터 B까지"], "q": "from A to B는 어떤 뜻인가?", "a": "A부터 B까지", "p": "from"}, {"t": "의문사 + to부정사 : ~할지", "c": "b", "x": "who to have lunch with와 what career to pursue는 ‘의문사 + to부정사’ 구조이다. 각각 ‘누구와 점심을 먹을지’, ‘어떤 직업을 추구할지’라는 뜻의 명사구 역할을 한다. who to have lunch with는 with whom we should have lunch로 풀어 쓸 수 있다. 전치사 with가 뒤에 남아 있는 점도 눈여겨본다.", "n": ["의문사 + to부정사 = ~할지 (명사구)", "who to have lunch with = with whom we should have lunch"], "q": "what career to pursue는 무슨 뜻인가?", "a": "어떤 직업을 추구할지", "p": "who to have lunch with"}, {"t": "There are + 복수명사 : 유도부사 구문과 수일치", "c": "b", "x": "there are many situations는 ‘~이 있다’를 뜻하는 유도부사 there 구문이다. 이 구문에서 there는 해석하지 않고, 동사의 수는 뒤에 오는 진짜 주어에 맞춘다. 주어가 복수인 many situations이므로 동사도 복수형 are를 썼다.", "n": ["There + be동사 + 주어 = ~이 있다", "be동사의 수는 뒤의 주어에 일치"], "q": "there are many situations에서 are가 복수인 까닭은?", "a": "진짜 주어인 many situations가 복수이기 때문", "p": "there are many situations"}, {"t": "관계부사 where : (장소·상황) ~하는", "c": "k", "x": "where we must make decisions as a group은 앞의 situations를 꾸미는 관계부사절이다. where는 in which와 같은 뜻으로, 상황 같은 추상적인 말 뒤에도 쓸 수 있다. where 뒤에는 we must make decisions처럼 완전한 문장이 온다. ‘우리가 집단으로 결정해야 하는 상황’이라고 해석한다.", "n": ["선행사(situation) + where + 완전한 절 = ~하는 (상황)", "where = in which"], "q": "situations where we must make decisions에서 where 뒤에는 어떤 모양이 오는가?", "a": "주어와 동사를 갖춘 완전한 절", "p": "where we must make decisions"}, {"t": "동등 비교 : as + 원급 + as ~", "c": "k", "x": "as simple as는 ‘~만큼 간단한’이라는 동등 비교이다. 앞에 not이 붙은 not as simple as는 ‘~만큼 간단하지 않다’라는 뜻이 된다. 이 문장에서는 집단 의사 결정이 개인적인 선택만큼 간단하지 않다고 말한다. 두 as 사이에는 형용사나 부사의 원급을 쓴다.", "n": ["as + 원급 + as ~ = ~만큼 …한/하게", "not as + 원급 + as ~ = ~만큼 …하지 않은"], "q": "not as simple as our personal choices를 해석하면?", "a": "우리의 개인적인 선택만큼 간단하지 않은", "p": "not as simple as"}, {"t": "접속사 as : ~하기 때문에", "c": "b", "x": "as it involves numerous voices에서 as는 이유를 나타내는 접속사로 ‘~하기 때문에’라는 뜻이다. 뒤에 it involves처럼 주어와 동사가 이어진다. 앞의 as simple as의 as와 모양은 같지만 역할이 다르다는 점에 주의한다. 여기서는 집단 의사 결정이 간단하지 않은 이유를 설명한다.", "n": ["as + 주어 + 동사 = ~하기 때문에 (이유)"], "q": "as it involves numerous voices의 as는 어떤 뜻인가?", "a": "~하기 때문에 (이유의 접속사)", "p": "as"}, {"t": "분사형 형용사 : differing, following", "c": "b", "x": "differing opinions의 differing은 differ(다르다)에서 나온 현재분사로, ‘다른’이라는 뜻의 형용사처럼 쓰였다. differ는 스스로 달라지는 자동사라서 능동 의미의 -ing를 쓴다. 마찬가지로 the following story의 following은 ‘다음에 나오는’이라는 뜻이다. 둘 다 명사 앞에서 그 명사를 꾸민다.", "n": ["differing = 다른 (능동)", "the following + 명사 = 다음에 나오는 ~"], "q": "the following story에서 following은 무슨 뜻인가?", "a": "다음에 나오는", "p": "differing opinions"}, {"t": "be used to + 동사원형 : ~하기 위해 사용되다", "c": "k", "x": "Voting is often used to make ...에서 used to는 ‘~하기 위해 사용되다’라는 수동태 구문이다. 여기서 to make는 목적을 나타내는 to부정사이다. used to + 동사원형(~하곤 했다), be used to + 명사/동명사(~에 익숙하다)와 모양이 비슷해서 헷갈리기 쉽다. 이 문장은 ‘투표는 집단 의사 결정을 만들기 위해 사용된다’는 뜻이다.", "n": ["be used + to부정사 = ~하기 위해 사용되다", "be used to + (동)명사 = ~에 익숙하다"], "q": "is often used to make를 해석하면?", "a": "(~을) 만들기 위해 자주 사용된다", "p": "used to"}, {"t": "make + 목적어 + 형용사 : ~을 …하게 만들다", "c": "k", "x": "make group decisions fairer and more efficient는 5형식 문장이다. make 뒤에 목적어 group decisions가 오고, 목적어의 상태를 설명하는 형용사 fairer and more efficient가 이어진다. 형용사 두 개는 and로 연결되어 있고, 비교급 fairer와 more efficient의 형태가 서로 다른 점에 주의한다.", "n": ["make + 목적어 + 형용사 = ~을 …하게 만들다", "형용사 두 개는 and로 병렬 연결"], "q": "make group decisions fairer의 목적어와 형용사는 각각 무엇인가?", "a": "목적어 group decisions, 형용사 fairer", "p": "make group decisions fairer and more efficient"}, {"t": "have been developed : 현재완료 수동태", "c": "b", "x": "have been developed는 have been + p.p. 형태의 현재완료 수동태이다. 과거부터 지금까지 ‘개발되어 왔다’라는 뜻이다. 주어가 복수인 various voting methods이므로 has가 아니라 have를 쓴다. over time(시간이 흐르면서)과 잘 어울리는 표현이다.", "n": ["have/has been + p.p. = ~되어 왔다", "주어가 복수이면 have, 단수이면 has"], "q": "have been developed에서 have를 쓴 이유는?", "a": "주어 various voting methods가 복수이기 때문", "p": "have been developed"}, {"t": "간접의문문 : how + 주어 + 동사", "c": "b", "x": "how these different voting methods work는 문장 안에 들어간 간접의문문이다. 의문사 how 뒤에는 의문문 어순이 아니라 ‘주어 + 동사’ 순서가 온다. 주어 methods가 복수이므로 동사는 work(원형)이다. 여기서 work는 ‘작동하다, 기능하다’라는 뜻이다. 전체는 ‘이 투표 방법들이 어떻게 적용되는지’로 해석한다.", "n": ["의문사 + 주어 + 동사 = ~가 어떻게/무엇을 …하는지", "주어의 수에 맞춰 동사 일치"], "q": "how 뒤의 어순은 의문문 어순인가, 평서문 어순인가?", "a": "평서문 어순 (주어 + 동사)", "p": "how these different voting methods work"}, {"t": "involve : ~을 수반하다", "c": "g", "x": "it involves numerous voices에서 involve는 ‘~을 수반하다, 필요로 하다’라는 뜻의 타동사이다. 주어가 단수 it이고 현재 시제라서 -s가 붙은 involves 형태가 되었다. 원형은 involve이다. 집단 의사 결정에는 많은 사람의 목소리가 따라온다는 의미이다.", "n": ["involve = ~을 수반하다, 필요로 하다", "involves는 involve의 3인칭 단수 현재형"], "q": "involves는 어떤 동사의 어떤 형태인가?", "a": "동사 involve의 3인칭 단수 현재형", "p": "involves"}, {"t": "it = group decision-making (집단 의사 결정)", "c": "o", "x": "as it involves numerous voices의 it은 문장 앞부분의 Group decision-making을 가리킨다. 개인적인 선택이 아니라 ‘집단 의사 결정’이 수많은 목소리를 수반한다는 뜻이다. 단수 주어를 받으므로 it이고, 동사도 involves로 쓰였다.", "n": ["it = group decision-making"], "q": "as it involves numerous voices의 it은 무엇을 가리키는가?", "a": "집단 의사 결정 (group decision-making)", "p": "it"}]}, {"no": 2, "id": "z2", "sents": [{"n": 6, "mk": "The members of the Greenville High School student council needed to decide [2|how to raise money] for children [1|in need].", "en": "The members of the Greenville High School student council needed to decide how to raise money for children in need.", "ko": "Greenville 고등학교 학생 자치회의 구성원들은 어려움에 처한 아이들을 위해 모금할 방법을 결정해야 했다."}, {"n": 7, "mk": "[13|Their] three options were [7|an art show, a bake sale, and a charity concert], but [6|there were conflicting opinions].", "en": "Their three options were an art show, a bake sale, and a charity concert, but there were conflicting opinions.", "ko": "그들의 세 가지 선택지는 미술 전시회, 빵 바자회, 그리고 자선 콘서트였지만, 상충되는 의견들이 있었다."}, {"n": 8, "mk": "So they [10|decided to] [3|put it to a vote].", "en": "So they decided to put it to a vote.", "ko": "그래서 그들은 그것을 투표에 부치기로 결정했다."}, {"n": 9, "mk": "When they asked for advice from Ms. Akers, the council’s advisor, [14|she] [11|encouraged them] [12|not to use the familiar voting method, but to try something different] instead.", "en": "When they asked for advice from Ms. Akers, the council’s advisor, she encouraged them not to use the familiar voting method, but to try something different instead.", "ko": "그들이 자치회의 고문 교사인 Akers 선생님에게 조언을 구했을 때, 그녀는 익숙한 투표 방법을 사용하지 말고, 대신 다른 것을 시도해 보라고 권장했다."}, {"n": 10, "mk": "[8|After doing] some research, the council members [10|decided to] try three different voting systems: [7|the first-past-the-post (FPTP) method, the alternative vote (AV) method, and the Condorcet method].", "en": "After doing some research, the council members decided to try three different voting systems: the first-past-the-post (FPTP) method, the alternative vote (AV) method, and the Condorcet method.", "ko": "약간의 조사를 한 후, 자치회 구성원들은 단순 다수결(FPTP) 방식, 대안 투표(AV) 방식, 그리고 콩도르세 방식이라는 세 가지의 다른 투표 시스템을 시도해 보기로 결정했다."}, {"n": 11, "mk": "The entire council was curious to [4|find out] [9|if] the different methods would [5|yield] different results.", "en": "The entire council was curious to find out if the different methods would yield different results.", "ko": "모든 자치회 구성원들은 각각 다른 방법이 서로 다른 결과를 낼지 궁금해했다."}], "items": [{"t": "in need : 도움이 필요한, 어려운", "c": "g", "x": "in need는 ‘도움이 필요한, 어려운 처지에 있는’이라는 뜻의 숙어이다. children in need는 ‘도움이 필요한 아이들’이다. in need처럼 전치사구는 꾸미는 명사(children) 뒤에서 수식한다.", "n": ["in need = 도움이 필요한, 어려운", "명사 + in need = 도움이 필요한 ~"], "q": "children in need는 무슨 뜻인가?", "a": "도움이 필요한(어려운 처지의) 아이들", "p": "children in need"}, {"t": "의문사 + to부정사 : how to raise = 어떻게 ~할지 (~할 방법)", "c": "b", "x": "how to raise money는 ‘어떻게 돈을 모을지, 돈을 모을 방법’이라는 뜻이다. 의문사 how 뒤에 to부정사가 붙어 하나의 명사 덩어리가 되고, 여기서는 decide(결정하다)의 목적어이다. how to raise 전체가 ‘모금할 방법’을 뜻한다.", "n": ["의문사 + to부정사 = 명사 역할 (~할지, ~할 방법)", "how to + 동사원형 = ~하는 방법, 어떻게 ~할지"], "q": "needed to decide how to raise money에서 how to raise money는 어떤 역할을 하는가?", "a": "decide의 목적어(명사 역할) — ‘어떻게 모금할지’", "p": "how to raise money for children in need"}, {"t": "put ~ to a vote : ~을 투표에 부치다", "c": "g", "x": "put it to a vote는 ‘그것을 투표에 부치다’라는 뜻이다. put(놓다, 두다)의 원형이 decided to 뒤에 와서 원형 그대로 쓰였다. 여기서 it은 의견이 갈린 문제(모금 방법 선택)를 가리킨다.", "n": ["put ~ to a vote = ~을 투표에 부치다"], "q": "put it to a vote는 무슨 뜻인가?", "a": "그것을 투표에 부치다", "p": "put it to a vote"}, {"t": "find out : ~을 알아내다", "c": "g", "x": "find out은 ‘~을 알아내다, 알아보다’라는 뜻의 구동사이다. 본문의 was curious to find out if ...는 ‘~인지 알아보고 싶어 했다’라는 뜻이다. be curious to + 동사원형은 ‘~하고 싶어 하다’이다.", "n": ["find ~ out = ~을 알아내다", "be curious to + 동사원형 = ~하고 싶어 하다, ~이 궁금하다"], "q": "was curious to find out은 무슨 뜻인가?", "a": "알아보고 싶어 했다(궁금해했다)", "p": "curious to find out"}, {"t": "yield : (결과 등)을 내다, 도출하다", "c": "g", "x": "yield는 ‘(결과 등)을 내다, 도출하다’라는 뜻의 동사이다. 본문의 would yield different results는 ‘서로 다른 결과를 낼 것이다’라는 뜻이다. would 뒤라서 동사원형 yield 그대로 쓰였다.", "n": ["yield = (결과 등)을 내다, 도출하다", "yield ≒ produce (결과를 만들어 내다)"], "q": "the different methods would yield different results에서 yield의 뜻은?", "a": "(결과를) 내다, 도출하다", "p": "would yield different results"}, {"t": "유도부사 there + 복수동사 : there were conflicting opinions", "c": "b", "x": "there were conflicting opinions는 ‘상충되는 의견들이 있었다’라는 뜻이다. 이 there는 ‘거기’가 아니라 문장을 이끄는 유도부사이고, 진짜 주어는 뒤의 opinions(복수)라서 동사가 were이다. conflicting은 ‘상충하는’이라는 뜻의 분사형 형용사로 opinions를 꾸민다. 앞 절의 Their three options were도 복수 주어라서 were이다.", "n": ["There + be동사 + 주어 = ~이 있다 (동사는 뒤의 주어에 수일치)", "conflicting + 명사 = 상충되는 ~ (분사형 형용사)"], "q": "there were conflicting opinions에서 동사가 were인 이유는?", "a": "진짜 주어 opinions가 복수이기 때문", "p": "there were conflicting opinions"}, {"t": "A, B, and C의 병렬연결 : 같은 형태끼리 나열", "c": "b", "x": "an art show, a bake sale, and a charity concert는 명사 세 개를 쉼표와 and로 연결한 병렬 구조이다. 3개 이상을 나열할 때는 마지막 앞에 and를 쓴다. 문장 10의 the FPTP method, the AV method, and the Condorcet method도 같은 방식으로 세 가지 방식을 나열했다.", "n": ["A, B, and C = 같은 형태·성격끼리 3개 이상 나열", "마지막 항목 앞에만 and"], "q": "A, B, and C 병렬에서 and는 어디에 오는가?", "a": "마지막 항목(C) 바로 앞", "p": "an art show, a bake sale, and a charity concert"}, {"t": "전치사 + 동명사 : After doing some research = 조사를 한 후에", "c": "b", "x": "After doing some research에서 doing은 동명사이다. after는 뒤에 -ing를 취하며, ‘조사를 한 후에’라는 뜻이 된다. 조사를 한 주체와 주절의 주어(the council members)가 같아서 의미상 주어를 따로 쓰지 않았다. after 뒤의 -ing는 접속사 + 분사구문이 아니라 ‘전치사 + 동명사’로 보는 설명이 더 적절하다.", "n": ["전치사 + 동명사(-ing)", "After + -ing = ~한 후에 (주절의 주어와 행위 주체가 같을 때)"], "q": "After doing some research에서 doing은 무엇인가?", "a": "전치사 After의 목적어인 동명사 (조사를 한 후에)", "p": "After doing some research"}, {"t": "명사절 접속사 if : ~인지 (아닌지)", "c": "b", "x": "to find out if the different methods would yield different results에서 if는 ‘~인지 (아닌지)’라는 뜻의 명사절 접속사이다. if절은 find out의 목적어 역할을 한다. 조건을 나타내는 ‘만약 ~라면’의 if와 구별해야 한다. 이 자리에는 whether도 쓸 수 있다.", "n": ["if + 주어 + 동사 (명사절) = ~인지 (아닌지)", "find out + if/whether절 = ~인지 알아내다"], "q": "find out if ...의 if는 ‘만약 ~라면’인가?", "a": "아니다. ‘~인지 (아닌지)’라는 뜻의 명사절 접속사이다.", "p": "if the different methods would yield different results"}, {"t": "decide + to부정사 : ~하기로 결정하다", "c": "k", "x": "decide는 목적어로 to부정사를 취해 ‘~하기로 결정하다’라는 뜻이 된다. decided to put it to a vote(투표에 부치기로 결정했다)와 decided to try three different voting systems(세 가지 투표 시스템을 시도해 보기로 결정했다)에 쓰였다. decide ‘-ing’는 쓰지 않는다.", "n": ["decide + to부정사 = ~하기로 결정하다", "to부정사를 목적어로 취하는 동사: decide, need, want, plan ..."], "q": "‘그들은 투표하기로 결정했다’를 decide를 써서 영작하면?", "a": "They decided to vote.", "p": "decided to try three different voting systems"}, {"t": "encourage + 목적어 + to부정사 : ~에게 …하도록 권장하다", "c": "k", "x": "she encouraged them not to use ...는 ‘그녀는 그들에게 ~을 사용하지 말라고 권장했다’라는 뜻이다. encourage는 5형식 동사로, 목적어(them) 뒤에 to부정사가 와서 ‘~가 …하도록 권장하다’가 된다. to부정사를 부정할 때는 to 바로 앞에 not을 붙여 not to use로 쓴다.", "n": ["encourage + O + to부정사 = O가 …하도록 권장하다", "to부정사의 부정 = not to + 동사원형"], "q": "encourage + O + to부정사에서 ‘~하지 말라고 권장하다’처럼 부정할 때 not은 어디에 놓는가?", "a": "to부정사 바로 앞 (not to + 동사원형)", "p": "encouraged them not to use the familiar voting method"}, {"t": "not A but B : A가 아니라 B", "c": "k", "x": "not to use the familiar voting method, but to try something different는 ‘익숙한 투표 방법을 사용하지 말고 다른 것을 시도하라’는 뜻이다. not A but B는 ‘A가 아니라 B’이다. A와 B는 같은 형태여야 해서 여기서는 둘 다 to부정사(to use / to try)이다. 뒤의 instead는 ‘대신에’라는 뜻의 부사이다.", "n": ["not A but B = A가 아니라 B (A, B는 같은 형태로 병렬)", "instead = (그) 대신에"], "q": "not to use ..., but to try ...에서 A와 B는 각각 무엇인가?", "a": "A = to use the familiar voting method, B = to try something different", "p": "not to use the familiar voting method, but to try something different"}, {"t": "Their = 학생 자치회 구성원들", "c": "o", "x": "Their three options의 Their는 앞 문장의 The members of the Greenville High School student council을 가리킨다. 즉 ‘학생 자치회 구성원들의 세 가지 선택지’이다.", "n": ["Their = 학생 자치회 구성원들", "대명사는 앞에 나온 명사(구) 중 의미가 맞는 것을 찾기"], "q": "Their three options의 Their는 누구를 가리키는가?", "a": "Greenville 고등학교 학생 자치회 구성원들", "p": "Their three options"}, {"t": "she = Ms. Akers (자치회 고문 교사)", "c": "o", "x": "she encouraged them에서 she는 바로 앞의 Ms. Akers, the council’s advisor를 가리킨다. 조언을 구한 상대인 Akers 선생님이 주어가 되어 권장한 것이다. them은 조언을 구한 쪽인 학생 자치회 구성원들을 가리킨다.", "n": ["she = Ms. Akers", "them = 학생 자치회 구성원들"], "q": "she encouraged them에서 she는 누구인가?", "a": "Ms. Akers (자치회의 고문 교사)", "p": "she encouraged them"}]}, {"no": 3, "id": "z3", "sents": [{"n": 12, "mk": "On the day of the vote, [1|each possible event was given a letter]: [2|“art show” was represented by the letter A, the letter B indicated “bake sale,” and C] [3|stood for] “charity concert.”", "en": "On the day of the vote, each possible event was given a letter: “art show” was represented by the letter A, the letter B indicated “bake sale,” and C stood for “charity concert.”", "ko": "투표 당일, 각각의 가능한 행사에 글자가 하나씩 부여되었다. ‘미술 전시회’는 글자 A로 표시되었고, 글자 B는 ‘빵 바자회’를 나타냈으며, C는 ‘자선 콘서트’를 의미했다."}, {"n": 13, "mk": "[4|Each of the 20 council members was] given a voting slip and [5|instructed to] [6|write down] the options [7|in order of preference].", "en": "Each of the 20 council members was given a voting slip and instructed to write down the options in order of preference.", "ko": "20명의 자치회 구성원들 각각은 투표용지를 받았고, 선호하는 순서대로 선택지를 적으라는 지시를 받았다."}, {"n": 14, "mk": "For example, [8|if] the charity concert was [10|their] first choice, [9|followed by the bake sale and the art show], [10|they] would write CBA.", "en": "For example, if the charity concert was their first choice, followed by the bake sale and the art show, they would write CBA.", "ko": "예를 들어, 자선 콘서트가 첫 번째 선택이고 빵 바자회와 미술 전시회가 뒤따른다면, 그들은 CBA를 적을 것이다."}, {"n": 15, "mk": "[11|After every member had voted], the voting slips [12|were counted].", "en": "After every member had voted, the voting slips were counted.", "ko": "모든 구성원이 투표를 마친 후, 투표용지가 집계되었다."}, {"n": 16, "mk": "The results were [13|as follows]:", "en": "The results were as follows:", "ko": "결과는 다음과 같았다."}], "items": [{"t": "A be given B : A가 B를 받다 (수동태)", "c": "k", "x": "각각의 행사에 글자가 하나씩 부여되었다는 each possible event was given a letter는 ‘행사가 글자를 받았다’라는 수동태이다. 능동태로 바꾸면 ‘(사람들이) 행사에 글자를 주었다’가 된다. each 뒤에는 단수명사(event)가 오므로 동사도 단수형 was를 쓴다. 뒤 문장의 was given a voting slip도 같은 구조이다.", "n": ["give A B → A be given B (A가 B를 받다)", "each + 단수명사 + 단수동사"], "q": "each possible event was given a letter를 능동태 느낌으로 풀면 누가 무엇을 받은 것인가?", "a": "행사(event)가 글자(a letter)를 받았다", "p": "each possible event was given a letter"}, {"t": "A, B, and C : 병렬연결 (3개의 절)", "c": "b", "x": "“art show” was represented ..., the letter B indicated “bake sale,” and C stood for “charity concert.”는 서로 비슷한 모양의 절 3개가 나열된 구조이다. 앞 두 절은 쉼표로, 마지막 절 앞에는 and를 붙여 연결한다. 세 절 모두 ‘글자가 어떤 행사를 나타낸다’는 같은 내용이다.", "n": ["A, B, and C = 3개 이상은 마지막 앞에만 and", "같은 형태끼리 병렬 연결"], "q": "이 문장에서 and는 어떤 것들을 연결하는가?", "a": "마지막 두 절 ‘the letter B indicated ...’와 ‘C stood for ...’를 연결한다 (앞의 절까지 3개 절 나열)", "p": "“art show” was represented by the letter A, the letter B indicated “bake sale,” and C stood for “charity concert.”"}, {"t": "stand for ~ : ~을 뜻하다, 나타내다", "c": "g", "x": "stand for는 ‘~을 뜻하다, 나타내다’라는 숙어이다. 본문의 stood for는 stand의 과거형이다. C stood for “charity concert.”는 글자 C가 ‘자선 콘서트’를 뜻했다는 의미이다. 문맥에 따라 ‘~을 지지하다, 옹호하다’라는 뜻도 있다.", "n": ["stand for ~ = ~을 뜻하다, 나타내다 (= represent)", "stood = stand의 과거형"], "q": "C stood for “charity concert.”에서 stood for의 뜻은?", "a": "~을 뜻하다, 나타내다 (stand for의 과거형)", "p": "stood for"}, {"t": "Each of + 복수명사 + 단수동사", "c": "k", "x": "Each of the 20 council members에서 each of 뒤에는 복수명사(members)가 오지만, 주어의 핵심은 Each이다. 그래서 동사는 복수형 were가 아니라 단수형 was를 쓴다. 바로 앞의 복수명사에 동사를 맞추는 실수를 조심해야 한다.", "n": ["each of + 복수명사 + 단수동사", "수일치는 each에 맞춘다 (members에 X)"], "q": "Each of the 20 council members ( was / were ) given ...에서 알맞은 동사는?", "a": "was (주어의 핵심이 단수 Each이기 때문)", "p": "Each of the 20 council members was"}, {"t": "instruct + O + to부정사 : ~에게 …하도록 지시하다", "c": "k", "x": "instruct A to-v는 ‘A에게 …하라고 지시하다’라는 구조이다. 본문에서는 목적어(A)가 주어 자리로 나간 수동태 was instructed to write이다. 앞의 was given ... and (was) instructed ...에서 was를 공유해 ‘받았고, 지시를 받았다’로 이어진다. 수동태가 되어도 to부정사는 그대로 남는다.", "n": ["instruct + O + to-v = O에게 …하도록 지시하다", "O be instructed to-v = O가 …하라는 지시를 받다"], "q": "was instructed to write down ...을 우리말로 풀면?", "a": "~을 적으라는 지시를 받았다", "p": "instructed to write down"}, {"t": "write ~ down : ~을 적다, 적어 두다", "c": "g", "x": "write down은 ‘~을 적다, 적어 두다’라는 구동사이다. write down the options는 ‘선택지를 적다’라는 뜻이다. 목적어가 명사일 때는 write down the options처럼 쓰거나 write the options down처럼 사이에 넣어서 쓸 수 있다.", "n": ["write ~ down = ~을 적다, 적어 두다", "options = option(선택지)의 복수형"], "q": "write down the options의 뜻은?", "a": "선택지를 적다", "p": "write down the options"}, {"t": "in order of preference : 선호하는 순서대로 / preference (동사파생명사)", "c": "b", "x": "preference는 동사 prefer(~을 더 좋아하다)에서 나온 명사로, ‘선호’라는 뜻이다. in order of ~는 ‘~의 순서로’라는 뜻이므로 in order of preference는 ‘선호하는 순서대로’가 된다. 앞에 나온 options를 선호 순으로 적으라는 지시이다.", "n": ["prefer(동) → preference(명) = 선호", "in order of ~ = ~의 순서로"], "q": "in order of preference의 뜻은? preference는 어떤 동사에서 나온 명사인가?", "a": "선호하는 순서대로 / prefer", "p": "in order of preference"}, {"t": "접속사 if : 만약 ~라면", "c": "b", "x": "if는 조건을 나타내는 접속사로 ‘만약 ~라면’이라는 뜻이다. if the charity concert was their first choice, ... 에서 if절은 ‘자선 콘서트가 첫 번째 선택이라면’이라는 조건을 말한다. 그 조건에 따른 결과가 뒤의 주절 they would write CBA이다.", "n": ["if + 주어 + 동사 = 만약 ~라면 (조건)", "if절 + 주절 : 조건과 결과"], "q": "if절이 말하는 조건은 무엇인가?", "a": "자선 콘서트가 첫 번째 선택인 경우", "p": "if the charity concert was their first choice"}, {"t": "followed by ~ : 분사구문 (~이 뒤따르는)", "c": "b", "x": "followed by the bake sale and the art show는 분사구문으로, ‘빵 바자회와 미술 전시회가 뒤따른다면’이라는 뜻이다. 의미상 주어인 the charity concert가 ‘뒤따라지는’ 입장이라서 수동의 의미를 가진 과거분사 followed를 쓴다. 능동의 현재분사 following이 아니다. 행위자는 by ~로 나타낸다.", "n": ["수동 의미의 분사구문 = 과거분사(p.p.)로 시작", "followed by ~ = ~이 뒤따르는"], "q": "followed by ...에서 following이 아니라 followed를 쓴 이유는?", "a": "의미상 주어(the charity concert)가 ‘뒤따라지는’ 수동 관계이기 때문", "p": "followed by the bake sale and the art show"}, {"t": "their / they = 자치회 구성원들", "c": "o", "x": "their first choice의 their와 they would write CBA의 they는 모두 앞 문장의 20명의 자치회 구성원들(council members)을 가리킨다. 구성원 각자가 투표용지에 선호 순서를 적는다는 예시이다.", "n": ["their, they = the council members (자치회 구성원들)", "대명사 → 앞에서 누구인지 찾기"], "q": "they would write CBA의 they는 누구인가?", "a": "자치회 구성원들 (the council members)", "p": "they would write CBA"}, {"t": "After + every + 단수명사 + had p.p. : 과거완료", "c": "b", "x": "After every member had voted에서 after는 ‘~한 후에’라는 접속사이다. every 뒤에는 단수명사(member)가 오고, had voted는 had + p.p.의 과거완료이다. 투표용지가 집계된 때보다 투표를 마친 것이 먼저이므로 과거완료를 쓴다.", "n": ["every + 단수명사 (every member)", "had p.p. = (그 시점 이전에) ~했다 (과거완료)"], "q": "had voted가 과거완료인 이유는?", "a": "투표용지가 집계된 시점보다 투표를 마친 것이 더 먼저이기 때문", "p": "After every member had voted"}, {"t": "were counted : count(~을 세다)의 수동태", "c": "b", "x": "count는 ‘~을 세다, 계산하다’라는 동사이다. the voting slips were counted는 ‘투표용지가 세어졌다’, 즉 ‘집계되었다’라는 수동태이다. 주어 the voting slips가 복수이고 과거의 일이라서 were + p.p.를 쓴다.", "n": ["be p.p. = ~되다, ~당하다 (수동태)", "count = ~을 세다, 집계하다"], "q": "the voting slips were counted를 우리말로 풀면?", "a": "투표용지가 집계되었다", "p": "the voting slips were counted"}, {"t": "as follows : 다음과 같이", "c": "g", "x": "as follows는 목록이나 내용을 나열하기 전에 쓰는 ‘다음과 같이’라는 표현이다. 주어가 The results처럼 복수여도 follows의 형태는 그대로 쓴다. 이 문장 뒤에 투표 결과가 이어진다.", "n": ["as follows = (목록을 나열하며) 다음과 같이", "주어가 복수여도 follows 형태 고정"], "q": "The results were as follows:에서 as follows의 뜻은?", "a": "다음과 같이", "p": "as follows"}]}, {"no": 4, "id": "z4", "sents": [{"n": 17, "mk": "The FPTP method is [1|the simplest of the three methods].", "en": "The FPTP method is the simplest of the three methods.", "ko": "FPTP 방식은 세 가지 방식 중 가장 간단하다."}, {"n": 18, "mk": "Voters [2|are given] several options, and [3|whichever gets the most first-preference votes] [4|wins].", "en": "Voters are given several options, and whichever gets the most first-preference votes wins.", "ko": "투표자들에게는 여러 가지 선택지가 주어지고, 어떤 것이든 가장 많은 1지망 표를 얻은 것이 이긴다."}, {"n": 19, "mk": "[5|Neither the second nor third preference matters] at all, so [6|they] are [7|ignored].", "en": "Neither the second nor third preference matters at all, so they are ignored.", "ko": "2지망도 3지망도 둘 다 전혀 중요하지 않으므로, 그것들은 무시된다."}, {"n": 20, "mk": "This method [2|is commonly used] in political elections around the world.", "en": "This method is commonly used in political elections around the world.", "ko": "이 방식은 전 세계 정치 선거에서 흔히 사용된다."}, {"n": 21, "mk": "The student council quickly [8|determined] that the winner would be option C, the charity concert.", "en": "The student council quickly determined that the winner would be option C, the charity concert.", "ko": "학생 자치회는 빠르게 자선 콘서트인 선택지 C가 승자가 될 것임을 알아냈다."}, {"n": 22, "mk": "This was [9|because] [10|it] received 8 first-preference votes, [9|while] option A received 5 and option B received 7.", "en": "This was because it received 8 first-preference votes, while option A received 5 and option B received 7.", "ko": "이는 선택지 A는 5표, 선택지 B는 7표를 받은 반면, 그것은 8표의 1지망 표를 받았기 때문이었다."}, {"n": 23, "mk": "The FPTP method is uncomplicated and [11|easy to understand], but it has a significant weakness.", "en": "The FPTP method is uncomplicated and easy to understand, but it has a significant weakness.", "ko": "FPTP 방식은 복잡하지 않고 이해하기 쉽지만, 상당한 약점을 가지고 있다."}, {"n": 24, "mk": "[12|It is possible] to [4|win] a vote without the support of the majority.", "en": "It is possible to win a vote without the support of the majority.", "ko": "과반수의 지지 없이도 투표에서 승리하는 것이 가능하다."}, {"n": 25, "mk": "That was the case here.", "en": "That was the case here.", "ko": "이것이 바로 그런 경우였다."}, {"n": 26, "mk": "[13|According to] the results of the FPTP method, the council’s choice was to hold a charity concert.", "en": "According to the results of the FPTP method, the council’s choice was to hold a charity concert.", "ko": "FPTP 방식의 결과에 따르면, 자치회의 선택은 자선 콘서트를 개최하는 것이었다."}, {"n": 27, "mk": "However, only 8 out of 20 council members chose the charity concert as their first preference, [14|which] equaled 40% of the total votes.", "en": "However, only 8 out of 20 council members chose the charity concert as their first preference, which equaled 40% of the total votes.", "ko": "하지만 20명의 자치회 구성원 중 8명만이 1지망으로 자선 콘서트를 골랐는데, 이는 전체 표의 40%에 해당했다."}], "items": [{"t": "최상급 + of + 복수명사 : ~ 중 가장 …한", "c": "b", "x": "the simplest of the three methods는 ‘세 가지 방식 중 가장 간단한 것’이라는 뜻이다. simple(간단한)의 최상급 simplest 앞에는 the를 붙인다. 범위를 나타내는 말은 of 뒤에 복수명사(the three methods)로 쓴다.", "n": ["the + 최상급 + of + 복수명사 = ~ 중 가장 …한", "simple - simpler - simplest"], "q": "‘세 가지 방식 중 가장 간단한’을 영어로 하면 the simplest ___ the three methods에서 빈칸에 들어갈 말은?", "a": "of", "p": "the simplest of the three methods"}, {"t": "수동태 : ~가 …되다", "c": "b", "x": "Voters are given several options는 ‘투표자들에게 선택지가 주어진다(투표자들이 선택지를 받는다)’라는 뜻의 수동태(be + p.p.)이다. 주어 Voters가 선택지를 ‘받는’ 쪽이라서 are given을 쓴다. 능동태로는 (사람들이) 투표자들에게 선택지를 주다가 된다. 다음 문장의 is commonly used(흔히 사용된다)는 방식이 ‘사용되는’ 쪽이라서 같은 수동태이다.", "n": ["be동사 + p.p. = ~되다, ~받다 (수동태)", "give A B → A는 B를 받다 (B가 남은 수동태)"], "q": "This method is commonly used에서 ‘사용되는’ 쪽이 주어라서 쓴 형태 is used를 문법 용어로 무엇이라 하는가?", "a": "수동태 (be동사 + 과거분사)", "p": "are given"}, {"t": "복합관계대명사 whichever : 어느 것이든", "c": "k", "x": "whichever gets the most first-preference votes는 ‘가장 많은 1지망 표를 얻는 것은 어느 것이든’이라는 뜻의 명사절이다. whichever(어느 것이든)가 이 절의 주어 역할을 하고, 뒤에 동사 gets가 바로 온다. 이 절 전체가 문장의 주어이고 단수로 취급하므로 동사도 wins(이기다)이다.", "n": ["whichever + 동사 = ~하는 어느 것이든", "whichever 절은 단수 취급 → 단수동사 (gets, wins)"], "q": "whichever gets ...의 동사 gets와 wins에 -s가 붙은 이유는?", "a": "whichever 절이 단수 주어이기 때문", "p": "whichever gets the most first-preference votes"}, {"t": "win : 이기다, 승리하다", "c": "g", "x": "win은 ‘이기다, 승리하다’라는 뜻의 동사이다. 본문의 wins는 3인칭 단수 현재형이고, 반의어는 lose(지다)이다. win a vote는 ‘투표에서 승리하다’라는 뜻이다. 명사형 winner(승자)도 알아 둔다.", "n": ["win = 이기다 (↔ lose)", "win a vote = 투표에서 승리하다 / winner = 승자"], "q": "win의 반의어는?", "a": "lose", "p": "wins"}, {"t": "neither A nor B : A도 B도 아닌", "c": "k", "x": "Neither the second nor third preference matters는 ‘2지망도 3지망도 둘 다 중요하지 않다’라는 뜻이다. neither A nor B가 주어일 때 동사는 B에 일치시킨다. B인 third preference가 단수라서 동사가 matters이다. 여기서 matter는 ‘중요하다’라는 뜻의 동사이다.", "n": ["neither A nor B = A도 B도 아닌", "neither A nor B + 동사 : 동사는 B에 수일치"], "q": "Neither A nor B가 주어일 때 동사는 A, B 중 어느 쪽에 일치시키는가?", "a": "B", "p": "Neither the second nor third preference matters"}, {"t": "they = 2지망과 3지망", "c": "o", "x": "they는 바로 앞의 the second ... third preference(2지망과 3지망)를 가리킨다. 둘이므로 복수 they로 받고 동사도 are ignored이다. 그래서 ‘2지망과 3지망은 무시된다’라는 뜻이다.", "n": ["they = the second and third preferences (= 2지망과 3지망)"], "q": "they가 가리키는 것은?", "a": "2지망과 3지망", "p": "they"}, {"t": "ignore : ~을 무시하다", "c": "g", "x": "ignore는 ‘~을 무시하다’라는 뜻의 동사이다. 본문의 ignored는 과거분사형이고 are ignored는 ‘무시된다’라는 수동태이다. 2지망과 3지망은 점수에 반영하지 않고 넘긴다는 뜻이다.", "n": ["ignore = ~을 무시하다 (과거분사 ignored)", "are ignored = 무시된다"], "q": "본문의 ignored는 ignore의 어떤 형태인가?", "a": "과거분사형 (are ignored 수동태)", "p": "ignored"}, {"t": "determine : ~을 알아내다, 결정짓다", "c": "g", "x": "determine은 ‘~을 정확히 알아내다, (결과 등)을 결정짓다’라는 뜻의 동사이다. 본문의 determined는 과거형이다. determined that the winner would be option C는 ‘승자가 선택지 C가 될 것임을 알아냈다’라는 뜻이다. that 뒤에는 절이 와서 determine의 목적어가 된다.", "n": ["determine = ~을 알아내다, 결정짓다 (과거형 determined)", "determine + that + 주어 + 동사 = ~임을 알아내다"], "q": "determined that the winner would be option C의 뜻은?", "a": "승자가 선택지 C가 될 것임을 알아냈다", "p": "determined"}, {"t": "접속사 because · while : ~ 때문에 · ~인 반면에", "c": "b", "x": "This was because it received 8 ...에서 because(~ 때문에)는 앞 문장의 결과에 대한 이유를 이끈다. 뒤에는 it received처럼 주어와 동사가 있는 절이 온다. while option A received 5 ...의 while은 ‘~인 반면에’라는 뜻으로 두 내용을 대조한다.", "n": ["because + 절 = ~ 때문에", "while + 절 = ~인 반면에 (대조)"], "q": "본문의 while은 ‘~하는 동안’이 아니라 어떤 뜻인가?", "a": "~인 반면에 (대조)", "p": "because it received 8 first-preference votes, while option A received 5"}, {"t": "it = 선택지 C (자선 콘서트)", "c": "o", "x": "it received 8 first-preference votes의 it은 앞 문장의 option C, the charity concert를 가리킨다. 1지망 표를 8표 받은 것이 C이고, A는 5표, B는 7표를 받았다. 그래서 C가 승자가 되었다는 설명이다.", "n": ["it = option C, the charity concert"], "q": "it이 가리키는 것은?", "a": "선택지 C (자선 콘서트)", "p": "it"}, {"t": "easy to understand : 이해하기 쉬운", "c": "b", "x": "easy to understand는 ‘이해하기 쉬운’이라는 뜻이다. 형용사 easy 뒤의 to understand(이해하기에)는 easy가 어떤 면에서 그런지 설명하는 부사적 용법의 to부정사이다. uncomplicated and easy to understand는 ‘복잡하지 않은’과 ‘이해하기 쉬운’을 and로 이은 병렬이다.", "n": ["형용사 + to부정사 = ~하기에 …한 (부사적 용법)", "uncomplicated and easy to understand = 형용사끼리 병렬"], "q": "easy to understand에서 to understand는 to부정사의 어떤 용법인가?", "a": "부사적 용법 (easy를 수식)", "p": "easy to understand"}, {"t": "가주어 It ~ 진주어 to부정사 : ~하는 것이 …하다", "c": "k", "x": "It is possible to win a vote에서 It은 가주어이고 진짜 주어는 to win a vote(투표에서 승리하는 것)이다. 긴 to부정사구를 뒤로 보내고 It을 앞에 둔 구문이다. 해석은 ‘투표에서 승리하는 것이 가능하다’이다. 뒤의 without the support of the majority는 ‘과반수의 지지 없이’라는 뜻이다.", "n": ["It is + 형용사 + to부정사 = ~하는 것은 …하다", "It = 가주어, to부정사구 = 진주어"], "q": "It is possible to win a vote에서 진주어는?", "a": "to win a vote", "p": "It is possible to win a vote"}, {"t": "according to ~ : ~에 따르면", "c": "g", "x": "according to는 두 단어가 합쳐져 하나의 전치사처럼 쓰이는 숙어로 ‘~에 따르면’이라는 뜻이다. According to the results of the FPTP method는 ‘FPTP 방식의 결과에 따르면’이라는 뜻이다. to 뒤에는 명사구(the results ...)가 온다.", "n": ["according to + 명사(구) = ~에 따르면"], "q": "according to의 뜻은?", "a": "~에 따르면", "p": "According to"}, {"t": "계속적 용법의 주격 관계대명사 which", "c": "b", "x": "..., which equaled 40% of the total votes에서 which 앞에 쉼표가 있다. 쉼표 뒤의 which는 앞 내용 전체를 가리켜 ‘그리고 이것은’의 뜻으로 덧붙이는 계속적 용법이다. 여기서는 8표를 골랐다는 앞 내용이 전체 표의 40%에 해당한다는 설명이다. which가 equaled의 주어 역할을 해서 주격이다.", "n": [", which + 동사 = 그리고 이것은 ~하다 (계속적 용법)", "계속적 용법은 앞 내용을 보충 설명"], "q": "쉼표 뒤 which equaled 40% ...에서 which는 무엇을 가리키는가?", "a": "20명 중 8명만 자선 콘서트를 골랐다는 앞 내용", "p": "which equaled 40% of the total votes"}]}, {"no": 5, "id": "z5", "sents": [{"n": 28, "mk": "Next, the council members examined the votes [4|using the AV method], and [11|they] soon [5|realized that] there would be a different result.", "en": "Next, the council members examined the votes using the AV method, and they soon realized that there would be a different result.", "ko": "다음으로, 자치회 구성원들은 AV 방식을 사용하여 표를 검토했고, 그들은 곧 다른 결과가 나올 것이라는 것을 깨달았다."}, {"n": 29, "mk": "The AV method can potentially include more than one round of counting.", "en": "The AV method can potentially include more than one round of counting.", "ko": "AV 방식은 잠재적으로 한 차례 이상의 집계를 포함할 수 있다."}, {"n": 30, "mk": "[6|For an option to win] in the first round, it needs to get more than 50% of the first-preference votes.", "en": "For an option to win in the first round, it needs to get more than 50% of the first-preference votes.", "ko": "어떤 선택지가 1차 집계에서 승리하기 위해서는, 1지망 표의 50% 이상을 얻어야 한다."}, {"n": 31, "mk": "[8|As] the charity concert only received 40% of the total votes, [7|a second round of counting was required].", "en": "As the charity concert only received 40% of the total votes, a second round of counting was required.", "ko": "자선 콘서트는 전체 표의 40%만을 받았기 때문에, 2차 집계가 필요했다."}, {"n": 32, "mk": "Option A, the art show, received the fewest first-preference votes, [1|with only 5 council members voting for it].", "en": "Option A, the art show, received the fewest first-preference votes, with only 5 council members voting for it.", "ko": "미술 전시회인 선택지 A는 오직 5명의 자치회 구성원들만 그것에 투표하며 가장 적은 1지망 표를 받았다."}, {"n": 33, "mk": "Therefore, option A was [13|eliminated], and the 5 council members’ votes were [13|redistributed] [14|based on] their second preferences.", "en": "Therefore, option A was eliminated, and the 5 council members’ votes were redistributed based on their second preferences.", "ko": "따라서 선택지 A는 제거되었고, 5명의 자치회 구성원들의 표가 그들의 두 번째 선호도에 따라 재분배되었다."}, {"n": 34, "mk": "As a result, 4 votes for option B (ABC) and 1 for option C (ACB) were added to the total.", "en": "As a result, 4 votes for option B (ABC) and 1 for option C (ACB) were added to the total.", "ko": "그 결과, 선택지 B에 4표(ABC), 선택지 C에 1표(ACB)가 합계에 추가되었다."}, {"n": 35, "mk": "This [5|meant that] option B had 11 total votes, [9|while] option C had only 9.", "en": "This meant that option B had 11 total votes, while option C had only 9.", "ko": "이것은 선택지 C는 9표밖에 얻지 못한 반면 선택지 B가 총 11표를 얻었다는 것을 의미했다."}, {"n": 36, "mk": "As a result, the bake sale would be the winner.", "en": "As a result, the bake sale would be the winner.", "ko": "결과적으로, 빵 바자회가 승자가 될 것이었다."}, {"n": 37, "mk": "Unfortunately, the AV method is not perfect [10|either].", "en": "Unfortunately, the AV method is not perfect either.", "ko": "안타깝게도, AV 방식도 완벽하지는 않다."}, {"n": 38, "mk": "[12|It] sometimes [3|allows second-preference votes to have] a greater influence than first-preference votes.", "en": "It sometimes allows second-preference votes to have a greater influence than first-preference votes.", "ko": "그것은 때때로 2지망 표가 1지망 표보다 더 큰 영향력을 갖게 하기도 한다."}, {"n": 39, "mk": "In this case, the bake sale won, but this was mainly [14|due to] [2|the second-preference votes it received].", "en": "In this case, the bake sale won, but this was mainly due to the second-preference votes it received.", "ko": "이 경우에는 빵 바자회가 승리했지만, 이는 주로 그것이 얻은 2지망 표 때문이었다."}], "items": [{"t": "with + 명사(구) + 분사(구) : ~가 …하면서", "c": "k", "x": "with only 5 council members voting for it은 ‘오직 5명의 자치회 구성원들이 그것에 투표하면서’라는 뜻이다. with 뒤에 명사(5 council members)와 분사(voting)가 나란히 오는 형태이다. 구성원들이 ‘투표하는’ 주체이므로 능동의 현재분사 voting을 썼다. it은 Option A를 가리킨다.", "n": ["with + 명사 + 현재분사 = ~가 …하면서 (능동 관계)", "with + 명사 + 과거분사 = ~가 …된 채로 (수동 관계)"], "q": "with only 5 council members voting for it에서 왜 voted가 아니라 voting인가?", "a": "council members가 투표하는 주체이므로 능동 관계 → 현재분사 voting", "p": "with only 5 council members voting for it"}, {"t": "목적격 관계대명사의 생략 : the votes (that) it received", "c": "k", "x": "the second-preference votes it received는 votes 뒤에 which(또는 that)가 생략된 모양이다. received의 목적어가 앞의 votes이기 때문에 목적격 관계대명사를 생략할 수 있다. ‘그것(빵 바자회)이 얻은 2지망 표’라고 votes를 뒤에서 꾸며 준다.", "n": ["명사 + 주어 + 동사 = 명사 뒤 목적격 관계대명사(which/that) 생략", "the votes (which) it received = 그것이 얻은 표"], "q": "the second-preference votes it received에서 생략된 말은 무엇이고 선행사는 무엇인가?", "a": "목적격 관계대명사 which(that), 선행사는 the second-preference votes", "p": "the second-preference votes it received"}, {"t": "allow + 목적어 + to부정사 : ~가 …하는 것을 허락하다(…하게 하다)", "c": "k", "x": "allows second-preference votes to have a greater influence에서 목적어는 second-preference votes이고, to have가 목적격 보어이다. ‘2지망 표가 더 큰 영향력을 갖게 한다’는 뜻이다. allow는 목적어 뒤에 to부정사가 오는 5형식 동사이다.", "n": ["allow + O + to부정사 = O가 ~하는 것을 허락하다", "5형식 동사 allow의 보어 = to부정사"], "q": "allows second-preference votes to have ...에서 목적어와 목적격 보어는 각각 무엇인가?", "a": "목적어: second-preference votes, 목적격 보어: to have a greater influence", "p": "allows second-preference votes to have"}, {"t": "분사구문 using ~ : ~을 사용하여", "c": "b", "x": "examined the votes using the AV method에서 using the AV method는 분사구문이다. ‘AV 방식을 사용하여’라는 뜻으로, 표를 어떻게 검토했는지 방법을 덧붙인다. 의미상 주어는 문장의 주어 the council members이고, 이들이 ‘사용하는’ 주체이므로 능동의 -ing 형태이다.", "n": ["분사구문(능동) : -ing ~ = ~하면서, ~하여", "using ~ = ~을 사용하여"], "q": "using the AV method의 의미상 주어는 누구이고, 왜 -ing 형태인가?", "a": "the council members, 이들이 사용하는 주체(능동)이기 때문", "p": "using the AV method"}, {"t": "명사절 접속사 that : ~라는 것", "c": "b", "x": "realized that there would be a different result에서 that 이하는 realized의 목적어 역할을 하는 명사절이다. ‘다른 결과가 나올 것이라는 것을 깨달았다’라는 뜻이다. This meant that option B had 11 total votes에서도 that절이 meant의 목적어이다.", "n": ["realize / mean + that + 주어 + 동사 = ~라는 것을 깨닫다 / 의미하다", "that절 = 동사의 목적어(명사절)"], "q": "This meant that option B had ...에서 that절은 어떤 역할인가?", "a": "동사 meant의 목적어 역할을 하는 명사절", "p": "realized that there would be a different result"}, {"t": "for + 의미상 주어 + to부정사 : ~가 …하기 위해서", "c": "b", "x": "For an option to win in the first round는 ‘어떤 선택지가 1차 집계에서 승리하기 위해서’라는 뜻이다. to win은 목적을 나타내는 부사적 용법의 to부정사이다. to부정사의 의미상 주어는 for 뒤의 an option이다. 뒤의 it needs to get에서 it도 an option을 가리키고, need + to부정사는 ‘~해야 한다’이다.", "n": ["For + 의미상 주어 + to부정사 = ~가 …하기 위해서 (목적)", "need + to부정사 = ~해야 하다"], "q": "For an option to win에서 to win의 의미상 주어는 무엇인가?", "a": "an option", "p": "For an option to win in the first round"}, {"t": "수동태 be p.p. : ~되다 (수일치)", "c": "b", "x": "a second round of counting was required는 ‘2차 집계가 필요해졌다’는 수동태이다. 주어가 단수 round이므로 동사가 was이다. require(~을 필요로 하다)는 목적어를 받는 동사라서, 목적어가 주어 자리로 가면 be required가 된다. counting은 전치사 of 뒤에서 ‘집계’라는 뜻의 명사처럼 쓰인 -ing 형태(동명사 또는 동사파생명사)이다.", "n": ["be + p.p. = ~되다 (수동태)", "주어의 수에 동사를 일치: a round ... was"], "q": "a second round of counting was required의 동사가 was인 이유는? 능동으로 바꾸면 무엇이 목적어인가?", "a": "주어 round가 단수이기 때문. 능동이면 a second round of counting이 require의 목적어", "p": "a second round of counting was required"}, {"t": "접속사 as : ~ 때문에", "c": "b", "x": "As the charity concert only received 40% of the total votes에서 As는 이유를 나타내는 접속사로 ‘~ 때문에’라는 뜻이다. 뒤에 주어(the charity concert)와 동사(received)가 이어진다. 그래서 2차 집계가 필요했다는 결과가 뒤따른다. 다른 문장의 As a result(그 결과)와는 쓰임이 다르다.", "n": ["As + 주어 + 동사 = ~ 때문에 (이유)", "As a result = 그 결과 (결과를 나타내는 연결 표현)"], "q": "As the charity concert only received 40% ...에서 As의 뜻은?", "a": "~ 때문에 (이유를 나타내는 접속사)", "p": "As the charity concert only received 40% of the total votes"}, {"t": "접속사 while : ~인 반면에", "c": "b", "x": "option B had 11 total votes, while option C had only 9에서 while은 앞뒤 내용을 대조하는 접속사이다. ‘선택지 B는 11표를 얻은 반면에 C는 9표뿐이었다’라는 뜻이다. while 뒤에는 주어와 동사가 있는 절이 온다.", "n": ["A, while B = A인 반면에 B (대조)", "while + 주어 + 동사"], "q": "while option C had only 9에서 while은 어떤 관계를 나타내는가?", "a": "앞 내용과 대조 (~인 반면에)", "p": "while option C had only 9"}, {"t": "부사 either : (부정문에서) ~도 역시", "c": "b", "x": "the AV method is not perfect either에서 either는 부정문에서 ‘~도 역시(아니다)’의 뜻으로 쓰였다. 앞에서 FPTP 방식의 약점을 설명했으므로 ‘AV 방식도 완벽하지 않다’는 흐름이다. 긍정문에서는 either 대신 too를 쓴다.", "n": ["not ... either = 역시 ~ 아니다", "긍정문: too / 부정문: either"], "q": "not perfect either에서 either의 뜻은? 긍정문이었다면 무엇을 쓰는가?", "a": "‘역시’ (부정문에서). 긍정문에서는 too", "p": "not perfect either"}, {"t": "they = the council members (자치회 구성원들)", "c": "o", "x": "and they soon realized의 they는 앞에 나온 the council members를 가리킨다. 표를 검토한 사람들이 곧 다른 결과가 나올 것임을 깨달았다는 뜻이다.", "n": ["they = the council members", "복수 대명사 → 앞의 복수 명사에서 찾기"], "q": "they soon realized의 they는 누구인가?", "a": "자치회 구성원들 (the council members)", "p": "they"}, {"t": "It = The AV method (AV 방식)", "c": "o", "x": "It sometimes allows second-preference votes ...의 It은 바로 앞 문장의 the AV method를 가리킨다. 즉 ‘AV 방식은 때때로 2지망 표가 더 큰 영향력을 갖게 한다’는 뜻이다.", "n": ["It = the AV method", "문장 맨 앞 It → 앞 문장의 주어 확인"], "q": "It sometimes allows ...의 It은 무엇을 가리키는가?", "a": "AV 방식 (the AV method)", "p": "It"}, {"t": "eliminate · redistribute : ~을 제거하다 · ~을 재분배하다", "c": "g", "x": "eliminate(~을 제거하다, 없애다)는 본문에서 과거분사 eliminated로 쓰여 ‘제거되었다’는 수동의 뜻이다. 가장 적은 표를 받은 option A가 탈락했다는 의미이다. redistribute(~을 재분배하다)는 distribute(나누어 주다)에 re-(다시)가 붙은 말로, 본문에서는 과거분사 redistributed가 were와 함께 ‘재분배되었다’로 쓰였다.", "n": ["eliminate = 제거하다, 없애다 (eliminated: 과거형·과거분사)", "redistribute = 재분배하다 (re- 다시 + distribute 나누어 주다)"], "q": "option A was eliminated에서 eliminated는 원형이 무엇이며 어떤 뜻인가?", "a": "eliminate, ~을 제거하다 (과거분사로 수동의 뜻 ‘제거되었다’)", "p": "eliminated"}, {"t": "based on ~ · due to ~ : ~에 근거해서 · ~ 때문에", "c": "g", "x": "based on their second preferences는 ‘그들의 두 번째 선호도에 근거해서’라는 뜻이다. due to the second-preference votes는 ‘2지망 표 때문에’라는 뜻이다. 둘 다 두 단어 이상이 하나의 전치사처럼 쓰이는 표현이라서 뒤에 명사(구)가 온다.", "n": ["based on ~ = ~에 근거해서", "due to ~ = ~ 때문에 (뒤에 명사(구))"], "q": "due to 뒤에는 어떤 형태가 오는가? 본문에서 due to는 무엇 때문이라는 뜻인가?", "a": "명사(구). 2지망 표 때문에", "p": "due to the second-preference votes"}]}, {"no": 6, "id": "z6", "sents": [{"n": 40, "mk": "Finally, the student council counted the votes [1|using the Condorcet method].", "en": "Finally, the student council counted the votes using the Condorcet method.", "ko": "마지막으로, 학생 자치회는 콩도르세 방식을 사용하여 표를 집계했다."}, {"n": 41, "mk": "This method [2|involves comparing] the voters’ preferences between each possible pair of options.", "en": "This method involves comparing the voters’ preferences between each possible pair of options.", "ko": "이 방식은 가능한 선택지 쌍에 대한 투표자들의 선호도를 비교하는 것을 수반한다."}, {"n": 42, "mk": "In this case, [3|there were three pairs] to consider: A vs. B, B vs. C, and A vs. C.", "en": "In this case, there were three pairs to consider: A vs. B, B vs. C, and A vs. C.", "ko": "이 경우에는, 고려해야 할 세 쌍이 있었는데, 그것은 바로 A와 B, B와 C, A와 C였다."}, {"n": 43, "mk": "Through this method, the student council discovered [4|that] its members [5|preferred option A to option B] by a count of 11 to 9.", "en": "Through this method, the student council discovered that its members preferred option A to option B by a count of 11 to 9.", "ko": "이 방식을 통해, 학생 자치회는 구성원들이 11대 9로 선택지 B보다 선택지 A를 선호한다는 사실을 발견했다."}, {"n": 44, "mk": "[6|In other words], 11 people [5|preferred A to B], [1|voting either ABC, ACB, or CAB].", "en": "In other words, 11 people preferred A to B, voting either ABC, ACB, or CAB.", "ko": "즉, 11명이 ABC, ACB, CAB 중 하나에 투표하며 B보다 A를 선호했다."}, {"n": 45, "mk": "Meanwhile, 9 people preferred B to A by voting BAC, BCA, or CBA.", "en": "Meanwhile, 9 people preferred B to A by voting BAC, BCA, or CBA.", "ko": "한편, 9명은 BAC, BCA 또는 CBA에 투표함으로써 A보다 B를 선호했다."}, {"n": 46, "mk": "Interestingly, the voters [5|preferred option B to option C] by the same count of 11 to 9.", "en": "Interestingly, the voters preferred option B to option C by the same count of 11 to 9.", "ko": "흥미롭게도, 투표자들은 동일하게 11대 9로 선택지 C보다 선택지 B를 선호했다."}, {"n": 47, "mk": "[7|They] also [5|preferred option A to option C] by 11 to 9.", "en": "They also preferred option A to option C by 11 to 9.", "ko": "그들은 또한 11대 9로 선택지 C보다 선택지 A를 선호했다."}, {"n": 48, "mk": "[8|As] option A, the art show, was preferred to both of the other options, [9|it] would be [10|considered the winner].", "en": "As option A, the art show, was preferred to both of the other options, it would be considered the winner.", "ko": "미술 전시회인 선택지 A가 나머지 두 선택지보다 더 선호되었으므로, 이 선택지가 승자로 간주될 것이었다."}, {"n": 49, "mk": "The Condorcet method’s weakness is [4|that], along with being complex, it sometimes [11|fails to select] a winner.", "en": "The Condorcet method’s weakness is that, along with being complex, it sometimes fails to select a winner.", "ko": "콩도르세 방식의 약점은 복잡하다는 것과 더불어 때때로 승자를 가려내지 못한다는 점이다."}, {"n": 50, "mk": "This is especially true in elections [12|that] contain numerous options.", "en": "This is especially true in elections that contain numerous options.", "ko": "이는 많은 선택지를 포함하는 선거에서 특히 그렇다."}, {"n": 51, "mk": "[13|It is possible that] no option will be clearly preferred over [14|the others].", "en": "It is possible that no option will be clearly preferred over the others.", "ko": "어떤 선택지도 다른 선택지들보다 명확하게 선호되지 않을 수 있다."}], "items": [{"t": "분사구문 : 접속사 없이 -ing로 시작하는 부사 역할 구", "c": "b", "x": "using the Condorcet method는 ‘콩도르세 방식을 사용하여’라는 뜻의 분사구문이다. 의미상 주어가 the student council이고 ‘사용하는’ 주체이므로 능동의 -ing를 쓴다. voting either ABC, ACB, or CAB도 같은 방식으로 ‘~에 투표하며’라는 뜻이다. 접속사와 주어를 따로 쓰지 않고도 부수적인 동작을 덧붙일 수 있다.", "n": ["분사구문 = 접속사 + 주어를 생략하고 동사를 -ing로 바꾼 구", "능동이면 -ing, 수동이면 p.p."], "q": "using the Condorcet method에서 using을 쓴 이유는 무엇인가?", "a": "의미상 주어(학생 자치회)가 ‘사용하는’ 능동 관계라서", "p": "using the Condorcet method"}, {"t": "involve + 동명사 : ~하는 것을 수반하다", "c": "b", "x": "involves comparing에서 involve(~을 수반하다, 포함하다)는 목적어로 동명사를 취한다. 따라서 to compare가 아니라 comparing이다. 이 문장은 ‘이 방식은 선호도를 비교하는 것을 수반한다’는 뜻이다. 주어가 This method로 3인칭 단수이므로 동사에 s가 붙었다.", "n": ["involve + -ing = ~하는 것을 수반하다", "동명사를 목적어로 취하는 동사 : involve, avoid, enjoy, finish ..."], "q": "involve 뒤에는 to부정사와 동명사 중 무엇이 오는가?", "a": "동명사", "p": "involves comparing"}, {"t": "There + be동사 + 주어 : 유도부사 구문과 수일치", "c": "k", "x": "there were three pairs에서 there는 ‘거기에’라는 뜻이 아니라 문장을 이끄는 유도부사이다. 진짜 주어는 be동사 뒤의 three pairs이다. 주어가 복수라서 동사도 복수형인 were를 썼다. 과거 이야기라서 과거형 were이다.", "n": ["There + be + 주어 = ~이 있다 (be동사는 뒤의 주어에 수일치)", "there is/was + 단수, there are/were + 복수"], "q": "there were three pairs에서 진짜 주어는 무엇이고 동사 were는 왜 복수인가?", "a": "진짜 주어는 three pairs이고 복수라서 복수동사 were를 쓴다", "p": "there were three pairs"}, {"t": "명사절 접속사 that : ~라는 것", "c": "b", "x": "discovered that its members preferred ...에서 that절은 discovered의 목적어 역할을 하는 명사절이다. ‘~라는 사실을 발견했다’로 해석한다. is that, along with being complex, it ...에서는 that절이 be동사 뒤에서 보어 역할을 한다. 두 경우 모두 that 뒤에는 완전한 문장(주어 + 동사)이 온다.", "n": ["that + 완전한 절 = ~라는 것 (명사절 : 주어·목적어·보어 역할)", "discover/say/think + that절 = 목적어절"], "q": "discovered that its members preferred ...에서 that절은 어떤 역할인가?", "a": "discovered의 목적어 역할을 하는 명사절", "p": "that its members preferred option A to option B"}, {"t": "prefer A to B : A를 B보다 선호하다", "c": "g", "x": "prefer는 ‘~을 더 좋아하다, 선호하다’라는 뜻의 동사이다. 비교 대상을 than이 아니라 to로 연결해서 prefer A to B가 된다. preferred option A to option B는 ‘선택지 B보다 선택지 A를 선호했다’라는 뜻이다. preferred는 prefer의 과거형이다.", "n": ["prefer A to B = A를 B보다 선호하다", "prefer의 과거형·과거분사형 = preferred"], "q": "prefer A to B에서 B 앞에 than을 쓸 수 있는가? 비교 대상을 잇는 말은?", "a": "쓸 수 없다. than이 아니라 to로 잇는다", "p": "preferred option A to option B"}, {"t": "in other words : 바꿔 말하면, 즉", "c": "g", "x": "in other words는 앞의 내용을 다른 말로 다시 풀어 줄 때 쓰는 연결 표현이다. 이 글에서는 앞 문장의 ‘A를 B보다 선호했다’는 내용을 구체적인 투표 수로 다시 설명한다. 해석은 ‘즉’이나 ‘바꿔 말하면’으로 한다.", "n": ["in other words = 바꿔 말하면, 즉", "앞 내용을 다시 풀어 설명할 때 쓰는 연결 표현"], "q": "in other words는 글에서 어떤 역할을 하는가?", "a": "앞 내용을 바꿔 말하며 다시 설명한다", "p": "In other words"}, {"t": "They = the voters (투표자들)", "c": "o", "x": "They also preferred option A to option C의 They는 바로 앞 문장의 the voters를 가리킨다. 복수 대명사라서 단수인 option이나 council이 아니라 ‘투표자들’을 받는다. 그래서 ‘투표자들은 또한 ~을 선호했다’로 해석한다.", "n": ["They = the voters (투표자들)", "대명사 → 앞 문장에서 가리키는 대상 찾기"], "q": "They also preferred option A to option C의 They는 누구인가?", "a": "투표자들 (the voters)", "p": "They"}, {"t": "접속사 as : ~이기 때문에", "c": "b", "x": "As option A, the art show, was preferred ...에서 As는 ‘~이기 때문에’라는 이유를 나타내는 접속사이다. 뒤에 option A ... was preferred라는 주어와 동사가 있는 절이 이어진다. 그래서 ‘A가 더 선호되었으므로’라고 해석한다. 같은 as가 ‘~할 때’, ‘~처럼’의 뜻으로도 쓰이니 문맥으로 구분한다.", "n": ["As + 주어 + 동사 = ~이기 때문에 (이유)", "as는 시간(~할 때)·방식(~처럼)의 뜻도 있으니 문맥으로 판단"], "q": "As option A ... was preferred에서 As의 뜻은 무엇인가?", "a": "~이기 때문에 (이유의 접속사)", "p": "As option A, the art show, was preferred to both of the other options"}, {"t": "it = option A (선택지 A)", "c": "o", "x": "it would be considered the winner의 it은 앞의 As절 주어인 option A를 가리킨다. option A, the art show에서 the art show는 option A와 같은 대상을 다시 설명하는 동격 표현이다. 따라서 ‘미술 전시회인 선택지 A가 승자로 간주될 것이다’라는 뜻이다.", "n": ["it = option A (the art show)", "option A, the art show : 콤마로 덧붙인 동격 표현"], "q": "it would be considered the winner의 it은 무엇인가?", "a": "선택지 A (미술 전시회)", "p": "it"}, {"t": "consider A B의 수동태 : A가 B로 여겨지다", "c": "k", "x": "능동문 consider A the winner(A를 승자로 여기다)는 5형식 문장이다. 이것을 수동태로 바꾸면 A가 주어가 되고 보어 the winner는 be considered 뒤에 그대로 남는다. 그래서 it would be considered the winner가 된다. ‘그것은 승자로 간주될 것이다’라는 뜻이다. 보어는 목적어가 아니므로 수동태에서도 사라지지 않는다.", "n": ["consider + O + C = O를 C로 여기다 (5형식)", "수동태 : O + be considered + C = O가 C로 여겨지다"], "q": "consider A the winner를 수동태로 바꾸면 어떻게 되는가?", "a": "A is considered the winner", "p": "would be considered the winner"}, {"t": "fail to + 동사원형 : ~하지 못하다", "c": "g", "x": "fail to select a winner는 ‘승자를 가려내지 못하다’라는 뜻이다. fail은 to부정사를 목적어로 취하고, fail to V 전체가 ‘~하는 데 실패하다’라는 의미를 만든다. 주어 it이 3인칭 단수이고 현재 시제이므로 fails로 쓴다.", "n": ["fail to V = ~하는 데 실패하다, ~하지 못하다", "fail 뒤에는 to부정사가 온다"], "q": "fail 뒤에 목적어로 오는 형태는 to부정사와 동명사 중 무엇인가? 이 문장의 뜻은?", "a": "to부정사. 승자를 가려내지 못한다", "p": "fails to select a winner"}, {"t": "주격 관계대명사 that : 선행사를 꾸미는 절", "c": "b", "x": "elections that contain numerous options에서 that은 앞의 elections를 꾸미는 관계대명사이고, that절 안에서 주어 역할을 한다. 선행사 elections가 복수라서 관계사절의 동사도 복수형 contain을 쓴다. 해석은 ‘많은 선택지를 포함하는 선거’이다.", "n": ["선행사 + that + 동사 = ~하는 (주격 관계대명사)", "관계사절의 동사는 선행사의 수에 일치"], "q": "elections that contain numerous options에서 contain에 s가 붙지 않은 이유는?", "a": "선행사 elections가 복수이기 때문", "p": "elections that contain numerous options"}, {"t": "가주어-진주어 구문 : It is possible that ~", "c": "k", "x": "It is possible that no option will be clearly preferred ...에서 It은 가주어이고, 진짜 주어는 뒤의 that절이다. that절이 길어서 뒤로 보내고 It을 앞에 둔 것이다. 해석은 ‘~일 수 있다’로 한다. 이 문장의 it은 앞 문장의 어떤 대상을 가리키는 대명사가 아니라는 점에 주의한다.", "n": ["It is + 형용사 + that절 = ~라는 것은 …하다 (가주어-진주어)", "가주어 it은 해석하지 않는다"], "q": "It is possible that ...의 It은 무엇이고 진짜 주어는 무엇인가?", "a": "It은 가주어, 진짜 주어는 that절", "p": "It is possible that no option will be clearly preferred"}, {"t": "the others : 나머지 모두", "c": "k", "x": "over the others에서 the others는 정해진 범위 안에서 ‘나머지 전부’를 뜻하며, 여기서는 나머지 선택지들을 가리킨다. 나머지가 하나일 때는 the other를 쓴다. 앞에서 the other options가 ‘나머지 두 선택지’였던 것도 같은 원리이다. 범위가 정해지지 않은 막연한 ‘다른 것들’은 others라고 한다.", "n": ["the other = 나머지 하나 / the others = 나머지 모두", "others = 막연한 다른 것들 / another = 불특정한 또 하나"], "q": "the other와 the others는 어떻게 다른가?", "a": "the other는 나머지 하나, the others는 나머지 모두", "p": "the others"}]}, {"no": 7, "id": "z7", "sents": [{"n": 52, "mk": "[1|Instead of all methods pointing toward] a single option and [2|making the council’s choice easier], the winner [3|differed] with each method.", "en": "Instead of all methods pointing toward a single option and making the council’s choice easier, the winner differed with each method.", "ko": "모든 방식이 하나의 선택지를 가리키고 자치회의 선택을 더 쉽게 만드는 대신, 각 방식마다 승자는 달랐다."}, {"n": 53, "mk": "After a long, [4|intense] discussion with Ms. Akers, the student council members decided to choose the Condorcet method, as they liked the idea of directly comparing each option with the others.", "en": "After a long, intense discussion with Ms. Akers, the student council members decided to choose the Condorcet method, as they liked the idea of directly comparing each option with the others.", "ko": "Akers 선생님과의 오랜 열정적인 논의 끝에, 학생 자치회 구성원들은 콩도르세 방식을 선택하기로 결정했는데, 각 선택지를 다른 선택지들과 직접적으로 비교한다는 점이 마음에 들었기 때문이다."}, {"n": 54, "mk": "Everyone agreed that they learned a lot about different voting systems through this experience.", "en": "Everyone agreed that they learned a lot about different voting systems through this experience.", "ko": "모두가 이번 경험을 통해 각기 다른 투표 시스템에 대해 많은 것을 배웠다는 것에 동의했다."}, {"n": 55, "mk": "[5|It is obvious that] [6|choosing an ideal voting method] is a complex and challenging task.", "en": "It is obvious that choosing an ideal voting method is a complex and challenging task.", "ko": "이상적인 투표 방법을 선택하는 것은 복잡하고 도전적인 일이라는 것은 분명하다."}, {"n": 56, "mk": "[7|No voting system] is flawless or clearly superior to another.", "en": "No voting system is flawless or clearly superior to another.", "ko": "어떤 투표 시스템도 완벽하거나 다른 시스템보다 명백히 우수하지는 않다."}, {"n": 57, "mk": "[8|Whichever] we choose will have [9|pros and cons].", "en": "Whichever we choose will have pros and cons.", "ko": "우리가 선택하는 어느 것이든 장단점이 있을 것이다."}, {"n": 58, "mk": "Some people believe that [5|it is best to keep] the process simple by not ranking our choices at all.", "en": "Some people believe that it is best to keep the process simple by not ranking our choices at all.", "ko": "어떤 사람들은 우리들의 선택들에 아예 순위를 매기지 않음으로써 과정을 단순하게 유지하는 것이 최선이라고 생각한다."}, {"n": 59, "mk": "Others continue to develop and test new ways of voting, arguing that more complex methods deliver more accurate results.", "en": "Others continue to develop and test new ways of voting, arguing that more complex methods deliver more accurate results.", "ko": "다른 사람들은 더 복잡한 방식이 더 정확한 결과를 가져온다고 주장하며 계속해서 새로운 투표 방법을 개발하고 시험한다."}, {"n": 60, "mk": "All of these efforts are designed [10|not t       var seen={},rows='',re=/\[(\d+)\|/g,m;
      while((m=re.exec(x.mk))){var ix=+m[1];if(s.items[ix-1].c==k&&!seen[ix]){seen[ix]=1;var it=s.items[ix-1];
        rows+='<div class="rv c-'+k+'"><div class="q"><span class="hl" style="font-weight:700">'+esc(it.p)+'</span><div style="margin-top:3px">'+esc(it.q)+'</div></div><div class="a"><div class="at">'+esc(it.a)+'</div>'+noteBox(it.n)+'<div class="ex">'+esc(it.x)+'</div></div></div>'}}
      h+='<div class="card"><div class="no">'+x.n+'</div><div style="font-size:16px;line-height:1.8">'+marks(x.mk,s,'color',k)+'</div><div class="sub" style="margin:3px 0 4px">'+esc(x.ko)+'</div>'+rows+'</div>'});
  });
  return h}
function vMain(){
  var s=sec(),a=s.sents[0].n,b=s.sents[s.sents.length-1].n;
  var h='<div class="psel">'+D.secs.map(function(x){return '<button type="button" data-s="'+x.no+'" class="'+(S.sec==x.no?'on':'')+'">본문 '+x.no+'</button>'}).join('')+'</div>';
  h+='<h2>본문 '+s.no+'</h2><div class="sub" style="margin-bottom:8px">'+a+'~'+b+'번</div>';
  h+='<div class="lab">형광펜 이름별로 모아보기</div>'+drillBar('');
  h+='<div class="card">'+s.sents.map(function(x){return '<div class="ps" id="ps-'+x.n+'"><i>'+x.n+'</i><span>'+marks(x.mk,s,'all',null,x.n)+'</span></div>'}).join('')+'</div>';
  h+=s.items.map(function(it,i){var q=firstSent(s,i+1);
    return '<div class="it c-'+it.c+'" id="it-'+(i+1)+'"><h4><span class="tl">'+esc(it.t)+'</span><span class="tag">'+CAT[it.c]+'</span></h4>'+
    '<div class="quote">'+q.n+'. '+marks(q.mk,s,'item',i+1)+'<div class="qk">'+esc(q.ko)+'</div></div>'+
    noteBox(it.n)+'<p>'+esc(it.x)+'</p><button type="button" class="bkb" data-back="'+(i+1)+'">↑ 본문으로 돌아가기</button></div>'}).join('');
  return h}
function render(){
  var top='<div class="top"><a href="../../index.html" id="bk">‹ 원문</a><h1>교과서 3과 문법 분석</h1></div>';
  document.getElementById('app').innerHTML=top+(S.drill?vDrill():vMain());
  window.scrollTo(0,0)}
function goTo(el){if(!el)return;el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}
var BK={n:null,i:null,sn:null};
document.addEventListener('click',function(e){
  var hk=e.target.closest('.hlk');if(hk){BK.n=S.sec;BK.sn=hk.dataset.sn;BK.i=hk.dataset.i;goTo(document.getElementById('it-'+hk.dataset.i));return}
  var bb=e.target.closest('.bkb');if(bb){var i=bb.dataset.back,s=sec(),tgt=(BK.i==i&&BK.n==s.no&&BK.sn)?BK.sn:firstSent(s,i).n;goTo(document.getElementById('ps-'+tgt));return}
  var rv=e.target.closest('.rv');if(rv){rv.classList.toggle('open');return}
  var bk=e.target.closest('#bk');if(bk){try{if(history.length>1&&document.referrer&&document.referrer.indexOf(location.host)>=0){e.preventDefault();history.back()}}catch(x){}return}
  var d=e.target.closest('[data-dr]');if(d){S.drill=d.dataset.dr||null;render();return}
  var p=e.target.closest('[data-s]');if(p){S.sec=+p.dataset.s;render();return}
});
render();
</script></body></html>
