</style></head><body class="notranslate"><div class="wrap" id="app"></div><script id="data" type="application/json">{"title": "유의어 꽉잡기", "sub": "24년 10월 모의고사 · 35단어", "key": "jusung-go2:yk:2410_g2", "sec": 0, "pass": [{"label": "24년 10월 22번 별의 질량은 어떻게 잴까", "sents": [{"en": "To determine the mass of my bowling ball, I might put it onto a balance and compare it with a known mass, such as a number of metal cubes each weighing 1, 10, or 100 grams.", "ko": "내 볼링공의 질량을 알아내려면, 나는 그것을 저울에 올려놓고 각각 1그램, 10그램, 100그램이 나가는 여러 개의 금속 큐브처럼 이미 알고 있는 질량과 비교할 수 있다."}, {"en": "Things get much more complicated if I want to know the mass of a distant star.", "ko": "내가 먼 별의 질량을 알고 싶다면 상황은 훨씬 더 복잡해진다."}, {"en": "How do I measure it?", "ko": "나는 그것을 어떻게 측정할까?"}, {"en": "We can roughly say that measuring the mass of a star involves various theories.", "ko": "별의 질량을 측정하는 일에는 여러 이론이 들어간다고 대략 말할 수 있다."}, {"en": "If we want to measure the mass of a binary star, we first determine a center of mass between the two stars, then their distance from that center which we can then use, together with a value for the period and a certain instance of Kepler’s Third Law, to calculate the mass.", "ko": "쌍성의 질량을 재고 싶다면, 우리는 먼저 두 별 사이의 질량 중심을 알아내고, 그다음 그 중심으로부터 두 별까지의 거리를 알아낸 뒤, 그 거리를 공전 주기 값과 케플러 제3법칙의 특정한 경우와 함께 써서 질량을 계산한다."}, {"en": "In other words, in order to “measure” the star mass, we measure other quantities and use those values, together with certain equations, to calculate the mass.", "ko": "다시 말해, 별의 질량을 '측정'하려고 우리는 다른 양들을 재고 그 값들을 특정한 방정식과 함께 써서 질량을 계산한다."}, {"en": "Measurement is not a simple and unmediated estimation of independently existing properties, but a determination of certain magnitudes before the background of a number of accepted theories.", "ko": "측정은 독립적으로 존재하는 속성을 단순하고 직접적으로 어림하는 일이 아니라, 받아들여진 여러 이론을 배경으로 특정한 크기를 결정하는 일이다."}]}, {"label": "24년 10월 23번 고통과 쾌락은 한 저울의 양 끝", "sents": [{"en": "Based on discoveries in neuroscience, pain and pleasure are formed and processed in the same area of the brain.", "ko": "신경과학의 발견에 따르면, 고통과 쾌락은 뇌의 같은 영역에서 만들어지고 처리된다."}, {"en": "Our bodies constantly strive for homeostasis, which is defined as the balance of bodily functions.", "ko": "우리 몸은 끊임없이 항상성을 추구하는데, 항상성은 몸의 기능들이 균형을 이루는 상태로 정의된다."}, {"en": "Without the body’s effective compensatory mechanisms, which may cushion potential highs and lows, we would not be capable of surviving.", "ko": "잠재적인 기복을 완화해 줄 수 있는 몸의 효과적인 보상 기제가 없다면, 우리는 살아남을 수 없을 것이다."}, {"en": "Pleasure and pain are like two sides of the same coin; they seem to work together and are heavily reliant on one another and keep balance.", "ko": "쾌락과 고통은 같은 동전의 양면과 같아서, 함께 작동하고 서로에게 크게 의존하며 균형을 유지하는 것 같다."}, {"en": "If you imagine pleasure and pain as the two opposite points on a scale, you can easily understand that as one of the two points rises, the other must correspondingly fall.", "ko": "쾌락과 고통을 저울 위의 반대쪽 두 지점이라고 상상하면, 두 지점 중 하나가 올라가면 다른 하나는 그에 맞춰 내려갈 수밖에 없다는 것을 쉽게 이해할 수 있다."}, {"en": "We’ve all heard the expression, “No pain, no gain.”", "ko": "우리는 모두 \"고통 없이는 얻는 것도 없다\"라는 표현을 들어 본 적이 있다."}, {"en": "Well, according to psychiatrist Dr. Anna Lembke, there may be some truth to these words.", "ko": "자, 정신과 의사 Anna Lembke 박사에 따르면, 이 말에는 어느 정도 진실이 있을 수 있다."}, {"en": "She says that our attempts to escape being miserable are in fact making us even more miserable.", "ko": "그녀는 비참함에서 벗어나려는 우리의 시도가 사실은 우리를 훨씬 더 비참하게 만들고 있다고 말한다."}, {"en": "This is because pain is actually an essential component of our ability to maintain a neutral state, and allowing it will in turn reset our internal scale back to balance.", "ko": "이는 고통이 실제로 중립 상태를 유지하는 우리 능력의 필수 요소이고, 고통을 허용하면 결국 우리 내부의 저울이 다시 균형으로 맞춰지기 때문이다."}]}, {"label": "24년 10월 24번 끝없는 업그레이드 욕구", "sents": [{"en": "Manufacturers masterfully sow seeds of doubt about the adequacy of our current devices.", "ko": "제조업체들은 우리가 지금 쓰는 기기가 충분한지에 대한 의심의 씨앗을 노련하게 뿌린다."}, {"en": "Suddenly, the phone that was your lifeline a year ago is now a museum piece, unable to keep pace with your digital demands.", "ko": "갑자기, 1년 전 당신의 생명줄이던 휴대폰이 이제는 당신의 디지털 요구를 따라가지 못하는 박물관 유물이 된다."}, {"en": "And thus, the itch to upgrade begins, often before there’s a genuine need.", "ko": "그래서 업그레이드하고 싶은 욕구가, 흔히 진짜 필요가 생기기도 전에 시작된다."}, {"en": "This cycle isn’t just confined to our digital companions.", "ko": "이 순환은 우리의 디지털 동반자에만 국한되지 않는다."}, {"en": "It spills over into almost every aspect of consumer electronics, from the self-driving car to the smart fridge.", "ko": "그것은 자율주행차부터 스마트 냉장고까지 소비자 전자제품의 거의 모든 영역으로 번져 나간다."}, {"en": "Every product seems to be on an unstoppable march towards the next version, the next generation that promises to revolutionize your life.", "ko": "모든 제품이 다음 버전, 즉 당신의 삶을 혁신하겠다고 약속하는 다음 세대를 향해 멈출 수 없는 행진을 하는 것 같다."}, {"en": "What’s fascinating, or perhaps disturbing, is the utter efficacy of this cycle in shaping our desires.", "ko": "흥미로운, 어쩌면 불안한 점은 우리의 욕구를 만들어 내는 이 순환의 엄청난 효과다."}, {"en": "It’s not so much that we want the newest device; we’re led to believe we need it.", "ko": "우리가 최신 기기를 원한다기보다는, 우리가 그것이 필요하다고 믿도록 이끌린다."}, {"en": "The distinction between want and need blurs, shifting our financial priorities in favor of staying current with trends.", "ko": "원하는 것과 필요한 것의 구분이 흐려지고, 그것이 유행을 따라가는 쪽으로 우리의 재정 우선순위를 바꾼다."}, {"en": "For all the logical arguments against this ceaseless upgrading, the temptation remains compelling.", "ko": "이런 끝없는 업그레이드에 반대하는 온갖 논리적 주장에도 불구하고, 그 유혹은 여전히 강하다."}]}, {"label": "24년 10월 29번 동물이 원하는 걸 알아내는 실험", "sents": [{"en": "Conditioned Place Preference is a way of finding out what animals want.", "ko": "조건부 장소 선호는 동물이 무엇을 원하는지 알아내는 한 가지 방법이다."}, {"en": "Researchers train them to associate one place with an experience such as food or a loud noise and another place with something completely different, usually where nothing happens.", "ko": "연구자들은 동물들이 한 장소를 먹이나 시끄러운 소리 같은 경험과 연결하고, 다른 장소는 완전히 다른 것, 보통 아무 일도 일어나지 않는 것과 연결하도록 훈련시킨다."}, {"en": "The two places are made obviously different to make it as easy as possible for the animal to associate each place with what happened to it there.", "ko": "두 장소는 동물이 각 장소를 거기서 겪은 일과 최대한 쉽게 연결하도록 확실히 다르게 만들어진다."}, {"en": "The animal’s preference for being in one place or another is measured both before and after its experiences in the two places.", "ko": "한 장소나 다른 장소에 있는 것에 대한 동물의 선호는 두 장소에서 경험하기 전과 후에 모두 측정된다."}, {"en": "If there is a shift in where the animal chooses to spend its time for the reward, this suggests that it liked the experience and is trying to repeat it.", "ko": "동물이 보상을 위해 시간을 보내기로 선택하는 곳에 변화가 생기면, 이는 동물이 그 경험을 좋아했고 그것을 반복하려 한다는 뜻이다."}, {"en": "Conversely, if it now avoids the place the stimulus appeared and starts to prefer the place it did not experience it, then this suggests that it found the stimulus unpleasant.", "ko": "반대로, 동물이 이제 자극이 나타났던 장소를 피하고 그것을 겪지 않은 장소를 좋아하기 시작한다면, 이는 그 자극이 불쾌했다는 뜻이다."}, {"en": "For example, mice with cancer show a preference for the place where they have been given morphine, a drug used to relieve pain, rather than where they have received saline whereas healthy mice developed no such preference.", "ko": "예를 들어, 암에 걸린 쥐는 식염수를 맞은 곳보다 통증 완화에 쓰는 약인 모르핀을 맞은 곳을 더 좋아하는 반면, 건강한 쥐에게는 그런 선호가 생기지 않았다."}, {"en": "This suggests that the mice with cancer wanted the morphine.", "ko": "이는 암에 걸린 쥐가 모르핀을 원했다는 뜻이다."}]}, {"label": "24년 10월 30번 새의 번식기", "sents": [{"en": "Near the equator, many species of bird breed all year round.", "ko": "적도 근처에서는 많은 종의 새들이 일 년 내내 번식한다."}, {"en": "But in temperate and polar regions, the breeding seasons of birds are often sharply defined.", "ko": "그러나 온대와 극지방에서는 새들의 번식기가 흔히 뚜렷하게 정해져 있다."}, {"en": "They are triggered mainly by changes in day length.", "ko": "번식기는 주로 낮 길이의 변화로 시작된다."}, {"en": "If all goes well, the outcome is that birds raise their young when the food supply is at its peak.", "ko": "모든 것이 잘되면, 그 결과 새들은 먹이 공급이 가장 많을 때 새끼를 기른다."}, {"en": "Most birds are not simply reluctant to breed at other times but they are also physically incapable of doing so.", "ko": "대부분의 새들은 다른 때에 번식하기를 단지 꺼리는 것이 아니라 신체적으로도 그렇게 할 수 없다."}, {"en": "This is because their reproductive system shrinks, which helps flying birds save weight.", "ko": "이는 새들의 번식 기관이 줄어들기 때문인데, 그것은 나는 새들이 무게를 줄이는 데 도움이 된다."}, {"en": "The main exception to this rule are nomadic desert species.", "ko": "이 규칙의 주요 예외는 떠돌이 사막 종들이다."}, {"en": "These can initiate their breeding cycle within days of rain.", "ko": "이들은 비가 온 지 며칠 안에 번식 주기를 시작할 수 있다."}, {"en": "It’s for making the most of the sudden breeding opportunity.", "ko": "그것은 갑자기 찾아온 번식 기회를 최대한 활용하기 위한 것이다."}, {"en": "Also, different species divide the breeding season up in different ways.", "ko": "또한 종마다 번식기를 나누는 방식이 다르다."}, {"en": "Most seabirds raise a single brood.", "ko": "대부분의 바닷새는 한 번만 새끼를 기른다."}, {"en": "In warm regions, however, songbirds may raise several families in a few months.", "ko": "그러나 따뜻한 지역에서는 명금류가 몇 달 동안 여러 번 새끼를 기르기도 한다."}, {"en": "In an exceptionally good year, a pair of House Sparrows, a kind of songbird, can raise successive broods through a marathon reproductive effort.", "ko": "유난히 좋은 해에는 명금류의 한 종류인 참새 한 쌍이 마라톤 같은 번식 노력으로 연달아 새끼를 길러 낼 수 있다."}]}, {"label": "24년 10월 33번 읽기란 무엇인가", "sents": [{"en": "Some people argue that there is a single, logically consistent concept known as reading that can be neatly set apart from everything else people do with books.", "ko": "어떤 사람들은 사람들이 책으로 하는 다른 모든 일과 깔끔하게 구분될 수 있는, 읽기라는 하나의 논리적으로 일관된 개념이 있다고 주장한다."}, {"en": "Is reading really that simple?", "ko": "읽기는 정말 그렇게 단순할까?"}, {"en": "The most productive way to think about reading is as a loosely related set of behaviors that belong together owing to family resemblances, as Ludwig Wittgenstein used the phrase, without having in common a single defining trait.", "ko": "읽기를 생각하는 가장 생산적인 방법은, Ludwig Wittgenstein이 그 표현을 쓴 의미대로, 하나의 정의적 특징을 공유하지 않고도 가족 유사성 때문에 함께 묶이는 느슨하게 연결된 행동들의 집합으로 보는 것이다."}, {"en": "Consequently, efforts to distinguish reading from nonreading are destined to fail because there is no agreement on what qualifies as reading in the first place.", "ko": "그 결과, 읽기와 읽기가 아닌 것을 구분하려는 노력은 실패할 수밖에 없는데, 애초에 무엇이 읽기로 인정되는지에 대한 합의가 없기 때문이다."}, {"en": "The more one tries to figure out where the border lies between reading and not-reading, the more edge cases will be found to stretch the term’s flexible boundaries.", "ko": "읽기와 읽기가 아닌 것의 경계가 어디인지 알아내려 할수록, 그 용어의 유연한 경계를 늘리는 경계 사례가 더 많이 발견될 것이다."}, {"en": "Thus, it is worth attempting to collect together these exceptional forms of reading into a single forum, one highlighting the challenges faced by anyone wishing to establish the boundaries where reading begins and ends.", "ko": "따라서 이런 예외적인 읽기 형태들을 하나의 토론의 장으로 모아 보는 시도는 해 볼 가치가 있는데, 그것은 읽기가 어디서 시작하고 끝나는지 경계를 정하려는 누구나가 마주하는 어려움을 드러내 준다."}, {"en": "The attempt moves toward an understanding of reading as a spectrum that is expansive enough to accommodate the distinct reading activities.", "ko": "그 시도는 서로 다른 읽기 활동들을 다 담을 만큼 넓은 스펙트럼으로 읽기를 이해하는 방향으로 나아간다."}]}], "items": [{"id": "mock_2410_g2:m2410g2-01", "p": 0, "s": 0, "w": "determine", "h": "determine", "pos": "동", "m": "(재거나 계산해서) 알아내다", "form": "", "syn": [["find out", "알아내다"], ["measure", "측정하다"]], "ant": [], "trap": [["decide", "결정하다", "determine의 다른 뜻 '결정하다'와 같은 말"], ["resolve", "결심하다", "determine의 다른 뜻 '(be determined to) 결심하다'와 비슷한 말"]], "dis": [["lift", "들어 올리다"]], "other": [["결정하다", "Your effort determines your future.", "너의 노력이 네 미래를 결정한다."]], "tip": "determine the mass(질량을 알아내다)의 determine은 '결정하다' 아님", "story": "볼링공의 질량을 알아내려고 저울에 올리는 얘기에서 나온 단어"}, {"id": "mock_2410_g2:m2410g2-02", "p": 0, "s": 0, "w": "balance", "h": "balance", "pos": "명", "m": "저울", "form": "", "syn": [["scale", "저울"]], "ant": [], "trap": [["stability", "안정, 균형", "balance의 흔한 뜻 '균형'과 비슷한 말"], ["harmony", "조화", "balance의 흔한 뜻 '균형'과 비슷한 말"]], "dis": [["telescope", "망원경"], ["ladder", "사다리"]], "other": [["균형", "She lost her balance and fell.", "그녀는 균형을 잃고 넘어졌다."], ["(통장) 잔액", "Check your bank balance.", "통장 잔액을 확인해라."]], "tip": "put it onto a balance(저울에 올리다) function wrongs(){return sget('wrong',[])}
function setWrong(k,bad){var w=wrongs(),i=w.indexOf(k);if(bad&&i<0)w.push(k);if(!bad&&i>=0)w.splice(i,1);sset('wrong',w)}
function speak(w){try{var u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
var S=null;
function home(){S=null;clearInterval(TM);var w=wrongs(),pv=sget('prac',null),px=sget('real',null),ex=sget('exam',null);
 var h='<h1 lang="ko">'+esc(D.title)+'</h1><div class="sub">'+esc(D.sub)+'</div>';
 h+='<button class="mcard" onclick="startPrac(0)"><b>관계 지도 연습</b><span>'+(pv?('이어서 · '+(pv.i+1)+' / '+pv.q.length):'한 문제씩 풀고 · 바로 지도로 확인')+'</span></button>';
 if(w.length)h+='<button class="chipb" onclick="startPrac(1)">틀린 '+w.length+'개만 다시</button>';
 h+='<button class="mcard" onclick="startReal()"><b>실전 예행연습</b><span>'+(px?('이어서 · '+(px.i+1)+' / '+px.q.length):'시험처럼 한번에 · 틀린 것만 다시')+'</span></button>';
 h+='<button class="mcard" onclick="startExam()"><b>시험</b><span>'+(ex&&ex.done?('응시 완료 · '+ex.score+' / '+ex.q.length):'1회 · 타임어택'+(IT.length>25?' · 25문제':''))+'</span></button>';
 h+='<div class="small" style="margin:14px 4px">'+IT.length+'단어 · 틀린 단어 '+w.length+'개</div>';
 if(ex&&ex.done)h+='<button class="go sec" id="rx" onclick="twoTap(this,resetExam)">시험 기록 지우기</button>';
 $('app').innerHTML=h;window.scrollTo(0,0)}
function twoTap(b,f){if(b.getAttribute('data-a')){f();return}b.setAttribute('data-a',1);b.textContent='한 번 더 누르면 지워져요';setTimeout(function(){if(b){b.removeAttribute('data-a');b.textContent='시험 기록 지우기'}},2500)}
function resetExam(){sdel('exam');home()}
/* 관계 지도 연습 */
function startPrac(only){var pv=sget('prac',null);if(!only&&pv){S=pv;S.mode='prac'}else{var ks=only?shuf(wrongs()):shuf(IT.map(function(x,i){return i}));S={mode:'prac',only:!!only,i:0,q:ks.map(mk)}}rPrac()}
function qCard(q,interactive){var it=IT[q.k],s=sent(it),o=optsOf(it);
 var h='<div class="card"><div class="src">'+esc(D.pass[it.p].label)+'</div><div class="sen" lang="en" translate="no">'+under(s.en,it.w)+'</div>';
 if(q.rev)h+='<div class="ko">'+esc(s.ko)+'</div>';
 h+='<div class="q">밑줄 친 단어와 바꿔 쓸 수 있는 것 모두</div>';
 if(!q.rev){h+='<div class="opts">';q.o.forEach(function(oi){var x=o[oi];h+='<button class="opt'+(q.sel[oi]?' sel':'')+'" lang="en" translate="no" '+(interactive?'onclick="tg('+oi+')"':'')+'>'+esc(x.w)+'</button>'});h+='</div>'}
 return h+'</div>'}
function tg(oi){var q=S.q[S.i];q.sel[oi]=!q.sel[oi];save();(S.mode=='prac'?rPrac:rReal)()}
function save(){if(S.mode=='prac'&&!S.only)sset('prac',S);if(S.mode=='real')sset('real',S);if(S.mode=='exam')sset('exam',S)}
function anySel(q){for(var k in q.sel)if(q.sel[k])return true;return false}
function topBar(t){var n=S.q.length;return '<div class="top"><b>'+t+'</b><span>'+(S.i+1)+' / '+n+'</span><button class="hb" onclick="home()">처음으로</button></div><div class="bar"><i style="width:'+(S.i/n*100)+'%"></i></div>'}
function rPrac(){var q=S.q[S.i],last=S.i>=S.q.length-1,h=topBar(S.only?'틀린 것 다시':'관계 지도 연습');
 if(!q.rev){h+=qCard(q,true)+'<button class="go" '+(anySel(q)?'':'disabled')+' onclick="chk()">확인</button>'}
 else{var ok=isOK(q);h+='<div class="band '+(ok?'ok':'ng')+'">'+(ok?'정답':'오답')+'</div>'+qCard(q,false)+mapCard(q)+'<button class="go" onclick="nxt()">'+(last?'결과 보기':'다음 문제')+'</button>'}
 h+='<button class="go sec" onclick="home()">목록으로</button>';
 $('app').innerHTML=h;window.scrollTo(0,0);if(q.rev)setTimeout(drawAll,30)}
function chk(){var q=S.q[S.i];q.rev=true;var ok=isOK(q);if(S.only){if(ok){q.ok=1}setWrong(q.k,!ok)}else setWrong(q.k,!ok);save();rPrac()}
function nxt(){if(S.i>=S.q.length-1){var ok=S.q.filter(isOK).length,n=S.q.length;if(!S.only)sdel('prac');$('app').innerHTML='<div class="band '+(ok==n?'ok':'ng')+'">'+n+'개 중 '+ok+'개 정답<small>틀린 단어는 "틀린 것만 다시"에 모여 있어요</small></div><button class="go" onclick="home()">목록으로</button>';return}S.i++;save();rPrac()}
/* 관계 지도 */
function chip(x,cls,tag,tc,extra){return '<button class="mw '+cls+'" onclick="speak(\''+x.w.replace(/'/g,"\\'")+'\')"><span class="e" lang="en" translate="no">'+esc(x.w)+'</span>'+(tag?'<i class="'+tc+'">'+tag+'</i>':'')+'<span class="k">'+esc(x.m)+'</span>'+(extra||'')+'</button>'}
function mapCard(q){var it=IT[q.k],o=optsOf(it),st=function(i){var x=o[i],s=!!q.sel[i];if(x.g=='syn')return s?['맞힘','g']:['놓침','b'];return s?['잘못 고름','b']:['',''];};
 var L='',R='',T='',X='';
 o.forEach(function(x,i){var t=st(i),miss=(x.g=='syn'&&!q.sel[i])?' miss':'';
  if(x.g=='syn')L+=chip(x,'l'+miss,t[0],t[1]);
  else if(x.g=='ant')R+=chip(x,'r',t[0]||'반대',t[0]?t[1]:'b');
  else if(x.g=='trap')T+=chip(x,'t',t[0]||'함정',t[0]?t[1]:'m','<span class="tr">'+esc(x.r||'')+'</span>');
  else X+=chip(x,'d',t[0],t[1]);});
 var h='<div class="card"><div class="map"><svg></svg><div class="mc"><b lang="en" translate="no">'+esc(it.h)+'</b><em>본문 뜻: '+esc(it.m)+'</em></div>';
 h+='<div class="cols"><div class="col"><h4>바꿔 쓸 수 있음</h4>'+L+'</div><div class="col"><h4>반대 뜻</h4>'+(R||'<div class="small">없음</div>')+'</div></div></div>';
 if(T||X)h+='<div class="lower">'+(T?'<h4>다른 뜻 함정</h4>'+T:'')+(X?'<h4>관계없음</h4>'+X:'')+'</div>';
 if(it.form)h+='<div class="small" style="margin-top:8px">'+esc(it.w)+' = '+esc(it.form)+'</div>';
 if(it.other&&it.other.length){h+='<div class="oth"><b>'+esc(it.h)+'의 다른 뜻</b>';it.other.forEach(function(x){h+='<div><b style="display:inline;color:#1f2430;font-size:.92rem">'+esc(x[0])+'</b> <span class="ex" lang="en" translate="no">'+esc(x[1])+'</span><div class="ex">'+esc(x[2])+'</div></div>'});h+='</div>'}
 if(it.tip)h+='<div class="tip">'+esc(it.tip)+'</div>';
 if(it.story)h+='<div class="post"><small>본문 기억</small>'+esc(it.story)+'</div>';
 return h+'</div>'}
function drawAll(){[].forEach.call(document.querySelectorAll('.map'),function(map){var svg=map.querySelector('svg'),mc=map.querySelector('.mc'),m=map.getBoundingClientRect();if(!m.width)return;svg.setAttribute('width',m.width);svg.setAttribute('height',m.height);var c=mc.getBoundingClientRect(),sx=c.left-m.left+c.width/2,sy=c.bottom-m.top-2,h='';
 [].forEach.call(map.querySelectorAll('.mw.l,.mw.r'),function(b){var r=b.getBoundingClientRect(),L=b.classList.contains('l'),ex=(L?r.right:r.left)-m.left,ey=r.top-m.top+r.height/2;h+='<path class="'+(L?'ls':'ra')+(b.classList.contains('miss')?' miss':'')+'" d="M'+sx+' '+sy+' Q'+sx+' '+ey+' '+ex+' '+ey+'"/>'});svg.innerHTML=h})}
window.addEventListener('resize',function(){setTimeout(drawAll,50)});
/* 실전 예행연습 / 시험 공통 */
function startReal(){var px=sget('real',null);if(px&&!px.done){S=px}else{S={mode:'real',i:0,q:shuf(IT.map(function(x,i){return i})).map(mk)}}rReal()}
var TM=null;
function startExam(){var ex=sget('exam',null);if(ex&&ex.done){S=ex;showRes();return}if(ex){S=ex}else{var ks=shuf(IT.map(function(x,i){return i})).slice(0,25);S={mode:'exam',i:0,q:ks.map(mk),end:Date.now()+ks.length*20000};save()}rReal();clearInterval(TM);TM=setInterval(tick,500)}
function tick(){if(!S||S.mode!='exam'){clearInterval(TM);return}var r=Math.max(0,Math.round((S.end-Date.now())/1000));var e=$('tm');if(e)e.textContent=Math.floor(r/60)+':'+('0'+r%60).slice(-2);if(r<=0){clearInterval(TM);fin()}}
function rReal(){var q=S.q[S.i],last=S.i>=S.q.length-1,h=topBar(S.mode=='exam'?'시험 <span class="timer" id="tm"></span>':'실전 예행연습');
 h+=qCard(q,true);
 h+='<div style="display:flex;gap:8px">'+(S.i>0?'<button class="go sec" style="flex:1" onclick="mv(-1)">이전</button>':'')+'<button class="go" style="flex:2" onclick="'+(last?'fin()':'mv(1)')+'">'+(last?'제출':'다음')+'</button></div>';
 if(S.mode!='exam')h+='<button class="go sec" onclick="home()">목록으로</button>';
 $('app').innerHTML=h;window.scrollTo(0,0);if(S.mode=='exam')tick()}
function mv(d){S.i+=d;save();rReal()}
function fin(){clearInterval(TM);S.q.forEach(function(q){q.rev=true;setWrong(q.k,!isOK(q))});S.done=1;S.score=S.q.filter(isOK).length;if(S.mode=='real')sdel('real');else save();showRes()}
function showRes(){var n=S.q.length,ok=S.score,bad=S.q.filter(function(q){return !isOK(q)});
 var h='<div class="top"><b>'+(S.mode=='exam'?'시험 결과':'실전 예행연습 결과')+'</b><button class="hb" style="margin-left:auto" onclick="home()">처음으로</button></div>';
 h+='<div class="band '+(ok==n?'ok':'ng')+'">'+n+'개 중 '+ok+'개 정답</div>';
 if(bad.length){h+='<div class="small" style="margin:4px 2px 8px">틀린 단어</div>';bad.forEach(function(q){h+=qCard(q,false)+mapCard(q)})}
 if(bad.length&&S.mode=='real')h+='<button class="go" onclick="startPrac(1)">틀린 것만 다시</button>';
 h+='<button class="go sec" onclick="home()">목록으로</button>';$('app').innerHTML=h;window.scrollTo(0,0);setTimeout(drawAll,30)}
home();
</script></body></html>
