</style></head><body class="notranslate"><div class="wrap" id="app"></div><script id="data" type="application/json">{"title": "유의어 꽉잡기", "sub": "영어II 4과 · 24단어", "key": "jusung-go2:yk:L4", "sec": 0, "pass": [{"label": "4과 ① 고장 난 노트북, 버려야 할까?", "sents": [{"en": "On her way to a study group meeting, Liz accidentally dropped her laptop on the street, seriously damaging it.", "ko": "스터디 그룹 모임에 가는 길에 Liz는 실수로 노트북을 길에 떨어뜨려 심하게 망가뜨렸다."}, {"en": "Although it still turns on, the screen is cracked, and some keys are not working.", "ko": "노트북은 여전히 켜지기는 하지만, 화면은 금이 갔고 몇몇 키는 작동하지 않는다."}, {"en": "She can have it repaired, but she is hesitating to do so.", "ko": "그녀는 그것을 수리할 수 있지만, 그렇게 하기를 망설이고 있다."}, {"en": "Sometimes repairs are expensive, and they often take a long time.", "ko": "수리는 때때로 비용이 많이 들고, 종종 오랜 시간이 걸린다."}, {"en": "Besides, the laptop is about five years old.", "ko": "게다가 그 노트북은 5년 정도 되었다."}, {"en": "In this case, getting rid of the old one and purchasing a new one might seem like a more reasonable option.", "ko": "이런 경우라면 오래된 노트북은 버리고 새것을 사는 것이 더 합리적인 선택처럼 보일 수 있다."}, {"en": "In reality, however, it may not be the best thing to do.", "ko": "하지만 실제로는 그것이 최선이 아닐 수도 있다."}, {"en": "If Liz throws her laptop in the trash, she will be contributing to a serious problem: e-waste.", "ko": "만약 Liz가 노트북을 쓰레기통에 버린다면, 그녀는 전자 쓰레기라는 심각한 문제에 일조하게 될 것이다."}]}, {"label": "4과 ② 전자 쓰레기와 수리가 어려운 이유", "sents": [{"en": "What exactly is e-waste?", "ko": "전자 쓰레기란 정확히 무엇인가?"}, {"en": "The term refers to discarded electronic devices and electrical appliances.", "ko": "이 용어는 버려진 전자 장치와 전기 기기를 가리킨다."}, {"en": "Due to toxic materials contained in these products, such as lead, e-waste is a serious health and environmental hazard.", "ko": "이 제품들에 들어 있는 납 같은 유독성 물질 때문에 전자 쓰레기는 심각한 건강·환경 위험 요소이다."}, {"en": "To make matters worse, the amount of e-waste produced each year is increasing at an alarming rate.", "ko": "설상가상으로 매년 생산되는 전자 쓰레기의 양이 걱정스러운 속도로 늘고 있다."}, {"en": "In 2021, a total of 57.4 million metric tons of e-waste was generated worldwide, which was a 37% increase from 2014, the year when data about e-waste was first collected.", "ko": "2021년 전 세계적으로 총 5,740만 메트릭톤의 전자 쓰레기가 발생했는데, 이는 전자 쓰레기 자료가 처음 수집된 해인 2014년보다 37% 증가한 것이었다."}, {"en": "Experts predict that by 2030, the amount of e-waste generated annually will have doubled in just 16 years.", "ko": "전문가들은 2030년이 되면 매년 발생하는 전자 쓰레기의 양이 불과 16년 만에 두 배가 될 것으로 예측한다."}, {"en": "For this reason, efforts are being made to address this problem, most of which are focused on making products easier to repair.", "ko": "이런 이유로 이 문제를 해결하려는 노력이 이루어지고 있는데, 그 대부분은 제품을 더 수리하기 쉽게 만드는 데 초점을 두고 있다."}, {"en": "Let's take a look at some practical approaches from around the world.", "ko": "전 세계의 몇 가지 현실적인 접근법을 살펴보자."}, {"en": "One reason many people dispose of their damaged devices is that they are too difficult to repair.", "ko": "많은 사람이 고장 난 장치를 버리는 한 가지 이유는 그것들이 수리하기 너무 어렵기 때문이다."}, {"en": "For example, a device may be difficult to disassemble, or its manufacturer may require that it be brought to an official service center to be fixed.", "ko": "예를 들어 어떤 장치는 분해하기 어렵거나, 제조사가 수리하려면 공식 서비스 센터로 가져오라고 요구할 수도 있다."}]}, {"label": "4과 ③ 수리할 권리 운동과 네 가지 요구", "sents": [{"en": "Many companies do not allow their customers to take their damaged items to third-party repair shops.", "ko": "많은 회사는 고객이 고장 난 물건을 제삼자 수리점에 가져가는 것을 허용하지 않는다."}, {"en": "What is more, some products are intentionally designed to be difficult to repair.", "ko": "게다가 어떤 제품들은 일부러 수리하기 어렵게 설계된다."}, {"en": "It is common for consumers to be unable to acquire the instructions for how to fix their items or the parts needed to complete repairs.", "ko": "소비자들이 물건 고치는 방법에 대한 설명서나 수리에 필요한 부품을 구하지 못하는 것은 흔한 일이다."}, {"en": "The right-to-repair movement is trying to solve these problems by promoting legislation that states the following: If you own a product, you have the right to fix it yourself or bring it to a technician of your choice.", "ko": "수리할 권리 운동은 다음 내용을 담은 법 제정을 추진해 이 문제들을 해결하려 한다: 제품을 소유하고 있다면 직접 고치거나 원하는 기술자에게 가져갈 권리가 있다."}, {"en": "To protect the rights of consumers, the right-to-repair movement demands four things.", "ko": "소비자의 권리를 보호하기 위해 수리할 권리 운동은 네 가지를 요구한다."}, {"en": "First, companies must make information about their products available to everyone.", "ko": "첫째, 회사들은 자기 제품에 대한 정보를 모든 사람이 이용할 수 있게 해야 한다."}, {"en": "Second, third parties, including individuals, should be able to obtain the parts and tools required to make repairs.", "ko": "둘째, 개인을 포함한 제삼자도 수리에 필요한 부품과 도구를 구할 수 있어야 한다."}, {"en": "Third, the practice of preventing consumers from installing custom software on their own devices should be prohibited by law.", "ko": "셋째, 소비자가 자기 기기에 맞춤형 소프트웨어를 설치하지 못하게 막는 관행은 법으로 금지되어야 한다."}, {"en": "Finally, it demands that manufacturers design devices in a way that makes repairs as easy as possible.", "ko": "마지막으로, 이 운동은 제조사들이 수리를 최대한 쉽게 하는 방식으로 기기를 설계할 것을 요구한다."}, {"en": "Advocates of the movement say that if all these goals are accomplished, far less e-waste will be generated.", "ko": "이 운동의 지지자들은 이 모든 목표가 이루어지면 전자 쓰레기가 훨씬 덜 발생할 것이라고 말한다."}, {"en": "Thanks to their efforts, more than 40 states in the U.S. have begun working on right-to-repair legislation.", "ko": "그들의 노력 덕분에 미국의 40개가 넘는 주가 수리할 권리 법 제정 작업을 시작했다."}, {"en": "This movement is gaining a growing influence in Europe as well, with more and more countries joining the cause.", "ko": "이 운동은 점점 더 많은 나라가 그 대의에 동참하면서 유럽에서도 영향력을 키우고 있다."}]}, {"label": "4과 ④ 프랑스의 수리 가능성 지수", "sents": [{"en": "In January 2021, the French government passed a bill that requires that every manufacturer include a “repairability index” on five categories of electronic devices and electrical appliances: smartphones, laptops, washing machines, televisions, and lawn mowers.", "ko": "2021년 1월 프랑스 정부는 모든 제조사가 스마트폰, 노트북, 세탁기, 텔레비전, 잔디 깎는 기계의 다섯 가지 전자·전기 제품에 '수리 가능성 지수'를 표시하도록 하는 법안을 통과시켰다."}, {"en": "Using a score ranging from 0 to 10, as well as a color-coded system, the index lets consumers see how easily the product can be repaired before they purchase it.", "ko": "이 지수는 0에서 10까지의 점수와 색깔 표시 체계를 사용해 소비자가 제품을 사기 전에 얼마나 쉽게 수리할 수 있는지 알 수 있게 해 준다."}, {"en": "The index takes into account several elements, including the availability of repair information, the ease of disassembly, and the price of spare parts.", "ko": "이 지수는 수리 정보를 구할 수 있는지, 분해가 쉬운지, 여분 부품 가격 등 여러 요소를 고려한다."}, {"en": "A low number on a bright red label means that repairing the product will be difficult, whereas a high number on a green label indicates that the product is easy to repair.", "ko": "밝은 빨간색 라벨의 낮은 숫자는 수리가 어렵다는 뜻이고, 초록색 라벨의 높은 숫자는 수리가 쉽다는 뜻이다."}, {"en": "The index was designed to have two positive effects.", "ko": "이 지수는 두 가지 긍정적인 효과를 내도록 만들어졌다."}, {"en": "Firstly, it allows consumers to make informed decisions when purchasing new devices and appliances.", "ko": "첫째, 이 지수는 소비자가 새 기기를 살 때 정보에 근거한 결정을 내릴 수 있게 해 준다."}, {"en": "Secondly, it encourages manufacturers to make their products easier to repair.", "ko": "둘째, 이 지수는 제조사가 제품을 더 수리하기 쉽게 만들도록 장려한다."}, {"en": "As a result, with fewer electronic and electrical items ending up in its landfills, France can expect to make a transition to a more sustainable society in the near future.", "ko": "그 결과 쓰레기 매립지로 가는 전자·전기 제품이 줄어들면서 프랑스는 가까운 미래에 더 지속 가능한 사회로 바뀔 것을 기대할 수 있다."}, {"en": "The impact of the index, however, is likely to spread far beyond France.", "ko": "하지만 이 지수의 영향은 프랑스를 훨씬 넘어 퍼질 가능성이 높다."}, {"en": "We live in a global economy, and any company that wants to sell its appliances on the French market will need to label its products according to the repairability index.", "ko": "우리는 세계 경제 속에 살고 있어서, 프랑스 시장에서 기기를 팔고 싶은 회사라면 어디든 수리 가능성 지수에 따라 제품에 라벨을 붙여야 할 것이다."}, {"en": "If the index is successful, we can anticipate seeing more countries around the world following France’s innovative lead.", "ko": "이 지수가 성공한다면, 전 세계의 더 많은 나라가 프랑스의 혁신적인 선례를 따르는 것을 기대할 수 있다."}]}, {"label": "4과 ⑤ 수리 카페의 시작과 확산", "sents": [{"en": "When consumers are given the right tools and materials, along with some helpful advice, they can repair much of the damage that occurs to electronic products by themselves.", "ko": "소비자에게 알맞은 도구와 재료, 그리고 유용한 조언이 주어지면 그들은 전자 제품에 생기는 손상의 상당 부분을 스스로 고칠 수 있다."}, {"en": "That is why Repair Cafés were started.", "ko": "그래서 수리 카페가 시작되었다."}, {"en": "They are free meeting places where people can gather together and fix their broken devices.", "ko": "수리 카페는 사람들이 함께 모여 고장 난 기기를 고칠 수 있는 무료 모임 장소이다."}, {"en": "The cafés are staffed by volunteer experts who can give technical advice and teach people how to fix things.", "ko": "이 카페에는 기술적 조언을 해 주고 물건 고치는 법을 가르쳐 줄 수 있는 자원봉사 전문가들이 있다."}, {"en": "The first Repair Café was opened in the Netherlands in the city of Amsterdam in 2009.", "ko": "최초의 수리 카페는 2009년 네덜란드 암스테르담에서 문을 열었다."}, {"en": "It was such a success that the idea soon spread to neighboring countries.", "ko": "그것은 크게 성공해서 그 아이디어가 곧 이웃 나라들로 퍼졌다."}, {"en": "Before long, there were Repair Cafés in over 30 countries around the world.", "ko": "얼마 지나지 않아 전 세계 30개가 넘는 나라에 수리 카페가 생겼다."}, {"en": "Along with preventing damaged items from becoming e-waste, these cafés also encourage people to share their invaluable skills and knowledge about the repair and maintenance of electronics.", "ko": "이 카페들은 고장 난 물건이 전자 쓰레기가 되는 것을 막을 뿐 아니라, 사람들이 전자 제품 수리와 관리에 대한 소중한 기술과 지식을 나누도록 장려한다."}, {"en": "They continue to grow in popularity, with more and more people signing up to volunteer.", "ko": "자원봉사를 신청하는 사람이 점점 늘면서 이 카페들은 계속 인기를 얻고 있다."}, {"en": "By providing spaces where people can learn, Repair Cafés enable individuals to maintain their devices and extend their life spans.", "ko": "사람들이 배울 수 있는 공간을 제공함으로써 수리 카페는 개인이 자기 기기를 관리하고 수명을 늘릴 수 있게 한다."}, {"en": "Furthermore, they foster a sustainable perspective that can have a huge positive impact on our future.", "ko": "게다가 수리 카페는 우리의 미래에 엄청난 긍정적 영향을 줄 수 있는 지속 가능한 관점을 키워 준다."}]}, {"label": "4과 ⑥ 수리가 일상인 세상 상상하기", "sents": [{"en": "Do you remember Liz, the girl who dropped her laptop?", "ko": "노트북을 떨어뜨린 소녀 Liz를 기억하는가?"}, {"en": "Imagine she lived in a world where repairing damaged devices and appliances was simply part of everyday life.", "ko": "그녀가 손상된 기기를 수리하는 것이 그저 일상의 일부인 세상에 살고 있다고 상상해 보라."}, {"en": "If that were the case, her options wouldn’t be limited to paying for expensive repairs or throwing away her laptop and buying a new one.", "ko": "만약 그렇다면 그녀의 선택지는 비싼 수리비를 내거나 노트북을 버리고 새것을 사는 것으로 제한되지 않을 것이다."}, {"en": "She would be able to order the necessary parts online and replace them herself.", "ko": "그녀는 필요한 부품을 온라인으로 주문해 직접 교체할 수 있을 것이다."}, {"en": "Alternatively, she could bring her damaged device to the nearest Repair Café to get advice on how to fix it.", "ko": "아니면 고치는 방법에 대한 조언을 얻으러 가장 가까운 수리 카페에 고장 난 기기를 가져갈 수도 있을 것이다."}, {"en": "Repairing it probably wouldn’t be very hard, and she likely would have purchased a laptop with a high repairability score.", "ko": "노트북을 수리하는 것은 아마 그리 어렵지 않을 것이고, 그녀는 아마 수리 가능성 점수가 높은 노트북을 샀을 것이다."}, {"en": "In fact, this sustainable world is a future we can all enjoy if we work toward it together.", "ko": "사실 이 지속 가능한 세상은 우리가 함께 노력하면 모두가 누릴 수 있는 미래이다."}, {"en": "Even more importantly, it is a future in which people will generate far less e-waste, making our planet a cleaner, healthier place for everyone.", "ko": "더 중요한 것은 그것이 사람들이 전자 쓰레기를 훨씬 덜 만들어 지구를 모두에게 더 깨끗하고 건강한 곳으로 만드는 미래라는 점이다."}]}], "items": [{"id": "g2L4-01", "p": 0, "s": 0, "w": "accidentally", "h": "accidentally", "pos": "부", "m": "실수로, 우연히", "form": "", "syn": [["by accident", "실수로, 우연히"], ["unintentionally", "의도치 않게"]], "ant": [["on purpose", "일부러"], ["intentionally", "의도적으로"]], "trap": [], "dis": [["rapidly", "빠르게"]], "other": [], "tip": "accidentally = by accident ↔ on purpose = intentionally (같은 과 ③에 intentionally 등장)", "story": "Liz가 스터디 모임 가다가 실수로 노트북을 떨어뜨린 얘기에서 나온 단어"}, {"id": "g2L4-02", "p": 0, "s": 5, "w": "purchasing", "h": "purchase", "pos": "동", "m": "사다, 구입하다", "form": "동사 purchase의 -ing형 (getting rid of와 and로 연결된 동명사 주어)", "syn": [["bu  h+='<button class="mcard" onclick="startPrac(0)"><b>관계 지도 연습</b><span>'+(pv?('이어서 · '+(pv.i+1)+' / '+pv.q.length):'한 문제씩 풀고 · 바로 지도로 확인')+'</span></button>';
 if(w.length)h+='<button class="chipb" onclick="startPrac(1)">틀린 '+w.length+'개만 다시</button>';
 h+='<button class="mcard" onclick="startReal()"><b>실전 예행연습</b><span>'+(px?('이어서 · '+(px.i+1)+' / '+px.q.length):'시험처럼 한번에 · 틀린 것만 다시')+'</span></button>';
 h+='<button class="mcard" onclick="startExam()"><b>시험</b><span>'+(ex&&ex.done?('응시 완료 · '+ex.score+' / '+ex.q.length):'1회 · 타임어택'+(IT.length>25?' · 25문제':''))+'</span></button>';
 h+='<div class="small" style="margin:14px 4px">'+IT.length+'단어 · 틀린 단어 '+w.length+'개</div>';
 if(ex&&ex.done)h+='<button class="go sec" id="rx" onclick="twoTap(this,resetExam)">시험 기록 지우기</button>';
 $('app').innerHTML=h;window.scrollTo(0,0)}
function twoTap(b,f){if(b.getAttribute('data-a')){f();return}b.setAttribute('data-a',1);b.textContent='한 번 더 누르면 지워져요';setTimeout(function(){if(b){b.removeAttribute('data-a');b.textContent='시험 기록 지우기'}},2500)}
function resetExam(){sdel('exam');home()}
/* 관계 지도 연습 */
function startPrac(only){var pv=sget('prac',null);if(!only&&pv){S=pv;S.mode='prac'}else{var ks=only?shuf(wrongs()):shuf(IT.map(function(x,i){return i}));S={mode:'prac',only:!!only,i:0,q:ks.map(mk)}}rPrac()}
function qCard(q,interactive){var it=IT[q.k],s=sent(it),o=optsOf(it);
 var h='<div class="card"><div class="src">'+esc(D.pass[it.p].label)+'</div><div class="sen" lang="en" translate="no">'+under(s.en,it.w)+'</div>';
 if(q.rev)h+='<div class="ko">'+esc(s.ko)+'</div>';
 h+='<div class="q">밑줄 친 단어와 바꿔 쓸 수 있는 것 모두</div>';
 if(!q.rev){h+='<div class="opts">';q.o.forEach(function(oi){var x=o[oi];h+='<button class="opt'+(q.sel[oi]?' sel':'')+'" lang="en" translate="no" '+(interactive?'onclick="tg('+oi+')"':'')+'>'+esc(x.w)+'</button>'});h+='</div>'}
 return h+'</div>'}
function tg(oi){var q=S.q[S.i];q.sel[oi]=!q.sel[oi];save();(S.mode=='prac'?rPrac:rReal)()}
function save(){if(S.mode=='prac'&&!S.only)sset('prac',S);if(S.mode=='real')sset('real',S);if(S.mode=='exam')sset('exam',S)}
function anySel(q){for(var k in q.sel)if(q.sel[k])return true;return false}
function topBar(t){var n=S.q.length;return '<div class="top"><b>'+t+'</b><span>'+(S.i+1)+' / '+n+'</span><button class="hb" onclick="home()">처음으로</button></div><div class="bar"><i style="width:'+(S.i/n*100)+'%"></i></div>'}
function rPrac(){var q=S.q[S.i],last=S.i>=S.q.length-1,h=topBar(S.only?'틀린 것 다시':'관계 지도 연습');
 if(!q.rev){h+=qCard(q,true)+'<button class="go" '+(anySel(q)?'':'disabled')+' onclick="chk()">확인</button>'}
 else{var ok=isOK(q);h+='<div class="band '+(ok?'ok':'ng')+'">'+(ok?'정답':'오답')+'</div>'+qCard(q,false)+mapCard(q)+'<button class="go" onclick="nxt()">'+(last?'결과 보기':'다음 문제')+'</button>'}
 h+='<button class="go sec" onclick="home()">목록으로</button>';
 $('app').innerHTML=h;window.scrollTo(0,0);if(q.rev)setTimeout(drawAll,30)}
function chk(){var q=S.q[S.i];q.rev=true;var ok=isOK(q);if(S.only){if(ok){q.ok=1}setWrong(q.k,!ok)}else setWrong(q.k,!ok);save();rPrac()}
function nxt(){if(S.i>=S.q.length-1){var ok=S.q.filter(isOK).length,n=S.q.length;if(!S.only)sdel('prac');$('app').innerHTML='<div class="band '+(ok==n?'ok':'ng')+'">'+n+'개 중 '+ok+'개 정답<small>틀린 단어는 "틀린 것만 다시"에 모여 있어요</small></div><button class="go" onclick="home()">목록으로</button>';return}S.i++;save();rPrac()}
/* 관계 지도 */
function chip(x,cls,tag,tc,extra){return '<button class="mw '+cls+'" onclick="speak(\''+x.w.replace(/'/g,"\\'")+'\')"><span class="e" lang="en" translate="no">'+esc(x.w)+'</span>'+(tag?'<i class="'+tc+'">'+tag+'</i>':'')+'<span class="k">'+esc(x.m)+'</span>'+(extra||'')+'</button>'}
function mapCard(q){var it=IT[q.k],o=optsOf(it),st=function(i){var x=o[i],s=!!q.sel[i];if(x.g=='syn')return s?['맞힘','g']:['놓침','b'];return s?['잘못 고름','b']:['',''];};
 var L='',R='',T='',X='';
 o.forEach(function(x,i){var t=st(i),miss=(x.g=='syn'&&!q.sel[i])?' miss':'';
  if(x.g=='syn')L+=chip(x,'l'+miss,t[0],t[1]);
  else if(x.g=='ant')R+=chip(x,'r',t[0]||'반대',t[0]?t[1]:'b');
  else if(x.g=='trap')T+=chip(x,'t',t[0]||'함정',t[0]?t[1]:'m','<span class="tr">'+esc(x.r||'')+'</span>');
  else X+=chip(x,'d',t[0],t[1]);});
 var h='<div class="card"><div class="map"><svg></svg><div class="mc"><b lang="en" translate="no">'+esc(it.h)+'</b><em>본문 뜻: '+esc(it.m)+'</em></div>';
 h+='<div class="cols"><div class="col"><h4>바꿔 쓸 수 있음</h4>'+L+'</div><div class="col"><h4>반대 뜻</h4>'+(R||'<div class="small">없음</div>')+'</div></div></div>';
 if(T||X)h+='<div class="lower">'+(T?'<h4>다른 뜻 함정</h4>'+T:'')+(X?'<h4>관계없음</h4>'+X:'')+'</div>';
 if(it.form)h+='<div class="small" style="margin-top:8px">'+esc(it.w)+' = '+esc(it.form)+'</div>';
 if(it.other&&it.other.length){h+='<div class="oth"><b>'+esc(it.h)+'의 다른 뜻</b>';it.other.forEach(function(x){h+='<div><b style="display:inline;color:#1f2430;font-size:.92rem">'+esc(x[0])+'</b> <span class="ex" lang="en" translate="no">'+esc(x[1])+'</span><div class="ex">'+esc(x[2])+'</div></div>'});h+='</div>'}
 if(it.tip)h+='<div class="tip">'+esc(it.tip)+'</div>';
 if(it.story)h+='<div class="post"><small>본문 기억</small>'+esc(it.story)+'</div>';
 return h+'</div>'}
function drawAll(){[].forEach.call(document.querySelectorAll('.map'),function(map){var svg=map.querySelector('svg'),mc=map.querySelector('.mc'),m=map.getBoundingClientRect();if(!m.width)return;svg.setAttribute('width',m.width);svg.setAttribute('height',m.height);var c=mc.getBoundingClientRect(),sx=c.left-m.left+c.width/2,sy=c.bottom-m.top-2,h='';
 [].forEach.call(map.querySelectorAll('.mw.l,.mw.r'),function(b){var r=b.getBoundingClientRect(),L=b.classList.contains('l'),ex=(L?r.right:r.left)-m.left,ey=r.top-m.top+r.height/2;h+='<path class="'+(L?'ls':'ra')+(b.classList.contains('miss')?' miss':'')+'" d="M'+sx+' '+sy+' Q'+sx+' '+ey+' '+ex+' '+ey+'"/>'});svg.innerHTML=h})}
window.addEventListener('resize',function(){setTimeout(drawAll,50)});
/* 실전 예행연습 / 시험 공통 */
function startReal(){var px=sget('real',null);if(px&&!px.done){S=px}else{S={mode:'real',i:0,q:shuf(IT.map(function(x,i){return i})).map(mk)}}rReal()}
var TM=null;
function startExam(){var ex=sget('exam',null);if(ex&&ex.done){S=ex;showRes();return}if(ex){S=ex}else{var ks=shuf(IT.map(function(x,i){return i})).slice(0,25);S={mode:'exam',i:0,q:ks.map(mk),end:Date.now()+ks.length*20000};save()}rReal();clearInterval(TM);TM=setInterval(tick,500)}
function tick(){if(!S||S.mode!='exam'){clearInterval(TM);return}var r=Math.max(0,Math.round((S.end-Date.now())/1000));var e=$('tm');if(e)e.textContent=Math.floor(r/60)+':'+('0'+r%60).slice(-2);if(r<=0){clearInterval(TM);fin()}}
function rReal(){var q=S.q[S.i],last=S.i>=S.q.length-1,h=topBar(S.mode=='exam'?'시험 <span class="timer" id="tm"></span>':'실전 예행연습');
 h+=qCard(q,true);
 h+='<div style="display:flex;gap:8px">'+(S.i>0?'<button class="go sec" style="flex:1" onclick="mv(-1)">이전</button>':'')+'<button class="go" style="flex:2" onclick="'+(last?'fin()':'mv(1)')+'">'+(last?'제출':'다음')+'</button></div>';
 if(S.mode!='exam')h+='<button class="go sec" onclick="home()">목록으로</button>';
 $('app').innerHTML=h;window.scrollTo(0,0);if(S.mode=='exam')tick()}
function mv(d){S.i+=d;save();rReal()}
function fin(){clearInterval(TM);S.q.forEach(function(q){q.rev=true;setWrong(q.k,!isOK(q))});S.done=1;S.score=S.q.filter(isOK).length;if(S.mode=='real')sdel('real');else save();showRes()}
function showRes(){var n=S.q.length,ok=S.score,bad=S.q.filter(function(q){return !isOK(q)});
 var h='<div class="top"><b>'+(S.mode=='exam'?'시험 결과':'실전 예행연습 결과')+'</b><button class="hb" style="margin-left:auto" onclick="home()">처음으로</button></div>';
 h+='<div class="band '+(ok==n?'ok':'ng')+'">'+n+'개 중 '+ok+'개 정답</div>';
 if(bad.length){h+='<div class="small" style="margin:4px 2px 8px">틀린 단어</div>';bad.forEach(function(q){h+=qCard(q,false)+mapCard(q)})}
 if(bad.length&&S.mode=='real')h+='<button class="go" onclick="startPrac(1)">틀린 것만 다시</button>';
 h+='<button class="go sec" onclick="home()">목록으로</button>';$('app').innerHTML=h;window.scrollTo(0,0);setTimeout(drawAll,30)}
home();
</script><a href="../index.html" style="position:fixed;right:12px;bottom:12px;z-index:9999;background:#1d4ed8;color:#fff;font:700 13px/1 sans-serif;padding:11px 14px;border-radius:22px;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.3)">⌂ 목록</a></body></html>
