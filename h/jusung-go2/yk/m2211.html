</style></head><body class="notranslate"><div class="wrap" id="app"></div><script id="data" type="application/json">{"title": "유의어 꽉잡기", "sub": "22년 11월 모의고사 · 46단어", "key": "jusung-go2:yk:2211_g2", "sec": 0, "pass": [{"label": "22년 11월 29번 경쟁자보다 먼저 움직이는 선점 전략", "sents": [{"en": "Pre-emption means that a strategy is designed to prevent a rival from starting some particular activity.", "ko": "선점이란 경쟁자가 어떤 특정한 활동을 시작하지 못하게 막도록 설계된 전략을 뜻한다."}, {"en": "In some case a pre-emptive move may simply be an announcement of some intent that might discourage rivals from doing the same.", "ko": "어떤 경우에는 선점 조치가 경쟁자들이 같은 일을 하지 못하게 단념시킬 수 있는 어떤 의도를 발표하는 것만으로 이루어지기도 한다."}, {"en": "The idea of pre-emption implies that timing is sometimes very important — a decision or an action at one point in time might be much more rewarding than doing it at a different time point.", "ko": "선점이라는 개념은 타이밍이 때로 매우 중요하다는 것을 암시한다. 어느 한 시점의 결정이나 행동이 다른 시점에 그것을 하는 것보다 훨씬 더 큰 보상을 줄 수 있다."}, {"en": "Pre-emption may involve up-weighting advertising for a period before and during when a new entrant launches into a market.", "ko": "선점은 신규 진입자가 시장에 진출하기 전과 진출하는 동안 일정 기간 광고 비중을 높이는 것을 포함할 수 있다."}, {"en": "The intent is to make it more difficult for the new entrant’s advertising to make an impression on potential buyers.", "ko": "그 의도는 신규 진입자의 광고가 잠재 구매자들에게 인상을 남기기 더 어렵게 만드는 것이다."}, {"en": "Product proliferation is another potential pre-emption strategy.", "ko": "제품 확산은 또 다른 잠재적 선점 전략이다."}, {"en": "The general idea is to launch a large variety of product variants so that there is very little in the way of market demand that is not accommodated.", "ko": "일반적인 생각은 아주 다양한 제품 변형을 출시해서 충족되지 않는 시장 수요가 거의 없게 만드는 것이다."}, {"en": "Arguably, if a market is already filled with product variants it is more difficult for competitors to find untapped pockets of market demand.", "ko": "거의 틀림없이, 시장이 이미 제품 변형들로 가득 차 있다면 경쟁자들은 아직 손대지 않은 수요의 틈새를 찾기 더 어렵다."}]}, {"label": "22년 11월 30번 카운터셰이딩 위장", "sents": [{"en": "Countershading is the process of optical flattening that provides camouflage to animals.", "ko": "카운터셰이딩은 동물에게 위장을 제공하는, 시각적으로 납작하게 보이게 하는 과정이다."}, {"en": "When sunlight illuminates an object from above, the object will be brightest on top.", "ko": "햇빛이 물체를 위에서 비추면, 물체는 맨 위가 가장 밝다."}, {"en": "The color of the object will gradually shade darker toward the bottom.", "ko": "물체의 색은 아래쪽으로 갈수록 점점 더 어둡게 음영이 진다."}, {"en": "This shading gives the object depth and allows the viewer to distinguish its shape.", "ko": "이 음영은 물체에 입체감을 주고, 보는 사람이 그 모양을 알아보게 해 준다."}, {"en": "Thus even if an animal is exactly, but uniformly, the same color as the substrate, it will be easily visible when illuminated.", "ko": "따라서 동물이 바탕과 정확히, 하지만 균일하게 같은 색이라 해도, 빛을 받으면 쉽게 눈에 띌 것이다."}, {"en": "Most animals, however, are darker above than they are below.", "ko": "그러나 대부분의 동물은 아래쪽보다 위쪽이 더 어둡다."}, {"en": "When they are illuminated from above, the darker back is lightened and the lighter belly is shaded.", "ko": "동물이 위에서 빛을 받으면, 더 어두운 등은 밝아지고 더 밝은 배는 그늘진다."}, {"en": "The animal thus appears to be a single color and easily blends in with the substrate.", "ko": "그래서 동물은 한 가지 색처럼 보이고 바탕에 쉽게 섞여 든다."}, {"en": "This pattern of coloration, or countershading, destroys the visual impression of shape in the organism.", "ko": "이런 배색 형태, 즉 카운터셰이딩은 생물의 모양에 대한 시각적 인상을 없앤다."}, {"en": "It allows the animal to blend in with its background.", "ko": "그것은 동물이 배경과 섞여 들게 해 준다."}]}, {"label": "22년 11월 31번 놀람이 학습을 이끈다", "sents": [{"en": "No learning is possible without an error signal.", "ko": "오류 신호 없이는 어떤 학습도 가능하지 않다."}, {"en": "Organisms only learn when events violate their expectations.", "ko": "유기체는 사건이 자신의 예상을 벗어날 때만 학습한다."}, {"en": "In other words, surprise is one of the fundamental drivers of learning.", "ko": "다시 말해, 놀람은 학습의 근본적인 동력 중 하나이다."}, {"en": "Imagine hearing a series of identical notes, AAAAA.", "ko": "AAAAA처럼 똑같은 음이 연속으로 나오는 것을 듣는다고 상상해 보라."}, {"en": "Each note draws out a response in the auditory areas of your brain — but as the notes repeat, those responses progressively decrease.", "ko": "각각의 음은 뇌의 청각 영역에서 반응을 끌어내지만, 음이 반복되면서 그 반응은 점점 줄어든다."}, {"en": "This is called “adaptation,” a deceptively simple phenomenon that shows that your brain is learning to anticipate the next event.", "ko": "이것은 '적응'이라고 불리는데, 뇌가 다음 일을 예상하는 법을 배우고 있다는 것을 보여 주는, 겉보기엔 단순해 보이는 현상이다."}, {"en": "Suddenly, the note changes: AAAAA#.", "ko": "갑자기 음이 바뀐다: AAAAA#."}, {"en": "Your primary auditory cortex immediately shows a strong surprise reaction: not only does the adaptation fade away, but additional neurons begin to vigorously fire in response to the unexpected sound.", "ko": "일차 청각 피질은 즉시 강한 놀람 반응을 보인다. 적응이 사라질 뿐 아니라, 예상치 못한 소리에 반응해 추가 뉴런들이 힘차게 활동하기 시작한다."}, {"en": "And it is not just repetition that leads to adaptation: what matters is whether the notes are predictable.", "ko": "그리고 적응을 일으키는 것은 단순한 반복만이 아니다. 중요한 것은 음이 예측 가능한지이다."}, {"en": "For instance, if you hear an alternating set of notes, such as ABABA, your brain gets used to this alternation, and the activity in your auditory areas again decreases.", "ko": "예를 들어, ABABA처럼 번갈아 나오는 음을 들으면 뇌는 이 번갈아 나옴에 익숙해지고, 청각 영역의 활동은 다시 줄어든다."}, {"en": "This time, however, it is an unexpected repetition, such as ABABB, that triggers a surprise response.", "ko": "그러나 이번에는 ABABB처럼 예상치 못한 반복이 놀람 반응을 일으킨다."}]}, {"label": "22년 11월 32번 금융 시장의 감염", "sents": [{"en": "The connectedness of the global economic market makes it vulnerable to potential “infection.”", "ko": "세계 경제 시장의 연결성은 그것을 잠재적인 '감염'에 취약하게 만든다."}, {"en": "A financial failure can make its way from borrowers to banks to insurers, spreading like a flu.", "ko": "금융 실패는 독감처럼 퍼지면서 대출자에서 은행으로, 다시 보험사로 옮겨 갈 수 있다."}, {"en": "However, there are unexpected characteristics when it comes to such infection in the market.", "ko": "그러나 시장에서의 그런 감염에는 예상치 못한 특징들이 있다."}, {"en": "Infection can occur even without any contact.", "ko": "감염은 아무런 접촉 없이도 일어날 수 있다."}, {"en": "A bank might become insolvent even without having any of its investments fail.", "ko": "은행은 투자가 하나도 실패하지 않았는데도 지급 불능이 될 수 있다."}, {"en": "Fear and uncertainty can be damaging to financial markets, just as cascading failures due to bad investments.", "ko": "나쁜 투자로 인한 연쇄적인 실패와 마찬가지로, 두려움과 불확실성도 금융 시장에 해로울 수 있다."}, {"en": "If we all woke up tomorrow and believed that Bank X would be insolvent, then it would become insolvent.", "ko": "만약 우리 모두가 내일 깨어나 X은행이 지급 불능이 될 거라고 믿는다면, 그 은행은 정말로 지급 불능이 될 것이다."}, {"en": "In fact, it would be enough for us to fear that others believed that Bank X was going to fail, or just to fear our collective fear!", "ko": "사실, 다른 사람들이 X은행이 망할 거라고 믿는다는 것을 두려워하거나, 그저 우리의 집단적 두려움을 두려워하기만 해도 충분할 것이다."}, {"en": "We might all even know that Bank X was well-managed with healthy investments, but if we expected others to pull their money out, then we would fear being the last to pull our money out.", "ko": "우리 모두가 X은행이 건전한 투자로 잘 운영된다는 것을 알고 있더라도, 다른 사람들이 돈을 뺄 거라고 예상한다면, 우리는 돈을 마지막으로 빼는 사람이 될까 봐 두려워할 것이다."}, {"en": "Financial distress can be self-fulfilling and is a particularly troublesome aspect of financial markets.", "ko": "금융 위기는 자기실현적일 수 있으며, 이것은 금융 시장의 특히 골치 아픈 면이다."}]}, {"label": "22년 11월 33번 음수를 피하는 사람들", "sents": [{"en": "Negative numbers are a lot more abstract than positive numbers — you can’t see negative 4 cookies and you certainly can’t eat them — but you can think about them, and you have to, in all aspects of daily life, from debts to contending with freezing temperatures and parking garages.", "ko": "음수는 양수보다 훨씬 더 추상적이지만(음수 4개의 쿠키는 볼 수도 없고, 당연히 먹을 수도 없다), 우리는 음수를 생각할 수 있고, 빚에서부터 영하의 기온과 주차장을 다루는 일까지 일상생활의 모든 면에서 생각해야만 한다."}, {"en": "Still, many of us haven’t quite made peace with negative numbers.", "ko": "그래도 우리 중 많은 사람은 아직 음수와 완전히 화해하지 못했다."}, {"en": "People have invented all sorts of funny little mental strategies to sidestep the dreaded negative sign.", "ko": "사람들은 그 무서운 마이너스 기호를 피하려고 온갖 재미있는 작은 정신적 전략들을 만들어 냈다."}, {"en": "On mutual fund statements, losses (negative numbers) are printed in red or stuck in parentheses with no negative sign to be found.", "ko": "뮤추얼 펀드 내역서에서 손실(음수)은 빨간색으로 인쇄되거나, 마이너스 기호 하나 없이 괄호 안에 들어가 있다."}, {"en": "The history books tell us that Julius Caesar was born in 100 B.C., not -100.", "ko": "역사책은 율리우스 카이사르가 -100년이 아니라 기원전 100년에 태어났다고 말한다."}, {"en": "The underground levels in a parking garage often have designations like B1 and B2.", "ko": "주차장의 지하층은 흔히 B1, B2 같은 이름을 가지고 있다."}, {"en": "Temperatures are one of the few exceptions: folks do say, especially here in Ithaca, New York, that it’s -5 degrees outside, though even then, many prefer to say 5 below zero.", "ko": "기온은 몇 안 되는 예외 중 하나다. 사람들은, 특히 여기 뉴욕주 Ithaca에서는 바깥 기온이 -5도라고 말하지만, 그때조차 많은 사람은 '영하 5도'라고 말하는 쪽을 더 좋아한다."}, {"en": "There’s something about that negative sign that just looks so unpleasant.", "ko": "그 마이너스 기호에는 그저 너무 불쾌해 보이는 뭔가가 있다."}]}, {"label": "22년 11월 34번 교란 변수와 관찰 연구", "sents": [{"en": "Observational studies of humans cannot be properly controlled.", "ko": "사람에 대한 관찰 연구는 제대로 통제될 수 없다."}, {"en": "Humans live different lifestyles and in different environments.", "ko": "사람들은 서로 다른 생활 방식으로, 서로 다른 환경에서 산다."}, {"en": "Thus, they are insufficiently homogeneous to be suitable experimental subjects.", "ko": "따라서 사람들은 적합한 실험 대상이 될 만큼 충분히 동질적이지 않다."}, {"en": "These confounding factors undermine our ability to draw sound causal conclusions from human epidemiological surveys.", "ko": "이런 교란 변수들은 사람 대상 역학 조사에서 타당한 인과적 결론을 끌어내는 우리의 능력을 약화시킨다."}, {"en": "Confounding factors are variables (known or unknown) that make it difficult for epidemiologists to isolate the effects of the specific variable being studied.", "ko": "교란 변수는 역학자가 연구 중인 특정 변수의 효과만 따로 떼어 내기 어렵게 만드는 (알려졌거나 알려지지 않은) 변수다."}, {"en": "For example, Taubes argued that since many people who drink also smoke, researchers have difficulty determining the link between alcohol consumption and cancer.", "ko": "예를 들어 Taubes는 술을 마시는 많은 사람이 담배도 피우기 때문에, 연구자들이 음주와 암의 관계를 밝히기 어렵다고 주장했다."}, {"en": "Similarly, researchers in the famous Framingham study identified a significant correlation between coffee drinking and coronary heart disease.", "ko": "마찬가지로, 유명한 Framingham 연구의 연구자들은 커피 마시기와 관상동맥 심장병 사이에 상당한 상관관계를 발견했다."}, {"en": "However, most of this correlation disappeared once researchers corrected for the fact that many coffee drinkers also smoke.", "ko": "그러나 연구자들이 커피 마시는 많은 사람이 담배도 피운다는 사실을 보정하자, 이 상관관계는 대부분 사라졌다."}, {"en": "If the confounding factors are known, it is often possible to correct for them.", "ko": "교란 변수가 알려져 있으면, 그것을 보정하는 것이 흔히 가능하다."}, {"en": "However, if they are unknown, they will undermine the reliability of the causal conclusions we draw from epidemiological surveys.", "ko": "그러나 교란 변수가 알려져 있지 않으면, 그것은 우리가 역학 조사에서 끌어내는 인과적 결론의 신뢰성을 약화시킬 것이다."}]}, {"label": "22년 11월 36번 잊힐 권리와 사생활 권리", "sents": [{"en": "The right to be forgotten is a right distinct from but related to a right to privacy.", "ko": "잊힐 권리는 사생활 권리와 구별되지만 관련이 있는 권리이다."}, {"en": "The right to privacy is, among other things, the right for information traditionally regarded as protected or personal not to be revealed.", "ko": "사생활 권리는 무엇보다도, 전통적으로 보호되어야 하거나 개인적인 것으로 여겨지는 정보가 공개되지 않을 권리이다."}, {"en": "The right to be forgotten, in contrast, can be applied to information that has been in the public domain.", "ko": "반면에 잊힐 권리는 공공 영역에 있었던 정보에도 적용될 수 있다."}, {"en": "The right to be forgotten broadly includes the right of an individual not to be forever defined by information from a specific point in time.", "ko": "잊힐 권리는 넓게 보면, 개인이 특정 시점의 정보에 의해 영원히 규정되지 않을 권리를 포함한다."}, {"en": "One motivation for such a right is to allow individuals to move on with their lives and not be defined by a specific event or period in their lives.", "ko": "그런 권리를 두는 한 가지 이유는 개인이 자기 삶을 계속 이어 가고, 삶의 특정 사건이나 시기로 규정되지 않게 하려는 것이다."}, {"en": "For example, it has long been recognized in some countries, such as the UK and France, that even past criminal convictions should eventually be “spent” and not continue to affect a person’s life.", "ko": "예를 들어 영국과 프랑스 같은 일부 국가에서는 과거의 유죄 판결조차 결국 '소멸'되어 더 이상 한 사람의 삶에 영향을 주지 않아야 한다는 것이 오래전부터 인정되어 왔다."}, {"en": "Despite the reason for supporting the right to be forgotten, the right to be forgotten can sometimes come into conflict with other rights.", "ko": "잊힐 권리를 지지하는 그런 이유에도 불구하고, 잊힐 권리는 때때로 다른 권리들과 충돌할 수 있다."}, {"en": "For example, formal exceptions are sometimes made for security or public health reasons.", "ko": "예를 들어 안보나 공중 보건상의 이유로 공식적인 예외가 만들어지기도 한다."}]}, {"label": "22년 11월 37번 경제학자가 출산율을 설명하는 법", "sents": [{"en": "To an economist who succeeds in figuring out a person’s preference structure — understanding whether the satisfaction gained from consuming one good is greater than that of another — explaining behavior in terms of changes in underlying likes and dislikes is usually highly problematic.", "ko": "한 사람의 선호 구조를 알아내는 데, 즉 한 상품을 소비해서 얻는 만족이 다른 상품보다 큰지를 이해하는 데 성공한 경제학자에게, 행동을 근본적인 좋고 싫음의 변화로 설명하는 것은 대개 매우 문제가 많다."}, {"en": "To argue, for instance, that the baby boom and then the baby bust resulted from an increase and then a decrease in the public’s inherent taste for children, rather than a change in relative prices against a background of stable preferences, places a social scientist in an unsound position.", "ko": "예를 들어, 베이비붐과 그 뒤의 출산 급감이 안정된 선호를 배경으로 한 상대 가격의 변화가 아니라, 아이에 대한 대중의 타고난 취향이 늘었다가 줄었기 때문이라고 주장하는 것은 사회과학자를 불안정한 입장에 놓는다."}, {"en": "In economics, such an argument about birth rates would be equivalent to saying that a rise and fall in mortality could be attributed to an increase in the inherent desire change for death.", "ko": "경제학에서 출산율에 대한 그런 주장은, 사망률이 오르내리는 것이 죽음에 대한 타고난 욕구의 변화(증가) 때문이라고 말하는 것과 같을 것이다."}, {"en": "For an economist, changes in income and prices, rather than changes in tastes, affect birth rates.", "ko": "경제학자에게는 취향의 변화가 아니라 소득과 가격의 변화가 출산율에 영향을 미친다."}, {"en": "When income rises, for example, people want more children (or, as you will see later, more satisfaction derived from children), even if their inherent desire for children stays the same.", "ko": "예를 들어 소득이 오르면, 아이에 대한 타고난 욕구가 그대로여도 사람들은 더 많은 아이(또는 뒤에서 보겠지만, 아이에게서 얻는 더 많은 만족)를 원한다."}]}, {"label": "22년 11월 38번 아이들이 채소를 싫어하는 이유", "sents": [{"en": "In the natural world, if an animal consumes a plant with enough antinutrients to make it feel unwell, it won’t eat that plant again.", "ko": "자연계에서 동물이 몸이 안 좋아질 만큼 항영양소가 많은 식물을 먹으면, 그 동물은 그 식물을 다시는 먹지 않을 것이다."}, {"en": "Intuitively, animals also know to stay away from these plants.", "ko": "직관적으로, 동물들은 이런 식물을 멀리해야 한다는 것도 안다."}, {"en": "Years of evolution and information being passed down created this innate intelligence.", "ko": "오랜 진화와 대대로 전해진 정보가 이 타고난 지능을 만들어 냈다."}, {"en": "This “intuition,” though, is not just seen in animals.", "ko": "그런데 이 '직관'은 동물에게서만 보이는 것이 아니다."}, {"en": "Have you ever wondered why most children hate vegetables?", "ko": "대부분의 아이들이 왜 채소를 싫어하는지 궁금했던 적이 있는가?"}, {"en": "Dr. Steven Gundry justifies this as part of our genetic programming, our inner intelligence.", "ko": "Steven Gundry 박사는 이것을 우리의 유전적 프로그래밍, 즉 우리 내면의 지능의 일부라고 설명한다."}, {"en": "Since many vegetables are full of antinutrients, your body tries to keep you away from them while you are still fragile and in development.", "ko": "많은 채소에 항영양소가 가득하기 때문에, 여러분이 아직 약하고 자라는 중일 때 몸은 여러분을 채소에서 멀어지게 하려 한다."}, {"en": "It does this by making your taste buds perceive these flavors as bad and even disgusting.", "ko": "몸은 여러분의 미뢰가 이런 맛을 나쁘고 심지어 역겹게 느끼게 만들어서 그렇게 한다."}, {"en": "As you grow and your body becomes stronger enough to tolerate these antinutrients, suddenly they no longer taste as bad as before.", "ko": "여러분이 자라서 몸이 이런 항영양소를 견딜 만큼 충분히 강해지면, 갑자기 그 맛이 예전만큼 나쁘지 않게 느껴진다."}]}], "items": [{"id": "mock_2211_g2:m2211g2-01", "p": 0, "s": 0, "w": "designed", "h": "design", "pos": "동", "m": "(어떤 목적으로) 고안하다, 설계하다", "form": "동사 design의 과거분사형", "syn": [["intend", "의도하다"], ["devise", "고안하다"]], "ant": [], "trap": [["draw", "그리다", "design의 다른 뜻 '도안을 그리다, 디자인하다'와 비슷한 말"]], "dis": [["delay", "미루다"], ["borrow", "빌리다"]], "other": [["디자인하다, 도안을 그리다", "She designs clothes.", "그녀는 옷을 디자인한다."]], "tip": "be designed to(~하도록 고안되다) → be intended to(~하도록 의도되다)로 바뀔 수 있음", "story": "경쟁자가 시작도 못 하게 막으려고 짠 전략 얘기에서 나온 단어"}, {"id": "mock_2211_g2:m2211g2-02", "p": 0, "s": 1, "w": "discourage", "h": "discourage", "pos": "동", "m": "(~하지 못하게) 막다, 단념시키다", "form": "", "syn": [["prevent", "막다"], ["deter", "단념시키다"]], "ant": [["encourage", "부추기다, 격려하다"]], "trap": [["depress", "우울하게 하다, 낙담시키다", "discourage의 다른 뜻 '낙담시키다'와 비슷한 말"]], "dis": [["announce", "발표하다"]], "other": [["낙담시키다, 용기를 잃게 하다", "The low score discouraged him.", "낮은 점수가 그를 낙담시켰다."]], "tip": "discourage A from -ing(A가 ~하지 못하게 막다)는 지문 첫머리 prevent A from -ing(막다)와 같은 뜻의 짝", "story": "먼저 발표만 해도 경쟁자가 따라 하기를 포기하는 얘기에서 나온 단어"}, {"id": "mock_2211_g2:m2211g2-03", "p": 0, "s": 2, "w": "implies", "h": "imply", "pos": "동", "m": "암시하다, 뜻하다", "form": "동사 imply의 3인칭 단수 현재형", "syn": [["suggest", "시사하다"], ["indicate", "나타내다"]], "ant": [["declare", "분명히 선언하다"]], "trap": [], "dis": [["purchase", "구매하다"], ["repair", "수리하다"]], "other": [], "tip": "imply(암시하다) ↔ 대놓고 말하는 declare(선언하다) 구별", "story": "선점이라는 말 속에 '타이밍이 중요하다'는 뜻이 숨어 있다는 얘기에서 나온 단어"}, {"id": "mock_2211_g2:m2211g2-04", "p": 0, "s": 6, "w": "launch", "h": "launch", "pos": "동", "m": "(상품을) 출시하다, 내놓다", "form": "", "syn": [["release", "출시하다"], ["introduce", "내놓다, 도입하다"]], "ant": [["withdraw", "철수시키다, 거둬들이다"]], "trap": [["fire", "발사하다", "launch의 다른 뜻 '(로켓을) 발사하다'와 비슷한 말"]], "dis": [["measure", "측정하다"]], "other": [["발사하다", "They launched a rocket.", "그들은 로켓을 발사했다."]], "tip": "launch(출시하다)의 다른 뜻 '발사하다' 함정 주의", "story": "빈틈이 없도록 온갖 종류의 제품을 시장에 내놓는다는 얘기에서 나온 단어"}, {"id": "mock_2211_g2:m2211g2-05", "p": 0, "s": 6, "w": "accommodated", "h": "accommodate", "pos": "동", "m": "(요구·수요를) 충족시키다, 수용하다", "form": "동사 accommodate의 과거분사형", "syn": [["satisfy", "충족시키다"], ["meet", "충족시키다"]], "ant": [], "trap": [["house", "거처를 제공하다", "accommodate의 다른 뜻 '숙박시키다'와 비슷한 말"], ["lodge", "숙박시키다", "accommodate의 다른 뜻 '숙박시키다'와 비슷한 말"]], "dis": [["compete", "경쟁하다"]], "other": [[" var D=JSON.parse(document.getElementById('data').textContent),IT=D.items,KEY='yk:'+D.key;

window.addEventListener('resize',function(){setTimeout(drawAll,50)});
/* 실전 예행연습 / 시험 공통 */
function startReal(){var px=sget('real',null);if(px&&!px.done){S=px}else{S={mode:'real',i:0,q:shuf(IT.map(function(x,i){return i})).map(mk)}}rReal()}
var TM=null;
function startExam(){var ex=sget('exam',null);if(ex&&ex.done){S=ex;showRes();return}if(ex){S=ex}else{var ks=shuf(IT.map(function(x,i){return i})).slice(0,25);S={mode:'exam',i:0,q:ks.map(mk),end:Date.now()+ks.length*20000};save()}rReal();clearInterval(TM);TM=setInterval(tick,500)}
function tick(){if(!S||S.mode!='exam'){clearInterval(TM);return}var r=Math.max(0,Math.round((S.end-Date.now())/1000));var e=$('tm');if(e)e.textContent=Math.floor(r/60)+':'+('0'+r%60).slice(-2);if(r<=0){clearInterval(TM);fin()}}
function rReal(){var q=S.q[S.i],last=S.i>=S.q.length-1,h=topBar(S.mode=='exam'?'시험 <span class="timer" id="tm"></span>':'실전 예행연습');
 h+=qCard(q,true);
 h+='<div style="display:flex;gap:8px">'+(S.i>0?'<button class="go sec" style="flex:1" onclick="mv(-1)">이전</button>':'')+'<button class="go" style="flex:2" onclick="'+(last?'fin()':'mv(1)')+'">'+(last?'제출':'다음')+'</button></div>';
 if(S.mode!='exam')h+='<button class="go sec" onclick="home()">목록으로</button>';
 $('app').innerHTML=h;window.scrollTo(0,0);if(S.mode=='exam')tick()}
function mv(d){S.i+=d;save();rReal()}
function fin(){clearInterval(TM);S.q.forEach(function(q){q.rev=true;setWrong(q.k,!isOK(q))});S.done=1;S.score=S.q.filter(isOK).length;if(S.mode=='real')sdel('real');else save();showRes()}
function showRes(){var n=S.q.length,ok=S.score,bad=S.q.filter(function(q){return !isOK(q)});
 var h='<div class="top"><b>'+(S.mode=='exam'?'시험 결과':'실전 예행연습 결과')+'</b><button class="hb" style="margin-left:auto" onclick="home()">처음으로</button></div>';
 h+='<div class="band '+(ok==n?'ok':'ng')+'">'+n+'개 중 '+ok+'개 정답</div>';
 if(bad.length){h+='<div class="small" style="margin:4px 2px 8px">틀린 단어</div>';bad.forEach(function(q){h+=qCard(q,false)+mapCard(q)})}
 if(bad.length&&S.mode=='real')h+='<button class="go" onclick="startPrac(1)">틀린 것만 다시</button>';
 h+='<button class="go sec" onclick="home()">목록으로</button>';$('app').innerHTML=h;window.scrollTo(0,0);setTimeout(drawAll,30)}
home();
</script></body></html>
