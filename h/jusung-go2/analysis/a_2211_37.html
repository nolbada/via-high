var CAT={g:"어휘",o:"대명사",b:"연결어",k:"핵심 문장",p:"구문"};
var P={"src": "22년 11월 37번", "sub": "고2 · 경제학의 행동 설명", "one": "경제학에서 행동을 ‘취향의 변화’로 설명하는 것은 문제, 소득과 가격의 변화로 설명해야 함 (출산율이 그 예)", "flow": [{"label": "도입부", "range": "1번", "sum": "호불호의 변화로 행동을 설명하는 것은 경제학자에게 대체로 문제 <small>(explaining behavior in terms of changes in likes and dislikes)<\/small>", "eg": "떡볶이를 더 사 먹는 이유를 ‘입맛이 바뀌어서’라고 설명하면 설명이 되지 않음"}, {"label": "본론 (1)", "range": "2번", "sum": "출산율 변동을 대중의 타고난 취향 변화로 설명하면 사회과학자가 불안정한 입장에 놓임 <small>(an unsound position)<\/small>", "eg": "떡볶이 판매량이 늘어난 것을 사람들이 갑자기 좋아하게 됐기 때문이라고 주장하는 셈"}, {"label": "본론 (2)", "range": "3번", "sum": "그런 주장은 사망률 증감을 죽음에 대한 욕구 변화로 설명하는 것과 같음 <small>(equivalent to ~)<\/small>", "eg": "‘사람들이 갑자기 떡볶이를 싫어하게 됐다’로 매출 급감을 설명하는 것과 같음"}, {"label": "요지", "range": "4번", "sum": "취향이 아니라 소득과 가격의 변화가 출산율에 영향 <small>(changes in income and prices)<\/small>", "eg": "떡볶이 소비는 입맛이 아니라 용돈과 가격의 변화로 설명"}, {"label": "결론", "range": "5번", "sum": "소득이 늘면 타고난 욕구가 같아도 사람들은 더 많은 자녀를 원하게 됨 <small>(even if the desire stays the same)<\/small>", "eg": "용돈이 늘면 떡볶이 좋아하는 정도가 그대로여도 더 자주 사 먹게 됨"}], "sents": [{"n": 1, "mk": "To an economist [1|who succeeds in figuring out] a person’s preference structure — [13|understanding] [4|whether] the [5|satisfaction] gained from [6|consuming] one good is greater than [7|that] of another — [8|explaining behavior in terms of changes in underlying likes and dislikes is usually highly] [9|problematic].", "ko": "사람의 선호 구조를 알아내는 데 성공한 경제학자, 즉 한 상품을 소비하여 얻는 만족도가 다른 상품의 만족도보다 더 큰지를 이해하는 데 성공한 경제학자에게, 행동을 기저에 있는 호불호의 변화의 관점에서 설명하는 것은 대체로 매우 문제가 많다."}, {"n": 2, "mk": "[15|To argue], [14|for instance], that the baby boom and then the baby bust [18|resulted from] an increase and then a decrease in the public’s [19|inherent] taste for children, [20|rather than] a change in [21|relative] prices against a background of stable preferences, [16|places a social scientist in an unsound position].", "ko": "예를 들어, 출산율의 급증과 그 후의 급감이 안정된 선호를 배경으로 한 상대적 가격의 변화 때문이 아니라 아이에 대한 대중의 내재적 기호의 증가와 그 후의 감소에서 비롯되었다고 주장하는 것은 사회과학자를  Object.keys(CAT).forEach(function(c){h+='<button data-c="'+c+'" class="c-'+c+'">'+CAT[c]+'</button>';});
 h+='</div><div id="items"></div>';
 h+='<div class="ft">비타민 영어클리닉 · 주성고 영어II</div>';
 document.getElementById("app").innerHTML=h;
 items();
}
function items(){
 var out="",seen={};
 S.forEach(function(s){
  var ids=[];s.mk.replace(/\[(\d+)\|/g,function(m,id){if(!seen[id]){seen[id]=1;ids.push(id);}});
  ids.forEach(function(id){var it=I[id];if(cur!="all"&&it.c!=cur)return;
   out+='<div class="it c-'+it.c+'" id="it'+id+'"><h4><span class="tl">'+it.t+'</span><span class="tag">'+CAT[it.c]+'</span></h4>';
   out+='<div class="quote">'+s.n+'. '+hl2(s.mk,id)+'<div class="qk">'+s.ko+'</div></div>';
   out+='<div class="note"><div class="nl">노트 정리</div>'+it.n.map(function(l){return '<div class="ln">'+l+'</div>';}).join("")+'</div>';
   out+='<div class="xs">'+it.x.map(function(l){return '<div>'+l+'</div>';}).join("")+'</div>';
   if(it.e)out+='<div class="eg">'+it.e+'</div>';
   out+='<button class="bkb" data-back="'+s.n+'">본문으로 돌아가기</button></div>';
  });
 });
 document.getElementById("items").innerHTML=out;
}
function hl2(s,id){return s.replace(/\[(\d+)\|([^\]]+)\]/g,function(m,i,t){return i==id?'<span class="hlk c-'+I[i].c+'">'+t+'</span>':t;});}
document.addEventListener("click",function(e){
 var t=e.target;
 
 if(t.dataset&&t.dataset.id){var el=document.getElementById("it"+t.dataset.id);if(el){el.scrollIntoView({behavior:"smooth",block:"center"});el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash");}return;}
 if(t.closest&&t.closest("#tabs")&&t.dataset.c){cur=t.dataset.c;setTabs();document.getElementById("text").innerHTML=textHTML();items();return;}
 if(t.dataset&&t.dataset.back){var p=document.getElementById("s"+t.dataset.back);p.scrollIntoView({behavior:"smooth",block:"center"});return;}
 if(t.tagName=="I"&&t.parentNode.classList.contains("ps")){t.parentNode.classList.toggle("open");}
});
function setTabs(){[].forEach.call(document.querySelectorAll("#tabs button"),function(b){b.classList.toggle("on",b.dataset.c==cur);});}
render();
</script>
</body>
</html>
