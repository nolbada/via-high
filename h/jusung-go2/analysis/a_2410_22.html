<script>
var CAT={g:"어휘",o:"대명사",b:"연결어",k:"핵심 문장",p:"구문"};
var P={"src": "24년 10월 22번", "sub": "고2 · 측정의 개념", "one": "측정은 이미 있는 값을 그대로 재는 일이 아니라, 이미 정립된 여러 이론을 바탕으로 특정 크기를 계산해 내는 과정", "flow": [{"label": "도입부", "range": "1번", "sum": "볼링공의 질량은 저울로 이미 알고 있는 질량과 비교해 쉽게 측정 <small>(compare it with a known mass)<\/small>", "eg": "볼링공을 저울에 올려 이미 질량을 아는 금속 큐브와 견주어 봄"}, {"label": "본론 (1)", "range": "2~4번", "sum": "먼 별의 질량은 훨씬 복잡, 별의 질량 측정에는 다양한 이론이 개입 <small>(involves various theories)<\/small>", "eg": "별은 저울에 올릴 수 없어서 볼링공처럼 잴 수가 없음"}, {"label": "본론 (2)", "range": "5~6번", "sum": "쌍성의 질량 중심과 거리를 구한 뒤 케플러 법칙으로 질량을 계산 <small>(measure other quantities and calculate)<\/small>", "eg": "별 사이의 거리와 공전 주기를 재서 공식에 넣어 질량을 구함"}, {"label": "결론 = 요지", "range": "7번", "sum": "측정은 단순한 추정이 아니라 정립된 이론을 바탕으로 특정 크기를 결정하는 일 <small>(a determination of certain magnitudes)<\/small>", "eg": "별의 질량 값은 이론이라는 계산 도구가 있어야만 얻어지는 값"}], "sents": [{"n": 1, "mk": "[1|To determine] the [2|mass] of my bowling ball, I might put it onto a [3|balance] and compare it with a known mass, such as a number of metal cubes [5|each weighing 1, 10, or 100 grams].", "ko": "내 볼링공의 질량을 측정하기 위해, 나는 그것을 저울 위에 올려놓고 각각 1g, 10g, 또는 100g이 나가는 여러 개의 금속 큐브 같은 이미 알고 있는 질량과 비교할 수 있다."}, {"n": 2, "mk": "Things get much more [7|complicated] if I want to know the mass of a [8|distant] star.", "ko": "만약 내가 먼 별의 질량을 알고 싶다면 상황은 훨씬 더 복잡해진다."}, {"n": 3, "mk": "[9|How do I measure] [10|it]?", "ko": "나는 어떻게 그것을 측정할까?"}, {"n": 4, "mk": "We can [12|roughly] say that [14|measuring the mass of a star] [13|involves] various theories.", "ko": "우리는 별의 질량을 측정하는 것은 다양한 이론을 포함한다고 대략적으로 말할 수 있다."}, {"n": 5, "mk": "If we want to measure the mass of a [16|binary star], we first [17|determine] a [18|center of mass] between the two stars, then their distance from [23|that center] [19|which we can then use], together with a value for the period and a certain [21|instance] of Kepler’s Third Law, to calculate the mass.", "ko": "만약 우리가 쌍성의 질량을 측정하기를 원한다면, 우리는 먼저 두 별 사이의 질량 중심을 알아내고, 그다음 그 중심으로부터의 그것들의 거리를 알아내는데, 우리는 그 거리를 공전
