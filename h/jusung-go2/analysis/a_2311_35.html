<script>
var CAT={g:"어휘",o:"대명사",b:"연결어",k:"핵심 문장",p:"구문"};
var P={"src": "23년 11월 35번", "sub": "고2 · 도덕적 우수성의 형성 가능성", "one": "도덕적 우수성은 타고난 면도 있지만 성인기 초반까지 뇌가 계속 발달하므로 교육으로 가르칠 여지가 더 큼", "flow": [{"label": "도입부", "range": "1번", "sum": "Aristotle에 따르면 도덕적 우수성은 습관과 반복의 결과, 현대 과학은 타고난 요소도 시사 <small>(habit and repetition)<\/small>", "eg": "착한 행동은 매일 반복해서 몸에 밴 결과이면서 타고난 성향도 있음"}, {"label": "본론 (1)", "range": "2번", "sum": "도덕적 우수성은 어린 시절에 폭넓게 정해지므로 얼마나 일찍 가르칠지가 중요 <small>(how early to teach it)<\/small>", "eg": "착한 습관은 어릴수록 잘 자리 잡으니 언제 가르치느냐가 중요"}, {"label": "본론 (2)", "range": "3번", "sum": "Freud는 5세 무렵 이후 성격이 안 변한다고 했지만 틀렸음 <small>(Freud was wrong)<\/small>", "eg": "다섯 살 이후로는 바뀌지 않는다는 말은 사실이 아니었음"}, {"label": "무관한 문장", "range": "4번", "sum": "도덕적으로 우수한 사람은 좋은 일을 하지 않을 수 없고 그것은 자연스러움 <small>(cannot help doing)<\/small>", "eg": "착한 사람이 선행하는 건 계절이 바뀌는 것만큼 자연스러움"}, {"label": "결론", "range": "5번", "sum": "성격 특성은 30세 무렵 안정되고 뇌는 20대 중반까지 계속 발달 <small>(stabilize around age thirty)<\/small>", "eg": "20대 중반까지 뇌가 자라고, 성격은 서른 즈음에야 굳어짐"}, {"label": "요지", "range": "6번", "sum": "새 이해 덕분에 도덕적 우수성을 가르칠 수 있다는 점에서 더 낙관적일 수 있음 <small>(more optimistic)<\/small>", "eg": "성격이 늦게까지 변하니 착한 습관을 가르치는 일이 생각보다 희망적"}], "sents": [{"n": 1, "mk": "Moral [1|excellence], according to Aristotle, is the result of habit and repetition, [2|though] modern science would also [3|suggest] that it may have an [4|innate], [5|genetic] [6|component].", "ko": "도덕적 우수성은 Aristotle에 따르면 습관과 반복의 결과이지만, 현대 과학은 또한 그것이 선천적인, 즉 유전적인 요소를 가질 수도 있다고 시사할 것이다."}, {"n": 2, "star": 1, "mk": "This means that moral excellence will be [7|broadly] [8|set] early in our lives, [9|which is why the question of how early to teach it is so important].", "ko": "이것은 도덕적 우수성이 우리 삶에 있어 이른 시기에 광범위하게 설정될 것임을 의미하며, 이것이 얼마나 일찍 그것을 가르쳐야 할지에 대한 질문이 매우 중요한 이유이다."}, {"n": 3, "mk": "Freud suggested that we don't change our personality much after age five or [10|thereabouts], but as in many other things, Freud was wrong.", "ko": "Freud는 우리가 5세 혹은 그 무렵 이후로는 우리의 성격을 많이 바꾸지 않는다고 제시했지만, 다른 많은 것들에서처럼 Freud는 틀렸다."}, {"n": 4, "mk": "A person of moral excellence [11|cannot help doing] good — it is [12|as natural as] the change of seasons or the [13|rotation] of the planets.", "ko": "도덕적 우수성을 가진 사람은 좋은 일을 하지 않을 수 없으며, 그것은 계절의 변화나 행성의 자전만큼이나 자연스럽다."}, {"n": 5, "mk": "Recent psychological research shows [14|that personality traits stabilize around age thirty in both men and women and regardless of ethnicity] as the human brain continues to develop, both [15|neuroanatomically] and [16|in terms of] cognitive skills, until the mid-twenties.", "ko": "최근의 심리학 연구는 인간의 뇌가 20대 중반까지 신경 해부학적으로 그리고 인지 기능 면에서 계속 발달함에 따라, 남성과 여성 모두에게 있어 그리고 민족에 상관없이 성격 특성이 30세 무렵에 안정된다는 것을 보여 준다."}, {"n": 6, "star": 1, "mk": "The [17|advantage] of this new understanding is [18|that we can be a bit more optimistic than Aristotle and Freud about being able to teach moral excellence].", "ko": "이 새로운 이해의 이점은 도덕적 우수성을 가르칠 수 있다는 점에서 우리가 Aristotle이나 Freud보다 조금 더 낙관적일 수 있다는 것이다."}], "items": {"1": {"c": "g", "t": "excellence : 우수성, 탁월함", "n": ["excellence = 우수성, 탁월함", "(파생) excellent = 우수한", "moral excellence = 도덕적 우수성"], "x": ["Moral excellence는 ‘도덕적 우수성’이라는 뜻이다.", "excellent(우수한)의 명사형이다.", "이 글 전체의 중심 소재이다."]}, "2": {"c": "b", "t": "though : 비록 ~이지만 (양보 신호)", "n": ["though + 절 = 비록 ~이지만", "양보 : 앞 주장과 다른 내용을 덧붙임"], "x": ["though modern science would also suggest ~는 ‘비록 현대 과학은 ~도 시사하지만’이라는 뜻이다.", "앞의 ‘습관과 반복의 결과’에 ‘타고난 면도 있다’를 덧붙인다.", "though는 접속사로 뒤에 절이 온다."]}, "3": {"c": "g", "t": "suggest : 시사하다, 제안하다", "n": ["suggest = 시사하다, 제안하다", "suggest that + 절 = ~라고 제시하다", "(파생) suggestion = 제안"], "x": ["modern science would also suggest that ~은 ‘현대 과학은 ~라고도 시사할 것이다’라는 뜻이다.", "suggest는 ‘제안하다’와 ‘(연구가) 시사하다’ 두 뜻이 있다.", "여기서는 ‘시사하다’의 뜻이다."]}, "4": {"c": "g", "t": "innate : 선천적인", "n": ["innate = 선천적인, 타고난", "(반의어) acquired = 후천적인", "innate component = 선천적 요소"], "x": ["an innate, genetic component는 ‘선천적인, 즉 유전적인 요소’라는 뜻이다.", "태어날 때부터 가지고 있는 성질을 말한다.", "innate와 genetic은 쉼표로 이어진 비슷한 말이다."]}, "5": {"c": "g", "t": "genetic : 유전적인", "n": ["
