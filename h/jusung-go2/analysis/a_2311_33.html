<script>
var CAT={g:"어휘",o:"대명사",b:"연결어",k:"핵심 문장",p:"구문"};
var P={"src": "23년 11월 33번", "sub": "고2 · 인과 가설의 함정", "one": "상관관계가 주는 통찰은 명확하지만 그 이유를 인과로 설명하려 들면 오히려 흐려지므로 설명 시도는 보류하는 편이 좋음", "flow": [{"label": "도입부", "range": "1~2번", "sum": "상관관계는 통찰이 명확해 강력하지만 인과 관계를 끌어들이면 가려짐 <small>(covered up)<\/small>", "eg": "주황색 중고차는 결함이 적다는 숫자는 분명하지만, 이유를 따지는 순간 흐려짐"}, {"label": "본론 (1)", "range": "3~4번", "sum": "중고차 경매 데이터에서 주황색 차는 결함 가능성이 훨씬 낮게 나옴 <small>(far less likely to have defects)<\/small>", "eg": "경매에 나온 중고차 중 주황색 차는 문제가 거의 없었다는 분석 결과"}, {"label": "본론 (1)", "range": "5~6번", "sum": "이유를 짐작하는 순간 서로 다른 인과 설명이 쏟아짐 <small>(why it might be so)<\/small>", "eg": "주인이 차 애호가여서일까, 눈에 잘 띄어 사고가 적어서일까?"}, {"label": "본론 (2)", "range": "7~8번", "sum": "곧 경쟁하는 인과 가설의 함정에 빠지고, 설명 시도는 더 흐리게 만들 뿐 <small>(a web of competing causal hypotheses)<\/small>", "eg": "추측이 늘수록 주황색 차 이야기는 점점 더 뿌예짐"}, {"label": "본론 (2)", "range": "9~10번", "sum": "상관관계는 수학적으로 보일 수 있지만 인과 관계는 쉽게 그럴 수 없음 <small>(mathematically)<\/small>", "eg": "주황색 차의 결함률은 숫자로 보이지만, 그 이유는 숫자로 못 보임"}, {"label": "결론", "range": "11번", "sum": "상관관계 뒤의 이유를 설명하려는 시도는 보류하는 편이 좋음 <small>(hold off from trying to explain)<\/small>", "eg": "‘주황색 차가 결함이 적다’는 사실만 받아들이고 이유 찾기는 멈춤"}], "sents": [{"n": 1, "mk": "[1|Correlations] are powerful [2|because] the insights they offer are relatively clear.", "ko": "상관관계는 그것들이 제공하는 통찰이 비교적 명확하기 때문에 강력하다."}, {"n": 2, "mk": "These insights are often [3|covered up] when we bring [4|causality] back into [5|the picture].", "ko": "이러한 통찰은 종종 우리가 인과 관계를 다시 그 상황으로 가져올 때 가려진다."}, {"n": 3, "mk": "[6|For instance], a [7|used-car] dealer [8|supplied] data to statisticians to [9|predict] [10|which of the vehicles available for purchase at an auction were likely to have problems].", "ko": "예를 들어, 한 중고차 딜러가 경매에서 구입할 수 있는 차량들 중 어떤 차량이 문제가 발생할 가능성이 있는지를 예측하기 위해 통계학자들에게 데이터를 제공했다."}, {"n": 4, "mk": "A correlation analysis showed [11|that orange-colored cars were far less likely to have defects].", "ko": "한 상관관계 분석은 주황색 차들이 결함을 가질 가능성이 훨씬 적다는 것을 보여 주었다."}, {"n": 5, "mk": "Even as we read this, we already think about [12|why it might be so]: [13|Are orange-colored car owners likely to be car enthusiasts and take better care of their vehicles?]", "ko": "심지어 우리가 이것을 읽으면서도, 우리는 이미 왜 그럴지에 대해 생각한다. 주황색 차 소유자들이 자동차 애호가일 가능성이 있고 자신의 차량을 더 잘 관리할 가능성이 있는가?"}, {"n": 6, "mk": "Or is it because orange-colored cars are more [14|noticeable] on the road and therefore less likely to be in accidents, so [15|they]'re in better condition when resold?", "ko": "아니면 주황색 차들이 도로에서 더 눈에 띄고 그래서 사고가 날 가능성이 적어, 그것들이 재판매될 때 더 좋은 상태이기 때문인가?"}, {"n": 7, "mk": "Quickly we are [16|caught in a web of] [17|competing] causal [18|hypotheses].", "ko": "곧 우리는 경쟁하는 인과적 가설의 함정에 빠진다."}, {"n": 8, "mk": "But our [19|attempts to illuminate things this way] only [20|make them cloudier].", "ko": "하지만 이런 식으로 무언가를 설명하려는 우리의 시도는 그것들을 더 흐리게 만들 뿐이다."}, {"n": 9, "mk": "Correlations exist; we can show them mathematically.", "ko": "상관관계는 존재하며, 우리는 그것들을 수학적으로 보여 줄 수 있다."}, {"n": 10, "mk": "We can't easily do the same for causal links.", "ko": "우리는 인과 관계에 대해서는 쉽게 똑같이 할 수 없다."}, {"n": 11, "mk": "So [21|we would do well to hold off from trying to explain] the reason behind the correlations.", "ko": "따라서 우리는 상관관계 뒤에 있는 이유를 설명하려는 시도를 보류하는 것이 좋을 것이다."}], "items": {"1": {"c": "g", "t": "correlation : 상관관계", "n": ["correlation = 상관관계", "(파생) correlate = 서로 관련이 있다", "causality와 구별 (인과 관계 아님)"], "x": ["Correlations are powerful은 ‘상관관계는 강력하다’라는 뜻이다.", "상관관계는 두 가지가 함께 움직이는 관계이고, 하나가 다른 하나의 원인이라는 뜻은 아니다.", "복수형이라 -s가 붙었고 be동사도 are이다."]}, "2": {"c": "b", "t": "because : ~이기 때문에 (이유 신호)", "n": ["because + 절 = ~이기 때문에", "상관관계가 강력한 이유를 이끎"], "x": ["because the insights they offer are relatively clear는 ‘그것들이 주는 통찰이 비교적 명확하기 때문에’라는 뜻이다.", "앞 문장 ‘상관관계는 강력하다’의 이유를 밝힌다.", "이 글의 첫 흐름은 ‘상관관계는 강력하다’에서 시작한다."]}, "3": {"c": "g", "t": "cover up : 가리다, 덮다", "n": ["cover up = 덮다, 가리다, 은폐하다", "are covered up = 가려진다 (수동태)", "(다의어) cover = 덮다, 다루다"], "x": ["기준 : 구동사 cover up을 한 덩어리로 보고, be + 과거분사의 수동태로 분석함.", "These insights are often c
