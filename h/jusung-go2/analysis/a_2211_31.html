<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#17202e;--sub:#5b677a;--line:#d9e0ec;--pri:#1d4ed8;--off:#e9eef8;--note:#fffbe6;--noteL:#d9c76a;--noteT:#8a6d00;--noteLn:#efe6b3;
 --gd:#15803d;--gl:#c6efcf;--bd:#1d4ed8;--bl:#cfe0fb;--kd:#be185d;--kl:#fbcfe3;--od:#c2570c;--ol:#ffe0b8;--pd:#6d28d9;--pl:#e4d9fb}
@media(prefers-color-scheme:dark){:root{--bg:#0e131c;--card:#161d2a;--ink:#e8edf6;--sub:#9aa7bd;--line:#2a3548;--pri:#8ab4ff;--off:#222c3d;--note:#33290a;--noteL:#6b5a1a;--noteT:#f1dc8a;--noteLn:#4a3d12;
 --gd:#4ade80;--gl:#16361f;--bd:#8ab4ff;--bl:#1a2a4a;--kd:#f472b6;--kl:#401a30;--od:#fb923c;--ol:#43270f;--pd:#c4a8ff;--pl:#2c2147}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.55;font-size:16px}
.wrap{max-width:640px;margin:0 auto;padding:14px 16px 56px}

.sub{font-size:13px;color:var(--sub);margin:0 2px 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.chip{font-size:12.5px;font-weight:800;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:4px 11px}
.c-g{--d:var(--gd);--l:var(--gl)}.c-b{--d:var(--bd);--l:var(--bl)}.c-k{--d:var(--kd);--l:var(--kl)}.c-o{--d:var(--od);--l:var(--ol)}.c-p{--d:var(--pd);--l:var(--pl)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px 13px;margin-bottom:10px}

.flow{display:flex;flex-direction:column;gap:6px}
.fr{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;line-height:1.5}

@media(prefers-color-scheme:dark){.fr b{color:#0b1220}}
.fr span{padding-top:2px}.fr strong{font-weight:800}.fr small{font-weight:600;color:var(--sub);font-size:12.5px}.eg2{margin-top:4px;color:var(--pri);font-size:13.5px;font-weight:600;border-left:3px solid var(--pri);padding-left:8px}
.fr em{font-style:normal;color:var(--sub);font-size:12.5px;font-weight:800;margin-right:4px}
.ps{font-size:16px;line-height:2;display:flex;gap:8px;border-top:1px solid var(--line);padding-top:4px;margin-top:4px}.ps:first-of-type{border-top:0;margin-top:0}

.ps .ko{display:none;font-size:13.5px;color:var(--sub);line-height:1.6;margin-top:2px}.ps.open .ko{display:block}
.hlk{background:var(--l);border-bottom:2px solid var(--d);border-radius:3px;padding:0 2px;cursor:pointer}

@media(prefers-color-scheme:dark){.tabs button.on{color:#0b1220}}
.it{background:var(--l);border:1.5px solid var(--d);border-radius:14px;padding:12px 14px 13px;margin-bottom:10px}

.it h4 .tl{flex:1}
.tag{font-size:11.5px;color:#fff;background:var(--d);border-radius:99px;padding:2px 9px;flex:none;font-weight:800}
@media(prefers-color-scheme:dark){.tag{color:#0b1220}}
.quote{background:var(--card);border-radius:10px;padding:7px 10px;margin:0 0 8px;font-size:14.5px;line-height:1.7}
.quote .qk{font-size:13px;color:var(--sub);margin-top:2px;line-height:1.5}
.it .xs{margin:7px 0 0;font-size:14px;line-height:1.65}
.it .xs div{margin-top:3px}
.it .eg{margin-top:8px;font-size:13.5px;color:var(--sub);border-left:3px solid var(--d);padding-left:9px}
.note{background:var(--note);border:1.5px dashed var(--noteL);border-radius:10px;padding:7px 11px;background-image:repeating-linear-gradient(transparent,transparent 25px,var(--noteLn) 25px,var(--noteLn) 26px)}
.note .nl{font-size:11.5px;font-weight:800;color:var(--noteT);margin-bottom:2px}.note .ln{font-size:14px;font-weight:700;line-height:26px;color:var(--ink)}
.bkb{margin-top:8px;border:1.5px solid var(--d);background:var(--card);color:var(--d);border-radius:999px;padding:6px 14px;font:700 13px inherit;font-family:inherit;cursor:pointer}
.flash{animation:fl 1.4s ease}@keyframes fl{0%,60%{box-shadow:0 0 0 4px #f5c84288}100%{box-shadow:none}}
.qz{background:var(--card);border:1.5px solid var(--pri);border-radius:14px;padding:12px 14px 14px;margin-bottom:10px}.qz .qt{font-size:15.5px;font-weight:800;margin-bottom:8px}.nb{display:flex;gap:6px;flex-wrap:wrap}.nb button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:800 16px inherit;font-family:inherit;cursor:pointer}.nb button.bad{background:#fde2e2;border-color:#d33;color:#a11;text-decoration:line-through}.w{cursor:pointer;border-radius:3px}.w.ok{background:var(--bl);border-bottom:2px solid var(--bd);font-weight:800}.w.bad{background:#fde2e2}.rec{font-size:13px;font-weight:800;color:var(--sub);margin:0 2px 10px}.ft{text-align:center;font-size:12.5px;color:var(--sub);margin-top:18px}
</style>

<script>
var CAT={g:"어휘",o:"대명사",b:"연결어",k:"핵심 문장",p:"구문"};
var P={"src": "22년 11월 31번", "sub": "고2 · 놀람과 학습", "one": "학습은 예상이 어긋나는 놀람에서 일어나고, 뇌는 예측 가능한 반복에는 적응하고 예상 밖의 반복에는 놀람 반응을 보임", "flow": [{"label": "도입부", "range": "1~2번", "sum": "어떤 학습도 오류 신호 없이는 불가능, 유기체는 사건이 기대에 어긋날 때에만 학습함 <small>(error signal, violate expectations)<\/small>", "eg": "늘 똑같은 종소리에서는 뇌가 새로 배울 것이 없음"}, {"label": "주제", "range": "3번", "sum": "놀람은 학습의 근본적인 동력 중 하나 <small>(surprise, fundamental drivers)<\/small>", "eg": "종소리가 갑자기 달라져서 ‘어?’ 하고 놀라는 순간 뇌가 배움"}, {"label": "본론 (1)", "range": "4~6번", "sum": "똑같은 음이 반복되면 뇌의 반응이 점점 줄어드는 적응 현상, 뇌가 다음 사건을 예상하게 됨 <small>(adaptation)<\/small>", "eg": "매일 같은 종소리는 처음엔 신경 쓰이다가 나중엔 들리지도 않음"}, {"label": "본론 (2)", "range": "7~10번", "sum": "음이 갑자기 바뀌면 강한 놀람 반응, 적응을 만드는 것은 단순한 반복이 아니라 예측 가능성 <small>(predictable)<\/small>", "eg": "‘딩동-딩동’처럼 규칙이 있으면 금방 익숙해져서 반응이 다시 줄어듦"}, {"label": "결론", "range": "11번", "sum": "이번에는 예상치 못한 반복이 놀람 반응을 일으킴 <small>(unexpected repetition)<\/small>", "eg": "‘딩동-딩동’ 하던 종이 갑자기 ‘딩동-딩동-동’으로 울리면 모두 고개를 듦"}], "sents": [{"n": 1, "mk": "No learning is possible without an [1|error signal].", "ko": "어떤 학습도 오류 신호 없이는 가능하지 않다."}, {"n": 2, "mk": "[2|Organisms] only learn when events [3|violate their expectations].", "ko": "유기체는 사건이 그들의 기대에 어긋날 때에만 학습한다."}, {"n": 3, "mk": "[4|In other words], surprise is [5|one of the fundamental drivers of learning].", "ko": "다시 말해 놀람은 학습의 근본적인 동력 중 하나이다."}, {"n": 4, "mk": "[6|Imagine hearing] a series of [7|identical notes], AAAAA.", "ko": "일련의 똑같은 음인 AAAAA를 듣는 것을 상상해 보아라."}, {"n": 5, "mk": "Each note [8|draws out] a response in the auditory areas of your brain — [10|but] as the notes repeat, [11|those responses] [12|progressively decrease].", "ko": "각각의 음은 여러분의 뇌의 청각 영역에서 반응을 끌어내지만, 음이 반복되면서 그 반응은 점진적으로 감소한다."}, {"n": 6, "mk": "[13|This] is [14|called] “[15|adaptation],” a [16|deceptively simple phenomenon] [17|that shows that] your brain is learning to [18|anticipate] the next event.", "ko": "이것은 ‘적응’이라 불리며, 당신의 뇌가 다음 사건을 예상하는 것을 배울 것임을 보여 주는 현혹될 정도로 단순해 보이는 현상이다."}, {"n": 7, "mk": "Suddenly, the note changes: AAAAA#.", "ko": "갑자기 그 음이 AAAAA#으로 바뀐다."}, {"n": 8, "star": 1, "mk": "Your [19|primary auditory cortex] immediately shows a strong surprise reaction: [20|not only does the adaptation fade away, but] additional neurons begin to [21|vigorously fire] in response to the unexpected sound.", "ko": "당신의 일차 청각 피질은 즉시 강한 놀람의 반응을 보이는데, 즉 적응이 점차 사라질 뿐만 아니라 예상치 못한 소리에 대한 반응으로 추가적인 뉴런이 힘차게 활성화되기 시작한다."}, {"n": 9, "mk": "And [23|it is not just repetition that] leads to adaptation: [24|what matters is whether the notes are predictable].", "ko": "그리고 적응을 유발하는 것은 단순한 반복이 아니라, 중요한 것은 그 음이 예측 가능한지이다."}, {"n": 10, "mk": "[25|For instance], if you hear an alternating set of notes, such as ABABA, your brain [26|gets used to this alternation] and the activity in your auditory areas again decreases.", "ko": "예를 들어 만약 당신이 ABABA와 같이 교차하는 한 세트의 음을 듣는다면, 당신의 뇌는 이 교차에 익숙해지고 당신의 청각 영역 내 활동은 다시 감소한다."}, {"n": 11, "mk": "This time, [27|however], [23|it is] [28|an unexpected repetition, such as ABABB,] [29|that triggers] a surprise response.", "ko": "그러나 이번에는 놀람의 반응을 일으키는 것은 바로 ABABB와 같은 예상치 못한 반복이다."}], "items": {"1": {"c": "g", "t": "error signal : 오류 신호", "n": ["error signal = 오류 신호 (예상과 결과가 어긋났다는 신호)", "No A is possible without B = B 없이는 A가 불가능하다"], "x": ["No learning is possible without an error signal은 ‘오류 신호 없이는 어떤 학습도 가능하지 않다’라는 뜻이다.", "No ~ without …은 ‘…없이는 어떤 ~도 ~하지 않는다’로 해석한다.", "error signal은 ‘오류 신호’라는 뜻이다.", "2번 문장이 이 말을 ‘기대에 어긋날 때에만 학습한다’고 풀어 준다.", "그래서 error signal은 예상과 결과가 어긋났다는 신호로 이해하면 된다."]}, "2": {"c": "g", "t": "organism : 유기체", "n": ["organism = 유기체, 생물체", "organ = 기관 (organism과 같은 뿌리)", "Organisms = organism의 복수형"], "x": ["Organisms only learn when ~은 ‘유기체는 ~할 때에만 학습한다’라는 뜻이다.", "organism은 살아 있는 생명체를 두루 가리키는 말로, 사람과 동물이 모두 들어간다.", "Organisms는 organism의 복수형이다. 그래서 동사 learn에 -s가 붙지 않는다.", "only learn when은 ‘~할 때에만 학습한다’라는 뜻이다. only는 when절을 한정한다."]}, "3": {"c": "g", "t": "violate one’s expectations : 기대에 어긋나다", "n": ["violate = 어긋나다, 위반하다", "(다의어) violate = 침해하다", "expectation = 기대 (expect = 기대하다)", "events violate their expectations = 사건이 그들의 기대에 어긋나다"], "x": ["when events violate their expectations는 ‘사건이 그들의 기대에 어긋날 때’라는 뜻이다.", "violate의 목적어는 their expectations(그들의 기대)이다.", "violate는 ‘법을 어기다’라는 뜻으로 많이 알지만, 여기서는 기대를 ‘벗어나다, 어긋나다’라는 뜻이다.", "their는 앞의 Organisms를 가리키는 소유격 대명사이다.", "expectation은 동사 expect(기대하다)의 명사형이다."]}, "4": {"c": "b", "t": "In other words : 다시 말해", "n": ["in other words = 다시 말해, 즉", "앞 내용을 쉽게 바꿔 말함"], "x": ["In other words는 ‘다시 말해, 즉’이라는 뜻의 연결어이다.", "1번(오류 신호 없이는 학습 불가)과 2번(기대에 어긋날 때만 학습)을 한 문장으로 정리한다.", "그 정리가 ‘놀람은 학습의 동력’이라는 이 글의 주제이다."]}, "5": {"c": "k", "t": "주제문 : 놀람 = 학습의 근본적인 동력", "n": ["surprise = 놀람", "fundamental = 근본적인", "driver = 동력, 원동력 (다의어 : 운전자)", "one of the + 복수명사 = ~ 중 하나"], "x": ["surprise is one of the fundamental drivers of learning은 ‘놀람은 학습의 근본적인 동력 중 하나이다’라는 뜻이다.", "fundamental은 ‘근본적인’, driver는 ‘동력, 원동력’이라는 뜻이다. driver는 ‘운전자’라는 뜻도 있는 다의어이다.", "one of the 뒤에는 복수명사 drivers가 온다.", "1·2번 내용을 ‘놀람’이라는 한 단어로 정리한 글의 주제문이다."], "e": "쉬운 예시 : 늘 똑같은 종소리에서는 새로 배울 것이 없다. 종소리가 갑자기 다르게 울려 ‘어? 뭐지?’ 하고 놀랄 때 뇌가 배운다."}, "6": {"c": "p", "t": "Imagine + -ing : ~하는 것을 상상해 보아라", "n": ["imagine + 동명사 = ~하는 것을 상상하다", "Imagine ~ = 명령문 (동사원형으로 시작)", "a series of ~ = 일련의 ~"], "x": ["Imagine hearing a series of identical notes는 ‘일련의 똑같은 음을 듣는 것을 상상해 보아라’라는 뜻이다.", "imagine은 동명사를 목적어로 취하는 동사이므로 hearing이 왔다. to hear는 쓰지 않는다.", "Imagine으로 시작하는 문장은 주어 You가 생략된 명령문이다.", "a series of는 ‘일련의, 연속된’이라는 뜻이다.", "독자에게 소리를 직접 떠올려 보게 하는 예시의 시작이다."]}, "7": {"c": "g", "t": "identical : 똑같은 · note : 음", "n": ["identical = 똑같은, 동일한", "note = 음, 음표", "(다의어) note = 메모, 주목하다", "AAAAA = 같은 음 A가 계속 반복되는 소리"], "x": ["identical notes는 ‘똑같은 음들’이라는 뜻이다.", "identical은 ‘완전히 같은’이라는 뜻의 형용사이다.", "note는 여기서 음악의 ‘음’이라는 뜻이다. ‘메모’나 ‘주목하다’라는 뜻도 있는 다의어이다.", "AAAAA는 같은 음 A가 다섯 번 이어지는 소리이다."]}, "8": {"c": "g", "t": "draw out : 끌어내다", "n": ["draw out = 끌어내다, 이끌어 내다", "(다의어) draw = 그리다, 끌다", "draws = 동사 draw의 3인칭 단수 현재형"], "x": ["Each no
