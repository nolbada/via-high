<script>
var CAT={g:"어휘",o:"대명사",b:"연결어",k:"핵심 문장",p:"구문"};
var P={"num": "24", "sub": "고2 · 아리스토텔레스 사상의 시대적 한계", "one": "위대한 사상가 아리스토텔레스도 자기 시대와 특권층의 시각에 갇혀 있었으므로, 그의 사상은 잘한 점이 있음에도 깊은 결함을 지닌다는 것", "flow": [{"label": "도입부", "range": "1번", "sum": "아리스토텔레스는 일관된 사상가지만 그의 생각 일부는 오늘날 낯설게 다가옴 <small>(meet us today as strange)</small>", "eg": "할아버지 세대에는 당연했던 말이 지금 들으면 어색하게 들림"}, {"label": "본론 (1)", "range": "2~4번", "sum": "예시: 노예제를 거리낌 없이 정당화, 철학자는 최고선을 사유하니 삶의 최고의 것을 누릴 자격이 있다고 여김, 그 주장은 이상하게도 자기 잇속만 차리는 것 <small>(oddly self-serving)</small>", "eg": "반장이 “나는 회의를 하니까 급식을 제일 먼저 먹어야 해.”라고 스스로 정하는 것"}, {"label": "본론 (2)", "range": "5번", "sum": "모든 위대한 사상가는 자기 시대에 속하고 특정한 청중에게 말하며, 아리스토텔레스도 예외가 아님 <small>(of her own time)</small>", "eg": "옛날 교과서가 그 시절 학생들에게 맞춰 쓰여 지금 보면 낡아 보이는 것"}, {"label": "본론 (3)", "range": "6~7번", "sum": "그가 이해한 인간 번영은 오늘날 기대만큼 포용적이지 않고, 그의 옳음과 선은 고대 그리스 특권 엘리트의 생각을 보여 주는 척도 <small>(indicator / privileged elite)</small>", "eg": "반 몇 명만 모여 정한 반 규칙이 그 몇 명의 입장만 드러내는 것"}, {"label": "결론", "range": "8번", "sum": "그 결과 그의 사상은 잘한 점에도 불구하고 깊은 결함을 지님 <small>(deeply flawed)</small>", "eg": "맛은 훌륭해도 위생에 큰 문제가 있는 식당"}], "sents": [{"n": 1, "mk": "[1|Consistent though he may be], [2|some of Aristotle's ideas] [3|meet us today as strange].", "ko": "비록 아리스토텔레스가 일관적일지라도, 그의 생각들 중 일부는 오늘날 우리에게 낯설게 다가온다.", "star": true}, {"n": 2, "mk": "He [4|had no difficulty justifying slavery], [5|for example], and in his era, philosophers enjoyed [6|positions of high privilege and influence].", "ko": "예를 들어, 그는 노예 제도를 정당화하는 데 아무런 어려움이 없었고, 그의 시대에 철학자들은 높은 특권과 영향력이 있는 지위를 누렸다.", "star": true}, {"n": 3, "mk": "[7|Because of] their practice of [8|contemplation] for [9|the highest human good], philosophers [10|were considered worthy to have] all the best things in life.", "ko": "그들의 인간의 최고선에 대한 사유의 실천 때문에, 철학자들은 삶에서 모든 최고의 것들을 가질 만하다고 여겨졌다."}, {"n": 4, "mk": "[11|Somehow] [12|that assertion] [13|seems] oddly [14|self-serving].", "ko": "왠지 그 주장은 이상하게도 자기 잇속만 차리는 것처럼 보인다."}, {"n": 5, "mk": "[15|It serves us to remember] that [16|every great thinker is of her own time] and [17|speaks to a particular audience], and certainly [18|Aristotle is no exception].", "ko": "그것은 ‘우리’가 모든 위대한 사상가는 그들 자신만의 시대에 속해 있고 특정한 청중들에게 말한다는 것을 기억하는 데 도움이 되며, 확실히 아리스토텔레스도 예외는 아니다.", "star": true}, {"n": 6, "mk": "[19|Human flourishing] [20|as he understood it] probably [21|would not be nearly as inclusive as] [22|we would want it to be today].", "ko": "그가 이해했던 대로의 인간 번영은 아마도 결코 오늘날 우리가 그것이 그러하기를 원하는 만큼 포용적이지는 않을 것이다."}, {"n": 7, "mk": "[23|How he understood right and good] [24|is best taken to be an indicator of] how [25|the privileged elite] of ancient Greek society [26|tended to understand] right and good.", "ko": "그가 옳음과 선을 어떻게 이해했는가는 고대 그리스 사회의 특권 엘리트 계층이 옳음과 선을 어떻게 이해하는 경향이 있었는가에 대한 척도로 가장 잘 여겨진다."}, {"n": 8, "mk": "[27|As a result], [28|for all it does well], [29|it] is also [30|deeply flawed].", "ko": "그 결과, 그것의 장점에도 불구하고, 그것은 또한 심각하게 결함이 있다.", "star": true}], "items": {"1": {"c": "p", "t": "양보절의 보어 도치 : 형용사 + though + S + V", "n": ["Consistent though he may be", "= Though he may be consistent", "= 비록 그가 일관적일지라도", "Consistently (X) → be의 보어는 형용사"], "x": ["Consistent though he may be는 ‘비록 그가 일관적일지라도’라는 뜻이다.", "though가 이끄는 양보절에서 보어인 형용사 consistent가 맨 앞으로 나간 도치 구문이다.", "be동사의 보어 자리이므로 부사 consistently를 쓰면 틀린다."]}, "2": {"c": "k", "t": "글의 화제 : 아리스토텔레스 생각의 일부는 지금 보면 낯설다", "n": ["인정 : 일관된 사상가 (Consistent)", "비판 : 일부 생각은 낯설다 (strange)", "양보 → 비판으로 글이 시작됨"], "x": ["앞에서 일관성을 인정하고 뒤에서 일부 생각이 낯설다고 말해, 칭찬보다 비판 쪽으로 글이 흘러갈 것을 알려 준다.", "some of Aristotle's ideas는 ‘아리스토텔레스의 생각들 중 일부’라는 뜻이다.", "2번 문장부터 그 낯선 생각의 예가 나온다."], "e": "쉬운 예시 : “그 선생님 수업은 체계적이야. 그런데 몇몇 말씀은 요즘 기준으로 좀 이상해.”라고 말을 꺼내는 것과 같다."}, "3": {"c": "p", "t": "meet A as B : A에게 B로 다가오다, 느껴지다", "n": ["meet us as strange = 우리에게 낯설게 다가오다", "strange = 낯선, 이상한", "↔ familiar = 익숙한"], "x": ["meet us today as strange는 ‘오늘날 우리에게 낯설게 다가온다’라는 뜻이다.", "meet은 여기서 ‘만나다’보다 ‘~에게 ~하게 느껴지다’라는 뜻으로 쓰였다.", "today는 고대와 현대의 시간 차이를 드러내는 말로 글 전체의 대비(그 시대 ↔ 오늘날)를 미리 보여 준다."]}, "4": {"c": "p", "t": "have no difficulty (in) -ing : ~하는 데 전혀 어려움이 없다", "n": ["have difficulty (in) -ing = ~하는 데 어려움을 겪다", "no → 전혀 어려움이 없다 (거리낌 없다)", "justify = 정당화하다 / slavery = 노예 제도"], "x": ["He had no difficulty justifying slavery는 ‘그는 노예 제도를 정당화하는 데 아무런 어려움이 없었다’라는 뜻이다.", "have difficulty 뒤에는 in이 생략된 동명사가 오므로 to justify가 아니라 justifying이다.", "노예제를 당연하게 여겼다는 것이 1번 문장의 ‘낯선 생각’의 첫 번째 예이다."]}, "5": {"c": "b", "t": "for example : 예를 들어 (1번의 낯선 생각에 대한 예)", "n": ["1번 : 일부 생각이 낯설다", "2번 : 예) 노예제 정당화, 철학자의 특권"], "x": ["for example은 문장 중간에 들어갔지만, 이 문장 전체가 1번 문장의 ‘낯선 생각’의 예라는 신호이다.", "뒤의 and in his era ~는 그 시대 철학자들이 누린 특권이라는 두 번째 배경을 덧붙인다."]}, "6": {"c": "g", "t": "privilege : 특권 / influence : 영향력", "n": ["privilege = 특권, 특혜", "privileged = 특권을 가진 (7번 문장)", "positions of ~ = ~의 지위"], "x": ["positions of high privilege and influence는 ‘높은 특권과 영향력이 있는 지위’라는 뜻이다.", "privilege는 7번 문장의 the privileged elite(특권 엘리트층)와 이어지는 핵심어이다.", "in his era(그의 시대에)는 이것이 그 시대의 사정임을 강조한다."]}, "7": {"c": "p", "t": "because of + 명사(구) / because + 절", "n": ["because of + 명사구 = ~ 때문에", "because + S + V = ~이기 때문에", "Because of their practice ~ (명사구)"], "x": ["Because of their practice of contemplation ~은 ‘그들의 사유의 실천 때문에’라는 뜻이다.", "뒤에 동사가 없는 명사구가 오므로 because가 아니라 because of를 쓴다.", "철학자들이 특권을 누린 ‘이유’로 내세운 것을 보여 준다."]}, "8": {"c": "g", "t": "contemplation : 사유, 깊은 생각", "n": ["contemplation = 사유, 숙고, 명상", "contemplate = 깊이 생각하다 (동사)", "practice of contemplation = 사유의 실천"], "x": ["their practice of contemplation은 ‘그들이 깊이 생각하는 일을 실천하는 것’이라는 뜻이다.", "contemplation은 동사 contemplate의 명사형이다.", "철학자들은 이 고상한 활동을 근거로 자신들의 특권을 정당화했다."]}, "9": {"c": "g", "t": "the highest human good : 인간의 최고선", "n": ["good (명사) = 선, 이익", "the highest good = 최고선 (가장 좋은 것)", "형용사 good(좋은)과 구별"], "x": ["for the highest human good은 ‘인간의 최고선을 위한’이라는 뜻이다.", "good은 여기서 형용사가 아니라 ‘선, 좋은 것’이라는 명사이다.", "철학자들이 사람에게 가장 좋은 삶이 무엇인지 탐구했다는 뜻이다."]}, "10": {"c": "p", "t": "be considered + 형용사 : ~하다고 여겨지다 / worthy to V", "n": ["consider O worthy → O is considered worthy (수동)", "worthy to V = ~할 자격이 있는", "all the best things in life = 삶의 모든 최고의 것"], "x": ["philosophers were considered worthy to have all the best things in life는 ‘철학자들은 삶에서 모든 최고의 것을 가질 만하다고 여겨졌다’라는 뜻이다.", "5형식 consider O C가 수동태가 되면서 보어 worthy가 be considered 뒤에 남았다.", "바로 다음 4번 문장이 이 주장을 that assertion으로 받아 비판한다."]}, "11": {"c": "b", "t": "Somehow : 왠지 (필자의 비판이 시작됨)", "n": ["Somehow = 왠지, 어쩐지", "3번 (그 시대의 주장) → 4번 (필자의 평가)"], "x": ["Somehow는 ‘왠지, 어쩐지’라는 뜻으로, 앞의 사실 소개에서 필자 자신의 평가로 넘어가는 신호이다.", "이 문장부터 필자가 아리스토텔레스 시대의 생각을 비판적으로 본다."]}, "12": {"c": "o", "t": "that assertion = 철학자는 최고의 것을 누릴 자격이 있다는 주장", "n": ["that assertion = 3번 문장 내용", "(사유를 실천하는 철학자는 최고의 것을 가질 만하다)", "assertion = 주장 / assert = 주장하다"], "x": ["that assertion은 앞 문장의 ‘철학자들은 삶의 모든 최고의 것을 가질 자격이 있다’는 주장을 가리킨다.", "assertion은 동사 assert(주장하다)의 명사형이다."]}, "13": {"c": "p", "t": "seem + 형용사 : ~처럼 보이다 (부사 oddly는 형용사 수식)", "n": ["seem + 형용사 보어 = ~해 보이다", "oddly (부사) → self-serving (형용사)", "odd = 이상한 / oddly = 이상하게도"], "x": ["seems oddly self-serving은 ‘이상하게도 자기 잇속만 차리는 것처럼 보인다’라는 뜻이다.", "seem은 뒤에 형용사 보어를 취하는 2형식 동사이다.", "oddly는 형용사 self-serving을 꾸미는 부사이다."]}, "14": {"c": "k", "t": "필자의 비판 : 그 주장은 자기 잇속 챙기기", "n": ["self-serving = 자기 잇속만 차리는", "= selfish / self-interested (이기적인)", "↔ selfless = 사심 없는"], "x": ["self-serving은 ‘자기 이익만 챙기는’이라는 뜻이다.", "철학자들이 스스로 ‘우리는 훌륭하니 좋은 건 다 우리 것’이라고 주장한 셈이라 필자가 꼬집는 것이다.", "이 비판이 5번 문장의 ‘모든 사상가는 자기 시대에 속한다’는 일반 원리로 이어진다."], "e": "쉬운 예시 : 규칙을 정하는 학생회가 “학생회는 매점에 제일 먼저 간다.”라고 정하면 공정하지 않게 들린다."}, "15": {"c": "p", "t": "가주어 It + 진주어 to remember / serve : ~에게 도움이 되다", "n": ["It(가주어) serves us to remember(진주어) ~", "serve + 사람 = ~에게 도움이 되다", "= It is helpful for us to remember ~"], "x": ["It serves us to remember that ~은 ‘~을 기억하는 것이 우리에게 도움이 된다’라는 뜻이다.", "It은 가주어이고 to remember 이하가 진주어이다.", "serve는 ‘봉사하다’가 아니라 ‘~에게 유익하다’라는 뜻의 타동사로 쓰였다. 4번 문장의 self-serving과 같은 단어로 말을 이어 간다."]}, "16": {"c": "k", "t": "일반 원리 : 모든 위대한 사상가는 자기 시대에 속한다", "n": ["be of one's own time = 자기 시대에 속하다", "= 그 시대의 생각에 영향을 받다", "every + 단수명사 → is
