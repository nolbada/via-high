var P={"src": "22년 11월 29번", "sub": "고2 · 선매 행위의 역할", "one": "선매 행위는 경쟁자가 움직이기 전에 먼저 손을 써서 경쟁자를 막거나 단념시키는 전략, 광고 강화와 제품 확산이 대표적 사례", "flow": [{"label": "도입부", "range": "1~2번", "sum": "선매 행위는 경쟁자가 어떤 활동을 시작하지 못하게 만든 전략, 때로는 공표만으로도 단념시킴 <small>(pre-emption)<\/small>", "eg": "새 치킨집이 열리기 전에 ‘우리 가게 곧 할인 행사 시작’이라고 먼저 알리는 단골 치킨집"}, {"label": "본론 (1)", "range": "3~5번", "sum": "선매 행위는 타이밍이 핵심, 새 경쟁자의 진출 전후로 광고를 늘려 그 광고가 먹히지 않게 함 <small>(timing, up-weighting advertising)<\/small>", "eg": "새 치킨집 오픈 전부터 오픈 직후까지 우리 가게 전단지를 평소보다 두 배로 뿌림"}, {"label": "본론 (2)", "range": "6~7번", "sum": "제품 확산도 선매 전략, 다양한 변형 제품으로 시장의 빈틈을 미리 채움 <small>(product proliferation)<\/small>", "eg": "순살, 양념, 간장, 파닭 메뉴를 미리 다 깔아 두면 새 가게가 파고들 메뉴가 안 남음"}, {"label": "결론", "range": "8번", "sum": "시장이 변형 제품으로 이미 차 있으면 경쟁자는 빈 수요를 찾기 더 어려움 <small>(untapped pockets)<\/small>", "eg": "메뉴가 이미 다 있는 동네에서 새 치킨집이 팔 만한 틈새 메뉴를 찾기 어려움"}], "sents": [{"n": 1, "mk": "[1|Pre-emption] means [2|that a strategy is designed to prevent a rival from starting some particular activity].", "ko": "선매 행위는 어떤 전략이 경쟁자가 어떤 특정한 활동을 시작하는 것을 막기 위해 만들어진다는 것을 의미한다."}, {"n": 2, "mk": "In some case a pre-emptive move may simply be an announcement of some [4|intent] [5|that] might [6|discourage rivals from] doing [7|the same].", "ko": "어떤 경우에는 선제적 조치는 단순히 경쟁자들이 같은 행동을 하는 것을 단념시킬 수 있는 어떤 의도의 공표일 수도 있다."}, {"n": 3, "mk": "The idea of pre-emption [8|implies] that timing is sometimes very important — a decision or an action at one point in time might be [9|much more rewarding] than [10|doing it] at a different time point.", "ko": "선매 행위라는 개념은 때로 타이밍이 매우 중요하다는 것을 암시하는데, 즉 어떤 시점의 결정이나 조치는 다른 시점에 그것을 하는 것보다 훨씬 더 득이 될 수 있다."}, {"n": 4, "mk": "Pre-emption may [11|involve] [12|up-weighting] advertising for a period [13|before and during when] a new entrant [15|launches into] a market.", "ko": "선매 행위는 새로운 진입자가 시장에 진출하기 이전과 진출해 있는 동안에 광고의 가중치를 높이는 것을 포함할 수 있다."}, {"n": 5, "star": 1, "mk": "The [4|intent] is [16|to make it more difficult for the new entrant’s adverti var S=P.sents,I=P.items,FLOW=P.flow.map(function(f){return [f.label,f.range,f.sum,f.eg];});
var cur="all";
function textHTML(){var h='';S.forEach(function(s){h+='<div class="ps" id="s'+s.n+'"><i>'+s.n+(s.star?'<br>★':'')+'</i><div><div class="en">'+hl(s.mk)+'</div><div class="ko">'+s.ko+'</div></div></div>';});return h;}
function strip(s){return s.replace(/\[(\d+)\|([^\]]+)\]/g,"$2");}
function hl(s){return s.replace(/\[(\d+)\|([^\]]+)\]/g,function(m,id,t){var it=I[id];if(cur!='all'&&it.c!=cur)return t;return '<span class="hlk c-'+it.c+'" data-id="'+id+'">'+t+'</span>';});}
function render(){
 var h='<h1>'+P.src+'</h1><div class="sub">'+P.sub+'</div>';

 h+='<div class="card" id="onec"><div class="lab">결국 이 얘기</div><div class="one">'+P.one+'</div></div>';
 h+='<div class="card"><div class="lab">글의 뼈대</div><div class="flow">';
 FLOW.forEach(function(f){h+='<div class="fr"><b>'+f[0]+'</b><span><em>'+f[1]+'</em><strong>'+f[2]+'</strong><div class="eg2">예) '+f[3]+'</div></span></div>';});
 h+='</div></div>';
 h+='<div class="card" id="text">'+textHTML()+'</div>';
 h+='<div class="tabs" id="tabs"><button data-c="all" class="on">전체</button>';
 Object.keys(CAT).forEach(function(c){h+='<button data-c="'+c+'" class="c-'+c+'">'+CAT[c]+'</button>';});
 h+='</div><div id="items"></div>';
 h+='<div class="ft">비타민 영어클리닉 · 주성고 영어II</div>';
 document.getElementById("app").innerHTML=h;
 items();
}
function items(){
 var out="",seen={};
 S.forEach(function(s){
  var ids=[];s.mk.replace(/\[(\d+)\|/g,function(m,id){if(!seen[id]){seen[id]=1;ids.push(id);}});
  ids.forEach(function(id){var it=I[id];if(cur!="all"&&it.c!=cur)return;
   out+='<div class="it c-'+it.c+'" id="it'+id+'"><h4><span class="tl">'+it.t+'</span><span class="tag">'+CAT[it.c]+'</span></h4>';
   out+='<div class="quote">'+s.n+'. '+hl2(s.mk,id)+'<div class="qk">'+s.ko+'</div></div>';
   out+='<div class="note"><div class="nl">노트 정리</div>'+it.n.map(function(l){return '<div class="ln">'+l+'</div>';}).join("")+'</div>';
   out+='<div class="xs">'+it.x.map(function(l){return '<div>'+l+'</div>';}).join("")+'</div>';
   if(it.e)out+='<div class="eg">'+it.e+'</div>';
   out+='<button class="bkb" data-back="'+s.n+'">본문으로 돌아가기</button></div>';
  });
 });
 document.getElementById("items").innerHTML=out;
}
function hl2(s,id){return s.replace(/\[(\d+)\|([^\]]+)\]/g,function(m,i,t){return i==id?'<span class="hlk c-'+I[i].c+'">'+t+'</span>':t;});}
document.addEventListener("click",function(e){
 var t=e.target;
 
 if(t.dataset&&t.dataset.id){var el=document.getElementById("it"+t.dataset.id);if(el){el.scrollIntoView({behavior:"smooth",block:"center"});el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash");}return;}
 if(t.closest&&t.closest("#tabs")&&t.dataset.c){cur=t.dataset.c;setTabs();document.getElementById("text").innerHTML=textHTML();items();return;}
 if(t.dataset&&t.dataset.back){var p=document.getElementById("s"+t.dataset.back);p.scrollIntoView({behavior:"smooth",block:"center"});return;}
 if(t.tagName=="I"&&t.parentNode.classList.contains("ps")){t.parentNode.classList.toggle("open");}
});
function setTabs(){[].forEach.call(document.querySelectorAll("#tabs button"),function(b){b.classList.toggle("on",b.dataset.c==cur);});}
render();
