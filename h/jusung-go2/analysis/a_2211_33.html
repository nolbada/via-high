<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#17202e;--sub:#5b677a;--line:#d9e0ec;--pri:#1d4ed8;--off:#e9eef8;--note:#fffbe6;--noteL:#d9c76a;--noteT:#8a6d00;--noteLn:#efe6b3;
 --gd:#15803d;--gl:#c6efcf;--bd:#1d4ed8;--bl:#cfe0fb;--kd:#be185d;--kl:#fbcfe3;--od:#c2570c;--ol:#ffe0b8;--pd:#6d28d9;--pl:#e4d9fb}
@media(prefers-color-scheme:dark){:root{--bg:#0e131c;--card:#161d2a;--ink:#e8edf6;--sub:#9aa7bd;--line:#2a3548;--pri:#8ab4ff;--off:#222c3d;--note:#33290a;--noteL:#6b5a1a;--noteT:#f1dc8a;--noteLn:#4a3d12;
 --gd:#4ade80;--gl:#16361f;--bd:#8ab4ff;--bl:#1a2a4a;--kd:#f472b6;--kl:#401a30;--od:#fb923c;--ol:#43270f;--pd:#c4a8ff;--pl:#2c2147}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.55;font-size:16px}
.wrap{max-width:640px;margin:0 auto;padding:14px 16px 56px}

.sub{font-size:13px;color:var(--sub);margin:0 2px 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.chip{font-size:12.5px;font-weight:800;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:4px 11px}
.c-g{--d:var(--gd);--l:var(--gl)}.c-b{--d:var(--bd);--l:var(--bl)}.c-k{--d:var(--kd);--l:var(--kl)}.c-o{--d:var(--od);--l:var(--ol)}.c-p{--d:var(--pd);--l:var(--pl)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px 13px;margin-bottom:10px}
.lab{font-size:13px;font-weight:800;margin:0 0 6px;color:var(--sub)}
.one{font-size:16px;font-weight:800;line-height:1.5}
.flow{display:flex;flex-direction:column;gap:6px}

@media(prefers-color-scheme:dark){.fr b{color:#0b1220}}
.fr span{padding-top:2px}.fr strong{font-weight:800}.fr small{font-weight:600;color:var(--sub);font-size:12.5px}.eg2{margin-top:4px;color:var(--pri);font-size:13.5px;font-weight:600;border-left:3px solid var(--pri);padding-left:8px}
.fr em{font-style:normal;color:var(--sub);font-size:12.5px;font-weight:800;margin-right:4px}

.ps i{font-style:normal;font-size:12px;font-weight:800;color:var(--pri);flex:none;width:20px;padding-top:1px;cursor:pointer}
.ps .ko{display:none;font-size:13.5px;color:var(--sub);line-height:1.6;margin-top:2px}.ps.open .ko{display:block}
.hlk{background:var(--l);border-bottom:2px solid var(--d);border-radius:3px;padding:0 2px;cursor:pointer}
.tabs{display:flex;gap:6px;margin:0 0 10px;flex-wrap:wrap}

.tabs button.on{background:var(--d,var(--pri));color:#fff;border-color:var(--d,var(--pri))}
@media(prefers-color-scheme:dark){.tabs button.on{color:#0b1220}}
.it{background:var(--l);border:1.5px solid var(--d);border-radius:14px;padding:12px 14px 13px;margin-bottom:10px}

.it h4 .tl{flex:1}
.tag{font-size:11.5px;color:#fff;background:var(--d);border-radius:99px;padding:2px 9px;flex:none;font-weight:800}
@media(prefers-color-scheme:dark){.tag{color:#0b1220}}
.quote{background:var(--card);border-radius:10px;padding:7px 10px;margin:0 0 8px;font-size:14.5px;line-height:1.7}
.quote .qk{font-size:13px;color:var(--sub);margin-top:2px;line-height:1.5}
.it .xs{margin:7px 0 0;font-size:14px;line-height:1.65}
.it .xs div{margin-top:3px}
.it .eg{margin-top:8px;font-size:13.5px;color:var(--sub);border-left:3px solid var(--d);padding-left:9px}
.note{background:var(--note);border:1.5px dashed var(--noteL);border-radius:10px;padding:7px 11px;background-image:repeating-linear-gradient(transparent,transparent 25px,var(--noteLn) 25px,var(--noteLn) 26px)}
.note .nl{font-size:11.5px;font-weight:800;color:var(--noteT);margin-bottom:2px}.note .ln{font-size:14px;font-weight:700;line-height:26px;color:var(--ink)}
.bkb{margin-top:8px;border:1.5px solid var(--d);background:var(--card);color:var(--d);border-radius:999px;padding:6px 14px;font:700 13px inherit;font-family:inherit;cursor:pointer}
.flash{animation:fl 1.4s ease}@keyframes fl{0%,60%{box-shadow:0 0 0 4px #f5c84288}100%{box-shadow:none}}
.qz{background:var(--card);border:1.5px solid var(--pri);border-radius:14px;padding:12px 14px 14px;margin-bottom:10px}.qz .qt{font-size:15.5px;font-weight:800;margin-bottom:8px}.nb{display:flex;gap:6px;flex-wrap:wrap}.nb button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:800 16px inherit;font-family:inherit;cursor:pointer}.nb button.bad{background:#fde2e2;border-color:#d33;color:#a11;text-decoration:line-through}.w{cursor:pointer;border-radius:3px}.w.ok{background:var(--bl);border-bottom:2px solid var(--bd);font-weight:800}.w.bad{background:#fde2e2}.rec{font-size:13px;font-weight:800;color:var(--sub);margin:0 2px 10px}.ft{text-align:center;font-size:12.5px;color:var(--sub);margin-top:18px}
</style>

<script>
var CAT={g:"어휘",o:"대명사",b:"연결어",k:"핵심 문장",p:"구문"};
var P={"src": "22년 11월 33번", "sub": "고2 · 음수 기호를 피하는 전략", "one": "음수는 추상적이고 기호가 불편해서, 사람들은 빨간색·괄호·기원전·B1처럼 음수 기호를 피하는 다양한 전략을 만들어 냄", "flow": [{"label": "도입부", "range": "1~2번", "sum": "음수는 양수보다 훨씬 추상적이어서, 일상에서 생각하고 써야 하는데도 많은 사람이 아직 불편해함 <small>(abstract, made peace with)<\/small>", "eg": "통장 잔액 -3만 원이라는 것을 머리로는 알아도 마음으로는 편하지 않음"}, {"label": "본론 (1)", "range": "3번", "sum": "사람들은 두려운 음수 기호를 피하려고 온갖 정신적 전략을 만들어 냄 <small>(sidestep the dreaded negative sign)<\/small>", "eg": "통장 잔액 -3만 원을 ‘3만 원 모자람’이라고 돌려 말함"}, {"label": "본론 (2)", "range": "4~6번", "sum": "펀드 명세서는 빨간색·괄호로, 역사는 기원전으로, 주차장은 B1·B2로 음수 기호를 피함 <small>(red, parentheses, B.C., B1)<\/small>", "eg": "가계부에 모자란 돈을 빨간 글씨나 (30,000)처럼 괄호로 적고 ‘-’는 적지 않음"}, {"label": "결론", "range": "7~8번", "sum": "기온도 마찬가지로 많은 사람이 영하 5도라고 말하길 선호, 음수 기호는 불쾌해 보임 <small>(5 below zero, unpleasant)<\/small>", "eg": "‘-3만 원’보다 ‘3만 원 부족’이라는 말이 훨씬 마음 편함"}], "sents": [{"n": 1, "mk": "[1|Negative numbers] are [2|a lot more] [3|abstract] than positive numbers — you can’t see negative 4 cookies and you certainly can’t eat them — [4|but] you can think about them, and you [5|have to], in all [6|aspects] of daily life, [7|from debts to contending with] freezing temperatures and parking garages.", "ko": "음수는 양수보다 훨씬 더 추상적이다. 여러분은 음수 4개의 쿠키를 볼 수 없고 틀림없이 그것들을 먹을 수도 없다. 하지만 여러분은 그것들에 대해 생각할 수 있고, 또 생각해야만 한다. 채무에서부터 몹시 차가운 기온, 주차장과 씨름하는 것에 이르기까지 일상생활의 모든 측면에서 그렇다."}, {"n": 2, "mk": "[8|Still], many of us [9|haven’t quite made peace with negative numbers].", "ko": "그럼에도 우리들 중 많은 사람들은 음수와 잘 지내지 못해 왔다."}, {"n": 3, "mk": "People [10|have invented] [11|all sorts of funny little mental strategies] to [12|sidestep] the [13|dreaded] negative sign.", "ko": "사람들은 그 두려운 음수 기호를 피하기 위해 모든 종류의 우스꽝스럽고 사소한 정신적 전략들을 만들어 냈다."}, {"n": 4, "mk": "On mutual fund [14|statements], losses (negative numbers) are [16|printed in red or stuck] in [17|parentheses] [18|with no negative sign to be found].", "ko": "뮤추얼 펀드(계약형 투자 신탁) 명세서에서 손실(음수)은 빨간색으로 인쇄되거나, 음수 기호가 발견되지 않은 채 괄호 안에 갇혀 있다."}, {"n": 5, "mk": "The history books tell us that Julius Caesar was born in [19|100 B.C., not –100].", "ko": "역사책은 우리에게 Julius Caesar가 –100이 아닌 기원전 100년에 태어났다고 말한다."}, {"n": 6, "mk": "The underground levels in a parking garage often have [20|designations] like B1 and B2.", "ko": "주차장의 지하층은 종종 B1과 B2와 같은 명칭을 가지고 있다."}, {"n": 7, "mk": "Temperatures are [21|one of the few exceptions]: folks do say, especially here in Ithaca, New York, that it’s -5 degrees outside, [23|though even then], [24|many prefer to say 5 below zero].", "ko": "기온은 몇 안 되는 예외 중 하나인데, 특히 여기 New York의 Ithaca에서 사람들은 바깥의 기온이 –5도라고 정말 말하지만, 심지어 그때에도 많은 사람들은 영하 5도라고 말하길 선호한다."}, {"n": 8, "mk": "[25|There’s something about that negative sign] [26|that just looks so unpleasant].", "ko": "그 음수 기호에 관해서는 정말 불쾌하게만 보이는 무언가가 있다."}], "items": {"1": {"c": "g", "t": "negative number : 음수", "n": ["negative number = 음수", "positive number = 양수", "(다의어) negative = 부정적인", "negative sign = 음수 기호 (-)"], "x": ["Negative numbers는 ‘음수’, positive numbers는 ‘양수’라는 뜻이다.", "negative는 ‘음의’라는 뜻 외에 ‘부정적인’이라는 뜻도 있는 다의어이다.", "negative 4 cookies는 ‘음수 4개의 쿠키’, 즉 -4개의 쿠키라는 뜻이다.", "negative sign은 숫자 앞에 붙이는 ‘음수 기호(-)’이다. 3번, 4번, 8번에서도 나온다."]}, "2": {"c": "p", "t": "a lot more ~ than : 훨씬 더 ~한 (비교급 강조)", "n": ["비교급 강조 부사 = much / a lot / far / still / even", "a lot more abstract than ~ = ~보다 훨씬 더 추상적인", "비교급 앞에 very는 쓰지 않음"], "x": ["Negative numbers are a lot more abstract than positive numbers는 ‘음수는 양수보다 훨씬 더 추상적이다’라는 뜻이다.", "more abstract는 abstract의 비교급이고, 그 앞의 a lot은 ‘훨씬’이라는 강조 부사이다.", "비교급을 강조하는 말은 much, a lot, far, still, even이다.", "비교급 앞에 very는 쓰지 않는다."]}, "3": {"c": "g", "t": "abstract : 추상적인", "n": ["abstract = 추상적인", "(반의어) concrete = 구체적인", "(다의어) abstract = 요약 (명사)"], "x": ["more abstract than positive numbers는 ‘양수보다 더 추상적인’이라는 뜻이다.", "abstract는 눈에 보이거나 만질 수 없는 개념적인 것을 말한다.", "음수 4개의 쿠키는 눈으로 볼 수도 먹을 수도 없어서 추상적이라는 예시이다.", "반의어는 ‘구체적인’이라는 뜻의 concrete이다."]}, "4": {"c": "b", "t": "— but : 대비 신호", "n": ["can’t see, can’t eat ↔ can think about", "A — but B = A하지만 B", "대시(—)로 삽입된 설명"], "x": ["but은 ‘하지만’이라는 뜻으로 대시(—) 사이의 내용과 대비되는 말을 이끈다.", "대시 사이는 ‘볼 수도 먹을 수도 없다’는 설명이다.", "but 뒤는 ‘그래도 생각은 할 수 있고, 해야만 한다’는 내용이다.", "문장 앞의 ‘음수는 훨씬 더 추상적이다’와 이어서 읽는다."]}, "5": {"c": "p", "t": "you have to : have to 뒤의 생략", "n": ["you have to = you have to think about them (반복되는 부분 생략)", "have to + 동사원형 = ~해야만 한다", "think about = ~에 대해 생각하다"], "x": ["and you have to는 ‘그리고 여러분은 (그것들을 생각)해야만 한다’라는 뜻이다.", "have to 뒤의 think about them은 앞에서 나왔으므로 생략되었다.", "앞의 can(할 수 있다)과 대비되어 ‘반드시 해야만 하는’ 느낌이다.", "쉼표 사이에 끼어 있어 해석이 끊기기 쉬우니, 앞에서 생략된 동사를 찾아 연결한다."]}, "6": {"c": "g", "t": "aspect : 측면", "n": ["aspect = 측면, 양상", "in all aspects of ~ = ~의 모든 측면에서", "aspects = aspect의 복수형"], "x": ["in all aspects of daily life는 ‘일상생활의 모든 측면에서’라는 뜻이다.", "aspect는 ‘측면, 양상’이라는 뜻이다.", "all 뒤라서 복수형 aspects가 쓰였다.", "채무부터 기온, 주차장까지 일상의 여러 면을 가리킨다."]}, "7": {"c": "g", "t": "from A to contending with B : A에서 B와 씨름하는 것까지", "n": ["from A to B = A에서 B에 이르기까지", "contend with ~ = ~와 씨름하다, ~에 맞서다", "debt = 채무, 빚", "freezing = 몹시 추운 / parking garage = 주차장"], "x": ["from debts to contending with freezing temperatures and parking garages는 ‘채무에서부터 몹시 차가운 기온, 주차장과 씨름하는 것에 이르기까지’라는 뜻이다.", "from A to B는 범위를 나타내는 ‘A에서 B까지’라는 표현이다. 여기서 to는 전치사라서 contending(-ing)이 왔다.", "contend with는 ‘~와 씨름하다, ~에 맞서 싸우다’라는 뜻이다.", "(다의어) contend that ~은 ‘~라고 주장하다’라는 뜻도 있다.", "freezing temperatures는 ‘몹시 차가운 기온’, 즉 영하의 날씨를 말한다.", "debts는 ‘채무’, parking garages는 ‘주차장’이다. 모두 음수가 쓰이는 일상의 예이다."]}, "8": {"c": "b", "t": "Still : 그럼에도 불구하고, 여전히", "n": ["still = 그럼에도 불구하고, 여전히", "앞 내용과 대비되는 내용을 이끎", "(다의어) still = 훨씬 (비교급 강조), 가만히"], "x": ["Still, ~은 ‘그럼에도 불구하고(여전히), ~’라는 뜻이다.", "문장 맨 앞에서 쉼표와 함께 쓰이면 앞 내용과 대비되는 연결어이다.", "1번의 ‘음수를 생각할 수 있고 생각해야 한다’와 대비되어, 그래도 많은 사람이 음수가 편치 않다는 내용이 이어진다.", "still은 비교급 앞에서는 ‘훨씬’이라는 강조 부사로도 쓰이는 다의어이다."]}, "9": {"c": "k", "t": "문제 제기 : 많은 사람이 아직 음수와 편하게 지내지 못함", "n": ["make peace with ~ = ~와 화해하다, ~을 받아들이다", "haven’t quite made peace = 아직 완전히 받아들이지는 못했다", "not quite = 완전히
