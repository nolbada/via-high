<script>
var CAT={g:"어휘",o:"대명사",b:"연결어",k:"핵심 문장",p:"구문"};
var P={"src": "23년 11월 34번", "sub": "고2 · 평균 수명의 결정 요인", "one": "동물 종의 평균 수명과 노화 속도는 그 종이 야생에서 살아남을 수 있는 평균 시간에 의해 정해짐", "flow": [{"label": "도입부", "range": "1~2번", "sum": "야생 쥐는 대부분 2년이 끝나기 전에 외부 원인으로 죽음 <small>(external causes)<\/small>", "eg": "야생 쥐는 질병, 굶주림, 포식자 때문에 대부분 두 살이 되기 전에 사라짐"}, {"label": "도입부", "range": "3번", "sum": "그래서 자연은 쥐가 평균 2년을 넘지 못 살게 만듦 <small>(no longer than two years)<\/small>", "eg": "쥐는 오래 살 이유가 없어서 짧게 사는 쪽으로 만들어짐"}, {"label": "주제", "range": "4번", "sum": "평균 수명과 노화 속도는 종이 야생에서 살아남는 평균 시간이 결정 <small>(determined by the average time)<\/small>", "eg": "야생에서 오래 버티는 종일수록 천천히 늙고 오래 삶"}, {"label": "본론", "range": "5~7번", "sum": "박쥐는 날개 덕분에 빨리 도망치고 멀리 이동해 먹이도 잘 찾음 <small>(thanks to their wings)<\/small>", "eg": "박쥐는 위험하면 날아서 피하고, 먹이가 있는 곳까지 멀리 감"}, {"label": "결론", "range": "8번", "sum": "박쥐를 더 오래 살게 한 유전적 변화는 도망·먹이 찾기·생존을 더 잘하게 하므로 유용했음 <small>(useful)<\/small>", "eg": "날개 덕분에 살아남은 박쥐가 오래 살며 그 특징을 이어 감"}], "sents": [{"n": 1, "mk": "Most mice in the wild are [1|eaten or die] [2|before their life span of two years is over].", "ko": "야생에 있는 대부분의 쥐들은 2년의 수명이 끝나기 전에 잡아먹히거나 죽는다."}, {"n": 2, "mk": "They die from [3|external] causes, such as disease, starvation, or predators, not [4|due to] internal causes such as [5|aging].", "ko": "그들은 질병, 굶주림 또는 포식자와 같은 ‘외부적 원인’으로 죽지, 노화와 같은 ‘내부적 원인’ 때문이 아니다."}, {"n": 3, "mk": "That is [6|why nature has made mice to live], [7|on average], for no longer than two years.", "ko": "그것이 자연이 쥐가 평균적으로 2년 이상 살지 못하게 만든 이유이다."}, {"n": 4, "star": 1, "mk": "Now we have [8|arrived at] an important point: The average life span of an animal species, or the [9|rate] at which it [10|ages], is [11|determined] by [12|the average time that this animal species can survive in the wild].", "ko": "이제 우리는 중요한 지점에 도달했다. 동물 종의 평균 수명, 또는 그것이 노화하는 속도는 이 동물 종이 야생에서 생존할 수 있는 평균 시간에 의해 결정된다."}, {"n": 5, "mk": "That explains [13|why a bat can live to be 30 years old].", "ko": "그것이 박쥐가 30세까지 살 수 있는 이유를 설명해 준다."}, {"n": 6, "mk": "[14|In contrast to] mice, bats can fly, [15|which is why they can escape from danger much faster].", "ko": "쥐와 대조적으로, 박쥐는 날 수 있고, 이것은 그들이 위험에서 훨씬 더 빨리 도망칠 수 있는 이유이다."}, {"n": 7, "mk": "[16|Thanks to] their wings, bats can also cover longer distances and are better able to find food.", "ko": "그들의 날개 덕분에, 박쥐들은 또한 더 긴 거리를 이동할 수 있고 먹이를 더 잘 찾을 수 있다."}, {"n": 8, "star": 1, "mk": "[17|Every genetic change in the past that made it possible for a bat to live longer] was [18|useful], because bats are much better able than mice to [19|flee from] danger, find food, and survive.", "ko": "박쥐가 더 오래 사는 것을 가능하게 해 준 과거의 모든 유전적 변화는 박쥐가 쥐보다 위험으로부터 도망치고, 먹이를 찾고, 생존할 수 훨씬 더 잘할 수 있기 때문에 유용했다."}], "items": {"1": {"c": "p", "t": "or로 이어진 두 동사 + before절", "n": ["are eaten or die = 잡아먹히거나 죽는다", "eaten = 동사 eat의 과거분사 (수동태)", "before + 절 = ~하기 전에"], "x": ["are eaten or die는 ‘잡아먹히거나 죽는다’라는 뜻이다.", "are eaten은 수동태이고 die는 능동 동사라서 or로 이어진 두 동사의 모양이 다르다.", "eaten은 동사 eat의 과거분사이다.", "before their life span of two years is over는 ‘2년의 수명이 끝나기 전에’라는 뜻이다."]}, "2": {"c": "g", "t": "life span : 수명", "n": ["life span = 수명", "span = 기간", "be over = 끝나다"], "x": ["their life span of two years는 ‘2년이라는 그들의 수명’이라는 뜻이다.", "is over는 ‘끝나다’라는 뜻이다.", "life span은 살아 있는 기간을 말한다."]}, "3": {"c": "g", "t": "external : 외부의", "n": ["external = 외부의, 외적인", "(반의어) internal = 내부의", "external causes = 외부적 원인"], "x": ["external causes는 ‘외부적 원인’이라는 뜻이다.", "밖에서 오는 위험을 말한다.", "뒤에 나오는 internal causes(노화 등 내부적 원인)와 짝을 이루는 반의어이다."]}, "4": {"c": "g", "t": "due to : ~ 때문에", "n": ["due to ~ = ~ 때문에 (= because of)", "not due to ~ = ~ 때문이 아닌", "뒤에 명사(구)가 옴"], "x": ["not due to internal causes는 ‘내부적 원인 때문이 아니라’라는 뜻이다.", "due to 뒤에는 명사(구)가 온다.", "not A but B가 아닌 not A 구조로, 앞의 from external causes와 대비된다."]}, "5": {"c": "g", "t": "age : 나이 들다, 노화하다 / 나이", "n": ["aging = 노화", "age = 나이 들다, 늙다", "(다의어) age = 나이, 시대"], "x": ["aging은 ‘노화’라는 뜻이다.", "동사 age(나이 들다)의 -ing형이 명사처럼 쓰였다.", "age는 명사로 ‘나이’, 동사로 ‘나이 들다’라는 뜻이다."]}, "6": {"c": "p", "t": "That is why + 절 : 그것이 ~한 이유이다", "n": ["That is why ~ = 그것이 ~한 이유이다", "why 이하 = 보어 역할의 명사절", "make + O + to V = O가 ~하도록 만들다 (PDF 표기)"], "x": ["기준 : 시험지 원문이 ‘has made mice to live’로 인쇄돼 있다. 그대로 두고 ‘쥐를 살게 했다’로 읽는다.", "That is why nature has made mice to live ~는 ‘그것이 자연이 쥐를 ~ 살게 만든 이유이다’라는 뜻이다.", "앞 문장의 내용이 원인이고 why절은 그 결과를 말한다.", "the reason이 생략된 관계부사 why절로 보며, 명사절 역할을 한다.", "has made는 현재완료이다. 원문에는 make mice to live로 되어 있다."]}, "7": {"c": "g", "t": "on average : 평균적으로", "n": ["on average = 평균적으로", "average = 평균(의)", "(다의어) average = 평범한"], "x": ["on average는 ‘평균적으로’라는 뜻이다.", "average는 명사로 ‘평균’, 형용사로 ‘평균의, 평범한’이라는 뜻이다.", "for no longer than two years는 ‘2년을 넘지 않는 기간 동안’이라는 뜻이다."]}, "8": {"c": "g", "t": "arrive at : ~에 도달하다", "n": ["arrive at ~ = ~에 도달하다", "have arrived = 도달했다 (현재완료)", "important point = 중요한 지점"], "x": ["we have arrived at an important point는 ‘우리는 중요한 지점에 도달했다’라는 뜻이다.", "have arrived는 현재완료로 이제 막 도착했음을 나타낸다.", "콜론(:) 뒤에 그 중요한 지점의 내용이 나온다."]}, "9": {"c": "g", "t": "rate : 속도, 비율", "n": ["rate = 속도, 비율", "the rate at which it ages = 그것이 노화하는 속도", "(다의어) rate = 평가하다"], "x": ["the rate at which it ages는 ‘그것이 늙는 속도’라는 뜻이다.", "at which는 ‘전치사 + 관계대명사’로 the rate를 꾸미는 절을 이끈다.", "rate는 ‘속도, 비율’이라는 뜻이고 동사로 ‘평가하다’라는 뜻도 있다."]}, "10": {"c": "o", "t": "it = an animal species", "n": ["it = an animal species", "ages = 동사 age(늙다)의 3인칭 단수형"], "x": ["the rate at which it ages의 it은 앞의 an animal species를 가리킨다.", "ages는 동사 age의 3인칭 단수 현재형이다.", "‘그 종이 늙는 속도’라는 뜻이다."]}, "11": {"c": "g", "t": "determine : 결정하다", "n": ["determine = 결정하다", "be determined by ~ = ~에 의해 결정되다", "(파생) determination = 결심, 결정"], "x": ["is determined by ~는 ‘~에 의해 결정된다’라는 뜻이다.", "determined는 동사 determine의 과거분사이고 be + 과거분사로 수동태를 이룬다.", "이 글의 주제를 말하는 핵심 동사이다."]}, "12": {"c": "k", "t": "주제문 : 평균 수명 = 야생에서의 평균 생존 시간", "n": ["average life span = 평균 수명", "the average time that this animal species can survive in the wild = 이 종이 야생에서 생존할 수 있는 평균 시간", "빈칸에 들어갈 표현"], "x": ["동물 종의 평균 수명과 노화 속도는 그 종이 야생에서 버틸 수 있는 평균 시간으로 정해진다는 말이다.", "that은 the average tim
