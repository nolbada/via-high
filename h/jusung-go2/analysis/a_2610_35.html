<script>
var CAT={g:"어휘",o:"대명사",b:"연결어",k:"핵심 문장",p:"구문"};
var P={"num": "35", "sub": "고2 · 감염병과 싸워 온 의학의 진보", "one": "의학의 과학적 발전과 기술이 페니실린·백신·위생 관리·치료법을 통해 감염병의 치료와 예방에 엄청난 진보를 가져옴", "flow": [{"label": "도입부", "range": "1번", "sum": "의료 현장의 과학적 발전과 기술이 감염병의 치료와 예방에 엄청난 진보를 가져옴 <small>(enormous progress)</small>", "eg": "예전에는 목숨을 걸어야 했던 병을 이제는 주사 한 대, 약 몇 알로 이겨 내는 모습"}, {"label": "본론 (1)", "range": "2번", "sum": "1928년 Fleming의 페니실린 발견이 감염병과의 싸움에서 가장 큰 돌파구 중 하나 <small>(breakthroughs)</small>", "eg": "오랫동안 막혀 있던 게임 관문을 단번에 뚫어 주는 결정적 아이템"}, {"label": "본론 (2)", "range": "3~4번", "sum": "Jenner가 무해한 우두에 노출되면 천연두로부터 보호된다는 것을 발견, 실험실 백신이 질병 부담을 줄이고 천연두 계열 바이러스(poxvirus) 퇴치까지 이끔 <small>(elimination of poxvirus)</small>", "eg": "약한 상대와 미리 연습 경기를 치러 진짜 강적에 대비하는 원리"}, {"label": "결론", "range": "5번", "sum": "콜레라·말라리아는 통제와 위생 관리로 부담이 줄고, 다른 병은 치료법이 치명적인 바이러스 질환을 관리 가능한 만성 질환으로 바꿈 <small>(chronic manageable diseases)</small>", "eg": "손 씻기와 깨끗한 물로 병을 막고, 매일 약을 먹으며 병과 함께 일상을 지키는 모습"}], "sents": [{"n": 1, "mk": "Scientific developments and technologies [1|in medical practice] [2|have brought us enormous progress] in [3|the treatment and prevention] of [4|infectious] diseases.", "ko": "의료 행위에서의 과학적 발전들과 기술들은 우리에게 전염병의 치료와 예방에 있어 엄청난 진보를 가져다주었다.", "star": true}, {"n": 2, "mk": "The discovery of penicillin in 1928 by Alexander Fleming, [5|for which he later received the Nobel Prize], [6|was] [7|one of the biggest breakthroughs] [8|in the battle against] infectious diseases.", "ko": "1928년에 Alexander Fleming에 의한 페니실린의 발견은 전염병과의 싸움에서 가장 큰 획기적 발전들 중 하나였으며, 그것에 대해 그는 후에 노벨상을 받았다.", "star": true}, {"n": 3, "mk": "Edward Jenner [9|discovered around 1796 that] humans [10|were protected against] the [11|deadly] smallpox virus after [12|exposure to] the cowpox virus, [13|which is harmless to humans].", "ko": "1796년경 Edward Jenner는 인간들에게 무해한 우두 바이러스에 인간들이 노출된 후 치명적인 천연두 바이러스로부터 보호된다는 점을 발견했다."}, {"n": 4, "mk": "[14|Vaccines developed in laboratories] [15|have contributed enormously to] the reduction of the [16|burden] of [17|bacterial and viral] diseases [1
