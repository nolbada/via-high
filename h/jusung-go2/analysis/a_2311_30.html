<script>
var CAT={g:"어휘",o:"대명사",b:"연결어",k:"핵심 문장",p:"구문"};
var P={"src": "23년 11월 30번", "sub": "고2 · 기술 발전과 사생활", "one": "기술이 발전하면 사생활 개념을 이해하는 방식도 바뀌어, 보호를 넓히면서도 공공 이익을 위해 일부 포기를 요구받음", "flow": [{"label": "도입부", "range": "1~2번", "sum": "기술은 사생활 개념을 이해하는 방식을 바꿈, 새 능력이 있다고 해서 남을 들여다보는 것이 정당화되지는 않음 <small>(concept of privacy)<\/small>", "eg": "손에 드론이 생겼다고 이웃집 마당을 찍어도 되는 것은 아님"}, {"label": "본론 (1)", "range": "3~4번", "sum": "기술 발전은 사생활 보호를 어떻게 넓힐지 고려하도록 요구, 카메라 등장 때 법 제정을 두고 다툼 <small>(protections should be expanded)<\/small>", "eg": "드론이 처음 나왔을 때 마을 사람들이 촬영 금지 규칙을 두고 다툼"}, {"label": "본론 (2)", "range": "5~6번", "sum": "새 기술이 사적 공간과 공적 공간의 구별을 재확인, 공공장소에 들어서면 보이고 녹화되는 것에 동의한 것으로 봄 <small>(private and public spaces)<\/small>", "eg": "집 안은 촬영 금지, 공원에 들어서면 촬영될 수 있다는 암묵적 합의"}, {"label": "결론", "range": "7번", "sum": "감시 카메라가 불편해도 대부분 문화권의 시민들은 관찰되지 않을 권리를 포기하는 것이 해가 더 적다는 사실에 순응 <small>(adjusted to the fact)<\/small>", "eg": "처음엔 불편하던 드론 방범도 마을 안전에 도움이 되니 결국 받아들임"}], "sents": [{"n": 1, "mk": "Technology changes [1|how individuals and societies understand the concept of privacy].", "ko": "기술은 개인들과 사회가 사생활의 개념을 이해하는 방식을 변화시킨다."}, {"n": 2, "mk": "The fact [2|that someone has a new ability to access information or watch the actions of another] does not [3|justify] doing so.", "ko": "누군가 정보에 접근하거나 다른 사람의 행동을 관찰하는 새로운 능력을 갖고 있다는 사실이 그렇게 하는 것을 정당화하지는 않는다."}, {"n": 3, "mk": "[4|Rather], advances in technology [5|require] citizens and [6|policy makers] to consider how privacy protections should be expanded.", "ko": "오히려, 기술의 발전은 시민들과 정책 입안자들이 사생활 보호가 어떻게 확대되어야 하는지를 고려할 것을 요구한다."}, {"n": 4, "mk": "[8|For example], when cameras first became available for [9|commercial] and private use, nations and citizens [10|struggled over] [11|whether new laws should be enacted] to protect individuals from being photographed without their permission.", "ko": "예를 들어, 카메라가 상업적 용도와 사적 용도로 처음 사용 가능해졌을 때, 국가들과 시민들은 개인들을 그들의 허가 없이 사진이 찍히는 것으로부터 보호하기 위해 새로운 법이 제정되어야 하는지에 대해 투쟁했다."}, {"n": 5, "mk": "The [12|reconsideration] of privacy [13|brought about by this new tec
