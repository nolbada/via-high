<script>
var CAT={g:"어휘",o:"대명사",b:"연결어",k:"핵심 문장",p:"구문"};
var P={"src": "22년 11월 35번", "sub": "고2 · 질투를 감추는 이유", "one": "질투는 가장 알아차리기 어려운 감정, 우리는 느끼는 즉시 불공평함 같은 다른 감정으로 바꿔 스스로에게도 감춤", "flow": [{"label": "도입부", "range": "1~2번", "sum": "질투는 가장 이해하기 어려운 감정, 행동을 움직이는 질투를 알아차리기도 어려움 <small>(elusive)<\/small>", "eg": "친구의 새 가방이 부러워 괜히 짜증이 났는데, 왜 그런지 나도 모름"}, {"label": "본론 (1)", "range": "3번", "sum": "질투를 느껴도 거의 직접 표현하지 않는 것이 모호한 이유 <small>(almost never directly express)<\/small>", "eg": "새 가방을 자랑해도 ‘부럽다’ 대신 ‘예쁘네’라고만 말함"}, {"label": "본론 (2)", "range": "4~5번", "sum": "질투는 내가 열등하다는 인정을 수반, 그것을 남이 아는 것은 더 나쁨 <small>(admission of inferiority)<\/small>", "eg": "‘나는 저 가방이 없다’고 인정하는 것도 쓰린데, 친구가 눈치채면 더 창피함"}, {"label": "무관한 문장", "range": "6번", "sum": "질투가 질병을 부를 수 있다는 내용, 앞뒤 흐름에서 벗어난 문장 <small>(illness)<\/small>", "eg": "가방 이야기를 하다가 갑자기 건강 이야기가 튀어나옴"}, {"label": "결론 = 요지", "range": "7번", "sum": "질투를 느끼는 즉시 스스로에게 감추고 불공평함·분개로 바꿔 인식 <small>(disguise it to ourselves)<\/small>", "eg": "‘부러운 게 아니라 저 친구만 가방을 받은 게 불공평해’라고 스스로를 설득함"}], "sents": [{"n": 1, "mk": "Of all the human emotions, [1|none is trickier or more elusive than envy].", "ko": "모든 인간의 감정 중에서, 질투보다 더 까다롭거나 더 이해하기 어려운 것은 없다."}, {"n": 2, "mk": "[2|It] is very difficult [3|to actually discern] the envy that [5|motivates] people’s actions.", "ko": "사람들의 행동을 자극하는 질투를 실제로 알아차리는 것은 매우 어렵다."}, {"n": 3, "mk": "The reason for this [6|elusiveness] is simple : [7|we almost never directly express the envy we are feeling].", "ko": "이러한 모호함의 이유는 간단한데, 우리는 우리가 느끼고 있는 질투를 대부분 절대 직접적으로 표현하지 않는다."}, {"n": 4, "mk": "Envy [9|entails] the [10|admission] to ourselves [11|that] we are [13|inferior to] another person in something [12|we value].", "ko": "질투는 우리가 가치 있게 여기는 무언가에서 우리가 또 다른 사람보다 열등하다는 스스로에 대한 인정을 수반한다."}, {"n": 5, "star": 1, "mk": "[14|Not only is] [15|it] painful to admit this inferiority, but [22|it] is even worse [16|for others to see] that we are feeling [21|this].", "ko": "이 열등감을 인정하는 것은 고통스러울 뿐만 아니라, 우리가 이것을 느끼고 있다는 것을 다른 사람들이 알게 되는 것은 훨씬 더 나쁘다."}, {"n": 6, "mk": "Envy can [23|cause] ill  h+='<div class="card" id="text">'+textHTML()+'</div>';
 h+='<div class="tabs" id="tabs"><button data-c="all" class="on">전체</button>';
 Object.keys(CAT).forEach(function(c){h+='<button data-c="'+c+'" class="c-'+c+'">'+CAT[c]+'</button>';});
 h+='</div><div id="items"></div>';
 h+='<div class="ft">비타민 영어클리닉 · 주성고 영어II</div>';
 document.getElementById("app").innerHTML=h;
 items();
}
function items(){
 var out="",seen={};
 S.forEach(function(s){
  var ids=[];s.mk.replace(/\[(\d+)\|/g,function(m,id){if(!seen[id]){seen[id]=1;ids.push(id);}});
  ids.forEach(function(id){var it=I[id];if(cur!="all"&&it.c!=cur)return;
   out+='<div class="it c-'+it.c+'" id="it'+id+'"><h4><span class="tl">'+it.t+'</span><span class="tag">'+CAT[it.c]+'</span></h4>';
   out+='<div class="quote">'+s.n+'. '+hl2(s.mk,id)+'<div class="qk">'+s.ko+'</div></div>';
   out+='<div class="note"><div class="nl">노트 정리</div>'+it.n.map(function(l){return '<div class="ln">'+l+'</div>';}).join("")+'</div>';
   out+='<div class="xs">'+it.x.map(function(l){return '<div>'+l+'</div>';}).join("")+'</div>';
   if(it.e)out+='<div class="eg">'+it.e+'</div>';
   out+='<button class="bkb" data-back="'+s.n+'">본문으로 돌아가기</button></div>';
  });
 });
 document.getElementById("items").innerHTML=out;
}
function hl2(s,id){return s.replace(/\[(\d+)\|([^\]]+)\]/g,function(m,i,t){return i==id?'<span class="hlk c-'+I[i].c+'">'+t+'</span>':t;});}
document.addEventListener("click",function(e){
 var t=e.target;
 
 if(t.dataset&&t.dataset.id){var el=document.getElementById("it"+t.dataset.id);if(el){el.scrollIntoView({behavior:"smooth",block:"center"});el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash");}return;}
 if(t.closest&&t.closest("#tabs")&&t.dataset.c){cur=t.dataset.c;setTabs();document.getElementById("text").innerHTML=textHTML();items();return;}
 if(t.dataset&&t.dataset.back){var p=document.getElementById("s"+t.dataset.back);p.scrollIntoView({behavior:"smooth",block:"center"});return;}
 if(t.tagName=="I"&&t.parentNode.classList.contains("ps")){t.parentNode.classList.toggle("open");}
});
function setTabs(){[].forEach.call(document.querySelectorAll("#tabs button"),function(b){b.classList.toggle("on",b.dataset.c==cur);});}
render();
</script>
