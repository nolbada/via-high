<style>

 --gd:#15803d;--gl:#c6efcf;--bd:#1d4ed8;--bl:#cfe0fb;--kd:#be185d;--kl:#fbcfe3;--od:#c2570c;--ol:#ffe0b8;--pd:#6d28d9;--pl:#e4d9fb}

 --gd:#4ade80;--gl:#16361f;--bd:#8ab4ff;--bl:#1a2a4a;--kd:#f472b6;--kl:#401a30;--od:#fb923c;--ol:#43270f;--pd:#c4a8ff;--pl:#2c2147}}

body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.55;font-size:16px}

.c-g{--d:var(--gd);--l:var(--gl)}.c-b{--d:var(--bd);--l:var(--bl)}.c-k{--d:var(--kd);--l:var(--kl)}.c-o{--d:var(--od);--l:var(--ol)}.c-p{--d:var(--pd);--l:var(--pl)}

.fr span{padding-top:2px}.fr strong{font-weight:800}.fr small{font-weight:600;color:var(--sub);font-size:12.5px}.eg2{margin-top:4px;color:var(--pri);font-size:13.5px;font-weight:600;border-left:3px solid var(--pri);padding-left:8px}
.fr em{font-style:normal;color:var(--sub);font-size:12.5px;font-weight:800;margin-right:4px}
.ps{font-size:16px;line-height:2;display:flex;gap:8px;border-top:1px solid var(--line);padding-top:4px;margin-top:4px}.ps:first-of-type{border-top:0;margin-top:0}

.ps .ko{display:none;font-size:13.5px;color:var(--sub);line-height:1.6;margin-top:2px}.ps.open .ko{display:block}

.it{background:var(--l);border:1.5px solid var(--d);border-radius:14px;padding:12px 14px 13px;margin-bottom:10px}

.quote{background:var(--card);border-radius:10px;padding:7px 10px;margin:0 0 8px;font-size:14.5px;line-height:1.7}
.quote .qk{font-size:13px;color:var(--sub);margin-top:2px;line-height:1.5}
.it .xs{margin:7px 0 0;font-size:14px;line-height:1.65}

.note{background:var(--note);border:1.5px dashed var(--noteL);border-radius:10px;padding:7px 11px;background-image:repeating-linear-gradient(transparent,transparent 25px,var(--noteLn) 25px,var(--noteLn) 26px)}
.note .nl{font-size:11.5px;font-weight:800;color:var(--noteT);margin-bottom:2px}.note .ln{font-size:14px;font-weight:700;line-height:26px;color:var(--ink)}
.bkb{margin-top:8px;border:1.5px solid var(--d);background:var(--card);color:var(--d);border-radius:999px;padding:6px 14px;font:700 13px inherit;font-family:inherit;cursor:pointer}
.flash{animation:fl 1.4s ease}@keyframes fl{0%,60%{box-shadow:0 0 0 4px #f5c84288}100%{box-shadow:none}}
.qz{background:var(--card);border:1.5px solid var(--pri);border-radius:14px;padding:12px 14px 14px;margin-bottom:10px}.qz .qt{font-size:15.5px;font-weight:800;margin-bottom:8px}.nb{display:flex;gap:6px;flex-wrap:wrap}.nb button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:800 16px inherit;font-family:inherit;cursor:pointer}.nb button.bad{background:#fde2e2;border-color:#d33;color:#a11;text-decoration:line-through}.w{cursor:pointer;border-radius:3px}.w.ok{background:var(--bl);border-bottom:2px solid var(--bd);font-weight:800}.w.bad{background:#fde2e2}.rec{font-size:13px;font-weight:800;color:var(--sub);margin:0 2px 10px}.ft{text-align:center;font-size:12.5px;color:var(--sub);margin-top:18px}

<script>
var CAT={g:"어휘",o:"대명사",b:"연결어",k:"핵심 문장",p:"구문"};
var P={"src": "23년 11월 41번", "sub": "고2 · 공연자와 청중의 거리", "one": "공연자의 배경을 알려 주어 공연자와 청중 사이의 구분을 허물면 청중이 공연자와 가까워지고 경험이 풍부해짐", "flow": [{"label": "도입부", "range": "1~2번", "sum": "서양 음악 공연은 공연자는 행위자, 청중은 수동적인 쪽으로 가르고 공연 공간이 이를 더 굳힘 <small>(a clear distinction)<\/small>", "eg": "무대는 높고 객석은 어두워서 연주자와 관객이 딱 나뉜 콘서트홀"}, {"label": "본론 (1)", "range": "3~4번", "sum": "청중은 공연자에게 특별히 다가갈 기회를 높이 사고, 청중 참여를 넣은 음악가는 호응을 얻음 <small>(special “access”)<\/small>", "eg": "공연 중 관객이 같이 노래를 따라 부르면 분위기가 확 살아남"}, {"label": "본론 (2)", "range": "5~7번", "sum": "청중 참여는 모두의 몰입과 즐거움을 높이고, 불편한 공연자는 관점을 슬쩍 보여 주거나 프로그램 해설을 제공 <small>(program notes)<\/small>", "eg": "박수 리듬을 알려 주는 연주자, 곡 소개가 적힌 안내지를 나눠 주는 연주자"}, {"label": "결론", "range": "8~11번", "sum": "공연자에 관한 배경 정보가 청중을 공연자에게 가깝게 만들어 경험을 높임 <small>(feel closer)<\/small>", "eg": "연주자가 이 곡을 고른 이유를 알고 나면 무대 위 사람이 가깝게 느껴짐"}], "sents": [{"n": 1, "mk": "In Western society, many music performance settings [1|make a clear distinction between] performers and audience members: the performers are the “doers” and [2|those] in the audience take a decidedly [3|passive] role.", "ko": "서양 사회에서, 많은 음악 공연 상황은 공연자와 청중 사이에 명확한 구분을 만드는데, 공연자들은 ‘행위자들’이고 청중 속 사람들은 분명히 수동적인 역할을 맡는다."}, {"n": 2, "mk": "The performance space itself may further [5|reinforce] the distinction with a physical separation between the stage and audience seating.", "ko": "공연 공간 그 자체가 무대와 청중석 사이의 물리적 분리로 구분을 더 강화할 수 있다."}, {"n": 3, "mk": "Perhaps because this distinction is so common, [10|audiences seem to greatly value opportunities to have special “access” to performers] that affords understanding about performers‘ style of music.", "ko": "아마도 이러한 구분이 너무 흔하기 때문에, 청중들은 공연자의 음악 스타일에 대한 이해를 제공하는, 공연자에 대한 특별한 ‘접근’을 할 기회에 크게 가치를 부여하는 것처럼 보인다."}, {"n": 4, "mk": "Some performing musicians have won great [12|approval] by regularly [13|incorporating] “audience participation” into their concerts.", "ko": "일부 공연 음악가들은 정기적으로 ‘청중 참여’를 그들의 콘서트에 포함함으로써 큰 호응을 받아 왔다."}, {"n": 5, "mk": "[14|Whether] by leading a sing-along activity [14|or] [15|teaching a rhythm to be clapped] at certain points, [16|including audience members in the music making] can [17|boost] the level of engagement and enjoyment for all involved.", "ko": "함께 노래 부르기 활동을 이끌든 지정된 지점에서 박수를 치도록 리듬을 가르치든, 음악을 만드는 데 청중 구성원을 포함하는 것은 모든 참여자의 참여와 즐거움의 수준을 높일 수 있다."}, {"n": 6, "mk": "Performers who are uncomfortable leading audience participation [25|can still connect with the audience] simply by giving a special [23|glimpse] of the performer [24|perspective].", "ko": "청중 참여를 이끄는 것에 불편함을 느끼는 공연자들은 단순히 그 공연자 관점을 특별히 흘끗 보여 줌으로써 청중과 여전히 이어질 수 있다."}, {"n": 7, "mk": "[26|It] is quite common in classical music [26|to provide audiences with program notes].", "ko": "클래식 음악에서는 청중에게 프로그램 해설을 제공하는 것이 상당히 흔하다."}, {"n": 8, "mk": "Typically, this text in a program gives background information about pieces of music [28|being performed] and perhaps biographical information about historically significant composers.", "ko": "전형적으로, 프로그램의 이러한 텍스트는 연주되는 작품에 대한 배경 정보와 아마도 역사적으로 중요한 작곡가들에 대한 전기 정보를 제공한다."}, {"n": 9, "mk": "[31|What may be of more interest to audience members is] background information about the very performers who are onstage, including an explanation of why [34|they] have chosen the music they are [35|presenting].", "ko": "청중들에게 더 흥미로울 수도 있는 것은 무대 위에 있는 바로 그 연주가에 관한 배경 정보이며, 왜 공연자들이 선보이고 있는 음악을 선택했는지에 대한 설명을 포함한다."}, {"n": 10, "mk": "Such [36|insight] can [37|make audience members feel closer] to the musicians onstage, [40|both] metaphorically [40|and] emotionally.", "ko": "그러한 통찰력은 청중들이 무대 위의 음악가들에게 비유적으로도 감정적으로도 더 가까이 느끼게 만들 수 있다."}, {"n": 11, "mk": "[38|This connection] will likely [39|enhance] the expressive and communicative experience.", "ko": "이러한 연결은 아마 표현적이고 소통적인 경험을 향상시킬 것이다."}], "items": {"1": {"c": "g", "t": "make a distinction between A and B : A와 B를 구분하다", "n": ["distinction = 구분, 차이", "distinguish = 구분하다", "make a clear distinction between A and B = A와 B 사이에 명확한 구분을 짓다"], "x": ["make a clear distinction between performers and audience members는 ‘공연자와 청중 사이에 명확한 구분을 짓는다’라는 뜻이다.", "distinction은 동사 distinguish(구분하다)의 명사형이다.", "between A and B는 ‘A와 B 사이에’라는 뜻이다.", "콜론(:) 뒤에서 그 구분의 내용을 설명한다. 공연자는 ‘행위자’, 청중은 수동적인 쪽이다."]}, "2": {"c": "o", "t": "those = people (사람들)", "n": ["those in the audience = 청중 속 사람들", "those = people"], "x": ["those in the audience의 those는 ‘사람들’이라는 뜻이다.", "those + 전치사구(in the audience)는 ‘~에 있는 사람들’로 해석한다.", "앞의 the performers와 대비되는 사람들이다."]}, "3": {"c": "g", "t": "passive : 수동적인", "n": ["passive = 수동적인, 소극적인", "(반의) active = 능동적인, 적극적인", "decidedly = 분명히, 확실히"], "x": ["a decidedly passive role은 ‘분명히 수동적인 역할’이라는 뜻이다.", "decidedly는 부사로 ‘분명히, 확실히’라는 뜻이다.", "청중은 보고 듣기만 하는 쪽이라는 말이다.", "take a role은 ‘역할을 맡다’라는 뜻이다."]}, "5": {"c": "g", "t": "reinforce : 강화하다", "n": ["reinforce = 강화하다, 보강하다", "(반의) weaken = 약화시키다", "further = 더, 한층 더"], "x": ["may further reinforce the distinction은 ‘구분을 더 강화할 수 있다’라는 뜻이다.", "further는 여기서 부사로 ‘더, 한층 더’라는 뜻이다.", "reinforce는 ‘힘을 더 싣다’라고 기억하면 된다.", "with a physical separation between the stage and audience seating은 ‘무대와 청중석 사이의 물리적 분리로’라는 뜻이다."]}, "10": {"c": "k", "t": "주제 : 청중은 공연자에게 특별히 다가갈 기회를 높이 평가함", "n": ["seem to V = ~하는 것처럼 보이다", "value = 가치를 부여하다, 높이 평가하다", "special “access” = 특별한 ‘접근’"], "x": ["audiences seem to greatly value opportunities ~는 ‘청중들은 ~할 기회를 크게 중요하게 여기는 것처럼 보인다’라는 뜻이다.", "value는 여기서 동사로 ‘가치를 부여하다, 높이 평가하다’라는 뜻이다. 명사 ‘가치’로도 쓰이는 다의어이다.", "access는 공연자에게 다가가 직접 접하는 것을 말한다.", "Perhaps because this distinction is so common은 ‘아마도 이 구분이 너무 흔하기 때문에’라는 뜻이다.", "that affords understanding about performers‘ style of music은 그 ‘접근’이 음악 스타일에 대한 이해를 제공한다는 설명이다."], "e": "쉬운 예시 : 공연이 끝난 뒤 연주자에게 직접 이야기를 들을 수 있으면 관객들이 특히 좋아한다."}, "12": {"c": "g", "t": "approval : 호응, 승인", "n": ["approval = 승인, 찬성, 호응", "approve = 승인하다, 찬성하다", "have won great approval = 큰 호응을 얻어 왔다"], "x": ["have won great approval은 ‘큰 호응을 얻어 왔다’라는 뜻이다.", "won은 동사 win의 과거분사이고, have won은 현재완료이다.", "approval은 동사 approve(승인하다, 찬성하다)의 명사형이다.", "여기서는 청중에게서 받은 좋은 반응이라는 뜻으로 function textHTML(){var h='';S.forEach(function(s){h+='<div class="ps" id="s'+s.n+'"><i>'+s.n+(s.star?'<br>★':'')+'</i><div><div class="en">'+hl(s.mk)+'</div><div class="ko">'+s.ko+'</div></div></div>';});return h;}
function strip(s){return s.replace(/\[(\d+)\|([^\]]+)\]/g,"$2");}
function hl(s){return s.replace(/\[(\d+)\|([^\]]+)\]/g,function(m,id,t){var it=I[id];if(cur!='all'&&it.c!=cur)return t;return '<span class="hlk c-'+it.c+'" data-id="'+id+'">'+t+'</span>';});}
function render(){
 var h='<h1>'+P.src+'</h1><div class="sub">'+P.sub+'</div>';

 h+='<div class="card" id="onec"><div class="lab">결국 이 얘기</div><div class="one">'+P.one+'</div></div>';
 h+='<div class="card"><div class="lab">글의 뼈대</div><div class="flow">';
 FLOW.forEach(function(f){h+='<div class="fr"><b>'+f[0]+'</b><span><em>'+f[1]+'</em><strong>'+f[2]+'</strong><div class="eg2">예) '+f[3]+'</div></span></div>';});
 h+='</div></div>';
 h+='<div class="card" id="text">'+textHTML()+'</div>';
 h+='<div class="tabs" id="tabs"><button data-c="all" class="on">전체</button>';
 Object.keys(CAT).forEach(function(c){h+='<button data-c="'+c+'" class="c-'+c+'">'+CAT[c]+'</button>';});
 h+='</div><div id="items"></div>';
 h+='<div class="ft">비타민 영어클리닉 · 주성고 영어II</div>';
 document.getElementById("app").innerHTML=h;
 items();
}
function items(){
 var out="",seen={};
 S.forEach(function(s){
  var ids=[];s.mk.replace(/\[(\d+)\|/g,function(m,id){if(!seen[id]){seen[id]=1;ids.push(id);}});
  ids.forEach(function(id){var it=I[id];if(cur!="all"&&it.c!=cur)return;
   out+='<div class="it c-'+it.c+'" id="it'+id+'"><h4><span class="tl">'+it.t+'</span><span class="tag">'+CAT[it.c]+'</span></h4>';
   out+='<div class="quote">'+s.n+'. '+hl2(s.mk,id)+'<div class="qk">'+s.ko+'</div></div>';
   out+='<div class="note"><div class="nl">노트 정리</div>'+it.n.map(function(l){return '<div class="ln">'+l+'</div>';}).join("")+'</div>';
   out+='<div class="xs">'+it.x.map(function(l){return '<div>'+l+'</div>';}).join("")+'</div>';
   if(it.e)out+='<div class="eg">'+it.e+'</div>';
   out+='<button class="bkb" data-back="'+s.n+'">본문으로 돌아가기</button></div>';
  });
 });
 document.getElementById("items").innerHTML=out;
}
function hl2(s,id){return s.replace(/\[(\d+)\|([^\]]+)\]/g,function(m,i,t){return i==id?'<span class="hlk c-'+I[i].c+'">'+t+'</span>':t;});}
document.addEventListener("click",function(e){
 var t=e.target;
 
 if(t.dataset&&t.dataset.id){var el=document.getElementById("it"+t.dataset.id);if(el){el.scrollIntoView({behavior:"smooth",block:"center"});el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash");}return;}
 if(t.closest&&t.closest("#tabs")&&t.dataset.c){cur=t.dataset.c;setTabs();document.getElementById("text").innerHTML=textHTML();items();return;}
 if(t.dataset&&t.dataset.back){var p=document.getElementById("s"+t.dataset.back);p.scrollIntoView({behavior:"smooth",block:"center"});return;}
 if(t.tagName=="I"&&t.parentNode.classList.contains("ps")){t.parentNode.classList.toggle("open");}
});
function setTabs(){[].forEach.call(document.querySelectorAll("#tabs button"),function(b){b.classList.toggle("on",b.dataset.c==cur);});}
render();
</script>
</body>
</html>
