<script>
var CAT={g:"어휘",o:"대명사",b:"연결어",k:"핵심 문장",p:"구문"};
var P={"src": "23년 11월 32번", "sub": "고2 · 잘못된 외부 정보의 기억 통합", "one": "사건 이후에 접한 잘못된 정보는 기억이 흐릿할수록 거부되지 못하고 원래 기억의 일부로 섞여 들어옴", "flow": [{"label": "도입부", "range": "1번", "sum": "사건 이후에 접한 정보는 이후의 기억하기에 영향을 줌 <small>(subsequent remembering)<\/small>", "eg": "친구에게 들은 말 때문에 어제 본 장면이 다르게 기억남"}, {"label": "주제", "range": "2번", "sum": "사건이 불충분하게 부호화됐거나 오래된 기억일수록 외부 정보가 쉽게 통합됨 <small>(integrate into)<\/small>", "eg": "어제 본 장면이 흐릿할수록 친구의 말이 그대로 내 기억이 됨"}, {"label": "본론 (1)", "range": "3번", "sum": "정보가 줄어든 기억에서는 새 정보가 거부될 가능성이 낮음 <small>(less likely)<\/small>", "eg": "장면이 가물가물하면 친구 말이 틀렸는지 확인할 방법이 없음"}, {"label": "본론 (1)", "range": "4번", "sum": "대신 현재 생각과 맞고 이야기가 되는 정보는 원래 경험의 일부로 받아들여짐 <small>(Instead)<\/small>", "eg": "내 짐작과 맞는 친구의 말은 처음부터 내가 본 것처럼 자리 잡음"}, {"label": "본론 (2)", "range": "5~6번", "sum": "이 과정은 알 수도 있지만 흔히 무의식적임 <small>(unconscious)<\/small>", "eg": "친구 말대로 장면을 떠올리면서도 그런 줄 모르고 있음"}, {"label": "결론", "range": "7~8번", "sum": "시간이 지나면 출처조차 잊고, 잘못된 정보의 출처는 법정까지 어디에나 있음 <small>(sources of misinformation)<\/small>", "eg": "누구에게서 들었는지 잊은 채 그 장면만 내 기억으로 남음"}], "sents": [{"n": 1, "mk": "[1|Information encountered after an event] can [2|influence] [3|subsequent] remembering.", "ko": "사건 이후에 마주친 정보는 이후의 기억하는 것에 영향을 미칠 수 있다."}, {"n": 2, "star": 1, "mk": "External information can easily [4|integrate into] a witness's memory, especially if the event was poorly [5|encoded] or the memory is from a distant event, [6|in which case] time and forgetting have [7|degraded] the original memory.", "ko": "외부 정보는 목격자의 기억에 쉽게 통합될 수 있는데, 특히 사건이 불충분하게 부호화되었거나 그 기억이 먼 사건으로부터 온 것이라면 그러하며, 이 경우 시간과 망각이 원래의 기억을 저하시켜 온 것이다."}, {"n": 3, "star": 1, "mk": "[8|With reduced information available in memory] [9|with which to confirm] the [10|validity] of post-event [11|misinformation], it is less likely [12|that this new information will be rejected].", "ko": "사후 잘못된 정보의 유효성을 확인하기 위해 기억에서 사용할 수 있는 줄어든 정보를 가지면, 이 새로운 정보가 거부될 가능성은 덜하다."}, {"n": 4, "mk": "[13|Instead], especially when it [14|fits] the witness's current thinking and can be used to create a story [15|that makes sense] to him or her, [16|it] may be integrated as part of the original experience.", "ko": "대신에, 특히 그것이 목격자의 현재 생각과 맞고 그 또는 그녀에게 이해되는 하나의 이야기를 만드는 데 사용될 수 있을 때, 그것은 원래 경험의 일부로서 통합될 수 있다."}, {"n": 5, "mk": "This process can be [17|explicit] ([18|i.e.], the witness knows it is happening), but it is often [19|unconscious].", "ko": "이 과정은 명시적일 수 있지만(즉, 목격자는 그것이 일어나고 있다는 것을 알고 있다), 그것은 흔히 무의식적이다."}, {"n": 6, "mk": "[20|That is], the witness might [21|find himself or herself thinking about the event differently] without awareness.", "ko": "즉, 목격자는 의식하지 못한 채 그 사건에 대해 다르게 생각하는 그 자신 또는 그녀 자신을 발견할지도 모른다."}, {"n": 7, "mk": "Over time, the witness may not even know the source of information that led to the (new) memory.", "ko": "시간이 지남에 따라, 목격자는 (새로운) 기억으로 이끈 정보의 출처조차 모를지도 모른다."}, {"n": 8, "mk": "Sources of misinformation in [22|forensic] contexts can be encountered anywhere, from discussions with other witnesses to social media searches, to multiple interviews with investigators or other legal professionals, and even in [23|court].", "ko": "법정의 상황에서 잘못된 정보의 출처는 다른 목격자들과의 토론에서부터 소셜 미디어 조사들, 수사관 또는 기타 법률 전문가들과의 다중 인터뷰들, 심지어 법정에서까지 어디에서나 마주쳐질 수 있다."}], "items": {"1": {"c": "p", "t": "과거분사구 : Information 꾸미기", "n": ["Information ← encountered after an event", "encounter = 마주치다, 접하다", "encountered = 동사 encounter의 과거분사"], "x": ["핵심 명사는 Information(정보)이다.", "encountered after an event는 ‘사건 이후에 마주친’이라는 뜻으로 Information을 뒤에서 꾸민다.", "encountered는 동사 encounter의 과거분사이다.", "뼈대는 Information can influence remembering이다."]}, "2": {"c": "g", "t": "influence : 영향을 미치다 / 영향", "n": ["influence = 영향을 미치다", "(다의어) influence = 영향(력)", "influence + 목적어 = ~에 영향을 주다"], "x": ["can influence subsequent remembering은 ‘이후의 기억하기에 영향을 미칠 수 있다’라는 뜻이다.", "여기서 influence는 동사이고, 명사로도 쓰인다.", "동사일 때는 전치사 없이 바로 목적어를 받는다."]}, "3": {"c": "g", "t": "subsequent : 이후의, 다음의", "n": ["subsequent = 이후의, 다음의", "subsequent to ~ = ~ 다음에", "remembering = 기억하는 것 (동명사)"], "x": ["subsequent remembering은 ‘(사건) 이후의 기억하기’라는 뜻이다.", "사건을 겪은 뒤에 그 일을 떠올릴 때를 말한다.", "remembering은 동사 remember의 -ing형으로 명사처럼 쓰였다."]}, "4": {"c": "g", "t": "integrate into : ~에 통합되다", "n": ["integrate into ~ = ~에 통합되다, 섞여 들어가다", "integrate = 통합시키다", "easily = 쉽게"], "x": ["can easily integrate into a witness’s memory는 ‘목격자의 기억에 쉽게 통합될 수 있다’라는 뜻이다.", "밖에서 들어온 정보가 원래 기억과 섞인다는 말이다.", "이 문장이 글의 주제를 말한다."]}, "5": {"c": "g", "t": "encode : 부호화하다", "n": ["encode = 부호화하다 (기억으로 저장하기 위해 바꾸다)", "poorly encoded = 불충분하게 부호화된", "(반의어) decode = 해독하다"], "x": ["기준 : 수동태 (the event was poorly encoded는 be + 과거분사 구조).", "the event was poorly encoded는 ‘사건이 불충분하게 부호화되었다’라는 뜻이다.", "본 것을 기억으로 제대로 저장하지 못했다는 말이다.", "encoded는 동사 encode의 과거분사이다."]}, "6": {"c": "p", "t": "in which case : 이 경우에", "n": ["in which case = 이 경우에는 (= and in that case)", "which = 앞 내용 전체를 가리키는 관계사", "계속적 용법으로 덧붙임"], "x": ["in which case time and forgetting have degraded ~는 ‘이 경우 시간과 망각이 ~을 저하시켜 왔다’라는 뜻이다.", "which는 앞의 ‘사건이 불충분하게 부호화됐거나 먼 사건일 때’를 가리킨다.", "앞 내용을 받아 그 경우의 결과를 덧붙이는 구문이다.", "have degraded는 현재완료로 ‘저하시켜 왔다’라는 뜻이다."]}, "7": {"c": "g", "t": "degrade : 저하시키다", "n": ["degrade = 저하시키다, 떨어뜨리다", "(파생) degradation = 저하", "the original memory = 원래의 기억"], "x": ["have degraded the original memory는 ‘원래의 기억을 저하시켜 왔다’라는 뜻이다.", "degraded는 동사 degrade의 과거분사이고 have와 함께 현재완료를 이룬다.", "시간이 지나고 잊으면서 기억이 흐려졌다는 말이다."]}, "8": {"c": "p", "t": "With + 명사 + 형용사구 : ~한 채로, ~이므로", "n": ["With + O + 형용사구 = O가 ~한 상태에서", "reduced information = 줄어든 정보", "available in memory = 기억에서 사용할 수 있는"], "x": ["With reduced information available in memory는 ‘기억에서 사용할 수 있는 정보가 줄어든 상태에서’라는 뜻이다.", "available in memory가 information을 뒤에서 꾸민다.", "reduced는 동사 reduce(줄이다)의 과거분사로 information을 앞에서 꾸민다.", "뼈대는 뒤의 it is less likely that ~이다."]}, "9": {"c": "p", "t": "전치사 + 관계대명사 + to V : ~하기 위한", "n": ["with which to confirm ~ = ~을 확인하기 위한 (정보)", "confirm = 확인하다", "information ← with which to confirm ..."], "x": ["with which to confirm the validity는 ‘유효성을 확인
