<style>

<script>
var CAT={g:"어휘",o:"대명사",b:"연결어",k:"핵심 문장",p:"구문"};
var P={"src": "24년 10월 29번", "sub": "고2 · 조건부 장소 선호 실험", "one": "동물이 어느 장소를 더 좋아하게 되는지를 전후로 비교하면, 그 동물이 무엇을 원하는지 알 수 있음", "flow": [{"label": "도입부", "range": "1번", "sum": "조건부 장소 선호는 동물이 무엇을 원하는지 알아내는 방법 <small>(Conditioned Place Preference)<\/small>", "eg": "쥐에게 방 두 개를 주고, 어느 방을 더 좋아하는지로 쥐의 속마음을 알아냄"}, {"label": "본론 (1)", "range": "2~4번", "sum": "두 장소를 서로 다른 경험과 연관시키도록 훈련시키고, 장소 선호도를 경험 전과 후에 모두 측정 <small>(associate, measured both before and after)<\/small>", "eg": "A방에는 먹이를, B방에는 아무것도 두지 않고 훈련한 뒤, 훈련 전후에 쥐가 어느 방에 오래 있는지 잼"}, {"label": "본론 (2)", "range": "5~6번", "sum": "선호 장소가 바뀌면 그 경험을 좋아한 것이고, 반대로 그 장소를 피하면 불쾌하게 느낀 것 <small>(shift, conversely)<\/small>", "eg": "먹이가 있던 A방에 더 오래 있으면 ‘좋았구나’, A방을 피해 B방에 가면 ‘싫었구나’"}, {"label": "결론", "range": "7~8번", "sum": "암에 걸린 쥐는 모르핀이 주어졌던 장소를 선호했고, 이는 모르핀을 원했다는 뜻 <small>(mice with cancer, morphine)<\/small>", "eg": "아픈 쥐는 모르핀을 맞았던 방에 계속 머물고, 건강한 쥐는 방을 가리지 않음"}], "sents": [{"n": 1, "mk": "[1|Conditioned Place Preference is a way of finding out what animals want].", "ko": "조건부 장소 선호도는 동물들이 무엇을 원하는지 알아내는 하나의 방법이다."}, {"n": 2, "mk": "Researchers train [2|them] to [3|associate] one place with an experience such as food or a loud noise and another place with something completely different, usually where nothing happens.", "ko": "연구자들은 그것들이 한 장소를 음식이나 시끄러운 소리와 같은 경험과 연관시키고 또 다른 장소를 완벽히 다른 어떤 것과 연관시키도록 훈련시키는데, 대개 그곳에서는 아무것도 일어나지 않는다."}, {"n": 3, "star": 1, "mk": "The two places [6|are made obviously different] [7|to make it as easy as possible] for the animal to associate each place with [8|what happened to it there].", "ko": "그 두 장소는 그 동물이 각 장소를 거기에서 그것에게 일어난 일과 연관시키는 것을 가능한 한 쉽게 만들기 위해 명백히 다르게 만들어진다."}, {"n": 4, "mk": "The animal’s [9|preference for] being in one place or another is [10|measured] both before and after its experiences in the two places.", "ko": "한 장소나 다른 장소에 있는 것에 대한 그 동물의 선호도는 두 장소에서 경험하기 전과 후에 모두 측정된다."}, {"n": 5, "mk": "If there is a [11|shift] in where the animal chooses to spend its time for the [13|reward], [14|this] suggests that [16|it] liked the experience and is trying to repeat [17|it].", "ko": "만약 동물이 보상을 위해 어디에서 시간을 보내기로 선택하는지에 변화가 있다면, 이것은 그것이 그 경험을 좋아했고 그것을 반복하려고 노력하는 중이라는 것을 시사한다."}, {"n": 6, "mk": "[18|Conversely], if [19|it] now [20|avoids] [21|the place the stimulus appeared] and starts to prefer the place it did not experience it, then [23|this] suggests that it found the stimulus unpleasant.", "ko": "반대로, 만약 그것이 이제 자극이 나타났던 장소를 피하고 그것을 경험하지 않았던 장소를 선호하기 시작한다면, 그러면 이것은 그것이 그 자극을 불쾌하게 느꼈다는 것을 시사한다."}, {"n": 7, "mk": "[25|For example], mice with cancer show a preference for the place [26|where they have been given morphine], [27|a drug used to relieve pain], [28|rather than] where they have received [29|saline], [30|whereas] healthy mice [31|developed] no such preference.", "ko": "예를 들어, 암에 걸린 쥐는 식염수를 받아 왔었던 곳보다 통증을 완화시키는 데 사용되는 약인 모르핀이 주어졌었던 장소에 대한 선호를 보여 준 반면, 건강한 쥐는 그러한 선호가 생기지 않았다."}, {"n": 8, "mk": "[32|This suggests that the mice with cancer wanted the morphine].", "ko": "이것은 암에 걸린 쥐가 그 모르핀을 원했음을 시사한다."}], "items": {"1": {"c": "k", "t": "주제문 : 조건부 장소 선호 = 동물이 원하는 것을 알아내는 방법", "n": ["Conditioned Place Preference = 조건부 장소 선호도 (실험 이름)", "a way of finding out = 알아내는 방법", "what animals want = 동물들이 원하는 것"], "x": ["이 글의 주제를 소개하는 첫 문장이다.", "a way of finding out ~은 ‘~을 알아내는 방법’이라는 뜻이다. of 뒤라서 동명사 finding이다.", "find out은 ‘알아내다’라는 뜻의 구동사이다.", "what animals want는 ‘동물들이 원하는 것’이라는 뜻의 명사절이고, finding out의 목적어이다.", "what이 want의 목적어라서 뒤 절(animals want)에 목적어가 없는 불완전한 절이다."], "e": "쉬운 예시 : 쥐에게 방 두 개를 주고 어느 방에서 더 오래 지내는지 보면, 쥐가 뭘 좋아하는지 알 수 있다."}, "2": {"c": "o", "t": "them = animals (동물들)", "n": ["them = animals (1번에 나온 동물들)", "train + O + to V = O가 ~하도록 훈련시키다"], "x": ["Researchers train them to associate ~의 them은 1번 문장의 animals를 가리킨다.", "train + O + to V는 ‘O가 ~하도록 훈련시키다’라는 뜻이다.", "to associate의 의미상 주어는 목적어 them(동물들)이다."]}, "3": {"c": "g", "t": "associate A with B : A를 B와 연관시키다", "n": ["associate A with B = A를 B와 연관 짓다", "association = 연관, 연상 (명사)", "(다의어) associate = 동료 (명사)"], "x": ["associate one place with an experience는 ‘한 장소를 경험과 연관시키다’라는 뜻이다.", "A와 B 자리에 연결할 두 대상이 들어간다. 여기서는 장소와 경험이다.", "to 뒤라서 동사원형 associate이다.", "associate는 명사로 ‘동료’라는 뜻도 있다."]}, "6": {"c": "p", "t": "make + O + 형용사의 수동태 : 다르게 만들어지다", "n": ["make + O + C(형용사) = O를 ~하게 만들다", "O is made + 형용사 = O가 ~하게 만들어지다", "made = 동사 make(만들다)의 과거분사"], "x": ["are made obviously different는 ‘명백히 다르게 만들어진다’라는 뜻이다.", "능동문 make the two places obviously different에서 목적어가 주어로 나간 수동태이다.", "different는 보어로 남은 형용사이다.", "obviously는 부사이고, 형용사 different를 꾸민다. ‘obvious different’로 쓰지 않는다."]}, "7": {"c": "p", "t": "make it as easy as possible : 가목적어 it", "n": ["make + it(가목적어) + 형용사 + to V(진목적어)", "as easy as possible = 가능한 한 쉽게", "for + 의미상 주어 + to V"], "x": ["to make it as easy as possible for the animal to associate ~는 ‘그 동물이 ~을 연관시키는 것을 가능한 한 쉽게 만들기 위해’라는 뜻이다.", "it은 가목적어이고, 진짜 목적어는 뒤의 to associate ~이다.", "for the animal은 to associate의 의미상 주어이다.", "맨 앞의 to make는 ‘~하기 위해’라는 목적의 to부정사이다."]}, "8": {"c": "p", "t": "관계대명사 what : 전치사 with의 목적어 명사절", "n": ["what happened to it there = 거기서 그것에게 일어난 일", "it = the animal (그 동물)", "happen to ~ = ~에게 일어나다"], "x": ["associate each place with what happened to it there는 ‘각 장소를 거기서 그것에게 일어난 일과 연관시키다’라는 뜻이다.", "what은 ‘~하는 것’이라는 뜻이고, 여기서는 주어 역할이라 바로 뒤에 동사 happened가 온다.", "happened는 동사 happen(일어나다)의 과거형이다.", "what절은 전치사 with의 목적어이다. it은 the animal, there는 각 장소를 가리킨다."]}, "9": {"c": "g", "t": "preference for ~ : ~에 대한 선호", "n": ["preference = 선호, 선호도", "prefer = 선호하다 (동사)", "preference for ~ = ~에 대한 선호"], "x": ["The animal’s preference for being in one place or another는 ‘한 장소나 다른 장소에 있는 것에 대한 그 동물의 선호’라는 뜻이다.", "preference는 동사 prefer(선호하다)의 명사형이다. 품사 변형으로 출제될 수 있다.", "for는 전치사라서 뒤에 동명사 being이 왔다."]}, "10": {"c": "g", "t": "measure : 측정하다", "n": ["measure = 측정하다, 재다", "measurement = 측정 (명사)", "(다의어) measure = 조치, 대책 (명사)"], "x": ["is measured both before and after ~는 ‘~ 전과 후에 모두 측정된다’라는 뜻이다.", "is measured는 be + 과거분사로 만든 수동태이다. measured는 동사 measure의 과거분사이다.", "both    out+='<div class="it c-'+it.c+'" id="it'+id+'"><h4><span class="tl">'+it.t+'</span><span class="tag">'+CAT[it.c]+'</span></h4>';
   out+='<div class="quote">'+s.n+'. '+hl2(s.mk,id)+'<div class="qk">'+s.ko+'</div></div>';
   out+='<div class="note"><div class="nl">노트 정리</div>'+it.n.map(function(l){return '<div class="ln">'+l+'</div>';}).join("")+'</div>';
   out+='<div class="xs">'+it.x.map(function(l){return '<div>'+l+'</div>';}).join("")+'</div>';
   if(it.e)out+='<div class="eg">'+it.e+'</div>';
   out+='<button class="bkb" data-back="'+s.n+'">본문으로 돌아가기</button></div>';
  });
 });
 document.getElementById("items").innerHTML=out;
}
function hl2(s,id){return s.replace(/\[(\d+)\|([^\]]+)\]/g,function(m,i,t){return i==id?'<span class="hlk c-'+I[i].c+'">'+t+'</span>':t;});}
document.addEventListener("click",function(e){
 var t=e.target;
 
 if(t.dataset&&t.dataset.id){var el=document.getElementById("it"+t.dataset.id);if(el){el.scrollIntoView({behavior:"smooth",block:"center"});el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash");}return;}
 if(t.closest&&t.closest("#tabs")&&t.dataset.c){cur=t.dataset.c;setTabs();document.getElementById("text").innerHTML=textHTML();items();return;}
 if(t.dataset&&t.dataset.back){var p=document.getElementById("s"+t.dataset.back);p.scrollIntoView({behavior:"smooth",block:"center"});return;}
 if(t.tagName=="I"&&t.parentNode.classList.contains("ps")){t.parentNode.classList.toggle("open");}
});
function setTabs(){[].forEach.call(document.querySelectorAll("#tabs button"),function(b){b.classList.toggle("on",b.dataset.c==cur);});}
render();
</script>
</body>
</html>
