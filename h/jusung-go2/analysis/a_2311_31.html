var CAT={g:"어휘",o:"대명사",b:"연결어",k:"핵심 문장",p:"구문"};
var P={"src": "23년 11월 31번", "sub": "고2 · 기적과 무지", "one": "기적은 자연의 이치를 모르는 무지에서 나온 말이며, 원인을 따져 보기 귀찮아하는 사람들의 핑계", "flow": [{"label": "도입부", "range": "1번", "sum": "통계적으로 불가능한 우연을 비이성적 사건으로 보고 어떤 이는 기적이라 정의 <small>(define it as a miracle)<\/small>", "eg": "복권에 연달아 당첨된 사람의 이야기를 ‘기적’이라 부름"}, {"label": "주제", "range": "2번", "sum": "Montaigne : 기적의 기원은 자연이 아니라 자연에 대한 우리의 무지 <small>(ignorance)<\/small>", "eg": "복권 당첨의 원리를 모르니 ‘기적’처럼 느껴질 뿐"}, {"label": "본론 (1)", "range": "3~4번", "sum": "영광스러운 기적도 나중에 자연 법칙이나 당시 몰랐던 기술로 밝혀짐, 신비한 것은 아직 기적이 아님 <small>(not yet miracles)<\/small>", "eg": "복권 추첨의 확률 원리가 알려지면 ‘기적’이 ‘이해된 현상’으로 바뀜"}, {"label": "본론 (2)", "range": "5~6번", "sum": "기적은 인간 능력 너머 ‘더 높은 힘’의 개입을 가정하지만, 신의 계시 없이 기적을 일으키는 체계적 방법도 존재 <small>(methodical and simple ways)<\/small>", "eg": "당첨 확률을 올리는 방법을 알면 당첨은 신의 선물이 아님"}, {"label": "결론", "range": "7번", "sum": "사건의 근원을 조사해 찾는 대신 우리는 그것을 기적이라 정의 <small>(Instead of checking it out)<\/small>", "eg": "당첨 원리를 조사하는 대신 ‘기적이다’라고 말해 버림"}, {"label": "요지", "range": "8번", "sum": "기적은 생각하기에 너무 게으른 사람들의 핑계 <small>(too lazy to think)<\/small>", "eg": "‘기적이다’라는 말로 원인을 따져 보는 수고를 건너뜀"}], "sents": [{"n": 1, "mk": "[1|Coincidence] that is statistically impossible [3|seems to us like an irrational event], and some [4|define it as a miracle].", "ko": "통계적으로 불가능한 우연은 우리에게 비이성적인 사건처럼 보이고, 어떤 이들은 그것을 기적으로 정의한다."}, {"n": 2, "mk": "[5|But], [6|as Montaigne has said], “the origin of a miracle is in our [7|ignorance], at the level of our knowledge of nature, and not in nature itself.”", "ko": "그러나 Montaigne가 말했듯이, “기적의 기원은 우리의 무지에 있으며, 자연에 대한 우리 지식의 수준에 있지, 자연 그 자체에 있지 않다.”"}, {"n": 3, "mk": "[8|Glorious] miracles have been later on [9|discovered to be] [10|obedience to the laws of nature] or a technological development that was not widely known at the time.", "ko": "영광스러운 기적들은 자연의 법칙에 대한 순응이거나, 혹은 당시에는 널리 알려지지 않았던 기술적 발전인 것으로 나중에 발견되었다."}, {"n": 4, "mk": "As the German poet, Goethe, phrased it: “[13|Things that are mysterious are not yet miracles].”", "ko":
