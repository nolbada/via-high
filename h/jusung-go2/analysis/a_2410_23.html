var CAT={g:"어휘",o:"대명사",b:"연결어",k:"핵심 문장",p:"구문"};
var P={"src": "24년 10월 23번", "sub": "고2 · 쾌락과 고통의 균형", "one": "쾌락과 고통은 한 동전의 양면처럼 함께 작동해 몸의 균형을 유지, 고통을 피하려는 시도는 오히려 더 큰 고통", "flow": [{"label": "도입부", "range": "1~3번", "sum": "고통과 쾌락은 뇌의 같은 영역에서 처리, 몸은 균형(항상성)을 유지하려 함 <small>(homeostasis)<\/small>", "eg": "시소가 한쪽으로 기울면 몸이 알아서 다시 수평으로 맞추려 함"}, {"label": "본론 (1) = 주제", "range": "4번", "sum": "쾌락과 고통은 한 동전의 양면, 함께 작동하며 균형을 유지 <small>(two sides of the same coin)<\/small>", "eg": "시소의 양 끝처럼 한쪽이 올라가면 다른 쪽은 내려감"}, {"label": "본론 (2)", "range": "5~8번", "sum": "한쪽이 오르면 다른 쪽은 반드시 내려감, 고통을 피하려는 시도는 오히려 더 비참하게 함 <small>(No pain, no gain)<\/small>", "eg": "시소의 한쪽을 계속 눌러 올리려 할수록 반대쪽이 더 크게 내려감"}, {"label": "결론 = 주제 부연", "range": "9번", "sum": "고통은 중립 상태 유지에 필수, 고통을 받아들이면 내적 저울이 균형으로 복귀 <small>(reset our internal scale)<\/small>", "eg": "내려간 쪽을 받아들이면 시소가 다시 수평으로 돌아옴"}], "sents": [{"n": 1, "mk": "[1|Based on] discoveries in [2|neuroscience], pain and pleasure are formed and processed in the same area of the brain.", "ko": "신경과학의 발견에 따르면, 고통과 쾌락은 뇌의 같은 영역에서 형성되고 처리된다."}, {"n": 2, "mk": "Our bodies constantly [6|strive for] [7|homeostasis], [8|which is defined as] the balance of bodily functions.", "ko": "우리 몸은 끊임없이 항상성을 추구하는데, 그것은 신체 기능들의 균형으로 정의된다."}, {"n": 3, "mk": "[9|Without] the body’s effective [10|compensatory] [11|mechanisms], [12|which may cushion potential highs and lows], we would not be [13|capable of] surviving.", "ko": "잠재적인 높낮이를 완화시킬 수 있는 몸의 효과적인 보상 기제가 없다면, 우리는 생존할 수 없을 것이다."}, {"n": 4, "mk": "[14|Pleasure and pain are like two sides of the same coin]; they [17|seem to] work together and are [15|heavily reliant on] one another and keep balance.", "ko": "쾌락과 고통은 같은 동전의 두 면과 같은데, 그것들은 함께 작동하는 것 같으며 서로 상당히 의존하고 있고 균형을 유지한다."}, {"n": 5, "mk": "If you imagine pleasure and pain as the two opposite points on a [25|scale], you can easily understand that [21|as] [22|one] of the two points rises, [22|the other] must [24|correspondingly] fall.", "ko": "만약 여러분이 쾌락과 고통을 저울 위의 두 반대 지점으로 상상한다면, 두 지점 중 하나가 올라갈 때 다른 하나는 그에 상응하여 틀림없이 내려간  h+='<div class="card"><div class="lab">글의 뼈대</div><div class="flow">';
 FLOW.forEach(function(f){h+='<div class="fr"><b>'+f[0]+'</b><span><em>'+f[1]+'</em><strong>'+f[2]+'</strong><div class="eg2">예) '+f[3]+'</div></span></div>';});
 h+='</div></div>';
 h+='<div class="card" id="text">'+textHTML()+'</div>';
 h+='<div class="tabs" id="tabs"><button data-c="all" class="on">전체</button>';
 Object.keys(CAT).forEach(function(c){h+='<button data-c="'+c+'" class="c-'+c+'">'+CAT[c]+'</button>';});
 h+='</div><div id="items"></div>';
 h+='<div class="ft">비타민 영어클리닉 · 주성고 영어II</div>';
 document.getElementById("app").innerHTML=h;
 items();
}
function items(){
 var out="",seen={};
 S.forEach(function(s){
  var ids=[];s.mk.replace(/\[(\d+)\|/g,function(m,id){if(!seen[id]){seen[id]=1;ids.push(id);}});
  ids.forEach(function(id){var it=I[id];if(cur!="all"&&it.c!=cur)return;
   out+='<div class="it c-'+it.c+'" id="it'+id+'"><h4><span class="tl">'+it.t+'</span><span class="tag">'+CAT[it.c]+'</span></h4>';
   out+='<div class="quote">'+s.n+'. '+hl2(s.mk,id)+'<div class="qk">'+s.ko+'</div></div>';
   out+='<div class="note"><div class="nl">노트 정리</div>'+it.n.map(function(l){return '<div class="ln">'+l+'</div>';}).join("")+'</div>';
   out+='<div class="xs">'+it.x.map(function(l){return '<div>'+l+'</div>';}).join("")+'</div>';
   if(it.e)out+='<div class="eg">'+it.e+'</div>';
   out+='<button class="bkb" data-back="'+s.n+'">본문으로 돌아가기</button></div>';
  });
 });
 document.getElementById("items").innerHTML=out;
}
function hl2(s,id){return s.replace(/\[(\d+)\|([^\]]+)\]/g,function(m,i,t){return i==id?'<span class="hlk c-'+I[i].c+'">'+t+'</span>':t;});}
document.addEventListener("click",function(e){
 var t=e.target;
 
 if(t.dataset&&t.dataset.id){var el=document.getElementById("it"+t.dataset.id);if(el){el.scrollIntoView({behavior:"smooth",block:"center"});el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash");}return;}
 if(t.closest&&t.closest("#tabs")&&t.dataset.c){cur=t.dataset.c;setTabs();document.getElementById("text").innerHTML=textHTML();items();return;}
 if(t.dataset&&t.dataset.back){var p=document.getElementById("s"+t.dataset.back);p.scrollIntoView({behavior:"smooth",block:"center"});return;}
 if(t.tagName=="I"&&t.parentNode.classList.contains("ps")){t.parentNode.classList.toggle("open");}
});
function setTabs(){[].forEach.call(document.querySelectorAll("#tabs button"),function(b){b.classList.toggle("on",b.dataset.c==cur);});}
render();
</script>
</body>
