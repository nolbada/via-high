var P={"src": "24년 10월 26번", "sub": "고2 · Helen Suzman의 생애", "one": "Helen Suzman은 아파르트헤이트에 맞서 의회 안팎에서 평생 싸운 인권·민주주의의 대변자", "flow": [{"label": "인물 소개", "range": "1번", "sum": "아파르트헤이트에 대항한 운동가 <small>(an activist against apartheid)<\/small>", "eg": "위인전 첫 줄 : ‘그는 불의에 맞선 사람이었다’"}, {"label": "출생과 초기", "range": "2~3번", "sum": "1917년 유대인 이민자 부모 밑에서 태어나 대학 강사로 일하며 인종 관계 연구소에 가입 <small>(was born to, joined)<\/small>", "eg": "위인전 연표 : 1917년 출생, 대학 강사, 연구소 가입"}, {"label": "정치 활동", "range": "4~5번", "sum": "1953년 통합당 소속 의원이 되었다가 1959년 진보당 창당, 36년간 의회에서 정권의 남용을 폭로 <small>(left it, formed the Progressive Party)<\/small>", "eg": "위인전 연표 : 1953년 의원 당선, 1959년 새 정당 창당, 36년간 의회 활동"}, {"label": "은퇴 후와 말년", "range": "6~7번", "sum": "1989년 은퇴 후에도 다인종 민주주의를 지지하고 새 헌법 작성에 영향, 2009년 사망 때까지 대변자 <small>(continued to advocate for)<\/small>", "eg": "위인전 연표 : 1989년 은퇴, 새 헌법 작성에 참여, 2009년 별세"}], "sents": [{"n": 1, "mk": "[1|Helen Suzman was an activist against apartheid], [2|a racist political and social system in the Republic of South Africa].", "ko": "Helen Suzman은 남아프리카 공화국의 인종 차별적인 정치 및 사회 체제인 아파르트헤이트에 대항하는 운동가였다."}, {"n": 2, "mk": "Suzman [3|was born to] Jewish [4|immigrant] parents in Germiston in the Union of South Africa in 1917.", "ko": "Suzman은 1917년에 남아프리카 연방의 Germiston에서 유대인 이민자 부모 밑에서 태어났다."}, {"n": 3, "mk": "[5|While working as] a lecturer on economic history at Witwatersrand University, she [6|joined] the South African Institute of Race Relations.", "ko": "Witwatersrand 대학에서 경제사 강사로 일하던 중 그녀는 남아프리카 인종 관계 연구소에 들어갔다."}, {"n": 4, "mk": "In 1953, she joined the United Party and [7|was elected to] Parliament, [8|but] when the United Party [9|adopted a more moderate stance] on apartheid, Suzman and other [10|progressive] members left [11|it] and formed the Progressive Party in 1959.", "ko": "1953년에 그녀는 통합당에 가입했고 의회에 선출되었지만, 통합당이 아파르트헤이트에 대해 더 온건한 입장을 채택했을 때, Suzman과 다른 진보적인 구성원들은 탈당하여 1959년에 진보당을 만들었다."}, {"n": 5, "mk": "Suzman [12|tirelessly] fought against apartheid, [13|exposing the government’s abuses and challenging its laws] for a total of 36 years in Parliament.", "ko": "Suzman은 의회에서 총 36년 동안 정권의 남용을 폭로하고 그것의 법에 도전하며 아파르트헤이트에 맞서 지칠 줄 모르고 싸웠다."}, {"n": 6, "mk": "Even after her [14|retirement] in 1989, she continued to [15|advocate for] a multi-racial democracy in the Republic of South Africa [16|and influenced] the [17|drafting] of the country’s new constitution after the end of apartheid.", "ko": "1989년에 은퇴한 후에도 그녀는 남아프리카 공화국의 다인종 민주주의를 계속해서 지지했고 아파르트헤이트가 끝난 후 그 나라의 새 헌법의 작성에 영향을 주었다."}, {"n": 7, "mk": "[18|She remained an active voice for human rights and democracy until her death in 2009].", "ko": "그녀는 2009년에 사망할 때까지 인권과 민주주의의 적극적인 대변자로 남아 있었다."}], "items": {"1": {"c": "k", "t": "인물 소개 : 아파르트헤이트에 대항한 운동가", "n": ["activist = 운동가, 활동가", "against ~ = ~에 반대하는, ~에 대항하는", "apartheid = 아파르트헤이트 (남아공의 인종 차별 정책)"], "x": ["Helen Suzman was an activist against apartheid는 ‘아파르트헤이트에 대항하는 운동가였다’라는 뜻이다.", "activist는 사회 문제를 바꾸려고 직접 행동하는 사람이다.", "이 글 전체는 이 한 문장의 내용을 연도순으로 풀어 쓴 것이다."], "e": "쉬운 예시 : 위인전 첫 줄에 ‘그는 불의에 맞서 평생 싸운 사람이었다’라고 쓰고, 뒤에 연표가 이어진다."}, "2": {"c": "p", "t": "동격 : apartheid = a racist ~ system", "n": ["apartheid, a racist political and social system = 동격 (콤마로 풀어쓰기)", "racist = 인종 차별적인", "system = 체제, 제도"], "x": ["apartheid 뒤의 콤마와 a racist political and social system은 apartheid를 풀어 설명하는 동격이다.", "‘인종 차별적인 정치 및 사회 체제인 아파르트헤이트’라고 해석한다.", "political and social은 둘 다 system을 꾸미는 형용사이다."]}, "3": {"c": "g", "t": "be born to ~ : ~ 밑에서 태어나다", "n": ["be born to ~ = ~의 자녀로 태어나다", "Jewish = 유대인의", "was born = 동사 bear(낳다)의 과거분사 born을 쓴 수동태"], "x": ["기준 : was born은 ‘태어나다’라는 뜻의 굳은 수동태 표현으로 본다.", "was born to Jewish immigrant parents는 ‘유대인 이민자 부모 밑에서 태어났다’라는 뜻이다.", "born은 동사 bear(낳다)의 과거분사이다.", "to 뒤에는 부모가 와서 ‘~의 자녀로’라는 뜻이 된다."]}, "4": {"c": "g", "t": "immigrant : 이민자", "n": ["immigrant = (들어온) 이민자", "immigrate = 이민 오다 (동사)", "immigration = 이민 (명사)"], "x": ["Jewish immigrant parents는 ‘유대인 이민자 부모’라는 뜻이다.", "immigrant는 동사 immigrate(이민 오다)에서 나온 명사이다.", "emigrant(
