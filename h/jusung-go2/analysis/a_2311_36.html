<script>
var CAT={g:"어휘",o:"대명사",b:"연결어",k:"핵심 문장",p:"구문"};
var P={"src": "23년 11월 36번", "sub": "고2 · 종의 크기 변화", "one": "종의 크기는 환경과의 상호작용으로 정해져 큰 쪽으로 변해 왔지만, 지금은 더위 때문에 많은 동물이 작아지고 있음", "flow": [{"label": "도입부", "range": "1~2번", "sum": "종의 크기는 우연이 아니라 환경과의 정교한 상호작용 <small>(fine-tuned interaction)<\/small>", "eg": "들쥐의 몸집이 지금 크기인 데는 사는 숲과의 맞춤이 있음"}, {"label": "주제", "range": "3번", "sum": "크기의 변동은 환경의 상당한 변화를 나타내 왔음 <small>(signalled significant changes)<\/small>", "eg": "들쥐 몸집이 달라지면 숲의 환경이 달라졌다는 신호"}, {"label": "본론 (1)", "range": "4~5번", "sum": "5억 년 동안 동물은 점점 커졌고 해양 동물은 150배 증가 <small>(150-fold)<\/small>", "eg": "숲이 풍요로웠던 오랜 세월 동안 들쥐가 대대로 점점 커져 옴"}, {"label": "본론 (2)", "range": "6~8번", "sum": "그러나 이제 이 경향이 바뀌어 모든 범주의 동물이 작아지고 주된 원인은 더위로 보임 <small>(shrinking)<\/small>", "eg": "그런데 요즘은 여러 숲에서 들쥐가 점점 작아지는 것이 발견됨"}, {"label": "결론", "range": "9~10번", "sum": "알프스의 샤무아 염소는 더위 탓에 먹이 찾기 대신 쉬면서 몇십 년 만에 25퍼센트 작아짐 <small>(25 percent smaller)<\/small>", "eg": "숲이 더워지면 들쥐는 먹이를 찾아다니는 대신 쉬게 되고, 새 세대의 몸집이 줄어듦"}], "sents": [{"n": 1, "mk": "The size of a species is not [1|accidental].", "ko": "종의 크기는 우연한 것이 아니다."}, {"n": 2, "mk": "It's a [2|fine-tuned] interaction between a species and the world [3|it] [4|inhabits].", "ko": "그것은 한 종과 그것이 서식하는 세계 사이의 미세하게 조정된 상호 작용이다."}, {"n": 3, "mk": "Over large periods of time, size [5|fluctuations] have often [6|signalled] [7|significant] changes in the [8|environment].", "ko": "오랜 시간에 걸쳐, 크기의 변동은 종종 환경에서의 상당한 변화를 나타내 왔다."}, {"n": 4, "mk": "[9|Generally speaking], over the last five hundred million years, the trend has been towards animals getting larger.", "ko": "일반적으로 말해서, 지난 5억 년 동안 그 경향은 동물들이 점점 커지는 쪽으로 되어 왔다."}, {"n": 5, "mk": "It's particularly [10|notable] in marine animals, [11|whose average body size has increased 150-fold in this time].", "ko": "그것은 특히 해양 동물에게서 두드러지는데, 그들의 평균 몸 크기는 이 시기에 150배로 증가했다."}, {"n": 6, "mk": "But we are beginning to see changes in this trend.", "ko": "하지만 우리는 이 경향에서 변화를 관찰하기 시작하고 있다."}, {"n": 7, "mk": "Scientists have discovered [12|that many animals are shrinking].", "ko": "과학자들은 많은 동물이 작아지고 있다는 것을 발견해 왔다."}, {"n": 8, "mk": "Around the world, species in every [13|category] have been found to be getting smaller, and one [14|major] cause appears to be the heat.", "ko": "전 세계적으로, 모든 범주의 종들이 점점 작아지고 있는 것으로 발견되어 왔고, 한 가지 주요 원인은 열인 것으로 보인다."}, {"n": 9, "mk": "Animals [15|living in the Italian Alps], [16|for example], have [17|seen temperatures rise by three to four degrees Celsius] since the 1980s.", "ko": "예를 들어, 이탈리아 알프스에 살고 있는 동물들은 1980년대 이후로 기온이 섭씨 3에서 4도 상승하는 것을 보아 왔다."}, {"n": 10, "mk": "To avoid [18|overheating], chamois goats now [19|spend more of their days resting] [20|rather than searching for food], and [21|as a result], in just a few decades, the new [22|generations] of chamois are 25 percent smaller.", "ko": "과열을 피하기 위해, 샤무아 염소들은 이제 먹이를 찾는 것보다 휴식하는 데 그들의 날들을 더 많이 보내고, 결과적으로 단지 몇십 년 만에 새로운 세대의 샤무아는 25퍼센트 더 작아졌다."}], "items": {"1": {"c": "g", "t": "accidental : 우연한", "n": ["accidental = 우연한, 뜻하지 않은", "accident = 사고, 우연", "(반의어) intentional = 의도적인"], "x": ["is not accidental은 ‘우연이 아니다’라는 뜻이다.", "accident(사고, 우연)의 형용사형이다.", "다음 문장에서 ‘정교한 상호 작용’이라고 그 이유를 말한다."]}, "2": {"c": "g", "t": "fine-tune : 미세 조정하다", "n": ["fine-tuned = 미세하게 조정된", "tune = 조정하다", "fine = 세밀한"], "x": ["a fine-tuned interaction은 ‘미세하게 조정된 상호 작용’이라는 뜻이다.", "fine-tuned는 동사 fine-tune의 과거분사가 interaction을 꾸미는 형용사이다.", "종의 크기와 환경이 정교하게 맞춰져 있다는 말이다."]}, "3": {"c": "o", "t": "it = a species", "n": ["it = a species", "the world it inhabits = 그 종이 서식하는 세계", "it 앞에 목적격 관계대명사 생략"], "x": ["the world it inhabits의 it은 앞의 a species를 가리킨다.", "the world와 it 사이에 목적격 관계대명사 which(that)가 생략되어 있다.", "‘그 종이 사는 세계’라는 뜻이다."]}, "4": {"c": "g", "t": "inhabit : 서식하다, 거주하다", "n": ["inhabit = 서식하다, 거주하다", "(파생) inhabitant = 주민", "inhabit + 목적어 (전치사 없음)"], "x": ["the world it inhabits는 ‘그것이 서식하는 세계’라는 뜻이다.", "inhabits는 동사 inhabit의 3인칭 단수 현재형이다.", "inhabit은 타동사라서 전치사 in 없이 바로 목적어를 받는다."]}, "5": {"c": "g", "t": "fluctuation : 변동", "n": ["fluctuation = 변동, 오르내림", "fluctuate = 변동하다", "size fluctuations = 크기의 변동"], "x": ["size fluctuations는 ‘크기의 변동들’이라는 뜻이다.", "복수형이라 -s가 붙었고 동사도 have로 받았다.", "fluctuate(변동하다)의 명사형이다."]}, "6": {"c": "g", "t": "signal : 나타내다, 신호를 보내다", "n": ["signal = 나타내다, 신호를 주다", "(다의어) signal = 신호", "signalled = 동사 signal의 과거분사"], "x": ["have often signalled significant changes는 ‘종종 상당한 변화를 나타내 왔다’라는 뜻이다.", "signalled는 동사 signal의 과거분사로 have와 함께 현재완료를 이룬다.", "signal은 명사로 ‘신호’라는 뜻도 있다."]}, "7": {"c": "g", "t": "significant : 상당한, 중요한", "n": ["significant = 상당한, 중요한", "(파생) significance = 중요성", "significant changes = 상당한 변화"], "x": ["significant changes in the environment는 ‘환경에서의 상당한 변화’라는 뜻이다.", "significant는 ‘중요한’과 ‘상당한’ 두 뜻이 있다.", "이 문장이 글의 주제를 담고 있다."]}, "8": {"c": "k", "t": "주제문 : 크기의 변동은 환경 변화의 신호", "n": ["size fluctuations = 크기의 변동", "signalled significant changes in the environment = 환경의 상당한 변화를 나타냈다", "over large periods of time = 오랜 시간에 걸쳐"], "x": ["종의 크기가 달라지면 환경이 크게 바뀌었다는 뜻이다.", "글의 앞부분은 ‘크기와 환경의 관계’, 뒷부분은 그 사례를 설명한다.", "environment는 ‘환경’이라는 뜻이다."], "e": "쉬운 예시 : 들쥐의 몸집이 몇만 년에 걸쳐 크게 달라졌다면, 숲의 기온이나 먹이가 크게 달라졌다는 신호이다."}, "9": {"c": "g", "t": "generally speaking : 일반적으로 말해서", "n": ["generally speaking = 일반적으로 말해서", "strictly speaking = 엄밀히 말해서", "독립분사구문"], "x": ["기준 : 주어가 일반인(we, people)일 때 주어를 생략하는 독립분사구문 관용 표현으로 봄.", "Generally speaking은 ‘일반적으로 말해서’라는 뜻이다.", "비슷한 표현으로 frankly speaking(솔직히 말해서)이 있다."]}, "10": {"c": "g", "t": "notable : 두드러진, 주목할 만한", "n": ["notable = 두드러진, 주목할 만한", "note = 주목하다", "(유의어) remarkable = 놀라운"], "x": ["notable in marine animals는 ‘해양 동물에게서 두드러지는’이라는 뜻이다.", "note(주목하다)에 -able이 붙은 형용사이다.", "marine animals는 ‘해양 동물’이라는 뜻이다."]}, "11": {"c": "p", "t": "소유 관계대명사 whose + 명사", "n": ["marine animals ← whose average body size has increased", "whose = marine animals’", "-fold = ~배의"], "x": ["whose average body size has increased 150-fold in this time은 ‘이 기간에 그들의 평균 몸 크기가 150배로 증가한’이라는 뜻이다.", "whose는 marine animals를 가리키는 소유격 관계대명사이고 뒤에 명사 average body size가 이어진다.", "150-fold는 ‘150배로’라는 뜻이다.", "has increased는 현재완료이다."]}
