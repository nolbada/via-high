<script>
var CAT={g:"어휘",o:"대명사",b:"연결어",k:"핵심 문장",p:"구문"};
var P={"src": "22년 11월 38번", "sub": "고2 · 아이들이 채소를 싫어하는 이유", "one": "항영양소가 든 음식을 피하는 직관은 진화로 타고난 것, 아이들이 채소를 싫어하는 것도 연약한 몸을 보호하려는 미각의 작용이며 자라면 사라짐", "flow": [{"label": "도입부 = 주제 (1)", "range": "1~3번", "sum": "동물은 항영양소가 든 식물을 먹고 탈이 나면 다시 먹지 않음, 진화로 물려받은 타고난 지능 <small>(innate intelligence)<\/small>", "eg": "한 번 먹고 배탈이 난 열매는 동물이 다시 건드리지 않음"}, {"label": "본론 (1)", "range": "4~6번", "sum": "이 직관은 사람에게도 있음, 아이들이 채소를 싫어하는 것은 유전적 프로그래밍 <small>(genetic programming)<\/small>", "eg": "아이가 브로콜리를 보자마자 인상을 쓰는 것도 몸에 새겨진 반응"}, {"label": "본론 (2)", "range": "7~8번", "sum": "연약하고 성장 중인 몸을 지키려고 미각이 채소 맛을 나쁘고 역겹게 느끼게 만듦 <small>(taste buds perceive these flavors as bad)<\/small>", "eg": "브로콜리의 쓴맛이 아이에게는 훨씬 역겹게 느껴짐"}, {"label": "결론 = 주제 (2)", "range": "9번", "sum": "자라서 몸이 강해지면 항영양소를 견딜 수 있어 맛이 더 이상 나쁘지 않음 <small>(no longer taste as bad as before)<\/small>", "eg": "어른이 되자 어느 순간 브로콜리가 그렇게 쓰지 않게 느껴짐"}], "sents": [{"n": 1, "mk": "In the natural world, if an animal [3|consumes] a plant with enough [4|antinutrients] to [5|make] [6|it] feel unwell, [6|it] won’t eat that plant again.", "ko": "자연계에서는, 만약 동물이 자신의 상태를 안 좋게 하기에 충분한 항영양소가 있는 식물을 섭취하면, 그 동물은 그 식물을 다시 먹지 않을 것이다."}, {"n": 2, "mk": "[7|Intuitively], animals also know [8|to stay away from] these plants.", "ko": "직관적으로, 동물은 또한 이러한 식물을 멀리할 줄 안다."}, {"n": 3, "mk": "[9|Years of evolution] and [10|information being passed down] [13|created this innate intelligence].", "ko": "오랜 시간의 진화와 전해 내려오는 정보가 이 타고난 지능을 만들었다."}, {"n": 4, "mk": "[16|This] “intuition,” [14|though], is [15|not just seen] in animals.", "ko": "하지만 이 ‘직관’은 동물에게서만 보이는 것은 아니다."}, {"n": 5, "mk": "Have you ever wondered [18|why most children hate vegetables]?", "ko": "여러분은 왜 대부분의 아이들이 채소를 싫어하는지 궁금해한 적이 있는가?"}, {"n": 6, "mk": "Dr. Steven Gundry [19|justifies] [20|this] as part of our [21|genetic] programming, our inner intelligence.", "ko": "Dr. Steven Gundry는 이것을 우리의 유전적 프로그래밍, 즉 우리의 내적 지능의 일부로 정당화한다."}, {"n": 7, "mk": "[22|Since] many vegetables [23|are full of] [4|antinutrients], your  h+='<div class="ft">비타민 영어클리닉 · 주성고 영어II</div>';
 document.getElementById("app").innerHTML=h;
 items();
}
function items(){
 var out="",seen={};
 S.forEach(function(s){
  var ids=[];s.mk.replace(/\[(\d+)\|/g,function(m,id){if(!seen[id]){seen[id]=1;ids.push(id);}});
  ids.forEach(function(id){var it=I[id];if(cur!="all"&&it.c!=cur)return;
   out+='<div class="it c-'+it.c+'" id="it'+id+'"><h4><span class="tl">'+it.t+'</span><span class="tag">'+CAT[it.c]+'</span></h4>';
   out+='<div class="quote">'+s.n+'. '+hl2(s.mk,id)+'<div class="qk">'+s.ko+'</div></div>';
   out+='<div class="note"><div class="nl">노트 정리</div>'+it.n.map(function(l){return '<div class="ln">'+l+'</div>';}).join("")+'</div>';
   out+='<div class="xs">'+it.x.map(function(l){return '<div>'+l+'</div>';}).join("")+'</div>';
   if(it.e)out+='<div class="eg">'+it.e+'</div>';
   out+='<button class="bkb" data-back="'+s.n+'">본문으로 돌아가기</button></div>';
  });
 });
 document.getElementById("items").innerHTML=out;
}
function hl2(s,id){return s.replace(/\[(\d+)\|([^\]]+)\]/g,function(m,i,t){return i==id?'<span class="hlk c-'+I[i].c+'">'+t+'</span>':t;});}
document.addEventListener("click",function(e){
 var t=e.target;
 
 if(t.dataset&&t.dataset.id){var el=document.getElementById("it"+t.dataset.id);if(el){el.scrollIntoView({behavior:"smooth",block:"center"});el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash");}return;}
 if(t.closest&&t.closest("#tabs")&&t.dataset.c){cur=t.dataset.c;setTabs();document.getElementById("text").innerHTML=textHTML();items();return;}
 if(t.dataset&&t.dataset.back){var p=document.getElementById("s"+t.dataset.back);p.scrollIntoView({behavior:"smooth",block:"center"});return;}
 if(t.tagName=="I"&&t.parentNode.classList.contains("ps")){t.parentNode.classList.toggle("open");}
});
function setTabs(){[].forEach.call(document.querySelectorAll("#tabs button"),function(b){b.classList.toggle("on",b.dataset.c==cur);});}
render();
</script>
</body>
