<script>
var CAT={g:"어휘",o:"대명사",b:"연결어",k:"핵심 문장",p:"구문"};
var P={"num": "30", "sub": "고2 · 말보다 더 믿게 되는 비언어적 신호", "one": "말과 표정·몸짓이 어긋날 때 사람들은 비언어적 신호를 더 믿기 때문에, 비언어가 따라 주지 않는 말로 남을 조종하려는 시도는 실패하기 쉬움", "flow": [{"label": "도입부", "range": "1~2번", "sum": "연구가 비언어적 신호의 우위를 확인, 특히 말과 비언어 메시지의 내용이 서로 다른 상황에서 두드러짐 <small>(the dominance of nonverbal signals, conflicting messages)</small>", "eg": "친구가 ‘안 삐졌어’라고 하면서 팔짱 끼고 고개를 돌릴 때 말보다 태도가 더 크게 들어오는 순간"}, {"label": "본론", "range": "3~4번", "sum": "그래서 비언어가 말과 맞지 않으면 말로 남을 조종하려는 시도는 실패하기 쉬움, 사람들이 말보다 비언어를 더 믿기 때문 <small>(manipulate verbally, trust nonverbal messages)</small>", "eg": "눈을 피하며 ‘숙제 다 했어요’라고 말하면 선생님이 오히려 의심하는 상황"}, {"label": "예시 (1)", "range": "5번", "sum": "함께 있어 즐겁다는 말과 눈 피하기, 억지웃음이 어긋나면 그 말을 덜 믿게 됨 <small>(looking away, forcing a smile)</small>", "eg": "생일 선물을 받고 ‘와, 좋다’라고 하면서 얼굴이 굳어 있는 친구"}, {"label": "예시 (2)", "range": "6~7번", "sum": "병가 후 복귀했을 때 동료가 언짢은 표정으로 업무를 맡아 즐거웠다고 하면 그 말을 믿지 않게 됨 <small>(a displeased expression, take over your workload)</small>", "eg": "조별 과제를 대신 맡아 준 친구가 한숨을 쉬며 ‘괜찮아, 재밌었어’라고 하는 상황"}], "sents": [{"n": 1, "mk": "A study by Eva McMahan, [1|professor of speech communication], [2|confirmed] the [3|dominance] of [4|nonverbal signals].", "ko": "발화 의사소통 교수인 Eva McMahan의 한 연구는 비언어적 신호들의 우위를 확인했다.", "star": true}, {"n": 2, "mk": "[5|The phenomenon], [6|however], was especially [7|pronounced] when adults [8|found themselves in] situations with [9|conflicting messages] (i.e., situations [10|in which] the contents of the verbal and nonverbal messages differ).", "ko": "그러나, 그 현상은 성인들이 모순되는 메시지들이 있는 상황, 즉 언어적 메시지와 비언어적 메시지의 내용들이 일치하지 않는 상황에 처해 있는 자신을 발견했을 때 특히 두드러졌다.", "star": true}, {"n": 3, "mk": "[11|Attempts to manipulate another person verbally are] [12|therefore] [13|likely to fail] if the [14|accompanying] nonverbal communication [15|does not match the spoken message].", "ko": "그러므로 만약 동반되는 비언어적 의사소통이 발화된 메시지와 일치하지 않는다면 다른 사람을 언어적으로 조종하려는 시도는 실패할 가능성이 있다.", "star": true}, {"n": 4, "mk": "[16|This] [17|is because] [18|people trust nonverbal messages more] than verbal [19|ones].", "ko": "이는 사람들이 비언어적 메시지들을 언어적인 것들보다 더 많이 신뢰하기 때문이다.", "star": true}, {"n": 5, "mk": "When somebody tells you that [20|they] [21|enjoy spending] time with you, but you notice [22|how they are looking away and are forcing a smile], you are probably [23|less inclined to believe their words].", "ko": "누군가가 여러분에게 그들이 여러분과 시간을 보내는 것을 즐긴다고 말하지만 그들이 눈길을 돌리고 억지웃음을 짓고 있는 모습을 여러분이 알아차리면 여러분은 아마도 그들의 말을 덜 믿게 될 것이다."}, {"n": 6, "mk": "[24|The same is probably true] when you are back at the office after a sickness and your colleague [25|tells you] with a [26|displeased] expression [27|that they were happy to take over your workload].", "ko": "여러분이 병이 나은 후 회사로 돌아갔을 때 여러분의 동료가 여러분의 업무량을 떠맡게 되어 즐거웠다고 언짢은 표정으로 여러분에게 말할 때에도 아마도 마찬가지일 것이다.", "star": true}, {"n": 7, "mk": "You [28|might not believe] that [29|they] [30|enjoyed replacing you] [31|while you were gone].", "ko": "여러분은 아마도 그들이 여러분이 없는 동안 여러분을 대신하기를 즐거워했다는 것을 믿지 않을 것이다."}], "items": {"1": {"c": "p", "t": "동격 : Eva McMahan, professor of ~", "n": ["Eva McMahan, professor of speech communication = 발화 의사소통 교수인 Eva McMahan", "콤마 사이 명사구 = 앞 명사를 풀어 주는 동격", "speech communication = 발화(말하기) 의사소통"], "x": ["콤마 사이의 professor of speech communication은 Eva McMahan이 누구인지 설명하는 동격 표현이다.", "문장의 주어는 A study이고, 동사는 confirmed이다. 동격 부분을 빼고 읽으면 뼈대가 보인다.", "전문가의 연구를 먼저 내세워 글의 주장에 믿음을 주는 도입이다."]}, "2": {"c": "g", "t": "confirm : 확인하다, 입증하다", "n": ["confirm = 확인하다, 사실임을 입증하다", "confirmation = 확인 (명사)", "(유의어) verify(입증하다), prove(증명하다)"], "x": ["confirmed the dominance는 ‘우위를 확인했다’라는 뜻이다.", "이미 짐작하던 것이 사실임을 연구로 증명했다는 느낌이다.", "주어가 A study(단수)이고 과거 시제라 confirmed가 쓰였다."]}, "3": {"c": "g", "t": "dominance : 우위, 지배", "n": ["dominance = 우위, 지배력 (명사)", "dominate = 지배하다, 우세하다 (동사)", "dominant = 우세한, 지배적인 (형용사)"], "x": ["the dominance of nonverbal signals는 ‘비언어적 신호의 우위’, 즉 비언어 신호가 말보다 더 큰 힘을 갖는다는 뜻이다.", "dominance는 명사, dominant는 형용사이다. 품사를 바꿔 묻는 어휘 문제에 주의한다.", "2번 문장의 The phenomenon(그 현상)이 바로 이 우위를 가리킨다."]}, "4": {"c": "k", "t": "핵심 소재 : nonverbal signals (비언어적 신호)", "n": ["verbal = 말의, 언어적인", "nonverbal = 말이 아닌, 비언어적인 (표정, 시선, 몸짓, 목소리 톤)", "signal = 신호"], "x": ["nonverbal signals는 말 대신 표정, 눈빛, 몸짓으로 전해지는 신호이다.", "non-은 ‘~이 아닌’이라는 뜻의 접두사로 verbal(말의)을 반대로 만든다.", "이 글은 끝까지 verbal(말)과 nonverbal(비언어)의 대결 구도로 진행된다."], "e": "쉬운 예시 : ‘괜찮아’라는 말이 verbal이라면, 그 말을 하면서 짓는 찌푸린 얼굴이 nonverbal이다."}, "5": {"c": "o", "t": "The phenomenon = 비언어적 신호의 우위", "n": ["the phenomenon = 그 현상", "= 1번의 the dominance of nonverbal signals", "phenomenon (단수) / phenomena (복수)"], "x": ["The phenomenon은 1번 문장에서 말한 ‘비언어적 신호의 우위’를 가리킨다.", "정관사 The가 붙은 지시어라 앞 문장에 그 내용이 있어야 한다. 그래서 문장삽입 문제에서 1번 바로 뒤에 들어가는 근거가 된다.", "phenomenon의 복수형은 phenomena이다."]}, "6": {"c": "b", "t": "however : 그러나 (조건을 좁혀 강조)", "n": ["however = 그러나, 하지만", "문장 중간에 콤마와 함께 삽입 가능", "여기서는 반박이 아니라 ‘특히 이런 경우에’로 범위를 좁힘"], "x": ["however는 ‘그러나’라는 뜻이지만, 여기서는 앞 내용을 뒤집기보다 ‘특히 이럴 때 더 그렇다’로 범위를 좁힌다.", "우위는 늘 있지만, 말과 비언어가 충돌하는 상황에서 특히 두드러졌다는 흐름이다.", "주어 The phenomenon과 동사 was 사이에 콤마로 끼어 있다."]}, "7": {"c": "g", "t": "pronounced : 두드러진, 뚜렷한", "n": ["pronounced = 두드러진, 뚜렷한 (형용사)", "(다의어) pronounce = 발음하다 / 선언하다", "especially pronounced = 특히 두드러진"], "x": ["was especially pronounced는 ‘특히 두드러졌다’라는 뜻이다.", "pronounced는 동사 pronounce(발음하다)에서 왔지만, 형용사로 쓰이면 ‘두드러진, 뚜렷한’이라는 전혀 다른 뜻이 된다.", "‘발음된’으로 읽으면 문장이 통하지 않으니 주의한다.", "유의어로 noticeable(눈에 띄는), marked(뚜렷한)가 있다."]}, "8": {"c": "p", "t": "find oneself in ~ : (자신이) ~에 처해 있다", "n": ["find oneself in + 상황 = ~한 상황에 처하다", "adults found themselves = 성인들이 자신이 ~에 있음을 알게 되었다", "주어와 목적어가 같은 사람 → 재귀대명사 themselves"], "x": ["found themselves in situations는 ‘~한 상황에 처했다’라는 뜻이다.", "주어 adults와 목적어가 같은 사람이라 재귀대명사 themselves가 쓰였다. them으로 쓰면 다른 사람이 된다.", "‘자기도 모르게 그런 상황에 놓이게 되다’라는 느낌이다."]}, "9": {"c": "g", "t": "conflicting : 상충하는, 모순되는", "n": ["conflict = 충돌, 갈등 / 충돌하다", "conflicting messages = 서로 어긋나는 메시지", "(반의어) consistent = 일관된, 일치하는"], "x": ["situations with conflicting messages는 ‘서로 모순되는 메시지가 있는 상황’이라는 뜻이다.", "괄호 안의 i.e.(즉) 이하가 이 말을 풀어 준다. 말과 비언어 메시지의 내용이 다른 상황이 번의 conflicting messages와 같은 뜻"], "x": ["does not match the spoken message는 ‘말로 한 메시지와 일치하지 않는다’라는 뜻이다.", "2번 문장의 conflicting messages, 즉 말과 비언어가 어긋나는 상황을 다시 말한 것이다.", "match는 타동사라 match with ~로 쓰지 않는다.", "spoken은 ‘말로 표현된’이라는 뜻의 과거분사로 message를 꾸민다."], "e": "쉬운 예시 : 입으로는 ‘정말 미안해’라고 하면서 웃고 있으면 그 사과는 통하지 않는다."}, "16": {"c": "o", "t": "This = 앞 문장의 내용 (말로 하는 조종이 실패하는 것)", "n": ["This = 비언어가 맞지 않으면 말로 하는 조종이 실패한다는 사실"], "x": ["This는 3번 문장의 내용 전체를 가리킨다.", "즉 비언어적 의사소통이 말과 맞지 않으면 언어적 조종 시도가 실패한다는 사실이다.", "이 문장은 그 이유를 밝힌다."]}, "17": {"c": "b", "t": "This is because ~ : 이것은 ~ 때문이다 (원인)", "n": ["This is because + 원인 = 이것은 ~ 때문이다", "This is why + 결과 = 그래서 ~이다", "because 뒤 = 이유"], "x": ["This is because 뒤에는 앞 문장이 일어난 원인이 온다.", "This is why 뒤에는 결과가 온다. 둘을 바꿔 묻는 문제가 자주 나오니 구별한다.", "3번(결과) → 4번(원인) 순서로 글이 이어진다."]}, "18": {"c": "k", "t": "주제문 : 사람들은 말보다 비언어를 더 믿는다", "n": ["trust A more than B = B보다 A를 더 믿다", "nonverbal messages = 비언어적 메시지", "글 전체의 요지"], "x": ["people trust nonverbal messages more than verbal ones는 ‘사람들은 언어적 메시지보다 비언어적 메시지를 더 신뢰한다’라는 뜻이다.", "그래서 말과 표정이 어긋나면 사람들은 말보다 표정과 몸짓 쪽을 진짜 마음으로 받아들인다.", "1번(우위 확인), 3번(조종 실패), 5~7번(예시)이 모두 이 문장을 중심으로 묶인다."], "e": "쉬운 예시 : 친구가 ‘하나도 안 무서워’라고 하면서 손을 덜덜 떨면, 우리는 말보다 떨리는 손을 믿는다."}, "19": {"c": "o", "t": "ones = messages", "n": ["verbal ones = verbal messages", "one(s) = 앞에 나온 셀 수 있는 명사의 반복을 피하는 대명사", "복수 messages → ones"], "x": ["verbal ones의 ones는 앞의 messages를 대신한다.", "같은 명사를 다시 쓰지 않기 위한 대명사이며, 복수라 ones가 쓰였다.", "nonverbal messages와 verbal messages를 비교하는 문장이다."]}, "20": {"c": "o", "t": "they = somebody (단수 they)", "n": ["they = somebody (누군가)", "성별을 밝히지 않을 때 단수 대상도 they로 받음", "their words = 그 사람의 말"], "x": ["that they enjoy의 they는 앞의 somebody를 가리킨다.", "성별을 정하지 않고 한 사람을 가리킬 때 영어는 they를 쓴다. 그래서 문장 뒤의 how they, their words도 모두 같은 사람이다.", "6~7번 문장의 they도 같은 방식으로 your colleague를 가리킨다."]}, "21": {"c": "p", "t": "enjoy + 동명사 : ~하는 것을 즐기다", "n": ["enjoy -ing (O) / enjoy to V (X)", "enjoy spending time with you = 너와 시간을 보내는 것을 즐기다", "spend time (with A) = (A와) 시간을 보내다"], "x": ["enjoy spending time with you는 ‘너와 시간을 보내는 것을 즐긴다’라는 뜻이다.", "enjoy는 동명사만 목적어로 취하므로 spending이 쓰였다.", "7번 문장의 enjoyed replacing도 같은 구조이다."]}, "22": {"c": "p", "t": "how절 + 진행형 병렬 : 눈을 돌리고 억지웃음을 짓는 모습", "n": ["notice + how절 = ~하는 모습을 알아차리다", "are looking away and are forcing a smile (진행형 병렬)", "look away = 눈길을 돌리다 / force a smile = 억지웃음을 짓다"], "x": ["notice how they are looking away and are forcing a smile은 ‘그들이 눈길을 돌리고 억지웃음을 짓고 있는 모습을 알아차리다’라는 뜻이다.", "how 이하는 notice의 목적어 역할을 하는 명사절이다.", "are looking away와 are forcing이 and로 나란히 이어졌다.", "말(즐겁다)과 비언어(눈 피하기, 억지웃음)가 어긋나는 첫 번째 예시이다."]}, "23": {"c": "k", "t": "예시 (1)의 결과 : 그 말을 덜 믿게 됨", "n": ["be inclined to V = ~하는 경향이 있다, ~하고 싶어지다", "less inclined to V = 덜 ~하고 싶어지다", "(반의어) disinclined = 내키지 않는"], "x": ["you are probably less inclined to believe their words는 ‘너는 아마 그들의 말을 덜 믿게 될 것이다’라는 뜻이다.", "inclined는 마음이 한쪽으로 기우는 것이다. less가 붙어 믿고 싶은 마음이 줄어든다는 뜻이 된다.", "4번의 주제문(비언어를 더 믿는다)을 일상 대화로 보여 주는 결과이다."], "e": "쉬운 예시 : ‘너랑 노는 게 제일 재밌어’라고 하면서 계속 휴대폰만 보는 친구의 말은 잘 믿기지 않는다."}, "24": {"c": "b", "t": "The same is probably true : 마찬가지일 것이다 (예시 추가)", "n": ["The same is true (when ~) = (~할 때도) 마찬가지이다", "새 예시를 앞 예시와 같은 원리로 묶는 연결 표현", "사적인 대화 → 직장 상황으로 예시 확장"], "x": ["The same is probably true는 ‘아마 마찬가지일 것이다’라는 뜻이다.", "앞 문장과 같은 원리가 다른 상황에도 적용된다며 두 번째 예시를 여는 표현이다.", "친구 사이의 대화에서 직장 동료의 말로 예시의 무대가 바뀐다."]}, "25": {"c": "p", "t": "tell + 사람 + (부사구) + that절", "n": ["tells you with a displeased expression that ~", "tell + 간접목적어(you) + 직접목적어(that절)", "사이에 부사구(with ~ expression)가 끼어듦"], "x": ["your colleague tells you with a displeased expression that ~은 ‘동료가 언짢은 표정으로 너에게 ~라고 말한다’라는 뜻이다.", "tells you와 that절 사이에 with a displeased expression이 끼어 있어 that절이 멀리 떨어져 있다.", "that절이 tells의 목적어라는 것을 놓치지 않아야 문장이 바로 읽힌다."]}, "26": {"c": "g", "t": "displeased : 언짢은, 불쾌한", "n": ["please = 기쁘게 하다 → pleased = 기쁜", "dis- (반대) + pleased = 언짢은, 불쾌한", "a displeased expression = 언짢은 표정"], "x": ["with a displeased expression은 ‘언짢은 표정으로’라는 뜻이다.", "dis-는 반대의 뜻을 만드는 접두사로 pleased(기쁜)를 ‘불쾌한’으로 바꾼다.", "말(기뻤다)과 표정(언짢음)이 정반대라는 점이 이 예시의 핵심이다.", "expression은 여기서 ‘표정’이라는 뜻이다. (다의어) 표현"]}, "27": {"c": "g", "t": "take over : (일·책임을) 떠맡다, 넘겨받다", "n": ["take over = 떠맡다, 인계받다", "workload = 업무량", "be happy to V = ~해서 기쁘다 (감정의 원인)"], "x": ["that they were happy to take over your workload는 ‘네 업무를 떠맡게 되어 기뻤다고’라는 뜻이다.", "take over는 남이 하던 일이나 책임을 넘겨받는다는 뜻이다.", "happy to V의 to부정사는 기쁜 이유를 나타낸다.", "언짢은 표정과 이 말이 어긋나므로 듣는 사람은 말을 믿기 어렵다."]}, "28": {"c": "k", "t": "예시 (2)의 결과 : 그 말을 믿지 않음", "n": ["might not believe = 아마 믿지 않을 것이다", "might = 약한 추측 (~일지도 모른다)", "5번의 less inclined to believe와 같은 결론"], "x": ["You might not believe ~는 ‘너는 아마 ~를 믿지 않을 것이다’라는 뜻이다.", "동료의 말(즐거웠다)보다 언짢은 표정을 더 믿게 된다는 결과이다.", "5번 예시와 같은 결론으로 글을 마무리하며 주제문(4번)을 다시 확인시킨다."], "e": "쉬운 예시 : 청소 당번을 대신해 준 친구가 인상을 쓰며 ‘재밌었어’라고 하면, 고맙지만 그 말은 안 믿긴다."}, "29": {"c": "o", "t": "they = your colleague (동료)", "n": ["they = your colleague", "성별을 밝히지 않는 단수 they"], "x": ["that they enjoyed의 they는 6번 문장의 your colleague를 가리킨다.", "5번 문장의 they(= somebody)와 같은 방식이다.", "‘동료가 즐거워했다는 것을’로 읽는다."]}, "30": {"c": "p", "t": "enjoy + 동명사 : enjoyed replacing you", "n": ["enjoyed replacing you = 너를 대신하는 것을 즐겼다", "replace = 대신하다, 대체하다", "6번 take over your workload를 다르게 말한 것"], "x": ["enjoyed replacing you는 ‘너를 대신하는 것을 즐겼다’라는 뜻이다.", "enjoy 뒤에 동명사 replacing이 쓰였다.", "replace you는 6번의 take over your workload(네 업무를 떠맡다)를 바꿔 말한 표현이다."]}, "31": {"c": "g", "t": "while you were gone : 네가 없는 동안", "n": ["while = ~하는 동안", "be gone = 가고 없다, 자리에 없다", "= 6번의 after a sickness 기간 (아파서 빠진 동안)"], "x": ["while you were gone은 ‘네가 자리에 없는 동안’이라는 뜻이다.", "여기서 gone은 ‘가고 없는’이라는 뜻의 형용사처럼 쓰였다.", "6번 문장의 아파서 회사를 쉬었던 기간을 가리킨다."]}}, "src": "26년 10월 30번"};var S=P.sents,I=P.items,FLOW=P.flow.map(function(f){return [f.label,f.range,f.sum,f.eg];});
var S=P.sents,I=P.items,FLOW=P.flow.map(function(f){return [f.label,f.range,f.sum,f.eg];});
var cur="all";
function textHTML(){var h='';S.forEach(function(s){h+='<div class="ps" id="s'+s.n+'"><i>'+s.n+(s.star?'<br>★':'')+'</i><div><div class="en">'+hl(s.mk)+'</div><div class="ko">'+s.ko+'</div></div></div>';});return h;}
function strip(s){return s.replace(/\[(\d+)\|([^\]]+)\]/g,"$2");}
function hl(s){return s.replace(/\[(\d+)\|([^\]]+)\]/g,function(m,id,t){var it=I[id];if(cur!='all'&&it.c!=cur)return t;return '<span class="hlk c-'+it.c+'" data-id="'+id+'">'+t+'</span>';});}
function render(){
 var h='<h1>'+P.src+'</h1><div class="sub">'+P.sub+'</div>';

 h+='<div class="card" id="onec"><div class="lab">결국 이 얘기</div><div class="one">'+P.one+'</div></div>';
 h+='<div class="card"><div class="lab">글의 뼈대</div><div class="flow">';
 FLOW.forEach(function(f){h+='<div class="fr"><b>'+f[0]+'</b><span><em>'+f[1]+'</em><strong>'+f[2]+'</strong><div class="eg2">예) '+f[3]+'</div></span></div>';});
 h+='</div></div>';
 h+='<div class="card" id="text">'+textHTML()+'</div>';
 h+='<div class="tabs" id="tabs"><button data-c="all" class="on">전체</button>';
 Object.keys(CAT).forEach(function(c){h+='<button data-c="'+c+'" class="c-'+c+'">'+CAT[c]+'</button>';});
 h+='</div><div id="items"></div>';
 h+='<div class="ft">비타민 영어클리닉 · 주성고 영어II</div>';
 document.getElementById("app").innerHTML=h;
 items();
}
function items(){
 var out="",seen={};
 S.forEach(function(s){
  var ids=[];s.mk.replace(/\[(\d+)\|/g,function(m,id){if(!seen[id]){seen[id]=1;ids.push(id);}});
  ids.forEach(function(id){var it=I[id];if(cur!="all"&&it.c!=cur)return;
   out+='<div class="it c-'+it.c+'" id="it'+id+'"><h4><span class="tl">'+it.t+'</span><span class="tag">'+CAT[it.c]+'</span></h4>';
   out+='<div class="quote">'+s.n+'. '+hl2(s.mk,id)+'<div class="qk">'+s.ko+'</div></div>';
   out+='<div class="note"><div class="nl">노트 정리</div>'+it.n.map(function(l){return '<div class="ln">'+l+'</div>';}).join("")+'</div>';
   out+='<div class="xs">'+it.x.map(function(l){return '<div>'+l+'</div>';}).join("")+'</div>';
   if(it.e)out+='<div class="eg">'+it.e+'</div>';
   out+='<button class="bkb" data-back="'+s.n+'">본문으로 돌아가기</button></div>';
  });
 });
 document.getElementById("items").innerHTML=out;
}
function hl2(s,id){return s.replace(/\[(\d+)\|([^\]]+)\]/g,function(m,i,t){return i==id?'<span class="hlk c-'+I[i].c+'">'+t+'</span>':t;});}
document.addEventListener("click",function(e){
 var t=e.target;
 
 if(t.dataset&&t.dataset.id){var el=document.getElementById("it"+t.dataset.id);if(el){el.scrollIntoView({behavior:"smooth",block:"center"});el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash");}return;}
 if(t.closest&&t.closest("#tabs")&&t.dataset.c){cur=t.dataset.c;setTabs();document.getElementById("text").innerHTML=textHTML();items();return;}
 if(t.dataset&&t.dataset.back){var p=document.getElementById("s"+t.dataset.back);p.scrollIntoView({behavior:"smooth",block:"center"});return;}
 if(t.tagName=="I"&&t.parentNode.classList.contains("ps")){t.parentNode.classList.toggle("open");}
});
function setTabs(){[].forEach.call(document.querySelectorAll("#tabs button"),function(b){b.classList.toggle("on",b.dataset.c==cur);});}
render();
</script>
