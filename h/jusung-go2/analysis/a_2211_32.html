<html lang="ko">

<title>22년 11월 32번 분석</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#17202e;--sub:#5b677a;--line:#d9e0ec;--pri:#1d4ed8;--off:#e9eef8;--note:#fffbe6;--noteL:#d9c76a;--noteT:#8a6d00;--noteLn:#efe6b3;
 --gd:#15803d;--gl:#c6efcf;--bd:#1d4ed8;--bl:#cfe0fb;--kd:#be185d;--kl:#fbcfe3;--od:#c2570c;--ol:#ffe0b8;--pd:#6d28d9;--pl:#e4d9fb}
@media(prefers-color-scheme:dark){:root{--bg:#0e131c;--card:#161d2a;--ink:#e8edf6;--sub:#9aa7bd;--line:#2a3548;--pri:#8ab4ff;--off:#222c3d;--note:#33290a;--noteL:#6b5a1a;--noteT:#f1dc8a;--noteLn:#4a3d12;
 --gd:#4ade80;--gl:#16361f;--bd:#8ab4ff;--bl:#1a2a4a;--kd:#f472b6;--kl:#401a30;--od:#fb923c;--ol:#43270f;--pd:#c4a8ff;--pl:#2c2147}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.55;font-size:16px}
.wrap{max-width:640px;margin:0 auto;padding:14px 16px 56px}
h1{font-size:19px;margin:4px 2px 2px}
.sub{font-size:13px;color:var(--sub);margin:0 2px 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.chip{font-size:12.5px;font-weight:800;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:4px 11px}
.c-g{--d:var(--gd);--l:var(--gl)}.c-b{--d:var(--bd);--l:var(--bl)}.c-k{--d:var(--kd);--l:var(--kl)}.c-o{--d:var(--od);--l:var(--ol)}.c-p{--d:var(--pd);--l:var(--pl)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px 13px;margin-bottom:10px}
.lab{font-size:13px;font-weight:800;margin:0 0 6px;color:var(--sub)}
.one{font-size:16px;font-weight:800;line-height:1.5}
.flow{display:flex;flex-direction:column;gap:6px}
.fr{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;line-height:1.5}
.fr b{flex:none;width:74px;font-size:12.5px;color:#fff;background:var(--pri);border-radius:8px;padding:3px 0;text-align:center}
@media(prefers-color-scheme:dark){.fr b{color:#0b1220}}
.fr span{padding-top:2px}.fr strong{font-weight:800}.fr small{font-weight:600;color:var(--sub);font-size:12.5px}.eg2{margin-top:4px;color:var(--pri);font-size:13.5px;font-weight:600;border-left:3px solid var(--pri);padding-left:8px}
.fr em{font-style:normal;color:var(--sub);font-size:12.5px;font-weight:800;margin-right:4px}
.ps{font-size:16px;line-height:2;display:flex;gap:8px;border-top:1px solid var(--line);padding-top:4px;margin-top:4px}.ps:first-of-type{border-top:0;margin-top:0}
.ps i{font-style:normal;font-size:12px;font-weight:800;color:var(--pri);flex:none;width:20px;padding-top:1px;cursor:pointer}
.ps .ko{display:none;font-size:13.5px;color:var(--sub);line-height:1.6;margin-top:2px}.ps.open .ko{display:block}
.hlk{background:var(--l);border-bottom:2px solid var(--d);border-radius:3px;padding:0 2px;cursor:pointer}
.tabs{display:flex;gap:6px;margin:0 0 10px;flex-wrap:wrap}
.tabs button{padding:7px 12px;border-radius:999px;font:800 13px inherit;font-family:inherit;background:var(--card);color:var(--ink);border:1.5px solid var(--d,var(--line));cursor:pointer}
.tabs button.on{background:var(--d,var(--pri));color:#fff;border-color:var(--d,var(--pri))}
@media(prefers-color-scheme:dark){.tabs button.on{color:#0b1220}}
.it{background:var(--l);border:1.5px solid var(--d);border-radius:14px;padding:12px 14px 13px;margin-bottom:10px}
.it h4{margin:0 0 6px;font-size:15px;display:flex;align-items:center;gap:8px;line-height:1.35}
.it h4 .tl{flex:1}
.tag{font-size:11.5px;color:#fff;background:var(--d);border-radius:99px;padding:2px 9px;flex:none;font-weight:800}
@media(prefers-color-scheme:dark){.tag{color:#0b1220}}
.quote{background:var(--card);border-radius:10px;padding:7px 10px;margin:0 0 8px;font-size:14.5px;line-height:1.7}
.quote .qk{font-size:13px;color:var(--sub);margin-top:2px;line-height:1.5}
.it .xs{margin:7px 0 0;font-size:14px;line-height:1.65}
.it .xs div{margin-top:3px}
.it .eg{margin-top:8px;font-size:13.5px;color:var(--sub);border-left:3px solid var(--d);padding-left:9px}
.note{background:var(--note);border:1.5px dashed var(--noteL);border-radius:10px;padding:7px 11px;background-image:repeating-linear-gradient(transparent,transparent 25px,var(--noteLn) 25px,var(--noteLn) 26px)}
.note .nl{font-size:11.5px;font-weight:800;color:var(--noteT);margin-bottom:2px}.note .ln{font-size:14px;font-weight:700;line-height:26px;color:var(--ink)}
.bkb{margin-top:8px;border:1.5px solid var(--d);background:var(--card);color:var(--d);border-radius:999px;padding:6px 14px;font:700 13px inherit;font-family:inherit;cursor:pointer}
.flash{animation:fl 1.4s ease}@keyframes fl{0%,60%{box-shadow:0 0 0 4px #f5c84288}100%{box-shadow:none}}
.qz{background:var(--card);border:1.5px solid var(--pri);border-radius:14px;padding:12px 14px 14px;margin-bottom:10px}.qz .qt{font-size:15.5px;font-weight:800;margin-bottom:8px}.nb{display:flex;gap:6px;flex-wrap:wrap}.nb button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:800 16px inherit;font-family:inherit;cursor:pointer}.nb button.bad{background:#fde2e2;border-color:#d33;color:#a11;text-decoration:line-through}.w{cursor:pointer;border-radius:3px}.w.ok{background:var(--bl);border-bottom:2px solid var(--bd);font-weight:800}.w.bad{background:#fde2e2}.rec{font-size:13px;font-weight:800;color:var(--sub);margin:0 2px 10px}.ft{text-align:center;font-size:12.5px;color:var(--sub);margin-top:18px}
</style>
</head>

<script>
var CAT={g:"어휘",o:"대명사",b:"연결어",k:"핵심 문장",p:"구문"};
var P={"src": "22년 11월 32번", "sub": "고2 · 금융 시장의 감염과 두려움", "one": "금융 시장은 서로 연결되어 접촉 없이도 감염되고, 두려움과 불확실성 자체가 위기를 만들어 내는 자기충족적 고통", "flow": [{"label": "도입부", "range": "1~2번", "sum": "시장의 연결성 때문에 금융 시장은 잠재적 감염에 취약, 실패가 독감처럼 번짐 <small>(connectedness, vulnerable to infection)<\/small>", "eg": "서로 돈을 빌려주고 빌리는 동네 은행들 사이에서 한 곳의 문제가 이웃 은행으로 번짐"}, {"label": "본론 (1)", "range": "3~5번", "sum": "감염은 접촉 없이도 일어남, 은행은 자기 투자가 실패하지 않아도 지급 불능이 될 수 있음 <small>(without contact, insolvent)<\/small>", "eg": "망한 은행과 거래한 적 없는 우리 동네 은행도 소문만으로 흔들림"}, {"label": "요지", "range": "6번", "sum": "두려움과 불확실성도 연쇄적인 실패처럼 금융 시장에 손해를 끼침 <small>(fear and uncertainty)<\/small>", "eg": "‘곧 망한다더라’ 하는 소문이 퍼지는 것만으로 동네 은행 앞에 사람들이 몰림"}, {"label": "본론 (2)", "range": "7번", "sum": "모두가 은행이 지급 불능이 된다고 믿으면 정말 지급 불능이 됨 <small>(self-fulfilling belief)<\/small>", "eg": "손님들이 전부 ‘이 은행 위험하다’고 믿는 순간 멀쩡한 은행이 정말 문을 닫음"}, {"label": "결론", "range": "8~10번", "sum": "남들이 믿는다고 두려워하는 것만으로 충분, 건전한 은행도 마지막 인출자가 되기 싫은 마음에 흔들리니 재정적 고통은 자기충족적 <small>(self-fulfilling)<\/small>", "eg": "은행이 튼튼한 줄 알아도 남들이 돈을 뺄 것 같으면 나도 서둘러 은행으로 달려감"}], "sents": [{"n": 1, "mk": "The [1|connectedness] of the global economic market [2|makes it vulnerable to potential “infection.”]", "ko": "전 세계 경제 시장의 연결성은 그것을 잠재적 ‘감염’에 취약하게 만든다."}, {"n": 2, "mk": "A [3|financial] failure can [4|make its way] from borrowers to banks to [5|insurers], [6|spreading like a flu].", "ko": "금융상의 실패는 독감처럼 퍼지면서 채무자에서부터 은행, 보증인까지 나아갈 수 있다."}, {"n": 3, "mk": "[7|However], there are unexpected [8|characteristics] [9|when it comes to] [10|such infection] in the market.", "ko": "그러나 시장에서의 그러한 감염에 관해서는 예상치 못한 특징들이 있다."}, {"n": 4, "mk": "[11|Infection can occur even without any contact].", "ko": "감염은 심지어 어떤 접촉 없이도 일어날 수 있다."}, {"n": 5, "mk": "A bank might become [12|insolvent] even [13|without having any of its investments fail].", "ko": "은행은 자신의 투자 중 어느 것도 실패하지 않고도 지급 불능이 될 수 있다."}, {"n": 6, "mk": "[14|Fear and uncertainty can be damaging to financial markets], just as [15|cascading failures] due to bad investments.", "ko": "두려움과 불확실성은, 나쁜 투자들 때문에 일어나는 연속된 실패처럼, 금융 시장에 손해를 끼칠 수 있다."}, {"n": 7, "mk": "[16|If we all woke up tomorrow and believed that Bank X would be insolvent], then [17|it] would become insolvent.", "ko": "만약 우리 모두가 내일 깨어나서 X은행이 지급 불능이 될 것이라고 믿는다면, 그러면 그것은 지급 불능이 될 것이다."}, {"n": 8, "star": 1, "mk": "[18|In fact], [19|it would be enough for us to fear] that others believed that Bank X was going to fail, or just to fear our [20|collective] fear!", "ko": "사실 우리가 다른 사람들이 X은행이 실패할 것이라고 믿고 있다는 것을 무서워하거나, 단지 우리의 집단적인 두려움을 무서워하는 것으로 충분할 것이다."}, {"n": 9, "mk": "We might all even know that Bank X was well-managed with healthy investments, [21|but] if we [22|expected others to] [23|pull their money out], then we would [24|fear being] [25|the last to pull our money out].", "ko": "우리 모두가 심지어 X은행이 건전한 투자로 잘 운영된다는 것을 알지라도, 만약 우리가 다른 사람들이 그들의 돈을 인출해 갈 것이라고 예상한다면, 그러면 우리는 자신의 돈을 인출하는 마지막 사람이 되는 것을 무서워할 것이다."}, {"n": 10, "mk": "[26|Financial distress can be self-fulfilling] and is a [27|particularly troublesome aspect] of financial markets.", "ko": "재정적인 고통은 자기충족적일 수 있고 금융 시장에서의 특별히 골치 아픈 측면이다."}], "items": {"1": {"c": "g", "t": "connectedness : 연결성", "n": ["connectedness = 연결성", "connect = 연결하다 / connected = 연결된", "the global economic market = 전 세계 경제 시장"], "x": ["The connectedness of the global economic market은 ‘전 세계 경제 시장의 연결성’이라는 뜻으로 문장의 주어이다.", "connectedness는 connect(연결하다) → connected(연결된) → connectedness(연결된 상태)로 만들어진 명사이다.", "global은 ‘전 세계의’, economic은 ‘경제의’라는 뜻이다.", "economic(경제의)과 economical(경제적인, 절약하는)은 뜻이 다르므로 구분한다."]}, "2": {"c": "k", "t": "주제 (1) : 시장의 연결성은 시장을 감염에 취약하게 만든다", "n": ["make + O + OC(형용사) = O를 ~하게 만들다", "vulnerable (to ~) = (~에) 취약한", "potential = 잠재적인", "infection = 감염 (여기서는 금융 위기의 전염)"], "x": ["makes it vulnerable to potential “infection.”은 ‘그것을 잠재적 ‘감염’에 취약하게 만든다’라는 뜻이다.", "it은 앞의 the global economic market을 가리킨다.", "makes it vulnerable은 make + O + OC(형용사) 구조로 ‘O를 ~하게 만든다’이다.", "vulnerable to ~는 ‘~에 취약한’, potential은 ‘잠재적인’이라는 뜻이다.", "infection은 원래 ‘감염’이지만 여기서는 따옴표를 붙여 금융 시장에 위기가 번지는 것을 비유한다."], "e": "쉬운 예시 : 동네 은행들이 서로 돈을 빌려주며 얽혀 있으면, 한 은행의 문제가 이웃 은행으로 쉽게 번진다."}, "3": {"c": "g", "t": "financial : 금융상의", "n": ["financial = 금융상의, 재정의", "finance = 금융, 재정", "(참고) economic = 경제의"], "x": ["A financial failure는 ‘금융상의 실패’라는 뜻이다.", "financial은 명사 finance(금융)의 형용사형이다.", "financial failure는 금융 거래에서 생기는 실패를 말한다.", "뒤의 financial markets, financial distress에도 계속 쓰인다."]}, "4": {"c": "g", "t": "make one’s way : 나아가다", "n": ["make one’s way = 나아가다, 가다", "make its way from A to B = A에서 B로 나아가다", "from borrowers to banks to insurers = 채무자에서 은행, 보증인까지"], "x": ["can make its way from borrowers to banks to insurers는 ‘채무자에서 은행, 보증인까지 나아갈 수 있다’라는 뜻이다.", "make one’s way는 ‘나아가다’라는 뜻의 덩어리 표현이다.", "one’s 자리에는 주어에 맞는 소유격이 오는데, 여기서는 its(= A financial failure의)가 쓰였다.", "실패가 사슬처럼 이어지는 대상들을 차례로 보여 준다."]}, "5": {"c": "g", "t": "insurer : 보증인", "n": ["insurer = 보증인(보험업자라는 뜻도 있음)", "insure = 보험에 들다, 보험을 제공하다", "insurance = 보험"], "x": ["to insurers는 ‘보증인들에게까지’라는 뜻이다.", "insurer는 동사 insure에 사람이나 회사를 뜻하는 -er이 붙은 명사이다.", "실패가 채무자 → 은행 → 보증인로 이어지는 흐름이다.", "참고 : 공식 해설서는 ‘보증인’으로 해석함"]}, "6": {"c": "p", "t": "분사구문 : spreading like a flu", "n": ["spreading like a flu = 독감처럼 퍼지면서 (동시 상황)", "분사구문 = 접속사 + 주어를 줄인 -ing구", "like = ~처럼 (전치사)"], "x": ["spreading like a flu는 ‘독감처럼 퍼지면서’라는 뜻이다.", "주절의 주어 A financial failure와 spreading의 주어가 같아서 현재분사구문이 되었다.", "and it spreads like a flu에서 접속사와 주어를 줄인 모양으로 볼 수 있다.", "like는 여기서 ‘~처럼’이라는 뜻의 전치사이다.", "spread는 ‘퍼지다’, spreading은 그 -ing형이다."]}, "7": {"c": "b", "t": "However : 그러나", "n": ["however = 그러나", "앞과 다른 방향의 내용을 이끎"], "x": ["However는 ‘그러나’라는 뜻의 연결어이다.", "1~2번은 연결 때문에 위기가 퍼지는 이야기이고, 3번부터는 그 감염에 관한 예상 밖의 특징으로 넘어간다.", "뒤에서 ‘접촉 없이도 감염된다’는 내용이 이어진다."]}, "8": {"c": "g", "t": "characteristic : 특징", "n": ["characteristic = 특징 (명사)", "(다의어) characteristic = 특유의, 특징적인 (형용사)", "unexpected characteristics = 예상치 못한 특징들"], "x": ["there are unexpected characteristics는 ‘예상치 못한 특징들이 있다’라는 뜻이다.", "characteristic은 명사로 ‘특징’, 형용사로 ‘특유의’라는 뜻이다.", "characteristics는 복수형이라 동사 are가 쓰였다.", "there are 구문에서 주어는 뒤에 오는 characteristics이다."]}, "9": {"c": "g", "t": "when it comes to + 명사 : ~에 관한 한", "n": ["when it comes to ~ = ~에 관한 한, ~에 대해 말하자면", "to = 전치사 (뒤에 명사/동명사)"], "x": ["when it comes to such infection in the market은 ‘시장에서의 그러한 감염에 관한 한’이라는 뜻이다.", "when it comes to는 하나의 덩어리 표현이다.", "여기서 to는 전치사라서 뒤에 명사(구)나 동명사가 온다. 동사원형은 올 수 없다.", "there are unexpected characteristics와 합쳐 ‘그러한 감염에 관해서는 예상 밖의 특징이 있다’로 읽는다."]}, "10": {"c": "o", "t": "such infection = 1~2번에서 말한 감염", "n": ["such infection = 앞서 말한 ‘감염’ (금융 실패가 퍼지는 것)", "such = 그러한 (앞 내용을 받는 말)"], "x": ["such infection은 ‘그러한 감염’이라는 뜻이다.", "1번의 potential “infection”과 2번의 spreading like a flu에서 말한 금융 위기의 전염을 가리킨다.", "such는 앞에서 말한 것을 가리키는 지시 형용사이다."]}, "11": {"c": "k", "t": "주제 (2) : 감염은 접촉 없이도 일어난다", "n": ["Infection can occur even without any contact = 감염은 어떤 접촉 없이도 일어날 수 있다", "occur = 일어나다, 발생하다", "contact = 접촉", "even without ~ = ~ 없이도"], "x": ["Infection can occur even without any contact는 ‘감염은 심지어 어떤 접촉 없이도 일어날 수 있다’라는 뜻이다.", "occur는 ‘일어나다’라는 뜻이고, 과거형은 occurred로 r을 한 번 더 쓴다.", "contact는 ‘접촉’이라는 뜻이다. 직접 닿는 일이 없어도 감염이 일어난다는 말이다.", "even은 ‘심지어’, without any ~는 ‘어떤 ~도 없이’라는 뜻이다.", "3번에서 말한 ‘예상치 못한 특징’이 바로 이것이다."], "e": "쉬운 예시 : 우리 동네 은행은 망한 은행과 거래한 적이 없는데도, ‘은행이 위험하다’는 소문만으로 흔들린다."}, "12": {"c": "g", "t": "insolvent : 지급 불능의, 파산한", "n": ["insolvent = 지급 불능의, 파산한", "(반의어) solvent = 지급 능력이 있는", "become insolvent = 지급 불능이 되다"], "x": ["A bank might become insolvent는 ‘은행은 지급 불능이 될 수 있다’라는 뜻이다.", "insolvent는 빚을 갚을 돈이 없는 상태를 말한다. 형용사 solvent(지급 능력이 있는)에 부정 접두사 in-이 붙은 말이다.", "become 뒤에는 형용사 보어가 온다.", "7번 문장에서도 would be insolvent, would become insolvent로 반복된다."]}, "13": {"c": "p", "t": "without having + O + 원형동사 : O가 ~하는 일 없이", "n": ["without having any of its investments fail = 투자 중 어느 것도 실패하는 일 없이", "have + O + 원형동사 = O가 ~하는 일을 겪다", "without + -ing = ~하지 않은 채, ~없이", "any of its investments = 그 은행의 투자 중 어느 것"], "x": ["기준 : 아잉카 번역(어떠한 투자도 실패하지
