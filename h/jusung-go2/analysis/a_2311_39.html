<script>
var CAT={g:"어휘",o:"대명사",b:"연결어",k:"핵심 문장",p:"구문"};
var P={"src": "23년 11월 39번", "sub": "고2 · 부정확성의 허용", "one": "오류를 허용하는 기준을 느슨하게 하면 훨씬 더 많은 데이터를 얻어, 부정확함이 단점이 아니라 장점이 될 수 있음", "flow": [{"label": "도입부", "range": "1~2번", "sum": "19세기에 정밀한 측정 체계가 퍼졌으나 1920년대 양자 역학이 완벽한 측정의 꿈을 깨뜨림 <small>(perfect measurement)<\/small>", "eg": "반 친구들의 키를 1mm까지 똑같이 재려던 노력이 한계에 부딪힘"}, {"label": "본론 (1)", "range": "3~4번", "sum": "그래도 공학·과학, 심지어 비즈니스까지 완벽한 측정을 추구하는 사고방식이 이어짐 <small>(the mindset continued)<\/small>", "eg": "그래도 학교와 회사는 계속 1mm 단위의 정확한 기록을 요구함"}, {"label": "본론 (2) 요지", "range": "5~6번", "sum": "오늘날은 부정확함을 허용하는 것이 단점이 아닌 긍정적 특성, 그 대가로 훨씬 더 많은 데이터를 얻음 <small>(allowing for imprecision)<\/small>", "eg": "키를 cm 단위로 대충 재면 오차는 생기지만 전교생을 빠르게 다 잴 수 있음"}, {"label": "결론", "range": "7번", "sum": "‘더 많은 것이 더 나은’ 데서 더 나아가 때로는 ‘더 많은 것이 더 훌륭함’ <small>(more is greater than better)<\/small>", "eg": "정확하지만 몇 명뿐인 키 자료보다 대략적이어도 전교생의 키 자료가 더 쓸모 있을 때가 있음"}], "sents": [{"n": 1, "mk": "By the nineteenth century, France had developed a system of [1|precisely defined] units of measurement to [2|capture] space, time, and more, and had begun to [3|get other nations to adopt] the same standards.", "ko": "19세기까지, 프랑스는 공간, 시간, 그리고 더 많은 것을 포착하기 위해 정밀하게 규정된 측정 단위의 체계를 개발했고, 다른 국가들이 동일한 기준을 채택하도록 만들기 시작했다."}, {"n": 2, "mk": "Just half a century later, in the 1920s, the discoveries of quantum mechanics forever destroyed the dream of [4|comprehensive] and perfect measurement.", "ko": "불과 반세기 후, 1920년대에, 양자 역학의 발견은 포괄적이고 완벽한 측정에 대한 꿈을 영원히 깨 버렸다."}, {"n": 3, "mk": "[5|And yet], outside a relatively small circle of physicists, the [6|mindset] of humankind‘s drive [7|to flawlessly measure] continued among engineers and scientists.", "ko": "그러나, 비교적 소수의 물리학자 집단을 제외하고는, 완벽하게 측정하려는 인류의 추진 정신은 공학자와 과학자 사이에서 계속되었다."}, {"n": 4, "mk": "In the world of business, [11|it] even [8|expanded], [9|as] the precision-oriented sciences of mathematics and statistics began to influence all areas of [10|commerce].", "ko": "비즈니스의 세계에서, 그것은 심지어 확장되었는데, 정확성을 지향하는 수학과 통계학이라는 과학이 상업의 모든 영역에 영향을 미치기 시작하면서였다."}, {"n": 5, "mk": "[12|However], [13|contrary to] the trend of the past several decades, in many new situations [14|that] are occurring today, [15|allowing for] [16|imprecision — for messiness —] [17|may be a positive feature, not a shortcoming].", "ko": "그러나, 지난 수십 년간의 경향과 반대로, 오늘날 발생하고 있는 많은 새로운 상황에서, 부정확성, 즉 번잡함을 허용하는 것은 긍정적인 특성일 수 있으며 단점이 아니다."}, {"n": 6, "mk": "As a [18|tradeoff] for [19|relaxing] the standards of allowable errors, [21|one] can [20|get a hold of] much more data.", "ko": "허용할 오류의 기준을 완화하는 것에 대한 대가로서, 사람은 훨씬 더 많은 데이터를 얻을 수 있다."}, {"n": 7, "mk": "It [22|isn't just] that “more is better than some,” [22|but] that, in fact, sometimes [23|“more is greater than better.”]", "ko": "그것은 단순히 ‘더 많은 것이 조금보다 더 나을’ 뿐만 아니라, 사실은 때때로 ‘더 많은 것이 더 좋은 것보다 더 훌륭하기’도 하다는 것이다."}], "items": {"1": {"c": "g", "t": "define : 규정하다, 정의하다", "n": ["define = 규정하다, 정의하다", "precisely = 정밀하게, 정확하게", "units of measurement = 측정 단위"], "x": ["precisely defined units of measurement는 ‘정밀하게 규정된 측정 단위’라는 뜻이다.", "defined는 동사 define의 과거분사로, units를 앞에서 꾸미는 형용사 역할이다.", "precisely는 형용사 precise(정밀한)의 부사형이다.", "measurement는 동사 measure(측정하다)의 명사형이다."]}, "2": {"c": "g", "t": "capture : 포착하다, 담아내다", "n": ["capture = 포착하다, 담아내다", "(다의어) capture = 붙잡다, 점령하다", "to capture space, time, and more = 공간, 시간 등을 담아내기 위해"], "x": ["to capture space, time, and more는 ‘공간, 시간, 그리고 더 많은 것을 포착하기 위해’라는 뜻이다.", "to capture는 목적을 나타내는 to부정사(부사적 용법)이다.", "space, time, and more는 capture의 목적어로 나란히 놓인 말들이다.", "capture는 ‘포착하다’ 외에 ‘붙잡다, 점령하다’라는 뜻도 있다."]}, "3": {"c": "p", "t": "get + O + to V : O가 ~하도록 만들다", "n": ["get + O + to V = O가 ~하도록 만들다", "get other nations to adopt = 다른 나라들이 채택하도록 만들다", "adopt = 채택하다 / standard = 기준, 표준"], "x": ["had begun to get other nations to adopt the same standards는 ‘다른 나라들이 같은 기준을 채택하게 만들기 시작했다’라는 뜻이다.", "get은 목적어(other nations) 뒤에 to부정사를 목적보어로 취한다.", "had begun은 과거완료로, 19세기까지 이미 시작했다는 뜻이다.", "adopt는 ‘채택하다’이고, standards는 명사 standard(기준)의 복수형이다."]}, "4": {"c": "g", "t": "comprehensiv
