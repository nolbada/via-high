var P={"src": "22년 11월 34번", "sub": "고2 · 교란 변수와 인과적 결론의 신뢰", "one": "교란 변수는 인과적 결론의 신뢰를 흔드는 요인으로, 알려져 있으면 보정할 수 있지만 알려져 있지 않으면 신뢰성을 해침", "flow": [{"label": "도입부", "range": "1~3번", "sum": "인간 관찰 연구는 통제되지 않고 사람마다 생활 방식과 환경이 달라 적절한 실험 대상이 못 됨 <small>(observational studies, homogeneous)<\/small>", "eg": "아이스크림을 먹는 사람과 안 먹는 사람은 사는 곳도 습관도 달라서 똑같은 조건으로 비교할 수 없음"}, {"label": "본론 (1)", "range": "4~5번", "sum": "교란 변수는 인과적 결론을 도출하는 능력을 손상시키고 연구 대상 변수의 영향을 분리하기 어렵게 만듦 <small>(confounding factors)<\/small>", "eg": "더운 날씨가 아이스크림 판매와 물놀이 사고를 둘 다 늘려서 둘의 관계가 흐려짐"}, {"label": "본론 (2)", "range": "6~8번", "sum": "술과 암, 커피와 심장 질환의 예, 흡연을 보정하자 상관관계의 대부분이 사라짐 <small>(correct for)<\/small>", "eg": "아이스크림 판매와 사고를 날씨별로 나눠 다시 보면 둘의 관계가 거의 사라짐"}, {"label": "결론", "range": "9번", "sum": "교란 변수가 알려져 있으면 보정이 가능 <small>(known, correct for them)<\/small>", "eg": "더운 날씨 때문임을 알면 날씨 영향을 빼고 다시 비교함"}, {"label": "주제 강조", "range": "10번", "sum": "교란 변수가 알려져 있지 않으면 인과적 결론의 신뢰성이 손상됨 <small>(unknown, undermine the reliability)<\/small>", "eg": "날씨를 모른 채 ‘아이스크림이 사고를 부른다’고 결론 내리면 그 결론은 믿을 수 없음"}], "sents": [{"n": 1, "mk": "[1|Observational studies] of humans cannot be [2|properly controlled].", "ko": "인간에 대한 관찰 연구는 적절하게 통제될 수 없다."}, {"n": 2, "mk": "Humans live [3|different lifestyles and in different environments].", "ko": "인간은 다양한 생활 방식으로 그리고 다양한 환경에서 살고 있다."}, {"n": 3, "mk": "[4|Thus], they are [5|insufficiently homogeneous] to be suitable experimental [7|subjects].", "ko": "따라서 그들은 적절한 실험 대상이 되기에 충분히 동질적이지 않다."}, {"n": 4, "mk": "[8|These confounding factors] [9|undermine] [10|our ability to draw sound causal conclusions] from human [11|epidemiological surveys].", "ko": "이러한 ‘교란 변수’는 인간 역학 조사로부터 타당한 인과적 결론을 도출하는 우리의 능력을 손상시킨다."}, {"n": 5, "star": 1, "mk": "[12|Confounding factors] are variables (known or unknown) that [14|make it difficult for epidemiologists to isolate] the effects of the specific variable [15|being studied].", "ko": "교란 변수는 역학자가 연구되고 있는 특정한 변수의 영향을 분리하기 어렵게 만드는 (알려지거나 알려지지 않은) 변수이다."}, {"n":
