<style>

.bkb{margin-top:8px;border:1.5px solid var(--d);background:var(--card);color:var(--d);border-radius:999px;padding:6px 14px;font:700 13px inherit;font-family:inherit;cursor:pointer}
.flash{animation:fl 1.4s ease}@keyframes fl{0%,60%{box-shadow:0 0 0 4px #f5c84288}100%{box-shadow:none}}

<script>
var CAT={g:"어휘",o:"대명사",b:"연결어",k:"핵심 문장",p:"구문"};
var P={"src": "22년 11월 36번", "sub": "고2 · 잊힐 권리", "one": "잊힐 권리는 사생활 권리와 달리 이미 공개된 정보에도 적용되어 개인이 과거에 영원히 묶이지 않게 하지만, 다른 권리와 충돌할 수 있음", "flow": [{"label": "도입부", "range": "1~3번", "sum": "잊힐 권리는 사생활 권리와 구별되지만 관련됨, 사생활 권리는 비공개 정보 보호 <small>(distinct from but related to privacy)<\/small>", "eg": "비공개 일기장을 지키는 권리와, 이미 올린 옛 게시물을 지워 달라는 권리는 서로 다름"}, {"label": "본론 (1)", "range": "4~5번", "sum": "개인이 특정 시점의 정보에 영원히 규정되지 않을 권리, 삶을 이어 가게 해 주는 것이 동기 <small>(not to be forever defined)<\/small>", "eg": "중학생 때 올린 흑역사 게시물 하나로 어른이 되어서도 평가받지 않을 권리"}, {"label": "본론 (2)", "range": "6번", "sum": "일부 국가에서는 과거 유죄 판결도 결국 소멸되어 삶에 계속 영향을 주지 않아야 한다고 인정 <small>(UK, France)<\/small>", "eg": "오래전 실수 기록은 일정 시간이 지나면 더 이상 따라다니지 않도록 정한 나라들이 있음"}, {"label": "결론", "range": "7~8번", "sum": "잊힐 권리는 다른 권리와 때때로 충돌, 안보·공공 보건 등 공식 예외가 존재 <small>(come into conflict with other rights)<\/small>", "eg": "옛 게시물 삭제 요구가 공익을 위해 남겨야 할 기록과 부딪히면 예외를 둠"}], "sents": [{"n": 1, "mk": "The right [1|to be forgotten] is a right [2|distinct from but related to] a right to privacy.", "ko": "잊힐 권리는 사생활에 대한 권리와는 구별되지만 그와 관련된 권리이다."}, {"n": 2, "mk": "The right to privacy is, among other things, the right [3|for information] traditionally [4|regarded as] protected or personal [3|not to be revealed].", "ko": "사생활에 대한 권리는 무엇보다도 전통적으로 보호되거나 개인적인 것으로 여겨지는 정보가 공개되지 않을 권리이다."}, {"n": 3, "mk": "The right to be forgotten, [7|in contrast], can be [8|applied to] information [9|that has been in] the public [10|domain].", "ko": "반면에 잊힐 권리는 공공의 영역에 있었던 정보에 적용될 수 있다."}, {"n": 4, "mk": "The right to be forgotten broadly includes [13|the right of an individual not to be forever defined by information from a specific point in time].", "ko": "잊힐 권리는 개인이 특정 시점의 정보에 의해 영원히 정의되지 않을 권리를 광범위하게 포함한다."}, {"n": 5, "mk": "One [16|motivation] for [33|such a right] is [17|to allow] individuals to [18|move on with] their lives [17|and not be defined] by a [14|specific] event or period in their lives.", "ko": "그러한 권리의 한 가지 동기는 개인이 자신의 삶을 계속 이어 갈 수 있게 해 주고 자신의 삶의 특
