<script>
var CAT={g:"어휘",o:"대명사",b:"연결어",k:"핵심 문장",p:"구문"};
var P={"src": "23년 11월 40번", "sub": "고2 · 협력과 사회적 혜택", "one": "집단에 기여하는 협력적인 사람은 사회적 혜택을 받고, 비협조적인 사람은 비판과 벌을 받는 경향", "flow": [{"label": "도입부", "range": "1번", "sum": "협력적인 사람은 다른 사람들에게서 사회적 혜택을 받는 경향 <small>(social advantages)<\/small>", "eg": "모둠 활동에서 친구를 잘 도와주는 학생은 다른 친구들에게도 도움을 받음"}, {"label": "본론 (1)", "range": "2~3번", "sum": "기여자에 대한 반응을 보는 실험, 집단 기금 게임 뒤 평판에 따라 돈을 주게 함 <small>(a cooperative game)<\/small>", "eg": "모둠 간식비를 낸 친구에게 다른 친구들이 호의로 갚는지 보는 게임"}, {"label": "본론 (2)", "range": "4~5번", "sum": "더 많이 기부한 사람이 더 많은 돈을 맡게 되었고, 다른 연구도 같은 결과 <small>(more responsibility)<\/small>", "eg": "간식비를 더 낸 친구에게 모둠 돈 관리를 맡김"}, {"label": "결론", "range": "6~7번", "sum": "협력적인 사람은 선택·선호·좋은 평가·신뢰를 얻고, 비협조적인 사람은 비판과 벌을 받음 <small>(preferred / punishment)<\/small>", "eg": "도와주는 친구는 모둠장으로 뽑히고, 얌체 짓을 하는 친구는 핀잔을 들음"}], "sents": [{"n": 1, "mk": "Multiple laboratory studies show that [1|cooperative] [2|people tend to receive social advantages from others].", "ko": "여러 실험실 연구들은 협력적인 사람들이 다른 사람들로부터 사회적 혜택들을 받는 경향이 있다는 것을 보여 준다."}, {"n": 2, "mk": "One way to [3|demonstrate] [4|this] is to give people the opportunity to act positively or negatively toward [6|contributors].", "ko": "이것을 증명하는 한 가지 방법은 사람들에게 기여자들을 향해 긍정적으로 또는 부정적으로 행동할 기회를 주는 것이다."}, {"n": 3, "mk": "[9|For example], Pat Barclay, a professor at the University of Guelph, [7|had participants play] a cooperative game [8|where] people could [6|contribute] money toward a group fund which helped all group members, and then [10|allowed participants to give] money to other participants [11|based on] their [12|reputations].", "ko": "예를 들어, Guelph 대학교의 교수인 Pat Barclay는 참가자들로 하여금 사람들이 모든 집단 구성원들을 도와주는 집단 기금에 돈을 기부할 수 있는 협동 게임을 하도록 한 다음, 참가자들이 그들의 평판을 바탕으로 다른 참가자들에게 돈을 줄 수 있도록 허락했다."}, {"n": 4, "star": 1, "mk": "People who [6|contributed] more to the group fund [13|were given] [14|responsibility] for more money than people who contributed less.", "ko": "집단 기금에 더 많이 기부한 사람들은 덜 기부한 사람들보다 더 많은 돈에 대한 책임이 주어졌다."}, {"n": 5, "mk": "Similar results
