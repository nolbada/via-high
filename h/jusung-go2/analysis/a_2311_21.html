var P={"src": "23년 11월 21번", "sub": "고2 · 예술과 미학의 역할", "one": "예술과 미학은 어렵고 불편한 경험도 정서적으로 마주하게 해 주는 매개체", "flow": [{"label": "도입부", "range": "1번", "sum": "예술과 미학은 다양한 인간 경험에 정서적 연결을 제공 <small>(emotional connection)<\/small>", "eg": "슬픈 영화를 보면 전쟁이나 이별 같은 낯선 일도 마음으로 이해하게 됨"}, {"label": "본론 (1)", "range": "2~3번", "sum": "예술은 단순히 달콤한 것 이상, 불편함을 마주하면 변화와 변형의 경험으로 이어짐 <small>(sugar on the tongue)<\/small>", "eg": "마음이 불편한 영화도 끝까지 보고 나면 생각이 달라져 있음"}, {"label": "요지", "range": "4번", "sum": "예술은 어렵고 불편한 아이디어·개념과 맞서는 매개체 <small>(vehicles to contend with)<\/small>", "eg": "영화가 불편한 주제를 끝까지 따라가 보게 하는 탈것 역할"}, {"label": "결론 (1)", "range": "5번", "sum": "피카소의 게르니카가 전쟁의 잔인함과 고통을 포착해 보여 줌 <small>(Guernica)<\/small>", "eg": "전쟁 영화 한 편이 뉴스보다 더 깊이 전쟁의 아픔을 전함"}, {"label": "결론 (2)", "range": "6번", "sum": "한스베리의 희곡이 인종 차별과 아메리칸 드림, 가족 이야기를 감동적으로 묘사 <small>(A Raisin in the Sun)<\/small>", "eg": "가족 영화 한 편이 차별과 꿈과 가족애를 한꺼번에 보여 줌"}], "sents": [{"n": 1, "mk": "The arts and aesthetics offer emotional connection to [3|the full range of human experience].", "ko": "예술과 미학은 다양한 인간 경험에 대한 정서적인 연결을 제공한다."}, {"n": 2, "mk": "“The arts [4|can be more than just sugar on the tongue],” Anjan Chatterjee, a professor at the University of Pennsylvania, says.", "ko": "“예술은 단순히 혀 위의 설탕 이상의 것이 될 수 있다.”라고 Pennsylvania 대학교의 교수인 Anjan Chatterjee는 말한다."}, {"n": 3, "mk": "“In art, when there’s something challenging, [7|which] can also be [8|uncomfortable], this discomfort, if we’re willing to engage with [10|it], offers the [11|possibility] of some change, some [12|transformation]. [13|That] can also be a powerful [14|aesthetic] experience.”", "ko": "“예술에서, 무언가 도전적인 것이 있고 그것이 또한 불편할 수 있을 때, 이 불편함은, 우리가 기꺼이 그것에 참여하려 한다면, 어떤 변화, 어떤 변형의 가능성을 제공한다. 그것은 또한 강력한 미적 경험이 될 수 있다.”"}, {"n": 4, "mk": "The arts, in this way, become [15|vehicles] [16|to contend with] ideas and concepts [17|that are difficult and uncomfortable otherwise].", "ko": "예술은 이런 방식으로, 그렇지 않았더라면 어렵고 불편한 아이디어와 개념들과 싸우는 매개체가 된다."}, {"n": 5, "mk": "When Picasso
