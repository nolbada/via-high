<style>

 --gd:#15803d;--gl:#c6efcf;--bd:#1d4ed8;--bl:#cfe0fb;--kd:#be185d;--kl:#fbcfe3;--od:#c2570c;--ol:#ffe0b8;--pd:#6d28d9;--pl:#e4d9fb}

.flash{animation:fl 1.4s ease}@keyframes fl{0%,60%{box-shadow:0 0 0 4px #f5c84288}100%{box-shadow:none}}

<script>
var CAT={g:"어휘",o:"대명사",b:"연결어",k:"핵심 문장",p:"구문"};
var P={"src": "23년 11월 37번", "sub": "고2 · 전체 데이터 세트의 이점", "one": "전체 데이터를 모아 두면 초점과 분석을 나중에 마음대로 다시 정할 수 있어, 일부만 뽑는 방식보다 유리함", "flow": [{"label": "도입부", "range": "1~2번", "sum": "무작위 추출법은 디지털 시대 이전에 큰 데이터 분석을 가능하게 한 지름길 <small>(random sampling)<\/small>", "eg": "사진 수천 장 중 몇 장만 골라 보고 전체 분위기를 판단하던 시절"}, {"label": "본론 (1)", "range": "3번", "sum": "그러나 일부만 뽑으면 파일을 줄일 때처럼 정보가 손실됨 <small>(information is lost)<\/small>", "eg": "큰 사진을 작은 파일로 줄이면 세부 모습이 뭉개지는 것과 같음"}, {"label": "주제", "range": "4번", "sum": "전체 데이터 세트를 가지면 탐색의 자유가 훨씬 커짐 <small>(the full dataset)<\/small>", "eg": "원본 사진 전체가 있으면 확대도 하고 다른 부분도 마음대로 볼 수 있음"}, {"label": "본론 (2)", "range": "5~6번", "sum": "라이트 필드 카메라는 빛의 정보를 통째로 담아 나중에 초점을 고를 수 있음 <small>(light-field camera)<\/small>", "eg": "찍은 뒤에 가까운 사과에 맞출지 먼 오렌지에 맞출지 고름"}, {"label": "결론", "range": "7~9번", "sum": "모든 정보를 모아 두면 처음에 초점을 정할 필요 없이 더 재사용 가능 <small>(more “reuseable”)<\/small>", "eg": "찍을 때 초점을 못 정해도 되고, 같은 사진을 초점만 바꿔 다시 활용 가능"}], "sents": [{"n": 1, "mk": "For a long time, random sampling was a good [1|shortcut].", "ko": "오랫동안, 무작위 추출법은 좋은 지름길이었다."}, {"n": 2, "mk": "[2|It] made analysis of large data problems possible in the pre-digital era.", "ko": "그것은 디지털 시대 이전에 상당한 규모의 데이터 문제를 분석하는 것을 가능하게 했다."}, {"n": 3, "star": 1, "mk": "[4|But] [5|much as] [6|converting a digital image or song into a smaller file] [7|results in] loss of data, information is lost [8|when sampling].", "ko": "그러나 디지털 이미지나 노래를 더 작은 파일로 변환하는 것이 데이터 손실을 유발하는 것과 마찬가지로, 추출을 할 때 정보가 손실된다."}, {"n": 4, "star": 1, "mk": "[9|Having the full (or close to the full) dataset] [10|provides a lot more freedom] [11|to explore], to look at the data [12|from different angles] or to look closer at certain [14|aspects] of [15|it].", "ko": "전체(또는 전체에 가까운) 데이터 세트를 가지는 것은, 탐색하거나, 데이터를 다른 각도에서 살펴보거나, 그것의 특정 측면들을 더 자세히 보게 해 주는 훨씬 더 많은 자유를 제공한다."}, {"n": 5, "mk": "A [16|fitting] example may be the light-field camera, which [18|captures] [19|not just] a single [20|plane] of light, as with [22|conventional] cameras, [19|but] rays from the entire light field, some 11 million of [23|them].", "ko": "적절한 예는 라이트 필드 카메라일 수 있는데, 그것은 기존 카메라처럼 한 평면의 빛만 포착하는 것이 아니라, 전체 라이트 필드로부터 나온 광선들, 즉 그중 약 1,100만 개도 포착한다."}, {"n": 6, "mk": "The photographers can [24|decide] later [25|which element of an image to focus on] in the digital file.", "ko": "사진사들은 나중에 디지털 파일에서 이미지의 어느 요소에 초점을 맞출지 결정할 수 있다."}, {"n": 7, "star": 1, "mk": "[26|There is no need to focus at the beginning], [27|since collecting all the information makes it possible to do] [28|that] afterwards.", "ko": "처음에 초점을 맞출 필요는 없는데, 모든 정보를 수집하는 것이 나중에 그것을 하는 것을 가능하게 만들기 때문이다."}, {"n": 8, "mk": "Because rays from the entire light field [29|are included], [30|it] is closer to all the data.", "ko": "전체 라이트 필드의 광선이 포함되기 때문에, 그것은 모든 데이터에 더 가깝다."}, {"n": 9, "mk": "[31|As a result], [37|the information is more “reuseable”] than [32|ordinary] pictures, where the photographer has to decide what to focus on before [36|she] presses the shutter.", "ko": "결과적으로, 그 정보는 일반 사진보다 더 ‘재사용 가능’한데, 일반 사진에서는 사진사가 셔터를 누르기 전에 무엇에 초점을 맞출지 결정해야 한다."}], "items": {"1": {"c": "g", "t": "shortcut : 지름길", "n": ["shortcut = 지름길", "(다의어) shortcut = (컴퓨터) 바로가기, 단축키", "random sampling = 무작위 추출(법)"], "x": ["a good shortcut은 ‘좋은 지름길’이라는 뜻이다.", "전체를 다 조사하는 대신 일부만 뽑아 빨리 결론에 이르는 방법을 말한다.", "random sampling은 전체에서 일부를 무작위로 뽑아 조사하는 ‘무작위 추출법’이다.", "shortcut은 ‘지름길’ 외에 컴퓨터의 ‘바로가기(단축키)’라는 뜻도 있다."]}, "2": {"c": "o", "t": "It = random sampling (1번)", "n": ["it = random sampling (무작위 추출법)", "1번 문장의 주어를 받음"], "x": ["It은 바로 앞 문장의 주어 random sampling을 가리킨다.", "‘무작위 추출법은 ~을 가능하게 했다’로 해석한다."]}, "4": {"c": "b", "t": "But : 역접 신호", "n": ["but = 그러나", "1~2번의 장점에서 문제점으로 넘어감"], "x": ["But은 ‘그러나’라는 뜻의 연결어이다.", "1~2번은 무작위 추출법이 좋은 지름길이었다는 장점이다.", "3번부터는 그 방식의 문제점으로 넘어간다."]}, "5": {"c": "p", "t": "much as : ~와 마찬가지로 (= as much as)", "n": ["much as = as much as = ~와 마찬가지로", "뒤에 절(주어 + 동사)이 이어짐"], "x": ["기준 : 아잉카 분석(much as = as much as, 접속사 ‘~와 마찬가지로’).", "much as는 ‘~인 것과 마찬가지로’라는 뜻의 접속사 역할이다.", "but과 함께 var cur="all";

function hl(s){return s.replace(/\[(\d+)\|([^\]]+)\]/g,function(m,id,t){var it=I[id];if(cur!='all'&&it.c!=cur)return t;return '<span class="hlk c-'+it.c+'" data-id="'+id+'">'+t+'</span>';});}
function render(){
 var h='<h1>'+P.src+'</h1><div class="sub">'+P.sub+'</div>';

 h+='<div class="card" id="onec"><div class="lab">결국 이 얘기</div><div class="one">'+P.one+'</div></div>';
 h+='<div class="card"><div class="lab">글의 뼈대</div><div class="flow">';
 FLOW.forEach(function(f){h+='<div class="fr"><b>'+f[0]+'</b><span><em>'+f[1]+'</em><strong>'+f[2]+'</strong><div class="eg2">예) '+f[3]+'</div></span></div>';});
 h+='</div></div>';
 h+='<div class="card" id="text">'+textHTML()+'</div>';
 h+='<div class="tabs" id="tabs"><button data-c="all" class="on">전체</button>';
 Object.keys(CAT).forEach(function(c){h+='<button data-c="'+c+'" class="c-'+c+'">'+CAT[c]+'</button>';});
 h+='</div><div id="items"></div>';

 items();

function items(){
 var out="",seen={};
 S.forEach(function(s){
  var ids=[];s.mk.replace(/\[(\d+)\|/g,function(m,id){if(!seen[id]){seen[id]=1;ids.push(id);}});
  ids.forEach(function(id){var it=I[id];if(cur!="all"&&it.c!=cur)return;
   out+='<div class="it c-'+it.c+'" id="it'+id+'"><h4><span class="tl">'+it.t+'</span><span class="tag">'+CAT[it.c]+'</span></h4>';
   out+='<div class="quote">'+s.n+'. '+hl2(s.mk,id)+'<div class="qk">'+s.ko+'</div></div>';
   out+='<div class="note"><div class="nl">노트 정리</div>'+it.n.map(function(l){return '<div class="ln">'+l+'</div>';}).join("")+'</div>';
   out+='<div class="xs">'+it.x.map(function(l){return '<div>'+l+'</div>';}).join("")+'</div>';
   if(it.e)out+='<div class="eg">'+it.e+'</div>';
   out+='<button class="bkb" data-back="'+s.n+'">본문으로 돌아가기</button></div>';
  });
 });
 document.getElementById("items").innerHTML=out;
}
function hl2(s,id){return s.replace(/\[(\d+)\|([^\]]+)\]/g,function(m,i,t){return i==id?'<span class="hlk c-'+I[i].c+'">'+t+'</span>':t;});}
document.addEventListener("click",function(e){
 var t=e.target;
 
 if(t.dataset&&t.dataset.id){var el=document.getElementById("it"+t.dataset.id);if(el){el.scrollIntoView({behavior:"smooth",block:"center"});el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash");}return;}
 if(t.closest&&t.closest("#tabs")&&t.dataset.c){cur=t.dataset.c;setTabs();document.getElementById("text").innerHTML=textHTML();items();return;}

 if(t.tagName=="I"&&t.parentNode.classList.contains("ps")){t.parentNode.classList.toggle("open");}
});
function setTabs(){[].forEach.call(document.querySelectorAll("#tabs button"),function(b){b.classList.toggle("on",b.dataset.c==cur);});}
