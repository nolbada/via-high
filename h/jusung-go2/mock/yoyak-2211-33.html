var DATA={"meta": {"sch": "jusung-go2", "src": "jusung-go2/mock/sx-data.js", "pidx": 4, "lesson": "22년 11월 33번", "title": "", "label": "", "page": "yoyak-2211-33"}, "scenes": [{"tag": "본문 1~2번", "ns": [1, 2], "line": "음수는 눈에 안 보이는 [[abstract|추상적인]] 숫자지만 생활에 꼭 필요한데, 그래도 많은 사람이 음수와 친하지 않다.", "en": ["Negative numbers are a lot more abstract than positive numbers—you can’t see negative 4 cookies and you certainly can’t eat them—but you can think about them, and you have to, in all aspects of daily life, from debts to contending with freezing temperatures and parking garages.", "Still, many of us haven’t quite made peace with negative numbers."], "kos": ["여러분이 음수의 4개의 쿠키를 볼 수 없고 틀림없이 그것들을 먹을 수 없다는 점에서 음수는 양수보다 훨씬 더 추상적이지만 여러분은 그것들을 생각할 수 있으며, 채무에서부터 몹시 차가운 기온, 주차장과 씨름하는 것에 이르기까지 일상생활의 모든 측면에서 생각‘해야만 한다’.", "그런데도 우리들 중 많은 사람들은 음수와 그다지 잘 지내지 못해 왔다."]}, {"tag": "본문 3번", "ns": [3], "line": "사람들은 음수 기호를 [[sidestep|피하려고]] 별별 꾀를 냈다.", "en": ["People have invented all sorts of funny little mental strategies to sidestep the dreaded negative sign."], "kos": ["사람들은 그 두려운 음수의 기호를 피하기 위해 모든 종류의 우스꽝스럽고 사소한 정신적 전략들을 만들어 냈다."]}, {"tag": "본문 4~6번", "ns": [4, 5, 6], "line": "손실은 빨간색, 연도는 기원전 100년, 지하층은 B1.", "en": ["On mutual fund statements, losses (negative numbers) are printed in red or stuck in parentheses with no negative sign to be found.", "The history books tell us that Julius Caesar was born in 100 B.C., not -100.", "The underground levels in a parking garage often have designations like B1 and B2."], "kos": ["뮤추얼 펀드(계약형 투자 신탁) 명세서에서 손실(음수)은 빨간색으로 인쇄되거나 음수의 기호가 발견되지 않은 채 괄호 안에 갇혀 있다.", "역사책은 우리에게 Julius Caesar가 –100이 아닌 기원전 100년에 태어났다고 말한다.", "주차장의 지하층은 종종 B1과 B2와 같은 명칭을 가지고 있다."]}, {"tag": "본문 7번", "ns": [7], "line": "기온도 영하 5도라고 말하길 [[prefer|선호하는]] 사람이 많다.", "en": ["Temperatures are one of the few exceptions: folks do say, especially here in Ithaca, New York, that it’s -5 degrees outside, though even then, many prefer to say 5 below zero."], "kos": ["기온은 몇 안 되는 예외 중 하나인데 특히 여기 New York의 Ithaca에서 사람들은 바깥의 기온이 –5도라고 말하지만 심지어 그때에도 많은 사람들은 영하 5도라고 말하길 선호한다."]}, {"tag": "본문 8번", "ns": [8], "line": "음수 기호는 그냥 [[unpleasant|불쾌해]] 보이니까.", "en": ["There’s something about that negative sign that just looks so unpleasant."], "kos": ["그 음수의 기호에 관해서는 정말 불쾌하게만 보이는 무언가가 있다."]}], "story": [{"a": "abstract", "form": "abstract", "n": 1, "sq": 1, "sum": "negative numbers are more [[intangible]] than positive numbers", "hook": "쿠키 -4개는 눈에 안 보인다는 문장의 abstract(추상적인) → 요약문에서는 intangible(만질 수 없는)로 바뀌었어요.", "b": "intangible", "k": "추상적인 → 만질 수 없는, 추상적인", "en": "Negative numbers are a lot more abstract than positive numbers—you can’t see negative 4 cookies and you certainly can’t eat them—but you can think about them, and you have to, in all aspects of daily life, from debts to contending with freezing temperatures and parking garages.", "ko": "여러분이 음수의 4개의 쿠키를 볼 수 없고 틀림없이 그것들을 먹을 수 없다는 점에서 음수는 양수보다 훨씬 더 추상적이지만 여러분은 그것들을 생각할 수 있으며, 채무에서부터 몹시 차가운 기온, 주차장과 씨름하는 것에 이르기까지 일상생활의 모든 측면에서 생각‘해야만 한다’."}, {"a": "sidestep", "form": "sidestep", "n": 3, "sq": 2, "sum": "creative ways to [[avoid]] the negative sign", "hook": "두려운 기호를 슬쩍 비켜 가는 문장의 sidestep(피하다) → 요약문에서는 avoid(피하다)로 바뀌었어요.", "b": "avoid", "k": "피하다 → 피하다", "en": "People have invented all sorts of funny little mental strategies to sidestep the dreaded negative sign.", "ko": "사람들은 그 두려운 음수의 기호를 피하기 위해 모든 종류의 우스꽝스럽고 사소한 정신적 전략들을 만들어 냈다."}, {"a": "prefer", "form": "prefer", "n": 7, "sq": 3, "sum": "many people [[favor]] saying 5 below zero", "hook": "영하 5도라고 말하길 더 좋아한다는 문장의 prefer(선호하다) → 요약문에서는 favor(선호하다)로 바뀌었어요.", "b": "favor", "k": "선호하다 → 선호하다, 더 좋아하다", "en": "Temperatures are one of the few exceptions: folks do say, especially here in Ithaca, New York, that it’s -5 degrees outside, though even then, many prefer to say 5 below zero.", "ko": "기온은 몇 안 되는 예외 중 하나인데 특히 여기 New York의 Ithaca에서 사람들은 바깥의 기온이 –5도라고 말하지만 심지어 그때에도 많은 사람들은 영하 5도라고 말하길 선호한다."}, {"a": "unpleasant", "form": "unpleasant", "n": 8, "sq": 3, "sum": "the negative sign simply looks [[unattractive]]", "hook": "음수 기호가 보기 싫다는 문장의 unpleasant(불쾌한) → 요약문에서는 unattractive(매력 없는)로 바뀌었어요.", "b": "unattractive", "k": "불쾌한 → 매력 없는, 보기 싫은", "en": "There’s something about that negative sign that just looks so unpleasant.", "ko": "그 음수의 기호에 관해서는 정말 불쾌하게만 보이는 무언가가 있다."}], "passage": [{"n": 1, "en": "Negative numbers are a lot more abstract than positive numbers—you can’t see negative 4 cookies and you certainly can’t eat them—but you can think about them, and you have to, in all aspects of daily life, from debts to contending with freezing temperatures and parking garages.", "ko": "여러분이 음수의 4개의 쿠키를 볼 수 없고 틀림없이 그것들을 먹을 수 없다는 점에서 음수는 양수보다 훨씬 더 추상적이지만 여러분은 그것들을 생각할 수 있으며, 채무에서부터 몹시 차가운 기온, 주차장과 씨름하는 것에 이르기까지 일상생활의 모든 측면에서 생각‘해야만 한다’."}, {"n": 2, "en": "Still, many of us haven’t quite made peace with negative numbers.", "ko": "그런데도 우리들 중 많은 사람들은 음수와 그다지 잘 지내지 못해 왔다."}, {"n": 3, "en": "People have invented all sorts of funny little mental strategies to sidestep the dreaded negative sign.", "ko": "사람들은 그 두려운 음수의 기호를 피하기 위해 모든 종류의 우스꽝스럽고 사소한 정신적 전략들을 만들어 냈다."}, {"n": 4, "en": "On mutual fund statements, losses (negative numbers) are printed in red or stuck in parentheses with no negative sign to be found.", "ko": "뮤추얼 펀드(계약형 투자 신탁) 명세서에서 손실(음수)은 빨간색으로 인쇄되거나 음수의 기호가 발견되지 않은 채 괄호 안에 갇혀 있다."}, {"n": 5, "en": "The history books tell us that Julius Caesar was born in 100 B.C., not -100.", "ko": "역사책은 우리에게 Julius Caesar가 –100이 아닌 기원전 100년에 태어났다고 말한다."}, {"n": 6, "en": "The underground levels in a parking garage often have designations like B1 and B2.", "ko": "주차장의 지하층은 종종 B1과 B2와 같은 명칭을 가지고 있다."}, {"n": 7, "en": "Temperatures are one of the few exceptions: folks do say, especially here in Ithaca, New York, that it’s -5 degrees outside, though even then, many prefer to say 5 below zero.", "ko": "기온은 몇 안 되는 예외 중 하나인데 특히 여기 New York의 Ithaca에서 사람들은 바깥의 기온이 –5도라고 말하지만 심지어 그때에도 많은 사람들은 영하 5도라고 말하길 선호한다."}, {"n": 8, "en": "There’s something about function vQ(){
  var q=Qs[cur],a=PR.a[q.id],done=a!==undefined;curQ=q.id;

  if(!done)h+='<p class="hint">문장의 밑줄 단어를 누르면 뜻이 나와요. 보기를 누르면 답을 골라요.</p>';

    h+='</div><div class="card"><p class="lb">직독직해 (끊어서 앞에서부터 이해해요)</p>'+jdHtml(q)+'<details><summary>자연스러운 해석 보기</summary><div class="ko">'+q.ko.replace(/\((A|B)\)\s*/g,'')+'</div></details></div>';
    h+='<div class="card"><p class="lb">보기 뜻</p><ul class="opl">';
    q.opts.forEach(function(o,i){h+='<li class="'+(i===q.ans?'a':'')+'">'+CN[i]+' '+(i===q.ans?'<mark>'+words(o[0])+' – '+words(o[1])+'</mark>':words(o[0])+' – '+words(o[1]))+'<span class="k">'+(i===q.ans?'<mark>'+esc(q.optko[i])+'</mark>  ← 정답':esc(q.optko[i]))+'</span></li>'});
    h+='</ul></div>';
    h+='<div class="card"><p class="lb">정답의 근거 · 본문 '+(EVK[String(q.id)]||q.evid_full.map(function(e){return [e.n]})).map(function(e){return e[0]+'번'}).join(', ')+'</p>';
    var EVS=EVK[String(q.id)];
    if(EVS)EVS.forEach(function(e){h+='<div class="ev"><div class="kk"><b class="evn">'+e[0]+'번</b> '+e[1]+'</div></div>'});
    else q.evid_full.forEach(function(e){h+='<div class="ev"><div class="en">'+rich(e.en,e.hl)+'</div><div class="kk">'+richKo(e.ko,e.hlko)+'</div></div>'});
    h+='</div>';
    h+='<div class="card"><p class="lb">이 단어, 이렇게 바뀌었어요</p>';
    q.swaps.forEach(function(s){h+='<div class="swap"><span class="a">'+words(s[0])+'</span><span class="arr">→</span><span class="b">'+words(s[1])+'</span><span class="ds">'+esc(s[2])+(/\s/.test(s[0])||/\s/.test(s[1])?'':' '+sayBtn(s[0],'듣기')+' '+sayBtn(s[1],'듣기'))+'</span></div>'});
    h+='<div class="note">'+esc(q.swapnote)+'</div></div>';
    h+='<div class="card"><p class="lb">쓰임 익히기</p><div class="use">';
    q.use.forEach(function(u){h+='<div class="u"><div class="uw">'+esc(u.w)+'<small class="uwk">('+esc(u.wk)+')</small></div><div class="ue">'+useEx(u)+'</div><div class="uk">'+esc(u.ko).replace(esc(u.hk),'<mark>'+esc(u.hk)+'</mark>')+'</div></div>'});
    h+='</div></div>';
    h+='<div class="card"><p class="lb">기억할 흐름</p><div class="fc">'+q.fc.map(function(c,i){return (i?'<div class="ar">▼</div>':'')+'<div class="c'+(i===q.fc.length-1?' last':'')+'"><span class="tg">'+esc(c[0])+'</span><div class="hd">'+mk(c[1])+'</div><div class="sb2">'+mk(c[2])+'</div></div>'}).join('')+'</div></div>';
    h+='<div class="card"><details><summary>다른 보기는 왜 아닐까요</summary><ul style="padding:0;margin:6px 0 0">';
    q.wrong.forEach(function(w,i){if(w)h+='<li><b>'+CN[i]+'</b> '+hlp(w)+'</li>'});
    h+='</ul></details></div>';
    h+='<button class="btn pri" data-a="next">'+(cur<Qs.length-1?'다음 문제':'결과 보기')+'</button><button class="btn sec" data-a="home">목록으로</button></div>';
  }
  return h;
}
function vRes(){

function sortedNotes(){return Object.keys(NOTES).map(function(k){return NOTES[k]}).sort(function(a,b){return b.t-a.t})}
function vNotes(){
  var L=sortedNotes();

function sk(id){return id.indexOf('sw:')===0?id.slice(3):id}
function wrongOf(id){var r=SRV[sk(id).toLowerCase()];return r&&r.c>0?r.c:0}
function flagList(){return Object.keys(SRV).map(function(k){return SRV[k]}).filter(function(r){return r.c>0}).sort(function(a,b){return b.c-a.c})}
function nFlag(){return flagList().length}
function srvLoad(){
  try{WN.list().then(function(r){
    if(!r||!r.ok||!r.items)return;SRV={};
    r.items.forEach(function(i){if(String(i.src||'').indexOf(SRC)>=0)SRV[String(i.w).toLowerCase()]={w:i.w,m:i.m,c:i.c||0}});
    if(view==='home'||view==='chk'||view==='sw')render();
  })}catch(e){}
}
function vChk(){
  var L=flagList();
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">선생님 확인 단어 '+L.length+'개</span></div>';
  if(!L.length)return h+'<div class="empty">틀린 단어가 없어요.</div>';

  });

function sceneLine(t,cur){return esc(t).replace(/\[\[(\w+)\|([^\]]+)\]\]/g,function(m,w,k){return '<b class="wc'+(w.toLowerCase()===String(cur).toLowerCase()?' me':'')+'">'+w+'</b>('+k+')'})}

var EVK={
'1':[[1,'음수는 양수보다 훨씬 더 <b>추상적</b>(abstract)이지만 일상에서 생각해야 함'],[2,'많은 사람이 음수와 아직 <b>화해하지 못함</b>(made peace with)']],
'2':[[3,'사람들은 음수 기호를 <b>피하려는</b>(sidestep) <b>우스꽝스럽고 사소한</b>(funny little) 전략을 만들어 냄'],[4,'펀드 명세서의 손실은 빨간색이나 괄호로 표시됨'],[6,'주차장 지하층은 B1, B2 같은 이름을 씀']],
'3':[[7,'기온은 예외지만 많은 사람은 영하 5도라고 말하기를 <b>선호함</b>(prefer)'],[8,'음수 기호는 정말 <b>불쾌하게</b>(unpleasant) 보임']]
};
var REL={
abstract:{bj:'음수는 양수보다 훨씬 더 <b>추상적</b>(abstract)이다',s:[['conceptual','개념적인'],['theoretical','이론적인']],a:[['concrete','구체적인'],['tangible','만질 수 있는']],t:'intangible',tr:'abstract는 눈에 보이지 않는 개념적인, 반대는 concrete'},
'made peace with':{bj:'음수와 <b>화해하지</b>(made peace with) 못했다',s:[],a:[],t:'feel comfortable about',tr:'make peace with는 ~와 화해하다, 받아들이다'},
'negative numbers':{bj:'<b>음수</b>(negative numbers)와 잘 지내지 못했다',s:[],a:[],t:'negative numbers',tr:'0보다 작은 수'},
sidestep:{bj:'음수 기호를 <b>피하려는</b>(sidestep) 전략',s:[['evade','피하다'],['dodge','피하다'],['bypass','우회하다']],a:[['confront','맞서다']],t:'avoid',tr:'sidestep은 옆걸음질로 비켜서다'},
strategies:{bj:'우스꽝스럽고 사소한 정신적 <b>전략</b>(strategies)',s:[['tactic','전술'],['approach','접근법'],['method','방법']],a:[],t:'ways',tr:'strategy는 목표를 이루려는 계획'},
'funny little':{bj:'<b>우스꽝스럽고 사소한</b>(funny little) 정신적 전략',s:[],a:[],t:'creative',tr:'funny little은 귀엽고 사소한 정도의 가벼운 느낌'},
prefer:{bj:'영하 5도라고 말하길 <b>선호한다</b>(prefer)',s:[['choose','선택하다'],['like better','더 좋아하다']],a:[['dislike','싫어하다']],t:'favor',tr:'prefer A to B는 B보다 A를 더 좋아하다'},
unpleasant:{bj:'정말 <b>불쾌하게</b>(unpleasant) 보인다',s:[['disagreeable','불쾌한'],['distasteful','불쾌한']],a:[['agreeable','기분 좋은'],['pleasant','즐거운']],t:'unattractive',tr:'unpleasant는 pleasant의 반대'},
say:{bj:'영하 5도라고 <b>말하길</b>(say) 선호한다',s:[['state','말하다'],['tell','말하다']],a:[],t:'saying',tr:'prefer to say를 prefer saying으로 바꿔 쓸 수 있음'}
};
function relBox(s){
  var r=REL[String(s.a).toLowerCase()];if(!r)return '';
  var it=[{t:s.b,k:String(s.k).split(' → ')[1]||'',c:'k'}];
  r.s.forEach(function(x){it.push({t:x[0],k:x[1],c:'s'})});
  r.a.forEach(function(x){it.push({t:x[0],k:x[1],c:'a'})});
  var P={1:[[50,80]],2:[[26,78],[74,78]],3:[[16,70],[50,86],[84,70]],4:[[14,62],[36,86],[64,86],[86,62]],5:[[12,56],[28,86],[50,92],[72,86],[88,56]]}[it.length],svg='',nd='';
  it.forEach(function(x,j){
    svg+='<line x1="50%" y1="26%" x2="'+P[j][0]+'%" y2="'+(P[j][1]-7)+'%" stroke="'+(x.c=='a'?'#c0392b':'#2f5d50')+'" stroke-width="2"/>';
    nd+='<div class="rn '+x.c+'" style="left:'+P[j][0]+'%;top:'+P[j][1]+'%">'+esc(x.t)+(x.k?'<small>'+esc(x.k)+'</small>':'')+'</div>';
  });
  var left=String(s.k).split(' → ')[0];
  var h='<div class="relx"><div class="rmap"><svg>'+svg+'</svg><div class="rn c" style="left:50%;top:26%">'+esc(s.a)+'<small>'+esc(left)+'</small></div>'+nd+'</div>'
   +'<div class="rleg"><span><i style="border-color:#2f5d50"></i>바꿔 쓸 수 있는 말</span>'+(r.a.length?'<span><i style="border-color:#c0392b"></i>반대말</span>':'')+'</div>'
   +'<div class="pit"><div><em>본문</em>'+r.bj+'</div><div><em>요약문</em><b>'+esc(s.b)+'</b>('+esc(String(s.k).split(' → ')[1]||'')+')로 바뀜</div>'+(r.tr?'<div class="tp"><em>함정</em>'+esc(r.tr)+'</div>':'')+'</div></div>';
  return h;
}
function vSw(){
  var L=swList(),sc={};
  (DATA.scenes||[]).forEach(function(c){(c.line.match(/\[\[\w+\|/g)||[]).forEach(function(m){sc[m.slice(2,-1).toLowerCase()]=c})});
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">바꿔 말하기 '+L.length+'개</span></div>';

  if(!L.length)h+='<div class="empty">별표 친 단어가 없어요. 안 외워지는 단어에 별표를 눌러 두세요.</div>';
  L.forEach(function(s){
    var o=swOpen[s.id],c=sc[s.form.toLowerCase()],on=swD['s'+s.id],fl=wrongOf(s.id);
    h+='<div class="swr"><div class="swq"><span class="qn">'+s.sq+'번</span><span class="sa">'+words(s.a)+(fl?'<small class="flag">'+fl+'번 틀림</small>':'')+'</span><span class="sb">'+(o?'<em>'+words(s.b)+'</em>'+esc(s.k):'→ ?')+'</span>'+sayBtn(s.a,'듣기')+(o?sayBtn(s.b,'정답 듣기'):'')+'<button data-a="rv" data-v="'+esc(s.id)+'">'+(o?'가리기':'확인')+'</button><button data-a="star" data-v="'+esc(s.id)+'" class="stb'+(STAR[s.id]?' on':'')+'">별표</button></div>';
    if(o)h+=relBox(s);else if(REL[String(s.a).toLowerCase()]){var rr=REL[String(s.a).toLowerCase()];h+='<div class="hch">유 '+(1+rr.s.length)+(rr.a.length?' · 반 '+rr.a.length:'')+'</div>'}
    if(c&&!REL[String(s.a).toLowerCase()])h+='<button class="acc2" data-a="dt" data-v="s'+esc(s.id)+'">'+esc(c.tag)+' 줄거리<span>'+(on?'접기':'펼치기')+'</span></button>'+(on?'<div class="story">'+sceneLine(c.line,s.form)+'</div>':'');
    h+='</div>';
  });
  return h+'</div><p class="sumline">시험에서는 본문 단어가 뜻이 같은 다른 단어로 바뀌어 나와요.</p><button class="btn sec" data-a="home">목록으로</button>';
}
/* 자동 새로고침(기록 연동)이 일어나도 보던 문제로 되돌린다 */
try{var sv=JSON.parse(sessionStorage.getItem('vhyv')||'null');if(sv&&sv.p===location.pathname&&Date.now()-sv.t<600000&&sv.v&&sv.v!=='home'){view=sv.v;cur=sv.c||0;try{history.pushState({v:view},'');histPushed=true}catch(e){}}}catch(e){}
render();srvLoad();window.addEventListener('pageshow',srvLoad);
