var DATA={"meta": {"sch": "jusung-go2", "src": "jusung-go2/mock/sx-data.js", "pidx": 0, "lesson": "22년 11월 29번", "title": "", "label": "", "page": "yoyak-2211-29"}, "scenes": [{"tag": "본문 1번", "ns": [1], "line": "선매 행위는 경쟁자가 일을 시작하지 못하게 [[prevent|막는]] 전략이다.", "en": ["Pre-emption means that a strategy is designed to prevent a rival from starting some particular activity."], "kos": ["선매 행위는 어떤 전략이 경쟁자로 하여금 어떤 특정한 활동을 시작하는 것을 방지하기 위해 만들어진다는 것을 의미한다."]}, {"tag": "본문 2번", "ns": [2], "line": "말뿐인 공표만으로도 경쟁자의 마음을 [[discourage|꺾을]] 수 있다.", "en": ["In some case a pre-emptive move may simply be an announcement of some intent that might discourage rivals from doing the same."], "kos": ["어떤 경우에는 선제적 조치는 단순히 경쟁자들이 같은 행동을 하는 것을 단념시킬 수 있는 어떤 의도의 공표일 수도 있다."]}, {"tag": "본문 3번", "ns": [3], "line": "그래서 [[timing|타이밍]]이 중요하다. 때에 따라 이득이 크게 달라진다.", "en": ["The idea of pre-emption implies that timing is sometimes very important—a decision or an action at one point in time might be much more rewarding than doing it at a different time point."], "kos": ["선매 행위 개념은 때로 타이밍이 매우 중요하다는 것을 암시하는데, 즉 어떤 시점의 결정이나 조치는 다른 시점에 그것을 하는 것보다 훨씬 더 득이 될 수 있다."]}, {"tag": "본문 4번", "ns": [4], "line": "새 [[entrant|진입자]]가 오기 전후로 광고를 확 늘린다.", "en": ["Pre-emption may involve up-weighting advertising for a period before and during when a new entrant launches into a market."], "kos": ["선매 행위는 새로운 진입자가 시장에 진출하기 이전과 진출해 있는 동안에 광고의 가중치를 높이는 것을 포함할 수 있다."]}, {"tag": "본문 5번", "ns": [5], "line": "목적은 진입자의 광고가 인상을 남기기 [[difficult|어렵게]] 만드는 것.", "en": ["The intent is to make it more difficult for the new entrant’s advertising to make an impression on potential buyers."], "kos": ["그 취지는 신규 진입자의 광고가 잠재적 구매자들에게 인상을 남기는 것을 더 어렵게 만드는 것이다."]}, {"tag": "본문 6~7번", "ns": [6, 7], "line": "두 번째 전략은 제품 [[variants|변형]]을 엄청난 [[variety|종류]]로 [[launch|출시하는]] 것이다.", "en": ["Product proliferation is another potential pre-emption strategy.", "The general idea is to launch a large variety of product variants so that there is very little in the way of market demand that is not accommodated."], "kos": ["제품 확산은 또 다른 잠재적인 선매 행위 전략이다.", "일반적인 아이디어는 수용되지 않는 시장 수요가 거의 없도록 다양한 제품 변형을 출시하는 것이다."]}, {"tag": "본문 8번", "ns": [8], "line": "시장이 꽉 차면 경쟁자는 [[untapped|아직 손대지 않은]] 수요를 찾기 힘들다.", "en": ["Arguably, if a market is already filled with product variants it is more difficult for competitors to find untapped pockets of market demand."], "kos": ["거의 틀림없이, 만약 시장이 제품 변형으로 이미 채워져 있다면 경쟁자들은 아직 점유되지 않은 시장 수요 주머니를 찾기가 더 어렵다."]}], "story": [{"a": "prevent", "form": "prevent", "n": 1, "sq": 1, "sum": "meant to [[block]] a rival's start of some activity", "hook": "경쟁자가 시작하지 못하게 막는다는 첫 문장의 prevent(방지하다) → 요약문에서는 block(막다)으로 바꿨어요.", "b": "block", "k": "방지하다 → 막다", "en": "Pre-emption means that a strategy is designed to prevent a rival from starting some particular activity.", "ko": "선매 행위는 어떤 전략이 경쟁자로 하여금 어떤 특정한 활동을 시작하는 것을 방지하기 위해 만들어진다는 것을 의미한다."}, {"a": "discourage", "form": "discourage", "n": 2, "sq": 1, "sum": "may [[weaken]] rivals' wish to do the same", "hook": "말뿐인 공표로 경쟁자의 의욕을 꺾는다는 문장의 discourage(단념시키다) → 요약문에서는 weaken(약하게 하다)으로 바꿨어요.", "b": "weaken", "k": "단념시키다 → 약하게 하다", "en": "In some case a pre-emptive move may simply be an announcement of some intent that might discourage rivals from doing the same.", "ko": "어떤 경우에는 선제적 조치는 단순히 경쟁자들이 같은 행동을 하는 것을 단념시킬 수 있는 어떤 의도의 공표일 수도 있다."}, {"a": "timing", "form": "timing", "n": 3, "sq": 2, "sum": "the right [[moment]] can bring greater rewards", "hook": "때에 따라 이득이 달라진다는 문장의 timing(타이밍) → 요약문에서는 moment(시점)로 바꿨어요.", "b": "moment", "k": "타이밍 → 시점", "en": "The idea of pre-emption implies that timing is sometimes very important—a decision or an action at one point in time might be much more rewarding than doing it at a different time point.", "ko": "선매 행위 개념은 때로 타이밍이 매우 중요하다는 것을 암시하는데, 즉 어떤 시점의 결정이나 조치는 다른 시점에 그것을 하는 것보다 훨씬 더 득이 될 수 있다."}, {"a": "entrant", "form": "entrant", "n": 4, "sq": 2, "sum": "a [[newcomer]]'s market launch", "hook": "시장에 새로 들어오는 업체를 가리키는 entrant(진입자) → 요약 이다."}, {"a": "untapped", "form": "untapped", "n": 8, "sq": 3, "sum": "to find [[unmet]] market demand", "hook": "아직 아무도 손대지 않은 수요를 가리키는 untapped → 요약문에서는 unmet(충족되지 않은)으로 바꿨어요.", "b": "unmet", "k": "손대지 않은 → 충족되지 않은", "en": "Arguably, if a market is already filled with product variants it is more difficult for competitors to find untapped pockets of market demand.", "ko": "거의 틀림없이, 만약 시장이 제품 변형으로 이미 채워져 있다면 경쟁자들은 아직 점유되지 않은 시장 수요 주머니를 찾기가 더 어렵다."}], "passage": [{"n": 1, "en": "Pre-emption means that a strategy is designed to prevent a rival from starting some particular activity.", "ko": "선매 행위는 어떤 전략이 경쟁자로 하여금 어떤 특정한 활동을 시작하는 것을 방지하기 위해 만들어진다는 것을 의미한다."}, {"n": 2, "en": "In some case a pre-emptive move may simply be an announcement of some intent that might discourage rivals from doing the same.", "ko": "어떤 경우에는 선제적 조치는 단순히 경쟁자들이 같은 행동을 하는 것을 단념시킬 수 있는 어떤 의도의 공표일 수도 있다."}, {"n": 3, "en": "The idea of pre-emption implies that timing is sometimes very important—a decision or an action at one point in time might be much more rewarding than doing it at a different time point.", "ko": "선매 행위 개념은 때로 타이밍이 매우 중요하다는 것을 암시하는데, 즉 어떤 시점의 결정이나 조치는 다른 시점에 그것을 하는 것보다 훨씬 더 득이 될 수 있다."}, {"n": 4, "en": "Pre-emption may involve up-weighting advertising for a period before and during when a new entrant launches into a market.", "ko": "선매 행위는 새로운 진입자가 시장에 진출하기 이전과 진출해 있는 동안에 광고의 가중치를 높이는 것을 포함할 수 있다."}, {"n": 5, "en": "The intent is to make it more difficult for the new entrant’s advertising to make an impression on potential buyers.", "ko": "그 취지는 신규 진입자의 광고가 잠재적 구매자들에게 인상을 남기는 것을 더 어렵게 만드는 것이다."}, {"n": 6, "en": "Product proliferation is another potential pre-emption strategy.", "ko": "제품 확산은 또 다른 잠재적인 선매 행위 전략이다."}, {"n": 7, "en": "The general idea is to launch a large variety of product variants so that there is very little in the way of market demand that is not accommodated.", "ko": "일반적인 아이디어는 수용되지 않는 시장 수요가 거의 없도록 다양한 제품 변형을 출시하는 것이다."}, {"n": 8, "en": "Arguably, if a market is already filled with product variants it is more difficult for competitors to find untapped pockets of market demand.", "ko": "거의 틀림없이, 만약 시장이 제품 변형으로 이미 채워져 있다면 경쟁자들은 아직 점유되지 않은 시장 수요 주머니를 찾기가 더 어렵다."}], "questions": [{"id": 1, "summary": "Pre-emption is a strategy meant to (A) a rival's start of some activity, and even a simple announcement of intent may (B) rivals' wish to do the same.", "ko": "선매 행위는 경쟁자가 어떤 활동을 <b>(A) 시작하지 못하게 막으려는</b> 전략이고, 단순한 의도의 공표도 경쟁자들이 같은 행동을 하려는 마음을 <b>(B) 약하게 할</b> 수 있다.", "opts": [["block", "strengthen"], ["block", "weaken"], ["support", "strengthen"], ["support", "weaken"], ["ignore", "weaken"]], "optko": ["막다 – 강하게 하다", "막다 – 약하게 하다", "돕다 – 강하게 하다", "돕다 – 약하게 하다", "무시하다 – 약하게 하다"], "ans": 1, "wrong": ["strengthen(강하게 하다)이 틀려요. 공표는 경쟁자의 마음을 단념시키지(discourage), 키우지 않아요.", null, "둘 다 틀려요. 선매 행위는 경쟁자를 돕는(support) 게 아니라 막는 거고, 마음을 강하게 한다는 말도 반대예요.", "support(돕다)가 틀려요. 경쟁자의 시작을 돕는 게 아니라 막으려고(prevent) 만든 전략이에요.", "ignore(무시하다)가 틀려요. 경쟁자를 무시하는 게 아니라 시작하지 못하게 막는 전략이에요."], "evid": [{"n": 1, "hl": ["prevent a rival from starting"]}, {"n": 2, "hl": ["discourage rivals from doing the same"]}], "swaps": [["prevent", "block", "방지하다 → 막다"], ["discourage", "weaken", "단념시키다 → 약하게 하다"], ["a rival from starting", "a rival's start", "경쟁자가 시작하는 것을 → 경쟁자의 시작"]], "swapnote": "prevent(방지하다)는 block(막다)이나 stop(멈추다)으로, discourage(단념시키다)는 weaken(약하게 하다)이나 deter(막다)로 바뀌어 나올 수 있어요.", "use": [{"w": "block", "ex": "A wall can block the wind.", "ko": "벽은 바람을 막을 수 있다.", "wk": "막다", "hk": "막을"}, {"w": "weaken", "ex": "Bad news can weaken your hope.", "ko": "나쁜 소식은 희망을 약하게 할 수 있다.", "wk": "약하게 하다", "hk": "약하게 할"}], "flow": "본문 1번에서 선매 행위의 뜻(경쟁자가 시작하지 못하게 막기)을 말하고, 2번에서 In some case(어떤 경우)로 좁혀 말뿐인 공표도 선매가 될 수 있다고 이어요.", "jd": [["Pre-emption is a strategy meant to [[block]]", "선매 행위는 [[막으려는]] 전략이다"], ["a rival's start of some activity,", "경쟁자가 어떤 활동을 시작하는 것을,"], ["and even a simple announcement of intent", "그리고 단순한 의도의 공표조차"], ["may [[weaken]] rivals' wish to do the same.", "경쟁자들이 같은 일을 하려는 마음을 [[약하게 할]] 수 있다."]], "fc": [["본문 1번", "선매 행위 = 경쟁자 막기", "경쟁자가 특정 활동을 시작하지 못하게 만든 전략이에요."], ["본문 2번", "말뿐인 공표도 선매", "같은 행동을 하려는 경쟁자의 마음을 꺾어요."], ["정답 포인트", "{{prevent|막다}} = {{block|막다}}, {{discourage|단념시키다}} = {{weaken|약하게 하다}}", "본문 단어가 뜻이 비슷한 말로 바뀌어 나와요."]], "evid_full": [{"en": "Pre-emption means that a strategy is designed to prevent a rival from starting some particular activity.", "ko": "선매 행위는 어떤 전략이 경쟁자로 하여금 어떤 특정한 활동을 시작하는 것을 방지하기 위해 만들어진다는 것을 의미한다.", "hl": ["prevent a rival from starting"], "hlko": ["경쟁자로 하여금 어떤 특정한 활동을 시작하는 것을 방지하기"], "n": 1}, {"en": "In some case a pre-emptive move may simply be an announcement of some intent that might discourage rivals from doing the same.", "ko": "어떤 경우에는 선제적 조치는 단순히 경쟁자들이 같은 행동을 하는 것을 단념시킬 수 있는 어떤 의도의 공표일 수도 있다.", "hl": ["discourage rivals from doing the same"], "hlko": ["경쟁자들이 같은 행동을 하는 것을 단념시킬"], "n": 2}]}, {"id": 2, "summary": "Because the right (A) can bring greater rewards, a firm may (B) its advertising around a newcomer's market launch to make it harder for the newcomer's ads to influence buyers.", "ko": "올바른 <b>(A) 시점</b>이 더 큰 이득을 가져올 수 있어서, 기업은 새 업체가 시장에 나오는 전후로 광고를 <b>(B) 늘려</b> 그 업체의 광고가 구매자들에게 영향을 주기 더 어렵게 만들 수 있다.", "opts": [["moment", "reduce"], ["price", "reduce"], ["price", "increase"], ["moment", "increase"], ["location", "copy"]], "optko": ["시점 – 줄이다", "가격 – 줄이다", "가격 – 늘리다", "시점 – 늘리다", "위치 – 따라 하다"], "ans": 3, "wrong": ["reduce(줄이다)가 틀려요. 경쟁자가 들어올 때 광고를 줄이는 게 아니라 늘려요(up-weight).", "둘 다 틀려요. 본문이 중요하다고 한 건 가격이 아니라 타이밍(시점)이고, 광고도 줄이지 않고 늘려요.", "price(가격)가 틀려요. 본문은 가격이 아니라 타이밍(시점)이 중요하다고 해요.", null, "둘 다 틀려요. 위치 이야기는 본문에 없고, 광고를 따라 하는 게 아니라 늘리는 거예요."], "evid": [{"n": 3, "hl": ["timing is sometimes very important", "much more rewarding"]}, {"n": 4, "hl": ["up-weighting advertising"]}, {"n": 5, "hl": ["make it more difficult"]}], "swaps": [["timing", "moment", "타이밍 → 시점"], ["up-weighting", "increase", "가중치를 높이다 → 늘리다"], ["entrant", "newcomer", "진입자 → 새로 들어온 업체"], ["difficult", "h   var q=Qs[cur],a=PR.a[q.id],done=a!==undefined;curQ=q.id;
  var h='<div class="top"><button class="back" data-a="home">목록</button><button class="back" data-a="sw">바꿔 말하기</button><span class="cnt">'+(cur+1)+' / '+Qs.length+'</span></div>';
  if(!done)h+='<p class="hint">문장의 밑줄 단어를 누르면 뜻이 나와요. 보기를 누르면 답을 골라요.</p>';
  h+='<div class="card sum">'+sumHtml(q,done)+'</div><div class="opts">';
  q.opts.forEach(function(o,i){
    var cls='opt'+(done?' lock':'');
    if(done){if(i===q.ans)cls+=' right';else if(i===a)cls+=' mine'}
    h+='<div class="'+cls+'"'+(done?'':' data-a="pick" data-v="'+i+'"')+'><span class="num">'+CN[i]+'</span><span class="ot">'+(done?words(o[0]):esc(o[0]))+'<span class="dash">–</span>'+(done?words(o[1]):esc(o[1]))+'</span>'+(done&&i===q.ans?'<span class="st">정답</span>':(done&&i===a?'<span class="st">내 답</span>':''))+'</div>';
  });
  h+='</div>';
  if(done){
    var ok=a===q.ans;
    h+='<div id="exp"><div class="card"><div class="row"><span class="badge">'+(cur+1)+'번</span><span class="chip">정답 '+CN[q.ans]+'</span><span class="msg '+(ok?'o':'x')+'">'+(ok?'맞았어요':'내 답 '+CN[a])+'</span></div>';
    h+='</div><div class="card"><p class="lb">직독직해 (끊어서 앞에서부터 이해해요)</p>'+jdHtml(q)+'<details><summary>자연스러운 해석 보기</summary><div class="ko">'+q.ko.replace(/\((A|B)\)\s*/g,'')+'</div></details></div>';
    h+='<div class="card"><p class="lb">보기 뜻</p><ul class="opl">';
    q.opts.forEach(function(o,i){h+='<li class="'+(i===q.ans?'a':'')+'">'+CN[i]+' '+(i===q.ans?'<mark>'+words(o[0])+' – '+words(o[1])+'</mark>':words(o[0])+' – '+words(o[1]))+'<span class="k">'+(i===q.ans?'<mark>'+esc(q.optko[i])+'</mark>  ← 정답':esc(q.optko[i]))+'</span></li>'});
    h+='</ul></div>';
    h+='<div class="card"><p class="lb">정답의 근거 · 본문 '+q.evid_full.map(function(e){return e.n+'번'}).join(', ')+'</p>';
    q.evid_full.forEach(function(e){h+='<div class="ev"><div class="en">'+rich(e.en,e.hl)+'</div><div class="kk">'+richKo(e.ko,e.hlko)+'</div></div>'});
    h+='</div>';
    h+='<div class="card"><p class="lb">이 단어, 이렇게 바뀌었어요</p>';
    q.swaps.forEach(function(s){h+='<div class="swap"><span class="a">'+words(s[0])+'</span><span class="arr">→</span><span class="b">'+words(s[1])+'</span><span class="ds">'+esc(s[2])+(/\s/.test(s[0])||/\s/.test(s[1])?'':' '+sayBtn(s[0],'듣기')+' '+sayBtn(s[1],'듣기'))+'</span></div>'});
    h+='<div class="note">'+esc(q.swapnote)+'</div></div>';
    h+='<div class="card"><p class="lb">쓰임 익히기</p><div class="use">';
    q.use.forEach(function(u){h+='<div class="u"><div class="uw">'+esc(u.w)+'<small class="uwk">('+esc(u.wk)+')</small></div><div class="ue">'+useEx(u)+'</div><div class="uk">'+esc(u.ko).replace(esc(u.hk),'<mark>'+esc(u.hk)+'</mark>')+'</div></div>'});
    h+='</div></div>';
    h+='<div class="card"><p class="lb">기억할 흐름</p><div class="fc">'+q.fc.map(function(c,i){return (i?'<div class="ar">▼</div>':'')+'<div class="c'+(i===q.fc.length-1?' last':'')+'"><span class="tg">'+esc(c[0])+'</span><div class="hd">'+mk(c[1])+'</div><div class="sb2">'+mk(c[2])+'</div></div>'}).join('')+'</div></div>';
    h+='<div class="card"><details><summary>다른 보기는 왜 아닐까요</summary><ul style="padding:0;margin:6px 0 0">';
    q.wrong.forEach(function(w,i){if(w)h+='<li><b>'+CN[i]+'</b> '+hlp(w)+'</li>'});
    h+='</ul></details></div>';
    h+='<button class="btn pri" data-a="next">'+(cur<Qs.length-1?'다음 문제':'결과 보기')+'</button></div>';
  }
  return h;
}
function vRes(){
  var h='<div class="top"><button class="back" data-a="home">목록</button><button class="back" data-a="sw">바꿔 말하기</button></div><h1>'+Qs.length+'문제 중 '+okCount()+'문제 맞았어요</h1>';
  h+='<div class="nums">';
  Qs.forEach(function(q,i){var a=PR.a[q.id];h+='<button class="nb '+(a===undefined?'':(a===q.ans?'o':'x'))+'" data-a="q" data-v="'+i+'">'+(i+1)+'</button>'});
  h+='</div><p class="sub">단어노트에 '+nNotes()+'개가 쌓였어요.</p>';
  h+='<button class="btn pri" data-a="notes">단어노트 보기</button><button class="btn sec" data-a="reset">문제 다시 풀기</button><button class="btn sec" data-a="home">목록으로</button>';
  return h;
}
function sortedNotes(){return Object.keys(NOTES).map(function(k){return NOTES[k]}).sort(function(a,b){return b.t-a.t})}
function vNotes(){
  var L=sortedNotes();
  var h='<div class="top"><button class="back" data-a="home">목록</button><button class="back" data-a="sw">바꿔 말하기</button><span class="cnt">단어노트 '+L.length+'개</span></div>';
  if(!L.length)return h+'<div class="empty">밑줄 단어를 누르면 여기에 쌓여요.</div>';
  h+='<div class="card"><ul class="wl">';
  L.forEach(function(n){h+='<li><span class="lw">'+esc(n.l)+'</span><span class="lm">'+esc(n.k)+'</span>'+(n.c>1?'<span class="lc">'+n.c+'번</span>':'')+'<button class="rmw" data-a="rmnote" data-v="'+esc(n.l.toLowerCase())+'">빼기</button></li>'});
  return h+'</ul></div>';
}
function sk(id){return id.indexOf('sw:')===0?id.slice(3):id}
function wrongOf(id){var r=SRV[sk(id).toLowerCase()];return r&&r.c>0?r.c:0}
function flagList(){return Object.keys(SRV).map(function(k){return SRV[k]}).filter(function(r){return r.c>0}).sort(function(a,b){return b.c-a.c})}
function nFlag(){return flagList().length}
function srvLoad(){
  try{WN.list().then(function(r){
    if(!r||!r.ok||!r.items)return;SRV={};
    r.items.forEach(function(i){if(String(i.src||'').indexOf(SRC)>=0)SRV[String(i.w).toLowerCase()]={w:i.w,m:i.m,c:i.c||0}});
    if(view==='home'||view==='chk'||view==='sw')render();
  })}catch(e){}
}
function vChk(){
  var L=flagList();
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">선생님 확인 단어 '+L.length+'개</span></div>';
  if(!L.length)return h+'<div class="empty">틀린 단어가 없어요.</div>';
  h+='<p class="hint">선생님이 물어봤을 때 틀린 단어예요. 먼저 뜻을 떠올려 보고 확인해 보세요. 오답노트(H로드맵)에도 같이 있어요.</p><div class="card">';
  L.forEach(function(r){
    var id=r.w.toLowerCase(),o=swOpen['c'+id];
    h+='<div class="swr"><div class="swq"><span class="sa">'+esc(r.w)+'</span><span class="sb">'+(o?'<em>'+esc(r.m)+'</em>':'뜻은?')+'</span><small class="flag">'+r.c+'번 틀림</small><button data-a="rv" data-v="c'+esc(id)+'">'+(o?'가리기':'확인')+'</button></div></div>';
  });
  return h+'</div><a class="btn sec" style="display:block;text-align:center;text-decoration:none" href="https://nolbada.github.io/via/wn/">H로드맵 오답노트 열기</a>';
}
function sceneLine(t,cur){return esc(t).replace(/\[\[(\w+)\|([^\]]+)\]\]/g,function(m,w,k){return '<b class="wc'+(w.toLowerCase()===String(cur).toLowerCase()?' me':'')+'">'+w+'</b>('+k+')'})}
function vSw(){
  var L=swList(),sc={};
  (DATA.scenes||[]).forEach(function(c){(c.line.match(/\[\[\w+\|/g)||[]).forEach(function(m){sc[m.slice(2,-1).toLowerCase()]=c})});
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">바꿔 말하기 '+L.length+'개</span></div>';
  h+='<p class="hint">왼쪽 단어가 요약문에서 어떤 말로 바뀔까요? <b>소리 내어 말해 본 뒤</b> 확인을 눌러요.</p>';
  h+='<div class="tabs"><button data-a="rvall" data-v="open">모두 열기</button><button data-a="rvall" data-v="hide">모두 가리기</button></div><div class="card">';
  L.forEach(function(s){
    var o=swOpen[s.id],c=sc[s.form.toLowerCase()],on=swD['s'+s.id],fl=wrongOf(s.id);
    h+='<div class="swr"><div class="swq"><span class="qn">'+s.sq+'번</span><span class="sa">'+words(s.a)+(fl?'<small class="flag">'+fl+'번 틀림</small>':'')+'</span><span class="sb">'+(o?'<em>'+words(s.b)+'</em>'+esc(s.k):'→ ?')+'</span>'+sayBtn(s.a,'듣기')+(o?sayBtn(s.b,'정답 듣기'):'')+'<button data-a="rv" data-v="'+esc(s.id)+'">'+(o?'가리기':'확인')+'</button></div>';
    if(c)h+='<button class="acc2" data-a="dt" data-v="s'+esc(s.id)+'">'+esc(c.tag)+' 줄거리<span>'+(on?'접기':'펼치기')+'</span></button>'+(on?'<div class="story">'+sceneLine(c.line,s.form)+'</div>':'');
    h+='</div>';
  });
  return h+'</div><p class="sumline">시험에서는 본문 단어가 뜻이 같은 다른 단어로 바뀌어 나와요.</p>';
}
/* 자동 새로고침(기록 연동)이 일어나도 보던 문제로 되돌린다 */
try{var sv=JSON.parse(sessionStorage.getItem('vhyv')||'null');if(sv&&sv.p===location.pathname&&Date.now()-sv.t<600000&&sv.v&&sv.v!=='home'){view=sv.v;cur=sv.c||0;try{history.pushState({v:view},'');histPushed=true}catch(e){}}}catch(e){}
render();srvLoad();window.addEventListener('pageshow',srvLoad);
</script>
</body>
</html>
