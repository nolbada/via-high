<script>
var DATA={"meta": {"sch": "jusung-go2", "src": "jusung-go2/mock/sx-data.js", "pidx": 12, "lesson": "23년 11월 30번", "title": "", "label": "", "page": "yoyak-2311-30"}, "scenes": [{"tag": "본문 1~2번", "ns": [1, 2], "line": "새 능력이 있어도 엿보는 것을 [[justify|정당화]]할 수는 없다.", "en": ["Technology changes how individuals and societies understand the concept of privacy.", "The fact that someone has a new ability to access information or watch the actions of another does not justify doing so."], "kos": ["기술은 개인들과 사회가 사생활의 개념을 이해하는 방식을 변화시킨다.", "누군가가 정보에 접근하거나 다른 사람의 행동을 관찰하는 새로운 능력을 갖추고 있다는 사실은 그렇게 하는 것을 정당화하지 않는다."]}, {"tag": "본문 3번", "ns": [3], "line": "오히려 사생활 보호가 [[expanded|확장되어야]] 한다.", "en": ["Rather, advances in technology require citizens and policy makers to consider how privacy protections should be expanded."], "kos": ["오히려, 기술의 발전은 시민들과 정책 입안자들이 어떻게 사생활 보호가 확장되어야 하는지 고려할 것을 요구한다."]}, {"tag": "본문 4번", "ns": [4], "line": "카메라가 나오자 새 법을 두고 [[struggled|씨름했다]].", "en": ["For example, when cameras first became available for commercial and private use, nations and citizens struggled over whether new laws should be enacted to protect individuals from being photographed without their permission."], "kos": ["예를 들어, 카메라들이 상업적이고 사적인 용도로 처음 사용될 수 있게 되었을 때, 국가들과 시민들은 그들의 허가 없이 개인들이 사진에 찍히는 것으로부터 보호하기 위해 새로운 법들이 제정되어야 하는지에 대해 투쟁했다."]}, {"tag": "본문 5번", "ns": [5], "line": "그 결과 사적 공간과 공적 공간의 [[distinction|구별]]이 재확인됐다.", "en": ["The reconsideration of privacy brought about by this new technology re-affirmed a distinction between private and public spaces."], "kos": ["이 새로운 기술이 가져온 사생활에 대한 재고는 사적 및 공적 공간의 구별을 재확인했다."]}, {"tag": "본문 6번", "ns": [6], "line": "공공장소에 들어가면 보이는 것에 [[consent|동의]]한 것으로 본다.", "en": ["It was determined by most cultures that people automatically gave consent to being seen ― and thus recorded ― once they voluntarily stepped into a public space."], "kos": ["일단 사람들이 자발적으로 공공장소에 발을 들여놓으면, 보여지고, 따라서 녹화되는 것에 자동적으로 동의하는 것으로 대부분의 문화에서 결정되었다."]}, {"tag": "본문 7번", "ns": [7], "line": "감시 카메라가 불편해도 대부분은 [[adjusted|순응했다]].", "en": ["Although some people might be uncomfortable with the spread of surveillance cameras, citizens in most cultures have adjusted to the fact that giving up the right not to be observed in these circumstances causes less harm to the community than failing to have surveillance."], "kos": ["일부 사람들은 감시 카메라들의 확산을 불편하게 여길지도 모르지만, 대부분의 문화권에 있는 시민들은 이러한 상황에서 관찰되지 않을 권리를 포기하는 것이 감시받지 못하는 것보다 지역 사회에 더 적은 해를 끼친다는 사실에 순응해 왔다."]}], "story": [{"a": "justify", "form": "justify", "n": 2, "sq": 1, "sum": "is not a [[reason]] for doing so", "hook": "능력이 있다고 해서 정당화되진 않는다는 justify(정당화하다) → 요약문에서는 reason(이유)로 바뀌었어요.", "b": "reason", "k": "정당화하다 → 이유(가 되다)", "en": "The fact that someone has a new ability to access information or watch the actions of another does not justify doing so.", "ko": "누군가가 정보에 접근하거나 다른 사람의 행동을 관찰하는 새로운 능력을 갖추고 있다는 사실은 그렇게 하는 것을 정당화하지 않는다."}, {"a": "expand", "form": "expanded", "n": 3, "sq": 1, "sum": "calls for [[broader]] privacy protection", "hook": "사생활 보호가 확장되어야 한다는 expanded(확장된) → 요약문에서는 broader(더 넓은)로 바뀌었어요.", "b": "broader", "k": "확장하다 → 더 넓은", "en": "Rather, advances in technology require citizens and policy makers to consider how privacy protections should be expanded.", "ko": "오히려, 기술의 발전은 시민들과 정책 입안자들이 어떻게 사생활 보호가 확장되어야 하는지 고려할 것을 요구한다."}, {"a": "struggle", "form": "struggled", "n": 4, "sq": 2, "sum": "societies [[debated]] over whether", "hook": "새 법을 두고 씨름했다는 struggled(씨름했다) → 요약문에서는 debated(논쟁했다)로 바뀌었어요.", "b": "debate", "k": "씨름하다 → 논쟁하다", "en": "For example, when cameras first became available for commercial and private use, nations and citizens struggled over whether new laws should be enacted to protect individuals from being photographed without their permission.", "ko": "예를 들어, 카메라들이 상업적이고 사적인 용도로 처음 사용될 수 있게 되었을 때, 국가들과 시민들은 그들의 허가 없이 개인들이 사진에 찍히는 것으로부터 보호하기 위해 새로운 법들이 제정되어야 하는지에 대해 투쟁했다."}, {"a": "distinction", "form": "distinction", "n": 5, "sq": 2, "sum": "confirmed the [[line]] between", "hook": "사적·공적 공간의 구별을 가리키는 distinction → 요약문에서는 line(경계선)으로 바뀌었어요.", "b": "line", "k": "구별 → 경계선", "en": "The reconsideration of privacy brought about by this new technology re-affirmed a distinction between private and public spaces.", "ko": "이 새로운 기술이 가져온 사생활에 대한 재고는 사적 및 공적 공간의 구별을 재확인했다."}, {"a": "consent", "form": "consent", "n": 6, "sq": 3, "sum": "as [[agreement]] to being watched", "hook": "보이는 것에 자동으로 동의한다는 consent(동의) → 요약문에서는 agreement(동의)로 바뀌었어요.", "b": "agreement", "k": "동의 → 동의(합의)", "en": "It was determined by most cultures that people automatically gave consent to being seen ― and thus recorded ― once they voluntarily stepped into a public space.", "ko": "일단 사람들이 자발적으로 공공장소에 발을 들여놓으면, 보여지고, 따라서 녹화되는 것에 자동적으로 동의하는 것으로 대부분의 문화에서 결정되었다."}, {"a": "adjust", "form": "adjusted", "n": 7, "sq": 3, "sum": "have [[adapted]] to them", "hook": "감시 카메라 상황에 순응해 왔다는 adjusted → 요약문에서는 adapted(적응했다)로 바뀌었어요.", "b": "adapt", "k": "순응하다 → 적응하다", "en": "Although some people might be uncomfortable with the spread of surveillance cameras, citizens in most cultures have adjusted to the fact that giving up the right not to be observed in these circumstances causes less harm to the community than failing to have surveillance.", "ko": "일부 사람들은 감시 카메라들의 확산을 불편하게 여길지도 모르지만, 대부분의 문화권에 있는 시민들은 이러한 상황에서 관찰되지 않을 권리를 포기하는 것이 감시받지 못하는 것보다 지역 사회에 더 적은 해를 끼친다는 사실에 순응해 왔다."}], "passage": [{"n": 1, "en": "Technology changes how individuals and societies understand the concept of privacy.", "ko": "기술은 개인들과 사회가 사생활의 개념을 이해하는 방식을 변화시킨다."}, {"n": 2, "en": "The fact that someone has a new ability to access information or watch the actions of another does not justify doing so.", "ko": "누군가가 정보에 접근하거나 다른 사람의 행동을 관찰하는 새로운 능력을 갖추고 있다는 사실은 그렇게 하는 것을 정당화하지 않는다."}, {"n": 3, "en": "Rather, advances in technology require citizens and policy makers to consider how privacy protections should be expanded.", "ko": "오히려, 기술의 발전은 시민들과 정책 입안자들이 어떻게 사생활 보호가 확장되어야 하는지 고려할 것을 요구한다."}, {"n": 4, "en": "For example, when cameras first became available for commercial and private use, nations and citizens struggled over whether new laws should be enacted to protect individuals from being photographed without their permission.", "ko": "예를 들어, 카메라들이 상업적이고 사적인 용도로 처음 사용될 수 있게 되었을 때, 국가들과 시민들은 그들의 허가 없이 개인들이 사진에 찍히는 것으로부터 보호하기 위해 새로운 법들이 제정되어야 하는지에 대해 투쟁했다."}, {"n": 5, "en": "The reconsideration of privacy brought about by this new technology re-affirmed a distinction between private and public spaces.", "ko": "이 새로운 기술이 가져온 사생활에 대한 재고는 사적 및 공적 공간의 구별을 재확인했다."}, {"n": 6, "en": "It was determined by most cultures that people automatically gave consent to being seen ― and thus recorded ― once they voluntarily stepped into a public space.", "ko": "일단 사람들이 자발적으로 공공장소에 발을 들여놓으면, 보여지고, 따라서 녹화되는 것에 자동적으로 동의하는 것으로 대부분의 문화에서 결정되었다."}, {"n": 7, "en": "Although some people might be uncomfortable with the spread of surveillance cameras, citizens in most cultures have adjusted to the fact that giving up the right not to be observed in these circumstances causes less harm to the community than failing to have surveillance.", "ko": "일부 사람들은 감시 카메라들의 확산을 불편하게 여길지도 모르지만, 대부분의 문화권에 있는 시민들은 이러한 상황에서 관찰되지 않을 권리를 포기하는 것이 감시받지 못하는 것보다 지역 사회에 더 적은 해를 끼친다는 사실에 순응해 왔다."}], "questions": [{"id": 1, "summary": "Technology changes how people see privacy: having a new ability to watch others is not a (A) for doing so, so progress calls for (B) privacy protection.", "ko": "기술은 사람들이 사생활을 보는 방식을 바꾼다. 다른 사람을 지켜볼 새로운 능력이 있다는 것은 그렇게 할 <b>(A) 이유</b>가 되지 않으므로, 발전은 <b>(B) 더 넓은</b> 사생활 보호를 요구한다.", "opts": [["reason", "narrower"], ["penalty", "broader"], ["penalty", "narrower"], ["reason", "broader"], ["limit", "weaker"]], "optko": ["이유 – 더 좁은", "처벌 – 더 넓은", "처벌 – 더 좁은", "이유 – 더 넓은", "한계 – 더 약한"], "ans": 3, "wrong": ["narrower(더 좁은)가 틀려요. 본문은 사생활 보호가 확장되어야(expanded) 한다고 해요.", "penalty(처벌)가 틀려요. 본문은 새로운 능력이 그렇게 할 정당한 이유가 되지 않는다는 말이에요.", "둘 다 틀려요. 처벌 이야기는 없고, 보호는 좁아지는 게 아니라 넓어져야 해요.", null, "둘 다 틀려요. 한계 이야기는 없고, 보호는 약해지는 게 아니라 더 넓어져야 해요."], "evid": [{"n": 1, "hl": ["how individuals and societies understand the concept of privacy"]}, {"n": 2, "hl": ["does not justify doing so"]}, {"n": 3, "hl": ["how privacy protections should be expanded"]}], "swaps": [["justify", "reason", "정당화하다 → 이유(가 되다)"], ["expand", "broader", "확장하다 → 더 넓은"], ["ability", "power", "능력 → 힘"]], "swapnote": "'정당화하지 않는다(does not justify)'는 '이유가 되지 않는다(is not a reason)'로, expanded(확장된)는 broader(더 넓은)로 바뀌었어요.", "use": [{"w": "reason", "ex": "Tell me the reason for your choice.", "ko": "네 선택의 이유를 말해 줘.", "wk": "이유", "hk": "이유"}, {"w": "broader", "ex": "A broader road helps buses pass.", "ko": "더 넓은 길은 버스가 지나가는 데 도움이 된다.", "wk": "더 넓은", "hk": "넓은"}], "flow": "본문 1번에서 기술이 사생활의 개념을 바꾼다고 하고 → 2번에서 새 능력이 있다고 해서 엿보는 게 정당해지진 않는다고 말하고 → 3번에서 Rather(오히려) 보호를 넓혀야 한다고 해요.", "jd": [["Technology changes how people see privacy:", "기술은 사람들이 사생활을 보는 방식을 바꾼다:"], ["having a new ability to watch others", "다른 사람들을 지켜볼 새로운 능력을 갖는 것은"], ["is not a [[reason]] for doing so,", "그렇게 할 [[이유]]가 되지 않는다,"], ["so progress calls for [[broader]] privacy protection.", "그래서 발전은 [[더 넓은]] 사생활 보호를 요구한다."]], "fc": [["본문 1~2번", "새 능력이 있어도 엿보는 건 정당하지 않다", "할 수 있다고 해서 해도 되는 건 아니에요."], ["본문 3번", "Rather: 보호를 넓혀야 한다", "오히려 법과 보호를 늘려야 해요."], ["정답 포인트", "{{justify|정당화하다}} → {{reason|이유}}, {{expanded|확장된}} = {{broader|더 넓은}}", "본문 표현을 쉬운 말로 바꿨어요."]], "evid_full": [{"en": "Technology changes how individuals and societies understand the concept of privacy.", "ko": "기술은 개인들과 사회가 사생활의 개념을 이해하는 방식을 변화시킨다.", "hl": ["how individuals and societies understand the concept of privacy"], "hlko": ["개인들과 사회가 사생활의 개념을 이해하는 방식"], "n": 1}, {"en": "The fact that someone has a new ability to access information or watch the actions of another does not justify doing so.", "ko": "누군가가 정보에 접근하거나 다른 사람의 행동을 관찰하는 새로운 능력을 갖추고 있다는 사실은 그렇게 하는 것을 정당화하지 않는다.", "hl": ["does not justify doing so"], "hlko": ["그렇게 하는 것을 정당화하지 않는다"], "n": 2}, {"en": "Rather, advances in technology require citizens and policy makers to consider how privacy protections should be expanded.", "ko": "오히려, 기술의 발전은 시민들과 정책 입안자들이 어떻게 사생활 보호가 확장되어야 하는지 고려할 것을 요구한다.", "hl": ["how privacy protections should be expanded"], "hlko": ["어떻게 사생활 보호가 확장되어야 하는지"], "n": 3}]}, {"id": 2, "summary": "When cameras first became widely available, societies (A) over whether to make new laws against taking photos without permission, and this process (B) the line between private and public spaces.", "ko": "카메라가 처음 널리 쓰일 수 있게 되었을 때, 사회는 허락 없이 사진을 찍는 것에 대한 새 법을 만들어야 하는지 <b>(A) 논쟁했고</b>, 이 과정은 사적 공간과 공적 공간의 구분을 <b>(B) 확인해 주었다</b>.", "opts": [["debated", "erased"], ["debated", "confirmed"], ["agreed", "confirmed"], ["agreed", "erased"], ["agreed", "blurred"]], "optko": ["논쟁했다 – 지웠다", "논쟁했다 – 확인해 주었다", "의견이 일치했다 – 확인해 주었다", "의견이 일치했다 – 지웠다", "의견이 일치했다 – 흐릿하게 했다"], "ans": 1, "wrong": ["erased(지웠다)가 틀려요. 이 과정은 사적·공적 공간의 구별을 다시 확인해(re-affirmed) 줬어요.", null, "agreed(의견이 일치했다)가 틀려요. 국가와 시민은 의견이 일치한 게 아니라 법을 두고 씨름했어요(struggled).", "둘 다 틀려요. 처음엔 의견이 갈렸고, 구분은 지워지지 않고 확인됐어요.", "둘 다 틀려요. 의견이 갈렸고, 구분은 흐려지지 않고 오히려 분명해졌어요."], "evid": [{"n": 4, "hl": ["struggled over whether new laws should be enacted"]}, {"n": 5, "hl": ["re-affirmed a distinction between private and public spaces"]}], "swaps": [["struggle", "debate", "씨름하다 → 논쟁하다"], ["distinction", "line", "구별 → 경계선"], ["reaffirm", "confirm", "재확인하다 → 확인하다"]], "swapnote": "struggled over(~를 두고 씨름했다)는 debated(논쟁했다)로, re-affirmed(재확인했다)는 confirmed(확인해 주었다)로, distinction(구별)은 line(경계선)으로 바뀌었어요.", "use": [{"w": "debate", "ex": "The class will debate the new rule.", "ko": "학급은 새 규칙을 두고 논쟁할 것이다.", "wk": "논쟁하다", "hk": "논쟁할"}, {"w": "confirm", "ex": "Please confirm your seat by email.", "ko": "이메일로 좌석을 확인해 주세요.", "wk": "확인하다", "hk": "확인해"}], "flow": "본문 4번에서 카메라가 처음 나왔을 때 사진 찍히는 것을 막는 법을 만들지 두고 다퉜다고 하고 → 5번에서 그 재고가 사적 공간과 공적 공간의 구별을 다시 확인해 줬다고 이어요.", "jd": [["When cameras first became widely available,", "카메라가 처음 널리 쓰일 수 있게 되었을 때,"], ["societies [[debated]] over whether to make new la   else if(act==='reset'){PR={a:{}};jset(K_PROG,PR);go('home')}
  else if(act==='filt'){filt=v;render()}
  else if(act==='chk'){go('chk')}
  else if(act==='sw'){go('sw')}
  else if(act==='rvall'){var o=v==='open';swList().forEach(function(s){if(o){swOpen[s.id]=true;pushSw(s.id)}else delete swOpen[s.id]});render()}
  else if(act==='star'){if(STAR[v])delete STAR[v];else STAR[v]=1;jset(K_STAR,STAR);render()}
  else if(act==='staronly'){swStarOnly=!swStarOnly;render()}
  else if(act==='dt'){swD[v]=!swD[v];render()}
  else if(act==='rv'){swOpen[v]=!swOpen[v];if(swOpen[v])pushSw(v);render()}
  else if(act==='mean'){var m=document.getElementById('m_'+v);if(m)m.style.display=m.style.display==='block'?'none':'block'}
});
function pick(i){
  var q=Qs[cur];if(PR.a[q.id]!==undefined)return;
  PR.a[q.id]=i;jset(K_PROG,PR);recordYy(q,i);render();
}
/* 점수 기록: vhy:<학교> = {<페이지>:{<문제>:{n:푼 횟수,w:틀린 횟수,k:마지막 정답(1/0),c:고른 번호,t:시각}}} -> REC 로 자동 연동(선생님 화면) */
function recordYy(q,i){
  try{
    var K='vhy:'+SCH,P=location.pathname.split('/').slice(-2).join('/'),Y=jget(K,{});
    var pg=Y[P]||(Y[P]={}),e=pg[q.id]||(pg[q.id]={n:0,w:0});
    e.n=(e.n||0)+1;if(i!==q.ans)e.w=(e.w||0)+1;e.k=(i===q.ans?1:0);e.c=i;e.t=Date.now();
    jset(K,Y);
  }catch(x){}
  /* 바꿔 말하기 단어는 푼 즉시 모두 선생님 질문 목록에 올린다 */
  try{swList().forEach(function(s){pushSw(s.id)})}catch(x){}
}


function jdHtml(q){
  var h='<div class="sl">';
  q.jd.forEach(function(c){
    var en=c[0].split(/(\[\[.*?\]\])/).map(function(s){var m=s.match(/^\[\[(.*)\]\]$/);return m?'<mark>'+words(m[1])+'</mark>':words(s)}).join('');
    var ko=c[1].split(/(\[\[.*?\]\])/).map(function(s){var m=s.match(/^\[\[(.*)\]\]$/);return m?'<mark>'+esc(m[1])+'</mark>':esc(s)}).join('');
    h+='<div class="r"><b>'+en+'</b><span>'+ko+'</span></div>';
  });
  return h+'</div>';
}
function pushSw(id){return; /* 바꿔 말하기 단어는 선생님 질문 목록에 따로 올리지 않는다: 학생 목록 = 선생님 열람 목록 */
  if(String(id).indexOf('c')===0&&!/^sw:/.test(id))return;
  var s=swList().filter(function(x){return x.id===id})[0];if(!s||PUSHED[id])return;
  PUSHED[id]=1;jset('vhvs:'+SCH,PUSHED);
  try{WN.add([{w:s.a,m:s.k+' → '+s.b,src:SRC,how:'바꿔 말하기',ask:true}])}catch(e){}
}
function swList(){
  var L=(DATA.story||[]).map(function(s){return {a:s.a,form:s.form,b:s.b,k:s.k,id:'sw:'+s.a.toLowerCase(),n:s.n,sq:s.sq,sum:s.sum,hook:s.hook,en:s.en,ko:s.ko}}),seen={};
  L.forEach(function(s){seen[s.a.toLowerCase()]=1});
  /* 모든 문제의 '이 단어, 이렇게 바뀌었어요' 단어도 빠짐없이 바꿔 말하기 연습에 넣는다 */
  Qs.forEach(function(q,qi){(q.swaps||[]).forEach(function(w){var k=String(w[0]).toLowerCase();if(seen[k])return;seen[k]=1;L.push({a:w[0],form:w[0],b:w[1],k:w[2],id:'sw:'+k,n:0,sq:qi+1,sum:'',hook:'',en:'',ko:''})})});
  return L.map(function(s,i){return {s:s,i:i}}).sort(function(x,y){return (x.s.sq-y.s.sq)||(x.i-y.i)}).map(function(x){return x.s});
}
function hlWord(t,w){return t.split(new RegExp('(\\b'+w+'\\b)','i')).map(function(x,i){return i%2?'<mark>'+esc(x)+'</mark>':words(x)}).join('')}
function hlSum(t){return t.split(/(\[\[.*?\]\])/).map(function(x){var m=x.match(/^\[\[(.*)\]\]$/);return m?'<mark>'+words(m[1])+'</mark>':words(x)}).join('')}
var swOpen={},swD={},swStarOnly=false;
var K_STAR='vhsw:'+SCH+':'+(function(){try{return LS.getItem('wn_name')||''}catch(e){return ''}})();
var STAR=jget(K_STAR,{});
/* 화면 */
function render(){
  var h='';
  if(view==='home')h=vHome();else if(view==='q')h=vQ();else if(view==='res')h=vRes();else if(view==='notes')h=vNotes();else if(view==='sw')h=vSw();else if(view==='chk')h=vChk();else h=vHome();
  var y=window.pageYOffset||0;
  $('app').innerHTML=h;
  if(!window.__goTop)window.scrollTo(0,y);
}
function yyLine(){
  try{var Y=jget('vhy:'+SCH,{}),pg=Y[location.pathname.split('/').slice(-2).join('/')]||{},n=0,r=0,w=0;
    Qs.forEach(function(q){var e=pg[q.id];if(e&&e.n){n++;if(e.k)r++;w+=e.w||0}});
    if(!n)return '';
    return '<p class="sub">내 기록: '+n+'문제 중 '+r+'문제 정답'+(w?' · 틀린 횟수 '+w+'번':'')+'</p>';
  }catch(x){return ''}
}
function vHome(){
  var d=doneCount(),f=firstOpen();
  var h='<a class="tag" href="../yoyak.html" style="text-decoration:none">목록</a><h1>'+DATA.meta.lesson+' '+esc(DATA.meta.title)+'</h1><p class="sub">요약문 연습 '+DATA.meta.label+' · '+Qs.length+'문제</p><div class="nums">';
  Qs.forEach(function(q,i){var a=PR.a[q.id];h+='<button class="nb '+(a===undefined?'':(a===q.ans?'o':'x'))+'" data-a="q" data-v="'+i+'">'+(i+1)+'</button>'});
  h+='</div>';
  h+=yyLine();
  h+='<button class="btn pri" data-a="resume">'+(d===0?'시작하기':(f<0?'결과 보기':'이어서 풀기 ('+d+' / '+Qs.length+')'))+'</button>';
  h+='<button class="btn sec" data-a="sw">바꿔 말하기 연습</button>'+(nFlag()?'<button class="btn flagbtn" data-a="chk">선생님 확인 단어 '+nFlag()+'개</button>':'');
  h+='<div class="foot"><button data-a="reset">문제 다시 풀기</button></div>';
  return h;
}
function vQ(){
  var q=Qs[cur],a=PR.a[q.id],done=a!==undefined;curQ=q.id;
  var h='<div class="top"><button class="back" data-a="home">목록</button><button class="back" data-a="sw">바꿔 말하기</button><span class="cnt">'+(cur+1)+' / '+Qs.length+'</span></div>';
  if(!done)h+='<p class="hint">문장의 밑줄 단어를 누르면 뜻이 나와요. 보기를 누르면 답을 골라요.</p>';
  h+='<div class="card sum">'+sumHtml(q,done)+'</div><div class="opts">';
  q.opts.forEach(function(o,i){
    var cls='opt'+(done?' lock':'');
    if(done){if(i===q.ans)cls+=' right';else if(i===a)cls+=' mine'}
    h+='<div class="'+cls+'"'+(done?'':' data-a="pick" data-v="'+i+'"')+'><span class="num">'+CN[i]+'</span><span class="ot">'+(done?words(o[0]):esc(o[0]))+'<span class="dash">–</span>'+(done?words(o[1]):esc(o[1]))+'</span>'+(done&&i===q.ans?'<span class="st">정답</span>':(done&&i===a?'<span class="st">내 답</span>':''))+'</div>';
  });
  h+='</div>';
  if(done){
    var ok=a===q.ans;
    h+='<div id="exp"><div class="card"><div class="row"><span class="badge">'+(cur+1)+'번</span><span class="chip">정답 '+CN[q.ans]+'</span><span class="msg '+(ok?'o':'x')+'">'+(ok?'맞았어요':'내 답 '+CN[a])+'</span></div>';
    h+='</div><div class="card"><p class="lb">직독직해 (끊어서 앞에서부터 이해해요)</p>'+jdHtml(q)+'<details><summary>자연스러운 해석 보기</summary><div class="ko">'+q.ko.replace(/\((A|B)\)\s*/g,'')+'</div></details></div>';
    h+='<div class="card"><p class="lb">보기 뜻</p><ul class="opl">';
    q.opts.forEach(function(o,i){h+='<li class="'+(i===q.ans?'a':'')+'">'+CN[i]+' '+(i===q.ans?'<mark>'+words(o[0])+' – '+words(o[1])+'</mark>':words(o[0])+' – '+words(o[1]))+'<span class="k">'+(i===q.ans?'<mark>'+esc(q.optko[i])+'</mark>  ← 정답':esc(q.optko[i]))+'</span></li>'});
    h+='</ul></div>';
    h+='<div class="card"><p class="lb">정답의 근거 · 본문 '+(EVK[String(q.id)]||q.evid_full.map(function(e){return [e.n]})).map(function(e){return e[0]+'번'}).join(', ')+'</p>';
    var EVS=EVK[String(q.id)];
    if(EVS)EVS.forEach(function(e){h+='<div class="ev"><div class="kk"><b class="evn">'+e[0]+'번</b> '+e[1]+'</div></div>'});
    else q.evid_full.forEach(function(e){h+='<div class="ev"><div class="en">'+rich(e.en,e.hl)+'</div><div class="kk">'+richKo(e.ko,e.hlko)+'</div></div>'});
    h+='</div>';
    h+='<div class="card"><p class="lb">이 단어, 이렇게 바뀌었어요</p>';
    q.swaps.forEach(function(s){h+='<div class="swap"><span class="a">'+words(s[0])+'</span><span class="arr">→</span><span class="b">'+words(s[1])+'</span><span class="ds">'+esc(s[2])+(/\s/.test(s[0])||/\s/.test(s[1])?'':' '+sayBtn(s[0],'듣기')+' '+sayBtn(s[1],'듣기'))+'</span></div>'});
    h+='<div class="note">'+esc(q.swapnote)+'</div></div>';
    h+='<div class="card"><p class="lb">쓰임 익히기</p><div class="use">';
    q.use.forEach(function(u){h+='<div class="u"><div class="uw">'+esc(u.w)+'<small class="uwk">('+esc(u.wk)+')</small></div><div class="ue">'+useEx(u)+'</div><div class="uk">'+esc(u.ko).replace(esc(u.hk),'<mark>'+esc(u.hk)+'</mark>')+'</div></div>'});
    h+='</div></div>';
    h+='<div class="card"><p class="lb">기억할 흐름</p><div class="fc">'+q.fc.map(function(c,i){return (i?'<div class="ar">▼</div>':'')+'<div class="c'+(i===q.fc.length-1?' last':'')+'"><span class="tg">'+esc(c[0])+'</span><div class="hd">'+mk(c[1])+'</div><div class="sb2">'+mk(c[2])+'</div></div>'}).join('')+'</div></div>';
    h+='<div class="card"><details><summary>다른 보기는 왜 아닐까요</summary><ul style="padding:0;margin:6px 0 0">';
    q.wrong.forEach(function(w,i){if(w)h+='<li><b>'+CN[i]+'</b> '+hlp(w)+'</li>'});
    h+='</ul></details></div>';
    h+='<button class="btn pri" data-a="next">'+(cur<Qs.length-1?'다음 문제':'결과 보기')+'</button><button class="btn sec" data-a="home">목록으로</button></div>';
  }
  return h;
}
function vRes(){
  var h='<div class="top"><button class="back" data-a="home">목록</button><button class="back" data-a="sw">바꿔 말하기</button></div><h1>'+Qs.length+'문제 중 '+okCount()+'문제 맞았어요</h1>';
  h+='<div class="nums">';
  Qs.forEach(function(q,i){var a=PR.a[q.id];h+='<button class="nb '+(a===undefined?'':(a===q.ans?'o':'x'))+'" data-a="q" data-v="'+i+'">'+(i+1)+'</button>'});
  h+='</div>';
  h+='<button class="btn pri" data-a="sw">바꿔 말하기 보기</button><button class="btn sec" data-a="reset">문제 다시 풀기</button><button class="btn sec" data-a="home">목록으로</button>';
  return h;
}
function sortedNotes(){return Object.keys(NOTES).map(function(k){return NOTES[k]}).sort(function(a,b){return b.t-a.t})}
function vNotes(){
  var L=sortedNotes();
  var h='<div class="top"><button class="back" data-a="home">목록</button><button class="back" data-a="sw">바꿔 말하기</button><span class="cnt">단어노트 '+L.length+'개</span></div>';
  if(!L.length)return h+'<div class="empty">밑줄 단어를 누르면 여기에 쌓여요.</div>';
  h+='<div class="card"><ul class="wl">';
  L.forEach(function(n){h+='<li><span class="lw">'+esc(n.l)+'</span><span class="lm">'+esc(n.k)+'</span>'+(n.c>1?'<span class="lc">'+n.c+'번</span>':'')+'<button class="rmw" data-a="rmnote" data-v="'+esc(n.l.toLowerCase())+'">빼기</button></li>'});
  return h+'</ul></div>';
}
function sk(id){return id.indexOf('sw:')===0?id.slice(3):id}
function wrongOf(id){var r=SRV[sk(id).toLowerCase()];return r&&r.c>0?r.c:0}
function flagList(){return Object.keys(SRV).map(function(k){return SRV[k]}).filter(function(r){return r.c>0}).sort(function(a,b){return b.c-a.c})}
function nFlag(){return flagList().length}
function srvLoad(){
  try{WN.list().then(function(r){
    if(!r||!r.ok||!r.items)return;SRV={};
    r.items.forEach(function(i){if(String(i.src||'').indexOf(SRC)>=0)SRV[String(i.w).toLowerCase()]={w:i.w,m:i.m,c:i.c||0}});
    if(view==='home'||view==='chk'||view==='sw')render();
  })}catch(e){}
}
function vChk(){
  var L=flagList();
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">선생님 확인 단어 '+L.length+'개</span></div>';
  if(!L.length)return h+'<div class="empty">틀린 단어가 없어요.</div>';
  h+='<p class="hint">선생님이 물어봤을 때 틀린 단어예요. 먼저 뜻을 떠올려 보고 확인해 보세요. 오답노트(H로드맵)에도 같이 있어요.</p><div class="card">';
  L.forEach(function(r){
    var id=r.w.toLowerCase(),o=swOpen['c'+id];
    h+='<div class="swr"><div class="swq"><span class="sa">'+esc(r.w)+'</span><span class="sb">'+(o?'<em>'+esc(r.m)+'</em>':'뜻은?')+'</span><small class="flag">'+r.c+'번 틀림</small><button data-a="rv" data-v="c'+esc(id)+'">'+(o?'가리기':'확인')+'</button></div></div>';
  });
  return h+'</div><a class="btn sec" style="display:block;text-align:center;text-decoration:none" href="https://nolbada.github.io/via/wn/">H로드맵 오답노트 열기</a>';
}
function sceneLine(t,cur){return esc(t).replace(/\[\[(\w+)\|([^\]]+)\]\]/g,function(m,w,k){return '<b class="wc'+(w.toLowerCase()===String(cur).toLowerCase()?' me':'')+'">'+w+'</b>('+k+')'})}

var EVK={};
var REL={};
function relBox(s){
  var r=REL[String(s.a).toLowerCase()];if(!r)return '';
  var it=[{t:s.b,k:String(s.k).split(' → ')[1]||'',c:'k'}];
  r.s.forEach(function(x){it.push({t:x[0],k:x[1],c:'s'})});
  r.a.forEach(function(x){it.push({t:x[0],k:x[1],c:'a'})});
  var P={1:[[50,80]],2:[[26,78],[74,78]],3:[[16,70],[50,86],[84,70]],4:[[14,62],[36,86],[64,86],[86,62]],5:[[12,56],[28,86],[50,92],[72,86],[88,56]]}[it.length],svg='',nd='';
  it.forEach(function(x,j){
    svg+='<line x1="50%" y1="26%" x2="'+P[j][0]+'%" y2="'+(P[j][1]-7)+'%" stroke="'+(x.c=='a'?'#c0392b':'#2f5d50')+'" stroke-width="2"/>';
    nd+='<div class="rn '+x.c+'" style="left:'+P[j][0]+'%;top:'+P[j][1]+'%">'+esc(x.t)+(x.k?'<small>'+esc(x.k)+'</small>':'')+'</div>';
  });
  var left=String(s.k).split(' → ')[0];
  var h='<div class="relx"><div class="rmap"><svg>'+svg+'</svg><div class="rn c" style="left:50%;top:26%">'+esc(s.a)+'<small>'+esc(left)+'</small></div>'+nd+'</div>'
   +'<div class="rleg"><span><i style="border-color:#2f5d50"></i>바꿔 쓸 수 있는 말</span>'+(r.a.length?'<span><i style="border-color:#c0392b"></i>반대말</span>':'')+'</div>'
   +'<div class="pit"><div><em>본문</em>'+r.bj+'</div><div><em>요약문</em><b>'+esc(s.b)+'</b>('+esc(String(s.k).split(' → ')[1]||'')+')로 바뀜</div>'+(r.tr?'<div class="tp"><em>함정</em>'+esc(r.tr)+'</div>':'')+'</div></div>';
  return h;
}
function vSw(){
  var L=swList(),sc={};
  (DATA.scenes||[]).forEach(function(c){(c.line.match(/\[\[\w+\|/g)||[]).forEach(function(m){sc[m.slice(2,-1).toLowerCase()]=c})});
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">바꿔 말하기 '+L.length+'개</span></div>';
  h+='<p class="hint">왼쪽 단어가 요약문에서 어떤 말로 바뀔까요? <b>소리 내어 말해 본 뒤</b> 확인을 눌러요.</p>';
  h+='<div class="tabs"><button data-a="rvall" data-v="open">모두 열기</button><button data-a="rvall" data-v="hide">모두 가리기</button><button data-a="staronly" class="'+(swStarOnly?'on':'')+'">별표만 '+Object.keys(STAR).length+'</button></div><div class="card">';
  if(swStarOnly)L=L.filter(function(s){return STAR[s.id]});
  if(!L.length)h+='<div class="empty">별표 친 단어가 없어요. 안 외워지는 단어에 별표를 눌러 두세요.</div>';
  L.forEach(function(s){
    var o=swOpen[s.id],c=sc[s.form.toLowerCase()],on=swD['s'+s.id],fl=wrongOf(s.id);
    h+='<div class="swr"><div class="swq"><span class="qn">'+s.sq+'번</span><span class="sa">'+words(s.a)+(fl?'<small class="flag">'+fl+'번 틀림</small>':'')+'</span><span class="sb">'+(o?'<em>'+words(s.b)+'</em>'+esc(s.k):'→ ?')+'</span>'+sayBtn(s.a,'듣기')+(o?sayBtn(s.b,'정답 듣기'):'')+'<button data-a="rv" data-v="'+esc(s.id)+'">'+(o?'가리기':'확인')+'</button><button data-a="star" data-v="'+esc(s.id)+'" class="stb'+(STAR[s.id]?' on':'')+'">별표</button></div>';
    if(o)h+=relBox(s);else if(REL[String(s.a).toLowerCase()]){var rr=REL[String(s.a).toLowerCase()];h+='<div class="hch">유 '+(1+rr.s.length)+(rr.a.length?' · 반 '+rr.a.length:'')+'</div>'}
    if(c&&!REL[String(s.a).toLowerCase()])h+='<button class="acc2" data-a="dt" data-v="s'+esc(s.id)+'">'+esc(c.tag)+' 줄거리<span>'+(on?'접기':'펼치기')+'</span></button>'+(on?'<div class="story">'+sceneLine(c.line,s.form)+'</div>':'');
    h+='</div>';
  });
  return h+'</div><p class="sumline">시험에서는 본문 단어가 뜻이 같은 다른 단어로 바뀌어 나와요.</p><button class="btn sec" data-a="home">목록으로</button>';
}
/* 자동 새로고침(기록 연동)이 일어나도 보던 문제로 되돌린다 */
try{var sv=JSON.parse(sessionStorage.getItem('vhyv')||'null');if(sv&&sv.p===location.pathname&&Date.now()-sv.t<600000&&sv.v&&sv.v!=='home'){view=sv.v;cur=sv.c||0;try{history.pushState({v:view},'');histPushed=true}catch(e){}}}catch(e){}
render();srvLoad();window.addEventListener('pageshow',srvLoad);
</script>
