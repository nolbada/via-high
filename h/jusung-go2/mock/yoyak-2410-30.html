var DATA={"meta": {"sch": "jusung-go2", "src": "jusung-go2/mock/sx-data.js", "pidx": 29, "lesson": "24년 10월 30번", "title": "", "label": "", "page": "yoyak-2410-30"}, "scenes": [{"tag": "본문 1~2번", "ns": [1, 2], "line": "적도 근처 새는 일 년 내내 번식하고, 온대와 극지방은 번식기가 뚜렷하다.", "en": ["Near the equator, many species of bird breed all year round.", "But in temperate and polar regions, the breeding seasons of birds are often sharply defined."], "kos": ["적도 근처에서, 새의 많은 종들은 일 년 내내 번식한다.", "하지만 온대와 극지방에서는 새들의 번식기들이 대개 뚜렷하게 정해진다."]}, {"tag": "본문 3~4번", "ns": [3, 4], "line": "낮의 길이가 번식을 [[triggered|촉발하고]], 먹이가 [[peak|최고조]]일 때 새끼를 기른다.", "en": ["They are triggered mainly by changes in day length.", "If all goes well, the outcome is that birds raise their young when the food supply is at its peak."], "kos": ["그것들은 주로 낮의 길이의 변화에 의해 촉발된다.", "만약에 모든 것이 잘 진행된다면, 결과는 새들이 먹이 공급이 최고조에 이를 때 새끼들을 기르는 것이다."]}, {"tag": "본문 5~6번", "ns": [5, 6], "line": "다른 때엔 신체적으로 [[incapable|번식할 수 없다]]. 번식 기관이 [[shrinks|줄어들어]] 몸무게를 [[save|아낀다]].", "en": ["Most birds are not simply reluctant to breed at other times but they are also physically incapable of doing so.", "This is because their reproductive system shrinks, which helps flying birds save weight."], "kos": ["대부분의 새들은 다른 때에 번식하기를 단지 꺼리는 것뿐만 아니라 또한 신체적으로 그렇게 할 수 없는 것이다.", "이것은 왜냐하면 그들의 번식 기관이 줄어들기 때문이고, 이 사실은 나는 새들이 몸무게를 줄일 수 있도록 도와준다."]}, {"tag": "본문 7~9번", "ns": [7, 8, 9], "line": "사막 유목 새는 비가 오면 번식을 [[initiate|시작해서]] 갑작스러운 [[opportunity|기회]]를 살린다.", "en": ["The main exception to this rule are nomadic desert species.", "These can initiate their breeding cycle within days of rain.", "It’s for making the most of the sudden breeding opportunity."], "kos": ["유목성 사막 종은 이 규칙의 주요 예외이다.", "이들은 비가 온 지 며칠 안에 번식 주기를 시작할 수 있다.", "그것은 갑작스러운 번식 기회를 최대한으로 활용하기 위한 것이다."]}, {"tag": "본문 10~13번", "ns": [10, 11, 12, 13], "line": "종마다 번식기를 다르게 [[divide|나눈다]]. 바닷새는 한 무리, 명금은 여러 무리.", "en": ["Also, different species divide the breeding season up in different ways.", "Most seabirds raise a single brood.", "In warm regions, however, songbirds may raise several families in a few months.", "In an exceptionally good year, a pair of House Sparrows, a kind of songbird, can raise successive broods through a marathon reproductive effort."], "kos": ["또한, 다른 종들은 번식 기간을 다른 방식으로 나눈다.", "대부분의 바닷새들은 한 무리의 함께 태어난 새끼를 기른다.", "그러나, 따뜻한 지역에서는, 명금(鳴禽)들이 몇 달 안에 여러 자녀들을 기를 수도 있다.", "유난히 좋은 해에는 명금(鳴禽)의 한 종류인 참새 한 쌍은 마라톤과 같은 번식 노력을 통해 잇따라 태어난 여러 무리의 함께 태어난 새끼들을 기를 수 있다."]}], "story": [{"a": "trigger", "form": "triggered", "n": 3, "sq": 1, "sum": "is mostly [[prompted]] by changes in day length", "hook": "낮의 길이 변화가 번식을 촉발한다는 문장의 triggered(촉발하다) → 요약문에서는 prompted(일어나게 하다)로 바꿨어요.", "b": "prompt", "k": "촉발하다 → 일으키다", "en": "They are triggered mainly by changes in day length.", "ko": "그것들은 주로 낮의 길이의 변화에 의해 촉발된다."}, {"a": "peak", "form": "peak", "n": 4, "sq": 1, "sum": "when food is [[most abundant]]", "hook": "먹이 공급이 최고조일 때라는 문장의 peak(최고조) → 요약문에서는 most abundant(가장 풍부한)로 바꿨어요.", "b": "abundant", "k": "최고조 → 풍부한", "en": "If all goes well, the outcome is that birds raise their young when the food supply is at its peak.", "ko": "만약에 모든 것이 잘 진행된다면, 결과는 새들이 먹이 공급이 최고조에 이를 때 새끼들을 기르는 것이다."}, {"a": "incapable", "form": "incapable", "n": 5, "sq": 2, "sum": "are physically [[unable]] to breed", "hook": "신체적으로 번식할 수 없다는 문장의 incapable(할 수 없는) → 요약문에서는 unable(하지 못하는)로 바꿨어요.", "b": "unable", "k": "~할 수 없는 → ~하지 못하는", "en": "Most birds are not simply reluctant to breed at other times but they are also physically incapable of doing so.", "ko": "대부분의 새들은 다른 때에 번식하기를 단지 꺼리는 것뿐만 아니라 또한 신체적으로 그렇게 할 수 없는 것이다."}, {"a": "shrink", "form": "shrinks", "n": 6, "sq": 2, "sum": "reproductive organs [[become smaller]]", "hook": "번식 기관이 줄어든다는 문장의 shrinks(줄어들다) → 요약문에서는 become smaller(작아지다)로 바꿨어요.", "b": "become smaller", "k": "줄어들다 → 작아지다", "en": "This is because their reproductive system shrinks, which helps flying birds save weight.", "ko": "이것은 왜냐하면 그들의 번식 기관이 줄어들기 때문이고, 이 사실은 나는 새들이 몸무게를 줄일 수 있도록 도와준다."}, {"a": "save", "form": "save", "n": 6, "sq": 2, "sum": "helps flying birds [[reduce]] body weight", "hook": "나는 새가 몸무게를 아낀다는 문장의 save(아끼다) → 요약문에서는 reduce(줄이다)로 바꿨어요.", "b": "reduce", "k": "아끼다 → 줄이다", "en": "This is because their reproductive system shrinks, which helps flying birds save weight.", "ko": "이것은 왜냐하면 그들의 번식 기관이 줄어들기 때문이고, 이 사실은 나는 새들이 몸무게를 줄일 수 있도록 도와준다."}, {"a": "initiate", "form": "initiate", "n": 8, "sq": 3, "sum": "can [[start]] breeding within days of rain", "hook": "비가 온 지 며칠 안에 번식 주기를 시작한다는 문장의 initiate(시작하다) → 요약문에서는 start(시작하다)로 바꿨어요.", "b": "start", "k": "시작하다 → 시작하다", "en": "These can initiate their breeding cycle within days of rain.", "ko": "이들은 비가 온 지 며칠 안에 번식 주기를 시작할 수 있다."}, {"a": "opportunity", "form": "opportunity", "n": 9, "sq": 3, "sum": "a sudden [[chance]]", "hook": "갑작스러운 번식 기회라는 문장의 opportunity(기회) → 요약문에서는 chance(기회)로 바꿨어요.", "b": "chance", "k": "기회 → 기회", "en": "It’s for making the most of the sudden breeding opportunity.", "ko": "그것은 갑작스러운 번식 기회를 최대한으로 활용하기 위한 것이다."}, {"a": "divide", "form": "divide", "n": 10, "sq": 3, "sum": "different species [[split]] the breeding season", "hook": "종마다 번식기를 나눈다는 문장의 divide(나누다) → 요약문에서는 split(쪼개다)로 바꿨어요.", "b": "split", "k": "나누다 → 쪼개다", "en": "Also, different species divide the breeding season up in different ways.", "ko": "또한, 다른 종들은 번식 기간을 다른 방식으로 나눈다."}], "passage": [{"n": 1, "en": "Near the equator, many species of bird breed all year round.", "ko": "적도 근처에서, 새의 많은 종들은 일 년 내내 번식한다."}, {"n": 2, "en": "But in temperate and polar regions, the breeding seasons of birds are often sharply defined.", "ko": "하지만 온대와 극지방에서는 새들의 번식기들이 대개 뚜렷하게 정해진다."}, {"n": 3, "en": "They are triggered mainly by changes in day length.", "ko": "그것들은 주로 낮의 길이의 변화에 의해 촉발된다."}, {"n": 4, "en": "If all goes well, the outcome is that birds raise their young when the food supply is at its peak.", "ko": "만약에 모든 것이 잘 진행된다면, 결과는 새들이 먹이 공급이 최고조에 이를 때 새끼들을 기르는 것이다."}, {"n": 5, "en": "Most birds are not simply reluctant to breed at other times but they are also physically incapable of doing so.", "ko": "대부분의 새들은 다른 때에 번식하기를 단지 꺼리는 것뿐만 아니라 또한 신체적으로 그렇게 할 수 없는 것이다."}, {"n": 6, "en": "This is because their reproductive system shrinks, which helps flying birds save weight.", "ko": "이것은 왜냐하면 그들의 번식 기관이 줄어들기 때문이고, 이 사실은 나는 새들이 몸무게를 줄일 수 있도록 도와준다."}, {"n": 7, "en": "The main exception to this rule are nomadic desert species.", "ko": "유목성 사막 종은 이 규칙의 주요 예외이다."}, {"n": 8, "en": "These can initiate their breeding cycle within days of rain.", "ko": "이들은 비가 온 지 며칠 안에 번식 주기를 시작할 수 있다."}, {"n": 9, "en": "It’s for making the most of the sudden breeding opportunity.", "ko": "그것은 갑작스러운 번식 기회를 최대한으로 활용하기 위한 것이다."}, {"n": 10, "en": "Also, different species divide the breeding season up in different ways.", "ko": "또한, 다른 종들은 번식 기간을 다른 방식으로 나눈다."}, {"n": 11, "en": "Most seabirds raise a single brood.", "ko": "대부분의 바닷새들은 한 무리의 함께 태어난 새끼를 기른다."}, {"n": 12, "en": "In warm regions, however, songbirds may raise several families in a few months.", "ko": "그러나, 따뜻한 지역에서는, 명금(鳴禽)들이 몇 달 안에 여러 자녀들을 기를 수도 있다."}, {"n": 13, "en": "In an exceptionally good year, a pair of House Sparrows, a kind of songbird, can raise successive broods through a marathon reproductive effort.", "ko": "유난히 좋은 해에는 명금(鳴禽)의 한 종류인 참새 한 쌍은 마라톤과 같은 번식 노력을 통해 잇따라 태어난 여러 무리의 함께 태어난 새끼들을 기를 수 있다."}], "questions": [{"id": 1, "summary": "Birds near the equator breed all year, but elsewhere the breeding season is mostly (A) by changes in day length, so the young are raised when food is (B).", "ko": "적도 근처의 새는 일 년 내내 번식하지만, 다른 곳의 번식기는 낮의 길이 변화로 주로 <b>(A) 시작되어</b>, 새끼는 먹이가 <b>(B) 가장 풍부할</b> 때 길러진다.", "opts": [["prompted", "scarcest"], ["blocked", "most abundant"], ["prompted", "most abundant"], ["blocked", "scarcest"], ["ended", "hidden"]], "optko": ["유발되다 – 가장 부족한", "막히다 – 가장 풍부한", "유발되다 – 가장 풍부한", "막히다 – 가장 부족한", "끝나다 – 숨겨진"], "ans": 2, "wrong": ["scarcest(가장 부족한)가 틀려요. 새끼는 먹이 공급이 최고조일 때(at its peak) 길러져요.", "blocked(막힌)가 틀려요. 낮의 길이 변화는 번식을 막 function doneCount(){var n=0;Qs.forEach(function(q){if(PR.a[q.id]!==undefined)n++});return n}
function okCount(){var n=0;Qs.forEach(function(q){if(PR.a[q.id]===q.ans)n++});return n}
function hideSheet(){$('sheet').className=''}
var histPushed=false;
function go(v,i){
  if(i!==undefined)cur=i;
  if(v==='home'&&view!=='home'&&histPushed){histPushed=false;try{history.back();return}catch(e){}}
  if(v!=='home'&&view==='home'){try{history.pushState({v:v},'');histPushed=true}catch(e){}}
  view=v;try{if(v==='home')sessionStorage.removeItem('vhyv');else sessionStorage.setItem('vhyv',JSON.stringify({p:location.pathname,v:v,c:cur,t:Date.now()}))}catch(e){}
  hideSheet();window.__goTop=1;render();window.__goTop=0;window.scrollTo(0,0)
}
window.addEventListener('popstate',function(){histPushed=false;view='home';try{sessionStorage.removeItem('vhyv')}catch(e){}hideSheet();window.__goTop=1;render();window.__goTop=0;window.scrollTo(0,0)});
function sayBtn(){return ''}


/* 단어 누르기: 뜻을 보여 주고 단어노트에 자동으로 담는다 */
function tapWord(key){
  var g=G[key];if(!g)return;
  var lem=g[0],id=lem.toLowerCase();
  var n=NOTES[id]||{l:lem,k:g[1],c:0,t:0};
  n.c=(n.c||0)+1;n.t=Date.now();n.q=curQ;NOTES[id]=n;jset(K_NOTE,NOTES);
  if(!PUSHED['w:'+id]){PUSHED['w:'+id]=1;jset('vhvs:'+SCH,PUSHED);try{WN.add([{w:lem,m:g[1],src:SRC,how:'탭',ask:true}])}catch(e){}}
  $('sw').textContent=key.toLowerCase()===id?lem:key+'  →  '+lem;
  $('sl').textContent=g[1];
  $('sn').textContent='단어노트에 담았어요 (지금 '+nNotes()+'개)';
  $('sheet').className='on';
  document.querySelectorAll('.w[data-k]').forEach(function(e){var gg=G[e.getAttribute('data-k')];if(gg&&gg[0].toLowerCase()===id)e.classList.add('got')});
}
document.addEventListener('click',function(e){
  var w=e.target.closest&&e.target.closest('.w');
  if(w){e.stopPropagation();tapWord(w.getAttribute('data-k'));return}
  if(!(e.target.closest&&e.target.closest('#sheet')))hideSheet();
  var a=e.target.closest&&e.target.closest('[data-a]');
  if(!a)return;
  var act=a.getAttribute('data-a'),v=a.getAttribute('data-v');
  if(act==='home')go('home');
  else if(act==='q')go('q',+v);
  else if(act==='pick')pick(+v);
  else if(act==='next'){if(cur<Qs.length-1)go('q',cur+1);else go('res')}
  else if(act==='res')go('res');
  else if(act==='notes')go('notes');
  else if(act==='resume'){var f=firstOpen();if(f<0)go('res');else go('q',f)}
  else if(act==='reset'){PR={a:{}};jset(K_PROG,PR);go('home')}
  else if(act==='filt'){filt=v;render()}
  else if(act==='chk'){go('chk')}
  else if(act==='sw'){go('sw')}
  else if(act==='rvall'){var o=v==='open';swList().forEach(function(s){if(o){swOpen[s.id]=true;pushSw(s.id)}else delete swOpen[s.id]});render()}
  else if(act==='dt'){swD[v]=!swD[v];render()}
  else if(act==='rv'){swOpen[v]=!swOpen[v];if(swOpen[v])pushSw(v);render()}
  else if(act==='mean'){var m=document.getElementById('m_'+v);if(m)m.style.display=m.style.display==='block'?'none':'block'}
});
function pick(i){
  var q=Qs[cur];if(PR.a[q.id]!==undefined)return;
  PR.a[q.id]=i;jset(K_PROG,PR);recordYy(q,i);render();
}
/* 점수 기록: vhy:<학교> = {<페이지>:{<문제>:{n:푼 횟수,w:틀린 횟수,k:마지막 정답(1/0),c:고른 번호,t:시각}}} -> REC 로 자동 연동(선생님 화면) */
function recordYy(q,i){
  try{
    var K='vhy:'+SCH,P=location.pathname.split('/').slice(-2).join('/'),Y=jget(K,{});
    var pg=Y[P]||(Y[P]={}),e=pg[q.id]||(pg[q.id]={n:0,w:0});
    e.n=(e.n||0)+1;if(i!==q.ans)e.w=(e.w||0)+1;e.k=(i===q.ans?1:0);e.c=i;e.t=Date.now();
    jset(K,Y);
  }catch(x){}
  /* 바꿔 말하기 단어는 푼 즉시 모두 선생님 질문 목록에 올린다 */
  try{swList().forEach(function(s){pushSw(s.id)})}catch(x){}
}



function jdHtml(q){
  var h='<div class="sl">';
  q.jd.forEach(function(c){
    var en=c[0].split(/(\[\[.*?\]\])/).map(function(s){var m=s.match(/^\[\[(.*)\]\]$/);return m?'<mark>'+words(m[1])+'</mark>':words(s)}).join('');
    var ko=c[1].split(/(\[\[.*?\]\])/).map(function(s){var m=s.match(/^\[\[(.*)\]\]$/);return m?'<mark>'+esc(m[1])+'</mark>':esc(s)}).join('');
    h+='<div class="r"><b>'+en+'</b><span>'+ko+'</span></div>';
  });
  return h+'</div>';
}
function pushSw(id){
  if(String(id).indexOf('c')===0&&!/^sw:/.test(id))return;
  var s=swList().filter(function(x){return x.id===id})[0];if(!s||PUSHED[id])return;
  PUSHED[id]=1;jset('vhvs:'+SCH,PUSHED);
  try{WN.add([{w:s.a,m:s.k+' → '+s.b,src:SRC,how:'바꿔 말하기',ask:true}])}catch(e){}
}
function swList(){return (DATA.story||[]).map(function(s){return {a:s.a,form:s.form,b:s.b,k:s.k,id:'sw:'+s.a.toLowerCase(),n:s.n,sq:s.sq,sum:s.sum,hook:s.hook,en:s.en,ko:s.ko}})}
function hlWord(t,w){return t.split(new RegExp('(\\b'+w+'\\b)','i')).map(function(x,i){return i%2?'<mark>'+esc(x)+'</mark>':words(x)}).join('')}
function hlSum(t){return t.split(/(\[\[.*?\]\])/).map(function(x){var m=x.match(/^\[\[(.*)\]\]$/);return m?'<mark>'+words(m[1])+'</mark>':words(x)}).join('')}
var swOpen={},swD={};
/* 화면 */
function render(){
  var h='';
  if(view==='home')h=vHome();else if(view==='q')h=vQ();else if(view==='res')h=vRes();else if(view==='notes')h=vNotes();else if(view==='sw')h=vSw();else if(view==='chk')h=vChk();else h=vHome();
  var y=window.pageYOffset||0;
  $('app').innerHTML=h;
  if(!window.__goTop)window.scrollTo(0,y);
}
function yyLine(){
  try{var Y=jget('vhy:'+SCH,{}),pg=Y[location.pathname.split('/').slice(-2).join('/')]||{},n=0,r=0,w=0;
    Qs.forEach(function(q){var e=pg[q.id];if(e&&e.n){n++;if(e.k)r++;w+=e.w||0}});
    if(!n)return '';
    return '<p class="sub">내 기록: '+n+'문제 중 '+r+'문제 정답'+(w?' · 틀린 횟수 '+w+'번':'')+'</p>';
  }catch(x){return ''}
}
function vHome(){
  var d=doneCount(),f=firstOpen();
  var h='<a class="tag" href="../index.html" style="text-decoration:none">목록</a><h1>'+DATA.meta.lesson+' '+esc(DATA.meta.title)+'</h1><p class="sub">요약문 연습 '+DATA.meta.label+' · '+Qs.length+'문제</p><div class="nums">';
  Qs.forEach(function(q,i){var a=PR.a[q.id];h+='<button class="nb '+(a===undefined?'':(a===q.ans?'o':'x'))+'" data-a="q" data-v="'+i+'">'+(i+1)+'</button>'});
  h+='</div>';
  h+=yyLine();
  h+='<button class="btn pri" data-a="resume">'+(d===0?'시작하기':(f<0?'결과 보기':'이어서 풀기 ('+d+' / '+Qs.length+')'))+'</button>';
  h+='<button class="btn sec" data-a="notes">단어노트 '+nNotes()+'개</button><button class="btn sec" data-a="sw">바꿔 말하기 연습</button>'+(nFlag()?'<button class="btn flagbtn" data-a="chk">선생님 확인 단어 '+nFlag()+'개</button>':'');
  h+='<div class="foot"><button data-a="reset">문제 다시 풀기</button></div>';
  return h;
}
function vQ(){
  var q=Qs[cur],a=PR.a[q.id],done=a!==undefined;curQ=q.id;
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">'+(cur+1)+' / '+Qs.length+'</span></div>';
  if(!done)h+='<p class="hint">밑줄 단어를 누르면 뜻이 나와요. 번호를 누르면 답을 골라요.</p>';
  h+='<div class="card sum">'+sumHtml(q,done)+'</div><div class="opts">';
  q.opts.forEach(function(o,i){
    var cls='opt'+(done?' lock':'');
    if(done){if(i===q.ans)cls+=' right';else if(i===a)cls+=' mine'}
    h+='<div class="'+cls+'"'+(done?'':' data-a="pick" data-v="'+i+'"')+'><span class="num">'+CN[i]+'</span><span class="ot">'+words(o[0])+'<span class="dash">–</span>'+words(o[1])+'</span>'+(done&&i===q.ans?'<span class="st">정답</span>':(done&&i===a?'<span class="st">내 답</span>':''))+'</div>';
  });
  h+='</div>';
  if(done){
    var ok=a===q.ans;
    h+='<div id="exp"><div class="card"><div class="row"><span class="badge">'+(cur+1)+'번</span><span class="chip">정답 '+CN[q.ans]+'</span><span class="msg '+(ok?'o':'x')+'">'+(ok?'맞았어요':'내 답 '+CN[a])+'</span></div>';
    h+='</div><div class="card"><p class="lb">직독직해 (끊어서 앞에서부터 이해해요)</p>'+jdHtml(q)+'<details><summary>자연스러운 해석 보기</summary><div class="ko">'+q.ko.replace(/\((A|B)\)\s*/g,'')+'</div></details></div>';
    h+='<div class="card"><p class="lb">보기 뜻</p><ul class="opl">';
    q.opts.forEach(function(o,i){h+='<li class="'+(i===q.ans?'a':'')+'">'+CN[i]+' '+(i===q.ans?'<mark>'+words(o[0])+' – '+words(o[1])+'</mark>':words(o[0])+' – '+words(o[1]))+'<span class="k">'+(i===q.ans?'<mark>'+esc(q.optko[i])+'</mark>  ← 정답':esc(q.optko[i]))+'</span></li>'});
    h+='</ul></div>';
    h+='<div class="card"><p class="lb">정답의 근거 · 본문 '+q.evid_full.map(function(e){return e.n+'번'}).join(', ')+'</p>';
    q.evid_full.forEach(function(e){h+='<div class="ev"><div class="en">'+rich(e.en,e.hl)+'</div><div class="kk">'+richKo(e.ko,e.hlko)+'</div></div>'});
    h+='</div>';
    h+='<div class="card"><p class="lb">이 단어, 이렇게 바뀌었어요</p>';
    q.swaps.forEach(function(s){h+='<div class="swap"><span class="a">'+words(s[0])+'</span><span class="arr">→</span><span class="b">'+words(s[1])+'</span><span class="ds">'+esc(s[2])+(/\s/.test(s[0])||/\s/.test(s[1])?'':' '+sayBtn(s[0],'듣기')+' '+sayBtn(s[1],'듣기'))+'</span></div>'});
    h+='<div class="note">'+esc(q.swapnote)+'</div></div>';
    h+='<div class="card"><p class="lb">쓰임 익히기</p><div class="use">';
    q.use.forEach(function(u){h+='<div class="u"><div class="uw">'+esc(u.w)+'<small class="uwk">('+esc(u.wk)+')</small></div><div class="ue">'+useEx(u)+'</div><div class="uk">'+esc(u.ko).replace(esc(u.hk),'<mark>'+esc(u.hk)+'</mark>')+'</div></div>'});
    h+='</div></div>';
    h+='<div class="card"><p class="lb">기억할 흐름</p><div class="fc">'+q.fc.map(function(c,i){return (i?'<div class="ar">▼</div>':'')+'<div class="c'+(i===q.fc.length-1?' last':'')+'"><span class="tg">'+esc(c[0])+'</span><div class="hd">'+mk(c[1])+'</div><div class="sb2">'+mk(c[2])+'</div></div>'}).join('')+'</div></div>';
    h+='<div class="card"><details><summary>다른 보기는 왜 아닐까요</summary><ul style="padding:0;margin:6px 0 0">';
    q.wrong.forEach(function(w,i){if(w)h+='<li><b>'+CN[i]+'</b> '+hlp(w)+'</li>'});
    h+='</ul></details></div>';
    h+='<button class="btn pri" data-a="next">'+(cur<Qs.length-1?'다음 문제':'결과 보기')+'</button></div>';
  }
  return h;
}
function vRes(){
  var h='<div class="top"><button class="back" data-a="home">목록</button></div><h1>'+Qs.length+'문제 중 '+okCount()+'문제 맞았어요</h1>';
  h+='<div class="nums">';
  Qs.forEach(function(q,i){var a=PR.a[q.id];h+='<button class="nb '+(a===undefined?'':(a===q.ans?'o':'x'))+'" data-a="q" data-v="'+i+'">'+(i+1)+'</button>'});
  h+='</div><p class="sub">단어노트에 '+nNotes()+'개가 쌓였어요.</p>';
  h+='<button class="btn pri" data-a="notes">단어노트 보기</button><button class="btn sec" data-a="reset">문제 다시 풀기</button><button class="btn sec" data-a="home">목록으로</button>';
  return h;
}
function sortedNotes(){return Object.keys(NOTES).map(function(k){return NOTES[k]}).sort(function(a,b){return b.t-a.t})}
function vNotes(){
  var L=sortedNotes();
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">단어노트 '+L.length+'개</span></div>';
  if(!L.length)return h+'<div class="empty">밑줄 단어를 누르면 여기에 쌓여요.</div>';
  h+='<div class="card"><ul class="wl">';
  L.forEach(function(n){h+='<li><span class="lw">'+esc(n.l)+'</span><span class="lm">'+esc(n.k)+'</span>'+(n.c>1?'<span class="lc">'+n.c+'번</span>':'')+'</li>'});
  return h+'</ul></div>';
}
function sk(id){return id.indexOf('sw:')===0?id.slice(3):id}
function wrongOf(id){var r=SRV[sk(id).toLowerCase()];return r&&r.c>0?r.c:0}
function flagList(){return Object.keys(SRV).map(function(k){return SRV[k]}).filter(function(r){return r.c>0}).sort(function(a,b){return b.c-a.c})}
function nFlag(){return flagList().length}
function srvLoad(){
  try{WN.list().then(function(r){
    if(!r||!r.ok||!r.items)return;SRV={};
    r.items.forEach(function(i){if(String(i.src||'').indexOf(SRC)>=0)SRV[String(i.w).toLowerCase()]={w:i.w,m:i.m,c:i.c||0}});
    if(view==='home'||view==='chk'||view==='sw')render();
  })}catch(e){}
}
function vChk(){
  var L=flagList();
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">선생님 확인 단어 '+L.length+'개</span></div>';
  if(!L.length)return h+'<div class="empty">틀린 단어가 없어요.</div>';
  h+='<p class="hint">선생님이 물어봤을 때 틀린 단어예요. 먼저 뜻을 떠올려 보고 확인해 보세요. 오답노트(H로드맵)에도 같이 있어요.</p><div class="card">';
  L.forEach(function(r){
    var id=r.w.toLowerCase(),o=swOpen['c'+id];
    h+='<div class="swr"><div class="swq"><span class="sa">'+esc(r.w)+'</span><span class="sb">'+(o?'<em>'+esc(r.m)+'</em>':'뜻은?')+'</span><small class="flag">'+r.c+'번 틀림</small><button data-a="rv" data-v="c'+esc(id)+'">'+(o?'가리기':'확인')+'</button></div></div>';
  });
  return h+'</div><a class="btn sec" style="display:block;text-align:center;text-decoration:none" href="https://nolbada.github.io/via/wn/">H로드맵 오답노트 열기</a>';
}
function sceneLine(t,cur){return esc(t).replace(/\[\[(\w+)\|([^\]]+)\]\]/g,function(m,w,k){return '<b class="wc'+(w.toLowerCase()===String(cur).toLowerCase()?' me':'')+'">'+w+'</b>('+k+')'})}
function vSw(){
  var L=swList(),sc={};
  (DATA.scenes||[]).forEach(function(c){(c.line.match(/\[\[\w+\|/g)||[]).forEach(function(m){sc[m.slice(2,-1).toLowerCase()]=c})});
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">바꿔 말하기 '+L.length+'개</span></div>';
  h+='<p class="hint">왼쪽 단어가 요약문에서 어떤 말로 바뀔까요? <b>소리 내어 말해 본 뒤</b> 확인을 눌러요.</p>';
  h+='<div class="tabs"><button data-a="rvall" data-v="open">모두 열기</button><button data-a="rvall" data-v="hide">모두 가리기</button></div><div class="card">';
  L.forEach(function(s){
    var o=swOpen[s.id],c=sc[s.form.toLowerCase()],on=swD['s'+s.id],fl=wrongOf(s.id);
    h+='<div class="swr"><div class="swq"><span class="sa">'+words(s.a)+(fl?'<small class="flag">'+fl+'번 틀림</small>':'')+'</span><span class="sb">'+(o?'<em>'+words(s.b)+'</em>'+esc(s.k):'→ ?')+'</span>'+sayBtn(s.a,'듣기')+(o?sayBtn(s.b,'정답 듣기'):'')+'<button data-a="rv" data-v="'+esc(s.id)+'">'+(o?'가리기':'확인')+'</button></div>';
    if(c)h+='<button class="acc2" data-a="dt" data-v="s'+esc(s.id)+'">'+esc(c.tag)+' 줄거리<span>'+(on?'접기':'펼치기')+'</span></button>'+(on?'<div class="story">'+sceneLine(c.line,s.form)+'</div>':'');
    h+='</div>';
  });
  return h+'</div><p class="sumline">시험에서는 본문 단어가 뜻이 같은 다른 단어로 바뀌어 나와요.</p>';
}
/* 자동 새로고침(기록 연동)이 일어나도 보던 문제로 되돌린다 */
try{var sv=JSON.parse(sessionStorage.getItem('vhyv')||'null');if(sv&&sv.p===location.pathname&&Date.now()-sv.t<600000&&sv.v&&sv.v!=='home'){view=sv.v;cur=sv.c||0;try{history.pushState({v:view},'');histPushed=true}catch(e){}}}catch(e){}
render();srvLoad();window.addEventListener('pageshow',srvLoad);
</script>
</body>
</html>
