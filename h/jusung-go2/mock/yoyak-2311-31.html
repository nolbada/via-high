<script>
var DATA={"meta": {"sch": "jusung-go2", "src": "jusung-go2/mock/sx-data.js", "pidx": 13, "lesson": "23년 11월 31번", "title": "", "label": "", "page": "yoyak-2311-31"}, "scenes": [{"tag": "본문 1~2번", "ns": [1, 2], "line": "불가능해 보이는 우연은 [[irrational|비이성적으로]] 보인다. 하지만 기적의 [[origin|기원]]은 우리의 [[ignorance|무지]]에 있다.", "en": ["Coincidence that is statistically impossible seems to us like an irrational event, and some define it as a miracle.", "But, as Montaigne has said, “the origin of a miracle is in our ignorance, at the level of our knowledge of nature, and not in nature itself.”"], "kos": ["통계적으로 불가능한 우연은 우리에게 비이성적인 사건처럼 보이고, 어떤 이들은 그것을 기적으로 정의한다.", "그러나, Montaigne가 말했듯이, “기적의 기원은 자연 그 자체가 아니라 자연에 대한 우리의 지식수준에서, 우리의 무지에 있다.”"]}, {"tag": "본문 3~4번", "ns": [3, 4], "line": "기적도 나중에는 자연 법칙이나 기술로 밝혀졌다. 신비한 것은 아직 기적이 아니다.", "en": ["Glorious miracles have been later on discovered to be obedience to the laws of nature or a technological development that was not widely known at the time.", "As the German poet, Goethe, phrased it: “Things that are mysterious are not yet miracles.”"], "kos": ["영광스러운 기적들은 자연의 법칙에 대한 순응으로서, 혹은 당시에는 널리 알려지지 않았던 기술적 발전으로서 나중에 발견되어 왔다.", "독일 시인 Goethe가 그것을 표현했듯이, “‘신비한’ 것들은 아직 ‘기적’이 ‘아니다’.”"]}, {"tag": "본문 5번", "ns": [5], "line": "기적은 높은 힘의 [[intervention|개입]]을 [[assumes|가정한다]].", "en": ["The miracle assumes the intervention of a “higher power” in its occurrence that is beyond human capability to grasp."], "kos": ["기적은 그것의 발생에 있어서 인간이 이해할 수 있는 능력 너머의 ‘더 높은 힘’의 개입을 가정한다."]}, {"tag": "본문 6~7번", "ns": [6, 7], "line": "신 없이도 기적을 일으키는 방법이 있는데, 사람들은 [[checking|확인하는]] 대신 기적이라 부른다.", "en": ["Yet there are methodical and simple ways to “cause a miracle” without divine revelation and inspiration.", "Instead of checking it out, investigating and finding the source of the event, we define it as a miracle."], "kos": ["하지만, 신적인 계시와 영감 없이 ‘기적을 일으키는’ 체계적이고 간단한 방법들이 있다.", "그것을 확인하는 것, 즉, 그 사건의 근원을 조사하고 찾는 것 대신에, 우리는 그것을 기적으로 정의한다."]}, {"tag": "본문 8번", "ns": [8], "line": "기적은 게으른 사람들의 [[excuse|핑계]]다.", "en": ["The miracle, then, is the excuse of those who are too lazy to think."], "kos": ["그렇다면, 기적은 생각하는 데 너무 게으른 사람들의 핑계이다."]}], "story": [{"a": "irrational", "form": "irrational", "n": 1, "sq": 1, "sum": "seems [[illogical]] to us", "hook": "불가능한 우연이 이성적이지 않게 보인다는 irrational(비이성적인) → 요약문에서는 illogical(비논리적인)로 바뀌었어요.", "b": "illogical", "k": "비이성적인 → 비논리적인", "en": "Coincidence that is statistically impossible seems to us like an irrational event, and some define it as a miracle.", "ko": "통계적으로 불가능한 우연은 우리에게 비이성적인 사건처럼 보이고, 어떤 이들은 그것을 기적으로 정의한다."}, {"a": "origin", "form": "origin", "n": 2, "sq": 1, "sum": "the [[source]] of a miracle", "hook": "기적이 어디서 시작되었는지를 가리키는 origin(기원) → 요약문에서는 source(근원)로 바뀌었어요.", "b": "source", "k": "기원 → 근원", "en": "But, as Montaigne has said, “the origin of a miracle is in our ignorance, at the level of our knowledge of nature, and not in nature itself.”", "ko": "그러나, Montaigne가 말했듯이, “기적의 기원은 자연 그 자체가 아니라 자연에 대한 우리의 지식수준에서, 우리의 무지에 있다.”"}, {"a": "ignorance", "form": "ignorance", "n": 2, "sq": 1, "sum": "our [[lack]] of understanding", "hook": "기적은 우리의 무지에서 나온다는 ignorance(무지) → 요약문에서는 lack(부족)으로 바뀌었어요.", "b": "lack", "k": "무지 → (이해의) 부족", "en": "But, as Montaigne has said, “the origin of a miracle is in our ignorance, at the level of our knowledge of nature, and not in nature itself.”", "ko": "그러나, Montaigne가 말했듯이, “기적의 기원은 자연 그 자체가 아니라 자연에 대한 우리의 지식수준에서, 우리의 무지에 있다.”"}, {"a": "assume", "form": "assumes", "n": 5, "sq": 2, "sum": "a true miracle [[supposes]]", "hook": "기적은 높은 힘의 개입을 가정한다는 assumes → 요약문에서는 supposes(가정한다)로 바뀌었어요.", "b": "suppose", "k": "가정하다 → 가정하다", "en": "The miracle assumes the intervention of a “higher power” in its occurrence that is beyond human capability to grasp.", "ko": "기적은 그것의 발생에 있어서 인간이 이해할 수 있는 능력 너머의 ‘더 높은 힘’의 개입을 가정한다."}, {"a": "intervention", "form": "intervention", "n": 5, "sq": 2, "sum": "the [[involvement]] of a higher power", "hook": "높은 힘이 끼어든다는 intervention(개입) → 요약문에서는 involvement(관여)로 바뀌었어요.", "b": "involvement", "k": "개입 → 관여", "en": "The miracle assumes the intervention of a “higher power” in its occurrence that is beyond human capability to grasp.", "ko": "기적은 그것의 발생에 있어서 인간이 이해할 수 있는 능력 너머의 ‘더 높은 힘’의 개입을 가정한다."}, {"a": "check", "form": "checking", "n": 7, "sq": 3, "sum": "instead of [[examining]] its cause", "hook": "사건을 확인해 보는 대신이라는 checking(확인하는 것) → 요약문에서는 examining(살펴보는 것)으로 바뀌었어요.", "b": "examine", "k": "확인하다 → 살펴보다", "en": "Instead of checking it out, investigating and finding the source of the event, we define it as a miracle.", "ko": "그것을 확인하는 것, 즉, 그 사건의 근원을 조사하고 찾는 것 대신에, 우리는 그것을 기적으로 정의한다."}, {"a": "excuse", "form": "excuse", "n": 8, "sq": 3, "sum": "just a [[pretext]] used by", "hook": "생각하기 귀찮은 사람들의 핑계, excuse → 요약문에서는 pretext(구실)로 바뀌었어요.", "b": "pretext", "k": "핑계 → 구실", "en": "The miracle, then, is the excuse of those who are too lazy to think.", "ko": "그렇다면, 기적은 생각하는 데 너무 게으른 사람들의 핑계이다."}], "passage": [{"n": 1, "en": "Coincidence that is statistically impossible seems to us like an irrational event, and some define it as a miracle.", "ko": "통계적으로 불가능한 우연은 우리에게 비이성적인 사건처럼 보이고, 어떤 이들은 그것을 기적으로 정의한다."}, {"n": 2, "en": "But, as Montaigne has said, “the origin of a miracle is in our ignorance, at the level of our knowledge of nature, and not in nature itself.”", "ko": "그러나, Montaigne가 말했듯이, “기적의 기원은 자연 그 자체가 아니라 자연에 대한 우리의 지식수준에서, 우리의 무지에 있다.”"}, {"n": 3, "en": "Glorious miracles have been later on discovered to be obedience to the laws of nature or a technological development that was not widely known at the time.", "ko": "영광스러운 기적들은 자연의 법칙에 대한 순응으로서, 혹은 당시에는 널리 알려지지 않았던 기술적 발전으로서 나중에 발견되어 왔다."}, {"n": 4, "en": "As the German poet, Goethe, phrased it: “Things that are mysterious are not yet miracles.”", "ko": "독일 시인 Goethe가 그것을 표현했듯이, “‘신비한’ 것들은 아직 ‘기적’이 ‘아니다’.”"}, {"n": 5, "en": "The miracle assumes the intervention of a “higher power” in its occurrence that is beyond human capability to grasp.", "ko": "기적은 그것의 발생에 있어서 인간이 이해할 수 있는 능력 너머의 ‘더 높은 힘’의 개입을 가정한다."}, {"n": 6, "en": "Yet there are methodical and simple ways to “cause a miracle” without divine revelation and inspiration.", "ko": "하지만, 신적인 계시와 영감 없이 ‘기적을 일으키는’ 체계적이고 간단한 방법들이 있다."}, {"n": 7, "en": "Instead of checking it out, investigating and finding the source of the event, we define it as a miracle.", "ko": "그것을 확인하는 것, 즉, 그 사건의 근원을 조사하고 찾는 것 대신에, 우리는 그것을 기적으로 정의한다."}, {"n": 8, "en": "The miracle, then, is the excuse of those who are too lazy to think.", "ko": "그렇다면, 기적은 생각하는 데 너무 게으른 사람들의 핑계이다."}], "questions": [{"id": 1, "summary": "A statistically impossible coincidence seems (A) to us, but Montaigne says the source of a miracle lies in our (B) of understanding of nature, not in nature itself.", "ko": "통계적으로 불가능한 우연은 우리에게 <b>(A) 비논리적으로</b> 보이지만, 몽테뉴는 기적의 근원이 자연 그 자체가 아니라 자연에 대한 우리의 이해 <b>(B) 부족</b>에 있다고 말한다.", "opts": [["illogical", "depth"], ["natural", "lack"], ["natural", "depth"], ["harmful", "excess"], ["illogical", "lack"]], "optko": ["비논리적인 – 깊이", "자연스러운 – 부족", "자연스러운 – 깊이", "해로운 – 과잉", "비논리적인 – 부족"], "ans": 4, "wrong": ["depth(깊이)가 틀려요. 기적은 우리의 이해가 깊어서가 아니라 무지(ignorance), 곧 부족해서 생겨요.", "natural(자연스러운)이 틀려요. 불가능한 우연은 자연스러운 게 아니라 비이성적인(irrational) 사건처럼 보여요.", "둘 다 틀려요. 불가능한 우연은 자연스럽게 보이지 않고, 문제는 이해의 깊이가 아니라 부족이에요.", "둘 다 틀려요. 해롭다는 말도, 이해가 넘친다(과잉)는 말도 본문과 반대예요.", null], "evid": [{"n": 1, "hl": ["statistically impossible", "an irrational event"]}, {"n": 2, "hl": ["the origin of a miracle", "our ignorance"]}], "swaps": [["irrational", "illogical", "비이성적인 → 비논리적인"], ["origin", "source", "기원 → 근원"], ["ignorance", "lack", "무지 → (이해의) 부족"]], "swapnote": "irrational(비이성적인)은 illogical(비논리적인)로, origin(기원)은 source(근원)로 바뀌었어요. ignorance(무지)는 '이해가 부족함'으로 풀어 읽어요.", "use": [{"w": "illogical", "ex": "His answer was illogical.", "ko": "그의 대답은 비논리적이었다.", "wk": "비논리적인", "hk": "비논리적이었다"}, {"w": "lack", "ex": "A lack of sleep makes you tired.", "ko": "잠이 부족하면 피곤하다.", "wk": "부족", "hk": "부족하면"}], "flow": "본문 1번에서 통계적으로 불가능한 우연을 기적이라 부르는 사람들이 있다고 하고 → 2번에서 몽테뉴의 말로 기적의 기원은 자연이 아니라 우리의 무지에 있다고 반박해요.", "jd": [["A statistically impossible coincidence seems [[illogical]] to us,", "통계적으로 불가능한 우연은 우리에게 [[비논리적으로]] 보이지만,"], ["but Montaigne says the source of a miracle", "몽테뉴는 기적의 근원이"], ["lies in our [[lack]] of understanding of nature,", "자연에 대한 우리의 이해 [[부족]]에 있다고 말한다,"], ["not in nature itself.", "자연 그 자체에 있는 것이 아니라."]], "fc": [["본문 1번", "불가능한 우연을 기적이라 부른다", "비이성적으로 보이는 사건이에요."], ["본문 2번", "몽테뉴: 기적의 기원은 우리의 무지", "자연이 아니라 우리의 지식 수준 문제예요."], ["정답 포인트", "{{irrational|비이성적인}} = {{illogical|비논리적인}}, {{origin|기원}} = {{source|근원}}", "{{ignorance|무지}}는 '이해 {{lack|부족}}'으로 바뀌었어요."]], "evid_full": [{"en": "Coincidence that is statistically impossible seems to us like an irrational event, and some define it as a miracle.", "ko": "통계적으로 불가능한 우연은 우리에게 비이성적인 사건처럼 보이고, 어떤 이들은 그것을 기적으로 정의한다.", "hl": ["statistically impossible", "an irrational event"], "hlko": ["통계적으로 불가능한 우연", "비이성적인 사건"], "n": 1}, {"en": "But, as Montaigne has said, “the origin of a miracle is in our ignorance, at the level of our knowledge of nature, and not in nature itself.”", "ko": "그러나, Montaigne가 말했듯이, “기적의 기원은 자연 그 자체가 아니라 자연에 대한 우리의 지식수준에서, 우리의 무지에 있다.”", "hl": ["the origin of a miracle", "our ignorance"], "hlko": ["기적의 기원은", "우리의 무지"], "n": 2}]}, {"id": 2, "summary": "Many so-called miracles were later (A) as results of natural laws or unfamiliar technology, and a true miracle supposes the (B) of a higher power.", "ko": "소위 기적이라 불리는 많은 것들이 나중에 자연 법칙이나 낯선 기술의 결과로 <b>(A) 설명되었고</b>, 진정한 기적은 더 높은 힘의 <b>(B) 개입</b>을 가정한다.", "opts": [["explained", "absence"], ["denied", "involvement"], ["explained", "involvement"], ["denied", "absence"], ["praised", "rejection"]], "optko": ["설명된 – 부재", "부정된 – 개입", "설명된 – 개입", "부정된 – 부재", "칭찬받은 – 거부"], "ans": 2, "wrong": ["absence(부재)가 틀려요. 기적은 더 높은 힘이 없는 게 아니라 그 힘이 개입한다(intervention)고 가정해요.", "denied(부정된)가 틀려요. 기적들은 부정된 게 아니라 자연 법칙이나 기술로 설명이 밝혀졌어요.", null, "둘 다 틀려요. 기적은 부정되지 않고 설명이 밝혀졌고, 높은 힘의 부재가 아니라 개입을 가정해요.", "둘 다 틀려요. 칭찬받았다는 말도, 높은 힘을 거부한다는 말도 본문에 없어요."], "evid": [{"n": 3, "hl": ["obedience to the laws of nature", "a technological development that was not widely known"]}, {"n": 5, "hl": ["intervention", "beyond human capability to grasp"]}], "swaps": [["assume", "suppose", "가정하다 → 가정하다"], ["intervention", "involvement", "개입 → 관여"], ["discover", "explain", "발견하다 → 설명하다"]], "swapnote": "assumes(가정한다)는 supposes(가정한다)로, intervention(개입)은 involvement(관여)로 바뀌었어요. 나중에 발견된 사실은 '설명되었다'로 읽어요.", "use": [{"w": "explain", "ex": "The teacher will explain the rule again.", "ko": "선생님이 그 규칙을 다시 설명해 줄 것이다.", "wk": "설명하다", "hk": "설명해"}, {"w": "involvement", "ex": "Her involvement in the club helped it grow.", "ko": "그녀의 동아리 참여가 동아리를 키웠다.", "wk": "관여, 참여", "hk": "참여가"}], "flow": "본문 3번에서 영광스러운 기적도 나중에 자연 법칙이나 당시엔 몰랐던 기술로 밝혀졌다고 하고 → 4번에서 괴테의 말로 신비한 것은 아직 기적이 아니라고 하고 → 5번에서 기적은 인간이 이해할 수 없는 높은 힘의 개입을 가정한다고 해요.", "jd": [["Many so-called miracles were later [[explained]] as results", "소위 기적이라 불리는 많은 것들이 나중에 결과로 [[설명되었고]]"], ["of natural laws or unfamiliar technology,", "자연 법칙이나 낯선 기술의,"], ["and a true miracle supposes the [[involvement]] of a higher power.", "진정한 기적은 더 높은 힘의 [[개입]]을 가정한다."]], "fc": [["본문 3번", "기적도 나중엔 자연 법칙·기술로 밝혀짐", "당시에 몰랐을 뿐이에요."], ["본문 4번", "괴테: 신비한 것은 아직 기적이 아니다", "설명되면 기적이 아니에요."], ["본문 5번", "기적 = 높은 힘의 개입을 가정", "인간이 이해할 수 없는 영역이에요."], ["정답 포인트", "{{discover|발견하다}} → {{explain|설명하다}}, {{intervention|개입}} = {{involvement|관여}}", "{{assume|가정하다}}는 {{suppose|가정하다}}로 바뀌었어요."]], "evid_full": [{"en": "Glorious miracles have been later on discovered to be obedience to the laws of nature or a technological development that was not widely known at the time.", "ko": "영광스러운 기적들은 자연의 법칙에 대한 순응으로서, 혹은 당시에는 널리 알려지지 않았던 기술적 발전으로서 나중에 발견되어 왔다.", "hl": ["obedience to the laws of nature", "a technological development that was not widely known"], "hlko": ["자연의 법칙에 대한 순응", "당시에는 널리 알려지지 않았던 기술적 발전"], "n": 3}, {"en": "The miracle assumes the intervention of a “higher power” in its occurrence that is beyond human capability to grasp.", "ko": "기적은 그것의 발생에 있어서 인간이 이해할 수 있는 능력 너머의 ‘더 높은 힘’의 개입을 가정한다.", "hl": ["intervention", "beyond human capability to grasp"], "hlko": ["개입", "이해할 수 있는 능력 너머"], "n": 5}]}, {"id": 3, "summary": "There are simple, methodical ways to produce a miracle without divine help, so calling an event a miracle instead of (A) its cause is just a (B) used by people too lazy to think.", "ko": "신의 도움 없이 기적을 일으키는 간단하고 체계적인 방법들이 있으므로, 어떤 사건의 원인을 <b>(A) 살펴보는</b> 대신 기적이라 부르는 것은 생각하기에 너무 게으른 사람들이 쓰는 <b>(B) 핑계</b>일 뿐이다.", "opts": [["examining", "reward"], ["examining", "pretext"], ["ignoring", "pretext"], ["ignoring", "reward"], ["praising", "proof"]], "optko": ["살펴보는 – 보상", "살펴보는 – 핑계", "무시하는 – 핑계", "무시하는 – 보상", "칭찬하는 – 증거"], "ans": 1, "wrong": ["reward(보상)가 틀려요. 본문은 기적이라는 말이 게으른 사람들의 핑계(excuse)라고 해요.", null, "ignoring(무시하는)이 틀려요. 본문은 원인을 확인하고 조사하는(checking, investigating) 대신이라고 말해요.", "둘 다 틀려요. 무시하는 게 아니라 조사하는 대신이고, 보상이 아니라 핑계예요.", "둘 다 틀려요. 원인을 칭찬하라는 말도, 기적이 증거라는 말도 본문에 없어요."], "evid": [{"n": 6, "hl": ["without divine revelation and inspiration"]}, {"n": 7, "hl": ["Instead of checking it out"]}, {"n": 8, "hl": ["the excuse of those who are too lazy to think"]}], "swaps": [["check", "examine", "확인하다 → 살펴보다"], ["excuse", "pretext", "핑계 → 구실"], ["divine", "godly", "신의 → 신성한"]], "swapnote": "checking it out(확인하는 것)은 examining(살펴보는 것)으로, excuse(핑계)는 pretext(구실)로 바뀌었어요. 둘 다 '진짜 이유 대신 대는 말'이에요.", "use": [{"w": "examine", "ex": "The doctor will examine the patient.", "ko": "의사가 환자를 살펴볼 것이다.", "wk": "살펴보다", "hk": "살펴볼"}, {"w": "pretext", "ex": "He used a cold as a pretext to skip class.", "ko": "그는 감기를 수업을 빠지는 구실로 썼다.", "wk": "구실", "hk": "구실로"}], "flow": "본문 6번에서 신의 힘 없이 기적을 일으키는 방법도 있다고 하고 → 7번에서 확인하고 조사하는 대신 기적이라 불러 버린다고 하고 → 8번에서 그러니 기적은 생각하기 귀찮은 사람들의 핑계라고 끝내요.", "jd": [["There are simple, methodical ways to produce a miracle without divine help,", "신의 도움 없이 기적을 일으키는 간단하고 체계적인 방법들이 있어서,"], ["so calling an event a miracle", "사건을 기적이라 부르는 것은"], ["instead of [[examining]] its cause", "그 원인을 [[살펴보는]] 대신"], ["is just a [[pretext]] used by people too lazy to think.", "생각하기에 너무 게으른 사람들이 쓰는 [[핑계]]일 뿐이다."]], "fc": [["본문 6번", "신 없이도 기적을 만드는 방법이 있다", "체계적이고 간단해요."], ["본문 7번", "조사하는 대신 기적이라 부른다", "원인을 찾아보지 않아요."], ["본문 8번", "기적 = 게으른 사람의 핑계", "결론이에요."], ["정답 포인트", "{{check|확인하다}} = {{examine|살펴보다}}, {{excuse|핑계}} = {{pretext|구실}}", "본문 단어를 비슷한 말로 바꿨어요."]], "evid_full": [{"en": "Yet there are methodical and simple ways to “cause a miracle” without divine revelation and inspiration.", "ko": "하지만, 신적인 계시와 영감 없이 ‘기적을 일으키는’ 체계적이고 간단한 방법들이 있다.", "hl": ["without divine revelation and inspiration"], "hlko": ["신적인 계시와 영감 없이"], "n": 6}, {"en": "Instead of checking it out, investigating and finding the source of the event, we define it as a miracle.", "ko": "그것을 확인하는 것, 즉, 그 사건의 근원을 조사하고 찾는 것 대신에, 우리는 그것을 기적으로 정의한다.", "hl": ["Instead of checking it out"], "hlko": ["그것을 확인하는 것"], "n": 7}, {"en": "The miracle, then, is the excuse of those who are too lazy to think.", "ko": "그렇다면, 기적은 생각하는 데 너무 게으른 사람들의 핑계이다.", "hl": ["the excuse of those who are too lazy to think"], "hlko": ["생각하는 데 너무 게으른 사람들의 핑계"], "n": 8}]}], "gloss": {"change": ["change", "변화, 바꾸다"], "changes": ["change", "변화"], "out": ["out", "밖으로"], "person's": ["person", "사람"], "person’s": ["person", "사람"], "good": ["good", "좋은"], "terms": ["term", "관점, 용어"], "rather": ["rather", "오히려"], "against": ["against", "~에 반대하여, ~을 배경으로"], "about": ["about", "~에 대해"], "example": ["example", "예"], "people": ["people", "사람들"], "want": ["want", "원하다"], "see": ["see", "보다, 알다"], "opposite": ["opposite", "정반대인"], "unrelated": ["unrelated", "관련 없는"], "always": ["always", "항상"], "never": ["never", "결코 ~ 않다"], "often": ["often", "자주"], "because": ["because", "~ 때문에"], "however": ["however", "그러나"], "instead": ["instead", "대신에"], "time": ["time", "시간"], "year": ["year", "해"], "years": ["year", "해"], "first": ["first", "처음의"], "like": ["like", "~처럼"], "makes": ["make", "만들다"], "make": ["make", var WRE=/[A-Za-z][A-Za-z'’\-]*[A-Za-z]|[A-Za-z]/g;
function words(t){
  var out='',last=0,m;WRE.lastIndex=0;
  while((m=WRE.exec(t))){
    out+=esc(t.slice(last,m.index));
    var key=m[0].toLowerCase().replace(/’/g,"'");
    if(G[key]){out+='<span class="w'+(NOTES[G[key][0].toLowerCase()]?' got':'')+'" data-k="'+esc(key)+'">'+esc(m[0])+'</span>'}
    else out+=esc(m[0]);
    last=m.index+m[0].length;
  }
  return out+esc(t.slice(last));
}

function tapWord(key){
  var g=G[key];if(!g)return;
  var lem=g[0],id=lem.toLowerCase();
  $('sw').textContent=key.toLowerCase()===id?lem:key+'  →  '+lem;

document.addEventListener('click',function(e){
