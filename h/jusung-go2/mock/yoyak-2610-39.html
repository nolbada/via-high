var DATA={"meta": {"sch": "jusung-go2", "src": "common/sx-data-2610g2.js", "dir": "mock", "pidx": 14, "lesson": "26년 10월 39번", "title": "", "label": "", "page": "yoyak-2610-39"}, "scenes": [{"tag": "본문 1~2번", "ns": [1, 2], "line": "사회사는 엘리트보다 [[ordinary|평범한]] 사람들을 강조한다.", "en": ["Like all historians, social historians draw from a variety of primary sources.", "Social history often emphasizes ordinary people rather than elites."], "kos": ["모든 역사학자들과 마찬가지로, 사회사학자들은 다양한 원자료들을 가져와 쓴다.", "사회사는 대개 엘리트들보다 평범한 사람들을 강조한다."]}, {"tag": "본문 3번", "ns": [3], "line": "그들은 [[education|교육]] 기회가 부족해서 [[documentation|문서 기록]]을 많이 남기지 못했다.", "en": ["Yet, in most places and times, non-elites lacked access to education and, thus, did not produce substantial amounts of documentation."], "kos": ["하지만, 대부분의 지역들과 시대들에서, 엘리트가 아닌 사람들은 교육에 대한 접근 기회가 부족했고, 따라서, 풍부한 양의 문서로 된 기록을 생산하지 못했다."]}, {"tag": "본문 4~5번", "ns": [4, 5], "line": "남긴 기록도 기록 보관소에 거의 닿지 못해 [[preserved|보존되기]] 어려웠다. 그래서 사회사학자는 매우 [[creative|창의적이어야]] 한다.", "en": ["Even when they did produce documentation, these materials rarely ended up in archives where they could be preserved and made available to researchers.", "Because of such biases in the historical record, social historians have to be very creative in their work."], "kos": ["심지어 그들이 문서로 된 기록을 정말로 생산했을 때조차도, 이러한 자료들은 그것들이 보존될 수 있고 연구자들에게 이용 가능해질 수 있는 기록 보관소들에 거의 다다르지 못했다.", "역사적 기록에서의 그러한 편향들 때문에, 사회사학자들은 자신들의 작업에 있어서 매우 창의적이어야 한다."]}, {"tag": "본문 6~8번", "ns": [6, 7, 8], "line": "엘리트가 쓴 자료를 액면 그대로 [[take|받아들이기]]보다 일반적인 방식과 다르게 읽고, 공백과 소문이 주는 [[hints|힌트]]를 찾는다.", "en": ["Like other historians, social historians analyze textual sources produced by government officials, employers, and other elites.", "Yet rather than simply take such sources at face value, they read them “against the grain”.", "So, for example, a social historian will read legal documents not only for the “facts” provided by slaveowners; she will also examine the silences, interruptions, rumors, and other details that offer hints about the enslaved peoples’ attitudes and actions."], "kos": ["다른 역사학자들처럼 사회사학자들은 정부 관료들, 고용주들, 그리고 다른 엘리트들에 의해 생산된 텍스트 자료를 분석한다.", "하지만 그러한 자료들을 단순히 액면 그대로 받아들이기보다 그들은 그것들을 ‘일반적인 방식과 다르게’ 해석한다.", "그래서, 예를 들어, 어떤 사회사학자는 법적 문서들을 노예 소유주들에 의해 제공된 ‘사실들’을 얻기 위해 읽을 뿐만 아니라, 그녀는 또한 노예가 된 사람들의 태도들과 행동들에 대한 힌트들을 제공하는 공백들, 단절들, 소문들, 그리고 다른 세부 사항들을 조사할 것이다."]}], "story": [{"a": "ordinary", "form": "ordinary", "n": 2, "sq": 1, "sum": "study [[common]] people rather than elites", "hook": "사회사가 평범한 사람들을 강조한다는 문장의 ordinary(평범한) → 요약문에서는 common(보통의)으로 바꿨어요.", "b": "common", "k": "평범한 → 보통의", "en": "Social history often emphasizes ordinary people rather than elites.", "ko": "사회사는 대개 엘리트들보다 평범한 사람들을 강조한다."}, {"a": "education", "form": "education", "n": 3, "sq": 1, "sum": "lacked [[schooling]]", "hook": "엘리트가 아닌 사람들은 교육 기회가 부족했다는 문장의 education(교육) → 요약문에서는 schooling(학교 교육)으로 바꿨어요.", "b": "schooling", "k": "교육 → 학교 교육", "en": "Yet, in most places and times, non-elites lacked access to education and, thus, did not produce substantial amounts of documentation.", "ko": "하지만, 대부분의 지역들과 시대들에서, 엘리트가 아닌 사람들은 교육에 대한 접근 기회가 부족했고, 따라서, 풍부한 양의 문서로 된 기록을 생산하지 못했다."}, {"a": "documentation", "form": "documentation", "n": 3, "sq": 1, "sum": "few written [[records]]", "hook": "풍부한 문서 기록을 생산하지 못했다는 문장의 documentation(문서로 된 기록) → 요약문에서는 records(기록)로 바꿨어요.", "b": "records", "k": "문서로 된 기록 → 기록", "en": "Yet, in most places and times, non-elites lacked access to education and, thus, did not produce substantial amounts of documentation.", "ko": "하지만, 대부분의 지역들과 시대들에서, 엘리트가 아닌 사람들은 교육에 대한 접근 기회가 부족했고, 따라서, 풍부한 양의 문서로 된 기록을 생산하지 못했다."}, {"a": "preserve", "form": "preserved", "n": 4, "sq": 2, "sum": "could be [[saved]]", "hook": "기록 보관소에서 보존될 수 있다는 문장의 preserve(보존하다) → 요약문에서는 save(보존하다)로 바꿨어요.", "b": "save", "k": "보존하다 → 보존하다", "en": "Even when they did produce documentation, these materials rarely ended up in archives where they could be preserved and made available to researchers.", "ko": "심지어 그들이 문서로 된 기록을 정말로 생산했을 때조차도, 이러한 자료들은 그것들이 보존될 수 있고 연구자들에게 이용 가능해질 수 있는 기록 보관소들에 거의 다다르지 못했다."}, {"a": "creative", "form": "creative", "n": 5, "sq": 2, "sum": "have to be very [[inventive]]", "hook": "사회사학자들은 매우 창의적이어야 한다는 문장의 creative(창의적인) → 요약문에서는 inventive(독창적인)로 바꿨어요.", "b": "inventive", "k": "창의적인 → 독창적인", "en": "Because of such biases in the historical record, social historians have to be very creative in their work.", "ko": "역사적 기록에서의 그러한 편향들 때문에, 사회사학자들은 자신들의 작업에 있어서 매우 창의적이어야 한다."}, {"a": "take", "form": "take", "n": 7, "sq": 3, "sum": "do not simply [[accept]] elite documents", "hook": "자료를 액면 그대로 받아들이기보다라는 문장의 take(받아들이다) → 요약문에서는 accept(받아들이다)로 바꿨어요.", "b": "accept", "k": "받아들이다 → 받아들이다", "en": "Yet rather than simply take such sources at face value, they read them “against the grain”.", "ko": "하지만 그러한 자료들을 단순히 액면 그대로 받아들이기보다 그들은 그것들을 ‘일반적인 방식과 다르게’ 해석한다."}, {"a": "hint", "form": "hints", "n": 8, "sq": 3, "sum": "that give [[clues]]", "hook": "태도에 대한 힌트를 제공하는 세부 사항이라는 문장의 hint(힌트) → 요약문에서는 clue(단서)로 바꿨어요.", "b": "clue", "k": "힌트 → 단서", "en": "So, for example, a social historian will read legal documents not only for the “facts” provided by slaveowners; she will also examine the silences, interruptions, rumors, and other details that offer hints about the enslaved peoples’ attitudes and actions.", "ko": "그래서, 예를 들어, 어떤 사회사학자는 법적 문서들을 노예 소유주들에 의해 제공된 ‘사실들’을 얻기 위해 읽을 뿐만 아니라, 그녀는 또한 노예가 된 사람들의 태도들과 행동들에 대한 힌트들을 제공하는 공백들, 단절들, 소문들, 그리고 다른 세부 사항들을 조사할 것이다."}], "passage": [{"n": 1, "en": "Like all historians, social historians draw from a variety of primary sources.", "ko": "모든 역사학자들과 마찬가지로, 사회사학자들은 다양한 원자료들을 가져와 쓴다."}, {"n": 2, "en": "Social history often emphasizes ordinary people rather than elites.", "ko": "사회사는 대개 엘리트들보다 평범한 사람들을 강조한다."}, {"n": 3, "en": "Yet, in most places and times, non-elites lacked access to education and, thus, did not produce substantial amounts of documentation.", "ko": "하지만, 대부분의 지역들과 시대들에서, 엘리트가 아닌 사람들은 교육에 대한 접근 기회가 부족했고, 따라서, 풍부한 양의 문서로 된 기록을 생산하지 못했다."}, {"n": 4, "en": "Even when they did produce documentation, these materials rarely ended up in archives where they could be preserved and made available to researchers.", "ko": "심지어 그들이 문서로 된 기록을 정말로 생산했을 때조차도, 이러한 자료들은 그것들이 보존될 수 있고 연구자들에게 이용 가능해질 수 있는 기록 보관소들에 거의 다다르지 못했다."}, {"n": 5, "en": "Because of such biases in the historical record, social historians have to be very creative in their work.", "ko": "역사적 기록에서의 그러한 편향들 때문에, 사회사학자들은 자신들의 작업에 있어서 매우 창의적이어야 한다."}, {"n": 6, "en": "Like other historians, social historians analyze textual sources produced by government officials, employers, and other elites.", "ko": "다른 역사학자들처럼 사회사학자들은 정부 관료들, 고용주들, 그리고 다른 엘리트들에 의해 생산된 텍스트 자료를 분석한다."}, {"n": 7, "en": "Yet rather than simply take such sources at face value, they read them “against the grain”.", "ko": "하지만 그러한 자료들을 단순히 액면 그대로 받아들이기보다 그들은 그것들을 ‘일반적인 방식과 다르게’ 해석한다."}, {"n": 8, "en": "So, for example, a social historian will read legal documents not only for the “facts” provided by slaveowners; she will also examine the silences, interruptions, rumors, and other details that offer hints about the enslaved peoples’ attitudes and actions.", "ko": "그래서, 예를 들어, 어떤 사회사학자는 법적 문서들을 노예 소유주들에 의해 제공된 ‘사실들’을 얻기 위해 읽을 뿐만 아니라, 그녀는 또한 노예가 된 사람들의 태도들과 행동들에 대한 힌트들을 제공하는 공백들, 단절들, 소문들, 그리고 다른 세부 사항들을 조사할 것이다."}], "questions": [{"id": 1, "summary": "Social historians study (A) people rather than elites, but because such people lacked schooling, they left (B) written records.", "ko": "사회사학자들은 엘리트보다 <b>(A) 보통의</b> 사람들을 연구하지만, 그런 사람들은 학교 교육이 부족했기 때문에 <b>(B) 적은</b> 문서 기록을 남겼다.", "opts": [["common", "many"], ["wealthy", "few"], ["wealthy", "many"], ["common", "few"], ["foreign", "vast"]], "optko": ["보통의 – 많은", "부유한 – 적은", "부유한 – 많은", "보통의 – 적은", "외국의 – 방대한"], "ans": 3, "wrong": ["many(많은)가 틀려요. 엘리트가 아닌 사람들은 교육을 받을 기회가 부족해서 풍부한 양의 문서 기록을 생산하지 못했어요.", "wealthy(부유한)가 틀려요. 사회사는 엘리트보다 평범한 사람들(ordinary people)을 강조해요.", "둘 다 틀려요. 사회사는 부유한 사람이 아니라 평범한 사람들을 다루고, 그들은 기록을 많이 남기지 못했어요.", null, "둘 다 틀려요. 외국의(foreign) 사람이라는 말은 본문에 없고, 엘리트가 아닌 사람들은 방대한(vast) 기록이 아니라 적은 기록을 남겼어요."], "evid": [{"n": 2, "hl": ["emphasizes ordinary people rather than elites"]}, {"n": 3, "hl": ["non-elites lacked access to education", "did not produce substantial amounts of documentation"]}], "swaps": [["ordinary", "common", "평범한 → 보통의"], ["education", "schooling", "교육 → 학교 교육"], ["documentation", "records", "문서로 된 기록 → 기록"]], "swapnote": "ordinary(평범한)는 common(보통의)으로, education(교육)은 schooling(학교 교육)으로, documentation(문서로 된 기록)은 records(기록)로 바뀌었어요. 풍부한 양의 기록을 못 만들었다 = 적은 기록을 남겼다로 읽어요.", "use": [{"w": "common", "ex": "This is a common name.", "ko": "이것은 흔한 이름이다.", "wk": "보통의, 흔한", "hk": "흔한"}, {"w": "few", "ex": "Few students came to class.", "ko": "수업에 온 학생이 거의 없었다.", "wk": "적은, 거의 없는", "hk": "거의 없었다"}], "flow": "본문 2번에서 사회사가 엘리트보다 평범한 사람들을 강조한다고 하고, 3번에서 하지만 그들은 교육 기회가 부족해서 풍부한 문서 기록을 남기지 못했다고 이어요.", "jd": [["Social historians study [[common]] people", "사회사학자들은 [[보통의]] 사람들을 연구한다"], ["rather than elites,", "엘리트보다는,"], ["but because such people lacked schooling,", "하지만 그런 사람들은 학교 교육이 부족했기 때문에,"], ["they left [[few]] written records.", "[[적은]] 문서 기록을 남겼다."]], "fc": [["본문 2번", "사회사는 평범한 사람들 중심", "사회사는 엘리트보다 {{ordinary|평범한}} 사람들을 강조해요."], ["본문 3번", "교육 기회가 없어 기록이 적다", "교육 {{access|접근 기회}}가 부족해서 {{documentation|문서로 된 기록}}을 많이 남기지 못했어요."], ["정답 포인트", "{{ordinary|평범한}} = {{common|보통의}}, {{education|교육}} = {{schooling|학교 교육}}", "본문 단어가 쉬운 말로 바뀌어 나와요."]], "evid_full": [{"en": "Social history often emphasizes ordinary people rather than elites.", "ko": "사회사는 대개 엘리트들보다 평범한 사람들을 강조한다.", "hl": ["emphasizes ordinary people rather than elites"], "hlko": ["엘리트들보다 평범한 사람들을 강조한다"], "n": 2}, {"en": "Yet, in most places and times, non-elites lacked access to education and, thus, did not produce substantial amounts of documentation.", "ko": "하지만, 대부분의 지역들과 시대들에서, 엘리트가 아닌 사람들은 교육에 대한 접근 기회가 부족했고, 따라서, 풍부한 양의 문서로 된 기록을 생산하지 못했다.", "hl": ["non-elites lacked access to education", "did not produce substantial amounts of documentation"], "hlko": ["엘리트가 아닌 사람들은 교육에 대한 접근 기회가 부족했고", "풍부한 양의 문서로 된 기록을 생산하지 못했다"], "n": 3}]}, {"id": 2, "summary": "Records made by non-elites rarely ended up in places where they could be (A), and because the historical record is biased, social historians have to be very (B).", "ko": "엘리트가 아닌 사람들이 만든 기록은 <b>(A) 보존될</b> 수 있는 곳에 거의 이르지 못했고, 역사 기록이 편향되어 있기 때문에 사회사학자들은 매우 <b>(B) 독창적이어야</b> 한다.", "opts": [["saved", "inventive"], ["saved", "careless"], ["lost", "inventive"], ["lost", "careless"], ["sold", "lazy"]], "optko": ["보존된 – 독창적인", "보존된 – 부주의한", "잃은 – 독창적인", "잃은 – 부주의한", "팔린 – 게으른"], "ans": 0, "wrong": [null, "careless(부주의한)가 틀려요. 본문은 편향된 기록 때문에 사회사학자들이 매우 창의적이어야 한다고 해요(creative).", "lost(잃은)가 틀려요. 기록 보관소는 기록이 보존될 수 있는(preserved) 곳이에요. 거기에 거의 이르지 못했다는 말이에요.", "둘 다 틀려요. 기록 보관소는 기록을 잃는 곳이 아니라 보존하는 곳이고, 사회사학자들은 부주의해서는 안 되고 창의적이어야 해요.", "둘 다 틀려요. 기록 보관소는 기록을 파는(sell) 곳이 아니라 보존하는 곳이고, 사회사학자들은 게으른(lazy) 게 아니라 창의적이어야 해요."], "evid": [{"n": 4, "hl": ["rarely ended up in archives where they could be preserved"]}, {"n": 5, "hl": ["Because of such biases in the historical record", "very creative in their work"]}], "swaps": [["preserve", "save", "보존하다 → 보존하다"], ["creative", "inventive", "창의적인 → 독창적인"]], "swapnote": "preserve(보존하다)는 save(보존하다)로, creative(창의적인)는 inventive(독창적인)로 바뀌었어요.", "use": [{"w": "save", "ex": "We must save old books.", "ko": "우리는 옛 책들을 보존해야 한다.", "wk": "보존하다, 지키다", "hk": "보존해야"}, {"w": "inventive", "ex": "She is an inventive writer.", "ko": "그녀는 독창적인 작가다.", "wk": "독창적인", "hk": "독창적인"}], "flow": "본문 4번에서 그들의 기록은 보존될 수 있는 기록 보관소에 거의 닿지 못했다고 하고, 5번에서 그런 편향 때문에 사회사학자들은 작업에서 매우 창의적이어야 한다고 이어요.", "jd": [["Records made by non-elites", "엘리트가 아닌 사람들이 만든 기록은"], ["rarely ended up in places where they could be [[saved]],", "[[보존될]] 수 있는 곳에 거의 이르지 못했고,"], ["and because the historical record is biased,", "역사 기록이 편향되어 있기 때문에,"], ["social historians have to be very [[inventive]].", "사회사학자들은 매우 [[독창적이어야]] 한다."]], "fc": [["본문 4번", "기록 function words(t){

}

  else if(act==='reset'){PR={a:{}};jset(K_PROG,PR);go('home')}
  else if(act==='filt'){filt=v;render()}
  else if(act==='chk'){go('chk')}
  else if(act==='sw'){go('sw')}
  else if(act==='rvall'){var o=v==='open';swList().forEach(function(s){if(o){swOpen[s.id]=true;pushSw(s.id)}else delete swOpen[s.id]});render()}
  else if(act==='dt'){swD[v]=!swD[v];render()}
  else if(act==='rv'){swOpen[v]=!swOpen[v];if(swOpen[v])pushSw(v);render()}
  else if(act==='mean'){var m=document.getElementById('m_'+v);if(m)m.style.display=m.style.display==='block'?'none':'block'}
});
function pick(i){
  var q=Qs[cur];if(PR.a[q.id]!==undefined)return;
  PR.a[q.id]=i;jset(K_PROG,PR);recordYy(q,i);render();
}
/* 점수 기록: vhy:<학교> = {<페이지>:{<문제>:{n:푼 횟수,w:틀린 횟수,k:마지막 정답(1/0),c:고른 번호,t:시각}}} -> REC 로 자동 연동(선생님 화면) */
function recordYy(q,i){
  try{
    var K='vhy:'+SCH,P=location.pathname.split('/').slice(-2).join('/'),Y=jget(K,{});
    var pg=Y[P]||(Y[P]={}),e=pg[q.id]||(pg[q.id]={n:0,w:0});
    e.n=(e.n||0)+1;if(i!==q.ans)e.w=(e.w||0)+1;e.k=(i===q.ans?1:0);e.c=i;e.t=Date.now();
    jset(K,Y);
  }catch(x){}
  /* 바꿔 말하기 단어는 푼 즉시 모두 선생님 질문 목록에 올린다 */
  try{swList().forEach(function(s){pushSw(s.id)})}catch(x){}
}


function jdHtml(q){
  var h='<div class="sl">';
  q.jd.forEach(function(c){
    var en=c[0].split(/(\[\[.*?\]\])/).map(function(s){var m=s.match(/^\[\[(.*)\]\]$/);return m?'<mark>'+words(m[1])+'</mark>':words(s)}).join('');
    var ko=c[1].split(/(\[\[.*?\]\])/).map(function(s){var m=s.match(/^\[\[(.*)\]\]$/);return m?'<mark>'+esc(m[1])+'</mark>':esc(s)}).join('');
    h+='<div class="r"><b>'+en+'</b><span>'+ko+'</span></div>';
  });
  return h+'</div>';
}
function pushSw(id){return; /* 바꿔 말하기 단어는 선생님 질문 목록에 따로 올리지 않는다: 학생 목록 = 선생님 열람 목록 */
  if(String(id).indexOf('c')===0&&!/^sw:/.test(id))return;
  var s=swList().filter(function(x){return x.id===id})[0];if(!s||PUSHED[id])return;
  PUSHED[id]=1;jset('vhvs:'+SCH,PUSHED);
  try{WN.add([{w:s.a,m:s.k+' → '+s.b,src:SRC,how:'바꿔 말하기',ask:true}])}catch(e){}
}
function swList(){
  var L=(DATA.story||[]).map(function(s){return {a:s.a,form:s.form,b:s.b,k:s.k,id:'sw:'+s.a.toLowerCase(),n:s.n,sq:s.sq,sum:s.sum,hook:s.hook,en:s.en,ko:s.ko}}),seen={};
  L.forEach(function(s){seen[s.a.toLowerCase()]=1});
  /* 모든 문제의 '이 단어, 이렇게 바뀌었어요' 단어도 빠짐없이 바꿔 말하기 연습에 넣는다 */
  Qs.forEach(function(q,qi){(q.swaps||[]).forEach(function(w){var k=String(w[0]).toLowerCase();if(seen[k])return;seen[k]=1;L.push({a:w[0],form:w[0],b:w[1],k:w[2],id:'sw:'+k,n:0,sq:qi+1,sum:'',hook:'',en:'',ko:''})})});
  return L.map(function(s,i){return {s:s,i:i}}).sort(function(x,y){return (x.s.sq-y.s.sq)||(x.i-y.i)}).map(function(x){return x.s});
}
function hlWord(t,w){return t.split(new RegExp('(\\b'+w+'\\b)','i')).map(function(x,i){return i%2?'<mark>'+esc(x)+'</mark>':words(x)}).join('')}
function hlSum(t){return t.split(/(\[\[.*?\]\])/).map(function(x){var m=x.match(/^\[\[(.*)\]\]$/);return m?'<mark>'+words(m[1])+'</mark>':words(x)}).join('')}
var swOpen={},swD={};
/* 화면 */
function render(){
  var h='';
  if(view==='home')h=vHome();else if(view==='q')h=vQ();else if(view==='res')h=vRes();else if(view==='notes')h=vNotes();else if(view==='sw')h=vSw();else if(view==='chk')h=vChk();else h=vHome();
  var y=window.pageYOffset||0;
  $('app').innerHTML=h;
  if(!window.__goTop)window.scrollTo(0,y);
}
function yyLine(){
  try{var Y=jget('vhy:'+SCH,{}),pg=Y[location.pathname.split('/').slice(-2).join('/')]||{},n=0,r=0,w=0;
    Qs.forEach(function(q){var e=pg[q.id];if(e&&e.n){n++;if(e.k)r++;w+=e.w||0}});
    if(!n)return '';
    return '<p class="sub">내 기록: '+n+'문제 중 '+r+'문제 정답'+(w?' · 틀린 횟수 '+w+'번':'')+'</p>';
  }catch(x){return ''}
}
function vHome(){
  var d=doneCount(),f=firstOpen();
  var h='<a class="tag" href="../yoyak.html" style="text-decoration:none">목록</a><h1>'+DATA.meta.lesson+' '+esc(DATA.meta.title)+'</h1><p class="sub">요약문 연습 '+DATA.meta.label+' · '+Qs.length+'문제</p><div class="nums">';
  Qs.forEach(function(q,i){var a=PR.a[q.id];h+='<button class="nb '+(a===undefined?'':(a===q.ans?'o':'x'))+'" data-a="q" data-v="'+i+'">'+(i+1)+'</button>'});
  h+='</div>';
  h+=yyLine();
  h+='<button class="btn pri" data-a="resume">'+(d===0?'시작하기':(f<0?'결과 보기':'이어서 풀기 ('+d+' / '+Qs.length+')'))+'</button>';
  h+='<button class="btn sec" data-a="notes">단어노트 '+nNotes()+'개</button><button class="btn sec" data-a="sw">바꿔 말하기 연습</button>'+(nFlag()?'<button class="btn flagbtn" data-a="chk">선생님 확인 단어 '+nFlag()+'개</button>':'');
  h+='<div class="foot"><button data-a="reset">문제 다시 풀기</button></div>';
  return h;
}
function vQ(){
  var q=Qs[cur],a=PR.a[q.id],done=a!==undefined;curQ=q.id;
  var h='<div class="top"><button class="back" data-a="home">목록</button><button class="back" data-a="sw">바꿔 말하기</button><span class="cnt">'+(cur+1)+' / '+Qs.length+'</span></div>';
  if(!done)h+='<p class="hint">문장의 밑줄 단어를 누르면 뜻이 나와요. 보기를 누르면 답을 골라요.</p>';
  h+='<div class="card sum">'+sumHtml(q,done)+'</div><div class="opts">';
  q.opts.forEach(function(o,i){
    var cls='opt'+(done?' lock':'');
    if(done){if(i===q.ans)cls+=' right';else if(i===a)cls+=' mine'}
    h+='<div class="'+cls+'"'+(done?'':' data-a="pick" data-v="'+i+'"')+'><span class="num">'+CN[i]+'</span><span class="ot">'+(done?words(o[0]):esc(o[0]))+'<span class="dash">–</span>'+(done?words(o[1]):esc(o[1]))+'</span>'+(done&&i===q.ans?'<span class="st">정답</span>':(done&&i===a?'<span class="st">내 답</span>':''))+'</div>';
  });
  h+='</div>';
  if(done){
    var ok=a===q.ans;
    h+='<div id="exp"><div class="card"><div class="row"><span class="badge">'+(cur+1)+'번</span><span class="chip">정답 '+CN[q.ans]+'</span><span class="msg '+(ok?'o':'x')+'">'+(ok?'맞았어요':'내 답 '+CN[a])+'</span></div>';
    h+='</div><div class="card"><p class="lb">직독직해 (끊어서 앞에서부터 이해해요)</p>'+jdHtml(q)+'<details><summary>자연스러운 해석 보기</summary><div class="ko">'+q.ko.replace(/\((A|B)\)\s*/g,'')+'</div></details></div>';
    h+='<div class="card"><p class="lb">보기 뜻</p><ul class="opl">';
    q.opts.forEach(function(o,i){h+='<li class="'+(i===q.ans?'a':'')+'">'+CN[i]+' '+(i===q.ans?'<mark>'+words(o[0])+' – '+words(o[1])+'</mark>':words(o[0])+' – '+words(o[1]))+'<span class="k">'+(i===q.ans?'<mark>'+esc(q.optko[i])+'</mark>  ← 정답':esc(q.optko[i]))+'</span></li>'});
    h+='</ul></div>';
    h+='<div class="card"><p class="lb">정답의 근거 · 본문 '+q.evid_full.map(function(e){return e.n+'번'}).join(', ')+'</p>';
    q.evid_full.forEach(function(e){h+='<div class="ev"><div class="en">'+rich(e.en,e.hl)+'</div><div class="kk">'+richKo(e.ko,e.hlko)+'</div></div>'});
    h+='</div>';
    h+='<div class="card"><p class="lb">이 단어, 이렇게 바뀌었어요</p>';
    q.swaps.forEach(function(s){h+='<div class="swap"><span class="a">'+words(s[0])+'</span><span class="arr">→</span><span class="b">'+words(s[1])+'</span><span class="ds">'+esc(s[2])+(/\s/.test(s[0])||/\s/.test(s[1])?'':' '+sayBtn(s[0],'듣기')+' '+sayBtn(s[1],'듣기'))+'</span></div>'});
    h+='<div class="note">'+esc(q.swapnote)+'</div></div>';
    h+='<div class="card"><p class="lb">쓰임 익히기</p><div class="use">';
    q.use.forEach(function(u){h+='<div class="u"><div class="uw">'+esc(u.w)+'<small class="uwk">('+esc(u.wk)+')</small></div><div class="ue">'+useEx(u)+'</div><div class="uk">'+esc(u.ko).replace(esc(u.hk),'<mark>'+esc(u.hk)+'</mark>')+'</div></div>'});
    h+='</div></div>';
    h+='<div class="card"><p class="lb">기억할 흐름</p><div class="fc">'+q.fc.map(function(c,i){return (i?'<div class="ar">▼</div>':'')+'<div class="c'+(i===q.fc.length-1?' last':'')+'"><span class="tg">'+esc(c[0])+'</span><div class="hd">'+mk(c[1])+'</div><div class="sb2">'+mk(c[2])+'</div></div>'}).join('')+'</div></div>';
    h+='<div class="card"><details><summary>다른 보기는 왜 아닐까요</summary><ul style="padding:0;margin:6px 0 0">';
    q.wrong.forEach(function(w,i){if(w)h+='<li><b>'+CN[i]+'</b> '+hlp(w)+'</li>'});
    h+='</ul></details></div>';
    h+='<button class="btn pri" data-a="next">'+(cur<Qs.length-1?'다음 문제':'결과 보기')+'</button></div>';
  }
  return h;
}
function vRes(){
  var h='<div class="top"><button class="back" data-a="home">목록</button><button class="back" data-a="sw">바꿔 말하기</button></div><h1>'+Qs.length+'문제 중 '+okCount()+'문제 맞았어요</h1>';
  h+='<div class="nums">';
  Qs.forEach(function(q,i){var a=PR.a[q.id];h+='<button class="nb '+(a===undefined?'':(a===q.ans?'o':'x'))+'" data-a="q" data-v="'+i+'">'+(i+1)+'</button>'});
  h+='</div><p class="sub">단어노트에 '+nNotes()+'개가 쌓였어요.</p>';
  h+='<button class="btn pri" data-a="notes">단어노트 보기</button><button class="btn sec" data-a="reset">문제 다시 풀기</button><button class="btn sec" data-a="home">목록으로</button>';
  return h;
}
function sortedNotes(){return Object.keys(NOTES).map(function(k){return NOTES[k]}).sort(function(a,b){return b.t-a.t})}
function vNotes(){
  var L=sortedNotes();
  var h='<div class="top"><button class="back" data-a="home">목록</button><button class="back" data-a="sw">바꿔 말하기</button><span class="cnt">단어노트 '+L.length+'개</span></div>';
  if(!L.length)return h+'<div class="empty">밑줄 단어를 누르면 여기에 쌓여요.</div>';
  h+='<div class="card"><ul class="wl">';
  L.forEach(function(n){h+='<li><span class="lw">'+esc(n.l)+'</span><span class="lm">'+esc(n.k)+'</span>'+(n.c>1?'<span class="lc">'+n.c+'번</span>':'')+'<button class="rmw" data-a="rmnote" data-v="'+esc(n.l.toLowerCase())+'">빼기</button></li>'});
  return h+'</ul></div>';
}
function sk(id){return id.indexOf('sw:')===0?id.slice(3):id}
function wrongOf(id){var r=SRV[sk(id).toLowerCase()];return r&&r.c>0?r.c:0}
function flagList(){return Object.keys(SRV).map(function(k){return SRV[k]}).filter(function(r){return r.c>0}).sort(function(a,b){return b.c-a.c})}
function nFlag(){return flagList().length}
function srvLoad(){
  try{WN.list().then(function(r){
    if(!r||!r.ok||!r.items)return;SRV={};
    r.items.forEach(function(i){if(String(i.src||'').indexOf(SRC)>=0)SRV[String(i.w).toLowerCase()]={w:i.w,m:i.m,c:i.c||0}});
    if(view==='home'||view==='chk'||view==='sw')render();
  })}catch(e){}
}
function vChk(){
  var L=flagList();
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">선생님 확인 단어 '+L.length+'개</span></div>';
  if(!L.length)return h+'<div class="empty">틀린 단어가 없어요.</div>';
  h+='<p class="hint">선생님이 물어봤을 때 틀린 단어예요. 먼저 뜻을 떠올려 보고 확인해 보세요. 오답노트(H로드맵)에도 같이 있어요.</p><div class="card">';
  L.forEach(function(r){
    var id=r.w.toLowerCase(),o=swOpen['c'+id];
    h+='<div class="swr"><div class="swq"><span class="sa">'+esc(r.w)+'</span><span class="sb">'+(o?'<em>'+esc(r.m)+'</em>':'뜻은?')+'</span><small class="flag">'+r.c+'번 틀림</small><button data-a="rv" data-v="c'+esc(id)+'">'+(o?'가리기':'확인')+'</button></div></div>';
  });
  return h+'</div><a class="btn sec" style="display:block;text-align:center;text-decoration:none" href="https://nolbada.github.io/via/wn/">H로드맵 오답노트 열기</a>';
}
function sceneLine(t,cur){return esc(t).replace(/\[\[(\w+)\|([^\]]+)\]\]/g,function(m,w,k){return '<b class="wc'+(w.toLowerCase()===String(cur).toLowerCase()?' me':'')+'">'+w+'</b>('+k+')'})}
function vSw(){
  var L=swList(),sc={};
  (DATA.scenes||[]).forEach(function(c){(c.line.match(/\[\[\w+\|/g)||[]).forEach(function(m){sc[m.slice(2,-1).toLowerCase()]=c})});
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">바꿔 말하기 '+L.length+'개</span></div>';
  h+='<p class="hint">왼쪽 단어가 요약문에서 어떤 말로 바뀔까요? <b>소리 내어 말해 본 뒤</b> 확인을 눌러요.</p>';
  h+='<div class="tabs"><button data-a="rvall" data-v="open">모두 열기</button><button data-a="rvall" data-v="hide">모두 가리기</button></div><div class="card">';
  L.forEach(function(s){
    var o=swOpen[s.id],c=sc[s.form.toLowerCase()],on=swD['s'+s.id],fl=wrongOf(s.id);
    h+='<div class="swr"><div class="swq"><span class="qn">'+s.sq+'번</span><span class="sa">'+words(s.a)+(fl?'<small class="flag">'+fl+'번 틀림</small>':'')+'</span><span class="sb">'+(o?'<em>'+words(s.b)+'</em>'+esc(s.k):'→ ?')+'</span>'+sayBtn(s.a,'듣기')+(o?sayBtn(s.b,'정답 듣기'):'')+'<button data-a="rv" data-v="'+esc(s.id)+'">'+(o?'가리기':'확인')+'</button></div>';
    if(c)h+='<button class="acc2" data-a="dt" data-v="s'+esc(s.id)+'">'+esc(c.tag)+' 줄거리<span>'+(on?'접기':'펼치기')+'</span></button>'+(on?'<div class="story">'+sceneLine(c.line,s.form)+'</div>':'');
    h+='</div>';
  });
  return h+'</div><p class="sumline">시험에서는 본문 단어가 뜻이 같은 다른 단어로 바뀌어 나와요.</p>';
}
/* 자동 새로고침(기록 연동)이 일어나도 보던 문제로 되돌린다 */
try{var sv=JSON.parse(sessionStorage.getItem('vhyv')||'null');if(sv&&sv.p===location.pathname&&Date.now()-sv.t<600000&&sv.v&&sv.v!=='home'){view=sv.v;cur=sv.c||0;try{history.pushState({v:view},'');histPushed=true}catch(e){}}}catch(e){}
render();srvLoad();window.addEventListener('pageshow',srvLoad);
</script>
</body>
