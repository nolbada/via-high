<script>
var DATA={"meta": {"sch": "jusung-go2", "src": "jusung-go2/mock/sx-data.js", "pidx": 15, "lesson": "23년 11월 33번", "title": "", "label": "", "page": "yoyak-2311-33"}, "scenes": [{"tag": "본문 1~2번", "ns": [1, 2], "line": "통찰이 [[relatively|비교적]] 분명한 상관관계도, 인과 관계를 끌어오면 [[covered|가려진다]].", "en": ["Correlations are powerful because the insights they offer are relatively clear.", "These insights are often covered up when we bring causality back into the picture."], "kos": ["상관관계는 그것들이 제공하는 통찰력이 비교적 명확하기 때문에 강력하다.", "이러한 통찰력은 종종 우리가 인과 관계를 그 상황으로 다시 가져올 때 가려진다."]}, {"tag": "본문 3~4번", "ns": [3, 4], "line": "중고차 데이터에서 주황색 차는 [[defects|결함]]이 훨씬 적었다.", "en": ["For instance, a used-car dealer supplied data to statisticians to predict which of the vehicles available for purchase at an auction were likely to have problems.", "A correlation analysis showed that orange-colored cars were far less likely to have defects."], "kos": ["예를 들어, 한 중고차 딜러가 경매에서 구입할 수 있는 차량들 중 어떤 차량에 문제가 발생할 가능성이 있는지를 예측하기 위한 데이터를 통계학자들에게 제공했다.", "한 상관관계 분석은 주황색 차들이 결함이 있을 가능성이 훨씬 적다는 것을 보여 줬다."]}, {"tag": "본문 5~7번", "ns": [5, 6, 7], "line": "우리는 곧 왜 그런지 [[think|생각하고]] 인과 가설의 함정에 빠진다.", "en": ["Even as we read this, we already think about why it might be so: Are orange-colored car owners likely to be car enthusiasts and take better care of their vehicles?", "Or, is it because orange-colored cars are more noticeable on the road and therefore less likely to be in accidents, so they’re in better condition when resold?", "Quickly we are caught in a web of competing causal hypotheses."], "kos": ["심지어 우리가 이것을 읽으면서도, 우리는 이미 왜 그럴지에 대해 생각한다. 주황색 차를 소유한 사람들이 자동차 애호가여서 그들의 차량을 더 잘 관리할 가능성이 있는가?", "아니면, 주황색 차들이 도로에서 더 눈에 띄고, 그래서 사고가 날 가능성이 적어 재판매될 때 그것들이 상태가 더 좋은 것이기 때문인가?", "곧 우리는 경쟁적인 인과 가설의 함정에 빠진다."]}, {"tag": "본문 8번", "ns": [8], "line": "그렇게 밝히려 할수록 상황은 [[cloudier|더 흐려진다]].", "en": ["But our attempts to illuminate things this way only make them cloudier."], "kos": ["하지만 이런 식으로 무언가를 설명하려는 우리의 시도는 그것들을 더 흐리게 만들 뿐이다."]}, {"tag": "본문 9~11번", "ns": [9, 10, 11], "line": "상관관계는 [[mathematically|수학적으로]] 보이지만 인과는 아니므로, 이유 설명은 미루는 게 낫다.", "en": ["Correlations exist; we can show them mathematically.", "We can’t easily do the same for causal links.", "So we would do well to hold off from trying to explain the reason behind the correlations."], "kos": ["상관관계는 존재하며 우리는 그것들을 수학적으로 보여 줄 수 있다.", "우리는 인과 관계에 대해서는 쉽게 똑같이 할 수 없다.", "따라서 우리는 상관관계의 배후에 있는 이유를 설명하려 하지 않는 것이 좋다."]}], "story": [{"a": "relatively", "form": "relatively", "n": 1, "sq": 1, "sum": "are [[fairly]] clear", "hook": "통찰이 비교적 분명하다는 relatively(비교적) → 요약문에서는 fairly(꽤)로 바뀌었어요.", "b": "fairly", "k": "비교적 → 꽤", "en": "Correlations are powerful because the insights they offer are relatively clear.", "ko": "상관관계는 그것들이 제공하는 통찰력이 비교적 명확하기 때문에 강력하다."}, {"a": "cover", "form": "covered", "n": 2, "sq": 1, "sum": "often [[hidden]] when", "hook": "인과 관계를 끌어오면 통찰이 가려진다는 covered up → 요약문에서는 hidden(숨겨진)으로 바뀌었어요.", "b": "hide", "k": "덮다 → 숨기다", "en": "These insights are often covered up when we bring causality back into the picture.", "ko": "이러한 통찰력은 종종 우리가 인과 관계를 그 상황으로 다시 가져올 때 가려진다."}, {"a": "defect", "form": "defects", "n": 4, "sq": 2, "sum": "likely to have [[faults]]", "hook": "주황색 차에 결함이 적다는 defects(결함) → 요약문에서는 faults(흠)로 바뀌었어요.", "b": "fault", "k": "결함 → 흠", "en": "A correlation analysis showed that orange-colored cars were far less likely to have defects.", "ko": "한 상관관계 분석은 주황색 차들이 결함이 있을 가능성이 훨씬 적다는 것을 보여 줬다."}, {"a": "think", "form": "think", "n": 5, "sq": 2, "sum": "start to [[speculate]] why", "hook": "우리는 이미 왜 그럴지 생각한다는 think → 요약문에서는 speculate(추측하다)로 바뀌었어요.", "b": "speculate", "k": "생각하다 → 추측하다", "en": "Even as we read this, we already think about why it might be so: Are orange-colored car owners likely to be car enthusiasts and take better care of their vehicles?", "ko": "심지어 우리가 이것을 읽으면서도, 우리는 이미 왜 그럴지에 대해 생각한다. 주황색 차를 소유한 사람들이 자동차 애호가여서 그들의 차량을 더 잘 관리할 가능성이 있는가?"}, {"a": "cloudier", "form": "cloudier", "n": 8, "sq": 3, "sum": "only [[confuses]] matters", "hook": "설명하려는 시도가 상황을 더 흐리게 만든다는 cloudier(더 흐린) → 요약문에서는 confuses(혼란스럽게 한다)로 바뀌었어요.", "b": "confuses", "k": "더 흐린 → 혼란스럽게 하다", "en": "But our attempts to illuminate things this way only make them cloudier.", "ko": "하지만 이런 식으로 무언가를 설명하려는 우리의 시도는 그것들을 더 흐리게 만들 뿐이다."}, {"a": "mathematically", "form": "mathematically", "n": 9, "sq": 3, "sum": "can be shown [[numerically]]", "hook": "상관관계는 수학적으로 보여 줄 수 있다는 mathematically → 요약문에서는 numerically(수치로)로 바뀌었어요.", "b": "numerically", "k": "수학적으로 → 수치로", "en": "Correlations exist; we can show them mathematically.", "ko": "상관관계는 존재하며 우리는 그것들을 수학적으로 보여 줄 수 있다."}], "passage": [{"n": 1, "en": "Correlations are powerful because the insights they offer are relatively clear.", "ko": "상관관계는 그것들이 제공하는 통찰력이 비교적 명확하기 때문에 강력하다."}, {"n": 2, "en": "These insights are often covered up when we bring causality back into the picture.", "ko": "이러한 통찰력은 종종 우리가 인과 관계를 그 상황으로 다시 가져올 때 가려진다."}, {"n": 3, "en": "For instance, a used-car dealer supplied data to statisticians to predict which of the vehicles available for purchase at an auction were likely to have problems.", "ko": "예를 들어, 한 중고차 딜러가 경매에서 구입할 수 있는 차량들 중 어떤 차량에 문제가 발생할 가능성이 있는지를 예측하기 위한 데이터를 통계학자들에게 제공했다."}, {"n": 4, "en": "A correlation analysis showed that orange-colored cars were far less likely to have defects.", "ko": "한 상관관계 분석은 주황색 차들이 결함이 있을 가능성이 훨씬 적다는 것을 보여 줬다."}, {"n": 5, "en": "Even as we read this, we already think about why it might be so: Are orange-colored car owners likely to be car enthusiasts and take better care of their vehicles?", "ko": "심지어 우리가 이것을 읽으면서도, 우리는 이미 왜 그럴지에 대해 생각한다. 주황색 차를 소유한 사람들이 자동차 애호가여서 그들의 차량을 더 잘 관리할 가능성이 있는가?"}, {"n": 6, "en": "Or, is it because orange-colored cars are more noticeable on the road and therefore less likely to be in accidents, so they’re in better condition when resold?", "ko": "아니면, 주황색 차들이 도로에서 더 눈에 띄고, 그래서 사고가 날 가능성이 적어 재판매될 때 그것들이 상태가 더 좋은 것이기 때문인가?"}, {"n": 7, "en": "Quickly we are caught in a web of competing causal hypotheses.", "ko": "곧 우리는 경쟁적인 인과 가설의 함정에 빠진다."}, {"n": 8, "en": "But our attempts to illuminate things this way only make them cloudier.", "ko": "하지만 이런 식으로 무언가를 설명하려는 우리의 시도는 그것들을 더 흐리게 만들 뿐이다."}, {"n": 9, "en": "Correlations exist; we can show them mathematically.", "ko": "상관관계는 존재하며 우리는 그것들을 수학적으로 보여 줄 수 있다."}, {"n": 10, "en": "We can’t easily do the same for causal links.", "ko": "우리는 인과 관계에 대해서는 쉽게 똑같이 할 수 없다."}, {"n": 11, "en": "So we would do well to hold off from trying to explain the reason behind the correlations.", "ko": "따라서 우리는 상관관계의 배후에 있는 이유를 설명하려 하지 않는 것이 좋다."}], "questions": [{"id": 1, "summary": "Correlations are strong because the insights they give are (A) clear, but those insights are often (B) when we bring cause-and-effect back into the picture.", "ko": "상관관계는 그것이 주는 통찰이 <b>(A) 꽤</b> 분명하기 때문에 강력하지만, 우리가 원인과 결과를 다시 끌어들이면 그 통찰은 종종 <b>(B) 가려진다</b>.", "opts": [["fairly", "revealed"], ["fairly", "hidden"], ["barely", "hidden"], ["barely", "revealed"], ["rarely", "strengthened"]], "optko": ["꽤 – 드러난", "꽤 – 가려진", "거의 ~ 않게 – 가려진", "거의 ~ 않게 – 드러난", "드물게 – 강해진"], "ans": 1, "wrong": ["revealed(드러난)가 틀려요. 인과 관계를 끌어오면 통찰이 오히려 가려져요(covered up).", null, "barely(간신히)가 틀려요. 상관관계가 주는 통찰은 비교적 명확해요(relatively clear).", "둘 다 틀려요. 통찰은 꽤 분명하고, 인과 관계를 끌어오면 가려져요.", "둘 다 틀려요. 통찰이 드물게 분명한 게 아니고, 강해지는 게 아니라 가려져요."], "evid": [{"n": 1, "hl": ["the insights they offer are relatively clear"]}, {"n": 2, "hl": ["covered up", "bring causality back into the picture"]}], "swaps": [["relatively", "fairly", "비교적 → 꽤"], ["cover", "hide", "덮다 → 숨기다"], ["causality", "cause-and-effect", "인과 관계 → 원인과 결과"]], "swapnote": "relatively(비교적)는 fairly(꽤)로, covered up(가려진)은 hidden(숨겨진)으로 바뀌었어요. causality(인과 관계)는 '원인과 결과'로 쉽게 풀어 읽어요.", "use": [{"w": "fairly", "ex": "The test was fairly easy.", "ko": "그 시험은 꽤 쉬웠다.", "wk": "꽤", "hk": "꽤"}, {"w": "hidden", "ex": "The key was hidden under a rock.", "ko": "열쇠는 바위 밑에 숨겨져 있었다.", "wk": "숨겨진, 가려진", "hk": "숨겨져"}], "flow": "본문 1번에서 상관관계는     if(o)h+=relBox(s);else if(REL[String(s.a).toLowerCase()]){var rr=REL[String(s.a).toLowerCase()];h+='<div class="hch">유 '+(1+rr.s.length)+(rr.a.length?' · 반 '+rr.a.length:'')+'</div>'}
    if(c&&!REL[String(s.a).toLowerCase()])h+='<button class="acc2" data-a="dt" data-v="s'+esc(s.id)+'">'+esc(c.tag)+' 줄거리<span>'+(on?'접기':'펼치기')+'</span></button>'+(on?'<div class="story">'+sceneLine(c.line,s.form)+'</div>':'');
    h+='</div>';
  });
  return h+'</div><p class="sumline">시험에서는 본문 단어가 뜻이 같은 다른 단어로 바뀌어 나와요.</p><button class="btn sec" data-a="home">목록으로</button>';
}
/* 자동 새로고침(기록 연동)이 일어나도 보던 문제로 되돌린다 */
try{var sv=JSON.parse(sessionStorage.getItem('vhyv')||'null');if(sv&&sv.p===location.pathname&&Date.now()-sv.t<600000&&sv.v&&sv.v!=='home'){view=sv.v;cur=sv.c||0;try{history.pushState({v:view},'');histPushed=true}catch(e){}}}catch(e){}
render();srvLoad();window.addEventListener('pageshow',srvLoad);
</script>
