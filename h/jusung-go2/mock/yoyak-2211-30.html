<script>
var DATA={"meta": {"sch": "jusung-go2", "src": "jusung-go2/mock/sx-data.js", "pidx": 1, "lesson": "22년 11월 30번", "title": "", "label": "", "page": "yoyak-2211-30"}, "scenes": [{"tag": "본문 2~3번", "ns": [2, 3], "line": "햇빛이 위에서 비추면 물체는 위가 밝고 아래로 갈수록 어두워진다.", "en": ["When sunlight illuminates an object from above, the object will be brightest on top.", "The color of the object will gradually shade darker toward the bottom."], "kos": ["햇빛이 물체를 위에서 비출 때, 그 물체는 맨 위에서 가장 밝을 것이다.", "물체의 색깔은 맨 아래로 향할수록 점차 더 어두운색으로 음영이 생기게 될 것이다."]}, {"tag": "본문 4번", "ns": [4], "line": "이 음영이 [[depth|깊이감]]을 주어 모양을 [[distinguish|구별]]하게 해 준다.", "en": ["This shading gives the object depth and allows the viewer to distinguish its shape."], "kos": ["이러한 음영은 물체에 깊이감(입체감)를 주고 보는 사람이 그것의 모양을 식별하게 해 준다."]}, {"tag": "본문 5번", "ns": [5], "line": "그래서 배경과 같은 색이어도 빛을 받으면 쉽게 [[visible|눈에 보인다]].", "en": ["Thus even if an animal is exactly, but uniformly, the same color as the substrate, it will be easily visible when illuminated."], "kos": ["따라서 비록 동물이 정확히, 하지만 균일하게, 밑바탕과 같은 색일지라도 빛이 비춰질 때 쉽게 눈에 띌 것이다."]}, {"tag": "본문 7번", "ns": [7], "line": "하지만 대부분 동물은 위가 어두워서, 어두운 등이 빛을 받으면 [[lightened|밝아진다]].", "en": ["When they are illuminated from above, the darker back is lightened and the lighter belly is shaded."], "kos": ["그들이 위에서 빛을 받을 때, 더 어두운 등은 밝아지고 더 밝은 복부는 음영이 생긴다."]}, {"tag": "본문 8번", "ns": [8], "line": "동물은 한 가지 색처럼 되어 배경에 쉽게 [[blends|섞인다]].", "en": ["The animal thus appears to be a single color and easily blends in with the substrate."], "kos": ["따라서 동물은 하나의 색처럼 보이고 밑바탕과 쉽게 섞인다."]}], "story": [{"a": "depth", "form": "depth", "n": 4, "sq": 1, "sum": "this shading gives the object [[dimension]]", "hook": "음영이 물체에 입체감을 준다는 문장의 depth(깊이) → 요약문에서는 dimension(입체감)으로 바꿨어요.", "b": "dimension", "k": "깊이감 → 입체감", "en": "This shading gives the object depth and allows the viewer to distinguish its shape.", "ko": "이러한 음영은 물체에 깊이감(입체감)를 주고 보는 사람이 그것의 모양을 식별하게 해 준다."}, {"a": "distinguish", "form": "distinguish", "n": 4, "sq": 1, "sum": "viewers can [[recognize]] its shape", "hook": "보는 사람이 모양을 구별한다는 문장의 distinguish(구별하다) → 요약문에서는 recognize(알아보다)로 바꿨어요.", "b": "recognize", "k": "구별하다 → 알아보다", "en": "This shading gives the object depth and allows the viewer to distinguish its shape.", "ko": "이러한 음영은 물체에 깊이감(입체감)를 주고 보는 사람이 그것의 모양을 식별하게 해 준다."}, {"a": "visible", "form": "visible", "n": 5, "sq": 2, "sum": "is easily [[noticeable]] under light from above", "hook": "같은 색이어도 빛을 받으면 눈에 보인다는 문장의 visible(눈에 보이는) → 요약문에서는 noticeable(눈에 띄는)로 바꿨어요.", "b": "noticeable", "k": "보이는 → 눈에 띄는", "en": "Thus even if an animal is exactly, but uniformly, the same color as the substrate, it will be easily visible when illuminated.", "ko": "따라서 비록 동물이 정확히, 하지만 균일하게, 밑바탕과 같은 색일지라도 빛이 비춰질 때 쉽게 눈에 띌 것이다."}, {"a": "lighten", "form": "lightened", "n": 7, "sq": 3, "sum": "is [[brightened]]", "hook": "어두운 등이 빛을 받아 환해진다는 문장의 lighten(밝아지다) → 요약문에서는 brighten(밝아지다)으로 바꿨어요.", "b": "brighten", "k": "밝아지다 → 밝아지다", "en": "When they are illuminated from above, the darker back is lightened and the lighter belly is shaded.", "ko": "그들이 위에서 빛을 받을 때, 더 어두운 등은 밝아지고 더 밝은 복부는 음영이 생긴다."}, {"a": "blend", "form": "blends", "n": 8, "sq": 3, "sum": "and [[merges]] into its background", "hook": "동물이 배경에 슬쩍 섞인다는 문장의 blend(섞이다) → 요약문에서는 merge(합쳐지다)로 바꿨어요.", "b": "merge", "k": "섞이다 → 합쳐지다", "en": "The animal thus appears to be a single color and easily blends in with the substrate.", "ko": "따라서 동물은 하나의 색처럼 보이고 밑바탕과 쉽게 섞인다."}], "passage": [{"n": 1, "en": "Countershading is the process of optical flattening that provides camouflage to animals.", "ko": "카운터셰이딩(명암역위형보호색)은 동물에게 위장을 제공하는 시각적으로 평평하게 하는 과정이다."}, {"n": 2, "en": "When sunlight illuminates an object from above, the object will be brightest on top.", "ko": "햇빛이 물체를 위에서 비출 때, 그 물체는 맨 위에서 가장 밝을 것이다."}, {"n": 3, "en": "The color of the object will gradually shade darker toward the bottom.", "ko": "물체의 색깔은 맨 아래로 향할수록 점차 더 어두운색으로 음영이 생기게 될 것이다."}, {"n": 4, "en": "This shading gives the object depth and allows the viewer to distinguish its shape.", "ko": "이러한 음영은 물체에 깊이감(입체감)를 주고 보는 사람이 그것의 모양을 식별하게 해 준다."}, {"n": 5, "en": "Thus even if an animal is exactly, but uniformly, the same color as the substrate, it will be easily visible when illuminated.", "ko": "따라서 비록 동물이 정확히, 하지만 균일하게, 밑바탕과 같은 색일지라도 빛이 비춰질 때 쉽게 눈에 띌 것이다."}, {"n": 6, "en": "Most animals, however, are darker above than they are below.", "ko": "그러나 대부분의 동물은 아랫부분보다 윗부분이 더 어둡다."}, {"n": 7, "en": "When they are illuminated from above, the darker back is lightened and the lighter belly is shaded.", "ko": "그들이 위에서 빛을 받을 때, 더 어두운 등은 밝아지고 더 밝은 복부는 음영이 생긴다."}, {"n": 8, "en": "The animal thus appears to be a single color and easily blends in with the substrate.", "ko": "따라서 동물은 하나의 색처럼 보이고 밑바탕과 쉽게 섞인다."}, {"n": 9, "en": "This pattern of coloration, or countershading, destroys the visual impression of shape in the organism.", "ko": "이러한 형태의 배색 즉, 카운터셰이딩은 생물체의 모양의 시각적 인상을 파괴한다."}, {"n": 10, "en": "It allows the animal to blend in with its background.", "ko": "그것은 동물이 그것의 배경과 섞이게 해 준다."}], "questions": [{"id": 1, "summary": "Light from above makes the top of an object bright and its bottom gradually darker, and this shading gives the object (A) so that viewers can (B) its shape.", "ko": "위에서 오는 빛은 물체의 위쪽은 밝게, 아래쪽은 점차 어둡게 만들고, 이 음영은 물체에 <b>(A) 입체감</b>을 주어 보는 사람이 그 모양을 <b>(B) 알아볼</b> 수 있게 한다.", "opts": [["dimension", "hide"], ["dimension", "recognize"], ["flatness", "recognize"], ["flatness", "hide"], ["brightness", "change"]], "optko": ["입체감 – 숨기다", "입체감 – 알아보다", "평평함 – 알아보다", "평평함 – 숨기다", "밝기 – 바꾸다"], "ans": 1, "wrong": ["hide(숨기다)가 틀려요. 음영 덕분에 모양을 숨기는 게 아니라 알아보게 돼요.", null, "flatness(평평함)가 틀려요. 음영은 물체에 깊이감(depth)을 줘요.", "둘 다 틀려요. 음영은 평평하게 만들지도, 모양을 숨기지도 않아요.", "둘 다 틀려요. 본문은 밝기를 바꾼다고 하지 않고, 깊이감을 주어 모양을 구별하게 한다고 해요."], "evid": [{"n": 3, "hl": ["gradually shade darker toward the bottom"]}, {"n": 4, "hl": ["gives the object depth", "distinguish its shape"]}], "swaps": [["depth", "dimension", "깊이감 → 입체감"]     h+='<div class="swr"><div class="swq"><span class="qn">'+s.sq+'번</span><span class="sa">'+words(s.a)+(fl?'<small class="flag">'+fl+'번 틀림</small>':'')+'</span><span class="sb">'+(o?'<em>'+words(s.b)+'</em>'+esc(s.k):'→ ?')+'</span>'+sayBtn(s.a,'듣기')+(o?sayBtn(s.b,'정답 듣기'):'')+'<button data-a="rv" data-v="'+esc(s.id)+'">'+(o?'가리기':'확인')+'</button><button data-a="star" data-v="'+esc(s.id)+'" class="stb'+(STAR[s.id]?' on':'')+'">별표</button></div>';
    if(o)h+=relBox(s);else if(REL[String(s.a).toLowerCase()]){var rr=REL[String(s.a).toLowerCase()];h+='<div class="hch">유 '+(1+rr.s.length)+(rr.a.length?' · 반 '+rr.a.length:'')+'</div>'}
    if(c&&!REL[String(s.a).toLowerCase()])h+='<button class="acc2" data-a="dt" data-v="s'+esc(s.id)+'">'+esc(c.tag)+' 줄거리<span>'+(on?'접기':'펼치기')+'</span></button>'+(on?'<div class="story">'+sceneLine(c.line,s.form)+'</div>':'');
    h+='</div>';
  });
  return h+'</div><p class="sumline">시험에서는 본문 단어가 뜻이 같은 다른 단어로 바뀌어 나와요.</p><button class="btn sec" data-a="home">목록으로</button>';
}
/* 자동 새로고침(기록 연동)이 일어나도 보던 문제로 되돌린다 */
try{var sv=JSON.parse(sessionStorage.getItem('vhyv')||'null');if(sv&&sv.p===location.pathname&&Date.now()-sv.t<600000&&sv.v&&sv.v!=='home'){view=sv.v;cur=sv.c||0;try{history.pushState({v:view},'');histPushed=true}catch(e){}}}catch(e){}
render();srvLoad();window.addEventListener('pageshow',srvLoad);
</script>
