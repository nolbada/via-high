var DATA={"meta": {"sch": "jusung-go2", "src": "jusung-go2/mock/sx-data.js", "pidx": 14, "lesson": "23년 11월 32번", "title": "", "label": "", "page": "yoyak-2311-32"}, "scenes": [{"tag": "본문 1번", "ns": [1], "line": "사건 뒤에 접한 정보가 기억에 [[influence|영향을 준다]].", "en": ["Information encountered after an event can influence subsequent remembering."], "kos": ["사건 후에 마주친 정보는 이후의 기억하는 것에 영향을 미칠 수 있다."]}, {"tag": "본문 2번", "ns": [2], "line": "기억이 약하거나 시간이 흘러 [[degraded|저하되었으면]] 외부 정보가 쉽게 섞인다.", "en": ["External information can easily integrate into a witness’s memory, especially if the event was poorly encoded or the memory is from a distant event, in which case time and forgetting have degraded the original memory."], "kos": ["특히 사건이 불충분하게 부호화되었거나, 그 기억이 시간과 망각이 원래의 기억을 저하시켜 온 먼 사건으로부터 온 것이라면, 외부 정보는 목격자의 기억에 쉽게 통합될 수 있다."]}, {"tag": "본문 3번", "ns": [3], "line": "원래 정보가 줄면 새 정보를 덜 [[rejected|거부한다]].", "en": ["With reduced information available in memory with which to confirm the validity of post-event misinformation, it is less likely that this new information will be rejected."], "kos": ["사건 후의 잘못된 정보의 유효성을 확인하기 위해 기억에서 사용할 수 있는 줄어든 정보를 가지면, 이 새로운 정보가 덜 거부될 듯하다."]}, {"tag": "본문 4번", "ns": [4], "line": "목격자 생각과 맞으면 원래 경험처럼 [[integrated|통합된다]].", "en": ["Instead, especially when it fits the witness’s current thinking and can be used to create a story that makes sense to him or her, it may be integrated as part of the original experience."], "kos": ["대신에, 특히 그것이 목격자의 현재 생각과 맞고 그 또는 그녀에게 이해되는 하나의 이야기를 만드는 데 사용될 수 있을 때, 그것은 원래 경험의 일부로서 통합될 수 있다."]}, {"tag": "본문 5~7번", "ns": [5, 6, 7], "line": "이 과정은 흔히 [[unconscious|무의식적]]이라 시간이 지나면 출처조차 모른다.", "en": ["This process can be explicit (i.e., the witness knows it is happening), but it is often unconscious.", "That is, the witness might find himself or herself thinking about the event differently without awareness.", "Over time, the witness may not even know the source of information that led to the (new) memory."], "kos": ["이 과정은 명시적일 수 있지만(즉, 목격자는 그것이 일어나고 있다는 것을 알고 있다), 그것은 흔히 무의식적이다.", "즉, 목격자는 의식하지 못한 채 그 사건에 대해 다르게 생각하는 그 자신 또는 그녀 자신을 발견할지도 모른다.", "시간이 지남에 따라, 목격자는 (새로운) 기억으로 이끄는 정보의 출처조차 모를지도 모른다."]}, {"tag": "본문 8번", "ns": [8], "line": "잘못된 정보는 [[discussions|토론]], 검색, 면담, 법정 어디서나 만난다.", "en": ["Sources of misinformation in forensic contexts can be encountered anywhere, from discussions with other witnesses to social media searches to multiple interviews with investigators or other legal professionals, and even in court."], "kos": ["법정의 상황에서의 잘못된 정보의 출처는 다른 목격자들과의 토론에서부터 소셜 미디어 검색, 수사관이나 다른 법률 전문가들과의 여러 번의 면담, 그리고 심지어 법정에서까지 어디에서나 마주쳐질 수 있다."]}], "story": [{"a": "influence", "form": "influence", "n": 1, "sq": 1, "sum": "can [[affect]] how it is later remembered", "hook": "사건 후 정보가 이후 기억에 영향을 준다는 influence → 요약문에서는 affect(영향을 미치다)로 바뀌었어요.", "b": "affect", "k": "영향을 주다 → 영향을 미치다", "en": "Information encountered after an event can influence subsequent remembering.", "ko": "사건 후에 마주친 정보는 이후의 기억하는 것에 영향을 미칠 수 있다."}, {"a": "degrade", "form": "degraded", "n": 2, "sq": 1, "sum": "the memory has [[faded]] over time", "hook": "시간과 망각이 원래 기억을 약하게 했다는 degraded(저하시켰다) → 요약문에서는 faded(흐려졌다)로 바뀌었어요.", "b": "fade", "k": "저하시키다 → 흐려지다", "en": "External information can easily integrate into a witness’s memory, especially if the event was poorly encoded or the memory is from a distant event, in which case time and forgetting have degraded the original memory.", "ko": "특히 사건이 불충분하게 부호화되었거나, 그 기억이 시간과 망각이 원래의 기억을 저하시켜 온 먼 사건으로부터 온 것이라면, 외부 정보는 목격자의 기억에 쉽게 통합될 수 있다."}, {"a": "reject", "form": "rejected", "n": 3, "sq": 2, "sum": "less likely to be [[dismissed]]", "hook": "새 정보를 덜 거부하게 된다는 rejected(거부된) → 요약문에서는 dismissed(물리쳐진)로 바뀌었어요.", "b": "dismiss", "k": "거부하다 → 물리치다", "en": "With reduced information available in memory with which to confirm the validity of post-event misinformation, it is less likely that this new information will be rejected.", "ko": "사건 후의 잘못된 정보의 유효성을 확인하기 위해 기억에서 사용할 수 있는 줄어든 정보를 가지면, 이 새로운 정보가 덜 거부될 듯하다."}, {"a": "integrate", "form": "integrated", "n": 4, "sq": 2, "sum": "it may be [[merged]] into the original memory", "hook": "원래 경험의 일부로 통합된다는 integrated → 요약문에서는 merged(합쳐진)로 바뀌었어요.", "b": "merge", "k": "통합하다 → 합치다", "en": "Instead, especially when it fits the witness’s current thinking and can be used to create a story that makes sense to him or her, it may be integrated as part of the original experience.", "ko": "대신에, 특히 그것이 목격자의 현재 생각과 맞고 그 또는 그녀에게 이해되는 하나의 이야기를 만드는 데 사용될 수 있을 때, 그것은 원래 경험의 일부로서 통합될 수 있다."}, {"a": "unconscious", "form": "unconscious", "n": 5, "sq": 3, "sum": "often [[unnoticed]]", "hook": "흔히 의식하지 못한 채 일어난다는 unconscious(무의식적인) → 요약문에서는 unnoticed(알아채지 못한)로 바뀌었어요.", "b": "unnoticed", "k": "무의식적인 → 알아채지 못한", "en": "This process can be explicit (i.e., the witness knows it is happening), but it is often unconscious.", "ko": "이 과정은 명시적일 수 있지만(즉, 목격자는 그것이 일어나고 있다는 것을 알고 있다), 그것은 흔히 무의식적이다."}, {"a": "discussion", "form": "discussions", "n": 8, "sq": 3, "sum": "including [[conversations]] with other witnesses", "hook": "다른 목격자들과의 토론이 출처가 된다는 discussions → 요약문에서는 conversations(대화)로 바뀌었어요.", "b": "conversation", "k": "토론 → 대화", "en": "Sources of misinformation in forensic contexts can be encountered anywhere, from discussions with other witnesses to social media searches to multiple interviews with investigators or other legal professionals, and even in court.", "ko": "법정의 상황에서의 잘못된 정보의 출처는 다른 목격자들과의 토론에서부터 소셜 미디어 검색, 수사관이나 다른 법률 전문가들과의 여러 번의 면담, 그리고 심지어 법정에서까지 어디에서나 마주쳐질 수 있다."}], "passage": [{"n": 1, "en": "Information encountered after an event can influence subsequent remembering.", "ko": "사건 후에 마주친 정보는 이후의 기억하는 것에 영향을 미칠 수 있다."}, {"n": 2, "en": "External information can easily integrate into a witness’s memory, especially if the event was poorly encoded or the memory is from a distant event, in which case time and forgetting have degraded the original memory.", "ko": "특히 사건이 불충분하게 부호화되었거나, 그 기억이 시간과 망각이 원래의 기억을 저하시켜 온 먼 사건으로부터 온 것이라면, 외부 정보는 목격자의 기억에 쉽게 통합될 수 있다."}, {"n": 3, "en": "With reduced information available in memory with which to confirm the validity of post-event misinformation, it is less likely that this new information will be rejected.", "ko": "사건 후의 잘못된 정보의 유효성을 확인하기 위해 기억에서 사용할 수 있는 줄어든 정보를 가지면, 이 새로운 정보가 덜 거부될 듯하다."}, {"n": 4, "en": "Instead, especially when it fits the witness’s current thinking and can be used to create a story that makes sense to him or her, it may be integrated as part of the original experience.", "ko": "대신에, 특히 그것이 목격자의 현재 생각과 맞고 그 또는 그녀에게 이해되는 하나의 이야기를 만드는 데 사용될 수 있을 때, 그것은 원래 경험의 일부로서 통합될 수 있다."}, {"n": 5, "en": "This process can be explicit (i.e., the witness knows it is happening), but it is often unconscious.", "ko": "이 과정은 명시적일 수 있지만(즉, 목격자는 그것이 일어나고 있다는 것을 알고 있다), 그것은 흔히 무의식적이다."}, {"n": 6, "en": "That is, the witness might find himself or herself thinking about the event differently without awareness.", "ko": "즉, 목격자는 의식하지 못한 채 그 사건에 대해 다르게 생각하는 그 자신 또는 그녀 자신을 발견할지도 모른다."}, {"n": 7, "en": "Over time, the witness may not even know the source of information that led to the (new) memory.", "ko": "시간이 지남에 따라, 목격자는 (새로운) 기억으로 이끄는 정보의 출처조차 모를지도 모른다."}, {"n": 8, "en": "Sources of misinformation in forensic contexts can be encountered anywhere, from discussions with other witnesses to social media searches to multiple interviews with investigators or other legal professionals, and even in court.", "ko": "법정의 상황에서의 잘못된 정보의 출처는 다른 목격자들과의 토론에서부터 소셜 미디어 검색, 수사관이나 다른 법률 전문가들과의 여러 번의 면담, 그리고 심지어 법정에서까지 어디에서나 마주쳐질 수 있다."}], "questions": [{"id": 1, "summary": "Information met after an event can (A) how it is later remembered, and it is especially easy to mix into memory when the event was poorly recorded or the memory has (B) over time.", "ko": "사건 후에 접한 정보는 그 사건이 나중에 기억되는 방식에 <b>(A) 영향을 줄</b> 수 있고, 사건이 제대로 기록되지 않았거나 시간이 지나며 기억이 <b>(B) 흐려졌을</b> 때 특히 기억에 섞여 들어가기 쉽다.", "opts": [["affect", "sharpened"], ["ignore", "faded"], ["affect", "faded"], ["ignore", "sharpened"], ["prevent", "improved"]], "optko": ["영향을 주다 – 또렷해졌다", "무시하다 – 흐려졌다", "영향을 주다 – 흐려졌다", "무시하다 – 또렷해졌다", "막다 – 나아졌다"], "ans": 2, "wrong": ["sharpened(또렷해졌다)가 틀려요. 기억이 시간이 지나 약해졌을(degraded) 때 외부 정보가 쉽게 섞여요.", "ignore(무시하다)가 틀려요. 사건 후 정보는 기억을 무시하는 게 아니라 이후 기억에 영향을 줘요(influence).", null, "둘 다 틀려요. 정보는 기억에 영향을 주고, 기억은 또렷해지는 게 아니라 약해져요.", "둘 다 틀려요. 영향을 막는다는 말도, 기억이 나아진다는 말도 본문과 반대예요."], "evid": [{"n": 1, "hl": ["Information encountered after an event", "influence subsequent remembering"]}, {"n": 2, "hl": ["poorly encoded", "degraded the original memory"]}], "swaps": [["influence", "affect", "영향을 주다 → 영향을 미치다"], ["degrade", "fade", "저하시키다 → 흐려지다"], ["encounter", "meet", "마주치다 → 만나다"]], "swapnote": "influence(영향을 주다)는 affect(영향을 미치다)로, degraded(저하된)는 faded(흐려진)로 바뀌었어요. 기억이 '희미해졌다'고 생각하면 쉬워요.", "use": [{"w": "affect", "ex": "Weather can affect your mood.", "ko": "날씨는 기분에 영향을 미칠 수 있다.", "wk": "영향을 미치다", "hk": "영향을 미칠"}, {"w": "fade", "ex": "The colors fade in the sun.", "ko": "색은 햇빛에 바랜다.", "wk": "흐려지다, 바래다", "hk": "바랜다"}], "flow": "본문 1번에서 사건 후에 접한 정보가 나중 기억에 영향을 준다고 하고 → 2번에서 특히 사건이 불충분하게 저장됐거나 시간이 흘러 기억이 약해졌을 때 외부 정보가 쉽게 섞인다고 설명해요.", "jd": [["Information met after an event can [[affect]] how it is later remembered,", "사건 후에 접한 정보는 그것이 나중에 기억되는 방식에 [[영향을 줄]] 수 있고,"], ["and it is especially easy to mix into memory", "특히 기억에 섞여 들어가기 쉽다"], ["when the event was poorly recorded", "사건이 제대로 기록되지 않았거나"], ["or the memory has [[faded]] over time.", "시간이 지나며 기억이 [[흐려졌을]] 때."]], "fc": [["본문 1번", "사건 뒤에 접한 정보가 기억에 영향", "나중에 기억하는 방식이 달라져요."], ["본문 2번", "기억이 약할수록 외부 정보가 쉽게 섞임", "불충분하게 저장됐거나 오래된 기억이에요."], ["정답 포인트", "{{influence|영향을 주다}} = {{affect|영향을 미치다}}, {{degrade|저하시키다}} → {{fade|흐려지다}}", "본문 단어를 쉬운 말로 바꿨어요."]], "evid_full": [{"en": "Information encountered after an event can influence subsequent remembering.", "ko": "사건 후에 마주친 정보는 이후의 기억하는 것에 영향을 미칠 수 있다.", "hl": ["Information encountered after an event", "influence subsequent remembering"], "hlko": ["사건 후에 마주친 정보", "이후의 기억하는 것에 영향을 미칠"], "n": 1}, {"en": "External information can easily integrate into a witness’s memory, especially if the event was poorly encoded or the memory is from a distant event, in which case time and forgetting have degraded the original memory.", "ko": "특히 사건이 불충분하게 부호화되었거나, 그 기억이 시간과 망각이 원래의 기억을 저하시켜 온 먼 사건으로부터 온 것이라면, 외부 정보는 목격자의 기억에 쉽게 통합될 수 있다.", "hl": ["poorly encoded", "degraded the original memory"], "hlko": ["불충분하게 부호화되었거나", "원래의 기억을 저하시켜 온"], "n": 2}]}, {"id": 2, "summary": "With less original information left to check it against, new misinformation is less likely to be (A), and if it fits what the witness already thinks, it may be (B) into the original memory.", "ko": "대조해 볼 원래 정보가 더 적게 남아 있으면 새로운 잘못된 정보는 덜 <b>(A) 거부되고</b>, 목격자가 이미 생각하는 것과 맞으면 원래 기억 속에 <b>(B) 합쳐질</b> 수 있다.", "opts": [["dismissed", "removed"], ["accepted", "merged"], ["accepted", "removed"], ["accepted", "hidden"], ["dismissed", "merged"]], "optko": ["거부된 – 제거된", "받아들여진 – 합쳐진", "받아들여진 – 제거된", "받아들여진 – 숨겨진", "거부된 – 합쳐진"], "ans": 4, "wrong": ["removed(제거된)가 틀려요. 맞는 정보는 지워지는 게 아니라 원래 경험의 일부로 통합돼요(integrated).", "accepted(받아들여진)가 틀려요. 덜 받아들여지는 게 아니라 덜 거부돼요(rejected). 말이 거꾸로예요.", "둘 다 틀려요. 덜 거부된다고 했고, 정보는 제거되지 않고 기억에 합쳐져요.", "둘 다 틀려요. 덜 거부된다고 했고, 정보는 숨는 게 아니라 기억의 일부가 돼요.", null], "evid": [{"n": 3, "hl": ["less likely that this new information will be rejected"]}, {"n": 4, "hl": ["fits the witness’s current thinking", "integrated as part of the original experience"]}], "swaps": [["reject", "dismiss", "거부하다 → 물리치다"], ["integrate", "merge", "통합하다 → 합치다"], ["validity", "accuracy", "유효성 → 정확성"]], "swapnote": "rejected(거부된)는 dismissed(물리쳐진)로, integrated(통합된)는 merged(합쳐진)로 바뀌었어요. 새 정보가 기억에 '스며든다'고 생각하면 돼요.", "use": [{"w": "dismiss", "ex": "The judge will dismiss the case.", "ko": "판사는 그 사건을 기각할 것이다.", "wk": "기각하다, 물리치다", "hk": "기각할"}, {"w": "merge", "ex": "Two rivers merge near the town.", "ko": "두 강은 마을 근처에서 합쳐진다.", "wk": "합쳐지다", "hk": "합쳐진다"}], "flow": "본문 3번에서 원래 기억이 줄어서 새 잘못된 정보를 덜 거부하게 된다고 하고 → 4번에서 Instead(대신), 특히 목격자의 생각과 맞으면 원래 경험의 일부로 합쳐진다고 이어요.", "jd": [["With less original information left to check it against,", "대조해 볼 원래 정보가 더 적게 남아 있으면,"], ["new misinformation is less likely to be [[dismissed]],", "새로운 잘못된 정보는 덜 [[거부될]] 것이고,"], ["and if it fits what the witness already thinks,", "목격자가 이미 생각하는 것과 맞으면,"], ["it may be [[merged]] into the original memory.", "그것은 원래 기억 속에 [[합쳐질]] 수 있다."]], "fc": [["본문 3번", "원래 정보가 줄면 새 정보를 덜 거부", "확인할 재료가 적어서예요."], ["본문 4번", "특히 목격자의 생각과 맞으면 원래 경험처럼 합쳐짐", "Instead(대신)로 이어져요."], ["정답 포인트", "{{reject|거부하다}} → {{dismiss|물리치다}}, {{integrate|통합하다}} = {{merge|합치다}}", "새 정보가 기억에 스며들어요."]], "evid_full": [{"en": "With reduced information available in memory with which to confirm the validity of post-event misinformation, it is less likely that this new information will be rejected.", "ko": "사건 후의 잘못된 정보의 유효성을 확인하기 위해 기억에서 사용할 수 있는 줄어든 정보를 가지면, 이 새로운 정보가 덜 거부될 듯하다.", "hl": ["less likely that this new information will be rejected"], "hlko": ["이 새로운 정보가 덜 거부될 듯하다"], "n": 3}, {"en": "Instead, especially when it fits the witness’s current thinking and can be used to create a story that makes sense to him or her, it may be integrated as part of the original experience.", "ko": "대신에, 특히 그것이 목격자의 현재 생각과 맞고 그 또는 그녀에게 이해되는 하나의 이야기를 만드는 데 사용될 수 있을 때, 그것은 원래 경험의 일부로서 통합될 수 있다.", "hl": ["fits the witness’s current thinking", "integrated as part of the original experience"], "hlko": ["목격자의 현재 생각과 맞고", "원래 경험의 일부로서 통합될 수 있다"], "n": 4}]}, {"id": 3, "summary": "This blending is often (A), so over time a witness may forget where the new information came from, and misleading information can come from many places, including (B) with other witnesses and even court.", "ko": "이런 섞임은 흔히 <b>(A) 알아채지 못한 채</b> 일어나서 시간이 지나면 목격자는 새 정보가 어디서 왔는지 잊을 수 있고, 잘못된 정보는 다른 목격자들과의 <b>(B) 대화</b>와 심지어 법정을 포함해 여러 곳에서 올 수 있다.", "opts": [["unnoticed", "punishments"], ["unnoticed", "conversations"], ["deliberate", "conversations"], ["deliberate", "punishments"], ["obvious", "rewards"]], "optko": ["알아채지 못한 – 처벌", "알아채지 못한 – 대화", "의도적인 – 대화", "의도적인 – 처벌", "뻔한 – 보상"], "ans": 1, "wrong": ["punishments(처벌)가 틀려요. 잘못된 정보의 출처는 목격자들과의 토론(discussions) 같은 것들이에요.", null, "deliberate(의도적인)가 틀려요. 이 과정은 흔히 무의식적이에요(unconscious).", "둘 다 틀려요. 의도적이기보다 무의식적이고, 출처는 처벌이 아니라 대화·검색·면담이에요.", "둘 다 틀려요. 뻔한 게 아니라 무의식적이고, 보상은 출처로 나오지 않아요."], "evid": [{"n": 5, "hl": ["it is often unconscious"]}, {"n": 7, "hl": ["may not even know the source of information"]}, {"n": 8, "hl": ["from discussions with other witnesses"]}], "swaps": [["unconscious", "unnoticed", "무의식적인 → 알아채지 못한"], ["discussion", "conversation", "토론 → 대화"], ["source", "origin", "출처 → 근원"]], "swapnote": "unconscious(무의식적인)는 unnoticed(알아채지 못한)로, discussions(토론)는 conversations(대화)로 바뀌었어요. 쉬운 말로 갈아 끼운 거예요.", "use": [{"w": "unnoticed", "ex": "The small mistake went unnoticed.", "ko": "그 작은 실수는 알아채지 못한 채 지나갔다.", "wk": "알아채지 못한", "hk": "알아채지 못한"}, {"w": "conversation", "ex": "We had a long conversation.", "ko": "우리는 긴 대화를 나눴다.", "wk": "대화", "hk": "대화를"}], "flow": "본문 5~6번에서 이 과정은 흔히 무의식적이라 자기도 모르게 생각이 달라진다고 하고 → 7번에서 시간이 지나면 정보의 출처조차 모른다고 하고 → 8번에서 잘못된 정보는 대화·검색·면담·법정 어디서나 만날 수 있다고 끝내요.", "jd": [["This blending is often [[unnoticed]],", "이런 섞임은 흔히 [[알아채지 못한 채]] 일어나서,"], ["so over time a witness may forget", "시간이 지나면 목격자는 잊을 수 있다"], ["where the new information came from,", "새 정보가 어디서 왔는지를,"], ["and misleading information can come from many places,", "그리고 잘못된 정보는 여러 곳에서 올 수 있다,"], ["including [[conversations]] with other witnesses and even court.", "다른 목격자들과의 [[대화]]와 심지어 법정을 포함해서."]], "fc": [["본문 5~6번", "이 과정은 흔히 무의식적", "자기도 모르게 생각이 달라져요."], ["본문 7번", "시간이 지나면 출처조차 모른다", "새 기억이 어디서 왔는지 잊어요."], ["본문 8번", "잘못된 정보는 어디서나 만날 수 있다", "토론, 검색, 면담, 법정까지요."], ["정답 포인트", "{{unconscious|무의식적인}} = {{unnoticed|알아채지 못한}}, {{discussion|토론}} → {{conversation|대화}}", "쉬운 말로 바꿔 읽어요."]], "evid_full": [{"en": "This process can be explicit (i.e., the witness knows it is happening), but it is often unconscious.", "ko": "이 과정은 명시적일 수 있지만(즉, 목   else if(act==='next'){if(cur<Qs.length-1)go('q',cur+1);else go('res')}
  else if(act==='res')go('res');
  else if(act==='notes')go('notes');
  else if(act==='resume'){var f=firstOpen();if(f<0)go('res');else go('q',f)}
  else if(act==='reset'){PR={a:{}};jset(K_PROG,PR);go('home')}
  else if(act==='filt'){filt=v;render()}
  else if(act==='chk'){go('chk')}
  else if(act==='sw'){go('sw')}
  else if(act==='rvall'){var o=v==='open';swList().forEach(function(s){if(o){swOpen[s.id]=true;pushSw(s.id)}else delete swOpen[s.id]});render()}
  else if(act==='dt'){swD[v]=!swD[v];render()}
  else if(act==='rv'){swOpen[v]=!swOpen[v];if(swOpen[v])pushSw(v);render()}
  else if(act==='mean'){var m=document.getElementById('m_'+v);if(m)m.style.display=m.style.display==='block'?'none':'block'}
});
function pick(i){
  var q=Qs[cur];if(PR.a[q.id]!==undefined)return;
  PR.a[q.id]=i;jset(K_PROG,PR);recordYy(q,i);render();
}
/* 점수 기록: vhy:<학교> = {<페이지>:{<문제>:{n:푼 횟수,w:틀린 횟수,k:마지막 정답(1/0),c:고른 번호,t:시각}}} -> REC 로 자동 연동(선생님 화면) */
function recordYy(q,i){
  try{
    var K='vhy:'+SCH,P=location.pathname.split('/').slice(-2).join('/'),Y=jget(K,{});
    var pg=Y[P]||(Y[P]={}),e=pg[q.id]||(pg[q.id]={n:0,w:0});
    e.n=(e.n||0)+1;if(i!==q.ans)e.w=(e.w||0)+1;e.k=(i===q.ans?1:0);e.c=i;e.t=Date.now();
    jset(K,Y);
  }catch(x){}
  /* 바꿔 말하기 단어는 푼 즉시 모두 선생님 질문 목록에 올린다 */
  try{swList().forEach(function(s){pushSw(s.id)})}catch(x){}
}


function jdHtml(q){
  var h='<div class="sl">';
  q.jd.forEach(function(c){
    var en=c[0].split(/(\[\[.*?\]\])/).map(function(s){var m=s.match(/^\[\[(.*)\]\]$/);return m?'<mark>'+words(m[1])+'</mark>':words(s)}).join('');
    var ko=c[1].split(/(\[\[.*?\]\])/).map(function(s){var m=s.match(/^\[\[(.*)\]\]$/);return m?'<mark>'+esc(m[1])+'</mark>':esc(s)}).join('');
    h+='<div class="r"><b>'+en+'</b><span>'+ko+'</span></div>';
  });
  return h+'</div>';
}
function pushSw(id){
  if(String(id).indexOf('c')===0&&!/^sw:/.test(id))return;
  var s=swList().filter(function(x){return x.id===id})[0];if(!s||PUSHED[id])return;
  PUSHED[id]=1;jset('vhvs:'+SCH,PUSHED);
  try{WN.add([{w:s.a,m:s.k+' → '+s.b,src:SRC,how:'바꿔 말하기',ask:true}])}catch(e){}
}
function swList(){return (DATA.story||[]).map(function(s){return {a:s.a,form:s.form,b:s.b,k:s.k,id:'sw:'+s.a.toLowerCase(),n:s.n,sq:s.sq,sum:s.sum,hook:s.hook,en:s.en,ko:s.ko}})}
function hlWord(t,w){return t.split(new RegExp('(\\b'+w+'\\b)','i')).map(function(x,i){return i%2?'<mark>'+esc(x)+'</mark>':words(x)}).join('')}
function hlSum(t){return t.split(/(\[\[.*?\]\])/).map(function(x){var m=x.match(/^\[\[(.*)\]\]$/);return m?'<mark>'+words(m[1])+'</mark>':words(x)}).join('')}
var swOpen={},swD={};
/* 화면 */
function render(){
  var h='';
  if(view==='home')h=vHome();else if(view==='q')h=vQ();else if(view==='res')h=vRes();else if(view==='notes')h=vNotes();else if(view==='sw')h=vSw();else if(view==='chk')h=vChk();else h=vHome();
  var y=window.pageYOffset||0;
  $('app').innerHTML=h;
  if(!window.__goTop)window.scrollTo(0,y);
}
function yyLine(){
  try{var Y=jget('vhy:'+SCH,{}),pg=Y[location.pathname.split('/').slice(-2).join('/')]||{},n=0,r=0,w=0;
    Qs.forEach(function(q){var e=pg[q.id];if(e&&e.n){n++;if(e.k)r++;w+=e.w||0}});
    if(!n)return '';
    return '<p class="sub">내 기록: '+n+'문제 중 '+r+'문제 정답'+(w?' · 틀린 횟수 '+w+'번':'')+'</p>';
  }catch(x){return ''}
}
function vHome(){
  var d=doneCount(),f=firstOpen();
  var h='<a class="tag" href="../index.html" style="text-decoration:none">목록</a><h1>'+DATA.meta.lesson+' '+esc(DATA.meta.title)+'</h1><p class="sub">요약문 연습 '+DATA.meta.label+' · '+Qs.length+'문제</p><div class="nums">';
  Qs.forEach(function(q,i){var a=PR.a[q.id];h+='<button class="nb '+(a===undefined?'':(a===q.ans?'o':'x'))+'" data-a="q" data-v="'+i+'">'+(i+1)+'</button>'});
  h+='</div>';
  h+=yyLine();
  h+='<button class="btn pri" data-a="resume">'+(d===0?'시작하기':(f<0?'결과 보기':'이어서 풀기 ('+d+' / '+Qs.length+')'))+'</button>';
  h+='<button class="btn sec" data-a="notes">단어노트 '+nNotes()+'개</button><button class="btn sec" data-a="sw">바꿔 말하기 연습</button>'+(nFlag()?'<button class="btn flagbtn" data-a="chk">선생님 확인 단어 '+nFlag()+'개</button>':'');
  h+='<div class="foot"><button data-a="reset">문제 다시 풀기</button></div>';
  return h;
}
function vQ(){
  var q=Qs[cur],a=PR.a[q.id],done=a!==undefined;curQ=q.id;
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">'+(cur+1)+' / '+Qs.length+'</span></div>';
  if(!done)h+='<p class="hint">밑줄 단어를 누르면 뜻이 나와요. 번호를 누르면 답을 골라요.</p>';
  h+='<div class="card sum">'+sumHtml(q,done)+'</div><div class="opts">';
  q.opts.forEach(function(o,i){
    var cls='opt'+(done?' lock':'');
    if(done){if(i===q.ans)cls+=' right';else if(i===a)cls+=' mine'}
    h+='<div class="'+cls+'"'+(done?'':' data-a="pick" data-v="'+i+'"')+'><span class="num">'+CN[i]+'</span><span class="ot">'+words(o[0])+'<span class="dash">–</span>'+words(o[1])+'</span>'+(done&&i===q.ans?'<span class="st">정답</span>':(done&&i===a?'<span class="st">내 답</span>':''))+'</div>';
  });
  h+='</div>';
  if(done){
    var ok=a===q.ans;
    h+='<div id="exp"><div class="card"><div class="row"><span class="badge">'+(cur+1)+'번</span><span class="chip">정답 '+CN[q.ans]+'</span><span class="msg '+(ok?'o':'x')+'">'+(ok?'맞았어요':'내 답 '+CN[a])+'</span></div>';
    h+='</div><div class="card"><p class="lb">직독직해 (끊어서 앞에서부터 이해해요)</p>'+jdHtml(q)+'<details><summary>자연스러운 해석 보기</summary><div class="ko">'+q.ko.replace(/\((A|B)\)\s*/g,'')+'</div></details></div>';
    h+='<div class="card"><p class="lb">보기 뜻</p><ul class="opl">';
    q.opts.forEach(function(o,i){h+='<li class="'+(i===q.ans?'a':'')+'">'+CN[i]+' '+(i===q.ans?'<mark>'+words(o[0])+' – '+words(o[1])+'</mark>':words(o[0])+' – '+words(o[1]))+'<span class="k">'+(i===q.ans?'<mark>'+esc(q.optko[i])+'</mark>  ← 정답':esc(q.optko[i]))+'</span></li>'});
    h+='</ul></div>';
    h+='<div class="card"><p class="lb">정답의 근거 · 본문 '+q.evid_full.map(function(e){return e.n+'번'}).join(', ')+'</p>';
    q.evid_full.forEach(function(e){h+='<div class="ev"><div class="en">'+rich(e.en,e.hl)+'</div><div class="kk">'+richKo(e.ko,e.hlko)+'</div></div>'});
    h+='</div>';
    h+='<div class="card"><p class="lb">이 단어, 이렇게 바뀌었어요</p>';
    q.swaps.forEach(function(s){h+='<div class="swap"><span class="a">'+words(s[0])+'</span><span class="arr">→</span><span class="b">'+words(s[1])+'</span><span class="ds">'+esc(s[2])+(/\s/.test(s[0])||/\s/.test(s[1])?'':' '+sayBtn(s[0],'듣기')+' '+sayBtn(s[1],'듣기'))+'</span></div>'});
    h+='<div class="note">'+esc(q.swapnote)+'</div></div>';
    h+='<div class="card"><p class="lb">쓰임 익히기</p><div class="use">';
    q.use.forEach(function(u){h+='<div class="u"><div class="uw">'+esc(u.w)+'<small class="uwk">('+esc(u.wk)+')</small></div><div class="ue">'+useEx(u)+'</div><div class="uk">'+esc(u.ko).replace(esc(u.hk),'<mark>'+esc(u.hk)+'</mark>')+'</div></div>'});
    h+='</div></div>';
    h+='<div class="card"><p class="lb">기억할 흐름</p><div class="fc">'+q.fc.map(function(c,i){return (i?'<div class="ar">▼</div>':'')+'<div class="c'+(i===q.fc.length-1?' last':'')+'"><span class="tg">'+esc(c[0])+'</span><div class="hd">'+mk(c[1])+'</div><div class="sb2">'+mk(c[2])+'</div></div>'}).join('')+'</div></div>';
    h+='<div class="card"><details><summary>다른 보기는 왜 아닐까요</summary><ul style="padding:0;margin:6px 0 0">';
    q.wrong.forEach(function(w,i){if(w)h+='<li><b>'+CN[i]+'</b> '+hlp(w)+'</li>'});
    h+='</ul></details></div>';
    h+='<button class="btn pri" data-a="next">'+(cur<Qs.length-1?'다음 문제':'결과 보기')+'</button></div>';
  }
  return h;
}
function vRes(){
  var h='<div class="top"><button class="back" data-a="home">목록</button></div><h1>'+Qs.length+'문제 중 '+okCount()+'문제 맞았어요</h1>';
  h+='<div class="nums">';
  Qs.forEach(function(q,i){var a=PR.a[q.id];h+='<button class="nb '+(a===undefined?'':(a===q.ans?'o':'x'))+'" data-a="q" data-v="'+i+'">'+(i+1)+'</button>'});
  h+='</div><p class="sub">단어노트에 '+nNotes()+'개가 쌓였어요.</p>';
  h+='<button class="btn pri" data-a="notes">단어노트 보기</button><button class="btn sec" data-a="reset">문제 다시 풀기</button><button class="btn sec" data-a="home">목록으로</button>';
  return h;
}
function sortedNotes(){return Object.keys(NOTES).map(function(k){return NOTES[k]}).sort(function(a,b){return b.t-a.t})}
function vNotes(){
  var L=sortedNotes();
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">단어노트 '+L.length+'개</span></div>';
  if(!L.length)return h+'<div class="empty">밑줄 단어를 누르면 여기에 쌓여요.</div>';
  h+='<div class="card"><ul class="wl">';
  L.forEach(function(n){h+='<li><span class="lw">'+esc(n.l)+'</span><span class="lm">'+esc(n.k)+'</span>'+(n.c>1?'<span class="lc">'+n.c+'번</span>':'')+'</li>'});
  return h+'</ul></div>';
}
function sk(id){return id.indexOf('sw:')===0?id.slice(3):id}
function wrongOf(id){var r=SRV[sk(id).toLowerCase()];return r&&r.c>0?r.c:0}
function flagList(){return Object.keys(SRV).map(function(k){return SRV[k]}).filter(function(r){return r.c>0}).sort(function(a,b){return b.c-a.c})}
function nFlag(){return flagList().length}
function srvLoad(){
  try{WN.list().then(function(r){
    if(!r||!r.ok||!r.items)return;SRV={};
    r.items.forEach(function(i){if(String(i.src||'').indexOf(SRC)>=0)SRV[String(i.w).toLowerCase()]={w:i.w,m:i.m,c:i.c||0}});
    if(view==='home'||view==='chk'||view==='sw')render();
  })}catch(e){}
}
function vChk(){
  var L=flagList();
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">선생님 확인 단어 '+L.length+'개</span></div>';
  if(!L.length)return h+'<div class="empty">틀린 단어가 없어요.</div>';
  h+='<p class="hint">선생님이 물어봤을 때 틀린 단어예요. 먼저 뜻을 떠올려 보고 확인해 보세요. 오답노트(H로드맵)에도 같이 있어요.</p><div class="card">';
  L.forEach(function(r){
    var id=r.w.toLowerCase(),o=swOpen['c'+id];
    h+='<div class="swr"><div class="swq"><span class="sa">'+esc(r.w)+'</span><span class="sb">'+(o?'<em>'+esc(r.m)+'</em>':'뜻은?')+'</span><small class="flag">'+r.c+'번 틀림</small><button data-a="rv" data-v="c'+esc(id)+'">'+(o?'가리기':'확인')+'</button></div></div>';
  });
  return h+'</div><a class="btn sec" style="display:block;text-align:center;text-decoration:none" href="https://nolbada.github.io/via/wn/">H로드맵 오답노트 열기</a>';
}
function sceneLine(t,cur){return esc(t).replace(/\[\[(\w+)\|([^\]]+)\]\]/g,function(m,w,k){return '<b class="wc'+(w.toLowerCase()===String(cur).toLowerCase()?' me':'')+'">'+w+'</b>('+k+')'})}
function vSw(){
  var L=swList(),sc={};
  (DATA.scenes||[]).forEach(function(c){(c.line.match(/\[\[\w+\|/g)||[]).forEach(function(m){sc[m.slice(2,-1).toLowerCase()]=c})});
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">바꿔 말하기 '+L.length+'개</span></div>';
  h+='<p class="hint">왼쪽 단어가 요약문에서 어떤 말로 바뀔까요? <b>소리 내어 말해 본 뒤</b> 확인을 눌러요.</p>';
  h+='<div class="tabs"><button data-a="rvall" data-v="open">모두 열기</button><button data-a="rvall" data-v="hide">모두 가리기</button></div><div class="card">';
  L.forEach(function(s){
    var o=swOpen[s.id],c=sc[s.form.toLowerCase()],on=swD['s'+s.id],fl=wrongOf(s.id);
    h+='<div class="swr"><div class="swq"><span class="sa">'+words(s.a)+(fl?'<small class="flag">'+fl+'번 틀림</small>':'')+'</span><span class="sb">'+(o?'<em>'+words(s.b)+'</em>'+esc(s.k):'→ ?')+'</span>'+sayBtn(s.a,'듣기')+(o?sayBtn(s.b,'정답 듣기'):'')+'<button data-a="rv" data-v="'+esc(s.id)+'">'+(o?'가리기':'확인')+'</button></div>';
    if(c)h+='<button class="acc2" data-a="dt" data-v="s'+esc(s.id)+'">'+esc(c.tag)+' 줄거리<span>'+(on?'접기':'펼치기')+'</span></button>'+(on?'<div class="story">'+sceneLine(c.line,s.form)+'</div>':'');
    h+='</div>';
  });
  return h+'</div><p class="sumline">시험에서는 본문 단어가 뜻이 같은 다른 단어로 바뀌어 나와요.</p>';
}
render();srvLoad();window.addEventListener('pageshow',srvLoad);
</script>
</body>
</html>
