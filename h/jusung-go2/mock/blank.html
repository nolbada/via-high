se needs to eat every day","ko":"쥐가 왜 매일 먹어야 하는지"},{"en":"when a bat first learns to hunt","ko":"박쥐가 언제 처음 사냥을 배우는지"},{"en":"why a mouse can live longer than a bat","ko":"쥐가 왜 박쥐보다 오래 살 수 있는지"}],"orig":false},{"s":5,"ans":"they can escape from danger much faster","ans_ko":"그들은 위험에서 훨씬 더 빨리 도망칠 수 있다","opts":[{"en":"they can never be caught by any predator","ko":"그들은 어떤 포식자에게도 결코 잡히지 않는다"},{"en":"they must rest for most of the day","ko":"그들은 하루의 대부분을 쉬어야 한다"},{"en":"they have less need to find food","ko":"그들은 먹이를 찾을 필요가 더 적다"},{"en":"they cannot travel over long distances","ko":"그들은 먼 거리를 이동할 수 없다"}],"orig":false},{"s":6,"ans":"cover longer distances","ans_ko":"더 긴 거리를 이동하다","opts":[{"en":"sleep through the winter","ko":"겨울 내내 잠을 자다"},{"en":"live in much colder places","ko":"훨씬 더 추운 곳에서 살다"},{"en":"avoid all contact with mice","ko":"쥐와의 모든 접촉을 피하다"},{"en":"grow to a much larger size","ko":"훨씬 더 큰 크기로 자라다"}],"orig":false}]},{"id":"2311-35","label":"23년 11월 35번","taught":false,"modes":["ko","mun","blank"],"en":["Moral excellence, according to Aristotle, is the result of habit and repetition, though modern science would also suggest that it may have an innate, genetic component.","This means that moral excellence will be broadly set early in our lives, which is why the question of how early to teach it is so important.","Freud suggested that we don’t change our personality much after age five or thereabouts, but as in many other things, Freud was wrong.","Recent psychological research shows that personality traits stabilize around age thirty in both men and women and regardless of ethnicity as the human brain continues to develop, both neuroanatomically and in terms of cognitive skills, until the mid-twenties.","The advantage of this new understanding is that we can be a bit more optimistic than Aristotle and Freud about being able to teach moral excellence."],"ko":[" 비록 현대 과학은 그것이 선천적, 즉, 유전적인 요소를 가지고 있다고 또한 주장하지만, Aristotle에 따르면 도덕적 우수성은 습관과 반복의 결과물이다."," 이것은 도덕적 우수성이 우리 삶에 있어서 이른 시기에 광범위하게 설정될 것임을 의미하며, 이것이 얼마나 일찍 그것을 가르쳐야 할지에 대한 질문이 매우 중요한 이유이다."," Freud는 우리가 5세 혹은 그 무렵 이후에는 우리의 성격을 많이 바꾸지 않는다고 제시했지만, 다른 많은 것들에서처럼 Freud는 틀렸다."," 최근의 심리 연구는 20대 중반까지 신경 해부학적으로 그리고 인지 기능 면에서 인간의 뇌가 계속해서 발달함에 따라 남성과 여성 모두에게 있어서 그리고 민족에 상관없이 성격 특성이 30세 무렵에 안정된다는 것을 보여 준다."," 이 새로운 이해의 이점은 우리가 Aristotle이나 Freud보다 도덕적 우수성을 가르칠 수 있다는 점에서 조금 더 낙관적일 수 있다는 것이다."],"theme":"도덕적 우수성은 습관과 유전의 영향을 받지만, 성격이 30세 무렵까지 안정된다는 연구 덕분에 가르칠 수 있다는 낙관이 가능하다.","blanks":[{"s":0,"ans":"the result of habit and repetition","ans_ko":"습관과 반복의 결과","opts":[{"en":"a gift of natural talent alone","ko":"타고난 재능만의 선물"},{"en":"a matter of luck and chance","ko":"운과 우연의 문제"},{"en":"the outcome of fear and punishment","ko":"두려움과 처벌의 결과"},{"en":"the product of wealth and education","ko":"부와 교육의 산물"}],"orig":false},{"s":0,"ans":"an innate, genetic component","ans_ko":"선천적, 유전적 요소","opts":[{"en":"a clear cultural background","ko":"분명한 문화적 배경"},{"en":"a strong financial basis","ko":"강한 재정적 기반"},{"en":"a sudden physical change","ko":"갑작스러운 신체 변화"},{"en":"a simple social purpose","ko":"단순한 사회적 목적"}],"orig":false},{"s":1,"ans":"broadly set early in our lives","ans_ko":"삶의 이른 시기에 폭넓게 정해질","opts":[{"en":"changed easily throughout our lives","ko":"평생에 걸쳐 쉽게 바뀔"},{"en":"decided only by our teachers","ko":"오직 우리 선생님들에 의해 결정될"},{"en":"forgotten as we grow older","ko":"나이가 들면서 잊힐"},{"en":"set mainly in our old age","ko":"주로 노년에 정해질"}],"orig":false},{"s":2,"ans":"don’t change our personality much after age five","ans_ko":"5세 이후에는 성격을 많이 바꾸지 않는다","opts":[{"en":"change our personality greatly after age five","ko":"5세 이후에 성격을 크게 바꾼다"},{"en":"keep the same personality until old age","ko":"노년까지 같은 성격을 유지한다"},{"en":"learn most of our habits before age two","ko":"두 살 전에 습관의 대부분을 배운다"},{"en":"form our personality only around age thirty","ko":"30세 무렵에야 성격을 형성한다"}],"orig":false},{"s":3,"ans":"stabilize around age thirty","ans_ko":"30세 무렵에 안정된다","opts":[{"en":"change completely every ten years","ko":"10년마다 완전히 바뀐다"},{"en":"stop developing around age five","ko":"5세 무렵에 발달이 멈춘다"},{"en":"depend mainly on a person’s gender","ko":"주로 성별에 좌우된다"},{"en":"weaken after the mid-twenties","ko":"20대 중반 이후 약해진다"}],"orig":false},{"s":4,"ans":"teach moral excellence","ans_ko":"도덕적 우수성을 가르치다","opts":[{"en":"measure personality traits","ko":"성격 특성을 측정하다"},{"en":"predict future behavior","ko":"미래 행동을 예측하다"},{"en":"inherit a good character","ko":"좋은 성격을 물려받다"},{"en":"avoid repeating old habits","ko":"오래된 습관의 반복을 피하다"}],"orig":false}]},{"id":"2311-36","label":"23년 11월 36번","taught":false,"modes":["ko","abc","mun","blank"],"en":["The size of a species is not accidental.","It’s a fine-tuned interaction between a species and the world it inhabits.","Over large periods of time, size fluctuations have often signalled significant changes in the environment.","Generally speaking, over the last five hundred million years, the trend has been towards animals getting larger.","It’s particularly notable in marine animals, whose average body size has increased 150-fold in this time.","But we are beginning to see changes in this trend.","Scientists have discovered that many animals are shrinking.","Around the world, species in every category have been found to be getting smaller, and one major cause appears to be the heat.","Animals living in the Italian Alps, for example, have seen temperatures rise by three to four degrees Celsius since the 1980s.","To avoid overheating, chamois goats now spend more of their days resting rather than searching for food, and as a result, in just a few decades, the new generations of chamois are 25 percent smaller."],"ko":[" 종의 크기는 우연한 것이 아니다."," 그것은 한 종과 그것이 서식하는 세계 사이의 미세 조정된 상호 작용이다."," 오랜 시간에 걸쳐, 크기의 변동은 종종 환경에서의 상당한 변화를 나타내 왔다."," (B) 일반적으로 말해서, 지난 5억 년 동안, 그 경향은 동물들이 점점 커지는 쪽으로 되어 왔다."," 그것은 특히 해양 동물들에게서 두드러지는데, 그들의 평균 몸 크기는 이 시기에 150배로 증가해 왔다."," (A) 하지만 우리는 이 경향에서 변화를 관찰하기 시작하고 있다."," 과학자들은 많은 동물이 작아지고 있다는 것을 발견해 왔다."," 전 세계적으로, 모든 범주의 종들이 점점 작아지고 있는 것으로 발견되어 왔고, 한 가지 주요 원인은 열인 것으로 보인다."," (C) 예를 들어, 이탈리아 알프스에 살고 있는 동물들은 1980년대 이후로 기온이 섭씨 3에서 4도까지 상승하는 것을 보아 왔다."," 과열을 피하기 위해서, 샤무아 염소들은 이제 먹이를 찾는 것보다 휴식을 취하는 데 더 많은 그들의 날들을 보내고, 결과적으로, 단지 몇 십 년 만에, 새로운 세대들의 샤무아는 25% 더 작아져 있다."],"theme":"동물의 크기는 환경과의 상호 작용의 결과인데, 오랫동안 커지던 추세가 최근에는 열 때문에 작아지는 쪽으로 바뀌고 있다.","blanks":[{"s":1,"ans":"a fine-tuned interaction","ans_ko":"미세 조정된 상호 작용","opts":[{"en":"a random collection of features","ko":"무작위적인 특징들의 모음"},{"en":"a harmless coincidence of nature","ko":"자연의 해롭지 않은 우연"},{"en":"a fixed rule of every environment","ko":"모든 환경의 고정된 규칙"},{"en":"a silent competition among species","ko":"종들 사이의 조용한 경쟁"}],"orig":false},{"s":2,"ans":"signalled significant changes in the environment","ans_ko":"환경에서의 상당한 변화를 나타내 왔다","opts":[{"en":"been unrelated to the environment","ko":"환경과 무관해 왔다"},{"en":"followed the growth of human cities","ko":"인간 도시의 성장을 뒤따라 왔다"},{"en":"proved the stability of the climate","ko":"기후의 안정성을 증명해 왔다"},{"en":"prevented significant changes in nature","ko":"자연의 상당한 변화를 막아 왔다"}],"orig":false},{"s":3,"ans":"towards animals getting larger","ans_ko":"동물이 점점 커지는 쪽으로","opts":[{"en":"towards animals living longer","ko":"동물이 더 오래 사는 쪽으로"},{"en":"towards animals moving north","ko":"동물이 북쪽으로 이동하는 쪽으로"},{"en":"towards animals becoming fewer","ko":"동물이 점점 줄어드는 쪽으로"},{"en":"towards animals getting smaller","ko":"동물이 점점 작아지는 쪽으로"}],"orig":false},{"s":4,"ans":"increased 150-fold in this time","ans_ko":"이 시기에 150배로 증가했다","opts":[{"en":"fallen by half in this time","ko":"이 시기에 절반으로 줄었다"},{"en":"changed little in this time","ko":"이 시기에 거의 변하지 않았다"},{"en":"doubled over the last century","ko":"지난 세기에 두 배가 되었다"},{"en":"grown tenfold in recent years","ko":"최근 몇 년간 10배로 커졌다"}],"orig":false},{"s":5,"ans":"beginning to see changes in this trend","ans_ko":"이 경향에서 변화를 관찰하기 시작하는","opts":[{"en":"failing to see any change in this trend","ko":"이 경향에서 어떤 변화도 보지 못하는"},{"en":"starting to ignore this trend","ko":"이 경향을 무시하기 시작하는"},{"en":"hoping to find the cause of this trend","ko":"이 경향의 원인을 찾기를 바라는"},{"en":"able to predict the end of this trend","ko":"이 경향의 끝을 예측할 수 있는"}],"orig":false},{"s":6,"ans":"many animals are shrinking","ans_ko":"많은 동물이 작아지고 있다","opts":[{"en":"most animals are growing","ko":"대부분의 동물이 커지고 있다"},{"en":"new species are appearing","ko":"새로운 종이 나타나고 있다"},{"en":"many animals are migrating","ko":"많은 동물이 이동하고 있다"},{"en":"few animals are changing","ko":"변하는 동물은 거의 없다"}],"orig":false},{"s":7,"ans":"found to be getting smaller","ans_ko":"점점 작아지고 있는 것으로 발견되어","opts":[{"en":"known to be growing larger","ko":"점점 커지고 있는 것으로 알려져"},{"en":"seen to be moving north","ko":"북쪽으로 이동하는 것으로 관찰되어"},{"en":"proved to be dying out","ko":"멸종해 가는 것으로 입증되어"},{"en":"said to be more intelligent","ko":"더 영리한 것으로 이야기되어"}],"orig":false}]},{"id":"2311-37","label":"23년 11월 37번","taught":true,"modes":["ko","abc","mun","blank"],"en":["For a long time, random sampling was a good shortcut.","It made analysis of large data problems possible in the pre-digital era.","But much as converting a digital image or song into a smaller file results in loss of data, information is lost when sampling.","Having the full (or close to the full) dataset provides a lot more freedom to explore, to look at the data from different angles or to look closer at certain aspects of it.","A fitting example may be the light-field camera, which captures not just a single plane of light, as with conventional cameras, but rays from the entire light field, some 11 million of them.","The photographers can decide later which element of an image to focus on in the digital file.","There is no need to focus at the beginning, since collecting all the information makes it possible to do that afterwards.","Because rays from the entire light field are included, it is closer to all the data.","As a result, the information is more “reuseable” than ordinary pictures, where the photographer has to decide what to focus on before she presses the shutter."],"ko":[" 오랫동안, 무작위 추출법은 좋은 지름길이었다."," 그것은 디지털 시대 이전에 상당한 데이터 문제 분석을 가능하게 했다."," (B) 그러나 디지털 이미지나 노래를 더 작은 파일로 변환하는 것이 데이터 손실을 유발하는 것과 마찬가지로, 추출을 할 때 정보가 손실된다."," 전체(또는 전체에 가까운) 데이터 세트를 가지는 것은 탐색하거나 다른 각도에서 데이터를 살펴보거나 그것의 특정 측면들을 더 자세히 보게 하는 자유를 훨씬 더 많이 제공한다."," (C) 라이트 필드 카메라가 적절한 비유가 될 수 있는데, 그것은 기존 카메라처럼 한 평면의 빛만 포착할 뿐만 아니라 약 1,100만 개에 달하는 전체 라이트 필드로부터의 광선들도 포착한다."," 사진사들은 디지털 파일에서 이미지의 어느 요소에 초점을 맞출지를 나중에 결정할 수 있다."," (A) 모든 정보를 수집하는 것은 그것을 나중에 하는 것을 가능하게 만들기 때문에, 처음에 초점을 맞출 필요는 없다."," 전체 라이트 필드의 빛이 포함되기 때문에, 그것은 모든 데이터에 더 가깝다."," 결과적으로 사진사가 셔터를 누르기 전에 그녀가 무엇에 초점을 맞출지를 결정해야 하는 일반 사진들보다 그 정보는 더 ‘재사용 가능’하다."],"theme":"표본 추출은 정보를 잃지만 전체 데이터를 가지면 더 자유롭게 탐색할 수 있고, 라이트 필드 카메라가 그 좋은 예이다.","blanks":[{"s":0,"ans":"a good shortcut","ans_ko":"좋은 지름길","opts":[{"en":"a costly mistake","ko":"값비싼 실수"},{"en":"a rare talent","ko":"드문 재능"},{"en":"an old tradition","ko":"오랜 전통"},{"en":"a perfect solution","ko":"완벽한 해결책"}],"orig":false},{"s":1,"ans":"possible in the pre-digital era","ans_ko":"디지털 시대 이전에 가능한","opts":[{"en":"easier in the digital age","ko":"디지털 시대에 더 쉬운"},{"en":"unnecessary in the pre-digital era","ko":"디지털 이전 시대에 불필요한"},{"en":"useless without a camera","ko":"카메라 없이는 쓸모없는"},{"en":"harder in the pre-digital era","ko":"디지털 이전 시대에 더 어려운"}],"orig":false},{"s":2,"ans":"results in loss of data","ans_ko":"데이터 손실을 낳는다","opts":[{"en":"leads to a faster download","ko":"더 빠른 내려받기로 이어진다"},{"en":"brings a higher image quality","ko":"더 높은 화질을 가져온다"},{"en":"saves the original information","ko":"원래 정보를 보존한다"},{"en":"gives a wider range of choices","ko":"더 넓은 선택의 폭을 준다"}],"orig":false},{"s":3,"ans":"a lot more freedom to explore","ans_ko":"탐색할 훨씬 더 많은 자유","opts":[{"en":"a lot less freedom to explore","ko":"탐색할 자유가 훨씬 적은 것"},{"en":"a faster way to copy files","ko":"파일을 복사하는 더 빠른 방법"},{"en":"a safer place to store them","ko":"그것들을 저장할 더 안전한 장소"},{"en":"a lot more reason to worry","ko":"걱정할 훨씬 더 많은 이유"}],"orig":false},{"s":6,"ans":"no need to focus at the beginning","ans_ko":"처음에 초점을 맞출 필요가 없다","opts":[{"en":"a need to focus before shooting","ko":"촬영 전에 초점을 맞출 필요가 있다"},{"en":"no chance to look at the whole scene","ko":"전체 장면을 볼 기회가 없다"},{"en":"no use for a digital camera","ko":"디지털 카메라를 쓸 일이 없다"},{"en":"no time to collect information","ko":"정보를 모을 시간이 없다"}],"orig":false},{"s":7,"ans":"closer to all the data","ans_ko":"모든 데이터에 더 가까운","opts":[{"en":"farther from the full dataset","ko":"전체 데이터에서 더 먼"},{"en":"limited to a single plane","ko":"한 평면에 한정된"},{"en":"smaller than a sample","ko":"표본보다 더 작은"},{"en":"harder to store than before","ko":"이전보다 저장하기 더 어려운"}],"orig":false},{"s":8,"ans":"more “reuseable” than ordinary pictures","ans_ko":"일반 사진보다 더 ‘재사용 가능’한","opts":[{"en":"as limited as ordinary pictures","ko":"일반 사진만큼 제한적인"},{"en":"harder to change than ordinary pictures","ko":"일반 사진보다 바꾸기 더 어려운"},{"en":"less detailed than ordinary pictures","ko":"일반 사진보다 덜 상세한"},{"en":"easier to print than ordinary pictures","ko":"일반 사진보다 인쇄하기 더 쉬운"}],"orig":false}]},{"id":"2311-38","label":"23년 11월 38번","taught":true,"modes":["ko","abc","mun","blank"],"en":["Introverted leaders do have to overcome the strong cultural presumption that extroverts are more effective leaders.","Although the population splits into almost equal parts between introverts and extroverts, more than 96 percent of managers and executives are extroverted.","In a study done in 2006, 65 percent of senior corporate executives viewed introversion as a barrier to leadership.","We must reexamine this stereotype, however, as it doesn’t always hold true.","Regent University found that a desire to be of service to others and to empower them to grow, which is more common among introverts than extroverts, is a key factor in becoming a leader and retaining leadership.","So-called servant leadership, dating back to ancient philosophical literature, adheres to the belief that a company’s goals are best achieved by helping workers or customers achieve their goals.","Such leaders do not seek attention but rather want to shine a light on others’ wins and achievements; servant leadership requires humility, but that humility ultimately pays off."],"ko":[" 내향적인 리더들은 외향적인 사람들이 더 유능한 리더라는 강력한 문화적 억측을 극복해야 한다."," 비록 인구는 내향적인 사람과 외향적인 사람 사이에서 거의 동등한 비율로 나뉘지만, 관리자와 임원의 96% 이상이 외향적이다."," 2006년에 실시된 한 연구에서, 기업 고위 임원의 65%가 내향성을 리더십의 장애물로 간주했다."," 하지만 그것이 항상 맞는 것은 아니기 때문에 우리는 이 고정 관념을 재검토해야 한다."," Regent 대학교는 다른 사람들에게 도움이 되고 그들이 성장할 수 있도록 힘을 주고자 하는 열망이 리더가 되고 리더십을 유지하는 데 핵심적인 요소이고, 그것이 외향적인 사람들보다 내향적인 사람들 사이에서 더 일반적이라는 것을 발견했다."," 고대 철학 문헌으로 거슬러 올라가는 소위 서번트 리더십은 한 회사의 목표가 근로자나 고객이 그들의 목표를 달성하도록 도움으로써 가장 잘 달성된다는 믿음을 고수한다."," 그런 리더들은 관심을 추구하는 것이 아니라 오히려 다른 사람들의 승리와 업적에 빛을 비추고 싶어 하고, 서번트 리더십은 겸손을 필요로 하지만, 그 겸손은 궁극적으로 결실을 맺는다."],"theme":"외향적인 사람이 더 낫다는 통념과 달리, 남을 돕고 성장시키려는 열망은 내향적인 사람에게 더 흔하며 이것이 리더십의 핵심 요소이다.","blanks":[{"s":0,"ans":"overcome the strong cultural presumption","ans_ko":"강력한 문화적 통념을 극복하다","opts":[{"en":"accept the long historical tradition","ko":"오랜 역사적 전통을 받아들이다"},{"en":"deny the clear scientific evidence","ko":"명백한 과학적 증거를 부정하다"},{"en":"report the common public opinion","ko":"흔한 여론을 보고하다"},{"en":"share the widespread business rumor","ko":"널리 퍼진 업계 소문을 공유하다"}],"orig":false},{"s":1,"ans":"more than 96 percent of managers and executives","ans_ko":"관리자와 임원의 96% 이상","opts":[{"en":"less than 4 percent of all senior leaders","ko":"전체 고위 리더의 4% 미만"},{"en":"nearly half of the middle-level workers","ko":"중간 직급 직원의 거의 절반"},{"en":"only a few of the top salespeople","ko":"최고 영업 사원 중 소수만"},{"en":"almost all of the female directors","ko":"여성 이사의 거의 전부"}],"orig":false},{"s":2,"ans":"viewed introversion as a barrier to leadership","ans_ko":"내향성을 리더십의 장애물로 보았다","opts":[{"en":"saw quiet people as the best managers","ko":"조용한 사람들이 최고의 관리자라고 보았다"},{"en":"believed extroverts caused most failures","ko":"외향적인 사람들이 대부분의 실패를 일으킨다고 믿었다"},{"en":"thought education mattered more than personality","ko":"교육이 성격보다 더 중요하다고 생각했다"},{"en":"regarded leadership as a matter of luck","ko":"리더십을 운의 문제로 여겼다"}],"orig":false},{"s":3,"ans":"it doesn’t always hold true","ans_ko":"그것이 항상 맞는 것은 아니다","opts":[{"en":"it has never been tested","ko":"그것은 한 번도 검증된 적이 없다"},{"en":"it is true in every company","ko":"그것은 모든 회사에서 사실이다"},{"en":"it changes every year","ko":"그것은 해마다 바뀐다"},{"en":"it was created by managers","ko":"그것은 관리자들이 만들었다"}],"orig":false},{"s":4,"ans":"a key factor in becoming a leader","ans_ko":"리더가 되는 데 핵심적인 요소","opts":[{"en":"a minor side effect of being a leader","ko":"리더가 되는 것의 사소한 부작용"},{"en":"a common reason for losing leadership","ko":"리더십을 잃는 흔한 이유"},{"en":"a rare talent among most managers","ko":"대부분의 관리자에게 드문 재능"},{"en":"the only rule for choosing a team","ko":"팀을 고르는 유일한 규칙"}],"orig":false},{"s":5,"ans":"dating back to ancient philosophical literature","ans_ko":"고대 철학 문헌으로 거슬러 올라가는","opts":[{"en":"first developed in modern business schools","ko":"현대 경영대학원에서 처음 개발된"},{"en":"mainly used in military organizations","ko":"주로 군사 조직에서 쓰이는"},{"en":"created by successful company owners","ko":"성공한 회사 소유주들이 만든"},{"en":"recently introduced by foreign experts","ko":"최근 외국 전문가들이 도입한"}],"orig":false},{"s":6,"ans":"shine a light on others’ wins and achievements","ans_ko":"다른 사람들의 승리와 업적에 빛을 비추다","opts":[{"en":"keep the spotlight on their own success","ko":"자신의 성공에 계속 스포트라이트를 두다"},{"en":"compete with others for public praise","ko":"대중의 칭찬을 두고 다른 사람들과 경쟁하다"},{"en":"hide others’ failures from the company","ko":"다른 사람들의 실패를 회사에서 숨기다"},{"en":"quickly replace workers who are shy","ko":"수줍음이 많은 직원들을 재빨리 교체하다"}],"orig":false}]},{"id":"2311-39","label":"23년 11월 39번","taught":false,"modes":["ko","abc","mun","blank"],"en":["By the nineteenth century, France had developed a system of precisely defined units of measurement to capture space, time, and more, and had begun to get other nations to adopt the same standards.","Just half a century later, in the 1920s, the discoveries of quantum mechanics forever destroyed the dream of comprehensive and perfect measurement.","And yet, outside a relatively small circle of physicists, the mindset of humankind’s drive to flawlessly measure continued among engineers and scientists.","In the world of business it even expanded, as the precision-oriented sciences of mathematics and statistics began to influence all areas of commerce.","However, contrary to the trend of the past several decades, in many new situations that are occurring today, allowing for imprecision ― for messiness ― may be a positive feature, not a shortcoming.","As a tradeoff for relaxing the standards of allowable errors, one can get a hold of much more data.","It isn’t just that “more is better than some,” but that, in fact, sometimes “more is greater than better.”"],"ko":[" 19세기까지, 프랑스는 공간, 시간, 그리고 더 많은 것을 포착하기 위해 정밀하게 규정된 측정 단위의 체계를 개발했고, 다른 국가들이 동일한 기준을 채택하도록 만들기 시작했었다."," 불과 반세기 후, 1920년대에, 양자 역학의 발견은 포괄적이고 완벽한 측정에 대한 꿈을 영원히 깨 버렸다."," 그러나 비교적 소수 집단의 물리학자를 제외하고는 공학자와 과학자 사이에서 완벽하게 측정하려고 하는 인류의 추진 정신은 계속되었다."," 정확성을 지향하는 수학과 통계학이라는 과학이 상업의 모든 영역에 영향을 미치기 시작하면서 비즈니스의 세계에서 그것은 심지어 확장되었다."," 그러나, 지난 수십 년간의 경향과 반대로, 오늘날 발생하는 많은 새로운 상황에서 부정확성, 즉, 번잡함을 허용하는 것은 단점이 아니라 긍정적인 특성이 될 수 있다."," 허용할 오류의 기준을 완화하기 위한 거래로서 사람은 훨씬 더 많은 데이터를 얻을 수 있다."," 그것은 단순히 ‘더 많은 것이 조금보다 더 나을’ 뿐만 아니라, 사실은 때때로 ‘더 많은 것이 더 좋은 것보다 더 훌륭하기’도 하다."],"theme":"완벽한 측정을 추구해 온 흐름과 달리, 오늘날에는 약간의 부정확함을 허용하고 그 대가로 훨씬 많은 데이터를 얻는 편이 더 낫기도 하다.","blanks":[{"s":0,"ans":"precisely defined units of measurement","ans_ko":"정밀하게 규정된 측정 단위","opts":[{"en":"roughly estimated amounts of space","ko":"대략 추정된 공간의 양"},{"en":"traditional rules for local markets","ko":"지역 시장을 위한 전통 규칙"},{"en":"secret codes used by the army","ko":"군대가 사용하는 비밀 암호"},{"en":"freely chosen forms of expression","ko":"자유롭게 선택된 표현 형태"}],"orig":false},{"s":1,"ans":"forever destroyed the dream of comprehensive and perfect measurement","ans_ko":"포괄적이고 완벽한 측정에 대한 꿈을 영원히 깨 버렸다","opts":[{"en":"proved the value of simple and rough counting","ko":"단순하고 거친 계산의 가치를 증명했다"},{"en":"helped engineers build more precise machines","ko":"공학자들이 더 정밀한 기계를 만들도록 도왔다"},{"en":"ended the need for any units of measurement","ko":"측정 단위의 필요를 모두 끝냈다"},{"en":"spread the use of the French system worldwide","ko":"프랑스 체계의 사용을 전 세계에 퍼뜨렸다"}],"orig":false},{"s":2,"ans":"the mindset of humankind’s drive to flawlessly measure","ans_ko":"완벽하게 측정하려는 인류의 추진 정신","opts":[{"en":"the fear of making a serious mistake","ko":"큰 실수를 저지르는 것에 대한 두려움"},{"en":"the doubt about every scientific number","ko":"모든 과학적 숫자에 대한 의심"},{"en":"the habit of ignoring small details","ko":"사소한 세부 사항을 무시하는 습관"},{"en":"the belief in rough and quick guesses","ko":"대략적이고 빠른 추측에 대한 믿음"}],"orig":false},{"s":3,"ans":"it even expanded","ans_ko":"그것은 심지어 확장되었다","opts":[{"en":"it slowly disappeared","ko":"그것은 서서히 사라졌다"},{"en":"it quickly changed","ko":"그것은 재빨리 바뀌었다"},{"en":"it barely survived","ko":"그것은 간신히 살아남았다"},{"en":"it was strongly rejected","ko":"그것은 강하게 거부되었다"}],"orig":false},{"s":4,"ans":"may be a positive feature, not a shortcoming","ans_ko":"단점이 아니라 긍정적인 특성일 수 있다","opts":[{"en":"may be a serious flaw, not a strength","ko":"강점이 아니라 심각한 결함일 수 있다"},{"en":"will be a rare chance, not a habit","ko":"습관이 아니라 드문 기회일 것이다"},{"en":"can be a necessary rule, not a choice","ko":"선택이 아니라 필요한 규칙일 수 있다"},{"en":"should be a firm goal, not a risk","ko":"위험이 아니라 확고한 목표여야 한다"}],"orig":false},{"s":5,"ans":"relaxing the standards of allowable errors","ans_ko":"허용 가능한 오류의 기준을 완화하는 것","opts":[{"en":"raising the cost of measuring tools","ko":"측정 도구의 비용을 올리는 것"},{"en":"tightening the rules for checking data","ko":"자료를 점검하는 규칙을 강화하는 것"},{"en":"increasing the number of skilled workers","ko":"숙련된 직원의 수를 늘리는 것"},{"en":"shortening the time for each test","ko":"각 시험의 시간을 줄이는 것"}],"orig":false}]},{"id":"2311-40","label":"23년 11월 40번","taught":false,"modes":["ko","abc","mun","blank"],"en":["Multiple laboratory studies show that cooperative people tend to receive social advantages from others.","One way to demonstrate this is to give people the opportunity to act positively or negatively toward contributors.","For example, Pat Barclay, a professor at the University of Guelph, had participants play a cooperative game where people could contribute money toward a group fund which helped all group members, and then allowed participants to give money to other participants based on their reputations.","People who contributed more to the group fund were given responsibility for more money than people who contributed less.","Similar results have been found by other researchers.","People who contribute toward their groups are also chosen more often as interaction partners, preferred as leaders, rated as more desirable partners for long-term relationships, and are perceived to be trustworthy and have high social status.","Uncooperative people tend to receive verbal criticism or even more severe punishment."],"ko":[" 여러 실험실 연구들은 협력적인 사람들이 다른 사람들로부터 사회적인 혜택들을 받는 경향이 있다는 것을 보여 준다."," 이것을 증명하는 한 가지 방법은 사람들에게 기여자들을 향해 긍정적이거나 부정적으로 행동할 기회를 주는 것이다."," 예를 들어, Guelph 대학교의 교수인, Pat Barclay는 참가자들로 하여금 모든 집단 구성원들을 도와주는 집단 기금에 사람들이 돈을 기부할 수 있는 협동 게임을 하도록 한 다음, 참가자들이 그들의 평판을 바탕으로 다른 참가자들에게 돈을 줄 수 있도록 허락했다."," 집단 기금에 더 많이 기부한 사람들은 덜 기부한 사람들보다 더 많은 돈에 대한 책임이 주어졌다."," 유사한 결과들이 다른 연구자들에 의해 발견되었다."," 또한 그들의 집단에 기여하는 사람들은 상호 작용 파트너로서 더 자주 선택되고, 리더로서 선호되며, 장기적인 관계를 위한 더 바람직한 파트너들로서 평가되고, 신뢰할 수 있고 사회적 지위가 높은 것으로 인식된다.","비협조적인 사람들은 언어적인 비판이나 심지어 더 심한 벌을 받는 경향이 있다."],"theme":"협력적인 사람들은 집단 안에서 더 많이 선택되고 신뢰받는 등 사회적 혜택을 받고, 비협조적인 사람은 비난이나 벌을 받는다.","blanks":[{"s":0,"ans":"cooperative people tend to receive social advantages","ans_ko":"협력적인 사람들이 사회적 혜택을 받는 경향이 있다","opts":[{"en":"generous people tend to be taken advantage of","ko":"관대한 사람들이 이용당하는 경향이 있다"},{"en":"shy people tend to receive more attention","ko":"수줍음 많은 사람들이 더 많은 관심을 받는 경향이 있다"},{"en":"wealthy people tend to receive free help","ko":"부유한 사람들이 무료 도움을 받는 경향이 있다"},{"en":"honest people tend to suffer social losses","ko":"정직한 사람들이 사회적 손해를 입는 경향이 있다"}],"orig":false},{"s":1,"ans":"act positively or negatively toward contributors","ans_ko":"기여자들을 향해 긍정적이거나 부정적으로 행동하다","opts":[{"en":"hide their identity from contributors","ko":"기여자들에게 자신의 정체를 숨기다"},{"en":"share information only with contributors","ko":"기여자들에게만 정보를 공유하다"},{"en":"compete with contributors for money","ko":"돈을 두고 기여자들과 경쟁하다"},{"en":"ask contributors about their reputations","ko":"기여자들에게 그들의 평판을 묻다"}],"orig":false},{"s":2,"ans":"give money to other participants based on their reputations","ans_ko":"평판에 근거해 다른 참가자들에게 돈을 주다","opts":[{"en":"keep all the money without sharing it","ko":"돈을 나누지 않고 전부 갖다"},{"en":"choose the rules of the game for themselves","ko":"게임의 규칙을 직접 정하다"},{"en":"vote on who should leave the experiment","ko":"누가 실험을 떠나야 할지 투표하다"},{"en":"trade money for time with their partners","ko":"파트너와 돈을 시간과 맞바꾸다"}],"orig":false},{"s":3,"ans":"given responsibility for more money","ans_ko":"더 많은 돈에 대한 책임이 주어진","opts":[{"en":"given responsibility for less money","ko":"더 적은 돈에 대한 책임이 주어진"},{"en":"asked to explain their actions more often","ko":"자신의 행동을 더 자주 설명하도록 요청받은"},{"en":"treated with greater suspicion","ko":"더 큰 의심을 받은"},{"en":"rated as less trustworthy","ko":"덜 신뢰할 만하다고 평가된"}],"orig":false},{"s":4,"ans":"been found by other researchers","ans_ko":"다른 연구자들에 의해 발견되었다","opts":[{"en":"been rejected by other researchers","ko":"다른 연구자들에 의해 거부되었다"},{"en":"never been repeated by anyone","ko":"누구에 의해서도 반복된 적이 없다"},{"en":"not been reported until recently","ko":"최근까지 보고되지 않았다"},{"en":"been found only in this experiment","ko":"이 실험에서만 발견되었다"}],"orig":false},{"s":5,"ans":"chosen more often as interaction partners","ans_ko":"상호 작용 파트너로 더 자주 선택된다","opts":[{"en":"chosen less often as interaction partners","ko":"상호 작용 파트너로 덜 자주 선택된다"},{"en":"ignored more often as team members","ko":"팀 구성원으로 더 자주 무시된다"},{"en":"punished more often as group members","ko":"집단 구성원으로 더 자주 처벌받는다"},{"en":"watched more closely as new employees","ko":"신입 직원으로 더 면밀히 감시받는다"}],"orig":false}]},{"id":"2311-41","label":"23년 11월 41번","taught":false,"modes":["ko","abc","mun","blank"],"en":["In Western society, many music performance settings make a clear distinction between performers and audience members: the performers are the “doers” and those in the audience take a decidedly passive role.","The performance space itself may further reinforce the distinction with a physical separation between the stage and audience seating.","Perhaps because this distinction is so common, audiences seem to greatly value opportunities to have special “access” to performers that affords understanding about performers’ style of music.","Some performing musicians have won great approval by regularly incorporating “audience participation” into their concerts.","Whether by leading a sing-along activity or teaching a rhythm to be clapped at certain points, including audience members in the music making can boost the level of engagement and enjoyment for all involved.","Performers who are uncomfortable leading audience participation can still connect with the audience simply by giving a special glimpse of the performer’s perspective.","It is quite common in classical music to provide audiences with program notes.","Typically, this text in a program gives background information about pieces of music being performed and perhaps biographical information about historically significant composers.","What may be of more interest to audience members is background information about the very performers who are onstage, including an explanation of why they have chosen the music they are presenting.","Such insight can make audience members feel closer to the musicians onstage, both metaphorically and emotionally.","This connection will likely enhance the expressive and communicative experience."],"ko":[" 서양 사회에서, 많은 음악 공연 상황은 공연자와 청중 사이에 명확한 구분을 만든다. 공연자들은 ‘행위자들’이고, 청중 속 사람들은 분명히 수동적인 역할을 맡는다."," 공연 공간 그 자체가 무대와 청중석 사이의 물리적 분리로 구분을 더 강화할 수 있다."," 아마도 이러한 구분이 너무 흔하기 때문에, 청중들은 공연자의 음악 스타일에 대한 이해를 제공하는 공연자에 대한 특별한 ‘접근’을 할 기회들에 크게 가치를 부여하는 것처럼 보인다."," 일부 공연 음악가는 정기적으로 그들의 콘서트에 ‘청중 참여’를 포함함으로써 큰 호응을 받아 왔다."," 함께 노래 부르기 활동을 하든지 지정된 지점에서 박수를 치도록 리듬을 가르치든지, 음악을 만드는 데 있어서 청중 구성원을 포함하는 것은 모든 참여자의 참여와 즐거움의 수준을 높일 수 있다."," 청중 참여를 이끄는 것에 불편함을 느끼는 공연자들은 단순히 그 공연자의 관점을 특별히 흘끗 보여줌으로써 청중과 여전히 이어질 수 있다."," 클래식 음악에서는 청중에게 프로그램 해설을 제공하는 것이 상당히 흔하다."," 전형적으로, 이러한 프로그램의 텍스트는 연주되는 음악 작품에 대한 배경 정보와 아마도 역사적으로 중요한 작곡가들에 대한 전기(傳記) 정보를 제공한다."," 청중들에게 더 흥미로울 수도 있는 것은 공연자들이 그들이 선보이고 있는 음악을 왜 선택했는지에 대한 설명을 포함한, 무대 위에 있는 바로 그 연주가에 관한 배경 정보이다."," 그러한 통찰력은 청중들이 무대 위에 있는 음악가들에게 비유적이고 감정적으로 가깝게 느끼게 만들 수 있다."," 이러한 연결은 표현적이고 소통적인 경험을 아마 향상시킬 것이다."],"theme":"청중과 공연자 사이의 거리를 좁히려면, 청중 참여를 이끌거나 연주자 자신의 이야기를 들려주어 청중을 음악 경험에 끌어들이면 좋다.","blanks":[{"s":0,"ans":"a clear distinction between performers and audience members","ans_ko":"공연자와 청중 사이의 명확한 구분","opts":[{"en":"a friendly agreement among musicians and managers","ko":"음악가와 관리자 사이의 우호적인 합의"},{"en":"a sharp rise in the number of concerts","ko":"공연 수의 급격한 증가"},{"en":"a strong demand for cheaper concert tickets","ko":"더 저렴한 공연 입장권에 대한 강한 수요"},{"en":"a careful choice of famous composers","ko":"유명한 작곡가들의 신중한 선택"}],"orig":false},{"s":1,"ans":"a physical separation","ans_ko":"물리적 분리","opts":[{"en":"a friendly connection","ko":"친근한 연결"},{"en":"a clear comparison","ko":"분명한 비교"},{"en":"a shared agreement","ko":"공유된 합의"},{"en":"an equal distribution","ko":"동등한 분배"}],"orig":false},{"s":3,"ans":"won great approval","ans_ko":"큰 호응을 얻었다","opts":[{"en":"lost many fans","ko":"많은 팬을 잃었다"},{"en":"caused great confusion","ko":"큰 혼란을 일으켰다"},{"en":"faced harsh criticism","ko":"심한 비판에 직면했다"},{"en":"earned little money","ko":"돈을 거의 벌지 못했다"}],"orig":false},{"s":4,"ans":"boost the level of engagement and enjoyment","ans_ko":"참여와 즐거움의 수준을 높이다","opts":[{"en":"lower the level of effort and cost","ko":"노력과 비용의 수준을 낮추다"},{"en":"limit the number of songs and rhythms","ko":"노래와 리듬의 수를 제한하다"},{"en":"test the skill of singers and drummers","ko":"가수와 드러머의 실력을 시험하다"},{"en":"shorten the length of concerts and rehearsals","ko":"공연과 리허설의 길이를 줄이다"}],"orig":false},{"s":5,"ans":"giving a special glimpse of the performer’s perspective","ans_ko":"공연자의 관점을 특별히 흘끗 보여 주는 것","opts":[{"en":"teaching the audience a difficult rhythm","ko":"청중에게 어려운 리듬을 가르치는 것"},{"en":"hiding the performer’s feelings from them","ko":"공연자의 감정을 그들에게서 숨기는 것"},{"en":"moving the stage closer to the seats","ko":"무대를 좌석에 더 가깝게 옮기는 것"},{"en":"lowering the price of the tickets","ko":"입장권 가격을 낮추는 것"}],"orig":false},{"s":6,"ans":"provide audiences with program notes","ans_ko":"청중에게 프로그램 해설을 제공하다","opts":[{"en":"charge audiences for extra seats","ko":"청중에게 추가 좌석에 요금을 받다"},{"en":"seat audiences near the stage","ko":"청중을 무대 근처에 앉히다"},{"en":"offer audiences free recordings","ko":"청중에게 무료 녹음을 제공하다"},{"en":"teach audiences basic music theory","ko":"청중에게 기초 음악 이론을 가르치다"}],"orig":false},{"s":9,"ans":"feel closer to the musicians onstage","ans_ko":"무대 위의 음악가들에게 더 가깝게 느끼다","opts":[{"en":"feel more distant from the musicians onstage","ko":"무대 위의 음악가들에게서 더 멀게 느끼다"},{"en":"feel bored by the musicians onstage","ko":"무대 위의 음악가들에게 지루함을 느끼다"},{"en":"feel sorry for the musicians onstage","ko":"무대 위의 음악가들을 안쓰럽게 느끼다"},{"en":"feel jealous of the musicians onstage","ko":"무대 위의 음악가들을 질투하다"}],"orig":false}]},{"id":"2410-22","label":"24년 10월 22번","taught":false,"modes":["ko","mun","blank"],"en":["To determine the mass of my bowling ball, I might put it onto a balance and compare it with a known mass, such as a number of metal cubes each weighing 1, 10, or 100 grams.","Things get much more complicated if I want to know the mass of a distant star.","How do I measure it?","We can roughly say that measuring the mass of a star involves various theories.","If we want to measure the mass of a binary star, we first determine a center of mass between the two stars, then their distance from that center which we can then use, together with a value for the period and a certain instance of Kepler’s Third Law, to calculate the mass.","In other words, in order to “measure” the star mass, we measure other quantities and use those values, together with certain equations, to calculate the mass.","Measurement is not a simple and unmediated estimation of independently existing properties, but a determination of certain magnitudes before the background of a number of accepted theories."],"ko":["볼링공의 질량을 알아내려면, 나는 그것을 저울에 올려놓고, 각각 1g, 10g, 또는 100g인 여러 개의 금속 큐브 같은 이미 알고 있는 질량과 비교할 수 있다.","만약 내가 먼 별의 질량을 알고 싶다면 상황은 훨씬 더 복잡해진다.","나는 그것을 어떻게 측정할까?","우리는 별의 질량을 측정하는 일에 다양한 이론이 포함된다고 대략적으로 말할 수 있다.","우리가 쌍성의 질량을 측정하고 싶다면, 먼저 두 별 사이의 질량 중심을 구하고, 그다음에 그 중심으로부터의 그것들의 거리를 구하는데, 이 거리는 공전 주기의 값, 케플러 제3법칙의 특정한 사례와 함께 질량을 계산하는 데 쓸 수 있다.","다시 말해서, 별의 질량을 ‘측정’하기 위해서 우리는 다른 수치들을 측정하고 그 값들을 특정 방정식들과 함께 사용하여 질량을 계산한다.","측정은 독립적으로 존재하는 값들을 단순하고 중재되지 않은 채 추정하는 것이 아니라, 이미 정립된 여러 이론들을 배경으로 특정 크기들을 결정하는 것이다."],"theme":"별의 질량 같은 값은 그냥 재는 것이 아니라, 이미 정립된 이론을 바탕으로 다른 수치들을 재서 계산하는 것이다.","blanks":[{"s":0,"ans":"compare it with a known mass","ans_ko":"이미 알고 있는 질량과 그것을 비교하다","opts":[{"en":"compare it with the mass of a star","ko":"그것을 별의 질량과 비교하다"},{"en":"compare it with every other ball","ko":"그것을 다른 모든 공과 비교하다"},{"en":"repeat it many times to avoid error","ko":"오차를 피하려고 그것을 여러 번 반복하다"},{"en":"compare it with an unknown mass","ko":"그것을 알지 못하는 질량과 비교하다"}],"orig":false},{"s":1,"ans":"much more complicated","ans_ko":"훨씬 더 복잡한","opts":[{"en":"far more profitable","ko":"훨씬 더 이익이 되는"},{"en":"a little easier","ko":"조금 더 쉬운"},{"en":"hardly any different","ko":"거의 다르지 않은"},{"en":"increasingly boring","ko":"점점 더 지루한"}],"orig":false},{"s":3,"ans":"involves various theories","ans_ko":"다양한 이론을 포함하다","opts":[{"en":"requires no special tools","ko":"특별한 도구가 필요 없다"},{"en":"depends on a single formula","ko":"하나의 공식에만 의존하다"},{"en":"begins with a known mass","ko":"알려진 질량에서 시작하다"},{"en":"avoids complex equations","ko":"복잡한 방정식을 피하다"}],"orig":false},{"s":4,"ans":"a center of mass between the two stars","ans_ko":"두 별 사이의 질량 중심","opts":[{"en":"the total number of nearby stars","ko":"주변 별들의 총 개수"},{"en":"a balance with a known mass","ko":"알려진 질량이 있는 저울"},{"en":"the speed of light in space","ko":"우주에서의 빛의 속도"},{"en":"the age of the brighter star","ko":"더 밝은 별의 나이"}],"orig":false},{"s":5,"ans":"measure other quantities","ans_ko":"다른 수치들을 측정하다","opts":[{"en":"ignore other quantities","ko":"다른 수치들을 무시하다"},{"en":"weigh the star directly","ko":"별을 직접 무게 재다"},{"en":"repeat the same measurement","ko":"같은 측정을 반복하다"},{"en":"avoid all equations","ko":"모든 방정식을 피하다"}],"orig":false},{"s":6,"ans":"a determination of certain magnitudes","ans_ko":"특정 크기들의 결정","opts":[{"en":"a direct estimation of existing properties","ko":"이미 존재하는 값들의 직접적인 추정"},{"en":"a simple reading of a balance","ko":"저울 눈금의 단순한 읽기"},{"en":"a guess about unknown stars","ko":"알려지지 않은 별들에 대한 추측"},{"en":"an observation of nearby objects","ko":"가까운 물체들의 관찰"}],"orig":false},{"s":6,"ans":"a number of accepted theories","ans_ko":"여러 정립된 이론들","opts":[{"en":"a few untested guesses","ko":"검증되지 않은 몇몇 추측들"},{"en":"a single personal opinion","ko":"하나의 개인적 의견"},{"en":"every possible experiment","ko":"가능한 모든 실험"},{"en":"no existing theory at all","ko":"존재하는 이론이 전혀 없음"}],"orig":false}]},{"id":"2410-23","label":"24년 10월 23번","taught":false,"modes":["ko","abc","mun","blank"],"en":["Based on discoveries in neuroscience, pain and pleasure are formed and processed in the same area of the brain.","Our bodies constantly strive for homeostasis, which is defined as the balance of bodily functions.","Without the body’s effective compensatory mechanisms, which may cushion potential highs and lows, we would not be capable of surviving.","Pleasure and pain are like two sides of the same coin; they seem to work together and are heavily reliant on one another and keep balance.","If you imagine pleasure and pain as the two opposite points on a scale, you can easily understand that as one of the two points rises, the other must correspondingly fall.","We’ve all heard the expression, “No pain, no gain.”","Well, according to psychiatrist Dr. Anna Lembke, there may be some truth to these words.","She says that our attempts to escape being miserable are in fact making us even more miserable.","This is because pain is actually an essential component of our ability to maintain a neutral state, and allowing it will in turn reset our internal scale back to balance."],"ko":["뇌과학의 발견들에 따르면, 고통과 쾌락은 뇌의 같은 영역에서 형성되고 처리된다.","우리 몸은 끊임없이 항상성을 추구하는데, 항상성은 몸의 기능들의 균형이라고 정의된다.","잠재적인 최고점과 최저점을 완화시킬 수 있는 몸의 효과적인 보상 기제가 없다면 우리는 생존할 수 없을 것이다.","쾌락과 고통은 같은 동전의 양면과 같아서, 함께 작동하는 것처럼 보이고 서로에게 크게 의존하며 균형을 유지한다.","만약 쾌락과 고통을 저울 위의 두 반대 지점으로 상상한다면, 두 지점 중 하나가 올라가면 다른 하나는 그에 맞춰 내려갈 수밖에 없다는 것을 쉽게 이해할 수 있다.","우리는 모두 ‘고통 없이는 얻는 것도 없다.’라는 표현을 들어 본 적이 있다.","자, 정신과 의사인 Anna Lembke 박사에 따르면, 이 말에는 어느 정도 진실이 있을 수 있다.","그녀는 비참함에서 벗어나려는 우리의 시도가 사실은 우리를 훨씬 더 비참하게 만들고 있다고 말한다.","이는 고통이 실제로 중립적인 상태를 유지하는 우리 능력의 필수적인 구성 요소이기 때문이며, 고통을 받아들이면 결과적으로 우리의 내부 저울이 다시 균형 상태로 맞춰질 것이다."],"theme":"쾌락과 고통은 한 동전의 양면처럼 서로 균형을 맞추기 때문에, 고통을 피하려 할수록 오히려 더 괴로워진다.","blanks":[{"s":1,"ans":"the balance of bodily functions","ans_ko":"몸의 기능들의 균형","opts":[{"en":"the removal of all bodily pain","ko":"모든 신체적 고통의 제거"},{"en":"the cycle of repeated pleasure","ko":"반복되는 쾌락의 순환"},{"en":"the strength of the nervous system","ko":"신경계의 강도"},{"en":"the growth of bodily functions","ko":"몸의 기능들의 성장"}],"orig":false},{"s":2,"ans":"effective compensatory mechanisms","ans_ko":"효과적인 보상 기제","opts":[{"en":"strong emotional reactions","ko":"강한 감정적 반응"},{"en":"unlimited sources of pleasure","ko":"무한한 쾌락의 원천"},{"en":"constant alertness to danger","ko":"위험에 대한 끊임없는 경계"},{"en":"extreme highs and lows","ko":"극단적인 최고점과 최저점"}],"orig":false},{"s":3,"ans":"like two sides of the same coin","ans_ko":"같은 동전의 양면과 같은","opts":[{"en":"enemies that fight each other","ko":"서로 싸우는 적"},{"en":"two separate parts of the brain","ko":"뇌의 두 개의 분리된 부분"},{"en":"completely independent experiences","ko":"완전히 독립적인 경험"},{"en":"equal in every possible way","ko":"가능한 모든 면에서 동일한"}],"orig":false},{"s":4,"ans":"the other must correspondingly fall","ans_ko":"다른 하나는 그에 맞춰 내려갈 수밖에 없다","opts":[{"en":"the other must rise along with it","ko":"다른 하나도 함께 올라갈 수밖에 없다"},{"en":"both must always stay level","ko":"둘 다 항상 수평을 유지할 수밖에 없다"},{"en":"the scale must first be reset","ko":"저울이 먼저 다시 맞춰져야만 한다"},{"en":"all the other points must fall","ko":"다른 모든 지점이 내려갈 수밖에 없다"}],"orig":false},{"s":6,"ans":"there may be some truth to these words","ans_ko":"이 말에는 어느 정도 진실이 있을 수 있다","opts":[{"en":"there is no truth to these words","ko":"이 말에는 진실이 전혀 없다"},{"en":"these words are always completely true","ko":"이 말은 언제나 완전히 진실이다"},{"en":"no one has ever heard these words","ko":"아무도 이 말을 들어 본 적이 없다"},{"en":"she disagrees with all these words","ko":"그녀는 이 말 전부에 동의하지 않는다"}],"orig":false},{"s":7,"ans":"are in fact making us even more miserable","ans_ko":"사실은 우리를 훨씬 더 비참하게 만들고 있다","opts":[{"en":"are in fact making us feel less pain","ko":"사실은 우리가 고통을 덜 느끼게 하고 있다"},{"en":"will in turn reset our internal scale","ko":"결과적으로 우리의 내부 저울을 다시 맞출 것이다"},{"en":"are sure to make everyone more miserable","ko":"모든 사람을 더 비참하게 만들 것이 분명하다"},{"en":"are never able to make us miserable","ko":"결코 우리를 비참하게 만들 수 없다"}],"orig":false},{"s":8,"ans":"an essential component of our ability","ans_ko":"우리 능력의 필수적인 구성 요소","opts":[{"en":"an unnecessary part of our ability","ko":"우리 능력의 불필요한 부분"},{"en":"the only source of our ability","ko":"우리 능력의 유일한 원천"},{"en":"a harmful barrier to our ability","ko":"우리 능력에 대한 해로운 장벽"},{"en":"a simple result of our ability","ko":"우리 능력의 단순한 결과"}],"orig":false}]},{"id":"2410-24","label":"24년 10월 24번","taught":false,"modes":["ko","abc","mun","blank"],"en":["Manufacturers masterfully sow seeds of doubt about the adequacy of our current devices.","Suddenly, the phone that was your lifeline a year ago is now a museum piece, unable to keep pace with your digital demands.","And thus, the itch to upgrade begins, often before there’s a genuine need.","This cycle isn’t just confined to our digital companions.","It spills over into almost every aspect of consumer electronics, from the self-driving car to the smart fridge.","Every product seems to be on an unstoppable march towards the next version, the next generation that promises to revolutionize your life.","What’s fascinating, or perhaps disturbing, is the utter efficacy of this cycle in shaping our desires.","It’s not so much that we want the newest device; we’re led to believe we need it.","The distinction between want and need blurs, shifting our financial priorities in favor of staying current with trends.","For all the logical arguments against this ceaseless upgrading, the temptation remains compelling."],"ko":["생산자들은 우리의 현재 기기들이 충분한지에 대한 의심의 씨앗을 능숙하게 뿌린다.","갑자기, 1년 전에는 당신의 생명줄이었던 휴대폰이 이제는 당신의 디지털 요구를 따라가지 못하는 박물관 전시품이 된다.","그리하여 종종 진짜 필요가 생기기도 전에 업그레이드하고 싶은 욕구가 시작된다.","이러한 순환은 우리의 디지털 기기에만 국한되지 않는다.","이것은 자율 주행 자동차부터 스마트 냉장고에 이르기까지 소비자 전자 제품의 거의 모든 영역으로 번져 나간다.","모든 제품은 다음 버전, 즉 당신의 삶에 혁신을 일으키겠다고 약속하는 다음 세대를 향해 멈출 수 없이 행진하는 것처럼 보인다.","흥미롭거나 어쩌면 불편한 점은, 우리의 욕구를 형성하는 이 순환의 압도적인 효과이다.","우리가 가장 최신 기기를 원한다기보다는, 그것이 필요하다고 믿도록 유도된다.","원하는 것과 필요한 것의 구분이 흐려지면서, 우리의 재정적 우선순위가 최신 유행을 따라가는 쪽으로 바뀐다.","이런 끊임없는 업그레이드에 반대하는 모든 논리적인 주장에도 불구하고, 그 유혹은 여전히 강력하다."],"theme":"제조사가 현재 기기를 부족해 보이게 만들어, 우리는 필요하지 않아도 새 기기가 필요하다고 믿게 된다.","blanks":[{"s":0,"ans":"the adequacy of our current devices","ans_ko":"우리의 현재 기기들이 충분한지","opts":[{"en":"the safety of all new devices","ko":"모든 새 기기의 안전성"},{"en":"the speed of the next generation","ko":"다음 세대의 속도"},{"en":"the need for new manufacturers","ko":"새로운 제조사의 필요성"},{"en":"the failure of every old device","ko":"모든 옛 기기의 고장"}],"orig":false},{"s":1,"ans":"unable to keep pace with your digital demands","ans_ko":"당신의 디지털 요구를 따라가지 못하는","opts":[{"en":"able to meet your every digital demand","ko":"당신의 모든 디지털 요구를 충족할 수 있는"},{"en":"likely to last for another ten years","ko":"앞으로 10년은 더 쓸 수 있을 것 같은"},{"en":"known for its simple design","ko":"단순한 디자인으로 알려진"},{"en":"ready to compete with the new ones","ko":"새 기기들과 경쟁할 준비가 된"}],"orig":false},{"s":2,"ans":"often before there’s a genuine need","ans_ko":"종종 진짜 필요가 생기기도 전에","opts":[{"en":"often after the device stops working","ko":"종종 기기가 작동을 멈춘 뒤에"},{"en":"always before the new model appears","ko":"언제나 새 모델이 나오기 전에"},{"en":"usually when our friends ask for help","ko":"대개 친구가 도움을 청할 때"},{"en":"mainly because of the lower prices","ko":"주로 더 낮은 가격 때문에"}],"orig":false},{"s":4,"ans":"almost every aspect of consumer electronics","ans_ko":"소비자 전자 제품의 거의 모든 영역","opts":[{"en":"a few unusual kinds of cars","ko":"몇몇 특이한 종류의 자동차"},{"en":"only the newest smart fridges","ko":"가장 새로운 스마트 냉장고뿐"},{"en":"the lives of the manufacturers","ko":"제조사들의 삶"},{"en":"every part of online shopping","ko":"온라인 쇼핑의 모든 부분"}],"orig":false},{"s":6,"ans":"the utter efficacy of this cycle","ans_ko":"이 순환의 압도적인 효과","opts":[{"en":"the weak influence of this cycle","ko":"이 순환의 약한 영향력"},{"en":"the rapid spread of this cycle","ko":"이 순환의 빠른 확산"},{"en":"the high price of this cycle","ko":"이 순환의 높은 가격"},{"en":"the long history of this cycle","ko":"이 순환의 긴 역사"}],"orig":false},{"s":7,"ans":"we’re led to believe we need it","ans_ko":"우리는 그것이 필요하다고 믿도록 유도된다","opts":[{"en":"we’re forced by law to buy it","ko":"우리는 법에 의해 그것을 사도록 강요된다"},{"en":"we’re free to choose whether we need it","ko":"우리는 그것이 필요한지 자유롭게 선택한다"},{"en":"we’re taught that it is not needed","ko":"우리는 그것이 필요하지 않다고 배운다"},{"en":"we’re sure we want it the most","ko":"우리는 그것을 가장 원한다고 확신한다"}],"orig":false},{"s":8,"ans":"shifting our financial priorities","ans_ko":"우리의 재정적 우선순위를 바꾸면서","opts":[{"en":"protecting our financial savings","ko":"우리의 재정적 저축을 지키면서"},{"en":"reducing our financial burdens","ko":"우리의 재정적 부담을 줄이면서"},{"en":"doubling our financial income","ko":"우리의 재정적 수입을 두 배로 늘리면서"},{"en":"limiting our financial choices","ko":"우리의 재정적 선택을 제한하면서"}],"orig":false}]},{"id":"2410-26","label":"24년 10월 26번","taught":false,"modes":["ko","mun","blank"],"en":["Helen Suzman was an activist against apartheid, a racist political and social system in the Republic of South Africa.","Suzman was born to Jewish immigrant parents in Germiston in the Union of South Africa in 1917.","While working as a lecturer on economic history at Witwatersrand University, she joined the South African Institute of Race Relations.","In 1953, she joined the United Party and was elected to Parliament, but when the United Party adopted a more moderate stance on apartheid, Suzman and other progressive members left it and formed the Progressive Party in 1959.","Suzman tirelessly fought against apartheid, exposing the government’s abuses and challenging its laws for a total of 36 years in Parliament.","Even after her retirement in 1989, she continued to advocate for a multi-racial democracy in the Republic of South Africa and influenced the drafting of the country’s new constitution after the end of apartheid.","She remained an active voice for human rights and democracy until her death in 2009."],"ko":["Helen Suzman은 남아프리카 공화국의 인종 차별적인 정치·사회 체제인 아파르트헤이트에 맞선 운동가였다.","Suzman은 1917년에 남아프리카 연방의 Germiston에서 유대인 이민자 부모 밑에서 태어났다.","Witwatersrand 대학에서 경제사 강사로 일하던 중에 그녀는 남아프리카 인종 관계 연구소에 가입했다.","1953년에 그녀는 통합당에 가입하여 의회에 선출되었지만, 통합당이 아파르트헤이트에 대해 더 온건한 입장을 채택하자 Suzman과 다른 진보적인 당원들은 통합당을 떠나 1959년에 진보당을 만들었다.","Suzman은 의회에서 총 36년 동안 정부의 남용을 폭로하고 그 법들에 도전하며 아파르트헤이트에 맞서 지칠 줄 모르고 싸웠다.","1989년에 은퇴한 뒤에도 그녀는 남아프리카 공화국의 다인종 민주주의를 계속 옹호했고, 아파르트헤이트가 끝난 뒤 그 나라의 새 헌법을 작성하는 데 영향을 주었다.","그녀는 2009년에 사망할 때까지 인권과 민주주의를 위한 적극적인 목소리로 남아 있었다."],"theme":"Helen Suzman은 의회에서 36년간 아파르트헤이트에 맞서 싸웠고, 은퇴 후에도 인권과 민주주의를 위해 활동했다.","blanks":[{"s":1,"ans":"born to Jewish immigrant parents","ans_ko":"유대인 이민자 부모 밑에서 태어난","opts":[{"en":"born to wealthy British farmers","ko":"부유한 영국 농부 부모 밑에서 태어난"},{"en":"raised by her German relatives","ko":"독일인 친척 손에 자란"},{"en":"born to the leaders of a party","ko":"어느 정당의 지도자들 밑에서 태어난"},{"en":"born to a family of lecturers","ko":"강사 집안에서 태어난"}],"orig":false},{"s":2,"ans":"the South African Institute of Race Relations","ans_ko":"남아프리카 인종 관계 연구소","opts":[{"en":"the United Party of South Africa","ko":"남아프리카 통합당"},{"en":"the Progressive Party in Parliament","ko":"의회의 진보당"},{"en":"the Institute of Economic History","ko":"경제사 연구소"},{"en":"the Republic’s Human Rights Council","ko":"공화국 인권 위원회"}],"orig":false},{"s":3,"ans":"adopted a more moderate stance on apartheid","ans_ko":"아파르트헤이트에 대해 더 온건한 입장을 채택했다","opts":[{"en":"adopted a much stricter stance on apartheid","ko":"아파르트헤이트에 대해 훨씬 엄격한 입장을 채택했다"},{"en":"refused to take any stance on apartheid","ko":"아파르트헤이트에 대해 어떤 입장도 취하기를 거부했다"},{"en":"voted to end apartheid completely","ko":"아파르트헤이트를 완전히 끝내자고 투표했다"},{"en":"joined the Progressive Party instead","ko":"대신 진보당에 합류했다"}],"orig":false},{"s":3,"ans":"left it and formed the Progressive Party","ans_ko":"통합당을 떠나 진보당을 만들었다","opts":[{"en":"stayed and led the United Party","ko":"남아서 통합당을 이끌었다"},{"en":"left it and joined the National Party","ko":"통합당을 떠나 국민당에 합류했다"},{"en":"left it and became a university lecturer","ko":"통합당을 떠나 대학 강사가 되었다"},{"en":"stayed and changed its name in 1953","ko":"남아서 1953년에 당명을 바꿨다"}],"orig":false},{"s":4,"ans":"tirelessly fought against apartheid","ans_ko":"지칠 줄 모르고 아파르트헤이트에 맞서 싸웠다","opts":[{"en":"quietly accepted the laws of apartheid","ko":"아파르트헤이트의 법들을 조용히 받아들였다"},{"en":"rarely spoke about apartheid in Parliament","ko":"의회에서 아파르트헤이트에 대해 거의 말하지 않았다"},{"en":"briefly worked against apartheid abroad","ko":"해외에서 잠시 아파르트헤이트에 맞서 일했다"},{"en":"fought only for the rights of her party","ko":"오직 자기 당의 권리만을 위해 싸웠다"}],"orig":false},{"s":5,"ans":"continued to advocate for a multi-racial democracy","ans_ko":"다인종 민주주의를 계속 옹호했다","opts":[{"en":"stopped advocating for a multi-racial democracy","ko":"다인종 민주주의를 옹호하기를 멈췄다"},{"en":"continued to serve in Parliament for years","ko":"수년간 계속 의회에서 일했다"},{"en":"returned to teach economic history","ko":"경제사를 가르치는 일로 돌아갔다"},{"en":"began to oppose the new constitution","ko":"새 헌법에 반대하기 시작했다"}],"orig":false},{"s":6,"ans":"an active voice for human rights and democracy","ans_ko":"인권과 민주주의를 위한 적극적인 목소리","opts":[{"en":"a silent observer of politics and law","ko":"정치와 법의 조용한 관찰자"},{"en":"the only voice for human rights in Africa","ko":"아프리카 인권의 유일한 목소리"},{"en":"the leader of the Progressive Party","ko":"진보당의 지도자"},{"en":"a famous judge of human rights cases","ko":"인권 사건을 다루는 유명한 판사"}],"orig":false}]},{"id":"2410-29","label":"24년 10월 29번","taught":true,"modes":["ko","abc","mun","blank"],"en":["Conditioned Place Preference is a way of finding out what animals want.","Researchers train them to associate one place with an experience such as food or a loud noise and another place with something completely different, usually where nothing happens.","The two places are made obviously different to make it as easy as possible for the animal to associate each place with what happened to it there.","The animal’s preference for being in one place or another is measured both before and after its experiences in the two places.","If there is a shift in where the animal chooses to spend its time for the reward, this suggests that it liked the experience and is trying to repeat it.","Conversely, if it now avoids the place the stimulus appeared and starts to prefer the place it did not experience it, then this suggests that it found the stimulus unpleasant.","For example, mice with cancer show a preference for the place where they have been given morphine, a drug used to relieve pain, rather than where they have received saline whereas healthy mice developed no such preference.","This suggests that the mice with cancer wanted the morphine."],"ko":["조건부 장소 선호는 동물들이 무엇을 원하는지 알아내는 하나의 방법이다.","연구자들은 동물이 한 장소를 음식이나 시끄러운 소리 같은 경험과, 또 다른 장소를 완전히 다른 어떤 것과 연관 짓도록 훈련시키는데, 대개 그곳에서는 아무 일도 일어나지 않는다.","그 두 장소는 동물이 각 장소를 그곳에서 자신에게 일어난 일과 가능한 한 쉽게 연관 짓도록 분명히 다르게 만들어진다.","한 장소 또는 다른 장소에 있는 것에 대한 동물의 선호는 그 두 장소에서의 경험 전과 후에 모두 측정된다.","동물이 보상을 위해 어디서 시간을 보낼지 선택하는 데 변화가 있다면, 이것은 그 동물이 그 경험을 좋아했고 그것을 반복하려 하고 있음을 시사한다.","반대로, 동물이 이제 자극이 나타났던 장소를 피하고 그것을 경험하지 않은 장소를 선호하기 시작한다면, 이것은 그 동물이 그 자극을 불쾌하게 느꼈음을 시사한다.","예를 들어, 암에 걸린 쥐는 식염수를 받았던 곳보다 통증을 완화하는 데 쓰는 약인 모르핀이 주어졌던 곳에 대한 선호를 보인 반면, 건강한 쥐는 그런 선호를 보이지 않았다.","이것은 암에 걸린 쥐가 모르핀을 원했음을 시사한다."],"theme":"조건부 장소 선호 실험은 동물이 어느 장소에서 시간을 보내는지를 보고 그 동물이 무엇을 원하는지 알아낸다.","blanks":[{"s":1,"ans":"another place with something completely different","ans_ko":"완전히 다른 어떤 것이 있는 또 다른 장소","opts":[{"en":"another place with the same experience","ko":"같은 경험이 있는 또 다른 장소"},{"en":"another place with other animals","ko":"다른 동물들이 있는 또 다른 장소"},{"en":"every place with a loud noise","ko":"시끄러운 소리가 나는 모든 장소"},{"en":"another place with a larger cage","ko":"더 큰 우리가 있는 또 다른 장소"}],"orig":false},{"s":2,"ans":"made obviously different","ans_ko":"분명히 다르게 만들어진","opts":[{"en":"made exactly the same","ko":"똑같이 만들어진"},{"en":"made slightly different","ko":"약간만 다르게 만들어진"},{"en":"made equally pleasant","ko":"똑같이 즐겁게 만들어진"},{"en":"made much larger than before","ko":"이전보다 훨씬 크게 만들어진"}],"orig":false},{"s":3,"ans":"both before and after its experiences","ans_ko":"경험 전과 후에 모두","opts":[{"en":"only after its experiences","ko":"경험한 뒤에만"},{"en":"just before its experiences","ko":"경험하기 바로 전에만"},{"en":"during each of its experiences","ko":"각 경험을 하는 동안"},{"en":"twice a day throughout its experiences","ko":"경험하는 내내 하루에 두 번"}],"orig":false},{"s":4,"ans":"liked the experience","ans_ko":"그 경험을 좋아했다","opts":[{"en":"disliked the experience","ko":"그 경험을 싫어했다"},{"en":"forgot the experience","ko":"그 경험을 잊었다"},{"en":"feared the experience","ko":"그 경험을 두려워했다"},{"en":"missed the experience","ko":"그 경험을 그리워했다"}],"orig":false},{"s":5,"ans":"found the stimulus unpleasant","ans_ko":"그 자극을 불쾌하게 느꼈다","opts":[{"en":"found the reward satisfying","ko":"그 보상을 만족스럽게 느꼈다"},{"en":"lost interest in the stimulus","ko":"그 자극에 흥미를 잃었다"},{"en":"became used to the stimulus","ko":"그 자극에 익숙해졌다"},{"en":"found the new place unfamiliar","ko":"그 새로운 장소를 낯설게 느꼈다"}],"orig":false},{"s":6,"ans":"where they have received saline","ans_ko":"식염수를 받았던 곳","opts":[{"en":"where they have felt no pain","ko":"아무 고통도 느끼지 않았던 곳"},{"en":"where healthy mice have lived","ko":"건강한 쥐들이 살았던 곳"},{"en":"where the cage was largest","ko":"우리가 가장 컸던 곳"},{"en":"where they have taken a new drug","ko":"새로운 약을 먹었던 곳"}],"orig":false},{"s":7,"ans":"the mice with cancer wanted the morphine","ans_ko":"암에 걸린 쥐가 모르핀을 원했다","opts":[{"en":"the healthy mice wanted the morphine","ko":"건강한 쥐가 모르핀을 원했다"},{"en":"the mice with cancer disliked the morphine","ko":"암에 걸린 쥐가 모르핀을 싫어했다"},{"en":"all mice wanted the morphine","ko":"모든 쥐가 모르핀을 원했다"},{"en":"the mice with cancer feared the saline","ko":"암에 걸린 쥐가 식염수를 두려워했다"}],"orig":false}]},{"id":"2410-30","label":"24년 10월 30번","taught":true,"modes":["ko","abc","mun","blank"],"en":["Near the equator, many species of bird breed all year round.","But in temperate and polar regions, the breeding seasons of birds are often sharply defined.","They are triggered mainly by changes in day length.","If all goes well, the outcome is that birds raise their young when the food supply is at its peak.","Most birds are not simply reluctant to breed at other times but they are also physically incapable of doing so.","This is because their reproductive system shrinks, which helps flying birds save weight.","The main exception to this rule are nomadic desert species.","These can initiate their breeding cycle within days of rain.","It’s for making the most of the sudden breeding opportunity.","Also, different species divide the breeding season up in different ways.","Most seabirds raise a single brood.","In warm regions, however, songbirds may raise several families in a few months.","In an exceptionally good year, a pair of House Sparrows, a kind of songbird, can raise successive broods through a marathon reproductive effort."],"ko":["적도 근처에서는 많은 종의 새가 일 년 내내 번식한다.","하지만 온대와 극지방에서는 새의 번식기가 대개 뚜렷하게 정해져 있다.","번식기는 주로 낮의 길이 변화에 의해 촉발된다.","모든 것이 잘 풀리면, 그 결과 새들은 먹이 공급이 최고조일 때 새끼를 기르게 된다.","대부분의 새는 다른 때에 번식하기를 단순히 꺼리는 것이 아니라 신체적으로도 그렇게 할 수 없다.","이는 그들의 생식 기관이 줄어들기 때문인데, 이것은 날아다니는 새가 몸무게를 줄이는 데 도움이 된다.","이 규칙의 주된 예외는 유목성 사막 종이다.","이들은 비가 오고 며칠 안에 번식 주기를 시작할 수 있다.","그것은 갑작스러운 번식 기회를 최대한 활용하기 위해서이다.","또한, 종마다 번식 기간을 나누는 방식이 다르다.","대부분의 바닷새는 한 배의 새끼만 기른다.","그러나 따뜻한 지역에서는 명금(鳴禽)이 몇 달 안에 여러 배의 새끼를 기를 수도 있다.","유난히 좋은 해에는 명금의 한 종류인 참새 한 쌍이 마라톤과 같은 번식 노력을 통해 잇따라 여러 배의 새끼를 기를 수 있다."],"theme":"새들은 대개 먹이가 풍부한 때에 맞춰 번식하지만, 유목성 사막 종 같은 예외도 있고 종마다 번식 기간을 나누는 방식이 다르다.","blanks":[{"s":1,"ans":"often sharply defined","ans_ko":"대개 뚜렷하게 정해져 있다","opts":[{"en":"often loosely defined","ko":"대개 느슨하게 정해져 있다"},{"en":"usually extended all year","ko":"대개 일 년 내내 이어진다"},{"en":"seldom limited to one season","ko":"좀처럼 한 계절에 한정되지 않는다"},{"en":"often shortened by rain","ko":"대개 비 때문에 짧아진다"}],"orig":false},{"s":2,"ans":"triggered mainly by changes in day length","ans_ko":"주로 낮의 길이 변화에 의해 촉발되는","opts":[{"en":"controlled entirely by the food supply","ko":"전적으로 먹이 공급에 의해 조절되는"},{"en":"triggered mainly by changes in rainfall","ko":"주로 강수량의 변화에 의해 촉발되는"},{"en":"caused only by the age of the birds","ko":"오직 새의 나이에 의해서만 일어나는"},{"en":"blocked by changes in day length","ko":"낮의 길이 변화에 의해 가로막히는"}],"orig":false},{"s":3,"ans":"when the food supply is at its peak","ans_ko":"먹이 공급이 최고조일 때","opts":[{"en":"when the food supply is at its lowest","ko":"먹이 공급이 가장 적을 때"},{"en":"after the food supply has run out","ko":"먹이 공급이 바닥난 뒤에"},{"en":"whenever the weather becomes warm","ko":"날씨가 따뜻해질 때마다"},{"en":"before the breeding season begins","ko":"번식기가 시작되기 전에"}],"orig":false},{"s":4,"ans":"physically incapable of doing so","ans_ko":"신체적으로 그렇게 할 수 없는","opts":[{"en":"physically able to do so","ko":"신체적으로 그렇게 할 수 있는"},{"en":"mentally prepared for doing so","ko":"정신적으로 그럴 준비가 된"},{"en":"always eager to do so","ko":"언제나 그렇게 하고 싶어 하는"},{"en":"just as willing to do so","ko":"똑같이 기꺼이 그렇게 하려는"}],"orig":false},{"s":5,"ans":"their reproductive system shrinks","ans_ko":"그들의 생식 기관이 줄어든다","opts":[{"en":"their reproductive system grows","ko":"그들의 생식 기관이 커진다"},{"en":"their flying ability weakens","ko":"그들의 비행 능력이 약해진다"},{"en":"their food supply declines","ko":"그들의 먹이 공급이 줄어든다"},{"en":"their nests are destroyed","ko":"그들의 둥지가 파괴된다"}],"orig":false},{"s":7,"ans":"within days of rain","ans_ko":"비가 오고 며칠 안에","opts":[{"en":"long before the rain comes","ko":"비가 오기 한참 전에"},{"en":"only after a full year of rain","ko":"꼬박 1년 동안 비가 온 뒤에만"},{"en":"within hours of sunrise","ko":"해가 뜬 지 몇 시간 안에"},{"en":"once the day length changes","ko":"낮의 길이가 변하면"}],"orig":false},{"s":8,"ans":"making the most of the sudden breeding opportunity","ans_ko":"갑작스러운 번식 기회를 최대한 활용하는 것","opts":[{"en":"saving weight for the long journey","ko":"긴 여정을 위해 몸무게를 아끼는 것"},{"en":"giving up the breeding cycle early","ko":"번식 주기를 일찍 포기하는 것"},{"en":"waiting until the day length changes","ko":"낮의 길이가 변할 때까지 기다리는 것"},{"en":"protecting the young from the rain","ko":"새끼를 비로부터 보호하는 것"}],"orig":false},{"s":11,"ans":"may raise several families in a few months","ans_ko":"몇 달 안에 여러 배의 새끼를 기를 수도 있다","opts":[{"en":"usually raise only a single brood","ko":"대개 한 배의 새끼만 기른다"},{"en":"may breed only once in their lives","ko":"평생 한 번만 번식할 수도 있다"},{"en":"rarely breed in warm regions","ko":"따뜻한 지역에서는 좀처럼 번식하지 않는다"},{"en":"always raise two broods at once","ko":"언제나 두 배의 새끼를 동시에 기른다"}],"orig":false}]},{"id":"2410-33","label":"24년 10월 33번","taught":true,"modes":["ko","abc","mun","blank"],"en":["Some people argue that there is a single, logically consistent concept known as reading that can be neatly set apart from everything else people do with books.","Is reading really that simple?","The most productive way to think about reading is as a loosely related set of behaviors that belong together owing to family resemblances, as Ludwig Wittgenstein used the phrase, without having in common a single defining trait.","Consequently, efforts to distinguish reading from nonreading are destined to fail because there is no agreement on what qualifies as reading in the first place.","The more one tries to figure out where the border lies between reading and not-reading, the more edge cases will be found to stretch the term’s flexible boundaries.","Thus, it is worth attempting to collect together these exceptional forms of reading into a single forum, one highlighting the challenges faced by anyone wishing to establish the boundaries where reading begins and ends.","The attempt moves toward an understanding of reading as a spectrum that is expansive enough to accommodate the distinct reading activities."],"ko":["어떤 사람들은 책을 가지고 사람들이 하는 다른 모든 행동과 깔끔하게 분리될 수 있는, 읽기라고 알려진 하나의 논리적으로 일관된 개념이 있다고 주장한다.","읽기는 정말 그렇게 단순할까?","읽기에 대해 생각하는 가장 생산적인 방식은, Ludwig Wittgenstein이 그 표현을 사용한 의미대로, 하나의 규정하는 특성을 공통으로 갖지 않으면서도 가족 유사성 때문에 함께 속하는, 느슨하게 관련된 행동의 집합으로 보는 것이다.","결과적으로, 읽기와 읽기가 아닌 것을 구별하려는 노력은 실패할 수밖에 없는데, 애초에 무엇이 읽기의 자격을 갖추는지에 대한 합의가 없기 때문이다.","읽기와 읽기가 아닌 것 사이의 경계가 어디에 있는지 알아내려 할수록, 그 용어의 유연한 경계를 넓히는 특이 사례가 더 많이 발견될 것이다.","그러므로 이러한 예외적인 읽기의 형태들을 하나의 장으로 함께 모아 보는 것은 해 볼 만한데, 그 장은 읽기가 시작되고 끝나는 경계를 정하고자 하는 누구나 마주하는 어려움을 부각한다.","이러한 시도는 별개의 읽기 활동들을 모두 수용할 만큼 폭넓은 스펙트럼으로서 읽기를 이해하는 쪽으로 나아간다."],"theme":"읽기는 경계가 분명한 하나의 개념이 아니라, 가족 유사성으로 묶이는 느슨한 행동의 집합이다.","blanks":[{"s":0,"ans":"a single, logically consistent concept","ans_ko":"하나의 논리적으로 일관된 개념","opts":[{"en":"a flexible, constantly changing concept","ko":"유연하고 끊임없이 변하는 개념"},{"en":"a complex, culturally diverse concept","ko":"복잡하고 문화마다 다양한 개념"},{"en":"a vague, emotionally driven concept","ko":"모호하고 감정에 이끌리는 개념"},{"en":"a tiny, rarely discussed concept","ko":"아주 작고 거의 논의되지 않는 개념"}],"orig":false},{"s":2,"ans":"a loosely related set of behaviors that belong together","ans_ko":"함께 속하는, 느슨하게 관련된 행동의 집합","opts":[{"en":"an active process that encourages flexible thinking","ko":"유연한 사고를 장려하는 능동적인 과정"},{"en":"an acquired skill and not something that one is born with","ko":"타고나는 것이 아니라 습득된 기술"},{"en":"a collection of activities in which many other opinions interact","ko":"많은 다른 의견들이 상호작용하는 활동의 모음"},{"en":"a safe territory to relieve a sense of separation from the world","ko":"세상과 분리된 느낌을 덜어 주는 안전한 영역"}],"orig":true},{"s":3,"ans":"destined to fail","ans_ko":"실패할 수밖에 없는","opts":[{"en":"bound to succeed","ko":"성공할 수밖에 없는"},{"en":"likely to be ignored","ko":"무시될 가능성이 큰"},{"en":"sure to be rewarded","ko":"보상받을 것이 확실한"},{"en":"slow to produce results","ko":"결과가 느리게 나오는"}],"orig":false},{"s":4,"ans":"the more edge cases will be found","ans_ko":"더 많은 특이 사례가 발견될 것이다","opts":[{"en":"the fewer edge cases will be found","ko":"더 적은 특이 사례가 발견될 것이다"},{"en":"the more rules will be found","ko":"더 많은 규칙이 발견될 것이다"},{"en":"the fewer readers will be found","ko":"더 적은 독자가 발견될 것이다"},{"en":"the more books will be found","ko":"더 많은 책이 발견될 것이다"}],"orig":false},{"s":5,"ans":"the boundaries where reading begins and ends","ans_ko":"읽기가 시작되고 끝나는 경계","opts":[{"en":"a single definition for every kind of reading","ko":"모든 종류의 읽기에 대한 하나의 정의"},{"en":"the habits where readers begin and stop","ko":"독자들이 시작하고 멈추는 습관"},{"en":"the reasons why reading is worth teaching","ko":"읽기를 가르칠 만한 이유"},{"en":"a family tree of famous readers","ko":"유명한 독자들의 가계도"}],"orig":false},{"s":6,"ans":"expansive enough to accommodate the distinct reading activities","ans_ko":"별개의 읽기 활동들을 수용할 만큼 폭넓은","opts":[{"en":"narrow enough to exclude the odd reading activities","ko":"특이한 읽기 활동들을 배제할 만큼 좁은"},{"en":"strict enough to define each reading activity","ko":"각 읽기 활동을 규정할 만큼 엄격한"},{"en":"clear enough to separate reading from everything else","ko":"읽기를 다른 모든 것과 분리할 만큼 분명한"},{"en":"limited enough to replace the other reading activities","ko":"다른 읽기 활동들을 대체할 만큼 제한된"}],"orig":false}]}]};

  opts.forEach(function(o,i){
   var c='ob';if(done){if(o.ok)c+=' ok';else if(i===st.sel)c+=' ng'}
   h+='<button type="button" class="'+c+'" data-act="o" data-i="'+i+'"><b class="cn">'+GM.CIR[i]+'</b> '+GM.esc(o.en)+'</button>'});
  if(!done)return h;
  var ok=st.sel===p.pos;
  h+='<div class="ex"><div class="res '+(ok?'o':'x')+'">'+(ok?'정답이에요.':'아쉬워요. 정답은 '+GM.CIR[p.pos]+'이에요.')+'</div>';
  h+='<div class="th">'+GM.esc(ps.theme)+'</div>';
  var q2=ps.en[b.s].indexOf(b.ans);
  h+='<div class="ans"><b>'+GM.CIR[p.pos]+'</b> '+GM.esc(ps.en[b.s].slice(0,q2))+'<mark>'+GM.esc(b.ans)+'</mark>'+GM.esc(ps.en[b.s].slice(q2+b.ans.length))+'<span class="ko">'+GM.esc(ps.ko[b.s])+'</span><span class="ko">'+GM.esc(b.ans)+' : '+GM.esc(b.ans_ko)+'</span></div>';
  h+='<ul class="ol">';opts.forEach(function(o,i){if(!o.ok)h+='<li><b>'+GM.CIR[i]+'</b> '+GM.esc(o.ko)+'</li>'});
  return h+'</ul></div>'},
 act:function(a,el,p,st){
