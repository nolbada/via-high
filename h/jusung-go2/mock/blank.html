<h1>모의고사 (22년 11월 · 23년 11월 · 24년 10월) · 빈칸 추론 연습</h1><p class="lede">같은 지문이라도 빈칸이 계속 바뀌어요.</p>
<div id="mockinfo"></div>
<div class="how">글을 읽고 빈칸에 들어갈 말을 ①~⑤에서 골라요. 고르면 바로 정답과 본문 한 줄 요약이 나와요. 한 번 나온 빈칸은 한 바퀴를 다 돌 때까지 다시 나오지 않아요. 이 문제는 <b>매번 바뀌어요</b>. 풀다가 나가도 풀던 곳에서 이어서 풀 수 있어요.</div>
<div class="bar"><span id="cnt"></span><span class="sp"></span><button id="kt" type="button">한글 해석 보기</button><button id="rs" type="button">새 문제로 다시 풀기</button></div>
<div id="stage"></div>
<div class="foot">비타민 영어클리닉 · 주성고 영어II</div></div>
<a class="homefab" href="../index.html">⌂ 목록</a>
<script>
/* 문제 생성 로직 (순수 함수, DOM 없음). 브라우저(HTML 안에 삽입)와 node(sim.js) 양쪽에서 쓴다. */
(function (root) {
  'use strict';
  var G = {};
  G.SIZES = { ko: 6, mg: 4, mi: 4, abc: 6, blank: 8 };
  G.ABC_OPTS = ['ACB', 'BAC', 'BCA', 'CAB', 'CBA']; // 시험처럼 (A)(B)(C) 그대로인 순서는 없다
  var NEED = { ko: 'ko', mg: 'mun', mi: 'mun', abc: 'abc', blank: 'blank' };

  function rr(rnd) { return rnd || Math.random; }
  G.rint = function (n, rnd) { return Math.floor(rr(rnd)() * n); };
  G.shuffle = function (a, rnd) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(rr(rnd)() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  };
  G.sample = function (a, k, rnd) { return G.shuffle(a, rnd).slice(0, k); };
  G.byId = function (D) { var m = {}; D.passages.forEach(function (p) { m[p.id] = p; }); return m; };

  /* ---------- 가능한 모양 ---------- */
  G.windows = function (ps) { // 주어진 첫 문장 a + 이어지는 3문장 (link 3개 모두 true)
    var L = ps.link, n = ps.en.length, r = [];
    for (var a = 0; a + 3 < n; a++) if (L[a] && L[a + 1] && L[a + 2]) r.push(a);
    return r;
  };
  G.shapes = function (ps) { // ABC: [c0,c1,c2]
    var L = ps.link, n = ps.en.length, r = [];
    for (var c0 = 0; c0 <= n - 4; c0++) {
      if (!L[c0]) continue;
      for (var c1 = c0 + 1; c1 <= n - 3; c1++) {
        if (!L[c1]) continue;
        for (var c2 = c1 + 1; c2 <= n - 2; c2++) {
          if (!L[c2]) continue;
          var x = c1 - c0, y = c2 - c1, z = n - 1 - c2;
          if (Math.max(x, y, z) - Math.min(x, y, z) <= 1) r.push([c0, c1, c2]);
        }
      }
    }
    return r;
  };
  G.insList = function (ps) {
    var n = ps.en.length, L = ps.link;
    return (ps.ins || []).filter(function (j) {
      return j >= 1 && j <= n - 1 && L[j - 1] && (j >= n - 1 || L[j]);
    });
  };

  /* ---------- 카탈로그: 앱별 (지문, 문제 정체성) 목록 ---------- */
  G.catalog = function (D, app) {
    var need = NEED[app], out = [];
    D.passages.forEach(function (ps, pi) {
      if ((ps.modes || []).indexOf(need) < 0) return;
      var items = [], id = ps.id;
      if (app === 'ko' || app === 'mg') {
        G.windows(ps).forEach(function (a) { items.push({ id: id + '|' + app + '|' + a, a: a }); });
      } else if (app === 'mi') {
        if (ps.en.length >= 5) G.insList(ps).forEach(function (j) { items.push({ id: id + '|mi|' + j, j: j }); });
      } else if (app === 'abc') {
        if (ps.en.length >= 7) G.shapes(ps).forEach(function (c) { items.push({ id: id + '|abc|' + c.join(','), c: c }); });
      } else if (app === 'blank') {
        (ps.blanks || []).forEach(function (b, bi) {
          if (ps.en[b.s] && ps.en[b.s].indexOf(b.ans) >= 0 && b.opts && b.opts.length === 4)
            items.push({ id: id + '|blank|' + bi, bi: bi });
        });
      }
      if (items.length) out.push({ pi: pi, cls: ps.taught === true ? 'T' : 'U', items: items });
    });
    return out;
  };

  function wchoice(ws, rnd) {
    var t = 0, i; for (i = 0; i < ws.length; i++) t += ws[i];
    var r = rr(rnd)() * t;
    for (i = 0; i < ws.length; i++) { r -= ws[i]; if (r < 0) return i; }
    return ws.length - 1;
  }

  /* ---------- 한 판 계획: 약 2/3 수업에서 다룬 지문, 안 쓴 문제 우선 ---------- */
  G.planSet = function (entries, usedMap, n, rnd, prevPi, carry) {
    var used = {}, k;
    for (k in usedMap) used[k] = 1;
    var inSet = {}, setPis = {}, picks = [], reset = false;
    var hasT = entries.some(function (e) { return e.cls === 'T'; });
    var hasU = entries.some(function (e) { return e.cls === 'U'; });
    var plan = [], i;
    if (hasT && hasU) {
      var nT = Math.round(n * 2 / 3);
      for (i = 0; i < n; i++) plan.push(i < nT ? 'T' : 'U');
      plan = G.shuffle(plan, rnd);
    } else for (i = 0; i < n; i++) plan.push(hasT ? 'T' : 'U');
    function avail(cls) {
      var r = [];
      entries.forEach(function (e) {
        if (cls && e.cls !== cls) return;
        var free = e.items.filter(function (it) { return !used[it.id] && !inSet[it.id]; });
        if (free.length) r.push({ e: e, free: free });
      });
      return r;
    }
    var prev = prevPi == null ? -1 : prevPi;
    for (k = 0; k < n; k++) {
      var cl = plan[k], oth = cl === 'T' ? 'U' : 'T';
      var av = avail(cl);
      if (!av.length) av = avail(oth);
      if (!av.length) { // 한 바퀴 끝: 직전에 쓴 문제(최대 carry*n개)는 계속 막고 나머지(가장 오래된 것)부터 다시 쓴다 -> 5판 안 겹침 유지
        var mine = {}; entries.forEach(function (e) { e.items.forEach(function (it) { mine[it.id] = 1; }); });
        var all = Object.keys(used), others = all.filter(function (x) { return !mine[x]; }), keys = all.filter(function (x) { return mine[x]; });
        var c = Math.min(keys.length, carry == null ? 0 : carry * n), need = n - k;
        reset = true;
        for (;;) {
          used = {}; others.forEach(function (x) { used[x] = 1; });
          keys.slice(keys.length - c).forEach(function (x) { used[x] = 1; });
          var tot = 0; avail(null).forEach(function (x) { tot += x.free.length; });
          if (tot >= need || c <= 0) break;
          c--;
        }
        av = avail(cl); if (!av.length) av = avail(oth);
      }
      if (!av.length) { // 가능한 모양이 한 판보다 적다: 어쩔 수 없이 겹침 허용
        av = entries.map(function (e) { return { e: e, free: e.items }; });
      }
      if (av.length > 1) {
        var f = av.filter(function (x) { return x.e.pi !== prev; });
        if (f.length) av = f;
      }
      var ws = av.map(function (x) { return Math.sqrt(x.free.length) * (setPis[x.e.pi] ? 0.35 : 1); });
      var ch = av[wchoice(ws, rnd)];
      var it = ch.free[G.rint(ch.free.length, rnd)];
      inSet[it.id] = 1; setPis[ch.e.pi] = 1; prev = ch.e.pi;
      picks.push({ pi: ch.e.pi, item: it });
    }
    picks.forEach(function (p) { used[p.item.id] = 1; });
    return { picks: picks, used: used, reset: reset };
  };

  /* ---------- 정답 번호 수열: 고르게, 연속 같은 번호 없이 ---------- */
  G.ansSeq = function (n, rnd) {
    var out = [], bag = [], last = -1;
    while (out.length < n) {
      if (!bag.length) bag = G.shuffle([1, 2, 3, 4, 5], rnd);
      var idx = -1;
      for (var i = bag.length - 1; i >= 0; i--) if (bag[i] !== last) { idx = i; break; }
      if (idx < 0) { bag = bag.concat(G.shuffle([1, 2, 3, 4, 5].filter(function (v) { return v !== last; }), rnd)); idx = bag.length - 1; }
      last = bag.splice(idx, 1)[0]; out.push(last);
    }
    return out;
  };

  /* ---------- 문제 만들기 ---------- */
  G.makeSeq = function (kind, ps, item, rnd) {
    var a = item.a, idx = [a + 1, a + 2, a + 3], pool, t = 0;
    do { pool = G.shuffle(idx, rnd); t++; } while (t < 30 && pool.join() === idx.join());
    return { k: kind, pid: ps.id, a: a, pool: pool };
  };
  G.makeAbc = function (ps, item, ans) {
    return { k: 'abc', pid: ps.id, cuts: item.c.slice(), ans: ans };
  };

/* ---- 러너 ----

GM.run = function (cfg) {

};

var DATA={"set":"mock","title":"모의고사 (22년 11월 · 23년 11월 · 24년 10월)","passages":[{"id":"2211-29","label":"22년 11월 29번","taught":false,"modes":["ko","abc","mun","blank"],"en":["Pre-emption means that a strategy is designed to prevent a rival from starting some particular activity.","In some case a pre-emptive move may simply be an announcement of some intent that might discourage rivals from doing the same.","The idea of pre-emption implies that timing is sometimes very important—a decision or an action at one point in time might be much more rewarding than doing it at a different time point.","Pre-emption may involve up-weighting advertising for a period before and during when a new entrant launches into a market.","The intent is to make it more difficult for the new entrant’s advertising to make an impression on potential buyers.","Product proliferation is another potential pre-emption strategy.","The general idea is to launch a large variety of product variants so that there is very little in the way of market demand that is not accommodated.","Arguably, if a market is already filled with product variants it is more difficult for competitors to find untapped pockets of market demand."],"ko":["선매 행위는 어떤 전략이 경쟁자로 하여금 어떤 특정한 활동을 시작하는 것을 방지하기 위해 만들어진다는 것을 의미한다.","어떤 경우에는 선제적 조치는 단순히 경쟁자들이 같은 행동을 하는 것을 단념시킬 수 있는 어떤 의도의 공표일 수도 있다.","선매 행위 개념은 때로 타이밍이 매우 중요하다는 것을 암시하는데, 즉 어떤 시점의 결정이나 조치는 다른 시점에 그것을 하는 것보다 훨씬 더 득이 될 수 있다.","선매 행위는 새로운 진입자가 시장에 진출하기 이전과 진출해 있는 동안에 광고의 가중치를 높이는 것을 포함할 수 있다.","그 취지는 신규 진입자의 광고가 잠재적 구매자들에게 인상을 남기는 것을 더 어렵게 만드는 것이다.","제품 확산은 또 다른 잠재적인 선매 행위 전략이다.","일반적인 아이디어는 수용되지 않는 시장 수요가 거의 없도록 다양한 제품 변형을 출시하는 것이다.","거의 틀림없이, 만약 시장이 제품 변형으로 이미 채워져 있다면 경쟁자들은 아직 점유되지 않은 시장 수요 주머니를 찾기가 더 어렵다."],"theme":"선매 행위는 경쟁자가 어떤 활동을 시작하지 못하게 막거나 단념시키는 선제적 조치이며, 광고를 늘리거나 제품 종류를 넓히는 것이 그 예다.","blanks":[{"s":0,"ans":"prevent a rival from starting","ans_ko":"경쟁자가 시작하지 못하게 막다","opts":[{"en":"invite newcomers to begin","ko":"신규 업체가 시작하도록 권하다"},{"en":"help competitors finish","ko":"경쟁사가 끝내도록 돕다"},{"en":"force partners to repeat","ko":"협력자에게 반복을 강요하다"},{"en":"allow only rivals to continue","ko":"오직 경쟁자만 계속하도록 허용하다"}],"orig":false},{"s":1,"ans":"might discourage rivals from doing the same","ans_ko":"경쟁자들이 같은 행동을 하는 것을 단념시킬 수 있는","opts":[{"en":"could help rivals do the same","ko":"경쟁자들이 같은 행동을 하도록 도울 수 있는"},{"en":"might stop customers from buying anything","ko":"고객이 아무것도 사지 못하게 막을 수 있는"},{"en":"must keep every firm from advertising","ko":"모든 기업이 광고하지 못하게 해야만 하는"},{"en":"may persuade investors to wait longer","ko":"투자자들이 더 오래 기다리도록 설득할 수 있는"}],"orig":false},{"s":2,"ans":"timing is sometimes very important","ans_ko":"타이밍이 때로 매우 중요하다","opts":[{"en":"price is always the only factor","ko":"가격이 언제나 유일한 요인이다"},{"en":"timing is rarely worth considering","ko":"타이밍은 거의 고려할 가치가 없다"},{"en":"location is usually more useful","ko":"위치가 대개 더 유용하다"},{"en":"spending is sometimes very costly","ko":"지출은 때로 매우 비싸다"}],"orig":false},{"s":3,"ans":"up-weighting advertising","ans_ko":"광고의 가중치를 높이는 것","opts":[{"en":"lowering product prices","ko":"제품 가격을 낮추는 것"},{"en":"ignoring all advertising","ko":"모든 광고를 무시하는 것"},{"en":"copying rival packaging","ko":"경쟁자의 포장을 베끼는 것"},{"en":"cutting advertising budgets","ko":"광고 예산을 삭감하는 것"}],"orig":false},{"s":4,"ans":"make it more difficult","ans_ko":"더 어렵게 만들다","opts":[{"en":"make it much easier","ko":"훨씬 더 쉽게 만들다"},{"en":"make it more expensive","ko":"더 비싸게 만들다"},{"en":"make it less necessary","ko":"덜 필요하게 만들다"},{"en":"keep it equally simple","ko":"똑같이 간단하게 유지하다"}],"orig":false},{"s":6,"ans":"launch a large variety of product variants","ans_ko":"다양한 제품 변형을 출시하다","opts":[{"en":"reduce the number of product lines","ko":"제품 라인의 수를 줄이다"},{"en":"raise prices on a few best sellers","ko":"잘 팔리는 몇몇 제품의 가격을 올리다"},{"en":"wait until rivals launch new variants","ko":"경쟁자가 새 변형을 출시할 때까지 기다리다"},{"en":"limit every shop to one product type","ko":"모든 매장을 한 가지 제품 유형으로 제한하다"}],"orig":false},{"s":7,"ans":"untapped pockets of market demand","ans_ko":"아직 점유되지 않은 시장 수요의 틈새","opts":[{"en":"crowded shelves of familiar products","ko":"익숙한 제품으로 붐비는 진열대"},{"en":"loyal customers of every brand","ko":"모든 브랜드의 충성 고객"},{"en":"permanent partners for new products","ko":"새 제품을 위한 영구적 협력자"},{"en":"cheap suppliers of raw materials","ko":"원자재의 값싼 공급업체"}],"orig":false}]},{"id":"2211-30","label":"22년 11월 30번","taught":true,"modes":["ko","abc","mun","blank"],"en":["Countershading is the process of optical flattening that provides camouflage to animals.","When sunlight illuminates an object from above, the object will be brightest on top.","The color of the object will gradually shade darker toward the bottom.","This shading gives the object depth and allows the viewer to distinguish its shape.","Thus even if an animal is exactly, but uniformly, the same color as the substrate, it will be easily visible when illuminated.","Most animals, however, are darker above than they are below.","When they are illuminated from above, the darker back is lightened and the lighter belly is shaded.","The animal thus appears to be a single color and easily blends in with the substrate.","This pattern of coloration, or countershading, destroys the visual impression of shape in the organism.","It allows the animal to blend in with its background."],"ko":["카운터셰이딩(명암역위형보호색)은 동물에게 위장을 제공하는 시각적으로 평평하게 하는 과정이다.","햇빛이 물체를 위에서 비출 때, 그 물체는 맨 위에서 가장 밝을 것이다.","물체의 색깔은 맨 아래로 향할수록 점차 더 어두운색으로 음영이 생기게 될 것이다.","이러한 음영은 물체에 농도를 주고 보는 사람이 그것의 모양을 식별하게 해 준다.","따라서 비록 동물이 밑바탕과 정확하지만 균일하게 같은 색일지라도 빛이 비춰질 때 쉽게 눈에 띌 것이다.","그러나 대부분의 동물은 아랫부분보다 윗부분이 더 어둡다.","그들이 위에서 빛을 받을 때, 더 어두운 등은 밝아지고 더 밝은 복부는 음영이 생긴다.","따라서 동물은 하나의 색처럼 보이고 밑바탕과 쉽게 섞인다.","이러한 형태의 배색 즉, 카운터셰이딩은 생물체의 모양의 시각적 인상을 파괴한다.","그것은 동물이 그것의 배경과 섞이게 해 준다."],"theme":"카운터셰이딩은 위쪽을 더 어둡게 만들어 빛을 받아도 한 가지 색처럼 보이게 하고, 모양의 인상을 없애 동물이 배경에 섞이게 한다.","blanks":[{"s":0,"ans":"provides camouflage to animals","ans_ko":"동물에게 위장을 제공하다","opts":[{"en":"attracts predators to animals","ko":"동물에게 포식자를 끌어들이다"},{"en":"keeps heat inside animals","ko":"동물의 체온을 안에 가둬 두다"},{"en":"protects every animal from sunlight","ko":"모든 동물을 햇빛으로부터 보호하다"},{"en":"gives food to young animals","ko":"어린 동물에게 먹이를 주다"}],"orig":false},{"s":1,"ans":"will be brightest on top","ans_ko":"맨 위에서 가장 밝을 것이다","opts":[{"en":"will glow evenly everywhere","ko":"어디서나 고르게 빛날 것이다"},{"en":"would turn darkest at its peak","ko":"꼭대기에서 가장 어두워질 것이다"},{"en":"will always fade into the ground","ko":"언제나 땅속으로 사라질 것이다"},{"en":"might look hottest near the base","ko":"바닥 근처에서 가장 뜨거워 보일 것이다"}],"orig":false},{"s":3,"ans":"allows the viewer to distinguish its shape","ans_ko":"보는 사람이 그것의 모양을 식별하게 해 준다","opts":[{"en":"prevents the viewer from seeing its form","ko":"보는 사람이 그것의 형태를 보지 못하게 한다"},{"en":"lets the viewer change its color","ko":"보는 사람이 그것의 색을 바꾸게 한다"},{"en":"forces the viewer to forget its size","ko":"보는 사람이 그것의 크기를 잊게 한다"},{"en":"helps the viewer to count its legs","ko":"보는 사람이 그것의 다리 수를 세게 돕는다"}],"orig":false},{"s":4,"ans":"easily visible when illuminated","ans_ko":"빛이 비춰질 때 쉽게 눈에 띄는","opts":[{"en":"easily hidden when illuminated","ko":"빛이 비춰질 때 쉽게 숨겨지는"},{"en":"hardly changed when disturbed","ko":"건드려도 거의 변하지 않는"},{"en":"quickly heated when exposed","ko":"노출되면 빠르게 뜨거워지는"},{"en":"barely seen when approached","ko":"다가가도 거의 보이지 않는"}],"orig":false},{"s":5,"ans":"are darker above than they are below","ans_ko":"아랫부분보다 윗부분이 더 어둡다","opts":[{"en":"are paler on top than underneath","ko":"아래쪽보다 위쪽이 더 옅다"},{"en":"are equally dark on every side","ko":"모든 면이 똑같이 어둡다"},{"en":"grow darker as they get older","ko":"나이가 들수록 더 어두워진다"},{"en":"are smaller than their enemies","ko":"천적보다 몸집이 작다"}],"orig":false},{"s":7,"ans":"be a single color","ans_ko":"하나의 색이다","opts":[{"en":"be two different colors","ko":"두 가지 서로 다른 색이다"},{"en":"be several shapes","ko":"여러 개의 모양이다"},{"en":"be a bright pattern","ko":"밝은 무늬이다"},{"en":"be a larger animal","ko":"더 큰 동물이다"}],"orig":false},{"s":8,"ans":"destroys the visual impression of shape","ans_ko":"모양의 시각적 인상을 없애다","opts":[{"en":"strengthens the visual impression of shape","ko":"모양의 시각적 인상을 강화하다"},{"en":"reveals the hidden skeleton of the organism","ko":"생물체의 숨은 뼈대를 드러내다"},{"en":"improves the eyesight of the animal","ko":"동물의 시력을 향상시키다"},{"en":"reduces the number of predators nearby","ko":"근처 포식자의 수를 줄이다"}],"orig":false}]},{"id":"2211-31","label":"22년 11월 31번","taught":false,"modes":["ko","abc","mun","blank"],"en":["No learning is possible without an error signal.","Organisms only learn when events violate their expectations.","In other words, surprise is one of the fundamental drivers of learning.","Imagine hearing a series of identical notes, AAAAA.","Each note draws out a response in the auditory areas of your brain—but as the notes repeat, those responses progressively decrease.","This is called “adaptation,” a deceptively simple phenomenon that shows that your brain is learning to anticipate the next event.","Suddenly, the note changes: AAAAA#.","Your primary auditory cortex immediately shows a strong surprise reaction: not only does the adaptation fade away, but additional neurons begin to vigorously fire in response to the unexpected sound.","And it is not just repetition that leads to adaptation: what matters is whether the notes are predictable.","For instance, if you hear an alternating set of notes, such as ABABA, your brain gets used to this alternation, and the activity in your auditory areas again decreases.","This time, however, it is an unexpected repetition, such as ABABB, that triggers a surprise response."],"ko":["어떤 학습도 오류 신호 없이는 가능하지 않다.","유기체는 사건이 그들의 기대에 어긋날 때에만 학습한다.","다시 말해 놀람은 학습의 근본적인 동력중 하나이다.","일련의 똑같은 음인 AAAAA를 듣는 것을 상상해 보아라.","각각의 음은 여러분의 뇌의 청각 영역에서 반응을 끌어내지만 음이 반복되면서 그 반응은 점진적으로 감소한다.","이것은 ‘적응’이라 불리며 당신의 뇌가 다음 사건을 예상하는 것을 배울 것임을 보여 주는 현혹될 정도로 단순해 보이는 현상이다.","갑자기 그 음이 AAAAA#으로 바뀐다.","당신의 일차 청각 피질은 즉시 강한 놀람의 반응을 보이는데, 즉 적응이 점차 사라질 뿐만 아니라 예상치 못한 소리에 대한 반응으로 추가적인 뉴런이 힘차게 활성화되기 시작한다.","그리고 적응을 유발하는 것은 단순한 반복이 아니라, 중요한 것은 그 음이 예측 가능한지이다.","예를 들어 만약 당신이 ABABA와 같이 한 세트의 교차하는 음을 듣는다면, 당신의 뇌는 이 교차에 익숙해지고, 당신의 청각 영역 내 활동은 다시 감소한다.","그러나 이번에는 놀람의 반응을 일으키는 것은 바로 ABABB와 같은 예상치 못한 반복이다."],"theme":"놀람은 학습의 근본적인 동력이다. 같은 음이 반복되면 뇌의 반응이 줄지만, 예측이 깨지는 순간 다시 강하게 반응한다.","blanks":[{"s":8,"ans":"whether the notes are predictable","ans_ko":"음들이 예측 가능한지","opts":[{"en":"whether the notes are audible","ko":"음들이 들릴 수 있는지"},{"en":"how often the notes are repeated","ko":"음들이 얼마나 자주 반복되는지"},{"en":"how loudly the notes are played","ko":"음들이 얼마나 크게 연주되는지"},{"en":"whether the notes are recorded","ko":"음들이 녹음되었는지"}],"orig":true},{"s":0,"ans":"without an error signal","ans_ko":"오류 신호 없이","opts":[{"en":"without any prior knowledge","ko":"사전 지식 없이"},{"en":"without a repeated pattern","ko":"반복되는 패턴 없이"},{"en":"except through memorization","ko":"암기를 통해서를 제외하고"},{"en":"without a quiet environment","ko":"조용한 환경 없이"}],"orig":false},{"s":1,"ans":"when events violate their expectations","ans_ko":"사건이 그들의 기대에 어긋날 때","opts":[{"en":"when events match their expectations","ko":"사건이 그들의 기대와 일치할 때"},{"en":"when events repeat exactly","ko":"사건이 정확히 반복될 때"},{"en":"when rewards are given quickly","ko":"보상이 빨리 주어질 때"},{"en":"when events become more familiar","ko":"사건이 더 익숙해질 때"}],"orig":false},{"s":2,"ans":"one of the fundamental drivers of learning","ans_ko":"학습의 근본적인 동력 중 하나","opts":[{"en":"the only reliable result of study","ko":"공부의 유일하게 믿을 만한 결과"},{"en":"one of the rare obstacles to learning","ko":"학습에 대한 드문 장애물 중 하나"},{"en":"a minor side effect of repetition","ko":"반복의 사소한 부작용"},{"en":"the final goal of every lesson","ko":"모든 수업의 최종 목표"}],"orig":false},{"s":4,"ans":"progressively decrease","ans_ko":"점진적으로 감소하다","opts":[{"en":"gradually increase","ko":"서서히 증가하다"},{"en":"suddenly vanish","ko":"갑자기 사라지다"},{"en":"remain unchanged","ko":"변하지 않고 그대로이다"},{"en":"slowly spread","ko":"천천히 퍼지다"}],"orig":false},{"s":7,"ans":"a strong surprise reaction","ans_ko":"강한 놀람 반응","opts":[{"en":"a weak adaptation effect","ko":"약한 적응 효과"},{"en":"a gradual calming response","ko":"점진적으로 진정되는 반응"},{"en":"a slow learning process","ko":"느린 학습 과정"},{"en":"a steady memory trace","ko":"꾸준한 기억 흔적"}],"orig":false},{"s":9,"ans":"gets used to this alternation","ans_ko":"이 교차에 익숙해지다","opts":[{"en":"grows alarmed at the changing notes","ko":"바뀌는 음에 놀라게 되다"},{"en":"fails to detect any pattern","ko":"어떤 패턴도 알아채지 못하다"},{"en":"responds more strongly each time","ko":"매번 더 강하게 반응하다"},{"en":"starts to forget the earlier notes","ko":"앞의 음들을 잊기 시작하다"}],"orig":false}]},{"id":"2211-32","label":"22년 11월 32번","taught":false,"modes":["ko","abc","mun","blank"],"en":["The connectedness of the global economic market makes it vulnerable to potential “infection.”","A financial failure can make its way from borrowers to banks to insurers, spreading like a flu.","However, there are unexpected characteristics when it comes to such infection in the market.","Infection can occur even without any contact.","A bank might become insolvent even without having any of its investments fail.","Fear and uncertainty can be damaging to financial markets, just as cascading failures due to bad investments.","If we all woke up tomorrow and believed that Bank X would be insolvent, then it would become insolvent.","In fact, it would be enough for us to fear that others believed that Bank X was going to fail, or just to fear our collective fear!","We might all even know that Bank X was well-managed with healthy investments, but if we expected others to pull their money out, then we would fear being the last to pull our money out.","Financial distress can be self-fulfilling and is a particularly troublesome aspect of financial markets."],"ko":["전 세계 경제 시장의 연결성은 그것을 잠재적 ‘감염’에 취약하게 만든다.","금융상의 실패는 독감처럼 퍼지면서 채무자에서부터 은행, 보증인까지 나아갈 수 있다.","그러나 시장에서의 그러한 감염에 관한 예상치 못한 특징들이 있다.","감염이 심지어 어떤 접촉 없이도 일어날 수 있다.","은행은 어떠한 투자에 실패하지 않고도 지급 불능이 될 수 있다.","어떤 나쁜 투자들 때문에 일어나는 연속된 실패처럼 금융 시장에 두려움과 불확실성은 손해를 끼칠 수 있다.","만약 우리 모두가 내일 깨어나서 X은행이 지급 불능이 될 것이라고 믿는다면, 그것은 지급 불능이 될 것이다.","사실 우리가 다른 사람들이 X은행이 실패할 것이라고 믿고 있다는 것을 무서워하거나 단지 우리의 집단적인 두려움을 무서워하는 것으로 충분할 것이다.","우리 모두가 심지어 X은행이 건전한 투자로 잘 운영된다는 것을 알지라도 만약 우리가 다른 사람들이 그들의 돈을 인출해 갈 것이라고 예상한다면, 그러면 우리는 자신의 돈을 인출하는 마지막 사람이 되는 것을 무서워 할 것이다.","재정적인 고통은 자기충족적일 수 있고 금융 시장에서의 특별히 골치 아픈 측면이다."],"theme":"세계 금융 시장은 서로 연결되어 있어서, 두려움과 불확실성만으로도 접촉 없이 은행이 무너지는 일이 생길 수 있다.","blanks":[{"s":5,"ans":"Fear and uncertainty can be damaging","ans_ko":"두려움과 불확실성은 해로울 수 있다","opts":[{"en":"Unaffordable personal loans may pose a risk","ko":"감당할 수 없는 개인 대출은 위험을 초래할 수 있다"},{"en":"Ignorance about legal restrictions may matter","ko":"법적 제한에 대한 무지가 중요할 수 있다"},{"en":"Accurate knowledge of investors can be poisonous","ko":"투자자에 대한 정확한 지식이 해로울 수 있다"},{"en":"Strong connections between banks can create a scare","ko":"은행 간의 강한 연결이 공포를 만들 수 있다"}],"orig":true},{"s":1,"ans":"make its way from borrowers to banks to insurers","ans_ko":"채무자에서 은행, 보증인까지 나아가다","opts":[{"en":"stay confined to the borrowers alone","ko":"채무자에게만 머무르다"},{"en":"stay locked inside a single bank","ko":"한 은행 안에 갇혀 있다"},{"en":"move from insurers back to borrowers only","ko":"보증인에서 채무자로만 되돌아가다"},{"en":"spread from stock markets to farmers","ko":"주식 시장에서 농부들에게로 퍼지다"}],"orig":false},{"s":2,"ans":"unexpected characteristics","ans_ko":"예상치 못한 특징","opts":[{"en":"familiar advantages","ko":"익숙한 장점"},{"en":"obvious solutions","ko":"뻔한 해결책"},{"en":"temporary shortages","ko":"일시적인 부족"},{"en":"minor differences","ko":"사소한 차이"}],"orig":false},{"s":4,"ans":"even without having any of its investments fail","ans_ko":"투자 중 어떤 것도 실패하지 않고도","opts":[{"en":"only after all of its investments fail","ko":"모든 투자가 실패한 뒤에야만"},{"en":"as soon as a few of its investments pay off","ko":"몇몇 투자가 성공하자마자"},{"en":"although it holds no debts at all","ko":"빚이 전혀 없는데도"},{"en":"unless most of its customers complain","ko":"대부분의 고객이 불평하지 않는 한"}],"orig":false},{"s":6,"ans":"it would become insolvent","ans_ko":"그것은 지급 불능이 될 것이다","opts":[{"en":"it would become more profitable","ko":"그것은 더 수익성이 좋아질 것이다"},{"en":"it would be saved by the government","ko":"그것은 정부에 의해 구제될 것이다"},{"en":"it would hire many new workers","ko":"그것은 많은 신입 직원을 고용할 것이다"},{"en":"it would attract more investors","ko":"그것은 더 많은 투자자를 끌어들일 것이다"}],"orig":false},{"s":7,"ans":"to fear our collective fear","ans_ko":"우리의 집단적인 두려움을 두려워하는 것","opts":[{"en":"to ignore our collective debts","ko":"우리의 집단적인 빚을 무시하는 것"},{"en":"to hide our private savings","ko":"우리의 개인 저축을 숨기는 것"},{"en":"to trust our collective wisdom","ko":"우리의 집단 지혜를 믿는 것"},{"en":"to doubt our personal memory","ko":"우리의 개인적 기억을 의심하는 것"}],"orig":false},{"s":8,"ans":"fear being the last to pull our money out","ans_ko":"돈을 인출하는 마지막 사람이 되는 것을 두려워하다","opts":[{"en":"regret taking out our money too early","ko":"돈을 너무 일찍 인출한 것을 후회하다"},{"en":"feel safe leaving our money there","ko":"돈을 그곳에 둔 채 안심하다"},{"en":"refuse to believe what others say","ko":"남들이 하는 말을 믿기를 거부하다"},{"en":"hope to be the first to save more","ko":"더 많이 저축하는 첫 번째가 되기를 바라다"}],"orig":false}]},{"id":"2211-33","label":"22년 11월 33번","taught":true,"modes":["ko","mun","blank"],"en":["Negative numbers are a lot more abstract than positive numbers—you can’t see negative 4 cookies and you certainly can’t eat them—but you can think about them, and you have to, in all aspects of daily life, from debts to contending with freezing temperatures and parking garages.","Still, many of us haven’t quite made peace with negative numbers.","People have invented all sorts of funny little mental strategies to sidestep the dreaded negative sign.","On mutual fund statements, losses (negative numbers) are printed in red or stuck in parentheses with no negative sign to be found.","The history books tell us that Julius Caesar was born in 100 B.C., not -100.","The underground levels in a parking garage often have designations like B1 and B2.","Temperatures are one of the few exceptions: folks do say, especially here in Ithaca, New York, that it’s -5 degrees outside, though even then, many prefer to say 5 below zero.","There’s something about that negative sign that just looks so unpleasant."],"ko":["여러분이 음수의 4개의 쿠키를 볼 수 없고 틀림없이 그것들을 먹을 수 없다는 점에서 음수는 양수보다 훨씬 더 추상적이지만 여러분은 그것들을 생각할 수 있으며, 채무에서부터 몹시 차가운 기온, 주차장과 씨름하는 것에 이르기까지 일상생활의 모든 측면에서 생각‘해야만 한다’.","여전히 우리들 중 많은 사람들은 음수와 잘 지내지 못해 왔다.","사람들은 그 두려운 음수의 기호를 피하기 위해 모든 종류의 우스꽝스럽고 사소한 정신적 전략들을 만들어 냈다.","뮤추얼 펀드(계약형 투자 신탁) 진술에서 손실(음수)은 빨간색으로 인쇄되거나 음수의 기호가 발견되지 않은 채 괄호 안에 갇혀 있다.","역사책은 우리에게 Julius Caesar가 –100이 아닌 기원전 100년에 태어났다고 말한다.","주차장의 지하층은 종종 B1과 B2와 같은 명칭을 가지고 있다.","기온은 몇 안 되는 예외 중 하나인데 특히 여기 New York의 Ithaca에서 사람들은 바깥의 기온이 –5도라고 말하지만 심지어 그때에도 많은 사람들은 영하 5도라고 말하길 선호한다.","그 음수의 기호에 관해서는 정말 불쾌하게만 보이는 무언가가 있다."],"theme":"사람들은 음수의 기호가 불쾌해서, 이를 피하려고 빨간 숫자·괄호·지하층 표기 같은 여러 요령을 만들어 냈다.","blanks":[{"s":2,"ans":"sidestep the dreaded negative sign","ans_ko":"두려운 음수의 기호를 피하다","opts":[{"en":"resolve stock market uncertainties","ko":"주식 시장의 불확실성을 해결하다"},{"en":"compensate for complicated calculating processes","ko":"복잡한 계산 과정을 보완하다"},{"en":"unify the systems of expressing numbers below zero","ko":"영하의 수를 표현하는 체계를 통일하다"},{"en":"face the fact that subtraction makes negatives","ko":"뺄셈이 음수를 만든다는 사실을 마주하다"}],"orig":true},{"s":0,"ans":"in all aspects of daily life","ans_ko":"일상생활의 모든 측면에서","opts":[{"en":"only in advanced math classes","ko":"고급 수학 수업에서만"},{"en":"mostly in scientific research","ko":"주로 과학 연구에서"},{"en":"in rare moments of leisure","ko":"드문 여가 시간에"},{"en":"in a few trading companies","ko":"몇몇 무역 회사에서"}],"orig":false},{"s":1,"ans":"haven’t quite made peace with negative numbers","ans_ko":"음수와 잘 지내지 못했다","opts":[{"en":"fully embraced the idea of negative numbers","ko":"음수라는 개념을 완전히 받아들였다"},{"en":"never had any use for negative numbers","ko":"음수를 쓸 일이 전혀 없었다"},{"en":"learned to calculate with negative numbers","ko":"음수로 계산하는 법을 배웠다"},{"en":"completely forgotten about negative numbers","ko":"음수를 완전히 잊어버렸다"}],"orig":false},{"s":3,"ans":"printed in red or stuck in parentheses","ans_ko":"빨간색으로 인쇄되거나 괄호 안에 들어가 있는","opts":[{"en":"printed in bold or underlined twice","ko":"굵게 인쇄되거나 두 번 밑줄 쳐진"},{"en":"highlighted in green or circled","ko":"초록색으로 강조되거나 동그라미 쳐진"},{"en":"marked clearly with a minus sign","ko":"마이너스 기호로 분명히 표시된"},{"en":"hidden in footnotes or deleted","ko":"각주에 숨겨지거나 삭제된"}],"orig":false},{"s":5,"ans":"often have designations like B1 and B2","ans_ko":"종종 B1, B2 같은 명칭을 가진다","opts":[{"en":"always carry signs like -1 and -2","ko":"항상 -1, -2 같은 표지를 달고 있다"},{"en":"rarely have any labels at all","ko":"이름표가 거의 전혀 없다"},{"en":"usually show colors like red and blue","ko":"대개 빨강, 파랑 같은 색을 보여 준다"},{"en":"sometimes use letters like X and Y","ko":"가끔 X, Y 같은 글자를 사용한다"}],"orig":false},{"s":6,"ans":"many prefer to say 5 below zero","ans_ko":"많은 사람들은 영하 5도라고 말하길 선호한다","opts":[{"en":"many insist on saying -5 degrees","ko":"많은 사람들은 -5도라고 말하기를 고집한다"},{"en":"most refuse to discuss the weather","ko":"대부분은 날씨 이야기를 거부한다"},{"en":"few ever notice the cold at all","ko":"추위를 알아차리는 사람은 거의 없다"},{"en":"all agree to avoid any numbers","ko":"모두가 어떤 숫자도 피하는 데 동의한다"}],"orig":false}]},{"id":"2211-34","label":"22년 11월 34번","taught":true,"modes":["ko","abc","mun","blank"],"en":["Observational studies of humans cannot be properly controlled.","Humans live different lifestyles and in different environments.","Thus, they are insufficiently homogeneous to be suitable experimental subjects.","These confounding factors undermine our ability to draw sound causal conclusions from human epidemiological surveys.","Confounding factors are variables (known or unknown) that make it difficult for epidemiologists to isolate the effects of the specific variable being studied.","For example, Taubes argued that since many people who drink also smoke, researchers have difficulty determining the link between alcohol consumption and cancer.","Similarly, researchers in the famous Framingham study identified a significant correlation between coffee drinking and coronary heart disease.","However, most of this correlation disappeared once researchers corrected for the fact that many coffee drinkers also smoke.","If the confounding factors are known, it is often possible to correct for them.","However, if they are unknown, they will undermine the reliability of the causal conclusions we draw from epidemiological surveys."],"ko":["인간에 대한 관찰 연구는 적절하게 통제될 수 없다.","인간은 다양한 생활 방식으로 그리고 다양한 환경에서 살고 있다.","따라서 그들은 적절한 실험 대상이 되기에 충분히 동질적이지 않다.","이러한 ‘교란 변수’는 인간 역학 조사로부터 타당한 인과적 결론을 도출하는 우리의 능력을 손상시킨다.","교란 변수는 역학자가 연구되고 있는 특정한 변수의 영향을 분리하기 어렵게 만드는 (알려지거나 알려지지 않은) 변수이다.","예를 들어, Taubes는 술을 마시는 많은 사람들이 흡연도 하기 때문에 연구자들이 알코올 섭취와 암 사이의 연관성을 결정짓는 데 어려움을 겪는다고 주장했다.","마찬가지로 유명한 Framingham 연구의 연구자들은 커피를 마시는 것과 관상 동맥성 심장 질환 사이에 상당한 상관관계를 확인했다.","그러나 연구자들이 커피를 마시는 많은 사람들이 흡연도 한다는 사실에 대해 수정을 하자 이러한 상관관계의 대부분은 사라졌다.","교란 변수들이 알려져 있다면 그것들을 수정하는 것이 종종 가능하다.","그러나 그것들이 알려져 있지 않다면, 그것들은 우리가 역학 조사로부터 도출하는 인과적 결론의 신뢰성을 손상시킬 것이다."],"theme":"인간 관찰 연구는 생활 방식과 환경이 제각각이라 교란 변수가 생기고, 이를 모르면 인과적 결론의 신뢰성이 떨어진다.","blanks":[{"s":4,"ans":"isolate the effects of the specific variable being studied","ans_ko":"연구되고 있는 특정 변수의 영향을 분리하다","opts":[{"en":"distort the interpretation of the medical research results","ko":"의학 연구 결과의 해석을 왜곡하다"},{"en":"conceal the purpose of their research from subjects","ko":"연구 대상자에게 연구 목적을 숨기다"},{"en":"conduct observational studies in an ethical way","ko":"관찰 연구를 윤리적인 방식으로 수행하다"},{"en":"refrain from intervening in their experiments","ko":"자신들의 실험에 개입하는 것을 삼가다"}],"orig":true},{"s":0,"ans":"cannot be properly controlled","ans_ko":"적절하게 통제될 수 없다","opts":[{"en":"can never be carried out","ko":"결코 수행될 수 없다"},{"en":"need not be repeated again","ko":"다시 반복될 필요가 없다"},{"en":"are rarely published in journals","ko":"학술지에 거의 실리지 않는다"},{"en":"cannot be easily translated","ko":"쉽게 번역될 수 없다"}],"orig":false},{"s":2,"ans":"insufficiently homogeneous","ans_ko":"충분히 동질적이지 않은","opts":[{"en":"excessively homogeneous","ko":"지나치게 동질적인"},{"en":"sufficiently diverse","ko":"충분히 다양한"},{"en":"unexpectedly cooperative","ko":"뜻밖에 협조적인"},{"en":"increasingly sensitive","ko":"점점 더 민감한"}],"orig":false},{"s":3,"ans":"undermine our ability to draw sound causal conclusions","ans_ko":"타당한 인과적 결론을 도출하는 우리의 능력을 손상시키다","opts":[{"en":"strengthen our ability to draw firm predictions","ko":"확실한 예측을 도출하는 우리의 능력을 강화하다"},{"en":"limit our chance to collect any data","ko":"어떤 자료든 수집할 우리의 기회를 제한하다"},{"en":"double our interest in drawing easy answers","ko":"쉬운 답을 도출하려는 우리의 관심을 두 배로 만들다"},{"en":"explain our tendency to reach hasty verdicts","ko":"성급한 판단에 이르는 우리의 경향을 설명하다"}],"orig":false},{"s":5,"ans":"many people who drink also smoke","ans_ko":"술을 마시는 많은 사람들이 흡연도 한다","opts":[{"en":"most people who smoke also exercise","ko":"담배를 피우는 대부분의 사람들이 운동도 한다"},{"en":"few people who drink also smoke","ko":"술을 마시는 사람 중 흡연도 하는 사람은 적다"},{"en":"many people who exercise also drink","ko":"운동하는 많은 사람들이 술도 마신다"},{"en":"some people who diet also sleep late","ko":"식이요법을 하는 일부 사람들이 늦게 잔다"}],"orig":false},{"s":7,"ans":"most of this correlation disappeared","ans_ko":"이 상관관계의 대부분이 사라졌다","opts":[{"en":"this correlation grew even stronger","ko":"이 상관관계가 훨씬 더 강해졌다"},{"en":"none of the data changed","ko":"자료는 하나도 바뀌지 않았다"},{"en":"the whole study was repeated","ko":"연구 전체가 반복되었다"},{"en":"many participants dropped out","ko":"많은 참가자가 중도에 빠졌다"}],"orig":false},{"s":8,"ans":"often possible to correct for them","ans_ko":"그것들을 보정하는 것이 종종 가능한","opts":[{"en":"rarely necessary to correct for them","ko":"그것들을 보정할 필요가 거의 없는"},{"en":"always easy to eliminate them","ko":"그것들을 없애는 것이 언제나 쉬운"},{"en":"impossible to measure them at all","ko":"그것들을 전혀 측정할 수 없는"},{"en":"usually better to ignore them","ko":"그것들을 무시하는 편이 대개 나은"}],"orig":false}]},{"id":"2211-35","label":"22년 11월 35번","taught":false,"modes":["ko","mun","blank"],"en":["Of all the human emotions, none is trickier or more elusive than envy.","It is very difficult to actually discern the envy that motivates people’s actions.","The reason for this elusiveness is simple: we almost never directly express the envy we are feeling.","Envy entails the admission to ourselves that we are inferior to another person in something we value.","Not only is it painful to admit this inferiority, but it is even worse for others to see that we are feeling this.","And so almost as soon as we experience the initial feelings of envy, we are motivated to disguise it to ourselves—it is not envy we feel but unfairness at the distribution of goods or attention, resentment at this unfairness, even anger."],"ko":["인간의 모든 감정 중에서 질투보다 더 까다롭거나 더 이해하기 어려운 것은 없다.","사람들의 행동을 자극하는 질투를 실제로 알아차리는 것은 매우 어렵다.","이러한 모호함의 이유는 간단한데, 우리는 우리가 느끼고 있는 질투를 대부분 절대 직접적으로 표현하지 않는다.","질투는 우리가 가치 있게 여기는 무언가에서 우리가 또 다른 사람보다 열등하다는 스스로에 대한 인정을 수반한다.","이 열등감을 인정하는 것은 고통스러울 뿐만 아니라 우리가 이것을 느끼고 있다는 것을 다른 사람들이 알게 되는 것은 훨씬 더 나쁘다.","그래서 우리가 최초의 질투심을 경험하는 거의 즉시, 우리는 그것을 우리 자신에게 감추고자 하게 되는데, 즉 그것은 우리가 느끼는 질투가 아니라 재산의 분배나 관심에 대한 불공평함, 이 불공평함에 대한 분개, 심지어 분노이다."],"theme":"질투는 스스로 인정하기도, 남에게 들키기도 고통스러워서 직접 드러내지 않고 불공평함이나 분노 같은 다른 감정으로 감추게 된다.","blanks":[{"s":0,"ans":"none is trickier or more elusive than envy","ans_ko":"질투보다 더 까다롭거나 이해하기 어려운 것은 없다","opts":[{"en":"none is easier or more obvious than envy","ko":"질투보다 더 쉽거나 명백한 것은 없다"},{"en":"every emotion is as elusive as envy","ko":"모든 감정은 질투만큼 이해하기 어렵다"},{"en":"most are simpler to express than envy","ko":"대부분은 질투보다 표현하기 쉽다"},{"en":"none is rarer or more pleasant than envy","ko":"질투보다 더 드물거나 즐거운 것은 없다"}],"orig":false},{"s":1,"ans":"very difficult to actually discern","ans_ko":"실제로 알아차리기가 매우 어려운","opts":[{"en":"very easy to actually discover","ko":"실제로 발견하기가 매우 쉬운"},{"en":"quite natural to openly confess","ko":"공개적으로 고백하는 것이 꽤 자연스러운"},{"en":"always wise to carefully measure","ko":"신중하게 측정하는 것이 언제나 현명한"},{"en":"important to publicly deny","ko":"공개적으로 부인하는 것이 중요한"}],"orig":false},{"s":2,"ans":"we almost never directly express","ans_ko":"우리는 거의 절대 직접 표현하지 않는다","opts":[{"en":"we usually openly admit","ko":"우리는 대개 공개적으로 인정한다"},{"en":"we sometimes secretly enjoy","ko":"우리는 가끔 몰래 즐긴다"},{"en":"we almost always proudly display","ko":"우리는 거의 항상 자랑스럽게 드러낸다"},{"en":"we rarely stop to measure","ko":"우리는 측정하려고 멈추는 일이 드물다"}],"orig":false},{"s":3,"ans":"inferior to another person","ans_ko":"다른 사람보다 열등한","opts":[{"en":"superior to another person","ko":"다른 사람보다 우월한"},{"en":"equal to another person","ko":"다른 사람과 동등한"},{"en":"grateful to another person","ko":"다른 사람에게 감사하는"},{"en":"unfair to another person","ko":"다른 사람에게 불공평한"}],"orig":false},{"s":3,"ans":"in something we value","ans_ko":"우리가 가치 있게 여기는 무언가에서","opts":[{"en":"in something we dislike","ko":"우리가 싫어하는 무언가에서"},{"en":"in something we ignore","ko":"우리가 무시하는 무언가에서"},{"en":"in something we forget","ko":"우리가 잊어버린 무언가에서"},{"en":"in something we hide","ko":"우리가 숨기는 무언가에서"}],"orig":false},{"s":4,"ans":"painful to admit this inferiority","ans_ko":"이 열등감을 인정하는 것이 고통스러운","opts":[{"en":"easy to ignore this inferiority","ko":"이 열등감을 무시하기가 쉬운"},{"en":"pleasant to share this inferiority","ko":"이 열등감을 나누는 것이 즐거운"},{"en":"natural to deny this inferiority","ko":"이 열등감을 부인하는 것이 자연스러운"},{"en":"useful to measure this inferiority","ko":"이 열등감을 측정하는 것이 유용한"}],"orig":false}]},{"id":"2211-36","label":"22년 11월 36번","taught":false,"modes":["ko","abc","mun","blank"],"en":["The right to be forgotten is a right distinct from but related to a right to privacy.","The right to privacy is, among other things, the right for information traditionally regarded as protected or personal not to be revealed.","The right to be forgotten, in contrast, can be applied to information that has been in the public domain.","The right to be forgotten broadly includes the right of an individual not to be forever defined by information from a specific point in time.","One motivation for such a right is to allow individuals to move on with their lives and not be defined by a specific event or period in their lives.","For example, it has long been recognized in some countries, such as the UK and France, that even past criminal convictions should eventually be “spent” and not continue to affect a person’s life.","Despite the reason for supporting the right to be forgotten, the right to be forgotten can sometimes come into conflict with other rights.","For example, formal exceptions are sometimes made for security or public health reasons."],"ko":["잊힐 권리는 사생활 권리와 구별되지만 관련이 있는 권리이다.","사생활 권리는 무엇보다도 전통적으로 보호되거나 공개되지 않아야 할 개인적인 것으로 여겨지는 정보에 대한 권리이다.","반면에 잊힐 권리는 공공의 영역에 있었던 정보에 적용될 수 있다.","잊힐 권리는 특정 시점의 정보에 의해 영원히 정의되지 않아야 할 개인의 권리를 광범위하게 포함한다.","그러한 권리의 한 가지 이유는 개인이 자신의 삶을 영위할 수 있게 해 주고 자신의 삶의 특정한 사건이나 기간에 의해 정의되지 않도록 해 주는 것이다.","예를 들어, 영국과 프랑스와 같은 일부 국가에서는 과거의 범죄 유죄 판결조차도 결국 ‘소모되어야’ 하고 한 사람의 삶에 계속 영향을 미치지 않아야 한다고 오랫동안 인식되어 왔다.","잊힐 권리를 지지하는 그러한 이유에도 불구하고 잊힐 권리는 다른 권리와 때때로 충돌할 수 있다.","예를 들어, 공식적인 예외가 안보와 공공 보건의 이유로 인해 때때로 만들어진다."],"theme":"잊힐 권리는 사생활 권리와 달리 이미 공개된 정보에도 적용되며, 삶을 이어가게 하려는 취지이지만 다른 권리와 충돌할 수도 있다.","blanks":[{"s":0,"ans":"distinct from but related to","ans_ko":"구별되지만 관련이 있는","opts":[{"en":"identical to and replaced by","ko":"동일하고 대체되는"},{"en":"opposed to and unrelated to","ko":"반대이고 관련이 없는"},{"en":"contained in and limited by","ko":"안에 포함되고 제한되는"},{"en":"superior to and separate from","ko":"더 우월하고 분리된"}],"orig":false},{"s":1,"ans":"regarded as protected or personal","ans_ko":"보호되거나 개인적인 것으로 여겨지는","opts":[{"en":"described as public or commercial","ko":"공적이거나 상업적인 것으로 묘사되는"},{"en":"recorded as lost or damaged","ko":"분실되거나 손상된 것으로 기록되는"},{"en":"treated as harmful or illegal","ko":"해롭거나 불법인 것으로 취급되는"},{"en":"seen as popular or valuable","ko":"인기 있거나 가치 있는 것으로 보이는"}],"orig":false},{"s":2,"ans":"been in the public domain","ans_ko":"공공의 영역에 있었다","opts":[{"en":"been kept strictly private","ko":"엄격하게 비공개로 유지되었다"},{"en":"been deleted from every record","ko":"모든 기록에서 삭제되었다"},{"en":"been shared with a few friends","ko":"몇몇 친구들과 공유되었다"},{"en":"been protected by a password","ko":"비밀번호로 보호되었다"}],"orig":false},{"s":3,"ans":"not to be forever defined by information","ans_ko":"정보에 의해 영원히 정의되지 않을","opts":[{"en":"to be forever defined by information","ko":"정보에 의해 영원히 정의될"},{"en":"not to be fairly judged by information","ko":"정보에 의해 공정하게 판단되지 않을"},{"en":"to be fully protected from information","ko":"정보로부터 완전히 보호받을"},{"en":"never to be reminded of information","ko":"정보를 결코 상기하지 않을"}],"orig":false},{"s":4,"ans":"move on with their lives","ans_ko":"자신의 삶을 영위해 나가다","opts":[{"en":"hold on to their pasts","ko":"자신의 과거에 매달리다"},{"en":"stand up for their families","ko":"자신의 가족을 옹호하다"},{"en":"look back at their mistakes","ko":"자신의 실수를 돌아보다"},{"en":"settle down in their cities","ko":"자신의 도시에 정착하다"}],"orig":false},{"s":5,"ans":"even past criminal convictions","ans_ko":"과거의 범죄 유죄 판결조차도","opts":[{"en":"only recent criminal convictions","ko":"최근의 범죄 유죄 판결만"},{"en":"even forgotten family disputes","ko":"잊힌 집안싸움조차도"},{"en":"all public opinions","ko":"모든 여론"},{"en":"even permanent medical records","ko":"영구적인 의료 기록조차도"}],"orig":false},{"s":6,"ans":"come into conflict with other rights","ans_ko":"다른 권리와 충돌하다","opts":[{"en":"be replaced by other rights","ko":"다른 권리로 대체되다"},{"en":"grow stronger than all other rights","ko":"다른 모든 권리보다 강해지다"},{"en":"be combined with other rights","ko":"다른 권리와 결합되다"},{"en":"lose all value to other rights","ko":"다른 권리에 모든 가치를 잃다"}],"orig":false}]},{"id":"2211-37","label":"22년 11월 37번","taught":false,"modes":["ko","mun","blank"],"en":["To an economist who succeeds in figuring out a person’s preference structure—understanding whether the satisfaction gained from consuming one good is greater than that of another—explaining behavior in terms of changes in underlying likes and dislikes is usually highly problematic.","To argue, for instance, that the baby boom and then the baby bust resulted from an increase and then a decrease in the public’s inherent taste for children, rather than a change in relative prices against a background of stable preferences, places a social scientist in an unsound position.","In economics, such an argument about birth rates would be equivalent to saying that a rise and fall in mortality could be attributed to an increase in the inherent desire change for death.","For an economist, changes in income and prices, rather than changes in tastes, affect birth rates.","When income rises, for example, people want more children (or, as you will see later, more satisfaction derived from children), even if their inherent desire for children stays the same."],"ko":["한 사람의 선호도 구조를 알아내는 것, 즉 한 상품을 소비함으로써 얻는 만족도가 또 다른 상품을 소비함으로써 얻는 만족도보다 더 큰지를 이해하는 것에 성공한 경제학자에게는 행동을 기저에 있는 호불호의 변화의 관점에서 설명하는 것은 일반적으로 매우 문제가 많다.","예를 들어, 베이비 붐과 그 후의 출산율의 급락이 변동이 없는 선호도를 배경으로 한 상대적 비용의 변화보다는 아이에 대한 대중의 내재적인 기호의 증가와 그 후의 감소에서 비롯되었다고 주장하는 것은 사회 과학자를 불안정한 입지에 놓는다.","경제학에서 출생률에 대한 그러한 주장은 사망률의 상승과 하락이 죽음에 대한 내재적 욕구 변화의 증가에 기인한다고 말하는 것과 같다.","경제학자에게는 기호의 변화보다는 소득과 물가의 변화가 출산율에 영향을 미친다.","예를 들어, 소득이 증가할 때 사람들은 자녀에 대한 자신의 내재적 욕구가 그대로 유지되더라도 더 많은 자녀(또는 여러분이 나중에 알게 되겠지만, 아이로부터 오는 더 큰 만족감)를 원한다."],"theme":"경제학에서는 행동을 기호의 변화로 설명하기보다 소득과 가격의 변화로 설명해야 하며, 출산율도 마찬가지다.","blanks":[{"s":0,"ans":"changes in underlying likes and dislikes","ans_ko":"기저에 있는 호불호의 변화","opts":[{"en":"changes in market prices and incomes","ko":"시장 가격과 소득의 변화"},{"en":"differences in personal wealth and age","ko":"개인 재산과 나이의 차이"},{"en":"increases in available goods and services","ko":"이용 가능한 상품과 서비스의 증가"},{"en":"changes in political rights and duties","ko":"정치적 권리와 의무의 변화"}],"orig":false},{"s":0,"ans":"usually highly problematic","ans_ko":"일반적으로 매우 문제가 많은","opts":[{"en":"usually quite convincing","ko":"대개 꽤 설득력 있는"},{"en":"rarely very useful","ko":"거의 매우 유용하지는 않은"},{"en":"always perfectly accurate","ko":"언제나 완벽하게 정확한"},{"en":"sometimes slightly confusing","ko":"가끔 약간 혼란스러운"}],"orig":false},{"s":1,"ans":"the public’s inherent taste for children","ans_ko":"아이에 대한 대중의 내재적 기호","opts":[{"en":"the government’s support for large families","ko":"대가족에 대한 정부의 지원"},{"en":"the public’s knowledge of child health","ko":"아동 건강에 대한 대중의 지식"},{"en":"the schools’ willingness to accept children","ko":"아이들을 받아들이려는 학교의 의지"},{"en":"the doctors’ advice about having children","ko":"아이를 갖는 것에 대한 의사들의 조언"}],"orig":false},{"s":1,"ans":"places a social scientist in an unsound position","ans_ko":"사회 과학자를 불안정한 입지에 놓는다","opts":[{"en":"puts a social scientist in a strong position","ko":"사회 과학자를 강한 입지에 놓는다"},{"en":"helps a researcher win public trust","ko":"연구자가 대중의 신뢰를 얻도록 돕는다"},{"en":"protects economists from every criticism","ko":"경제학자들을 모든 비판으로부터 보호한다"},{"en":"gives a scholar a comfortable advantage","ko":"학자에게 편안한 이점을 준다"}],"orig":false},{"s":2,"ans":"a rise and fall in mortality","ans_ko":"사망률의 상승과 하락","opts":[{"en":"a rise and fall in birth rates","ko":"출생률의 상승과 하락"},{"en":"a growth and decline in tourism","ko":"관광의 성장과 쇠퇴"},{"en":"a drop and rebound in income taxes","ko":"소득세의 하락과 반등"},{"en":"a surge and slump in wages","ko":"임금의 급등과 급락"}],"orig":false},{"s":3,"ans":"changes in income and prices","ans_ko":"소득과 물가의 변화","opts":[{"en":"differences in age and gender","ko":"나이와 성별의 차이"},{"en":"changes in culture and religion","ko":"문화와 종교의 변화"},{"en":"gaps in education and class","ko":"교육과 계층의 격차"},{"en":"shifts in fashion and music","ko":"유행과 음악의 변화"}],"orig":false},{"s":4,"ans":"people want more children","ans_ko":"사람들은 더 많은 자녀를 원한다","opts":[{"en":"people want fewer children","ko":"사람들은 더 적은 자녀를 원한다"},{"en":"people save more money","ko":"사람들은 돈을 더 많이 저축한다"},{"en":"people marry much later","ko":"사람들은 훨씬 늦게 결혼한다"},{"en":"people travel more often","ko":"사람들은 더 자주 여행한다"}],"orig":false}]},{"id":"2211-38","label":"22년 11월 38번","taught":false,"modes":["ko","abc","mun","blank"],"en":["In the natural world, if an animal consumes a plant with enough antinutrients to make it feel unwell, it won’t eat that plant again.","Intuitively, animals also know to stay away from these plants.","Years of evolution and information being passed down created this innate intelligence.","This “intuition,” though, is not just seen in animals.","Have you ever wondered why most children hate vegetables?","Dr. Steven Gundry justifies this as part of our genetic programming, our inner intelligence.","Since many vegetables are full of antinutrients, your body tries to keep you away from them while you are still fragile and in development.","It does this by making your taste buds perceive these flavors as bad and even disgusting.","As you grow and your body becomes stronger enough to tolerate these antinutrients, suddenly they no longer taste as bad as before."],"ko":["자연계에서 만약 동물이 자신의 상태를 안 좋게 하기에 충분한 항영양소가 있는 식물을 섭취하면 그 동물은 그 식물을 다시는 먹지 않을 것이다.","직관적으로 동물은 또한 이러한 식물을 멀리할 줄 안다.","오랜 시간의 진화와 전해 내려오는 정보는 이 타고난 지능을 만들어 냈다.","그러나 이 ‘직관’은 동물에게서만 보이는 것은 아니다.","여러분은 대부분의 아이들이 왜 야채를 싫어하는지 궁금해 한 적이 있는가?","Dr. Steven Gundry는 이것을 우리의 유전적 프로그래밍, 즉 우리의 내적 지능의 일부로 정당화한다.","많은 야채들이 항영양소로 가득 차 있기 때문에 여러분이 아직 연약하고 성장 중에 있을 때 여러분의 몸은 여러분을 그것들로부터 멀리하게 하려고 노력한다.","그것은 여러분의 미뢰(味蕾)로 하여금 이러한 맛을 나쁘고 심지어 역겨운 것으로 인식하게 만듦으로써 이를 수행한다.","여러분이 성장하고 여러분의 신체가 이러한 항영양소를 견딜 만큼 충분히 더 강해지면 갑자기 그것들은 더 이상 이전만큼 맛이 나쁘게 느껴지지 않는다."],"theme":"동물이 해로운 식물을 피하는 직관처럼, 아이들이 야채를 싫어하는 것도 몸이 스스로를 지키려는 장치이며 자라면 그 맛을 견디게 된다.","blanks":[{"s":0,"ans":"to make it feel unwell","ans_ko":"몸 상태가 안 좋게 느끼도록","opts":[{"en":"to make it feel stronger","ko":"더 튼튼하게 느끼도록"},{"en":"to help it grow faster","ko":"더 빨리 자라게 돕도록"},{"en":"to keep it healthy","ko":"건강하게 유지하도록"},{"en":"to make it sleep longer","ko":"더 오래 자게 하도록"}],"orig":false},{"s":1,"ans":"stay away from these plants","ans_ko":"이 식물들을 멀리하다","opts":[{"en":"feed on these plants","ko":"이 식물들을 먹이로 삼다"},{"en":"search for these plants","ko":"이 식물들을 찾아다니다"},{"en":"grow more of these plants","ko":"이 식물들을 더 많이 키우다"},{"en":"learn from these plants","ko":"이 식물들에게서 배우다"}],"orig":false},{"s":3,"ans":"not just seen in animals","ans_ko":"동물에게서만 보이는 것은 아닌","opts":[{"en":"seen only in animals","ko":"동물에게서만 보이는"},{"en":"never seen in children","ko":"아이들에게서는 전혀 보이지 않는"},{"en":"clearly seen in plants","ko":"식물에게서 분명히 보이는"},{"en":"rarely seen in humans","ko":"사람에게서는 거의 보이지 않는"}],"orig":false},{"s":5,"ans":"part of our genetic programming","ans_ko":"우리 유전적 프로그래밍의 일부","opts":[{"en":"a sign of our poor education","ko":"우리의 부족한 교육의 징후"},{"en":"part of our family tradition","ko":"우리 가족 전통의 일부"},{"en":"a problem with our eyesight","ko":"우리 시력의 문제"},{"en":"a result of our school lunches","ko":"우리 학교 급식의 결과"}],"orig":false},{"s":6,"ans":"full of antinutrients","ans_ko":"항영양소로 가득 찬","opts":[{"en":"free of antinutrients","ko":"항영양소가 없는"},{"en":"poor in minerals","ko":"무기질이 부족한"},{"en":"high in sugar","ko":"당분이 많은"},{"en":"short of fresh water","ko":"신선한 물이 부족한"}],"orig":false},{"s":6,"ans":"keep you away from them","ans_ko":"여러분을 그것들로부터 멀리하게 하다","opts":[{"en":"bring you closer to them","ko":"여러분을 그것들에 더 가까이 데려가다"},{"en":"help you digest them","ko":"여러분이 그것들을 소화하도록 돕다"},{"en":"make you grow taller","ko":"여러분을 키가 더 크게 하다"},{"en":"teach you to cook them","ko":"여러분에게 그것들을 요리하는 법을 가르치다"}],"orig":false},{"s":7,"ans":"perceive these flavors as bad and even disgusting","ans_ko":"이러한 맛을 나쁘고 심지어 역겨운 것으로 인식하다","opts":[{"en":"enjoy these flavors as sweet and even delicious","ko":"이러한 맛을 달콤하고 심지어 맛있는 것으로 즐기다"},{"en":"remember these flavors as strange and even exciting","ko":"이러한 맛을 이상하고 심지어 흥미로운 것으로 기억하다"},{"en":"forget these flavors as cheap and even boring","ko":"이러한 맛을 싸고 심지어 지루한 것으로 잊다"},{"en":"rank these flavors as light and even healthy","ko":"이러한 맛을 가볍고 심지어 건강한 것으로 평가하다"}],"orig":false}]},{"id":"2311-21","label":"23년 11월 21번","taught":false,"modes":["ko","mun","blank"],"en":["The arts and aesthetics offer emotional connection to the full range of human experience.","“The arts can be more than just sugar on the tongue,” Anjan Chatterjee, a professor at the University of Pennsylvania, says.","“In art, when there’s something challenging, which can also be uncomfortable, this discomfort, if we’re willing to engage with it, offers the possibility of some change, some transformation.","That can also be a powerful aesthetic experience.”","The arts, in this way, become vehicles to contend with ideas and concepts that are difficult and uncomfortable otherwise.","When Picasso painted his masterpiece Guernica in 1937, he captured the heartbreaking and cruel nature of war, and offered the world a way to consider the universal suffering caused by the Spanish Civil War.","When Lorraine Hansberry wrote her play A Raisin in the Sun, she gave us a powerful story of people struggling with racism, discrimination, and the pursuit of the American dream while also offering a touching portrait of family life."],"ko":[" 예술과 미학은 다양한 인간 경험에 대한 정서적인 연결을 제공한다."," “예술은 단순히 혀 위의 설탕 이상의 것이 될 수 있다,”라고 Pennsylvania 대학교의 교수인 Anjan Chatterjee는 말한다."," “예술에서, 무언가 도전적인 것이 있고 그것이 또한 불편할 수 있을 때, 이 불편은, 만약 우리가 기꺼이 그것에 참여하려 한다면, 어떤 변화, 어떤 변형의 가능성을 제공한다."," 그것은 또한 강력한 미적 경험이 될 수 있다.”"," 예술은, 이런 방식으로, 그렇지 않았더라면 어렵고 불편한 아이디어 및 개념들과 싸우는 매개체가 된다."," Picasso가 그의 걸작 Guernica를 1937년에 그렸을 때, 그는 가슴 아프고 잔인한 전쟁의 본질을 포착했고, 스페인 내전으로 인한 보편적인 고통을 숙고할 방법을 세상에 제공했다."," Lorraine Hansberry가 그녀의 희곡 A Raisin in the Sun을 썼을 때, 그녀는 또한 가족생활에 대한 감동적인 초상화를 제공하면서 인종주의, 차별, 아메리칸드림의 추구를 위해 고군분투하는 사람들의 강력한 이야기를 우리에게 주었다."],"theme":"예술은 불편하고 어려운 생각과 맞서게 해 주는 매개체여서, 즐거움을 넘어 다양한 인간 경험을 느끼게 해 준다.","blanks":[{"s":0,"ans":"emotional connection to the full range of human experience","ans_ko":"인간 경험의 전 범위에 대한 정서적 연결","opts":[{"en":"a temporary escape from the hardships of daily life","ko":"일상생활의 어려움으로부터의 일시적인 도피"},{"en":"intellectual training limited to a few skilled artists","ko":"소수의 숙련된 예술가에게만 한정된 지적 훈련"},{"en":"comfort that avoids anything difficult or unfamiliar","ko":"어렵거나 낯선 것은 피하는 위안"},{"en":"technical knowledge about the history of art styles","ko":"미술 양식의 역사에 관한 기술적 지식"}],"orig":false},{"s":2,"ans":"offers the possibility of some change, some transformation","ans_ko":"어떤 변화, 어떤 변형의 가능성을 제공한다","opts":[{"en":"removes every chance of feeling uncomfortable again","ko":"다시 불편함을 느낄 모든 가능성을 없앤다"},{"en":"guarantees that nothing in us will ever be changed","ko":"우리 안의 어떤 것도 변하지 않을 것을 보장한다"},{"en":"reminds us only of the pleasures we already know","ko":"우리가 이미 아는 즐거움만 떠올리게 한다"},{"en":"creates the danger of losing our own identity","ko":"우리 자신의 정체성을 잃을 위험을 만든다"}],"orig":false},{"s":3,"ans":"a powerful aesthetic experience","ans_ko":"강력한 미적 경험","opts":[{"en":"a harmless entertainment that is soon forgotten","ko":"곧 잊히는 해롭지 않은 오락"},{"en":"an unpleasant event that should be avoided","ko":"피해야 할 불쾌한 사건"},{"en":"the only way to enjoy beautiful things","ko":"아름다운 것을 즐기는 유일한 방법"},{"en":"a private memory of the artist’s childhood","ko":"예술가의 어린 시절에 대한 개인적인 기억"}],"orig":false},{"s":4,"ans":"difficult and uncomfortable otherwise","ans_ko":"그렇지 않으면 어렵고 불편한","opts":[{"en":"clear and pleasant in any situation","ko":"어떤 상황에서도 분명하고 즐거운"},{"en":"familiar and welcome to everyone","ko":"모두에게 익숙하고 환영받는"},{"en":"simple but hard to forget","ko":"단순하지만 잊기 어려운"},{"en":"harmful and unnecessary for most people","ko":"대부분의 사람에게 해롭고 불필요한"}],"orig":false},{"s":5,"ans":"captured the heartbreaking and cruel nature of war","ans_ko":"전쟁의 가슴 아프고 잔인한 본질을 포착했다","opts":[{"en":"praised the courage and honor of soldiers","ko":"군인들의 용기와 명예를 칭송했다"},{"en":"hid the political reasons behind the fighting","ko":"전투 뒤의 정치적 이유를 숨겼다"},{"en":"showed how peaceful the countryside had become","ko":"시골이 얼마나 평화로워졌는지 보여 줬다"},{"en":"recorded only the details of famous battles","ko":"유명한 전투의 세부 사항만 기록했다"}],"orig":false},{"s":6,"ans":"while also offering a touching portrait of family life","ans_ko":"가족생활에 대한 감동적인 초상화를 제공하면서","opts":[{"en":"while avoiding any scene of ordinary family life","ko":"평범한 가족생활의 장면은 모두 피하면서"},{"en":"but never mentioning the struggles of her people","ko":"그러나 자기 민족의 고투는 전혀 언급하지 않으면서"},{"en":"and teaching us how to write a successful play","ko":"그리고 성공적인 희곡을 쓰는 법을 가르치면서"},{"en":"while strongly criticizing the American dream itself","ko":"아메리칸드림 자체를 강하게 비판하면서"}],"orig":false}]},{"id":"2311-23","label":"23년 11월 23번","taught":false,"modes":["ko","abc","mun","blank"],"en":["Sylvan Goldman invented the shopping cart and introduced it in his stores in 1937.","It was an excellent device that would make it easy for shoppers to buy as much as they wanted without getting tired or seeking others’ help.","But Goldman discovered that in spite of his repeated advertisements and explanations, he could not persuade his shoppers to use the wheeled carts.","Men were reluctant because they thought they would appear weak if they pushed such carts instead of carrying their shopping.","Women wouldn’t touch them because the carts reminded them of baby carriages.","It was only a few elderly shoppers who used them.","That made the carts even less attractive to the majority of the shoppers.","Then Goldman hit upon an idea.","He hired several models, men and women, of different ages and asked them to wheel the carts in the store and shop.","A young woman employee standing near the entrance told the regular shoppers, ‘Look, everyone is using the carts. Why don’t you?’","That was the turning point.","A few shills disguised as regular shoppers easily accomplished what logic, explanations, and advertisements failed to do.","Within a few weeks shoppers readily accepted those carts."],"ko":[" Sylvan Goldman은 쇼핑 카트를 발명하고 1937년에 그의 가게들에 그것을 도입했다."," 그것은 쇼핑객들이 지치거나 다른 사람들의 도움을 구하지 않고 그들이 원했던 만큼 구매하는 것을 쉽게 만들어 준 훌륭한 장치였다."," 하지만 Goldman은 그의 반복적인 광고와 설명에도 불구하고, 그의 쇼핑객들에게 바퀴 달린 카트들을 사용하도록 설득할 수 없다는 것을 알게 됐다."," 남성들은 그들의 쇼핑한 물건을 들고 다니는 대신 만약 그들이 그런 카트들을 민다면 그들이 나약해 보일 것으로 생각했기 때문에 꺼렸다."," 여성들은 카트들이 그들에게 유모차를 연상시키기 때문에 그것들에 손대려 하지 않았다."," 그것들을 사용하는 사람들은 오직 몇 명의 노인 쇼핑객들뿐이었다."," 그것은 카트들을 대다수 쇼핑객들에게 훨씬 덜 매력적이도록 만들었다."," 그때 Goldman이 한 아이디어를 떠올렸다."," 그는 다른 연령대의 남자와 여자 모델들을 고용했고, 그들에게 상점에서 카트들을 밀고 쇼핑하도록 요청했다."," 입구 근처에 서 있던 한 젊은 여성 직원이 일반 쇼핑객들에게 ‘보세요, 모든 사람이 카트를 사용하고 있습니다. 해 보는 게 어떠세요?’라고 말했다."," 그것이 전환점이었다."," 일반 쇼핑객들로 위장한 바람잡이들이 논리, 설명, 그리고 광고가 하지 못한 것을 쉽게 달성했다."," 몇 주 만에 쇼핑객들은 그 카트들을 기꺼이 받아들였다."],"theme":"Goldman은 손님들이 쇼핑 카트를 꺼리자 다른 사람들이 쓰는 모습을 보여 주어 카트를 받아들이게 했다(또래 행동의 설득력).","blanks":[{"s":1,"ans":"without getting tired or seeking others’ help","ans_ko":"지치거나 다른 사람의 도움을 구하지 않고","opts":[{"en":"without checking prices or comparing brands","ko":"가격을 확인하거나 상표를 비교하지 않고"},{"en":"unless they asked the store staff for help","ko":"점원에게 도움을 청하지 않으면"},{"en":"even when they had no money to spend","ko":"쓸 돈이 없을 때조차"},{"en":"after waiting a long time in the line","ko":"줄에서 오래 기다린 뒤에"}],"orig":false},{"s":2,"ans":"in spite of his repeated advertisements and explanations","ans_ko":"그의 반복적인 광고와 설명에도 불구하고","opts":[{"en":"thanks to his repeated advertisements and explanations","ko":"그의 반복적인 광고와 설명 덕분에"},{"en":"because of the lack of advertisements and explanations","ko":"광고와 설명이 부족했기 때문에"},{"en":"even without any advertisements or explanations","ko":"광고나 설명이 전혀 없어도"},{"en":"after a few advertisements and explanations","ko":"몇 번의 광고와 설명 뒤에"}],"orig":false},{"s":3,"ans":"they would appear weak if they pushed such carts","ans_ko":"그런 카트를 밀면 나약해 보일 것이다","opts":[{"en":"they would look poor if they bought too much","ko":"너무 많이 사면 가난해 보일 것이다"},{"en":"they would get tired if they carried their shopping","ko":"쇼핑한 물건을 들고 다니면 지칠 것이다"},{"en":"they would lose their way in a crowded store","ko":"붐비는 가게에서 길을 잃을 것이다"},{"en":"they would spend more money if they used carts","ko":"카트를 쓰면 돈을 더 쓸 것이다"}],"orig":false},{"s":4,"ans":"the carts reminded them of baby carriages","ans_ko":"카트가 유모차를 떠올리게 했다","opts":[{"en":"the carts were too heavy to push around","ko":"카트가 너무 무거워 밀고 다닐 수 없었다"},{"en":"the carts looked too expensive for ordinary shoppers","ko":"카트가 일반 손님에게는 너무 비싸 보였다"},{"en":"the carts made too much noise in the aisles","ko":"카트가 통로에서 소리를 너무 많이 냈다"},{"en":"the carts were only made for children","ko":"카트는 어린이만을 위해 만들어졌다"}],"orig":false},{"s":5,"ans":"only a few elderly shoppers","ans_ko":"오직 몇 명의 노인 쇼핑객","opts":[{"en":"mostly young men and women","ko":"주로 젊은 남녀"},{"en":"nearly all of the regular shoppers","ko":"거의 모든 일반 쇼핑객"},{"en":"a few store employees","ko":"몇몇 가게 직원"},{"en":"many families with small children","ko":"어린 자녀가 있는 많은 가족"}],"orig":false},{"s":8,"ans":"wheel the carts in the store and shop","ans_ko":"상점에서 카트를 밀고 쇼핑하다","opts":[{"en":"carry their shopping bags out of the store","ko":"쇼핑 가방을 들고 가게 밖으로 나가다"},{"en":"demonstrate new products to the shoppers","ko":"쇼핑객들에게 신제품을 시연하다"},{"en":"advertise the carts on the street outside","ko":"바깥 길거리에서 카트를 광고하다"},{"en":"count the number of people at the entrance","ko":"입구에 있는 사람 수를 세다"}],"orig":false},{"s":11,"ans":"what logic, explanations, and advertisements failed to do","ans_ko":"논리, 설명, 광고가 하지 못한 것","opts":[{"en":"what the models and employees were told to say","ko":"모델과 직원들이 말하라고 들은 것"},{"en":"what the shoppers had asked the store to provide","ko":"쇼핑객들이 가게에 제공해 달라고 요청한 것"},{"en":"what carts had been designed to do for years","ko":"카트가 몇 년 동안 하도록 설계된 것"},{"en":"what the other stores were afraid to try","ko":"다른 가게들이 시도하기를 두려워한 것"}],"orig":false}]},{"id":"2311-30","label":"23년 11월 30번","taught":false,"modes":["ko","abc","mun","blank"],"en":["Technology changes how individuals and societies understand the concept of privacy.","The fact that someone has a new ability to access information or watch the actions of another does not justify doing so.","Rather, advances in technology require citizens and policy makers to consider how privacy protections should be expanded.","For example, when cameras first became available for commercial and private use, nations and citizens struggled over whether new laws should be enacted to protect individuals from being photographed without their permission.","The reconsideration of privacy brought about by this new technology re-affirmed a distinction between private and public spaces.","It was determined by most cultures that people automatically gave consent to being seen ― and thus recorded ― once they voluntarily stepped into a public space.","Although some people might be uncomfortable with the spread of surveillance cameras, citizens in most cultures have adjusted to the fact that giving up the right not to be observed in these circumstances causes less harm to the community than failing to have surveillance."],"ko":[" 기술은 개인들과 사회가 사생활의 개념을 이해하는 방식을 변화시킨다."," 누군가가 정보에 접근하거나 다른 사람의 행동을 관찰하는 새로운 능력을 갖추고 있다는 사실은 그렇게 하는 것을 정당화하지 않는다."," 오히려, 기술의 발전은 시민들과 정책 입안자들이 어떻게 사생활 보호가 확장되어야 하는지 고려할 것을 요구한다."," 예를 들어, 카메라들이 상업적이고 사적인 용도로 처음 사용될 수 있게 되었을 때, 국가들과 시민들은 그들의 허가 없이 개인들이 사진에 찍히는 것으로부터 보호하기 위해 새로운 법들이 제정되어야 하는지에 대해 투쟁했다."," 이 새로운 기술이 가져온 사생활에 대한 재고는 사적 및 공적 공간의 구별을 재확인했다."," 일단 사람들이 자발적으로 공공장소에 발을 들여놓으면, 보여지고, 따라서 녹화되는 것에 자동적으로 동의하는 것으로 대부분의 문화에서 결정되었다.","일부 사람들은 감시 카메라들의 확산을 불편하게 여길지도 모르지만, 대부분의 문화권에 있는 시민들은 이러한 상황에서 관찰되지 않을 권리를 포기하는 것이 감시받지 못하는 것보다 공동체에 더 적은 해를 끼친다는 사실에 순응해 왔다."],"theme":"기술이 발전하면 사생활 보호도 더 넓게 고민해야 하며, 공공장소에서의 감시는 사회에 더 적은 해를 끼친다는 데 문화들이 적응해 왔다.","blanks":[{"s":0,"ans":"how individuals and societies understand the concept of privacy","ans_ko":"개인과 사회가 사생활의 개념을 이해하는 방식","opts":[{"en":"why governments and companies collect private information","ko":"정부와 기업이 사적인 정보를 수집하는 이유"},{"en":"when individuals decide to share their personal stories","ko":"개인이 자신의 이야기를 공유하기로 결정하는 때"},{"en":"what societies expect from their technology experts","ko":"사회가 기술 전문가에게 기대하는 것"},{"en":"how quickly individuals learn to use new machines","ko":"개인이 새 기계 사용법을 얼마나 빨리 배우는지"}],"orig":false},{"s":1,"ans":"does not justify doing so","ans_ko":"그렇게 하는 것을 정당화하지 않는다","opts":[{"en":"gives full permission to do so","ko":"그렇게 할 완전한 허락을 준다"},{"en":"makes it harder for others to do so","ko":"다른 사람이 그렇게 하기 더 어렵게 만든다"},{"en":"rarely leads to doing so","ko":"좀처럼 그렇게 하는 데 이르지 않는다"},{"en":"always demands doing so","ko":"언제나 그렇게 할 것을 요구한다"}],"orig":false},{"s":2,"ans":"consider how privacy protections should be expanded","ans_ko":"사생활 보호가 어떻게 확장되어야 하는지 고려하다","opts":[{"en":"ignore how privacy protections have changed","ko":"사생활 보호가 어떻게 변해 왔는지 무시하다"},{"en":"accept that privacy protections will be reduced","ko":"사생활 보호가 축소될 것임을 받아들이다"},{"en":"limit how fast new technology should be developed","ko":"새 기술이 얼마나 빨리 개발되어야 하는지 제한하다"},{"en":"study how all citizens can learn new devices","ko":"모든 시민이 새 기기를 어떻게 배울 수 있는지 연구하다"}],"orig":false},{"s":3,"ans":"protect individuals from being photographed without their permission","ans_ko":"허락 없이 사진 찍히는 것으로부터 개인을 보호하다","opts":[{"en":"allow companies to sell photographs to the public","ko":"회사가 사진을 대중에게 팔도록 허용하다"},{"en":"encourage individuals to be photographed in public","ko":"개인이 공공장소에서 사진 찍히도록 장려하다"},{"en":"prevent cameras from being used for business","ko":"카메라가 사업에 쓰이는 것을 막다"},{"en":"punish individuals who refuse to be photographed","ko":"사진 찍히기를 거부하는 개인을 처벌하다"}],"orig":false},{"s":4,"ans":"re-affirmed a distinction between private and public spaces","ans_ko":"사적 공간과 공적 공간의 구별을 재확인했다","opts":[{"en":"erased the line between work and family life","ko":"일과 가족생활 사이의 경계를 지워 버렸다"},{"en":"raised doubts about the value of public places","ko":"공공장소의 가치에 의문을 제기했다"},{"en":"weakened the laws that protected private property","ko":"사유 재산을 보호하는 법을 약화시켰다"},{"en":"ended the debate over who owns new technology","ko":"새 기술을 누가 소유하는지에 대한 논쟁을 끝냈다"}],"orig":false},{"s":5,"ans":"automatically gave consent to being seen","ans_ko":"자동으로 보여지는 것에 동의했다","opts":[{"en":"remained free to decline being seen","ko":"보여지는 것을 거절할 자유를 그대로 가졌다"},{"en":"rarely accepted being watched","ko":"좀처럼 보여지는 것을 받아들이지 않았다"},{"en":"lost interest in being seen","ko":"보여지는 것에 흥미를 잃었다"},{"en":"first asked others to look away","ko":"먼저 다른 사람들에게 시선을 돌려 달라고 요청했다"}],"orig":false},{"s":6,"ans":"causes less harm to the community","ans_ko":"공동체에 더 적은 해를 끼친다","opts":[{"en":"causes more harm to the community","ko":"공동체에 더 많은 해를 끼친다"},{"en":"gives more freedom to ordinary citizens","ko":"일반 시민에게 더 많은 자유를 준다"},{"en":"is less popular in the community","ko":"공동체에서 인기가 더 없다"},{"en":"is more expensive for the community","ko":"공동체에 더 많은 비용이 든다"}],"orig":false}]},{"id":"2311-31","label":"23년 11월 31번","taught":false,"modes":["abc","blank"],"en":["Coincidence that is statistically impossible seems to us like an irrational event, and some define it as a miracle.","But, as Montaigne has said, “the origin of a miracle is in our ignorance, at the level of our knowledge of nature, and not in nature itself.”","Glorious miracles have been later on discovered to be obedience to the laws of nature or a technological development that was not widely known at the time.","As the German poet, Goethe, phrased it: “Things that are mysterious are not yet miracles.”","The miracle assumes the intervention of a “higher power” in its occurrence that is beyond human capability to grasp.","Yet there are methodical and simple ways to “cause a miracle” without divine revelation and inspiration.","Instead of checking it out, investigating and finding the source of the event, we define it as a miracle.","The miracle, then, is the excuse of those who are too lazy to think."],"ko":[" 통계적으로 불가능한 우연은 우리에게 비이성적인 사건처럼 보이고, 어떤 이들은 그것을 기적으로 정의한다."," 그러나, Montaigne가 말했듯이, “기적의 기원은 자연 그 자체가 아니라 자연에 대한 우리의 지식수준에서, 우리의 무지에 있다.”"," 영광스러운 기적들은 자연의 법칙에 대한 순응으로서, 혹은 당시에는 널리 알려지지 않았던 기술적 발전으로서 나중에 발견되어 왔다."," 독일 시인 Goethe가 그것을 표현했듯이, “‘신비한’ 것들은 아직 ‘기적’이 ‘아니다’.”"," 기적은 그것의 발생에 있어서 인간이 이해할 수 있는 능력 너머의 ‘더 높은 힘’의 개입을 가정한다."," 하지만, 신적인 계시와 영감 없이 ‘기적을 일으키는’ 체계적이고 간단한 방법들이 있다."," 그것을 확인하는 것, 즉, 그 사건의 근원을 조사하고 찾는 것 대신에, 우리는 그것을 기적으로 정의한다."," 그렇다면, 기적은 생각하는 데 너무 게으른 사람들의 핑계이다."],"theme":"기적은 자연이 아니라 자연에 대한 우리의 무지에서 나오며, 원인을 알아보지 않고 기적이라 부르는 것은 생각하기 귀찮아하는 사람들의 핑계이다.","blanks":[{"s":0,"ans":"seems to us like an irrational event","ans_ko":"우리에게 비이성적인 사건처럼 보인다","opts":[{"en":"looks to us like a predictable result","ko":"우리에게 예측 가능한 결과처럼 보인다"},{"en":"has no meaning for most of us","ko":"우리 대부분에게 아무 의미가 없다"},{"en":"feels to us like a pleasant surprise","ko":"우리에게 기분 좋은 놀라움처럼 느껴진다"},{"en":"occurs to us only in our dreams","ko":"우리에게 꿈속에서만 일어난다"}],"orig":false},{"s":1,"ans":"in our ignorance","ans_ko":"우리의 무지에","opts":[{"en":"in our flexibility","ko":"우리의 유연성에"},{"en":"in our excellence","ko":"우리의 우수성에"},{"en":"in our satisfaction","ko":"우리의 만족에"},{"en":"in our exaggeration","ko":"우리의 과장에"}],"orig":true},{"s":2,"ans":"obedience to the laws of nature","ans_ko":"자연의 법칙에 대한 순응","opts":[{"en":"a violation of the laws of nature","ko":"자연의 법칙에 대한 위반"},{"en":"evidence of a higher power’s will","ko":"더 높은 힘의 의지의 증거"},{"en":"a result of pure good luck","ko":"순전한 행운의 결과"},{"en":"an invention of ancient poets","ko":"고대 시인들의 발명품"}],"orig":false},{"s":4,"ans":"beyond human capability to grasp","ans_ko":"인간이 이해할 수 있는 능력을 넘어선","opts":[{"en":"within the reach of anyone who studies","ko":"공부하는 누구나 닿을 수 있는 범위 안에 있는"},{"en":"easy for scientists to measure","ko":"과학자가 측정하기 쉬운"},{"en":"known only to children and the young","ko":"어린이와 젊은이만 아는"},{"en":"based on what the poets have written","ko":"시인들이 쓴 것에 바탕을 둔"}],"orig":false},{"s":5,"ans":"without divine revelation and inspiration","ans_ko":"신적인 계시와 영감 없이","opts":[{"en":"through divine revelation and inspiration","ko":"신적인 계시와 영감을 통해"},{"en":"without any method or careful thought","ko":"어떤 방법이나 신중한 생각도 없이"},{"en":"with the help of a higher power","ko":"더 높은 힘의 도움으로"},{"en":"despite ancient poets and philosophers","ko":"고대 시인과 철학자에도 불구하고"}],"orig":false},{"s":6,"ans":"finding the source of the event","ans_ko":"그 사건의 근원을 찾는 것","opts":[{"en":"enjoying the mystery of the event","ko":"그 사건의 신비를 즐기는 것"},{"en":"forgetting the details of the event","ko":"그 사건의 세부 사항을 잊는 것"},{"en":"telling others the story of the event","ko":"다른 사람들에게 그 사건의 이야기를 전하는 것"},{"en":"celebrating the success of the event","ko":"그 사건의 성공을 축하하는 것"}],"orig":false}]},{"id":"2311-32","label":"23년 11월 32번","taught":true,"modes":["ko","abc","mun","blank"],"en":["Information encountered after an event can influence subsequent remembering.","External information can easily integrate into a witness’s memory, especially if the event was poorly encoded or the memory is from a distant event, in which case time and forgetting have degraded the original memory.","With reduced information available in memory with which to confirm the validity of post-event misinformation, it is less likely that this new information will be rejected.","Instead, especially when it fits the witness’s current thinking and can be used to create a story that makes sense to him or her, it may be integrated as part of the original experience.","This process can be explicit (i.e., the witness knows it is happening), but it is often unconscious.","That is, the witness might find himself or herself thinking about the event differently without awareness.","Over time, the witness may not even know the source of information that led to the (new) memory.","Sources of misinformation in forensic contexts can be encountered anywhere, from discussions with other witnesses to social media searches to multiple interviews with investigators or other legal professionals, and even in court."],"ko":[" 사건 후에 마주친 정보는 이후의 기억하는 것에 영향을 미칠 수 있다."," 특히 사건이 불충분하게 부호화되었거나, 그 기억이 시간과 망각이 원래의 기억을 저하시켜 온 먼 사건으로부터 온 것이라면, 외부 정보는 목격자의 기억에 쉽게 통합될 수 있다."," 사건 후의 잘못된 정보의 유효성을 확인하기 위해 기억에서 사용할 수 있는 줄어든 정보를 가지면, 이 새로운 정보가 덜 거부될 듯하다."," 대신에, 특히 그것이 목격자의 현재 생각과 맞고 그 또는 그녀에게 이해되는 하나의 이야기를 만드는 데 사용될 수 있을 때, 그것은 원래 경험의 일부로서 통합될 수 있다."," 이 과정은 명시적일 수 있지만(즉, 목격자는 그것이 일어나고 있다는 것을 알고 있다), 그것은 흔히 무의식적이다."," 즉, 목격자는 의식하지 못한 채 그 사건에 대해 다르게 생각하는 그 자신 또는 그녀 자신을 발견할지도 모른다."," 시간이 지남에 따라, 목격자는 (새로운) 기억으로 이끄는 정보의 출처조차 모를지도 모른다.","법정의 상황에서의 잘못된 정보의 출처는 다른 목격자들과의 토론에서부터 소셜 미디어 조사들, 수사관 또는 기타 법률 전문가들과의 다중 인터뷰들, 심지어 법정에서까지 어디에서나 마주쳐질 수 있다."],"theme":"사건 뒤에 접한 잘못된 정보는 기억이 흐릴수록 거부되지 않고 원래 기억의 일부로 쉽게 섞여 들어간다.","blanks":[{"s":0,"ans":"influence subsequent remembering","ans_ko":"이후의 기억하는 것에 영향을 미치다","opts":[{"en":"erase earlier memories at once","ko":"이전 기억을 즉시 지우다"},{"en":"make forgetting impossible","ko":"망각을 불가능하게 만들다"},{"en":"hardly affect later recall","ko":"이후의 회상에 거의 영향을 주지 않다"},{"en":"depend on the age of the witness","ko":"목격자의 나이에 달려 있다"}],"orig":false},{"s":1,"ans":"easily integrate into a witness’s memory","ans_ko":"목격자의 기억에 쉽게 통합되다","opts":[{"en":"rarely change a witness’s testimony","ko":"좀처럼 목격자의 증언을 바꾸지 않다"},{"en":"quickly disappear from a witness’s memory","ko":"목격자의 기억에서 빠르게 사라지다"},{"en":"always improve the accuracy of recall","ko":"회상의 정확성을 언제나 높이다"},{"en":"be easily separated from the original event","ko":"원래 사건과 쉽게 분리되다"}],"orig":false},{"s":2,"ans":"this new information will be rejected","ans_ko":"이 새로운 정보가 거부될","opts":[{"en":"people will deny the experience of forgetting","ko":"사람들이 망각의 경험을 부인할"},{"en":"interference between conflicting data will occur","ko":"상충하는 데이터 사이에 간섭이 일어날"},{"en":"the unconscious will be involved in the recall process","ko":"무의식이 회상 과정에 관여할"},{"en":"a recent event will last longer in memory than a distant one","ko":"최근의 사건이 먼 사건보다 기억에 더 오래 남을"}],"orig":true},{"s":3,"ans":"integrated as part of the original experience","ans_ko":"원래 경험의 일부로서 통합된","opts":[{"en":"stored separately from the original experience","ko":"원래 경험과 따로 저장된"},{"en":"deleted from any real experience","ko":"어떤 실제 경험에서도 삭제된"},{"en":"compared with the original experience","ko":"원래 경험과 비교된"},{"en":"rejected as part of the witness’s story","ko":"목격자의 이야기의 일부로서 거부된"}],"orig":false},{"s":4,"ans":"it is often unconscious","ans_ko":"그것은 흔히 무의식적이다","opts":[{"en":"it is never unconscious","ko":"그것은 결코 무의식적이지 않다"},{"en":"it is seldom repeated","ko":"그것은 좀처럼 반복되지 않는다"},{"en":"it is easily corrected","ko":"그것은 쉽게 바로잡힌다"},{"en":"it is usually forgotten at once","ko":"그것은 보통 곧바로 잊힌다"}],"orig":false},{"s":5,"ans":"thinking about the event differently without awareness","ans_ko":"의식하지 못한 채 그 사건에 대해 다르게 생각하는","opts":[{"en":"remembering the event exactly as it happened","ko":"그 사건을 일어난 그대로 정확히 기억하는"},{"en":"forgetting the event completely over time","ko":"시간이 지나면서 그 사건을 완전히 잊는"},{"en":"talking about the event with other witnesses","ko":"다른 목격자들과 그 사건에 대해 이야기하는"},{"en":"avoiding the event on purpose every day","ko":"그 사건을 날마다 일부러 피하는"}],"orig":false}]},{"id":"2311-33","label":"23년 11월 33번","taught":true,"modes":["ko","abc","mun","blank"],"en":["Correlations are powerful because the insights they offer are relatively clear.","These insights are often covered up when we bring causality back into the picture.","For instance, a used-car dealer supplied data to statisticians to predict which of the vehicles available for purchase at an auction were likely to have problems.","A correlation analysis showed that orange-colored cars were far less likely to have defects.","Even as we read this, we already think about why it might be so: Are orange-colored car owners likely to be car enthusiasts and take better care of their vehicles?","Or, is it because orange-colored cars are more noticeable on the road and therefore less likely to be in accidents, so they’re in better condition when resold?","Quickly we are caught in a web of competing causal hypotheses.","But our attempts to illuminate things this way only make them cloudier.","Correlations exist; we can show them mathematically.","We can’t easily do the same for causal links.","So we would do well to hold off from trying to explain the reason behind the correlations."],"ko":[" 상관관계는 그것들이 제공하는 통찰력이 비교적 명확하기 때문에 강력하다."," 이러한 통찰력은 종종 우리가 인과 관계를 그 상황으로 다시 가져올 때 가려진다."," 예를 들어, 한 중고차 딜러가 경매에서 구입할 수 있는 차량들 중 어떤 차량에 문제가 발생할 가능성이 있는지를 예측하기 위한 데이터를 통계학자들에게 제공했다."," 한 상관관계 분석은 주황색 차들이 결함이 있을 가능성이 훨씬 적다는 것을 보여 줬다."," 심지어 우리가 이것을 읽으면서도, 우리는 이미 왜 그럴지에 대해 생각한다. 주황색 차를 소유한 사람들이 자동차 애호가여서 그들의 차량을 더 잘 관리할 가능성이 있는가?"," 아니면, 주황색 차들이 도로에서 더 눈에 띄고, 그래서 사고가 날 가능성이 적어 재판매될 때 그것들이 상태가 더 좋은 것이기 때문인가?"," 곧 우리는 경쟁적인 인과 가설의 함정에 빠진다."," 하지만 이런 식으로 무언가를 설명하려는 우리의 시도는 그것들을 더 흐리게 만들 뿐이다."," 상관관계는 존재하며 우리는 그것들을 수학적으로 보여 줄 수 있다."," 우리는 인과 관계에 대해서는 쉽게 똑같이 할 수 없다."," 따라서 우리는 상관관계의 배후에 있는 이유를 설명하려 하지 않는 것이 좋다."],"theme":"상관관계는 분명한 통찰을 주지만 이유를 따지는 순간 인과 가설의 함정에 빠지므로, 상관관계의 이유를 설명하려 하지 않는 것이 좋다.","blanks":[{"s":0,"ans":"the insights they offer are relatively clear","ans_ko":"그것들이 제공하는 통찰이 비교적 명확하다","opts":[{"en":"the data they use are easy to collect","ko":"그것들이 쓰는 데이터는 모으기 쉽다"},{"en":"the causes they explain are always certain","ko":"그것들이 설명하는 원인은 언제나 확실하다"},{"en":"the results they show are rarely questioned","ko":"그것들이 보여 주는 결과는 좀처럼 의심받지 않는다"},{"en":"the people they help are mostly experts","ko":"그것들이 돕는 사람들은 대부분 전문가다"}],"orig":false},{"s":1,"ans":"when we bring causality back into the picture","ans_ko":"우리가 인과 관계를 다시 그 상황으로 가져올 때","opts":[{"en":"when we remove causality from the picture","ko":"우리가 인과 관계를 그 상황에서 제거할 때"},{"en":"when we compare two sets of numbers","ko":"우리가 두 묶음의 숫자를 비교할 때"},{"en":"when we show them to other people","ko":"우리가 그것들을 다른 사람들에게 보여 줄 때"},{"en":"when we repeat the same test again","ko":"우리가 같은 시험을 다시 반복할 때"}],"orig":false},{"s":3,"ans":"far less likely to have defects","ans_ko":"결함이 있을 가능성이 훨씬 적은","opts":[{"en":"far more likely to have defects","ko":"결함이 있을 가능성이 훨씬 큰"},{"en":"far more expensive than other cars","ko":"다른 차보다 훨씬 비싼"},{"en":"sold more quickly at the auction","ko":"경매에서 더 빨리 팔린"},{"en":"owned mostly by car enthusiasts","ko":"주로 자동차 애호가가 소유한"}],"orig":false},{"s":4,"ans":"why it might be so","ans_ko":"왜 그럴지","opts":[{"en":"whether the data are correct","ko":"그 데이터가 정확한지"},{"en":"who should buy the car","ko":"누가 그 차를 사야 하는지"},{"en":"when it will change","ko":"그것이 언제 바뀔지"},{"en":"how it can be measured","ko":"그것을 어떻게 측정할 수 있는지"}],"orig":false},{"s":5,"ans":"more noticeable on the road","ans_ko":"도로에서 더 눈에 띄는","opts":[{"en":"easier to repair after accidents","ko":"사고 후에 고치기 더 쉬운"},{"en":"cheaper to drive on the road","ko":"도로에서 운전하기 더 싼"},{"en":"less popular with used-car dealers","ko":"중고차 딜러들에게 덜 인기 있는"},{"en":"better known to the statisticians","ko":"통계학자들에게 더 잘 알려진"}],"orig":false},{"s":6,"ans":"caught in a web of competing causal hypotheses","ans_ko":"경쟁하는 인과 가설의 함정에 빠진","opts":[{"en":"guided by a clear set of shared facts","ko":"분명한 공통 사실에 이끌린"},{"en":"freed from the need to explain anything","ko":"어떤 것도 설명할 필요에서 벗어난"},{"en":"tired of reading too many statistics","ko":"너무 많은 통계를 읽는 데 지친"},{"en":"convinced by a single simple answer","ko":"하나의 단순한 답에 확신하게 된"}],"orig":false},{"s":7,"ans":"only make them cloudier","ans_ko":"그것들을 더 흐리게 만들 뿐이다","opts":[{"en":"often make them much clearer","ko":"종종 그것들을 훨씬 더 분명하게 만든다"},{"en":"never change them at all","ko":"그것들을 전혀 바꾸지 않는다"},{"en":"finally make them simpler","ko":"마침내 그것들을 더 단순하게 만든다"},{"en":"soon make them mathematical","ko":"곧 그것들을 수학적으로 만든다"}],"orig":false},{"s":10,"ans":"hold off from trying to explain the reason behind the correlations","ans_ko":"상관관계의 배후에 있는 이유를 설명하려는 시도를 보류하다","opts":[{"en":"stay away from simply accepting the data as they are","ko":"데이터를 있는 그대로 받아들이는 것을 멀리하다"},{"en":"point out every phenomenon in light of cause and effect","ko":"모든 현상을 원인과 결과의 관점에서 지적하다"},{"en":"apply a psychological approach to color preferences","ko":"색 선호에 심리학적 접근을 적용하다"},{"en":"admit that correlations are within the framework of causality","ko":"상관관계가 인과 관계의 틀 안에 있음을 인정하다"}],"orig":true}]},{"id":"2311-34","label":"23년 11월 34번","taught":true,"modes":["ko","abc","mun","blank"],"en":["Most mice in the wild are eaten or die before their life span of two years is over.","They die from external causes, such as disease, starvation, or predators, not due to internal causes, such as aging.","That is why nature has made mice to live, on average, for no longer than two years.","Now we have arrived at an important point: The average life span of an animal species, or the rate at which it ages, is determined by the average time that this animal species can survive in the wild.","That explains why a bat can live to be 30 years old.","In contrast to mice, bats can fly, which is why they can escape from danger much faster.","Thanks to their wings, bats can also cover longer distances and are better able to find food.","Every genetic change in the past that made it possible for a bat to live longer was useful, because bats are much better able than mice to flee from danger, find food, and survive."],"ko":[" 야생에 있는 대부분의 쥐들은 2년의 수명이 끝나기 전에 잡아먹히거나 죽는다."," 그들은 노화와 같은 ‘내부적인 원인들’ 때문이 아니라 질병, 굶주림 또는 포식자와 같은 ‘외부적인 원인들’로 죽는다."," 그것이 자연이 쥐를 평균적으로 2년 이상 살지 못하게 만든 이유이다."," 이제 우리는 중요한 지점에 도달했다. 동물 종의 평균 수명, 또는 그것이 노화하는 속도는 이 동물 종이 야생에서 생존할 수 있는 평균 시간에 의해 결정된다."," 그것은 왜 박쥐가 30세까지 살 수 있는지를 설명해 준다."," 쥐와 대조적으로 박쥐는 날 수 있고, 이것은 그들이 위험에서 훨씬 더 빨리 도망칠 수 있는 이유이다."," 그들의 날개 덕분에, 박쥐들은 또한 더 긴 거리를 이동할 수 있고 먹이를 더 잘 찾을 수 있다."," 박쥐가 더 오래 사는 것을 가능하게 해 준 과거의 모든 유전적 변화는 박쥐가 쥐보다 위험으로부터 도망치고, 먹이를 찾고, 생존하는 것을 훨씬 더 잘할 수 있기 때문에 유용했다."],"theme":"동물 종의 수명은 그 종이 야생에서 살아남을 수 있는 평균 시간이 정하며, 날 수 있어 위험을 잘 피하는 박쥐가 쥐보다 오래 사는 것도 그래서이다.","blanks":[{"s":1,"ans":"disease, starvation, or predators","ans_ko":"질병, 굶주림 또는 포식자","opts":[{"en":"aging, weakness, or heart problems","ko":"노화, 쇠약 또는 심장 문제"},{"en":"noise, pollution, or crowded cities","ko":"소음, 공해 또는 붐비는 도시"},{"en":"travel, migration, or cold seasons","ko":"이동, 이주 또는 추운 계절"},{"en":"laziness, loneliness, or poor genes","ko":"게으름, 외로움 또는 나쁜 유전자"}],"orig":false},{"s":2,"ans":"no longer than two years","ans_ko":"2년을 넘지 않게","opts":[{"en":"at least twenty years","ko":"최소 20년"},{"en":"as long as bats do","ko":"박쥐만큼 오래"},{"en":"several years more than most animals","ko":"대부분의 동물보다 몇 해 더"},{"en":"only a few days","ko":"고작 며칠"}],"orig":false},{"s":3,"ans":"the average time that this animal species can survive in the wild","ans_ko":"이 동물 종이 야생에서 생존할 수 있는 평균 시간","opts":[{"en":"the distance that migrating species can travel for their survival","ko":"이동하는 종이 생존을 위해 갈 수 있는 거리"},{"en":"the amount of energy that members of the species expend in a day","ko":"그 종의 구성원이 하루에 쓰는 에너지의 양"},{"en":"the extent to which this species is able to protect its source of food","ko":"이 종이 먹이 공급원을 지킬 수 있는 정도"},{"en":"the maximum size of the habitat in which it and its neighbors coexist","ko":"그것과 이웃 종이 공존하는 서식지의 최대 크기"}],"orig":true},{"s":4,"ans":"why a bat can live to be 30 years old","ans_ko":"왜 박쥐가 30세까지 살 수 있는지","opts":[{"en":"how a bat finds its way in the dark","ko":"박쥐가 어떻게 어둠 속에서 길을 찾는지"},{"en":"why a mou
