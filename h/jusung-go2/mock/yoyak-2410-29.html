var DATA={"meta": {"sch": "jusung-go2", "src": "jusung-go2/mock/sx-data.js", "pidx": 28, "lesson": "24년 10월 29번", "title": "", "label": "", "page": "yoyak-2410-29"}, "scenes": [{"tag": "본문 1번", "ns": [1], "line": "동물이 무엇을 원하는지 [[finding|알아내는]] 한 [[way|방법]]이다.", "en": ["Conditioned Place Preference is a way of finding out what animals want."], "kos": ["조건부 장소 선호도는 동물들이 무엇을 원하는지 알아내는 하나의 방법이다."]}, {"tag": "본문 2~3번", "ns": [2, 3], "line": "한 장소는 경험과 [[associate|연결하도록]] [[train|훈련시키고]], 두 장소는 뚜렷하게 다르게 만든다.", "en": ["Researchers train them to associate one place with an experience such as food or a loud noise and another place with something completely different, usually where nothing happens.", "The two places are made obviously different to make it as easy as possible for the animal to associate each place with what happened to it there."], "kos": ["연구자들은 그것들이 한 장소를 음식이나 시끄러운 소리와 같은 경험과 연관시키고 또 다른 장소를 완전히 다른 어떤 것과 연관시키도록 훈련시키는데, 대개 그곳에서는 아무 일도 일어나지 않는다.", "그 두 장소는 그 동물이 각 장소를 거기에서 그것에게 일어난 일과 연관시키는 것을 가능한 한 쉽게 만들기 위해 명백히 다르게 만들어진다."]}, {"tag": "본문 4~5번", "ns": [4, 5], "line": "경험 전과 후에 장소 선호를 [[measured|측정한다]]. 시간을 보내는 곳이 바뀌면 좋아한 것이다.", "en": ["The animal’s preference for being in one place or another is measured both before and after its experiences in the two places.", "If there is a shift in where the animal chooses to spend its time for the reward, this suggests that it liked the experience and is trying to repeat it."], "kos": ["한 장소나 다른 장소에 있는 것에 대한 그 동물의 선호도는 두 장소에서의 경험 전과 후에 모두 측정된다.", "만약 동물이 보상을 위해 어디에서 자신의 시간을 보내기로 선택하는지에 변화가 있다면, 이것은 그것이 그 경험을 좋아했고 그것을 반복하려고 노력하는 중이라는 것을 시사한다."]}, {"tag": "본문 6번", "ns": [6], "line": "반대로 그곳을 피하면 자극이 [[unpleasant|불쾌했던]] 것이다.", "en": ["Conversely, if it now avoids the place the stimulus appeared and starts to prefer the place it did not experience it, then this suggests that it found the stimulus unpleasant."], "kos": ["반대로, 만약 그것이 이제 자극이 나타났던 장소를 피하고 그것이 그것을 경험하지 않았던 장소를 선호하기 시작한다면, 그러면 이것은 그것이 그 자극을 불쾌하게 느꼈다는 것을 시사한다."]}, {"tag": "본문 7~8번", "ns": [7, 8], "line": "암에 걸린 쥐는 모르핀을 받은 곳에 대한 [[preference|선호]]를 보였고, 이는 쥐가 약을 원했음을 [[suggests|시사한다]].", "en": ["For example, mice with cancer show a preference for the place where they have been given morphine, a drug used to relieve pain, rather than where they have received saline whereas healthy mice developed no such preference.", "This suggests that the mice with cancer wanted the morphine."], "kos": ["예를 들어, 암에 걸린 쥐들은 식염수를 받아 왔던 곳보다 통증을 완화시키는 데 사용되는 약인 모르핀이 주어졌던 장소에 대한 선호를 보이는 반면, 건강한 쥐들은 그러한 선호가 생기지 않았다.", "이것은 암에 걸린 쥐들이 그 모르핀을 원했다는 것을 시사한다."]}], "story": [{"a": "find", "form": "finding", "n": 1, "sq": 1, "sum": "for [[discovering]] what animals want", "hook": "동물이 무엇을 원하는지 알아낸다는 첫 문장의 finding out(알아내다) → 요약문에서는 discovering(발견하다)으로 바꿨어요.", "b": "discover", "k": "찾아내다 → 발견하다", "en": "Conditioned Place Preference is a way of finding out what animals want.", "ko": "조건부 장소 선호도는 동물들이 무엇을 원하는지 알아내는 하나의 방법이다."}, {"a": "way", "form": "way", "n": 1, "sq": 1, "sum": "is a [[method]]", "hook": "알아내는 하나의 방법이라는 문장의 way(방법) → 요약문에서는 method(방식)로 바꿨어요.", "b": "method", "k": "방법 → 방식", "en": "Conditioned Place Preference is a way of finding out what animals want.", "ko": "조건부 장소 선호도는 동물들이 무엇을 원하는지 알아내는 하나의 방법이다."}, {"a": "train", "form": "train", "n": 2, "sq": 1, "sum": "animals are [[taught]] to connect", "hook": "연구자들이 동물을 훈련시킨다는 문장의 train(훈련시키다) → 요약문에서는 teach(가르치다)로 바꿨어요.", "b": "teach", "k": "훈련시키다 → 가르치다", "en": "Researchers train them to associate one place with an experience such as food or a loud noise and another place with something completely different, usually where nothing happens.", "ko": "연구자들은 그것들이 한 장소를 음식이나 시끄러운 소리와 같은 경험과 연관시키고 또 다른 장소를 완전히 다른 어떤 것과 연관시키도록 훈련시키는데, 대개 그곳에서는 아무 일도 일어나지 않는다."}, {"a": "associate", "form": "associate", "n": 2, "sq": 1, "sum": "taught to [[connect]] one place with an experience", "hook": "한 장소를 경험과 연관시킨다는 문장의 associate(연관시키다) → 요약문에서는 connect(연결하다)로 바꿨어요.", "b": "connect", "k": "연관시키다 → 연결하다", "en": "Researchers train them to associate one place with an experience such as food or a loud noise and another place with something completely different, usually where nothing happens.", "ko": "연구자들은 그것들이 한 장소를 음식이나 시끄러운 소리와 같은 경험과 연관시키고 또 다른 장소를 완전히 다른 어떤 것과 연관시키도록 훈련시키는데, 대개 그곳에서는 아무 일도 일어나지 않는다."}, {"a": "measure", "form": "measured", "n": 4, "sq": 2, "sum": "preference is [[recorded]]", "hook": "경험 전과 후에 선호를 측정한다는 문장의 measured(측정하다) → 요약문에서는 recorded(기록하다)로 바꿨어요.", "b": "record", "k": "측정하다 → 기록하다", "en": "The animal’s preference for being in one place or another is measured both before and after its experiences in the two places.", "ko": "한 장소나 다른 장소에 있는 것에 대한 그 동물의 선호도는 두 장소에서의 경험 전과 후에 모두 측정된다."}, {"a": "unpleasant", "form": "unpleasant", "n": 6, "sq": 2, "sum": "the experience there was [[unwelcome]]", "hook": "피하면 자극이 불쾌했다는 문장의 unpleasant(불쾌한) → 요약문에서는 unwelcome(달갑지 않은)으로 바꿨어요.", "b": "unwelcome", "k": "불쾌한 → 달갑지 않은", "en": "Conversely, if it now avoids the place the stimulus appeared and starts to prefer the place it did not experience it, then this suggests that it found the stimulus unpleasant.", "ko": "반대로, 만약 그것이 이제 자극이 나타났던 장소를 피하고 그것이 그것을 경험하지 않았던 장소를 선호하기 시작한다면, 그러면 이것은 그것이 그 자극을 불쾌하게 느꼈다는 것을 시사한다."}, {"a": "preference", "form": "preference", "n": 7, "sq": 3, "sum": "showed a [[liking]]", "hook": "약을 받은 장소를 선호했다는 문장의 preference(선호) → 요약문에서는 liking(좋아함)으로 바꿨어요.", "b": "liking", "k": "선호 → 좋아함", "en": "For example, mice with cancer show a preference for the place where they have been given morphine, a drug used to relieve pain, rather than where they have received saline whereas healthy mice developed no such preference.", "ko": "예를 들어, 암에 걸린 쥐들은 식염수를 받아 왔던 곳보다 통증을 완화시키는 데 사용되는 약인 모르핀이 주어졌던 장소에 대한 선호를 보이는 반면, 건강한 쥐들은 그러한 선호가 생기지 않았다."}, {"a": "suggest", "form": "suggests", "n": 8, "sq": 3, "sum": "which [[indicates]] that they wanted it", "hook": "쥐가 모르핀을 원했다는 것을 시사한다는 문장의 suggests(시사하다) → 요약문에서는 indicates(나타내다)로 바꿨어요.", "b": "indicate", "k": "시사하다 → 나타내다", "en": "This suggests that the mice with cancer wanted the morphine.", "ko": "이것은 암에 걸린 쥐들이 그 모르핀을 원했다는 것을 시사한다."}], "passage": [{"n": 1, "en": "Conditioned Place Preference is a way of finding out what animals want.", "ko": "조건부 장소 선호도는 동물들이 무엇을 원하는지 알아내는 하나의 방법이다."}, {"n": 2, "en": "Researchers train them to associate one place with an experience such as food or a loud noise and another place with something completely different, usually where nothing happens.", "ko": "연구자들은 그것들이 한 장소를 음식이나 시끄러운 소리와 같은 경험과 연관시키고 또 다른 장소를 완전히 다른 어떤 것과 연관시키도록 훈련시키는데, 대개 그곳에서는 아무 일도 일어나지 않는다."}, {"n": 3, "en": "The two places are made obviously different to make it as easy as possible for the animal to associate each place with what happened to it there.", "ko": "그 두 장소는 그 동물이 각 장소를 거기에서 그것에게 일어난 일과 연관시키는 것을 가능한 한 쉽게 만들기 위해 명백히 다르게 만들어진다."}, {"n": 4, "en": "The animal’s preference for being in one place or another is measured both before and after its experiences in the two places.", "ko": "한 장소나 다른 장소에 있는 것에 대한 그 동물의 선호도는 두 장소에서의 경험 전과 후에 모두 측정된다."}, {"n": 5, "en": "If there is a shift in where the animal chooses to spend its time for the reward, this suggests that it liked the experience and is trying to repeat it.", "ko": "만약 동물이 보상을 위해 어디에서 자신의 시간을 보내기로 선택하는지에 변화가 있다면, 이것은 그것이 그 경험을 좋아했고 그것을 반복하려고 노력하는 중이라는 것을 시사한다."}, {"n": 6, "en": "Conversely, if it now avoids the place the stimulus appeared and starts to prefer the place it did not experience it, then this suggests that it found the stimulus unpleasant.", "ko": "반대로, 만약 그것이 이제 자극이 나타났던 장소를 피하고 그것이 그것을 경험하지 않았던 장소를 선호하기 시작한다면, 그러면 이것은 그것이 그 자극을 불쾌하게 느꼈다는 것을 시사한다."}, {"n": 7, "en": "For example, mice with cancer show a preference for the place where they have been given morphine, a drug used to relieve pain, rather than where they have received saline whereas healthy mice developed no such preference.", "ko": "예를 들어, 암에 걸린 쥐들은 식염수를 받아 왔던 곳보다 통증을 완화시키는 데 사용되는 약인 모르핀이 주어졌던 장소에 대한 선호를 보이는 반면, 건강한 쥐들은 그러한 선호가 생기지 않았다."}, {"n": 8, "en": "This suggests that the mice with cancer wanted the morphine.", "ko": "이것은 암에 걸린 쥐들이 그 모르핀을 원했다는 것을 시사한다."}], "questions": [{"id": 1, "summary": "Conditioned Place Preference is a (A) for discovering what animals want, in which animals are taught to (B) one place with an experience and another place with nothing special.", "ko": "조건부 장소 선호도는 동물이 무엇을 원하는지 알아내는 <b>(A) 방법</b>으로, 동물이 한 장소는 어떤 경험과, 다른 장소는 별일 없는 것과 <b>(B) 연결하도록</b> 가르친다.", "opts": [["method", "confuse"], ["prize", "connect"], ["prize", "replace"], ["method", "connect"], ["habit", "confuse"]], "optko": ["방법 – 혼동하다", "상 – 연결하다", "상 – 바꾸다", "방법 – 연결하다", "습관 – 혼동하다"], "ans": 3, "wrong": ["confuse(혼동하다)가 틀려요. 동물이 헷갈리지 않도록 두 장소를 뚜렷하게 다르게 만들어요(obviously different).", "prize(상)가 틀려요. 이것은 상이 아니라 동물이 무엇을 원하는지 알아내는 방법(a way)이에요.", "둘 다 틀려요. 상이 아니라 방법이고, 장소를 경험으로 바꾸는(replace) 게 아니라 장소와 경험을 연결해요.", null, "둘 다 틀려요. 습관(habit)이 아니라 방법이고, 헷갈리게 하는 게 아니라 연결하도록 가르쳐요."], "evid": [{"n": 1, "hl": ["a way of finding out what animals want"]}, {"n": 2, "hl": ["associate one place with an experience"]}], "swaps": [["find", "discover", "찾아내다 → 발견하다"], ["way", "method", "방법 → 방식"], ["train", "teach", "훈련시키다 → 가르치다"], ["associate", "connect", "연관시키다 → 연결하다"]], "swapnote": "way(방법)는 method(방식)로, associate(연관시키다)는 connect(연결하다)로 바뀌었어요. train(훈련시키다)은 teach(가르치다)로 쉬워졌어요.", "use": [{"w": "method", "ex": "This method is easy to learn.", "ko": "이 방식은 배우기 쉽다.", "wk": "방법, 방식", "hk": "방식"}, {"w": "connect", "ex": "A bridge can connect two islands.", "ko": "다리는 두 섬을 연결할 수 있다.", "wk": "연결하다", "hk": "연결할"}], "flow": "본문 1번에서 이 방법은 동물이 무엇을 원하는지 알아내는 하나의 방법이라고 소개하고 → 2번에서 장소 하나는 경험과, 다른 장소는 아무 일 없음과 연결시키도록 훈련한다고 → 3번에서 두 장소를 뚜렷하게 다르게 만든다고 이어요.", "jd": [["Conditioned Place Preference is a [[method]]", "조건부 장소 선호도는 [[방법]]이다"], ["for discovering what animals want,", "동물이 무엇을 원하는지 알아내는,"], ["in which animals are taught to [[connect]]", "그것은 동물이 [[연결하도록]] 가르친다"], ["one place with an experience and another place with nothing special.", "한 장소는 어떤 경험과, 다른 장소는 unpleasant"]}], "swaps": [["measure", "record", "측정하다 → 기록하다"], ["unpleasant", "unwelcome", "불쾌한 → 달갑지 않은"]], "swapnote": "measured(측정되다)는 recorded(기록되다)로, unpleasant(불쾌한)는 unwelcome(달갑지 않은)으로 바뀌었어요. 같은 뜻의 쉬운 말로 읽어요.", "use": [{"w": "record", "ex": "Scientists record the weather every day.", "ko": "과학자들은 매일 날씨를 기록한다.", "wk": "기록하다", "hk": "기록한다"}, {"w": "unwelcome", "ex": "Rain was an unwelcome surprise.", "ko": "비는 달갑지 않은 놀라움이었다.", "wk": "달갑지 않은", "hk": "달갑지 않은"}], "flow": "본문 4번에서 장소 선호는 경험 전과 후에 모두 측정된다고 하고 → 5번에서 보상 장소로 옮겨 가면 좋아한 것이라고 → 6번에서 Conversely(반대로) 피하게 되면 불쾌하게 느낀 것이라고 해요.", "jd": [["An animal's place preference is [[recorded]]", "동물의 장소 선호는 [[기록된다]]"], ["before and after the experiences;", "경험 전후에;"], ["if it keeps returning to a place, it liked it,", "계속 돌아가는 곳은, 좋아한 곳이고,"], ["but if it now avoids a place,", "하지만 이제 피하는 곳이라면,"], ["the experience there was [[unwelcome]].", "그곳의 경험은 [[달갑지 않은]] 것이었다."]], "fc": [["본문 4번", "경험 전과 후에 측정", "재서 비교해요 (→ {{measure|측정하다}})."], ["본문 5번", "돌아가면 좋아한 것", "보상을 위해 장소를 바꾸면 그 경험을 좋아한 거예요."], ["본문 6번", "피하면 불쾌한 것", "Conversely(반대로) 그 자극이 불쾌했다는 뜻이에요 (→ {{unpleasant|불쾌한}})."], ["정답 포인트", "{{measure|측정하다}} = {{record|기록하다}}, {{unpleasant|불쾌한}} = {{unwelcome|달갑지 않은}}", "같은 뜻의 쉬운 말로 읽어요."]], "evid_full": [{"en": "The animal’s preference for being in one place or another is measured both before and after its experiences in the two places.", "ko": "한 장소나 다른 장소에 있는 것에 대한 그 동물의 선호도는 두 장소에서의 경험 전과 후에 모두 측정된다.", "hl": ["measured both before and after"], "hlko": ["경험 전과 후에 모두 측정된다"], "n": 4}, {"en": "If there is a shift in where the animal chooses to spend its time for the reward, this suggests that it liked the experience and is trying to repeat it.", "ko": "만약 동물이 보상을 위해 어디에서 자신의 시간을 보내기로 선택하는지에 변화가 있다면, 이것은 그것이 그 경험을 좋아했고 그것을 반복하려고 노력하는 중이라는 것을 시사한다.", "hl": ["it liked the experience and is trying to repeat it"], "hlko": ["그 경험을 좋아했고 그것을 반복하려고"], "n": 5}, {"en": "Conversely, if it now avoids the place the stimulus appeared and starts to prefer the place it did not experience it, then this suggests that it found the stimulus unpleasant.", "ko": "반대로, 만약 그것이 이제 자극이 나타났던 장소를 피하고 그것이 그것을 경험하지 않았던 장소를 선호하기 시작한다면, 그러면 이것은 그것이 그 자극을 불쾌하게 느꼈다는 것을 시사한다.", "hl": ["found the stimulus unpleasant"], "hlko": ["그 자극을 불쾌하게 느꼈다"], "n": 6}]}, {"id": 3, "summary": "Mice with cancer showed a (A) for the place where they were given a pain-relieving drug, which (B) that they wanted it; healthy mice did not.", "ko": "암에 걸린 쥐들은 통증을 덜어 주는 약을 받은 장소에 대한 <b>(A) 좋아함</b>을 보였고, 이는 쥐들이 그것을 원했음을 <b>(B) 나타낸다</b>. 건강한 쥐들은 그렇지 않았다.", "opts": [["liking", "denies"], ["liking", "indicates"], ["fear", "indicates"], ["fear", "hides"], ["dislike", "proves"]], "optko": ["좋아함 – 부정하다", "좋아함 – 나타내다", "두려움 – 나타내다", "두려움 – 숨기다", "싫어함 – 증명하다"], "ans": 1, "wrong": ["denies(부정하다)가 틀려요. 이 선호는 쥐가 그 약을 원했다는 것을 시사해요(suggests).", null, "fear(두려움)가 틀려요. 쥐들은 그 장소를 두려워한 게 아니라 선호했어요(preference).", "둘 다 틀려요. 쥐들은 두려워하지 않고 선호했으며, 그 선호는 약을 원했다는 사실을 숨기는 게 아니라 보여 줘요.", "둘 다 틀려요. 쥐들은 그 장소를 싫어한(dislike) 게 아니라 선호했어요."], "evid": [{"n": 7, "hl": ["show a preference for the place where they have been given morphine"]}, {"n": 8, "hl": ["suggests that the mice with cancer wanted the morphine"]}], "swaps": [["preference", "liking", "선호 → 좋아함"], ["suggest", "indicate", "시사하다 → 나타내다"]], "swapnote": "preference(선호)는 liking(좋아함)으로, suggests(시사하다)는 indicates(나타내다)로 바뀌었어요. 쥐가 약을 받은 곳을 더 좋아하니, 약을 원했다는 걸 보여 주는 거예요.", "use": [{"w": "liking", "ex": "She has a liking for sweet food.", "ko": "그녀는 단 음식을 좋아한다.", "wk": "좋아함", "hk": "좋아한다"}, {"w": "indicate", "ex": "Dark clouds indicate rain.", "ko": "먹구름은 비를 나타낸다.", "wk": "나타내다, 가리키다", "hk": "나타낸다"}], "flow": "본문 7번에서 For example(예를 들어) 암에 걸린 쥐는 모르핀을 받은 곳을 선호하고 건강한 쥐는 그렇지 않았다고 → 8번에서 이것은 쥐가 모르핀을 원했다는 뜻이라고 정리해요.", "jd": [["Mice with cancer showed a [[liking]]", "암에 걸린 쥐들은 [[좋아함]]을 보였다"], ["for the place where they were given a pain-relieving drug,", "통증을 덜어 주는 약을 받은 장소에 대한,"], ["which [[indicates]] that they wanted it;", "이는 그것을 원 function vHome(){
  var d=doneCount(),f=firstOpen();
  var h='<a class="tag" href="../index.html" style="text-decoration:none">목록</a><h1>'+DATA.meta.lesson+' '+esc(DATA.meta.title)+'</h1><p class="sub">요약문 연습 '+DATA.meta.label+' · '+Qs.length+'문제</p><div class="nums">';
  Qs.forEach(function(q,i){var a=PR.a[q.id];h+='<button class="nb '+(a===undefined?'':(a===q.ans?'o':'x'))+'" data-a="q" data-v="'+i+'">'+(i+1)+'</button>'});
  h+='</div>';
  h+=yyLine();
  h+='<button class="btn pri" data-a="resume">'+(d===0?'시작하기':(f<0?'결과 보기':'이어서 풀기 ('+d+' / '+Qs.length+')'))+'</button>';
  h+='<button class="btn sec" data-a="notes">단어노트 '+nNotes()+'개</button><button class="btn sec" data-a="sw">바꿔 말하기 연습</button>'+(nFlag()?'<button class="btn flagbtn" data-a="chk">선생님 확인 단어 '+nFlag()+'개</button>':'');
  h+='<div class="foot"><button data-a="reset">문제 다시 풀기</button></div>';
  return h;
}
function vQ(){
  var q=Qs[cur],a=PR.a[q.id],done=a!==undefined;curQ=q.id;
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">'+(cur+1)+' / '+Qs.length+'</span></div>';
  if(!done)h+='<p class="hint">밑줄 단어를 누르면 뜻이 나와요. 번호를 누르면 답을 골라요.</p>';
  h+='<div class="card sum">'+sumHtml(q,done)+'</div><div class="opts">';
  q.opts.forEach(function(o,i){
    var cls='opt'+(done?' lock':'');
    if(done){if(i===q.ans)cls+=' right';else if(i===a)cls+=' mine'}
    h+='<div class="'+cls+'"'+(done?'':' data-a="pick" data-v="'+i+'"')+'><span class="num">'+CN[i]+'</span><span class="ot">'+words(o[0])+'<span class="dash">–</span>'+words(o[1])+'</span>'+(done&&i===q.ans?'<span class="st">정답</span>':(done&&i===a?'<span class="st">내 답</span>':''))+'</div>';
  });
  h+='</div>';
  if(done){
    var ok=a===q.ans;
    h+='<div id="exp"><div class="card"><div class="row"><span class="badge">'+(cur+1)+'번</span><span class="chip">정답 '+CN[q.ans]+'</span><span class="msg '+(ok?'o':'x')+'">'+(ok?'맞았어요':'내 답 '+CN[a])+'</span></div>';
    h+='</div><div class="card"><p class="lb">직독직해 (끊어서 앞에서부터 이해해요)</p>'+jdHtml(q)+'<details><summary>자연스러운 해석 보기</summary><div class="ko">'+q.ko.replace(/\((A|B)\)\s*/g,'')+'</div></details></div>';
    h+='<div class="card"><p class="lb">보기 뜻</p><ul class="opl">';
    q.opts.forEach(function(o,i){h+='<li class="'+(i===q.ans?'a':'')+'">'+CN[i]+' '+(i===q.ans?'<mark>'+words(o[0])+' – '+words(o[1])+'</mark>':words(o[0])+' – '+words(o[1]))+'<span class="k">'+(i===q.ans?'<mark>'+esc(q.optko[i])+'</mark>  ← 정답':esc(q.optko[i]))+'</span></li>'});
    h+='</ul></div>';
    h+='<div class="card"><p class="lb">정답의 근거 · 본문 '+q.evid_full.map(function(e){return e.n+'번'}).join(', ')+'</p>';
    q.evid_full.forEach(function(e){h+='<div class="ev"><div class="en">'+rich(e.en,e.hl)+'</div><div class="kk">'+richKo(e.ko,e.hlko)+'</div></div>'});
    h+='</div>';
    h+='<div class="card"><p class="lb">이 단어, 이렇게 바뀌었어요</p>';
    q.swaps.forEach(function(s){h+='<div class="swap"><span class="a">'+words(s[0])+'</span><span class="arr">→</span><span class="b">'+words(s[1])+'</span><span class="ds">'+esc(s[2])+(/\s/.test(s[0])||/\s/.test(s[1])?'':' '+sayBtn(s[0],'듣기')+' '+sayBtn(s[1],'듣기'))+'</span></div>'});
    h+='<div class="note">'+esc(q.swapnote)+'</div></div>';
    h+='<div class="card"><p class="lb">쓰임 익히기</p><div class="use">';
    q.use.forEach(function(u){h+='<div class="u"><div class="uw">'+esc(u.w)+'<small class="uwk">('+esc(u.wk)+')</small></div><div class="ue">'+useEx(u)+'</div><div class="uk">'+esc(u.ko).replace(esc(u.hk),'<mark>'+esc(u.hk)+'</mark>')+'</div></div>'});
    h+='</div></div>';
    h+='<div class="card"><p class="lb">기억할 흐름</p><div class="fc">'+q.fc.map(function(c,i){return (i?'<div class="ar">▼</div>':'')+'<div class="c'+(i===q.fc.length-1?' last':'')+'"><span class="tg">'+esc(c[0])+'</span><div class="hd">'+mk(c[1])+'</div><div class="sb2">'+mk(c[2])+'</div></div>'}).join('')+'</div></div>';
    h+='<div class="card"><details><summary>다른 보기는 왜 아닐까요</summary><ul style="padding:0;margin:6px 0 0">';
    q.wrong.forEach(function(w,i){if(w)h+='<li><b>'+CN[i]+'</b> '+hlp(w)+'</li>'});
    h+='</ul></details></div>';
    h+='<button class="btn pri" data-a="next">'+(cur<Qs.length-1?'다음 문제':'결과 보기')+'</button></div>';
  }
  return h;
}
function vRes(){
  var h='<div class="top"><button class="back" data-a="home">목록</button></div><h1>'+Qs.length+'문제 중 '+okCount()+'문제 맞았어요</h1>';
  h+='<div class="nums">';
  Qs.forEach(function(q,i){var a=PR.a[q.id];h+='<button class="nb '+(a===undefined?'':(a===q.ans?'o':'x'))+'" data-a="q" data-v="'+i+'">'+(i+1)+'</button>'});
  h+='</div><p class="sub">단어노트에 '+nNotes()+'개가 쌓였어요.</p>';
  h+='<button class="btn pri" data-a="notes">단어노트 보기</button><button class="btn sec" data-a="reset">문제 다시 풀기</button><button class="btn sec" data-a="home">목록으로</button>';
  return h;
}
function sortedNotes(){return Object.keys(NOTES).map(function(k){return NOTES[k]}).sort(function(a,b){return b.t-a.t})}
function vNotes(){
  var L=sortedNotes();
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">단어노트 '+L.length+'개</span></div>';
  if(!L.length)return h+'<div class="empty">밑줄 단어를 누르면 여기에 쌓여요.</div>';
  h+='<div class="card"><ul class="wl">';
  L.forEach(function(n){h+='<li><span class="lw">'+esc(n.l)+'</span><span class="lm">'+esc(n.k)+'</span>'+(n.c>1?'<span class="lc">'+n.c+'번</span>':'')+'</li>'});
  return h+'</ul></div>';
}
function sk(id){return id.indexOf('sw:')===0?id.slice(3):id}
function wrongOf(id){var r=SRV[sk(id).toLowerCase()];return r&&r.c>0?r.c:0}
function flagList(){return Object.keys(SRV).map(function(k){return SRV[k]}).filter(function(r){return r.c>0}).sort(function(a,b){return b.c-a.c})}
function nFlag(){return flagList().length}
function srvLoad(){
  try{WN.list().then(function(r){
    if(!r||!r.ok||!r.items)return;SRV={};
    r.items.forEach(function(i){if(String(i.src||'').indexOf(SRC)>=0)SRV[String(i.w).toLowerCase()]={w:i.w,m:i.m,c:i.c||0}});
    if(view==='home'||view==='chk'||view==='sw')render();
  })}catch(e){}
}
function vChk(){
  var L=flagList();
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">선생님 확인 단어 '+L.length+'개</span></div>';
  if(!L.length)return h+'<div class="empty">틀린 단어가 없어요.</div>';
  h+='<p class="hint">선생님이 물어봤을 때 틀린 단어예요. 먼저 뜻을 떠올려 보고 확인해 보세요. 오답노트(H로드맵)에도 같이 있어요.</p><div class="card">';
  L.forEach(function(r){
    var id=r.w.toLowerCase(),o=swOpen['c'+id];
    h+='<div class="swr"><div class="swq"><span class="sa">'+esc(r.w)+'</span><span class="sb">'+(o?'<em>'+esc(r.m)+'</em>':'뜻은?')+'</span><small class="flag">'+r.c+'번 틀림</small><button data-a="rv" data-v="c'+esc(id)+'">'+(o?'가리기':'확인')+'</button></div></div>';
  });
  return h+'</div><a class="btn sec" style="display:block;text-align:center;text-decoration:none" href="https://nolbada.github.io/via/wn/">H로드맵 오답노트 열기</a>';
}
function sceneLine(t,cur){return esc(t).replace(/\[\[(\w+)\|([^\]]+)\]\]/g,function(m,w,k){return '<b class="wc'+(w.toLowerCase()===String(cur).toLowerCase()?' me':'')+'">'+w+'</b>('+k+')'})}
function vSw(){
  var L=swList(),sc={};
  (DATA.scenes||[]).forEach(function(c){(c.line.match(/\[\[\w+\|/g)||[]).forEach(function(m){sc[m.slice(2,-1).toLowerCase()]=c})});
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">바꿔 말하기 '+L.length+'개</span></div>';
  h+='<p class="hint">왼쪽 단어가 요약문에서 어떤 말로 바뀔까요? <b>소리 내어 말해 본 뒤</b> 확인을 눌러요.</p>';
  h+='<div class="tabs"><button data-a="rvall" data-v="open">모두 열기</button><button data-a="rvall" data-v="hide">모두 가리기</button></div><div class="card">';
  L.forEach(function(s){
    var o=swOpen[s.id],c=sc[s.form.toLowerCase()],on=swD['s'+s.id],fl=wrongOf(s.id);
    h+='<div class="swr"><div class="swq"><span class="sa">'+words(s.a)+(fl?'<small class="flag">'+fl+'번 틀림</small>':'')+'</span><span class="sb">'+(o?'<em>'+words(s.b)+'</em>'+esc(s.k):'→ ?')+'</span>'+sayBtn(s.a,'듣기')+(o?sayBtn(s.b,'정답 듣기'):'')+'<button data-a="rv" data-v="'+esc(s.id)+'">'+(o?'가리기':'확인')+'</button></div>';
    if(c)h+='<button class="acc2" data-a="dt" data-v="s'+esc(s.id)+'">'+esc(c.tag)+' 줄거리<span>'+(on?'접기':'펼치기')+'</span></button>'+(on?'<div class="story">'+sceneLine(c.line,s.form)+'</div>':'');
    h+='</div>';
  });
  return h+'</div><p class="sumline">시험에서는 본문 단어가 뜻이 같은 다른 단어로 바뀌어 나와요.</p>';
}
/* 자동 새로고침(기록 연동)이 일어나도 보던 문제로 되돌린다 */
try{var sv=JSON.parse(sessionStorage.getItem('vhyv')||'null');if(sv&&sv.p===location.pathname&&Date.now()-sv.t<600000&&sv.v&&sv.v!=='home'){view=sv.v;cur=sv.c||0;try{history.pushState({v:view},'');histPushed=true}catch(e){}}}catch(e){}
render();srvLoad();window.addEventListener('pageshow',srvLoad);
</script>
