<h1>모의고사 (22년 11월 · 23년 11월 · 24년 10월) · 순서배열 · 한글</h1><p class="lede">주어진 문장 다음에 올 한글 문장 3개를 쌓아요. 영어로 적힌 연결어는 문장을 이어 주는 열쇠예요.</p>
<div id="mockinfo"></div>
<div class="how">맨 위에 주어진 문장 다음에 올 문장을 <b>본문 순서대로</b> 눌러요. 다 쌓고 <b>제출</b>하면 자리마다 ○×가 표시되고 흐름을 한눈에 정리한 순서도가 나와요. 이 문제는 <b>매번 바뀌어요</b>. 풀다가 나가도 풀던 곳에서 이어서 풀 수 있어요.</div>
<div class="bar"><span id="cnt"></span><span class="sp"></span><button id="kt" type="button">한글 해석 보기</button><button id="rs" type="button">새 문제로 다시 풀기</button></div>
<div id="stage"></div>
<div class="foot">비타민 영어클리닉 · 주성고 영어II</div></div>

<script>
/* 문제 생성 로직 (순수 함수, DOM 없음). 브라우저(HTML 안에 삽입)와 node(sim.js) 양쪽에서 쓴다. */
(function (root) {
  'use strict';
  var G = {};
  G.SIZES = { ko: 6, mg: 4, mi: 4, abc: 6, blank: 8 };
  G.ABC_OPTS = ['ACB', 'BAC', 'BCA', 'CAB', 'CBA']; // 시험처럼 (A)(B)(C) 그대로인 순서는 없다
  var NEED = { ko: 'ko', mg: 'mun', mi: 'mun', abc: 'abc', blank: 'blank' };

  function rr(rnd) { return rnd || Math.random; }
  G.rint = function (n, rnd) { return Math.floor(rr(rnd)() * n); };
  G.shuffle = function (a, rnd) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(rr(rnd)() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  };
  G.sample = function (a, k, rnd) { return G.shuffle(a, rnd).slice(0, k); };
  G.byId = function (D) { var m = {}; D.passages.forEach(function (p) { m[p.id] = p; }); return m; };

  /* ---------- 가능한 모양 ---------- */
  G.windows = function (ps) { // 주어진 첫 문장 a + 이어지는 3문장 (link 3개 모두 true)
    var L = ps.link, n = ps.en.length, r = [];
    for (var a = 0; a + 3 < n; a++) if (L[a] && L[a + 1] && L[a + 2]) r.push(a);
    return r;
  };
  G.shapes = function (ps) { // ABC: [c0,c1,c2]
    var L = ps.link, n = ps.en.length, r = [];
    for (var c0 = 0; c0 <= n - 4; c0++) {
      if (!L[c0]) continue;
      for (var c1 = c0 + 1; c1 <= n - 3; c1++) {
        if (!L[c1]) continue;
        for (var c2 = c1 + 1; c2 <= n - 2; c2++) {
          if (!L[c2]) continue;
          var x = c1 - c0, y = c2 - c1, z = n - 1 - c2;
          if (Math.max(x, y, z) - Math.min(x, y, z) <= 1) r.push([c0, c1, c2]);
        }
      }
    }
    return r;
  };
  G.insList = function (ps) {
    var n = ps.en.length, L = ps.link;
    return (ps.ins || []).filter(function (j) {
      return j >= 1 && j <= n - 1 && L[j - 1] && (j >= n - 1 || L[j]);
    });
  };

  /* ---------- 카탈로그: 앱별 (지문, 문제 정체성) 목록 ---------- */
  G.catalog = function (D, app) {
    var need = NEED[app], out = [];
    D.passages.forEach(function (ps, pi) {
      if ((ps.modes || []).indexOf(need) < 0) return;
      var items = [], id = ps.id;
      if (app === 'ko' || app === 'mg') {
        G.windows(ps).forEach(function (a) { items.push({ id: id + '|' + app + '|' + a, a: a }); });
      } else if (app === 'mi') {
        if (ps.en.length >= 5) G.insList(ps).forEach(function (j) { items.push({ id: id + '|mi|' + j, j: j }); });
      } else if (app === 'abc') {
        if (ps.en.length >= 7) G.shapes(ps).forEach(function (c) { items.push({ id: id + '|abc|' + c.join(','), c: c }); });
      } else if (app === 'blank') {
        (ps.blanks || []).forEach(function (b, bi) {
          if (ps.en[b.s] && ps.en[b.s].indexOf(b.ans) >= 0 && b.opts && b.opts.length === 4)
            items.push({ id: id + '|blank|' + bi, bi: bi });
        });
      }
      if (items.length) out.push({ pi: pi, cls: ps.taught === true ? 'T' : 'U', items: items });
    });
    return out;
  };

  function wchoice(ws, rnd) {
    var t = 0, i; for (i = 0; i < ws.length; i++) t += ws[i];
    var r = rr(rnd)() * t;
    for (i = 0; i < ws.length; i++) { r -= ws[i]; if (r < 0) return i; }
    return ws.length - 1;
  }

  /* ---------- 한 판 계획: 약 2/3 수업에서 다룬 지문, 안 쓴 문제 우선 ---------- */
  G.planSet = function (entries, usedMap, n, rnd, prevPi, carry) {
    var used = {}, k;
    for (k in usedMap) used[k] = 1;
    var inSet = {}, setPis = {}, picks = [], reset = false;
    var hasT = entries.some(function (e) { return e.cls === 'T'; });
    var hasU = entries.some(function (e) { return e.cls === 'U'; });
    var plan = [], i;
    if (hasT && hasU) {
      var nT = Math.round(n * 2 / 3);
      for (i = 0; i < n; i++) plan.push(i < nT ? 'T' : 'U');
      plan = G.shuffle(plan, rnd);
    } else for (i = 0; i < n; i++) plan.push(hasT ? 'T' : 'U');
    function avail(cls) {
      var r = [];
      entries.forEach(function (e) {
        if (cls && e.cls !== cls) return;
        var free = e.items.filter(function (it) { return !used[it.id] && !inSet[it.id]; });
        if (free.length) r.push({ e: e, free: free });
      });
      return r;
    }
    var prev = prevPi == null ? -1 : prevPi;
    for (k = 0; k < n; k++) {
      var cl = plan[k], oth = cl === 'T' ? 'U' : 'T';
      var av = avail(cl);
      if (!av.length) av = avail(oth);
      if (!av.length) { // 한 바퀴 끝: 직전에 쓴 문제(최대 carry*n개)는 계속 막고 나머지(가장 오래된 것)부터 다시 쓴다 -> 5판 안 겹침 유지
        var mine = {}; entries.forEach(function (e) { e.items.forEach(function (it) { mine[it.id] = 1; }); });
        var all = Object.keys(used), others = all.filter(function (x) { return !mine[x]; }), keys = all.filter(function (x) { return mine[x]; });
        var c = Math.min(keys.length, carry == null ? 0 : carry * n), need = n - k;
        reset = true;
        for (;;) {
          used = {}; others.forEach(function (x) { used[x] = 1; });
          keys.slice(keys.length - c).forEach(function (x) { used[x] = 1; });
          var tot = 0; avail(null).forEach(function (x) { tot += x.free.length; });
          if (tot >= need || c <= 0) break;
          c--;
        }
        av = avail(cl); if (!av.length) av = avail(oth);
      }
      if (!av.length) { // 가능한 모양이 한 판보다 적다: 어쩔 수 없이 겹침 허용
        av = entries.map(function (e) { return { e: e, free: e.items }; });
      }
      if (av.length > 1) {
        var f = av.filter(function (x) { return x.e.pi !== prev; });
        if (f.length) av = f;
      }
      var ws = av.map(function (x) { return Math.sqrt(x.free.length) * (setPis[x.e.pi] ? 0.35 : 1); });
      var ch = av[wchoice(ws, rnd)];
      var it = ch.free[G.rint(ch.free.length, rnd)];
      inSet[it.id] = 1; setPis[ch.e.pi] = 1; prev = ch.e.pi;
      picks.push({ pi: ch.e.pi, item: it });
    }
    picks.forEach(function (p) { used[p.item.id] = 1; });
    return { picks: picks, used: used, reset: reset };
  };

  /* ---------- 정답 번호 수열: 고르게, 연속 같은 번호 없이 ---------- */
  G.ansSeq = function (n, rnd) {
    var out = [], bag = [], last = -1;
    while (out.length < n) {
      if (!bag.length) bag = G.shuffle([1, 2, 3, 4, 5], rnd);
      var idx = -1;
      for (var i = bag.length - 1; i >= 0; i--) if (bag[i] !== last) { idx = i; break; }
      if (idx < 0) { bag = bag.concat(G.shuffle([1, 2, 3, 4, 5].filter(function (v) { return v !== last; }), rnd)); idx = bag.length - 1; }
      last = bag.splice(idx, 1)[0]; out.push(last);
    }
    return out;
  };

  /* ---------- 문제 만들기 ---------- */
  G.makeSeq = function (kind, ps, item, rnd) {
    var a = item.a, idx = [a + 1, a + 2, a + 3], pool, t = 0;
    do { pool = G.shuffle(idx, rnd); t++; } while (t < 30 && pool.join() === idx.join());
    return { k: kind, pid: ps.id, a: a, pool: pool };
  };
  G.makeAbc = function (ps, item, ans) {

var GM = {};

/* ---- 러너 ----

GM.run = function (cfg) {
  var D = cfg.D, P = G.byId(D), run = null;
  var KR = 'gk-res:' + location.pathname.replace(/[^a-z0-9]/gi, '');

  var stage = document.getElementById('stage'), cnt = document.getElementById('cnt');
  function usedList() { try { var a = JSON.parse(GM.ls.get(UK)); return Array.isArray(a) ? a : []; } catch (e) { return []; } }
  function save() { GM.ls.set(KR, JSON.stringify(run)); }
  function newRun() {

      GM.badge(ps) + '<span class="lb">' + GM.esc(ps.label) + '</span></div>' + cfg.view(p, st, ps, done);

};

var DATA={"set":"mock","title":"모의고사 (22년 11월 · 23년 11월 · 24년 10월)","passages":[{"id":"2211-29","label":"22년 11월 29번","taught":false,"modes":["ko","abc","mun","blank"],"en":["Pre-emption means that a strategy is designed to prevent a rival from starting some particular activity.","In some case a pre-emptive move may simply be an announcement of some intent that might discourage rivals from doing the same.","The idea of pre-emption implies that timing is sometimes very important—a decision or an action at one point in time might be much more rewarding than doing it at a different time point.","Pre-emption may involve up-weighting advertising for a period before and during when a new entrant launches into a market.","The intent is to make it more difficult for the new entrant’s advertising to make an impression on potential buyers.","Product proliferation is another potential pre-emption strategy.","The general idea is to launch a large variety of product variants so that there is very little in the way of market demand that is not accommodated.","Arguably, if a market is already filled with product variants it is more difficult for competitors to find untapped pockets of market demand."],"ko":["선매 행위는 어떤 전략이 경쟁자로 하여금 어떤 특정한 활동을 시작하는 것을 방지하기 위해 만들어진다는 것을 의미한다.","어떤 경우에는 선제적 조치는 단순히 경쟁자들이 같은 행동을 하는 것을 단념시킬 수 있는 어떤 의도의 공표일 수도 있다.","선매 행위 개념은 때로 타이밍이 매우 중요하다는 것을 암시하는데, 즉 어떤 시점의 결정이나 조치는 다른 시점에 그것을 하는 것보다 훨씬 더 득이 될 수 있다.","선매 행위는 새로운 진입자가 시장에 진출하기 이전과 진출해 있는 동안에 광고의 가중치를 높이는 것을 포함할 수 있다.","그 취지는 신규 진입자의 광고가 잠재적 구매자들에게 인상을 남기는 것을 더 어렵게 만드는 것이다.","제품 확산은 또 다른 잠재적인 선매 행위 전략이다.","일반적인 아이디어는 수용되지 않는 시장 수요가 거의 없도록 다양한 제품 변형을 출시하는 것이다.","거의 틀림없이, 만약 시장이 제품 변형으로 이미 채워져 있다면 경쟁자들은 아직 점유되지 않은 시장 수요 주머니를 찾기가 더 어렵다."],"key":[["","선매 행위는 경쟁자의 활동 시작을 막는 전략이라는 정의."],["","선제 조치는 경쟁자를 단념시키는 의도의 공표일 수도 있다."],["","시점에 따라 득이 달라지므로 타이밍이 중요하다."],["","예1: 새 진입자가 들어오기 전후로 광고를 늘린다."],["","그 취지는 신규 진입자의 광고가 인상을 남기기 어렵게 하는 것."],["","또 다른 전략은 제품 확산."],["","다양한 제품을 내놓아 채워지지 않는 수요를 없앤다."],["Arguably(거의 틀림없이)","시장이 제품으로 차 있으면 경쟁자가 빈틈을 찾기 어렵다."]],"link":[true,false,false,true,true,true,true]},{"id":"2211-30","label":"22년 11월 30번","taught":true,"modes":["ko","abc","mun","blank"],"en":["Countershading is the process of optical flattening that provides camouflage to animals.","When sunlight illuminates an object from above, the object will be brightest on top.","The color of the object will gradually shade darker toward the bottom.","This shading gives the object depth and allows the viewer to distinguish its shape.","Thus even if an animal is exactly, but uniformly, the same color as the substrate, it will be easily visible when illuminated.","Most animals, however, are darker above than they are below.","When they are illuminated from above, the darker back is lightened and the lighter belly is shaded.","The animal thus appears to be a single color and easily blends in with the substrate.","This pattern of coloration, or countershading, destroys the visual impression of shape in the organism.","It allows the animal to blend in with its background."],"ko":["카운터셰이딩(명암역위형보호색)은 동물에게 위장을 제공하는 시각적으로 평평하게 하는 과정이다.","햇빛이 물체를 위에서 비출 때, 그 물체는 맨 위에서 가장 밝을 것이다.","물체의 색깔은 맨 아래로 향할수록 점차 더 어두운색으로 음영이 생기게 될 것이다.","이러한 음영은 물체에 농도를 주고 보는 사람이 그것의 모양을 식별하게 해 준다.","따라서 비록 동물이 밑바탕과 정확하지만 균일하게 같은 색일지라도 빛이 비춰질 때 쉽게 눈에 띌 것이다.","그러나 대부분의 동물은 아랫부분보다 윗부분이 더 어둡다.","그들이 위에서 빛을 받을 때, 더 어두운 등은 밝아지고 더 밝은 복부는 음영이 생긴다.","따라서 동물은 하나의 색처럼 보이고 밑바탕과 쉽게 섞인다.","이러한 형태의 배색 즉, 카운터셰이딩은 생물체의 모양의 시각적 인상을 파괴한다.","그것은 동물이 그것의 배경과 섞이게 해 준다."],"key":[["","카운터셰이딩은 동물에게 위장을 주는 과정."],["","위에서 빛을 받으면 물체는 위쪽이 가장 밝다."],["","아래로 갈수록 점점 어두워진다."],["","이 음영이 모양을 알아보게 해 준다."],["Thus(따라서)","같은 색이면 빛을 받을 때 오히려 눈에 띈다."],["","그러나 대부분의 동물은 위쪽이 더 어둡다."],["","위에서 빛이 오면 등은 밝아지고 배는 어두워진다."],["","그래서 한 가지 색처럼 보여 배경에 섞인다."],["","이 배색은 모양의 시각적 인상을 없앤다."],["","그래서 동물이 배경에 섞이게 된다."]],"link":[false,true,true,true,true,true,true,true,true]},{"id":"2211-31","label":"22년 11월 31번","taught":false,"modes":["ko","abc","mun","blank"],"en":["No learning is possible without an error signal.","Organisms only learn when events violate their expectations.","In other words, surprise is one of the fundamental drivers of learning.","Imagine hearing a series of identical notes, AAAAA.","Each note draws out a response in the auditory areas of your brain—but as the notes repeat, those responses progressively decrease.","This is called “adaptation,” a deceptively simple phenomenon that shows that your brain is learning to anticipate the next event.","Suddenly, the note changes: AAAAA#.","Your primary auditory cortex immediately shows a strong surprise reaction: not only does the adaptation fade away, but additional neurons begin to vigorously fire in response to the unexpected sound.","And it is not just repetition that leads to adaptation: what matters is whether the notes are predictable.","For instance, if you hear an alternating set of notes, such as ABABA, your brain gets used to this alternation, and the activity in your auditory areas again decreases.","This time, however, it is an unexpected repetition, such as ABABB, that triggers a surprise response."],"ko":["어떤 학습도 오류 신호 없이는 가능하지 않다.","유기체는 사건이 그들의 기대에 어긋날 때에만 학습한다.","다시 말해 놀람은 학습의 근본적인 동력중 하나이다.","일련의 똑같은 음인 AAAAA를 듣는 것을 상상해 보아라.","각각의 음은 여러분의 뇌의 청각 영역에서 반응을 끌어내지만 음이 반복되면서 그 반응은 점진적으로 감소한다.","이것은 ‘적응’이라 불리며 당신의 뇌가 다음 사건을 예상하는 것을 배울 것임을 보여 주는 현혹될 정도로 단순해 보이는 현상이다.","갑자기 그 음이 AAAAA#으로 바뀐다.","당신의 일차 청각 피질은 즉시 강한 놀람의 반응을 보이는데, 즉 적응이 점차 사라질 뿐만 아니라 예상치 못한 소리에 대한 반응으로 추가적인 뉴런이 힘차게 활성화되기 시작한다.","그리고 적응을 유발하는 것은 단순한 반복이 아니라, 중요한 것은 그 음이 예측 가능한지이다.","예를 들어 만약 당신이 ABABA와 같이 한 세트의 교차하는 음을 듣는다면, 당신의 뇌는 이 교차에 익숙해지고, 당신의 청각 영역 내 활동은 다시 감소한다.","그러나 이번에는 놀람의 반응을 일으키는 것은 바로 ABABB와 같은 예상치 못한 반복이다."],"key":[["","오류 신호가 없으면 학습은 불가능하다."],["","유기체는 기대가 깨질 때만 학습한다."],["In other words(다시 말해)","놀람은 학습의 핵심 동력이다."],["","같은 음이 계속 들리는 상황을 상상해 보자."],["","음이 반복되면 뇌의 반응이 점점 줄어든다."],["","이것이 '적응'이며 뇌가 다음을 예상한다는 증거다."],["","그런데 갑자기 음이 바뀐다."],["","청각 피질이 즉시 강한 놀람 반응을 보인다."],["","적응의 열쇠는 반복이 아니라 예측 가능성이다."],["For instance(예를 들어)","ABABA처럼 교차해도 익숙해져 반응이 줄어든다."],["","ABABB처럼 예상 밖의 반복이 놀람을 일으킨다."]],"link":[false,true,false,true,true,true,true,true,true,true]},{"id":"2211-32","label":"22년 11월 32번","taught":false,"modes":["ko","abc","mun","blank"],"en":["The connectedness of the global economic market makes it vulnerable to potential “infection.”","A financial failure can make its way from borrowers to banks to insurers, spreading like a flu.","However, there are unexpected characteristics when it comes to such infection in the market.","Infection can occur even without any contact.","A bank might become insolvent even without having any of its investments fail.","Fear and uncertainty can be damaging to financial markets, just as cascading failures due to bad investments.","If we all woke up tomorrow and believed that Bank X would be insolvent, then it would become insolvent.","In fact, it would be enough for us to fear that others believed that Bank X was going to fail, or just to fear our collective fear!","We might all even know that Bank X was well-managed with healthy investments, but if we expected others to pull their money out, then we would fear being the last to pull our money out.","Financial distress can be self-fulfilling and is a particularly troublesome aspect of financial markets."],"ko":["전 세계 경제 시장의 연결성은 그것을 잠재적 ‘감염’에 취약하게 만든다.","금융상의 실패는 독감처럼 퍼지면서 채무자에서부터 은행, 보증인까지 나아갈 수 있다.","그러나 시장에서의 그러한 감염에 관한 예상치 못한 특징들이 있다.","감염이 심지어 어떤 접촉 없이도 일어날 수 있다.","은행은 어떠한 투자에 실패하지 않고도 지급 불능이 될 수 있다.","어떤 나쁜 투자들 때문에 일어나는 연속된 실패처럼 금융 시장에 두려움과 불확실성은 손해를 끼칠 수 있다.","만약 우리 모두가 내일 깨어나서 X은행이 지급 불능이 될 것이라고 믿는다면, 그것은 지급 불능이 될 것이다.","사실 우리가 다른 사람들이 X은행이 실패할 것이라고 믿고 있다는 것을 무서워하거나 단지 우리의 집단적인 두려움을 무서워하는 것으로 충분할 것이다.","우리 모두가 심지어 X은행이 건전한 투자로 잘 운영된다는 것을 알지라도 만약 우리가 다른 사람들이 그들의 돈을 인출해 갈 것이라고 예상한다면, 그러면 우리는 자신의 돈을 인출하는 마지막 사람이 되는 것을 무서워 할 것이다.","재정적인 고통은 자기충족적일 수 있고 금융 시장에서의 특별히 골치 아픈 측면이다."],"key":[["","세계 시장은 연결되어 있어 '감염'에 취약하다."],["","금융 실패는 독감처럼 채무자에서 은행으로 퍼질 수 있다."],["However(그러나)","그런데 시장의 감염에는 뜻밖의 특징이 있다."],["","접촉이 없어도 감염될 수 있다."],["","투자에 실패하지 않아도 은행이 지급 불능이 될 수 있다."],["","두려움과 불확실성만으로도 시장이 손해를 입는다."],["","모두가 X은행이 망한다고 믿으면 실제로 망한다."],["In fact(사실)","남들이 그렇게 믿는다고 두려워하는 것만으로 충분하다."],["","은행이 건전하다고 알아도 남들이 인출하면 우리도 두렵다."],["","금융의 곤경은 자기충족적이라 특히 골치 아프다."]],"link":[true,true,true,true,false,false,true,true,false]},{"id":"2211-33","label":"22년 11월 33번","taught":true,"modes":["ko","mun","blank"],"en":["Negative numbers are a lot more abstract than positive numbers—you can’t see negative 4 cookies and you certainly can’t eat them—but you can think about them, and you have to, in all aspects of daily life, from debts to contending with freezing temperatures and parking garages.","Still, many of us haven’t quite made peace with negative numbers.","People have invented all sorts of funny little mental strategies to sidestep the dreaded negative sign.","On mutual fund statements, losses (negative numbers) are printed in red or stuck in parentheses with no negative sign to be found.","The history books tell us that Julius Caesar was born in 100 B.C., not -100.","The underground levels in a parking garage often have designations like B1 and B2.","Temperatures are one of the few exceptions: folks do say, especially here in Ithaca, New York, that it’s -5 degrees outside, though even then, many prefer to say 5 below zero.","There’s something about that negative sign that just looks so unpleasant."],"ko":["여러분이 음수의 4개의 쿠키를 볼 수 없고 틀림없이 그것들을 먹을 수 없다는 점에서 음수는 양수보다 훨씬 더 추상적이지만 여러분은 그것들을 생각할 수 있으며, 채무에서부터 몹시 차가운 기온, 주차장과 씨름하는 것에 이르기까지 일상생활의 모든 측면에서 생각‘해야만 한다’.","여전히 우리들 중 많은 사람들은 음수와 잘 지내지 못해 왔다.","사람들은 그 두려운 음수의 기호를 피하기 위해 모든 종류의 우스꽝스럽고 사소한 정신적 전략들을 만들어 냈다.","뮤추얼 펀드(계약형 투자 신탁) 진술에서 손실(음수)은 빨간색으로 인쇄되거나 음수의 기호가 발견되지 않은 채 괄호 안에 갇혀 있다.","역사책은 우리에게 Julius Caesar가 –100이 아닌 기원전 100년에 태어났다고 말한다.","주차장의 지하층은 종종 B1과 B2와 같은 명칭을 가지고 있다.","기온은 몇 안 되는 예외 중 하나인데 특히 여기 New York의 Ithaca에서 사람들은 바깥의 기온이 –5도라고 말하지만 심지어 그때에도 많은 사람들은 영하 5도라고 말하길 선호한다.","그 음수의 기호에 관해서는 정말 불쾌하게만 보이는 무언가가 있다."],"key":[["","음수는 추상적이지만 일상에서 늘 마주친다."],["Still(그래도)","그래도 많은 사람이 음수와 편치 않다."],["","사람들은 음수 기호를 피하는 별난 요령을 만들었다."],["","예1: 펀드 명세서는 손실을 빨강·괄호로 쓴다."],["","예2: 역사책은 기원전 100년이라고 쓴다."],["","예3: 주차장 지하층은 B1, B2로 쓴다."],["","예4: 기온은 예외지만 그래도 '영하 5도'를 선호한다."],["","음수 기호는 그저 불쾌해 보인다."]],"link":[true,true,true,false,false,false,true]},{"id":"2211-34","label":"22년 11월 34번","taught":true,"modes":["ko","abc","mun","blank"],"en":["Observational studies of humans cannot be properly controlled.","Humans live different lifestyles and in different environments.","Thus, they are insufficiently homogeneous to be suitable experimental subjects.","These confounding factors undermine our ability to draw sound causal conclusions from human epidemiological surveys.","Confounding factors are variables (known or unknown) that make it difficult for epidemiologists to isolate the effects of the specific variable being studied.","For example, Taubes argued that since many people who drink also smoke, researchers have difficulty determining the link between alcohol consumption and cancer.","Similarly, researchers in the famous Framingham study identified a significant correlation between coffee drinking and coronary heart disease.","However, most of this correlation disappeared once researchers corrected for the fact that many coffee drinkers also smoke.","If the confounding factors are known, it is often possible to correct for them.","However, if they are unknown, they will undermine the reliability of the causal conclusions we draw from epidemiological surveys."],"ko":["인간에 대한 관찰 연구는 적절하게 통제될 수 없다.","인간은 다양한 생활 방식으로 그리고 다양한 환경에서 살고 있다.","따라서 그들은 적절한 실험 대상이 되기에 충분히 동질적이지 않다.","이러한 ‘교란 변수’는 인간 역학 조사로부터 타당한 인과적 결론을 도출하는 우리의 능력을 손상시킨다.","교란 변수는 역학자가 연구되고 있는 특정한 변수의 영향을 분리하기 어렵게 만드는 (알려지거나 알려지지 않은) 변수이다.","예를 들어, Taubes는 술을 마시는 많은 사람들이 흡연도 하기 때문에 연구자들이 알코올 섭취와 암 사이의 연관성을 결정짓는 데 어려움을 겪는다고 주장했다.","마찬가지로 유명한 Framingham 연구의 연구자들은 커피를 마시는 것과 관상 동맥성 심장 질환 사이에 상당한 상관관계를 확인했다.","그러나 연구자들이 커피를 마시는 많은 사람들이 흡연도 한다는 사실에 대해 수정을 하자 이러한 상관관계의 대부분은 사라졌다.","교란 변수들이 알려져 있다면 그것들을 수정하는 것이 종종 가능하다.","그러나 그것들이 알려져 있지 않다면, 그것들은 우리가 역학 조사로부터 도출하는 인과적 결론의 신뢰성을 손상시킬 것이다."],"key":[["","인간에 대한 관찰 연구는 제대로 통제될 수 없다."],["","사람마다 생활 방식과 환경이 다르다."],["Thus(따라서)","그래서 동질적이지 않아 실험 대상으로 부적합하다."],["","이 교란 변수가 타당한 인과적 결론을 해친다."],["","교란 변수는 연구 변수의 영향을 분리하기 어렵게 하는 변수."],["For example(예를 들어)","예1: 음주와 흡연이 겹쳐 암과의 연관성을 가리기 어렵다."],["Similarly(마찬가지로)","예2: 커피와 심장병의 상관관계."],["However(그러나)","흡연을 보정하자 상관관계 대부분이 사라졌다."],["","교란 변수를 알면 보정할 수 있다."],["However(그러나)","모르면 인과적 결론의 신뢰성이 손상된다."]],"link":[true,true,true,true,true,true,true,true,true]},{"id":"2211-35","label":"22년 11월 35번","taught":false,"modes":["ko","mun","blank"],"en":["Of all the human emotions, none is trickier or more elusive than envy.","It is very difficult to actually discern the envy that motivates people’s actions.","The reason for this elusiveness is simple: we almost never directly express the envy we are feeling.","Envy entails the admission to ourselves that we are inferior to another person in something we value.","Not only is it painful to admit this inferiority, but it is even worse for others to see that we are feeling this.","And so almost as soon as we experience the initial feelings of envy, we are motivated to disguise it to ourselves—it is not envy we feel but unfairness at the distribution of goods or attention, resentment at this unfairness, even anger."],"ko":["인간의 모든 감정 중에서 질투보다 더 까다롭거나 더 이해하기 어려운 것은 없다.","사람들의 행동을 자극하는 질투를 실제로 알아차리는 것은 매우 어렵다.","이러한 모호함의 이유는 간단한데, 우리는 우리가 느끼고 있는 질투를 대부분 절대 직접적으로 표현하지 않는다.","질투는 우리가 가치 있게 여기는 무언가에서 우리가 또 다른 사람보다 열등하다는 스스로에 대한 인정을 수반한다.","이 열등감을 인정하는 것은 고통스러울 뿐만 아니라 우리가 이것을 느끼고 있다는 것을 다른 사람들이 알게 되는 것은 훨씬 더 나쁘다.","그래서 우리가 최초의 질투심을 경험하는 거의 즉시, 우리는 그것을 우리 자신에게 감추고자 하게 되는데, 즉 그것은 우리가 느끼는 질투가 아니라 재산의 분배나 관심에 대한 불공평함, 이 불공평함에 대한 분개, 심지어 분노이다."],"key":[["","질투는 모든 감정 중 가장 이해하기 어렵다."],["","행동을 이끄는 질투를 알아채기 어렵다."],["","이유는 우리가 질투를 직접 표현하지 않기 때문이다."],["","질투는 내가 남보다 열등함을 인정하는 일이다."],["","그 인정도, 남에게 들키는 것도 고통스럽다."],["And so(그래서)","그래서 질투를 불공평함·분개·분노로 포장해 감춘다."]],"link":[true,true,true,true,true]},{"id":"2211-36","label":"22년 11월 36번","taught":false,"modes":["ko","abc","mun","blank"],"en":["The right to be forgotten is a right distinct from but related to a right to privacy.","The right to privacy is, among other things, the right for information traditionally regarded as protected or personal not to be revealed.","The right to be forgotten, in contrast, can be applied to information that has been in the public domain.","The right to be forgotten broadly includes the right of an individual not to be forever defined by information from a specific point in time.","One motivation for such a right is to allow individuals to move on with their lives and not be defined by a specific event or period in their lives.","For example, it has long been recognized in some countries, such as the UK and France, that even past criminal convictions should eventually be “spent” and not continue to affect a person’s life.","Despite the reason for supporting the right to be forgotten, the right to be forgotten can sometimes come into conflict with other rights.","For example, formal exceptions are sometimes made for security or public health reasons."],"ko":["잊힐 권리는 사생활 권리와 구별되지만 관련이 있는 권리이다.","사생활 권리는 무엇보다도 전통적으로 보호되거나 공개되지 않아야 할 개인적인 것으로 여겨지는 정보에 대한 권리이다.","반면에 잊힐 권리는 공공의 영역에 있었던 정보에 적용될 수 있다.","잊힐 권리는 특정 시점의 정보에 의해 영원히 정의되지 않아야 할 개인의 권리를 광범위하게 포함한다.","그러한 권리의 한 가지 이유는 개인이 자신의 삶을 영위할 수 있게 해 주고 자신의 삶의 특정한 사건이나 기간에 의해 정의되지 않도록 해 주는 것이다.","예를 들어, 영국과 프랑스와 같은 일부 국가에서는 과거의 범죄 유죄 판결조차도 결국 ‘소모되어야’ 하고 한 사람의 삶에 계속 영향을 미치지 않아야 한다고 오랫동안 인식되어 왔다.","잊힐 권리를 지지하는 그러한 이유에도 불구하고 잊힐 권리는 다른 권리와 때때로 충돌할 수 있다.","예를 들어, 공식적인 예외가 안보와 공공 보건의 이유로 인해 때때로 만들어진다."],"key":[["","잊힐 권리는 사생활 권리와 구별되지만 관련된다."],["","사생활 권리는 공개되지 않을 정보에 대한 권리다."],["","반면 잊힐 권리는 이미 공개된 정보에도 적용된다."],["","잊힐 권리는 특정 시점의 정보로 영원히 규정되지 않을 권리다."],["","이 권리의 취지는 한 사건에 묶이지 않고 삶을 이어가게 하는 것."],["For example(예를 들어)","예: 영국·프랑스는 과거 유죄 판결도 결국 소멸시킨다."],["","그러나 지지 이유가 있어도 다른 권리와 충돌할 수 있다."],["For example(예를 들어)","예: 안보·공중보건을 위한 공식 예외."]],"link":[true,true,true,true,true,true,true]},{"id":"2211-37","label":"22년 11월 37번","taught":false,"modes":["ko","mun","blank"],"en":["To an economist who succeeds in figuring out a person’s preference structure—understanding whether the satisfaction gained from consuming one good is greater than that of another—explaining behavior in terms of changes in underlying likes and dislikes is usually highly problematic.","To argue, for instance, that the baby boom and then the baby bust resulted from an increase and then a decrease in the public’s inherent taste for children, rather than a change in relative prices against a background of stable preferences, places a social scientist in an unsound position.","In economics, such an argument about birth rates would be equivalent to saying that a rise and fall in mortality could be attributed to an increase in the inherent desire change for death.","For an economist, changes in income and prices, rather than changes in tastes, affect birth rates.","When income rises, for example, people want more children (or, as you will see later, more satisfaction derived from children), even if their inherent desire for children stays the same."],"ko":["한 사람의 선호도 구조를 알아내는 것, 즉 한 상품을 소비함으로써 얻는 만족도가 또 다른 상품을 소비함으로써 얻는 만족도보다 더 큰지를 이해하는 것에 성공한 경제학자에게는 행동을 기저에 있는 호불호의 변화의 관점에서 설명하는 것은 일반적으로 매우 문제가 많다.","예를 들어, 베이비 붐과 그 후의 출산율의 급락이 변동이 없는 선호도를 배경으로 한 상대적 비용의 변화보다는 아이에 대한 대중의 내재적인 기호의 증가와 그 후의 감소에서 비롯되었다고 주장하는 것은 사회 과학자를 불안정한 입지에 놓는다.","경제학에서 출생률에 대한 그러한 주장은 사망률의 상승과 하락이 죽음에 대한 내재적 욕구 변화의 증가에 기인한다고 말하는 것과 같다.","경제학자에게는 기호의 변화보다는 소득과 물가의 변화가 출산율에 영향을 미친다.","예를 들어, 소득이 증가할 때 사람들은 자녀에 대한 자신의 내재적 욕구가 그대로 유지되더라도 더 많은 자녀(또는 여러분이 나중에 알게 되겠지만, 아이로부터 오는 더 큰 만족감)를 원한다."],"key":[["","선호의 변화로 행동을 설명하는 것은 경제학자에게 문제가 많다."],["","예: 베이비 붐을 기호 변화로 설명하면 불안정한 입지에 선다."],["","그건 사망률 변화를 죽음에 대한 욕구 탓으로 돌리는 격이다."],["","경제학자는 기호가 아니라 소득·가격의 변화로 설명한다."],["","예: 소득이 늘면 욕구가 그대로여도 자녀를 더 원한다."]],"link":[true,true,true,true]},{"id":"2211-38","label":"22년 11월 38번","taught":false,"modes":["ko","abc","mun","blank"],"en":["In the natural world, if an animal consumes a plant with enough antinutrients to make it feel unwell, it won’t eat that plant again.","Intuitively, animals also know to stay away from these plants.","Years of evolution and information being passed down created this innate intelligence.","This “intuition,” though, is not just seen in animals.","Have you ever wondered why most children hate vegetables?","Dr. Steven Gundry justifies this as part of our genetic programming, our inner intelligence.","Since many vegetables are full of antinutrients, your body tries to keep you away from them while you are still fragile and in development.","It does this by making your taste buds perceive these flavors as bad and even disgusting.","As you grow and your body becomes stronger enough to tolerate these antinutrients, suddenly they no longer taste as bad as before."],"ko":["자연계에서 만약 동물이 자신의 상태를 안 좋게 하기에 충분한 항영양소가 있는 식물을 섭취하면 그 동물은 그 식물을 다시는 먹지 않을 것이다.","직관적으로 동물은 또한 이러한 식물을 멀리할 줄 안다.","오랜 시간의 진화와 전해 내려오는 정보는 이 타고난 지능을 만들어 냈다.","그러나 이 ‘직관’은 동물에게서만 보이는 것은 아니다.","여러분은 대부분의 아이들이 왜 야채를 싫어하는지 궁금해 한 적이 있는가?","Dr. Steven Gundry는 이것을 우리의 유전적 프로그래밍, 즉 우리의 내적 지능의 일부로 정당화한다.","많은 야채들이 항영양소로 가득 차 있기 때문에 여러분이 아직 연약하고 성장 중에 있을 때 여러분의 몸은 여러분을 그것들로부터 멀리하게 하려고 노력한다.","그것은 여러분의 미뢰(味蕾)로 하여금 이러한 맛을 나쁘고 심지어 역겨운 것으로 인식하게 만듦으로써 이를 수행한다.","여러분이 성장하고 여러분의 신체가 이러한 항영양소를 견딜 만큼 충분히 더 강해지면 갑자기 그것들은 더 이상 이전만큼 맛이 나쁘게 느껴지지 않는다."],"key":[["","동물은 몸에 안 좋은 식물은 다시 먹지 않는다."],["","동물은 그런 식물을 멀리할 줄도 안다."],["","오랜 진화와 정보 전달이 이 타고난 지능을 만들었다."],["","이 직관은 동물만의 것이 아니다."],["","아이들은 왜 야채를 싫어할까?"],["","건리 박사: 유전적 프로그래밍, 내적 지능의 일부."],["","야채에는 항영양소가 많아 몸이 아이를 멀리하게 한다."],["","몸은 미뢰가 그 맛을 나쁘게 느끼게 해서 이를 해낸다."],["","자라서 몸이 강해지면 그 맛이 덜 나쁘게 느껴진다."]],"link":[true,true,true,true,true,true,true,true]},{"id":"2311-21","label":"23년 11월 21번","taught":false,"modes":["ko","mun","blank"],"en":["The arts and aesthetics offer emotional connection to the full range of human experience.","“The arts can be more than just sugar on the tongue,” Anjan Chatterjee, a professor at the University of Pennsylvania, says.","“In art, when there’s something challenging, which can also be uncomfortable, this discomfort, if we’re willing to engage with it, offers the possibility of some change, some transformation.","That can also be a powerful aesthetic experience.”","The arts, in this way, become vehicles to contend with ideas and concepts that are difficult and uncomfortable otherwise.","When Picasso painted his masterpiece Guernica in 1937, he captured the heartbreaking and cruel nature of war, and offered the world a way to consider the universal suffering caused by the Spanish Civil War.","When Lorraine Hansberry wrote her play A Raisin in the Sun, she gave us a powerful story of people struggling with racism, discrimination, and the pursuit of the American dream while also offering a touching portrait of family life."],"ko":[" 예술과 미학은 다양한 인간 경험에 대한 정서적인 연결을 제공한다."," “예술은 단순히 혀 위의 설탕 이상의 것이 될 수 있다,”라고 Pennsylvania 대학교의 교수인 Anjan Chatterjee는 말한다."," “예술에서, 무언가 도전적인 것이 있고 그것이 또한 불편할 수 있을 때, 이 불편은, 만약 우리가 기꺼이 그것에 참여하려 한다면, 어떤 변화, 어떤 변형의 가능성을 제공한다."," 그것은 또한 강력한 미적 경험이 될 수 있다.”"," 예술은, 이런 방식으로, 그렇지 않았더라면 어렵고 불편한 아이디어 및 개념들과 싸우는 매개체가 된다."," Picasso가 그의 걸작 Guernica를 1937년에 그렸을 때, 그는 가슴 아프고 잔인한 전쟁의 본질을 포착했고, 스페인 내전으로 인한 보편적인 고통을 숙고할 방법을 세상에 제공했다."," Lorraine Hansberry가 그녀의 희곡 A Raisin in the Sun을 썼을 때, 그녀는 또한 가족생활에 대한 감동적인 초상화를 제공하면서 인종주의, 차별, 아메리칸드림의 추구를 위해 고군분투하는 사람들의 강력한 이야기를 우리에게 주었다."],"key":[["","주제문: 예술은 다양한 인간 경험과 정서적으로 이어 줌"],["","전문가의 말: 예술은 단순한 달콤함 이상일 수 있음"],["","도전적이고 불편한 예술이 변화의 가능성을 줌"],["","그 불편함도 강력한 미적 경험이 될 수 있음"],["","결론: 예술은 어렵고 불편한 생각과 맞서는 수단"],["","예시 1: 피카소의 '게르니카'가 전쟁의 고통을 보여 줌"],["","예시 2: 한스베리의 희곡이 차별과 가족의 삶을 보여 줌"]],"link":[true,true,true,true,false,false]},{"id":"2311-23","label":"23년 11월 23번","taught":false,"modes":["ko","abc","mun","blank"],"en":["Sylvan Goldman invented the shopping cart and introduced it in his stores in 1937.","It was an excellent device that would make it easy for shoppers to buy as much as they wanted without getting tired or seeking others’ help.","But Goldman discovered that in spite of his repeated advertisements and explanations, he could not persuade his shoppers to use the wheeled carts.","Men were reluctant because they thought they would appear weak if they pushed such carts instead of carrying their shopping.","Women wouldn’t touch them because the carts reminded them of baby carriages.","It was only a few elderly shoppers who used them.","That made the carts even less attractive to the majority of the shoppers.","Then Goldman hit upon an idea.","He hired several models, men and women, of different ages and asked them to wheel the carts in the store and shop.","A young woman employee standing near the entrance told the regular shoppers, ‘Look, everyone is using the carts. Why don’t you?’","That was the turning point.","A few shills disguised as regular shoppers easily accomplished what logic, explanations, and advertisements failed to do.","Within a few weeks shoppers readily accepted those carts."],"ko":[" Sylvan Goldman은 쇼핑 카트를 발명하고 1937년에 그의 가게들에 그것을 도입했다."," 그것은 쇼핑객들이 지치거나 다른 사람들의 도움을 구하지 않고 그들이 원했던 만큼 구매하는 것을 쉽게 만들어 준 훌륭한 장치였다."," 하지만 Goldman은 그의 반복적인 광고와 설명에도 불구하고, 그의 쇼핑객들에게 바퀴 달린 카트들을 사용하도록 설득할 수 없다는 것을 알게 됐다."," 남성들은 그들의 쇼핑한 물건을 들고 다니는 대신 만약 그들이 그런 카트들을 민다면 그들이 나약해 보일 것으로 생각했기 때문에 꺼렸다."," 여성들은 카트들이 그들에게 유모차를 연상시키기 때문에 그것들에 손대려 하지 않았다."," 그것들을 사용하는 사람들은 오직 몇 명의 노인 쇼핑객들뿐이었다."," 그것은 카트들을 대다수 쇼핑객들에게 훨씬 덜 매력적이도록 만들었다."," 그때 Goldman이 한 아이디어를 떠올렸다."," 그는 다른 연령대의 남자와 여자 모델들을 고용했고, 그들에게 상점에서 카트들을 밀고 쇼핑하도록 요청했다."," 입구 근처에 서 있던 한 젊은 여성 직원이 일반 쇼핑객들에게 ‘보세요, 모든 사람이 카트를 사용하고 있습니다. 해 보는 게 어떠세요?’라고 말했다."," 그것이 전환점이었다."," 일반 쇼핑객들로 위장한 바람잡이들이 논리, 설명, 그리고 광고가 하지 못한 것을 쉽게 달성했다."," 몇 주 만에 쇼핑객들은 그 카트들을 기꺼이 받아들였다."],"key":[["","쇼핑 카트를 발명해 가게에 들여놓음"],["","카트는 쇼핑을 편하게 해 주는 훌륭한 장치"],["But(하지만)","그런데 손님들을 설득할 수 없었음"],["","남성은 약해 보일까 봐 꺼림"],["","여성은 유모차가 떠올라 꺼림"],["","카트를 쓰는 건 몇몇 노인 손님뿐"],["","그래서 대다수에게 더 매력 없어짐"],["Then(그때)","Goldman이 한 가지 아이디어를 떠올림"],["","다양한 모델을 고용해 카트로 쇼핑하게 함"],["","직원이 '모두 쓰고 있어요'라고 말함"],["","그것이 전환점이었음"],["","바람잡이가 논리·광고가 못 한 일을 해냄"],["","몇 주 만에 손님들이 카트를 받아들임"]],"link":[true,true,false,false,false,true,true,true,false,true,true,true]},{"id":"2311-30","label":"23년 11월 30번","taught":false,"modes":["ko","abc","mun","blank"],"en":["Technology changes how individuals and societies understand the concept of privacy.","The fact that someone has a new ability to access information or watch the actions of another does not justify doing so.","Rather, advances in technology require citizens and policy makers to consider how privacy protections should be expanded.","For example, when cameras first became available for commercial and private use, nations and citizens struggled over whether new laws should be enacted to protect individuals from being photographed without their permission.","The reconsideration of privacy brought about by this new technology re-affirmed a distinction between private and public spaces.","It was determined by most cultures that people automatically gave consent to being seen ― and thus recorded ― once they voluntarily stepped into a public space.","Although some people might be uncomfortable with the spread of surveillance cameras, citizens in most cultures have adjusted to the fact that giving up the right not to be observed in these circumstances causes less harm to the community than failing to have surveillance."],"ko":[" 기술은 개인들과 사회가 사생활의 개념을 이해하는 방식을 변화시킨다."," 누군가가 정보에 접근하거나 다른 사람의 행동을 관찰하는 새로운 능력을 갖추고 있다는 사실은 그렇게 하는 것을 정당화하지 않는다."," 오히려, 기술의 발전은 시민들과 정책 입안자들이 어떻게 사생활 보호가 확장되어야 하는지 고려할 것을 요구한다."," 예를 들어, 카메라들이 상업적이고 사적인 용도로 처음 사용될 수 있게 되었을 때, 국가들과 시민들은 그들의 허가 없이 개인들이 사진에 찍히는 것으로부터 보호하기 위해 새로운 법들이 제정되어야 하는지에 대해 투쟁했다."," 이 새로운 기술이 가져온 사생활에 대한 재고는 사적 및 공적 공간의 구별을 재확인했다."," 일단 사람들이 자발적으로 공공장소에 발을 들여놓으면, 보여지고, 따라서 녹화되는 것에 자동적으로 동의하는 것으로 대부분의 문화에서 결정되었다.","일부 사람들은 감시 카메라들의 확산을 불편하게 여길지도 모르지만, 대부분의 문화권에 있는 시민들은 이러한 상황에서 관찰되지 않을 권리를 포기하는 것이 감시받지 못하는 것보다 공동체에 더 적은 해를 끼친다는 사실에 순응해 왔다."],"key":[["","주제문: 기술이 사생활 개념을 바꿈"],["","새 능력이 있다고 해서 그렇게 해도 되는 건 아님"],["Rather(오히려)","기술 발전은 사생활 보호 확대를 고민하게 함"],["For example(예를 들어)","예: 카메라가 나오자 보호 법안을 두고 다툼"],["","새 기술이 사적·공적 공간 구별을 재확인시킴"],["","공공장소에 들어서면 촬영에 동의한 것으로 봄"],["Although(비록 ~지만)","감시 카메라가 불편해도 결국 순응해 옴"]],"link":[false,true,true,true,true,true]},{"id":"2311-32","label":"23년 11월 32번","taught":true,"modes":["ko","abc","mun","blank"],"en":["Information encountered after an event can influence subsequent remembering.","External information can easily integrate into a witness’s memory, especially if the event was poorly encoded or the memory is from a distant event, in which case time and forgetting have degraded the original memory.","With reduced information available in memory with which to confirm the validity of post-event misinformation, it is less likely that this new information will be rejected.","Instead, especially when it fits the witness’s current thinking and can be used to create a story that makes sense to him or her, it may be integrated as part of the original experience.","This process can be explicit (i.e., the witness knows it is happening), but it is often unconscious.","That is, the witness might find himself or herself thinking about the event differently without awareness.","Over time, the witness may not even know the source of information that led to the (new) memory.","Sources of misinformation in forensic contexts can be encountered anywhere, from discussions with other witnesses to social media searches to multiple interviews with investigators or other legal professionals, and even in court."],"ko":[" 사건 후에 마주친 정보는 이후의 기억하는 것에 영향을 미칠 수 있다."," 특히 사건이 불충분하게 부호화되었거나, 그 기억이 시간과 망각이 원래의 기억을 저하시켜 온 먼 사건으로부터 온 것이라면, 외부 정보는 목격자의 기억에 쉽게 통합될 수 있다."," 사건 후의 잘못된 정보의 유효성을 확인하기 위해 기억에서 사용할 수 있는 줄어든 정보를 가지면, 이 새로운 정보가 덜 거부될 듯하다."," 대신에, 특히 그것이 목격자의 현재 생각과 맞고 그 또는 그녀에게 이해되는 하나의 이야기를 만드는 데 사용될 수 있을 때, 그것은 원래 경험의 일부로서 통합될 수 있다."," 이 과정은 명시적일 수 있지만(즉, 목격자는 그것이 일어나고 있다는 것을 알고 있다), 그것은 흔히 무의식적이다."," 즉, 목격자는 의식하지 못한 채 그 사건에 대해 다르게 생각하는 그 자신 또는 그녀 자신을 발견할지도 모른다."," 시간이 지남에 따라, 목격자는 (새로운) 기억으로 이끄는 정보의 출처조차 모를지도 모른다.","법정의 상황에서의 잘못된 정보의 출처는 다른 목격자들과의 토론에서부터 소셜 미디어 조사들, 수사관 또는 기타 법률 전문가들과의 다중 인터뷰들, 심지어 법정에서까지 어디에서나 마주쳐질 수 있다."],"key":[["","사건 후에 접한 정보가 이후 기억에 영향을 줌"],["","외부 정보는 기억에 쉽게 통합됨"],["","확인할 정보가 줄어 새 정보를 덜 거부함"],["Instead(대신에)","내용이 맞으면 원래 경험의 일부가 됨"],["","이 과정은 대개 무의식적임"],["That is(즉)","의식하지 못한 채 다르게 생각하게 됨"],["","시간이 지나면 새 기억의 출처조차 모름"],["","잘못된 정보는 어디서든 접할 수 있음"]],"link":[true,true,true,true,true,true,false]},{"id":"2311-33","label":"23년 11월 33번","taught":true,"modes":["ko","abc","mun","blank"],"en":["Correlations are powerful because the insights they offer are relatively clear.","These insights are often covered up when we bring causality back into the picture.","For instance, a used-car dealer supplied data to statisticians to predict which of the vehicles available for purchase at an auction were likely to have problems.","A correlation analysis showed that orange-colored cars were far less likely to have defects.","Even as we read this, we already think about why it might be so: Are orange-colored car owners likely to be car enthusiasts and take better care of their vehicles?","Or, is it because orange-colored cars are more noticeable on the road and therefore less likely to be in accidents, so they’re in better condition when resold?","Quickly we are caught in a web of competing causal hypotheses.","But our attempts to illuminate things this way only make them cloudier.","Correlations exist; we can show them mathematically.","We can’t easily do the same for causal links.","So we would do well to hold off from trying to explain the reason behind the correlations."],"ko":[" 상관관계는 그것들이 제공하는 통찰력이 비교적 명확하기 때문에 강력하다."," 이러한 통찰력은 종종 우리가 인과 관계를 그 상황으로 다시 가져올 때 가려진다."," 예를 들어, 한 중고차 딜러가 경매에서 구입할 수 있는 차량들 중 어떤 차량에 문제가 발생할 가능성이 있는지를 예측하기 위한 데이터를 통계학자들에게 제공했다."," 한 상관관계 분석은 주황색 차들이 결함이 있을 가능성이 훨씬 적다는 것을 보여 줬다."," 심지어 우리가 이것을 읽으면서도, 우리는 이미 왜 그럴지에 대해 생각한다. 주황색 차를 소유한 사람들이 자동차 애호가여서 그들의 차량을 더 잘 관리할 가능성이 있는가?"," 아니면, 주황색 차들이 도로에서 더 눈에 띄고, 그래서 사고가 날 가능성이 적어 재판매될 때 그것들이 상태가 더 좋은 것이기 때문인가?"," 곧 우리는 경쟁적인 인과 가설의 함정에 빠진다."," 하지만 이런 식으로 무언가를 설명하려는 우리의 시도는 그것들을 더 흐리게 만들 뿐이다."," 상관관계는 존재하며 우리는 그것들을 수학적으로 보여 줄 수 있다."," 우리는 인과 관계에 대해서는 쉽게 똑같이 할 수 없다."," 따라서 우리는 상관관계의 배후에 있는 이유를 설명하려 하지 않는 것이 좋다."],"key":[["","상관관계는 통찰이 비교적 명확해서 강력함"],["","인과관계를 끌어오면 그 통찰이 가려짐"],["For instance(예를 들어)","예: 중고차 딜러가 통계학자에게 데이터를 줌"],["","분석 결과 주황색 차는 결함이 훨씬 적음"],["","우리는 곧바로 그 이유를 따져 보게 됨"],["Or(아니면)","눈에 띄어 사고가 적어서일까 하고 의심함"],["","경쟁하는 인과 가설의 함정에 빠짐"],["But(하지만)","설명하려 할수록 더 흐려질 뿐임"],["","상관관계는 수학적으로 보여 줄 수 있음"],["","인과 관계는 그렇게 쉽게 보여 줄 수 없음"],["So(따라서)","상관관계의 이유를 설명하려 하지 않는 게 좋음"]],"link":[true,true,true,true,true,true,true,false,true,true]},{"id":"2311-34","label":"23년 11월 34번","taught":true,"modes":["ko","abc","mun","blank"],"en":["Most mice in the wild are eaten or die before their life span of two years is over.","They die from external causes, such as disease, starvation, or predators, not due to internal causes, such as aging.","That is why nature has made mice to live, on average, for no longer than two years.","Now we have arrived at an important point: The average life span of an animal species, or the rate at which it ages, is determined by the average time that this animal species can survive in the wild.","That explains why a bat can live to be 30 years old.","In contrast to mice, bats can fly, which is why they can escape from danger much faster.","Thanks to their wings, bats can also cover longer distances and are better able to find food.","Every genetic change in the past that made it possible for a bat to live longer was useful, because bats are much better able than mice to flee from danger, find food, and survive."],"ko":[" 야생에 있는 대부분의 쥐들은 2년의 수명이 끝나기 전에 잡아먹히거나 죽는다."," 그들은 노화와 같은 ‘내부적인 원인들’ 때문이 아니라 질병, 굶주림 또는 포식자와 같은 ‘외부적인 원인들’로 죽는다."," 그것이 자연이 쥐를 평균적으로 2년 이상 살지 못하게 만든 이유이다."," 이제 우리는 중요한 지점에 도달했다. 동물 종의 평균 수명, 또는 그것이 노화하는 속도는 이 동물 종이 야생에서 생존할 수 있는 평균 시간에 의해 결정된다."," 그것은 왜 박쥐가 30세까지 살 수 있는지를 설명해 준다."," 쥐와 대조적으로 박쥐는 날 수 있고, 이것은 그들이 위험에서 훨씬 더 빨리 도망칠 수 있는 이유이다."," 그들의 날개 덕분에, 박쥐들은 또한 더 긴 거리를 이동할 수 있고 먹이를 더 잘 찾을 수 있다."," 박쥐가 더 오래 사는 것을 가능하게 해 준 과거의 모든 유전적 변화는 박쥐가 쥐보다 위험으로부터 도망치고, 먹이를 찾고, 생존하는 것을 훨씬 더 잘할 수 있기 때문에 유용했다."],"key":[["","야생 쥐는 대부분 2년 전에 죽음"],["","원인은 노화가 아니라 질병·포식 같은 외부 요인"],["That is why(그것이 ~한 이유이다)","그래서 자연은 쥐를 2년 정도만 살게 함"],["Now(이제)","수명은 야생에서 생존할 수 있는 평균 시간이 정함"],["","그래서 박쥐는 30년까지 살 수 있음"],["In contrast(대조적으로)","박쥐는 날 수 있어 위험을 더 잘 피함"],["Thanks to(~ 덕분에)","날개 덕에 먹이도 더 잘 찾음"],["","오래 사는 유전적 변화가 박쥐에게 유용했음"]],"link":[true,true,true,true,true,true,true]},{"id":"2311-35","label":"23년 11월 35번","taught":false,"modes":["ko","mun","blank"],"en":["Moral excellence, according to Aristotle, is the result of habit and repetition, though modern science would also suggest that it may have an innate, genetic component.","This means that moral excellence will be broadly set early in our lives, which is why the question of how early to teach it is so important.","Freud suggested that we don’t change our personality much after age five or thereabouts, but as in many other things, Freud was wrong.","Recent psychological research shows that personality traits stabilize around age thirty in both men and women and regardless of ethnicity as the human brain continues to develop, both neuroanatomically and in terms of cognitive skills, until the mid-twenties.","The advantage of this new understanding is that we can be a bit more optimistic than Aristotle and Freud about being able to teach moral excellence."],"ko":[" 비록 현대 과학은 그것이 선천적, 즉, 유전적인 요소를 가지고 있다고 또한 주장하지만, Aristotle에 따르면 도덕적 우수성은 습관과 반복의 결과물이다."," 이것은 도덕적 우수성이 우리 삶에 있어서 이른 시기에 광범위하게 설정될 것임을 의미하며, 이것이 얼마나 일찍 그것을 가르쳐야 할지에 대한 질문이 매우 중요한 이유이다."," Freud는 우리가 5세 혹은 그 무렵 이후에는 우리의 성격을 많이 바꾸지 않는다고 제시했지만, 다른 많은 것들에서처럼 Freud는 틀렸다."," 최근의 심리 연구는 20대 중반까지 신경 해부학적으로 그리고 인지 기능 면에서 인간의 뇌가 계속해서 발달함에 따라 남성과 여성 모두에게 있어서 그리고 민족에 상관없이 성격 특성이 30세 무렵에 안정된다는 것을 보여 준다."," 이 새로운 이해의 이점은 우리가 Aristotle이나 Freud보다 도덕적 우수성을 가르칠 수 있다는 점에서 조금 더 낙관적일 수 있다는 것이다."],"key":[["","도덕적 우수성은 습관의 결과이나 유전 요소도 있음"],["","그래서 얼마나 일찍 가르칠지가 중요함"],["","프로이트는 5세 이후 성격이 안 변한다 했으나 틀림"],["","최근 연구: 성격은 30세 무렵에 안정됨"],["","그러므로 도덕성 교육에 더 낙관적일 수 있음"]],"link":[true,true,true,true]},{"id":"2311-36","label":"23년 11월 36번","taught":false,"modes":["ko","abc","mun","blank"],"en":["The size of a species is not accidental.","It’s a fine-tuned interaction between a species and the world it inhabits.","Over large periods of time, size fluctuations have often signalled significant changes in the environment.","Generally speaking, over the last five hundred million years, the trend has been towards animals getting larger.","It’s particularly notable in marine animals, whose average body size has increased 150-fold in this time.","But we are beginning to see changes in this trend.","Scientists have discovered that many animals are shrinking.","Around the world, species in every category have been found to be getting smaller, and one major cause appears to be the heat.","Animals living in the Italian Alps, for example, have seen temperatures rise by three to four degrees Celsius since the 1980s.","To avoid overheating, chamois goats now spend more of their days resting rather than searching for food, and as a result, in just a few decades, the new generations of chamois are 25 percent smaller."],"ko":[" 종의 크기는 우연한 것이 아니다."," 그것은 한 종과 그것이 서식하는 세계 사이의 미세 조정된 상호 작용이다."," 오랜 시간에 걸쳐, 크기의 변동은 종종 환경에서의 상당한 변화를 나타내 왔다."," (B) 일반적으로 말해서, 지난 5억 년 동안, 그 경향은 동물들이 점점 커지는 쪽으로 되어 왔다."," 그것은 특히 해양 동물들에게서 두드러지는데, 그들의 평균 몸 크기는 이 시기에 150배로 증가해 왔다."," (A) 하지만 우리는 이 경향에서 변화를 관찰하기 시작하고 있다."," 과학자들은 많은 동물이 작아지고 있다는 것을 발견해 왔다."," 전 세계적으로, 모든 범주의 종들이 점점 작아지고 있는 것으로 발견되어 왔고, 한 가지 주요 원인은 열인 것으로 보인다."," (C) 예를 들어, 이탈리아 알프스에 살고 있는 동물들은 1980년대 이후로 기온이 섭씨 3에서 4도까지 상승하는 것을 보아 왔다."," 과열을 피하기 위해서, 샤무아 염소들은 이제 먹이를 찾는 것보다 휴식을 취하는 데 더 많은 그들의 날들을 보내고, 결과적으로, 단지 몇 십 년 만에, 새로운 세대들의 샤무아는 25% 더 작아져 있다."],"key":[["","주제문: 한 종의 크기는 우연이 아님"],["","크기는 환경과의 미세 조정된 상호 작용"],["","크기 변동은 환경의 큰 변화를 알려 줌"],["Generally speaking(일반적으로)","지난 5억 년간 동물은 점점 커졌음"],["","특히 해양 동물은 150배 커졌음"],["But(하지만)","최근에는 이 경향이 바뀌기 시작함"],["","많은 동물이 작아지고 있음"],["","전 세계 종이 작아지고 주원인은 열"],["For example(예를 들어)","예: 알프스 동물은 기온이 3~4도 올랐음"],["","샤무아는 쉬는 시간이 늘어 25% 작아짐"]],"link":[true,true,false,true,true,true,true,true,true]},{"id":"2311-37","label":"23년 11월 37번","taught":true,"modes":["ko","abc","mun","blank"],"en":["For a long time, random sampling was a good shortcut.","It made analysis of large data problems possible in the pre-digital era.","But much as converting a digital image or song into a smaller file results in loss of data, information is lost when sampling.","Having the full (or close to the full) dataset provides a lot more freedom to explore, to look at the data from different angles or to look closer at certain aspects of it.","A fitting example may be the light-field camera, which captures not just a single plane of light, as with conventional cameras, but rays from the entire light field, some 11 million of them.","The photographers can decide later which element of an image to focus on in the digital file.","There is no need to focus at the beginning, since collecting all the information makes it possible to do that afterwards.","Because rays from the entire light field are included, it is closer to all the data.","As a result, the information is more “reuseable” than ordinary pictures, where the photographer has to decide what to focus on before she presses the shutter."],"ko":[" 오랫동안, 무작위 추출법은 좋은 지름길이었다."," 그것은 디지털 시대 이전에 상당한 데이터 문제 분석을 가능하게 했다."," (B) 그러나 디지털 이미지나 노래를 더 작은 파일로 변환하는 것이 데이터 손실을 유발하는 것과 마찬가지로, 추출을 할 때 정보가 손실된다."," 전체(또는 전체에 가까운) 데이터 세트를 가지는 것은 탐색하거나 다른 각도에서 데이터를 살펴보거나 그것의 특정 측면들을 더 자세히 보게 하는 자유를 훨씬 더 많이 제공한다."," (C) 라이트 필드 카메라가 적절한 비유가 될 수 있는데, 그것은 기존 카메라처럼 한 평면의 빛만 포착할 뿐만 아니라 약 1,100만 개에 달하는 전체 라이트 필드로부터의 광선들도 포착한다."," 사진사들은 디지털 파일에서 이미지의 어느 요소에 초점을 맞출지를 나중에 결정할 수 있다."," (A) 모든 정보를 수집하는 것은 그것을 나중에 하는 것을 가능하게 만들기 때문에, 처음에 초점을 맞출 필요는 없다."," 전체 라이트 필드의 빛이 포함되기 때문에, 그것은 모든 데이터에 더 가깝다."," 결과적으로 사진사가 셔터를 누르기 전에 그녀가 무엇에 초점을 맞출지를 결정해야 하는 일반 사진들보다 그 정보는 더 ‘재사용 가능’하다."],"key":[["","무작위 추출은 오랫동안 좋은 지름길이었음"],["","디지털 이전에 대용량 분석을 가능하게 함"],["But(하지만)","그러나 표본 추출은 정보 손실을 낳음"],["","전체 데이터는 탐색의 자유를 훨씬 더 줌"],["","예시: 라이트 필드 카메라는 전체 빛을 포착"],["","사진사는 나중에 초점을 정할 수 있음"],["","처음에 초점을 맞출 필요가 없음"],["Because(~ 때문에)","전체 라이트 필드라 모든 데이터에 가까움"],["As a result(결과적으로)","그래서 정보를 더 재사용할 수 있음"]],"link":[true,true,true,true,true,true,true,true]},{"id":"2311-38","label":"23년 11월 38번","taught":true,"modes":["ko","abc","mun","blank"],"en":["Introverted leaders do have to overcome the strong cultural presumption that extroverts are more effective leaders.","Although the population splits into almost equal parts between introverts and extroverts, more than 96 percent of managers and executives are extroverted.","In a study done in 2006, 65 percent of senior corporate executives viewed introversion as a barrier to leadership.","We must reexamine this stereotype, however, as it doesn’t always hold true.","Regent University found that a desire to be of service to others and to empower them to grow, which is more common among introverts than extroverts, is a key factor in becoming a leader and retaining leadership.","So-called servant leadership, dating back to ancient philosophical literature, adheres to the belief that a company’s goals are best achieved by helping workers or customers achieve their goals.","Such leaders do not seek attention but rather want to shine a light on others’ wins and achievements; servant leadership requires humility, but that humility ultimately pays off."],"ko":[" 내향적인 리더들은 외향적인 사람들이 더 유능한 리더라는 강력한 문화적 억측을 극복해야 한다."," 비록 인구는 내향적인 사람과 외향적인 사람 사이에서 거의 동등한 비율로 나뉘지만, 관리자와 임원의 96% 이상이 외향적이다."," 2006년에 실시된 한 연구에서, 기업 고위 임원의 65%가 내향성을 리더십의 장애물로 간주했다."," 하지만 그것이 항상 맞는 것은 아니기 때문에 우리는 이 고정 관념을 재검토해야 한다."," Regent 대학교는 다른 사람들에게 도움이 되고 그들이 성장할 수 있도록 힘을 주고자 하는 열망이 리더가 되고 리더십을 유지하는 데 핵심적인 요소이고, 그것이 외향적인 사람들보다 내향적인 사람들 사이에서 더 일반적이라는 것을 발견했다."," 고대 철학 문헌으로 거슬러 올라가는 소위 서번트 리더십은 한 회사의 목표가 근로자나 고객이 그들의 목표를 달성하도록 도움으로써 가장 잘 달성된다는 믿음을 고수한다."," 그런 리더들은 관심을 추구하는 것이 아니라 오히려 다른 사람들의 승리와 업적에 빛을 비추고 싶어 하고, 서번트 리더십은 겸손을 필요로 하지만, 그 겸손은 궁극적으로 결실을 맺는다."],"key":[["","내향적 리더는 '외향이 더 유능하다'는 통념을 넘어야 함"],["Although(비록 ~지만)","인구는 반반인데 관리자의 96%가 외향적"],["","임원의 65%가 내향성을 리더십 장애물로 봄"],["","그러나 이 고정관념은 다시 살펴봐야 함"],["","남을 돕고 키우려는 열망이 리더의 핵심 요소"],["","서번트 리더십: 남을 도와 목표를 이룸"],["","그런 리더는 겸손하고 결국 결실을 맺음"]],"link":[false,false,true,true,true,true]},{"id":"2311-39","label":"23년 11월 39번","taught":false,"modes":["ko","abc","mun","blank"],"en":["By the nineteenth century, France had developed a system of precisely defined units of measurement to capture space, time, and more, and had begun to get other nations to adopt the same standards.","Just half a century later, in the 1920s, the discoveries of quantum mechanics forever destroyed the dream of comprehensive and perfect measurement.","And yet, outside a relatively small circle of physicists, the mindset of humankind’s drive to flawlessly measure continued among engineers and scientists.","In the world of business it even expanded, as the precision-oriented sciences of mathematics and statistics began to influence all areas of commerce.","However, contrary to the trend of the past several decades, in many new situations that are occurring today, allowing for imprecision ― for messiness ― may be a positive feature, not a shortcoming.","As a tradeoff for relaxing the standards of allowable errors, one can get a hold of much more data.","It isn’t just that “more is better than some,” but that, in fact, sometimes “more is greater than better.”"],"ko":[" 19세기까지, 프랑스는 공간, 시간, 그리고 더 많은 것을 포착하기 위해 정밀하게 규정된 측정 단위의 체계를 개발했고, 다른 국가들이 동일한 기준을 채택하도록 만들기 시작했었다."," 불과 반세기 후, 1920년대에, 양자 역학의 발견은 포괄적이고 완벽한 측정에 대한 꿈을 영원히 깨 버렸다."," 그러나 비교적 소수 집단의 물리학자를 제외하고는 공학자와 과학자 사이에서 완벽하게 측정하려고 하는 인류의 추진 정신은 계속되었다."," 정확성을 지향하는 수학과 통계학이라는 과학이 상업의 모든 영역에 영향을 미치기 시작하면서 비즈니스의 세계에서 그것은 심지어 확장되었다."," 그러나, 지난 수십 년간의 경향과 반대로, 오늘날 발생하는 많은 새로운 상황에서 부정확성, 즉, 번잡함을 허용하는 것은 단점이 아니라 긍정적인 특성이 될 수 있다."," 허용할 오류의 기준을 완화하기 위한 거래로서 사람은 훨씬 더 많은 데이터를 얻을 수 있다."," 그것은 단순히 ‘더 많은 것이 조금보다 더 나을’ 뿐만 아니라, 사실은 때때로 ‘더 많은 것이 더 좋은 것보다 더 훌륭하기’도 하다."],"key":[["","19세기에 프랑스가 정밀한 측정 단위 체계를 만듦"],["","1920년대 양자 역학이 완벽한 측정의 꿈을 깸"],["And yet(그럼에도)","그래도 공학자·과학자는 완벽한 측정을 추구함"],["","비즈니스에서는 이 추구가 오히려 더 확산됨"],["However(그러나)","오늘날엔 부정확함이 오히려 장점일 수 있음"],["","오류 허용 기준을 낮추면 훨씬 많은 데이터를 얻음"],["","때로는 '많은 것이 더 좋은 것보다 낫다'"]],"link":[true,true,true,true,true,true]},{"id":"2311-40","label":"23년 11월 40번","taught":false,"modes":["ko","abc","mun","blank"],"en":["Multiple laboratory studies show that cooperative people tend to receive social advantages from others.","One way to demonstrate this is to give people the opportunity to act positively or negatively toward contributors.","For example, Pat Barclay, a professor at the University of Guelph, had participants play a cooperative game where people could contribute money toward a group fund which helped all group members, and then allowed participants to give money to other participants based on their reputations.","People who contributed more to the group fund were given responsibility for more money than people who contributed less.","Similar results have been found by other researchers.","People who contribute toward their groups are also chosen more often as interaction partners, preferred as leaders, rated as more desirable partners for long-term relationships, and are perceived to be trustworthy and have high social status.","Uncooperative people tend to receive verbal criticism or even more severe punishment."],"ko":[" 여러 실험실 연구들은 협력적인 사람들이 다른 사람들로부터 사회적인 혜택들을 받는 경향이 있다는 것을 보여 준다."," 이것을 증명하는 한 가지 방법은 사람들에게 기여자들을 향해 긍정적이거나 부정적으로 행동할 기회를 주는 것이다."," 예를 들어, Guelph 대학교의 교수인, Pat Barclay는 참가자들로 하여금 모든 집단 구성원들을 도와주는 집단 기금에 사람들이 돈을 기부할 수 있는 협동 게임을 하도록 한 다음, 참가자들이 그들의 평판을 바탕으로 다른 참가자들에게 돈을 줄 수 있도록 허락했다."," 집단 기금에 더 많이 기부한 사람들은 덜 기부한 사람들보다 더 많은 돈에 대한 책임이 주어졌다."," 유사한 결과들이 다른 연구자들에 의해 발견되었다."," 또한 그들의 집단에 기여하는 사람들은 상호 작용 파트너로서 더 자주 선택되고, 리더로서 선호되며, 장기적인 관계를 위한 더 바람직한 파트너들로서 평가되고, 신뢰할 수 있고 사회적 지위가 높은 것으로 인식된다.","비협조적인 사람들은 언어적인 비판이나 심지어 더 심한 벌을 받는 경향이 있다."],"key":[["","협력적인 사람은 사회적 혜택을 받는 경향이 있음"],["","증명 방법: 기여자에게 호의·반감을 보일 기회를 줌"],["For example(예를 들어)","예: Barclay의 기금 게임 실험"],["","더 기부한 사람이 더 많은 돈을 맡게 됨"],["","다른 연구에서도 비슷한 결과가 나옴"],["","기여자는 파트너·리더로 더 선호되고 신뢰받음"],["","비협조적인 사람은 비난이나 벌을 받음"]],"link":[true,true,true,true,true,true]},{"id":"2311-41","label":"23년 11월 41번","taught":false,"modes":["ko","abc","mun","blank"],"en":["In Western society, many music performance settings make a clear distinction between performers and audience members: the performers are the “doers” and those in the audience take a decidedly passive role.","The performance space itself may further reinforce the distinction with a physical separation between the stage and audience seating.","Perhaps because this distinction is so common, audiences seem to greatly value opportunities to have special “access” to performers that affords understanding about performers’ style of music.","Some performing musicians have won great approval by regularly incorporating “audience participation” into their concerts.","Whether by leading a sing-along activity or teaching a rhythm to be clapped at certain points, including audience members in the music making can boost the level of engagement and enjoyment for all involved.","Performers who are uncomfortable leading audience participation can still connect with the audience simply by giving a special glimpse of the performer’s perspective.","It is quite common in classical music to provide audiences with program notes.","Typically, this text in a program gives background information about pieces of music being performed and perhaps biographical information about historically significant composers.","What may be of more interest to audience members is background information about the very performers who are onstage, including an explanation of why they have chosen the music they are presenting.","Such insight can make audience members feel closer to the musicians onstage, both metaphorically and emotionally.","This connection will likely enhance the expressive and communicative experience."],"ko":[" 서양 사회에서, 많은 음악 공연 상황은 공연자와 청중 사이에 명확한 구분을 만든다. 공연자들은 ‘행위자들’이고, 청중 속 사람들은 분명히 수동적인 역할을 맡는다."," 공연 공간 그 자체가 무대와 청중석 사이의 물리적 분리로 구분을 더 강화할 수 있다."," 아마도 이러한 구분이 너무 흔하기 때문에, 청중들은 공연자의 음악 스타일에 대한 이해를 제공하는 공연자에 대한 특별한 ‘접근’을 할 기회들에 크게 가치를 부여하는 것처럼 보인다."," 일부 공연 음악가는 정기적으로 그들의 콘서트에 ‘청중 참여’를 포함함으로써 큰 호응을 받아 왔다."," 함께 노래 부르기 활동을 하든지 지정된 지점에서 박수를 치도록 리듬을 가르치든지, 음악을 만드는 데 있어서 청중 구성원을 포함하는 것은 모든 참여자의 참여와 즐거움의 수준을 높일 수 있다."," 청중 참여를 이끄는 것에 불편함을 느끼는 공연자들은 단순히 그 공연자의 관점을 특별히 흘끗 보여줌으로써 청중과 여전히 이어질 수 있다."," 클래식 음악에서는 청중에게 프로그램 해설을 제공하는 것이 상당히 흔하다."," 전형적으로, 이러한 프로그램의 텍스트는 연주되는 음악 작품에 대한 배경 정보와 아마도 역사적으로 중요한 작곡가들에 대한 전기(傳記) 정보를 제공한다."," 청중들에게 더 흥미로울 수도 있는 것은 공연자들이 그들이 선보이고 있는 음악을 왜 선택했는지에 대한 설명을 포함한, 무대 위에 있는 바로 그 연주가에 관한 배경 정보이다."," 그러한 통찰력은 청중들이 무대 위에 있는 음악가들에게 비유적이고 감정적으로 가깝게 느끼게 만들 수 있다."," 이러한 연결은 표현적이고 소통적인 경험을 아마 향상시킬 것이다."],"key":[["","서양 공연은 공연자와 청중의 구분이 뚜렷함"],["","공연 공간이 그 구분을 물리적으로 강화함"],["Perhaps(아마도)","청중은 공연자에게 가까이 갈 기회를 소중히 여김"],["","청중 참여로 호응을 얻는 음악가들이 있음"],["","참여는 모두의 참여감과 즐거움을 높임"],["","참여가 불편하면 자기 관점을 보여 줘도 됨"],["","클래식 공연에는 프로그램 해설이 흔함"],["Typically(전형적으로)","해설은 곡과 작곡가의 배경 정보를 줌"],["","청중은 연주자에 관한 정보에 더 흥미를 가짐"],["","그런 통찰이 청중을 음악가에게 더 가깝게 함"],["","이 연결이 표현·소통 경험을 높임"]],"link":[true,true,false,true,true,false,true,true,true,true]},{"id":"2410-22","label":"24년 10월 22번","taught":false,"modes":["ko","mun","blank"],"en":["To determine the mass of my bowling ball, I might put it onto a balance and compare it with a known mass, such as a number of metal cubes each weighing 1, 10, or 100 grams.","Things get much more complicated if I want to know the mass of a distant star.","How do I measure it?","We can roughly say that measuring the mass of a star involves various theories.","If we want to measure the mass of a binary star, we first determine a center of mass between the two stars, then their distance from that center which we can then use, together with a value for the period and a certain instance of Kepler’s Third Law, to calculate the mass.","In other words, in order to “measure” the star mass, we measure other quantities and use those values, together with certain equations, to calculate the mass.","Measurement is not a simple and unmediated estimation of independently existing properties, but a determination of certain magnitudes before the background of a number of accepted theories."],"ko":["볼링공의 질량을 알아내려면, 나는 그것을 저울에 올려놓고, 각각 1g, 10g, 또는 100g인 여러 개의 금속 큐브 같은 이미 알고 있는 질량과 비교할 수 있다.","만약 내가 먼 별의 질량을 알고 싶다면 상황은 훨씬 더 복잡해진다.","나는 그것을 어떻게 측정할까?","우리는 별의 질량을 측정하는 일에 다양한 이론이 포함된다고 대략적으로 말할 수 있다.","우리가 쌍성의 질량을 측정하고 싶다면, 먼저 두 별 사이의 질량 중심을 구하고, 그다음에 그 중심으로부터의 그것들의 거리를 구하는데, 이 거리는 공전 주기의 값, 케플러 제3법칙의 특정한 사례와 함께 질량을 계산하는 데 쓸 수 있다.","다시 말해서, 별의 질량을 ‘측정’하기 위해서 우리는 다른 수치들을 측정하고 그 값들을 특정 방정식들과 함께 사용하여 질량을 계산한다.","측정은 독립적으로 존재하는 값들을 단순하고 중재되지 않은 채 추정하는 것이 아니라, 이미 정립된 여러 이론들을 배경으로 특정 크기들을 결정하는 것이다."],"key":[["","볼링공 질량은 저울과 알려진 질량으로 잰다"],["","먼 별의 질량은 훨씬 복잡하다"],["","그럼 별의 질량은 어떻게 재는가"],["","별의 질량 측정에는 여러 이론이 들어간다"],["","쌍성은 질량 중심과 거리, 공전 주기로 계산한다"],["In other words(다시 말해서)","다른 수치를 재서 방정식으로 질량을 계산한다"],["","측정은 정립된 이론 위에서 값을 구하는 것이다"]],"link":[true,true,true,false,true,false]},{"id":"2410-23","label":"24년 10월 23번","taught":false,"modes":["ko","abc","mun","blank"],"en":["Based on discoveries in neuroscience, pain and pleasure are formed and processed in the same area of the brain.","Our bodies constantly strive for homeostasis, which is defined as the balance of bodily functions.","Without the body’s effective compensatory mechanisms, which may cushion potential highs and lows, we would not be capable of surviving.","Pleasure and pain are like two sides of the same coin; they seem to work together and are heavily reliant on one another and keep balance.","If you imagine pleasure and pain as the two opposite points on a scale, you can easily understand that as one of the two points rises, the other must correspondingly fall.","We’ve all heard the expression, “No pain, no gain.”","Well, according to psychiatrist Dr. Anna Lembke, there may be some truth to these words.","She says that our attempts to escape being miserable are in fact making us even more miserable.","This is because pain is actually an essential component of our ability to maintain a neutral state, and allowing it will in turn reset our internal scale back to balance."],"ko":["뇌과학의 발견들에 따르면, 고통과 쾌락은 뇌의 같은 영역에서 형성되고 처리된다.","우리 몸은 끊임없이 항상성을 추구하는데, 항상성은 몸의 기능들의 균형이라고 정의된다.","잠재적인 최고점과 최저점을 완화시킬 수 있는 몸의 효과적인 보상 기제가 없다면 우리는 생존할 수 없을 것이다.","쾌락과 고통은 같은 동전의 양면과 같아서, 함께 작동하는 것처럼 보이고 서로에게 크게 의존하며 균형을 유지한다.","만약 쾌락과 고통을 저울 위의 두 반대 지점으로 상상한다면, 두 지점 중 하나가 올라가면 다른 하나는 그에 맞춰 내려갈 수밖에 없다는 것을 쉽게 이해할 수 있다.","우리는 모두 ‘고통 없이는 얻는 것도 없다.’라는 표현을 들어 본 적이 있다.","자, 정신과 의사인 Anna Lembke 박사에 따르면, 이 말에는 어느 정도 진실이 있을 수 있다.","그녀는 비참함에서 벗어나려는 우리의 시도가 사실은 우리를 훨씬 더 비참하게 만들고 있다고 말한다.","이는 고통이 실제로 중립적인 상태를 유지하는 우리 능력의 필수적인 구성 요소이기 때문이며, 고통을 받아들이면 결과적으로 우리의 내부 저울이 다시 균형 상태로 맞춰질 것이다."],"key":[["","고통과 쾌락은 뇌의 같은 영역에서 처리된다"],["","몸은 끊임없이 항상성(균형)을 추구한다"],["","보상 기제가 없으면 우리는 생존할 수 없다"],["","쾌락과 고통은 동전의 양면, 서로 균형을 맞춘다"],["","저울의 두 지점처럼 하나가 오르면 하나는 내려간다"],["","‘No pain, no gain’이라는 표현 소개"],["Well(자)","Lembke에 따르면 이 말에 일리가 있다"],["","고통을 피하려 할수록 오히려 더 비참해진다"],["This is because(이는 ~ 때문이다)","고통은 균형 유지에 필수이고, 받아들이면 균형이 회복된다"]],"link":[false,true,false,true,false,true,true,true]},{"id":"2410-24","label":"24년 10월 24번","taught":false,"modes":["ko","abc","mun","blank"],"en":["Manufacturers masterfully sow seeds of doubt about the adequacy of our current devices.","Suddenly, the phone that was your lifeline a year ago is now a museum piece, unable to keep pace with your digital demands.","And thus, the itch to upgrade begins, often before there’s a genuine need.","This cycle isn’t just confined to our digital companions.","It spills over into almost every aspect of consumer electronics, from the self-driving car to the smart fridge.","Every product seems to be on an unstoppable march towards the next version, the next generation that promises to revolutionize your life.","What’s fascinating, or perhaps disturbing, is the utter efficacy of this cycle in shaping our desires.","It’s not so much that we want the newest device; we’re led to believe we need it.","The distinction between want and need blurs, shifting our financial priorities in favor of staying current with trends.","For all the logical arguments against this ceaseless upgrading, the temptation remains compelling."],"ko":["생산자들은 우리의 현재 기기들이 충분한지에 대한 의심의 씨앗을 능숙하게 뿌린다.","갑자기, 1년 전에는 당신의 생명줄이었던 휴대폰이 이제는 당신의 디지털 요구를 따라가지 못하는 박물관 전시품이 된다.","그리하여 종종 진짜 필요가 생기기도 전에 업그레이드하고 싶은 욕구가 시작된다.","이러한 순환은 우리의 디지털 기기에만 국한되지 않는다.","이것은 자율 주행 자동차부터 스마트 냉장고에 이르기까지 소비자 전자 제품의 거의 모든 영역으로 번져 나간다.","모든 제품은 다음 버전, 즉 당신의 삶에 혁신을 일으키겠다고 약속하는 다음 세대를 향해 멈출 수 없이 행진하는 것처럼 보인다.","흥미롭거나 어쩌면 불편한 점은, 우리의 욕구를 형성하는 이 순환의 압도적인 효과이다.","우리가 가장 최신 기기를 원한다기보다는, 그것이 필요하다고 믿도록 유도된다.","원하는 것과 필요한 것의 구분이 흐려지면서, 우리의 재정적 우선순위가 최신 유행을 따라가는 쪽으로 바뀐다.","이런 끊임없는 업그레이드에 반대하는 모든 논리적인 주장에도 불구하고, 그 유혹은 여전히 강력하다."],"key":[["","제조사가 현재 기기에 대한 의심을 심는다"],["Suddenly(갑자기)","1년 전 휴대폰이 순식간에 구식으로 느껴진다"],["And thus(그리하여)","필요가 없어도 업그레이드 욕구가 생긴다"],["","이 순환은 디지털 기기에만 그치지 않는다"],["","거의 모든 소비자 전자 제품으로 번진다"],["","모든 제품이 다음 세대로 끝없이 나아간다"],["","이 순환이 욕구를 만드는 효과가 놀랍다"],["","원해서가 아니라 필요하다고 믿게 된다"],["","원함과 필요의 구분이 흐려지고 소비가 바뀐다"],["","논리적인 반대에도 업그레이드 유혹은 여전하다"]],"link":[true,true,true,true,false,false,true,true,true]},{"id":"2410-26","label":"24년 10월 26번","taught":false,"modes":["ko","mun","blank"],"en":["Helen Suzman was an activist against apartheid, a racist political and social system in the Republic of South Africa.","Suzman was born to Jewish immigrant parents in Germiston in the Union of South Africa in 1917.","While working as a lecturer on economic history at Witwatersrand University, she joined the South African Institute of Race Relations.","In 1953, she joined the United Party and was elected to Parliament, but when the United Party adopted a more moderate stance on apartheid, Suzman and other progressive members left it and formed the Progressive Party in 1959.","Suzman tirelessly fought against apartheid, exposing the government’s abuses and challenging its laws for a total of 36 years in Parliament.","Even after her retirement in 1989, she continued to advocate for a multi-racial democracy in the Republic of South Africa and influenced the drafting of the country’s new constitution after the end of apartheid.","She remained an active voice for human rights and democracy until her death in 2009."],"ko":["Helen Suzman은 남아프리카 공화국의 인종 차별적인 정치·사회 체제인 아파르트헤이트에 맞선 운동가였다.","Suzman은 1917년에 남아프리카 연방의 Germiston에서 유대인 이민자 부모 밑에서 태어났다.","Witwatersrand 대학에서 경제사 강사로 일하던 중에 그녀는 남아프리카 인종 관계 연구소에 가입했다.","1953년에 그녀는 통합당에 가입하여 의회에 선출되었지만, 통합당이 아파르트헤이트에 대해 더 온건한 입장을 채택하자 Suzman과 다른 진보적인 당원들은 통합당을 떠나 1959년에 진보당을 만들었다.","Suzman은 의회에서 총 36년 동안 정부의 남용을 폭로하고 그 법들에 도전하며 아파르트헤이트에 맞서 지칠 줄 모르고 싸웠다.","1989년에 은퇴한 뒤에도 그녀는 남아프리카 공화국의 다인종 민주주의를 계속 옹호했고, 아파르트헤이트가 끝난 뒤 그 나라의 새 헌법을 작성하는 데 영향을 주었다.","그녀는 2009년에 사망할 때까지 인권과 민주주의를 위한 적극적인 목소리로 남아 있었다."],"key":[["","아파르트헤이트에 맞선 운동가 소개"],["","1917년 유대인 이민자 가정에서 출생"],["","대학 강사로 일하며 인종 관계 연구소에 가입"],["","통합당 의원이 되었다가 진보당 창당(1959)"],["","의회에서 36년간 아파르트헤이트와 싸움"],["","은퇴 후에도 다인종 민주주의와 새 헌법에 기여"],["","사망 때까지 인권과 민주주의의 목소리"]],"link":[true,false,false,true,true,true]},{"id":"2410-29","label":"24년 10월 29번","taught":true,"modes":["ko","abc","mun","blank"],"en":["Conditioned Place Preference is a way of finding out what animals want.","Researchers train them to associate one place with an experience such as food or a loud noise and another place with something completely different, usually where nothing happens.","The two places are made obviously different to make it as easy as possible for the animal to associate each place with what happened to it there.","The animal’s preference for being in one place or another is measured both before and after its experiences in the two places.","If there is a shift in where the animal chooses to spend its time for the reward, this suggests that it liked the experience and is trying to repeat it.","Conversely, if it now avoids the place the stimulus appeared and starts to prefer the place it did not experience it, then this suggests that it found the stimulus unpleasant.","For example, mice with cancer show a preference for the place where they have been given morphine, a drug used to relieve pain, rather than where they have received saline whereas healthy mice developed no such preference.","This suggests that the mice with cancer wanted the morphine."],"ko":["조건부 장소 선호는 동물들이 무엇을 원하는지 알아내는 하나의 방법이다.","연구자들은 동물이 한 장소를 음식이나 시끄러운 소리 같은 경험과, 또 다른 장소를 완전히 다른 어떤 것과 연관 짓도록 훈련시키는데, 대개 그곳에서는 아무 일도 일어나지 않는다.","그 두 장소는 동물이 각 장소를 그곳에서 자신에게 일어난 일과 가능한 한 쉽게 연관 짓도록 분명히 다르게 만들어진다.","한 장소 또는 다른 장소에 있는 것에 대한 동물의 선호는 그 두 장소에서의 경험 전과 후에 모두 측정된다.","동물이 보상을 위해 어디서 시간을 보낼지 선택하는 데 변화가 있다면, 이것은 그 동물이 그 경험을 좋아했고 그것을 반복하려 하고 있음을 시사한다.","반대로, 동물이 이제 자극이 나타났던 장소를 피하고 그것을 경험하지 않은 장소를 선호하기 시작한다면, 이것은 그 동물이 그 자극을 불쾌하게 느꼈음을 시사한다.","예를 들어, 암에 걸린 쥐는 식염수를 받았던 곳보다 통증을 완화하는 데 쓰는 약인 모르핀이 주어졌던 곳에 대한 선호를 보인 반면, 건강한 쥐는 그런 선호를 보이지 않았다.","이것은 암에 걸린 쥐가 모르핀을 원했음을 시사한다."],"key":[["","조건부 장소 선호: 동물이 원하는 것을 알아내는 방법"],["","한 장소는 경험과, 다른 장소는 무(無)와 연결 훈련"],["","두 장소를 뚜렷이 다르게 만든다"],["","경험 전후로 장소 선호를 측정한다"],["","머무는 장소가 바뀌면 그 경험을 좋아한 것"],["Conversely(반대로)","경험한 장소를 피하면 불쾌했던 것"],["For example(예를 들어)","암에 걸린 쥐는 모르핀을 준 장소를 선호했다"],["","암에 걸린 쥐는 모르핀을 원했다"]],"link":[true,true,true,true,true,true,true]},{"id":"2410-30","label":"24년 10월 30번","taught":true,"modes":["ko","abc","mun","blank"],"en":["Near the equator, many species of bird breed all year round.","But in temperate and polar regions, the breeding seasons of birds are often sharply defined.","They are triggered mainly by changes in day length.","If all goes well, the outcome is that birds raise their young when the food supply is at its peak.","Most birds are not simply reluctant to breed at other times but they are also physically incapable of doing so.","This is because their reproductive system shrinks, which helps flying birds save weight.","The main exception to this rule are nomadic desert species.","These can initiate their breeding cycle within days of rain.","It’s for making the most of the sudden breeding opportunity.","Also, different species divide the breeding season up in different ways.","Most seabirds raise a single brood.","In warm regions, however, songbirds may raise several families in a few months.","In an exceptionally good year, a pair of House Sparrows, a kind of songbird, can raise successive broods through a marathon reproductive effort."],"ko":["적도 근처에서는 많은 종의 새가 일 년 내내 번식한다.","하지만 온대와 극지방에서는 새의 번식기가 대개 뚜렷하게 정해져 있다.","번식기는 주로 낮의 길이 변화에 의해 촉발된다.","모든 것이 잘 풀리면, 그 결과 새들은 먹이 공급이 최고조일 때 새끼를 기르게 된다.","대부분의 새는 다른 때에 번식하기를 단순히 꺼리는 것이 아니라 신체적으로도 그렇게 할 수 없다.","이는 그들의 생식 기관이 줄어들기 때문인데, 이것은 날아다니는 새가 몸무게를 줄이는 데 도움이 된다.","이 규칙의 주된 예외는 유목성 사막 종이다.","이들은 비가 오고 며칠 안에 번식 주기를 시작할 수 있다.","그것은 갑작스러운 번식 기회를 최대한 활용하기 위해서이다.","또한, 종마다 번식 기간을 나누는 방식이 다르다.","대부분의 바닷새는 한 배의 새끼만 기른다.","그러나 따뜻한 지역에서는 명금(鳴禽)이 몇 달 안에 여러 배의 새끼를 기를 수도 있다.","유난히 좋은 해에는 명금의 한 종류인 참새 한 쌍이 마라톤과 같은 번식 노력을 통해 잇따라 여러 배의 새끼를 기를 수 있다."],"key":[["","적도 근처 새는 일 년 내내 번식한다"],["But(그러나)","온대·극지방은 번식기가 뚜렷하다"],["","번식기는 낮의 길이 변화로 시작된다"],["","먹이가 최고일 때 새끼를 기르게 된다"],["","다른 때에는 번식할 수도 없다"],["This is because(이는 ~ 때문이다)","생식 기관이 줄어 몸이 가벼워진다"],["","주된 예외는 유목성 사막 종이다"],["","비 온 뒤 며칠 안에 번식을 시작한다"],["","갑작스러운 기회를 최대한 활용하려는 것이다"],["Also(또한)","종마다 번식 기간을 나누는 방식이 다르다"],["","바닷새는 한 배의 새끼만 기른다"],["","따뜻한 지역의 명금은 여러 배를 기른다"],["","좋은 해에는 참새가 연이어 번식한다"]],"link":[true,true,true,true,true,true,true,true,false,true,true,true]},{"id":"2410-33","label":"24년 10월 33번","taught":true,"modes":["ko","abc","mun","blank"],"en":["Some people argue that there is a single, logically consistent concept known as reading that can be neatly set apart from everything else people do with books.","Is reading really that simple?","The most productive way to think about reading is as a loosely related set of behaviors that belong together owing to family resemblances, as Ludwig Wittgenstein used the phrase, without having in common a single defining trait.","Consequently, efforts to distinguish reading from nonreading are destined to fail because there is no agreement on what qualifies as reading in the first place.","The more one tries to figure out where the border lies between reading and not-reading, the more edge cases will be found to stretch the term’s flexible boundaries.","Thus, it is worth attempting to collect together these exceptional forms of reading into a single forum, one highlighting the challenges faced by anyone wishing to establish the boundaries where reading begins and ends.","The attempt moves toward an understanding of reading as a spectrum that is expansive enough to accommodate the distinct reading activities."],"ko":["어떤 사람들은 책을 가지고 사람들이 하는 다른 모든 행동과 깔끔하게 분리될 수 있는, 읽기라고 알려진 하나의 논리적으로 일관된 개념이 있다고 주장한다.","읽기는 정말 그렇게 단순할까?","읽기에 대해 생각하는 가장 생산적인 방식은, Ludwig Wittgenstein이 그 표현을 사용한 의미대로, 하나의 규정하는 특성을 공통으로 갖지 않으면서도 가족 유사성 때문에 함께 속하는, 느슨하게 관련된 행동의 집합으로 보는 것이다.","결과적으로, 읽기와 읽기가 아닌 것을 구별하려는 노력은 실패할 수밖에 없는데, 애초에 무엇이 읽기의 자격을 갖추는지에 대한 합의가 없기 때문이다.","읽기와 읽기가 아닌 것 사이의 경계가 어디에 있는지 알아내려 할수록, 그 용어의 유연한 경계를 넓히는 특이 사례가 더 많이 발견될 것이다.","그러므로 이러한 예외적인 읽기의 형태들을 하나의 장으로 함께 모아 보는 것은 해 볼 만한데, 그 장은 읽기가 시작되고 끝나는 경계를 정하고자 하는 누구나 마주하는 어려움을 부각한다.","이러한 시도는 별개의 읽기 활동들을 모두 수용할 만큼 폭넓은 스펙트럼으로서 읽기를 이해하는 쪽으로 나아간다."],"key":[["","읽기는 하나의 일관된 개념이라는 주장"],["","읽기가 정말 그렇게 단순한가라는 의문"],["","읽기는 가족 유사성으로 묶인 느슨한 행동 집합"],["Consequently(결과적으로)","읽기와 비읽기를 가르려는 노력은 실패한다"],["","경계를 찾을수록 예외 사례가 늘어난다"],["Thus(그러므로)","예외적 읽기를 한 곳에 모아 볼 가치가 있다"],["","읽기를 폭넓은 스펙트럼으로 이해하게 된다"]],"link":[true,true,true,true,true,true]}]};
