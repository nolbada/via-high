var DATA={"meta": {"sch": "jusung-go2", "src": "jusung-go2/mock/sx-data.js", "pidx": 21, "lesson": "23년 11월 39번", "title": "", "label": "", "page": "yoyak-2311-39"}, "scenes": [{"tag": "본문 1~2번", "ns": [1, 2], "line": "프랑스가 [[precisely|정밀하게]] 규정한 단위를 퍼뜨렸지만, 양자 역학이 그 꿈을 [[destroyed|깨 버렸다]].", "en": ["By the nineteenth century, France had developed a system of precisely defined units of measurement to capture space, time, and more, and had begun to get other nations to adopt the same standards.", "Just half a century later, in the 1920s, the discoveries of quantum mechanics forever destroyed the dream of comprehensive and perfect measurement."], "kos": ["19세기까지, 프랑스는 공간, 시간, 그리고 더 많은 것을 포착하기 위해 정밀하게 규정된 측정 단위의 체계를 개발했고, 다른 국가들이 동일한 기준을 채택하도록 만들기 시작했었다.", "불과 반세기 후, 1920년대에, 양자 역학의 발견은 포괄적이고 완벽한 측정에 대한 꿈을 영원히 깨 버렸다."]}, {"tag": "본문 3~4번", "ns": [3, 4], "line": "그래도 완벽한 측정을 향한 정신은 [[continued|이어졌고]] 비즈니스에서는 [[expanded|확장됐다]].", "en": ["And yet, outside a relatively small circle of physicists, the mindset of humankind’s drive to flawlessly measure continued among engineers and scientists.", "In the world of business it even expanded, as the precision-oriented sciences of mathematics and statistics began to influence all areas of commerce."], "kos": ["그러나 비교적 소수 집단의 물리학자를 제외하고는 공학자와 과학자 사이에서 완벽하게 측정하려고 하는 인류의 추진 정신은 계속되었다.", "정확성을 지향하는 수학과 통계학이라는 과학이 상업의 모든 영역에 영향을 미치기 시작하면서 비즈니스의 세계에서 그것은 심지어 확장되었다."]}, {"tag": "본문 5번", "ns": [5], "line": "하지만 [[imprecision|부정확함]]을 허용하는 것은 [[shortcoming|단점]]이 아닐 수 있다.", "en": ["However, contrary to the trend of the past several decades, in many new situations that are occurring today, allowing for imprecision ― for messiness ― may be a positive feature, not a shortcoming."], "kos": ["그러나, 지난 수십 년간의 경향과 반대로, 오늘날 발생하는 많은 새로운 상황에서 부정확성, 즉, 번잡함을 허용하는 것은 단점이 아니라 긍정적인 특성이 될 수 있다."]}, {"tag": "본문 6~7번", "ns": [6, 7], "line": "오류 기준을 풀어 주는 [[tradeoff|맞교환]]으로 훨씬 더 많은 데이터를 얻는다.", "en": ["As a tradeoff for relaxing the standards of allowable errors, one can get a hold of much more data.", "It isn’t just that “more is better than some,” but that, in fact, sometimes “more is greater than better.”"], "kos": ["허용 가능한 오류의 기준을 완화하는 것에 대한 맞교환으로서, 사람은 훨씬 더 많은 데이터를 얻을 수 있다.", "그것은 단순히 ‘더 많은 것이 조금보다 더 나을’ 뿐만 아니라, 사실은 때때로 ‘더 많은 것이 더 좋은 것보다 더 훌륭하기’도 하다."]}], "story": [{"a": "precisely", "form": "precisely", "n": 1, "sq": 1, "sum": "a system of [[exact]] units", "hook": "정밀하게 규정된 측정 단위라는 precisely → 요약문에서는 exact(정확한)로 바뀌었어요.", "b": "exactly", "k": "정밀하게 → 정확하게", "en": "By the nineteenth century, France had developed a system of precisely defined units of measurement to capture space, time, and more, and had begun to get other nations to adopt the same standards.", "ko": "19세기까지, 프랑스는 공간, 시간, 그리고 더 많은 것을 포착하기 위해 정밀하게 규정된 측정 단위의 체계를 개발했고, 다른 국가들이 동일한 기준을 채택하도록 만들기 시작했었다."}, {"a": "destroy", "form": "destroyed", "n": 2, "sq": 1, "sum": "later [[shattered]] the dream", "hook": "양자 역학이 꿈을 깨 버렸다는 destroyed(파괴했다) → 요약문에서는 shattered(산산이 깼다)로 바뀌었어요.", "b": "shatter", "k": "파괴하다 → 산산이 깨다", "en": "Just half a century later, in the 1920s, the discoveries of quantum mechanics forever destroyed the dream of comprehensive and perfect measurement.", "ko": "불과 반세기 후, 1920년대에, 양자 역학의 발견은 포괄적이고 완벽한 측정에 대한 꿈을 영원히 깨 버렸다."}, {"a": "continue", "form": "continued", "n": 3, "sq": 2, "sum": "flawlessly [[persisted]] among engineers", "hook": "공학자·과학자 사이에서 계속됐다는 continued → 요약문에서는 persisted(이어졌다)로 바뀌었어요.", "b": "persist", "k": "계속되다 → 끈질기게 이어지다", "en": "And yet, outside a relatively small circle of physicists, the mindset of humankind’s drive to flawlessly measure continued among engineers and scientists.", "ko": "그러나 비교적 소수 집단의 물리학자를 제외하고는 공학자와 과학자 사이에서 완벽하게 측정하려고 하는 인류의 추진 정신은 계속되었다."}, {"a": "expand", "form": "expanded", "n": 4, "sq": 2, "sum": "and even [[grew]] in business", "hook": "비즈니스에서는 심지어 확장됐다는 expanded → 요약문에서는 grew(커졌다)로 바뀌었어요.", "b": "grow", "k": "확장되다 → 커지다", "en": "In the world of business it even expanded, as the precision-oriented sciences of mathematics and statistics began to influence all areas of commerce.", "ko": "정확성을 지향하는 수학과 통계학이라는 과학이 상업의 모든 영역에 영향을 미치기 시작하면서 비즈니스의 세계에서 그것은 심지어 확장되었다."}, {"a": "imprecision", "form": "imprecision", "n": 5, "sq": 3, "sum": "allowing some [[inaccuracy]]", "hook": "부정확함을 허용한다는 imprecision → 요약문에서는 inaccuracy(부정확함)로 바뀌었어요.", "b": "inaccuracy", "k": "부정확함 → 부정확함", "en": "However, contrary to the trend of the past several decades, in many new situations that are occurring today, allowing for imprecision ― for messiness ― may be a positive feature, not a shortcoming.", "ko": "그러나, 지난 수십 년간의 경향과 반대로, 오늘날 발생하는 많은 새로운 상황에서 부정확성, 즉, 번잡함을 허용하는 것은 단점이 아니라 긍정적인 특성이 될 수 있다."}, {"a": "shortcoming", "form": "shortcoming", "n": 5, "sq": 3, "sum": "rather than a [[weakness]]", "hook": "단점이 아니라 긍정적인 특성이라는 shortcoming(단점) → 요약문에서는 weakness(약점)로 바뀌었어요.", "b": "weakness", "k": "단점 → 약점", "en": "However, contrary to the trend of the past several decades, in many new situations that are occurring today, allowing for imprecision ― for messiness ― may be a positive feature, not a shortcoming.", "ko": "그러나, 지난 수십 년간의 경향과 반대로, 오늘날 발생하는 많은 새로운 상황에서 부정확성, 즉, 번잡함을 허용하는 것은 단점이 아니라 긍정적인 특성이 될 수 있다."}, {"a": "tradeoff", "form": "tradeoff", "n": 6, "sq": 3, "sum": "in [[exchange]] for relaxing", "hook": "기준을 풀어 주는 대신 데이터를 더 얻는 tradeoff(맞교환) → 요약문에서는 exchange(교환)로 바뀌었어요.", "b": "exchange", "k": "맞교환 → 교환", "en": "As a tradeoff for relaxing the standards of allowable errors, one can get a hold of much more data.", "ko": "허용 가능한 오류의 기준을 완화하는 것에 대한 맞교환으로서, 사람은 훨씬 더 많은 데이터를 얻을 수 있다."}], "passage": [{"n": 1, "en": "By the nineteenth century, France had developed a system of precisely defined units of measurement to capture space, time, and more, and had begun to get other nations to adopt the same standards.", "ko": "19세기까지, 프랑스는 공간, 시간, 그리고 더 많은 것을 포착하기 위해 정밀하게 규정된 측정 단위의 체계를 개발했고, 다른 국가들이 동일한 기준을 채택하도록 만들기 시작했었다."}, {"n": 2, "en": "Just half a century later, in the 1920s, the discoveries of quantum mechanics forever destroyed the dream of comprehensive and perfect measurement.", "ko": "불과 반세기 후, 1920년대에, 양자 역학의 발견은 포괄적이고 완벽한 측정에 대한 꿈을 영원히 깨 버렸다."}, {"n": 3, "en": "And yet, outside a relatively small circle of physicists, the mindset of humankind’s drive to flawlessly measure continued among engineers and scientists.", "ko": "그러나 비교적 소수 집단의 물리학자를 제외하고는 공학자와 과학자 사이에서 완벽하게 측정하려고 하는 인류의 추진 정신은 계속되었다."}, {"n": 4, "en": "In the world of business it even expanded, as the precision-oriented sciences of mathematics and statistics began to influence all areas of commerce.", "ko": "정확성을 지향하는 수학과 통계학이라는 과학이 상업의 모든 영역에 영향을 미치기 시작하면서 비즈니스의 세계에서 그것은 심지어 확장되었다."}, {"n": 5, "en": "However, contrary to the trend of the past several decades, in many new situations that are occurring today, allowing for imprecision ― for messiness ― may be a positive feature, not a shortcoming.", "ko": "그러나, 지난 수십 년간의 경향과 반대로, 오늘날 발생하는 많은 새로운 상황에서 부정확성, 즉, 번잡함을 허용하는 것은 단점이 아니라 긍정적인 특성이 될 수 있다."}, {"n": 6, "en": "As a tradeoff for relaxing the standards of allowable errors, one can get a hold of much more data.", "ko": "허용 가능한 오류의 기준을 완화하는 것에 대한 맞교환으로서, 사람은 훨씬 더 많은 데이터를 얻을 수 있다."}, {"n": 7, "en": "It isn’t just that “more is better than some,” but that, in fact, sometimes “more is greater than better.”", "ko": "그것은 단순히 ‘더 많은 것이 조금보다 더 나을’ 뿐만 아니라, 사실은 때때로 ‘더 많은 것이 더 좋은 것보다 더 훌륭하기’도 하다."}], "questions": [{"id": 1, "summary": "By the nineteenth century France had built a system of exact units and begun to (A) other nations to adopt the same standards, but quantum mechanics later (B) the dream of perfect measurement.", "ko": "19세기에 이르러 프랑스는 정확한 단위 체계를 만들고 다른 나라들이 같은 기준을 채택하도록 <b>(A) 설득하기</b> 시작했지만, 양자 역학이 나중에 완벽한 측정에 대한 꿈을 <b>(B) 깨 버렸다</b>.", "opts": [["persuade", "strengthened"], ["forbid", "shattered"], ["forbid", "strengthened"], ["persuade", "shattered"], ["warn", "completed"]], "optko": ["설득하다 – 강화했다", "금지하다 – 깨 버렸다", "금지하다 – 강화했다", "설득하다 – 깨 버렸다", "경고하다 – 완성했다"], "ans": 3, "wrong": ["strengthened(강화했다)가 틀려요. 1920년대 양자 역학은 완벽한 측정의 꿈을 영원히 깨 버렸어요(destroyed).", "forbid(금지하다)가 틀려요. 프랑스는 다른 나라가 같은 기준을 채택하도록 만들려고 했지(get ... to adopt) 금지하지 않았어요.", "둘 다 틀려요. 프랑스는 기준을 채택하게 하려 했고, 양자 역학은 꿈을 강화하지 않고 깼어요.", null, "둘 다 틀려요. 경고했다는 말도, 꿈을 완성했다는 말도 본문과 반대예요."], "evid": [{"n": 1, "hl": ["a system of precisely defined units of measurement", "get other nations to adopt the same standards"]}, {"n": 2, "hl": ["forever destroyed the dream of comprehensive and perfect measurement"]}], "swaps": [["precisely", "exactly", "정밀하게 → 정확하게"], ["destroy", "shatter", "파괴하다 → 산산이 깨다"], ["comprehensive", "complete", "포괄적인 → 완전한"]], "swapnote": "precisely defined(정밀하게 규정된)는 exact(정확한)로, destroyed(파괴했다)는 shattered(산산이 깼다)로 바뀌었어요. 꿈이 '깨졌다'고 읽으면 쉬워요.", "use": [{"w": "persuade", "ex": "He tried to persuade his friend to join the club.", "ko": "그는 친구가 동아리에 들어오도록 설득하려 했다.", "wk": "설득하다", "hk": "설득하려"}, {"w": "shatter", "ex": "The ball can shatter a glass window.", "ko": "공은 유리창을 산산이 깰 수 있다.", "wk": "산산이 깨다", "hk": "산산이 깰"}], "flow": "본문 1번에서 19세기 프랑스가 정밀한 측정 단위를 만들어 다른 나라에도 채택시켰다고 하고 → 2번에서 불과 반세기 뒤 양자 역학이 그 완벽한 측정의 꿈을 깨 버렸다고 이어요.", "jd": [["By the nineteenth century France had built a system of exact units", "19세기에 이르러 프랑스는 정확한 단위 체계를 만들었고"], ["and begun to [[persuade]] other nations", "다른 나라들을 [[설득하기]] 시작했다"], ["to adopt the same standards,", "같은 기준을 채택하도록,"], ["but quantum mechanics later [[shattered]]", "하지만 양자 역학이 나중에 [[깨 버렸다]]"], ["the dream of perfect measurement.", "완벽한 측정에 대한 꿈을."]], "fc": [["본문 1번", "19세기 프랑스: 정밀한 측정 단위를 만들어 퍼뜨림", "다른 나라도 같은 기준을 쓰게 했어요."], ["본문 2번", "1920년대 양자 역학: 완벽한 측정의 꿈이 깨짐", "불과 반세기 뒤예요."], ["정답 포인트", "{{precisely|정밀하게}} → {{exact|정확한}}, {{destroy|파괴하다}} → {{shatter|산산이 깨다}}", "본문 단어를 쉬운 말로 바꿨어요."]], "evid_full": [{"en": "By the nineteenth century, France had developed a system of precisely defined units of measurement to capture space, time, and more, and had begun to get other nations to adopt the same standards.", "ko": "19세기까지, 프랑스는 공간, 시간, 그리고 더 많은 것을 포착하기 위해 정밀하게 규정된 측정 단위의 체계를 개발했고, 다른 국가들이 동일한 기준을 채택하도록 만들기 시작했었다.", "hl": ["a system of precisely defined units of measurement", "get other nations to adopt the same standards"], "hlko": ["정밀하게 규정된 측정 단위의 체계", "다른 국가들이 동일한 기준을 채택하도록 만들기"], "n": 1}, {"en": "Just half a century later, in the 1920s, the discoveries of quantum mechanics forever destroyed the dream of comprehensive and perfect measurement.", "ko": "불과 반세기 후, 1920년대에, 양자 역학의 발견은 포괄적이고 완벽한 측정에 대한 꿈을 영원히 깨 버렸다.", "hl": ["forever destroyed the dream of comprehensive and perfect measurement"], "hlko": ["포괄적이고 완벽한 측정에 대한 꿈을 영원히 깨 버렸다"], "n": 2}]}, {"id": 2, "summary": "Outside a small circle of physicists, the urge to measure flawlessly (A) among engineers and scientists and even (B) in business as mathematics and statistics came to influence commerce.", "ko": "소수의 물리학자들을 제외하고는 결점 없이 측정하려는 충동이 공학자와 과학자 사이에서 <b>(A) 이어졌고</b>, 수학과 통계학이 상업에 영향을 미치게 되면서 비즈니스에서는 심지어 <b>(B) 커졌다</b>.", "opts": [["persisted", "shrank"], ["persisted", "grew"], ["vanished", "grew"], ["vanished", "shrank"], ["faded", "weakened"]], "optko": ["이어졌다 – 줄었다", "이어졌다 – 커졌다", "사라졌다 – 커졌다", "사라졌다 – 줄었다", "흐려졌다 – 약해졌다"], "ans": 1, "wrong": ["shrank(줄었다)가 틀려요. 비즈니스에서는 이 추구가 오히려 확장됐어요(expanded).", null, "vanished(사라졌다)가 틀려요. 완벽하게 측정하려는 정신은 공학자와 과학자 사이에서 계속됐어요(continued).", "둘 다 틀려요. 그 정신은 사라지지 않고 이어졌고, 비즈니스에서는 줄지 않고 커졌어요.", "둘 다 틀려요. 흐려지거나 약해진 게 아니라 이어지고 확장됐어요."], "evid": [{"n": 3, "hl": ["outside a relatively small circle of physicists", "continued among engineers and scientists"]}, {"n": 4, "hl": ["even expanded", "began to influence all areas of commerce"]}], "swaps": [["continue", "persist", "계속되다 → 끈질기게 이어지다"], ["expand", "grow", "확장되다 → 커지다"], ["precision-oriented", "exact", "정확성을 지향하는 → 정확한"]], "swapnote": "continued(계속됐다)는 persisted(이어졌다)로, expanded(확장됐다)는 grew(커졌다)로 바뀌었어요. 꿈이 깨져도 현실에서는 계속됐다는 대비를 기억해요.", "use": [{"w": "persist", "ex": "The rain will persist all day.", "ko": "비가 하루 종일 계속될 것이다.", "wk": "계속되다", "hk": "계속될"}, {"w": "grew", "ex": "The town grew quickly after the road opened.", "ko": "도로가 열린 뒤 마을은 빠르게 커졌다.", "wk": "커지다", "hk": "커졌다"}], "flow": "본문 3번에서 And yet(그러나) 소수의 물리학자를 빼면 공학자·과학자들은 완벽한 측정을 계속 추구했다고 하고 → 4번에서 비즈니스에서는 수학과 통계학 덕에 오히려 더 넓어졌다고 해요.", "jd": [["Outside a small circle of physicists,", "소수의 물리학자들을 제외하고는,"], ["the urge to measure flawlessly [[persisted]]", "결점 없이 측정하려는 충동은 [[이어졌고]]"], ["among engineers and scientists", "공학자와 과학자 사이에서"], ["and even [[grew]] in business", "비즈니스에서는 심지어 [[커졌다]]"], ["as mathematics and statistics came to influence commerce.", "수학과 통계학이 상업에 영향을 미치게 되면서."]], "fc": [["본문 3번", "그래도 공학자·과학자는 완벽한 측정을 계속 추구", "소수 물리학자만 예외였어요."], ["본문 4번", "비즈니스에서는 더 확장됨", "수학과 통계학이 상업에 영향을 줬어요."], ["정답 포인트", "{{continue|계속되다}} → {{persist|끈질기게 이어지다}}, {{expand|확장되다}} → {{grow|커지다}}", "꿈이 깨져도 현실은 이어졌어요."]], "evid_full": [{"en": "And yet, outside a relatively small circle of physicists, the mindset of humankind’s drive to flawlessly measure continued among engineers and scientists.", "ko": "그러나 비교적 소수 집단의 물리학자를 제외하고는 공학자와 과학자 사이에서 완벽하게 측정하려고 하는 인류의 추진 정신은 계속되었다.", "hl": ["outside a relatively small circle of physicists", "continued among engineers and scientists"], "hlko": ["비교적 소수 집단의 물리학자를 제외하고는", "공학자와 과학자 사이에서"], "n": 3}, {"en": "In the world of business it even expanded, as the precision-oriented sciences of mathematics and statistics began to influence all areas of commerce.", "ko": "정확성을 지향하는 수학과 통계학이라는 과학이 상업의 모든 영역에 영향을 미치기 시작하면서 비즈니스의 세계에서 그것은 심지어 확장되었다.", "hl": ["even expanded", "began to influence all areas of commerce"], "hlko": ["심지어 확장되었다", "상업의 모든 영역에 영향을 미치기 시작하면서"], "n": 4}]}, {"id": 3, "summary": "Today, allowing some (A) can be a strength rather than a weakness: in (B) for relaxing the standards of allowable errors, we can gather far more data.", "ko": "오늘날 어느 정도의 <b>(A) 부정확함</b>을 허용하는 것은 약점이 아니라 강점이 될 수 있다. 허용 오류 기준을 완화하는 <b>(B) 대가로</b> 우리는 훨씬 더 많은 데이터를 모을 수 있다.", "opts": [["inaccuracy", "competition"], ["precision", "exchange"], ["inaccuracy", "exchange"], ["precision", "competition"], ["stability", "preference"]], "optko": ["부정확함 – 경쟁", "정밀함 – 대가", "부정확함 – 대가", "정밀함 – 경쟁", "안정 – 선호"], "ans": 2, "wrong": ["competition(경쟁)이 틀려요. 기준을 완화하는 것은 더 많은 데이터를 얻는 대가(tradeoff)예요.", "precision(정밀함)이 틀려요. 본문은 정밀함이 아니라 부정확함(imprecision)을 허용하는 게 장점일 수 있다고 해요.", null, "둘 다 틀려요. 허용하는 건 정밀함이 아니라 부정확함이고, 경쟁 이야기는 본문에 없어요.", "둘 다 틀려요. 안정이라는 말도, 선호라는 말도 본문에 없어요."], "evid": [{"n": 5, "hl": ["allowing for imprecision", "a positive feature, not a shortcoming"]}, {"n": 6, "hl": ["relaxing the standards of allowable errors", "get a hold of much more data"]}], "swaps": [["imprecision", "inaccuracy", "부정확함 → 부정확함"], ["shortcoming", "weakness", "단점 → 약점"], ["tradeoff", "exchange", "맞교환 → 교환"]], "swapnote": "imprecision(부정확함)은 inaccuracy(부정확함)로, shortcoming(단점)은 weakness(약점)로, tradeoff(맞교환)는 exchange(교환)로 바뀌었어요.", "use": [{"w": "inaccuracy", "ex": "The map had an inaccuracy near the river.", "ko": "그 지도는 강 근처에 부정확한 부분이 있었다.", "wk": "부정확함", "hk": "부정확한 부분"}, {"w": "exchange", "ex": "She gave me a pen in exchange for my notebook.", "ko": "그녀는 내 공책의 대가로 펜을 주었다.", "wk": "교환, 대가", "hk": "대가로"}], "flow": "본문 5번에서 However(하지만) 요즘은 부정확함을 허용하는 것이 단점이 아니라 장점일 수 있다고 하고 → 6번에서 오류 기준을 느슨하게 하는 대신 훨씬 더 많은 데이터를 얻는다고 풀어요.", "jd": [["Today, allowing some [[inaccuracy]] can be a strength", "오늘날 어느 정도의 [[부정확함]]을 허용하는 것은 강점이 될 수 있다"], ["rather than a weakness:", "약점이 아니라:"], ["in [[exchange]] for relaxing the standards of allowable errors,", "허용 오류 기준을 완화하는 [[대가로]],"], ["we can gather far more data.", "우리는 훨씬 더 많은 데이터를 모을 수 있다."]], "fc": [["본문 5번", "하지만 부정확함을 허용하는 게 장점일 수 있다", "However(하지만)로 방향이 바뀌어요."], ["본문 6번", "오류 기준을 풀어 주면 훨씬 더 많은 데이터", "맞교환이에요."], ["정답 포인트", "{{imprecision|부정확함}} = {{inaccuracy|부정확함}}, {{tradeoff|맞교환}} → {{exchange|교환}}", "{{shortcoming|단점}}은 {{weakness|약점}}으로 바뀌었어요."]], "evid_full": [{"en": "However, contrary to the trend of the past several decades, in many new situations that are occurring today, allowing for imprecision ― for messiness ― ma }
document.addEventListener('click',function(e){
  var w=e.target.closest&&e.target.closest('.w');
  if(w){e.stopPropagation();tapWord(w.getAttribute('data-k'));return}
  if(!(e.target.closest&&e.target.closest('#sheet')))hideSheet();
  var a=e.target.closest&&e.target.closest('[data-a]');
  if(!a)return;
  var act=a.getAttribute('data-a'),v=a.getAttribute('data-v');
  if(act==='home')go('home');
  else if(act==='q')go('q',+v);
  else if(act==='pick')pick(+v);
  else if(act==='next'){if(cur<Qs.length-1)go('q',cur+1);else go('res')}
  else if(act==='res')go('res');
  else if(act==='notes')go('notes');
  else if(act==='resume'){var f=firstOpen();if(f<0)go('res');else go('q',f)}
  else if(act==='reset'){PR={a:{}};jset(K_PROG,PR);go('home')}
  else if(act==='filt'){filt=v;render()}
  else if(act==='chk'){go('chk')}
  else if(act==='sw'){go('sw')}
  else if(act==='rvall'){var o=v==='open';swList().forEach(function(s){if(o){swOpen[s.id]=true;pushSw(s.id)}else delete swOpen[s.id]});render()}
  else if(act==='dt'){swD[v]=!swD[v];render()}
  else if(act==='rv'){swOpen[v]=!swOpen[v];if(swOpen[v])pushSw(v);render()}
  else if(act==='mean'){var m=document.getElementById('m_'+v);if(m)m.style.display=m.style.display==='block'?'none':'block'}
});
function pick(i){
  var q=Qs[cur];if(PR.a[q.id]!==undefined)return;
  PR.a[q.id]=i;jset(K_PROG,PR);recordYy(q,i);render();
}
/* 점수 기록: vhy:<학교> = {<페이지>:{<문제>:{n:푼 횟수,w:틀린 횟수,k:마지막 정답(1/0),c:고른 번호,t:시각}}} -> REC 로 자동 연동(선생님 화면) */
function recordYy(q,i){
  try{
    var K='vhy:'+SCH,P=location.pathname.split('/').slice(-2).join('/'),Y=jget(K,{});
    var pg=Y[P]||(Y[P]={}),e=pg[q.id]||(pg[q.id]={n:0,w:0});
    e.n=(e.n||0)+1;if(i!==q.ans)e.w=(e.w||0)+1;e.k=(i===q.ans?1:0);e.c=i;e.t=Date.now();
    jset(K,Y);
  }catch(x){}
  /* 바꿔 말하기 단어는 푼 즉시 모두 선생님 질문 목록에 올린다 */
  try{swList().forEach(function(s){pushSw(s.id)})}catch(x){}
}


function jdHtml(q){
  var h='<div class="sl">';
  q.jd.forEach(function(c){
    var en=c[0].split(/(\[\[.*?\]\])/).map(function(s){var m=s.match(/^\[\[(.*)\]\]$/);return m?'<mark>'+words(m[1])+'</mark>':words(s)}).join('');
    var ko=c[1].split(/(\[\[.*?\]\])/).map(function(s){var m=s.match(/^\[\[(.*)\]\]$/);return m?'<mark>'+esc(m[1])+'</mark>':esc(s)}).join('');
    h+='<div class="r"><b>'+en+'</b><span>'+ko+'</span></div>';
  });
  return h+'</div>';
}
function pushSw(id){
  if(String(id).indexOf('c')===0&&!/^sw:/.test(id))return;
  var s=swList().filter(function(x){return x.id===id})[0];if(!s||PUSHED[id])return;
  PUSHED[id]=1;jset('vhvs:'+SCH,PUSHED);
  try{WN.add([{w:s.a,m:s.k+' → '+s.b,src:SRC,how:'바꿔 말하기',ask:true}])}catch(e){}
}
function swList(){return (DATA.story||[]).map(function(s){return {a:s.a,form:s.form,b:s.b,k:s.k,id:'sw:'+s.a.toLowerCase(),n:s.n,sq:s.sq,sum:s.sum,hook:s.hook,en:s.en,ko:s.ko}})}
function hlWord(t,w){return t.split(new RegExp('(\\b'+w+'\\b)','i')).map(function(x,i){return i%2?'<mark>'+esc(x)+'</mark>':words(x)}).join('')}
function hlSum(t){return t.split(/(\[\[.*?\]\])/).map(function(x){var m=x.match(/^\[\[(.*)\]\]$/);return m?'<mark>'+words(m[1])+'</mark>':words(x)}).join('')}
var swOpen={},swD={};
/* 화면 */
function render(){
  var h='';
  if(view==='home')h=vHome();else if(view==='q')h=vQ();else if(view==='res')h=vRes();else if(view==='notes')h=vNotes();else if(view==='sw')h=vSw();else if(view==='chk')h=vChk();else h=vHome();
  var y=window.pageYOffset||0;
  $('app').innerHTML=h;
  if(!window.__goTop)window.scrollTo(0,y);
}
function yyLine(){
  try{var Y=jget('vhy:'+SCH,{}),pg=Y[location.pathname.split('/').slice(-2).join('/')]||{},n=0,r=0,w=0;
    Qs.forEach(function(q){var e=pg[q.id];if(e&&e.n){n++;if(e.k)r++;w+=e.w||0}});
    if(!n)return '';
    return '<p class="sub">내 기록: '+n+'문제 중 '+r+'문제 정답'+(w?' · 틀린 횟수 '+w+'번':'')+'</p>';
  }catch(x){return ''}
}
function vHome(){
  var d=doneCount(),f=firstOpen();
  var h='<a class="tag" href="../index.html" style="text-decoration:none">목록</a><h1>'+DATA.meta.lesson+' '+esc(DATA.meta.title)+'</h1><p class="sub">요약문 연습 '+DATA.meta.label+' · '+Qs.length+'문제</p><div class="nums">';
  Qs.forEach(function(q,i){var a=PR.a[q.id];h+='<button class="nb '+(a===undefined?'':(a===q.ans?'o':'x'))+'" data-a="q" data-v="'+i+'">'+(i+1)+'</button>'});
  h+='</div>';
  h+=yyLine();
  h+='<button class="btn pri" data-a="resume">'+(d===0?'시작하기':(f<0?'결과 보기':'이어서 풀기 ('+d+' / '+Qs.length+')'))+'</button>';
  h+='<button class="btn sec" data-a="notes">단어노트 '+nNotes()+'개</button><button class="btn sec" data-a="sw">바꿔 말하기 연습</button>'+(nFlag()?'<button class="btn flagbtn" data-a="chk">선생님 확인 단어 '+nFlag()+'개</button>':'');
  h+='<div class="foot"><button data-a="reset">문제 다시 풀기</button></div>';
  return h;
}
function vQ(){
  var q=Qs[cur],a=PR.a[q.id],done=a!==undefined;curQ=q.id;
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">'+(cur+1)+' / '+Qs.length+'</span></div>';
  if(!done)h+='<p class="hint">밑줄 단어를 누르면 뜻이 나와요. 번호를 누르면 답을 골라요.</p>';
  h+='<div class="card sum">'+sumHtml(q,done)+'</div><div class="opts">';
  q.opts.forEach(function(o,i){
    var cls='opt'+(done?' lock':'');
    if(done){if(i===q.ans)cls+=' right';else if(i===a)cls+=' mine'}
    h+='<div class="'+cls+'"'+(done?'':' data-a="pick" data-v="'+i+'"')+'><span class="num">'+CN[i]+'</span><span class="ot">'+words(o[0])+'<span class="dash">–</span>'+words(o[1])+'</span>'+(done&&i===q.ans?'<span class="st">정답</span>':(done&&i===a?'<span class="st">내 답</span>':''))+'</div>';
  });
  h+='</div>';
  if(done){
    var ok=a===q.ans;
    h+='<div id="exp"><div class="card"><div class="row"><span class="badge">'+(cur+1)+'번</span><span class="chip">정답 '+CN[q.ans]+'</span><span class="msg '+(ok?'o':'x')+'">'+(ok?'맞았어요':'내 답 '+CN[a])+'</span></div>';
    h+='</div><div class="card"><p class="lb">직독직해 (끊어서 앞에서부터 이해해요)</p>'+jdHtml(q)+'<details><summary>자연스러운 해석 보기</summary><div class="ko">'+q.ko.replace(/\((A|B)\)\s*/g,'')+'</div></details></div>';
    h+='<div class="card"><p class="lb">보기 뜻</p><ul class="opl">';
    q.opts.forEach(function(o,i){h+='<li class="'+(i===q.ans?'a':'')+'">'+CN[i]+' '+(i===q.ans?'<mark>'+words(o[0])+' – '+words(o[1])+'</mark>':words(o[0])+' – '+words(o[1]))+'<span class="k">'+(i===q.ans?'<mark>'+esc(q.optko[i])+'</mark>  ← 정답':esc(q.optko[i]))+'</span></li>'});
    h+='</ul></div>';
    h+='<div class="card"><p class="lb">정답의 근거 · 본문 '+q.evid_full.map(function(e){return e.n+'번'}).join(', ')+'</p>';
    q.evid_full.forEach(function(e){h+='<div class="ev"><div class="en">'+rich(e.en,e.hl)+'</div><div class="kk">'+richKo(e.ko,e.hlko)+'</div></div>'});
    h+='</div>';
    h+='<div class="card"><p class="lb">이 단어, 이렇게 바뀌었어요</p>';
    q.swaps.forEach(function(s){h+='<div class="swap"><span class="a">'+words(s[0])+'</span><span class="arr">→</span><span class="b">'+words(s[1])+'</span><span class="ds">'+esc(s[2])+(/\s/.test(s[0])||/\s/.test(s[1])?'':' '+sayBtn(s[0],'듣기')+' '+sayBtn(s[1],'듣기'))+'</span></div>'});
    h+='<div class="note">'+esc(q.swapnote)+'</div></div>';
    h+='<div class="card"><p class="lb">쓰임 익히기</p><div class="use">';
    q.use.forEach(function(u){h+='<div class="u"><div class="uw">'+esc(u.w)+'<small class="uwk">('+esc(u.wk)+')</small></div><div class="ue">'+useEx(u)+'</div><div class="uk">'+esc(u.ko).replace(esc(u.hk),'<mark>'+esc(u.hk)+'</mark>')+'</div></div>'});
    h+='</div></div>';
    h+='<div class="card"><p class="lb">기억할 흐름</p><div class="fc">'+q.fc.map(function(c,i){return (i?'<div class="ar">▼</div>':'')+'<div class="c'+(i===q.fc.length-1?' last':'')+'"><span class="tg">'+esc(c[0])+'</span><div class="hd">'+mk(c[1])+'</div><div class="sb2">'+mk(c[2])+'</div></div>'}).join('')+'</div></div>';
    h+='<div class="card"><details><summary>다른 보기는 왜 아닐까요</summary><ul style="padding:0;margin:6px 0 0">';
    q.wrong.forEach(function(w,i){if(w)h+='<li><b>'+CN[i]+'</b> '+hlp(w)+'</li>'});
    h+='</ul></details></div>';
    h+='<button class="btn pri" data-a="next">'+(cur<Qs.length-1?'다음 문제':'결과 보기')+'</button></div>';
  }
  return h;
}
function vRes(){
  var h='<div class="top"><button class="back" data-a="home">목록</button></div><h1>'+Qs.length+'문제 중 '+okCount()+'문제 맞았어요</h1>';
  h+='<div class="nums">';
  Qs.forEach(function(q,i){var a=PR.a[q.id];h+='<button class="nb '+(a===undefined?'':(a===q.ans?'o':'x'))+'" data-a="q" data-v="'+i+'">'+(i+1)+'</button>'});
  h+='</div><p class="sub">단어노트에 '+nNotes()+'개가 쌓였어요.</p>';
  h+='<button class="btn pri" data-a="notes">단어노트 보기</button><button class="btn sec" data-a="reset">문제 다시 풀기</button><button class="btn sec" data-a="home">목록으로</button>';
  return h;
}
function sortedNotes(){return Object.keys(NOTES).map(function(k){return NOTES[k]}).sort(function(a,b){return b.t-a.t})}
function vNotes(){
  var L=sortedNotes();
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">단어노트 '+L.length+'개</span></div>';
  if(!L.length)return h+'<div class="empty">밑줄 단어를 누르면 여기에 쌓여요.</div>';
  h+='<div class="card"><ul class="wl">';
  L.forEach(function(n){h+='<li><span class="lw">'+esc(n.l)+'</span><span class="lm">'+esc(n.k)+'</span>'+(n.c>1?'<span class="lc">'+n.c+'번</span>':'')+'</li>'});
  return h+'</ul></div>';
}
function sk(id){return id.indexOf('sw:')===0?id.slice(3):id}
function wrongOf(id){var r=SRV[sk(id).toLowerCase()];return r&&r.c>0?r.c:0}
function flagList(){return Object.keys(SRV).map(function(k){return SRV[k]}).filter(function(r){return r.c>0}).sort(function(a,b){return b.c-a.c})}
function nFlag(){return flagList().length}
function srvLoad(){
  try{WN.list().then(function(r){
    if(!r||!r.ok||!r.items)return;SRV={};
    r.items.forEach(function(i){if(String(i.src||'').indexOf(SRC)>=0)SRV[String(i.w).toLowerCase()]={w:i.w,m:i.m,c:i.c||0}});
    if(view==='home'||view==='chk'||view==='sw')render();
  })}catch(e){}
}
function vChk(){
  var L=flagList();
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">선생님 확인 단어 '+L.length+'개</span></div>';
  if(!L.length)return h+'<div class="empty">틀린 단어가 없어요.</div>';
  h+='<p class="hint">선생님이 물어봤을 때 틀린 단어예요. 먼저 뜻을 떠올려 보고 확인해 보세요. 오답노트(H로드맵)에도 같이 있어요.</p><div class="card">';
  L.forEach(function(r){
    var id=r.w.toLowerCase(),o=swOpen['c'+id];
    h+='<div class="swr"><div class="swq"><span class="sa">'+esc(r.w)+'</span><span class="sb">'+(o?'<em>'+esc(r.m)+'</em>':'뜻은?')+'</span><small class="flag">'+r.c+'번 틀림</small><button data-a="rv" data-v="c'+esc(id)+'">'+(o?'가리기':'확인')+'</button></div></div>';
  });
  return h+'</div><a class="btn sec" style="display:block;text-align:center;text-decoration:none" href="https://nolbada.github.io/via/wn/">H로드맵 오답노트 열기</a>';
}
function sceneLine(t,cur){return esc(t).replace(/\[\[(\w+)\|([^\]]+)\]\]/g,function(m,w,k){return '<b class="wc'+(w.toLowerCase()===String(cur).toLowerCase()?' me':'')+'">'+w+'</b>('+k+')'})}
function vSw(){
  var L=swList(),sc={};
  (DATA.scenes||[]).forEach(function(c){(c.line.match(/\[\[\w+\|/g)||[]).forEach(function(m){sc[m.slice(2,-1).toLowerCase()]=c})});
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">바꿔 말하기 '+L.length+'개</span></div>';
  h+='<p class="hint">왼쪽 단어가 요약문에서 어떤 말로 바뀔까요? <b>소리 내어 말해 본 뒤</b> 확인을 눌러요.</p>';
  h+='<div class="tabs"><button data-a="rvall" data-v="open">모두 열기</button><button data-a="rvall" data-v="hide">모두 가리기</button></div><div class="card">';
  L.forEach(function(s){
    var o=swOpen[s.id],c=sc[s.form.toLowerCase()],on=swD['s'+s.id],fl=wrongOf(s.id);
    h+='<div class="swr"><div class="swq"><span class="sa">'+words(s.a)+(fl?'<small class="flag">'+fl+'번 틀림</small>':'')+'</span><span class="sb">'+(o?'<em>'+words(s.b)+'</em>'+esc(s.k):'→ ?')+'</span>'+sayBtn(s.a,'듣기')+(o?sayBtn(s.b,'정답 듣기'):'')+'<button data-a="rv" data-v="'+esc(s.id)+'">'+(o?'가리기':'확인')+'</button></div>';
    if(c)h+='<button class="acc2" data-a="dt" data-v="s'+esc(s.id)+'">'+esc(c.tag)+' 줄거리<span>'+(on?'접기':'펼치기')+'</span></button>'+(on?'<div class="story">'+sceneLine(c.line,s.form)+'</div>':'');
    h+='</div>';
  });
  return h+'</div><p class="sumline">시험에서는 본문 단어가 뜻이 같은 다른 단어로 바뀌어 나와요.</p>';
}
/* 자동 새로고침(기록 연동)이 일어나도 보던 문제로 되돌린다 */
try{var sv=JSON.parse(sessionStorage.getItem('vhyv')||'null');if(sv&&sv.p===location.pathname&&Date.now()-sv.t<600000&&sv.v&&sv.v!=='home'){view=sv.v;cur=sv.c||0;try{history.pushState({v:view},'');histPushed=true}catch(e){}}}catch(e){}
render();srvLoad();window.addEventListener('pageshow',srvLoad);
</script>
</body>
</html>
