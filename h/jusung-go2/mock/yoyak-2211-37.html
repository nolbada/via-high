var DATA={"meta": {"sch": "jusung-go2", "src": "jusung-go2/mock/sx-data.js", "pidx": 8, "lesson": "22년 11월 37번", "title": "", "label": "", "page": "yoyak-2211-37"}, "scenes": [{"tag": "본문 1~2번", "ns": [1, 2], "line": "호불호의 변화로 설명하는 건 [[problematic|문제가 많고]], 베이비 붐을 기호 탓으로 하면 입지가 [[unsound|불안정하다]].", "en": ["To an economist who succeeds in figuring out a person’s preference structure—understanding whether the satisfaction gained from consuming one good is greater than that of another—explaining behavior in terms of changes in underlying likes and dislikes is usually highly problematic.", "To argue, for instance, that the baby boom and then the baby bust resulted from an increase and then a decrease in the public’s inherent taste for children, rather than a change in relative prices against a background of stable preferences, places a social scientist in an unsound position."], "kos": ["한 사람의 선호도 구조를 알아내는 것, 즉 한 상품을 소비함으로써 얻는 만족도가 또 다른 상품을 소비함으로써 얻는 만족도보다 더 큰지를 이해하는 것에 성공한 경제학자에게는 행동을 기저에 있는 호불호의 변화의 관점에서 설명하는 것은 일반적으로 매우 문제가 많다.", "예를 들어, 베이비 붐과 그 후의 출산율의 급락이 안정된 선호도를 배경으로 한 상대적 가격의 변화보다는 아이에 대한 대중의 내재적인 기호의 증가와 그 후의 감소에서 비롯되었다고 주장하는 것은 사회 과학자를 불안정한 입지에 놓는다."]}, {"tag": "본문 3번", "ns": [3], "line": "그런 주장은 사망률도 죽음 욕구 탓이라는 말과 [[equivalent|같다]].", "en": ["In economics, such an argument about birth rates would be equivalent to saying that a rise and fall in mortality could be attributed to an increase in the inherent desire change for death."], "kos": ["경제학에서 출산율에 대한 그러한 주장은 사망률의 상승과 하락이 죽음에 대한 내재적 욕구 변화의 증가에 기인한다고 말하는 것과 같다."]}, {"tag": "본문 4번", "ns": [4], "line": "경제학자는 소득과 [[prices|가격]]의 변화를 본다.", "en": ["For an economist, changes in income and prices, rather than changes in tastes, affect birth rates."], "kos": ["경제학자에게는 기호의 변화보다는 소득과 물가의 변화가 출산율에 영향을 미친다."]}, {"tag": "본문 5번", "ns": [5], "line": "[[income|소득]]이 [[rises|오르면]] 욕구가 그대로 [[stays|유지돼도]] 자녀를 더 원한다.", "en": ["When income rises, for example, people want more children (or, as you will see later, more satisfaction derived from children), even if their inherent desire for children stays the same."], "kos": ["예를 들어, 소득이 증가할 때 사람들은 자녀에 대한 자신의 내재적 욕구가 그대로 유지되더라도 더 많은 자녀(또는 여러분이 나중에 알게 되겠지만, 아이로부터 오는 더 큰 만족감)를 원한다."]}], "story": [{"a": "problematic", "form": "problematic", "n": 1, "sq": 1, "sum": "find it [[troublesome]] to explain behavior", "hook": "호불호로 행동을 설명하는 건 문제라는 첫 문장의 problematic(문제가 많은) → 요약문에서는 troublesome(골치 아픈)으로 바꿨어요.", "b": "troublesome", "k": "문제가 많은 → 골치 아픈", "en": "To an economist who succeeds in figuring out a person’s preference structure—understanding whether the satisfaction gained from consuming one good is greater than that of another—explaining behavior in terms of changes in underlying likes and dislikes is usually highly problematic.", "ko": "한 사람의 선호도 구조를 알아내는 것, 즉 한 상품을 소비함으로써 얻는 만족도가 또 다른 상품을 소비함으로써 얻는 만족도보다 더 큰지를 이해하는 것에 성공한 경제학자에게는 행동을 기저에 있는 호불호의 변화의 관점에서 설명하는 것은 일반적으로 매우 문제가 많다."}, {"a": "unsound", "form": "unsound", "n": 2, "sq": 1, "sum": "in a [[shaky]] position", "hook": "베이비 붐을 기호 탓으로 하면 입지가 흔들린다는 문장의 unsound(불안정한) → 요약문에서는 shaky(흔들리는)로 바꿨어요.", "b": "shaky", "k": "불안정한 → 흔들리는", "en": "To argue, for instance, that the baby boom and then the baby bust resulted from an increase and then a decrease in the public’s inherent taste for children, rather than a change in relative prices against a background of stable preferences, places a social scientist in an unsound position.", "ko": "예를 들어, 베이비 붐과 그 후의 출산율의 급락이 안정된 선호도를 배경으로 한 상대적 가격의 변화보다는 아이에 대한 대중의 내재적인 기호의 증가와 그 후의 감소에서 비롯되었다고 주장하는 것은 사회 과학자를 불안정한 입지에 놓는다."}, {"a": "equivalent", "form": "equivalent", "n": 3, "sq": 2, "sum": "is [[comparable]] to blaming", "hook": "출산율 탓과 죽음 욕구 탓이 같은 꼴이라는 문장의 equivalent(같은) → 요약문에서는 comparable(비슷한)로 바꿨어요.", "b": "comparable", "k": "같은 → 비슷한", "en": "In economics, such an argument about birth rates would be equivalent to saying that a rise and fall in mortality could be attributed to an increase in the inherent desire change for death.", "ko": "경제학에서 출산율에 대한 그러한 주장은 사망률의 상승과 하락이 죽음에 대한 내재적 욕구 변화의 증가에 기인한다고 말하는 것과 같다."}, {"a": "price", "form": "prices", "n": 4, "sq": 2, "sum": "income and [[costs]] instead", "hook": "경제학자가 내세우는 소득과 가격에서 prices(가격) → 요약문에서는 costs(비용)로 바꿨어요.", "b": "costs", "k": "가격 → 비용", "en": "For an economist, changes in income and prices, rather than changes in tastes, affect birth rates.", "ko": "경제학자에게는 기호의 변화보다는 소득과 물가의 변화가 출산율에 영향을 미친다."}, {"a": "income", "form": "income", "n": 5, "sq": 3, "sum": "When people's [[earnings]] grow", "hook": "소득이 오르면 자녀를 더 원한다는 문장의 income(소득) → 요약문에서는 earnings(수입)로 바꿨어요.", "b": "earnings", "k": "소득 → 수입", "en": "When income rises, for example, people want more children (or, as you will see later, more satisfaction derived from children), even if their inherent desire for children stays the same.", "ko": "예를 들어, 소득이 증가할 때 사람들은 자녀에 대한 자신의 내재적 욕구가 그대로 유지되더라도 더 많은 자녀(또는 여러분이 나중에 알게 되겠지만, 아이로부터 오는 더 큰 만족감)를 원한다."}, {"a": "rise", "form": "rises", "n": 5, "sq": 3, "sum": "earnings [[grow]]", "hook": "소득이 오른다는 rises(오르다) → 요약문에서는 grow(늘다)로 바꿨어요.", "b": "grow", "k": "오르다 → 늘다", "en": "When income rises, for example, people want more children (or, as you will see later, more satisfaction derived from children), even if their inherent desire for children stays the same.", "ko": "예를 들어, 소득이 증가할 때 사람들은 자녀에 대한 자신의 내재적 욕구가 그대로 유지되더라도 더 많은 자녀(또는 여러분이 나중에 알게 되겠지만, 아이로부터 오는 더 큰 만족감)를 원한다."}, {"a": "stay", "form": "stays", "n": 5, "sq": 3, "sum": "desire for children is [[unchanged]]", "hook": "욕구가 그대로 유지된다는 stays the same → 요약문에서는 unchanged(변하지 않은)로 바꿨어요.", "b": "remain", "k": "머무르다 → 그대로이다", "en": "When income rises, for example, people want more children (or, as you will see later, more satisfaction derived from children), even if their inherent desire for children stays the same.", "ko": "예를 들어, 소득이 증가할 때 사람들은 자녀에 대한 자신의 내재적 욕구가 그대로 유지되더라도 더 많은 자녀(또는 여러분이 나중에 알게 되겠지만, 아이로부터 오는 더 큰 만족감)를 원한다."}], "passage": [{"n": 1, "en": "To an economist who succeeds in figuring out a person’s preference structure—understanding whether the satisfaction gained from consuming one good is greater than that of another—explaining behavior in terms of changes in underlying likes and dislikes is usually highly problematic.", "ko": "한 사람의 선호도 구조를 알아내는 것, 즉 한 상품을 소비함으로써 얻는 만족도가 또 다른 상품을 소비함으로써 얻는 만족도보다 더 큰지를 이해하는 것에 성공한 경제학자에게는 행동을 기저에 있는 호불호의 변화의 관점에서 설명하는 것은 일반적으로 매우 문제가 많다."}, {"n": 2, "en": "To argue, for instance, that the baby boom and then the baby bust resulted from an increase and then a decrease in the public’s inherent taste for children, rather than a change in relative prices against a background of stable preferences, places a social scientist in an unsound position.", "ko": "예를 들어, 베이비 붐과 그 후의 출산율의 급락이 안정된 선호도를 배경으로 한 상대적 가격의 변화보다는 아이에 대한 대중의 내재적인 기호의 증가와 그 후의 감소에서 비롯되었다고 주장하는 것은 사회 과학자를 불안정한 입지에 놓는다."}, {"n": 3, "en": "In economics, such an argument about birth rates would be equivalent to saying that a rise and fall in mortality could be attributed to an increase in the inherent desire change for death.", "ko": "경제학에서 출산율에 대한 그러한 주장은 사망률의 상승과 하락이 죽음에 대한 내재적 욕구 변화의 증가에 기인한다고 말하는 것과 같다."}, {"n": 4, "en": "For an economist, changes in income and prices, rather than changes in tastes, affect birth rates.", "ko": "경제학자에게는 기호의 변화보다는 소득과 물가의 변화가 출산율에 영향을 미친다."}, {"n": 5, "en": "When income rises, for example, people want more children (or, as you will see later, more satisfaction derived from children), even if their inherent desire for children stays the same.", "ko": "예를 들어, 소득이 증가할 때 사람들은 자녀에 대한 자신의 내재적 욕구가 그대로 유지되더라도 더 많은 자녀(또는 여러분이 나중에 알게 되겠지만, 아이로부터 오는 더 큰 만족감)를 원한다."}], "questions": [{"id": 1, "summary": "Economists find it (A) to explain behavior by shifts in people's basic likes and dislikes, so explaining the baby boom as a change in taste for children leaves a researcher in a (B) position.", "ko": "경제학자는 행동을 사람들의 기본적인 호불호 변화로 설명하는 것이 <b>(A) 문제가 많다고</b> 보고, 베이비 붐을 아이에 대한 기호의 변화로 설명하면 연구자가 <b>(B) 불안정한</b> 입지에 놓인다.", "opts": [["troublesome", "shaky"], ["troublesome", "secure"], ["reasonable", "shaky"], ["reasonable", "secure"], ["simple", "stable"]], "optko": ["문제가 많은 – 불안정한", "문제가 많은 – 안정된", "합리적인 – 불안정한", "합리적인 – 안정된", "간단한 – 안정적인"], "ans": 0, "wrong": [null, "secure(안정된)가 틀려요. 본문은 연구자를 불안정한(unsound) 입지에 놓는다고 해요.", "reasonable(합리적인)이 틀려요. 기호 변화로 설명하는 건 합리적인 게 아니라 문제가 많다(problematic)고 해요.", "둘 다 틀려요. 합리적이지도 않고 안정되지도 않아요. 본문은 둘 다 부정적으로 말해요.", "둘 다 틀려요. 간단하다는 말도, 안정적이라는 말도 본문과 반대예요."], "evid": [{"n": 1, "hl": ["explaining behavior in terms of changes in underlying likes and dislikes", "usually highly problematic"]}, {"n": 2, "hl": ["inherent taste for children", "unsound position"]}], "swaps": [["problematic", "troublesome", "문제가 많은 → 골치 아픈"], ["unsound", "shaky", "불안정한 → 흔들리는"], ["underlying", "basic", "기저에 있는 → 기본적인"]], "swapnote": "problematic(문제가 많은)은 troublesome(골치 아픈)으로, unsound(불안정한)는 shaky(흔들리는)로 바뀌었어요. 둘 다 '좋지 않다'는 느낌이에요.", "use": [{"w": "troublesome", "ex": "A troublesome problem can take a long time to solve.", "ko": "골치 아픈 문제는 푸는 데 오래 걸릴 수 있다.", "wk": "골치 아픈, 문제가 많은", "hk": "골치 아픈"}, {"w": "shaky", "ex": "The old bridge looks shaky.", "ko": "그 낡은 다리는 흔들려 보인다.", "wk": "흔들리는, 불안정한", "hk": "흔들려"}], "flow": "본문 1번에서 호불호(좋고 싫음)의 변화로 행동을 설명하는 건 문제라고 말하고 → 2번에서 for instance(예를 들어)로 베이비 붐 예를 들며 그렇게 주장하면 입지가 불안정해진다고 이어요.", "jd": [["Economists find it [[troublesome]]", "경제학자들은 [[문제가 많다고]] 본다"], ["to explain behavior", "행동을 설명하는 것이"], ["by shifts in people's basic likes and dislikes,", "사람들의 기본적인 호불호의 변화로,"], ["so explaining the baby boom", "그래서 베이비 붐을 설명하는 것은"], ["as a change in taste for children", "아이에 대한 기호의 변화로"], ["leaves a researcher in a [[shaky]] position.", "연구자를 [[불안정한]] 입지에 놓는다."]], "fc": [["본문 1번", "호불호 변화로 설명하면 문제", "행동을 '좋아함·싫어함이 바뀌어서'라고 설명하는 건 골치 아파요."], ["본문 2번", "베이비 붐을 기호 탓으로 하면 흔들린다", "아이를 좋아하는 마음이 변했다는 주장은 불안정한 입지예요."], ["정답 포인트", "{{problematic|문제가 많은}} = {{troublesome|골치 아픈}}, {{unsound|불안정한}} = {{shaky|흔들리는}}", "어려운 말을 쉬운 말로 바꿔 읽어요."]], "evid_full": [{"en": "To an economist who succeeds in figuring out a person’s preference structure—understanding whether the satisfaction gained from consuming one good is greater than that of another—explaining behavior in terms of changes in underlying likes and dislikes is usually highly problematic.", "ko": "한 사람의 선호도 구조를 알아내는 것, 즉 한 상품을 소비함으로써 얻는 만족도가 또 다른 상품을 소비함으로써 얻는 만족도보다 더 큰지를 이해하는 것에 성공한 경제학자에게는 행동을 기저에 있는 호불호의 변화의 관점에서 설명하는 것은 일반적으로 매우 문제가 많다.", "hl": ["explaining behavior in terms of changes in underlying likes and dislikes", "usually highly problematic"], "hlko": ["행동을 기저에 있는 호불호의 변화의 관점에서 설명하는 것은", "일반적으로 매우 문제가 많다"], "n": 1}, {"en": "To argue, for instance, that the baby boom and then the baby bust resulted from an increase and then a decrease in the public’s inherent taste for children, rather than a change in relative prices against a background of stable preferences, places a social scientist in an unsound position.", "ko": "예를 들어, 베이비 붐과 그 후의 출산율의 급락이 안정된 선호도를 배경으로 한 상대적 가격의 변화보다는 아이에 대한 대중의 내재적인 기호의 증가와 그 후의 감소에서 비롯되었다고 주장하는 것은 사회 과학자를 불안정한 입지에 놓는다.", "hl": ["inherent taste for children", "unsound position"], "hlko": ["아이에 대한 대중의 내재적인 기호", "불안정한 입지"], "n": 2}]}, {"id": 2, "summary": "Blaming birth rates on changing tastes is (A) to blaming changing death rates on a growing wish to die, so economists point to changes in income and (B) instead.", "ko": "출산율을 기호의 변화 탓으로 돌리는 것은 사망률 변화를 죽고 싶은 마음이 커진 탓으로 돌리는 것과 <b>(A) 비슷해서</b>, 경제학자는 소득과 <b>(B) 비용</b>의 변화를 대신 든다.", "opts": [["comparable", "tastes"], ["opposite", "costs"], ["comparable", "costs"], ["unrelated", "ages"], ["opposite", "tastes"]], "optko": ["비슷한 – 기호", "정반대인 – 비용", "비슷한 – 비용", "관련 없는 – 나이", "정반대인 – 기호"], "ans": 2, "wrong": ["tastes(기호)가 틀려요. 경제학자는 기호 대신 소득과 가격(비용)의 변화를 내세워요.", "opposite(정반대인)가 틀려요. 본문은 두 주장이 같다(equivalent)고 말해요.", null, "둘 다 틀려요. 두 주장은 관련 없는 게 아니라 같은 꼴이고, 나이 이야기는 본문에 없어요.", "둘 다 틀려요. 두 주장은 정반대가 아니라 같은 꼴이고, 경제학자는 기호로 설명하지 않아요."], "evid": [{"n": 3, "hl": ["equivalent to saying", "inherent desire change for death"]}, {"n":   else if(act==='rvall'){var o=v==='open';swList().forEach(function(s){if(o){swOpen[s.id]=true;pushSw(s.id)}else delete swOpen[s.id]});render()}
  else if(act==='dt'){swD[v]=!swD[v];render()}
  else if(act==='rv'){swOpen[v]=!swOpen[v];if(swOpen[v])pushSw(v);render()}
  else if(act==='mean'){var m=document.getElementById('m_'+v);if(m)m.style.display=m.style.display==='block'?'none':'block'}
});
function pick(i){
  var q=Qs[cur];if(PR.a[q.id]!==undefined)return;
  PR.a[q.id]=i;jset(K_PROG,PR);recordYy(q,i);render();
}
/* 점수 기록: vhy:<학교> = {<페이지>:{<문제>:{n:푼 횟수,w:틀린 횟수,k:마지막 정답(1/0),c:고른 번호,t:시각}}} -> REC 로 자동 연동(선생님 화면) */
function recordYy(q,i){
  try{
    var K='vhy:'+SCH,P=location.pathname.split('/').slice(-2).join('/'),Y=jget(K,{});
    var pg=Y[P]||(Y[P]={}),e=pg[q.id]||(pg[q.id]={n:0,w:0});
    e.n=(e.n||0)+1;if(i!==q.ans)e.w=(e.w||0)+1;e.k=(i===q.ans?1:0);e.c=i;e.t=Date.now();
    jset(K,Y);
  }catch(x){}
  /* 바꿔 말하기 단어는 푼 즉시 모두 선생님 질문 목록에 올린다 */
  try{swList().forEach(function(s){pushSw(s.id)})}catch(x){}
}


function jdHtml(q){
  var h='<div class="sl">';
  q.jd.forEach(function(c){
    var en=c[0].split(/(\[\[.*?\]\])/).map(function(s){var m=s.match(/^\[\[(.*)\]\]$/);return m?'<mark>'+words(m[1])+'</mark>':words(s)}).join('');
    var ko=c[1].split(/(\[\[.*?\]\])/).map(function(s){var m=s.match(/^\[\[(.*)\]\]$/);return m?'<mark>'+esc(m[1])+'</mark>':esc(s)}).join('');
    h+='<div class="r"><b>'+en+'</b><span>'+ko+'</span></div>';
  });
  return h+'</div>';
}
function pushSw(id){
  if(String(id).indexOf('c')===0&&!/^sw:/.test(id))return;
  var s=swList().filter(function(x){return x.id===id})[0];if(!s||PUSHED[id])return;
  PUSHED[id]=1;jset('vhvs:'+SCH,PUSHED);
  try{WN.add([{w:s.a,m:s.k+' → '+s.b,src:SRC,how:'바꿔 말하기',ask:true}])}catch(e){}
}
function swList(){return (DATA.story||[]).map(function(s){return {a:s.a,form:s.form,b:s.b,k:s.k,id:'sw:'+s.a.toLowerCase(),n:s.n,sq:s.sq,sum:s.sum,hook:s.hook,en:s.en,ko:s.ko}})}
function hlWord(t,w){return t.split(new RegExp('(\\b'+w+'\\b)','i')).map(function(x,i){return i%2?'<mark>'+esc(x)+'</mark>':words(x)}).join('')}
function hlSum(t){return t.split(/(\[\[.*?\]\])/).map(function(x){var m=x.match(/^\[\[(.*)\]\]$/);return m?'<mark>'+words(m[1])+'</mark>':words(x)}).join('')}
var swOpen={},swD={};
/* 화면 */
function render(){
  var h='';
  if(view==='home')h=vHome();else if(view==='q')h=vQ();else if(view==='res')h=vRes();else if(view==='notes')h=vNotes();else if(view==='sw')h=vSw();else if(view==='chk')h=vChk();else h=vHome();
  var y=window.pageYOffset||0;
  $('app').innerHTML=h;
  if(!window.__goTop)window.scrollTo(0,y);
}
function yyLine(){
  try{var Y=jget('vhy:'+SCH,{}),pg=Y[location.pathname.split('/').slice(-2).join('/')]||{},n=0,r=0,w=0;
    Qs.forEach(function(q){var e=pg[q.id];if(e&&e.n){n++;if(e.k)r++;w+=e.w||0}});
    if(!n)return '';
    return '<p class="sub">내 기록: '+n+'문제 중 '+r+'문제 정답'+(w?' · 틀린 횟수 '+w+'번':'')+'</p>';
  }catch(x){return ''}
}
function vHome(){
  var d=doneCount(),f=firstOpen();
  var h='<a class="tag" href="../index.html" style="text-decoration:none">목록</a><h1>'+DATA.meta.lesson+' '+esc(DATA.meta.title)+'</h1><p class="sub">요약문 연습 '+DATA.meta.label+' · '+Qs.length+'문제</p><div class="nums">';
  Qs.forEach(function(q,i){var a=PR.a[q.id];h+='<button class="nb '+(a===undefined?'':(a===q.ans?'o':'x'))+'" data-a="q" data-v="'+i+'">'+(i+1)+'</button>'});
  h+='</div>';
  h+=yyLine();
  h+='<button class="btn pri" data-a="resume">'+(d===0?'시작하기':(f<0?'결과 보기':'이어서 풀기 ('+d+' / '+Qs.length+')'))+'</button>';
  h+='<button class="btn sec" data-a="notes">단어노트 '+nNotes()+'개</button><button class="btn sec" data-a="sw">바꿔 말하기 연습</button>'+(nFlag()?'<button class="btn flagbtn" data-a="chk">선생님 확인 단어 '+nFlag()+'개</button>':'');
  h+='<div class="foot"><button data-a="reset">문제 다시 풀기</button></div>';
  return h;
}
function vQ(){
  var q=Qs[cur],a=PR.a[q.id],done=a!==undefined;curQ=q.id;
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">'+(cur+1)+' / '+Qs.length+'</span></div>';
  if(!done)h+='<p class="hint">밑줄 단어를 누르면 뜻이 나와요. 번호를 누르면 답을 골라요.</p>';
  h+='<div class="card sum">'+sumHtml(q,done)+'</div><div class="opts">';
  q.opts.forEach(function(o,i){
    var cls='opt'+(done?' lock':'');
    if(done){if(i===q.ans)cls+=' right';else if(i===a)cls+=' mine'}
    h+='<div class="'+cls+'"'+(done?'':' data-a="pick" data-v="'+i+'"')+'><span class="num">'+CN[i]+'</span><span class="ot">'+words(o[0])+'<span class="dash">–</span>'+words(o[1])+'</span>'+(done&&i===q.ans?'<span class="st">정답</span>':(done&&i===a?'<span class="st">내 답</span>':''))+'</div>';
  });
  h+='</div>';
  if(done){
    var ok=a===q.ans;
    h+='<div id="exp"><div class="card"><div class="row"><span class="badge">'+(cur+1)+'번</span><span class="chip">정답 '+CN[q.ans]+'</span><span class="msg '+(ok?'o':'x')+'">'+(ok?'맞았어요':'내 답 '+CN[a])+'</span></div>';
    h+='</div><div class="card"><p class="lb">직독직해 (끊어서 앞에서부터 이해해요)</p>'+jdHtml(q)+'<details><summary>자연스러운 해석 보기</summary><div class="ko">'+q.ko.replace(/\((A|B)\)\s*/g,'')+'</div></details></div>';
    h+='<div class="card"><p class="lb">보기 뜻</p><ul class="opl">';
    q.opts.forEach(function(o,i){h+='<li class="'+(i===q.ans?'a':'')+'">'+CN[i]+' '+(i===q.ans?'<mark>'+words(o[0])+' – '+words(o[1])+'</mark>':words(o[0])+' – '+words(o[1]))+'<span class="k">'+(i===q.ans?'<mark>'+esc(q.optko[i])+'</mark>  ← 정답':esc(q.optko[i]))+'</span></li>'});
    h+='</ul></div>';
    h+='<div class="card"><p class="lb">정답의 근거 · 본문 '+q.evid_full.map(function(e){return e.n+'번'}).join(', ')+'</p>';
    q.evid_full.forEach(function(e){h+='<div class="ev"><div class="en">'+rich(e.en,e.hl)+'</div><div class="kk">'+richKo(e.ko,e.hlko)+'</div></div>'});
    h+='</div>';
    h+='<div class="card"><p class="lb">이 단어, 이렇게 바뀌었어요</p>';
    q.swaps.forEach(function(s){h+='<div class="swap"><span class="a">'+words(s[0])+'</span><span class="arr">→</span><span class="b">'+words(s[1])+'</span><span class="ds">'+esc(s[2])+(/\s/.test(s[0])||/\s/.test(s[1])?'':' '+sayBtn(s[0],'듣기')+' '+sayBtn(s[1],'듣기'))+'</span></div>'});
    h+='<div class="note">'+esc(q.swapnote)+'</div></div>';
    h+='<div class="card"><p class="lb">쓰임 익히기</p><div class="use">';
    q.use.forEach(function(u){h+='<div class="u"><div class="uw">'+esc(u.w)+'<small class="uwk">('+esc(u.wk)+')</small></div><div class="ue">'+useEx(u)+'</div><div class="uk">'+esc(u.ko).replace(esc(u.hk),'<mark>'+esc(u.hk)+'</mark>')+'</div></div>'});
    h+='</div></div>';
    h+='<div class="card"><p class="lb">기억할 흐름</p><div class="fc">'+q.fc.map(function(c,i){return (i?'<div class="ar">▼</div>':'')+'<div class="c'+(i===q.fc.length-1?' last':'')+'"><span class="tg">'+esc(c[0])+'</span><div class="hd">'+mk(c[1])+'</div><div class="sb2">'+mk(c[2])+'</div></div>'}).join('')+'</div></div>';
    h+='<div class="card"><details><summary>다른 보기는 왜 아닐까요</summary><ul style="padding:0;margin:6px 0 0">';
    q.wrong.forEach(function(w,i){if(w)h+='<li><b>'+CN[i]+'</b> '+hlp(w)+'</li>'});
    h+='</ul></details></div>';
    h+='<button class="btn pri" data-a="next">'+(cur<Qs.length-1?'다음 문제':'결과 보기')+'</button></div>';
  }
  return h;
}
function vRes(){
  var h='<div class="top"><button class="back" data-a="home">목록</button></div><h1>'+Qs.length+'문제 중 '+okCount()+'문제 맞았어요</h1>';
  h+='<div class="nums">';
  Qs.forEach(function(q,i){var a=PR.a[q.id];h+='<button class="nb '+(a===undefined?'':(a===q.ans?'o':'x'))+'" data-a="q" data-v="'+i+'">'+(i+1)+'</button>'});
  h+='</div><p class="sub">단어노트에 '+nNotes()+'개가 쌓였어요.</p>';
  h+='<button class="btn pri" data-a="notes">단어노트 보기</button><button class="btn sec" data-a="reset">문제 다시 풀기</button><button class="btn sec" data-a="home">목록으로</button>';
  return h;
}
function sortedNotes(){return Object.keys(NOTES).map(function(k){return NOTES[k]}).sort(function(a,b){return b.t-a.t})}
function vNotes(){
  var L=sortedNotes();
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">단어노트 '+L.length+'개</span></div>';
  if(!L.length)return h+'<div class="empty">밑줄 단어를 누르면 여기에 쌓여요.</div>';
  h+='<div class="card"><ul class="wl">';
  L.forEach(function(n){h+='<li><span class="lw">'+esc(n.l)+'</span><span class="lm">'+esc(n.k)+'</span>'+(n.c>1?'<span class="lc">'+n.c+'번</span>':'')+'</li>'});
  return h+'</ul></div>';
}
function sk(id){return id.indexOf('sw:')===0?id.slice(3):id}
function wrongOf(id){var r=SRV[sk(id).toLowerCase()];return r&&r.c>0?r.c:0}
function flagList(){return Object.keys(SRV).map(function(k){return SRV[k]}).filter(function(r){return r.c>0}).sort(function(a,b){return b.c-a.c})}
function nFlag(){return flagList().length}
function srvLoad(){
  try{WN.list().then(function(r){
    if(!r||!r.ok||!r.items)return;SRV={};
    r.items.forEach(function(i){if(String(i.src||'').indexOf(SRC)>=0)SRV[String(i.w).toLowerCase()]={w:i.w,m:i.m,c:i.c||0}});
    if(view==='home'||view==='chk'||view==='sw')render();
  })}catch(e){}
}
function vChk(){
  var L=flagList();
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">선생님 확인 단어 '+L.length+'개</span></div>';
  if(!L.length)return h+'<div class="empty">틀린 단어가 없어요.</div>';
  h+='<p class="hint">선생님이 물어봤을 때 틀린 단어예요. 먼저 뜻을 떠올려 보고 확인해 보세요. 오답노트(H로드맵)에도 같이 있어요.</p><div class="card">';
  L.forEach(function(r){
    var id=r.w.toLowerCase(),o=swOpen['c'+id];
    h+='<div class="swr"><div class="swq"><span class="sa">'+esc(r.w)+'</span><span class="sb">'+(o?'<em>'+esc(r.m)+'</em>':'뜻은?')+'</span><small class="flag">'+r.c+'번 틀림</small><button data-a="rv" data-v="c'+esc(id)+'">'+(o?'가리기':'확인')+'</button></div></div>';
  });
  return h+'</div><a class="btn sec" style="display:block;text-align:center;text-decoration:none" href="https://nolbada.github.io/via/wn/">H로드맵 오답노트 열기</a>';
}
function sceneLine(t,cur){return esc(t).replace(/\[\[(\w+)\|([^\]]+)\]\]/g,function(m,w,k){return '<b class="wc'+(w.toLowerCase()===String(cur).toLowerCase()?' me':'')+'">'+w+'</b>('+k+')'})}
function vSw(){
  var L=swList(),sc={};
  (DATA.scenes||[]).forEach(function(c){(c.line.match(/\[\[\w+\|/g)||[]).forEach(function(m){sc[m.slice(2,-1).toLowerCase()]=c})});
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">바꿔 말하기 '+L.length+'개</span></div>';
  h+='<p class="hint">왼쪽 단어가 요약문에서 어떤 말로 바뀔까요? <b>소리 내어 말해 본 뒤</b> 확인을 눌러요.</p>';
  h+='<div class="tabs"><button data-a="rvall" data-v="open">모두 열기</button><button data-a="rvall" data-v="hide">모두 가리기</button></div><div class="card">';
  L.forEach(function(s){
    var o=swOpen[s.id],c=sc[s.form.toLowerCase()],on=swD['s'+s.id],fl=wrongOf(s.id);
    h+='<div class="swr"><div class="swq"><span class="sa">'+words(s.a)+(fl?'<small class="flag">'+fl+'번 틀림</small>':'')+'</span><span class="sb">'+(o?'<em>'+words(s.b)+'</em>'+esc(s.k):'→ ?')+'</span>'+sayBtn(s.a,'듣기')+(o?sayBtn(s.b,'정답 듣기'):'')+'<button data-a="rv" data-v="'+esc(s.id)+'">'+(o?'가리기':'확인')+'</button></div>';
    if(c)h+='<button class="acc2" data-a="dt" data-v="s'+esc(s.id)+'">'+esc(c.tag)+' 줄거리<span>'+(on?'접기':'펼치기')+'</span></button>'+(on?'<div class="story">'+sceneLine(c.line,s.form)+'</div>':'');
    h+='</div>';
  });
  return h+'</div><p class="sumline">시험에서는 본문 단어가 뜻이 같은 다른 단어로 바뀌어 나와요.</p>';
}
/* 자동 새로고침(기록 연동)이 일어나도 보던 문제로 되돌린다 */
try{var sv=JSON.parse(sessionStorage.getItem('vhyv')||'null');if(sv&&sv.p===location.pathname&&Date.now()-sv.t<600000&&sv.v&&sv.v!=='home'){view=sv.v;cur=sv.c||0;try{history.pushState({v:view},'');histPushed=true}catch(e){}}}catch(e){}
render();srvLoad();window.addEventListener('pageshow',srvLoad);
</script>
</body>
</html>
