var D={"n": "3", "title": "3과 The True Art Lovers", "parts": [["❶", "본문 ❶"], ["❷", "본문 ❷"], ["❸", "본문 ❸"], ["❹", "본문 ❹"]], "groups": [{"part": "❶", "title": "도슨트 Isabel의 인사", "flow": "도슨트 Isabel이 인사하며, 인생의 역경 속에서도 예술을 포기하지 않았던 세 명의 예술가를 만나 보겠다고 소개해요.", "items": [{"en": "Isabel is welcoming visitors to the Dream Art Gallery.", "ans": "T", "ko": "Isabel은 드림 아트 갤러리에 온 방문객들을 환영하고 있다.", "eve": "Welcome to the Dream Art Gallery!", "evk": "드림 아트 갤러리에 오신 것을 환영합니다!", "why": "본문의 맨 첫 문장이에요. 도슨트가 방문객에게 인사하면서 글이 시작된다는 것부터 기억해 두세요."}, {"en": "Isabel is one of the artists whose paintings are displayed in the From Shadows to Spotlights exhibit.", "ans": "F", "ko": "Isabel은 〈그림자에서 빛으로〉 전시회에 작품이 걸린 예술가 중 한 명이다.", "eve": "I'm Isabel Williams, the docent for the From Shadows to Spotlights exhibit.", "evk": "저는 〈그림자에서 빛으로〉 전시회의 도슨트인 Isabel Williams입니다.", "why": "Isabel은 그림을 그린 화가가 아니라 **도슨트(docent, 전시 안내·해설을 하는 사람)**예요. 그림을 그린 사람이 아니라 그림을 소개해 주는 사람이죠. 화가는 뒤에 나오는 Traylor, Lewis, Ancher 세 명이에요."}, {"en": "Isabel is the docent for the exhibit titled From Shadows to Spotlights.", "ans": "T", "ko": "Isabel은 〈그림자에서 빛으로〉라는 제목의 전시회의 도슨트이다.", "eve": "I'm Isabel Williams, the docent for the From Shadows to Spotlights exhibit.", "evk": "저는 〈그림자에서 빛으로〉 전시회의 도슨트인 Isabel Williams입니다.", "why": "바로 앞 문장과 짝이에요. 앞 문장은 '화가'라서 틀렸고, 이 문장은 '도슨트'라서 맞아요. 이 글에서 말하는 사람 = 도슨트 Isabel이라고 정리해 두면 돼요."}, {"en": "Visitors at the Dream Art Gallery will meet three amazing artists today.", "ans": "T", "ko": "오늘 드림 아트 갤러리의 방문객들은 놀라운 예술가 세 명을 만나게 된다.", "eve": "Today, you're going to meet three amazing artists...", "evk": "오늘 여러분은 세 명의 놀라운 예술가들을 만나게 될 것입니다...", "why": "be going to + 동사원형은 '~할 예정이다'라는 뜻이라서, 오늘 앞으로 세 명의 예술가를 차례로 소개하겠다는 안내가 돼요. 숫자 three(세 명)도 기억하세요. 뒤에 정확히 세 명이 나옵니다."}, {"en": "Isabel is introducing three artists who easily succeeded without any difficulties.", "ans": "F", "ko": "Isabel은 어려움 없이 쉽게 성공한 세 예술가를 소개하고 있다.", "eve": "...three amazing artists who never gave up on their art, despite challenges in their lives", "evk": "...인생의 역경에도 불구하고 자신의 예술을 결코 포기하지 않았던 세 명의 놀라운 예술가들", "why": "본문의 세 사람은 '쉽게 성공한 사람'이 아니라 **'역경(challenges)이 있었는데도 포기하지 않은 사람'**이에요. despite는 '~에도 불구하고'라서, 어려움이 있었다는 뜻이 이미 들어 있어요. 'easily / without any difficulties'로 바뀌면 본문과 정반대입니다."}, {"en": "The three artists introduced today never gave up on their art despite hardships in their lives.", "ans": "T", "ko": "오늘 소개되는 세 예술가는 삶 속의 어려움에도 불구하고 자신의 예술을 포기하지 않았다.", "eve": "...never gave up on their art, despite challenges in their lives", "evk": "...인생의 역경에도 불구하고 자신의 예술을 결코 포기하지 않았던", "why": "바로 앞 문장과 짝이에요. 'never gave up ... despite challenges'를 hardships(고난)로 바꿔 쓴 맞는 문장이죠. 이 문장이 3과 전체의 한 줄 주제예요: **역경을 이겨 낸 세 예술가**."}]}, {"part": "❶", "title": "세 예술가의 공통점과 다음 이야기", "flow": "각 예술가에게는 독특한 화풍과, 작품을 높이 평가받게 만든 이야기가 있어요. 이제 한 명씩 삶과 작품을 살펴보자고 하며 다음 소단락으로 넘어가요.", "items": [{"en": "The three artists share similar painting styles and stories that made their work valued.", "ans": "F", "ko": "세 예술가는 비슷한 화풍과, 작품이 가치를 인정받게 해 준 비슷한 이야기를 가지고 있다.", "eve": "Each artist has a unique painting style and story...", "evk": "각 예술가에게는 독특한 화풍과 이야기가 있습니다...", "why": "본문은 '각자 **독특한(unique)**' 화풍과 이야기예요. 이 문장은 '비슷한(similar)'으로 바꿔 놓았어요. unique(독특한)와 similar(비슷한)는 반대 느낌이라는 것만 잡으면 바로 찾을 수 있어요."}, {"en": "Each artist’s work displays a distinctive painting style.", "ans": "T", "ko": "각 예술가의 작품은 독특한 화풍을 보여 준다.", "eve": "Each artist has a unique painting style...", "evk": "각 예술가에게는 독특한 화풍이 있습니다...", "why": "unique(독특한)를 distinctive(독특한)로 바꿔 쓴 문장이에요. 단어만 바뀌고 뜻은 같아서 맞는 문장이에요. 시험에서는 이렇게 같은 뜻을 다른 단어로 바꿔 쓰는 방식이 자주 나와요."}, {"en": "Each artist’s personal story has made their work very valuable.", "ans": "T", "ko": "각 예술가의 개인적인 이야기가 그들의 작품을 매우 가치 있게 만들었다.", "eve": "...story that has made their work highly valued", "evk": "...그들의 작품을 높이 평가받게 만들어 온 이야기", "why": "highly valued(높이 평가받는)를 very valuable(매우 가치 있는)로 풀어 쓴 맞는 문장이에요. 이야기가 있어서 작품이 더 높이 평가받게 되었다는 점이 핵심이에요. 현재완료 has made는 '지금까지 그렇게 되어 왔다'는 느낌이에요."}, {"en": "Isabel is inviting the audience to explore each artist’s life and artwork.", "ans": "T", "ko": "Isabel은 청중에게 각 예술가의 삶과 작품을 함께 살펴보자고 권하고 있다.", "eve": "Let's explore each artist's life and artwork.", "evk": "각 예술가의 삶과 작품을 함께 살펴봅시다.", "why": "Let's + 동사원형은 '~합시다'라는 제안이에요. 이 문장이 인사말에서 첫 번째 예술가 소개로 넘어가는 다리 역할을 해요. 이다음부터 한 명씩 '삶(life)'과 '작품(artwork)'을 순서대로 소개해요."}]}, {"part": "❷", "title": "노예로 태어난 Traylor의 어린 시절", "flow": "첫 번째 예술가 Bill Traylor는 노예로 태어나 목화 농장에서 일하며 어린 시절을 보냈어요. 남북전쟁 이후 자유의 몸이 되었지만 인종차별과 매우 낮은 임금은 여전했어요.", "items": [{"en": "The docent is introducing Bill Traylor as the first artist.", "ans": "T", "ko": "도슨트는 첫 번째 예술가로 Bill Traylor를 소개하고 있다.", "eve": "The first artist we're going to examine is Bill Traylor.", "evk": "우리가 살펴볼 첫 번째 예술가는 Bill Traylor입니다.", "why": "소단락 ❷의 첫 문장이에요. 소개 순서는 Traylor(첫 번째) → Maud Lewis → Anna Ancher(마지막)예요."}, {"en": "Traylor was born as the son of a wealthy farm owner and enjoyed a rich childhood.", "ans": "F", "ko": "Traylor는 부유한 농장 주인의 아들로 태어나 풍요로운 어린 시절을 보냈다.", "eve": "Traylor was born into slavery in the U.S. in 1853 and spent his early life working on a cotton farm in Alabama.", "evk": "Traylor는 1853년 미국에서 노예로 태어나 앨라배마의 목화 농장에서 일하며 어린 시절을 보냈습니다.", "why": "Traylor는 부유한 집 아들이 아니라 **노예(slavery)로 태어났어요.** 어린 시절도 풍요롭게 논 것이 아니라 목화 농장에서 일하며 보냈죠. 이 소단락은 '가장 낮은 곳에서 시작한 사람'이라는 느낌으로 읽으면 기억하기 쉬워요."}, {"en": "Born into slavery, Traylor spent his childhood working on a cotton farm.", "ans": "T", "ko": "노예로 태어난 Traylor는 어린 시절을 목화 농장에서 일하며 보냈다.", "eve": "...born into slavery... working on a cotton farm in Alabama", "evk": "...노예로 태어나... 앨라배마의 목화 농장에서 일하며", "why": "본문을 거의 그대로 옮긴 맞는 문장이에요. '노예로 태어남 → 목화 농장에서 일함'이 Traylor 이야기의 출발점이에요."}, {"en": "Traylor received high wages and equal treatment after becoming free.", "ans": "F", "ko": "Traylor는 자유의 몸이 된 후 높은 임금과 평등한 대우를 받았다.", "eve": "Although he became a free man after the American Civil War, he still had to face racial discrimination, working for very low wages on the farm.", "evk": "남북전쟁 이후 자유의 몸이 되었지만, 그는 농장에서 매우 낮은 임금을 받고 일하며 여전히 인종차별에 직면해야 했습니다.", "why": "Although(비록 ~이지만) 뒤에 **'그래도 여전히(still)'**가 이어지는 문장이에요. 자유의 몸이 되었지만 달라진 게 별로 없었다는 반전이죠. 그래서 '높은 임금과 평등한 대우'는 틀렸고, 본문은 '매우 낮은 임금(very low wages)'과 '인종차별(racial discrimination)'이에요."}, {"en": "Even as a free man, Traylor suffered racial discrimination and earned very low wages.", "ans": "T", "ko": "자유의 몸이 된 뒤에도 Traylor는 인종차별을 겪었고 매우 낮은 임금을 받았다.", "eve": "...he still had to face racial discrimination, working for very low wages on the farm", "evk": "...여전히 인종차별에 직면해야 했고, 농장에서 매우 낮은 임금을 받고 일했습니다", "why": "바로 앞 문장과 짝이에요. 앞 문장은 '높은 임금'이라 틀렸고, 이 문장은 '낮은 임금 + 차별'이라 맞아요. face는 '직면하다'라는 뜻으로, 피할 수 없이 마주했다는 느낌이에요."}]}, {"part": "❷", "title": "70세의 이주, 85세에 시작한 그림", "flow": "70세 무렵 몽고메리의 공장에서 일했고, 85세에 몸이 아파 일을 할 수 없게 되자 그제야 자신의 인생 경험을 표현하려고 그림으로 눈을 돌렸어요.", "items": [{"en": "At around 70 years old, Traylor moved to Montgomery and worked in a factory.", "ans": "T", "ko": "Traylor는 70세 무렵 몽고메리로 이주해 공장에서 일했다.", "eve": "Later, when he was around 70 years old, Traylor moved to the city of Montgomery, Alabama, where he found a job in a factory.", "evk": "이후 70세 무렵에 Traylor는 앨라배마주 몽고메리시로 이주했고, 그곳에서 공장에 일자리를 얻었습니다.", "why": "본문과 같은 내용이에요. 이야기의 흐름은 '농장(어린 시절) → 몽고메리의 공장(70세 무렵) → 그림(85세)'이에요. 뒤의 where는 '그곳에서'라는 뜻으로 몽고메리를 받아 줘요."}, {"en": "Traylor started drawing actively from a young age while working in a factory.", "ans": "F", "ko": "Traylor는 공장에서 일하면서 어릴 때부터 적극적으로 그림을 그리기 시작했다.", "eve": "It wasn't until he was 85 years old and became too ill to work that he turned to drawing...", "evk": "그가 85세가 되고 몸이 너무 아파 일할 수 없게 된 후에야 그는 그림으로 눈을 돌렸습니다...", "why": "그림을 시작한 시기가 **'어릴 때부터'가 아니라 85세**예요. 본문의 'It wasn't until ~ that ...'은 '~하고 나서야 비로소 ...했다'라는 뜻이라서, 오랫동안 일하다가 아주 늦게 그림을 시작했다는 점이 핵심이에요."}, {"en": "Traylor began drawing at the age of 85 when he became too sick to work.", "ans": "T", "ko": "Traylor는 몸이 아파 일을 할 수 없게 된 85세에 그림을 그리기 시작했다.", "eve": "It wasn't until he was 85 years old and became too ill to work that he turned to drawing...", "evk": "그가 85세가 되고 몸이 너무 아 ces.", "evk": "개에 대한 그의 두려움은 이 작품들에 강하게 표현되어 있습니다.", "why": "〈비열한 개〉와 〈남자와 큰 개〉에 담긴 건 사랑이 아니라 **두려움(fear)**이에요. 'expressed strongly(강하게 표현됨)'가 두려움 앞에 붙은 표현이니, '사랑'이라고 바뀌면 바로 틀린 문장이에요."}]}, {"part": "❷", "title": "자유로운 삶을 담은 그림과 평가", "flow": "이와 대조적으로 〈핸드백을 든 여인과 우산을 든 남자〉는 몽고메리 거리에서 본 아프리카계 미국인의 자유로운 삶을 그렸어요. 단순한 형태와 색채로 복잡한 역사를 담아, 지금은 미국 민속 예술의 중요한 인물로 여겨져요.", "items": [{"en": "Woman with Purse and Man with Umbrella portrays wealthy Europeans in Paris.", "ans": "F", "ko": "〈핸드백을 든 여인과 우산을 든 남자〉는 파리의 부유한 유럽인들을 묘사한다.", "eve": "Woman with Purse and Man with Umbrella portrays the free lives of African Americans that he observed on the streets of Montgomery.", "evk": "〈핸드백을 든 여인과 우산을 든 남자〉는 그가 몽고메리 거리에서 관찰한 아프리카계 미국인의 자유로운 삶을 묘사합니다.", "why": "이 그림은 파리의 부유한 유럽인이 아니라 **몽고메리 거리에서 본 아프리카계 미국인의 자유로운 삶**을 그렸어요. In contrast(이와 대조적으로)로 시작하니까, 앞의 '두려움의 개 그림'과 대비되는 밝은 장면이라고 기억하세요."}, {"en": "Traylor observed scenes from the streets of Montgomery for his artwork.", "ans": "T", "ko": "Traylor는 작품을 위해 몽고메리 거리의 장면을 관찰했다.", "eve": "...the free lives of African Americans that he observed on the streets of Montgomery", "evk": "...그가 몽고메리 거리에서 관찰한 아프리카계 미국인의 자유로운 삶", "why": "observed(관찰했다)가 핵심이에요. 상상으로 만든 장면이 아니라 직접 본 거리의 삶을 그림에 담았다는 뜻이에요. that he observed ~ 는 앞의 lives를 꾸며 줘요."}, {"en": "Traylor used detailed techniques and bright patterns instead of simple shapes and colors.", "ans": "F", "ko": "Traylor는 단순한 형태와 색채 대신 세밀한 기법과 화려한 무늬를 사용했다.", "eve": "Using simple shapes and colors, Traylor captured complex moments in American history from slavery to freedom.", "evk": "단순한 형태와 색채를 사용하여, Traylor는 노예 제도에서 자유에 이르는 미국 역사의 복잡한 순간들을 포착했습니다.", "why": "본문은 **'단순한(simple) 형태와 색채'**를 썼다고 해요. 세밀한 기법이나 화려한 무늬는 본문에 없어요. simple ↔ detailed(세밀한)를 바꿔 놓은 문장이에요."}, {"en": "Traylor used simple shapes and colors to capture complex moments in American history.", "ans": "T", "ko": "Traylor는 단순한 형태와 색채로 미국 역사의 복잡한 순간들을 포착했다.", "eve": "Using simple shapes and colors, Traylor captured complex moments in American stmas cards.", "evk": "생계를 위해 그녀는 크리스마스카드를 그려서 팔기 시작했습니다.", "why": "to make a living은 '생계를 유지하기 위해'라는 목적이에요. 크리스마스카드를 그려서 파는 것이 그녀의 첫 번째 그림 일이었다는 점이 중요해요."}]}, {"part": "❸", "title": "딕비에서의 삶", "flow": "부모님이 돌아가신 뒤 딕비의 이모 집으로 갔고, 그곳에서 미래의 남편을 만났어요. 결혼 후에도 평생 딕비에서 살며 계속 그림을 그렸고, 딕비의 풍경을 자주 그렸어요.", "items": [{"en": "When her parents died, Lewis lived alone with no one to take care of her.", "ans": "F", "ko": "부모님이 돌아가셨을 때 Lewis는 돌봐 줄 사람 없이 혼자 살았다.", "eve": "When her parents passed away, Lewis went to live with her aunt in Digby, Nova Scotia...", "evk": "부모님이 돌아가신 후 Lewis는 노바스코샤주 딕비에 있는 이모와 함께 살러 갔습니다...", "why": "혼자 산 게 아니라 **이모와 함께** 살러 갔어요. 장소는 노바스코샤주 딕비예요. live with her aunt = 이모와 함께 살다."}, {"en": "After her parents passed away, Lewis lived with her aunt in Digby.", "ans": "T", "ko": "부모님이 돌아가신 후 Lewis는 딕비에서 이모와 함께 살았다.", "eve": "...Lewis went to live with her aunt in Digby, Nova Scotia", "evk": "...Lewis는 노바스코샤주 딕비의 이모와 함께 살러 갔습니다", "why": "pass away는 '돌아가시다'라는 뜻이에요. 부모님의 죽음 → 이모가 있는 딕비로 이동, 이 순서를 기억해 두면 돼요. 딕비는 앞으로 계속 나오는 중요한 장소예요."}, {"en": "It was in Digby that Lewis met Everett, who she later married.", "ans": "T", "ko": "Lewis는 딕비에서 나중에 결혼하게 되는 Everett를 만났다.", "eve": "...Digby, Nova Scotia, where she met her future husband, Everett Lewis", "evk": "...딕비, 그곳에서 그녀는 미래의 남편인 Everett Lewis를 만났습니다", "why": "where는 '그곳에서'라는 뜻으로 앞의 Digby를 받아요. 남편을 만난 곳도 딕비라는 점이 중요해요. 'future husband(미래의 남편)'는 '나중에 남편이 될 사람'이라는 뜻이에요."}, {"en": "Following their wedding, the couple remained in Digby for the rest of their lives.", "ans": "T", "ko": "결혼 후 부부는 평생 딕비에서 살았다.", "eve": "After marrying, the couple spent the rest of their lives there, and Lewis continued to paint.", "evk": "결혼 후 부부는 그곳에서 여생을 보냈고, Lewis는 계속 그림을 그렸습니다.", "why": "there는 앞에서 나온 딕비예요. 이모 집 → 남편을 만남 → 결혼 후에도 여생까지, 딕비가 그녀 삶의 중심 무대예요. the rest of their lives = 여생(남은 평생)."}, {"en": "Lewis stopped creating art after settling down with her husband.", "ans": "F", "ko": "Lewis는 남편과 정착한 뒤 예술 활동을 그만두었다.", "eve": "...and Lewis continued to paint.", "evk": "...그리고 Lewis는 계속 그림을 그렸습니다.", "why": "본문은 **continued to paint(계속 그림을 그렸다)**예요. 그만둔 것이 아니라 결혼 후에도 이어 갔어요. stopped와 continued를 구분하는 문제는 단골이에요."}, {"en": "Scenes from Digby, including those in Edge of Digby Harbor, appeared frequently in her paintings.", "ans": "T", "ko": "〈딕비 항구의 가장자리〉를 비롯한 딕비의 풍경이 그녀의 그림에 자주 등장했다.", "eve": "She often depicted the Digby landscapes in paintings such as Edge of Digby Harbor.", "evk": "그녀는 〈딕비 항구의 가장자리〉와 같은 그림에서 딕비의 풍경을 자주 묘사했습니다.", "why": "often depicted는 '자주 묘사했다'라는 뜻이에요. 그녀가 평생 산 딕비가 그림의 주제가 되었다는 점이 이 소단락의 마무리 포인트예요."}]}, {"part": "❸", "title": "Lewis의 작품 특징", "flow": "밝고 선명한 유화물감과 단순한 형태로 독창적이고 혁신적인 스타일을 만들었어요. 몸은 작은 오두막집에 갇혔어도 재능과 상상력은 무한했고, 〈빨간 썰매〉와 〈한 쌍의 소〉가 그 예예요.", "items": [{"en": "Lewis mainly preferred using watercolor and pencil sketches instead of oil-based paints.", "ans": "F", "ko": "Lewis는 유성 물감보다 수채화 물감과 연필 스케치를 주로 선호했다.", "eve": "Her artwork used a mixture of bright and vivid oil paints and simple forms...", "evk": "그녀의 작품은 밝고 선명한 유화물감의 혼합과 단순한 형태를 사용했습니다...", "why": "본문의 재료는 **유화물감(oil paints)**이에요. 수채화(watercolor)나 연필 스케치는 본문에 나오지 않아요. oil paints = 유화물감이라고 기억해 두세요."}, {"en": "Lewis expressed her creativity through vibrant oil colors combined with simple shapes.", "ans": "T", "ko": "Lewis는 단순한 형태와 결합한 선명한 유화 색채로 창의성을 표현했다.", "eve": "...a mixture of bright and vivid oil paints and simple forms, generating an original, innovative style", "evk": "...밝고 선명한 유화물감의 혼합과 단순한 형태를 사용하여 독창적이고 혁신적인 스타일을 만들어 냈습니다", "why": "bright and vivid(밝고 선명한)를 vibrant로, original, innovative style을 '창의성'으로 풀어 쓴 문장이에요. '물감 + 단순한 형태 → 독창적 스타일'의 인과를 같이 기억하세요."}, {"en": "Lewis’s paintings show a fresh and distinctive style through bright colors and simple forms.", "ans": "T", "ko": "Lewis의 그림은 밝은 색과 단순한 형태로 신선하고 독특한 스타일을 보여 준다.", "eve": "...an original, innovative style", "evk": "...독창적이고 혁신적인 스타일", "why": "original, innovative(독창적이고 혁신적인)를 fresh and distinctive(신선하고 독특한)로 바꿔 쓴 맞는 문장이에요. 어려운 단어를 쉬운 단어로 바꿔 쓴 문장은 대부분 맞는 문장이에요."}, {"en": "Because of her physical weaknesses, Lewis was unable to continue painting after moving into the cottage.", "ans": "F", "ko": "신체적 약점 때문에 Lewis는 오두막집으로 이사한 뒤 그림을 계속 그릴 수 없었다.", "eve": "Although her physical limitations confined her to a small cottage, her talent and imagination were both limitless.", "evk": "비록 신체적 제약이 그녀를 작은 오두막집에 가두었지만, 그녀의 재능과 상상력은 둘 다 무한했습니다.", "why": "본문은 오히려 **오두막집에 갇혀 있어도 계속 그렸다**는 이야기예요. 몸은 한계가 있었지만(physical limitations) 재능과 상상력은 한계가 없었다(limitless)는 대비가 핵심이에요."}, {"en": "Despite being restricted to a tiny home, her artistic vision showed no clear boundaries.", "ans": "T", "ko": "작은 집에 갇혀 지냈지만 그녀의 예술적 비전에는 뚜렷한 한계가 없었다.", "eve": "Although her physical limitations confined her to a small cottage, her talent and imagination were both limitless.", "evk": "비록 신체적 제약이 그녀를 작은 오두막집에 가두었지만, 그녀의 재능과 상상력은 둘 다 무한했습니다.", "why": "Although(비록 ~이지만)로 '몸은 갇혔다 ↔ 상상력은 무한'이 대비돼요. limitless(무한한)를 'no clear boundaries(뚜렷한 경계가 없는)'로 풀어 쓴 맞는 문장이에요."}, {"en": "The painting Red Sleigh presents red maple leaves on a winter landscape.", "ans": "T", "ko": "〈빨간 썰매〉는 겨울 풍경 속에 붉은 단풍잎이 나오는 그림이다.", "eve": "In Red Sleigh, red maple leaves appear on a special winter landscape...", "evk": "〈빨간 썰매〉에는 붉은 단풍잎이 특별한 겨울 풍경에 등장하고...", "why": "'겨울 풍경 + 붉은 단풍잎'이라는 낯선 조합이 특별함의 포인트예요. 겨울인데 단풍잎이 나오니 현실에는 없는 장면이죠. 이것이 뒤에 나오는 '동화 같은(fairy tale)' 느낌으로 이어져요."}, {"en": "In Pair of Oxen, two decorated cows are standing in a field of flowers.", "ans": "T", "ko": "〈한 쌍의 소〉에는 꽃밭에 서 있는 장식된 소 두 마리가 나온다.", "eve": "...Pair of Oxen shows decorated cows standing in a flower field", "evk": "...〈한 쌍의 소〉는 꽃밭에 서 있는 장식된 소들을 보여 줍니다", "why": "decorated cows(장식된 소들), standing in a flower field(꽃밭에 서 있는)를 기억하세요. 'standing in ~'은 앞의 cows를 꾸며 주는 분사구예요. 소가 장식되어 있다는 점도 현실에 없는 동화 같은 장면이에요."}, {"en": "Both Red Sleigh and Pair of Oxen depict dark and gloomy streets of Digby.", "ans": "F", "ko": "〈빨간 썰매〉와 〈한 쌍의 소〉는 모두 딕비의 어둡고 음울한 거리를 묘사한다.", "eve": "In Red Sleigh, red maple leaves appear on a special winter landscape, and Pair of Oxen shows decorated cows standing in a flower field.", "evk": "〈빨간 썰매〉에는 붉은 단풍잎이 특별한 겨울 풍경에 등장하고, 〈한 쌍의 소〉는 꽃밭에 서 있는 장식된 소들을 보여 줍니다.", "why": "두 그림 모두 어둡고 음울한(dark and gloomy) 거리가 아니라 **특별한 겨울 풍경과 꽃밭**을 보여 줘요. 뒤의 'magical quality, like that of a fairy tale(동화 같은 마법 같은 특성)'과도 정반대의 분위기예요."}]}, {"part": "❸", "title": "동화 같은 분위기와 영향", "flow": "그림은 동화 같은 마법의 느낌을 주었어요. 인기를 얻으면서 그녀의 이야기는 많은 사람에게 영감을 주고 책과 영화로도 만들어졌어요. 그림으로 세상에 대한 사랑을 표현해 캐나다 민속 예술의 상징적인 인물이 되었어요.", "items": [{"en": "Maud Lewis’s paintings are mostly dark and realistic, showing harsh everyday life.", "ans": "F", "ko": "Maud Lewis의 그림은 대부분 어둡고 사실적이며 힘겨운 일상을 보여 준다.", "eve": "With these features, Lewis' paintings create a magical quality, like that of a fairy tale.", "evk": "이러한 특징으로 Lewis의 그림은 동화의 그것처럼 마법 같은 특성을 만들어 냅니다.", "why": "본문은 **마법 같은 동화(magical, fairy tale)**의 분위기라고 해요. 어둡고 현실적인 그림이 아니에요. 앞에서 heart-warming(마음이 따뜻해지는)이라고 한 것과도 이어지는 이미지예요."}, {"en": "Maud Lewis’s paintings convey a magical, fairy-tale-like quality through their unique artistic features.", "ans": "T", "ko": "Maud Lewis의 그림은 독특한 예술적 특징으로 동화 같은 마법의 느낌을 전달한다.", "eve": "With these features, Lewis' paintings create a magical quality, like that of a fairy tale.", "evk": "이러한 특징으로 Lewis의 그림은 동화의 그것처럼 마법 같은 특성을 만들어 냅니다.", "why": "these features는 앞에서 말한 붉은 단풍잎, 장식된 소 같은 특징들을 가리켜요. 특징 → 마법 같은 분위기라는 연결을 기억하세요. like that of a fairy tale에서 that은 a magical quality를 대신해요."}, {"en": "The growing popularity of Maud Lewis’ artwork inspired many people over time.", "ans": "T", "ko": "Maud Lewis 작품의 인기가 높아지면서 시간이 지나 많은 사람들이 영감을 받았다.", "eve": "As her paintings gradually gained popularity, her story inspired many people...", "evk": "그녀의 그림이 점차 인기를 얻으면서 그녀의 이야기는 많은 사람에게 영감을 주었습니다...", "why": "gradually(점차)와 gained popularity(인기를 얻었다)가 핵심이에요. 그림이 먼저 인기를 얻고 → 그녀의 이야기가 사람들에게 영감을 줬다는 순서예요."}, {"en": "Books and movies were later created based on Maud Lewis’ life story.", "ans": "T", "ko": "나중에 Maud Lewis의 삶을 바탕으로 한 책과 영화가 만들어졌다.", "eve": "...her story... was later made into books and movies", "evk": "...그녀의 이야기는 나중에 책과 영화로 만들어졌습니다", "why": "was later made into ~는 '나중에 ~로 만들어졌다'라는 수동태예요. 그녀의 이야기가 책과 영화로 만들어질 만큼 널리 알려졌다는 뜻이에요."}, {"en": "Maud Lewis expressed affection for the world through her paintings.", "ans": "T", "ko": "Maud Lewis는 그림을 통해 세상에 대한 애정을 표현했다.", "eve": "Maud Lewis expressed her love for the world through her paintings...", "evk": "Maud Lewis는 그림을 통해 세상에 대한 사랑을 표현했습니다...", "why": "love for the world를 affection for the world로 바꿔 쓴 맞는 문장이에요. 힘든 삶 속에서도 세상을 사랑하는 마음을 그림으로 말했다는 것이 이 소단락의 결론이에요."}, {"en": "Maud Lewis became an important figure in Canadian folk art due to her unique style and story.", "ans": "T", "ko": "Maud Lewis는 독특한 스타일과 이야기 덕분에 캐나다 민속 예술의 중요한 인물이 되었다.", "eve": "...and became an iconic figure in Canadian folk art", "evk": "...그리고 캐나다 민속 예술의 상징적인 인물이 되었습니다", "why": "iconic(상징적인)을 important(중요한)로 바꿔 쓴 맞는 문장이에요. Traylor는 '미국', Lewis는 '캐나다'의 민속 예술 인물이라는 점도 구분해서 기억하세요."}]}, {"part": "❹", "title": "Anna Ancher의 소개와 배움", "flow": "마지막 예술가 Anna Ancher는 덴마크의 화가로, 그림마다 여성 인물이 등장해요. 코펜하겐과 파리에서 공부한 것은 당시 여성에게 드문 일이었고, 어머니의 격려 덕분에 이런 기회를 활용할 수 있었어요.", "items": [{"en": "Anna Ancher is introduced as the final artist of the exhibition and is a well-known Danish painter.", "ans": "T", "ko": "Anna Ancher는 이번 전시의 마지막 예술가로 소개되며, 덴마크의 유명한 화가이다.", "eve": "Now let's take a look at the final artist of this exhibition: Anna Ancher, a famous painter from Denmark.", "evk": "이제 이번 전시의 마지막 예술가인 덴마크 출신의 유명한 화가 Anna Ancher를 살펴봅시다.", "why": "소단락 ❹의 첫 문장이에요. final artist(마지막 예술가)라는 표현으로 세 번째, 마지막 인물이라는 걸 알 수 있어요. 순서는 Traylor(미국) → Lewis(캐나다) → Ancher(덴마크)예요."}, {"en": "Anna Ancher’s paintings primarily depict male figures instead of female subjects.", "ans": "F", "ko": "Anna Ancher의 그림은 여성 인물 대신 주로 남성 인물을 그린다.", "eve": "When observing her paintings, you may notice a common theme—they all feature female figures.", "evk": "그녀의 그림을 볼 때 여러분은 공통된 주제를 알아차릴지도 모릅니다. 바로 그림에 모두 여성 인물이 등장한다는 점입니다.", "why": "공통된 주제는 **여성 인물(female figures)**이에요. 남성이 주로 나온다는 건 반대 내용이죠. they all feature female figures에서 all(모두)이 있다는 점도 기억해 두세요."}, {"en": "Anna Ancher’s paintings commonly depict female figures.", "ans": "T", "ko": "Anna Ancher의 그림에는 흔히 여성 인물이 등장한다.", "eve": "...they all feature female figures", "evk": "...그림에 모두 여성 인물이 등장합니다", "why": "바로 앞 문장과 짝이에요. 'all feature female figures'를 'commonly depict female figures'로 바꿔 쓴 맞는 문장이에요. 이 소단락은 '여성'이 열쇠 단어예요."}, {"en": "Anna Ancher was born in Skagen, Denmark and later relocated to Copenhagen to study at a private painting school.", "ans": "T", "ko": "Anna Ancher는 덴마크 스카겐에서 태어나, 나중에 사립 회화 학교에 다니려고 코펜하겐으로 이주했다.", "eve": "Born in Skagen, Denmark, in 1859, she later moved to Copenhagen to attend a private painting school.", "evk": "1859년 덴마크 스카겐에서 태어난 그녀는 나중에 사립 회화 학교에 다니기 위해 코펜하겐으로 이주했습니다.", "why": "본문과 같은 내용이에요. 태어난 곳(스카겐) → 이주한 곳(코펜하겐), 이유는 사립 회화 학교예요. to attend는 '다니기 위해'라는 목적이에요."}, {"en": "Anna Ancher continued her studies abroad in Paris, which was common for women at her time.", "ans": "F", "ko": "Anna Ancher는 파리에서 유학을 이어 갔고, 이는 당시 여성들에게 흔한 일이었다.", "eve": "After that, she even studied abroad in Paris, which was unusual for women at the time.", "evk": "그 후 그녀는 파리에서 유학까지 했는데, 이는 당시 여성들에게 드문 일이었습니다.", "why": "본문은 **unusual(드문)**이에요. 흔한(common) 일이라고 바꾸면 틀려요. 'even studied abroad'의 even(~까지도)이 '여성으로서는 놀라운 일'이라는 느낌을 줘요."}, {"en": "Studying abroad in Paris was uncommon for women in the 19th century.", "ans": "T", "ko": "19세기에 파리에서 유학하는 것은 여성에게 흔치 않은 일이었다.", "eve": "...studied abroad in Paris, which was unusual for women at the time", "evk": "...파리에서 유학했는데, 이는 당시 여성들에게 드문 일이었습니다", "why": "바로 앞 문장과 짝이에요. unusual(드문)을 uncommon(흔치 않은)으로 바꾼 맞는 문장이에요. 관계대명사 which는 '파리에서 유학한 것' 전체를 받아요."}, {"en": "Anna Ancher pursued her opportunities without any support or encouragement from her family.", "ans": "F", "ko": "Anna Ancher는 가족의 어떤 지지나 격려도 없이 기회를 잡았다.", "eve": "Thanks to her mother's encouragement, she was able to take advantage of these opportunities.", "evk": "어머니의 격려 덕분에 그녀는 이러한 기회를 활용할 수 있었습니다.", "why": "본문은 **어머니의 격려(mother's encouragement) 덕분에** 기회를 활용했다고 해요. 'thanks to ~'는 '~ 덕분에'라서 도움이 있었다는 뜻이에요. these opportunities는 사립 회화 학교 진학과 파리 유학이에요."}]}, {"part": "❹", "title": "결혼 후에도 계속한 그림", "flow": "결혼 후에도 '기혼 여성은 가사에만 집중해야 한다'는 사회적 압력에 저항하며 그림을 계속 그렸어요. 여성을 정물화 소재로 그린 다른 예술가들과 달리, 일상 작업의 적극적인 참여자로 그렸어요.", "items": [{"en": "Anna Ancher stopped painting after marriage to focus on household responsibilities.", "ans": "F", "ko": "Anna Ancher는 결혼 후 집안일에 집중하려고 그림을 그만두었다.", "eve": "Even after getting married, Ancher persisted in painting, objecting to the social pressure that married women were to solely focus on household duties.", "evk": "결혼 후에도 Ancher는 기혼 여성은 가사에만 집중해야 한다는 사회적 압력에 저항하며 그림을 계속 그렸습니다.", "why": "Even after(~한 후에도)가 힌트예요. 결혼 후에도 **persisted in painting(그림을 계속 그렸다)**이므로 그만둔 게 아니에요. 사회가 요구한 집안일 집중을 거부한 거죠."}, {"en": "Anna Ancher continued to paint after marriage, resisting societal expectations for married women.", "ans": "T", "ko": "Anna Ancher는 결혼 후에도 기혼 여성에 대한 사회적 기대에 저항하며 계속 그림을 그렸다.", "eve": "...Ancher persisted in painting, objecting to the social pressure...", "evk": "...Ancher는 사회적 압력에 저항하며 그림을 계속 그렸습니다...", "why": "objecting to ~는 '~에 반대하다, 저항하다'라는 뜻이에요. 사회적 압력(social pressure)에 맞선 행동이라는 점이 이 소단락의 핵심이에요."}, {"en": "Anna Ancher agreed with the social expectation that married women should not work.", "ans": "F", "ko": "Anna Ancher는 기혼 여성은 일하지 않아야 한다는 사회적 기대에 동의했다.", "eve": "...objecting to the social pressure that married women were to solely focus on household duties", "evk": "...기혼 여성은 가사에만 집중해야 한다는 사회적 압력에 저항하며", "why": "동의(agree)가 아니라 **저항(objecting)**이에요. objecting to를 agreed with로 바꾼 정반대 문장이죠. 'were to ~'는 '~해야 한다(예정·의무)'라는 뜻이에요."}, {"en": "Anna Ancher rejected the idea that women should only perform household duties.", "ans": "T", "ko": "Anna Ancher는 여성은 집안일만 해야 한다는 생각을 거부했다.", "eve": "...objecting to the social pressure that married women were to solely focus on household duties", "evk": "...기혼 여성은 가사에만 집중해야 한다는 사회적 압력에 저항하며", "why": "바로 앞 문장과 짝이에요. objecting to를 rejected로 바꿔 쓴 맞는 문장이에요. solely는 '오직'이라는 뜻이라, '집안일만'이 압력의 핵심이었어요."}, {"en": "Unlike many artists of her time, Anna Ancher did not portray women as passive still life figures.", "ans": "T", "ko": "당대의 많은 예술가들과 달리, Anna Ancher는 여성을 수동적인 정물처럼 그리지 않았다.", "eve": "Ancher differed from other artists of that era, who depicted women as still life subjects.", "evk": "Ancher는 여성을 정물화 소재로 묘사한 당시의 다른 예술가들과 달랐습니다.", "why": "다른 예술가들은 여성을 **정물화의 소재(still life subjects)**처럼 그렸고, Ancher는 달랐어요. who depicted ~는 other artists를 설명하는 관계절이에요. 정물처럼 가만히 있는 모습과 대비된다는 점을 기억하세요."}, {"en": "Anna Ancher’s paintings mainly show women as passive observers rather than active participants.", "ans": "F", "ko": "Anna Ancher의 그림은 여성을 일상 작업의 참여자가 아니라 주로 수동적인 관찰자로 보여 준다.", "eve": "In contrast, she showcased them as active participants in everyday tasks...", "evk": "이와 대조적으로 그녀는 여성을 일상 작업의 적극적인 참여자로 보여 주었습니다...", "why": "본문은 **active participants(적극적인 참여자)**예요. passive observers(수동적인 관찰자)로 바뀌면 정반대예요. In contrast는 '다른 예술가들은 정물처럼, Ancher는 적극적으로'라는 대조 신호예요."}]}, {"part": "❹", "title": "Ancher의 작품 세계", "flow": "〈부엌의 하녀〉와 〈바느질하는 어부의 아내〉는 적극적으로 일하는 여성을, 〈푸른 방의 햇빛〉은 빛과 색채의 탐구를 보여 줘요. Ancher는 20세기 여성의 전통적인 역할에 이의를 제기했어요.", "items": [{"en": "The works The Maid in the Kitchen and Sewing Fisherman’s Wife depict men performing household tasks.", "ans": "F", "ko": "〈부엌의 하녀〉와 〈바느질하는 어부의 아내〉는 집안일을 하는 남성들을 그린다.", "eve": "...as seen in her works The Maid in the Kitchen and Sewing Fisherman's Wife", "evk": "...〈부엌의 하녀〉와 〈바느질하는 어부의 아내〉라는 작품에서 볼 수 있듯이", "why": "'하녀(Maid)'와 '어부의 아내(Wife)'는 모두 여성이에요. 남성이라고 바뀌면 바로 틀려요. 이 두 작품은 여성이 일상 작업에 적극적으로 참여하는 모습의 예시예요."}, {"en": "The works The Maid in the Kitchen and Sewing Fisherman’s Wife illustrate female subjects actively engaging in everyday tasks.", "ans": "T", "ko": "〈부엌의 하녀〉와 〈바느질하는 어부의 아내〉는 일상 작업에 적극적으로 참여하는 여성을 보여 준다.", "eve": "...she showcased them as active participants in everyday tasks, as seen in her works...", "evk": "...그녀는 〈부엌의 하녀〉와 〈바느질하는 어부의 아내〉라는 작품에서 볼 수 있듯이 여성을 일상 작업의 적극적인 참여자로 보여 주었습니다", "why": "as seen in ~은 '~에서 볼 수 있듯이'라는 뜻으로, 앞 주장의 증거 작품을 보여 줘요. 주장(적극적인 참여자) → 증거(두 작품)의 연결을 기억하세요."}, {"en": "Anna Ancher had little interest in exploring light and color, focusing more on dark, muted tones.", "ans": "F", "ko": "Anna Ancher는 빛과 색채를 탐구하는 데 관심이 거의 없었고 어둡고 차분한 색조에 집중했다.", "eve": "She also skillfully explored light and color, contributing to the rich Impressionist movement in Denmark.", "evk": "그녀는 또한 빛과 색채를 능숙하게 탐구하여 덴마크의 풍부한 인상주의 운동에 기여했습니다.", "why": "본문은 **빛과 색채(light and color)를 능숙하게(skillfully)** 탐구했다고 해요. 관심이 거의 없었다는 건 정반대예요. 인상주의가 '빛과 색'에 집중한 흐름이라는 것도 같이 기억해 두세요."}, {"en": "Anna Ancher skillfully experimented with light and color, playing a role in Denmark’s Impressionist movement.", "ans": "T", "ko": "Anna Ancher는 빛과 색채를 능숙하게 실험하며 덴마크의 인상주의 운동에서 한 역할을 했다.", "eve": "...skillfully explored light and color, contributing to the rich Impressionist movement in Denmark", "evk": "...빛과 색채를 능숙하게 탐구하여 덴마크의 풍부한 인상주의 운동에 기여했습니다", "why": "바로 앞 문장과 짝이에요. explored를 experimented with로, contributing to를 playing a role in으로 바꿔 쓴 맞는 문장이에요. contributing to는 '~에 기여하며'라는 분사구문이에요."}, {"en": "Sunlight in the Blue Room shows sunlight reflecting on a blue wall with remarkable detail.", "ans": "T", "ko": "〈푸른 방의 햇빛〉은 푸른 벽에 반사되는 햇빛을 놀라울 만큼 세밀하게 보여 준다.", "eve": "In her painting Sunlight in the Blue Room, the reflection of the sunlight on the blue wall is stunningly portrayed.", "evk": "그녀의 작품 〈푸른 방의 햇빛〉에서는 푸른 벽에 반사되는 햇빛이 굉장히 아름답게 묘사되어 있습니다.", "why": "stunningly portrayed(굉장히 아름답게 묘사된)는 햇빛이 인상적으로 그려졌다는 뜻이에요. 문장은 이를 'remarkable detail(눈에 띄는 세밀함)'로 풀어 썼지만, 핵심은 푸른 벽에 반사되는 햇빛을 훌륭하게 표현했다는 점이라 맞는 문장이에요. 이 작품은 '빛과 색채를 능숙하게 탐구했다'는 앞 주장의 증거예요."}, {"en": "Anna Ancher highlighted the conventional roles of women in the 20th century through her paintings.", "ans": "F", "ko": "Anna Ancher는 그림을 통해 20세기 여성의 전통적인 역할을 부각했다.", "eve": "Ancher challenged the conventional roles of women in the 20th ce       var pn=el('div','pn');

      var ev=el('div','ev');ev.appendChild(el('span','e',it.eve));if(it.evk)ev.appendChild(el('span','k',it.evk));
      pn.appendChild(el('span','tag','본문 근거'));pn.appendChild(ev);
      pn.appendChild(el('span','tag','해설'));var w=el('div','why');rich(w,it.why);pn.appendChild(w);
      b.appendChild(pn);
      var id=gi+'-'+ii;
      function open(){
        if(b.classList.contains('open'))return;
        S[id]=1;save();paint();
      }
      b.onclick=open;b.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}};
      card.appendChild(b);btns.push({b:b,id:id,it:it,pn:pn});
    });
    var tools=el('div','tools');
    var bAll=el('button',null,'나머지 해설 모두 열기');bAll.onclick=function(){btns.forEach(function(x){S[x.id]=1});save();paint()};
    var bReset=el('button',null,'이 소단락 다시 하기');bReset.onclick=function(){btns.forEach(function(x){delete S[x.id]});save();paint()};
    tools.appendChild(bAll);tools.appendChild(bReset);card.appendChild(tools);
    var flow=el('div','flow');flow.appendChild(el('span','tag','이 소단락 정리'));flow.appendChild(document.createTextNode(g.flow));card.appendChild(flow);
    root.appendChild(card);
    cards.push({g:g,btns:btns,cnt:cnt,flow:flow,nF:nF});
  });
});
function paint(){
  var done=0;
  cards.forEach(function(c){
    var found=0,all=true;
    c.btns.forEach(function(x){
      var o=!!S[x.id];
      x.b.classList.toggle('open',o);
      x.b.classList.remove('ok','no2');
      var old=x.b.querySelector('.badge');if(old)old.remove();
      if(o){
        var f=x.it.ans==='F';x.b.classList.add(f?'ok':'no2');
        if(f)found++;
        var bd=el('span','badge',f?'✔ 본문과 다른 문장 · 잘 찾았어요':'본문과 같은 내용이에요 · 맞는 문장');
        x.b.insertBefore(bd,x.pn);
      }
      if(!o)all=false;
    });
    var fin=found===c.nF;
    c.cnt.textContent='다른 문장 '+found+'/'+c.nF+' 찾음';
    c.cnt.classList.toggle('done',fin);
    c.flow.classList.toggle('on',fin);
    if(fin)done++;
  });
  prog.textContent='소단락 '+done+'/'+cards.length+' 확인';
}
paint();
