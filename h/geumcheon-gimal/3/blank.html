<h1>3과 The True Art Lovers · 빈칸 추론 연습</h1>
<p class="lede">본문 지문 속 빈칸에 알맞은 말을 골라요. 한 번 나온 문제는 한 바퀴를 다 돌 때까지 다시 나오지 않고, 보기 순서는 매번 달라져요.</p>
<div class="bar"><span id="cnt"></span><button id="kt" type="button">한글 해석 보기</button><button id="rs">처음부터 다시</button></div>
<div id="app"></div>
<div class="foot">비타민 영어클리닉</div>
</div>
<script>
var DATA={"secs": [{"id": "T1", "title": "Bill Traylor ① 삶과 그림의 시작", "sents": [{"n": 5, "en": "The first artist we're going to examine is Bill Traylor.", "ko": "첫 번째로 살펴볼 예술가는 Bill Traylor이다."}, {"n": 6, "en": "Traylor was born into slavery in the U.S. in 1853 and spent his early life working on a cotton farm in Alabama.", "ko": "Traylor는 1853년 미국에서 노예로 태어나 앨라배마의 목화 농장에서 일하며 어린 시절을 보냈다."}, {"n": 7, "en": "Although he became a free man after the American Civil War, he still had to face racial discrimination, working for very low wages on the farm.", "ko": "그는 미국 남북전쟁 이후 자유의 몸이 되었지만, 농장에서 매우 낮은 임금을 받고 일하며 여전히 인종차별에 직면해야 했다."}, {"n": 8, "en": "Later, when he was around 70 years old, Traylor moved to the city of Montgomery, Alabama, where he found a job in a factory.", "ko": "이후 70세 무렵에, Traylor는 앨라배마주 몽고메리시로 이주하여 공장에서 일자리를 얻었다."}, {"n": 9, "en": "It wasn't until he was 85 years old and became too ill to work that he turned to drawing to express his life experiences.", "ko": "85세가 되고 몸이 너무 아파서 일을 할 수 없게 된 후에야 그는 자신의 인생 경험을 표현하기 위해 그림으로 눈을 돌렸다."}, {"n": 10, "en": "Now, we're going to look at some of his paintings, starting with Mean Dog and Man and Large Dog.", "ko": "이제 〈비열한 개〉와 〈남자와 큰 개〉를 시작으로 그의 그림 몇 점을 살펴보겠다."}, {"n": 11, "en": "Traylor had a strong fear of dogs because they had often been used on farms to watch and hunt slaves.", "ko": "Traylor는 개가 농장에서 노예를 감시하고 사냥하는 데 자주 사용되었기 때문에 개에 대한 두려움이 컸다."}, {"n": 12, "en": "His fear of dogs is expressed strongly in these pieces.", "ko": "이 작품들에는 개에 대한 그의 두려움이 강하게 표현되어 있다."}], "theme": "노예로 태어나 차별받던 사람이 늦게 그림으로 자기 경험과 두려움을 표현했어요."}, {"id": "T2", "title": "Bill Traylor ② 작품과 평가", "sents": [{"n": 10, "en": "Now, we're going to look at some of his paintings, starting with Mean Dog and Man and Large Dog.", "ko": "이제 〈비열한 개〉와 〈남자와 큰 개〉를 시작으로 그의 그림 몇 점을 살펴보겠다."}, {"n": 11, "en": "Traylor had a strong fear of dogs because they had often been used on farms to watch and hunt slaves.", "ko": "Traylor는 개가 농장에서 노예를 감시하고 사냥하는 데 자주 사용되었기 때문에 개에 대한 두려움이 컸다."}, {"n": 12, "en": "His fear of dogs is expressed strongly in these pieces.", "ko": "이 작품들에는 개에 대한 그의 두려움이 강하게 표현되어 있다."}, {"n": 13, "en": "In contrast, Woman with Purse and Man with Umbrella portrays the free lives of African Americans that he observed on the streets of Montgomery.", "ko": "이와 대조적으로 〈핸드백을 든 여인과 우산을 든 남자〉는 몽고메리 거리에서 그가 관찰한 아프리카계 미국인의 자유로운 삶을 묘사한다."}, {"n": 14, "en": "Using simple shapes and colors, Traylor captured complex moments in American history from slavery to freedom.", "ko": "Traylor는 단순한 형태와 색채를 사용하여 노예 제도에서 자유에 이르는 미국 역사의 복잡한 순간을 포착했다."}, {"n": 15, "en": "As a result, he's now considered an important figure in American folk art.", "ko": "그 결과, 그는 현재 미국 민속 예술의 중요한 인물로 여겨지고 있다."}], "theme": "단순한 그림으로 두려움과 자유라는 역사의 두 얼굴을 담아낸 예술가 이야기예요."}, {"id": "M1", "title": "Maud Lewis ① 삶", "sents": [{"n": 16, "en": "Next, we have Maud Lewis, a renowned artist known for her heart-warming paintings.", "ko": "다음은 마음이 따뜻해지는 그림으로 알려진, 유명 예술가 Maud Lewis이다."}, {"n": 17, "en": "Born in a small Canadian town in 1903, Lewis suffered from physical weaknesses such as distorted shoulders and fingers.", "ko": "1903년 캐나다의 작은 마을에서 태어난 Lewis는 기형적인 어깨와 손가락과 같은 신체적 약점으로 고통받았다."}, {"n": 18, "en": "This limited her mobility and caused her to drop out of school.", "ko": "이것은 그녀의 이동성을 제한했고 그녀가 학교를 중퇴하도록 만들었다."}, {"n": 19, "en": "To make a living, she began to paint and sell Christmas cards.", "ko": "생계를 위해 그녀는 크리스마스카드를 그려서 팔기 시작했다."}, {"n": 20, "en": "When her parents passed away, Lewis went to live with her aunt in Digby, Nova Scotia, where she met her future husband, Everett Lewis.", "ko": "부모님이 돌아가신 후 Lewis는 이모와 함께 살기 위해 노바스코샤주 딕비로 갔고, 그곳에서 미래의 남편인 Everett Lewis를 만났다."}, {"n": 21, "en": "After marrying, the couple spent the rest of their lives there, and Lewis continued to paint.", "ko": "결혼 후 부부는 여생을 그곳에서 보냈고 Lewis는 계속해서 그림을 그렸다."}, {"n": 22, "en": "She often depicted the Digby landscapes in paintings such as Edge of Digby Harbor.", "ko": "그녀는 〈딕비 항구의 가장자리〉와 같은 그림에서 딕비의 풍경을 자주 묘사했다."}], "theme": "몸이 불편해도 생계를 위해 그림을 시작하고 계속 그린 예술가 이야기예요."}, {"id": "M2", "title": "Maud Lewis ② 작품과 평가", "sents": [{"n": 23, "en": "Her artwork used a mixture of bright and vivid oil paints and simple forms, generating an original, innovative style.", "ko": "그녀의 작품은 밝고 선명한 유화물감의 혼합과 단순한 형태를 사용하여 독창적이고 혁신적인 스타일을 만들어 냈다."}, {"n": 24, "en": "Although her physical limitations confined her to a small cottage, her talent and imagination were both limitless.", "ko": "비록 신체적 제약들은 그녀를 작은 오두막집에 가두었지만 그녀의 재능과 상상력은 둘 다 무한했다."}, {"n": 25, "en": "In Red Sleigh, red maple leaves appear on a special winter landscape, and Pair of Oxen shows decorated cows standing in a flower field.", "ko": "〈빨간 썰매〉에는 붉은 단풍잎이 특별한 겨울 풍경에 등장하고, 〈한 쌍의 소〉에는 꽃밭에 서 있는 장식된 소들을 보여 준다."}, {"n": 26, "en": "With these features, Lewis' paintings create a magical quality, like that of a fairy tale.", "ko": "이러한 특징을 통해 Lewis의 그림은 마치 동화의 그것과 같은, 마법 같은 특성을 만들어 낸다."}, {"n": 27, "en": "As her paintings gradually gained popularity, her story inspired many people and was later made into books and movies.", "ko": "그녀의 그림이 점차 인기를 얻으면서 그녀의 이야기는 많은 사람에게 영감을 주었고 나중에 책과 영화로 만들어졌다."}, {"n": 28, "en": "Maud Lewis expressed her love for the world through her paintings and became an iconic figure in Canadian folk art.", "ko": "Maud Lewis는 그림을 통해 세상에 대한 사랑을 표현했고 캐나다 민속 예술의 상징적인 인물이 되었다."}], "theme": "몸은 갇혀 있어도 밝은 상상력으로 많은 사람에게 영감을 준 예술가 이야기예요."}, {"id": "A1", "title": "Anna Ancher ① 배움과 결혼", "sents": [{"n": 29, "en": "Now let's take a look at the final artist of this exhibition: Anna Ancher, a famous painter from Denmark.", "ko": "이제 이번 전시의 마지막 예술가, 덴마크 출신의 유명 화가 Anna Ancher를 살펴보자."}, {"n": 30, "en": "When observing her paintings, you may notice a common theme —they all feature female figures.", "ko": "그녀의 그림을 보면 여러분은 공통적인 주제를 알아차릴지도 모르는데, 그건 바로 그림에 모두 여성 인물이 등장한다는 점이다."}, {"n": 31, "en": "Born in Skagen, Denmark, in 1859, she later moved to Copenhagen to attend a private painting school.", "ko": "1859년 덴마크 스카겐에서 태어난 그녀는 나중에 사립 회화 학교에 다니기 위해 코펜하겐으로 이주했다."}, {"n": 32, "en": "After that, she even studied abroad in Paris, which was unusual for women at the time.", "ko": "그 후 그녀는 파리에서 유학까지 했는데, 그것은 당시 여성들에게 드문 일이었다."}, {"n": 33, "en": "Thanks to her mother's encouragement, she was able to take advantage of these opportunities.", "ko": "어머니의 격려 덕분에 그녀는 이러한 기회를 활용할 수 있었다."}, {"n": 34, "en": "Even after getting married, Ancher persisted in painting, objecting to the social pressure that married women were to solely focus on household duties.", "ko": "결혼 후에도 Ancher는 기혼 여성은 가사에만 집중해야 한다는 사회적 압력에 저항하며 그림을 계속 그렸다."}], "theme": "사회의 압력에 맞서 배움과 그림을 포기하지 않은 여성 예술가 이야기예요."}, {"id": "A2", "title": "Anna Ancher ② 작품과 평가", "sents": [{"n": 35, "en": "Ancher differed from other artists of that era, who depicted women as still life subjects.", "ko": "Ancher는 당시의 다른 예술가들과는 달랐는데, 그들은 여성을 정물화 소재로 묘사했다."}, {"n": 36, "en": "In contrast, she showcased them as active participants in everyday tasks, as seen in her works The Maid in the Kitchen and Sewing Fisherman's Wife.", "ko": "이와는 대조적으로, 〈부엌의 하녀〉와 〈바느질하는 어부의 아내〉라는 작품에서 볼 수 있듯 그녀는 일상 작업의 적극적인 참여자로서의 여성을 보여 주었다."}, {"n": 37, "en": "She also skillfully explored light and color, contributing to the rich Impressionist movement in Denmark.", "ko": "또한 그녀는 빛과 색채를 능숙하게 탐구하여 덴마크의 풍부한 인상주의 운동에 기여했다."}, {"n": 38, "en": "In her painting Sunlight in the Blue Room, the reflection of the sunlight on the blue wall is stunningly portrayed.", "ko": "그녀의 작품 〈푸른 방의 햇빛〉에서는 푸른 벽에 반사되는 햇빛이 굉장히 아름답게 묘사되어 있다."}, {"n": 39, "en": "Ancher challenged the conventional roles of women in the 20th century and displayed her exceptional artistic talent.", "ko": "Ancher는 20세기 여성의 전통적인 역할에 이의를 제기하며 뛰어난 예술적 재능을 보여 주었다."}, {"n": 40, "en": "Her paintings continue to amaze us to this day.", "ko": "그녀의 그림은 오늘날까지도 우리를 놀라게 한다."}], "theme": "여성을 활동적으로 그리고 빛과 색을 탐구해 당시 통념에 도전한 예술가 이야기예요."}], "items": [{"id": 0, "sec": "T1", "i": 7, "a": "he still had to face racial discrimination", "ak": "그는 여전히 인종차별에 직면해야 했다", "clue": "Although(~이지만)이 있으니 '자유의 몸이 되었다'와 반대되는 내용이 와요. 뒤의 working for very low wages(매우 낮은 임금을 받고 일하며)도 힘든 처지를 말해 줘요.", "ds": [{"t": "he had to face racial discrimination only in the city", "k": "그는 인종차별에 도시에서만 직면해야 했다", "w": "'only(~에서만)'로 범위를 좁힌 말이에요. 뒤에서 농장(the farm)에서 낮은 임금을 받고 일했다고 하니 도시에만 한정할 수 없어요."}, {"t": "he turned to drawing to express his life experiences", "k": "그는 자신의 인생 경험을 표현하기 위해 그림으로 눈을 돌렸다", "w": "두 문장 뒤(85세 이후)의 내용을 가져온 거예요. Although 뒤에서 '여전히 힘들었다'고 말해야 하는 자리와 맞지 않아요."}, {"t": "he had faced racial discrimination before the war ended", "k": "그는 전쟁이 끝나기 전에 인종차별에 직면했었다", "w": "차별 이야기이긴 하지만, 'Although(자유의 몸이 되었지만)' 뒤에는 자유가 된 '후에도' 여전히 겪었다는 내용이 와야 해요. 시점이 어긋나요."}, {"t": "he no longer had to work on the farm", "k": "그는 더 이상 농장에서 일하지 않아도 되었다", "w": "뒤의 working ... on the farm(농장에서 일하며)과 정면으로 부딪쳐요."}]}, {"id": 1, "sec": "T1", "i": 12, "a": "His fear of dogs", "ak": "개에 대한 그의 두려움", "clue": "바로 앞 문장에서 'Traylor는 개에 대한 큰 두려움이 있었다'고 했어요. 이 문장은 그 이야기를 이어받아 these pieces(이 작품들) 속에 그것이 어떻게 나타나는지를 말해요.", "ds": [{"t": "His fear of all animals", "k": "모든 동물에 대한 그의 두려움", "w": "all(모든)로 범위를 넓힌 말이에요. 앞 문장은 개(dogs)에 대한 두려움만 말해요."}, {"t": "His fear of losing his job", "k": "일자리를 잃는 것에 대한 그의 두려움", "w": "앞부분(70세 무렵 공장 일자리 이야기)을 가져온 거예요. 이 문장은 개 이야기를 이어받아요."}, {"t": "His love for dogs", "k": "개에 대한 그의 사랑", "w": "앞 문장에서 개 때문에 두려움이 컸다고 했으니 반대예요."}, {"t": "His fear of illness", "k": "병에 대한 그의 두려움", "w": "앞의 too ill to work(아파서 일할 수 없는)에서 가져온 말이에요. 두려움의 대상은 개예요."}]}, {"id": 2, "sec": "T1", "i": 9, "a": "became too ill to work", "ak": "너무 아파서 일을 할 수 없게 되었다", "clue": "It wasn't until ~ that(~하고서야 비로소)은 '그때가 되어서야 그림에 눈을 돌렸다'는 뜻이에요. 그림으로 눈을 돌린 계기가 와야 하는데, 앞의 '85세'와 and로 이어지는 상황이에요.", "ds": [{"t": "became too ill to draw", "k": "너무 아파서 그림을 그릴 수 없게 되었다", "w": "'too ill to ~' 모양은 같지만 draw(그리다)로 바꾸면, 그림으로 눈을 돌렸다는 뒤 내용과 정반대가 돼요."}, {"t": "moved to the city of Montgomery", "k": "몽고메리시로 이주했다", "w": "앞 문장(70세 무렵)의 내용을 가져온 거예요. 85세와 and로 이어질 일이 아니에요."}, {"t": M2", "i": 25, "a": "shows decorated cows standing in a flower field", "ak": "꽃밭에 서 있는 장식된 소들을 보여 준다", "clue": "이 문장은 and로 두 그림을 소개해요. 앞 그림은 붉은 단풍잎이 있는 겨울 풍경이고, 뒤 그림 Pair of Oxen(한 쌍의 소)은 소가 나오는 다른 풍경이에요.", "ds": [{"t": "shows decorated cows standing in a winter landscape", "k": "겨울 풍경 속에 서 있는 장식된 소들을 보여 준다", "w": "같은 문장 앞쪽 그림(Red Sleigh)의 장소를 섞은 거예요. 두 그림은 서로 다른 풍경이에요."}, {"t": "shows red maple leaves standing in a flower field", "k": "꽃밭에 서 있는 붉은 단풍잎을 보여 준다", "w": "앞 그림의 소재(붉은 단풍잎)를 섞은 거예요. 제목 Pair of Oxen(소)과도 맞지 않아요."}, {"t": "shows decorated cows standing in a dark forest", "k": "어두운 숲에 서 있는 장식된 소들을 보여 준다", "w": "소는 맞지만 장소가 달라요. 밝고 마법 같은 분위기라는 다음 문장과도 어울리지 않아요."}, {"t": "shows frightened dogs running through a farm", "k": "농장을 달리는 겁먹은 개들을 보여 준다", "w": "Traylor의 개 그림 이야기예요."}]}, {"id": 18, "sec": "M2", "i": 26, "a": "create a magical quality, like that of a fairy tale", "ak": "마치 동화의 그것과 같은 마법 같은 특성을 만들어 낸다", "clue": "With these features(이러한 특징을 통해)는 앞 문장들의 단풍잎·꽃밭·장식된 소를 가리켜요. 현실에는 없는 꾸민 장면들이니 동화 같은 느낌이 와요.", "ds": [{"t": "create a magical quality, like that of a history book", "k": "역사책의 그것과 같은 마법 같은 특성을 만들어 낸다", "w": "magical quality(마법 같은 특성)는 같지만 비교 대상이 달라요. 장식된 소와 꽃밭은 역사책이 아니에요."}, {"t": "create a realistic quality, like that of a photograph", "k": "사진의 그것과 같은 사실적인 특성을 만들어 낸다", "w": "특별한 겨울 풍경, 장식된 소는 현실 그대로가 아니라서 사실적이라는 말과 맞지 않아요."}, {"t": "express a strong fear, like that of Traylor's paintings", "k": "Traylor의 그림과 같은 강한 두려움을 표현한다", "w": "Traylor의 이야기를 가져온 거예요. 밝은 그림에는 맞지 않아요."}, {"t": "create a gloomy mood, like that of a winter night", "k": "겨울밤과 같은 침울한 분위기를 만들어 낸다", "w": "밝은 색의 꽃밭과 장식된 소의 느낌과 반대예요."}]}, {"id": 19, "sec": "M2", "i": 27, "a": "inspired many people", "ak": "많은 사람에게 영감을 주었다", "clue": "As her paintings gradually gained popularity(그림이 점차 인기를 얻으면서)는 이야기가 널리 퍼졌다는 뜻이에요. 그래서 많은 사람에게 좋은 영향을 주었고, 그 결과 책과 영화로까지 만들어졌어요.", "ds": [{"t": "inspired only a few people", "k": "소수의 사람에게만 영감을 주었다", "w": "only a few(소수)로 범위를 좁힌 말이에요. 인기를 얻어 책과 영화로까지 만들어졌다는 흐름과 맞지 않아요."}, {"t": "was told only to her close friends", "k": "가까운 친구들에게만 전해졌다", "w": "only(~에게만)로 범위를 좁혔어요. 책과 영화로 만들어질 만큼 널리 알려졌어요."}, {"t": "discouraged many people", "k": "많은 사람의 의욕을 꺾었다", "w": "반대 방향이에요. 인기를 얻는 흐름에 맞지 않아요."}, {"t": "embarrassed many people", "k": "많은 사람을 당황하게 했다", "w": "그림이 인기를 얻는 것과 이어지지 않아요."}]}, {"id": 20, "sec": "A1", "i": 30, "a": "they all feature female figures", "ak": "그림에 모두 여성 인물이 등장한다", "clue": "공통된 주제(a common theme)가 무엇인지 설명하는 자리예요. 이 구간 뒤쪽에서 '당시 여성에게 드문 일', '기혼 여성에게 가해진 사회적 압력'처럼 계속 여성 이야기를 하고 있어요.", "ds": [{"t": "they all feature the same male figure", "k": "모두 같은 남성 인물이 등장한다", "w": "주제가 '여성'으로 이어지는 뒤 내용과 어긋나요."}, {"t": "they all feature winter landscapes", "k": "모두 겨울 풍경이 등장한다", "w": "Maud Lewis의 그림에서 가져온 내용이에요. 이 구간은 Ancher와 여성 이야기예요."}, {"t": "they all feature dogs and farms", "k": "모두 개와 농장이 등장한다", "w": "Traylor의 그림 소재를 가져온 거예요."}, {"t": "they never feature any human figures", "k": "인물이 전혀 등장하지 않는다", "w": "'공통된 주제'가 인물이 없다는 것일 수는 없고, 뒤에서 여성들의 이야기를 해요."}]}, {"id": 21, "sec": "A1", "i": 31, "a": "she later moved to Copenhagen to attend a private painting school", "ak": "그녀는 나중에 사립 회화 학교에 다니기 위해 코펜하겐으로 이주했다", "clue": "다음 문장 After that, she even studied abroad in Paris(그 후 그녀는 파리에서 유학까지 했다)에서 even(~까지)이 '그 전에는 국내에서 공부했다'는 걸 알려 줘요. 그래서 먼저 덴마크 안의 도시로 옮겼어요.", "ds": [{"t": "she later moved to Copenhagen to teach at a private painting school", "k": "그녀는 나중에 사립 회화 학교에서 가르치기 위해 코펜하겐으로 이주했다", "w": "attend(다니다)를 teach(가르치다)로 바꾼 거예요. 다음 문장에서 유학까지 했다는 '배우는' 흐름과 이어지지 않아요."}, {"t": "she later moved to Paris to attend a private painting school", "k": "그녀는 나중에 사립 회화 학교에 다니기 위해 파리로 이주했다", "w": "파리는 다음 문장(After that)에서 '그 후' 가는 곳이에요. 순서가 어긋나요."}, {"t": "she later moved to Nova Scotia to live with her aunt", "k": "그녀는 나중에 이모와 함께 살기 위해 노바스코샤로 이주했다", "w": "Maud Lewis의 이야기를 가져온 거예요."}, {"t": "she later moved to Montgomery to work in a factory", "k": "그녀는 나중에 공장에서 일하기 위해 몽고메리로 이주했다", "w": "Traylor의 이야기를 가져온 거예요."}]}, {"id": 22, "sec": "A1", "i": 32, "a": "studied abroad in Paris, which was unusual for women at the time", "ak": "파리에서 유학했는데, 그것은 당시 여성들에게 드문 일이었다", "clue": "even(~까지)은 놀라운 일에 쓰는 말이에요. 다음 문장 Thanks to her mother's encouragement(어머니의 격려 덕분에) 그 기회들을 활용할 수 있었다고 하니, 평범한 일이 아니라 드문 일이에요.", "ds": [{"t": "studied abroad in Paris, which was common for women at the time", "k": "파리에서 유학했는데, 그것은 당시 여성들에게 흔한 일이었다", "w": "unusual(드문)을 common(흔한)으로 바꾼 거예요. 'even'과 '격려 덕분에'의 흐름과 어긋나요."}, {"t": "studied abroad in Paris, which was impossible for women at the time", "k": "파리에서 유학했는데, 그것은 당시 여성들에게 불가능한 일이었다", "w": "불가능했다면 그녀가 실제로 유학할 수 없었을 거예요."}, {"t": "studied abroad in Paris, which was required for women at the time", "k": "파리에서 유학했는데, 그것은 당시 여성들에게 필수였다", "w": "required(필수)면 even이나 '격려 덕분에'라는 말이 필요하지 않아요."}, {"t": "studied abroad in Copenhagen, which was unusual for women at the time", "k": "코펜하겐에서 유학했는데, 그것은 당시 여성들에게 드문 일이었다", "w": "코펜하겐은 덴마크 안의 도시라서 abroad(해외)가 아니에요. 앞 문장에서 이미 코펜하겐으로 갔어요."}]}, {"id": 23, "sec": "A1", "i": 33, "a": "she was able to take advantage of these opportunities", "ak": "그녀는 이러한 기회를 활용할 수 있었다", "clue": "Thanks to(~덕분에)는 좋은 결과가 따라오는 표현이에요. 그리고 these opportunities(이러한 기회들)는 앞의 코펜하겐 학교와 파리 유학을 가리켜요.", "ds": [{"t": "she was able to take advantage of only one opportunity", "k": "그녀는 단 하나의 기회만 활용할 수 있었다", "w": "only one(하나만)으로 범위를 좁혔어요. 코펜하겐과 파리, 두 기회를 모두 누렸어요."}, {"t": "she was able to take advantage of these opportunities without anyone's help", "k": "그녀는 누구의 도움도 없이 이러한 기회를 활용할 수 있었다", "w": "Thanks to her mother's encouragement(어머니의 격려 덕분에)와 정면으로 부딪쳐요."}, {"t": "she was unable to take advantage of these opportunities", "k": "그녀는 이러한 기회를 활용할 수 없었다", "w": "Thanks to(덕분에)와 반대예요."}, {"t": "she was forced to give up these opportunities", "k": "그녀는 이러한 기회를 포기해야 했다", "w": "Thanks to(덕분에)와 반대예요."}]}, {"id": 24, "sec": "A1", "i": 34, "a": "persisted in painting", "ak": "그림을 계속 그렸다", "clue": "Even after getting married(결혼 후에도)와 objecting to(~에 반대하며)가 단서예요. 기혼 여성은 가사에만 집중하라는 압력에 반대했으니, 하던 그림을 계속 그린 거예요.", "d 을 하는 활동적인 모습이에요."}, {"t": "showcased them as lazy people avoiding everyday tasks", "k": "그들을 일상 작업을 피하는 게으른 사람으로 보여 주었다", "w": "〈부엌의 하녀〉와 〈바느질하는 어부의 아내〉는 일하는 모습이에요."}]}, {"id": 27, "sec": "A2", "i": 37, "a": "skillfully explored light and color", "ak": "빛과 색채를 능숙하게 탐구했다", "clue": "contributing to the rich Impressionist movement(풍부한 인상주의 운동에 기여했다)가 단서예요. 인상주의는 빛과 색을 중시하는 화풍이고, 다음 문장 〈푸른 방의 햇빛〉이 바로 그 예예요.", "ds": [{"t": "skillfully explored the roles of women", "k": "여성의 역할을 능숙하게 탐구했다", "w": "앞 문장의 소재를 가져온 거예요. 인상주의 운동(빛과 색)에 기여한 이야기와 이어지지 않아요."}, {"t": "skillfully explored everyday tasks in the kitchen", "k": "부엌의 일상 작업을 능숙하게 탐구했다", "w": "앞 문장 소재를 섞은 거예요. 다음 문장 〈푸른 방의 햇빛〉은 빛 이야기예요."}, {"t": "carefully avoided light and color", "k": "빛과 색채를 조심스럽게 피했다", "w": "같은 어구에 방향을 뒤집었어요. 인상주의 기여, 다음 문장 햇빛 묘사와 어긋나요."}, {"t": "criticized the use of light and color", "k": "빛과 색채의 사용을 비판했다", "w": "인상주의 운동에 기여했다는 말과 어긋나요."}]}, {"id": 28, "sec": "A2", "i": 38, "a": "the reflection of the sunlight on the blue wall is stunningly portrayed", "ak": "푸른 벽에 반사되는 햇빛이 굉장히 아름답게 묘사되어 있다", "clue": "작품 제목이 Sunlight in the Blue Room(푸른 방의 햇빛)이에요. 제목에 나오는 햇빛과 푸른색이 그대로 와야 하고, 앞 문장의 '빛과 색채를 능숙하게'와도 이어져요.", "ds": [{"t": "the reflection of the moonlight on the red wall is stunningly portrayed", "k": "붉은 벽에 반사되는 달빛이 굉장히 아름답게 묘사되어 있다", "w": "제목의 Sunlight(햇빛)·Blue(푸른)를 moonlight(달빛)·red(붉은)로 바꾼 거예요."}, {"t": "the shadow of the maid in the kitchen is stunningly portrayed", "k": "부엌에 있는 하녀의 그림자가 굉장히 아름답게 묘사되어 있다", "w": "같은 구간의 다른 작품(〈부엌의 하녀〉) 소재를 섞은 거예요. 이 작품 제목은 〈푸른 방의 햇빛〉이에요."}, {"t": "decorated cows standing in a flower field are stunningly portrayed", "k": "꽃밭에 서 있는 장식된 소들이 굉장히 아름답게 묘사되어 있다", "w": "Maud Lewis의 〈한 쌍의 소〉 소재를 가져온 거예요."}, {"t": "the reflection of the sunlight on the blue wall is poorly portrayed", "k": "푸른 벽에 반사되는 햇빛이 형편없이 묘사되어 있다", "w": "앞 문장에서 그녀가 빛과 색채를 '능숙하게' 탐구했다고 했으니, 서툴게 그렸다는 말은 맞지 않아요."}]}, {"id": 29, "sec": "A2", "i": 39, "a": "challenged the conventional roles of women in the 20th
