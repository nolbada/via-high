  if(rep&&c.sc&&d&&rep.pct<PASS)sub='<div style="font-size:12px;color:var(--sub);margin-top:2px">두 번 해 봤어요 · 열렸어요</div>';
  var ac='';
  if(cl)ac='<button class="btn g" data-a="care" data-id="'+c.id+'">잠김</button>';
  else if(!open)ac='<button class="btn g" data-a="'+(pl?'plus':'ses')+'" data-id="'+c.id+'">잠김</button>';
  else{
    ac='<a class="btn'+(d?' g':'')+'" href="'+c.href+'">열기</a>';
    if(c.k==='pdf'||c.k==='manual')ac+=d?'<button class="btn ok" data-a="undo" data-id="'+c.id+'">다 했어요 ✓</button>':'<button class="btn g" data-a="done" data-id="'+c.id+'">다 했어요</button>';
    if(c.k==='tonly')ac+=d?'<button class="btn ok" data-a="tundo" data-id="'+c.id+'">확인됨 ✓</button>':'<button class="btn g" data-a="tdone" data-id="'+c.id+'">선생님 확인</button>';
  }
  return '<div class="'+cls+'"><div class="no">'+(pl?'+':NUM[i])+'</div><div class="bd"><div class="nm">'+esc(c.nm)+'</div><div class="tg">'+tags+'</div>'+sub+'</div><div class="ac">'+ac+'</div></div>'
}
function render(){
  var out='';
  [3,4].forEach(function(n){
    var L=lesson(n),lo=lessonOpen(L);
    out+='<div class="les"><h2>'+L.title+'</h2><small>'+(lo?(lessonDone(L)?'모든 회차 완료':'수업 4회'):'앞 과를 끝내면 열려요')+'</small></div>';
    if(!lo){out+='<div class="lockmsg" style="padding:2px 4px 10px">3과 4회차를 끝내면 4과가 열려요. 빨리 끝낸 학생은 바로 넘어가도 돼요. 아래는 4과에서 하게 될 내용이에요. <button data-a="lesson" data-n="'+n+'" style="background:none;border:0;color:var(--sub);text-decoration:underline;font-size:12.5px;padding:4px">선생님 코드로 열기</button></div>'}
    L.ses.forEach(function(s,k){
      var op=sesOpen(L,k),core=s.core,cdone=core.filter(gating).every(done);
      var st=!op?'<span class="st">잠김</span>':(cdone?'<span class="st ok">완료</span>':'<span class="st now">진행 중</span>');
      out+='<div class="ses'+(op?'':' lk')+'"><div class="sh"><b>'+(k+1)+'회차</b><span class="t">'+s.t+'</span>'+st+'</div>';
      if(!op){out+='<div class="lockmsg">'+(lo?k+'회차를 끝내면 열려요 (앱은 70% 통과, 종이는 "다 했어요") <button data-a="ses" data-id="'+core[0].id+'" style="background:none;border:0;color:var(--sub);text-decoration:underline;font-size:12.5px;padding:4px">선생님 코드로 열기</button>':'앞 과를 끝내면 열려요')+'</div>'}
      var ordered=core.filter(function(c){return c.k!=='tonly'&&!c.ex}).concat(core.filter(function(c){return c.ex&&c.k!=='tonly'}),core.filter(function(c){return c.k==='tonly'}));
      ordered.forEach(function(c,i){out+=row(c,i,op,false)});
      var pf=(P()==='s'||P()==='c')?s.plus:[];
      if(P()==='b')pf=[];
      if(pf.length){
        var po=op&&cdone;
        out+='<div class="plus"><div class="ph">플러스 · '+(po?'열려 있어요':'이 회차 뼈대를 끝내면 열려요')+'</div>';
        pf.forEach(function(c,i){out+=row(c,i,po||!!S.unl[c.id],true)});out+='</div>'
      }
      out+='</div>'
    });
    out+='<div class="hw"><div class="sh"><b>숙제 코너</b><span class="t">회차와 따로, 하루에 한 번씩</span></div><div class="hh">세트를 끝까지 풀 때마다 점이 하나씩 켜져요. 3번이 목표예요. 이어풀기가 돼요.</div>';
    L.hw.forEach(function(c){
      var cl=closed(c),n3=Math.min(3,(J('gk26-hwauto',{})[c.id]||0)+(S.hw[c.id]||0)),dots='';
      for(var i=0;i<3;i++)dots+=i<n3?'●':'<i>●</i>';
      out+='<div class="c'+(cl?' off':'')+'"><div class="no" style="background:var(--sub)">·</div><div class="bd"><div class="nm">'+esc(c.nm)+'</div><div class="tg"><span class="tag app">앱</span></div><div class="dots">'+dots+'</div></div><div class="ac">'+
      (cl?'<button class="btn g" data-a="care" data-id="'+c.id+'">잠김</button>':'<a class="btn" href="'+c.href+'">열기</a>')+'</div></div>'
    });
    out+='</div>'
  });
  out+='<div class="les"><h2>모의고사 3주 · 총정리</h2><small>11월 중 열려요</small></div><div class="pv"><b>모의고사 1주</b> 지문 이해 · <b>2주</b> 유형 바꿔 풀기 · <b>3주</b> 금천형 실전<br><b>총정리</b> 교과서 복기 · 기출 정리<br><span style="font-size:13px">자료가 올라오는 대로 이곳에 카드가 켜져요.</span></div>';
  document.getElementById('app').innerHTML=out;
  var w=document.getElementById('who');w.textContent=code?'개인 주소로 들어왔어요':'';
  mapRender()
}
function cur(){var a=lesson(3),b=lesson(4);if(!lessonDone(a))return 0;if(!lessonDone(b)||!lessonOpen(b))return lessonOpen(b)?1:1;return 2}
function mapRender(){
  var N=[['3과','10/19~'],['4과','10/28~'],['모고 1주','11/7~'],['모고 2주','11/15~'],['모고 3주','11/22~'],['총정리','11/30~'],['기말고사','12/7']];
  var X=[56,86],y0=26,g=36,H=y0+g*6+30,c=cur(),s='<svg viewBox="0 0 340 '+H+'" role="img" aria-label="7주 여정 지도">';
  var p='';for(var i=0;i<7;i++){var x=X[i%2],y=y0+g*i;if(!i)p+='M'+x+' '+y;else{var px=X[(i-1)%2],py=y0+g*(i-1),m=(py+y)/2;p+=' C'+px+' '+m+','+x+' '+m+','+x+' '+y}}
  s+='<path d="'+p+'" fill="none" stroke="var(--line)" stroke-width="2.5" stroke-dasharray="2 6" stroke-linecap="round"/>';
  var dp='';for(var j=1;j<=c;j++){var qx=X[(j-1)%2],qy=y0+g*(j-1),mx=X[j%2],my=y0+g*j,mm=(qy+my)/2;dp+=(j===1?'M'+qx+' '+qy:'')+' C'+qx+' '+mm+','+mx+' '+mm+','+mx+' '+my}
  if(dp)s+='<path d="'+dp+'" fill="none" stroke="var(--pri)" stroke-width="3" stroke-linecap="round"/>';
  N.forEach(function(a,i){var x=X[i%2],y=y0+g*i,dn=i<c,is=i===c,last=i===6,f=dn?'var(--pri)':(is?'var(--amber)':'var(--card)'),st=(dn||is)?f:'var(--line)';
    if(is)s+='<circle cx="'+x+'" cy="'+y+'" r="16" fill="none" stroke="var(--amber)" stroke-width="1.5" opacity=".45"/>';
    s+='<circle cx="'+x+'" cy="'+y+'" r="'+(last?10:8)+'" fill="'+f+'" stroke="'+st+'" stroke-width="2.5"/>';
    if(last)s+='<path d="M'+x+' '+(y-10)+'V'+(y-27)+'L'+(x+17)+' '+(y-22)+'L'+x+' '+(y-17)+'" fill="var(--red)" stroke="var(--red)" stroke-width="1.5" stroke-linejoin="round"/>';
    s+='<text x="126" y="'+y+'" dominant-baseline="central" font-size="14.5" font-weight="700" fill="'+((dn||is||last)?'var(--ink)':'var(--sub)')+'">'+a[0]+'<tspan font-size="12" font-weight="400" fill="var(--sub)" dx="8">'+a[1]+(i>=2&&i<=5?' · 준비 중':'')+'</tspan></text>';
    if(is)s+='<text x="332" y="'+y+'" text-anchor="end" dominant-baseline="central" font-size="12.5" font-weight="700" fill="var(--amber)">지금 여기</text>'
  });
  document.getElementById('map').innerHTML=s+'</svg>'
}
function dd(){var t=new Date(),a=new Date(t.getFullYear(),t.getMonth(),t.getDate()),e=new Date(2026,11,7),n=Math.round((e-a)/864e5);document.getElementById('dn').textContent=n>0?'D-'+n:(n===0?'D-day':'D+'+(-n))}

var SHC=null;
var UKY=null;
function sheet(t,p,input,cb,ukey){UKY=ukey||null;document.getElementById('sht').textContent=t;document.getElementById('shp').textContent=p;var i=document.getElementById('shi');i.style.display=input?'block':'none';i.value='';document.getElementById('she').textContent='';document.getElementById('shy').style.display=input?'block':'none';SHC=cb;document.getElementById('sh').classList.add('on');if(input)setTimeout(function(){i.focus()},50)}

document.getElementById('shn').onclick=shut;

document.getElementById('shy').onclick=function(){var v=document.getElementById('shi').value.trim();if(!v)return;sha(v).then(function(h){if(h===TH&&SHC){var f=SHC;shut();f()}else if(UKY&&SHC&&code){sha(code+':'+UKY+':'+v.toLowerCase()).then(function(h2){if(UH.indexOf(h2)>=0){var f=SHC;shut();f()}else document.getElementById('she').textContent='코드가 맞지 않아요'})}else document.getElementById('she').textContent='코드가 맞지 않아요'})};

function findC(id){var r=null;[3,4].forEach(function(n){var L=lesson(n);L.ses.forEach(function(s){s.core.concat(s.plus).forEach(function(c){if(c.id===id)r=c})});L.hw.forEach(function(c){if(c.id===id)r=c})});return r}
document.getElementById('app').addEventListener('click',function(e){
  var b=e.target.closest('button[data-a]');if(!b)return;
  var a=b.dataset.a,id=b.dataset.id;
  if(a==='done'){S.done[id]=Date.now();save();render()}
  else if(a==='undo'){delete S.done[id];save();render()}
  else if(a==='tdone'){sheet('선생님 확인','선생님이 시험을 확인한 뒤 코드를 입력해요.',true,function(){S.done[id]=Date.now();save();render()})}
  else if(a==='tundo'){if(TM){delete S.done[id];save();render()}}
  else if(a==='hw'){S.hw[id]=Math.min(9,(S.hw[id]||0)+1);save();render()}
  else if(a==='care'){var c=findC(id);sheet('정규 수업 코스 자료예요','이 자료는 정규 수업에서 함께 쓰는 자료예요. 궁금하면 선생님께 물어봐요.',true,function(){S.unl[id]=1;save();render()})}
  else if(a==='plus'){sheet('플러스 자료','이 회차의 뼈대를 끝내면 열려요. 선생님이 알려 준 코드를 입력하면 지금 열 수 있어요.',true,function(){S.unl[id]=1;save();render()})}
  else if(a==='ses'){var c2=findC(id),m=/^L(\d)-/.exec(id),n=+m[1],L=lesson(n),k=0;L.ses.forEach(function(s,i){if(s.core.concat(s.plus).some(function(x){return x.id===id}))k=i});
    if(!lessonOpen(L))sheet('아직 잠겨 있어요','앞 과를 끝내면 열려요. 선생님이 알려 준 코드를 입력하면 지금 열 수 있어요.',true,function(){S.force['L'+n]=1;save();render()},'L'+n);
    else sheet('아직 잠겨 있어요',k+'회차를 끝내면 열려요. 앱은 70% 이상(두 번 해 보면 열려요), 종이는 "다 했어요"를 눌러요. 선생님이 알려 준 코드를 입력하면 지금 열 수 있어요.',true,function(){S.force[n+'-'+k]=1;save();render()},n+'-'+k)}
  else if(a==='lesson'){var nn=+b.dataset.n;sheet('4과 열기','선생님이 알려 준 코드를 입력하면 4과가 열려요.',true,function(){S.force['L'+nn]=1;save();render()},'L'+nn)}
});
