<link rel="icon" type="image/svg+xml" href="../icon.svg"><link rel="apple-touch-icon" href="../icon-180.png"><meta name="apple-mobile-web-app-title" content="금천고정답"></head><body><div class="wrap"><div class="top"><a class="back" href="../index.html">← 금천고 정답 목록</a></div><h1>4과 AI Neural Implants · 빈칸 추론 연습</h1><p class="lede">같은 지문에서 빈칸이 계속 바뀌어요. 한 번 나온 문제는 한 바퀴를 다 돌 때까지 다시 나오지 않아요.</p><div class="bar"><span class="prog" id="prog"></span><button id="kt" type="button">한글 해석 보기</button><button id="rs" type="button">처음부터 다시</button></div><div id="stage"></div><div class="foot">비타민 영어클리닉 · 금천고1 공통영어2 4과</div></div>
<script>
var D={"segs": [{"id": "A", "title": "신경 임플란트와 AI (도입)", "sents": ["Neuroscience has a long history of exploring treatments for disorders of the nervous system, including the brain and spinal cord", "Traditionally, researchers have studied various functions of neural implants, which are medical devices like computer chips that can be implanted in the nervous system", "But here's the exciting part: with the rapid advancement of artificial intelligence (AI), researchers have begun to integrate AI into neural implants", "In this post, we'll examine the incredible benefits of AI-powered neural implants, their amazing potential for the future, and the ethical concerns surrounding them", "First, let's explore how this fascinating technology has been applied", "The AI-powered neural implant has shown great promise in medical applications, offering solutions to a range of problems"], "a": 0, "theme": "AI 신경 임플란트는 오랜 신경계 치료 연구의 놀라운 진전이지만, 윤리 문제도 함께 따진다는 도입이에요.", "kos": ["신경과학은 뇌와 척수를 포함한 신경계 질환에 대한 치료법을 탐구해 온 오랜 역사가 있다.", "전통적으로 연구자들은 신경 임플란트의 다양한 기능을 연구해 왔고, 이것은 신경계에 이식될 수 있는 컴퓨터 칩과 같은 의료 기기이다.", "하지만 흥미로운 점은 여기 있다. 그건 바로 인공지능(AI)의 급속한 발전과 함께 연구자들이 신경 임플란트에 AI를 통합하기 시작했다는 점이다.", "이 글에서는 AI 기반 신경 임플란트의 뛰어난 장점과 앞으로의 놀라운 잠재력, 그리고 이를 둘러싼 윤리적 우려에 대해 살펴볼 것이다.", "먼저 이 매혹적인 기술이 어떻게 적용되었는지 살펴보자.", "AI 기반 신경 임플란트는 다양한 문제에 대한 해결책을 제시하며 의료 분야 적용에서 큰 가능성을 보여 주었다."]}, {"id": "B", "title": "의료 분야 활용", "sents": ["For instance, neural implants are used to treat brain disorders like Parkinson's disease", "These implants electrically stimulate targeted regions of the brain at the right time with the help of AI to restore normal brain activity", "In addition, paralyzed people can have the ability to walk again with the help of a “digital bridge” between two implants inserted into their brain and spine", "When they think about moving their legs, the AI analyzes the brain signals and sends them to their legs through the implants", "Similarly, those who have lost their arms can use artificial arms operated by the same mechanism"], "a": 6, "theme": "AI 임플란트는 파킨슨병, 마비, 의수 같은 의료 현장에서 이미 실제로 쓰이고 있다는 얘기예요.", "kos": ["예를 들어, 신경 임플란트는 파킨슨병과 같은 뇌 질환을 치료하는 데 사용된다.", "이러한 임플란트는 정상적인 뇌 활동을 회복시키기 위해 AI의 도움을 받아 적시에 뇌의 표적 부위를 전기로 자극한다.", "또한 마비 환자들은 뇌와 척추에 삽입된 두 개의 임플란트 사이에 있는 '디지털 브릿지'의 도움으로 다시 걸을 수 있는 능력을 가질 수 있다.", "환자가 다리를 움직이려고 생각하면 AI가 뇌 신호를 분석하여 임플란트를 통해 다리로 신호를 보낸다.", "마찬가지로 팔을 잃은 사람들도 동일한 메커니즘으로 작동하는 의수를 사용할 수 있다."]}, {"id": "C", "title": "미래 전망 ①", "sents": ["The success of AI-powered neural implants in health care is also expected to spread to other industries", "Some futurists predict that these implants will become commercially available in the next 20 to 30 years and significantly change our daily lives", "For example, advances in neural implant technology will make it possible to install in our brains software that can read our minds", "This could enable us to play games, type social media messages, and stream music simply by thinking", "There is also great potential for memory-enhancing brain implants, similar to computer memory chips"], "a": 11, "theme": "임플란트의 성공은 의료를 넘어 일상으로 번져 생각만으로 기기를 쓰는 시대가 온다는 얘기예요.", "kos": ["의료 분야에서의 AI 기반 신경 임플란트의 성공은 다른 산업 분야로도 확산될 것으로 예상된다.", "일부 미래학자들은 이러한 임플란트가 향후 20~30년 이내에 상용화되어 우리의 일상을 크게 변화시킬 것이라고 예측한다.", "예를 들어, 신경 임플란트 기술의 발전으로 우리의 마음을 읽을 수 있는 소프트웨어를 뇌에 설치하는 것이 가능해질 것이다.", "이것은 우리가 생각만으로 게임을 하고, 소셜 미디어 메시지를 입력하고, 음악을 스트리밍하는 것이 가능하도록 해 줄 것이다.", "컴퓨터 메모리 칩과 유사한 기억력 향상 뇌 임플란트도 큰 잠재력을 가지고 있다."]}, {"id": "D", "title": "미래 전망 ②", "sents": ["Such devices would allow us to capture and enhance memories, and even upload and download them using the digital cloud", "We could look through our memories like a social media feed, vividly recall our favorite life moments, share memories with others, and back up our most valuable memories", "Finally, AI-powered neural implants would revolutionize the way our brains work", "The role of the brain would shift from learning and storing information to processing the vast amounts of data provided by the implants", "Instead of simply memorizing information, we would be able to download knowledge, use our creativity to interpret it, and generate new ideas"], "a": 16, "theme": "기억을 올리고 내려받으면 뇌의 역할이 외우기에서 활용하기로 바뀔 거라는 얘기예요.", "kos": ["이러한 장치를 사용하면 기억을 캡처하고 향상시킬 수 있으며, 디지털 클라우드를 사용하여 기억을 업로드 및 다운로드할 수도 있다.", "우리는 소셜 미디어 피드처럼 기억을 살펴보고, 인생에서 가장 좋았던 순간을 생생하게 회상하고, 다른 사람들과 기억을 공유하고, 가장 소중한 기억을 백업할 수 있을 것이다.", "마지막으로, AI 기반 신경 임플란트는 우리 뇌의 작동 방식에 혁명을 일으킬 것이다.", "뇌의 역할이 정보를 학습하고 저장하는 것에서 임플란트가 제공하는 방대한 양의 데이터를 처리하는 것으로 바뀌게 될 것이다.", "우리는 단순히 정보를 암기하는 대신 지식을 다운로드하고, 창의력을 발휘하여 그 지식을 해석하고, 새로운 아이디어를 창출할 수 있게 될 것이다."]}, {"id": "E", "title": "윤리적 문제 ①", "sents": ["Before we can fully embrace the era of AI-powered neural implants, many tricky ethical issues should be addressed", "The integration of AI technology with the human brain raises concerns about what it means to be human", "Our brains are believed to be central to our identity, existence, and value as human beings", "However, an over-reliance on technology may delay our natural development and create confusion about whether we are human, AI, or something in between", "Another critical issue is privacy", "There's a risk that organizations or hackers could access personal data without permission through AI-connected implants"], "a": 21, "theme": "좋은 기술이어도 인간다움, 의존, 개인 정보 문제를 먼저 해결해야 한다는 얘기예요.", "kos": ["우리가 AI 기반 신경 임플란트 시대를 완전히 받아들이기 전에, 여러 가지 까다로운 윤리적 문제들이 해결되어야 한다.", "AI 기술과 인간의 뇌를 통합하는 것은 인간이라는 존재가 무엇을 의미하는가에 대한 우려를 제기한다.", "우리의 두뇌는 인간으로서의 정체성, 존재, 가치의 중심이라고 여겨진다.", "그러나 기술에 대한 지나친 의존은 우리의 자연스러운 발달을 지연시키고 우리가 인간인지, AI인지, 아니면 그 중간인지에 대한 혼란을 야기할 수 있다.", "또 다른 중요한 문제는 프라이버시이다.", "조직이나 해커가 AI와 연결된 임플란트를 통해 허가 없이 개인 정보에 접근할 수 있는 위험이 있다."]}, {"id": "F", "title": "윤리적 문제 ②와 신경 윤리", "sents": ["This means that our thoughts, emotions, and behaviors could be controlled by hackers", "There's an additional risk that this technology could lead to even greater social inequality, given that it may not be available to all due to its high cost", "Such unequal access to the technology could intensify the division between those who can afford the implants and those who cannot", "I hope that we can overcome these challenges through careful consideration of neuroethics", "This field highlights the social aspects of neural technology and provides possible answers to what should be considered legal and ethical", "I think it is important to establish a prior review process and thoroughly assess the ethical aspects before any kind of brain research is conducted", "This will ensure that science and technology progress in accordance with ethical principles", "What do you think about this technology?", "Please share your opinion in the comments section below"], "a": 27, "theme": "해킹과 불평등 위험이 크니 연구 전에 윤리 검토를 거쳐 기술을 발전시키자는 얘기예요.", "kos": ["이는 우리의 생각, 감정, 행동이 해커에 의해 통제될 수 있다는 뜻이다.", "또한 이 기술은 높은 비용으로 인해 모든 사람에게 제공되지 않을 수 있다는 점에서 사회적 불평등을 더욱 심화시킬 수 있다는 추가적인 위험도 있다.", "기술에 대한 이러한 불평등한 접근성은 임플란트 비용을 감당할 수 있는 사람과 그렇지 않은 사람 사이의 분열을 심화시킬 수 있다.", "나는 신경 윤리에 대한 신중한 고찰을 통해 우리가 이러한 난제를 극복할 수 있기를 바란다.", "이 분야는 신경 기술의 사회적 측면을 강조하고 무엇이 합법적이고 윤리적으로 여겨져야 하는지에 대한 가능한 대답을 제시한다.", "나는 어떤 종류의 뇌 연구를 수행하기 전에 사전 검토 프로세스를 확립하고 윤리적 측면을 철저히 평가하는 것이 중요하다고 생각한다.", "이는 과학과 기술이 윤리적 원칙에 따라 발전하도록 보장할 것이다.", "이 기술에 대해 여러분은 어떻게 생각하는가?", "아래 댓글란에 여러분의 의견을 공유해 주기 바란다."]}, {"id": "G", "title": "댓글", "sents": ["Eric Davis: Wow, AI-powered neural implants sound incredible!", "I can't believe that AI can help the disabled walk again and use artificial arms that move according to their thoughts!", "Yumi Lee: Well, the technology sounds amazing, but I'm really worried about the privacy issues it might cause", "I think it is necessary to strictly enforce privacy laws to protect the personal information of individuals", "Andy Taylor: Thank you all for sharing your thoughts", "I'll talk more about how to address the concerns in my next post"], "a": 36, "theme": "댓글은 기술의 장점에 감탄하면서도 프라이버시 걱정과 대책을 이야기해요.", "kos": ["Eric Davis: 와, AI 기반 신경 임플란트는 정말 놀랍다!", "AI가 장애인을 다시 걸을 수 있게 돕고 생각에 따라 움직이는 의수를 사용하도록 도와줄 수 있다는 것이 믿기지 않는다!", "Yumi Lee: 음, 이 기술은 대단해 보이지만, 나는 이로 인해 발생할 수 있는 프라이버시 문제가 정말 걱정된다.", "개인 정보 보호를 위해 개인 정보 보호법을 엄격하게 시행할 필요가 있다고 생각한다.", "Andy Taylor: 의견을 공유해 준 모든 분께 감사한다.", "나의 다음 글에서 이러한 우려를 해결하는 방법에 관해 더 이야기하겠다."]}], "items": [{"seg": 0, "si": 0, "ans": "disorders of the nervous system", "ako": "신경계 질환", "clue": "빈칸 바로 뒤에 <b class=\"en\">including the brain and spinal cord</b>(뇌와 척수를 포함한)이 붙어 있어요. 뇌와 척수가 들어가는 '계통'은 신경계뿐이에요.", "ds": [["disorders of the brain only", "뇌에만 생기는 질환", "뒤에 '뇌와 척수를 포함한'이 있어서 뇌 '만'이라고 하면 범위가 좁아져요."], ["disorders caused by neural implants", "신경 임플란트가 일으키는 질환", "임플란트는 치료 수단이지 병의 원인이 아니에요. 문장 앞의 '치료법을 탐구'와 어긋나요."], ["all diseases of the human body", "인체의 모든 질병", "'모든'은 지나친 단정이고, 뒤의 '뇌와 척수를 포함한'과 범위가 안 맞아요."], ["diseases of the digestive system", "소화계 질환", "뇌와 척수는 소화계가 아니라 신경계에 속해요."]], "ko": "신경과학은 뇌와 척수를 포함한 신경계 질환에 대한 치료법을 탐구해 온 오랜 역사가 있다."}, {"seg": 0, "si": 1, "ans": "that can be implanted in the nervous system", "ako": "신경계에 이식될 수 있는", "clue": "<b class=\"en\">neural implants</b>(신경 임플란트)를 풀어 설명하는 자리예요. <b class=\"en\">implant</b>(임플란트)는 몸 안에 '심는' 장치라서 몸 안에 넣는다는 말이 와야 해요.", "ds": [["that can be upgraded with the help of AI", "AI의 도움으로 업그레이드될 수 있는", "AI는 다음 문장에서 '하지만(But)' 새로 등장해요. 이 문장은 '전통적으로' 알려진 임플란트의 정의를 말해요."], ["that can be implanted in every part of the human body", "인체의 모든 부위에 이식될 수 있는", "'신경(neural)' 임플란트는 신경계에 심는 것이에요. '모든 부위'는 과장이에요."], ["that can be removed from the nervous system", "신경계에서 제거될 수 있는", "임플란트는 '심는' 기기인데 '제거'는 정의가 거꾸로예요."], ["that can be worn outside the human body", "몸 밖에 착용할 수 있는", "몸 밖에 차는 기기는 임플란트가 아니에요."]], "ko": "전통적으로 연구자들은 신경 임플란트의 다양한 기능을 연구해 왔고, 이것은 신경계에 이식될 수 있는 컴퓨터 칩과 같은 의료 기기이다."}, {"seg": 0, "si": 2, "ans": "have begun to integrate AI into neural implants", "ako": "신경 임플란트에 AI를 통합하기 시작했다", "clue": "<b class=\"en\">here&#x27;s the exciting part</b>(흥미로운 점은 여기 있다)라고 했으니 좋은 소식이 와야 해요. 거기에 <b class=\"en\">rapid advancement of AI</b>(AI의 급속한 발전)이 이유로 붙어 있어요.", "ds": [["have studied various functions of neural implants", "신경 임플란트의 다양한 기능을 연구해 왔다", "바로 앞 문장(전통적으로 연구해 왔다)과 같은 내용이에요. '하지만(But)' 흥미로운 새 소식이 와야 해요."], ["have already integrated AI into every neural implant", "이미 모든 신경 임플란트에 AI를 통합했다", "'이미 모든'은 과장이에요. 이제 막 시작했다는 'begun(시작했다)' 흐름이 맞아요."], ["have failed to apply AI to neural implants", "신경 임플란트에 AI를 적용하는 데 실패했다", "'흥미로운 점'이라고 했는데 실패는 흐름에 안 맞아요."], ["have decided to replace neural implants with AI", "신경 임플란트를 AI로 대체하기로 했다", "글 전체는 임플란트에 AI를 '더하는' 이야기예요."]], "ko": "하지만 흥미로운 점은 여기 있다. 그건 바로 인공지능(AI)의 급속한 발전과 함께 연구자들이 신경 임플란트에 AI를 통합하기 시작했다는 점이다."}, {"seg": 0, "si": 3, "ans": "incredible benefits", "ako": "놀라운 장점", "clue": "'<b class=\"en\">the ___ of AI-powered neural implants</b>(AI 기반 신경 임플란트의 ___)'에 이어 <b class=\"en\">their amazing potential</b>(그것들의 놀라운 잠재력)이 나와요. 앞 문장도 <b class=\"en\">exciting</b>(흥미로운)이라서 긍정적인 말이 먼저 와요. 위험은 맨 끝의 <b class=\"en\">ethical concerns</b>(윤리적 우려)가 따로 맡아요.", "ds": [["ethical concerns", "윤리적 우려", "맨 끝에 '윤리적 우려(the ethical concerns)'가 따로 나와서 같은 말이 두 번 되고, 긍정적인 나열과도 안 맞아요."], ["limited benefits", "제한적인 장점", "장점이긴 하지만 '놀라운 잠재력', '흥미로운 점'이라는 강한 긍정 분위기와 정도가 안 맞아요."], ["long history", "오랜 역사", "AI를 넣기 시작한 건 최근이라고 바로 앞 문장에서 말했어요."], ["high costs", "높은 비용", "앞뒤가 모두 긍정적인 말인데 비용은 맞지 않아요."]], "ko": "이 글에서는 AI 기반 신경 임플란트의 뛰어난 장점과 앞으로의 놀라운 잠재력, 그리고 이를 둘러싼 윤리적 우려에 대해 살펴볼 것이다."}, {"seg": 0, "si": 5, "ans": "offering solutions to a range of problems", "ako": "다양한 문제에 해결책을 제시하며", "clue": "<b class=\"en\">has shown great promise</b>(큰 가능성을 보여 주었다)가 앞에 있어요. 가능성이 크다고 한 이유가 뒤에 와야 하니 '문제를 해결해 준다'는 말이 자연스러워요.", "ds": [["offering a perfect solution to every problem", "모든 문제에 완벽한 해결책을 제시하며", "'모든 문제에 완벽한'은 과장이에요. 본문은 '다양한(a range of) 문제'라고 해요."], ["making it possible to read our minds", "우리의 마음을 읽는 것을 가능하게 하며", "마음 읽기는 미래 이야기예요. 이 문장은 '의료 분야 적용(medical applications)'을 말해요."], ["causing a range of unexpected problems", "예상치 못한 다양한 문제를 일으키며", "문제를 일으킨다면 '큰 가능성'의 이유가 될 수 없어요."], ["solving only a single minor problem", "사소한 문제 하나만 해결하며", "'큰 가능성'과 '다양한 문제'에 비해 너무 작아요."]], "ko": "AI 기반 신경 임플란트는 다양한 문제에 대한 해결책을 제시하며 의료 분야 적용에서 큰 가능성을 보여 주었다."}, {"seg": 1, "si": 0, "ans": "treat brain disorders like Parkinson's disease", "ako": "파킨슨병 같은 뇌 질환을 치료하다", "clue": "<b class=\"en\">For instance</b>(예를 들어)로 시작해요. 앞 문장에서 '의료 분야에서 문제를 해결해 준다'고 했으니, 그 예로 병을 <b class=\"en\">treat</b>(치료하다)하는 말이 와야 해요. 신경(neural) 임플란트이니 뇌 질환이 어울려요.", "ds": [["cure every brain disorder permanently", "모든 뇌 질환을 영구적으로 치료하다", "'모든 뇌 질환을 영구적으로'는 지나친 단정이고, '예를 들어(For instance)'는 파킨슨병 같은 구체적 예를 들어야 해요."], ["help paralyzed people walk again", "마비 환자가 다시 걷도록 돕다", "마비 환자 이야기는 뒤에서 '또한(In addition)'으로 따로 나와요. 첫 번째 예시는 뇌 질환이에요."], ["cause brain disorders like Parkinson's disease", "파킨슨병 같은 뇌 질환을 일으키다", "의료 분야의 '해결책' 예시인데 병을 일으킨다면 반대예요."], ["treat heart disorders like a heart attack", "심장마비 같은 심장 질환을 치료하다", "신경 임플란트의 대상은 심장이 아니라 뇌 같은 신경계예요."]], "ko": "예를 들어, 신경 임플란트는 파킨슨병과 같은 뇌 질환을 치료하는 데 사용된다."}, {"seg": 1, "si": 1, "ans": "restore normal brain activity", "ako": "정상적인 뇌 활동을 회복시키다", "clue": "<b class=\"en\">electrically stimulate targeted regions of the brain</b>(뇌의 표적 부위를 전기로 자극한다)는 것이 치료 방법이에요. 앞 문장에서 파킨슨병 같은 병을 치료한다고 했으니 목적은 정상 상태를 되찾는 것이에요.", "ds": [["enhance brain activity beyond normal levels", "뇌 활동을 정상 수준 이상으로 높이다", "병을 치료한다는 흐름인데 '정상 이상'은 치료의 목적이 아니라 과장이에요."], ["control the patient's thoughts and emotions", "환자의 생각과 감정을 통제하다", "생각·감정을 통제하는 건 뒤쪽 '위험' 이야기예요. 이 문장은 의료 활용의 장점이에요."], ["destroy normal brain activity", "정상적인 뇌 활동을 파괴하다", "치료 이야기인데 정상 활동을 파괴한다면 정반대예요."], ["stop all brain activity completely", "모든 뇌 활동을 완전히 멈추다", "뇌 활동을 완전히 멈추면 치료가 아니에요."]], "ko": "이러한 임플란트는 정상적인 뇌 활동을 회복시키기 위해 AI의 도움을 받아 적시에 뇌의 표적 부위를 전기로 자극한다."}, {"seg": 1, "si": 2, "ans": "have the ability to walk again", "ako": "다시 걸을 수 있는 능력을 갖다", "clue": "마비 환자(paralyzed people)에게 <b class=\"en\">with the help of a digital bridge</b>(디지털 브릿지의 도움으로) 일어나는 일이에요. 도움을 받아 이루어지는 좋은 결과가 와야 하고, 바로 다음 문장이 다리를 움직이는 이야기예요.", "ds": [["use artificial arms again", "의수를 다시 사용하다", "의수 이야기는 두 문장 뒤에 '마찬가지로(Similarly)'로 따로 나와요. 이 문장은 걷는 이야기예요."], ["be treated for Parkinson's disease", "파킨슨병 치료를 받다", "파킨슨병은 앞 문장에서 이미 나온 예시예요. '또한(In addition)'은 다른 예를 더하는 말이에요."], ["learn to walk without any help", "아무 도움 없이 걷는 법을 배우다", "바로 뒤에 '디지털 브릿지의 도움으로'가 있어서 '도움 없이'와 충돌해요."], ["run faster than ordinary people", "보통 사람보다 빨리 달리다", "마비 환자가 '다시 걷는다'는 이야기에서 '더 빨리 달린다'는 과장이에요."]], "ko": "또한 마비 환자들은 뇌와 척추에 삽입된 두 개의 임플란트 사이에 있는 '디지털 브릿지'의 도움으로 다시 걸을 수 있는 능력을 가질 수 있다."}, {"seg": 1, "si": 3, "ans": "sends them to their legs through the implants", "ako": "임플란트를 통해 그 신호를 다리로 보낸다", "clue": "<b class=\"en\">When they think about moving their legs</b>(다리를 움직이려고 생각하면)이라는 조건이 있어요. AI가 뇌 신호를 분석한 뒤에는 다리를 움직이게 하려고 신호를 <b class=\"en\">legs</b>(다리)로 보내야 해요.", "ds": [["sends them back to the brain through the implants", "임플란트를 통해 그 신호를 뇌로 되돌려 보낸다", "신호가 뇌로 되돌아가면 다리가 움직이지 못해요. 신호는 뇌에서 다리로 가야 해요."], ["sends them to their arms through the implants", "임플란트를 통해 그 신호를 팔로 보낸다", "'다리를 움직이려고 생각하면'이라고 했고, 팔은 다음 문장에서 따로 나와요."], ["sends them to the doctor through the Internet", "인터넷을 통해 그 신호를 의사에게 보낸다", "환자가 걷게 하려면 신호가 다리로 가야지 의사에게 갈 필요가 없어요."], ["blocks them from reaching their legs", "그 신호가 다리에 닿지 못하게 막는다", "신호를 막으면 걷게 도와준다는 앞 문장과 반대예요."]], "ko": "환자가 다리를 움직이려고 생각하면 AI가 뇌 신호를 분석하여 임플란트를 통해 다리로 신호를 보낸다."}, {"seg": 1, "si": 4, "ans": "operated by the same mechanism", "ako": "같은 원리로 작동하는", "clue": "<b class=\"en\">Similarly</b>(마찬가지로)가 앞에 있어요. 다리 이야기와 '비슷한' 방식이라는 뜻이니 같은 원리로 작동한다는 말이 와야 해요.", "ds": [["operated by the same mechanism without any implants", "임플란트 없이 같은 원리로 작동하는", "'같은 원리'는 임플란트로 뇌 신호를 보내는 것이라서 '임플란트 없이'는 모순이에요."], ["operated by a completely different mechanism", "완전히 다른 원리로 작동하는", "'마찬가지로(Similarly)'와 반대로 '다른' 방식이라고 하면 어긋나요."], ["operated by the patients' own hands", "환자 자신의 손으로 작동하는", "팔을 잃은 사람들 이야기이므로 손으로 움직일 수 없어요."], ["operated by hackers through the cloud", "클라우드를 통해 해커가 조종하는", "해커 이야기는 뒤쪽 '위험' 부분이고, 여기는 의료 활용의 장점이에요."]], "ko": "마찬가지로 팔을 잃은 사람들도 동일한 메커니즘으로 작동하는 의수를 사용할 수 있다."}, {"seg": 2, "si": 0, "ans": "spread to other industries", "ako": "다른 산업으로 확산되다", "clue": "<b class=\"en\">also</b>(또한)이 있어서 의료 분야 말고 '다른 곳에도' 퍼진다는 뜻이 와야 해요. 문장 앞부분이 '의료 분야에서의 성공'이에요.", "ds": [["become commercially available soon", "곧 상용화되다", "상용화는 다음 문장에서 '향후 20~30년'으로 따로 나오고, 이 문장은 '다른 산업으로의 확산'이에요."], ["be limited to health care only", "의료 분야에만 한정되다", "'또한(also)'과 어긋나요. 다른 분야로 넓어진다는 말이 필요해요."], ["fall behind in other industries", "다른 산업에서 뒤처지다", "성공이 '번져 간다'는 흐름과 맞지 않아요."], ["stop at the hospital door", "병원 문턱에서 멈추다", "'또한'이 있어 의료 밖으로 나가야 하는데 병원 안에 머문다는 말이 돼요."]], "ko": "의료 분야에서의 AI 기반 신경 임플란트의 성공은 다른 산업 분야로도 확산될 것으로 예상된다."}, {"seg": 2, "si": 1, "ans": "become commercially available in the next 20 to 30 years", "ako": "향후 20~30년 이내에 상용화되다", "clue": "뒤에 <b class=\"en\">significantly change our daily lives</b>(우리의 일상을 크게 바꾼다)가 이어져요. 일상을 바꾸려면 병원 밖에서 일반 사람이 살 수 있어야 하니 '상용화'가 와야 해요.", "ds": [["be used only for medical treatment in the next 20 to 30 years", "향후 20~30년 동안 의료 치료에만 쓰이다", "'오직 의료용'이면 뒤의 '일상을 크게 바꾼다'와 맞지 않아요."], ["stay only in hospitals in the next 20 to 30 years", "향후 20~30년 동안 병원에만 머물다", "병원에만 있으면 일상을 크게 바꿀 수 없어요."], ["be banned in most countries in the next 20 to 30 years", "향후 20~30년 안에 대부분의 나라에서 금지되다", "금지되면 일상을 바꾼다는 뒤 내용과 안 맞아요."], ["be given free to everyone in the next 20 to 30 years", "향후 20~30년 안에 모두에게 무료로 주어지다", "'모두에게 무료'는 근거 없는 과장이고, '상용화'라는 흐름과도 달라요."]], "ko": "일부 미래학자들은 이러한 임플란트가 향후 20~30년 이내에 상용화되어 우리의 일상을 크게 변화시킬 것이라고 예측한다."}, {"seg": 2, "si": 2, "ans": "can read our minds", "ako": "우리의 마음을 읽을 수 있는", "clue": "다음 문장이 <b class=\"en\">play games, type messages, and stream music simply by thinking</b>(생각만으로 게임을 하고 메시지를 입력하고 음악을 듣는다)예요. 생각을 기계가 알아채야 가능한 일이니 마음을 '읽는' 소프트웨어예요.", "ds": [["can restore normal brain activity", "정상적인 뇌 활동을 회복시킬 수 있는", "앞 문단의 의료 이야기예요. 다음 문장의 '생각만으로 게임을 한다'와 이어지지 않아요."], ["can read everyone's minds without permission", "허락 없이 모든 사람의 마음을 읽을 수 있는", "'우리의(our)'가 아니라 '모두의 마음을 허락 없이'는 과장이고, 장점을 말하는 'For example(예를 들어)'과도 안 맞아요."], ["can store our whole minds in the cloud", "우리의 마음 전체를 클라우드에 저장할 수 있는", "저장은 뒤의 기억 이야기예요. 다음 문장의 '생각만으로 한다'와 연결되지 않아요."], ["can translate every language for us", "모든 언어를 우리 대신 번역해 줄 수 있는", "다음 문장의 '생각만으로 한다'와 이어지지 않아요."]], "ko": "예를 들어, 신경 임플란트 기술의 발전으로 우리의 마음을 읽을 수 있는 소프트웨어를 뇌에 설치하는 것이 가능해질 것이다."}, {"seg": 2, "si": 3, "ans": "simply by thinking", "ako": "그저 생각하는 것만으로", "clue": "'게임을 하고, 메시지를 입력하고, 음악을 듣는' 것은 평소엔 손으로 하는 일이에요. 앞 문장의 <b class=\"en\">software that can read our minds</b>(우리의 마음을 읽는 소프트웨어) 덕분에 '생각만으로'가 가능해져요.", "ds": [["after we upload our memories to the cloud", "기억을 클라우드에 올린 뒤에", "기억 업로드는 뒤에서 따로 나오는 이야기이고, 게임·메시지·음악과 조건이 이어지지 않아요."], ["by moving our legs", "다리를 움직여서", "'생각만으로'가 핵심인데 다리를 움직이는 건 마비 환자 이야기예요."], ["only with our hands", "오직 손으로만", "마음을 읽는 소프트웨어를 설치했는데 손으로만 한다면 의미가 없어요."], ["by pressing many buttons", "많은 버튼을 눌러서", "앞 문장에서 말한 기술의 장점이 사라져요."]], "ko": "이것은 우리가 생각만으로 게임을 하고, 소셜 미디어 메시지를 입력하고, 음악을 스트리밍하는 것이 가능하도록 해 줄 것이다."}, {"seg": 2, "si": 4, "ans": "memory-enhancing brain implants", "ako": "기억력을 향상시키는 뇌 임플란트", "clue": "뒤에 <b class=\"en\">similar to computer memory chips</b>(컴퓨터 메모리 칩과 유사한)이 있고 앞에 <b class=\"en\">great potential</b>(큰 잠재력)이 있어요. 기억을 담는 메모리 칩과 비슷한 뇌 임플란트는 기억력을 높이는 임플란트예요.", "ds": [["mind-reading brain implants", "마음을 읽는 뇌 임플란트", "마음 읽기는 앞 문장에서 이미 나왔고 '또한(also)'은 다른 가능성이에요. 메모리 칩과 닮은 것도 아니에요."], ["memory-enhancing computer chips", "기억력을 높이는 컴퓨터 칩", "'컴퓨터 메모리 칩과 유사한'이라고 했으니 칩을 칩과 비교하면 말이 안 돼요. 뇌 임플란트가 와야 해요."], ["memory-erasing brain implants", "기억을 지우는 뇌 임플란트", "'큰 잠재력'이 있다고 할 만한 내용이 아니고 메모리 칩의 역할(기억 보관)과도 달라요."], ["speed-enhancing leg implants", "속도를 높이는 다리 임플란트", "메모리 칩과 닮았다는 설명과 관계가 없어요."]], "ko": "컴퓨터 메모리 칩과 유사한 기억력 향상 뇌 임플란트도 큰 잠재력을 가지고 있다."}, {"seg": 3, "si": 0, "ans": "upload and download", "ako": "업로드하고 다운로드하다", "clue": "<b class=\"en\">using the digital cloud</b>(디지털 클라우드를 사용하여)가 뒤에 있어요. 클라우드를 쓸 때 하는 일은 올리고 내려받는 것이에요. 또 <b class=\"en\">even</b>(심지어)가 있어서 앞 내용(기억을 담고 키우기)보다 한 걸음 더 나가요.", "ds": [["capture and enhance", "캡처하고 향상시키다", "이 두 가지는 앞에서 이미 말했어요. '심지어(even)'는 한 걸음 더 나아간 일이 와야 해요."], ["learn and store", "학습하고 저장하다", "'학습하고 저장'은 지금까지의 뇌의 역할이에요. 디지털 클라우드를 쓰는 새 기능이 와야 해요."], ["hide and destroy", "숨기고 파괴하다", "디지털 클라우드의 쓰임새와 맞지 않아요."], ["weaken and erase", "약하게 만들고 지우다", "앞에서 기억을 '향상'한다고 했어요."]], "ko": "이러한 장치를 사용하면 기억을 캡처하고 향상시킬 수 있으며, 디지털 클라우드를 사용하여 기억을 업로드 및 다운로드할 수도 있다."}, {"seg": 3, "si": 1, "ans": "back up our most valuable memories", "ako": "가장 소중한 기억을 백업하다", "clue": "'소셜 미디어 피드처럼 보기, 좋았던 순간 회상하기, 공유하기'처럼 기억으로 할 수 있는 좋은 일을 나열하는 문장이에요. <b class=\"en\">and</b>(그리고)로 이어지는 마지막 항목도 같은 방향이어야 해요.", "ds": [["share our memories with others", "다른 사람들과 기억을 공유하다", "바로 앞 항목에 이미 '공유하기(share memories with others)'가 있어서 같은 말이 반복돼요."], ["download other people's memories without permission", "허락 없이 다른 사람들의 기억을 내려받다", "'우리가 누릴 수 있는 좋은 일' 나열이에요. '허락 없이'는 뒤쪽 위험 이야기예요."], ["lose our most valuable memories", "가장 소중한 기억을 잃어버리다", "좋은 일을 나열하는 중인데 '잃는다'는 나쁜 일이라 흐름이 깨져요."], ["sell our most valuable memories to hackers", "가장 소중한 기억을 해커에게 팔다", "장점을 나열하는 흐름에 맞지 않아요. 해커 이야기는 뒤에서 위험으로 나와요."]], "ko": "우리는 소셜 미디어 피드처럼 기억을 살펴보고, 인생에서 가장 좋았던 순간을 생생하게 회상하고, 다른 사람들과 기억을 공유하고, 가장 소중한 기억을 백업할 수 있을 것이다."}, {"seg": 3, "si": 2, "ans": "revolutionize the way our brains work", "ako": "우리 뇌가 작동하는 방식에 혁명을 일으키다", "clue": "<b class=\"en\">Finally</b>(마지막으로)로 큰 변화를 마무리해요. 다음 문장이 <b class=\"en\">The role of the brain would shift</b>(뇌의 역할이 바뀐다)여서 뇌의 작동 방식이 '완전히 달라진다'는 말이 와요.", "ds": [["revolutionize the way hospitals work", "병원이 일하는 방식에 혁명을 일으키다", "동사는 같지만 대상이 달라요. 다음 문장이 '뇌의 역할'이 바뀐다는 이야기예요."], ["make the brain work only when connected to the internet", "뇌가 인터넷에 연결되어 있을 때만 작동하게 만들다", "'오직 인터넷에 연결될 때만'은 근거 없는 과장이고, 다음 문장의 '뇌의 역할이 정보 저장에서 데이터 처리로 바뀐다'는 내용과 맞지 않아요."], ["make no difference to the way our brains work", "뇌가 작동하는 방식에 아무 차이도 만들지 않다", "다음 문장에서 뇌의 역할이 바뀐다고 하니 모순이에요."], ["protect the way our brains work from AI", "뇌가 작동하는 방식을 AI로부터 지키다", "AI를 활용해 뇌를 바꾸는 이야기인데 AI에서 '지킨다'면 반대예요."]], "ko": "마지막으로, AI 기반 신경 임플란트는 우리 뇌의 작동 방식에 혁명을 일으킬 것이다."}, {"seg": 3, "si": 3, "ans": "processing the vast amounts of data provided by the implants", "ako": "임플란트가 제공하는 방대한 양의 데이터를 처리하는 것", "clue": "<b class=\"en\">shift from A to B</b>(A에서 B로 바뀐다)에서 A가 <b class=\"en\">learning and storing information</b>(정보를 학습하고 저장하는 것)이에요. B는 A와 달라야 하고, 이어지는 문장이 <b class=\"en\">Instead of simply memorizing</b>(단순히 암기하는 대신)으로 시작해요.", "ds": [["storing the vast amounts of data provided by the implants", "임플란트가 제공하는 방대한 양의 데이터를 저장하는 것", "'저장'은 바뀌기 전(A)의 역할이에요. 'A에서 B로 바뀐다'에서 B가 또 저장이면 안 바뀐 거예요."], ["sending signals to the legs of paralyzed people", "마비 환자의 다리로 신호를 보내는 것", "마비 환자 이야기는 앞 구간의 내용이에요. 뇌의 새로운 역할을 말하는 이 문장과 상관이 없어요."], ["memorizing the vast amounts of data by heart", "방대한 양의 데이터를 외우는 것", "암기는 A(학습·저장)와 같은 일이라 '바뀐다'가 안 돼요."], ["ignoring the vast amounts of data provided by the implants", "임플란트가 제공하는 방대한 양의 데이터를 무시하는 것", "임플란트를 쓰는 이유가 없어져 버려요."]], "ko": "뇌의 역할이 정보를 학습하고 저장하는 것에서 임플란트가 제공하는 방대한 양의 데이터를 처리하는 것으로 바뀌게 될 것이다."}, {"seg": 3, "si": 4, "ans": "generate new ideas", "ako": "새로운 아이디어를 창출하다", "clue": "<b class=\"en\">Instead of simply memorizing</b>(단순히 암기하는 대신)의 뒤이므로 외우는 일이 아니라 머리를 쓰는 일이 와야 해요. <b class=\"en\">use our creativity</b>(창의력을 발휘하고)가 바로 앞에 있어서 '새 아이디어를 만든다'가 이어져요.", "ds": [["interpret every piece of knowledge perfectly", "모든 지식을 완벽하게 해석하다", "'해석하다'는 바로 앞에 이미 나왔고 '모든 것을 완벽하게'는 과장이에요."], ["back up our creativity in the cloud", "우리의 창의력을 클라우드에 백업하다", "백업은 앞 구간의 기억 이야기예요. 창의력은 백업하는 것이 아니라 발휘하는 거예요."], ["memorize every fact by heart", "모든 사실을 외우다", "'암기하는 대신'이라고 했으니 암기가 다시 나오면 모순이에요."], ["copy other people's ideas", "다른 사람들의 아이디어를 베끼다", "'창의력'을 발휘한다는 바로 앞 말과 반대예요."]], "ko": "우리는 단순히 정보를 암기하는 대신 지식을 다운로드하고, 창의력을 발휘하여 그 지식을 해석하고, 새로운 아이디어를 창출할 수 있게 될 것이다."}, {"seg": 4, "si": 0, "ans": "be addressed", "ako": "해결되다", "clue": "<b class=\"en\">Before we can fully embrace</b>(우리가 완전히 받아들이기 전에)라는 조건이 있어요. 받아들이기 전에 <b class=\"en\">tricky ethical issues</b>(까다로운 윤리적 문제들)이 어떻게 되어야 하는지 생각해 보면 '해결되어야' 해요.", "ds": [["be postponed until after we embrace it", "받아들인 뒤로 미뤄지다", "'받아들이기 전에(Before)'가 있어서 '받아들인 뒤로 미루기'는 연결어와 어긋나요."], ["be left to AI to decide alone", "AI가 혼자 결정하도록 맡겨지다", "AI에 대한 지나친 의존은 뒤에서 오히려 문제로 나와요. '해결되어야 할 문제'와 안 맞아요."], ["be ignored", "무시되다", "문제를 무시한 채로는 '완전히 받아들이기' 어려워요."], ["be celebrated", "축하받다", "'까다로운 문제'는 축하할 대상이 아니에요."]], "ko": "우리가 AI 기반 신경 임플란트 시대를 완전히 받아들이기 전에, 여러 가지 까다로운 윤리적 문제들이 해결되어야 한다."}, {"seg": 4, "si": 1, "ans": "what it means to be human", "ako": "인간이라는 존재가 무엇을 의미하는가", "clue": "<b class=\"en\">integration of AI technology with the human brain</b>(AI 기술과 인간의 뇌의 통합)이 일으키는 우려예요. 다음 문장이 <b class=\"en\">identity, existence, and value as human beings</b>(인간으로서의 정체성, 존재, 가치)를 말해서 '인간다움'에 관한 걱정임을 알 수 있어요.", "ds": [["how to protect personal data", "개인 정보를 어떻게 보호할 것인가", "개인 정보는 '또 다른 중요한 문제는 프라이버시'라는 문장에서 따로 나와요. 여기는 첫 번째 문제(정체성)예요."], ["whether AI can become more intelligent than humans", "AI가 인간보다 더 똑똑해질 수 있는가", "그럴듯하지만 본문에 없는 내용이에요. 다음 문장은 인간의 정체성·존재·가치 이야기예요."], ["what it means to be a machine", "기계라는 존재가 무엇을 의미하는가", "걱정거리는 '인간'의 정체성이에요. 기계가 아니에요."], ["how much it costs to be human", "인간이 되는 데 비용이 얼마나 드는가", "다음 문장은 비용이 아니라 정체성·존재 이야기예요."]], "ko": "AI 기술과 인간의 뇌를 통합하는 것은 인간이라는 존재가 무엇을 의미하는가에 대한 우려를 제기한다."}, {"seg": 4, "si": 2, "ans": "central to our identity, existence, and value as human beings", "ako": "인간으로서 우리의 정체성, 존재, 가치의 중심", "clue": "바로 다음 문장이 <b class=\"en\">However</b>(그러나)로 시작해서 기술에 대한 지나친 의존이 문제라고 해요. 그 문제가 심각해지려면 앞 문장에서는 '뇌가 인간의 중요한 중심'이라는 말이 먼저 나와야 해요.", "ds": [["the only part of the body that matters as human beings", "인간으로서 중요한 유일한 신체 부위", "'유일한'은 과장이에요. 정체성·존재·가치의 '중심'이라는 말과 정도가 달라요."], ["less important than technology in defining our identity as human beings", "인간으로서 우리의 정체성을 규정하는 데 기술보다 덜 중요한", "이러면 다음 문장의 '그러나(However)' 이하(기술에 지나치게 의존하면 문제)가 이어지지 않아요."], ["a simple tool for storing information", "정보를 저장하는 단순한 도구", "뇌를 단순 도구로 보면 정체성 혼란이라는 걱정이 생기지 않아요."], ["unrelated to our identity, existence, and value as human beings", "인간으로서 우리의 정체성, 존재, 가치와 무관한", "뇌가 무관하다면 AI와의 통합이 '인간이 무엇인지에 대한 우려'가 될 수 없어요."]], "ko": "우리의 두뇌는 인간으로서의 정체성, 존재, 가치의 중심이라고 여겨진다."}, {"seg": 4, "si": 3, "ans": "delay our natural development", "ako": "우리의 자연스러운 발달을 지연시키다", "clue": "<b class=\"en\">However</b>(그러나)가 있어서 앞 문장의 뇌에 대한 좋은 이야기와 달리 걱정을 말해요. 뒤에 <b class=\"en\">create confusion</b>(혼란을 일으킨다)가 이어지는 걸 보면 나쁜 영향이 와야 해요.", "ds": [["delay the development of AI technology", "AI 기술의 발전을 지연시키다", "'기술에 지나치게 의존'하면 기술의 발전이 늦어진다는 건 논리가 안 맞아요. 늦어지는 건 '우리 자신의' 발달이에요."], ["accelerate our natural development beyond limits", "우리의 자연스러운 발달을 한계 이상으로 가속하다", "'한계 이상으로 가속'은 좋은 결과인데, 뒤의 '혼란을 일으킨다(create confusion)'와 이어지는 부정적인 흐름과 논리가 맞지 않아요."], ["speed up our natural development", "우리의 자연스러운 발달을 가속하다", "뒤의 '혼란을 일으킨다'와 같은 부정적 흐름이 아니에요."], ["support our natural development", "우리의 자연스러운 발달을 돕다", "'지나친 의존(over-reliance)'이 도움이 된다는 말은 모순이에요."]], "ko": "그러나 기술에 대한 지나친 의존은 우리의 자연스러운 발달을 지연시키고 우리가 인간인지, AI인지, 아니면 그 중간인지에 대한 혼란을 야기할 수 있다."}, {"seg": 4, "si": 5, "ans": "access personal data without permission", "ako": "허락 없이 개인 정보에 접근하다", "clue": "<b class=\"en\">There&#x27;s a risk that</b>(~할 위험이 있다)라고 하고 앞 문장이 <b class=\"en\">Another critical issue is privacy</b>(또 다른 중요한 문제는 프라이버시이다)예요. 프라이버시 위험이란 남이 허락 없이 개인 정보를 들여다보는 것이에요.", "ds": [["access personal data only with permission", "허락이 있을 때만 개인 정보에 접근하다", "허락이 있으면 '위험(risk)'이 아니에요. 본문은 허락 '없이'가 핵심이에요."], ["access medical records with permission", "허락을 받고 의료 기록에 접근하다", "허락을 받으면 프라이버시 위험이 아니에요. 또 '개인 정보' 이야기를 의료 기록으로 좁혔어요."], ["protect personal data with permission", "허락을 받고 개인 정보를 보호하다", "'위험'이라고 했는데 보호하는 일은 위험이 아니에요."], ["ask for personal data with permission", "허락을 받고 개인 정보를 요청하다", "허락을 받는다면 프라이버시 위험이 아니에요."]], "ko": "조직이나 해커가 AI와 연결된 임플란트를 통해 허가 없이 개인 정보에 접근할 수 있는 위험이 있다."}, {"seg": 5, "si": 0, "ans": "controlled by hackers", "ako": "해커에 의해 통제되는", "clue": "<b class=\"en\">This means</b>(이는 ~라는 뜻이다)로 앞 문장(해커가 허락 없이 정보에 접근)이 더 나아간 결과를 말해요. 생각·감정·행동까지 해커 손에 들어갈 수 있다는 가장 큰 위험이 와요.", "ds": [["read by doctors", "의사들에게 읽히는", "'이는 ~라는 뜻이다(This means)'는 앞의 위험이 더 나아간 결과를 말해요. 의사가 읽는 것은 위험 이야기가 아니에요."], ["fully controlled by ourselves", "우리 스스로 완전히 통제되는", "위험을 말하는 문장인데 '스스로 통제'는 위험이 아니에요. 해커가 주어예요."], ["protected from hackers", "해커로부터 보호받는", "앞에서 말한 '위험'을 설명하는 문장인데 보호받는다면 위험이 아니에요."], ["ignored by hackers", "해커에게 무시당하는", "무시당하는 것은 위험이 아니에요."]], "ko": "이는 우리의 생각, 감정, 행동이 해커에 의해 통제될 수 있다는 뜻이다."}, {"seg": 5, "si": 1, "ans": "lead to even greater social inequality", "ako": "사회적 불평등을 더욱 심화시키다", "clue": "<b class=\"en\">additional risk</b>(추가적인 위험)이라고 했으니 나쁜 결과가 와야 해요. <b class=\"en\">not available to all due to its high cost</b>(높은 비용 때문에 모두에게 제공되지 않을 수 있다)는 이유가 뒤에 있어서 '불평등이 커진다'가 연결돼요.", "ds": [["lead to even greater privacy problems", "프라이버시 문제를 더욱 키우다", "프라이버시는 앞에서 말한 위험이에요. 이 문장은 '추가적인(additional) 위험'이고 이유가 '높은 비용'이니 불평등이어야 해요."], ["lead to inequality only among the rich", "부자들 사이에서만 불평등을 낳다", "'오직 부자들 사이에서만'은 범위가 어긋나요. 비용 때문에 못 쓰는 사람과 쓰는 사람 사이가 불평등이에요."], ["lead to a more equal society", "더 평등한 사회로 이어지다", "위험을 말하는 문장이고, 비용 때문에 모두 못 쓴다는 이유와 반대예요."], ["reduce the gap between the rich and the poor", "부자와 가난한 사람의 격차를 줄이다", "높은 비용으로 못 쓰는 사람이 생기면 격차가 커져요."]], "ko": "또한 이 기술은 높은 비용으로 인해 모든 사람에게 제공되지 않을 수 있다는 점에서 사회적 불평등을 더욱 심화시킬 수 있다는 추가적인 위험도 있다."}, {"seg": 5, "si": 2, "ans": "those who cannot", "ako": "그럴 수 없는 사람들", "clue": "<b class=\"en\">Such unequal access</b>(이러한 불평등한 접근)이 주어예요. 임플란트 비용을 <b class=\"en\">can afford</b>(감당할 수 있다) 사람과 짝이 되려면 감당하지 '못하는' 사람이 와야 해요.", "ds": [["those who hack them", "그것을 해킹하는 사람들", "해킹은 앞 구간의 위험이에요. 이 문장은 '불평등한 접근'이 주어라서 비용을 감당할 수 있는지가 기준이에요."], ["those who cannot even use a computer", "컴퓨터조차 쓸 줄 모르는 사람들", "'접근'의 불평등이 비용(afford) 때문에 생긴다는 흐름과 달라요. 능력이 아니라 비용 문제예요."], ["those who are afraid of them", "그것을 두려워하는 사람들", "접근하지 못해서 생기는 격차가 주제인데, 두려움은 별개 문제예요."], ["those who sell them", "그것을 파는 사람들", "살 수 있는 사람과 팔 수 있는 사람의 격차가 아니에요."]], "ko": "기술에 대한 이러한 불평등한 접근성은 임플란트 비용을 감당할 수 있는 사람과 그렇지 않은 사람 사이의 분열을 심화시킬 수 있다."}, {"seg": 5, "si": 3, "ans": "overcome these challenges", "ako": "이러한 난제를 극복하다", "clue": "앞에서 많은 윤리적 위험을 이야기했어요. <b class=\"en\">I hope that</b>(나는 ~하기를 바란다)에 이어 그 위험들을 <b class=\"en\">careful consideration</b>(신중한 고찰)으로 이겨 내길 바란다는 말이에요.", "ds": [["avoid these challenges completely", "이러한 난제를 완전히 피하다", "'피한다'는 문제와 맞서지 않는 말이에요. '신중한 고찰을 통해' 극복한다는 흐름과 어긋나고 '완전히'도 과장이에요."], ["put off these challenges until later", "이러한 난제를 나중으로 미루다", "앞에서 '해결되어야 한다'고 했는데 미루자는 말은 연결이 안 돼요."], ["increase these challenges", "이러한 난제를 늘리다", "바란다(hope)는 좋은 결과여야 해서 난제를 늘리는 것은 어긋나요."], ["ignore these challenges", "이러한 난제를 무시하다", "신중히 생각하자는 흐름에서 무시한다는 말은 모순이에요."]], "ko": "나는 신경 윤리에 대한 신중한 고찰을 통해 우리가 이러한 난제를 극복할 수 있기를 바란다."}, {"seg": 5, "si": 5, "ans": "before any kind of brain research is conducted", "ako": "어떤 종류의 뇌 연구를 수행하기 전에", "clue": "<b class=\"en\">prior review process</b>(사전 검토 절차)가 핵심 단서예요. '사전(prior)'이란 미리 한다는 뜻이니 연구를 하기 '전에'가 와야 해요.", "ds": [["while any kind of brain research is conducted", "어떤 종류의 뇌 연구가 수행되는 동안", "'사전 검토(prior review)'는 일이 시작되기 전에 하는 거예요. '하는 동안'은 시점이 어긋나요."], ["only after any kind of brain research succeeds", "어떤 종류의 뇌 연구가 성공한 뒤에만", "'성공한 뒤에만'은 단정이고, '사전'과 모순이에요."], ["after any kind of brain research is finished", "어떤 종류의 뇌 연구가 끝난 뒤에", "'사전 검토'는 끝난 뒤가 아니라 시작 전에 하는 거예요."], ["while the results are being sold", "결과물이 팔리고 있는 동안", "이미 팔리고 있다면 사전 검토가 될 수 없어요."]], "ko": "나는 어떤 종류의 뇌 연구를 수행하기 전에 사전 검토 프로세스를 확립하고 윤리적 측면을 철저히 평가하는 것이 중요하다고 생각한다."}, {"seg": 5, "si": 6, "ans": "in accordance with ethical principles", "ako": "윤리적 원칙에 따라", "clue": "앞 문장에서 윤리적 측면을 미리 철저히 평가하자고 했고, <b class=\"en\">ensure that</b>(~하도록 보장하다)는 그 효과를 말해요. 윤리를 평가하는 목적은 발전이 윤리 원칙을 '따르게' 하는 거예요.", "ds": [["only after ethical problems actually occur", "윤리적 문제가 실제로 일어난 뒤에만", "앞 문장은 '미리' 평가하자는 내용이에요. '문제가 생긴 뒤에만'은 연결이 어긋나요."], ["in accordance with commercial demand", "상업적 수요에 따라", "윤리 평가의 효과는 '윤리 원칙'을 따르게 하는 것이지 시장 수요가 아니에요."], ["in spite of ethical principles", "윤리적 원칙에도 불구하고", "윤리를 평가하는 목적이 '윤리를 무시하는 발전'일 수는 없어요."], ["without any ethical principles", "어떠한 윤리적 원칙도 없이", "윤리적 측면을 평가하자는 앞 문장과 정반대예요."]], "ko": "이는 과학과 기술이 윤리적 원칙에 따라 발전하도록 보장할 것이다."}, {"seg": 6, "si": 1, "ans": "according to their thoughts", "ako": "그들의 생각에 따라", "clue": "<b class=\"en\">Wow, ... sound incredible!</b>(와, ... 정말 놀랍다!)에 이어지는 감탄이에요. 팔을 잃은 사람의 의수가 '생각대로' 움직이는 것이 놀라운 이유예요.", "ds": [["according to their doctors' orders", "의사들의 지시에 따라", "본문의 기술은 환자가 '생각하는 대로' 움직이는 것이에요. 의사의 지시 이야기는 없어요."], ["according to the hackers' commands", "해커들의 명령에 따라", "해커의 통제는 뒤쪽 위험 이야기예요. 여기는 놀라움을 말하는 감탄이에요."], ["without any thoughts at all", "아무 생각 없이도", "'생각으로 움직인다'는 기술의 핵심과 반대예요."], ["regardless of their thoughts", "그들의 생각과 상관없이", "생각과 무관하게 움직이면 앞에서 감탄한 이유가 사라져요."]], "ko": "AI가 장애인을 다시 걸을 수 있게 돕고 생각에 따라 움직이는 의수를 사용하도록 도와줄 수 있다는 것이 믿기지 않는다!"}, {"seg": 6, "si": 2, "ans": "the privacy issues it might cause", "ako": "그것이 일으킬 수 있는 프라이버시 문제", "clue": "<b class=\"en\">amazing, but</b>(대단해 보이지만)에서 <b class=\"en\">but</b>(그러나) 뒤에는 걱정이 와요. 다음 문장이 <b class=\"en\">privacy laws</b>(개인 정보 보호법)이라서 걱정하는 내용은 프라이버시예요.", "ds": [["the privacy issues it might solve", "그것이 해결해 줄 수 있는 프라이버시 문제", "'걱정된다(worried)'는 말과 '해결해 준다'는 서로 안 맞아요. 걱정은 '일으킬 수 있는' 문제예요."], ["the social inequality it might cause", "그것이 일으킬 수 있는 사회적 불평등", "다음 문장이 개인 정보 보호법 이야기라서 걱정의 내용이 프라이버시예요."], ["the ethical review it might require", "그것이 요구할 수 있는 윤리 검토", "검토 절차는 앞 구간에서 '해법'으로 나온 것이라 걱정의 대상이 아니에요."], ["the benefits it might bring", "그것이 가져올 수 있는 장점", "'그러나(but)' 뒤에서 '걱정된다'고 했으니 장점은 안 맞아요."]], "ko": "Yumi Lee: 음, 이 기술은 대단해 보이지만, 나는 이로 인해 발생할 수 있는 프라이버시 문제가 정말 걱정된다."}, {"seg": 6, "si": 3, "ans": "to protect the personal information of individuals", "ako": "개인의 개인 정보를 보호하기 위해", "clue": "앞 문장에서 프라이버시 문제가 걱정이라고 했어요. 그러니 <b class=\"en\">strictly enforce privacy laws</b>(개인 정보 보호법을 엄격하게 시행하다)하는 목적은 정보를 '지키는' 것이에요.", "ds": [["to protect the personal information of companies", "회사의 개인 정보를 보호하기 위해", "'개인 정보 보호법'의 대상은 개인(individuals)이에요. 회사로 바꾸면 앞의 걱정과 안 맞아요."], ["to prevent the spread of neural implants", "신경 임플란트의 확산을 막기 위해", "걱정은 '프라이버시'인데 임플란트 자체를 막자는 것은 지나친 주장이에요."], ["to share the personal information of individuals", "개인의 개인 정보를 공유하기 위해", "프라이버시가 걱정이라면서 보호법으로 공유한다는 건 모순이에요."], ["to sell the personal information of individuals", "개인의 개인 정보를 팔기 위해", "개인 정보 보호법의 목적과 정반대예요."]], "ko": "개인 정보 보호를 위해 개인 정보 보호법을 엄격하게 시행할 필요가 있다고 생각한다."}, {"seg": 6, "si": 5, "ans": "address the concerns", "ako": "그 우려들을 해결하다", "clue": "<b class=\"en\">Thank you all for sharing your thoughts</b>(의견을 공유해 준 모든 분께 감사한다)에 이어 <b class=\"en\">my next post</b>(나의 다음 글)에서 말하겠다는 내용이에요. 앞서 나온 걱정(프라이버시 등)을 '해결하는' 방법을 이야기하겠다는 뜻이에요.", "ds": [["address every concern perfectly", "모든 우려를 완벽하게 해결하다", "'모든 우려를 완벽하게'는 과장이고, '방법을 더 이야기하겠다'는 겸손한 예고와 안 맞아요."], ["thank the readers", "독자들에게 감사하다", "감사는 이미 앞 문장에서 했어요. 다음 글에서 이야기할 것은 '우려의 해결 방법'이에요."], ["ignore the concerns", "우려를 무시하다", "방법을 '더 이야기하겠다'고 했으니 무시하겠다는 말은 모순이에요."], ["multiply the concerns", "우려를 늘리다", "글쓴이가 걱정을 키우려는 것이 아니라 풀어 가려는 거예요."]], "ko": "나의 다음 글에서 이러한 우려를 해결하는 방법에 관해 더 이야기하겠다."}]};

var st={queue:[],cur:null,setDrawn:0,setCorrect:0,last:-1,bag:[]},curView=null;
function load(){try{var j=localStorage.getItem(KEY);if(!j)return false;var o=JSON.parse(j);if(!o||!Array.isArray(o.queue))return false;
 var ok=o.queue.every(function(x){return typeof x==='number'&&x>=0&&x<POOL});if(!ok)return false;
 st.queue=o.queue;st.cur=(typeof o.cur==='number'&&o.cur>=0&&o.cur<POOL)?o.cur:null;st.setDrawn=o.setDrawn|0;st.setCorrect=o.setCorrect|0;st.last=(typeof o.last==='number')?o.last:-1;return true}catch(e){return false}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({queue:st.queue,cur:st.cur,setDrawn:st.setDrawn,setCorrect:st.setCorrect,last:st.last}))}catch(e){}}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function fresh(){var a=[];for(var i=0;i<POOL;i++)a.push(i);return a}
// pure: queue(남은 문제), last(직전 구간) -> 뽑을 queue 위치
function pickPos(queue,last,rnd){
 rnd=rnd||Math.random;var cnt={};queue.forEach(function(id){var s=ITEMS[id].seg;cnt[s]=(cnt[s]||0)+1});
 var segsAvail=Object.keys(cnt).map(Number).filter(function(s){return s!==last});
 if(!segsAvail.length)segsAvail=Object.keys(cnt).map(Number);
 var seg;
 if(rnd()<0.5){var mx=Math.max.apply(null,segsAvail.map(function(s){return cnt[s]}));var top=segsAvail.filter(function(s){return cnt[s]===mx});seg=top[Math.floor(rnd()*top.length)]}
 else{var tot=segsAvail.reduce(function(a,s){return a+cnt[s]},0),r=rnd()*tot;seg=segsAvail[segsAvail.length-1];for(var i=0;i<segsAvail.length;i++){r-=cnt[segsAvail[i]];if(r<0){seg=segsAvail[i];break}}}
 var pos=[];queue.forEach(function(id,k){if(ITEMS[id].seg===seg)pos.push(k)});return pos[Math.floor(rnd()*pos.length)]}
function drawOne(){var k=pickPos(st.queue,st.last);var id=st.queue.splice(k,1)[0];st.last=ITEMS[id].seg;return id}
function nextPos(){if(!st.bag.length)st.bag=shuffle([0,1,2,3,4]);return st.bag.pop()}
var KP='gk-blank-kr',kt=document.getElementById('kt');
function setK(v){document.body.classList.toggle('kon',v);kt.textContent=v?'한글 해석 닫기':'한글 해석 보기';try{localStorage.setItem(KP,v?'1':'0')}catch(e){}}
var _k=false;try{_k=localStorage.getItem(KP)==='1'}catch(e){}
setK(_k);kt.addEventListener('click',function(){setK(!document.body.classList.contains('kon'))});
document.addEventListener('click',function(e){var s=e.target.closest&&e.target.closest('.sent');if(s&&!s.classList.contains('blk'))s.classList.toggle('open')});
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function endp(s){return /[.?!]$/.test(s)?s:s+'.'}
var stage=document.getElementById('stage'),prog=document.getElementById('prog');
function setProg(){var m=POOL-st.queue.length-(st.cur===null?0:0);prog.textContent='이번 판 '+Math.min(st.setDrawn,SET)+' / '+SET+' · 한 바퀴 '+m+' / '+POOL+' 소진 · 정답 '+st.setCorrect+'개'}
function passage(it,filled){var sg=SEGS[it.seg],h='';
 sg.sents.forEach(function(s,i){var t=endp(s),inner,bk=(i===it.si&&!filled);
  if(i===it.si){var p=s.toLowerCase().indexOf(it.ans.toLowerCase());var a=esc(s.slice(0,p)),b=esc(endp(s).slice(p+it.ans.length));
   inner=a+(filled?'<mark>'+esc(s.slice(p,p+it.ans.length))+'</mark>':'<span class="bl">____</span>')+b}
  else inner=esc(t);
  h+='<span class="sent'+(bk?' blk':'')+'">'+inner+'<span class="kr">'+esc(sg.kos[i])+'</span></span>'});return h}
function showQ(id){var it=ITEMS[id],sg=SEGS[it.seg];
 var pos=nextPos(),ds=shuffle(it.ds),opts=[],di=0;
 for(var i=0;i<5;i++){if(i===pos)opts.push({en:it.ans,ko:it.ako,why:'',ok:true});else{var d=ds[di++];opts.push({en:d[0],ko:d[1],why:d[2],ok:false})}}
 var n=Math.min(st.setDrawn,SET);
 var h='<div class="q" id="qc"><div class="qh"><span class="qn">'+n+'</span><span class="tg">빈칸 추론</span><span class="segt">'+esc(sg.title)+'</span></div>'
  +'<div class="psg" id="psg">'+passage(it,false)+'</div><div class="ask">빈칸에 들어갈 말로 가장 알맞은 것은?</div>';
 opts.forEach(function(o,i){h+='<button class="ob" type="button" data-i="'+i+'"><b>'+CIR[i]+'</b> '+esc(o.en)+' <small>('+esc(o.ko)+')</small></button>'});
 h+='<div class="ex" id="ex"></div></div><div id="nxw"></div>';
 stage.innerHTML=h;setProg();
 curView={id:id,opts:opts,pos:pos,done:false};
 var btns=stage.querySelectorAll('.ob');
 Array.prototype.forEach.call(btns,function(b){b.addEventListener('click',function(){answer(+b.getAttribute('data-i'))})})}
function answer(i){if(!curView||curView.done)return;curView.done=true;var it=ITEMS[curView.id],o=curView.opts,ok=o[i].ok;
 if(ok)st.setCorrect++;st.cur=null;save();setProg();
 var q=document.getElementById('qc');q.className='q done';
 var btns=q.querySelectorAll('.ob');o.forEach(function(x,k){if(x.ok)btns[k].classList.add('ok');else if(k===i)btns[k].classList.add('ng')});
 var pg=document.getElementById('psg'),op=Array.prototype.map.call(pg.querySelectorAll('.sent'),function(x){return x.classList.contains('open')});pg.innerHTML=passage(it,true);Array.prototype.forEach.call(pg.querySelectorAll('.sent'),function(x,i){if(op[i])x.classList.add('open')});
 var h='<div class="res '+(ok?'o':'x')+'">'+(ok?'정답이에요.':'아쉬워요. 정답은 '+CIR[curView.pos]+'번이에요.')+'</div>'
  +'<div class="th"><b>본문 엑기스</b><br>'+esc(SEGS[it.seg].theme)+'</div>'
  +'<div class="wd"><b>정답 '+CIR[curView.pos]+'</b><br>'+esc(endp(SEGS[it.seg].sents[it.si])).replace(esc(it.ans),'<mark>'+esc(it.ans)+'</mark>')+'<br><span style="color:var(--sub)">'+esc(it.ko)+'</span></div><ul class="ol2">';
 o.forEach(function(x,k){if(!x.ok)h+='<li>'+CIR[k]+' '+esc(x.ko)+'</li>'});
 h+='</ul>';
 document.getElementById('ex').innerHTML=h;
 var end=st.setDrawn>=SET||st.queue.length===0;
 document.getElementById('nxw').innerHTML='<button class="nx" type="button" id="nx">'+(end?'이번 판 결과 보기':'다음 문제')+'</button>';
 document.getElementById('nx').addEventListener('click',function(){end?summary():next()});
 document.getElementById('ex').scrollIntoView({block:'nearest'})}
function next(){if(st.queue.length===0){summary();return}var id=drawOne();st.setDrawn++;st.cur=id;save();showQ(id);window.scrollTo(0,0)}
function summary(){curView=null;var roundDone=st.queue.length===0;
 var h='<div class="sum"><h3>이번 판 결과</h3><p>'+st.setDrawn+'문제 중 <b>'+st.setCorrect+'개</b>를 맞혔어요.</p>';
 if(roundDone)h+='<p><b>한 바퀴를 모두 풀었어요.</b> 다시 섞어서 시작할 수 있어요.</p><button class="pb" type="button" id="go">다시 섞어서 시작</button>';
 else h+='<p>남은 문제 '+st.queue.length+'개 · 한 바퀴 '+(POOL-st.queue.length)+' / '+POOL+' 소진</p><button class="pb" type="button" id="go">다음 판 시작</button>';
 h+='</div>';stage.innerHTML=h;setProg();
 document.getElementById('go').addEventListener('click',function(){if(roundDone)st.queue=fresh();st.setDrawn=0;st.setCorrect=0;st.cur=null;save();next()});window.scrollTo(0,0)}
function resetAll(){st.queue=fresh();st.cur=null;st.setDrawn=0;st.setCorrect=0;st.last=-1;save();next()}
var rs=document.getElementById('rs'),rt=null;
rs.addEventListener('click',function(){if(rs.getAttribute('data-c')==='1'){clearTimeout(rt);rs.removeAttribute('data-c');rs.textContent='처음부터 다시';resetAll();return}
 rs.setAttribute('data-c','1');rs.textContent='한 번 더 누르면 초기화';rt=setTimeout(function(){rs.removeAttribute('data-c');rs.textContent='처음부터 다시'},3000)});
function init(){var ok=load();if(!ok){st.queue=fresh();st.cur=null;st.setDrawn=0;st.setCorrect=0;st.last=-1}
 if(st.cur!==null){showQ(st.cur);return}
 if(st.setDrawn>=SET||(st.queue.length===0&&st.setDrawn>0)){summary();return}
 if(st.queue.length===0)st.queue=fresh();
 next()}
window.__t={POOL:POOL,ITEMS:ITEMS,pickPos:pickPos,SET:SET,state:st};
init();
})();
</script></body></html>
